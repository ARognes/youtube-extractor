[package]
name = "youtube-extractor"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "=1.0.188", features = ["derive"] }
serde_json = "=1.0.107"
serde_yaml = "=0.9.25"
reqwest = { version = "=0.11.20", default-features = false, features = ["json", "blocking", "rustls-tls"] }
rayon = "=1.8.0"
regex = "=1.9.6"
urlencoding = "=2.1.3"

[[bin]]
name = "search_transcripts"
path = "src/bin/search_transcripts.rs"

[[bin]]
name = "ingest_defranco_curated"
path = "src/bin/ingest_defranco_curated.rs"
