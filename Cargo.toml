[package]
name = "youtube-extractor"
version = "0.1.0"
edition = "2021"
default-run = "youtube-extractor"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
indicatif = { version = "0.17", features = ["rayon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.11", features = ["json", "blocking"] }
rayon = "1.8"
regex = "1.10"
urlencoding = "2.1"
dialoguer = "0.12.0"
colored = "3.1.1"

[[bin]]
name = "search_transcripts"
path = "src/bin/search_transcripts.rs"

[[bin]]
name = "ingest_defranco_curated"
path = "src/bin/ingest_defranco_curated.rs"
