transcript: 'Video games are changing. We''ve got bigger worlds, more detailed visuals, and higher resolutions than ever before. Leon and Lara are looking sharper than ever. Problem is, gaming hardware has had to work harder and harder to make that happen. And at this point, it''s unclear how much farther we can push graphical quality with brute force alone. But while hardware might have hit a wall, software might just open a side door. Enter upscalers. Technologies like DLSS, FSR, XeSS and PSSR. That''s a lot of acronyms. What do they stand for? And how have they changed the way that we think about gaming performance? Upscalers resize lower resolution images to higher res ones. There are many methods of doing this, but in this video we''re going to focus on the tools made by AMD, Intel, and Nvidia. Using them involves intentionally rendering video game frames at a lower resolution and then upscaling them to the target resolution. Why? Well, it''s easier for a GPU to take a low res frame and upscale it than it is to natively render a whole new frame at a higher resolution. So, ultimately, you get more frames for less work. Modern upscalers primarily use three approaches: spatial, temporal, and machine learning, each of which is kind of an evolution of its predecessor. The simplest of the approaches used by the upscalers we''re talking about is spatial upscaling, which uses algorithms to selectively detect edges in an image and make those edges sharper. It can produce a smoother, sharper image than traditional anti-aliasing methods, but it''s important to note that spatial upscaling only analyzes the current frame. That means that scenes with a lot of visual complexity or fast motion can suffer from a loss of detail or blurriness, especially compared to our next upscaling method. Temporal upscaling analyzes both current and previous frames, which can solve some of those issues. >> So, we have motion vectors that describe how a movement goes from a previous frame to the next one. We have a color buffer that is the actual image. We have the previous image. We also have information of depths and so on. >> That''s Nicolas Lopez, a rendering technical architect at Ubisoft Montreal. He explained to us how temporal upscalers combine spatial data from the current frame with temporal data from previous frames, reducing guesswork and producing more consistent, higher resolution images. When motion tracking is inaccurate though, artifacts like ghosting can leave blurry trails behind moving objects. Gross. The third lover in our upscaling polycule is machine learning or neural net upscaling. Instead of relying solely on fixed algorithms, it''s trained on large data sets to recognize patterns, textures, lighting, and edges to help it predict missing detail. The result is image quality that can come close to native resolution while still delivering significant performance gains. The tradeoffs are that ML upscaling can often require specialized hardware and can be harder for developers to implement since the training data sets used by Nvidia, Intel, and AMD are proprietary and not publicly available. >> The vendors train their model is really a well-kept secret. That''s why you can see it''s also a competitive advantage for some of them because the better data set you have, the better neural network you have, and the better results you will produce. That''s when you have a bug, when something doesn''t work, how do you debug it? It''s a black box. >> So, those are the main methods of upscaling, but how are they actually put to use by popular upscalers like DLSS, FSR, and others? And what should you know about our sponsor, Odoo? Wouldn''t it be super cool if you could stop switching between different apps and programs while just trying to manage your business? And wouldn''t it be super, super cool if things like CRM, invoicing, accounting, and more could all be accessed in one easy-to-use platform? I''d bet it''d be SUPER DUPER DOUBLE DELUXE cool if this was available for free on a 15-day trial without needing a credit card. I''m starting to think you should super click on the link in the description to book a demo with an Odoo expert today. >> Probably the most well-known upscaler used in games is Nvidia DLSS, or deep learning super sampling, and it''s generally viewed as the best performing option. However, it requires specialized tensor cores only found on Nvidia RTX GPUs. More recent versions of DLSS have combined upscaling with an optional, but more controversial feature, frame generation, which uses generative AI to increase frame rates by simply jamming additional frames in there. The success of DLSS helped kick off an industry-wide trend, and AMD and Intel soon launched upscalers of their own. AMD FSR, FidelityFX Super Resolution, is AMD''s upscaling technology, and for years its biggest advantage was that it worked across a wide range of graphics cards, rather than being tied to AMD hardware. FSR went from using basic spatial upscaling to temporal, and then got its own version of frame generation, and last year FSR began incorporating machine learning. Accelerated by AMD''s own specialized AI hardware, which they sometimes call matrix cores, and sometimes they just call them AI accelerators. It doesn''t make a lot of sense, but either way, it''s AMD''s answer to Nvidia''s tensor cores. Sadly, FSR 4 marked a shift away from Team Red''s traditionally hardware-agnostic approach, requiring the newest AMD GPUs for its full feature set. Although recently, AMD began rolling out expanded support for FSR 4. It''s a similar story for Intel''s XeSS, Xe Super Sampling, which can also run on pretty much any modern GPU, but still performs the best on Intel Arc GPUs equipped with Intel''s specialized XMX hardware. XeSS has used machine-learning-based upscaling since it first came out, and the newest version, XeSS 3, comes with Intel''s own multi-frame gen feature that only runs on Intel Arc. I guess you either die hardware agnostic or live long enough to see yourself become proprietary. Now, those are the main three upscalers in terms of PC hardware, but they''re far from the only ones. In fact, everyone and their dog seems to have an upscaler these days. There''s Microsoft''s auto super resolution, Qualcomm''s Snapdragon super resolution, Apple''s Metal FX. There''s also Sony''s PSSR, which is basically the PS5 Pro''s own special version of FSR. Meanwhile, open-source tools like OptiScaler and Lossless Scaling are making it possible to swap different upscaling methods into games that may or may not officially support them. So, while video games have gotten bigger and harder to render, machine learning-based upscalers running on specialized hardware has made it easier and easier to do to games what cops on TV have told their computer nerd sidekicks to do since time immemorial. >> Enhance. >> But with ML-based upscalers, we see the qualities converging faster and faster towards something that is actually great, you know. If If you look at the latest versions of DLSS, they''re incredible. DLSS 4.5, FSR 4.1 is also excellent. The new PSSR is incredible. So, and EXSS for me was one of the easiest to work with as well. Yeah, overall, I think the ML is a right solution to this problem. >> And it''s not just the newest GPUs. These technologies are breathing new life into older hardware and enhancing the capabilities of underpowered devices, such as Nintendo''s use of DLSS [music] in the Switch 2. While each technology approaches this problem differently, they all aim to achieve the same goal, delivering better-looking games without sacrificing performance. Sometimes, even by replacing the rendered frame with a Yassified AI-generated one, like with DLSS 5. Hey, why don''t you check out our video about that? Lots to say.'
