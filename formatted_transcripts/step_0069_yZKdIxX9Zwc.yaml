transcript: Hi, what's your name and what do you do for a living? >> My name is Steve Wynn and I used to be a principal engineer and now I make content. >> you leave your job as a principal software engineer? >> I was done with software and so I decided to quit and help up level people online. >> If you could do it all over again, what is one thing that you would change? >> I would have quit earlier because there's no reason to postpone myself. >> Love it. Do you have any tips for junior engineers who want to become principal or grow in their career? >> If you don't mind grinding and giving away work-life balance, grind as hard as you can. If you want to do it with a good work-life balance, you're going to have to do it effectively and efficiently. And if you don't know where you're going to go, figure that out before you try to get there really fast. Love that.
