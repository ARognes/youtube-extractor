transcript: I thought we were not engineers, we didn't deserve to call ourselves engineering anything like that. Then I found this talk by Glenn Vanderburg where what he did was he read a bunch of engineering books [music] and compared them to what we do in software. And he said, "Actually, this looks really similar to what we do in software." And I thought, "That can't be right. I need something more rigorous. I'm going to have to talk to people who did both engineering and software development and see what they say." And they [music] all agreed with him. So, I was wrong. We're engineers.
