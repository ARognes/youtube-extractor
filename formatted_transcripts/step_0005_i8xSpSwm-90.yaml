transcript: You work hard. You code well. So, why do other engineers keep pulling ahead of you? They get trusted with bigger problems. They grow faster. They get promoted while you wait. And here's the frustrating part. They're not smarter than you. I spent nearly 20 years in software engineering and became a principal engineer at Amazon, which put me roughly in the top 1% of engineers at the company. I can tell you the real difference between good engineers and great ones comes down to a handful of copyable habits, not raw talent. In this video, I'll show you five things world-class software engineers do differently and how you can start doing them today. Stick around because there's a sixth one that ties them all together. With how fast this industry is changing, it may be the only one that matters in 5 years. I conducted around 1,000 interviews as an Amazon bar raiser, and now I run a podcast where I sit down with principal and distinguished engineers, the top fraction of a percent in this field. When you spend that many hours with elite engineers, patterns start repeating. The same five behaviors over and over at Amazon, Meta, Microsoft, and Google. Let's start with the shift that separates engineers who get noticed from the ones who stay invisible. Most engineers find out that they stopped growing the same way. A promotion doesn't come. That's a brutal way to learn because by the time a stalled promotion tells you something is wrong, you've already lost at least a year. I interviewed an engineer named Kun Chen. He told me, >> I think people wait until they are not getting promoted to realize, oh, I'm not growing. I think that's a very lagging indicator. The way I could tell I was not growing was by asking myself, what did I do this month that I couldn't do last month? >> That's a great test. I'm going to steal that. It's just a simple question once a month. That's the first thing world-class engineers do. They measure their growth in months, not in years. Now, think about how different that is from how most engineers operate. Some move too slowly, picking up one meaningful skill a year, which is far too slow. Others have the opposite problem. >> [music] >> A new framework drops and they jump on it. A new AI tool launches and they jump on that. They're constantly learning, but it's scattered and shallow and they never really grow. Kuhn's question finds the sweet spot. Once a month, you learn one new capability or skill. And notice the usage of the verb, "What can I do?" That's a much higher bar than "What do I know?" because knowledge expires. A capability you can put to work does not. So, here's your homework. At the start of each month, write one sentence. "By the end of this month, I'll be able to" then finish it with something concrete. It shouldn't be something like learn Kubernetes. That's a topic, not a capability. What will you be able to do? Deploy an application? Diagnose a production issue? Design a system that you couldn't design before? 12 months is 12 chances a year to become a person who can do something they couldn't do before. After a year, you'll have 12 tangible things you can point to that represent your growth. And once you start growing deliberately, the next question is what happens to everyone else around you. Michael Navody went from intern to principal engineer at Meta in 6 years, which is an absurd pace. He did it largely by being what he calls the coding machine. He kept the whole code base in his head and he shipped at a volume that almost nobody else could match. Then he hit a wall. He told me, "There's only so much one person can do themselves. The coding machine is a lone wolf kind of thing." When Meta pushed him towards the next level, the feedback wasn't code more, it was about broadening his influence. So, he organized a company-wide code health summit, pulled a dozen people doing hard migration work into one room, and that's what earned him his path up. Raw individual output has a ceiling, so the only way past it runs through other people. I personally saw the failure mode of this constantly at Amazon. There's that one senior engineer who knows everything. Every design needs their approval. Every question and decision has to get routed through them. That person feels incredibly valuable, but they're also the biggest bottleneck on the team. We had a phrase for it, "Don't install yourself as an oracle." And that's the second thing. World-class engineers are amplifiers, not oracles. You want to be an improver, not an approver, because software is a team sport. Your value isn't only what you can personally solve. It includes what happens to the people around you. And helping people level up is one of the few true win-win-wins at your job. They get better, the company gets a more skilled employee, and you get credit for scaling past your own two hands. But amplifying a team only matters if you're solving the right problem in the first place. Christopher Brown is a distinguished engineer at Nvidia now, but he was a founding engineer on EC2, the cornerstone of what became AWS. He told me a story about the earliest days of S3. The engineers had designed something sophisticated. They wanted to expose that structure to customers. Jeff Bezos, however, pushed back super hard. Christopher remembers it like this, "No, no, no. This is too complicated. It needs to be get object, put object, and it needs to be redundant, and it needs to be fast." The engineers wanted to surface the complexity, but Bezos wanted it hidden, so the customer never had to feel it. Christopher calls what AWS sells packaged engineering, and that phrase is the whole lesson. Number three, world-class engineers put customer outcomes over technical complexity. They absorb the messy internals as their own problem, so the person on the other side of the interface gets something simple. I lived this on Prime Video. We had to do so much work to make sure that the play button just worked. There are about a thousand different ways that you can have an application or playback issue. It was a lot of work digging through logs and telemetry to find issues, and even more work adding resilience to our system so we can get an extra nine to our availability. I wanted to build newer, more interesting things, but the customer doesn't care how intellectually stimulating your architecture is. They care about whether your video plays. We don't write software to prove that we're clever. We engineer solutions to real-world problems. So, the next time you're choosing what to work on, ask, "If I solve this perfectly, what gets better for the customer or user?" I would prioritize things that have clear answers. Now, [music] once you start caring about outcomes, you run into another question. How much engineering is enough? There's a debate that happens on every team. Do we build the quick solution or the right solution? I think that's a false choice because there's no single level of right. Michael Navody, the coding machine from earlier, put it bluntly, "A really good solution to the wrong problem is worse than doing nothing." And a version of the wrong problem I saw constantly at Amazon is the imaginary problem. The scale that you don't have, that you'll never get. I once worked with a team that wanted to spend months extending a product with infinitely extensible schemas, multi-region failover that could scale to many thousands of requests per second worldwide. But, they weren't yet at one request per second. They really just needed to launch in one new region with a couple of new features. When I gave the feedback to the team, I didn't frame it around doing it in a hacky way. Instead, I got the team to be really intentional about which dimension of scaling was required to do enough there. And that's number four. World-class engineers scale for the next order of magnitude, not for infinity. If we're at 1,000 users, what breaks at 10,000? Design for that because every system built for a future that never arrives costs real money and real time. On your next design, ask, "What's the next realistic level of scale, and what specifically breaks when we get there?" But, even world-class engineers get that judgment wrong sometimes. The difference is what they do next. I I interviewed Carlos Arguelles, a senior principal who's worked at Microsoft, Amazon, and Google. Early in his Amazon career, he was a tester, and he made the call to skip load testing on a component before Black Friday. You can guess what happened. On the biggest shopping day of the year, when the traffic hit, the component fell over and took down the database. It was an 8-hour outage. Carlos walked into his director's office expecting to be fired. Instead, his director said, "Well, that's enough of that. How are you going to prevent this from ever happening again?" Carlos spent the next months building generic load testing infrastructure because he realized other teams were skipping load tests for the exact same reasons he had. That tool became TPS Generator, and Amazon and AWS run load tests on it for pretty much every deployment pipeline to this day. That's the fifth thing. World-class engineers treat failure as a tool. They refuse to waste the opportunity to learn from it. Carlos is a senior principal now, and he'll tell you that story is a big reason why. In his words, "A lot of career growth is dependent on the story that you tell." His story was simple. "We skipped the load tests and caused an outage. We built the infrastructure and educated the company to prevent the next one." He carried that stance into interviews he runs now. "I don't care that you failed. I care what you did after the failure." An average person immediately fixes problems and hopes nobody remembers that they caused them. A world-class engineer asks, "What can I change so nobody ever makes this mistake again? What can we learn from this?" So, the next time something breaks on you, don't stop at "How can we fix this as quickly as possible?" Ask, "What can I build so the whole team never learns this the hard way?" Then tell the story. Carlos didn't just survive his worst failure. He turned it into the thing that made his career. Quick word from today's sponsor, Linear. Linear's has a sponsor for almost a year now, and in that time a lot has changed in how teams build software. Coding agents like Cloud Code blew up and they're being used to write more and more code. Writing code got fast but reviewing it didn't. A lot of the speed that you get out of agents just get swallowed back up in [music] review. Now I spent 18 years as an engineer at Amazon, a lot of it reviewing other people's code so I know the feeling. You get a huge pull request with changes in some random order. The context is scattered across other tools and at some point you're either grinding through it or rubber stamping it. What people forget is that code review is how accountability spreads across the team. When you approve a PR, you're putting your name next to it. You own that change now too. That's the part that only a person can do. Deciding whether the change fits the system and solves the problem the customer actually had. So a rubber stamp just puts your name on code that you didn't read. That's what Diffs is for. It's a code review inside of Linear right next to the issue that started the work. It opens up instantly and breaks a giant PR into readable chapters. The why sits next to the code so you can decide whether it solves the problem instead of hunting through tabs to remember what the problem was. Linear used to track the work. Now it reviews it too. Check out Diffs at linear.com/ale. Here's the thread running underneath everything I just told you and it's the reason I saved this one for last. Carlos has completely rebuilt himself three times at Microsoft, Amazon, and at Google and he told me why. Whatever you learn right now, there's a decay to the value of what you've learned. You have to have this mindset of embracing new things and learning from them. Knowledge expires and AI is shortening the shelf life of knowledge faster than ever. So the sixth thing, the one that makes all others possible, world-class engineers master reinvention. Over nearly 20 years, I I the job that I was hired to do disappear out from under me at least six times. The tools changed and the problems changed. Products got shelved and languages fell out of favor. And every time the people who thrived were the ones who could become useful in a new domain they didn't understand. Yet. So the deepest skill isn't any specific tool or language. It's meta learning. How quickly can you adapt and become useful in territory you've never seen? That's why Kun Chen's monthly question matters. That's why Carlos could turn a disaster into infrastructure. That's why Michael could evolve from coding machine to delivering through others. Every one of these engineers treats their current version of themselves as temporary. Because the best don't know everything. They constantly learn how to keep becoming someone new. Notice that none of these six things come down to raw talent. They're behaviors and you are in the end what you do. That's why you should watch this next video. Because doing world-class work is only half the game. The right people also need to see it.
