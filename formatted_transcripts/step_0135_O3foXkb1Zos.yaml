transcript: My radiographer did the x-rays. She said quite frankly the AI can do a lot more than anyone one radiographer can and much faster. It takes a human being about five years of experience. The AI can sort of ingest and do in a week. But so that's not to say it's going to displace them necessarily. It's just going to say that all of these professions feel that their value is going to move up the chain. You know, there was a time when when you had your horse and buggy you kind of know need to know how to feed the horse. You know, you need to know how to change a cart wheel or whatever it is. And now we all drive cars that we have no idea how to repair. >> Right. A lot of us don't have any I don't really have any I know how to change my tire and that's about it. Change my oil. >> That's about it. I don't even own a car anymore, right? Cuz I just Uber everywhere now. So, you know, what you end up doing with the technology changes. But the fundamental utility of the technology doesn't change, which is you know, in that that example transport or but it's medicine or software engineering. It's the creation of software that's robust and scalable, usable, and likable. And the role of the software engineer in that process will change.
