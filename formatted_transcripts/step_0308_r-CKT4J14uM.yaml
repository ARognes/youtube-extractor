transcript: If somebody wants to get involved in conferences, like is it worth it to go to an in-person conference in 2026 when everything's online and there are Discords and there are, you know, subreddits and and like do you think the in-person component of going to a big conference has been a big value unlock? Is it justifiable? >> It's 100% justifiable. I think even more so now, you know, COVID forced a lot of people home and so just this human interaction, learning, communicating with other people is like huge. Cuz having a high density concentration of engineers, like-minded people who are we're not just talking about software, coding, our craft. As things shift in our in our world, you know, with LLMs and just your defense against change becomes your community. Like if you're standing by yourself and you're like, "It's just me. I'm by myself. I'm applying to conferences or doing my resume. I'm trying to survive on my own." It's going to be really hard for you cuz there's a whole group of people that are talking, communicating, and helping each other out.
