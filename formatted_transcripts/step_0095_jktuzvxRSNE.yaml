transcript: This video has been sponsored by Brilliant. This is a large jug of bird repellent. And a while ago, we were able to use it to make an apple that tastes like a grape. Since then though, we've been wondering what else could we make an apple taste like? Because I mean, at least in my opinion, there's no way that the only thing that works is grape flavored bird repellent. I think that we should be able to make an apple that basically tastes like anything where it can be relatively simple like something like blueberry or cinnamon or something
