g a portfolio. You're going to be learning how different technologies work. And you're also, if you follow the video step by step, you're going to be able to look at someone else's code and figure out how it works. Um, which is always not as straightforward as you would like it to be. So, getting a lot of experience early on would just help you just go like a lot further once you get into your job. Yeah, for sure. So, So, one last question before we wrap up. For all the folks out there who are trying to get their first opportunity and trying to get their foot in the door. You've already talked about, you know, your your networking, your ability to visit the Twitter campus. What What do you recommend for folks who maybe don't have the opportunity to go to a company's headquarters or to meet people in person, especially now that we're in the pandemic? How would you recommend trying to get a similar sort of networking going remotely? Especially, you know, we've got a lot of folks joining today from India or from other places around the world. How How do you think they can they can get that similar sort of connection without the ability to be physically there? Uh, so I don't think it needs to be physical. Like, like I said, some of the first like networking opportunities given they weren't for jobs, but uh I feel like it still was like a example of how networking can open doors for you uh were on Twitter. So, like you don't really need the physical aspect. So, uh I actually wrote an article about uh how I started on freeCodeCamp and ended up interning at Twitter. Nice. in this article, I just talked about from A to B pretty much uh a lot of stuff I've said here. And I think at the at the end of the article, I was just like, "Hey, anyone has any questions, email me." You know how people email me? They ask questions. I mean, at this point I'm like full-time at Twitter. So, I mean, it's like I'm like, "Hey, I could be your connection at Twitter." I mean, I'm not saying I could get you a for sure job, but I could introduce you to people. I could help you study. I could help you learn. Yeah. I'm going to talk to you about your journey. And I would say maybe one or two people email me. Um and then only one that I talked to to this day, and she was just like really really like adamant about it. Like, "Hey, like, you know, like I have questions for you." And like I still keep in contact with her to this day, and she uh I forgot the company. She just got a job at a company. But she's like she's on it. Like she's reading these articles. If people say hit them up, she's hitting them up. Uh cuz I mean, like if you if you're hitting people up, I mean, if you get like a 10 10% rate, I mean, you hit up 10 people a day, some one person's going to talk back to you. You know, you don't know who that one person is. Mhm. So, I def- I mean, if anything, the pandemic probably made it easier. You can just sit in your room and probably get connected with the world. Well, it's it's also removed that physical advantage that other people might have had. Like I can't go drop into somebody's office. I have to email them, too, or send them a DM or or whatever. Yes, I mean, it's a different like uh like something that I never thought of which one of my good friends helped me realize is that uh a lot of the social media platforms, they're helpful for getting in contact with people. Um like Instagram, I've never I haven't had Instagram. I I didn't have it for like maybe like five or six years and then one of my friends he was just like you got to get on Instagram you know like there's a lot of tech people and VCs on Twitter I mean on Instagram and it's like you can talk to them and it's just like you know they're there and they're like you know like you can go and interact with them and talk to them and they're very influential people. Uh Yes. I mean you can go on Twitter Instagram Facebook probably not LinkedIn cuz it's just too expected. But there are a lot of 