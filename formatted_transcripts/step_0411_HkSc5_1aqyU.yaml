transcript: How many days will it take a normal human to finish all levels? I mean, that drastically depends on who you are. Um and we we don't have exact play time counts from any of our play testers for various reasons, but I mean, the fastest the the one play tester, we actually have another play tester who's really fast right now, but the one who was like the super absolute fastest, it was like three or four weeks for him or maybe five weeks, but uh I think he took some time off. I don't know that he was grinding the game like every hour of that time. But he was also um you know, so that's not that's not three to four to five weeks solid. Um but he also was one of the fastest people in the world at solving these kind of puzzles, right? Um for So, we had before that some casual play testers who took, you know, um just playing it occasionally, a few days a week, it took them 10, 11, and months, something like that. It's a really big game. It's a big game, but it's hard to make promises because everybody's different. Everybody solves different kinds of things at different speeds. Even if you're fast at certain kind of puzzles, you might not be fast at these other kind of puzzles. Um even from the demo, some people say the Mirror Isles was really hard for them for some reason, and other people are like, "Oh, it was just so easy and natural and my favorite part of the game." So, you can't you can't predict. That's one of the fun things about puzzle games is you know, there's there's all sorts of different things that happen. My my ear phone just went flying as I made a gesture.
