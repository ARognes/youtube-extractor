transcript: "\U0001F4D8 I wrote the book on technical behavioral interviews, nearly 1,000 interviews worth of lessons in one guide. Grab it here: https://geni.us/BehavioralInterview-yt\n\nIf you want to be in the hot-seat for the next video like this, apply here: https://forms.gle/121P4FhVhxkBaPiq5\n\nAfter 19 years at Microsoft, John expected his track record to speak for itself. It didn't. A year into his search for an engineering manager role at Netflix, the interviews keep ending the same way.\n\nSteve Huynh has seen this before — the experience is all there, but the stories aren't showing it. He coaches John live on exactly what's getting in the way.\n\nCHAPTERS:\n00:00 - 19 Years at Microsoft. A Year Without an Offer.\n03:52 - The Turnaround Story: What Needed to Be Fixed\n05:39 - Cut the Microsoft Jargon\n09:25 - Frame the Magnitude First\n10:59 - 200 Hours a Month of Manual Work\n14:24 - The Interviewer Is Grading You, Not the Project\n22:00 - The Question John Is Most Afraid Of\n26:22 - Reframe What a Mistake Means\n29:57 - Delivery Is the Currency of Trust\n33:34 - Radical Ownership\n43:29 - What Netflix Actually Wants to See\n45:59 - Teach the Interviewer Something They Don't Know\n48:35 - When Your Goals Don't Align With the Team You Depend On\n55:30 - The 3 Pillars of Interview Success"
