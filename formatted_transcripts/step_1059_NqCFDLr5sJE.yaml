transcript: One of my favorite browser debugging features is the ability to add breakpoints directly on DOM elements. Just right-click the element and scroll down to break on, and then you can choose subtree modification, so anytime the children of that element change, anytime the attribute of the current element changes, or anytime the current element is removed. For example, if I do subtree modification and I add an item to that list, it'll now break my code directly where that element is in the list. Another really great thing is if we go back to our elements, we can actually click DOM breakpoints and this shows me all the breakpoints for the associated DOM element. Or if I'm in the Sources tab and I scroll down, there's a section all the way down here for breakpoints that shows me all the breakpoints for every DOM element in my entire application. So, we have the ability to check when things are added to an element. We can also go ahead and do something based on when an element is removed. If I just put break on node removal, now when I remove this element, you can see I get the exact line of code where that's removed for that particular thing. I can even do the same thing for whenever I change the class of a particular element. Let's go back and select that new element I just created. And what I want to do is I want to break on specifically the attribute modification. So, now when I try to toggle a class, it'll break me on the exact place where it toggles that class or any other attribute for that element.
