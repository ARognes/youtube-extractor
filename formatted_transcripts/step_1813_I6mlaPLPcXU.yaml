transcript: 'The FBI claims they''ve hacked the  failed Trump assassin''s phone, but how? Also in your hacking news  roundup, AT&T suffers a historic breach, and Apple bans VPN Apps in Russia. But first, the feds have put out a statement: "FBI technical specialists successfully gained  access to Thomas Matthew Crooks’ phone". But how? The hacking methods at the FBI''s disposal totally  depend on which model of phone the assassin had. And thanks to pictures leaked to the press, we  have some clues. The photo is really low res, but it we do some enhancing, it''s clearly  some kind of Android. Looks like we have three cameras on the back, a flash, and  the brand name at the bottom - my moneys on some kind of Samsung, and I could  be totally wrong, but perhaps the A25. Let''s assume the phone was locked with  Fingerprint recognition, could the feds, after they finally got up onto that roof  just touched his finger to the reader to unlock it? There are reported cases of  law enforcement exploiting a corpse''s finder to unlock a phone. But this is  only possible soon after a person dies, because fingerprint scanners rely on the electric  charge running through your body, and once that''s gone, then you''re just out of luck. As for  face recognition, the guy''s face looked a little rearranged from the photos floating around  on X, so I''m not sure that was much of an option. In fact, we know the FBI''s methods were  a little more technical because According to the verge "field agents in Pennsylvania  had tried and failed to break into \[his] phone ... \[so] The device was then sent  to the FBI lab in Quantico, Virginia.". There, it''s been leaked to the media  that the phone was unlocked with tech from Cellebrite. Cellebrite is an Israeli  forensics company which makes these things, a hardware and software package, which simply put  can break into and unlock many modern phones. This all relies on vulnerabilities in iPhones and  Android devices, which Cellebrite keeps secret. Even the capabilities of these tools is totally  unknown. Or well - at least it was until a couple days ago when Cellebrite''s list of supported  device was leaked. So, how this works is the data that can be extracted from an Android phone  depends on whether it''s hot or cold. A cold device has just been rebooted, user data is totally  inaccessible, until you enter your passcode, at which point a decryption key is loaded into  memory and the phone becomes hot, the phone is still considered hot even if it''s locked again,  because that key is still stored in memory. In this state it''s easy to extract data. This column  shows that for the latest Samsung phones the feds can exfiltrate everything, this applies to  pretty much all the newest Android phones, though there are only some devices which  for whatever reason this isn''t possible. However it''s a slightly different story if the  phone is in a cold state, as in it''s only just been rebooted, in this state the phone has  to be brute forced, but this is possible for pretty most of the newest Android phones,  including the phone of the Assassin. We don''t know how the brute forcing works on a technical  level, Cellebrite is known for their secrecy, and even tells the feds in training material  to keep their methods, and I quote "hush hush". So, what did hacking the assassin''s phone  reveal, according to media reports which don''t cite their source, but I mean it''s  all we have to go on, not much apparently. One thing I can reveal... is  today''s sponsor!! ProtonMail. What I love about Proton is that it''s  not just a privacy focused mail service, it''s a privacy focused ecosystem which  makes de googleifying your life, easy. On the privacy end, Proton is protected by  strict Swiss privacy laws, which means there''s no warrantless mass surveillance. What really  stands out though, is Proton Mail''s privacy section on the app store, they don''t collect  any of your personal data. The Gmail App though, is a different story... Google collects over 50  data points on you... we''re talking location, contacts, photos, and a lot more. Google lives  and breathes on monetizing your personal data, Proton doesn''t, so they simply have no  incentive to track the hell out of you. However, what stopped me from switching to  Proton for a good while was I thought I''d be compromising on functionality in some way, surely  privacy comes at some kind of a cost. But no, Proton''s cloud storage and Calendar services  fully integrate into Mail. And switching to Proton Mail is surprisingly easy, their Easy  Switch tool imports your Calendars and contacts from whatever service you already use, but  importantly, it also imports your actual emails, so you don''t have to give up on  that all important email history. But, best of all, Proton Mail has a free tier,  so you can easily try it out. But their Proton Unlimited plan which comes in at just $10  a month, supports multiple email addresses, custom domains, and gives you access to their  whole suite of services including a VPN, 500GB of cloud storage and their password  manager. The value here is simply, unreal, I recommend this plan to everyone, family,  friends, everyone. Big thanks to Proton for sponsoring this video, make sure you go check  them out using the link in the video description. AT&T has just suffered a truly historic breach, a  hacker has stolen a database of the call and SMS records of nearly all of AT&T''s customers, this  even apparently includes smaller MVNO carriers which use AT&T''s network. In total this affects  more than 100 million people - the records in the database span from May 2022 to October 2022, so,  if you were an AT&T customer during that time, or you so much as sent a text message to someone  who was, then chances are you''re in here. In the company''s own words "These records  identify other phone numbers that an AT&T wireless number interacted with during this  time", and "For a subset of the records, one or more cell site ID numbers associated with  the interactions are also included." - these "cell site IDs" correspond to specific  base stations, which could be used to unmask your real location. To be clear, the  database contains AT&T customer phone numbers, and a list of other phone numbers they either  called or texted and just how many times. The content of phone calls and text messages  aren''t included, there''s also no timestamps attached or personal information like your  name or email address. But that doesn''t mean there aren''t major privacy implications here. The  real danger comes when this dataset is combined with other breaches. I refer you to the Facebook  data dump of 2021 which leaked the phone numbers of half a billion people along with a bunch of  their personal data. Using breaches like this, cyber bad guys can uncover exactly who  each person in the AT&T database is, and figure out exactly who they''re talking  to, and then exploit that information in all kinds of nefarious ways, like  in personalised phishing scams. But how could a breach of this scale happen?  Surely a database of such proportions would have the highest level of security and  authentication, right? Wrong. The database was apparently protected by a single  username and password, no multi factor authentication in sight. In fact, this breach is  part of the recent string of breaches affecting Snowflake customers. Snowflake is a cloud  storage platform, hosting the data of many large companies. But when cyber criminals realised  that many of these high profile accounts were protected by nothing more than a simple username  and password combo, that in some cases hadn''t been changed for years, they went to town. Using  infostealer malware to scoop up credentials, before just logging in and exfiltrating  data, the playbook really was that simple. In the case of AT&T, the hacker is allegedly  a member of the infamous group ShinyHunters. They demanded a $1 million dollar ransom  from AT&T, but reportedly settled for just $370 thousand dollars. Wired is reporting that in  return the hacker provided AT&T a video proving that they deleted the data, how a video of  someone right clicking and hitting delete proves anything is beyond me. But anyway, this  breach originally happened in April this year, but the Department of Justice gave  AT&T a couple extensions in terms of their reporting requirements, which is  why we''re only just hearing about it now. AT&T mentioned in their SEC  filing that someone has already been arrested for the hack. There''s not  much concrete information around this, but one ''John Binns'' was recently  arrested in Turkey in connection with a T-Mobile breach from 2021. This same guy  is apparently behind this latest AT&T breach, but fyi, this is all according to anonymous  sources, so take it with a pinch of salt. Apple has removed dozens of VPN apps from  the Russian App store, at the request of the Russian government. This affects 25 Apps  including popular VPNs like NordVPN, Proton, and PIA. Almost overnight, those users were met  with errors that their favourite VPN app is no longer available in their country or region,  which is especially annoying since Russia is one of those countries where having a VPN is  actually kinda useful. App developers received emails from Apple, explaining that their App was  being deleted on the orders of the Roskomnadzor, the Russian government agency in charge  of regulating telecommunications. However, the fact Putin doesn''t like VPNs isn''t  really news, in 2017 Russia passed a bill which effectively banned Proxies, Tor and VPNs - however  they haven''t done a very good job of actually implementing that law. Over the past few years  Russia has been relying on technological methods like ''Deep Packet Inspection'', which detects  and blocks VPN traffic in real time. But that hasn''t worked out very well - because unlike a  country like China which implements restrictions centrally, on a country wide level, Russia just  doesn''t have that level of infrastructure, so they rely on each individual ISP to do the dirty work  for them, which doesn''t quite work as well because different ISPs implement blocks differently  leading to inconsistent enforcement. Which might be one reason why Russia has said screw it  turned to Apple to just ban VPN apps en masse. VPN developers are not very happy with some  blaming Apple for this, ''Red Shield VPN'' said "Apple''s actions, motivated by a desire to retain  revenue from the Russian market, actively support an authoritarian regime." ... "The fact that a  corporation with a capitalization larger than Russia''s GDP helps support authoritarianism  says a lot about the moral principles of that corporation.". But does Apple realistically  have a choice here? I mean companies simply have to obey the laws of the countries they operate  in, whether that''s in the US, Europe or Russia. Well, maybe they do have a choice. Russia recently  ordered Mozilla to ban certain Firefox add-ons they didn''t like, and after initially complying  with the ban, Mozilla went back on that and lifted the ban just a few days later, and for  at least, the Roskomnadzor hasn''t done anything about it. Also, it should be mentioned that Apple  is about to allow sideloading of Apps in the EU, if Apple really cares about censorship maybe they  could voluntarily extend that coverage to Russia. As always thanks for watching, and I''ll  see you in the next video have a good one!'
