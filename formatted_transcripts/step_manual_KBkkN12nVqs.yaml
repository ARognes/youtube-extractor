cess. And I''m not\n[495.599s] saying that it isn''t, but I have to\n[497.68s] wonder like from a almost like a\n[499.44s] randomized controlled trial standpoint\n[501.44s] out of those 3 years of therapy like how\n[503.68s] much of that is really necessary. And\n[505.52s] there are therapists who are far more\n[507.28s] experienced than me, arguably far more\n[509.44s] clinically superior. I don''t know cuz\n[511.039s] I''ve never compared my outcomes to their\n[512.719s] outcomes who will say, \"Yeah, like this\n[514.24s] is the way that it has to be done.\" I''ll\n[515.76s] be the first to admit that maybe this is\n[517.76s] the arrogance of having a little bit of\n[519.519s] information. But when it comes down to\n[521.12s] it, I think that most of us know when\n[524.159s] our patient is the villain. I think most\n[526.0s] of us can tell because there are\n[528.16s] conspicuous things that are absent from\n[530.64s] their stories, right? Oh, this person\n[532.56s] cut me off. Like, this person blocked\n[534.399s] me. This person complains about me. my\n[536.72s] boss doesn''t recognize my credit or\n[539.36s] people at work are ostracizing me. I''m\n[541.839s] being bullied. And then if we tunnel\n[543.6s] down into it, is there something missing\n[545.76s] from that story? So, what I what I\n[547.76s] really look for is like a sense of like\n[549.519s] do things stitched together in a way\n[551.92s] that is that makes sense? And one of the\n[554.24s] the trickiest things is, you know,\n[555.76s] everyone says nowadays that people are\n[557.68s] entitled to their feelings, like you''re\n[559.6s] entitled to feel that way. This is where\n[562.0s] I got to respectfully disagree a little\n[563.92s] bit. I think some of the emotional\n[565.839s] reactions that we have, especially with\n[568.399s] narcissistic patients, are inappropriate\n[571.6s] to the circumstance. Like I know this is\n[573.839s] wild, but this is a a key, you know,\n[576.08s] teaching from Buddhi