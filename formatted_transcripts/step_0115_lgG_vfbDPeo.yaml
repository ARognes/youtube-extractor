transcript: 'This is the Nintendo Game Boy. It came out in 1989, the year I was born, and  it was the first games console I ever owned. This thing started a lifelong obsession  with video games, and with Nintendo. And so I''m thrilled to announce  that my game, Mind Over Magnet, is available on the two latest Nintendo  consoles: the Switch and the Switch 2. Oh yeah, it''s also available on  the PS4, the Xbox One, the PS5, and the Xbox Series, and of course  it''s still available on Steam. But there''s something kind of poignant about this  full loop moment of the game being available on what is, essentially, the great great grandchild  of the console that sparked my love of gaming. So I want to give a thank you  to Alchemy Games in Brazil, who ported the game to all six consoles. They  handled the port, the certification process, the relationship with Nintendo and Sony and  Microsoft. I barely had to lift a finger. So if you want to know how to port a game to  consoles, I''m afraid this is not that video. Instead, I just wanted to mark this moment, be grateful for it, and give thanks  to everyone who helped me get here. That''s all. See you in the next one.'
