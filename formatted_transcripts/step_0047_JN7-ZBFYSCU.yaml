g rate scheduling, weight decay, gradient clipping, and the Adam optimizer. And we learn about each of them as we go along. Now, to run this code, you will need to connect this to some You will need to send this Jupyter notebook to some online cloud resources. So, one option is to run this code using free online resources like Google Colab, and another option is to run this code on your computer locally, which is a little more involved. So, we go up now, and we can click on the run button and select run on Colab. And you will be able to authorize your Google account and send this notebook to your Google Drive so that you can open it up on Google Colab. And now, the same notebook that we were looking at on Jovian is now open on colab.research.google.com. Here, you can select a runtime. So, go to the runtime menu and click on change runtime type. And And the change runtime type menu, select GPU. And then click save. So, make sure that you have a GPU or a graphics processing unit enabled on this runtime because we will be performing a large number of matrix operations as part of our deep learning models, as part of training the models, and as part of making inferences from those models. And graphics processing units or GPUs are specially designed hardware for performing matrix operations at orders of magnitude faster than CPUs. So, if you''re not using a GPU, it might take you much longer to run this code. Now, another thing you can do is click on edit and click on clear all outputs. So, this way none of the code that we see below will have any pre-existing outputs from previous executions, so that we can execute and see the outputs for the first time our cells. With that, we can now get started. So, here we execute the first code cell, and you can do that by clicking the button here, the run button, or you can do that by selecting uh and selecting the cell and pressing shift plus enter. So, the first cell is important because it is going to connect this Colab notebook to the Jovian notebook that you have executed. And you will be able to record versions of this notebook and send it back to Colab. So, please remember to execute that. And if you''re using another platform other than Google Colab, then here are the instructions for you to enable the GPU. On Kaggle and on a Linux or Windows laptop containing a Nvidia GPU, you will be able to use GPUs for training. On Binder and Mac OS, unfortunately, you will not be able to use a GPU. But do follow the instructions here. Even if you do not have a GPU, you can still follow along and execute all the code. And we recommend using Google Colab because a GPU is present and you can always use it. You will also need to install the required libraries, which is PyTorch, NumPy, and Matplotlib. Now, since we are running this notebook on Google Colab, you do not need to install any libraries. All the libraries are already present. But, if you are running this on your own computer on Linux, Windows, or on Binder, then you will need to install the right versions of the libraries. And if you have a GPU, then there is a different installation. And if you have do not have a GPU, then there is a different installation. And finally, for macOS, you do not have a GPU, so there''s just one installation here. In any case, moving along, since on Colab we have all the required libraries installed, so we''re simply going to import all the modules and functions that we are going to use here, which includes modules like OS, torch, torchvision, tar file, and so on. These are modules that we have already used in previous tutorials. So, there''s nothing new or surprising here. And then, we''re also setting a project name, which we will use later on. So, the first thing now, by this point we understand that the first thing to understand about any deep learning problem is the data set. And we are going to use the CIFAR-10 data set. Since this notebook is in some sense an extension to last week''s tutorial on image classification using convolutional neural networks in PyTorch, where we trained a deep convolutional network to classify images from the CIFAR-10 data set with around 75% accuracy. And here are some images from the data set. So, these are 10 classes: airplane, automobile, bird, cat, deer, dog, frog, horse, ship, and truck. And you can see for each for each class there are some sample images given here and these sample images have been taken from photographs of these objects in a variety of different situations. For instance, you can see you have planes on the ground, you have planes in the sky, you have a top view of a plane, you have side views of planes, you have uh very distant photos, you have very close-up photos. Similarly, for automobiles, you have many different types of automobiles. And here for birds, you have many different species of birds. And many different species of cats and that is what makes CIFAR-10 a fairly challenging data set. One thing that we also noticed while training our model the last time when we trained it to about 75% accuracy was something called overfitting, which is that the training loss kept decreasing as we kept training the model for a longer time, but the validation loss stopped decreasing and the validation''s accuracy stopped increasing. So, in fact, the validation loss started increasing after a point and we saw that validation loss and the training loss diverging. And this happened because the model was learning specific examples from the training data because the model, for instance, could learn that if it saw a beak-like structure behind in front of a blue background, then it should classify the image as a bird. And in that way it is learning a specific image rather than learning the general pattern of a beak occurring anywhere within an image. So, that is called overfitting. Overfitting is remembering specific examples from the training data. And today we''re looking at some techniques that are that will help us counter overfitting as well. So, if you want to revise convolutional neural networks or understand overfitting, do check out the previous tutorial. Now, the first thing we need to do is to download the data set. So, to download the data set, we are going to use the download URL function from TorchVision. And here we have a URL where the data set is available in a tar gzip archive. So, we have download URL and we''re we''re calling it with data set URL and we''re going to download it to the present working directory. And then we are going to extract it from the archive. So, here we''re we''re taking the data set that gets downloaded and we''re going to open it up using the tar file module. And then we''re going to extract it to the path dot {slash} data. So, you can see all of this in action here. You can see that the data set was downloaded to this file CIFAR-10.tgz. And then you see here data. So, here the data folder has been created after the extraction and here you have the folder CIFAR-10. And inside the CIFAR-10 you have a test folder and a train folder. The same thing can be seen here. So, data directory points to dot {slash} data {slash} CIFAR-10. And when you run os.listdir, you can see here that you have the test folder and the train folder. And then inside each of these folders, you have 10 class folders. So, you can see here you have frog, airplane, truck, horse, dog, bird, ship, and so on. You have the 10 classes here. And then inside each of these 10 class folders, you have images for that specific class. So, here these are the images that are supposed to be used for testing our model and here are the images that are supposed to be used for training our model. So, this is what the data set looks like. And this is a very common format that is used. This is also called the image folder format where inside the training data folder, we have one folder per class. And then all the images belonging to that class are in that specific folder. And we can now create training and validation data sets using the image folder class from torchvision, which simply takes a path to a directory with this kind of a format class folders format and it creates a PyTorch data set out of it. And then to load the images, we need to provide a transform which converts images into tensors. But in addition to the two tensor transform, we will also apply some other transforms to the images and we''ll see them in just a second. So overall, there are a few important changes that we will make while creating PyTorch data sets for training and validation. Now, the first thing is to use the test set for validation. So instead of setting aside a fraction, something like a 10% of the training data from the training set for validation, we''ll simply use the test set as our validation set. Now, why we doing that? We''ve said that we should divide our data into a training set, validation set, and test set. And this is normally what you should be doing that when you have when you get a data set, typically you will already have a test data set given and then you will have a training set. From the training set, you will extract a validation set and then you will use that validation set to evaluate your model and try different hyper parameters, try different network architectures, and so on. But at the end, once you have picked your best model architecture and once you have picked your best hyper parameters using a fixed validation set, it is always a good idea to retrain the same model on the entire data set. So what you want is when you have picked the best architecture and hyper parameters, just retrain the model with the entire training data set to give it one final boost in performance. So that it has more data to train with. And that''s what we''re going to do here. We''re going to assume that we''ve done a bunch of experiments and pick the right architecture and the right hyper parameters so that we can use the entire training set. And in such cases, when you''re using the entire training set for training, for validation, you can use the test set if you have the labels for the test set available. If you have the targets for the test set available, if you do not have the targets for the test set available, that''s okay. You can just train without a validation set at all. So now, that was one change we made using our test set for validation, using the entire training set for training our model so that it has more data. The second change that we''re going to make is called channel-wise data normalization. And this is when this is a fairly interesting one. Here, what we''re saying is every image in our data set is a three-channel RGB image. And if you look at all the pixel values in the red channel across all the images, you may get a distribution that looks something like this. So, for instance, let''s say since all the pixel values lie between 0 to 1, but the distribution of reds can be different from the distributions of greens. So, let''s say the distributions of reds is somewhere in the range of 0 to 0.5, whereas the distribution of green pixels is somewhere in the range of 0.5 to 1. So, it''s just that the data set has more green than red, and that''s why this is happening. And remember, each pixel is actually made of a red pixel, a green pixel, and a blue pixel, so that all three red, green, and blue pixels have different inten- intensities. And when the three colors combine, that is when we see all the different colors that we see on our screens. Okay? So, what we''re looking at here is the distribution of all the red values and all the green values. Now, since these pixel values are going are going to get multiplied with the weights in our model, and then they are going to be used to compute the loss, and then the loss is going to be used to compute the gradients, and then we will apply gradient descent. It is likely that if a certain pixel if certain channel has pixels that are in a higher range, they may have a higher effect on the loss and hence may have a higher effect on the gradient and hence may have a higher effect on the weights. Even though the overall range of pixels is similar within green and red. So, what data normalization does is we we subtract from each of these pixels, each of the red pixels, we subtract the mean across all the red pixels of all the images, and then we divide by the standard deviation. So, it takes a distribution like this and splits it out into the range of minus one to one. So, the distribution looks a little more like this. And similarly, we subtract from all the green pixels the average or the mean of all the green pixels across all the images, so a single number, and then we divide it by the standard deviation of all the green pixels across all images, and that gives us another distribution like this. So, now we have a fairly balanced distribution around zero to one for both the red pixels and the green pixels. And this way, any specific values, any specific magnitudes of pixels, will not have a unfair or disproportionate effect effect on the loss or the grad- gradients while training. But what we will train for is the is the actual location of each pixel on the spectrum of values, right? So, how far away it is from the mean, that is what matters rather than its actual specific absolute value. So, this technique is called data normalization and it prevents any particular channel from disproportionately affecting the losses and gradients while training simply by having a higher or wider range of values than others. Then the third thing we''re going to do is something called randomized data augmentation. So, what we will do is we will apply randomly chosen transformations while loading images. And this is primarily to counter overfitting. Overfitting happens when your model starts to learn specific training examples. And the way it learns specific training examples is by learning specific pixels within specific training examples. So, what we''re going to do is we will never show the same image the same exact image to the model twice. Rather, each time we will shift the image around a little bit. For instance, here we have an image of a dog. One thing we could do is we could stretch the image horizontal and vertically a little bit. And now, even though this is not the This is the same image, it is slightly different and it still represents a dog. Another thing we could do is to move it a little bit. Just move it up or down. And as you move the image around, your dog is still going to be present in the image. It is just it''s going to be at a slightly different location. Similarly, we can flip We can horizontally flip the image. So, what you could do is you could take the pixels on the left and move them to the right. So, now you would have this conical structure on the left and you''ll have the dog on the on the right. You could also rotate the picture slightly by 10°. So, now you will have a slightly different orientation of the dog. And this may make sense for certain classes, may not make sense for certain classes. You may You can also blur. You can also slightly brighten the image. You can slightly change the brightness or contrast. So, there is a whole host of image transformations that you can do to create new training data from the existing training images simply by making slight changes so that your model sees different images each time. And these images These transformations will be applied randomly and dynamically each time an image is loaded. So, those are the three techniques. Using the test set for validation so that the entire training set can be used for training, the small boost in performance, using channel-wise data normalization so that no particular channel affects our gradients or losses disproportionately. And finally, applying randomized data augmentation so that each time each image is shown to a model in slightly different ways and that prevents overfitting. And here is how we do that. Before we create our PyTorch data sets, we have these stats and then we have training transformations and validation transformations. So, let''s look at these. So, these stats are the is the information for each channel. So, here this number represents the mean for the pixel intensities for red channel across all images across all pixels. So, red has the mean 0.49 and then green has the mean 0.48 and blue has the mean 0.44. Similarly, these are the standard deviations. And what we''re going to do is we''re going to use this for normalizing the data and we''ll see that in just a moment. So, now we have creating our training transformations and this time apart from two tensor, so TT represents torch vision dot transform. So, apart from two tensor, we''re going to use a bunch of other transforms as well. So, when we have multiple transformations, we can combine them using the compose operation the compose transformer. So, we say TT.compose or torch vision dot transforms.compose and then to it we pass a list of transforms that we want to apply in a specific order. So, first an image is loaded up and there are some transforms that are applied to raw images and then there are some transforms that are applied to image tensors. For example, here we''re applying a transformation called random crop. So, we''re telling random crop that we want to crop out an image of size 32 by 32 from the original image. But the original image itself is of size 32 by 32, so there is really nothing to crop there. And that is why we have the second parameter, which is padding. So, it has we provide it a padding of four pixels. So, now if you add a four pixel padding around a 32 pixel by 32 pixel image, it becomes a 40 pixel by 40 pixel image. So, we are first turning it into a 40 pixel by 40 pixel image. And how are we doing this padding? So, there is a padding mode called reflect that we are using here. Now, if you think if you look at this image right here, you can see that there is some padding. We have added some additional pixels around this original image. And these additional pixels are all black. And that is called what is called a zero padding, where all these pixel values are simply zero. But, the padding mode we are using here is called reflect. And in reflect padding, what we do is we simply reflect this region here. We create a mirror image of this region and use the those values to fill these pixels. So, with So, if you had a reflect padding for this particular image, you would see that this you would get a blue color here, and you would get this conical structure here, and you would get this gray color here of the ground reflected like this was a like there was a mirror at this point. So, that is the padding that we''re doing. And after the padding, we are taking a 32 pixel by 32 32 pixel crop. So, in effect, what this ensures is that it is going to shift the image around by up to four pixels each time. Either towards the top or towards the bottom or towards the left or towards the right. So, each time the image gets passed into the model, it is going to be slightly shifted. Then, another transform that we''re applying is a random horizontal flip. So, this is going to apply with a probability of .5 if if you hover over it, you can see here that it has a default probability of .5. So, with a 50% probability, we''re going to flip the image horizontally. So, for instance, the dog on the left is going to now show up on the right when we do a horizontal flip. And similarly, there are many more transformations that you can apply. For instance, here we have the random rotate transformation. And you can check it out. Then we have the random We have the random resized crop transformation. We have the random color jitter transformation. You can uncomment these lines and try them out. Color jitter can change the trans brightness, contrast, and saturation. And all of these are applied randomly. Then, after applying the transformations, we call tt.to_tensor. And to tensor is going to take the transformed images and convert them into PyTorch tensors. And then we call tt.normalize. So, the normalized transform takes the stats. So, it takes the mean and it takes the standard deviations. And for each channel, it subtracts the respective mean and it divides by the respective standard deviation to ensure that each channel now falls into this kind of a distribution. So, that''s our transformations. Now, for the training set, we have all of these transformations and we do all of these random what are called data augmentation transformations because we do not want to show the same image to the model every time so that the model does not overfit so that each time the losses are different slightly so the gradients are different so the weights get affected. Um weights are more generalized. But, the validation data set is used for evaluation. And in fact, on the validation data set, we should not be applying transformations because it is used for reporting the performance of the model. So, if you change the data on which you are reporting the performance, then your performance is no longer comparable. So, to keep the performance evaluation comparable, we will keep the validation data transformations standardized. So, we will not have any random crop or random horizontal flip, but we will be doing the two tensor transform, and we will be doing the normalization transform as well. This is because when you train the model using normalized data, then your model no longer understands the original pixel values. Your model only understands the normalized pixel values, which have been shifted using the mean and standard deviation. Therefore, any new input that is used that is passed into the model should also contain the same normalization. And that is why the normalized transform will also show up in the validation transformations. So, think about this. It is something that you have to think about and arrive at yourself, which is why do we need these random transformations only for the training set, but at the same time, why do we need the normalized transformation both for the training set and the validation set? Okay. So, now that we have these set of transformations ready, we can now create training data set and validation data set. And remember, for the training data set this time we are using the entire training set. We''re not going to split out the validation set. Rather, we are going to use the test set as the validation data set. And we should do that only at the end just to give our model a final boost, and which is what we are going for here. So, now that we have our data sets, we can now create data loaders to retrieve our images in batches, and we will use a relatively large batch size of around 400 this time. So, I started out with a batch size of 500, but it turned out that 500 was probably too large, and it was slowing down the slowing down the computation. So, then I went back to a batch size of 400, and that gave me the optimal epoch time or the shortest epoch time. Now, if you go too large, you may get a out of memory error, and then depending on the GPU that you have on your computer or on the platform that you''re running on, you may not be able to support even 400 a batch size of 400. So, in that case, what you might have to do is decrease the batch size further. Try 256, try 128, try 64. Reduce it to the point where it can fit within memory, and each time you get an out of memory error, you will have to restart the kernel. You will have to run things from the top. So, there you go. Now, we have the batch size of 400. Now, we can create data loaders in PyTorch. So, we have So, we have the training data set, which we''re passing into the data loader function to create a data loader. And we''re going to use a batch size of 400. We''re going to shuffle the data as well. So, each time we''re creating batches, we want the batches to be created in a different order with a different order of images with a different set of images. That''s why we set shuffle to true. This This applies at the beginning of each epoch. And then we have the validation data loader as well, where we do not really need shuffling, and we can also double the batch size here because for the validation data loaders, we''re not going to calculate any gradients, and so we''re not going to use as much of the GPU RAM as we would use for training. And finally, we have num workers equal to three and pin pin memory set to true. This is simply to use the different cores of the CPU to load the images faster. So, now we have data loaders. Now, we can get batches of data. And one good thing to do would be to display some some of these batches of data using the training data loader. So, we''re going to create a function called show batch, which takes a data loader, and it gets a bunch of images from the data loader, and then it displays those images in a batch. Now, one thing we will need to do though is Remember, we have shifted the values of pixels in each channel from the 01 range to -1 to 1 range. And as we try to display these images, we have to undo the normalization. So, this operation is called a denormalization where we are going to take the means and the standard deviations. And now we''re going to simply multiply the standard deviations of each channel and add the means. So, this is exactly the opposite of normalization where we subtract the mean and divide by the standard deviation. So, just for the purpose of displaying the images, we need to denormalize them. And we''re going to denormalize the images and then create a grid out of them. And then we''re going to show them using matplotlib. And that''s our show batch function. So, this might take a second or two. Since it is going to It is attaching and stitching together a whole batch of images. So, here is one batch of images from the training data. You can see here, let''s try to identify some of the transformations that have been applied. Now, if you see carefully here, you will be able to see that there is a slight reflection. You see this portion gets reflected here. So, this is an artifact of reflection padding. So, this means that we had an image of a truck and then we added a four pixel padding around it where we reflected the contents inside onto those uh four outer pixels and then we took a random crop of 32 pixels by 32 pixels, which led to this reflection in this region. And so, this image is getting shifted around each time. Similarly, you can see some reflection padding here. You can see that this is This portion is a reflection of this portion. And this portion is looks like a reflection of this portion. You can see some reflection padding here in this corner. And you can see some reflection padding here and so on. So, there is reflection padding. Horizontal flipping is going to be difficult to detect because most things when horizontally flipped just look normal, do not look any different from how they would look otherwise. It''s just that what was on the left would go on the right. So, it was possible that horizontal flipping was applied to this image and this dog''s head was actually on the right. If we had other transformations like rotation, you would be able to detect them, too. And because we have denormalized the images, so we are not able to see the effect of the normalization. But, if you did not if you did not denormalize the images, you would see slightly different colors, which would not particularly make a lot of sense. And that would be an artifact of the normalization. So, now we have the data in our data loaders and we have looked at a batch of data. And to display the batch of data, we had denormalized it as well. Now, we are going to use a we''re going to define a model and train a model. But, before we do that, to seamlessly use a GPU if one is available on the machine or on the cloud platform that you''re using, we will define a few helper functions. So, we are going to define the get default device helper function and the to device helper function. Get default device can simply check if the a GPU is available for use. So, if torch.cuda.is_available returns true, and if that is the case, it returns the pointer to a device, which is which points to the GPU. So, here we have torch.device cuda. If not, it points to the CPU. So, here we have torch.device CPU. Then, we have the two device function, which takes some data or takes a model and moves it onto the device. Um and that''s all it does, really. So, we''re going to get a default device from get default device, and then we''re going to use to device to move data to that device. And finally, we have this device data loader, and device data loader wraps an existing data loader so that it can move data to a device when a batch is being loaded. So you can see here inside the iter function here we have to device being invoked so that whenever a batch is being loaded or whenever a batch is being requested from the data loader it is going to move that batch to the device that we are passing here. So now let''s use these functions. So we''re going to call get default device and that is going to give us a value of device. And that is going to give us a value of device. So we have device as the type CUDA. If you see type CUDA here that means you are using a GPU. If you see a different type here like CPU that means you''re not able to use a GPU. Now there could be three reasons you see device type CPU. One is that you do not have a GPU attached to the system or to the cloud platform where you''re running this. So if you''re on Colab make sure you have changed the runtime type to include a GPU. If you are on your computer make sure just check if you have a Nvidia graphics card. That is one reason why you may not you may be seeing CPU here. Another reason might be that you do not have the Nvidia CUDA drivers installed. So this happens specific especially on Windows and Linux laptops where you may have the Nvidia GPU but you may not have the CUDA drivers. So just look for the Nvidia CUDA drivers and install them. And then the third reason might be that you may have the wrong version of PyTorch. So you may have the version of PyTorch which is only compatible with CPUs not with GPUs. So then you may want to just check out pytorch.org and follow the installation instructions for a GPU for your particular operating system. And once you do all three things you have a GPU, you have the CUDA drivers and you have the right version of PyTorch. All of this which is automatically take care of taken care of for you on Google Colab, but you have to do it manually on your own computer. Then you will be able to see here device type CUDA. And even if you''re seeing device type CPU, you will still be able to run the code, but it will be a lot slower. We can now wrap our training and validation data loaders using the device data loader function, so that when batches are requested from the training data loader, they are automatically moved to the GPU. So, here we have our training data loader and validation data loader wrapped using device data loader. And now we''re ready to create our model. And we''re going to make one key change to our convolutional neural network model, and that is the addition of what is called the residual block. So, there are these certain blocks, certain special blocks of layers or collections of layers that we''re going to insert into our convolutional model. And what they do is to add the original input back to the output feature map obtained by passing the input through one or more convolutional layers. So, what does that mean? Suppose you have a deep neural network and a bunch a bunch of inputs going through the deep neural network and producing hidden outputs, and somewhere in between you have this feature map that was the output of a previous layer, and then you pass it through a convolutional layer, so you have certain weights or certain kernels within the convolutional layer, then you apply the ReLU activation, and then you pass it through another convolutional layer. So, once again you have certain kernels inside the convolutional layer, and then you get back an output. And then you take the previous the input to the first convolutional layer. So, you can have either one layer or two layers or multiple layers here in this region. But, you simply take the input to the first layer and then add it back at the end to the output of this last layer in the block. So, this is called a residual block, where you have one or more convolutional layers through which you''re passing a feature map or you''re passing some input and then you''re taking the input and adding it back to the output. Now, why do we do that? Well, there is one simple way to understand it intuitively and I will point to some resources where you can learn more about that intuition and that justification. So, the idea is that without a residual block these layers are responsible for transforming the input into the output. Now, remember if you zoom out a little bit, your entire network is responsible for transforming images which are three-dimensional RGB color images 32 by 32 pixel images into class probabilities. So, there are 10 output class probabilities. And to do that, you pass this these images successively through several layers. So, first you pass them through convolutional layers and then you pass them through linear layers and finally you get back 10 outputs. Now, somewhere in between remember if you simply have these convolutional layers without the residual here then your convolutional layers are responsible for converting the input into an output. But, when you pass a residual layer then your convolutional layers are no longer responsible for converting the input into the output. Rather, they simply have to calculate the difference between the input and the output because the final output is the