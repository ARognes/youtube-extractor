ger applied. Similarly with batch normalization, batch normalization has some learnable parameters which is gamma and beta. And we want these parameters to be changed only when the model is being trained, not when the model is being evaluated. So, once again, to turn to move batch normalization into evaluation mode, we call model.eval. And similarly, there are some other layers as well which get affected when we call model.eval. So, it''s always a good idea to call model.eval before we perform any evaluation. And finally, we also wrap it with torch.no_grad. This is simply to tell PyTorch that we do not want to track any gradient computations when we perform the evaluation. So, there will be no gradients calculated and that''s why the validation evaluation will then become faster. Then, we are now ready to define the fit one cycle function. So, now the fit one cycle function takes a number of epochs, takes the maximum learning rate, takes the model, takes the training loader, and takes the validation data loader. It also takes the amount of weight decay, which by default is set to zero, which means no weight decay. It also takes the gradient clipping, which by default is set to none, which means no gradient clipping. And it also takes the optimization function. So, by default, it takes optimization optimizer.SGD or stochastic gradient descent, but you can also use other optimizers like Adam and Adagrad and so on. Then inside fit one cycle, we are invoking torch.cuda.empty_cache and empty_cache is simply going to remove any existing tensors which are not currently being used from the GPU memory. So, whenever you feel that you want to use the entire GPU memory, just make sure to call torch.cuda.empty_cache to remove any stale data. And then finally, we''re also going to track the history. So, we have this list which is going to contain the epoch by epoch results. Now, let us first set up the optimizer. So, we take the optimization function and we pass into it the model