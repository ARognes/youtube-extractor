e start with a low learning rate, and then batch by batch we increase it to a high learning rate for about 30% of the epochs, and then we gradually decrease it to a very low value for the remaining epochs. So, what I mean is something like this. We start out with a low learning rate, and then we slowly increase, batch by batch we increase the learning rate. So, we are starting with 0.001, and we are increasing it to 0.1, and then we then continue to decrease the learning rate. So, at this point the model is jumping around, and it is probably find a good It has found a good region, but now you want to narrow down from that good region into the minimum loss, the parameters which can give you the minimum loss. So, that''s where you start decreasing the learning rate slowly, and as you decrease it, then the model narrows down, and your model''s final performance gets better. And then at the end you train it for some time with a low learning rate, so that it can really narrow down on things. So, what this does, this kind of a structure, is this portion is what is what might be called the exploratory region. So, here what you''re doing is you''re ramping up the learning rate, so you want to train faster. So, this can save you a about like this can slow down your training. Uh this can speed up your training and uh reduce the number of epochs that you need significantly, where you can go from needing 10 epochs to needing maybe only about six to eight epochs. So, that is the value of having this kind of a uh learning rate policy. And then this large last region of training at a very low learning rate can increase the performance of the model. That means it can give you that final reduction in the loss by training at a small learning rate. So, these are strategies that you typically apply iteratively step by step on your own. These are now captured automatically within our learning rate schedule. That''s why it''s called learning rate scheduling, and we will be using the one cycle policy. But, apart from the one cycle policy, there are several other policies for changing the learning rate. There''s something called cosine annealing. There is something called uh a progressive reduction of learning rate. So, there are many different ways in which this can be done, but we will use the one cycle policy, which is very popular because it captures a lot of our intuition about learning rates, and it gives really good results. So, that''s one improvement that we''re going to make. One cycle learning rate policy. The second improvement that we''re going to make is something called weight decay. Now, weight decay is yet another regularization technique. Now, the entire idea about regularization is to make it easier to train your model. And the way we we do the way we make it easier to train our model is by making sure that all the numbers that we are dealing with are in fairly reasonable ranges. For instance, the minus one to one range is a very good place for numbers to operate in. If you have all your weights in that kind of a range, if you have all your gradients in that kind of a range, if you have all your output feature maps in that kind of a range, then your model training is not going to get disproportionately affected by any particular value. All the different weights, all the different sets of values are always going to have a more or less similar very uh more or less similar effect on the losses and on the gradients. And it is the changes that matter more than their absolute magnitudes. So, we have already seen how to normalize the inputs so that none of the input channels has a disproportionate impact. We''ve already seen how to normalize the outputs of intermediate layers by performing batch normalization so that none of the output channels none of the channels of the intermediate outputs have a disproportionate impact. Another thing that can have a big impact is the weights. If one weight gets particularly large, then that weight can contribute heavily to the loss and hence when you calculate the gradients, then that weights gradients can be very high and that weight can cause a lot of chaos in training your model and it can prevent you from being able to reduce the loss reliably. So what we do is we can use a technique called weight decay and in weight decay it''s a very simple technique. All we do in weight decay is we modify the loss function by adding another term. So for instance, you you take whatever loss function you have. Your loss function could be mean squared error or in our case the loss function is cross entropy. So we take the loss that we get from the model and to it we add the sum of squares of all the weights. So we take all the weights within the model. So each layer each layer has a bunch of kernels and inside those kernels you have a bunch of weights and we take the squares of all the weights and then we add them up and we multiply them with this term called the weight decay the weight decay factor. And then that becomes our total loss. Now the benefit of this is now as you try to reduce the loss using gradient descent, you are not only trying to reduce the overall objective loss, for example, the cross entropy or the mean squared error, which is trying to get the outputs closer to the targets, but your model is also incentivized to keep the weights low. If the weights get any of the weights gets really large, the loss gets high and then in the next batch or the next epoch, the gradient descent is going to kick in and it''s going to reduce the weights. So this is a very simple technique that keeps our weights within a manageable range to make sure that our loss is low. Okay? So, that''s weight decay. Very simple, but very effective. Then So, now we''ve talked about our weights being really small. We''ve already covered how the intermediate outputs are really small, how the input data is really small by normalizing. The final thing that can become really large is gradients. 