Finally, let''s take a quick summary of the different techniques that were used in the tutorial. So, we had data normalization. We normalized the image tensors by subtracting the mean and dividing by the standard deviation of the pixels across each channel. Normalizing the data prevents the pixel values from any one channel from disproportionately affecting the losses and gradients. And you can learn more about it here. And do learn more about it. Each of these techniques is something that you should be spending more time on to understand their significance and when to use them. Then, we also used data augmentation where we applied random transformations while loading images from the training data set. Specifically, we pad each images by four pixels and then took a random crop of size 32 by 32 pixels. And then, we also flipped the image horizontally with a 50% probability. And there are several other transforms that you can apply simply by checking torch vision.transforms. Then, we also added residual connections. So, one of the key changes to our CNN model was the addition of the residual block, which adds the original input back to the output feature map obtained by passing the input through one or more convolutional layers. So, this kind of a setup allows the layers to learn simply the residual between the output and the input or the difference between the output and the input instead of learning the entire transformation, which makes the these weights more powerful. And we used the ResNet 9 architecture here. Then, we applied batch normalization after each convolutional layer. We added batch normalization, which normalizes the outputs of the previous layer. This is somewhat similar to data normalization except that it''s applied to the outputs of a layer and the mean and the standard deviation are are learned parameters inside the batch normalization layer. We also learned about learning rate scheduling where instead of using a fixed learning rate, we used a learning rate scheduler which will change the learning rate after every batch of training. And there are many strategies for varying the learning rate during training and we used the one cycle learning rate policy which it starts with a low learning rate, increases it for 30% of the epochs and then decreases it for the remaining 70% and trains at a very small learning rate for a small small duration of time. And finally, we also looked at weight decay and gradient clipping. So, weight decay was used to prevent the weights from becoming too large by adding an additional term to the loss function which was the weight decay factor multiplied by the sum of squares of weights. And then gradient clipping also allowed us to help limit the values of gradients to a small range to prevent undesirable changes in model parameters during due to large gradient values during training. And then we use the Adam optimizer instead of stochastic gradient descent. So, the Adam optimizer uses techniques like momentum and adaptive learning rates to speed up training. And there are many other optimizers for you to choose from and experiment with. Now, as an exercise, you should apply each technique independently and see how each one affects the performance and the training time. And as you try all these different experiments, you will start to cultivate the intuition for picking the right architecture, the right data augmentation, and the right regularization techniques. Now, to practice these techniques, you can start working on the course project. So, let''s open up the course project. You can find it from the course page. So, if you go to the course page, you will find it right here, course project training a deep learning model from scratch. And for the course project, you will pick a data set of your choice and you will apply the concepts that you''ve learned in this course to train deep model deep learning models end-to-end with PyTorch. And you will experiment with different hyper parameters and metrics. So, step-by-step what you have to do is you have to find a data set online. So, you can either download an existing data set from a source like Kaggle or fast.ai just as we have done. Uh Kaggle has a bunch of data sets that you can use. fast.ai has a bunch of data sets. Or you can also create one of your own using web scraping or Google Images. Then you need to understand and describe the modeling objective clearly. So, you need to understand what type of data is it. It doesn''t have to be image data although we''ve spent the last couple of lectures talking about convolutional neural networks, but you can apply this apply neural networks to tabular data as well as you''ve seen in assignment two um for the insurance data. So, you can use feedforward neural networks with tabular data. Uh you do not have to do image classification. You can also do some kind of regression. So, for example, you can do a face boundary detection that is a common uh example where you are predicting not the class of an image, but you''re predicting a bounding box for a face and a bounding box is essentially just four numbers. So, that is something that you can look at. You can also do generative modeling. So, you can if you stick if you stick around for the next lecture, you will learn about generative adversarial networks and you there you will be able to generate images of faces or generate images of objects. So, do try out generative modeling as well. And then you can also clean uh then So, once you describe the modeling objective, once you describe the kind of data, then you can perform any exploratory analysis on the data by plotting graphs, asking questions, and even clean the data as required. So, for this you can use tools like Pandas and Matplotlib and Seaborn to draw some graphs. And then, moving along, you will then do the modeling, which is you will define a model or a network architecture. So, you can use one of the architectures we have used, or you can use 