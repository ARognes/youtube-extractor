transcript: Given where I am now This may or may not come as a surprise to some of you but I was a terrible student both in high school and at university And for a long time I mostly just put it down to being a "gifted" child who grew into an  irresponsible young man with a poor work ethic basically just blaming myself  for the situation that I was in But after spending a long time both  working professionally as a programmer and informally teaching other  less experienced programmers I came to quite a profound realisation Why blame yourself when you can blame someone else? Jokes aside I think it's easier to take a more sympathetic view on your own struggle when  you see other people going through the same thing And so in the same way that I was always  trying to adapt my teaching style to the learning style of the people I was working with I started trying to observe my own learning style And when I started treating my  own learning as a puzzle to solve I noticed something quite interesting When I'm reading an article  on something like wikipedia if the first sentence has a word I don't know a piece of jargon or terminology I click on the link and open it in a new tab Then I'll start reading the article for the linked word You can probably see where this is going but if the same thing happens again in  the first sentence of the linked article I open a third tab and start  reading about that concept Those of you who are familiar  with programming concepts might recognise this approach as a depth first search a kind of naturally recursive approach to learning And while this works very well if you want to  spend a long time developing a comprehensive understanding of a subject it's an amazingly bad way to study if you're trying to prepare for an exam  on lots of different surface level details or complete an assignment that  doesn't expect a lot of depth But of course I don't get stuck this way on  everything that I read or watch I also observed that there were plenty of  cases where I'd be able to read an article the whole way through and get some valuable  information from it on the first attempt And so I started observing the  structural differences between the cases where I'd get stuck down a hole and the cases where I felt like I was learning new things at a comfortable pace And something in particular stuck out to me Every piece of educational  material that I interacted with I could place somewhere along a line from understanding absolutely  nothing on the left hand side to absolutely everything on the right hand side That might seem kind of obvious but the curious thing is I can't learn  anything new from either of this material The left hand one is way too hard  and I can't decipher it at all whereas the right hand one is way too  easy and I already know everything But what about the things that  fall somewhere in the middle? In my personal experience I find that the graph looks a bit like this The amount I'm able to learn creeps  up faster and faster as I start to understand most of the material and actually peaks at the point where I can understand almost everything before dropping back down to zero again In simple terms I seem to learn best when I already understand almost  all of the material being presented My theory for how this works under the hood is  that learning is a dependency resolution problem And what that means in normal human terms is that complex ideas are  built on top of simpler ideas and you will struggle to understand those complex  ideas if you don't learn the simple ones first You might be able to memorize them but you won't really understand them So if I wanted to represent all the  knowledge that I have about math for example, I might arrange things so that each  idea was represented by a circle with an arrow pointing from simpler ideas to more complex ideas that build on top of them At the end of this process I'd end up with a connected web of ideas starting simple in the middle and  becoming more complex towards the edges The reason I represented things this way is that I think in general humans learn best when the ideas  that they're trying to understand are just beyond the very edges of this web With my particular depth-first learning style if I encounter a concept that happens to  be far outside my current web of knowledge the process of opening those tabs on wikipedia is  equivalent to searching backwards from this idea wandering through more and more things that I don't understand until I happen to  hit the edge of my existing knowledge It turns out that not only am I not  alone in having this learning style but it's a well known idea in  psychology and education theory known as the zone of proximal development  - first proposed by "Lev Vygotzky" The way the term is used these days has  drifted a little from the original premise but in a general sense it's the idea that  you learn most effectively when you're attempting things that are just outside  your current level of knowledge or skill which in this visualisation is all the  areas just off the edges of our web like the shallow water on the shores of an island And as soon as I learned about this concept I realised that there were a small  handful of times in my life where I had experienced educational material that  was so perfectly within that zone for me it was borderline euphoric I felt like I was just learning in realtime without getting stuck focused  on small details that I didn't understand And as someone who makes educational videos myself the idea that this effect might be reproducible was very exciting to me But how do you actually make  material that is within this zone? Well through some more observation I started to notice that often educational content starts simple then tends to make these big sudden jumps in difficulty Essentially starting somewhere within my web then making a jump out way past  my zone of proximal development which means if I want to understand this idea I have to stop watching or reading and go find other material to fill in those missing steps between this  concept and my current knowledge So armed with this realization I started making videos with a particular approach where rather than jumping  ahead and just expecting the viewer to fill in the gaps on their own I tried to structure each video so that the content started simple and then only ever progressed in small steps Essentially I was attempting to create  an experience that stayed in the zone of proximal development for as long as possible where the viewer never felt like they needed to pause the video and do the equivalent  of opening a new tab on wikipedia Now don't get me wrong I feel like this has worked reasonably well so far but it turns out putting this idea into  practise is a bit harder than it sounds There are a couple of pretty  tricky problems to solve The first one is that unless  you want to explain the entire universe from first principles in every video you need to decided on some minimum bar of assumed background knowledge in each instance And the lower you set that bar the longer and more drawn out your material gets and the less relevant it gets to the  original intention of the material The second problem is that no two humans  on earth have exactly the same knowledge All of our webs are different shapes and have different edges and gaps As a result as the size of your audience increases you have to compromise more and  more on what you assume to be a "minimum" overlap between students if you're  attempting to teach just beyond the edges I've had comments saying that my material  was too simple and others saying it was too advanced on the same video And that is perfectly reasonable because they're different people after all It's just not actually possible to make static one size fits all material given everyone's  unique combination of background knowledge And so we just have to accept  that this is the way things are and deal with it right? Well I should probably also mention at this point that I'm pathologically stubborn and I have a lot of trouble giving up on things And so my brain basically just refused  to accept these as intractable problems And so after a lot of thought my mind started to wander in a slightly deranged direction I mentioned that of course it's unreasonable to explain the entire universe  from first principles in every video because you'd never have time to  get to the actual new information But maybe it's not so unreasonable to  do that if you're only doing it once What if I produced an educational series  that actually did start at the absolute fundamentals of programming with no  assumed background knowledge at all If I was very careful to never use a piece  of terminology or reference a concept that I hadn't already explained first it might be possible to create an entirely standalone educational experience that didn't require any extra material and for new people was always in  the zone of proximal development If I started from the most foundational concepts  and each lesson carefully extended the web of knowledge just past the edges by the time the series arrived at the more complex ideas instead of having to worry that I was using terms and concepts that were too advanced I could actually guarantee the minimum overlapping knowledge of the audience  because I taught it myself But of course even if that  big crazy idea actually works I still haven't solved the second problem Remember how I mentioned that some people find material too rudimentary and others find it too advanced? Well if we're going from absolute first principles  and explaining each concept carefully in order even someone with no prior knowledge at all  will be able to follow from the very beginning eliminating the too hard case So we're down to one problem left to fix which is how do I keep the material entertaining  and engaging enough that programmers with some experience are still willing to follow  the material from the very beginning? Well without spoiling too much I guess you'll have to come and  find out whether I pulled it off Available from today I'm starting to publish episodes of a brand new programming fundamentals course called "The Simple Joy Of Programming" It doesn't quite explain the  entire universe but it does start from the absolute foundations of  how computers work at the software level and builds up step by step to the  point where you'll have a strong intuitive understanding of how any piece  of modern software operates under the hood You don't need any prior knowledge about  programming at all to follow this course but I think you'll still get a lot  out of it as an experienced programmer especially someone who hasn't had a lot of  exposure to low level programming concepts You can expect to learn about machine code about how programming languages work under the hood all that good stuff As well as access to the course material you'll also get access to a private discord to chat with me and other people following the course suggestions and voting on topics for new videos that I make early access to the general programming videos I publish on youtube and high quality ad free versions of all my  videos available for download The course is available  through Patreon for $8 a month which will allow me to give it the  time and attention I think it deserves I am going to continue to publish  educational youtube videos as well but they'll be available about a  week earlier for course subscribers You can find out more at thesimplejoyofprogramming com or follow the links in the description I also just wanted to take this  opportunity to say thank you really for the amazing support so far It was honestly very unexpected and it means the world to me Please enjoy the course I'll see you there!
