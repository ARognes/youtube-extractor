transcript: Hey guys, so today you and I are going to talk about AI and education. So let's get into it. So the question in question was, "Hi Frederick, in the area of AI when even reputed universities has failed their graduates with giving them a solid foundation and most people are struggling to find employment. What changes would you make in order to address address this? Well, I would say that I would approach the it's honestly it's been the general feedback that I've been giest not everything of course, but it's just a flaw that I've seen and I've experienced myself. And that is the flaw of just basically book learning and not teaching people to problem solve because that is fundamentally the thing that is value building. So what I mean by that is that I work with quite a lot of people who even with AI are not seeing a big benefit to you know they're not increasing their work capacity or their speed or anything like that. And to me that is a little bit like giving a calculator to someone who doesn't really know what to use it for. And that is fundamentally the thing that is lacking. I've always argued that mathematics for example although it's great that you can do math problems and so forth and so forth but if you want to pe people to sort of engage with it and actually know how to apply it correctly then just teaching how you do a thing is I argue less effective than combining how with some type of goal go and do this thing because learning by doing is a big big thing for me and I do the same thing. I can give you examples of how I for example coach my software developers. So I argue that the same approach should be used if possible within the education system with especially with AI where AI is just a tool now. So I've said to I have a few socceres who are at the mid-range but they haven't really worked with DevOps related things before and as company policy we do have the requirement that everybody knows the basics of say terraform or using you know operations tools such as log systems and deployments and all that good stuff right so me as in this case the teacher the coach what I do instead of just sitting down and like talking about Terraform for example or logs or stuff like that is that I give them a task that I will help them complete but their goal is basically to set up a basic deployment with a basic application that we're going to use because in this case it's a my project so instead of me doing it for them and just basically doing everything and having them passively see me working I literally say it is your responsibility to make sure that we get this thing into production or to to be able to deploy and you I suggest to you use AI in order to help yourself along so that you can figure out how to download Terraform, how to create the files and you know so forth and so forth and then ask as many questions as you want and if you need me I will come in and I will give you tips and I will give you support or anything like that and that is going to be our goal together and as soon as they get stuck they get support. I had exactly the same sort of experience when I was working as a software developer or when I was teach studying to become a software developer because at our university we had similar sort of things. usually got some introduction to concepts like sort of what they were and so forth and so forth and then our teachers gave us various tasks that we needed to complete and that is the thing that I argue to people is what's going to help you use AI effectively because AI has a ton of capacity for helping you speed up workflows or so forth and so forth but if you don't know how to effectively use AI then you're not going to see much of a benefit and that comes it's basically the my argue to people where you need to practice. You need to practice how to work with it so that it can help you and come up with better ideas of using AI to do certain things. Like for example, I gave a tip to the other day to a few of my co-workers who were tell they were trying to figure out how to use AI to refactor some code or so on and so forth. I said to them, you seem to have a bit of a trouble. Try this. try to tell the AI to create a, you know, a PowerShell script or like shell script that does the thing for you. Try do that. And all of a sudden then they tried it and the thing that they were doing just magically became a lot more, you know, easier for them because they got sort of an idea of how they could leverage the tool to do something quicker or better or so forth and so forth. And that is the thing that is I argue the future with when it comes to AI because even though everybody has access to it, it comes down to how do you use it? And to me AI is nothing more than another calculator or like another tool in my toolbox of how to solve problems. It's a very powerful tool but again you need to practice with it and you need to understand how to apply it so you can solve problems because that is fundamentally the thing that people care about and that is so that's the thing that I think is so sad where you have kids who or teenagers or so young adults who come out of college or universities and so forth and they have a degree but most of them struggle to solve the problems of the industry and that is the thing that we care about. Nobody cares what your piece of paper says. It's just a pro. It's just proof that you completed some work. But when it's time to actually work, which is the thing hopefully you've been preparing for or the thing that you've been educating yourself to be able to do, because that's the thing, right? Education should be about enabling you to take action or to reach certain goals or whatever, right? It's not just for its own sake. It's something that is the raw materials that you need to produce value in some fashion. And that is the thing that all schools should be doing if you ask me at the very least. Everything from mathematics to whatever like you have to create goals for your students. So that rather than telling them here's a bunch of information that you just need to learn, give them a task, a goal where a prerequisite for be able to solving that or fixing whatever they have is to probably know math, probably know chemistry or it doesn't matter what it is, right? You have to under because that's the thing, right? If you're teaching people things, I argue at the very least that doesn't actually turn convert into something that they can practically use, then I will argue like maybe we should focus on those sorts of things because it's usually being able to do practical things and solving problems that will give them value in the marketplace. Knowing things is always great. You know, being academics or so forth and so but fundamentally most people who are looking for employment will have to know how to think for themselves, use their own thinking like because they can't be spoonfed every little thing and of course problem solve their like sort of figure out their own problems. AI is a great tool for being able to do that. But you need to practice with this. So you learn how to talk to it in such a way that it understands the goal that you are trying to achieve. And in many cases it might be the case that it needs some help to figure out the best way forward. And that is where you come in. I see a lot of software developers who use AI to some level or another to get something done. But the people who are really really great with it, there's a gigantic difference of how much they can get done because they understand that in order for the AI to be to give you all these sorts of benefits, you can you sort of have to help it and explain to it that there are certain ways that you can do a thing and then there are better ways and sometimes the AI knows better than you. But my little tip there with using, you know, using programming, basically creating a program for the thing you want to do rather than having the AI do it manually, that's something that you people come up with not because they're taught that AI can do all these things. It's because they've been trying out stuff and figured out that in my situation that it takes a really really long time for the AI to manually update a hundred, you know, bus dunks and dozens of files. And because I'm a programmer, I my first thought is could I probably speed that up with an automated script or something? Yeah, but I can save even more time if I ask the AI to do it. That is the thing I'm talking about problem solving. So what I want you to take away from this is that if you ask me in the area of AI, you still have relevant education because the fundamental thing that I argue most people don't really really understand is that although AI is capable of doing a lot of stuff usually you need a human who has some domain knowledge like for us programmers for example if you take a random person and put them in front of an AI in theory they can build Facebook or Google or like whatever Right? But in practice, it's going to take them a really, really, really long time. But if you have a trained software developer like myself or my co-workers and my peers and so forth and so forth, we will be able to do it faster because we know how to talk to the AI. We know how to solve the problems that we are dealing with and we need can help with guided. It can speed up our work quite a lot. But we have to practice with it and understand how to solve the problems that we are trying to solve in order to guide it in towards what we need to be done. Because if you just tell the AI build a system, it will probably not do it all that well on its own. At least not now. And that's the thing that I argue that our schools have never like never really truly adopted. I mean, it wasn't even there when I was growing up. some courses for sure. But when you I argue we should move from a model where most of it is just book learning where you're literally just consuming information for the sake of writing a test. And the test is I mean the as I said you're not teaching people to solve problems. You're teaching them how to read and store information. But the application of the knowledge they have acquired should be the goal at least if you ask me. Have a great day.
