transcript: But until you've actually been there, and worked in like a hostile environment, I think people under appreciate the toll it takes. And and people don't count up the cost. The cost is not I don't like it there, I find another place. The cost is that it's your health, it's your relationships, it's your marriage, it's how you interact with the world. You're angry, you're you're upset because the world's not good, you're taking it on your dog, you're taking it on your wife, your husband, you know, you get colon cancer. Like Like I was watching an interview from the one guy who was who was a director at Netflix. He was in an interview um in a podcast, and he's saying he was working all the time and working really hard and and then he he had some health scare where it was like, "You have cancer now." And it's like, how much you were working contribute to that result, you know? Some of this is like self-work, like I think we have to set boundaries for ourselves, and it's not always the company's fault about how hard we work or what we do or how we feel. Like we have to we have to have some control over that. But
