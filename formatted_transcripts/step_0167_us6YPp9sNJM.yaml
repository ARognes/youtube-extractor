transcript: Do you remember playing red light green light as a kid? Okay, maybe not that version. The way it works is one person, the judge, calls out either green light, which means you can move, or red light, which means you [music] have to stop. If you're caught moving during the red light, you're out. And the first person to tag the judge wins. My kids really enjoy this game, but there's one problem. It's kind of subjective what counts as too much motion with a human judge. [music] Clearly, it would be more fair to use a camera. There's got to be a kids toy for this out there, right? But I was surprised to see nothing close to it at all. So, I'm making it myself. And to truly test it, I'm going to invite fellow YouTubers for a competition to the death. I mean, for a prize. Here's the idea. I'll need a camera for the detection, some lights, and a speaker so you know when the color changes, and a button to start the game or change the mode. To know when you win, I thought it would be fun to make it more like a heist theme where you have to steal a gem, and when it's removed, that'll trigger the victory. All of this can be controlled by a Raspberry Pi. [music] To simplify the design, I replaced the three separate lights with just a ring of RGB LEDs because it's less components and it allows me to display more than three colors. I was also trying to figure out how I would detect the gem being stolen. Maybe it sits on a button or a load cell, but I found a much simpler solution by just using a read switch. These are tiny little switches triggered by a nearby magnet. I can have a little tilting platform with a magnet and a counterwe on the other end. So when you remove the gem, it tilts away from the magnet, breaking the circuit. [music] Here's the design I came up with. I intentionally designed it so it could be printed and assembled in just a few pieces [music] with no supports. There's a lot of components I'm going to have to cram in here, [music] so it's going to be a tight fit. The first thing I wanted to do was make the LED ring. [music] Instead of printing a PCB, I really wanted to try free form soldering. It's a technique using rigid wires as the supports, and it looks so satisfying. I love the aesthetics. [music] Unfortunately, my plan of connecting all the LEDs in parallel was apparently very wrong. I guess small differences in the LEDs cause them to burn out. Instead, each LED needs its own current limiting resistor, [music] and I have to do that for red, green, and blue. So, it took way longer than I was expecting. [music] I made a big assembly line and eventually I had them all done. Now I just have to solder them all together in parallel. [music] It wasn't quite as satisfying as I was hoping, but I think it still [music] looks pretty cool. Next, I added the camera, the speaker, and glued in the tilting arm and the read switch. And [music] that completes the front cover. Before I put more of it together, I made sure to test everything and start programming while I can still access the screen and all the ports. But after I set up SSH, I was able to do everything over Wi-Fi, and I felt confident enough [music] to start closing it up. So, on to the case. Then, I added a fan for cooling, the start button, the Raspberry Pi, audio amplifier, a breadboard for the LED driver, and connected everything together. It just barely fit, but I guess that was by design. As for the software, it's pretty simple. I capture a video from the camera and take the absolute difference between each consecutive frame, giving me this motion map. Then I threshold so I only look at pixels with more than a minimum amount of motion and take the sum for the total amount of motion in the frame. One problem with this is that when you're close to the camera, [music] the same amount of motion triggers way more pixels than when you're far away. The way I fixed this was to just make the motion limit dynamic where it starts very sensitive but allows more and more motion over time as you get closer. I also added a two-player competitive mode. I just split the camera image down the middle and whichever side goes past the motion limit gets eliminated. Now it's time for some real competition. So I invited some YouTuber friends over to compete for a mystery prize. Wa. Okay. Wait, >> it reminds me of um it like a juke box. Like the shape look is like from the 1950s juke box. >> Oh, this is 3D printed. I can tell. Dang. >> Wait, there's like a lever. It's like so miniature. I'm sure what happens. What? [music] Something goes on here. I bet like a a marble or something. This is crazy. All of Squid Game fits in here. It's like >> Yeah. So, this is a like a heist. >> So, there's a diamond you have to steal. So >> the diamond goes on here and when you grab the diamond it lifts up and it knows that you can take it. >> Okay. I see. I see. >> In the first bracket we've got Polymars and Sanding Emily. And in the second bracket we've got the H twins Carrie KH and BFDI creator Michael Hang. Why do you think you're going to win? I think Emily is going to just go way too fast and I'm going to be slow and steady like the tortoise and the hair that you may have heard of. >> Why do you think you're going to win? >> I beat Jacob in everything in life. So, what's another win? >> I didn't know this was personal. Okay. >> Ready, set, go. How did you survive that? >> Okay. >> Okay. Good job. >> And with that, Emily advances to the semifinals. >> Well, I think Michael's going to win cuz I'm a very supportive brother and I feel like we [laughter] have to support our brothers. I have to agree with Carrie because I support his opinion and I also think that this house is a work of masterful game design because that Matt now that I've seen it slip, I know that it is there to prevent the advantage of running. It's there to >> intentional obstacle. You know, it's sort of like in Mario Kart when there's like a mud a mud puddle. It's like it's there to 