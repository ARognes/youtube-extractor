transcript: So, I'm an interviewer. I've been a software developer for decades. I can't help but try to solve a problem that's posed to me or that I hear. It's a perfect time during your introduction to be like, I delivered a solution or we I think it's okay to say we if it's a big big initiative where it's obvious that it took a lot of people. If you can identify the sub problem that you personally contributed to, if you give the problem but say, "Hey, I solved this problem." instead of saying how you solved the problem and I can't immediately come up with the solution, then automatically I'm thinking this guy's a pretty clever dude. I can't even come up with like a high-level solution for this sort of stuff.
