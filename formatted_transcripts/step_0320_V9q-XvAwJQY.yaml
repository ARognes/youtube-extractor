transcript: Why learn machine learning like you did when for most developers like using an LM is just making a series of API calls? You know, if you want to use these tools, you can just use them by, you know, playing with the models, chatting with them all day, and you will get a lot of value from that. But then you will hit potentially a wall and you'll be like, "Well, I want it to do this." And like when that moment happens for you, you have to dig deeper. Like you have you have to understand why is the model producing this output instead of some other output? And it like it's difficult if you don't have a foundation to either even know how to like debug or think about the problem in such a way that you can solve
