transcript: If I could just give you the most important piece of information I've learned in my 22 years of doing research and development as a small startup, so basically self-employed for 22 years, the most important thing is research and development. So, if you want to get into manufacturing, you're wondering, "Where do I find customers?" It all starts with research and development. You have to solve that very first problem, okay? Something that's never been solved before, you solve it. And when you solve a problem, you usually create a bill of materials, and that lists all the little component parts that solve the problem. Some of those are off-the-shelf parts, you might find them at McMaster-Carr, then you might source them from China, whatever. But there are parts that have never been made before. You invent those parts, and if you're using machinery like this, so that you learn design for manufacturability, you may have some unique parts that nobody else can make. If nobody else can truly make that part, then it's not really manufacturable, is it? So, you don't want to go too far with that, but you can certainly have parts that you make to get the job done and get to a prototype or get to your first 100 pieces that would be redesigned when you get to 100,000 pieces. So, that's the difference between maybe building in the United States in a small shop like mine, and then it offshoring going to China. I know some of you will come at me and say, "Jason, that's unethical. You're going to design something that's not immediately manufacturable at 100,000 pieces." Well, you're missing something here, because it takes engineering time and effort. So, if we're billing out at $150 an hour, and if I can spend 1 hour on a part that I can make here that's a little bit not manufacturable at 100,000 pieces, but I can make it all day long at 1,000 pieces, then that's a good part for that customer. The flip side might be to get to 100,000 pieces where you're on a really high volume stamping press, you're using like a multi-axis Swiss machine. That might be like 15 more hours of engineering and design work and validation. Everything I've just described is research and development, it's engineering, and it's iteration above all. When you iterate, you take a first pass at something, and then you work out the kinks, then you take another pass at it, and eventually it becomes optimized for whatever the end use is. There's certain things, like let's say test fixtures, where the end use is you're making one of them, or you're making two of them. That's a completely different design mentality than if you're making 100,000 pieces. You find the customer, you solve their problem, you make a prototype, then you make 10 of the thing, and then you make parts that are on that bill of materials. And some of those parts, they'll just stick with you for the life of that product. If you only make 10 prototypes of something, you're getting paid to manufacture components the whole way to those 10 pieces. You're getting paid to design the whole way to those 10 pieces. And then you change the design, and there's new problems for you solve. And eventually some products make it the whole way to the mass market. I get it that not everybody understands this angle, because there's not too many people doing what I'm doing who've cobbled together this massive engineering paradise. But I've done it. I'm not trying to sell you a course. I'm just giving you advice. I have children in this country, and I want it to live on. Age of artificial intelligence is going to reward creativity. It's not going to reward being um a knowledge gatekeeper, or any of this old school stuff where you're trying to hide information. Future belongs to creatives, curious people, research and development. Thank you for watching. Adios.
