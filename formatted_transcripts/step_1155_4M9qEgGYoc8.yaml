transcript: John is a gifted child, but because he is not sufficiently stimulated, his achievement is mediocre and unfulfilling. Frequently, he is rejected by his classmates because they resent his superior ability. Barbara too is gifted, but her parents push her to such an extent toward intellectual activity that her social and emotional experiences are completely inadequate. These are gifted children, children with superior ability. But because they're not adequately understood by those around them, they face difficult and frustrating problems which may lead to maladjustment and extremely negative relationships in life. But this need not be and the gifted child should be able to find understanding and help necessary to allow his superior abilities to be directed toward meaningful and satisfying outlets. The exceptional child, a child with differences. It is our hope that through these programs we might better understand this child and help him. The terms genius, brilliant, superior, and a host of others are applied to characterize the gifted child all imply outstanding ability, especially concerning intellectual capacity. But intellectual ability is not sufficient to assist the child in the achievement of a full and happy life. Social development, emotional maturity, and physical health are vitally important to the growth of all children. When any necessary aspect of human life is unfulfilled, the result is often unhappiness and frustration, leading to an unsatisfactory adjustment to the world in which the human life must function. I'm Ed Jones, your host on these programs, and today we're going to meet some of these special and dynamic problems that confront the gifted child in the hope that through our understanding and more positive attitude, we might more effectively help this child in his efforts to achieve a constructive and rewarding relationship in the world. Too many of us have preconceived and faulty concepts of just what the gifted child is like. We often think of him as being a bookworm, reading and studying and doing nothing else. Some of us categorize the gifted child as a weakling, incapable of practical and widespread activities. Others of us tend to regard the gifted child as emotionally unstable, a genius but a misfit who will never be able to function outside of his own special talents. Too few of us recognize the errors in these prejudiced and extremely negative views. If the gifted child is merely one-sided or emotionally unstable, it is not because he is gifted, but because parents, teachers, and society as a whole do not adequately understand him and cannot give him the necessary guidance and stimulus to become a fully participating member of the community. Perhaps we think because he is gifted he can be left to his own methods for achieving a satisfactory relationship in life. And we can concentrate on those who are not so gifted. But the gifted child needs the same things as any other child. Love, security, recognition and guidance. And these are obtained only through help and understanding. Here with us today to help us understand with greater meaning and insight the problems of the gifted child, we have with us Dr. Lewis A. Flegler, assistant professor of special education and head of the program for gifted children at Syracuse University. >> Gifted children may be found in low, middle, or upper socioeconomic level homes. They are generally above average in intellectual, emotional, social, and physical growth. Intellectually, the gifted child possesses a rich vocabulary which exceeds his chronological age group. He can abstract at high levels with unusual ability to draw inferences from known facts. Frequently overlooked is his faster rate of learning potential to absorb new information. He shows originality and creativity in thinking. The gifted child is extremely interested and curious about his environment. His interests are more varied and permanent than the intellectually normal child. These interests may range from the study of atoms to the composition of symphonies. He often likes to work independently by planning and organizing his own activities. Emotionally, the gifted child usually exhibits superior mental health and maturity in his adjustment to life. Physically, he's often taller and heavier than his normal peers. He learns how to walk and talk early and shows excellent all-around motor coordination. It is important to remember that the gifted child as an individual does not equally excel in all areas of development. Since the gifted youngster is superior in most growth patterns, he can develop into a welladjusted individual. The home and school are important influences in creating positive attitudes. However, when the needs of the gifted child are overlooked at home or at school, underachievement and maladjustment can result. John is a gifted child in a regular classroom. He experiences many problems in his school day. Although he's with his own age group, he is not being intellectually challenged. In this reading lesson, he feels underststimulated and bored because the story is below his reading ability. Even though the reading material is uninteresting, he generally grasps concepts sooner and draws conclusions faster than the other children in the class. The children resent Jon's superior ability because he tries to monopolize the teacher's attention. The teacher sees his efforts to be recognized as a threat to the group's intellectual stimulation and avoids him, but he's persistent. She refuses to recognize Jon until the other children are ready and then rejects him by calling on another child. John's feelings of isolation and negativism are intensified. This reaction is not unusual where the gifted youngster's needs are not met. There are a number of occasions where John and his classmates have an opportunity to become friends. He tries to become an integrated member of the group and often the other children will attempt to create an atmosphere of friendliness. But the psychological gap between John and the group is insurmountable. Rather than admit that he's afraid of further rejection, John may demonstrate a displeasure for the activities in which the group participate. In retreat, it's only natural that Jon should resort to the activities where he can succeed, the intellectual area. Withdrawal may seem more comfortable at the moment, but is rather dangerous because Jon is beginning to substitute books for the friendship of other boys and girls. The seeds of maladjustment have been planted because this gifted child's needs have not been brought into wholesome perspective. The interreationship of home and school are linked together in the life of a youngster. Negative feelings engendered in the school may have originated in the home where the inferior feelings of the child are intensified. Of course, the opposite situation is also true. This is where negativism originated in the school further stimulates negativism in the home. For the youngster, this is a vicious cycle which produces more frustration heaped upon failure. The gifted child finds no comfort or understanding with either parent or teacher. Very often, a dominating parent is a serious obstacle to a gifted child's well-being. This parent seeks to gain status from the gifted child's accomplishments and insists upon dictating every thought and decision. This kind of parent constantly pressures the youngster to excel in school. Barbara is an only child and is gifted. Her reading interests are two years beyond what is considered normal for her age, and she grasps ideas and meaning with unusual success. Her parents are proud of Barbara's giftedness and push her continually. >> Hello, mother. I found these new books at the library and thought you'd like to read them. >> Thank you. I'll get it. No, Barbara, that won't be necessary. You just continue with what you're doing. I'll get it. Some already changed. Long black road. Talking to myself in the cold quarter went down the hole. Some already change. Got to keep going. Chance came and left. I waited for the next one. Waited for the next one. I'm the one who moves things around. Always on the outside. I say stuff that ain't true. I should shut my mouth. I should shut my mouth. When I do, I'll tell you. I'll tell you something already change. Lying out in the open. Can't get my head right, but I still got to keep going. Sun already changed. Looking over the weeds. Time just go. Still chasing the next thing. Chasing the next thing. I'm the one who puts it all. I'll do it later, but I still got to keep my sh my mouth. Shut my mouth. Shut my mouth. I'm the one who moves things around. >> Somewhere around the age of seven or eight, a certain kind of child is handed a word. >> It comes after a test >> or an hour in a small room with a friendly stranger and a set of wooden blocks. I should shut my mouth. When I do, I'll tell you. >> The word is gifted. The child has no technical understanding of it and will not acquire one for years. What they register is the change in temperature around them. A new kind of attention that is warm and slightly formal and a sentence repeated on the phone to a grandparent in a tone they file away permanently. The adults are reporting what they saw. They are pleased and the pleasure is real. That is what makes the arrangement so hard to see from inside it and so hard to take apart later. At first the word functions as pure recognition. It says we have seen you and what we saw is good. For some children it arrives as relief especially those who have already sensed that they are out of step with the room and that their questions land wrong. The word explains them. It names the mismatch and makes it flattering rather than shameful. Over a period no one could mark on a calendar, the terms shift. The praise stops being about the paper on the desk. Adults begin speaking about the child in a tense that does not exist yet. They will do something with that mind. The child is still in the room, 8 years old, listening while the conversation has moved on to someone who does not exist and cannot be consulted. Something has been extended to them and something has been asked and the asking is buried so deep inside the giving that neither the adults nor the child could separate them if they tried. This is the thing that will need decades to undo. The child is loved in the present sincerely but the love is pointed at a future person. They are held partly as themselves and partly as a promisory note. The sentence that expresses this most completely arrives later around the age when homework stops being automatic and the grades develop an interesting texture. It is not a cruel sentence. It is often said with real warmth at the end of a long evening when a parent has run out of other approaches. Consider everything packed into those five words. Affection because the speaker believes in something. Frustration because the belief is not being confirmed. Disappointment faintly held back but audible. And an entire imagined life already drafted, already partly furnished. The speaker has met someone the child has never met. And the speaker likes that person very much. What the child hears is stranger and harder to say out loud. Somewhere inside you, there is a remarkable person. The one currently in this room is preventing that person from arriving. Whatever difficulty you are having is not a difficulty because a difficulty would require help. It is a refusal. You are the obstacle to yourself. A child cannot argue with this because the terms make argument impossible. To say I am trying invites the reply that if you were really trying, this would be easier. Hello. Oh, hello Carolyn. Well, she's busy right now. Tonight? No, tonight she won't be able to. Barbara started on a new project and I don't think she'll be able to make it. tomorrow? Well, no. We're going to the museum tomorrow. There's a new exhibit. Certainly. Perhaps next week sometime. Thank you, Carolyn. I'll tell her you called. Goodbye. Barbara is a gifted youngster whose mother refuses to allow her any independence or individuality. The mother under the guise of I'm doing what's best for Barbara may be reliving her own unfulfilled aspirations. Barbara in trying to live up to her mother's standards will be extremely over anxious to secure high marks. If she is unable to meet these expectations, her mother will exert even more pressure. Recreation is eliminated from Barbara's life so that she can spend more time with her books. Warm friendships must be excluded because the mother feels that they do not stimulate her to high achievement. This illustration represents one kind of negative home situation. In other instances, there may be parents who reject their children's giftedness and do little or nothing to encourage them. These parents may be afraid that their children will surpass them and do not realize that they are inhibiting their child's efforts. Wholesome home and school atmosphere is absolutely necessary to build adequate relationships. When these are provided, a gifted child's happiness and achievement are immeasurably enhanced. In the life of a gifted child, friendships are important in furthering social and emotional maturity. Here are some of Nikki's friends who like to meet him on their way to school to discuss yesterday's events and plan for today. Nikki is a gifted youngster who, through his social adaptability and poise, has formed genuine relationships with his friends and finds going to school a real pleasure. In this school setting, Nikki remains with his chronological age group in the morning and participates in many social and intellectual functions. He's not set apart in this program, but is considered one of the group. Although his ability in some areas is far superior to that of the other children, he is not equally superior in all areas. He needs personal communication with intellectually normal children to evaluate himself realistically. He also needs close contact with adults to find satisfaction in his future relationships with them. His teacher is an important person in helping him to do this. Each youngster receives an opportunity to share in singing songs which provide a means for personality growth and rhythmical experiences. A group songfest is an excellent way of developing positive social attitudes. Music is a talent that Nikki does not possess to as great a degree as other gifted children. However, he's learning the enjoyment of musical expression, which is an essential factor in a balanced life. Recreation and physical development are necessary for fostering a healthy and happy individual who's capable of becoming a welladjusted adult. Games and athletics are Nikki's strong assets. He pays close attention to the teacher's instructions and doesn't want to miss any part of the game. His leadership qualities are evident not only in intellectual areas but in physical aspects as well. Equal opportunity does not mean the same opportunity for all children. A special class for gifted children is necessary to provide maximum growth based upon individual potential. Nikki spends part of his day in a special class where his intellectual and social needs are further met. The gifted children are drawn from a number of regular classes and are given special instruction in keeping with their capacities. In this instance, teachers in the third and fourth grades select their top level students for the special class. Generally, chronological age distribution is limited to a 2-year span to avoid unbalanced social groupings. Abstract arithmetic concepts are introduced sooner in the school curriculum and expanded more intensively than in the regular class. Nikki is learning that he doesn't have to suppress his ideas to maintain friendships and gain approval from his teacher, but that he can express himself without fear of rejection. The nature of this particular arithmetic assignment presents an individual challenge to each of the students and gives each of them an opportunity to develop new work habits. They do not complete their tasks sooner than the other children and sit around being bored, but work the full quotota of time allotted to them. Mutual stimulation and the exchange of ideas are encouraged while teacher domination is reduced to a minimum. The teacher urges the children to explore and evaluate their own work. In later years, the independence and self-direction taught in the early grades will be extremely valuable for the gifted child. Social studies is an important core of the academic program. Its content relates to the geographic, social, and cultural ideas of civilization. As an integral phase of social studies, group projects are planned by the children to crystallize and expand meaningful experiences. Working together represents the cooperative spirit so necessary to democratic ideals. Positive human relationships are also an invaluable outgrowth of this kind of activity. Although the special class has many gifted children, they are still operating at different academic levels of ability. Consequently, reading is done in small groups and the material is at their reading level regardless of chronological age. However, there are many new facts they still have to learn. Nikki soon discovers that he doesn't have the answers to everything and needs further information. Whenever necessary, time is given during the lesson for individual research. Adequate supplementary reading material should be available for the gifted child so that he can seek immediate answers and share them with the group. Nikki recognizes the limitation of his answer and with his teacher motivating him decides to investigate the problem further. This illustrates a way in which the interests of children can be broadened, not suppressed. Learning does not end within the environments of the school. Recognizing the need for completing his assignment, Nikki goes to the library to secure additional reading material. An adequate public library is a cornerstone for educating the gifted child. It is an excellent source for supplementing the limited selection of books in the school. >> More important here, Nikki finds a resource person, the librarian, who is ready to assist him. The question which Nikki poses to her is immediately answered with a few suggestions. Her knowledge is an open sesame to help Nikki extend his intellectual horizons. However, the choice of reading books for his individual research project represents the combined efforts of the librarian and himself. For a gifted youngster like Nikki, books are essential to help him understand the world around him and create new ideas. The home life of the gifted child keeper for me. Hey, So the child learns to perform a low-grade version of guilt, to nod, to promise, and to leave the room carrying an obligation whose size they cannot yet estimate. School teaches more than the material listed in the curriculum. Alongside fractions and photosynthesis, a child is being taught how to begin a task they do not feel like beginning. How to sit with confusion long enough for it to resolve. How to raise a hand and say the frightening sentence, "I do not understand this." How to be wrong at 11 in the morning and continue existing until lunch. A child who absorbs content quickly can travel a long way without needing any of that. Early schoolwork is calibrated for a wide range of learners which builds in a great deal of repetition. A child who gets the concept on the first pass will spend years being asked to demonstrate again something already finished. They will read under the desk or drift or become the one who answers before being called on. And none of it costs them anything because the assessment at the end of the unit measures exactly the thing they did not need to work for. Adults do warn them and the warnings are accurate and useless because the child is running a continuous experiment whose results contradict them every week. The essay started at 10 at night comes back with a good grade. The test taken without studying is passed. Half listening in class turns out to be sufficient. When adult advice and lived evidence disagree for eight consecutive years, no child alive chooses the advice. So the ease teaches a curriculum of its own, and the lessons it teaches are crooked in ways that do not show up until much later. The first is that intelligence means speed. So understanding should arrive quickly or it is not really understanding. The second follows anything requiring five attempts must lie outside your gift. The third is more corrosive. Visible effort becomes evidence that the gift is draining away. So a person praise for how little they needed to work reads their own straining as a symptom. The fourth does the most damage. Confusion stops being a normal stage of learning and becomes diagnostic information about the self. Everyone else's confusion means they are partway through. Yours means you were overestimated. There comes a point for nearly everyone where material stops yielding to comprehension alone and begins to require accumulation, drill, and time. Intelligence had been carrying the child upward like an elevator smoothly past floors other students were reaching some other way. When the elevator stops, the child steps out and discovers that everyone else has spent those same years learning to climb stairs and that the stairs are not a punishment or a lesser method, but simply how the building works above a certain height. Praise is not one thing. There is praise that describes what a person did which points at a strategy, a decision, a revision, a stubbornness that outlasted an evening. And there is praise that assigns a category which points at what a person supposedly is. The two feel almost identical in the moment of delivery. They behave very differently over years. In the late 1990s, Claudia Mueller and Carol Dwek ran a series of studies with fifth graders. Children did well on a set of problems and were praised. Some were told they must be smart at this. Others were told they must have worked hard. Afterward, the children praised for ability were more likely to choose easier tasks, more likely to lose enjoyment and confidence after a harder set of problems, and more likely to explain their later struggle by concluding something about themselves rather than about their approach. The findings should be held carefully. These were laboratory studies with short time horizons and effect sizes in this literature vary across replications and cultures. No sentence spoken to a child determines that child's life and parents who said you are so smart have not damaged anyone permanently. What the research illuminates is a mechanism. When praise attaches to a fixed quality rather than to an action, later difficulty becomes information about the quality. That is the whole hinge. A poor result stops meaning this method failed and starts meaning the flattering thing everyone believed about me may not be true. Once difficulty carries that freight, a rational strategy appears. If any hard task might expose the category as false, then the safest move is to avoid tasks that carry real information. >> Books are essential to help him understand the world around him and create new ideas. The home life of the gifted child should not provide any excessive privileges for him. Undue exploitation by either parent or child in their relationships can only lead to a distorted personality and an unhappy individual. Nikki comes from an average home, but a home which provides ideal opportunities for his development. Running errands for his mother helps Nikki to an understanding that helping other members of the family is a necessary part of growing up and sharing responsibilities. The pleasures of assisting his mother give him deeper understanding of his role as a son. A feeling of oneness is best achieved where the gifted child partakes of the normal routine of the home. It is important that he feel he is just one member of the family and not the only member. The development of good work habits is not only the function of the school but of the home as well. It is here that Nikki continues to work on his assignment and prepare his report for tomorrow. Of course, a flexible schedule is essential for a balanced life. And on other days, Nikki may be outside playing ball with his friends or going to the CIO. For today he is content to finish a task which cannot be set aside or solved except through diligent application. The completion of an individual job is as essential as group participation. Hobbies are necessary for a gifted child's growth. The recreational interests will vary with the youngster's desires. Nikki likes to build model airplanes. At this stage of growth, he's not uniquely creative and uses fabricated models. But creative inventions are based upon the simple functional skills developed in early life. Varied experiences of this type are required for the gifted child in order that in later years his interest may be channeled into an appropriate adult career. A normal sibling relationship is an important factor in the life of a gifted child. An older sister or brother may serve to create more wholesome identifications with other people. Nikki shares many ideas with his older sister, and it's common to find the entire family sitting together, discussing various topics. Often, family discussions are a means of encouraging intellectual individuality in the home. Most important, they are a way of learning how to solve the problems of the day together to promote a cohesive family. It is fairly well established that approximately 50% of the nation's gifted youngsters do not avail themselves of opportunities in higher education. This fact becomes extremely critical when the nation's needs demand more and more quality people. Consequently, throughout our country, there is an increasing demand to improve the education of gifted children. It is imperative that broad training in the humanities be a major goal of the home and school. Any undue emphasis for making everyone a scientist can easily result in a lopsided individual with a narrow point of view. The gifted child's interests and needs should be an important consideration in making a vocational choice. The starting point for molding a welladjusted individual is in the home. Parents who have a balanced perspective of life will help the gifted child make a satisfactory adjustment. Many of the attitudes in the home are transferred to the school. It is important that a teacher be alert to any evidencement and try to assist the youngster to develop positive attitudes. Therefore, the home, school, and community must become a unified and integrated part of a gifted youngster's environment in order that he can have a meaningful life. Every child has his own pattern of growth. When a child is gifted with superior mental ability, his achievement possibilities are rich and promising. But without understanding and wise direction and the experiences necessary to the normal growth of all children, his life can be filled with complicated and serious problems. The gifted child is first of all a child with needs which are the same as those of any other child. He wants to be like others to and become an active participator in the world. If he is misunderstood or if the opportunities for a satisfactory degree of personal fulfillment are not made available, serious maladjustment may result. But antisocial and other negative characteristics develop only if homes, schools, and communities fail to provide the important avenues to full and positive relationships. When these essential aspects are provided, however, the child can develop his abilities and interests to full capacity and can find happiness in relation with others with mutual respect and understanding predominant. However, it is up to all of us to do whatever we can to help achieve this goal. Next week, we shall consider the relationships of the child who is mentally [ __ ] but educable. A child with a handicap but one who can be helped. Like the gifted child, the child with a handicap is yet a child. An exceptional child with a life that may be restricted, sometimes even distorted, but one which can grow and continue to grow toward fulfillment. As we know more about the growth and development of the exceptional child, we will be able to help him more in his quest for happier, more secure relationships in life. A ch new life begun. A life that may be exceptional, but one in which beauty and achievement should be reached in the highest degree possible. Know you're enough. Even when self love feels tough. Breathe in. Let go. You're worth more than you know. Know you're enough. Even when self love feels tough. Breathe in. Let go. You're worth more than you know. Know you're enough. Even when self love feels tough. Breathe in. Let go. You're worth more than you know. Know you're enough. Even when self love feels tough. Brea in. Let go. You're worth more. >> What the child hears is stranger and harder to say out loud. Somewhere inside you, there is a remarkable person. The one currently in this room is preventing that person from arriving. Whatever difficulty you are having is not a difficulty because a difficulty would require help. It is a refusal. You are the obstacle to yourself. A child cannot argue with this because the terms make argument impossible. To say I am trying invites the reply that if you were really trying this would be easier. To say I do not understand is to contradict the file, the test, the phone call to the grandparent. So the child learns to perform a low-grade version of guilt, to nod, to promise, and to leave the room carrying an obligation whose size they cannot yet estimate. School teaches more than the material listed in the curriculum. Alongside fractions and photosynthesis, a child is being taught how to begin a task. They do not feel like beginning. How to sit with confusion long enough for it to resolve. How to raise a hand and say the frightening sentence, "I do not understand this." How to be wrong at 11 in the morning and continue existing until lunch. A child who absorbs content quickly can travel a long way without needing any of that. Early schoolwork is calibrated for a wide range of learners which builds in a great deal of repetition. A child who gets the concept on the first pass will spend years being asked to demonstrate again something already finished. They will read under the desk or drift or become the one who answers before being called on. And none of it costs them anything because the assessment at the end of the unit measures exactly the thing they did not need to work for. Adults do warn them and the warnings are accurate and useless because the child is running a continuous experiment whose results contradict them every week. The essay started at 10 at night comes back with a good grade. The test taken without studying is passed. Half listening in class turns out to be sufficient. When adult advice and lived evidence disagree for eight consecutive years, no child alive chooses the advice. So the ease teaches a curriculum of its own, and the lessons it teaches are crooked in ways that do not show up until much later. The first is that intelligence means speed, so understanding should arrive quickly or it is not really understanding. The second follows, anything requiring five attempts must lie outside your gift. The third is more corrosive. Visible effort becomes evidence that the gift is draining away. So, a person praise for how little they needed to work, reads their own straining as a symptom. The fourth does the most damage. Confusion stops being a normal stage of learning and becomes diagnostic information about the self. Everyone else's confusion means they are partway through. Yours means you were 