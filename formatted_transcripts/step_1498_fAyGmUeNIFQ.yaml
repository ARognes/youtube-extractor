transcript: ‘ENTER TO BEGIN!’ Today, I am going to feature the Passenger Showcase from Coding Challenge BASIC Snake Game. Let's take a look at Jason Ruddock’s version. Rather than just displaying text, it’s using the graphics mode. It's added a maze, a scoreboard, “welcome” and “game over” screens ‘I lost!’ and multiple levels with increasing difficulty. ‘I can’t even make it to Level 2!’ I really love the way that Jason has organized all the code into a set of subroutines and used remarks, so that you can easily parse what's going on. Sebastian Lague has has such a talent for making beautiful images with code, and it's kind of amazing to see what he did with such a simple, low resolution environment. Take a look at this beautiful animation for when the player needs a little time to contemplate defeat. Gregory Kreisman made a version for the Commodore 64, and Donovan adapted the game with a very clever twist. The food only appears from time to time, so the player has to remember where to find it. Next time I'm going to feature the Wave Function Collapse Showcase. So take a look at the video and add yours.
