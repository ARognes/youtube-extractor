transcript: Hi Layla. I'm considering a major career pivot. How do you determine whether you're moving towards something that's truly a better fit or just moving away from something that's [music] uncomfortable? >> Tell me exactly what it is that's uncomfortable. Like what's making you question if you want to keep doing it? >> It's [music] like I've burnt out. I always wanted to take on more responsibility. I never could say stop. Like it's [music] not the circumstances maybe. It's me. >> I think it's always a great opportunity to say, you know what? I have to change my relationship with my work and I need to reset expectations with people. This might be a great opportunity for you to step into a new chapter because I think that it's not that you can't change, but I think [music] it's going to be very hard for the people around you to accept that change because they are literally disincentivized. They're not incentivized for you to work less in this job.
