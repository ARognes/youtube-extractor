transcript: You ever pull up the app switcher on your phone and find like 18 apps just sitting there open? Probably sucking on your phone's [music] precious resources. Naturally, your instinctive human urge is to swipe every single one away. Both because you might think that's actually going to help, and because a nice 10-app flick sure does hit the spot. Unfortunately, as great as it feels to banish those apps to the ether, you might be doing more harm than good. Because, newsflash, your phone already manages those apps in a smarter way than you ever could. Today, we're going to break down why that is, what's actually happening to apps when you close them, and the one edge case where force closing an app is justified. When you pull up the multitasking view, called the app switcher on iOS or the recent screen on Android, it's easy to assume every app you're seeing there is actively running in the background. But this overview only tells us how recently an app was used, not whether it's suspended, dead, or genuinely still running in the background. >> [music] >> However, your phone knows precisely what's going on. But you're an adult. You don't need no operating system telling you what to do. So, you swipe a few apps away. AKA, you force close them. Which has slightly different effects on different phones. On Android, the app will be only mostly dead. A few background services, like notifications, might still survive. On iOS, it's a proper force close. That app is just gone. Either way, it isn't the harmless little cleanup it feels like it is. Because a force closed app and a suspended one behave very differently the next time you go to open them. >> So, an app that has been force closed, um when you open that app, it's going to have to do some work to get ready for you to use it again. So, you might have to spend a few seconds logging in. Um it might have to talk to a server to to have some stuff to show you. Whereas, if you have an app that's suspended, um it has all the context on what you were doing ready. So, as soon as you switch back to the app, it can show you exactly where you were last. >> That's Neil Lebeck, a software engineer whose PhD research included building a better memory manager for Android. And he just raised the obvious question, why volunteer for that slow, battery-draining cold start when you don't have to? Swiping away an app to save system resources is an exercise in futility because an app in a suspended state is using virtually no CPU resources at all and is barely draining any battery. But hold on, what about RAM? These so-called suspended apps are using a bit of that and you only have so much of it on your phone, so killing a few apps would free up space for the stuff you need, right? Well, your phone has some strong opinions you should hear after you hear first from our sponsor. >> ThreatLocker. If AI is being rolled out at your company, then every efficiency gained comes with a new risk to your entire organization. Well, ThreatLocker helps mitigate those risks by putting guardrails on AI within your environment. It uses a zero-trust approach, so it blocks unapproved processes from executing and avoids giving agents more permissions than they need. Who do they think they are? Learn more about how you can set boundaries within your business for those little AI guys at the link in the video description. And while you're down there, check out their blog that covers additional policies to help you keep you safe. It's a good read. So, like I told you at the beginning of this video, your phone's operating system is already pretty damn good at managing your apps and it's doing it better than you because it actually knows what to prioritize based on several different factors. >> One factor is which app was opened least recently. The sort of least recently used or LRU, that's a pretty common policy for sort of managing resources um in computers. [music] And then I think another factor might be how much RAM is the app using? Because if it can kill a single app, you know, it's taking up a ton of space, maybe that makes more sense than a bunch of apps that are each have a pretty light footprint. >> See, the OS is like a librarian who keeps popular books on the front shelf and It moves one to the back when a new arrival needs the space. Swiping every app away is boxing up the whole front shelf every night. So, tomorrow every book has to be hauled back out of storage. Now, imagine walking in and telling that librarian that you'll be deciding what goes on the front shelf from here on out. Gosh darn it, who's going to make better calls? You or the person whose whole job it is to make sure the library runs smoothly? Your phone's OS is that librarian. It's tracking which apps you open and when. So, when memory runs low, it already knows exactly which one to quietly move to the back. >> If you force closing the app actually frees up more memory, it means that the operating system didn't need that memory in the first [music] place, right? Because if it did, it would have already done it for you. >> Your phone's RAM being fully occupied isn't the red flag PC users may think it is. On a desktop, where you're probably running multiple apps at once, running out of RAM leads to data having to be shuffled between the RAM and your storage device, which can make using your computer feel more like waiting in line at the DMV. We don't have that in Canada, but I understand it takes a long time. But, luckily your phone doesn't have that problem because you basically only ever use one app at a time. So, your phone's OS can more efficiently delegate memory to the foreground app while giving the background apps enough to ensure they can reopen instantly. Which brings us to a whole category of apps supposedly built to do that shelf clearing for you, RAM boosters. Take a second and imagine how your phone's OS feels about these d-bags. It spends all day prioritizing memory for the stuff you use most, and then a booster barges in and empties the shelves, the exact thing your OS hates. If your phone could talk, it'd be screaming, "DEAR GOD, STOP! I just organized that." Luckily for your phone, most of the time these apps can't mess things up too much. Apps on modern phones are sandboxed so tightly that a booster app can't actually reach into another app's memory to clean it. They're like a consultant. They strut in promising to unlock value, cause a mess, send you an absurd bill, and leave optimizing nothing because they literally can't. Which brings us to the one situation where force closing is the right move. You could write an app that just spawns a background thread that sort of takes up CPU cycles and and does that stuff even if the app is moved to the background because it isn't hooking into the operating system's machinery for like telling the app to stop doing stuff when it goes into the background. If you do that, you would get an app that's sitting in the background and is actually like draining your battery. >> A properly built app is easy to manage. When it drops to the background, it signals to the OS, "I'm done. Suspend me." And the OS suspends it. A badly built one ignores that agreement and just keeps on running. >> [laughter] >> And unlike a suspended app, you can actually feel its effects. Your phone runs hotter, your battery dips faster, everything gets more sluggish. Now, if every app were quietly chewing through your battery in the background, a rogue one wouldn't stand out. You can only notice a misbehaving app because the rest of the system is working so well. But this kind of naughty app rarely gets far. On iOS, the system simply won't let a background app continue to run arbitrary code. And both Google and Apple stores screen for battery abuse before an app goes live. So, unless something's clearly acting up, don't make swiping away apps a daily ritual. And here's the part that should actually bug you. Closing an app might not even stop it from collecting data on you. If you want to see what your phone is still tracking after you think you've shut everything down, this video will show you exactly what's going on.
