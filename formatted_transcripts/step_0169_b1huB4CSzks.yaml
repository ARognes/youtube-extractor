transcript: Have you ever called a support line and spend an hour being shuffled from agent to agent only to finally receive the oldest advice in tech? >> Have you tried turning it off and on again? >> It's so frustrating. And to make it even worse, it works. Your PC comes back from a reboot acting like it didn't do anything wrong. Well, there's a real and slightly embarrassing reason for that, which comes down to how computers manage memory. So, let's unpack why the dumbest fix in computing actually works, why we still need it, and what a reboot can't fix. Computers have two kinds of memory. Non-volatile memory holds data even when it loses power. So, it's used for persistent storage, like hard drives and SSDs. Volatile memory loses its data when it loses power. However, it's much faster, making it perfect for random access memory or RAM, the temporary workspace for everything your system is juggling while it runs. Think of RAM like the kitchen counter and your SSD as the fridge. When you cook, you pull what you need out of the fridge and put it on the counter, so it's all within arm's reach. And then you need more stuff, so you pull that out and put that on the counter, and then you put more stuff on the counter, and you're running out of counter space now, and you see the problem here. >> And so slowly that builds up. Now, the problem is it doesn't have enough memory to store everything else. So, everything starts slowing down because if it wants to get some data, it's no longer accessible in memory, so it has to get it from the disk. >> That's Ashvin Goel, a professor in electrical and computer engineering at UFT, and he's talking about swapping. When your system needs a piece of data it actually needs right now, but can't find room for it in RAM, it offloads to your storage drive instead, using some of your SSD or hard drive as temporary memory. It's a clever workaround, but an imperfect one, because accessing RAM is much faster than accessing a drive. So, your PC slows down. Now, all of this could be avoided if every program did what it was supposed to and released its hold on memory that it's no longer using. Unfortunately, many programs hold on to it instead, making it seem like the swimming pool that is your available memory has sprung a leak, which is why we call this issue a memory leak. And one of the main reasons they occur is because a ton of PC software, including web browsers like Chrome and operating systems like Windows, are written in low-level programming languages. These give programmers more direct access to the hardware, but often don't have automatic memory management built in, which can lead to things like Chrome continually inhaling more RAM instead of freeing some up from the tabs that you have already closed. Let it go! But while everyone points fingers at Chrome or Windows, one culprit that flies under the radar is your third-party hardware drivers. Buggy ones can quietly leak memory the entire time your PC is running. >> The drivers are written by the third-party vendor, and so they don't go through the same level of reliability analysis, testing, and verification as the core operating system. Microsoft used to complain that, you know, "We have all these crashes, but really we're not the ones responsible for them." The core operating system wasn't really the problem generally. It was the drivers that had bugs in them. The bugs are partly because the drivers were perhaps not well tested, but also because hardware tends to be buggy, and the software was not accounting for that enough. [music] >> You know, suddenly it makes a bit more sense why Microsoft is on their AI villain arc right now. They get blamed for a printer driver face-planting the whole system while their golden child sibling gets away with keeping 40 tabs open since the Obama administration and somehow never needing a reboot. And we'll find out how after you find out about our sponsor, Micro Center. WANT TO SAVE BIG ON A NEW laptop this summer? Well, June is Micro Center's laptop savings month with prices low as $539. That's basically the price of the RAM that's included in the laptop. If you're in Austin, Texas, good news, there's a new location opening near you. And their Columbus location is undergoing a remodel, but don't worry, they're still open. For all things Micro Center and tech related, stay up-to-date on Micro Center news using the links below. And snag a free 128 gig flash drive while you're there. Why not? Although many people won't admit it, phones are computers, too. But they don't seem to need a reboot nearly as often as desktops and laptops. The reason why is kind of complicated, but it essentially boils down to the software platform they're built on. For Android, that's Java, and it's got something called a garbage collector. It's software baked into the platform that automatically reclaims memory once nothing's using it anymore. Think of it like living with your mom, and she's a very nice mom, and every couple of hours she silently tidies your room, and you are a horrible child, and you never even notice. iOS does not use the same kind of garbage collection. It has a different memory management feature called automatic reference counting, which macOS also adopted back in 2012. Although macOS was actually called OS 10 10.something back then. But point is that these mobile operating systems lean hard on automatic memory management and aggressively clear out apps that you're not using, where Windows is a lot more hands-off, letting programs hang around and slowly hog memory until you reboot. Why? Well, other than the programming language related issues that we mentioned previously, having a feature like that constantly running in the background costs performance. And the people behind Windows apparently decided that squeezing out a few extra frames was worth dealing with Chrome crashing every once in a while and needing to reboot your PC more often. Because what happens to your PC's memory when you reboot? Well, it gets wiped [laughter] clean. Tabula rasa. It's the whole reason that ancient advice actually works. You got PC problems? Just reboot until the cows come home. On, off, on, off, on, off. It's fun. The problem is rebooting is kind of annoying, especially when your PC decides now is the perfect time to apply that huge new update. Hope you didn't have anything else scheduled. Thankfully, some developers came up with a couple methods for reboot reduction. The first is the micro reboot. >> The key idea in all of these things is to compartmentalize the problem. So, if you can modularize your software and ensure that the different modules don't, you know, interact with other modules except through clear channels, that allows you to potentially recover by maybe rebooting just the module instead of rebooting the whole system. >> You've almost definitely lived through a micro reboot without even noticing it. It's why one webpage can crash and reload itself while every other tab just keeps on Henry rolling. In most browsers, each tab is walled off as its own little process. So, the browser can quietly kill and reload one crashed tab instead of taking the whole window down with it. And your OS pulls the same trick, restarting a crashed service in the background instead of dragging the entire machine down. The second fix is the programming language Rust, which, unlike older languages, will catch many memory bugs before your program ever runs. The kinds that cause crashes and corrupted data. In fact, in the most annoyingly helpful way, it'll flat-out refuse to compile until you fix them. Thank you. Rust is basically C++ if it went to therapy, did the work, and couldn't stop telling you about it. Now, don't get the wrong idea. Despite all of these clever workarounds, the humble reboot isn't going anywhere. It'll always be there to clear out leaked memory and corrupted data sitting in your RAM. It's not magic, and there's many kinds of damage it can't heal. But, as a first step in your troubleshooting process, it's still kind of a no-brainer. So, next time someone tells you to turn it off and on again, don't roll your eyes. Just reboot. And speaking of RAM, if you want to learn about a time where memory tech almost went down a completely different path, go check out our video on RDRAM. It is a wild look at a timeline we narrowly dodged. Your RAM, Marty. Something's got to be done about your RAM. Like, it's kind of like that.
