transcript: Most people lose years explaining themselves to people who already decided who they are. The worst part is that it happens invisibly. They think the problem was communication. They think they chose the wrong words, picked the wrong moment, came across too strong. They believe that if [music] they could just be clearer, calmer, more agreeable, someone would finally see them correctly. Carl Jung understood something harder about this. People do not see you. They see the version of you their mind
