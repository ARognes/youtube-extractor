transcript: Oh, hey. How's it going? Has your life been missing? Fun, intrigue, asbestos, gratan, duenoir, bangs, and the Polish city of Gdansk. Yes, I thought so. Then gosh darn do I have just the thing. It's another book that I wrote with my keyboard paws entirely for your displeasure. This is an ad for it. I am wasting your time and I lied about the Gdansk thing. It is called Sublimia Syndrome. It's five mini novelas, I guess, about a human civilization a million years from now and what might happen if we ever manage to get our together existentially speaking. And there's talking space whales and galactic social engineers and consciousness accelerators and lots of ripping off Isaac Azimoff, etc. If you happen to feel like wasting 6 hours of your life finding out why I wasted 2 years of mine, you can find a link below to the digital and print versions of the book. If you decide to pick it up, I am ever so grateful. Thank you. I should also apologize for not putting much out of late. Now and then people email me addressing the Exeria team and I always wonder who that could be because it's just her, sometimes this, and myself. So stuff takes a while sometimes. Thank you for being understanding. It's coming up for 10 years that I've been making nonsense online as a day job and that has only been possible with your support and kindness. So I just wanted to say, well, not that I like you or anything, but you're pretty okay. And even if giving this book a read isn't for you, thank you ever so much for following my stuff at all. I don't know what accounts for your lack of tastes, but I'm glad it coincides with my lack of talent. I hope you're having an adequate life. Please return to doomcrolling. Big love as ever, and cheers. [Music]
