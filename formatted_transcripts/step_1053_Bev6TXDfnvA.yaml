transcript: |-
  Three hours of calm, generative ambient for deep work, studying, and focus. Eight full soundscapes, each one played live on a modular synth and recorded to tape, then sequenced back to back into one continuous set with no loops and no repeats. Just slow, evolving textures drifting from one piece into the next. Put it on, let it run, and get lost in the work.

  No looped backing track here. Every minute is a different generative patch, so the three hours never circle back on themselves.

  Chapters:
  0:00 Celadon
  21:43 Talay
  42:54 Loh
  1:13:44 Lhûn
  1:23:44 Mowen
  1:44:00 Cardolan
  2:14:53 Beleriand
  2:29:11 Sandoro

  Gear across the set includes Mutable Instruments Beads, Rings, Marbles and Plaits, the 4ms Ensemble, Qu-Bit Cloud Terrarium and Chords, Pamela's New Workout, and Teenage Engineering's TX-6, recorded through reel-to-reel and cassette tape for that warm, slightly worn analog character.

