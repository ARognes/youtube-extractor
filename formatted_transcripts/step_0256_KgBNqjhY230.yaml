transcript: Goodbye. Kind of. I did not see this coming. So, basically, I am now no longer a full-time YouTuber slash working on Hazel as a software engineer. I'm not both of those things anymore. And honestly, I'm pretty happy about that. You may remember I put up a video called I'm struggling because it was hard to be like a full-time YouTuber and then also run like a software engineering team, building a game engine. Yes, I'm not really doing that anymore. What I am doing is getting back to actually building software and I'm really excited about that. I am now the CTO responsible for core technology at a startup called Lucky Robots. What we're doing is building a game engine for robotics, a simulation environment in which AI robots can learn and train how to do things [music] in. And this engine called Lucky Engine is built on Hazel. So what this means is that Lucky Robots is my full-time job. I am now no longer making videos for YouTube full-time. Does this mean I will no longer make YouTube videos? No. That's where the kind of part of this goodbye video comes in. I'm saying goodbye to being a full-time YouTuber, and you will certainly see less videos from me. However, I'm not entirely disappearing. In fact, I think it would be awesome to make videos about the work that we're doing at Lucky Robots, especially since it's based on Hazel and Game Engine technology. However, my priorities now no longer lie with creating content for you guys. Now, I'm sure you have a lot of questions. Let me try and answer some of them now. So, first of all, I did not create Lucky Robots. This startup was founded by Dev and Arya. Dev reached out to me in September last year. I flew over to Austin, Texas in October last year, met the team and jumped on board. Second question, what is happening to Hazel? Has Hazel been acquired by Lucky Robots? The answer is nothing is happening to Hazel. Hazel hasn't been acquired. Hazel will continue being Hazel. It's just that I don't really have the time to keep working on it like I used [music] to. That's not to say that Hazel will be completely abandoned. It will live on as Hazel. It will still be accessible by you guys. You can still use it to make whatever you like and I will work on it when I can. What about the volunteers working on Hazel? Can they keep working on Hazel? Yes. However, two of our most active volunteers, Jim and Emily, have actually also joined Lucky Robots. What about releasing Hazel? You said you would release Hazel for free. Is that still happening? Yes, that is still happening. I'm not exactly sure on the timeline. And we are actually also planning to release Lucky Engine for free as a binary release. Which one of them will come first? Pretty sure Lucky Engine will. So, soon you'll be able to download Lucky Engine/Hazel and play around with it for free. and we have been busy over the last 3 months. To be honest, it's pretty amazing what we've achieved and I can't wait to share it with you. I mean, one of the biggest reasons why I joined this project, [music] this team, this company in the first place was because I really believed in its vision and the people behind it. And so far, it's been amazing. Harrison aka Sentex, another YouTuber, has also joined the team as director of AI engineering. So, we kind of have two different teams of engineers. the core technology game engineers and the AI/Machinele learning research engineers. And we are hiring both. Go to luckyroots.com/job to see our open positions. I'm also looking to hire people specifically in Melbourne, Australia, because I'll be opening a physical office here. So, if you know someone, let me know. So, yeah, that's the news. Can't wait to share more with you and I will still be around. I'll see you soon.
