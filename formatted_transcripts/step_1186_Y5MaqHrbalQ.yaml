  GABA Tone is an effort in moving beyond static drones, using chord progressions to shape a more dynamic ambient structure. The patch focuses on minor harmonies, subtle modulation, and the contrast between clean digital tone and magnetic tape analogue degradation. A field recording on the TP-7 adds a layer of realism to the infinite reverb synthetic space.

  Patch Notes

  1. NOH Pianist (NOH) generates shifting chord progressions, routed into Qu-bit Chords to voice various minor chord qualities and variations. This introduces harmonic motion that isn’t locked to a single drone frequency.

  2. Xaoc Zadar (Xaoc Devices) provides envelopes to modulate the chords with slow attack and release, shaping their presence over time.

  3. A steady drone from E352 Cloud Terrarium (Synthesis Technology) adds a second lower octave voice, slowly scanning its wavetable for ongoing timbral variation.

  4. Both voices are sent through the low-pass filter section of Ghost (Endorphin.es), reducing high-end content and rounding out the texture, modulated by a LFO.

  5. That signal is routed to MFX 2051 Bit Corrupter (AML) to introduce glitch elements. A VCA controls the input, so the effect is used sparingly.

  6. Subtle high-pitched tones are generated by Ensemble Oscillator (4ms Company), triggered at random intervals by Marbles (Mutable Instruments). These are processed through Veno Echo (Venus Instruments) for added delay.

  7. Everything is sent into Starlab (Strymon) at the end of the chain, set for infinite reverb to create a wide stereo field and sense of distance.

  8. The full mix is live recorded to Nagra IV-S reel to reel tape, then the monitor out is digitized using the TP-7 (Teenage Engineering).

  Bonus: Visual monitoring is done via Tiliqua (APF Electronics), which displays the signal as an oscilloscope waveform.

  The patch is layered with a TP-7 field recording from night time Stratford’s Olympic Park, capturing occasional cyclists and building closure announcements. The overall feel is spacious and slightly melancholic, with reverb swells suggesting distance or isolation. It’s designed for focused listening, with enough tonal variation to remain engaging over time.

  Listen & Follow
  If you enjoy these textures, feel free to leave a comment or explore more modular works here: https://open.spotify.com/track/3A5MqfyxAx03TomLxkG2rJ

  It’s a blend of modular ambient, tape textures, and natural field recordings (great for focus, slow mornings, or letting your mind wander).

