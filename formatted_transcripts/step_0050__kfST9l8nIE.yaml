transcript: '[Danny] So, a few months back I started noticing posts all over social media talking about how good Battlefield 3''s single-player campaign was. And I wasn''t the only one. David Goldfarb – a DICE veteran who worked on Bad Company 2, led the single-player campaign for Battlefield 3, was also game director on the massively successful PayDay 2 and, more recently, Metal Hellsinger – also noticed. This was kind of interesting because, while I have always loved the single-player campaign in Battlefield 3, a lot of the discourse around it upon release wasn''t very positive. Coming off of the destructibility and humor of the Bad Company franchise, Battlefield 3''s campaign felt a lot more Call of Duty: cinematic, scripted, full of big set-pieces, and tonally self-serious. I''ve known David for a few years and we''ve never had the chance to talk about his work leading the campaign on Battlefield 3, so I thought this was the perfect excuse to both examine the design of BF3''s campaign, and the strange nostalgia people are now starting to feel for this era of game design. [Explosions] [Gunfire] [Danny] What''s going on at the moment, with people suddenly spamming you and the world with Battlefield 3 footage, going like, "We used to make good games, god dammit!" [David] Jesus. I don''t know. It feels like it''s "a thing". I don''t think it''s specific to BF. It''s just, like, a thing where everybody... I think we''re all in crisis right now. Like, just hoping, grasping for anything when times were simpler and life was better, and the games were... felt better to us. And I think BF is a big part of a lot of people''s... Like, "Oh, man, remember those times when I would just sit there? "Drinking a beer, playing, smoking weed, skipping class." ''Cos that''s what I want! [Danny] (Laughs) [David] Of course I would love to go back to whenever that was, 2011 or earlier, and just enjoy those times ''cos they did feel very different than now. So I think people are... I don''t know. I think it is this wave of nostalgia that social media reinforces. And the industry''s in crisis, so all those things, collectively, probably make people like, "Take me back, man. Take me back, I''m ready to go back." (Ident clicks) (Jazz music plays) (click) [David] I had left Killzone 2 because I was unhappy with something. This is tradition, I think, with with the direction (laughs). And so, I was like, "Fuck it, I''m leaving." And then, I think a friend of mine, who happened to be at DICE was like, "Hey, we''re hiring for this game." He said, "It''s kind of in your wheelhouse. You like this sort of stuff, and they''re starting on the second game." I really liked Stockholm, and I thought the people at DICE were super cool, and I wound up getting a job, and then I came out there. The first thing that happened was the project got delayed – BC1 [Bad Company]. And so, the project I was supposed to start on, didn''t start. BC2 just got pushed out. And the next thing that happened – and I remember this very clearly – we were working on the extension for BC1, and Call of Duty 4 came out. Modern Warfare. And we were just all sitting there looking at it like: "Fuck." And we were making a completely different game, so it wasn''t even fair for us to compare ourselves to them. But, of course, that''s what happens. So I think we decided to delay it. And I can''t remember where in the timeline this was – and I''m sure there are DICE people who will correct me, and I''ll be wrong – but I feel like the delay happened when CoD4 hit, and we were like, "We need another few months to make this better." [Danny] Bad Company had so its own thing going on. Like, I remember enjoying both of those games for very different reasons and never feeling like I needed to compare them at all. The dialogue and the destructibility. There was so much going on in that game you''d never seen before. I still remember, "You smell very clean." "Hey, how you doing? You smell very clean." "My name''s Redford. You can call me that." [Danny] It''s got a Three Kings vibe to it, or something? [David] Yeah, that was... Three Kings and Kelly''s Heroes was a big influence. But, yeah, the first game was super funny. It was not CoD at all. ("There''s gold in them there hills!") The fact that we had that anxiety was good in one way, and bad in another. We finished BC1 and I think the EP [Executive Producer] at the time said: "Okay, we''re gonna fix all the shit we did wrong in BC1. "Take what we did, fix all the stuff that we wanted to get right in the first game." And then, I don''t think "make it more like Call of Duty" was explicit, but "make it more spectacular and cinematic" was. It was something that we talked about. It was something that came both from the executive leadership... But I think there was this desire, on our side as a design team, and also just generally, to be like, "What can we actually do to step it up?" Now that we know the tools, now that we''re more familiar with how stuff works. And, y''know, get it out pretty soon. I mean, I don''t remember how long the dev was, but it wasn''t that long. It was, like, two ... two and a half years, I think. And then somehow we finally got going on BC2. That was super fun because nobody knew what we were doing in the studio. I mean they knew, obviously, we were making this game, but there was... Everybody was working on, at the time, "the big project", pretty much – which was... what was then BF3. It was a very different BF3, though. It was more of an MMO, really. [Piano flourish] [Danny] The original Battlefield 3 was not the Battlefield 3 that came out. The project, codenamed "Venice", was the studio''s main push for a number of years. An attempt to make a large-scale Battlefield experience more akin to an MMO. Sadly, this project  never really found stable design ground and was eventually sunset. And so, when the Bad Company team released a second game with a strong multiplayer and single-player component, many of the leads of that team – including David – were tasked with resetting Battlefield 3. DICE had a much more modest headcount than Activision did on Call of Duty (somewhere around 300 people) but studio leadership wanted to create a product that would compete with CoD, and so the project was split into three separate efforts: The multiplayer would be led by Lars Gustavsson, who had been with the studio since Battlefield 1942 and had led Battlefield: Bad Company 1, David Spinnier would lead a team working on co-op, while David [Goldfarb] would be in charge of the single-player campaign. [David] But that was kind of the thing: "We''re gonna go for physical, grounded, intense." Feels like it could be real, in some fashion. Find moments that gave them the fantasy of being, whatever, a pilot or a tanker. The hope was that we could get it to feel like Black Hawk Down or like Generation Kill, or like some of these asymmetrical combat scenarios. I think we had a bunch of fantasies, I guess you could say. "What do we want to give people?" One of them was, you''re gonna fly a jet. Also, because we have them in multiplayer. (Console beeps) [David] So we were thinking about how to do that and the problem that we encountered was, "Is it going to...?" Because so much of BF3 is about how great it looks, and continues to look... But you can''t do that, at least back then you couldn''t do it really, in a way that would''ve been economical and we would''ve shipped in that century. Y''know, if you had free flight? And, additionally, teaching the player to fly if you''re a pilot – obviously a lot of people do it in multiplayer – in single-player, it was something that we were like, "I don''t know..." Because even with BC1, when you''re flying the chopper, it was clunky at best. And so I think I was reluctant to do it, and we went back and forth on it, and I think what we resolved was: "Can we just give people the experience of being there, "and have the spectacle be the thing?" Because we have all this other stuff where you''re playing but we wanted to switch the pace up, so that you would feel like, okay, this is kind of a breather, in a way. It''s like a palate cleanser. Because everything else is in your face, and to give them something to really take you away from that, felt important. And that was, like, Linus [Josephson], who was really committed to military... He was super into all these sims and things like that, and so he was very intent on getting that right for this mission. And so they start to build it out and I remember the moment you walked out to the deck – because we talked about this whole thing – you walked out to the deck and you got on the deck, and even when it was in prototype and it was graybox, you''d never seen anything like it in a game, really, before. And so we were like, "Yeah, that''s gonna work." I remember we showed it to the studio when it had art and sound and I couldn''t believe... People were just like, "What the fuck?" Like, how does it look that good? [Danny] (Laughs) [David] And it turned out that that was the reception... I think a lot of people felt like that, even though it''s not a gameplay section. [Danny] Right. [David] It was so convincing at putting you there that it was a success in its own right. At least, that''s how I looked at it. [Radio chatter] [Engines fire] [Danny] Similarly, then, with "Thunder Run" it''s another mission where you''re in a vehicle, but you have more autonomy in this, it feels. This was another one of these "fantasies" you were talking about? Was it another case of "these are in multiplayer, let''s get them in here"? You know, it''s weird, I think we didn''t take everything that was in multiplayer and go, like, "We gotta make a mission out of it!" But this one, yeah, we knew we wanted to have a mission with you as a tanker. I think I''d been watching Firefly and, at the start of it, he''s playing with a dinosaur, one of the characters. He''s like, "Rar! I''m gonna get..." I don''t remember which episode. But that was in the back of my head. And then somebody reminded me of something that I''d forgotten, which was this whole "BF has dinosaurs" thing on 4Chan, or something. People were like, "Why don''t you have dinosaurs? "Call of Duty has dinosaurs," or something like that. I can''t remember exactly what it was. So people were like, "Are you guys gonna have dinosaurs?" And so I think those two things wound up with me, being like, "Okay, they''ll get a dinosaur somehow." I gotta ask people who have better memories than me if that''s actually what happened or if that''s just me making a bunch of shit up in my head. I do... I mean, I wrote it, but I don''t remember how it happened. I think that''s how it happened. It was pretty straightforward up until you get out of the tank (chuckles). [Danny] Right. [David] Which I had completely forgotten that we did, because I remember I was hung up... I wanted to have them make a charge, which you do. So, you get out of the tank, you blow the thing, and then a guy gets killed. I don''t remember it all. I think, for the most part, it was pretty okay and the tank controls aren''t that complicated. Up until you get into the city, and then you have to start worrying about other shit. This actually isn''t a great environment to be fighting in. I don''t mean, like, in reality. I just mean, as a player. It didn''t feel that good. [Danny] One thing that comes up in both "Thunder Run" and with the jet in "Going Hunting" is the use of thermal and night-vision cameras, and stuff – and that, obviously, becomes a really big focus in "Night Shift". What do you remember about that? ''Cos I just remember that stuff looking so realistic. Like, creepily realistic, sometimes. [David] We were looking at all of that footage. I remember looking at the stuff that people were probably putting on... What was that thing called, LiveLeak? Was that what it was? [Danny] Right, yeah. [David] Yeah, so before the days of... you could just see it on TikTok or Twitter, or whatever, people would be posting, like, war footage they had. So we were looking at a lot of that stuff. [Gunfire] [David] Let''s see, "Night Shift" is the one that starts with, like... I remember this was a long level. And there was a lot of stuff going on. It starts with you shooting out the lights – which, ironically, the Osprey immediately illuminates, like, five seconds later. So that didn''t make logical sense. But, whatever! I don''t remember much about "Night Shift", actually. I do remember that it was one of the more difficult levels to make, that people did seem to like it when we did playtests. People enjoy sniping, I think, just... Period. [Street noise] [Danny] "Swordbreaker" and "Uprising" are a little duet at the start, as well. You mentioned Generation Kill earlier, and for sure I can see the connection there. [David] Yeah. We had to source a lot of stuff, and make up a bunch of stuff, and I think some stuff we got right, and some stuff there... I mean, you can look online, people will be like: "That is completely fucking not what that is." Tehran doesn''t look like that at all, for instance. So I think we definitely took some license when it came to making spaces, and stuff like that. "Swordbreaker", I don''t know what that''s exactly based on. I would have to ask Gustav [Tilleby] who was the Art Director at the time and I don''t even know if he would tell me. He''s the one who''s responsible for both BC2 and BF3 looking as great as it did, as an Art Director. What we were attempting to do was portray a feeling rather than a place and, to the extent that we succeeded, I guess it was okay. But, y''know, I don''t know that I would make the same decisions now about doing any of those things, really. (chuckles) One of the things that... I don''t know, maybe this is interesting... We also had a bunch of assets that were left over from [Project] "Venice". One of them was Paris. So it was like, "What are we gonna do with Paris?" And then... "Well, we clearly need to make an SP [single-player] mission in Paris." "What''s it gonna be?" "Well, it can''t be the US, who''s it gonna be?" "Well, we do have these other factions." "Okay, so then it''s gonna be Spetsnaz." And then I was very like, "Ah, it''s gotta be in Russian, can''t be in..." Not gonna do some fucking bullshit. The whole mission''s gotta be in Russian. «Дима, убери их.» [Danny] To me, that is one of the... That''s, like, top 5 single-player levels I''ve ever experienced. It was so... [David] Really? [Danny] Yeah, it''s fucking... [David] I''m just curious, what is it about that... I can''t play any of them without going, "Oh, god, the AI is so broken." [Danny] (Laughs) There''s something about guns being shot inside of contemporary buildings that sounds very violent, or something? [David] Oh, yeah. [Danny] It feels very, "Oh, fuck, these aren''t supposed to be here." It''s like a Heat kinda feel? [David] Yeah, we were actually going for that whole thing, Especially out on the streets. And we also knew that we wanted to have some destruction, because we missed it from BC2, and we didn''t have as much in BF3. [Danny] And then, just from a narrative perspective, as well, obviously it''s a shocking ending, at the end, when the nuke goes off. That whole thing, actually, the fight on the train platform. ''Cos, in a way, it''s a shocking way to end. You''ve just survived this ridiculous scenario, and then, when it happens, it''s like, "Fuck..." [David] I knew that''s what I wanted, I guess, when I wrote it. I was like, "You need to get there and think that you''re gonna sort this out, "and then you''re not gonna sort this out and it''s gonna be very bad for Paris." [Danny] I also loved how it was framed. It wasn''t... I remember the Call of Duty one, I think you were in a helicopter, so you see the "glory shot" of the whole thing. And there''s something so depressingly banal about how you view it in... Like, it just feels like, "Fuck. I''m on this train platform with no one else." You realize it''s about to happen just before it does. And then even so, you kinda can just see it. You know what it is, it''s obvious what it is. But it''s not like you''re standing on top of the fucking Eiffel Tower watching it, y''know what I mean? There''s so much that you did in the game that felt like those choices that made it feel grounded, and real, that... A lot of games don''t do that. [David] I''m glad that you feel that way. That was the hope, y''know? That we would not "cut to the mushroom cloud". That was a cool mission, though. I liked it. One of the big things that made, I think, BF3 as impactful as it was was the animation quality was so high. And some of it was mo-cap, but a lot of it was animated cameras. That was Tobias Dahl and these other guys that were just like – and Mika [Mikael Högström], who''s also at Embark – who were just, like... A lot of the stuff that should have been AI was actually animated. So you would see run cycles that were blending from a mo-cap animation into whatever other animation. I think it was even based on stuff we took from FIFA. A lot of the Frostbite animation stuff, I think came from FIFA, if I remember right. You really did get super high-quality out of that stuff. The downside was, when we switched from Frostbite 1.5 (which was BC2) to Frostbite 2, we had no AI for a long time. So, what we wound up doing was, animating using state machine to solve the problem. But, of course, it''s not the same thing and we didn''t get working AI until very, very late. And, even then, it was fairly primitive, even compared to what we had for BC2. So that was. a big part of the problem with single-player, we just didn''t... We were faking a lot of stuff. But, y''know, whatever. We did what we could do. [Danny] Was that hard? You mentioned the "Quick Time" stuff, earlier. Was it difficult to...? I mean, if you''re doing a game that has those cinematic moments, there''s no way around that, right? You kind of need to have... Especially if you''re having a fistfight at the end, or somebody points a gun in your face... I guess, at that time, it was a particular era of people not liking Quick Time stuff? Do you remember, from a design perspective, was it tricky to implement them in ways that felt good? [David] I think we were, again, kind of going: "Well, we want you to have this moment, we know we don''t want to have to "generate a bunch of mechanics for these things. It''ll be too expensive. "And we want it to look a certain way, so let''s try this. "Let''s see if it works." And then I think we just started to put them into various places and some worked better than others. But there were definitely people on the team who were like... And I might''ve even, internally, I''m like, "I don''t think Quick Time Events..." But I do think they accomplished what they were there to do, in the same way that the jet mission accomplished what it was there to do. But, yeah, I mean there are a million people that are gonna tell me "BF3 is terrible." And, y''know, they''re entitled to their opinion. There''s a lot of stuff I don''t like about it, and that I would change now. So I get it, too. (Smash) (Gunfire) [David] BF3''s funny, because my second daughter was born I think about, maybe a year into BF3, or so? And she didn''t sleep, she had colic for nine months, or a year, and I was working all the time. So – I''m serious – I don''t remember probably 18 months of my life, at all because when you don''t sleep, you just... That time is gone, kind of. And I was sleeping maybe three hours a night, if I was lucky, for nine months. And so I don''t remember much of the project. So, when we released the game, I was just like, "Okay." I mean, I was incapable of processing. And I didn''t feel good about it at all, at the time. [Danny] Right. [David] Because I didn''t really enjoy playing it, personally. I didn''t enjoy playing the single-player, and that''s always my main metric for... to feel proud of this thing – even though I was proud of what the team had accomplished, and proud that we did it, because it was an incredible amount of work. But, yeah, at the time I was like, "I dunno, we did the best we could." I knew multiplayer was great, that was never gonna be a question. We took a lot of heat for single-player, for any number of different reasons. So I never felt great about it, or even good about it, for a long time. And I kinda forgot about it, honestly. I didn''t think about it again, probably after the initial release, for a long time. And then, recently, all this revival stuff kinda made me look at it. And I was like, "Actually, we did a lot of cool stuff." Even if some people didn''t dig it, a lot of people did, and that made me feel pretty good even though it''s 11 or 12 years later. Whatever it is, 14 years later. I look at it now and I''m proud that we did it. I think there''s a lot of good stuff there. I think that''s why people, maybe, are the way they are about it now ''cos you can kind of see it, through the lens of history, a little bit better. That maybe, it didn''t do everything right, but there''s great stuff I think, obviously, in multiplayer. The single-player had an influence over the entirety of the game that mattered, and, whether or not you were down with the campaign, that tone was very important to the image of BF. I think it''s up there. For me, BC2 is still my favorite, though. (Ident clicks) (Click)'
