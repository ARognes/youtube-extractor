transcript: 'Hi! [HELEN HINDPERE] Hello! (ALEKSANDER GROWLS PLAYFULLY) (Laughter) (Door opens) [HELEN] You remember? [ALEKSANDER] Of course! [HELEN] So... (Click) [HELEN] The sound engineering room used to be there. Also, some rooms were there. It''s just a hallway. This is where... Oh my god, look at it. (Chuckles) [HELEN] I don''t know what that is... But this is... (Laughter) Martin, we have been here... Erm... [DANNY] What was in there? [HELEN] So this was... [ALEKSANDER] It was the main room. [HELEN] Yeah, the main room where the artists were, erm... [ALEKSANDER] Programmers. Yeah. [HELEN] Programmers. Yeah. [ALEKSANDER] It''s ''cos we started there and then slowly expanded to take over the house... [HELEN] Took over the entire house. [ALEKSANDER] like a malignant, er, game tumor. (Chuckles) [HELEN] So, while it also started here, we were way too loud in our meetings. So we were banished to the completely different side. This is, basically, a different building they built together, but it''s actually completely different from it. Oh! [unintelligible] [ROBERT KURVITZ] This is the actual commons area of the studio where people smoked and drank coffee and stuff like that. ("Detective Arriving on the Scene" - Sea Power) [DANNY O''DWYER] When production on Disco Elysium began, the studio''s location poetically mirrored the team that was making it: Two partially dilapidated buildings in the centre of Tallinn''s historic old town, merged together through a system of broken walls, interior stairwells, and a roof that connected the two. It was here in this building, that work on No Truce With The Furies – the game''s original moniker – began. But by the end of production much of the team would be separated by land, sea, and for many, a wider emotional distance. Over the course of this series, we''ll explore the work of those people – the ones we talked to and the ones we didn''t – in an effort to capture how this team of debutantes went on to make one of the most beloved games of our era. In this video, the second in our series, we''re gonna explore the work that went into building Disco Elysium. The team that Robert surrounded himself with, the engineers and tech artists that brought Rostov''s paintings to life, the production processes the team used to construct the city of Revachol and the district of Martinaise. In our first episode, we talked about how life in Estonia had influenced the game''s creators. Today, we''ll demonstrate how the very walls of this building impacted the design of Elysium itself... [ROBERT] The office was the first thing we did. I think, after the pitch document, where the concept art came together, after that we got the office, and we got... at that time it was me, Rostov, Jüri Saks, Martin Luiga, and we got a producer called Lembit Jürgenson who became the Lead Producer on Disco Elysium for the first four years or so, And he lived in this hippie commune place, and I was always visiting him – which I did a lot, because it was a cool place to visit. And there was this large area there that was used as a gallery or an art gallery, that later turned into the studio premises, and I always thought that would be a very cool place to do something in. And he took it upon himself to build us this physical space. So that was Lembit''s first gift to the production. He got IKEA stuff from Helsinki, at that time. We still didn''t have IKEA in Tallinn. We put the tables down and everything. It just looked really cozy, and inspiring, and nice. So we had this fortress now, that we could... Our pillow fort. Is that so they say? And then, yeah, there we kind of... Even before we... waiting for the miracle of investment, we basically developed the entire concept for it. And then a lot of the questlines and also the story for the Cryptozoologists and the hanged man, and all of this, that was just one of the 40 ideas for cases that you could... Murder mysteries you could undertake as this police officer, basically. That was the first people who were in the team and then I think Siim Raidma came along – the big technical wizard on Disco Elysium. So already, before it, just for almost no money we''d been able to build a little visual prototype where light was moving around and we had this painterly background so it looked really, really promising, I think. And then Rostov and Siim kinda formed this dream team of pre-rendered isometric graphics. [SIIM RAIDMA] It wasn''t as much of a hiring process as a, "Hey, there''s some friends I know making a video game... "Do you wanna join in?" I was the first person ever to have touched a games engine in the ZA/UM studio history. Pretty much the first day I come into the studio, I get presented with, "Check out this rad new game. It looks amazing, "and we wanna look better than this game..." And the game was Pillars of Eternity. [ALEKSANDER] I figured that stuff out with Siim Raidma. He''s the Technical Artist. The Obsidian guys were just doing their great comeback game, Pillars of Eternity. Basically, we saw how they made the modern isometric game there. Ah! You render out these render passes of height maps and normal maps, and then you can use this to do the lighting and stuff, and we were like: "We should steal that!" (Laughter) [SIIM] I think it''d just launched on Kickstarter and it had a bunch of backer updates. And, basically, the first week we went through their vlog video number 79, frame by frame... That was the graphics update, "How we render stuff." "It''s a flat plane, and we make it three-dimensional with pixels and stuff." So we were excruciatingly going through that video and pretty much trying to make a cover band of Pillars of Eternity. Having a flat world and 3D characters and all the lighting is basically in shaders with some dynamic lights thrown in. I think we''d gotten most of it very early on. I had an absolutely great time trying to figure this thing out, like a puzzle box. [ROBERT] Then we got, at the time, a 3D modeler later Marketing Director, Mikk Metsnit. And, after a while, it became clear that he''s just the perfect guy to run the marketing side of things. And then I went to a programmer called Jaagup Irve, who we called "Irv", who''s a really respected guy in the Estonian nerd scene and he was the moderator or forum lord of a place called Dragon.de. And he was, at the time, a professor of coding at the Tallinn technical university. I knew we were going somewhere if we''re getting him on board because he knows a lot of technical personnel. And then Irv got a really good programmer called Markus Rondo. [JAAGUP IRVE] I think I was hired as Assistant Designer because of my Dungeons & Dragons background, that''s how I got to know Robert. There was this initial meeting, which I called the "pigeon shit" meeting because it was held in their studio in the attic. We sat own on some couches there and it was completely weird! (Chuckles) But they said that they were in the middle of financing a game, and soon they''ll have some green lights, and... It was really strange. You could feel the craziness of it all. [ROBERT] Here, you can see spooky mannequins. (Helen laughs) [ROBERT] A must-have element of every half-abandoned house. [HELEN] Some kind of PC that says "just do it." (Laughter) (A plane rumbles overhead) [ROBERT] As you can understand, the snaking, internal architecture... I think it actually did inspire Whirling-in-Rags a bit. Like, these hidden pathways that you can take through the whole case. [HELEN] This was the smoking corner. (Laughs) And coffee corner. It''s quite interesting, how it''s super secluded. Yeah. You can also come in from this window. [ROBERT] Yeah... [ROBERT] And if now go in from this window and then go down, then you find yourself at the studio again. [HELEN] Yes (laughs). [ROBERT] In this really cool level design twist. [HELEN] Yeah. [ROBERT] Well, there''s about two months a year that you can sit out here, and this is one of those months again right now. [ALEKSANDER] It''s fortunate timing. [ROBERT] See? This happens for about four hours a year. [HELEN] Yeah, sun comes out. (Tense guitar plucks) [DANNY] The Disco Elysium team was slowly forming, with the help of talented programmers eager to test themselves in the world of games development. But this team was far from built. Disco Elysium was a game with story at its heart, but Robert''s singular perspective could only add so much. And so, to pump blood around the body of this Frankenstein-like creation, he would have to surround himself with a cabal of talented writers. [ARGO TUULIK] In 2016, I had this first serious sit down with Robert, where he said, "Okay, now we have money, do you want to come and work for us?" And in the end of 2016, in October, I had just come back from a vacation in the BMW junkyard that I was working on – scrapyard – and Lemps [Lembit Jürgenson] our producer, called and said: "Hey, do you wanna come write a game with us?" And yeah, it was a no-brainer. Me, Helen, and Martin, we joined. All of us. The first thing we did on day one, we came to the office and we played this really, really early build. I think I will forever remember this moment of this insane disbelief and pride. I cannot believe that my friends, with whom we dropped out of so many high schools, managed to put this together – because already there, in this raw state, it really felt like this is the next step. This is definitely an RPG, but it''s an RPG done different. [HELEN] I remember when Robert and Rostov first approached me because we had done blocked plot together and we had contributed elsewhere, but it had always been in Estonian. So when they first approached me I was like, "I don’t know if I can do it, but I can try." And then the entire first year I was like, "I''m not sure if I’m actually doing it. It’s not working out as I want it to." [ARGO] Every writer was handed a scene they were writing on. For all of us, myself, Helen and Martin, we all had a test character, a test scene. and weirdly enough they all ended up good enough to be in the final game. For me, it was René and Gaston, the guys who play pétanque. Martin did Tommy, the poetic truck driver, and Helen’s was the working class woman. [MÄRTEN RATTASEPP] I think maybe nine, 10, 11-ish, if I remember correctly... Several people had been there for, at least, six to nine months. The notable name Martin Luiga, who has been related to this project. As I remember, as I was told at the time, some type of a conflict or misunderstanding had happened between him and Robert Kurvitz over the summer, and I think basically Luiga absconded with the work laptop and just never came to work again. [DANNY] We reached out to many of the original team to talk to us, but Martin was not available to chat. His contributions to the original D&D campaign, the early worldbuilding, – including these wonderful concept images of Martinaise – were foundational in helping the team paint the portrait of this game. [DANNY] This might be a sensitive topic as well... So we can completely brush over it if that’s the case. Is it Martin who had a particularly difficult time with…? [ROBERT] Yeah. Yeah, we’ve all had a particularly difficult time in our different ways, and it hasn’t been good for any of us. But yeah, I think Martin’s stuff is so personal to him that I don’t feel like speaking on his behalf. [MÄRTIN] So that’s what I was told, and then several months later it''s like: "Okay, we’re getting new funding, we’re getting new writers. "Let’s get this project going.” But yeah, I think was like 10-ish people. The programmers who were there before me. Some artists and a couple of other folks. [ROBERT] So that was the crew we’d gotten together. And then there was another programmer called Veljo Hagu, and also he did a lot of movement programming in the beginning. And I think that was it. We had those two programmers and we had that 700,000. And we were on track to make The Return, this giant version of the game. And then Veljo comes to me: “You do understand, of course, that there isn’t going to be any combat in this game.” I was like, “Why?” “''Cos we only have two programmers. Y''know? 700,000’s not gonna... "It’s nice that we got that money and it’s a huge achievement, Robert. "But the team you have is not going to code you a combat system.” And I was like, “Okay. Then we won’t have combat.” And about a week later, I came to him and said: “Can''t we just do all of the combative stuff with just dice rolls and dialogue?” And he was like, “Yeah, that makes sense.” And then I remember one night, I went to sleep with a task, and the task was: “Robert, cut the story down from The Return, this huge thing, to a very small solid thing.” And I remember the other side of my brain being like: “Robert, I’m tired. I don’t wanna do that today. How am I gonna do it?” And it was, “No, no. This is irresponsible. "You can’t continue going on with this huge plan. "You need to have something that people can start working on tomorrow.” And in about 30 minutes my brain was like, “Okay.” And then I had an idea for a pen-and-paper session with the people in the studio to kind of introduce the world to them. And then I had this alcoholic cop thing, and so on.  So I was like: “Okay, well let’s just turn that into the game.” I had Harry and Kim Kitsuragi, and these characters were already... So it was also supposed to be a pen-and-paper campaign, basically, for the video game studio to get people into the setting. I was like, I’m not gonna ever have time to run pen-and-paper campaigns again. I know that this joke works. This stupid disco cop joke is gonna be okay enough. So I came to work and I just explained to everyone what it’s gonna be like and people were like (chuckles). It elicited a small laugh out of people, and it was like, “Okay, let’s do this.” [JAAGUP] After the Whirling demo and the waking up demo, that happened after we had cut down the scope. And that was the most important thing that Veljo did, I think. He said, “Your plans are way, way too large. "This will never happen if you did it like that, "we need to cut combat and make the game small.” [SIIM] I guess a fun insight is that the whole of Disco Elysium is a vertical slice of a much bigger game. There was a massive reduction in scope, which was… I remember the lunch we went to, we were just talking, “So let’s try to do something more contained. "See if we can build it up as an actual game and then do the rest of the game.” And that boxed in little corner of Martinaise ended up being Disco Elysium. [DANNY] Was this type of art here before? [ALL] Yeah. Yes. [ROBERT] It''s run by hippies. Real hippies. [DANNY] Right? Drum, yoga, peace pipe. And yeah, I’ve grown to really like this over time. [Helen] So, all over the place are like this here. [ROBERT] "Dream Catchers". [HELEN] Yeah. Dream catchers are things that say that, “Being angry, it’s poison for yourself. You''re poisoning yourself.” So every time things got heated up we were like... yeah. (Laughter) [Robert] By the way, this was my office in here. [HELEN] Yes. Right in here. It’s a very, very small 2 x 2 meter cell, I would say, here. [ROBERT] Where I wrote about… Well, too many words. But I needed to be secluded from other people so they don’t ask me questions all the time. [Danny] Right. [ROBERT] So this was the solution we found. The writers room was there, and everyone else was somewhere there. Here there was a big boxing bag you can beat. [HELEN] It still is! [ROBERT] Still is, thank god. [ROBERT] Yes. [ALEKSANDER] Ah, the gym! [HELEN] So this inspired the doomed commercial area’s gym, this area here. [JAAGUP] I had the feeling that the whole environment was actually part of what we were. Some of us like to clean, some of us left their coffee stuff in the machine. "Okay, someone else will take care of it." It was an easygoing thing. There were hippies before us; there were hippies after us. I think Robert had worded it… There was some "namaste" that they had to take out of these rooms before we could enter. And some of it remained (chuckles). [ARGO] Yeah, it was just perfect. Perfect in its location and in its state of decay. If we had had some kind of modern white surfaces, minimalism, water-fountain-in-the-hallway type of studio, I don''t know how it would have shaped us. It was so inspiring. It just added to the creativity. Already, because no one in Estonia had made a game before – at least a game that would have popped up on anyone’s radar – the general opinions that we got when people heard we were making a video game, was this, “Oh no, no, that’s not gonna work.” And also, now working in this derelict building where water leaks into the server room, and it’s so cold in the winter you have to wear jackets and gloves, this really helped to build this “us against the world” vibe, this unity. "Guys, against all odds, we are gonna do this." [Helen] I think it was quite free-spirited and un-corporate, but also maybe slightly chaotic. But I loved it. I think I’m a person who works very well in those environments, where there is no strict hours where you work, when you work. We came to the studio at 11am, which is super late for every other place, and quite often I would stay late, just because I felt really comfortable in the beginning, there. It became almost like a second home. I also remember some evenings where me and Argo would just like.. . It was Friday evening, we were like, "Oh, let’s just keep hanging out in the studio." And like... As friends, let’s hang out here. It was also in the middle of the city, so even when I was going out to a bar I would sometimes just crash in the studio. (Laughs) Over there is FRANK. That is the café-slash-restaurant bar "bistroraunt" where I sketched and painted the skill portraits. [SIIM] I was kind of the technical right-hand man for Rostov. Like, literally, I was right next to him. Rostov is an incredibly technical artist. Not a “Technical Artist”, but he’s a massive nerd. He’s been modding games and doing stuff in Blender for ages. So he''s not just a painter who paints with actual oil paints, but is technically very, very savvy. So, in the beginning, he was doing a lot of modeling as well – level layouts and stuff in Blender – so communication is super easy and everything gets done really quickly. [JAAGUP] I think, for the first year, occasionally people would come to the office and say: "Holy crap, we''re making a computer game!" It was... "We''re actually doing this! I can''t believe it!" And everyone had the drive of "Okay, this is real." (Laughs) And while the house was slowly crumbling... I remember, there is this furnace which has stuff written on it. That furnace was an actual furnace because we lacked a whiteboard. "Hey, we could use that furnace as a whiteboard." And then it made it into the doomed commercial space, so there was some self-basement, I guess, from the studio. [HELEN] There was the video game studio that we had in the same building. There was a bookstore, there was a tattoo shop. And also, previously, there had been an art gallery. So many different things. And at the same time, the house itself, our studio was almost like this labyrinth. This mystery. So we wanted to put that into the game, and this is what inspired the doomed commercial area. [SIIM] In the old studio, we basically had three rooms: There was the artists'' room, there was the programmers'' room, and the writers'' room. I''m not really sure if it''s a good or a bad thing, because it kind of siloed communication. It didn''t "silo", but it slowed communication between the teams. But it kind of also created a safe space, for example, for the programmers to get angry about a systemS thing that Robert came up with, and then build-up enough motivation to go and confront him about it. Studio architecture has a role to play in team dynamics. [ARGO] The writers'' room had these only one-layer windows with a couple of cracks in it, so it was really freezing when it was -18°c outside. What we did was, we isolated, used silicone and duct tape, to basically air-proof these windows as much as we possibly could. But still it wasn’t enough, so eventually we brought in a gas burner to heat the writers'' room. I remember one time when it was me, Helen and Kosmos [Siim Sinamäe]. We were in the writers room. We left Kosmos to work on something, and went across the street – not to the strip club, but next to it was a New Age shop where we went to get some dream catchers or some shit like that – and we were gone for like 45 minutes. And when we got back the gas burner had burned out so much oxygen that Kosmos was on this… Not fully conscious anymore. I think if we had been half an hour more, we wouldn’t have Kosmos anymore. This is the level of decrepitude the building was in. [JAAGUP] I think Lembit, he was the producer for us, and he took care of the environment. He made this very random space into a random but somewhat orderly thing. No task was below him. A toilet got clogged, he’d deal with it. He managed all the infrastructure without anything. “I get paid, I’m fine.” He was really a great guy at that. [HELEN] We definitely worked a lot. I didn’t mind it in the beginning, because I felt like I had such a huge learning curve, with learning to write in English, learning to write video games, it just felt justified. There was also this entire idea that, once we finished the game, and if it does well there would be bonuses, and shares will be shared with anyone. Shared with the company. So it felt like we were working towards a goal. I think I definitely see the Tallinn studio time as almost this kind of mythical childhood. (Laughs) Maybe I overanalyze it, it tends to happen with the past. But I definitely was happy, then. [ROBERT] These places that always get wiped out. One moment you come and then there’s a hole in the ground. Or there’s been a change of guard and the hippies are out, and now it’s all white, millennial white, or a hotel that’s been attempted here, or something. So it’s really, really good that you got to record it while it is still here. [ALEKSANDER] So many other places have been wiped out and bulldozed over and new buildings built, and stuff… [ROBERT] It''s so important for the game, to kind of... [HELEN] ''Cos I think only one journalist has been here. I don’t remember for what magazine, but there was some photos taken. This was even before the release. [ROBERT] This was an amateur journalist for RPG Codex. The first piece of press or the first story ever made about Disco Elysium was made by RPG Codex. They were very encouraging in the first two/three years when we made the game. There was a topic about Disco Elysium there, and it gave us the minimum feedback required for you to feel that there’s an audience. And then they were the first people who reacted to the idea of the speaking skills, as in, “Whoa, that’s a cool idea!" And really, really encouraged us. The entire church, speed freaks sequence took me about three weeks to write. So everything you do out there, with all the tent discussions and Acele and so on, that church was the vertical slice of the game that we did first, and then we did the beginning of the game in order to sell it to investors and prove that it’s gonna work. And for journalists and publicity. (Soft ambience) [DANNY] The original vertical slice of Disco Elysium was set around the church. (We''ll dive more into that in our episode focused on writing.) But as the writing team was getting to grips with the universe of Elysium, and decisions over gameplay were being solidified, the programmers were crafting engine, gameplay and interface systems to make Robert and Rostov’s vision of the game even possible. Disco Elysium as a piece of software does an incredible job at matching the tone and artistry of the world: camera movements, UI widgets, menus, skill systems, The Thought Cabinet, weather effects and sound management all contribute. But this remarkable work on behalf of the programmers didn’t come easy. Disco Elysium was always under pressure by incoming release dates – which were thankfully kicked down the road on several occasions. [ROBERT] What was good about the project was that, about nine months in, we got a demo which was the beginning of the game. And it was pretty fun. Waking up as that character, everyone liked playing it. That was an ace in our hole that we had about 40 minutes or 50 minutes of gameplay that just felt like, “Okay. Insert more money, you’ll get a good game out of it.” Another good thing we had was, we had this story outline and it felt compact enough so that it’s kind of doable, but at the same time large enough to… – this is one of the things we always fought about – to classify as an RPG, or even as a "major" RPG. Which is a weird to thing to say about it, but like, something that would launch an RPG studio, something that would have 40 hours of gameplay. That was very good. The skill system was very good right from the beginning. The speaking skills which very quickly came out of the very first dialogues that I had written for the game. It was just natural for the skills to be characters too. There was no... And people reacted to it very well. I think the first dialogue was with Acele on the ice. It was a test dialogue to have a little bit of church. And the first moment where I realized they should speak is when Encyclopedia tells you about Contact Mike. There’s a contact microphone and then encyclopedia says: “By the way, there’s a boxer called Contact Mike.” And then you ask it: "Any news on my own name?" And he says: "None." And that''s where the first dialogue between your skills happens, this side-dialogue from talking to Acele. And everyone just reacted very, very... It was catnip. Everyone was, "Oh, that''s super funny." [JAAGUP] A lot of the design came from what Robert wanted. And I think the storyboard was communicating that pretty exactly. We would have discussions over skill names and how this would go, but I think this was something  that Robert just handled. He wanted it in a certain way, and we were figuring it out. Disco''s production wasn''t very cursed. I''ve observed people being in cursed productions and it''s really, really bad. Disco didn''t feel cursed. It was cursed in other manners, but it didn''t feel cursed when you were inside of it. But the small curse was that the deadline was always a year or a half away from where you were. [ROBERT] We had the skill system, and we had the confidence that this works. That it''s a sticky thing, and that the story works together, and the beginning works and the character works. So it was just enough for us to continue digging the money hole, and the money hole was just getting deeper and deeper all the time. So the bad thing about the production was that we just ran out of money every nine months. And then we were just told, "You have to release at that time." And we never had anything. It would''ve been a disaster and a catastrophe and a tragedy if we would have had to release it. It was clear for everyone that the shape everything was in was always very bad. The game was always, always in a bad state. It was a drowning man. Unfinished dialogues. You''ve seen games in... We hadn''t made any before, so I was kind of shocked at how... A "work in progress" video game is one of the ugliest works in progress... (laughs) in all of existence. And then it was like this drowning man that always needed attention. So that was the bad side, that meant that the programmers never got to work out a calm architecture for the project. That they were always just doing quick fixes to get something out in seven months ... six months ... five months and counting. Another thing that worked really well was art. Rostov was just churning out these beautiful landscapes, so that was very inspiring. For a long time art was the "good boy" of production and that writing was the "bad boy" ''cos we were never ever finished with anything. What I would say became the main bad thing in production, was I slowly realized that it''s gonna have a word count which is perhaps best counted in Bibles, not words. And that I''m gonna have to write one Bible worth of text, and I''m gonna have to edit another Bible worth of text. That means it''s about 700,000. One Bible is about 700,000 words or so. And we kind of got it down to maybe 600(000), we were slightly able to cut corners. But because writing was the only gameplay, it meant that if we cut things out, it no longer is an RPG. So it needs to have these sidequests and stuff. That''s about the time when, thankfully, the core design of the game was so solid that I could move away from a designer role, and just become a writer, and all of the design and everything became writing. And the game never ended up having any other designers other than me and Rostov. Just the beginning little design that we got down, the Thought Cabinet and so on. So, the good thing was it was a very solid design, for a first-time designer. But I think that was because I''d designed these systems for ten years before, for pen-and-paper. And if they work on... It''s called a "paper prototype" in video games. If they work on paper as a boardgame, then they work in games too, hopefully. [DANNY] As Siim mentioned to us earlier, the team was largely split into three "rooms" for much of the original development of Disco Elysium, and in the next three episodes, we will focus on those three rooms: First, the writing team – the work of Robert, Helen, Argo, and Martin, who you''ve met, and many others we''ve not mentioned yet up until this point. Then we move on to Art. The work done by Aleksander Rostov, Kaspar Tamsalu, Siim Raidma, and other artists and animators, to bring this world to life. And finally, we''ll talk about the final push to complete the game. The engineers who worked to finish the team''s first game, and what happened when the team split apart in the months leading up to, and after, launch. As ever, Early Access Patrons can watch this right now over on the NoClip Patreon. And all of our Patrons can watch this wonderful bonus scene where the team opens up a suitcase full of art made by fans in China. [ALEKSANDER] Oh my god! [ROBERT] Wow! [HELEN] That''s really good! [ROBERT] That''s cool! [ROBERT] So we didn''t get money. We didn''t get the IP. But we did get 30 kilograms of Chinese love. (Laughter) [Helen] Honestly worth it! [DANNY] These bonuses are our way of thanking you for supporting us telling these types of stories. Stories about the people behind the games, and sometimes, even the buildings they called home... [ROBERT] This studio, it still has the ZA/UM logo on it. I''m gonna eat... One moment. (Laughter) It used to have a giant poster that I made, that said: "Creators of the most advanced role playing system in the known universe." (Laughs) ''Cos I wanted everyone to get pumped up everytime they come to work. And then the programmers edited it. Struck something through and so on. So in the end it was "creators... " – attempters of the ... most untested roleplaying system in the known universe." So that was the kind of level of "epicness" that they wanted to experience when they came to work. Which I understand now. (Laughter) [ROBERT] It''s much calmer. But I also prefer it. (Bass synth playing "Blue Monday" by New Order) [ROBERT] Yeah, it''s er... "Agile" was introduced to the production by Lembit Jürgenson, the Lead Producer, about a year in or two years in. He brought a "scrum master" who told us how to do it, how to be Silicon Valley people, And then we just adopted it, and yeah, we made it our own. It worked. It was not as punk or chaotic as would befit the legend. It wouldn''t have come together at all. So yeah, thanks for Lembit for teaching us scrum. We really just threw a ball. We had the scrum ball that we held onto. And we said our magic scrum words, and so on. I liked the ball. I liked holding onto the soft ball. We had a really cute scrum ball. (Soaring synth sounds) (Ident clicks) (Click)'
