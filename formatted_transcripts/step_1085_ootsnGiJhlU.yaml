transcript: if you want to increase your productivity by up to 400% you need to spend less time on New Year's resolutions and daily to-do this and instead focus on weekly plans and quarterly goals the reason you should use quarterly goals is because it's a much more reasonable time frame looking at what you can do in 3 months is much easier than looking at what you can do in a year usually when you make a New Year's resolution you either overestimate what you can do and fall short or you underestimate what you can do even though you accomplish your goal there's still a lot of extra room you could have accomplished even more by setting quarterly goals it gives you more practice at this time estimation and also it's easier to estimate what you can do in 3 months as opposed to 12 months also this gives you more chances to accomplish things since if you say okay my New Year's resolution is to get in shape you could just make that a quarterly goal and now in the span of 3 months you can focus on getting in shape and now for the next 3 months after that you can focus on something entirely different this is a great way to be able to scale what you're doing and focus on different things in different periods now the reason weekly planning is so important is it allows you to actually focus on accomplishing larger term goals like your quarterly goals because now you have a whole week where you can plan out what you do on each of your different days daily plans are great for getting things done that take an hour 2 hours 3 hours but as soon as you want to do larger form goals it's much harder to fit them in a daily plan this is where weekly plans come in because it allows you to fill out your entire week with all the different things you want to accomplish working towards those quarterly goals so combining together weekly plans with quarterly goals allows you to really work and focus on these larger term plans for your life as opposed to daily plans which really only focus on individual tasks this is actually the exact same process I use that helped me balance working a full-time job while creating YouTube content courses and so on because doing that all without any planning would have been impossible
