tand you go you look it up in the documentation you read about it that way you kind of just learn by doing and I think that's a very important point I am not somebody and I doubt you are either someone that can just read through pages upon pages of what the language does and then boom look at that I can program because I'm amazing at it no that's just usually not how it works usually we learn with our hands more than we learn with our eyes and we just go in there and we have to kind of program through a bunch of problems to pick everything up the second reason why I really love Advent of code which I strongly suggest you do this is that there's a bunch of problems here right I only go so far in Advent of code okay I don't like to go all the way up it gets very tedious but as you go through this tons of people have either solved the problem or are going to solve it with you so you can actually like ask questions you can bounce answers off of you can code review other people's Solutions people write blogs about it there's just a lot of available information about solving these problems specifically in the language you're looking for so you'll get like just a bunch of experience right away so the second one I like to do is a websocket server I think this is super important and I really really enjoy kind of this phase of the learning process because I usually build something super simple a chat room client that takes connections someone says join and a string someone says leave and the string or they send message string which is the room of the or the name of the room and then the message they want to send to everyone in that room it gives me the ability to hold on to sockets how do we do sockets what does the API or the standard actually provide to you in here versus what kind of third-party libraries are there out there really gives you a good idea of what the ecosystem is how modules work in the language and the best part which is how does it handle async is there Primitives around it do you just have to use threads like how do you actually work with async in the language then my third goal is usually to build like a larger project something that's going to make me exercise a lot of patterns and try to build something that has to maintain itself with lots of lines of code because often you'll start finding weird chinks in the armor how how how memory is stored how the you know the borrow Checker Works how how bad are your ideas around it right it has to get to a certain level before you can really feel the language out and so for the third one I really like a good project and so for my recent kind of Endeavors into Zig I've chosen to build out an interpreter this interpreter right here fantastic book thorsten Paul but why I chose that is that I'm actually going to build The Interpreter in typescript then in Rust and then finally in Zig so I can actually use the experience from languages that I'm good at into a language that I am bad at and I can try to draw similarities draw differences how Zig changes its handling of various things so let me actually give you kind of a good example of that if you're familiar with typescript building Alexa means you're going to come across all these tokens and you kind of have to create these little tokens so I have to define the token I'm going to go in here and based on all these different conditions I will return a token and at the end I also then have to check for these more programmatic cases because there's not a there's not a way you can express this all in one statement unless if you only use if and else's whereas with rust you can do a match statement in which I can express all these different things simply in the statement like look at this hey if it matches this statement I will then go through my identifier process whereas in typescript that's just a function that's really doing the exact same thing and the cool part is Zig actually has something very very similar to it you'll notice right here I can do almost the same thing I do in rut so I kind of get this cool parts of rust and Zig or as I get more of the ease of handling of typescript so kind of like a really cool interesting middle ground language and usually by the time I'm done with the project I have a pretty strong grasp for me to really know if I like a language I really do just have to build a few things and if you don't build a few things it's really hard to know how the language actually feels a lot of ideas seem great on paper but until you build something sufficiently large they're just ideas they're not actually concrete you don't actually know if they're good they're just whiteboard and so that's it that's how I just go about learning languages I'm going to apply this exact same principle here soon on Twitch with oh camel once I get done building out The Interpreter in these three languages and then I'll see can I still keep applying it even in languages that are very far outside of the languages I know oh camel being closest to rust but a very functional very different language my guess is yes it should not be that hard looking forward to it pretty dang excited about it oh I actually forgot the fourth step the fourth step of course is to press the like And subscribe you know it just works it makes you better I don't know why the name is the primogen
