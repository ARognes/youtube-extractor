transcript: |-
  After 2 years of work our very normal gardening game is finally out on Steam!

  Play it on Steam: https://store.steampowered.com/app/27...
  Or on Itch.io: https://sokpop.itch.io/grunn

  Grunn is a very normal gardening game that plunges you into a seemingly simple groundskeeping job in the depths of the Dutch countryside. You've been hired to work on a garden over the weekend. There's plenty to do: trim the grass, water the flowers, pick up trash, and of course enjoy the lovely scenery.

  Except… Most of your tools are missing. The owner isn't around. Going out after dark is forbidden. And no matter where you go, you can't escape the sense you're being watched.

  You have until Monday. Good luck!
