 the sticker team, let me tell you how this went. Back in the day, people were. Able to get. This Superstonic baseball team sticker and this James Webb Space Telescope team sticker. You can't get those anymore because those were people that supported on patron the last couple of years. Check out this year's sticker. It's the smarter everyday exploration team. And I love these stickers so much. It's my old helicopter helmet, and I think they're awesome. I spent a lot of time thinking about the size of the stickers because I want it to be just big enough where you might want to put it on a water bottle or a door or something like that, like a laptop, but not too big that it's just overwhelming whatever you're putting it on. So I spend a lot of time thinking about the size of these stickers. I hope you like it. I've got a little bonus sticker I'm going to put in there, too. I'm not going to tell you what that one is. But to everybody that supports on patron at patron. com/smartereveryday, this is my way of saying thank you for sticking with me. And of course, if you've just now started supporting, I'm going to send you the baseball as well. Patron.com/smartereveryday I'm so grateful that you would consider doing that because my goal is making authentic content on the Internet while all the while pushing off the increasing pressure to make sensational content. That's not what I want to do. So thank you so much for considering that. That's patron.com/smartereveryday. That's it. I hope you enjoyed this video. Thank you for emotionally supporting me. I'm grateful. I don't take it for granted. That's it. I'm Destin. You're getting Smarter Every Day. Have a good one. Bye.
