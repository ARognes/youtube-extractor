transcript: '{"content":"\n[15.509s] In the 1st century AD, the Greek orator and\nphilosopher Dio Chrysostom wrote:\n[26.07s] “Luxury makes pains seem even harder, and\ndulls and weakens one’s pleasures.\n[32.72s] For the person who is always luxuriating and\nnever touches pain will end up unable to endure\n[38.059s] any pain at all, and also not able to feel\nany pleasure, not even the most intense.”\n[44.0s] Dio Chrysostom, Discourses\nIn the modern West we have access to pleasures,\n[48.16s] comforts, and entertainments which kings of\nold could not have dreamed of.\n[52.8s] But with all this luxury, many people are\nchronically stressed, anxious, depressed,\n[57.42s] or struggling with physical debilitations.\n[60.559s] In this video, we explore the intimate connection\nbetween pleasure and pain and examine why\n[66.409s] too many comforts and pleasures are contributing\nto modern man’s mental and physical malaise.\n[72.86s] In his book The Comfort Crisis, Michael Easter\nwrites:\n[76.26s] “We lack physical struggles…We have too\nmany ways to numb out, like comfort food,\n[82.34s] cigarettes, alcohol, pills, smartphones, and\nTV…we don’t have to deal with discomforts\n[87.84s] like working for our food, moving hard and\nheavy each day, feeling deep hunger, and being\n[93.26s] exposed to the elements.\n[95.41s] But we do have to deal with the side effects\nof our comfort: long-term physical and mental\n[100.81s] health problems.”\n[101.92s] Michael Easter, The Comfort Crisis\nTo understand just how comfortable and pleasurable\n[106.439s] our lives are, we can contrast modern life\nto the realities our hunter gatherer ancestors\n[112.03s] faced for much of human history.\n[114.85s] On a near daily basis, our ancestors walked\nmiles to find water and forage food.\n[120.399s] They expended enormous amounts of energy bringing\ndown large mammals, and regularly engaged\n[125.759s] in persistence hunting which involved tracking\nand chasing prey until the animal collapsed\n[130.99s] in exhaustion.\n[131.99s] Once they made a kill, they would cut the\nanimal up and walk miles back to camp carrying\n[137.44s] massive pieces of raw meat.\n[140.14s] Or as Michael Easter wrote:\n[141.78s] “Before we figured out animal husbandry\nand crop cultivation we were “essentially\n[147.28s] professional athletes whose livelihood required\n[us] to be physically active.”\n[152.34s] Our ancestors didn’t “work out,” because\nnearly all of their waking hours were spent\n[157.03s] doing things that today we would classify\nas exercise…Studies show it was not uncommon\n[162.84s] for these hunters to run and walk more than\n25 miles in a day…The numbers suggest that\n[168.89s] our forefathers in just three-quarters of\na day logged more activity than most of us\n[173.98s] now do in a week or two.\n[176.15s] And they basically stayed at this activity\nlevel until they died.”\n[179.28s] Michael Easter, The Comfort Crisis\nAlong with intense physical activity, our\n[183.44s] ancestors endured mental stress without the\ncomforting panaceas of technology, drugs,\n[189.099s] processed foods, alcohol, and entertaining\ndistractions.\n[192.849s] They endured the elements of nature without\nmodern housing, air conditioning, or central\n[197.489s] heating, and they dealt with sickness and\ninfections without modern medicine.\n[202.319s] As their lives were difficult, often uncomfortable,\nand sometimes outright painful, our ancestors\n[208.069s] evolved an instinctual drive to take full\nadvantage of the available comforts and pleasures.\n[213.78s] This drive was critical for their survival.\n[217.05s] Whenever possible they would rest and relax\nand through this comfort-seeking their minds\n[221.12s] and bodies would recover and find respite\nfrom the harsh realities of life.\n[226.12s] When rich food sources such as fatty meat,\nfruit, or honey were available, our ancestors\n[231.409s] would indulge to build up energy reserves,\nas they did not always know when their next\n[235.939s] meal would be.\n[237.439s] “…our original comforts were negligible\nand short-lived, at best.\n[243.43s] In an uncomfortable world, consistently seeking\na sliver of comfort helped us stay alive.”\n[248.78s] Michael Easter, The Comfort Crisis\nWhile we have inherited our ancestors’ drive\n[252.37s] for pleasure and comfort, this drive evolved\nin environments of scarcity, and now we live\n[258.22s] in comfortable environments of abundance.\n[260.38s] “The modern comforts and conveniences that\nnow most influence our daily experience—cars,\n[266.55s] computers, television, climate control, smartphones,\nultraprocessed food, and more—have been\n[272.96s] used by our species for about 100 years or\nless.\n[276.33s] That’s around 0.03 percent of the time we’ve\nwalked the earth…Constant comfort is a radically\n[282.889s] new thing for us humans.”\n[285.31s] Michael Easter, The Comfort Crisis\nWhile few would want to return to the harsh\n[289.19s] conditions of our ancestors, the modern world\nis presenting us with new challenges which\n[294.06s] stem from the fact that our drive for pleasure\nand comfort did not evolve an off-switch – it\n[299.55s] is practically insatiable.\n[301.99s] Living in environments of scarcity, our ancestors\ndid not face the risk of overindulging themselves\n[307.539s] to a detrimental degree.\n[309.85s] But in our brave new world of abundance, overindulgence\nis a constant threat.\n[314.89s] “We are cacti in the rain forest.”\n[317.4s] Dr. Tom Finucane\nOne of the dangers arising from the clash\n[322.49s] between our insatiable drive for comfort and\nour world teeming with comfort, is what Michael\n[328.33s] Easter calls comfort creep.\n[330.669s] Or as he explains:\n[332.009s] “When a new comfort is introduced, we adapt\nto it and our old comforts become unacceptable.\n[338.31s] Today’s comfort is tomorrow’s discomfort.\n[341.979s] This leads to a new level of what’s considered\ncomfortable…What’s more, new comforts\n[347.28s] have moved the goalpost further away from\nwhat we consider an acceptable level of discomfort.\n[353.52s] Each advancement shrinks our comfort zones.\n[356.78s] The critical point…is that this all occurs\nunconsciously.\n[360.61s] We are terrible at noticing that comfort creep\nis consuming us, and what it’s doing to\n[365.52s] us.”\n[367.4s] Comfort creep is most readily on display when\nit comes to physical comforts.\n[371.77s] As one example, due to the comforts of cars\nand delivery platforms which make it possible\n[376.8s] to obtain any product or service we want or\nneed without leaving home, increasing numbers\n[382.759s] of people are living a life of near total\nphysical inactivity.\n[387.3s] Or as Michael Easter notes: “27 percent\nof us don’t do any type of physical activity\n[393.18s] at all.\n[394.49s] Literally nothing—life as a sort of prolonged\nshuffle from bed to office chair to sofa to\n[400.77s] bed.”\n[401.81s] This physical comfort creep is a major cause\nof the growing epidemic of obesity and chronic\n[407.11s] physical ailments that arise from living an\ninactive life with a body which evolved to\n[412.52s] require high levels of activity to be healthy.\n[416.009s] “The human, simply put, was not designed\nto sit all day.”, explained researchers\n[421.53s] at the Mayo Clinic.\n[423.09s] Or as Easter writes:\n[424.259s] “In our pursuit of better living we’ve\nallowed comfort to calcify our natural movements\n[429.49s] and strengths.\n[431.169s] Without conscious discomfort and purposeful\nexercise—a forceful push against comfort\n[436.389s] creep—we’ll only continue to become weaker\nand sicker.”\n[439.53s] Dr. Tom Finucane\nAlong with the problem of comfort creep, modern\n[443.94s] pleasures are wreaking havoc on our mind and\nbody, as pain follows pleasure, like its shadow.\n[450.34s] In Dopamine Nation, the American psychiatrist\nAnne Lembke writes that “one of the most\n[456.29s] remarkable neuroscientific findings in the\npast century is that…pleasure and pain are\n[461.05s] processed in overlapping brain regions and\nwork via an opponent-process mechanism.\n[467.87s] Another way to say this is that pleasure and\npain work like a balance.”\n[472.69s] Our brain is wired to maintain this pleasure-pain\nbalance in a state of equilibrium, in which\n[478.349s] neither the experience of pleasure nor pain\npredominates for too long.\n[483.59s] Whenever there is a prolonged or excessive\nimbalance to the side of pleasure or the side\n[487.94s] of pain, self-regulating mechanisms in our\nbrain seek to re-establish equilibrium by\n[493.71s] tipping the scales in the opposite direction.\n[497.14s] When we overindulge in pleasure, for example,\nour brain follows our experience of pleasure\n[502.24s] with pain – be it physical pain or mental\nand emotional anguish.\n[507.289s] Lembke explains that:\n[508.58s] “I tend to imagine this self-regulating\nsystem as little gremlins hopping on the pain\n[513.899s] side of the balance to counteract the weight\non the pleasure side.\n[518.18s] The gremlins represent the work of homeostasis:\nthe tendency of any living system to maintain\n[524.43s] physiologic equilibrium.”\n[526.17s] Anne Lembke, Dopamine Nation\nOr as the philosopher Friedrich Nietzsche\n[528.93s] observed in an aphorism titled “The Goal\nof Science”:\n[532.91s] “What?\n[534.149s] The ultimate goal of science is to create\nthe most pleasure possible to man, and the\n[538.92s] least possible pain?\n[541.16s] But what if pleasure and pain should be so\nclosely connected that he who wants the greatest\n[545.899s] possible amount of the one must also have\nthe greatest possible amount of the other,\n[551.029s] that he who wants to experience the “heavenly\nhigh jubilation,” must also be ready to\n[555.91s] be “sorrowful unto death”?”\n[557.62s] Nietzsche, The Gay Science\nIf we habitually indulge in the same pleasures\n[562.079s] we develop tolerance, and through a process\ncalled “neuroadaptation”, our brain becomes\n[567.45s] overly sensitized to pain.\n[570.3s] Not only do we require more of a substance\nor stimulus to feel the same amount of pleasure,\n[575.63s] but the pain we experience following pleasure\nbecomes more severe, and longer lasting.\n[581.42s] If we are too intemperate, eventually we reach\na point where overindulgence in unhealthy\n[587.079s] food, pornography, video games, alcohol, drugs,\nor social media have tipped the scales to\n[592.491s] the side of pleasure for so long, and to such\nan extreme degree, that our pleasure-pain\n[597.959s] balance settles on the side of pain.\n[600.61s] When this happens, our drug of choice no longer\ngives us pleasure, but we are still driven\n[605.279s] to consume it to obtain temporary relief from\nenduring pain.\n[610.11s] For example, in a process called opioid-induced\nhyperalgesia, individuals experiencing pain\n[616.31s] who use opioids daily for over a month are\nat risk of developing a more intense pain\n[622.35s] condition than the one they were originally\ntreating.\n[626.55s] “Why?\n[628.11s] Because exposure to opioids [causes] their\nbrain to reset its pleasure-pain balance to\n[632.92s] the side of pain.”\n[634.0s] Anne Lembke, Dopamine Nation\nOr as Lembke explains regarding the effects\n[637.089s] of any pleasurable activity or substance we\nhabitually overindulge in:\n[641.93s] “The paradox is that hedonism, the pursuit\nof pleasure for its own sake, leads to anhedonia,\n[648.77s] which is the inability to enjoy pleasure of\nany kind…The relentless pursuit of pleasure\n[654.22s] (and avoidance of pain) leads to pain…When\nour balance is tilted to the pain side, we\n[660.029s] crave our drug just to feel normal (a level\nbalance).”\n[663.69s] Anne Lembke, Dopamine Nation\nThe good news is that we can reverse the enduring\n[667.459s] pain that arises from overindulgence through\nabstinence.\n[671.85s] Lembke notes that in her clinical experience\n4 weeks of abstaining from our drugs of choice\n[676.889s] is sufficient, and that following such abstinence\nwe regain the capacity to enjoy the simple\n[682.279s] pleasures of life which do not tip the scales\nso far towards pleasure that they create an\n[687.58s] aftershock of pain.\n[689.49s] “Recovery begins with abstinence.\n[693.639s] Abstinence resets the brain’s reward pathway\nand with it our capacity to take joy in simpler\n[699.01s] pleasures.”\n[700.01s] Anne Lembke, Dopamine Nation\nTo help us in our quest for abstinence, we\n[703.649s] can utilize what Lembke calls techniques of\nself-binding, which involve “intentionally\n[709.24s] and willingly [creating] barriers between\nourselves and our drug of choice in order\n[714.0s] to mitigate compulsive overconsumption.”\n[716.57s] (Anne Lembke, Dopamine Nation) Homer’s Odyssey\nprovides a mythological example of self-binding.\n[721.76s] In the realization that no man could resist\nthe seductive sounds of the Sirens, who lure\n[726.889s] men to death, Odysseus ordered his crew to\nput beeswax in their ears and to tie himself\n[732.529s] to the mast of his ship.\n[734.55s] Odysseus understood that when a compulsion\nfor pleasure overtakes us, we can lose the\n[739.519s] capacity for voluntary choice.\n[742.02s] And so, if we are struggling with consuming\nalcohol, drugs, or sugary foods, it is best\n[747.38s] not to keep any around and, if possible, create\nobstacles that make it harder for us to purchase\n[752.89s] them.\n[754.04s] With respect to digital drugs, we can restrict\nour consumption by setting a timer and only\n[759.029s] allowing ourselves to indulge for a certain\namount of time each day, or certain days of\n[763.92s] the week.\n[765.24s] This latter method of self-binding was recommended\nby Nietzsche as one of the most effective\n[769.86s] ways to stop compulsively overconsuming a\npleasure.\n[774.079s] In his aphorism titled “Self-mastery and\nModeration”, Nietzsche wrote:\n[778.589s] “…one can avoid opportunities for gratification\nof the drive [for pleasure], and through long\n[784.16s] and ever longer periods of non-gratification\nweaken it and make it wither away.\n[789.44s] Then, one can impose upon oneself strict regularity\nin its gratification: by thus imposing a rule\n[796.36s] upon the drive itself and enclosing its ebb\nand flow within firm time-boundaries, one\n[802.18s] has then gained intervals during which one\nis no longer troubled by it…”\n[806.56s] Nietzsche, The Dawn of Day\nOnce we have managed to cease overindulging\n[810.529s] in pleasure, to further improve our life we\ncan voluntarily seek out pain.\n[816.23s] For just as the pursuit of too much pleasure\nends in pain, partaking in healthy activities\n[821.69s] that involve temporary pain tips our pleasure-pain\nbalance toward a more enduring experience\n[828.389s] of pleasure.\n[829.77s] Or as Lembke explains:\n[831.25s] “Pain leads to pleasure by triggering the\nbody’s own regulating homeostatic mechanisms….\n[837.67s] With intermittent exposure to pain, our natural\nhedonic set point gets weighted to the side\n[843.259s] of pleasure, such that we become less vulnerable\nto pain and more able to feel pleasure over\n[849.64s] time.\n[850.64s] “\n[851.64s] Anne Lembke, Dopamine Nation\nAn obvious example of a healthy activity that\n[853.77s] exposes us to pain is physical exercise.\n[857.41s] Studies have shown that the positive mood\nthat flows from the temporary pain of physical\n[861.85s] exercise even reduces cravings for unhealthy\npleasures.\n[866.42s] Lembke notes that “high levels of physical\nactivity in junior high, high school, and\n[871.509s] early adulthood predict lower levels of drug\nuse.\n[875.779s] Exercise has also been shown to help those\nalready addicted to stop or cut back.”\n[881.25s] Lembke references studies which show that\ncold water immersion triggers the release\n[885.32s] of neurotransmitters which improve our mood\nfor hours after.\n[889.83s] Setting lofty goals and struggling each day\nto achieve them, or seeking out hard problems\n[895.06s] that involve mental, emotional, or physical\nstress, can also temporarily tip the scales\n[900.82s] towards pain in a way that makes us happier,\nhealthier, and more capable of feeling pleasure.\n[907.16s] “…the self-controlled lover of pain…lives\na life that is far more pleasurable than his\n[912.889s] opposite…one’s pleasures are both greater\nand less harmful whenever they occur with\n[919.12s] pain.”\n[921.029s] Dio Chrysostom, Discourses\nThe 4th century BC philosopher Diogenes the\n[926.72s] Cynic was such a firm believer that intentionally\nseeking pain was the key to a good life, that\n[932.47s] he spent his days looking for ways to make\nhimself uncomfortable.\n[937.08s] He rolled over hot sand in the heat of the\nsummer, and in the winter walked barefoot\n[941.47s] in the snow and embraced statues covered in\nice.\n[945.05s] He slept in a clay storage jar, which was\nreferred to as his “tub”, and he sought\n[949.93s] out emotional and psychological pain by intentionally\nevoking the ridicule of others.\n[955.72s] He lived frugally, consuming the simplest\nof foods and he sometimes went for extended\n[960.5s] periods of time without eating – a practice\ntoday we call intermittent fasting.\n[966.07s] Diogenes is recorded to have said that “Despising\npleasure is the greatest of pleasures.”,\n[972.389s] and he claimed that by voluntarily seeking\nout discomfort he was able to enjoy his tub\n[978.019s] far more than the Persian ruler Xerxes enjoyed\nhis palace.\n[982.949s] Many throughout history have labeled Diogenes\na mad man, but given we now know about the\n[988.139s] intimate connection between pleasure and pain,\nDiogenes was a man far ahead of his times.\n[994.06s] “It is not that I am mad, it is only that\nmy head is different from yours.”\n[998.86s] Diogenes the Cynic, Sayings and Anecdotes\nIn our world of abundance, in which an unbridled\n[1004.72s] pursuit of pleasure and comfort is crippling\nminds, weakening bodies, and making increasing\n[1011.079s] numbers of people highly susceptible to pain,\nwe would be wise to follow the example of\n[1016.69s] Diogenes and intentionally make our lives\na little more difficult, a little more uncomfortable,\n[1022.94s] a little more painful, so that paradoxically,\nwe maximize our strength, pleasure, and joy.\n[1029.929s] As Nietzsche put it, what we need is “a\nbit of Cynicism, a little bit of the tub”.\n[1035.78s] Or as the philosopher William Desmond wrote:\n[1039.459s] True pleasure, the Cynics often contend, can\nonly be had by scorning it and by welcoming\n[1044.93s] its opposite, pain.\n[1047.449s] There will always be pain, and so rather than\nescape it…one should grasp the serpent by\n[1052.2s] the neck (Stob. 3.1.98), put out the fire\nwith one’s tongue, rush into the fray fearlessly,\n[1057.919s] and fearlessly stare down the barking dog\n(D. Chr. 8.17–19): that is, one should welcome\n[1062.46s] pains as inevitable, love them…preparing\none for the pleasures of the satisfaction\n[1068.669s] that will come.\n[1070.5s] Ponos, as both “pain” and “labour”,\nbecomes the Cynics’ means for maximizing\n[1075.809s] his pleasure.\n[1077.2s] More paradoxically, pain is the cause of pleasure,\nand the Cynics are a strange breed of ascetic\n[1083.43s] hedonists, or hedonistic ascetics.\n[1085.82s] Or, rather, theirs is the hedonism of nature\nitself.\n[1096.82s] William Desmond, Cynics"}'
