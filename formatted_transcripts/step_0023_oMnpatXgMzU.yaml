transcript: I haven't traveled in about two and a half weeks, and it has been really nice. And actually, some of the questions you guys have this week lend themselves to answers that have occurred with me in the past couple of weeks. Um but the first couple I wanted to talk about, which is What Brian Peck wants to know if I've had any unique encounters flying or in traveling that are good stories. Um Years and years and years ago, my wife and I flew to London. Uh Oh, it was really nice. I I It was the peak of the show, like 2009 or something like that, 2010. And uh my We were going to London anyway, and I mentioned to Discovery that we were going to London, and they were like, "Hey, if you'll do some press." And they flew us out first class. It was spectacular. Um and Tom Waits was on our flight to London. I I You know, I've sat near Isabella Rossellini and some other famous people on planes. I have to say Tom Waits was the person I was most um He meant the most to me in my youth of anybody I've run across in the world. Tom Waits' music is so important to me, the full gamut of his of his output. He's an amazing performer. I did not go up to him. It was clear he did not feel like being approached, which totally fine. Uh I've seen him twice since then, and I still haven't gone up to him. >> [laughter] >> Um but I do have a really funny story about traveling. Last year, I was leaving San Francisco, and I was in terminal two. Terminal two's got the nice banh mi uh restaurant in it, right? Yeah, banh mi. So, I'm in terminal two, and I'm getting a banh mi, and I'm wearing my white Nostromo crew shirt, built by Adam Carolla. Um these are beautiful, made of linen, every detail on them is correct. They're just gorgeous. And sometimes I just wear them out in the world. And so I'm in the airport wearing this uh wearing the Nostromo crew shirt and I sort of racked focus to the family in front of me. And it is a mom and a dad and a son and a daughter. And clearly they're taking one of these kids off to college. It's clearly the son. He's taller than dad. Um and I love this tableau, right? They're flying to college. But what I then notice is that the little sister is wearing the Nostromo crew shirt that I'm wearing. And moreover, I know all three makers of Nostromo crew shirts over the past 20 years. And so I know precisely that she's wearing the same one I'm wearing. And I just think to myself I first of all I was like going to go, "Hey." And then I thought I'm just going to stand here. This situation will resolve itself. And they're like hanging out, they're talking. And then one Wait, they turn around and they see my shirt. They look up and they see me. >> [laughter] >> It was hilarious. Anticipating their reaction and it was twice as good as I imagined. They were delightful. They were in fact off to drop the son off at college. One of my favorite fan interactions ever. Um and then the second one that seems germane to this travel is Justin Matulonis wants to know, "Given all your traveling, do you have any tips for dealing with jet lag or do you have any other traveling tips hacks you discovered along the way?" Okay, I will talk about the stuff I've done in the past that does not work for me. It does not work for me to do things like try and stay up a lot to game my sleep patterns or to try and sleep None of that stuff has worked for me. None of like staying up too long >> [sighs and gasps] >> or trying to accommodate to the the future jet lag schedule, none of that has worked. At one point during the peak of MythBusters production, I had to fly to the Netherlands for like 5 days and my wife and I I actually went to my doctor and got a prescription for Ambien. Um and Ambien is a a sleep medication. It works in my experience so spectacularly it's like science fiction. I would take an Ambien pill and I'd close my eyes and then I'd sort of open them and be like that didn't work and it would be exactly precisely 7 hours to the minute later. It was like science fiction. Um and so we took Ambien to regulate our sleep schedules on our way to Amsterdam. And what I'll say is at the end of 5 days we certainly were function I was certainly functional at the moments I needed to be functional. But that trip wasn't any less harder on my body than any other trip. So like solving my sleep schedule made me no less miserable about the jet lag. So after all of these years I've been traveling somewhere close to 70, 80 to 100,000 flight miles per year for the past 20 years on average. I have a totally different approach approach to jet lag now which is I sleep when I'm tired. That sometimes can mean we'll be done with a shoot day and I'll go back to the hotel and crash right to sleep and wake up at like 1:00 a.m. Um that is part of my travel practice if it's necessary. Um and the sleeping when I'm tired, let me elaborate on that. Somewhere around 2013 I realized that my sleep schedule was really off and it was because I was on average getting about 6 and 1/2 hours a night and that worked through my 20s and through most of my 30s. But in my 30s on a vacation I realized that my body really wants 7 and 1/2 hours between 7 and 7 and 1/2. That feels I can operate for weeks weeks and weeks on that schedule. It's just great. And when I'm traveling, I keep track of my sleep. So, if I come back to the hotel and I crash from 6:00 to 1:00 a.m., I log that. That's 7 hours of sleep. I can stay up for the rest of the night. I'm fine for the following day. Uh not that I'm going to, but I may stay up for 5 or 6 hours. The real difference this has had is that I'm not stressing about not sleeping, which is not great for sleeping. I'm noticing as I as I try and keep the bank account of my sleep topped up, um I even know that for a 3- or 4-day period, I can do lack of sleep. I'll just have to get to refill it when I get back home. Also, when I have a lack of sleep, okay, let's see here. Uh I'm I made a list. Sleep when tired, that's one. Make sure I get 7 and 1/2 night uh 7 and 1/2 per night, yes. Augment with naps, totally. Um please remember, Kari Byron Tori and Jamie and I did a bunch of sleep study stuff, but Kari, Tori, and Grant did the meat did the meaty part of those stories, and they found that lying there quietly was like 90% as good as sleeping. Uh and I can't tell you how many people have come up to me over the years and say how much stress they have released from knowing that. Um and then the last thing to do with jet lag is to remind yourself you're you're flying, and the older you get, the harder it gets on your body, and the results sometimes aren't as physical as they are mental. So, whenever I'm traveling, I really remind myself all the time that my emotional fortitude is thinner because I'm tired. Mostly, just the fatigue of traveling, the pressurization of planes, the inconsistency of airport sign ins, all the things that stress you out. Um just lying there is mostly as good as as actually getting to sleep. Uh uh And then there's this one other thing that I do. And Robostus wanted to ask me to talk about Oh, no, no, no, no, sorry. That's a separate thing. So, Brian Baker, to go back to the jet lag thing and my meditation practice, says, "You've mentioned meditation in the Serenity Prayer. Do you use conscious breathing exercises or time breaks? How do you manage your frustration and disappointment when the mood doesn't allow for the creative process?" Oh, yeah. Um Speaking, yes. Um Yeah, hobby into a job. That's another one. Right, they're part of the same thing. Okay. So, my meditation practice is I've as I've said, Vipassana meditation. It is sitting with my eyes closed, with my back straight in a seated position, with my head sitting on top of my neck and I I sit and I relax my muscles through. I have also sometimes done guided meditations. Guided meditations, there's a million guided meditation apps on your phone, no matter which platform you have. They can be great. I have done many that I love. And frankly, there's a fascinating thing that happens in quieting your mind that when someone is speaking, you are occupying a lot of processing cycles just hearing them and that can be great for meditation. Um The my example is if you've ever watched the director's cut of Blade Runner when you were formerly familiar with the voiceover version and when you have no voiceover in Blade Runner and you're used to the voiceover version, I submit you see much more movie cuz when Deckard is talking at you while you're watching the cityscapes, you're mostly listening to him. And without his dialogue, I found I saw so much more of Blade Runner the first time I I it without the narration. Um The other thing is managing my frustration and disappointment. I've been dealing with this just this last couple of weeks. I've been saying all year long that I'm slightly over traveled and 2 and 1/2 weeks ago I came into the shop with no travel ahead of me for like a while and had stuff I wanted to do and I also had a list from Norm of stuff that I had filmed half of it not completed. And so I came in to start to knock those down and I knocked most of them off the list in the past couple of weeks. But also I did something to I will admit that 2 and 1/2 weeks ago when I came in here the shop was a real mess and I haven't cleaned it until this morning. And all of that was part of me just coming in here and sort of dealing with what I was tackling and taking care of the stuff that was on my list, but I was feeling very unsoothed and I needed something for me and there was this project that kept on tickling at me and I started messing with it. And so also in the last 2 weeks off camera I've been making Tin Tin's uh uh uh sorry, Tin Tin's uh uh fishing trawler the Sirius based on the John O. 88 boat built in 1936 in Belgium. Uh I bought this kit off of eBay. These kits are on eBay right now. They're about 200 250 bucks. They're great. They're great kits. Moreover, in some of those eBay auctions there is a build of this kit that is ah just gorgeous. So this this has all been off camera. I'll get to a certain level of detailing and then I'll film the painting and the internal deals detailing and lighting of this. But But just this this was all just soothing for me. Um and I'll go I'll go even further. It went It went very deep. I found other boats that were like it and made full-size copies of all of their decks so I could make sure I got the interiors right. I went and bought Red Rackham's Treasure, which is the boat that this is the book the book that this appears in. I separated out every single frame of the boat interior and exterior from the comic book. Over 80 separate shots in order to get all my details right. This is the kind of stuff that I find so soothing just to sit there with busy work to do in Photoshop and printing logging. I'll put these all into a slide sleeve so I can see everything and it'll be a fantastic reference. Also, some of the ILM model wrecks that came in here have been supplying me with correctly scaled stairs and ladders, of course. Um so this is how I do the self-soothing. And um the Great Brandino wanted to ask me about this, which is why I I had the stage nearby. Uh Great Brandino says, "You always hear don't turn your hobby into a job. Would you say that you're the exception to that rule?" No. Or it's not the best advice? I think it is fine advice. I think it's advice that says to pay attention between commerce and creative. You've got to pay attention cuz no one else is going to pay attention for you. And if all you're doing is commerce, creative suffers. And if all you're doing is creative, commerce suffers. And we live in this world and we have to deal with commerce. So I do think that don't turn your hobby into a job is can be terrific advice. Do I have a line? He They want to know between personal projects and projects on the channel. Um it's one that I find all the time. This one I didn't know that I had to build this off camera, but I really really did. I I I will tell you I spent an entire day cladding that boat feeling mildly guilty about it. Like I I I can't shake the feeling that I'm like doing this off camera. It's great stuff. It's good footage. It's hard to do. But I needed it to be personal. So, the line between what I do on the channel for myself and for the channel, it goes back and forth. I I mean, let's all Let's all recognize the sheer glee in my eyes and my face and my whole body during the entire Demoncorp build. That was clearly a build in which every last bit of my life was being serviced. The commerce, the creative, the technical problem-solving, all of it. Now, just like my face is a grinning joy the whole time that shoot. Those Those happen. They're not all They're not the They're not all of the builds, but um Listen, I I think don't turn your hobby into a job is less advice than a mental frame that can be useful. And if you think that you are not creative, >> [snorts] >> let's remove the the word creative from that equation and just talk about things that soothe you. You might not feel cre- You might tie flies for for fishing and you might not feel creative doing that cuz you're just fuck- You might be following somebody else's instructions, but there still is something happening in the in the operation between your eyes and your brain and your hands and the problem-solving that feeds the soul. Um and that is where that phrase points to. It points to the things that feed our soul and the things that might not feed our soul. Okay, that's I still haven't answered a single question from the chat. Let's see here. What do we got? >> [snorts] >> Want to ask me a question during a live stream? Become a tested member by clicking the join link right around [music] there somewhere. >> Mhm.
