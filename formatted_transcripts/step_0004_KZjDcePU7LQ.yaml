transcript: "Ethan Evans, a former Amazon VP who helped build Prime Video and Twitch, sits down with Steve to make the case that ignoring office politics doesn't make you above the game — it just means you're losing it quietly. \n\nHe breaks down how to spot manipulation, stop dumping problems on your manager, and ask for a raise or promotion without sounding selfish, then admits something most executives won't: everyone lies at work sometimes, and pretending otherwise is its own trap.\n\n\U0001F4D8 AI can write your code. It can't tell your story. Behavioral interviews are the new differentiator, and I wrote the book on them: https://geni.us/BehavioralInterview-yt\n\nGuest Links: \nhttps://www.ethanevans.com/\nhttps://levelupwithethanevans.substac...\n\nCHAPTERS:\n[0:00] \"I Lie, and I Hate It\"\n[1:03] Corporate Politics 101\n[3:53] Why \"Work Hard and Hope to Be Noticed\" Fails\n[6:42] Politics Is a Power Game Whether You Play or Not\n[8:09] Influence vs. Manipulation\n[18:04] Why Managers Go Bad\n[22:24] How Whole Management Chains Get Fired\n[25:01] Your Most Important Relationship at Work\n[28:48] Deciding When to Leave\n[32:08] The Bag Of Crap Rule\n[45:54] Pushing Back When AI Piles More Onto Your Plate\n[57:22] Executive Presence: Perception Is Reality\n[1:11:17] The Exact Words to Ask for a Raise or Promotion\n[1:26:59] Why Every Manager (and Employee) Lies"
