transcript: '(Ident clicks) (Orchestral music swells) (Click) [Danny] There''s no shortage of failed attempts to translate the magic of the silver screen to the world of video games. Which is probably why we all get so excited when a game comes out that captures the essence of its source material. I''m gonna start this one off with the type of lofty statement that I usually try and avoid. So here goes: Indiana Jones and the Great Circle is probably the most authentic video game adaptation of a film franchise in the history of gaming. It''s a game that feels like film canon. And in this documentary – the third in our series on the work of MachineGames – we''re gonna explore the depths of its design: From how a studio, famed for linear first-person shooters, created a game with vast levels to explore, where guns are barely used at all; how these open levels were filled with substantive activities; the craft that went in to capturing the cinematography of early Spielberg; and the terrific work of the cast, including the outstanding performance of video game actor Troy Baker. Quick heads up: This video is going to have some spoilers but we''ve actually put a lot of work into not showing most of the big reveals and surprises. In fact, there are a few particularly incredible set pieces and levels that we''ve omitted entirely, just in case some of you decided to check out the game after watching this. But before we dive into specifics, let''s first figure out how a studio – two games into a trilogy of Wolfenstein games – ended up fighting a ... familiar antagonist in a very different universe. (Fwoosh) (Final orchestral swell) (Playful percussion) [Jerk] To be honest, it was very simple. It was just Todd calling me on the phone and asking, "Do you want to...?" "Would you be willing to do an Indiana Jones game?" But, the more interesting part of it, is that he... Obviously, Todd Howard is a big Indiana Jones fan. He had had this idea of making an Indiana Jones game for a long time, over 10 years. And he''d had this idea, specifically, around the Great Circle. [Jim] Every year at QuakeCon, there is a party. And Todd Howard happens to be at this party, and he just casually mentions: "Would you like to work on an Indiana Jones game? "I think you guys would be an awesome fit. "Well, we''re talking to Disney, - if you get to choose" out of all the things that they''ve done, the one that fits us best is probably Indiana Jones. [Jerk] It was just that same week, then I just... I did that by myself, just wrote down, did a high-level concept, Just a small PowerPoint, "This is what the game should be about." And then he said, "Yeah, this is good." [Danny] It was never something that they were thinking about doing internally at [Bethesda Game Studios] Maryland, or...? [Jerk] I don''t think so. Maybe he... I don''t know if he had actually thought about it. I actually haven''t talked to him about this particular thing, but I don''t think he felt that the studio was the right studio for it considering the games they do are rather different. The games that we have done over the years showed him we would probably be a good fit for it. [Axel] Y''know, as many others within the studio, I''m an Indiana Jones fan and there is a power fantasy of, "Can we just make the ''80s "type of style Indiana Jones?" I, very early on, did my analysis in terms of looking at the old movies and trying to dissect what is core to the beginning of the Indiana Jones saga, and then trying to extrapolate that, and reshape that into something that could be a working premise, in terms of art bible and art direction. Going back to the basics, and looking at, "What do we love about this character?" But you can''t just do that, because you also need a super interesting story, and you need fantastic gameplay, and you need tech to drive all of this. But we always start with narrative. It comes down to fleshing out an interesting story to be told, and then trying to build out a world and an adventure around that narrative. [Jerk] So, what we did was, we sat down in a meeting room, like we always do. We have our big whiteboard, we start to write down some keywords, some Post-Its. And then we map out the timeline, and then we try to come up with those, y''know, "big" story beats. The main ones that we want to focus on. And luckily, when we actually had that, and a first draft of the story and the synopsis of it – and we had that first PowerPoint that we presented to Lucasfilm – everybody was very excited about it and everybody was onboard. So we didn''t really get any pushback in any way. Everybody was quite happy with the approach we took. And, of course, Todd helped a lot in that process of actually building out that, as well. [Axel] The core of the narrative, in terms of what the premise is about, comes from Todd Howard. The Great Circle and these mystical locations, forming a perfect circle, scattered across the globe. And then, we started to look at, "Okay, what are those locations?" "What of those locations would actually make interesting gameplay?" "What of those locations would actually feed into the narrative that we want to tell, "and how can we make sure that we have the maximum pacing "in terms of mood and visuals, ambiance and all of that?" [Danny] Writing a compelling Indiana Jones was just one of the giants that MachineGames were going to have to slay on this production. The other one was adapting to a brand new type of level design. While you could argue that Chronicles of Riddick: Escape from Butcher Bay had similar open-level elements, that was almost two decades earlier at Starbreeze. The studio tackling this project was mostly experienced in fairly linear first-person levels. [Jerk] And you can also see we tried to have a little bit more, a little bit more game, so you can actually continue to play it even after you have finished the storyline, to some extent. So we did spend some time and effort in New Colossus to actually be able to revisit locations, to replay them, and we did that through some Übercommander Missions we had. That was very early on. Even in that first concept draft I did send to Todd, that was part of it. And I used one of my favorite games, Metro Exodus, as an example for that structure, where we focus on some linear storytelling, make sure that we get the good exposition in the beginning, and then we end up in these bigger areas where we can be a little bit more flexible in scope. I like the idea of just going out there and then you can do a little bit of things, you have a little bit of choice, you don''t have to just follow the storyline. You can do some sidequests, etc. And I think we have a good amount of it, and I think we will continue to work in pretty much the same way, as well. It''s a good format for us, and a good game structure for us to work with, because it doesn''t... We don''t risk anything, in terms of our storytelling and how we can work with a strong narrative, But, at the same time, it gives us opportunities to add to that narrative add to the overall story, and also give the players a little bit more things to do that might not be for everyone. It''s okay to add a puzzle that is a little bit more challenging, because it''s very optional and it''s out of the core storyline. So I think it''s a nice way of actually structuring the game and I''m glad with did that for Indy. [Jim] Small things for every levels. Like, we need to have snow and snowstorms here, in the one level, and we need to have desert in the one level, we need to have a proper jungle in the one level. Huge systems for one-off stuff. They''re short... They''re not "very short" experiences, but it''s a ton of work. [Jerk] One of our most important keywords that we had, when we started to build the story, was "obsession". And the reason we have that scene is because, specifically, the golden idol is something that he loses, in the movie. And he never gets that back. It''s a recreation of the most famous movie openings of all time. So that''s one part of it, and I think that''s why it was important for us, to have that as a starting point and that dream sequence, so that when he wakes up that is something that he continues to come back to. It showcases his obsession, that''s the important part of it – from a story perspective and from a character perspective. And that was also something that was a little bit more challenging, but also very fun, and of course Lucasfilm was extremely helpful there as well, to try to find some ways for us to further develop the character, Indiana Jones – which is so established and well-established already – and "obsession" became a very important part of trying to find how we want to evolve the character. [Danny] If you ask me, the outstanding achievement of Indiana Jones and the Great Circle is the design of its open levels. Each of these three vast hubs – the Vatican City, Gizeh, and Sukhothai – are artfully crafted, teeming with life, and packed with places to explore. But unlike many open-world games, that signpost activities like a theme park and create obvious distinctions between what are critical path missions and side activities, Indiana Jones''s missions blend together and twist around each other, allowing the player to pick up and choose based on what they encounter, rather than a bullet-point of jobs to finish, or a map covered in question marks. This is a fairly broad topic to tackle, so let''s do this while focusing on the game''s first hub level: The Vatican City. Indy: "A lot of secrets in the Vatican..." [Jim] So, the first level we built, except for the Peru one, was the Vatican. So that became a prototype. We figured out a lot of ways not to do things. Size-wise, it''s not huge. The Gizeh and Sukhothai levels are significantly larger but it''s way more complicated, because it has, "Let''s try this thing, let''s try that thing." Like, the sandbox, for figuring things out. [Axel] We have this troublesome thing called "distance" (chuckles). So, in the real world, you might find that it''s interesting and fun to walk five blocks, to get from point A to point B. But, in game, sometimes walking those five blocks is not that fun and, if we were to do a 1:1 depiction of the Vatican City, it would have become something completely different, or we would have been forced to make that footprint so much smaller. So we did a lot of those exercises, in terms of looking at "What do we need to tell the story? "What do we need to be able to do the gameplay we want "and push the player throughout the space, "and making them explore certain key buildings, and certain key elements?" But we quickly realized, you can''t do that in a 1:1 scale. It''s not only the footprint, but we also need to do that when it comes to height of buildings, for example. [Andrew] Yeah, so we split it into... We had story events, large activities – which are these... they''ve got cutscenes and NPCs, and they''re pretty complicated – and then we had small activities, which eventually we basically scoped-down into "mysteries". As we were setting up the sandboxes, we were really accounting for the story events and large activities and we weren''t really changing level geometry around the idea of the small activities. It was more like, "Okay, so we''ve built a sewer system. "What can you do in the sewer system?" And then this creates an opportunity of, "Maybe there''s smugglers in the sewer." That''s really where we first started trying to figure out what became "mysteries." Initially they were called "treasure hunts" and initially, I was thinking: Okay, we need to populate the sandbox with gameplay, so let me create this really generic, reusable thing of, here''s literally a message in a bottle and you break the bottle, you get the message, "Go to the X marks the spot," and then you get some money. The initial feedback on that was, "Yeah, this is cool, but it''s not mysterious enough." And so we went through these iterations of, "Okay, what exactly are these?" And basically we went more and more bespoke, of like: "What is the actual content that''s being delivered by these mysteries?" And the answer for most of them was these little narrative nuggets. Like, "Here''s a shipment from this lieutenant who''s been "appointed to this position because his uncle is bribing various officials, "and he can''t figure out how to open his own lockbox." There''s another one of, a missing cat. And this is one of these that, we initially had something called "small activities" that were going to be little NPC quests, NPC interactions – so, [Voice Over] and some motion capture, sometimes even cinematics – and very quickly the production on those was like, "Oh my god. "This is gonna be really hard to do." (Chuckles) And so we had to scope-back on those and make clear decisions of "large activities" or eventually, "mysteries". And so the cat photo was originally a small activity of this priest looking for his missing cat Smushki. Eventually, you''d go down into the sewer, and Smushki would be up on a ledge and he''d jump on your face. (Laughs) But production concerns of, "Uh, not easy to do..." As we figured out... You know what? what''s good about the mysteries is some of these can be a little bit more cognitive, a little bit more brain-burny, a little bit more challenging, but a lot of these are more about the narrative content that comes with them. The sense that it''s creating... The world''s alive, and there are these other stories crisscrossing through your space and you are just passing through as this world is all happening. And then the player choosing: "Yeah! You know what? I am gonna drop what I''m doing to go climb on the rooftops and photograph a buncha cats to see which one''s Smushki." Indy: "What are you doing up here, kitty?" (Click) (Meows) (Snap) Indy: "Signor Smushki, there you are..." [Andrew] We went through a lot of iterations with those, where it''s very easy on the mysteries to end up either, again, drawing too much attention away from the main narrative, of like, "Here''s this whole new conspiracy "that''s running perpendicular to the main plot!" It''s like, "Wait a second, I wanna see what''s up with this..." It had to fit in a way that either serves the existing narratives or was small enough that it wasn''t too distracting. [Axel] Just finding the balance in terms of how much from the golden path can you stray away and take pictures of cats, or do whatever, without diluting the main narrative. But the other thing that is also very important, when doing this specific game, is: "Does it feel like Indiana Jones would do this?" Those were the things that we''d been discussing and talking a lot about. And, I mean, we''ve been working with Lucasfilm Games throughout the entire campaign, as well. We''ve been having weekly meetings with them, where we''ve been talking about these type of things, as well. Finding the balance between, "Does this feel like something Indiana Jones would do?" or, "Does it fit the gameplay? Is it fun?" or, "Is this on par with the golden path and the core narrative?" and trying to get those three together, that has taken a lot of iteration. Father Antonio: "I hope they fit..." [Zeke] Yeah, the disguises was one of the big things. It was just trying to figure out how we can get people to move around the spaces, how do guards interact with you as you''re going through the game. So many different questions about that. I think that was one of the ones... We iterated on disguises throughout the entire project. It''s a very complex system but it''s really, really crucial to Indiana Jones, is that you can throw on a smock and everybody''s suddenly like, "Oh, hey there, Father." (Muffled movement) Fr. Indy: "You''re forgiven." (Thump) Soldier: "Father, wait, I didn''t confess yet..." Fr. Indy: "All right, let''s get this over with." Soldier (sobs): "Father forgive me, because I have sinned." (Sigh) Soldier: "I had an affair with my mother-in-law, and..." Fr. Indy: "It''s all right, just say three Hail Marys–" Soldier: "No, Father, you don''t understand! "My wife is expecting a child and I fear that–" Fr. Indy: "What?" Soldier: "Yeah... Let me finish, please. "I fear that my... mother-in-law is with child also!" Indy: "Jesus Christ, what have you done!?" Soldier: "Wait... "You are not a priest!" Indy: "Screw it." Soldier: "Ah!" (Thwack!) (Thump) [Axel] We could book another... We could make a standalone documentary just about fleshing out the journal and the content that goes into it (chuckles). One thing that we said very early on was, we want the journal of the game – like the menus for missions, and all of these things – they should fit within a physical journal. [Jakob] The initial idea with the journal was to have it very physical. And I mean, the journal is iconic, it''s kinda something you have to have. We had a team. The UI team was working on the journal a lot and we had animators that were maybe not "dedicated", but you had one go-to guy that would do a lot of the journal stuff. [Axel] So we had some iterations very early on where we actually tried to really squeeze everything inside a book. One of those things that was iterated from the very get-go [up to] very close to shipping the game. [Andrew] So, I think one of the other things that helped with fleshing out the sandboxes: We did a big "living world" push. So, Hannah Hoffman on the Level Design team was really driving "living world", which was NPCs and also these secret actions that you can do with NPCs. And so, we have a lot of these moments where you''re just walking around and a character will say: "Oh, my hammer! I dropped it!" (Laughs) And there''s no quest attached to it, it doesn''t pop up in your journal, but it''s just this little reward for a player who''s being attentive of like, "Oh, wait, that guy said something! Hmm..." But all that stuff, I think, contributed to this feeling of, ideally, every corner you turn it''s something new and surprising without also feeling like totally off-the-walls chaos and randomness. [Axel] I think that, in the end, we managed to hit something that feels good because, for the player that really wants to explore the world and find everything – the "100 percent completionist" approach – there''s plenty for you to find. And for people that are maybe not interested in nailing all of that, they''ll still have a very solid experience just going through the backbone of it, the golden path. But one thing that we said from the beginning is, regardless of how much off-track you are, it always needs to feel like you are Indiana Jones, and everything needs to, somehow, connect back to the main story. I''m not saying that all content has a clear line towards the core narrative, but very often it feeds – somehow or another – it feeds back into it. And I think that''s been something where... Either, if it''s just part of the sensation that you''re on an exploration, you''re on an adventure and sometimes there are direct links and clues, and hints, about the main story. But that was very, very important to try to nail: To make sure that, regardless of what you do, you need to feel like you''re on this grand adventure, and you should feel like you''re Indiana Jones. [Rebecca] I''ve been to the Vatican. I was there for a short trip, actually, somewhere during the middle of this project, I think it was. [Danny] Work trip or fun trip? [Rebecca] It was a fun trip, and yeah, the decision had nothing to do with that. But I remember, when I came back, and the game was trucking along and I was playing through it a little bit, and I was like: "I remember that place! "I remember that place! This looks like this way..." That, sort of, really baffled me. [Zeke] I really love the Catacombs mission, the Necropolis mission, and when you first meet Gina in the Vatican. That was super lovely, coming down there and doing the puzzle with the wine. And then all of the fun stuff of getting a torch to feel good, and stuff. That was a big epiphany for me, actually... We had all these interactions where you''d go up to a torch and there would be an ''X'' prompt, and you''d press X and you''d be frozen in place and the torch''d come down. And then one day I was like, "Oh, what if we just automatically do this?" And that whole mission went from being 2/10 to 5/10. We were like, "All right, we can move on from this. "We''re gonna make a good torch game." (Contemplative guitar strums) [Danny] Hands! Hands grabbing things! Hands throwing things! Hands reading things! And punching fascists! Never before have I been so aware of hands and it''s with good reason... To make you feel like Indiana Jones in a first-person game where Indiana Jones is rarely actually on screen, the team at MachineGames needed to take the full-body gameplay that they started in Wolfenstein: The New Colossus to a whole new level. The "grip system", as it was known internally, was run by a team within the studio who were responsible for every time Indy used his paws. The opening level in Peru was actually the testbed for this grip system, but as the game grew, so too did its needs. [John] A lot of the time, as Indy, you''re gonna be spending time interacting with the world, investigating artifacts that you find, picking up artifacts and taking a look at them, so what does that mean for the full-body experience? For a completely different set of actions than what we''ve done in the past? We put a lot of production effort into the system we developed to allow you to pick up those objects, pull levers, twist things, turn things. [Jakob]  During Colossus, we created a group that was a mix of different departments – Animation, Programming – and that group continued into Indy. So we had a group that was focused only on first-person stuff: Getting the feel right, getting Indy to feel right. There was some concerns, of course, about first-person, and how can we make this feel like Indy? And that took some iteration and discussions about how to get that right. [Jim] So we had one engineer, pretty much dedicated through the entire project, to do holding and manipulating things. So he knew the intricacies of everything on it. And then he was the one working with Design to figure out, "Okay, we want to do this. "It needs to be slightly different." [Zeke] Jake had done this really cool thing where he''s like, "Okay. "You need to pick up stuff and hold it in your hand. So... Hmm. I''m gonna need seven shapes." And so he developed seven shapes, primitive things, and everything you hold in your hand will be one of these poses. And he did that for all the one-handed things. And they were like, "Two-handed things." All right. This is "sphere small", "sphere medium", "sphere large". [Jakob] We had a pretty good system for that, so we could add new models and make them break. And we had a set of different types of grips, so you can hold an item in... I think we ended up with four or five different ways? So, like a thick ball, or pen, or whatever it can be. And then we could just make the models, match that grip, and then you could just keep adding those. [Zeke] So, when we first did [Marshall] College, we were early in experimenting with picking things up and playing with them. And so, I took two level designers, and it was me, and we looked at Marshall College and said, "Let''s convert everything into a pick-up," basically. And so we have all these chessboards and people are going, individually picking up chess pieces, and seashells under the cabinets and things, and all the different statues. It was a good exercise, because it really pointed out, okay, we need to make every object visually identifiable as being "pick-upable." Even from across the room. You don''t have a highlight on it but if it has a handle, okay yeah. If it''s in one piece, oh yeah. If it''s of a certain size, yeah. But if it''s a stack of folders with a book on top of it, you''re probably like, "That one''s not interactable." Indy: "Perfect." [Jakob] I mean, coming from New Colossus, it was all about guns so you had to kind of reset your mind. "Okay, okay. It''s not about the guns. It''s not about the guns..." But, in actual gameplay, you don''t necessarily use the guns that much – from time to time, it happens – and that is on purpose, because we didn''t want the player to equip the guns and then just go shooting through the level, ''cos that''s not Indy. And we can''t have a note in the beginning of the game: "Try to roleplay Indy." So we had to, with gameplay, get them to play kind of like Indy would''ve done. And I think toning down the guns and making them not as powerful as you might''ve expected. It''s not like we''re trying to make them feel weak, or anything like that. We still want to have decent punch in them, and all the animations should be right, and it should be correct for the gun. And the gun nerds should say, "Yeah, this is that and that gun, "and it works like this and this." Yeah, we did that. [Zeke] We had builds for the game where there was more gun combat. We''d do a change and unintentionally you''d be able to shoot people more, and play it that way, and it was just wan''t as much fun. We didn''t like it that way, the people didn''t seem to enjoy playing it that way. We didn''t want them going to cover and doing all these advanced military maneuvers. We wanted to push them down a set of stairs. From the very beginning it was thought of as a last resort. It''s really risky. We did all these systems to say like, "Well, if the enemy drops a gun "we need to make sure they only drop one or two bullets "because we don''t want people to shoot so much." As we continued to get the game more and more Indy-feeling, get more into that character, it''s like, "Yeah, now you press a button, you can use the gun as a club." And people just started using it as a club, we didn''t have to worry about that. And we actually stripped out that whole system. They dropped the gun with as many bullets as they had when they had it. Indy: "Hold your horses!" (Gunfire) (Soldiers yell) (Thump) (Bang) (Bang) (Bang) (Soldier screams) (Ricochets) (Bang) [Zeke] When we were doing early playtests... Actually, no, even late playtests, people would get into Gizeh, they would get five hours into the game, and not realize they had a gun. One of my favorite, experiences throughout the project, was I got to go to a hands-on event and you''ve got journalists lined up on four computers on this side and four computers on that side, and they were all playing through "Castel", the intro to the Vatican, and they were all at the same point and each one of them had a different item in hand (laughs) as they were stalking through... One guy had a violin, and the other one a flyswatter. And it was like, "Yeah." I think that was in October, so a month and a half before the game was gonna come out, and I was like, "Yeah. This is gonna be good. This''ll go over well." [Andrew] From Level Design, we did have a couple designers who were focused specifically on combat encounter design. So Mykola [Volchkov] did a lot of the compound spaces in Sukhothai and Eric [Hörnström] did a lot of combat encounters generally through the Vatican. And then we had a bunch of other folks helping out across the whole game. Definitely a lot of thought goes into how exactly we''re doing the enemies. Making sure that there is still an option for stealth, but also that it''s not too easy. And also all the focus on melee combat. There was a lot of work of making sure that there''s just plenty of these "grip objects" to pick up, and be able to throw, and melee around – and also that these objects are thematically appropriate to the areas they''re placed in. [Jakob] Well, we have the flyswatter, that''s a good one (laughs). But, no, other than that... There''s some sledgehammers that are maybe a bit over the top, but they''re fun. [Zeke] Yeah, we decided to dumb down a good bit of the enemies just to make sure that people could take their favorite violin or favorite handbell and have some fun. [Zeke] I think a lot of the game is based on generosity. We''re pretty generous to the player with the amounts of pick-ups we place, we''re pretty generous in the routes the enemies take and you can run away from combat pretty simply, and I think it just fits into the universe, as well. It''s a lucky universe, that Indy inhabits. [Axel] Trying to make a game that would organically play like that, where people like yourself don''t feel the need to fire a gun for... how many hours? [Danny] Yeah, I think it was like, eight or nine, or something? [Axel] Nice! Yes. Missions successful. Because, then I think you''ve been on a really interesting experience, you''ve been trying to sort out in obstacles or fighting your way through this adventure with other ways, moving forward. So yeah, there''s a lot of different components that go in there. (Dramatic orchestral chord) [Danny] The second open level in ...the Great Circle takes place in the shadow of the Pyramids of Gizeh, a very different style of level to the Vatican, which came with a whole new set of challenges [Andrew] For the Vatican, that was part of a vertical slice, and then vertical chunk, so that, very early, set foundations of like, "Here''s how we wanna do all of this stuff." But Sukhothai and Gizeh were in development at the same time. [Axel] If you think about the Gizeh Plateau and the area around Gizeh, you most likely will think, yeah, this is just one big, flat surface, how do we break this up? What will be the line of sight? Will everything just be flat ground and a couple of snakes crawling around? But I don''t think that that could have been proven to be that much fun, in terms of navigating the sandbox. So, quite quickly, making sure that, yes there is layering in terms of depth and height and you can''t build upwards too much because you don''t wanna take away from the skyline of the Pyramids. We do have some things popping up and breaking the skyline because of exactly that: they need to break the skyline to serve as a visual beacon or a point of interest. But most of the time, instead, digging down because there''s no one telling us how deep the mysteries in Gizeh actually go, right? We''re making the player aware, and present the player with a lot of different possibilities and options to traverse the spaces with the whip, and when you get that mechanic going and actually get the hang of it as a player, it''s really fun. (Crack) (Indy heaves) [Jakob] A lot of fun and a lot of headache (chuckles) with that, all from the swinging implementation to the physics of the actual whip and a lot of iteration. How much should it be used? We don''t wanna overuse it. If you look at the movies, Indy uses the whip but it''s not in every scene. To get that balance, that took some time. All the way to the end, actually. [Zeke] After about a year into the project, we all took a look at the whip, and we said, "Okay, what do we really want from the whip? What is the whip..." And the goal was always like, it''s gonna be our gravity gun, right? It''s gonna be the coolest thing that''s ever happened to a first-person shooter and it''s gonna feel so unique and cool, and... The whip was always okay on paper, though. It was always fine on paper. You can whip somebody, they''re gonna drop a weapon. I think most of our nerves came from, it just doesn''t seem that cool or interesting, or fun. And the thing that really solved it for us and the thing that really sold it internally and got everyone to understand how it could be really good, was when we just said, "Okay, we''re gonna just do a ton of animation work on it." So they have weird reactions: You hit ''em in the face and they do this, you hit ''em in the groin and they cover up, and you can pull them onto their butt. It was kind of a new experience for me Usually you can with a lot of these features, "This feature''s not working because the ruleset isn''t good, "because we don''t have enough things that make it important." For the whip, it really was like: "We''re just not being funny with it." (laughs) "We''re not showing the ''Indy'' aspects of it." I mean, it''s difficult, it''s a physics simulation, so that makes it that much harder to get it to come to life. I think at one point, we had the whip where you could just equip it and drag it around, as well. That was really fun, actually, for a while. [Axel] We had the challenge, of course, also to not just make it "interesting" but also make it fun, and also make it good-looking. So in terms of references, looking a lot at Raiders of the Lost Ark and also by dissecting [those images], but also looking at a lot of references: what you can actually see in a desert, or in the region around the Pyramids in Gizeh, and really start picking out the nuances. Because it is not only just sand and brown and yellow. There are nuances in there, and you can get those nuances to come forth if you pay attention to them and make sure that you layer it up. There are segments of rock, there is dust, you have roads and those will have a different type of contrast. And then we are scattering throughout a couple of different locations where you can go explore: we have a worker camp, we have some dig sites, there are some military camps and other hubs of interest, a village, and then the Pyramids themselves, of course. We needed to push everything in a little bit so it becomes a miniature version to some extent. And that was challenging. How far can you... How condensed can we make this, without it becoming too weird? And you''ll find that a lot through trial and error. Move things in the map, run around in the engine. "Okay, this feels good." "Oh no, it feels too long or too short-distance." And we also added this weird layer, of course, with the enemies. They have several different, big dig sites. They''re searching for something... What? We could expand those, basically how big we wanted because this is fiction, right? There are several different military camp installments, there''s a military camp HQ. So there are a lot of different components we could play with to try to make this into something that would feel like you want to explore and find things, and at the same time feel as believable as we could. [Andrew] Mysteries were basically these opportunities to be like, "Hmm... "We need something here, what can we do with that?" or like, "Oh, we have a weather station. "Well, how do we help convey to the player that it''s a weather station? "What would they do in a weather station?" And then generate a bunch of ideas of like, "Maybe they''ve got weather balloons." "Cloud atlases are cool..." And then we end up with, "Hey, there''s exactly 10 different cloud types "in the cloud atlas, and a combination lock, so if they''re numbered zero to nine... "Hey, then you''ve got a combination lock." Literally, playtests would be like, "This area feels empty, what do we do?" "Let''s just dig a hole in the ground and have a well "so you can just shove a bad guy into it." (Laughs) We had some early mysteries. I had one in Gizeh... When we were still figuring out what even are mysteries, what''s the scope and breadth, I had one that was... I''m not saying they''re aliens, but... [Danny] Right, yeah! (Laughs) [Andrew] So we had a crop circle of stones, and we had an observation tower where one of the bad guys was trying to figure out, "I''m here in Egypt and I''m trying to..." But that one was like, "No, let''s not." [Danny] It''s like sucking too much of the magic away from the main story? [Andrew] Yeah... [Danny] Yeah. [Andrew] ...and maybe a little bit too silly, as well, where there''s a balance of... There''s a style of humor to these, where we can make bad guys incompetent and klutzes, and there''s humor there, but if it it''s zany, gonzo, UFO spottings then it gets a little too far out there. [Axel] In Gizeh, there is a very big, cool, acoustic chamber puzzle where you need to align... It''s a light puzzle, basically. You need to align some light beams. It''s extremely cool and mysterious, and it sounds just so nice, and it looks cool, and it''s kind of slow-placed but it doesn''t matter because you''re so hooked to try to solve this thing. That''s one of my favorite moments, I would say. Just proves how much audio... What an important role audio has when it comes to emphasizing mood and gameplay. (Driving pulse) [Danny] Like I said in the intro, there are a few levels in Indiana Jones and the Great Circle that are wonderful set pieces worth highlighting. But, for the sake of spoilers, we''re gonna stroll on down to the third, and final, open level in the game: Sukhothai. Once again, an entirely new biome with entirely new design challenges for the team to figure out. [Axel] The trickiest part with it was also part of a very beneficial approach that we took, which is, we said, "It''s just been rain season, "the entire area is flooded. Nice! "Now we can move around with a boat." That''s cool, that''s fresh, that''s something completely different from the other sandboxes, but what that also is basically creating is, again, this kind of flat, big surface where you are just moving towards the horizon constantly, right? There''s not that much... At least in the initially get-go there''s not that much exploration, in terms of height. But very quickly, again, there''s a lot of military camp installments that have height to them and, as you will find out, as soon as you start lifting on stone blocks or peeking beneath the shrubberies you will find the secret hidden temple underneath that goes way deep... [Andrew] Yeah, I think Sukhothai posed a lot of really hard challenges because jungle environments are... The total line of sight is... pretty dense. You do get these glimpses of like, "There''s something way in the distance," but very quickly foliage obscures it. But also, the feeling of, "Wait, can I pass through here or can I not?" And so there''s a lot of challenges there of: how do we indicate to the player what''s a playable gameplay space? In some ways it would''ve been easier if we''d forced, "You can only gadabout here and here," and then everything along the river is just totally locked in. That would''ve made our lives a lot easier. (Laughs) But part of the fun was: "Here''s a ruin. I was going this way "but lemme just jump out of the boat and swim under something," and then see "Ooh, some goodies." And I think that feels more authentic to the kind of exploration that is Indiana Jones. Annika: "Who are you?" Indy: "Who am I? Who are you?" Annika: "Don''t come any closer!" Indy: "Take it easy, kid." [Andrew] I''m really happy with how, in Sukhothai, the Demon''s Tomb quest worked out. Where you meet Annika. That one, from a puzzle design standpoint, went through a ton of iterations to figure out, that was really hard. But it ended up being one of my favorite puzzles in the game, and that''s credit to Dominic [Everett-Einarsson?]. It''s fun, because it''s such a nice encapsulation of this Indy adventure but also, it''s totally optional and so a lot of players just miss it. And that means that, for a lot of players, they''re going back on a revisit to the map and then they discover, "There''s this whole other dungeon?!" It''s like, "Yeah." (Laughs) It''s awesome. I think, for me, when we get the opportunities on the level design side to be generous to the player and make the player feel like, "How did you guys do this?" that''s when I''m like: "Yeah, we did it!" (Laughs) [Danny] Indiana Jones and the Great Circle is a great-looking game but more than that, it''s an authentic-looking game. It mirrors the lenses, camera movements, and lighting of American movie-making in ''80s. But achieving this was no small task. The team did initially attempt to simulate anamorphic lenses for cutscenes but the complex nature of how much light they require, and how much they bend light played havoc with the raytracing system. And, as the minimum spec for the game had to be an Xbox Series S, the decision was made to drop it. That said, you''d hardly notice. The cinematic language of Indiana Jones and the Great Circle feels in lockstep with the Spielberg movies it pays homage to. So, how did this come to be and what about the cast of actors who brought it all to life? [Jim] The biggest thing was figuring out how to get close to the cinematic quality of Spielberg. The key thing was getting characters to look like characters. Over the years, we''ve had decent-looking characters, but this has to look like Indy. It could be, if we had chosen to go a more stylistic look, that would work but that wasn''t the direction that the Art Directors or Creative Director wanted. It needs to look like the movies. So we spent a decent amount of time getting eyes to look good, faces to look good, animations to look good. [Axel] This is by far, at least in my mind, one of the trickiest components that has been part of this project. Getting out of uncanny valley, and getting into, "Yes, this feels good." [John] Typically, on the Wolfenstein games, we would do the motion capture and performance capture sessions more in the style of a theater play, without camera. You''d have the idea of a front-of-stage and a rough direction of view, but you wouldn''t know where the camera was gonna be until afterwards where our Creative Director would get in there with a virtual camera and film everything afterwards. But here, we were having to bring in... And, we took the decision early on that it was gonna be critical for getting that "Spielbergesque" feel, we wanted real cameras at the scene using real dollies, secondary cameras in there and that made the planning and the complexity of the scenes all the more difficult, ''cos it wasn''t something that we could go in and fix in post afterwards, right? So, doing that, at the same time as we were working through the restrictions of working under Covid was, yeah, that was a real challenge. But the crew who pulled that together, they did some magic. [Axel] Early on, we took the decision to have a professional DP on set. So we had a guy named Kyle [Klütz] that worked on the set with a real, big trolley with a camera and the guy pushing him around, to get all the nice soft [panoramas] and get everything correct in terms of composition and framing, and making sure that we were mimicking the Spielberg-ish cinematography as much as we could and, before that, obviously a lot of storyboarding and researching of his style and works. [Rebecca] For Indy, it really hinges on getting this cinematic language right, this very specific, ''80s Spielberg, it hinges on getting a lot of things right. How do we get the best tools to do that? So there were two HERO cameras that was... We call them X and Y, was what we called them that were driven by much more professional photographers than we are. The other ones were much simpler tripods and then, if needed, the biggest thing we would do would just be take it from the tripod and do it handheld. Facial areas is also one of those big things where we can''t do that in-house all by ourselves. We had to ask for some help. So we had Motion Grinder working on all of that. It enables you to think about the bigger strokes, the bigger motions a little bit more. Indy: "''Brother Locus received minimal injuries during retrieval.'' "I don''t know about ''minimal''..." "''It appears in the form of a cat and has been placed in a treasury of esoteric artifacts.''" [Axel] Troy has been coming over to the office here in Uppsala, being part of block-outs and rehearsals, and then also in the main shoots in Stockholm as well. [Danny] Okay, so he''s spent a lot of time up here over the past years? [Axel] He has spent so much more time and energy that we ever asked of him for this project. It''s been surprising, to see his commitment. And, not that I ever doubted that he would be committed, but he has been committed on a level that I''ve never seen before, when it comes to working with talent. There''s no... You can''t put words on it, how much he meant to the project. [Danny] It is a remarkably accurate portrayal. The voice is surprising in itself, but also just the mannerisms and everything like that. Were you guys worried about who you might cast for this? Do you remember much about trying to figure out who might play Indy? [Axel] There were a lot of different options, in terms of who would be portraying Indiana Jones, but when Troy was submitting his audition, the game was over. I''ve said this in a couple of interviews, but I''ll reiterate it, because it''s true and it''s just weird, because the first time when I heard his test lines from audition... "Listen to this! This is cool!" I was like, "Okay, so those were the reference lines. Now let me hear Troy." "No, that was Troy!" "Stop it! You''re kidding me?!" That''s how good it was. It was so obvious. When he was on, it was just... Okay. "Thank you everyone, this has been a good audition, but this is it." [Danny] "We got our guy." [Axel] "We got our guy." It''s not only the voice, it''s not only Troy Baker making... "I sound like Harrison Ford..." That was very bad. [Danny] That''s pretty good! Could''ve been you. [Axel] Yeah, could''ve been me. (Laughs) It''s not only that. It is also just how he moves his whole body, because we''re doing full performance capture. So he''s mimicking the body language of a young Harrison Ford, specifically – obviously, Indiana Jones – but he''s also mimicking his facial... How he smirks, and blinks, and does all the other things. And then the voice, as well. And then, often, or most of the time, in relation to some other talent. For example, Gina, played by Alessandra Mastronardi or Locus, played by Tony Todd. Getting all of that data, which is obviously a stellar performance by Troy, but then the process of getting that data, cleaning it up, getting it into the engine eventually and making sure that the model looks good, that the skin tone is just right, albedo is correct, eyes are adjusted to the correct nuances, how much stubble does he have. All of these things, like color of the hair, and then the lighting. There''s a lot of different components that go in. So yeah, to me it''s the singular, biggest challenge we had. (Trembling Violins) [Danny] In August of 2025, MachineGames released a DLC pack for ...the Great Circle which appears as a new questline in the Vatican City. Titled The Order of Giants, it dives deeper into the mysterious origins of the Nephilim Order, the race of giants that Tony Todd''s Locus belonged to. [Axel] The idea was that we wanted to make this as an extension of the main campaign. So, placing the beginning, or spawning the beginning of it, inside the main campaign is very convenient to make sure that it feels like this is... it''s "connected with the mothership", basically. But, quite quickly, in the DLC – which, it is a story-driven DLC – we put you on a separate path outside the Vatican. But the tension has always been, with the DLC, to make sure that it feels just like a natural extension of the main campaign. We have set pieces, new enemies, new exciting environments, very cool puzzles, and then a narrative that is building upon the mystery of the Nephilims. The DLC is called The Order of Giants so we are telling more about the secrecy and the cool aspects of this mysterious, large race. So there is this interesting balance, where we need to make sure that we do not spoil anything, obviously, from the main campaign in the DLC and it still needs to feel like it is this really interesting adventure of its own, but connected with the main campaign. [Danny] When we started this trilogy of documentaries, our story began with a tiny MachineGames team tackling the world of Wolfenstein. These days, the studio is bigger – around 180 people – but it still retains the scrappy, outsider attitude. Having spent the best part of a week at the studio, tucked away above a shopping mall in central Uppsala, I''ve come to appreciate the humble confidence that oozes through these halls. This is a studio which feels densely packed with talent, a team capable of turning seemingly any franchise, no matter how big, into a "Game of the Year" contender. If only they''d not released Indy in December, after most of 2024''s awards had already wrapped up. We''ll have to see if journalists consider it this time around. But before I left, I had one final question: In our first documentary, I asked Jerk about his time working on another movie franchise title. And, 20 years after the release of Chronicles of Riddick: Escape from Butcher Bay, it seemed like they had, once again, struck gold in adapting a complex Intellectual Property based on a movie. [Danny] Critically and also, y''know, with certain gamers, Riddick came up a lot in reviews of Indiana Jones, and things like that. [Jerk] Mm-hm. [Danny] What do you make of that? Is it just people seeing a relatively non-combat first-person game, understanding your lineage, and going: "Uh – uh," or do you think that there is something about the games that connects them? [Jerk] I think there is a lot Riddick in the game, actually, and I think maybe moreso than Wolfenstein just because of the writing and gameplay. Maybe, to some extent, that we have obviously tried to mix in stealth elements in combat in Wolfenstein games too, but now we are focusing much more on the adventure part of it. And I think, maybe hand-to-hand [combat] comes into play too, a little bit. I''ve actually used Riddick too, a lot even when pitching the game initially to Lucasfilm and also when I did my first concept draft and showed it to Todd. So, yeah, it came up quite a lot in that phase, too, and maybe that is part of the reason why it''s being referred to. But I think, overall, it''s just... Like I said, we have used pretty much the same approach, how we build the story and how we let the story drive the gameplay decisions. (Ambient chord rings out) [Danny] One thing I''ve always wondered is how hard is it to make handheld camerawork not feel fake? [Rebecca] So it is hard to do it, if you try to keyframe it. It doesn''t really feel natural, you don''t get the weight of it, you just don''t get it right. But mo-capping it, that''s part of the beauty with mo-cap. You can do. it so quickly, so easily. If you know how to, you don''t have to do the whole motion from the beginning It''s enough that you do this, or maybe do this turn, do this pan, do this... everything, and then you just combine that with what you already have. [Jim] We have shipped one game over the years where we haven''t had a catastrophic failure during the last weeks. [Danny] Really? [Jim] Yeah. It''s inevitable. It always happens. So, for Indy, we had it two weeks ago. The entire storage server infrastructure collapsed, so you couldn''t access files anymore. [Danny] So it affected everyone, basically? [Jim] Yeah. Yeah. IT spent the weekend trying to rebuild everything, and after two days they got it to the point where we can work again. But it always happens. [Zeke] There was a call for: "We need to get more of these items," people enjoy using them, and so there''s one guy, who''s Fredrik Ljungdahl, – he started this company, and he was at Starbreeze from way back in the day – and he has this innate gift of, like, "Hey, Fredrik, we''re thinking about having explosive objects in the game. Can you put together a list of items that could be explosive?" and he will literally give you 30 objects in 15 minutes. And same thing with the script thing. I was like, "We wanna find cool things that we can use, like wrenches or something, I don''t know. Can you give us a list?" and we had 100 objects from him ASAP. And so a lot of those really cool objects at the end came from him just being like, "Oh yeah, of course." All of the musical instruments, for instance, the handbell. We really... We had a really good pipeline there at the end, we had all the tech to support it. We could do one really quickly, we just needed a model and a sound. We had all the other animations and stuff. I think if it was just another shovel or if it was just another pipe, Audio would have been like, "Aw, really? Do you need this?" But when we were like, "It''s gonna be a banjo." They were like,  "Oh, okay, yeah. That''s gonna be great. "And you can get the strings to do this, and there could be a bit of a thing... "Wait, do you think Indy could play the banjo?" "Uhh, okay, maybe we''ve gone too far now..." (Laughs) (Click)'
