transcript: '{"content":"\n[0.48s] When most people think of Nirvana, they\n[3.04s] think of a kind of Buddhist heaven, a\n[5.839s] place of eternal light, a peace and\n[8.32s] angels where an enlightened being goes\n[11.2s] after they die. But if you look at the\n[14.16s] early texts, the Buddha explicitly\n[16.32s] rejects this. Nirvana isn''t a place,\n[20.4s] neither a here nor a there.\n[23.439s] And yet the Buddha calls it the ultimate\n[25.519s] bliss.\n[27.519s] So here''s the mystery. How can something\n[30.4s] be the ultimate bliss if it''s not a\n[33.36s] place? Maybe not a feeling, and maybe\n[35.76s] not even anything at all.\n[38.559s] Today, we''re going to try to solve this\n[40.239s] paradox by looking at the two ways\n[42.8s] practitioners have understood the\n[45.28s] ultimate goal of early Buddhism.\n[48.16s] The inflationary view, that is that\n[50.719s] nirvana is a kind of a real thing, and\n[53.52s] the deflationary view, that nirvana is a\n[56.239s] kind of an absence. and why the real\n[59.28s] answer may lie in thinking about an air\n[61.76s] conditioner.\n[64.4s] One way to begin our search is to\n[66.479s] consider the word itself. Nirvana\n[69.68s] literally means blowing out or\n[71.76s] extinguishing like of a fire or of a\n[74.4s] candle flame.\n[76.479s] In one early suta, the Buddha asks\n[78.72s] vatag,\n[80.4s] \"This fire in front of you that is\n[82.479s] extinguished, in what direction did it\n[84.96s] go? East, south, west, or north.\n[89.6s] The answer, of course, is that none of\n[91.2s] these is correct. The fire didn''t go\n[93.6s] anywhere. It simply ceased because it''s\n[96.479s] fuel was used up. This is the\n[99.36s] deflationary view of Nirvana.\n[102.96s] The implication of this view is that\n[105.2s] Nirvana is not a kind of a place that\n[107.52s] you go to, nor even a kind of experience\n[110.72s] that you have. Instead, it''s simply the\n[113.84s] permanent cooling of the fires of greed,\n[117.28s] hatred, and ignorance.\n[119.84s] Modern scholars like Bigus Jato lean\n[122.64s] this way. That is that Nirvana is best\n[126.0s] understood as a kind of a via negativa,\n[129.36s] a negative way, an elimination of the\n[132.319s] unskillful\n[133.84s] rather than as a kind of a place that we\n[136.0s] go to.\n[138.4s] Now why is such a view hard for some\n[141.04s] people to accept? Because it sounds like\n[144.319s] nihilism. We think so we just disappear.\n[150.879s] The counterpoint to the deflationary\n[153.44s] view is prompted by the question, if\n[157.04s] nirvana is just a blowing out, why does\n[160.64s] the Buddha describe it in such positive\n[163.12s] majestic terms?\n[165.44s] For example, he calls it the far shore,\n[169.36s] the island, the refuge, the deathless\n[172.959s] element.\n[175.04s] In contrast to the view that Nirvana is\n[177.12s] a kind of an absence,\n[179.599s] the inflationary view sees it as a kind\n[182.159s] of a super mundane presence.\n[186.4s] In another early suta, the Buddha\n[188.239s] describes Nirvana as that dimension tad\n[192.64s] ayatan where certain things happen to be\n[195.44s] true.\n[197.36s] Now the word ayatan has the general\n[200.159s] meaning of a resting place, an abode, a\n[203.28s] source, a region, a sphere, a field, an\n[206.4s] area or a dimension.\n[209.44s] Although of course in this case the\n[211.2s] Buddha would be using the word as\n[213.76s] metaphorical for something super mundane\n[217.68s] extraormal.\n[220.08s] But whatever the case, this passage does\n[223.12s] suggest that Nirvana exists\n[226.56s] which implies the inflationary view.\n[229.92s] That is that Nirvana is a kind of a\n[232.64s] reality, an unconditioned element that\n[235.68s] in some sense we touch or enter into.\n[240.56s] Modern scholars like Bikubodi lean this\n[243.28s] way. If nirvana were simply a lack, the\n[247.519s] spiritual path would seem somehow\n[250.0s] devalued.\n[251.599s] There must be an eventual there there.\n[256.79