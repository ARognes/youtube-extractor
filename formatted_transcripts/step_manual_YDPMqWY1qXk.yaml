 and for\n[385.84s] all.\n[388.8s] Now ultimately the Buddha refused to pin\n[391.039s] this down completely. He classified the\n[394.16s] state of the enlightened being after\n[396.319s] death as one of the unanswered\n[399.199s] questions. Why is that? Because if he he\n[403.28s] says if he said that they existed in\n[405.28s] nirvana in some sense that would lead to\n[408.56s] clinging to the state as to some kind of\n[411.84s] eternal heaven which would lead to\n[414.479s] notions of eternalism.\n[417.36s] On the other hand, if the Buddha said\n[419.599s] that such a person didn''t exist at all,\n[423.36s] we would then fear that kind of death as\n[425.759s] a kind of complete annihilation of the\n[428.479s] self.\n[430.16s] Our language of existence and\n[432.16s] non-existence frankly applies to\n[435.12s] conditioned things, things that arise\n[437.599s] and pass away.\n[440.4s] But the concept we have of nirvana is of\n[444.0s] something that steps outside of this\n[445.919s] duality entirely.\n[448.319s] It''s simply freedom from the burning\n[450.88s] fires.\n[452.88s] Now indeed, one of the most common names\n[455.52s] for this state is the unconditioned.\n[459.36s] If you want a deeper dive into one that\n[461.44s] what that specific term means and how it\n[464.96s] relates to this debate we''ve just been\n[466.639s] talking about, I''ve got a video on this\n[468.8s] topic that I''ll link on the screen in a\n[470.8s] moment.\n[472.8s] Meanwhile, I''m curious which view\n[475.919s] resonates more with your approach to\n[478.16s] practice, the cooling of the fire or the\n[482.0s] island of refuge. Let me know in the\n[484.72s] comments if this has helped you to a\n[488.0s] little bit to clear up these mysteries\n[490.24s] of Nirvana. A like and subscribe are\n[493.12s] always appreciated. Thanks so much for\n[495.52s] your continued practice and please all\n[497.759s] of you be"}'
