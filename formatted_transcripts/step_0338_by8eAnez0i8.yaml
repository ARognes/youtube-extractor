transcript: Yeah, I think it's about time for me to make a four-dimensional game. But, I want to do something a little different. There's already some four-dimensional games released or in development. But, most of these games are not a full first-person experience. They're not what you would see if you lived in that 4D space. You see, the fourth dimension is almost always explained using the slicing method. And then, in the game, you play in a 3D slice that was cut out of the 4D scene, and that becomes a play area. You don't really interact much with the fourth dimension other than moving that slice around. To give a real example like that a dimension lower, the game FEZ is played on 2D slices of 3D space. So, technically, yes, it is a 3D game with a third dimension you can interact with. But, for the most part, it's still plays and feels like a 2D game. And to be clear, I have nothing against the slicing method. It still makes for great games, and maybe it is easier to introduce 4D concepts that way. It's just not what I want to do. 4D Miner is probably the closest I've seen to a true first-person perspective, but I wanted to try to push it further. So, what is the best way to think about a first-person 4D game? At the end of the day, screens and even the retinas of our eyeballs are 2D. So, we'll need to put a 2D camera into a 4D scene. That's hard to visualize, so let's think about the analogy a dimension lower. A 1D camera in a 3D scene. As a flatlander, you only have one degree of freedom to rotate in your plane, and the sphere would look exactly like how you would normally see a circle in your world. But, now we have an extra degree of freedom to rotate and move in. And actually another one since the camera can roll. An issue with this is that it's really easy to lose sight of things. Once you look in the wrong direction, you just can't see anything and it's really hard to find your way back. So, the way I decided to solve this was to also project the entire scene onto the camera's plane as a semi-transparent layer. That way, you'll always know a rough direction to find things and I can use the opacity to tell you how far away it is in the direction you can't see. In four dimensions, we'll actually have six degrees of freedom for rotation instead of three. But, luckily we only need to use four of them since the other two will cause the camera to roll, which isn't wanted for a game with gravity. That's convenient because the usual two are controlled with a mouse or thumbstick and you can just hold down a button while looking to control the other two. So, this is what it looks like right now. You can look and move around in the usual directions, but holding down the mouse button allows you to change your view in the other dimension. I have also added a little compass to help you understand where you're looking in 4D. Here you can see some of those shadows I was talking about in the 3D example. It makes it way easier to navigate. And here's another weird thing I didn't realize, but it makes perfect sense in hindsight. Whenever you walk into a wall or other object, you usually end up pushing yourself through the extra dimension. That's because when something is angled into that dimension, you don't just stop, you slide along it. This is basically how all first-person games work when you walk into a wall. Okay, cool demo. But, what are my plans with this? Well, I don't really want another multi-year project right now like Hyperbolica. So, this will probably be a relatively short and minimalist game that I just spent a couple months on and release. Of course, I'll open source the engine as usual and expect a couple more dev logs about it since it's a really interesting topic. Right now, I'm thinking of making it into a mini golf game. I think it'll help build intuition about 4D space because it really forces you to understand how the space works in order to get the fewest strokes. But, it's very early in development right now, so I could end up doing something completely different. I guess you'll have to wait for the next dev log. And another big announcement, Hyperbolica is finally available for the Oculus Quest. So, check out the link in the description. Thanks for watching.
