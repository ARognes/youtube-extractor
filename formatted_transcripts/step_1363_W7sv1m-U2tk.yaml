d accountable or talk about what they're doing is in the daily standup meeting and you know if you've if you've been in in a team that does this the daily standup meetings the daily scrums you know it can be really tough every day to try to think of oh gosh how do I communicate what I did this week but one of the things I think a lot of people don't realize is if you really want to get recognized if you really want to get rewarded if you want to move ahead one of the best things you can do is send out let's say a status report just a simple Google doc every Friday let's say or every you know Wednesday whenever it makes sense for you where you just give whoever you're personally responsible to some sort of highlights of the issue Maybe again not too many problems I talked about that in point one but maybe one of the biggest issues that's on the project if it's still an issue or you know talk about major accomplishments that you've completed when they haven't even asked for it now again I wouldn't say you have to do this with every person that you report to but if you have a a difficult relationship with a manager or a project manager or a scrum Master somebody like that and you can tell this person doesn't have a lot of faith in the team or maybe you if you volunteer just send them an email and say hey I thought it would really help you I know we've got jira or I know we've got you know whatever tool we're using aana you know for managing tasks and all that I thought it would really help you if I just kind of elevated some of the the major issues that I feel like we got to stay on top of week to week so this week I'm just sending you a quick dock here's some of the things that might really help you keep the project on track if you know where they're at and just choose a few things that that are on your mind that you think it's really important the management that that's on their mind I think they're going to see you as a team player they're going to see you as being 