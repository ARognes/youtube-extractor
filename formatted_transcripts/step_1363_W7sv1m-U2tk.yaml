n they're paying you and they'll continue to pay you so today I'd like to share several tips with you on how you can actually increase the confidence that your company has in you as a programmer the first one of these is you really got to minimize communicating problems and doubt about the project now this is pretty counterintuitive as developers we're often hired to solve problems or again that's what it looks like we're hired to do and it's only natural that when you join a software project or like you know I was a consult in the second half of my career if I went on to a new client project within a very short period of time I would start to notice red flags and problems or let's say you get into a code base and you realize some serious problems with the software architecture I would think earlier in my career that I should document all those that I should share everything I find and that somehow then management and other developers are going to look at me as more valuable because I'm finding the problems but and this is such a hard lesson I had to learn it's just about human nature it's about just the reality of how people are if you share too many problems that you see with the software project with someone's code with let's say process or requirements or architecture at one time it overwhelms people and it makes them look at you sort of as Debbie Downer you're you know just a negative person that's constantly complaining about problems so hear me here this is subtle I'm not telling you to avoid problems that you see and pretend they don't exist it's actually really important that you are aware of problems I mean I think one of the reasons why we tend to overcommunication problems is because we're worried if we don't let management or let's say other developers or product management or whoever know that we found some problem well once stuff hits the fan and it and you know the problem turns into a real problem we're worried that we're going to get blamed and that's a natural thing to worry about you should still be aware of the problems that you encounter but one of the biggest mistakes I made earlier in my career was just thinking that people were going to really value you how much I rais doubt and if you think about like as a project manager if you cast doubt on the way the Project's being managed requirements are being managed testing is being done you're kind of calling their baby ugly so to speak you're kind of sending a message to the management or the project management you're not doing a good job and that could be totally true that you could be completely right but you have to be patient and careful with how you actually communicate that so I would really just suggest if you see a lot of problems on your project write them down take note of them and maybe pick one at a time maybe two and communicate those to whoever needs to know about it and just wait until that one issue is dealt with then raise some awareness of the next one that's really going to fight against people unfortunately having low confidence in you because they're kind of going to look at you like how come everybody else on this project isn't raising these problems and isn't saying they have all this doubt in the project but you are and again you would think that people would see value in that but I just had to learn the hard way they don't the second thing you can do to really increase management and the company's confidence in you is to repeat the desires of management in the same language that they use I learned this technique as a consultant but let's say you're on a project and in the scrum meetings you're always hearing people talk about making sure they satisfy the customer well we got to satisfy the customer well is that satisfying the customer and you hear that phrase over and over again in scrum meetings or status meetings or requirements meetings if you start to use that same terminology just say oh yeah I'm I'm implementing this feature you know to satisfy the customer or well I'm a little concerned about this one aspect I don't think we fully understand it let's have a meeting to discuss it so that we make sure we satisfy the customer you're going to build rapport with whoever you're reporting to whoever needs to build confidence in you because let's be honest we're all a little bit narcissistic even if we don't have you know full-blown NPD or narcissistic personality disorder we all like to hear what we say repeated we all like to see other people agree with us and so if you kind of drop phrases that you're hearing your management use about the things they care about and about the things they're measured by and what's top of mind for them they're going to kind of subconsciously see you as aligned with what they're looking to do and if at the end of the day what's going to keep you employed and what's going to get you promoted and rewarded and recognized is that everybody has confidence in you that's an easy thing you can do that'll really help [Music] the third thing you can do that'll really increase management and other people's confidence in you and that's really ultimately believe it or not what they're paying for is to anonymize blame that you place on dependencies WOW what does that mean well let's say you're on a project and you have some task you got to complete and it's dependent on another developer getting their work done or you know you need to deploy something into a production environment and for whatever reason your company isn't fully doing devops and you're not empowered as a developer to do so and so you have to go through an operations team or some sort of checks and balances and they don't get their thing done in time they aren't ready you know the the easy knee-jerk reaction thing that have done and many of us do is let's say we're in a status meeting we're in slack whatever we just want to kick the tires and to the other person we just want to you know kick a can rather and just say oh well that was you know Jerry's fault or oh well that's the Ops team's you know responsibility and what I learned as a consultant that's a way better way to do this is to basically frame the thing that wasn't done just stating that it wasn't done and what aspect of software development or what department was responsible and let management and other people come to their own conclusion of whose fault it is so again in that case where the production environment wasn't set up let's say they're asking you hey Jamie you know I I I I expected that feature to be done you know and and it wasn't done or like we're behind on this rather than just saying well the Ops Team didn't get things ready for me in time you could just say yeah well there seems to be some issues with the operations environment not being in the state that it needs to be where I can actually deoy it yet and then they're going to ask you well why why are there issues with the with the production environment well I'm not really responsible for the production environment so I can't really say it's just not in the state that I can do you know do it yet they're going to go well they're going as soon as you say that they're going to think in the back of their mind well wait a minute Jim's not actually responsible for operations who is oh Bob or Jerry or Mary or you know whoever the other person is and they're going to get off your case and go talk to that person but the the reason why I recommend that you do this is again if you want to build confidence one of the things that I think can cause you to lose confidence with your management and other people is if they're worried that you're constantly blame shifting meaning you're Shifting the blame for things that you're responsible for on other people now here's the thing a lot of times other people are to blame you know I'm talking about real situations where you're dependent on another team to deliver something they don't and therefore you can't complete your task but if you want to fight against that part of all of us who if we hear you know Reasons from other people that are valid over and over again we start to think they're excuses even though they're not it's just natural we start to think man every time I ask this person something they've got an excuse even though it could be perfectly valid anonymizing who the dependency is letting them come to their own conclusions will really keep their confidence in you the fourth thing you can do that's pretty straight forward to really increase the confidence that management and other people have in you is you got to reduce your throughput produce less deliver less commit to less why the hell would I be telling you to do this I'm not telling you to slack off I'm not telling you to not care about the project I'm not telling you to be you know doing less work than you think you should be paid for please you know I hope you know from watching all the other episodes of this show that I'm actually calling you be even more ethical than a lot of people I think that we run into but if you know software development you know how uncertain it is how many unplanned meetings come up how stuff gets thrown on your plate that you didn't expect how you're going to run into problems that you couldn't foresee you got to delay your commitments I've talked about this in many other episodes of the show you got to minimize the things that you're on the hook for and give yourself as much flexibility as possible if you want people to keep confidence in you because let's say you have three Tas tasks or four tasks in a row over a twoe period and every one of those tasks that you go to do you run into a real unforeseen problem that nobody could have predicted you couldn't have predicted it management could have predicted it so it's not really anybody's fault they don't really care as soon as you bring that problem to them and you say hey I I surfac this unforeseen complexity they're just hearing 