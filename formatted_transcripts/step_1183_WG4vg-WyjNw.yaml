me. Nintendo of course is going to do an awful lot  for that single-handedly. But y''all know how the internet is.  You have your like, you know, 15 seconds, much less 15 minutes of fame, but it''s very fleeting. And our hope is that the,  the game sort of comes out, it comes out the gates with a bang  and stays on everybody''s minds in a good way, hopefully for a while. AMIR: Well, so that''s not even the thing that I''m really most concerned about, even though that also sucks.  I''m worried about the, I''m worried about the patch. The version of the game that''s out there is like four weeks old. GREG: Yeah. - What is Eurogamer Essential? Is it, do they give numbers? - I think they don''t, right? - Okay. So then I think, I think, I think the main  thing then is we just need to confirm from someone on the team that  someone who downloads the game after 8:00 in the morning got a patched version,  in which case older coding set is fine. - Oh, IGN. GREG: What, what is it? AMIR: Is it foul that I''m just going to scroll to the bottom and tell you the answer to that? GREG: No, I''m still scrolling. AMIR: I''m still scrolling too, Oh my God. It''s so thorough. Nine? - Nine. Editor''s choice. - Where did it get a nine? - IGN. - Nice! AMIR: Okay, I''m downloading a patch. Yeah. It''s the game. GREG: Are you playing?  Is it unpatched for you? AMIR: It''s patched. GREG: Oh, it is patched? AMIR: Once I forced it. When Darren  bought the game, it was patched. GREG: Okay, so we''re just getting  kind of inconclusive reports. AMIR: No, no, we''re, we''re conclusive.  What''s conclusive is if you buy the game, it''s fine. Everyone you sent the-- GREG: So if you already have it  you may have to manually-- AMIR: It''s not you may have to, you have to. GREG: Oh, definitely have to. AMIR: So if you, if it matters, everyone  we sent review code to has to manually patch if they  want the latest version. WILL: We should try redeeming the review code  right now to see if it forces the patch. AMIR: The answer to that  was no, according to Paige. WILL: No? AMIR: It did not force the patch. Hey guys, the takeover''s live! We should put it on the big screen, the world''s largest Steam takeover. - Get in on that, what does it say?  Hades, Zeus. AMIR: This is a thing. - Oh, that''s so cool, that animation.  Josh do that? AMIR: Yeah, Josh did that. - That''s awesome.  Is this our first takeover? - So first takeover in the history  of our company on Steam. - It only took 10 years. - Came in, worked our way to it. [LAUGHING] - Yeah. It''s pretty exciting. - That''s really cool. AMIR: So today started  with a lot of activity. We just pushed everything  live, and it''s live on Nintendo Switch and for PC and Mac  on Epic Game Store and Steam. And it''s 1.0. We''re out of early access,  which is very exciting. Emotionally the main way in which  it''s different is when we worked on something like Bastion or Transistor or Pyre,  there''s this question that you have, which is like, will anyone care about this? And then you also wonder of the people who will care about it and take a chance on it, will they like it? Those are the two questions you have. There was never a question on this one, will anyone care or will enough people be interested that we''ll be able to do another one together. The early access has kind of shown that that is the case. We will be able to stick together as a team, despite everything that''s going on, and do more together. So that leaves will they like it.  Will they like it? And, um, uh, it''s too early to say. The thing about Hades is it''s  a game that you can play for dozens or even hundreds of hours.  So the answer to will they like it is going to take a little bit longer  I think for us to really know, especially for the people who kind  of stuck with us through the early access development. And then  for the people who held out, I have no idea what their expectations were about the game. And I''ll guess we''ll see if those are met, 