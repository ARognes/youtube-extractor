izes outstanding creative vision and innovation and game direction  and design, the nominees are: Final Fantasy VII Remake from Square Enix. - Best game direction. - Really? - Hades. - Oh! - Wow. - This is six? - Seven. - Seven? - Holy crap. - And I mean, we will have to have  been nominated for the next thing. - If we''ve got all the-- - Yeah. So we''ll see. I mean-- - I am proud to announce the six nominees. - The next one is-- - Is it always six nominees? - Oh, this is technical, no,  game of the year. Okay. - This is the one. - Wonder why it''s six. Do they usually do six? GEOFF: Animal Crossing New Horizons  from Nintendo. Doom Eternal from Id Software. Final Fantasy VII Remake. - Yep, there it is. - Dang. - Oh my goodness. - There''s Hades. - That''s pretty sweet. - That is crazy. - What? - So Ghost, Last of Us-- - One, two, three, four,  five,  six, seven, eight nominations. - That''s eight. - Is that the most? - It''s a lot. [LAUGHING] - It''s a lot. - Yeah. - That''s wild. Jeez. I''m, it''s funny. For some reason the Logan  best performance one was like-- - Yeah, my favorite one. - Maybe because it was the first one sighted. - Yeah, it was the first one. - Yeah, yeah. - I don''t know. ''Cause Logan, like,  he just has his voice to work with. He has to compete with like full capture high-tech state-of-the-art so he has to, like, he kind of has to be like an overwhelmingly amazing voice performance, - Greg what''s the list? You have them all listed? - Yeah, I have them all. I posted  them all in, yeah. So best performance, art direction, music, narrative, best independent game, action game, game direction, and game of the year.  Congratulations, jeez. - That is... - Congrats, team. - Quite a way to start a Wednesday. - We should-- - Tweet? - Tweet something. DANNY: Happy new year, Greg. GREG: Yeah, happy new year indeed. DANNY: Good to see you again. - Likewise. It''s good to see you guys. DANNY: How you doing? - Doing okay. You know,  when the launch happened on September 17th, the kind of arc of it for me reminded me a lot of how I felt after Bastion, though it was even more different than that. Where I think on the day of the launch itself, it was unclear that the game was like a hit, I guess. The initial reviews that we got were  very good, but not astronomical either. Our, you know, fresh out the gate, were getting kind of like 8.5 out of 10. It''s like, okay, solid couple of nines. Okay, good. It took a few days to be like, wait a minute. This thing climbed up the Nintendo Switch kind of best-selling charts, and it''s staying there. And we got to the second position just after the Mario 3D World game. So it''s like, holy...  We''ve, you know, we''ve jumped ahead of these other games that came out at the same time and then some of them Nintendo''s own games, you know, Mario Kart and Animal Crossing. We''re like, whoa,  we''re doing better than these games. That''s incredible. And then reviews kept piling on. And those 8.5''s turned out to be  like more the kind of statistical outliers. And suddenly it was just kinda like tens and nines and stuff. And it''s like, whoa, what, what is happening here? And then just like the reaction to it in general, just the volume of emails that were coming in and that sort of thing. And then we start getting nominated for big awards and then winning some of those awards as well. We''re past like 45 game of the year awards  as of right now. And this is, this is not including awards that aren''t game of the year. I don''t know that we''ve fully, I don''t know that I''ve fully sort of processed it. DANNY: Happy new year, Amir. - Thank you. DANNY: How are you doing? - I''m good. Yeah, I''m good.  I''m very good. Yeah. We are on the other side of  having shipped Hades. DANNY: Does it feel like you''ve  shipped Hades at this stage? AMIR: It won''t feel like I''ve shipped  Hades until we finish episode six of the Noclip documentary.  I feel like this is my last, it''s my last obligation, but also it''s just been a part of the, of the fabric of everything we''re doing, you know? We''ve had the cameras rolling and been recording meetings and all that kind of stuff. So for me, I feel like, okay,  once I do this, then it''ll really be done. But I''ve also told myself that about literally everything that''s happened since the summertime. It''s like, well, once we get this patch out, once we do cross saves, you know, once we get the patch after that out, then we''ll be done for real. But I mean, the truth is from having Bastion, Transistor, and Pyre with us is that it never, they never really leave you, right? You live with those things forever, or as long as we can see. So Hades has now just become a part of us, I guess, in some way. I think things have finally slowed down, which is, we were wondering how long that would take. It took awhile, took months and months and months. Things have finally slowed down. You know, our other three games,  there was like a month of sort of being connected to the thing, and patching, and all this kind of stuff, and thinking about, what we were going to do next. And within a month, people were taking their refresh and their time off and, and, and coming back and, and rejuvenated to figure out what did we learn and what are we going to do next? And that same process took us four months this time. It took forever. You know, it took four times longer because we just had so much stuff still. And then it felt like every week something new was happening, something amazing. You know, we were nominated for this or someone declared, you know, we were that, or this review came out or this streamer is playing the game now. The Washington Post is talking about the game, Time is talking about the game, these like huge things that suddenly, like even our parents know what that is. So we''re talking about the parento-sphere. It''s like stuff that leaves the orbit of games and, and joins the bigger conversation. So, you know, it''s been a delight and a joy that these amazing things are happening, but it''s also that  we just never turned off. - What are they doing in here? AMIR: They''re doing best art direction. Ghost of Tsushima won. Best action game. Doom, Hades. Holy fuck! We just won best action game. [LAUGHING] Wow. AMIR: So The Game Award was really,  really amazing because it was a live show with like, I dunno how,  I don''t know how Geoff does this stuff. But it was a, like a live show  with a zillion people. It had like the whole planet watching, including my parents. Honestly, it was just kind of cool to be connected back to other human beings. And also through the production feed connected to this wide world of video games. GREG: I had like, absolutely ridiculous technical issues happen. Literally minutes, like, I think like less than two minutes before, my webcam ceases working. And then my dogs went absolutely ballistic over something as well. There was like a knock at the door, which sends my dogs into like a, a fury and this, this is in the evening. [DOORBELL RINGS] - Shit! [DOGS BARKING] You got to be fucking kidding me. I can''t do anything. - What do you want? - Can you open the door and tell them they need to go? We''re right in the middle of a call, and  they need to go away. GREG: The, you know, the atmosphere couldn''t have been more different than, than our debut at the game awards back in 2018 when we were there physically in this, in this beautiful theater with a big audience, you know, filled with celebrities, not just from our own industry,  but from other industries as well. Here it''s just like sitting where I do sit every day, basically just with a slightly nicer shirt on, and then just kind of waiting on pins and needles for our categories to come up. We won in two of those categories for best independent game  and best action game, which is two more Game Awards than we''ve ever won. So it was, it was an amazing night in that we were so kind of heavily present for so many of those categories and picked up a couple.  But we didn''t get to, you know, we didn''t get to make our like live speeches or whatever. - No one, no one had to speak. Logan sitting there on a live feed, Greg sitting there on a live feed, me sitting there on a live feed. No one had to talk. We won best action game and best indie game. So that was cool. I said it at the time, but it''s just one of those things where those productions that we were next to in the game of the year category were really big video games in which our whole team, if we had worked on those games would be like working on one tiny part of it. You know, a lot of us had worked at AAA studios before this. So we lknow that a lot goes  into making such a big game, and it''s really hard to make such a  big game. Yeah. It was amazing to be able to be sort of so small and be on that stage. - Even in those days following the September 17th launch of Hades when the game started to stick on bestseller charts and started to get these really good reviews. You still don''t anticipate that like, yeah, we''re going to be a game of the year winner nominee, you know, next to The Last of Us Part II and Ghost of Tsushima and stuff like that. But that''s, that''s like where we were just in that conversation. And, you know, we were chosen as like Time Magazine''s and the Washington Post''s game of the year and stuff like that.  It''s like, so that''s, again, you know, we never knew we were working on that game. DANNY: How you doing Darren? DARREN: Doing alright, yeah. All things considered pretty good. DANNY: When you look back on all the music you made for Hades, you know that feeling when  you finally sort of made something, you can step away and look at it,  what comes up for you there? - Yeah. For, for Hades, I feel like I really enjoyed the style of music, and it was a lot of fun to make. Like just, I could kind of cut loose more I think for Hades than I have been able to in the past. I was able to rock out and really lean into my desire to do that, and then even go further past my comfort zone of how hard I feel I''m allowed to rock, you know? On past games, you know, normally there''s like a week where everybody''s excited about it, talking about it and they move on. But the fact that people have continued sort of talking about it and playing it, and people are playing it every day, people are streaming it. I mean, that''s been really crazy to see the sort of volume of the response increase so much. Part of it has to do with the sort of context in which 1.0 was released. I mean, it''s a game about doing the same thing over and over again and trying to escape hell. So it''s like,  you know, maybe a little too close, too close to people''s regular lives. DANNY: Jen, hi. It''s uh, it''s great to catch up finally. I know everyone was working from home back in March, but obviously your situation was a little bit different. - Yeah, yeah, yeah. So you probably already know that Supergiant Games as a company policy, we were working from Friday, or working from home on Fridays every week. So actually the transition for me was very, very easy. And in fact, because I was pregnant at the time, all kinds of things happen with pregnant ladies, including being very, very tired. And so in a lot of ways, transitioning to my home office actually afforded me the ability to maintain as much productivity, if not more productivity during the pandemic, especially. It''s not like I can go like to TJ Maxx or Home Depot and, you know, make the perfect crib for my baby from scratch, using hammer and nails. By the time I left on maternity leave, there were about two months of production left. I knew with so much certainty, I had so much confidence in the team as a whole, that it would be incredible, that I also felt this was the perfect moment to see what happens when you just leave. That is an incredible feeling to know that your team is so well-equipped to take care of a product during its most sensitive time. It''s, it was, and still remains incredibly hard to digest the level of success we''ve experienced, not just like sales, but the community support, the incredible fan artist community. To know that something you''ve made with just 20 people has reached so many others, and that they are saying these really incredibly nice things about it. It''s like, no, guys, come on. Don''t. It''s not that good. Right?  Oh, god. You''re just being nice. GREG: I qualify because, you know, maybe in saying this I''ll jinx it, but like Hades is the fourth highest  rated game on Steam, like period, across the tens of  thousands of games there, including basically all my favorite games ever, or a whole bunch of them. We rate higher than all those. That''s like a, it''s a weird feeling. AMIR: How can you qualify it? Other than it''s a success on every level that we intended and a whole bunch of ones that we had no idea would even be possible. And then people are sometimes surprised that we''re surprised, but I think that''s weird on another level, because as you can see in the Noclip documentaries, we launched this game like four times or something, right? Like this game has been launched so many times, and then it''s been updated so many times. So sometimes we, we ask ourselves, you know, like when did Hades become what it, what it was? Because it was something that  people enjoyed for a long time. But, you know, the combination  of declaring it 1.0, of putting the ending into the game and, and saying it was done, and you know, also, you know, being on the Nintendo Switch where many more people, might''ve been waiting for that experience as well. Just all of that suddenly, I guess, changed  the conversation around the game. - The fact that our 1.0 launch kind of lived up to the expectations of, of our early access players while also I think like for many players evidently exceeding their expectations, I feel really good about that. When we were in the thick of the pandemic, trying to wrap up development, I was talking to you about our plans for the ending of the game and that it was going to have this kind of unusual structure, and how do you end a game that can be played forever. That was like something that we were asking ourselves and I was asking myself from the very beginning of the project. So it was really exciting to do that and then to see that people enjoyed how we handled it. On a more personal level, you know, making sure that the story of this game and these characters that I hold so near and dear could conclude in, in a way that that kind of did right by these characters. It''s hard to end things in  a satisfying way. I think of so many TV shows and whatever where people are like, they love them all the way through. And then, and then the ending stinks for whatever reason. And it like ruins everyone''s entire memory of the show. It''s like you were invested in the show for years and years, and now you''re telling me you think it''s garbage just because you didn''t like the ending? But that''s how it works. Things can turn retroactively bad through a bad ending. And the endings of our games are a really big deal for us and for, for me personally. So yeah, a lot of relief when we, when that, when that turns out okay. DANNY: Right at the start, right before we started filming, before we talked about this thing you approached us. I remember because you, you know, you come from the media side as well, you wanted to sort of showcase what the reality of making games is, right? - Yeah. DANNY: And we tried our best, but we weren''t there for every single moment, right? So, you know, looking back at this series, what are the parts you think haven''t come across? What are the elements of games-- - It''s a great, it''s a great question. You know, when I think about what parts haven''t come across or don''t come across, I think the first thing that comes to mind for me is just some of the late nights alone. It''s always a challenge I think with any game just knowing when you''re done, the moment when you like walk away from your computer and go back down, like that''s a moment that would be interesting, that would be really hard to capture. Just the slog of it, the part where there''s just a bunch of stuff that has to be done and it''s tinkering away at something that with, with little immediate evidence as to what is even being done or something like that. And this, you know, Hades turned out to be this big, like content heavy game. And people are like, oh, wow, I''ve played all this time. And they''re, you know, none of the audio lines have repeated. It''s like, it''s ''cause we put a lot of audio lines in the game. - Yeah. I think there''s something like 22,000-ish lines of dialogue in the game. I believe Zagreus has about 8,500 or 9,000 or something by himself. I think Hades probably has the second most lines of any character, over a thousand. And yeah, I mean, I think there''s over like 300,000  words or something in the game. I''m just thrilled by the sort of general response to the VO, actually, especially given how we finished VO  and we kind of sent all the actors kind of crappy USB mics. And I just was like, well, I''ll fix it in post and do my best to match it. And you know, and it worked out, you know, more or less. I think when it''s safe to go back, that''s when we should go back and not a minute before, you know, but I''ll be happy to go back to the office for some amount of days a week. I think it''s just, there are, there is some valuable stuff that you can''t quite recreate in this kind of environment, especially creative discussions and that kind of thing. JEN: Pre-production process and planning process, so much of that is the organic part.  I think once you hit production, you know, everything is kind of, there''s a flow to it. It''s on rails. You kind of know what you''re supposed to be doing, whereas in this kind of purgatory between projects, that''s when I think the lack of  face-to-face communication and just ad hoc in-person conversation is going to maybe hurt the process. But maybe not. Again, maybe we''ll just make that much more  of an effort to make ourselves available to each other. AMIR: How can you miss people you talk to on Zoom all day? Somehow you still can. It''s just one of those things where enough  time has passed that I almost forget all the little parts of it. And then I''ll see, you know, JP at The Game Awardthing or something like that, and then you''ll remember, oh yeah, this is what that was. So yeah, I mean, I miss, I miss everybody. I can''t wait till there is a time when it''s safe to see each other. I remember feeling like this immense pride in the team because each of them could probably just glance at the general blast radius of the game and find something that was representing a thing they did personally. ''Cause it''s a small enough team and you know, everyone did a piece of it. For some people it''s their first game. And for some people it''s one of many games they''ve made. But all of us got to kind of share that together. We were really lucky on our first game Bastion, that it got received so well. And I think the seven of us had a bond from working on that game, but the kind of response we got brought us together. At the same time, because this type of response isn''t guaranteed, you have to be doing it for reasons that are not to get this type of response. And so we obviously really like what we do and really love working together. And so when things like this happen, it just feels overwhelming and sometimes mysterious. I have always had a mentor and a leader who was inspirational to me. He basically told me that you have to be really careful about the stories you tell yourself. Almost the temptation of success is to say your process must have been good because the game was good, right? And it''s really tempting when things go so well to, to make that story be whatever you want it to be, right? That it was all you, or that it was all the team or,  you know, it was, it was all X, Y or Z thing, but it really was a lot of things. And a lot of things that even you don''t control, you know. We had really good partners. We had really amazing fans. We had like an incredible team. We had the right game at the right time. And so, part of what our job is after the game has done is to really understand what happened. And that takes a long time. DANNY: What''s next? - If I tell you it''ll, it''ll just be upsetting.  We''re doing a patch, Danny. [DANNY LAUGHING] That''s what''s next, we''re opening a patch on the test server. We''re going to fix some Hades bugs. That is literally what I''m about to go up and do. I''m going to review the change notes with Greg and Gavin, and we''re going to make sure that it''s all sensible and then we''re going to put it on a test branch. And then we''re going to put it on, you know, the PC and the Switch. And we''re going to, we''re going to make a patch. DANNY: What type of game would  you like to make next? - I don''t know. Oh my god. It doesn''t even matter because  it''s honestly, it''s like, you know, what type of game do we  want to make next? That''s the actual really salient question, not what kind of game I want to make next. Yeah. We''ve got to figure that out.'
