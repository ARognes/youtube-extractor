e have been, I mean, we''ve never had a game kind of at that level. Like I think, I think it''s shifted a lot too. ''Cause there used to be, in the Bastion days, it was like, oh, indie game of the year. You kind of, it was, it meant a lot for sure. But there was like this bigger divide. It was like, there''s a sense that there''s no way really that, that it would be unfair for like a smaller game to compete against a bigger game. But then, then Journey the following year, like won, like swept game of the year awards, including like for independent games. So then people are like, oh wait. And I think the lines have kind of blurred. You know, independent teams have gotten bigger and stuff too. So yeah, we''ve never gotten big game of the year nomination, I don''t think. Yeah, it''d be cray cray if  it does happen for that. I would be pretty surprised and impressed. - So less than one minute to go, we threw  together this quick zoom call to watch together The Game Awards 2020  nomination announcement live stream. There''s been a lot of excitement around Hades, so we''re curious to see if we are in the conversation or regardless of that, what, what games get picked because it''s been a real interesting year for, for games. I was talking to Amir about how like Final Fantasy VII Remake, that feels like it was a long time ago. ''Cause I think it was pre. I, that''s my, one of my favorite games of the year, but it was like, I think it came out in like February. - May as well be infinity ago. - Yeah, right. It may as well. It feels  like the year really started in-- - Yeah, didn''t really get going until March, you know? - Well, this will be, this will be interesting. - On December 10th, the world will come  together to celebrate video games at The Game Awards, streaming live everywhere. Hey, I''m Geoff Keighley, and welcome  to the nominee announcement. For best performance the nominees are: Ashley Johnson as Ellie,  The Last Of Us Part II. GREG: Kicking it right off. GEOFF