es we still need to discuss and figure out how we''re going to do. And like I said yesterday, the like main,  the primary task if you are not actively supporting some part of the launches, try and, uh, try and get some rest. Alrighty. So I think that''s all. I''ll see everyone in Slack and all the other places. Thanks again. Bye. REVIEWER: Hades is a one of a kind roguelite  that sets the bar for creatively combining wildly different genres together and using their strengths to complement each other  in unexpected ways. It''s blend of satisfying twitch based action with countless modifiers to build replayability, dating simulator as character interactions, and turning failure into a thing you look forward to as a means of progressing the story, all coalesce to an experience that is more than the sum of its parts. I''m over 50 hours in, 70 escape attempts deep, And I can''t stop thinking about my next trip to Hell, because Hades is an experience I never want to end. REVIEWER: When I''m not playing Hades, I''m thinking about how cool it would be to build the Exagryph machine gun with lightning boons combo that got me that first victorious run, but also throw in some critical damage. REVIEWER: Hades is one of the  best roguelites you can play. An interesting cast of characters  anchored by the loveable Zagreus is worth learning about while the seemingly  never ending upgrades always provide something to work towards. A few more bosses and environments would have helped the long road toward the true ending, but with so much weapon and build variety, each run offers a unique and rewarding trip through the underworld. - Hey, this is Greg. It is October 1st, and today, what is it? Thursday. It''s two weeks after launch. It''s been insane. This two, these two weeks went by very, very quickly. I''m dressed all fancy because this is going to be our launch party right now. Obviously we can''t do that in person, but we have made some arrangements. Our folks Caitlin and JP have 