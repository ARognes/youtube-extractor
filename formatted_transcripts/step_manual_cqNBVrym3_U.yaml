transcript: '{"content":"\n[0.43s] Why does it seem like some people on software projects just never \"get it?\". No matter\n[5.769s] how hard you try to convince them of something you give them all kinds of information and\n[10.15s] try to tell them what''s in it for them - they still don''t want to support you. Well today we''re going to talk about why sometimes\n[17.619s] programmers never seem to agree and what you can do about it - right after this.\n[30.4s] Hi, I''m Jayme and at Healthy Software Developer,\n[33.15s] I want to help you have a long career where you don''t get burned out\n[37.09s] You don''t get pushed around by people that don''t really understand software development\n[41.61s] so you can just have a really fulfilling career. In the first 10 or so years of my career\n[47.17s] I got really good at software development and testing and agile development and a whole bunch of different things.\n[53.44s] And I got really frustrated when I couldn''t convince certain people that an idea\n[58.35s] I thought was really gonna help us would help them too. And so in this video\n[62.76s] I''m gonna help you understand a little bit about what I''ve learned about why this happens\n[66.99s] and hopefully give you some tools that will help you avoid it and get through to people.\n[71.92s] When we''re in a software development project a lot of the debate and arguing is really about practices,\n[77.52s] and I''m going to give you just a couple examples.\n[81.609s] One might be code reviews. There might be some people on your team that think it''s a good idea, and\n[87.1s] some that think it''s a horrible idea.\n[91.0s] Another one might be manual testing being done by dedicated QA engineers. At some companies\n[96.87s] this is looked at as very beneficial,\n[98.56s] and at some other companies and by some people they might think this is a really bad idea and that\n[103.75s] everything about your testing should actually be automated.\n[108.63s] And finally another example of a practice that people often debate is\n[112.47s] whether the product manager on your team if you have one should write the\n[116.91s] requirements for your software. And on some teams the software developers will write the requirements, some will have a business analyst,\n[123.56s] but these are just three examples\n[125.04s] of practices you probably run into all the time on a software development project that people can often debate.\n[132.69s] Now there''s an endless number of practices that people come up with and they can debate\n[137.31s] but really if you think a little bit bigger picture about these practices\n[141.26s] we argue about they fit into some sort of larger things that are called\n[145.86s] principles. And a few examples of these principles that might be driving people to choose the practices\n[152.42s] they do might be statements like this. The thought that \"quality on a software project matters\". The thought that\n[160.95s] \"individuals make mistakes\", and maybe the thought that\n[165.57s] \"developers are really just best at writing code\".\n[169.19s] And those might be\n[170.91s] principles that an individual or a team or a company have chosen to agree on and they kind of drive all the\n[178.62s] practices that everybody chooses to use on a project.\n[182.58s] But there''s an even deeper root cause that''s usually driving the reason why people\n[187.35s] have adopted the principles that they have that is usually not talked about in a lot of software projects unless people have really\n[195.03s] authentic and close\n[196.83s] relationships with each other and that''s what their beliefs are. So in this example\n[202.86s] the belief that might be driving those principles that everybody has sort of made a lot of\n[208.98s] practice decisions on could be the thought that\n[212.07s] \"programmers can''t be trusted\". And I personally don''t agree with this belief\n[217.34s] but there are a lot of managers and people and software companies who unfortunately\n[222.66s] do hold this belief and so when two people are\n[226.799s] arguing about why should we pick this practice one of these little purple circles\n[231.83s] and they''re trying to talk about how it helps quality and be improved and all these different things these different\n[238.2s] principles the ones in the middle, the green circles\n[240.99s] for why they are selecting that practice, it can feel very\n[244.6s] frustrating sometimes when you don''t seem to be able to get through to people and usually this is because\n[251.02s] there are conflicting beliefs.\n[253.87s] Somebody out there believes programmers can be trusted and so their set of principles and therefore\n[260.95s] practices that they believe in and they think are a good selection for the project are in conflict.\n[267.25s] And so if you''re gonna resolve this\n[269.86s] situation the only way that you really can is you can''t continue to just argue about and try to educate someone about why a particular\n[278.26s] practice helps the principles that they''ve sort of stated publicly. You need to get to know that person better.\n[284.1s] And this is something that I did really poorly earlier in my career. And as software developers, I think we spend so much time\n[291.64s] whether we''re in UX or operations, or we''re actual just programmers sitting on the computer writing code\n[297.51s] we don''t kind of get the social interaction with the rest of the business. But oftentimes\n[301.83s] I think what it''s going to take is, for you to resolve that conflict you have to figure out\n[306.93s] \"what are the beliefs of the person that''s disagreeing with me that doesn''t want to do this thing that I think is a good idea?\".\n[312.97s] And discovering beliefs is really a pretty simple process, but a lot of people don''t have the courage to do it.\n[320.89s] It really just starts first with asking if somebody''s recommending a particular practice,\n[326.04s] and this doesn''t matter if it''s managers asking you to do it or you are a software developer\n[331.17s] and you''re asking someone else in the company or maybe one of your teammates to do it. The first thing is just to ask\n[336.64s] \"why?\" and try to get them to go a little bit deeper into maybe the principles that are driving them.\n[342.51s] And you''ve probably heard this concept Eric Ries who wrote the Lean Startup calls this \"the 5\"\n[347.64s] \"whys\" but he didn''t really invent it.\n[349.65s] This is just a an approach that a lot of people used to kind of get to the root cause or belief or something.\n[355.63s] So once you know a little bit about the\n[357.91s] principles that are driving someone to tell you why they think you should follow some particular software development practice,\n[363.61s] you need to ask them \"why?\" again and in this diagram\n[367.26s] I''m just showing you that you only may need to go to levels deep.\n[370.38s] But you know the concept of the 5 whys, and five is just an arbitrary number,\n[374.74s] but it''s really just to get across you may have to ask \"why?\"\n[377.86s] many many times of a person to get them to really break out of maybe the\n[384.22s] mindset that they''re in because they don''t even realize that that belief that''s deep down inside that''s causing them to feel what they do.\n[392.44s] So if you want to get other people to agree with you and they seem to have conflicting beliefs\n[397.349s] and you''re not really sure what those are I would just encourage you to watch some of the other\n[401.77s] videos on my channel where I talk about getting support for your software ideas and\n[407.229s] having the courage to get off the computer or make phone calls. And I know we all hate it. I''m telling you\n[412.919s] I''m an introvert at heart too a lot of programmers and software developers are. But I''ve just found that\n[419.919s] sometimes it''s not worth months and months and months of\n[423.61s] frustration on a project when all it really takes is having the courage to sit down with somebody\n[428.199s] try to not just explain why they should do something, but get to know them and get to understand\n[433.62s] what are the core beliefs that are really driving the resistance that you feel?\n[438.13s] So have you ever dealt with a really resistant person who you try to get through to\n[443.05s] you''ve given them a lot of information, and they just don''t seem to care\n[447.22s] or you''re not able to really get them to be open to your idea because they have some sort of limiting belief?\n[453.729s] Leave me some comments below. If you''re new to my YouTube channel go ahead and subscribe, click the bell icon\n[459.36s] and you''ll actually be notified each time\n[461.37s] I post new videos. And you can also listen to this as a podcast on Google Play, Stitcher,\n[466.86s] SoundCloud, or iTunes. So until next time, thanks."}'
