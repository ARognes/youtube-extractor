transcript: let's talk about the Nikon F3 when this came out in 1980 it would have cost over a thousand dollars it was a top of the line camera yeah I bought it about 10 years ago with lens for 50 Quid now it has gone up a bit since then but even 100 pounds is a steal for what is an amazing camera it looks a lot like a chunky 35 millimeter SLR and it is but the gimmick with the F3 is that they try to make it a system camera that is they took the modular assembly format of much bigger cameras like a Hasselblad and they shrunk it all down into this tiny format is it useful for photography not really I love how much control you have but it's exceedingly rare that I feel the need to say hot swap my focus screen out in the field however if you want to learn about cameras and how they work the F3 is perfect the whole point of an SLR is that what you see through the viewfinder is as close as possible exactly what ends up on the film I mean the age of digital cameras with live view that might not seem like a big deal but in film photography it was everything cameras like this rangefinder simply have the lens in front of the film with shut up in between but you'll never know exactly what's going to end up on the film in order to frame a picture you have a separate viewfinder which uh it's fine but you always have some Parallax area between them and then to get your picture in Focus well that's why you have the rangefinder mechanism this camera has a fixed lens but with rangefinders in general if you wanted to change the lens really that meant changing the viewfinder and usually that just meant drawing frame Lines within the viewfinder but some lenses came with goggles that would sit over the viewfinder and expand the field of view and the other end of the scale if you've ever used or seen someone use a large format camera you can probably guess that they're the most impractical kind of camera but they also give you the most control every time I've ever used a large format camera it's been a fantastic experience it really makes you feel like you can control everything with large format cameras you always know exactly what will end up on the film because you set up your shot with a ground glass you take the back of the camera off and you mount a ground glass where the film would be it's just a piece of glass with a texture on it that scatters light you lock the shutter open the image is projected onto the ground glass and you get a real-time preview of what the photo will be it's very dim which is why you need the hood to block out other light but once you've got your image framed and in Focus you can then close the shutter remove the ground Glass Mount the film back double check the shutter really is closed then remove the dark slide in front of the film and then finally you can expose your picture you do everything right the picture matches the preview exactly SLR single lens reflex is a way to automate that process instead of hot swapping the ground glass and the film they're both fixed in place with a mirror behind the lens that redirects the light when you take a picture the mirror moves so now we're clear on how an SLR Works let's take a look at how the F3 does it let's start by removing the back this is normally how you'd load the film the back on the F3 is fully removable because one of the accessories I don't have is the bulk film pack which would let you load a hundred feet of film the film is pulled across these rails and it's held in place by the pressure plate here a horizontal focal plane shutter it's made of titanium foil the wind on lever both the shutter and advances the film with the sprockets of course since this is the F3 where you can choose not to advance the film if you want with this multiple exposure lever with that we can the shutter without the film advancing foreign if we had the motor Drive accessory it would connect on the base here and there we should just drive the wind on lever for us the viewfinder is a pen to prism and underneath it is the focusing screen we can see on that focusing screen exactly what the camera sees all the pentaprism does is reflect that image in such a way that it's the right way up when viewed from this direction if you just put a mirror there with the upside down the viewfinder has a built-in shutter and this is specifically for if you're using a self timer or cable release in direct sunlight normally your face is in the way but if direct sunlight goes into the viewfinder well it's not going to affect the image but it might affect the metering so if that's a concern just take this down even a modern DSLR has something similar on this one there's a blanking plate that's normally kept on the strap and that serves the same purpose it's not quite as swish as the F3 solution though the pentaprism can almost be used as a really terrible Loop I don't mean optically terrible I mean whatever you're looking at has to be illuminated from behind any dust or dirt you get on that surface is going to be visible in the viewfinder it won't affect the image on the film but it will be annoying same as if you get any dust or dirt on the focusing screen in comparison any dust or dirt you get on the lens well that will affect the image but it'll be so out of focus that the effect is extremely minor okay the exception to that is bokeh if you are focusing close and you have points of light in the background these become what are called the circle of Confusion And if you think about the Optics each of those circles is in effect an image of the aperture of the lens so any dust or dirt on the lens will directly show up there I have another viewfinder here this is the waist level finder and I like this one because there's virtually no Optics in it in an era before you know digital articulated screens being able to change the direction of the viewfinder was kind of a novelty as I say there's no Optics in it but if you do want to hold it up to your eye it does have this little pop out close-up lens if we take out the focusing screen we can see that it is just a ground glass and the bit in the middle is the split prism which is to Aid with focusing and the main variation between different focusing screens is just different types of split prism I've never fully gotten my head around how the split Prism Works optically but they're very useful I wish my DSLR had one a few different focusing screens as I say it's mostly a gimmick but this one has no split prism at all and I believe the very earliest types of focusing screens really were just glass that had been sanded but in this era the focusing screens have a special texture on them which maximizes the light scattering in the right direction with the focusing screen removed we can now see the mirror I'll take off the lens you can see the mirror better ordinarily light through the lens is reflected onto the focusing screen and is seen through the viewfinder when you take a picture the mirror moves out of the way [Music] [Music] and that's the main idea of an SLR but there are a lot of subtle problems involved in making this work so let's dig deeper looking at the lens this is a prime lens means it has a fixed focal length and doesn't Zoom for 50 millimeters it also has the simplest Focus system as I turn the focal ring the entire lens assembly moves in and out as one unit none of the bits of glass move relative to each other it is made of multiple bits of glass multiple elements but that's only to correct for optical aberrations the most famous example is the achromatic doublet dispersion means that the focal length of a simple lens is a function of wavelength blue light focuses closer than red light but if you have two lenses of a different refractive index called crown glass and Flint glass and you make a converging lens with one and a diverging lens with the other it will partially correct for this effect list order correction the focal length as a function of wavelength changes from a straight line into a parabola bringing two wavelengths into perfect Focus with more elements and more types of glass you can do higher order Corrections this lens also has an anti-reflective coating that's the purple tinge you can see in the reflections there's a thin layer on the front again in a different refractive index of exactly a quarter wavelength so giving you two Reflections that destructively interfere but because you can only target a single wavelength and this lens only has a single layer of anti-reflective coating it targets the middle of the visible spectrum so Reflections at the extremes of red and blue can still be Seton here's a wide angle lens this is a 28 millimeter and again this is a prime lens has the whole assembly move in and out as you focus however the distance from the lens mount flange to the film plane which is marked by that symbol there that distance is something like 46 millimeters which is obviously longer than the 28 millimeters of this lens and this is one of the disadvantages of an SLI is that that mirror is always in the way so they have to add additional Optics onto a wide angle lens in order to project the image further back these extra elements not only make it more expensive but more glass means more aberrations which don't have to be corrected for technically this assembly is known as a reverse telephoto setup because the definition of a telephoto lens is a lens assembly which is shorter physically than its own vocal length and what we've got here is kind of the opposite I have here a couple of modern Ultra wide lenses this one zooms to 11 millimeters and this one's a fisheye at eight millimeters and both of these lenses use a spherical Optics it's very cool what that means is that using computers and robotically controlled lens grinding they've produced glass elements with a special curvature that essentially allows you to do magic this sort of thing was not possible back in the 70s at least not in the way that could be mass produced so the amount of fisheye or Ultra wide lens to the F3 it has a mirror lock-up mode using this lever we can lock the mirror up and now you can mount a lens to it which protrudes right into the camera body right up the shutter if it needs to the viewfinder doesn't work in this mode but if you're shooting a fisheye the viewfinder isn't that important anyway with the mirror locked up you can now see the shutter from this side and if we put the camera into time or bolt mode we can lock the shutter open and now there's basically nothing to it just have to resist the urge to put your finger in there as you release the shutter going back to the lens we in aperture ring which adjusts the iris and this lets you reduce the amount of light and also increases the depth of field it also improves the image quantity a bit because most of the aberrations particularly things like spherical aberrations are more pronounced at the edges of the glass stopping down the aperture will usually improve the image sharpness but in some situations that's less important than getting the most amount of light or getting the shallowest depth of field if you stop all the way down then the image quality degrades again due to diffraction and this is the same reason that a pinhole camera never has good image quality light passing through a small Gap or even just past an edge will diffract diffraction is always present but it only becomes dominant at the smallest apertures diffraction is the same reason we get Starbursts if you take a photo of the sun light diffracts around the aperture blades and leaves a mark on the image if the iris is perfectly circular it just has a uniform Haze but if the aperture blades are straight it leads to these Starbursts Nikon lenses have a distinct starpost because they have seven straight blades which leads to a 14-point starburst lenses with six blades have a six point Starburst it's only the odd numbered aperture blades that give you this double starburst we adjust the aperture using this ring but there's also this spring-loaded part here the reason for this is that if we stop the aperture down the camera's viewfinder will get very dark F-22 you wouldn't be able to see anything so when you mount the lens to the camera it holds the slever in such a way that the aperture stays wide open you can then select the aperture that you want and it's only when you press the shutter button that the camera releases the lever it jumps to the selected aperture the picture is taken and then it jumps back we can see the lever on the camera body that does this and we can activate it using the depth of field preview button on later cameras the depth of field preview button is electronic it has to be because they slightly change how the aperture is controlled but here it really is just a physical button that moves the lever when you take a picture the lever goes down the mirror goes up the shutter is fired mirror comes back down again and the lever is released all mechanical all within a few milliseconds well actually the shorter timing on this camera is electronic the timing of the shutter is controlled by a quartz crystal and an electromagnet but because it was newfangled and untrusted they also added a mechanical shutter release that's that's here and this means you've got a fixed shutter speed of 1 60th but you can it means you can use the camera without any batteries the aperture numbers are written on the lens twice the big numbers are for us to see looking at the lens and the smaller numbers are to be seen through the viewfinder there's a cut out here and the viewfinder contains a kind of periscope that lets you see what the selected aperture is the metering system also needs to know what the aperture is and that's done through a coupling on the lens mount there's there's a cut out on the lens which transfers the aperture number to this ring here as you rotate this internally it's pulling on a tiny tungsten wire but here's a detail that sets the F3 apart some of the older lenses you know from the 1950s were built before this system was invented and they would not be able to mount onto the camera without coupling in place so in order to maintain backwards compatibility there's a tiny button there you can press and fold the aperture coupling out of the way that is what you call commitment and attention to detail let's talk about metering one of the most important things in photography is getting the right amount of light on your film or digital sensor too much or too little and your picture won't come out I call it Overexposed or underexposed the amount of light that reaches the film is primarily controlled by the shutter speed and the aperture and the amount of light you want to reach the film is controlled by its sensitivity called the film speed or ISO number or ASA the units we use are called stops or EV stops increasing the exposure by One Stop means you have doubled the amount of light and decreasing it by One Stop means you have the amount of light and so on it's easy to forget because our eyes are just automatically just how much of a difference there is between a bright sunny day and being indoors in the evening it can be more than 10 stops which is a very big difference using stops does make it easier to manage things if I reduce the aperture by two stops then I know I need to increase the shutter speed by two stops to get the same amount of light on Old cameras or even modern land cameras there's often no electronics at all and you would need to work out the exposure by hand either using a handheld light meter or just a rule of thumb like sunny 16. however most cameras have a light meter built in a lot of SLR cameras had a needle the light sensor basically had a Vu meter in the viewport with the needle moving as the light level changed and through a mechanical system of strings and levers there would be a second needle that represented the sum total of the aperture shutter speed and the film speed dials to take a picture you'd adjust those dials until the two needles lined up and then you'd know the picture would be correctly exposed but the F3 doesn't have needles the Big Green capital a means aperture priority automatic exposure I set the film speed dial and I choose the aperture and the camera automatically selects the shutter speed to give the correct exposure in the viewfinder there's this very early LCD display of what the shutter speed will be the next question is how does the F3 measure the light level some cheap cameras would have a selenium light sensor on the body the Olympus has something like that the light sensor is there and kind of hilariously as I rotate the shutter speed dial it exposes more of the light sensor but that's a bad solution because it's not measuring the light that's going through the lens uh some SLR cameras had light sensors mounted onto the pentaprism and I'm not sure what the compromises were there exactly but the F3 certainly isn't doing that there's no there's no electronics in the pentaprism here the F3 offers center-weighted metering with exposure lock the exposure lock button is here and the way you'd use it is you'd point the camera at the subject hold the exposure lock button and then you can frame the picture potentially with the subject off center and still get it exposed correctly the trick to this center-weighted metering is that the mirror is not all that it seems if you look carefully at the mirror you can see there's a kind of Keyhole shaped pattern on it and that area is half silvered we lift the mirror slowly you can see there is a second mirror just behind it thank you and in the lowered position that mirror sends part of the light down into the base of the camera with the shutter open you can see in the base of the camera there that assembly that is the light sensor this Arrangement is still used even on Modern dslrs you can't see it so easily but if I lift the mirror with my finger don't try this at home you can see there is a second mirror behind it and that mirror sends part of the light into the base and in the bases not just a series of light sensors for the Matrix metering but also the phase detect autofocus system up until the last few years this was the really big selling point of DSLR the fact that the autofocus was decoupled from the image sensor meant you could have a really good autofocus that was just Impossible on the early mirrorless and compact cameras we have since invented on image sensor phase detect autofocus this um this Sony camera has it and I have no idea how it works but it is awesome and in a way it's the final nail in the coffin for the SLR but back to the F3 that sensor in the base also enables one of the most ridiculous features of all TTL OTF flash metering flash photography is difficult to get right if you think of a flash unit as a point source of light then the illumination is going to depend on the distance to the subject with an inverse Square law most old flash units had a dial on the back which was just a mechanical calculator that could help you work out the correct exposure this Rangefinder has an interesting way of dealing with a problem you can put it into flash mode and that mechanically couples the focus ring to the aperture so as you focus on the subject that sets the distance and the aperture is automatically adjusted to compensate for the reduction in light level it's a bit tricky to set up but it does work however it's not really metering The Flash and it will never work with say bounce Flash the Way digital cameras do it is usually with a pre-flash when you take a picture it has two flashes the first one is used just to measure the light levels and the second flash is fired after the shutter is opened with the brightness adjusted based on the first measurement it mostly works but the double flash can be annoying um on my camera I've set up one of the buttons to be flash exposure lock which manually triggers the pre-flash in advance of taking the picture but the F3 doesn't do either of these things instead it does a true measurement of the flash exposure even with a flash off Axis or pointed at the ceiling I have here a flash unit which I got New Old Stock for an incredibly low price mostly because it has the stupid proprietary flash shoe that only fits the F3 the when you take a picture the shutter opens and The Flash starts to fire the mirror has moved out of the way which means that the light sensor in the base is now pointing at the film plane the light entering the camera hits the film and a portion of it is reflected scattered by the film itself and some of that hits the light sensor there's a capacitor that integrates the reading and when it reaches the correct exposure it sends a signal to quench the flash bulb TTL OTF means through the lens off the film flash metering it's ridiculous I say ridiculous [Music] I think that's about all I can fit into this video there are other accessories I don't have such as the motor Drive which lets you take pictures of some crazy high frame rate there's also a microscope viewfinder that lets you focus with Incredible accuracy I love this camera so much in fact I have two of them despite the fact that the Nikon F3 has a reputation for being a good substitute for a hammer this first one got damaged and the cost of repairing it was more than just the cost of a new F3 I love the wear patterns showing the brass I wish cameras today were made of brass it's crazy to think that all this was designed with pen and paper no computers when I try to repair it I found the service manual and there's an exploded diagram in there I liked it so much I printed it out as a poster and put it on my wall something I haven't talked about is the chemistry of film photography it's very satisfying to develop your own film both in a dark room and in your kitchen sink it's especially satisfying to use an enlarger to do big prints and the way it works is fascinating particularly Color Film which I have developed in a dark room you have to carefully control the temperature or even more interesting is color slide film like velvia where you end up with a full color positive image on the film I suppose the ultimate progression is Polaroid instant film where you end up with a full color positive image developed on the spot the engineering that went into making that happen is non-trivial to conclude the F3 is an amazing camera and let's finish off with some high-speed footage of SLR camera shutters firing [Music] thank you [Music] foreign [Music] foreign [Music] [Music] thank you [Music] [Applause] [Music] [Applause] [Music] foreign [Music] [Applause] [Music] foreign foreign
