transcript: You've probably seen something like this before. A glowing rack of servers humming away in a basement, lights blinking, cables everywhere. It's a home lab, a private server that only a Mr. Robot type could build. But, it's actually simpler than you think. A home lab can just as easily be the old laptop in your closet quietly hosting your photos, movies, and smart home automations for free, so you don't have to pay up monthly to keep them in one of the gargantuan data centers blighting the country. Sounds pretty cool to me, so in this video, we'll talk about setting up your own home lab, which software is worth running, what hardware to run it on, and how to start this glorious journey without torching your power bill, or losing all of your wife's photos of her favorite niece. Topanga, I'm looking at you. To help us answer all these questions, we talked to my favorite dad, Jeff Geerling, author of Ansible for DevOps and the internet's favorite home lab guy. >> There's tons of things in our life that are getting more controlled by outside organizations. A big thing for me for home labbing is making a simple solution to those problems that is completely under my control. I don't want the leaders of the media companies to come into my living room and watch everything that I do. >> I don't know what to tell you, he's right. And lately, every price hike and privacy policy update proves it. Thankfully, there's a billion things you can do with a home lab, and what you choose depends on your own needs. If you want to block ads on every device on your home network, you can run Pi-hole. If you want to rip your media library and make your own private streaming service, there's Jellyfin. If you want your smart home automated locally, spin up Home Assistant. And if you want to turf Google Photos because you'd rather Gemini never even get the chance to train on pictures of your corgi, Sir Chunk-a-Lot, that's for me, you can throw Image onto your hardware. The common thread between all of these different tools is that they're free and open source. All of your data lives on your hardware where nobody else can price hike it, mine [music] it, or delete it. Now, the subscriptions you're replacing run on entire warehouses of servers because their customer base is billions of people. Since you're just serving your household, you don't need that kind of horsepower. So, while you can buy a retired rack server off eBay, it'll howl like a jet engine, turn your office into a sauna, and add hundreds of dollars a year to your power bill. All to do a job a much smaller machine handles in near silence. The cheapest option is the computer you already own. That old laptop gathering dust in your closet. And the fact that it can write out power outages like a champ thanks to its internal battery is just a bonus. But, for people who don't have extra hardware kicking around, the answer is almost certainly a mini PC. A little box that fits in the palm of your hand and only pulls around 6 W, which, depending on where you live, will probably end up costing you about 10 bucks a year in power. >> Mini PCs have become, in the past 2 years, like the standard. They cost about the same as a Raspberry Pi now because Raspberry Pis have come up in price and Intel mini PCs have come down in price. >> But, hardware alone is not enough. You need software. And in home lab land, that starts with the operating system known as Linux. Explosions. It's the OS that every programmer in every hacker movie uses. And it's the system that almost all of these self-hosted tools are built on. If picking which version of Linux to use sounds daunting, we got a whole video on that right here. Now, fair warning. From here on out, the Reddit hole gets deep because once you see people turning their garages into Tony Stark's workshop, you won't want to run just one of these services, you'll want six. So, what's an aspiring genius billionaire playboy philanthropist to do? Buy six computers in this economy? No need. You can run them all on one Linux machine using tools like Docker or Proxmox, which pack each app into its own sealed little bubble. Unlike the apps on your phone, these services run around the clock and all want to grab the same system files and network settings. So, the separation keeps a crash or a botched update in one app from taking down the rest. In practice, [music] a 10-year-old office PC running Docker can handle Pi-hole, Jellyfin, and Home Assistant all at once without breaking a sweat. Sounds awesome, but we'd be glossing over things if we didn't mention what can go wrong. From malfunctioning smart lights to losing your entire digital library. We'll talk about how to dodge them after we talk about our sponsor. >> Bitdefender, the global seat of scams, has recently reported over a trillion dollars in losses thanks to scams. And sadly, a huge part of this is because AI tools are making it even easier for these scammers to mimic the appearances and voices of people you and I trust. Bitdefender's Scam Radar helps keep you safe by getting ahead of the game. They keep you informed with real-time updates about scams happening in your region, so you know what to look out for. With an estimated 1,000-plus cyber threats popping up every minute, the earlier you're in the know, the better. As scammers embrace AI, it's time for you to embrace Bitdefender scam protection free for 90 days using our link below. >> Here's the deal. >> When you run your own cloud, you are also your own IT department. Nobody at Google is watching over your services anymore. So, you might want to follow a couple of safety rules. One, you'll eventually want to reach your home lab from outside your home network, but don't just open a port on your router. That leaves your home lab open to the internet and a search engine called Shodan that lists exposed devices for anyone to find. Ransomware crews have locked up a ton of internet-facing home servers just by searching for exposed computers. Use a tool like Tailscale instead. It's easy to set up and it connects your devices privately through an encrypted tunnel [music] with nothing left open for the whole internet to gawk at. Rule two, proper backups. You don't want to be like the people who build a storage box with fancy redundant drives, put the family's only copy of all their photos on it, and think that they're safe. [music] >> The problem is that everything fails. Every storage solution fails, whether it's now or in 5 years or in 3 years, and it's always going to be the worst possible time. Like you're going on a trip somewhere [music] and it dies like the day that you leave. The gold standard is 3-2-1. >> 3-2-1 means three copies of your stuff on two different kinds of storage with one copy somewhere outside your house. That last one is very super important. It's what makes it so that a dead drive, a fire, or a nasty hack can't wipe out all of your data at once. Skip this and you will eventually lose everything. >> And that's a threat. >> Even Linus Tech Tips Sebastian has lost data this way. More than once. So, if you want to get started with a home lab of your very own, here's the dead simple approach. One, use a computer you already have or grab a cheap mini PC. Two, put Linux on it and install Docker or Proxmox. Three, set up your first service. Is it photos? Is it your movie library? It's up to you. It's your server. Why you asking me? Four, install Tailscale so you can access your stuff from anywhere without leaving your network open to the internet. Five, set up those backups before you trust it with anything you'd cry about losing. And just to be safe, go through a test run of restoring your data from backup every once in a while. Now, if you're still worried you don't know enough to start, don't be. >> Home labbing is all about being humble and and [music] starting from something that you don't know and then growing into it. In my case, my career completely changed once I get into it. >> Like any new project, just start small, break stuff, start again, take it as an opportunity to learn. If it never becomes more than a thing you tinker with on weekends, that's fine. It's kind of the whole point. Your home lab is yours to do with what you will, and it always will be. [music] If you want to go deeper on how virtualization and containerization work, check out our video on Docker.
