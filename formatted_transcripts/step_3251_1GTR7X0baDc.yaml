transcript: Let's consider [music] an experiment. >> Student knows it's better to use AI as a tutor rather than an answer machine, so [music] she requests step-by-step guidance, not the full answer. However, after reading the first point of advice, [music] she scrolls past the explanation in search of a quicker solution, and then copies the generated code. [music] This code does not fully match the problem and contains some unfamiliar syntax, leading to further confusion. [music] After repeatedly passing her code back and forth between the IDE and the LLM, she eventually produces a version that passes the test cases, [music] though without much understanding of how it works. Here, we see the problem. >> [music] >> The student lacks an awareness of the way that she actually used the AI. She has a skewed perception of her grasp of the material, [music] an illusion of competence clouds her understandings. In short, she doesn't know what she doesn't know.
