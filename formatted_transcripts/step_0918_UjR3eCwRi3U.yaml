transcript: Hey guys. So today you and I are going to talk about take-home tests, code tests. So let's get into it. So the question in question was a little bit of a story. Hi Frederick, you have an incredible channel. Thank you. How do you approach take-home assignments for job interviews? For example, how would you approach the following assignment? Build a mobile friendly web app where the user uploads a PDF, sends it to a mock server that simulates signing, returns a signed version of the PDF and then reviews the signed PDF on and then allow them to review the signed PDF on their device. Do you start out with pen and paper, the prototype, the MP, the grad and gradually iterate and improve? What would be the critical things to include and what would you consider overkill? My problem is that I drastically overthink it and I try to include everything. TDD, CI/CD, Trello boards, and API docs, which is definitely linked to my anxiety, self-doubt, confidence issues, perfectionisms, and my ADHD. This is subjective, but how would I know when something is considered finished? Would you include tests for corrupted PDF file uploads, invalid characters in the PDF file, and password protected PDFs? So that's a lot. I would say there's a bunch of questions in there. So the way that I try to structure things when it comes to take a home code tests and things of that nature is because I have had historically the same problem where and it's not that uncommon that I even see it today. I'll tell you a little bit about something I was telling I was actually in a conversation with one of my co-workers who she works in well the team that I currently have. It's a temporary position that I have. I'm doing the company a favor by being the tech lead for one of the gyms. And the thing is when you are sort of new and you're not really experienced and you don't have a lot of personal confidence, what you usually do is you sort of hit the nail on the head there. Your anxiety gets the better of you and you try to prove your value as a craftsman by adding more by doing extra by trying to like foresee how people might perceive your code and what they will think and things like that. And that is a very common mistake. I've done it a hund times. It's the same deal where you get anxious that other professionals like say myself if I look at your code where what you're worrying more about is what I will think about the code rather than whether the code does the thing it's supposed to be doing or not. And here the sad truth is that there's no way for you to know. And that is the problem. And that is the thing that every single software developer has to come to terms with sooner or later. because you won't even get through your first code review if you don't understand this. People think differently about what good software looks like and what bad software looks like. And you can't control who's going to do the review. And that's the fundamental problem because in one situation like say if you show me your code and I say, "Oh, it's really really great and I like these things or these things. I don't like those things." And then the next person looks and they're going to say, "Oh, I like that and that, but that stuff I don't like." Or so forth and so we'll have a difference of opinion on what good things like many of our opinions might overlap, of course, and we will agree the more aligned we are on how to do things, but there are of course extremes here as well, guys. I've worked with people where they like have so many opinions about stuff that basically it's impossible to please them or I felt that way at the very least. And I'm sure that other people feel exactly the same way when I do code reviews for them or so forth and so forth. And that's the same thing that's gonna happen with your code test and your assignment. So the tip I can give you is that as someone who has gotten feedback on, oh, you overengineered this thing or yeah, you forgot about all these corner cases and so forth and so forth. The best thing I can tell you is to try to focus on creating a solution that will work in a production environment. it that doesn't mean that you have to optimize everything or you have to do like specific builds or things like that. Just try to solve the thing that you're trying to do. So here for example, you're going to create a mobile first application that low uploads. If that is your whole deal, if that's everything, then I would literally create a one column layout which like with the you know max margin so it works on all sizes and then have a little box I don't know what to call it like PDF upload and an upload field that uploads the PDF and then once it's quote unquote uploaded literally just shows back the PDF in a separate browser window or something similar like that and the reason why I would do that is because I know as a professional software developer that there is very like testing development development here would be a bit of an excess and the reason being because there's no logic there's no business logic or anything like that CI/CD pipelines creating that for what an imaginary pipeline there is no pipeline right now and so forth and so forth treddle boards again not something that people care about Because why would I care about whether or not you know use Trello or if you use Jira or so forth and so that you're using tickets correctly. That's something I don't care about when I review your code because I'm looking at your coding skill right now. I don't I'm not looking at your experience working with agile practices. End to end tests. Well, you could make an argument for making an end toend test and saying that yeah, I want to make sure that the upload works here. It's hard again because you don't know if I feel that that is too much or if it's just right. I might be impressed by the fact that you do it or so forth and so forth. And uh doing say API docs. Well, in this situation, it was saying that it was just supposed to be a fake backend server. So API documentation might be relevant, may not be relevant. It's hard to say. It depends on the individual. All I can say is that all the things you were thinking and like looking for corrupted PDF files in the upload and so forth, well, that's going to be way too much because again, as a professional, I know that when you're uploading a PDF, there's very little you can do to validate whether or not the file is correct or not. You can of course do it, but most people like most systems that do uploads or any stuff like that, they don't even necessarily consider the because the file extension is just a file extension. It could be anything. You could call a you can take a text file and set PDF at the end of it. That doesn't mean that it's a PDF file. It's just a way to express what's going to be in the file. invalidating the file format and soft things of that nature does happen but it's not the most common thing especially not for a code test and so these are the things that I would consider and as you can imagine other people might think differently but the thing that you can do if you are anxious about proving and as I was saying trying to impress and so forth and so forth is that you can make a solid implementation that just solves the problem and fills the requirements that you have and then you can either in the conversation that followers because usually people will ask you about your code test or so forth and so forth or you can add a little notes or something like that. Just explain all the other things that you were thinking of adding so that you can use your own excitement and at the same time prove to the reviewer that you did actually think about corner cases. You were thinking about that and that and that and so forth but it might be too much. And that is a nice middle ground because that way you don't have to kill yourself implementing like a hundred other things that people may not even care about and at the same time risking that people like me would say that oh yeah you're doing too much or so forth and so forth or somebody else saying that yeah this is way too much I can't trust that you can go into my product because you're going to make it too complicated or stuff like that. You don't know who's going to review, right? And that is something you can do. And that is what I was talking to my I was talking to my coworker. I was explaining to her because she had a u conversation with me about a feature she was going to implement and she asked like how would you implement it and then I explained to her roughly how I would have implemented the feature that she was working on. And then a few days later she comes to me and says Frederick I need your help. And I go okay what what's the issue? and she says,"I can't really get my head around your implementation." And I go, "Okay, let's walk through it." And then she explained to me that, "Yeah, because I was kind of getting stressed over the fact that the story is taking too long." And like, so I have like made the implementation the way I thought it was going to like the way I wanted to do it. And then I've been trying to figure out how you would do it, but I can't figure it out. And I go, "Wait, wait. So, you've already implemented the feature, so it's working, right?" Yeah, it's working. and now you're what you spend a few extra days just to figure out how I would have done it. And I go, "Okay, why?" And she goes, "You know, oh yeah, but you know, so and then she finally just says the thing that I knew she was going to say." It's because you're better at this than I am. And I go, "Well, okay. So, let's assume that that is true for the moment." H how does that matter? Does your code work? Does it do the thing that it's supposed to be doing? Yeah. Okay. Then what are you worried about? I'll tell you what you're worried about. You're worried that I will judge you for not being quote unquote as good as I am or some other person is going to go and say, "Yeah, your code is because I would have done it differently." You're nervous more about what I'm going to say than whether or not your code does the thing it's supposed to be doing. And that is something we need to work on because you need to be able to work here. I mean, you What would happen if I wasn't here? Would you sit around worrying? Oh, how would Frederick do this? Like, I can't ship it without checking. You mean you can't check with me for every little thing? I need to be able to trust that you understand how to write code. And of course, if you have someone who's been working for a few years and someone who's worked for many years, odds are, and I think most seniors can agree to that, even though seniors who are really, really experienced, we make mistakes as well. Like odds are that yeah, if you were a junior software developer or something like that, your code is probably not going to be as great as someone who's been doing it for 20 years. But that's not the point. The point is to make the feature work. That's the point. So what I want you to take away from this is that honestly, as I was explaining in my little rant here, try to focus on just getting the feature to work in a sustainable way based on your level. Because the second you start to try to guess how you can impress the people who are going to review your code, you're on a bit of a slippery slope. My suggestion is focus on getting the code to work in a based on your best practices. Whatever you think is feasible, like reasonable to to do in a given situation because as I was saying, sometimes if you do too much, people think that you're an idiot because you're overengineering things or they might be impressed. Might be the case, right? The only thing you never should do, of course, is just hand in stuff that doesn't work or so forth and just, you know, you can do that because some tests are really weird where they give you something that is super super hard where the point isn't for you to make the implementation work. It's just give you a really shitty situation and see how you deal with it. You don't know. You cannot know. So, just try your best. Focus on getting the criteria right and so that the system works within a reasonable, you know, within reason and so forth. And then if you really really are concerned that you're not going to get to show off your skills and so forth and so forth, write it down. Keep it with you. Explain to people because as I like I gave a little bit of an analogy, if you go to a master blacksmith and ask, "Can you make me a knife?" Then the master blacksmith will make a knife, a really nice knife for you, they're not going to make a sword just to prove to you that they can make a sword. That's waste. It's completely waste. And that is what you're doing here. You're allowing your sensation of value to be tied in to whatever person is going to judge your code. And you're allowing that to impact the implementation. And that's the thing you need to learn. You need to learn to write the right amount of code or the add the necessary checks and balances for the given situation and then show that you know how to make it even more advanced than necessary or the more advanced if the need is required. That is the thing that a master does. A real master understands when to do something that is appropriate for the situation. but they also know how to scale it up and make it even more advanced if the situation requires it. But if you do it in the wrong context, then you're proving that yeah, you know a lot of extra advanced techniques, but you don't really know when to use them. Have a great day.
