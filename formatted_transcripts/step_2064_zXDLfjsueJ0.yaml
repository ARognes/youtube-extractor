title: How to Turn Your Visual Notes into a Smart System (The Shipping Container Method)
channel: Zsolt's Visual Personal Knowledge Management
handle: '@VisualPKM'
url: https://www.youtube.com/watch?v=zXDLfjsueJ0
duration: '36:30'
type: video
transcript: Hey, my name is Zsolt. Welcome to my channel. If you look around regarding sketchnoting, you will find  two types of content. One talks about how you create  sketchnotes. It's more the techniques of how you  draw stick figures, cartoon, what paper to use, how you  illustrate, how you organize yourself on  a sheet of paper. And then the other is about how you  tell a story, how you convey meaning, how you summarize ideas. And I think these are all super important  topics and are great. But I miss something in the middle. I miss the glue that connects your  individual pieces of sketchnotes, those beautiful drawings  that you've created, or maybe those not so beautiful diagrams, and  helps you connect it into a system to achieve some bigger meaning. So today, that's what we're  going to talk about. I gave this talk at sketchnote week  back in January, but I thought it's such an important topic that I  wanted to replay it for you. Enjoy. So the story today starts  here in Birżebbuġa. We were in Malta over the Christmas  holidays with my wife. And on our way to the airport at the end of our trip, we stopped in  this small town. This is a port town. And I was watching this shipyard  with the cranes lifting the containers and placing them on the ship with the trucks moving around. And I think many people will look at this and feel like this is an eyesore. This is an ugly big port with huge  ships and dirty trucks, etc. When I looked at this, I saw a system. And this reminded me of something  I read from Thiago Forte and Szenke Ahrens, which is this idea that notes are the shipping containers  of ideas. And in fact, shipping containers  have transformed the world. It's hard to understand how huge an innovation the invention of shipping  containers was. I read about this in The Box  by Mark Levinson. Because it's not trivial. In the past, every cubic meter  of the ship was used because things were packed  in the ships. It's not trivial to say that, okay,  I'm going to have lots of wasted space because containers  have standard sizes and containers are not  always 100% full. But with the entire system of ports  and trucks and cranes and ships, etc. shipping containers  transformed the world. They made today's economy possible. And they also created such efficiencies that in the past  were impossible. And I'm advocating something similar that you can do with your visual notes. And so my question is, what is your port look like when it comes to  visual thinking? We are focused on the goods, what's  inside the box, the illustrations, the ideas we capture. But if we don't have a system for  managing each of our containers, each of our sketch notes, each of our  illustrations, each of our notes from conferences, from meetings,  from books, from blog posts, and whatever, then they will end  up on the beach rusting. And you'll lose the value or even more so they become cluttered,  they catch dust. And that's where your ideas stop. So we're going to be talking about  your system, your port for handling your sketch notes,  your visual notes. And just to continue on this idea of  trucks and containers, this reminded me of the time when we were moving home from the Netherlands. So this is about eight years ago when we were packing the truck to move  back to Hungary. And you know, when you pack a truck,  you put everything into boxes. And here's all the valuables, everything  we own, everything that's important to us inside the truck. And when we arrived, of course, these  are unloaded to our house. And this is, of course, the same with  your notes, you go to a conference, you create notes, you  package everything into your container, and then you go home and you have that package there in your home. And of course, if you're traveling, for  example, we were in Iceland a couple of years ago with  a teardrop camper. It is fun to live out of suitcases  for a couple of days. This was a fun 10 days. And I loved every bit of it. But if they would not unpack our stuff  from these boxes, living out of boxes for a prolonged period of time  is simply not sustainable. So my invitation today to you is to  stop living out of boxes and start building a visual personal knowledge management or PKM system. And today we are going to talk about two simple principles for building  that system. We're going to talk about the  idea of standardization. And we are going to talk about the  idea of creating a system. And so let's first talk about  standardization. And this is back to the idea I mentioned  earlier about notes are the shipping containers of ideas. Think of notes as a standardized tool,  build a workflow around them and add some standards to your notes. Because less choice is going to  create more focus for you. You have a single format, you have one  idea per page, and you have a simple consistent workflow around it. And with that, it's much easier to  manage your ideas from the conference where you collect the ideas  to your storage, where you're storing all of your great  ideas connected. So in my practice, and here's my  book, Sketch Your Mind. And I talk about this entire  system in the book. So if you're interested, pick up a copy. In my practice, I found that applying  three simple principles or three simple constraints can really  transform your notes into this Lego set of visual ideas that  you can interconnect. The first one is the card forcing  function, the basic idea, as you can see here, like every slide in this  presentation, or every idea here, they are on a card and the card  gives you this frame of this limitation that you need to focus your ideas that they fit into that card. I love infinite canvases. On the other hand, those are very  hard to manage later on. And we're going to come back to this  in just one second in terms of what to do with infinite canvases. But the first and most important tool  I recommend implementing is having this card forcing function, set a rectangular area and put a single  idea in that area. And that's your unit of idea  in your illustration. The second constraint I implemented,  and I'm using a digital tool, as you can see, to connect my ideas, is to have a simple, consistent  color palette. I limited all my colors to a few. And I use those on every illustration  I create. And this way, when I put these  illustrations together into different storylines, like I'm putting  these into this storyline today, but I didn't create these cards  today, I created these years ago, but I'm now reusing them, then  they are going to fit into the style and the environment because  they have same colors. And it again takes off lots of burden in terms of thinking about colors. And the third constraint I recommend is to have standard  proportions. This is very important when  it comes to an infinite canvas like Xcollet  or an Obsidian. If you have standard font sizes, if  you have standard icon sizes, if you have standard card sizes, they're going to be easy  to click together. Think of Lego. Lego has blocks that are one, two,  three, four, maybe five. Units large, but they don't  have one in the halls. And three and three quarters large. They are, they have these unit of sizes, these standard proportions. And that ensures that when you fit them together, things click into place. All of these cards are the  same width, same height, and then they look  neat on the page. And of course, you might say that Zsolt, having these standards limits creativity,  I tend to argue. So think of shipping containers and think  of all the amazing things people have done from food  trucks to tiny houses to swimming pools to even sculpture  containers. The fact that you have a unit of container doesn't mean that  it kills creativity. It just guides creativity and it helps reuse and it helps a consistent process. And so in terms of how do you manage  a large sheet of paper? How do you manage an infinite canvas? I take this idea from Doug Neal. His idea is to fill the canvas one block at a time or one brick at a time. And each brick is a rectangular  area with a single idea. And it actually follows this idea of  a card forcing function, each brick in the road is a card and you place  these bricks next to each other and having these bricks together  will create the overall presentation, the overall story  you want to tell. And this approach is also great when you're doing live sketchnoting. It helps you partition the ideas that  you're capturing and it then helps you at home unpack this and sort  these ideas because they are not all over the place but they are nicely already packaged one  idea per brick. Then if you have these bricks you can  make them also modular and in Obsidian ExcoliDraw I have tools to  decompose or deconstruct items into their own notes and then you can create different presentation,  different stories. So let me show you how this works and  now I'm going to stop the presentation for a minute and we're  going to look at this truck. So if I click on this truck then  I get this list of links. We are not going to look at the  second order links. I'm going to show you that in a second  but for now I'm going to click here on the top one because effectively this truck lives  in its own note. So this is a separate ExcoliDraw  drawing with only the truck included and Obsidian has this  tool called backlinks. Backlinks are links from other documents  using this note. So you know on the internet you have  a link and the link takes you from this place to the other place. Backlinks are this capability in Obsidian  MD that will help you identify all of those documents that  reference this document here. So the backlinks for my truck here are  right here and for example you can see my presentation for sketch  notes with a memory. This is the presentation we're looking  at right now but for example I want to show you this presentation  here my book on a page for how to take smart notes by Zenke Arendt. So here and I'm going to just zoom out  so you can see there it is. You can see that there's the container  but overall it's on this book on a page summary for how to take  smart notes by Zenke Arendt and with this I created this link between  my presentation about sketch notes with a memory and  this note right here. But of course this can go  further as well. So this truck is also built  up of components. So for example if I click on this ship  right here this ship is a downloaded icon but what I want to show  you here is the ship also has a number of backlinks and these backlinks are places where I  used this ship as well. For example I used this on my idea  integration board for Lessons of History and indeed in Lessons of History  Will and Aryan Duran talk about the impact of trade and power  or rather the impact of geography on what is shaping civilizations  and so you can see that immediately I was taken to this other  visual note through the connection of ships and by the way this ship is super relevant here. When I created my original note about  the truck I wasn't thinking about trade routes etc but in fact it  does serve the same sort of purpose and I can even see a logic for  how the same idea of these routes the geography because and that  was separate learning when I was reading Lessons of History when  I realized that indeed the internet is the new geography and the  way I'm packaging ideas for example into such presentations creates  new trade routes of sharing my ideas but long story short that is how this entire presentation  here is built up. I have these these units of ideas  and these units of ideas are taken from other notes and these units  of ideas are then if I just move back here for a second you can see  here that these are built a story is built from icons that will  build atomic ideas and when I put together these atomic ideas I get  a story and so on you can take these bigger stories and build  even bigger ones I'm going to show you an example of that as well  but that's principle one that this standardization having thinking  of a note as a shipping container and applying some constraints  around it enables a workflow and now let's talk about that  workflow because if you look at this picture right here this is  an aerial picture of the same port you can see that it's much it's  it's much more than just the ship and the cranes there's a whole  system out here with all the containers so this is what you can  also observe on this aerial photo if you zoom in you will  see that on the port each of these sections  are numbered so these containers are organized in  a very strict meat system so of course the right  goods or the right right parcels find their destinations  and so on and so this is the system I'm advocating and let me show  you how I'm building this system because effectively the other  part of my system one is this embedding of lego pieces that we looked  at with the truck and how it builds together the other is I think  of every illustration as you could call it a postcard on the  front I have the image on the back I have some notes that give me  additional metadata about that image that give me text so again if I  look at my shipping container here and I open the back side of this  note then here you can see that so this is my my truck right here  I have some shortcuts to flip the page over this is exactly the  same file so I have one file called how to take smart notes notes  are shipping containers of ideas so this is the name of the file  and on the back side so on the textual side of this note I have  things like who's the author Thiago Forte, what's the source so  this is the blog post where I read about this I implement the shipping  container with the card forcing function and so on you can see  all of these notes here and in fact if I click on the card forcing  function then it opens this card if I flip this over you can see  that this is actually the image that we saw in the presentation  as well when I was talking about constraints but on the back side  of this again I have a whole bunch of notes about different components  or I have Doc Neil here for example as my source and so on this  is how it continues on and of course if I now look at the backlinks  of this then I can see that I'm using this card forcing  function in other notes for example in this illustration right here  which is if I flip the page over you will see this is what I call  the mindset framework and this is all of my cards here's the  mindset framework all of my cards including the ones we looked at  so we looked at briefly the standard proportions we looked at  legalized ideas we looked at simple colors we also looked at the  card forcing function right here and of course there are many other  cards here as well but you can see that this overview is yet another  presentation yet another reuse of the cards that I'm presenting  to you in today's presentation but also you can see how  through the truck through the notes on the back side of the truck  so again if we come here and I open this and flip this over so the way  we got here was here I have this link that this idea notes are  shipping containers of ideas is implemented with the card forcing  function it's also discussed in this book and in fact I have the relevant  section of the blog post copy here because for me that's just  helpful to have everything in one place but yeah so that's what I  wanted to show you that every one of these cards has a backside  with some stories also this presentation has a backside with my  notes and my ideas for this session itself and they are of course  these blocks that I can build into one another and having the links  and the metadata on the back side helps me connect these ideas into  a network or into a system so this takes us to the close to the  end of this session there's one more thing I want to highlight to  you or want to explain to you and that is my concept about 4D PKM  four dimensional personal knowledge management because it all  starts with one dimension one dimension is when you're jotting ideas  down typically you write them down in a sheet of paper and  then you store that paper somewhere typically if you write then  you will be reading top left bottom right in a linear way if you  have some sketch notes here then of course that's already slightly  better but these are disconnected dispersed individual notes  without any system now you can create a system for filing so you  can have various notebooks neatly packed on a shelf and that's  already slightly better also you can flip the pages of your notebook  or your sketch notebook and then pages one after the other will  give you a chronological logic but you're still not linking these  to one another it's only a neater organization of ideas but  this is now two dimensional because you have your notes and you  have the individual documents organized into a filing system the  third level is 3D PKM is when you're creating links and links are  for example the ones I clicked in the presentation there I went from  one document to the other links are what you will find on the  internet as well they create this web of interconnected ideas but  if each of your notes are text based and yes I think in this case most  of your notes are going to be illustrations but if your notes are  text based then you're only using half of your brain because your  notes are going to you still need to read your notes top  left to bottom right but at least you have them connected  into this system and what I advocate for here and I think this  community is definitely on a good way in that direction or on a on  a good path is to have visual notes interconnected into this web  of systems because I think that's exactly the difference that  today the internet and most note-taking systems allow you to connect  documents but they don't allow you to connect visual components  like I'm doing here each of these components are individual pieces  that I deconstructed from my notes and I connected them into a larger  picture so my advocacy is to create a 4D PKM visual first system  adding text on the back for clarity and for metadata but working  with a system like this and so in the end if there's one thing  you take away from today's discussion is to shift your mindset  from visual thinking as a tool where you have mind maps, sketch notes,  diagrams and use them as a tool to thinking about visual thinking  as a system there you have this system of organizing your notes,  deconstructing your notes, connecting ideas through visual connections  and this concludes our journey today I hope you enjoyed the  ride this is the map that we traveled and all that's left for me  to say is to bring the new sketch your mind community to your  attention and within that I want to highlight cohort 16 of the visual  thinking workshop which is coming up in just two weeks the visual  thinking workshop is the place where we put all of this theory  into practice this is where I help you create the system that we  just talked about in each workshop we take a specific book  this time we're going to be reading the amazing book by Jeff  Harrison Fisher the next conversation and we're going to turn  it into visual Lego blocks I love Fisher's quote here at the top  what you say truly has the power to change everything and this is  what the book is about and I think what better book to read when  we're talking about visual thinking and visual communication the  workshop takes you through these five steps we start with creating  an idea atlas these are highly interactive live sessions then  we create concept visuals this is always a super active part  of the workshop when we bring ideas together you bring quotes from  the book and together we create visuals then we spend some time  storyboarding creating the outline of how we want to tell what  we've learned from the book then there's a session about visual  zettlkasten creating our notes our permanent notes and linking it with  other visuals in our system and finally we have our showcase and  we put together we compile the book on a page the cohort is supported  by a self-paced course that takes us through the mindset framework  there are 44 I think core lessons here the course has 71 lessons  in total it's a complete self-paced course that you're going  to do alongside participating in the live sessions and this is going  to give you a full system in hand and the workshop itself runs from  16th of may until 28th of june the way it's structured is there  are live sessions live sessions happen on saturday and sunday  saturday afternoon europe time saturday morning us time and sunday  morning europe time and that's sunday afternoon asia pacific  time so the workshop runs in two time zones the sessions are always  duplicated or mirrored so you have everyone has a live session  experience and on top of the live sessions we also have so-called  office hours there are altogether six office hours during  the course these are on thursday's and friday's again for the  two time zones and the office hours are your opportunity to ask  anything this is where you can roll up your sleeves and I can help  you build your pkm system and the visual thinking workshop is part  of this bigger concept I call the sketch your mind community i  encourage you to check out the sketch your mind community as well  by the way if you join the visual thinking workshop you get one  year of membership free as a gift for joining the workshop the community  itself focuses on three pillars pillar one is the mastery of  the tool so this is all about obsidian and Excalidraw and this is  more of a technical how-to pillar this is there you have courses  like Excalidraw essentials Excalidraw mastery and we are building  a complete tutorial hub with visual daily notes and pdf plus plus  annotation and lots of other important workflows then we have a  second pillar that's going to start in july this year that's the  sketch your life pillar and sketch your life is about visual frameworks  mental models and it's about thinking it's the whole purpose  of why you are taking notes you're taking notes you're creating  visuals because you want to have better thoughts and finally concept  visuals that's coming later this year which is really the  bread and butter of creating visual communications it's the process  for creating impactful visuals and then as an membership upgrade  you can get the visual thinking workshop either the self-paced  course or the cohort i highly encourage joining the cohort it's  I think the best value for money for getting on board with this  entire mindset for building connections to have some accountability  with a group of people and to go through the entire process and  then you can use the community as an ongoing support network  to build your visual thinking habit your visual  thinking system so thank you for taking the time to  watch this I really hope you enjoy this and I hope to see you in the visual thinking workshop. Thank you!
