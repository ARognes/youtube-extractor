transcript: "\U0001F4D8 AI can write your code. It can't tell your story. Behavioral interviews are the new differentiator, and I wrote the book on them: https://geni.us/BehavioralInterview-yt\n\nCasey Muratori has spent 20 years writing code by hand and still couldn't care less about AI — not because he thinks it won't work, but because programming is the point, not the output.\n\nIn one of the most level-headed conversations you'll hear on the subject, Casey breaks down the difference between builders who code and builders who ship, why he's more impressed by the Turing test than any C compiler benchmark, and what he's actually waiting to see before he believes the productivity claims.\n\nGuest Links:\n   / @mollyrocket  \nhttps://www.computerenhance.com/\nhttps://www.kickstarter.com/projects/... https://x.com/cmuratori\n\n00:00:00 - \"I Couldn't Care Less About AI\"\n00:01:21 - Starting an AI Podcast Despite Not Using AI\n00:02:01 - Moving the Goalposts on What AI Can Do\n00:05:32 - The Difference Between Capability and Care\n00:10:37 - Builders Who Code vs. Builders Who Ship\n00:12:02 - Programmer, Coder, or Engineer?\n00:15:07 - Are People Adopting AI Too Soon?\n00:17:30 - AI Discourse Is Out of Control. \n00:28:30 - The $20,000 C Compiler\n00:31:07 -  NLP Is More Impressive Than Code Generation\n00:34:57 - The Wrong Way to Ask What AI Can Do\n00:43:46 - The Thing Nobody Talks About\n01:08:07 - Will We Actually See the Productivity?\n01:11:06 - When AI Goes From Negative to Positive ROI\n01:24:17 - I Will Never Explain Code in Plain English\n01:25:07 - Bearish? Not Exactly\n01:59:20 - Will Casey Ever Use AI?"
