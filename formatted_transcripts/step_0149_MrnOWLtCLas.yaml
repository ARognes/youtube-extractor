transcript: This is the biggest tip I give to people is, you want to find what makes you so uniquely you. There are just so many other applicants that have the same stats as you, right? Like they have a high GPA, and they did this and this and this, and they did research in all these things, and they have all these big awards. But what makes you uniquely you? And I I think a lot of people on their college applications will write, "Oh, I want to be I want to be at Stanford because I'm doing like they have this program for me, or there's this professor I can do research with." Um that's great and all, and I'm I'm great you it's like great that you know what you want from the school, but the entire point of your college application is you need to sell yourself to this school. Why should this school accept you over someone else? And this is the entire mindset that I had when I was writing my Stanford application. Um and I think that I think that helped me a lot. And so I thought about what unique characteristics do I bring as like a human being to Stanford and and to the culture and to the community. Um and I would recommend writing like very niche topics in in your in your application.
