transcript: (light music) - I still remember the first time I played Warframe. I just treated myself to a launch say PlayStation 4 and during a break playing Fifa or Killzone Shadow Fall or something. I wandered onto the PlayStation store just to see what else was available, and it was then that I came across this curious looking free to play game. I wasn't quite sure what to make of Warframe to be honest. I had no idea it was made by the studio responsible for one of my favorite games ever, Unreal Tournament. I had no idea that it was a game that Digital Extremes had been trying to release in some form or another for over a decade. And I certainly didn't realize that this curious little free to play game was the studio's last chance at survival. Warframe has been at for five years now on Xbox One, PlayStation 4 and of course PC. In fact it spent most of its time on the PC in Steam's top 10 most concurrent player's chart, but it's also a game that a lot of people know absolutely nothing about. So we thought what better candidate for a Noclip Retrospective than the remarkable story of Digital Extremes and Warframe. This story starts three decades ago in the Great White North. (light electronic music) - Through grade nine all the way through to the end of university, I always had in my head that I would do a game system in my spare time as a hobby. It was always a hobby in my head, I wasn't getting into a real job in games. So I kinda put that out of my head, but yeah I made games all throughout university, I went to a university for mechanical engineering. And expected to go into mechanical engineering and one of the little games I was making through university I got published in this little kind of magazine disk thing called Big Blue Disk. You'd see it on the magazine shelves, they would come out monthly. And I was just looking around for something to do with my game that I finished, which is kinda cool little game and I sent it to them and they paid me my 1,200 dollars for the rights to do that. So I just was like, I was amazed that I actually made a little bit of money from this tiny little game. So that's kinda the first stepping stone to get to the professional and actually, money coming in. - [Danny] What was the game? - It was called Legends of Murder. You can search it online and probably find it. - [Danny] That's a fantastic title. - (laughing) And it actually works, I was just playing it a couple months ago, you can download it somewhere and it's, yeah it's funny, funny little game. I still thought at that point it would be a hobby in that, and I thought it would be fantastic that I could make a little bit of extra income from that, and so as I was finishing the university I was a big fan of Star Trek at the time and it was kind of, and then a game called Star Control had come out, I just loved this idea in my mind of combining those two things. And I ended up making this game called Solar Winds which was just finishing up as I was graduating university. And right around that time I knew this game was a little bit bigger, a little bit more interesting, a little bit more viable as a real product, and so I remember playing Hugo's House of Horrors which was a Shareware game at the time. I actually physically wrote an actual letter to David Gray, I do believe his name is, I can't believe I remember that, and I sent the letter off to him. I asked you know, can people make money from Shareware? 'Cause you're giving it away for free. And he wrote back and he told me about CompuServe that was a good online area where people discuss games and Shareware and stuff like that. He said yeah some people make a few bucks and some people make a million dollars, and of course you know my mind exploded. And I think from there that's where I got onto CompuServe and I found out about Apogee and Epic Games. I met Mark Rein. And the first game ended up being published by Epic, Epic Megagames at the time. I think I was making about $1,200 a month from Solar Winds, and I was like working on my next game as like oh my God, I'm gonna go from $1,200 a month to $2,400 a month. So I can actually live reasonable on that. And so it was exciting times, I just loved the work. And the game that came after that was Epic Pinball, and so as I was making I was like okay, this is good. This game is some of my best yet, it's going really well. And so I was really quite excited about it, thinking yeah maybe I'll make more than $2,400 a month, maybe I'll make 3,000. It's like in my mind, oh my God $4,000 a month, that would be living in luxury. And of course it comes out and it was, like for individual for one person making it, it was a monster hit and it just, I just remember my first check was like $50,000. So it was a whole new world and that was kinda the start of the upward climb. (electronic music) - [Danny] By the time James had finished his marathon of work on Epic Pinball, he was pretty tired of making pinball games. But Epic MegaGames, the game's publisher, knew that a sequel would be wonderful business. James pushed back, saying he didn't have the creative energy to work on another pinball game. So Epic suggested that he hire some people to do the work for him. This was the foundation of Digital Extremes. And the first game for the team, Extreme Pinball, was another hit. While James' new team was working on Pinball, he was taking his first steps into 3D game design. And it's through this that a decade long collaboration with Epic would begin. (techno music) - [Video Game Voiceover] Head shot. Double kill. - [Danny] Today we often associate this franchise with Epic Games, but the original games were born out of a tight collaboration between the two studios. Between the two, there were around 16 people working collaboratively on the project. During the development of Unreal, the Epic team traveled to London, Ontario to work on the game. While the team at Digital Extremes traveled to Raleigh, North Carolina where Epic is still based, to work on UT '99. - As intense and unreal was, and hard, and really just tryin' to ship a game, Unreal Tournament was I think more, it felt more creative and more a little less pressure. But that allowed us to make even a better game I think. At that point, so my programming contribution went down and I think I focused more on the art, and I can proudly say I think all the weapon designs are mine for the most part. - [Danny] What are some of your favorite weapons? - Oh the fire cannon's always been my favorite. I was very happy with how that one turned out. - [Danny] Did you put the smiley face at the end? - I did, I did. (laughing) Did you know, I'm not sure if this story's ever been told, we were all in North Carolina and we were coming back from lunch somewhere and we walked past a church called The Redeemer, and I was like hey that's a great name for the big gun. - [Danny] Polishable nuclear weapon named after a church. - Yes. (laughing) I know Cliff had a lot of input in the weapons as well, but we wanted something that was more, more than just basic shooting. Combining the alt fires to add an extra layer of skill on top, so we're always looking for a way to add that you know, you shoot the weapon in its basic form and you can do well, but if you have that extra skill and you can do the combos or whatever, it's an extra layer of skill that's kinda built on top of the weapons. So that was definitely the intention as much as we possibly could. - [Danny] Do you have any favorite maps from that original 1999 one? - Facing worlds, yeah Cedric's map, was definitely one of our favorites that we played in the office. There was a lot, there's a lot of really good ones. I like, Deck 16 was awesome. That was Neesha's map that was very memorable. - On Championship, pretty much everything. I worked on weapons and progression, I'm a programmer, was how I got my job here so I program weapons, I program game modes, I program bots, bombing run, like all those kind of things. I remember one time when we moved offices, we had to have an electrician come in and he had to come in late, I was the only one in the office so I let him in and he said so you make video games here? And I said yeah yeah, he's like whoa, any video games I might have heard of? And I'm like yeah you know, Unreal Tournament, Unreal Tournament 2003? He said oh yeah you know, I really wanted to like that Unreal Tournament 2003 but you replaced the sniper rifle with that God awful lightning gun. And I'm like yep, that was me. - [Danny] After UT 1999, the teams continued to collaborate. Working on Unreal Championship for consoles and Unreal Tournament 2003. But by the time UT 2004 came around, collaborating remotely became much more difficult as both studios had grown so much. It was during this period that Epic and Digital Extremes almost merged, but the idea was scraped once they realized the Canadian government would require a sizable tax payment up front. And so instead like college roommates after the last day of class, Digital Extremes and Epic Games went down their own, different paths. (video game guns firing) After the release of Unreal Tournament 3, Epic would go on to partner with Microsoft Studios to create the Gears of War franchise. And Digital Extremes had a big idea of their own, a sci-fi action MMO they were calling Dark Sector. They poured their creative energy into this project, hoping it would be the key to a new era for the studio. And in fact it was. But instead of sending them down the path of creating an entirely new franchise for them to own, the demo kept securing them work for hire projects. - So yeah, the old DE that I worked at, made some cool Unreal games with Epic and then we hit the pitch circuit, right? Here's our idea for games you know, we tried to make this crazy sci-fi game that was called Dark Sector that wasn't the Dark Sector that shipped, and I remember that was living out of a suitcase for six months traveling Europe and west coast with a tech demo and a cube PC. You walk in, you show this tech demo and they say this is awesome, this is great. How would you like to make the sequel to this game instead? So you know, that wasn't really, I mean it was very creatively upsetting and kinda soul destroying, 'cause you're putting everything into this. But it got us work, publishers have their franchises, and they wanna build on that. And so we did that, we did what we call work for hire. Work for hire is we're going to pay you a lot to grow an extreme amount to your breaking limit so that you have all these people to take care of with their families, their mortgages, their hopes and dreams, we're gonna pay you just enough to get to the end of the project, you better pray it runs out, so you can get your royalties back. - If I look back on my career, it was probably my biggest personal mistake was to, you know we had some good money coming in, we weren't that big, we were quite successful, but we had our eye on like let's make something like the next, like something huge 'cause the games at that point were getting bigger and bigger. And that was exciting to us and we wanted to be you know, triple A huge, biggest games. And so we'd come up with a demo, we're pitching ideas to publishers, looking to use their money to make some product. And it was definitely a challenge that went on with us for many, many years looking for that product of our own. When possibly the better decision at the time would be to have been taking our own money and made our own small little product that was fully funded ourselves, that wasn't striving to be that big massive Blockbuster. - [Danny] Then that's a lot, that's your own money, it's more risky. - More risky but then you have full control over it, 'cause just when you're doing a work for hire project I mean it's their money, so you're doing what they want and maybe you never know exactly what they want or they don't know what they want. And if you look at our history and most independent studios' history, when they have full control, complete control over the product they're making, which often only comes if you're funding yourself, you'll make a better product. - [Danny] For over a decade, Digital Extremes would work predominantly in the cut throat world of work for hire. What many studios do when they're in this situation is scale up for projects, and then conduct wide spread layoffs afterwards. But James was from the area and Digital Extremes was the only studio in town. His employees had roots, families, friends, mortgage payments, so him and the team did anything they could to keep contracts coming through the door. What this meant was that their Dark Sector idea kept getting kicked down the road, while the team worked to keep the lights on. The studio partnered with Toronto based Groove Games on unreal engine shooter, Pariah, and its sequel of sorts, Warpath. They took a contract to help create the PlayStation 3 part of BioShock. All the while shipping around their Dark Sector game. - We had this idea, what would Metal Gear and like the Dark Crystal be if you put them together? So of course there would be like anime energy tentacles coming out of people's heads, there would be really cool robots, but the metal would be organic and changing, you know we had a lot of ideas, science fiction that wasn't necessarily just like James Cameron science fiction. We wanted maybe some Frank Herbert science fiction. So we had these kind of ideas and I went off and wrote a whole bunch of stuff about these characters and the artists you know, Mike Brennan designed these beautiful kind of very interesting enemies and him and Jeff you know, worked on the original what became our Excalibur suit. And we went around and pitched it, and this was kind of like when Halo was sort of a thing, starting to emerge, but every publisher said no one likes sci-fi and they won't sell. Consistently, every time. (light music) So the Tenno, which is the good guys, send in our boy, here he is, Hayden Tenno, looking nice in his ancient Excalibur armor suit. Alright so there he is, and this is the perspective of our game. It's sort of an over the shoulder mixed third person, first person type control scheme. We've got on the left hand log stick, we have moving straight like you might have in a game like Halo, and on the right stick we've got look, aim. So we see the suit at all times but we have what is essentially a first person control scheme. - Back then you were really beholden to publishers to get your games out. There wasn't digital distribution you know, you needed to get your game onto a retail shelf. And to do that was really expensive, and there was no way for kind of independent developers to be able to foot that bill. You have to manufacture a certain amount even to get onto store shelves and you have to pay all of that upfront, along with the licensing fees that come with that. And being an independent developer, up until about I'd say five to seven years ago, was really difficult. - I mean you talk to any kind of midsize developer, even these days, I think it's, and especially back then it was a huge challenge because the games were becoming bigger and bigger and the midsize games, it was really even more hit or miss. If they were to even gain any traction in retail. - As that runway was running out and I was getting desperate, and we were getting chain yanked by publishers you know. One publisher said well we don't like the hero, he's too feminine, can he have an eye patch? Like literally crazy things like that. It was getting so close to signing, but just wasn't and it was dragging on and dragging on. So we did a pivot, we said oh it's gonna be okay, no sci-fi stuff fine, okay so it's gonna be more like Resident Evil than it is gonna be like Dark Crystal in the space. So we kinda made these compromises in order to land the deal and we did. - [Danny] The Dark Sector that was eventually released looks almost nothing like the original pitch video. They took off the protagonist mask, instead of being a space soldier he was now part of the CIA. It played less like Metal Gear and more like Resident Evil 4 or Gears of War. But they did keep the name Hayden Tenno, a term they'd use again in the future. Dark Sector received above average reviews when it was launched in March of 2008, but it came out in a tough market as it was an incredibly popular time for third person action games. - Flailed around for awhile trying to find its footing and find what the actual game play was and how we integrated the clave with the gun play. And the cover system, and the cover system that was in existing games you know like Gears, was inspiration but we wanted to do something a little better, a little bit more fluid. - I mean that's the difference between what the publisher at the time wanted with the game. They wanted something that was more grounded and more kind of set in reality, that people could relate to. (light music) - Digital Extremes' Dark Sector project hadn't gone exactly the way they wanted to, but at the very least it had been competitive at market. Plus the team had another game at the door. They continued doing work for hire gigs. They developed the multi-player for BioShock 2 and Homefront. They designed the Darkness 2 for 2K and secured a contract to make the video game for an upcoming Star Trek movie. But the squeeze on mid-tier games was getting worse and worse for publishers. Rising development costs meant that the revenue required to make each of these games a financial success was rising with each year. Digital Extremes found themselves caught in the cross fire. - Well I think a lot of publishers moved all that stuff internally, and you know a mid-tier developer, I think we saw the writing on the wall. Those pitches and those things were harder to do and the quality bar that the publisher required and the risk they were willing to take were, they weren't really take 'em anymore. So it was like okay well, we're gonna have to figure out something else. - Star Trek's ramping up, ramping down rather, and soon there won't be anymore milestone payments coming in to keep the lights on. This other project that we had started that we thought was gonna get green lit, that publisher had a bad quarter and are now doing everything in house. Like these are literally things happened. - It was a very challenging time, and it was definitely hard to get those, to work with a publisher to get those real potentially high quality products funded, 'cause there was so much at stake. Like to compete, you need to put more money in them. And then at that time, we're looking at free to play and we heard amazing things about some of the more, I mean World of Tanks is the most perfect example. They did phenomenal, I don't know what the budget was but it clearly wasn't like a hundred million dollar budget to ship that out the door. And we loved the idea of the fact that you know, you can initially ship something smaller and we'd seen this in a few other games, and then grow beyond there. So it really seemed really appealing to us, that concept where you can try something out, see if the fans like it, and then grow as needed. - The inspiration was can we make something small? I mean back the clock up two years, that would've been a XPLA game right? But XPLA didn't seem to be landing the hits that maybe independent developers like we, were hoping it would. And so that seemed like okay well here's another option. My interest was not free to play, let's bilk the players. My interest was, well the scope of that sounds like something we could do with how much we have left. And it better work because that's it. - [Danny] Was it scary, the idea that like...? - Oh completely, it was our last, it was a hail Mary, it really was. - [Danny] How close to closing were you guys, or how close to bankruptcy? - Really close, really close. I can tell that story. It was super close, we knew that this was our last chance and we had a couple million dollars extra to do this with. We studied all the games out there, a couple like a game called Drakensang which I really enjoyed at the time and World of Tanks, and Battlefield Heroes I think had done alright. So we're looking at anything out there that looked like it was sustaining itself. I told Steve and the guys you know, you got 12 months that's it, there's like nothing but 12 months. - We had tried to make a version of Dark Sector multiple times, we had made this kind of weird MMO prototype using Unreal and we had kind of servers and you could jump between them, and it was kind of starting to feel almost like it was very pre-cursor the original Planet Side was coming out and we're like oh man. And World War 2 online, people were starting to make these kind of action games but with MMO contact. So we're really attracted to that. - Steve had always thought of a Dark Sector sequel where we go back to the space ninja demo that we had done. And he's thinking like a small space pirate raid. So we'd kinda do randomly generated ships, you'd raid these ships, get loot and come back. With that original idea of his you know, he kind of thought of it as a small maybe like PSN or Xbox Live game type of thing, that we just never really had the opportunity to make. So when we were thinking about going into the free to play, this seemed like a really good small, tangible demo that we could make and for us it was like, this thing we really love that we really never got to execute on. - A few of us went to James and said okay, we think we can do this really fast if it's this and it's small scope. And we think that co-op is not served as, it gives us an opportunity not to be kind of going against the giants. - [Danny] The team had a round of layoffs, but they were still 250 people large. Steve was put in charge of a small group around a dozen people who put together the demo for this new free to play game, taking ideas as early as the original 2000's Dark Sector MMO and much of the game play and visuals from their failed 2005 pitch of Dark Sector. They put together a demo of their spaceship raiding game in just under two months. Then Steve and Meredith went back on the road to try and pitch this game to free to play publishers looking for any sort of cash injection to help them keep the lights on. - And we had the largest free to play publishers in the world, the richest, I don't need to name them but you can just like Google who's the richest, here they come, and they walked in and they said aw, this is great, I can't believe this. What an exciting meeting, I'm so... And it's slow motion and the record needle scratched cause it was sci-fi. And they just walked out. - As soon as they saw that it was PVE and sci-fi, it was pfft. (laughing) We were like what? - At that same time I remember one of those guys, they came to the studio, they did the tour, they looked at what we'd been building, and his reaction was interesting. It was this is the best looking free to play game I've ever seen, you will fail. (laughing) Dave and I just looked at each other, oh kill me now. So why are we gonna fail? Well because the game can't look this good and update as often as you need to to build your community. And of course that was like branded on my ass, like frequent fast updates, how are we gonna do this? So a lot of early tech in Warframe, like the procedure levels and that sort of stuff, completely geared to that kind of idea of frequent updating. Those publishers didn't bite, and so it was can we make money before the end of the year? And that was like okay so nine months to make a game. - When the team tried to make the original Dark Sector, the need to get a publisher influenced that game dramatically but this time Digital Extremes didn't have time to retool the game for publisher needs, and frankly they didn't want to. They knew what type of project they were making, a free to play space ninja game they were currently calling Lotus. But what they didn't know was whether or not this game would be enough to help save the company. This project was a massive shot in the dark. Not only had the team never made a free to play game before but this game was going to be responsible for keeping a studio of 250 people afloat, while they scrambled to look for more work for hire gigs. What actually transpired wouldn't only shock and surprise DE but the entire video games' world. In the next part in this series, we take a look at the remarkable story of Warframe. See ya then. (light music) - [Steve] Alright so I'll get in position here and left trigger, and this is a contextual area where I can hang, jump up, drop down from, to get the jump on enemies, to get into a better strategic position, to hide, and these are contextual areas in the level, okay. Left trigger up and I hop up, better get in here, and right trigger, yeah take that. Nice shadow kill there and that's done, sneak attack with the right trigger. It allows us to kill guards that are unaware of us and of course if he was aware of me, would've been a much different situation. So I'm gonna show you focus now and that's, talked about left trigger and right trigger, each stance also has a focus and that's by pressing both triggers at one time. It allows us to do something per stance and in this case, it allows us to have this sort of x-ray vision, this is the stealth ping so to speak, sort of a Daredevil-esque view of the world. And we can see those glowing red dots, those are enemies, it lasts based on how long I focused for. And they've sent up a sentient machine to look for me because their buddy hasn't checked in, so a little suspicious here, very nice. So the thing that makes Hayden special of course is that he has a gift with these sentient machines in that he can sort of mind meld or link with them, as we call it and that's one of the stances that we use in the game.
