transcript: in 2023 250,000 people were laid off from their Tech job in 2024 as of the writing of this video 50,000 folks in Tech were laid off and unless entire lines of business or organizations go under it's the low performers and low-level staff that are getting let go first with AI progressing at break next speed the difficulty getting any entry-level positions and the fact that companies are only hiring for senior roles and above it's clear that senior engineer is the new Junior engineer if you're a junior or a mid-level engineer right now you need to become not one as quickly as possible getting to the next level as soon as possible is the best insurance policy you can have in these turbulent times nobody knows when the recovery will happen or if it will happen at all in this video I'll give you three pieces of advice that will accelerate your promotion prospects if you're new to the channel my name is Steve Winn and I'm a former Amazon principal software engineer I recently quit my job to become a full-time content creator my goal is to make the videos that I wish existed when I was coming up I've taken the goal to help 1 million people grow their careers which includes getting promoted faster the fastest way to get that goal is through creating free YouTube content if you have a question or topics that you'd like me to cover regarding promotion leave them in the comments section below and I'll answer them in subsequent videos if you want to work closely with me I have a paid program called speedrun to promotion the next cohort is launching on April 19th 2024 via live office hours where I'll answer your questions about promotion live and I'll also share details about a big price reduction to jump start this I'm giving away free sample content from the course so you can get a sense of whether the program is right for you details about the live stream and free video content can be found in the description below before I give you my first piece of advice let me tell you two stories about my own promotion Journey that will illustrate the point in 2016 I I thought I was ready to be promoted to principal engineer I'd been a senior for about 4 years and I was kicking butt I had led several cross team initiatives and I was clearly the best engineer across the four Dev teams within my org but because of some reorganization and attrition I didn't have a manager a level above me for quite some time and when I finally did get a manager he was terrible let's name him Bob to protect his identity Bob wasn't technically deep Bob didn't show up to meetings but somehow was still a micromanager and and to be honest Bob wasn't a nice guy the next step in my promotion was that he had to submit a request for promotion assessment on my behalf into an internal website a month before the deadline I made my request to Bob to send it in he said it was all good a week before I again reminded Bob to submit the request I provided all of the necessary materials he just had to click a button he said he would do it the day before the deadline and the day of the deadline I reminded Bob again I told him how important it was to me Bob I said please if you don't I'll have to wait another 6 months I'll let you guess what happened if you guess that he never put the request in you win our grand prize I still don't understand how Bob got to where he was it's a mystery I think about to this day after the incident I didn't find work fulfilling anymore I hated being there and dreaded coming into the office 3 years later I was still a senior engineer but I had a different manager let's name him Carl Carl was awesome to be more specific Carl and I were awesome together he was technically deep he cared about our project and the tech stack and the team when he couldn't make it to important meetings he had enough trust to send me in Instead This gave me a ton of visibility that I wouldn't have otherwise we were so in sync we finished each other's sentences work was invigorating again so much so that I look forward to coming into the office we wrote a lot of great software and landed a ton of projects in this time frame Carl did put the request into the system for my promotion but my promotion didn't go through it hurt but I got some feedback that I could work with of course after that rejection Carl told me that he was quitting Amazon it was a double whammy for me and I felt the feelings that I had when I was dealing with Bob but this time it was different on his way out Carl made sure to properly hand off my promo packet to my new manager and put in a good word for me my new manager was immediately supportive because of Carl's endorsement and I was promoted to principal shortly after he left the company Carl also gave me an unexpectedly large compensation increase on his way out thanks Carl I I still remember you hooking me up the difference between Bob and Carl was night and day and that's my first point the relationship with your manager is the most important one you'll have at work and it's definitely the most important one you'll have for your next promotion to get promoted your boss has to stick their neck out for you on top of doing a bunch of extra work to push your packet through including writing your promotion document they don't do that for people that they don't have a good relationship with and they can't do that if they're incompetent so what do you do if you have a bad relationship with your manager or they're just terrible to work with if you can't repair your relationship with them and you care about promotion you need to move teams and find a new manager if you can't do that internally you may need to find a job elsewhere if you do move make sure that you as much as you can don't move to another bad manager by at least making sure to talk to your prospective teammates I estimate Bob cost me at least 2 and 1/2 years in my promotion Journey that's easily a half million in total compensation between senior engineer and principal not even accounting for market growth in that that time I could have bought a Lambo with that money kidding aside half a million dollars is life-changing money for almost everybody on the planet but I wasn't thinking clearly and I didn't realize that I had a choice I really liked the product that I was working on and my teammates so I thought I could work around in unsupportive manager but working around a bad manager relationship is impossible when it comes to promotion and a competent supportive manager that you have a good relationship with is the fastest way to get promoted this is a perfect example of the cost of inac action back then I didn't understand that I was making a choice by sticking with my bad manager if you're at a place where you couldn't possibly get promoted by doing nothing to upgrade that situation you are choosing not to be promoted moving teams or finding a new job is a pain in the butt but that's what the cost of promotion is if I found Carl 4 years earlier I'd be rolling around in that Lambo don't make that same mistake as me and you'll get promoted much faster before I get into my second point I'd like to pose a set of hypothetical questions for you about which would be a better promotion project the first scenario a you could work on automating a bunch of tests which is going to take some time or B you can continue to add more tests and run those tests manually which one would you do the second scenario a you could create a scalable architecture to make feature development faster or B you could spend your time developing critical features the third scenario a spend some time and effort to make your workloads more efficient and therefore save the company some money or or B continue to use the existing infrastructure and add more workloads to it A or B so what are your answers if you want to get promoted as quickly as possible now for many of you you answered a to all of the questions because delivering automation designing a scalable architecture and finding efficiencies on paper would be the most promotion worthy activities and in a vacuum they are the highest leverage and most impactful choices but you don't work in a vacuum and that's my point the best promotion projects are based on what the needs and values of the company are you can actually set your promotion prospects back by doing work that sounds like they should be promotion worthy but aren't aligned with what's needed and valued so let's examine the hypotheticals again you could a work on automating a bunch of tests or you could B continue to add more tests and run those tests manually test automation would be really valuable if your team is spending a significant amount of time manually running tests automation would be great because it would save a ton of time and the impact would be clear however if your team's bandwidth isn't affected by running manual tests or you're in a time crunch for a big delivery or say you don't even have tests at all much less automated test it might be the right move to continue down the manual testing route it could just be as impactful as automation for the next one you could do a and create a scalable architecture to make feature development faster or B you could spend time developing critical features this is similar to the last example if feature development is really slow then the investment is worth it there are several critic features that need to come out put your energy there one thing that I'll call out about this example is that it's really important to couch your decision in reality large projects like creating scalable architectures usually requires the alignment and support of several teams it could also likely require work from them if teams are resource constrained getting buy in for your proposals may be difficult especially if you can't describe a credible approach because you don't have visibility into what adjacent teams are doing and what their priorities are so it might take a lot of extra work to get that buy in if your project will require a team of developers and the support of many teams it's going to take a lot more than a good idea to get that project off the ground finally there's a spend the time and effort to make your workloads more efficient and save the company money or B to continue to use the existing infrastructure and to add more workloads to it if your company is hemorrhaging money on cloud resources that they don't need a seems like a no-brainer but you have to keep in mind that the juice needs to be worth the squeeze if it'll take your team 3 months to move to a different data store to save $5,000 a month you should recognize that your team's bandw worth is worth way more than that on top of the opportunity cost of what they could have built in that time period you want to find places where you can make a big impact while minimizing the effort required to realize those savings it's difficult to see the company wasting money because there are likely a lot of inefficiencies in any system that exists but if it takes more resources then you'll save that shows a lack of judgment that will hold your promotion prospects back you wouldn't want to have a 2-hour departmental meeting on the fact that there are too many meetings so don't do the equivalent with your day-to-day work you want to develop a nose for impact based on what your company values and what they need figure out what those are and you'll be well on your way to your next promo if you don't know what those are I would start there before I get into my final point I want to talk about a common failure mode when it comes to promotion especially promos past senior engineer the staff and principal levels at a company are often times very different jobs than being a senior for example at that level you may be expected to leave cross functional projects that require the effort of several teams to land senior Engineers don't often do this type of work so suppose you did get assigned one of these cross functional projects and you saw it as your ticket to get promoted so you put a 100% of your energy into the project and let's even suppose that it lands and let's even say that it's successful you're getting accolades from everybody and you feel like you've done your best work and then performance review time comes and you only get an average rating and you get passed over for your promotion what gives well because you put 100% of your energy into the next level project you've neglected your duties at your current level you didn't write a lot of code you neglected maintenance and operations for the software that your team owns you skipped out on all of your team meetings because it overlapped with the status meeting for the big project and that's my last point you need to meet and maintain expectations at your current level before you attempt to take on scope at the next level this advice is true for all promotions but especially true for higher level promot motions so what should you have done about the big project by the time you get to the top of your existing level you should have become really efficient with your work and maintaining expectations the problem here is that you put 100% of your energy into the next level project and completely neglected your existing duties and responsibilities I would recommend going at the project with something like 75% of Your Capacity which will leave you some time to meet the expectations at your current role because you're so efficient now it won't take you that much effort to complete your at level Duty the mistake is completely neglecting your duties at the existing level this is a trap because likely the next level work is challenging and will take up all of your bandwidth if you don't watch out which will lead to a bad performance rating even though you're killing it with your next level project it's like reading a book by skipping chapters sure you finished it in record time but the ending didn't make sense and who exactly is this Harry Potter character you can't skip your existing responsibilities that has to come first because at a lot of companies annual performance reviews are based on meeting and exceeding expectations at level don't neglect this when trying to demonstrate Next Level skills to get promoted because you'll be in this weird situation where you're doing next level work but getting middling or even low performance reviews for your at level work you have to do both otherwise I will set your promotion back if you found this video useful none of it matters unless you also pair it with the advice from this video on how to speedrun your promotion in it I give even more tips on how to get promoted faster there's a lot to this stuff so don't miss out
