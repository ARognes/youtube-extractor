transcript: '{"content":"\n[11.79s] [music]\n[17.685s] [music]\n[22.27s] [music]\n[26.88s] >> When we think about what makes parents\n[28.64s] good or not so good, it''s easy to fall\n[31.96s] into a kind of magical thinking, as if\n[34.24s] they either have some special mysterious\n[36.16s] nature or they don''t.\n[39.12s] In fact, we can identify some very\n[41.28s] specific practical features that help to\n[43.8s] determine parental success.\n[46.84s] In part one, I listed 10 essential\n[49.36s] qualities of a good enough parent and\n[52.4s] explored how each of these key traits\n[54.28s] and behaviors address the child''s\n[56.28s] developmental needs.\n[58.68s] In this second part, I want to look at\n[60.72s] some common parenting styles where\n[62.68s] substantial chunks of these core\n[64.4s] qualities are missing.\n[67.08s] Why do some parents use these defective\n[69.32s] styles?\n[70.56s] What effects do they have on children''s\n[72.24s] development?\n[73.88s] And are the effects permanent or can\n[76.44s] they be overcome?\n[78.36s] Let''s start with a brief recap of the 10\n[80.36s] qualities.\n[82.2s] As previously explained, half of them\n[84.36s] are about providing structure, giving\n[86.36s] children a predictable framework to help\n[88.88s] instill a sense of order and security.\n[92.0s] These include establishing clear\n[93.56s] routines, a reliable parental presence,\n[96.44s] firm boundaries, and thoughtful\n[98.04s] discipline,\n[99.28s] and modeling the same values we ask\n[101.32s] about children.\n[103.44s] The other five qualities come under the\n[105.0s] heading of substance.\n[106.68s] They''re about support and sensitivity,\n[108.88s] helping children understand themselves\n[111.0s] and build skills and self-worth.\n[114.12s] They include showing attention and\n[116.08s] empathy,\n[117.4s] creating an atmosphere of openness,\n[119.96s] giving encouragement, and adapting to\n[122.44s] the child''s development with appropriate\n[124.6s] freedoms and responsibilities.\n[127.76s] Structure and substance work together to\n[130.24s] create a solid, balanced foundation for\n[132.6s] growth.\n[134.08s] Good enough parents are high in both of\n[135.92s] these dimensions,\n[137.56s] and classified in developmental\n[139.28s] literature as authoritative.\n[142.76s] But other parenting styles show a\n[144.64s] serious imbalance.\n[147.2s] Authoritarian parents are high in\n[148.72s] structure, but low in substance,\n[151.56s] imposing rigid rules, but lacking warmth\n[154.36s] or understanding.\n[156.4s] Indulgent parents are high in substance,\n[158.64s] but low in structure, offering\n[160.76s] sensitivity, but lacking firmness or\n[163.32s] consistency.\n[165.36s] Finally, uninvolved parents are low in\n[167.72s] both dimensions.\n[169.44s] These parents fail to reliably\n[171.2s] demonstrate any real parenting, and\n[173.6s] there''s little to say about them in\n[174.88s] terms of the core qualities,\n[176.76s] but I''ll look at their effects on their\n[178.28s] children later.\n[180.32s] While authoritarian and indulgent\n[182.36s] parents do consistently exhibit some of\n[185.0s] the core parenting qualities, the\n[187.08s] positive impact these qualities might\n[188.84s] have had is corrupted by the substantial\n[191.48s] absence of the rest.\n[193.56s] Let''s look at that corruption in more\n[194.959s] detail.\n[199.777s] >> [music]\n[203.76s] >> The authoritarian parenting style is low\n[206.08s] in substance, lacking the warm and\n[208.48s] nurturing traits.\n[210.56s] Children''s need for attention is often\n[212.76s] dismissed or even pathologized.\n[215.2s] Giving them dedicated time to show them\n[217.08s] they''re valued is seen as coddling.\n[219.8s] Attention can become primarily negative,\n[222.239s] focused on how children are falling\n[223.959s] short of expectations.\n[226.48s] Instead of empathizing with their\n[227.88s] children''s feelings, authoritarian\n[229.8s] parents often try to dictate which\n[231.72s] emotions the child should or shouldn''t\n[233.76s] express based on what they deem socially\n[236.08s] appropriate.\n[237.8s] They don''t understand that emotions\n[239.28s] become socially appropriate as children\n[241.68s] learn to fully experience and master\n[243.84s] them,\n[244.72s] not by making them perform emotions they\n[246.64s] don''t feel.\n[248.52s] Some emotions are forbidden altogether.\n[251.12s] Anger is often seen as insubordination\n[253.6s] that needs to be stamped out.\n[255.88s] Grief is often trivialized.\n[258.44s] The classic authoritarian threat, \"I''ll\n[260.6s] give you something to cry about.\"\n[262.16s] dismisses children''s tears as pathetic,\n[264.88s] ungrateful, deceptive.\n[267.919s] Instead of learning to understand and\n[269.68s] regulate their feelings, children learn\n[271.6s] to suppress them behind a mask, often a\n[274.32s] performance of happiness.\n[276.84s] It''s a classic recipe for creating\n[278.6s] volatile adults whose emotions feel\n[280.8s] scary, unpredictable, and explosive.\n[284.96s] Authoritarian communication is strictly\n[287.04s] one-way.\n[288.24s] No discussion or negotiation.\n[291.28s] Children learn to be very cautious about\n[293.04s] what they share, and secrecy can become\n[295.04s] an automatic survival strategy.\n[297.88s] Instead of receiving praise and\n[299.4s] encouragement for their efforts,\n[301.04s] children are more likely to be\n[302.6s] criticized, shamed, and punished for\n[305.44s] poor performance.\n[307.48s] Good behavior and achievement are often\n[309.68s] taken for granted, and it''s expected\n[312.08s] that children should find hard work its\n[314.08s] own reward.\n[315.68s] It''s true that our brains are wired to\n[317.32s] reward us for productive persistence,\n[319.8s] but some tasks, including some daily or\n[322.24s] weekly chores, can feel excessively\n[324.76s] difficult or draining to young children.\n[327.68s] Rewards can help them overcome the\n[329.44s] initial slump and quickly get into good\n[332.0s] habits.\n[333.68s] Praise and rewards also build trust and\n[336.44s] social bonds.\n[337.88s] Using constant criticism, shaming, and\n[340.4s] threats to gain compliance destroys\n[343.36s] trust and creates psychological\n[345.24s] distance.\n[347.68s] Driven by their need for control, these\n[349.8s] parents can be extremely slow to adapt\n[351.92s] to their children''s growth or recognize\n[354.2s] their adult independence.\n[356.44s] While authoritative parents are happy to\n[358.6s] see their offspring break away into\n[360.52s] their own autonomous existences,\n[362.68s] authoritarian parents often try to\n[364.84s] maintain their stronghold, expecting\n[366.88s] lifelong submission.\n[369.04s] Some try to dictate their offspring''s\n[370.76s] careers and even their choice of\n[372.64s] partners.\n[374.2s] With none of the supportive qualities to\n[376.12s] provide balance, the structure that\n[378.16s] would otherwise feel reassuring and\n[379.919s] containing becomes cold and imprisoning.\n[383.44s] A key function of routine is to help\n[385.8s] children feel settled in familiar,\n[387.919s] predictable procedures, creating a calm\n[390.6s] baseline by reducing unknowns.\n[394.04s] But authoritarian routines can become\n[396.08s] overly regimented and controlling,\n[398.52s] arousing constant anxiety and creating a\n[401.04s] stressful baseline atmosphere.\n[404.64s] The reliable presence of safe parents\n[406.88s] gives children the confidence to explore\n[408.88s] and master their environment, knowing\n[410.96s] they can always return if they encounter\n[412.8s] problems.\n[414.2s] While many authoritarian parents are\n[416.2s] consistently present, their proximity\n[418.4s] rarely feels safe.\n[420.32s] Mistakes and failures are often met with\n[422.72s] impatience, punishment, and scorn.\n[426.08s] In this punitive atmosphere, children\n[428.4s] learn not to approach, trust, or ask for\n[431.36s] help, and feel less confident taking\n[433.88s] risks.\n[435.32s] The survival strategy of avoidance can\n[438.0s] become ingrained and undermine other\n[440.56s] relationships.\n[443.2s] Boundaries that in healthy households\n[445.24s] work to ensure safety and build social\n[447.48s] awareness become more focused on\n[449.52s] enforcing parental authority.\n[452.0s] Many religious and political\n[453.64s] authoritarians will try to block access\n[455.919s] to any influences that might contradict\n[458.24s] their dogma.\n[459.64s] Relationships outside their immediate\n[461.24s] family or community might be forbidden\n[464.04s] along with public spaces like libraries\n[466.56s] or art galleries that promote free\n[468.56s] thinking and expression.\n[471.24s] Discipline can be excessive with threats\n[473.48s] of grueling, humiliating, and violent\n[475.72s] punishments even for minor\n[477.4s] transgressions.\n[479.32s] Authoritarian parents might claim benign\n[481.6s] educational motives and parrot the buzz\n[484.04s] phrase tough love,\n[485.76s] but in many cases the extremity of their\n[488.08s] actions betrays a darker goal,\n[490.96s] achieving absolute dominance by crushing\n[493.56s] the child''s spirit.\n[495.8s] Healthy discipline is about encouraging\n[497.96s] children to consider the effects of\n[499.72s] their actions,\n[501.16s] but authoritarian discipline often shuts\n[503.24s] down any deep reflection and just breeds\n[506.0s] fear, shame, and resentment.\n[508.96s] Unable to manage or process these\n[511.0s] difficult emotions, many children\n[513.0s] internalize them as anxiety and\n[515.2s] depression or externalize them as\n[517.8s] hostility and aggression.\n[520.68s] An aspect of structure that''s often\n[522.24s] absent is modeling.\n[524.72s] Authoritarian parents lead by command,\n[527.2s] not example.\n[528.88s] While some do try to uphold the same\n[530.92s] standards they demand from their\n[532.16s] children, others exhibit flagrant\n[534.6s] hypocrisies including refusing to\n[537.04s] apologize, denying flaws and failures,\n[540.28s] indulging in emotional outbursts,\n[542.32s] insults, and attacks.\n[544.56s] These inconsistencies teach children\n[546.76s] that their parents rules have no real\n[549.0s] moral grounding.\n[550.48s] It''s just about power.\n[552.92s] Children copy what they see and some\n[555.24s] will mimic their parents'' abuses with\n[557.16s] siblings and schoolmates, and many\n[559.6s] parents who encounter these imitations\n[561.52s] of their own offenses will protest that\n[563.839s] their children weren''t raised that way.\n[566.72s] Why do some people adopt this parenting\n[569.16s] style?\n[570.88s] It''s worth noting that authoritarian\n[572.52s] parents come in different forms.\n[575.0s] Ideological authoritarians will often\n[577.4s] justify their parenting style with\n[579.2s] appeals to tradition and established\n[581.44s] frameworks.\n[583.28s] They might be driven by notions of\n[584.8s] purity, believing their chosen system to\n[587.4s] be the best.\n[589.08s] While their rules are harsh, they''re\n[591.08s] often applied consistently. And when\n[593.48s] their authority is challenged, they''ll\n[595.48s] often stick to the corrective methods\n[597.4s] promoted by their belief system, however\n[599.8s] misguided those methods might be.\n[602.72s] In contrast, narcissistic authoritarians\n[605.68s] seek compliance based on ego and\n[607.88s] entitlement.\n[609.56s] I''ve often called them anti-parents\n[611.72s] because they work to actively sabotage\n[613.72s] their children''s development and erase\n[616.12s] their personalities.\n[618.24s] Their rules and standards are prone to\n[620.04s] radical change according to their fickle\n[622.28s] moods.\n[623.56s] Challenges often spark rage and vengeful\n[626.4s] attacks.\n[628.24s] Of course, some ideological\n[629.8s] authoritarians are also narcissists, and\n[632.6s] many will use their belief systems to\n[634.68s] validate their abuse.\n[636.88s] A third important category is the\n[638.6s] reactive authoritarian.\n[640.64s] This parent isn''t necessarily a natural\n[642.76s] authoritarian, and in normal\n[644.6s] circumstances might well be a good\n[646.56s] enough parent.\n[648.12s] As their name suggests, for these\n[650.08s] individuals, adopting an authoritarian\n[652.56s] parenting style is a reaction, often as\n[655.76s] an overcompensation to an overly\n[657.96s] indulgent partner who provides none of\n[660.32s] the firmness essential [music] to the\n[661.88s] child''s development.\n[665.487s] >> [singing]\n[667.452s] [music]\n[671.64s] >> Indulgent parents lack structure,\n[673.96s] allowing disorder to seep into and\n[676.56s] sometimes define the child''s life.\n[679.8s] They prioritize their children''s\n[681.28s] immediate comfort and happiness over\n[683.52s] their long-term development.\n[686.16s] Instead of establishing regular\n[687.64s] routines, parents endlessly renegotiate\n[690.44s] mealtime, screen time, bath time, and\n[693.8s] bedtime, turning simple daily habits\n[696.76s] into chaotic free-for-alls.\n[699.6s] Indulgent parents are often present\n[701.52s] physically, but instead of being a calm,\n[703.96s] safe anchor, their presence can be\n[705.96s] hyper-vigilant and hovering,\n[708.08s] anticipating every discomfort, trying to\n[710.92s] erase obstacles before the child can\n[713.12s] encounter them.\n[714.68s] This coddling behavior prevents children\n[716.92s] from experiencing the crucial\n[718.48s] trial-and-error process that builds real\n[720.88s] confidence and problem-solving\n[722.6s] abilities.\n[724.76s] Boundaries are poorly and inconsistently\n[727.24s] enforced.\n[728.64s] Many indulgent parents will attempt to\n[730.6s] set limits, but cave in the face of\n[733.04s] repeated resistance. Some give up\n[735.48s] setting boundaries altogether and just\n[737.48s] try to manage the chaos.\n[740.0s] Parents who routinely compromise their\n[741.76s] boundaries teach their children that\n[743.72s] boundaries aren''t really serious or\n[745.44s] meaningful.\n[746.96s] With every surrender, they reinforce the\n[749.16s] child''s habit of pushing because it\n[751.76s] works.\n[753.24s] The child might come to see any new\n[754.96s] boundary as a challenge, even a game.\n[758.16s] But boundaries aren''t a game.\n[760.32s] They''re about preserving children''s\n[761.76s] safety, helping them to integrate\n[763.8s] socially, and teaching them to control\n[766.2s] impulses and tolerate frustration.\n[769.72s] Sacrificing boundaries for a quiet life\n[772.12s] can put children at a developmental\n[773.92s] disadvantage and expose them to danger.\n[778.28s] Indulgent parents often see even the\n[780.2s] mildest discipline as destructive to the\n[782.68s] relationship rather than an essential\n[785.04s] tool to develop their children''s\n[786.72s] capacity for self-awareness and\n[788.64s] responsibility.\n[790.44s] Instead of allowing their children to\n[791.88s] experience the consequences of their\n[793.6s] actions, they constantly shield and\n[795.72s] rescue them, excusing them, apologizing\n[798.76s] for them,\n[799.76s] paying for them.\n[801.6s] By doing this, they prevent their\n[803.24s] children from connecting cause with\n[805.08s] effect and developing accountability.\n[808.64s] Indulgent parents often fail to tackle\n[810.92s] their child''s aggression because they\n[813.08s] struggle to separate feelings from\n[814.88s] behavior.\n[816.4s] When a child hits or throws things in\n[818.52s] anger, they see the action as an\n[820.96s] understandable expression of feeling.\n[823.72s] As I noted in part one, an effective\n[826.0s] parent separates the two, telling the\n[828.24s] child it''s okay to be angry, it''s not\n[831.2s] okay to punch.\n[833.84s] I used to ask my indulgent parent\n[835.64s] therapy clients why they would expect\n[837.68s] their child to stick to their boundaries\n[839.56s] if they didn''t themselves.\n[841.84s] Indulgent parents often fail to model\n[844.04s] the qualities they expect from their\n[845.6s] children, including respect for\n[847.68s] boundaries, emotional tolerance, and\n[850.2s] accountability.\n[852.0s] By trying to avoid immediate discomfort,\n[854.48s] they demonstrate that short-term relief\n[856.6s] outweighs all of these qualities.\n[859.08s] Children copy their example, reacting\n[861.24s] impulsively and emotionally, and\n[863.44s] struggling with self-control in the face\n[865.52s] of real-world challenges.\n[868.08s] With few structural qualities to provide\n[870.16s] balance, the warmer, nurturing substance\n[872.92s] that would otherwise help children\n[874.36s] develop self-worth becomes corrupt and\n[876.68s] degraded.\n[878.32s] What does that corrupted substance look\n[880.28s] like in action?\n[882.44s] When it comes to attention, indulgent\n[884.36s] parents often sacrifice quality for\n[886.36s] quantity. Instead of having moments of\n[888.839s] structured, meaningful, one-to-one time\n[891.32s] that build the child''s self-worth, they\n[893.36s] frequently let the child dictate every\n[895.56s] conversation, activity, and schedule,\n[898.64s] teaching the child that attention is a\n[900.44s] commodity to be demanded.\n[903.64s] Indulgent parents might see themselves\n[905.32s] as empathic because they feel acutely\n[907.8s] sensitive to their children''s emotional\n[909.72s] states, but that''s not empathy.\n[913.04s] True empathy allows a parent to feel the\n[915.48s] child''s sadness or frustration, but\n[918.16s] remain calm and grounded, acting as a\n[920.72s] container for the emotion.\n[922.96s] Indulgent parents often experience the\n[924.92s] child''s distress as unbearable to\n[926.88s] themselves.\n[928.4s] Giving in to a tantrum or demand isn''t\n[930.92s] done out of a deep attunement with what\n[932.68s] their child needs. It''s done to swiftly\n[935.24s] extinguish the child''s distress so the\n[937.72s] parent can feel relief.\n[940.28s] Empathic parents are motivated to build\n[942.28s] the child''s resilience and long-term\n[944.56s] well-being.\n[945.76s] Indulgent parents often focus on\n[947.52s] avoiding conflict and winning the\n[949.76s] child''s approval.\n[951.32s] Empathic parents validate the emotion\n[953.52s] while holding the boundary.\n[955.48s] They say to the child, \"I can see you''re\n[957.44s] upset and it''s okay to feel that way,\n[960.64s] but the answer is still no.\"\n[963.68s] Indulgent parents discard the boundary\n[965.88s] to stop the discomfort.\n[967.88s] They prioritize immediate emotional\n[969.8s] soothing over building the child''s\n[971.76s] capacity to handle difficult feelings\n[974.24s] like frustration and disappointment.\n[977.84s] Indulgent parents often encourage\n[979.72s] openness, creating a non-judgmental\n[982.16s] environment where children feel able to\n[984.48s] express their thoughts, feelings, and\n[986.56s] desires.\n[987.8s] Unfortunately, these parents often\n[989.76s] struggle to be open with their children,\n[992.2s] avoiding responses that might upset\n[994.2s] their children, including giving\n[996.04s] authentic constructive feedback or\n[998.8s] expressing expectations.\n[1001.4s] While authoritarian communication goes\n[1003.6s] one way from parent to child, indulgent\n[1006.2s] communication can be almost entirely the\n[1008.36s] reverse with the child always\n[1010.36s] broadcasting and rarely receiving.\n[1014.48s] Indulgent parents often flood children\n[1016.839s] with excessive praise and rewards for\n[1019.24s] minor achievements or basic play. While\n[1022.08s] it''s intended to boost self-esteem, it\n[1024.319s] can disrupt important psychological\n[1026.36s] processes.\n[1027.64s] When children are naturally interested\n[1029.439s] in something, rewarding them for it can\n[1031.64s] undermine their interest.\n[1033.68s] It''s called the overjustification\n[1035.52s] effect. Their focus shifts from internal\n[1039.0s] satisfaction to external approval.\n[1042.16s] What used to be fun becomes a chore\n[1044.6s] performed for applause.\n[1046.8s] By over praising them instead of letting\n[1048.84s] them experience simple autonomous joy,\n[1051.32s] parents can extinguish internal\n[1053.32s] motivation leaving children dependent on\n[1056.08s] validation and less inclined to explore\n[1058.72s] personal interests for their own sake.\n[1062.16s] Indulgent parents struggle to adapt to\n[1064.48s] an equal adult relationship with their\n[1066.68s] children because they cling to early\n[1068.84s] childhood warmth neglecting to instill\n[1071.28s] in the child the qualities required for\n[1073.48s] autonomy.\n[1075.16s] By continuing to shield, over soothe,\n[1077.8s] and infantilize their growing children,\n[1080.16s] parents prevent them from developing\n[1082.24s] age-appropriate independence,\n[1084.16s] accountability, and real-world\n[1086.36s] problem-solving skills.\n[1088.52s] Like authoritarians, they fail to fully\n[1090.96s] separate.\n[1092.76s] Why do people become indulgent parents?\n[1095.92s] Some might be over compensating for\n[1097.84s] overly strict upbringings, giving their\n[1099.88s] children the freedom they were deprived\n[1101.68s] of.\n[1102.72s] People who experienced childhood\n[1104.16s] neglect, poverty, or trauma might\n[1106.36s] indulge their children to try and heal\n[1108.52s] the unmet needs of their own past.\n[1111.76s] Overworked professionals, busy single\n[1113.92s] parents, or non-custodial parents might\n[1116.68s] spoil their children to make up for\n[1118.56s] their unavailability.\n[1120.72s] Individuals high in agreeability and\n[1123.4s] people pleasers who struggle with\n[1125.24s] conflict might want to be seen as a fun\n[1127.72s] friend by their child.\n[1129.92s] Parents who struggled with infertility\n[1132.12s] or adoption processes or had children\n[1134.8s] late in life might treat their child\n[1136.88s] with exaggerated reverence.\n[1139.76s] And again, some change their style as a\n[1142.36s] reaction to the other parent becoming\n[1144.48s] much more permissive than they would\n[1146.04s] otherwise be in response to an overly\n[1148.6s] strict authoritarian partner.\n[1151.6s] It might seem that taken together an\n[1153.72s] authoritarian partner and an indulgent\n[1156.04s] partner would balance each other\n[1157.48s] perfectly.\n[1158.76s] One providing the firm predictable\n[1160.36s] structure, the other providing the\n[1162.48s] warmer nurturing substance. But as I''ve\n[1165.56s] explained, these versions of structure\n[1167.88s] and substance are distorted and\n[1169.96s] corrupted. The structure is harsh and\n[1172.96s] claustrophobic.\n[1174.68s] The substance is coddling and enabling.\n[1177.76s] And the conflict it sets up does no one\n[1180.36s] any good, least of all the children who\n[1182.84s] struggle to internalize clear social\n[1184.88s] rules and often try to get their needs\n[1187.2s] met by manipulating the dynamic, playing\n[1189.84s] parents off against each other to secure\n[1192.0s] rewards or avoid consequences.\n[1195.4s] For structure and substance to work\n[1196.96s] effectively together, they need to be\n[1198.92s] integrated [music] in both parents.\n[1201.44s] Good enough parents.\n[1210.84s] What are some of the long-term\n[1212.08s] behavioral and psychological effects of\n[1214.12s] these parenting styles?\n[1216.2s] Children of authoritarian parents often\n[1218.68s] display high self-control but frequently\n[1221.48s] suppress anger, which they were\n[1223.12s] forbidden to express growing up.\n[1225.44s] This can lead to explosive outbursts.\n[1228.52s] Although they show persistence under\n[1230.04s] pressure, they''re often motivated by\n[1232.12s] fear of failure and anxiety.\n[1235.32s] Academically and professionally, they\n[1237.28s] perform well in structured settings, but\n[1239.8s] sometimes struggle with more free-form\n[1241.72s] creativity and critical thinking.\n[1244.92s] In relationships, they can have trouble\n[1247.08s] with intimacy, trust, and authentic\n[1249.92s] emotional expression and might take\n[1252.08s] refuge in secretive behavior.\n[1255.28s] Children of indulgent parents often\n[1257.2s] exhibit low frustration tolerance and\n[1259.52s] difficulty managing intense emotions,\n[1262.2s] expecting others to manage them for\n[1264.16s] them.\n[1265.32s] They might have a tendency to give up at\n[1267.24s] the first sign of discomfort.\n[1269.6s] Their difficulties with deadlines,\n[1271.64s] self-discipline, routine, and authority\n[1274.56s] can lead to underachievement\n[1276.08s] academically and professionally, and\n[1278.36s] their relationships can be plagued by\n[1280.28s] entitlement and a lack of give and take.\n[1283.84s] Children of uninvolved parents can\n[1285.92s] struggle with impulse control and\n[1287.76s] emotional expression because of a total\n[1289.96s] lack of early regulation.\n[1292.68s] They can be prone to quitting easily or\n[1295.12s] avoiding trying, having learned that no\n[1297.56s] one will help if they fail.\n[1299.76s] With no support or monitoring at home,\n[1302.36s] academic work can suffer, and some\n[1304.64s] children fall into a habit of chronic\n[1306.52s] absenteeism, which can extend to the\n[1308.6s] workplace.\n[1310.08s] They can find intimacy and trust\n[1311.96s] challenging,\n[1313.24s] often defaulting to extreme\n[1315.36s] self-reliance and detachment.\n[1318.44s] While studies report these broad\n[1320.12s] patterns, it''s important to remember the\n[1322.16s] huge variation that exists in the real\n[1324.76s] world.\n[1326.32s] Each of us is born with our own unique\n[1328.44s] nervous system, our own particular\n[1330.4s] sensitivities and strengths.\n[1333.12s] With children of authoritarian parents,\n[1335.32s] some will instinctively tend towards\n[1337.2s] submission, some will bear towards\n[1339.48s] rebellion,\n[1340.76s] some will begin to quietly question,\n[1343.16s] developing their independent thinking in\n[1345.16s] private and biding their time until they\n[1347.6s] break away.\n[1349.68s] There''s a distribution of outcomes, not\n[1352.32s] one fixed template that every child\n[1354.44s] falls into.\n[1356.32s] Aside from personal temperament, outside\n[1358.84s] influences also play a huge part in\n[1361.44s] determining how deeply we''re affected by\n[1363.72s] negative parenting.\n[1365.72s] Finding supportive relationships in the\n[1367.84s] wider family and community can help to\n[1370.36s] reduce the impact. It''s about finding\n[1372.76s] better reference points.\n[1375.48s] One relative, a sibling, an uncle, a\n[1378.76s] grandparent whose grounded presence\n[1381.16s] counteracts the distortion in the family\n[1383.32s] can change everything,\n[1385.28s] as can one inspiring teacher or coach\n[1388.12s] who taps into the child''s unexplored\n[1390.04s] potential.\n[1392.12s] In our teenage years, the influence of\n[1394.36s] our peers is heightened, and feedback\n[1396.8s] from our contemporaries can help to undo\n[1399.04s] early damage, softening the rigidity and\n[1401.72s] hyper-vigilance of the over-controlled\n[1403.88s] child,\n[1405.04s] or checking the entitlement of a child\n[1407.28s] who''s been indulged.\n[1409.52s] Therapy can, of course, help in many\n[1411.96s] cases when children have both the access\n[1414.56s] and the motivation to make use of it, or\n[1417.24s] in later life when they''re ready to\n[1419.2s] unpick the defective patterns.\n[1422.76s] It''s easy to become focused on\n[1424.24s] psychological solutions, but games,\n[1426.88s] sports, and artistic activities can all\n[1429.92s] develop skills, motivation, and\n[1431.84s] confidence, especially where they\n[1433.76s] directly combat the specific\n[1435.56s] deficiencies of the parents.\n[1438.0s] If children of authoritarian parents can\n[1440.44s] find environments where creativity is\n[1442.36s] encouraged without judgment, it can cut\n[1444.88s] across the shaming messages they''ve\n[1446.64s] absorbed about personal expression.\n[1449.56s] Sports can teach children of indulgent\n[1451.68s] parents that rewards have to be earned,\n[1454.16s] that mistakes have consequences, and\n[1456.56s] that rules apply equally to everyone,\n[1459.2s] with referees and coaches providing\n[1461.6s] non-negotiable boundaries.\n[1465.28s] This series was prompted by someone I''ll\n[1467.36s] call Jay,\n[1468.8s] a prospective mother who was raised in a\n[1471.24s] deeply authoritarian religious\n[1473.16s] household.\n[1474.88s] She wanted to be sure she could break\n[1476.68s] the destructive patterns of her\n[1478.16s] upbringing, but also avoid the pitfalls\n[1480.84s] of overcompensating.\n[1483.28s] She said becoming a parent seems like\n[1485.24s] shedding a skin.\n[1487.04s] You have to let go of what you were\n[1488.88s] before and expand to become what your\n[1492.72s] child needs.\n[1497.92s] If you''ve become entrenched in an\n[1499.68s] authoritarian or indulgent mindset, it\n[1502.44s] can take an effort to find your way\n[1504.08s] back.\n[1505.32s] It can feel jarring and unnatural to\n[1507.8s] start expressing affection, empathy, and\n[1510.0s] encouragement if you''re used to being a\n[1511.8s] stern taskmaster\n[1513.72s] or to start exercising firm, consistent\n[1516.16s] boundaries, and discipline when you''ve\n[1517.92s] been invested in appeasing and avoiding\n[1520.24s] difficult emotions.\n[1522.2s] But, as parents, [music]\n[1523.56s] we expect our children to learn all\n[1525.28s] kinds of things that feel far from\n[1527.44s] natural to them.\n[1529.32s] Showing our children we can change may\n[1531.68s] be one of the greatest services we can\n[1533.84s] do for them.\n[1547.782s] >> [music]\n[1556.297s] [music]\n[1564.812s] [music]"}'
