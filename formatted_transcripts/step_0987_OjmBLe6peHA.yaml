transcript: You're going to die of old age, >> which is fine. >> That's not good. You want to die? You don't have to. It's just a disease. We can cure it. >> So maybe Brian Johnson's right when he says, "Don't die. >> Don't die ever." >> But you know, he's saying like, "Don't die before we get to the technology." >> Right? Longevity, escape, velocity. You want to live long enough to live forever. It's one breakthrough away. [Music] It's London Tech Week. We're live with guests from over 130 countries around the world. >> We all intuitively know the AI is happening fast. So our ability to predict the future is becoming very very very hard. We just can't see anymore. The one thing I do know is I don't want to die. I think the world is beginning to digest AI and this is a big moment bigger than we can imagine. I think we could cure most diseases within the next decade if AI drug design works. And then they could be personalized medicines where it minimizes the side effects on the individual cuz it's mapped to the person's individual illness and metabolism and so on. We talk about the progress of our smartphones and AI models. But we don't talk a lot about human improvement. There's this open question of like what does it mean to evolve as a human? And not only how is AI positive but how it makes us humans better. I think somewhere in our genome we have this rejuvenation loop and it's set to basically give us at most 120. I think we can decide it to something bigger. >> AI is probably going to accelerate that. >> That's one very important application area. Yes, absolutely. What if everybody has an assistant and the assistant is 140 IQ, is infinitely patient, knows everything about you, and is pulling for you in every possible way. Anytime you find anything confusing or want to learn anything or have trouble understanding something or want to figure out what to do in a situation, it will help you do it. >> When you acquire all this data about your body, no human can parse through the data and say, "I know what's going on." And so AI plays this really essential role. It powers everything we've built for the past few years. I hired a team of 30 medical professionals and we said we really don't want to listen to health gurus. We want to look at the scientific evidence. And so we crawled through all the evidence and we said what has the very best evidence for the kinds of foods you eat, the exercise you do, sleep protocols, and then we built this protocol based upon all the evidence and then we measured every single thing we could about my body. As tuned as I am in everyday schedules of getting fantastic sleep and eating well and exercising, you just feel phenomenal. And a deviation from that is pretty devastating because otherwise it really does leave a shell of myself. [Music] >> Hey. >> Hey. I was going to try and take a nap, but that's not going to happen, is it? >> Um, radio thing is at 1, so you'll have 15 minutes when we get to the hotel. So, yeah, you're not going to have time. >> I talk a lot about the virtues of good sleep, and I also talk about the costs of bad sleep, but to experience them is very different. hummus, avocado with carrots and a Coca-Cola. [Music] Over the past couple days, we have had such a demanding schedule. We have all these really important events. I'm pushing myself to my very limits when I do these things, and I'm feeling tired. [Music] Brian, hello. It's Tom Schwarber here. >> Hey, Tom. Nice to see you. >> And you, sir. Thank you very much indeed for doing this. Really appreciate your time. >> Of course. It definitely wears you down, but I think in those moments I think about those that are currently in the same position I was before. >> Have you ever felt burned out at work? Well, it turns out the World Health Organization will now officially recognize that as a legitimate medical condition. what you're really talking about is chronic stress. It increases the risk of heart disease, of high blood pressure, of stroke, of cancer, and chronic stress is a killer. >> I had subscribed to this idea that you work so hard in life that you walk yourself up into the cliff of death. And so when I'm going to people, I'm trying to say to them, you're playing a game you didn't create. This game is killing you. So don't play that game. Be aware there's a new game here, and here's how you play it. Hands up. Hands up. Hands up. Stretch out. All right, everybody warmed up. Why don't we go for a walk for 5 minutes and let's hang out together? Yeah. How about we go this way? When you do a protocol, you want to start at some moderate level and then work your way up. And the key for doing that is just take your first step. And what people don't realize is you string together those moments and you actually realize you don't want to die. [Music] [Music] [Music] Knowing that I needed to be on my aame, I went to bed early and I did my routine. I read a book. The next morning I woke up and then I worked out. My heart rate variability is climbing up about 7% every day. So I had two days in a row I didn't work out and my body was squawking. So I finally got myself back into a good place. I now have this event that I'm going to 100 to 150 people in the London tech community. So I really needed to be on my agame to make the best possible impression. [Music] When I arrived, the entire house was so jam-packed, you couldn't even walk through. My first thought was, "This is very dangerous because everyone here is suffering from hearing loss." So, we bought a bunch of earplugs. And then the second thought was, everyone here needs to immediately have earplugs in. >> Put these in. Too loud. You're suffering hearing loss. Oh, thank you. That's pretty sweet. >> Hey, how you doing? >> Good. Thanks very Thank you very much. >> Hey guys. >> Put these in. >> Oh, thank you. >> You're welcome. >> Nice to meet you. >> I think they were confused. I think they were like, "Okay, thank you." I guess, you know, I don't think people really understood what was happening. >> You're suffering hearing loss. >> Oh, okay. Thanks. >> So, when I came in tonight, I handed many of you earplugs because when the decibel level is over 80, you're losing your hearing. I know this because I've lost hearing in my ear. You cannot get hearing back in this moment. You lose your ability to experience the world. That is a form of die and you can measure it. So in doing that, I've tried to become humanity's first don't die prototype. Okay? And that means replace my body with planet Earth and do the exact same scientific experiment. If you measure Earth with billions of data points, you say where are we doing well for the biosphere to support human activity and where are we doing poorly and you implement interventions again and again so the world has good biomarkers [Music] AI plays this really central role. I mean it can process billions or trillions of data points and help us start doing the hard work of how do you stop the death process on planet Earth. And so we need to take care of oursel, we need to take care of each other and we need to take care of our planet, our home. The observation of intelligence in human hands is that intelligence quite literally makes everything better. You've got glasses, you've got a wristwatch, a personal computer. Viewed through that lens, AI is the latest in a long series of basically augmentation methods. [Music] >> I wonder if life and everything would be less special if I lived for 10,000 years. >> Reverse the question. Let's say we lived forever and you asked me, "Do you want to die in 40 years?" Why would I say yes? >> That's your first time ever riding a bike? >> There is so much more you can do right now. You can only make plans to do something for a decade or two. Imagine possibilities open to you with infinite time in the infinite universe. >> Gosh. [Music]
