finessing the information from a suspect. >> Yeah. So the polygraph is obviously just the instrument right the physiology the the blood pressure sweat gland activity the breathing pattern and rate. So that's just the collecting of the physiology. A true polygraph is not what you see on Jerry Springer. It's not what you see on TV. A true polygraph shouldn't be used in court. It should be used in the right time, the right place on the right type of cases. And when done with very good examiners that understand the value of the interview, it's very very effective both in our pre-employment when we have current employees uh that make misgivings and then individuals in specific issue cases. So, but it's it's all dependent upon the person operating the instrument. So, you need to have really tight guard rails. And I'm a I'm not an acolyte to polygraph. I understand its limitations, but I've seen the things that walk out of that room. I've seen applicants admit to shooting, stabbing, robbing, raping, beastiality. The craziest things you would believe applicants admitting to that. And our applicant pool is very is very good with the Secret Service. So, we're getting that is that I would typically see someone's second life, their first life, what they put on Instagram, Facebook, whatever, right? I wouldn't see any of that. I would digest that so I could become once again I could potentially find organic ways to connect. But I would see that second life, the one they've never told anybody before, the one that once again the priest would typically see. And that's the the true value of polygraph is it's that confessional that gets me in the trenches and gives me the opportunity to hopefully elicit information. >> Do you feel like every guilty person is is hungry to confess? >> Not I would say most I would say it's weighing on a lot of people's hearts. Uh most people are doing that balance between, you know, it's it's almost like the judicial scales. You know, they're they have that weight of this, especially when it comes to child sexual abuse. They have that weight of what they're doing. They know what they're doing is wrong. But most people want someone to not necessarily agree with what they're doing because they know what they're doing is wrong. They want people to understand how they got there. So perception versus perspective. I think that that I learned that many many years ago is a wise person told me they said look you have a perception of why people do things. You have a perception of whatever conversation with your wife your kids. You have to understand their perspective and it's that whole kind of empathy thing. Once you understand someone's perspective then you can understand once again why that asteroid got bumped the way it did. So for me, perception versus perspective. I always really really tried to get in someone's shoes and understand how did they become in front of me. What was altered? Because Mark, I view crime as a mathematical equation. My dad was a math teacher and maybe I got this from him, but he was very linear in how he thought. My mom was an English teacher and a butician before that. So she was very conversational. It not linear at all. So I think I got a little bit of both of that. But I think all crime is based upon need, ability, opportunity plus justification. And then stress is poured on top of all of those. And that's the that's the numerator. The denominator is social bonds. What we have in our parental situation, what we have with a wife, a significant other, um the chances and consequences of getting caught. That's what mediates the top half of that equation. So I know you've done a lot of interviews on Skid Row. When you apply that to a lot of the people you talk to, what's the need? Well, it's not necessarily that they need drugs. They maybe need to escape from their situation. The ability to use drugs is not real hard. The opportunity on Skid Row, it's all over the place, right? What's the justification? Uh, just this one time, you know, we're just going to start with this. And then you throw the stressors. Can't imagine not having a house over your head. What those stressors must be? What social bonds do they have? When you look at the underside of that equation, they're not they're non-existent. And what are the consequences of getting caught? Not much. Okay? Especially in today's society. So I try to reverse engineer that when I'm talking to people. And by keeping it a mathematical equation, it's easier for me to flush it at the end of the day because I feel like I'm doing the interview, but I now it doesn't stay with me as long because it's just a mathematical equation. I find out their need, their ability, their opportunity, their justification, and then once again, I turn that backwards. Do you do you think we all want to be a good person, to be liked, to be loved, or are there some of us that are just pure evil? And >> so thousands of interviews, I would say I've met about 10 evil people. Only about 10. Most people are good people or okay people that made a series of poor decisions. But I remember one individual in particular, and he admitted we we were talking to him about a homicide. We were talking to him about a sexual assault and he made multiple admissions. But one of his admissions, just the way he said to me was when you're like, "Wow." He had this baby face. He did not look evil. But he said, "Brad, one day, I think he was 18. He was sitting on his stoop and this was in a suburban area." And he was sitting on the stoop of his house, very affluent area, and he saw a jogger go by. middle of the day, 3:30, whatever the case was. Female jogger, you know, goes by and he says in that moment, he knew, I'm gonna track her down. I'm going to, you know, uh, strike her about the head, try to knock her out, and I'm going to rape her. And that's exactly what he did. And he formed that calculus in the moment. That's evil. Evil to me is you wake up at 8:00 in the morning and you're going to bring ill will to other people. I can. And the hard part is so many people that are in law enforcement have a hard time coming to grips with that because they are the superhero. I grew up wanting to be Ponch. I want to be John Baker from Chips. Okay. I wanted to be I watched Scooby-Doo. I watched the A Team. And in four seasons of the A Team, only one person ever died, and that was on the last episode, right? That was my view of law enforcement. There was good and there was evil. You watch Red Dawn. There's the United States. There's the Russians. Okay, that's how I viewed things. But things are a little bit more gray and and protection helped me see that a little bit. And Mark, this is maybe what gives me a little bit of hope is I remember being in Japan, president was over there and it's not like uh what you see in the movies where you're running next to the limo and uh jumping on Air Force One. That was not my protection experience. Uh it was a lot more standing next to the dumpster uh standing in the stairwell for three or four days. Okay. And I was in a stairwell for 3 days with this Japanese Secret Service agent and uh we're talking and I'm using Google Translate to have this amazing conversation and he's from Nagasaki. To think 70 years prior to that we had dropped an A- bomb on his city and here I am having this amazing conversation. His wife is making pastries for us and at the end I take this little goofy $2 USA pen. I had no ulterior motives. I just professional courtesy. I gave it to him, presented it to him, and he popped open his French cuffs and he took off his grandfather's cufflings and gave them to me. Respect. I mean, we we talk about rapport. We talk about this. If you can respect any human being, and I know you do that, you treat people with respect and you get that respect back. And that gives me a little bit of hope that in one generation of, you know, one person's lifespan, we went from wanting to kill an entire populace and vice versa to now I can break bread with this person and have those great conversations. So >> yeah, it's interesting. Tell me about body language. Body language is a big part of what you do, right? >> It is. Body language is great. It's terrible for detecting deception, Mark. It really is. But it's great for presence. So, and this is not just to try to elicit information. It's not about manipulation, but if you have poor body language, if you don't ventily front, okay, you talk about soft white underbelly, right? That I want to show my soft white underbelly to other people because it shows I'm not bladed, okay? I'm not guarded. I want to show you the sensitive parts of my body. I want to lead with an eyebrow flash. I want to maybe tilt my head every once in a while to expose my karate. When I shake hands with somebody, I want it to be dry. I will put anaperspin on my hand so I always have a dry handshake because if you have a wet clammy handshake what does that denote you're nervous what's going on here and since the beginning of time so 200,000 years ago when other tribal groups would meet we in an instant we would make a decision are you friend or foe that happens in less than a second then I get into the second impression where I focus on competence so body language is showing one I'm not a threat to you I'm not gonna hurt you and then I can go about trying to put a halo on myself because what we found is if you get a horns put upon yourself, cortisol is released and that stress hormone sits there for a long period of time, people are very guarded. They're less likely to provide you information. And whereas if I can get a halo on you and I can get oxytocin and I can get you talking 90% of the time and I'm listening 10% of the time, you start bathing in that dopamine and that serotonin and that's very short-lived. But now if I do make a misstep, it's more likely to be coded as I have no ulterior motives associated with that. So body language is extremely important at seeing stress and non-stress, comfort, non-comfort, and making that great first impression. It is terrible at detecting deception because people that lie, uh, they're very good at using soft eyes and eye contact. And you think, "Oh, Mark's got great eye contact. That's great. I think he's very genuine. Ted Bundy had great eye tactic, too. Right. Serial killers are very, very adept at body language. U you know, uh Manson read How to Win Friends and Influence People by Dale Carnegie in prison. He did a pretty good job of that. All right. So, body language is amazing for setting the stage. And I would just leave it at that. >> That's interesting. >> Tell me about protecting US presidents. >> So, >> as a Secret Service. >> Yeah. So when I first started out, I started out my protection experience as a bang. I uh this was about almost 30 years ago and definitely 30 lbs ago. I was a much better runner. Okay. So W. Bush was a great runner and uh we had one of our individuals on that detail during the campaign of 2000, the old hanging Chad uh campaign. Uh this guy got hurt and they needed a replacement and so I was a lastminute replacement. So I went on about three or four rotations on the latter stages of that campaign and it was blew me away as a kid. Once again, 25 years old, jumping on the 727 campaign plane, hitting three cities a day, you know, Leno one day, back to Letterman, the other coast, running with the protectee. Like that's what a young kid visualized as protection. I got to go to about 35 uh countries and then my permanent detail was HW Bush when he was a former president. So I made a work life balance decision on I like summer in Maine. My wife likes summer in Maine. We got to live in Houston and we got to work around an amazing president, former president uh that I think is one of the last true uh politicians from the standpoint of he's he he heard both sides and we always stay very apolitical because u what I found is you know we are so stovepiped and we are so red and blue and black and white nowadays but what I found is that can change very quickly in the situations you're in. I was uh I would say I was more on the Democratic side in 2000, but I heard about a 100 days of stump speeches from W and I heard >> [snorts] >> uh the supporters and the finance earers and the adoring fans, 15,000 here, 15,000 there. It changes your perspective. When you get in those echo chambers, you change very very quickly. And today, and I know you've talked about this sometimes in the opening of your videos, you talk about how news is given to people and how it's very, you know, bifurcated. It's very in one lane, right? You don't [clears throat] know what you're really getting. So, >> they're selling you something. >> They're selling you something. And so, I try to use apps that as best as possible just give me the news so I can shade it however I need to be because echo chambers are are very difficult. But I I bring all that to say that HW, you know, a man that got a waiver to join the Navy in World War II at 17, got shot down at 18, held on to the plane. and it was was burning and cried when he would talk about it because he's like if I only would have held it a second later maybe my co-pilot and my navigator could have got out or the gunner and the navigator could have got out and he jumped out and this wasn't an ejection seat you had to climb out on the wing and fall out and he fell out a few hundred meters away from Chichima which was uh Japanese held at the time and on an incoming tide he would have probably been captured and killed but the USS Finnbach in the world's biggest ocean happened to be a few hundred meters away and put up its periscope when it heard something hit the water and it saw George W. Bush bobbing up and down in the water. You can imagine how history would have changed if that sonar operator wouldn't have heard that splash. Uh so, you know, he goes on, gets into Congress, vice president, first emissary to China, uh CIA director, and he made a lot of political decisions that weren't about politics in that the wall came down and he was told by his adviserss, go to the Berlin Wall and have a big rally like Reagan did. You know, tear down this wall. and he said, "I don't want to do it because it puts Gorbachev in a terrible situation." The whole no new taxes pledge. He did that and then went against it because he got a better deal, he thought, for Americans. So, not to excuse everything, but he worked across the aisle. I we saw him with Clinton all the time, uh, you know, doing outreach. So, I think that's what we kind of miss now in politics is everything now with Jerry Mandarin and so on and so forth is just so one-sided uh both ways. So, very popular. As a Secret Service agent, you probably learn things about how difficult it is to actually be a president. >> Unbelievable. >> Because we, you know, people love to just hate these guys and they're like, you know, if if you're Republican, you're going to hate the Democrat or vice versa. And it's just like there there's no effort being put into understanding how incredibly difficult that job is. And you look at how these presidents age when they've been in office for >> Yeah. >> for even four years, but definitely after eight years, they they look like different people. >> Yeah. the keyboard warriors that are out there on Reddit and other things throwing all the hate to the commanders and chief throughout the years, they don't realize the decisions once again they have to make in the situation room. And that's obviously one side, but they still have a personal life that they have to manage. >> Many of them have young kids that are in college. >> Incredible. >> I mean, W had to deal with both of his daughters at University of Texas going out doing what kids in college do. Um, you know, and then they have their own personal life. They put their shoes on and take their shoes off and have pain points just like everybody else. And yet they're never off the job because somebody might always come into that room and say, "Sir, that we have a situation." Uh, so I I loved protection. I loved seeing every year, every September, I missed 17 anniversaries because my wife and I I've been married for 28 years. We made the poor decision to get married in September and every September is the United Nations General Assembly. And as a result of that, every September I was pretty much gone. So flowers.com definitely uh had a nice account uh with me. But when we would do that, I would get to see Israel. I would get to see Iran. I would get to see all these countries in New York and be on their details and see their protect protectes. I would get to see their secret service. And it it really shows you how big of a pond we are in. I grew up in a small pond. Union, Missouri is a tiny town. I had no worldview whatsoever. The Secret Service is what brought me to that is it made me realize how proud I am to be an American because when you go to another country, not to single anybody out, but when you go to other countries and you see how people live compared to how they live here in America, it it just blows you away how how genuinely proud you need to be um here in America of of what we have. Are >> are you optimistic about the future for our country or concerned or where where do you stand after seeing >> Man, I I'd like to say I'm eternal optimist. I'm always a half full kind of guy, but until something changes, you know, from the term limits, you know, when you have a $40 trillion debt, uh I don't know what the percentage is now. I think our GDP is is is uh less than our debt now. Uh the servicing of our debt, that's a big problem and it it's a national security problem. So, you got to get rid of Jerry Mandering in my humble opinion. You got to you got to have term limits because when people don't view being a politician as a calling or or when they view it as a profession, that's problematic. You know, my my father was huge into public service and he would always serve uh in all the the service things. My mom would always serve and my all my sisters I had three sisters. All my sisters were teachers and they would serve and that's how they viewed life is that I don't think it's maybe about serving anymore is it's about the status of being somebody. It's about the tweets, it's about the likes, it's about enriching yourself potentially. So that that's the problem I think with modern politics right now. >> Has your career made you trust people more or less? >> It definitely a lot less. when I was going through uh kind of my health issues is that I viewed everybody with horns. New neighbor would move in, that guy's a pedophile. All right? New uh co-orker would come up to me looking for advice, what's his angle? It just caused me to look at the worst of people because I was only dealing with the worst of people. So, stepping away and for eight years getting to teach interview interrogation at the National Center of Credibility Assessment, I I realized a couple things. is that teach a man to fish was kind of the motto. You know, he'll never go hungry. So, I like to teach other people to go out there whereas I I wasn't in the room as much. But I also realized that I thought I knew everything. I had an ego definitely and you could probably ask anybody that was around me about 15 years in the job that I had an ego. When I went down there and I saw the CIA, NSA, FBI, DEA, and all their cadre of subject matter experts, I realized, wow, there are levels to this. Just like in jiu-jitsu, I love Brazilian jiu-jitsu. The hardest belt to get is a white belt. It's the walking in the door. That's the white belt. That's the person that realizes I need to learn something. And I became a white belt at 15 years in and I built my way back up to to hopefully I'm at a much better place is that uh you need to see those bigger waters uh and you need to get out of those small ponds every once in a while to to understand how big a world this is. >> Tell me about how you grew up. You your family and all that. Wait, do you want to get into this kind of way? >> Yeah. So, uh, grew up, uh, Union, Missouri is a very, very small town about an hour southwest of St. Louis, kind of on the edge of the Ozarks, the town where everybody knows your name, good and bad. Everybody knows your business, good and bad. Uh, dad taught at the local, uh, college there. It was a junior college. My mom was a butician and she also, uh, was an English tutor and a legal secretary. So, town of about 5,000 people. Um, you know, we were excited when we got the Super Walmart. That was the big thing that happened in the town. You know, when you get the Super Walmart. >> Uh, so that was the kind of environment I I played soccer through college. I thought I was going to make something of myself there. You talk about small ponds when you don't know any better. And my junior and senior year of high school, I went to a national showcase and I realized real quick, well, that's not going to go very far. Uh, once again, it's it's important to test yourself. So, uh, continued to play soccer, but I think meeting my best friend at 15 that kept me out of trouble, Doug, and him being deaf, really, really taught me about communication and helped shape me. Uh, grew up working on a horse farm, shoveling horseshit, and that taught me a lot about bailing hay, about animals don't really care about your schedule, and they also care about your confidence. You know, when you get on a horse to ride it, it senses really quickly your body language if you're afraid or you're not. And I think when I talk to people in the worst day of their life, they they have that same sense as a horse does when you first get on it, like does this person know what they're doing? So trying to have that confidence, that's something that that definitely showed me. But uh I was an introverted kid. I really was. Is that uh I did a lot of uh things I think to try to improve upon that. But I I watched people as a goalkeeper in soccer. I watched people uh as improvisational duet acting. I watched people and then I had to act. And I think those things helped me in my communication journey. Uh I actually ended up going to the local community college. So I stayed in that small pond, but I needed that. I wasn't ready to go to the big university. And it allowed me to do very well grade-wise and sportsswise. And I just remember and how it kind of led to the Secret Service. I started taking criminology classes there. And I was deciding between that and psychology. and I put in for a big scholarship at a four-year institution and I thought I was going to get it and I didn't which was frustrating but the individual that was sponsoring it showed me the evaluations and one of the evaluators said you know I had put down what I wanted to do for public service. It was a public service scholarship and I put down FBI or secret service and this evaluator wrote why would we give a scholarship to somebody that wants to be a glorified police officer or a glorified security guard? And it just struck me as I'm going to show you. I'm going to show you. And it's something that I've obviously remember for 30 years now. Just what I can just I remember the handwriting of how he wrote it and just the I'm thinking of how flippant this person and how arrogant this person was to put that down. Um so that was something that definitely stuck with me. And then I got to do a Secret Service internship when I was at my four-year institution. And I got to see the men and women there. I got to see how proud they were. I got to see how they got to travel. I got to see the dual mission. Secret Service was founded in 1865. It was the last thing that Abraham Lincoln signed into law. Okay. Days before he went to the Ford Theater. He signed into law an investigative agency, started to stop counterfeiting because about onethird of the US currency supply was counterfeit because the Confederate States of America were using as a weapon of war. And he got together with Alan Pinkerton says, "We need people worthy of trust and confidence." And that's the motto that's been >> Let me let me back that up. A third of the currency. So you can imagine one out of every three bills is counterfeit. What faith do people have in currency? >> Yeah. So it wasn't until 1901 until we lost our third protectee McKinley that the Secret Service took over protection. >> But we still worked civil rights. We still worked counter intelligence. It was the FBI before the FBI. It nine of our agents went over to start the FBI. Uh were that first cadre of agents that went over to the Bureau of Investigation. And then obviously there was Mission Creep. Uh obviously what happened in 1963 with Kennedy caused a huge increase in the Secret Service. Then we started you saw what happened with RFK. So then we started taking care of candidates. Then we started taking care of spouses. Then we started taking care of families. Then we started taking care of the extended. So the Secret Service has saw a huge mission creep. And obviously with what you've seen at Butler, there needs to be even more uh personnel change because the agents, the men and women are are truly overworked. When you look at the military, the military can train 95% of the time for 5% of action. Law enforcement, because of funding and the lack of personnel, we work about 95% of the time and train 5% of the time. And that's problematic. And that combined with the traumatic events that law enforcement see, the average person sees three or four traumatic events in their life. Law enforcement see hundreds. And we don't have time to decompress. And it's not it's an egotistical thing to want to decompress. So those are the the challenges that we face. Um but they're staffing up their numbers now. They're trying to I think the problem that got in involved in Butler was obviously lack of preparation and assumptions. You make certain assumptions about things as far as I believe this is going to be happen. I believe this is going to be handled. And that's what always comes back to haunt you. You can't have assumptions in life. Is there a lot of cooperation between the Secret Service and the CIA and the FBI and local law enforcement? >> Oh, yeah. And all that? >> Yeah, we could definitely not do our protective or our investigative mission without local law enforcement. Just couldn't do it. The problem is sometimes what you saw at Butler is we were relying too much on that. Okay, we're going to have this three or fourman team at the AGR building secure this huge site and we can't ask them to do that. We needed to have not a not a tactical team there. We needed to have police officers and agents restricting traffic to an elevated position. We learned a lesson and we, you know, unfortunately Cory Campore died, another individual was wounded. Um, so it was a dark day. I would just retired and it was still the worst day of my career. And I I can say that any agent would feel that way is because you don't you that is just such a dark day. I I remember Tim McCarthy, he was the agent in charge in Chicago just after I got to Chicago, but he was the individual that took the the bullet for Reagan. And it's that what everybody you never expect that happen to happen. But he made himself bigger to take that 22 caliber round from Hinckley. Um is that the response of our agents and the counter uh the the technician, the uniform division technician, the response that they had was amazing, instantaneous. But if we have to respond, we've already lost. It's preparation is everything. We want to control everything. You ask any secret service, we are control freaks. We're party planners. That's what we're doing. We're planning a huge party and we're hoping we control all entrance into that party. And it's just nowadays with 20 years ago when I was doing protective intelligence, you heard that one story I talked about. There was a lot more friction involved in people making threats. Meaning if you and I were at a bar and we had different political decisions. You'd say something, I'd say something, maybe it would get a little elevated, but somebody else at the bar would be like, "Mark, you're kind of talking crazy here." What's the problem nowadays? We just go on a forum. We don't get that friction. and we go to a different forum that has more like-minded people. Before you know it, we go to an encrypted platform that has more like-minded people and there's less friction and these plans and these thought processes develop a lot quicker than they used to. And that's what makes law enforcement. It's much more difficult to catch these threats. As you see uh in the Charlie Kirk shooting and things, you see these people uh the trajectory of them going from an idea to action, it happens a lot quicker, unfortunately. What what's the biggest misconception about that people have about the Secret Service? >> Oh jeez. Once again, Ray-B bands and standing next to the limo uh I think is is the Hollywood and it's probably any agency could probably tell you that Mark is you know what's the misconception but it's that is it's 99% paperwork 99% preparation and the 1% is very cool. I mean, uh, some of the things that I've got to see, the three Olympics that I've got to go to, the countries that I've got to go to, the people that I've got to meet make the 99% worthwhile. So, all the surveillances, all the advanced work, all the trips overseas, all the times you get uh sick from eating food in a foreign country, whatever the case may be, it it it it's it's tough. But the 1% made it worthwhile. And I had a blessed career. anytime I wanted to go do something with my protective career or with polygraph or with a duty location, I just happened to hit the timing right. That's not the case with everybody. I was, you know, I wanted accomplishment so much, Mark, and then 2015 came around and I had a what I would think would be a good year, and it's a good year because of bad things that happened in that I would do polygraphs on I had three or four homicide confessions that year. I had lots of child abuse allegations, which they're great. I looked at it as wins and somebody put me in for agent of the year and I won special agent of the year for the Secret Service and I thought I've arrived. But it was that hollow feeling and it meant really nothing. I mean I get some emails. I got some calls from people but looking back it meant nothing because I just happened to be the person doing those things. I wasn't doing anything special. I was just listening to people. [snorts] Whereas there were other people sitting out in the rain. There was other people traveling. There was other people doing these hard things from a protection standpoint that weren't getting recognized. You know, I remember that I this day I came to get this award, you know, I got my little son there in a suit and my my wife of 28 years is there and the director in this big event and you get the you know, and it felt like Good Fellas with Donnie Bras when he gets the gold the gold watch and he's like, man, I just gave up all this and all it gets a gold watch, right? is not to equate the two, but that's it felt really hollow because that was the 150th anniversary of the Secret Service and it was a terrible rainy nasty day and I knew there were people just down the street that were standing out in the rain, standing in the wire, getting no recognition whatsoever, making less money than me. Um, so yeah, that was something that was really hollow. And then I quit chasing accomplishments. And that was a big defining moment in my life is that it wasn't about the accomplishments. It was about doing the right thing and realizing I still had a lot to learn at that time frame. >> You you have a book. What what is the title of your book? >> Uh tell me everything. >> Give us an example of like one of the stories from your book if you can. Well, I kind of start off I think we discussed a little bit about first impressions, but we talk about how sometimes we very careful about how we put horns and halos on people. Is that first impressions are great for personal safety. Law enforcement, we use them when we walk up to a car and something doesn't feel right. People should use it when you're walking down an alley late at night and you hear something behind you. Outside of that, first impressions are very bad. Gut instinct is very bad uh because biases take over. So, the way I learned that painfully was a few years back, my partner and I, Ryan, were doing a search warrant on a case where somebody was downloading some inappropriate images, and we come into the kitchen. We got obviously got our guns drawn, and I see a pitbull and a Chihuahua. Now, there's obviously certain stereotypes out there about pitbulls, right? Uh that they can be dangerous, that they can bite, they're larger animals, and then there's a little yappy chihuahua there. So, I don't want to have to shoot a dog. I love animals and I I definitely love dogs. I'm a dog person. Uh but I unfortunately we didn't have animal control with us. We didn't have tasers with us. Um so as last resort, but my front sight focus is on the pitbull. And as a metaphor, but it happened in real life. The Chihuahua kind of creeps around, creeps around, creeps around, it jumps up and it grabs me by my testicles. And when I say grabs me by the testicles, it was viewing my testicles as a Nerf ball, okay? that it was trying to rip up. Um, my partner's laughing. I think the pit bull's laughing. I have to holster up. I have to secure the the Chihuahua, remove it. Thankful to Duth Trading Company and their fire hose pants for creating a product that allows me to talk in the octave uh that I'm talking to you right now. >> But it just goes to show you that sometimes looks can be very, very deceiving. Is that how the most dangerous shark in my opinion is not the great white? It gets all the It's Shark Week right now. It gets all the publicity, right? But a great white is big. It has big jaws. And sometimes people right off the coast here dress up as his favorite food source, right? And then paddle around in an uncoordinated fashion with something that has very, very poor eyesight. People are going to get hurt by it. But when you ask Jo Kustoau, "What's the most dangerous shark?" He says the oceanic white tip. Little six-foot shark. Very unassuming open water shark. But that's what killed hundreds of US sailors on the USS Indianapolis in 1945 because it heard explosions 50 miles away and decided boom, I'm going to go. And that's what that kind of metaphor sticks with me is I I want to be very careful about how I sign horns and halos because I got burnt. I was working a biker case in Illinois and coming in to do a polygraph. We had a missing female and she was related to two individuals in a motorcycle club. One percent one one person was a 1enter. And it goes back to that old adage in the 50s that people said rightfully or wrongly that 99% of bikers do the right thing. 1% give all the rest of motorcycle clubs the a bad name. And this other individual was a hangaround. So he didn't have a bike. He didn't have a bike. Wanted to be part of the gang. The 1enter was 6'4 about 230. If you were typ casting for the next Sons of Anarchy and said we want a villain, this would be the person. He just looked evil. The next person looked like Ward Clever. I'm dating myself, but you know, he looked like an accountant. 5'6, about 130 lbs, dripping wet. So, both of them are dating this female, and this female's phone, the last time it pings is pretty much by the Mississippi River. It's a bad sign. She's been missing for about 3 days. So, I come in to polygraph, and I decide, who am I going to polygraph first? Well, people have said the 1enter's probably killed people before. They have that. They have open investigations on him, but this hangaround, let's test him first because they're best friends. Maybe he heard something, saw something, maybe we can break him and turn that against the other guy. So, I test him and I ask him, "Did you participate in any way in the disappearance of this female?" And he fails because I put a halo on him and I have confirmation bias. I assume that he failed because he saw something, he was around, whatever the case may be, information after the fact. So for about two hours he keeps saying, "Brad, that's not it." I'm saying, "Let me protect you. Okay, let me help you. Brad, that's not it." Luckily, detective watching from outside the room, she's hearing this, and she keeps hearing, "That's not it." And luckily, she knocks on the door. She steps in. She says, "Brad, can I chat with him for a minute?" Absolutely. Because what I'm doing is not working. Lower the ego. She comes in and the greatest return on any investment that I've ever seen in interrogation, Mark. She says, "John, you keep saying that's not it. What is it?" I killed her, cut her up in six pieces, and threw her in the river. I'll take you and I'll show you right where it is. And it was just like that because horns and halos make you see people differently. And it's very, very hard to break that. So, I try not to form I try to make a great first impression, but I try not to form a good first impression upon someone else unless it's a life or death situation. >> Great talk. If uh if you could say there's one thing that you've learned in all of your work with sacred service and and you know polygraphs everything you've done what would it be? >> I would say we can't define people by the worst day in their life. You just you can't do that is everybody's got a book of life and many times it's shaped by those first 10 chapters and we need to start looking at people from their perspective. if you want to connect with them, if you want to help them, if you want to communicate with them better and in our communication, you have to find the right time, the right place in the right headsp space in order to effectively do that. So lower the ego, pick the right time, pick the right place, and look at things from other people's perspective, and you'll be a lot more effective in your communications. >> Excellent. Brad Beer, thank you so much. >> Thanks, Mark. >> What What's your book again? >> Tell Me Everything. >> Excellent. I'll leave a link in the description. >> Thank you. >> Thank you, Brad. I'm starting uh there's something we've been working on for a year, a year and a half now. Uh it's an app has really not much to do with Soft One Underbelly, but it has a lot to do with it because what it is, it's an app that will be it's an it's a way that people can share their stories and monetize. What I've learned after doing this for seven years is that everyone has a story. There's so many people that want to share their their their stories and these creators and storytellers need a platform to do it and I can only do so many here at Software Underbelly. So I started this app called List Live. List iPhone and Android platform built exclusively for adults. The moment you enter, the experience is designed to be simple, secure, and easy to navigate. Whether you're joining as a fan or building your presence as a creator, as a user, you can discover creators, watch live broadcasts, explore exclusive content, join communities, and interact directly, all without having to follow someone across several different platforms. For creators, List Live brings the essential tools together in one place. You can publish new content, create membership tiers, offer premium experiences, receive virtual gifts, use pay-per-view messaging, and manage your earnings and payouts directly through the app. The creator dashboard puts your live experience at the center. Hub live lets you connect and engage with your audience in real time, while picture-in picture allows you to remain visible as you move through the platform. For gamers, SharePlay makes it possible to share gameplay while staying connected with viewers, creating a more interactive live experience without requiring multiple apps or complicated setups. To help protect our community, we work with Trulio to provide identity and age verification technology along with tools to create a safer environment for both users and creators. Listen social platform. It's a creator economy platform built to help you grow your audience, strengthen your community, and turn your story into a sustainable business.
