transcript: |-
  Here's my latest exploration of space and drone, bringing together a range of gear. The video takes you on a macro journey through the blinking lights of my modular setup while the soundscape evolves.

  Patch breakdown:
  -Base drone running through filter and reverb cycles
  -Rings (Mutable Instruments) played by the @teenageengineering OP-XY, with step components adding randomization
  -Ghost (Endorphin.es) processing Rings' output
  -Mutable Instruments Beads and Qu-bit Electronix Cloud Terrarium adding wavetable textures
  -Elta Music Solar42F cycling through different notes for movement

  The visuals are all macro shots of the synth lights, creating an almost hypnotic effect that matches the evolving sound.
  What you don't see but that got me really excited is my new studio monitoring setup, scored from Audio Gold: some incredible BBC Chartwell monitors paired with a Quad 303 amp from the 70s. The combination of that punchy, warm vintage amp and these precise monitors is taking these ambient-making sessions to another level.

  For more sonic journeys, check out my Spotify: https://spotify.link/zegyM6IaJDb

