transcript: hi my name is nick barker and this talk is about the concept of difficulty in video games what makes games hard what makes them easy and how we can combine together different types of challenges to create rewarding experiences for players so just for some background video games are actually kind of getting on in age as an art form pong which is the first kind of recognizable video game was released almost 50 years ago in november 1972 and since then video game design has evolved immeasurably right we have these crazy realistic 3d graphics immersive novel like storylines huge online multiplayer and there's so many other things that have changed but an interesting thing that i've been thinking about recently is how on average i would say that games these days are quite a lot easier than the average game that you would have seen around the era of pong in the 70s or 80s difficulty used to be a major hallmark of games they were really hard by today's standards and i think it's interesting to look at why games have become easier over time by looking at why they were so hard in the first place right so games in the 70s and 80s were designed around a very different business model that we have today right instead of having home consoles or you know home computers that you would play games on most people would play video games in arcades right on arcade machines and the design of arcade machines and the financial model was very influential in how the actual games themselves were designed so pretty much all uh arcade machines had a similar kind of revenue generating mechanism right which is that you insert a coin or multiple coins to start the game you are given a limited number of some type of resource lives health something that can run out right and the game starts easy and the difficulty progressively increases as time goes on until it becomes almost impossible and when you lose all of that resource your lives or your health or whatever you see a game over screen and if you don't insert more coins in a short amount of time 10 or 20 seconds then you get a permanent game over and you have to start again from the beginning right so it's a very strong incentive to get people to put more coins in the machine and you can see from this perspective difficulty is very important right because if the game's too easy and if you can insert just like 25 cents and beat the whole game start to finish not only are you probably not going to play the machine again but you're going to be on it for a long time not putting in more coins where other people could be using the machine putting in more coins right so difficulty was actually a major financial decision in the design of these early games and you know there were some other incentives to play you know uh people found the challenge interesting on its own you had your score kind of like accruing over playing the game and in the end you had these high score boards on the machines that were publicly visible that you could save your name to and you know show your friends oh i've got the high score in this pac-man machine at the local arcade um but those i i think the side effects of the difficulty appeared as a result of the culture around the games not so much as the driving you know fundamental reason which was a financial decision right um and of course the strategy the this monetization model was so pervasive throughout the industry that we now have an entire genre of games that we refer to as arcade game arcade games even though they're not actually played on arcade machines anymore right and so it's fascinating how that financial driver actually created a genre that adhered to some specific characteristics and games were difficult by design on these arcade machines but the interesting thing is through creative innovation they were actually different in very uh they were actually difficult in in different ways right they they didn't all use the same mechanisms of difficulty and that to me is like a fascinating aspect of game design that i think about a lot so uh the second half of this talk is about different ways to create difficulty in video games and i'm going to go through ten of the kind of big categories that i see when i look at games they might be different to things that you think about but i'll go through each of those and how you can work those challenges into your games so the first and most obvious one is mechanical skill this type of challenge is the first thing that pops into people's heads when you tell them that a game is hard when you're like i played this game the other day and it was really difficult they they think of difficulty in terms of mechanical skills so this is the type of of difficulty that you get when you're playing sport or when you're playing a musical instrument right it's about speed and coordination and physical skill right and most first-person shooters very heavily rely on mechanical skill fighting games for example and the idea from you know an abstract perspective is you just gate the progression or the victory of a player based on their level of success at a difficult mechanical task and those mechanical tasks can be broken up into kind of three major categories which can of course be combined together in any any way that you want so the first one is timing right and that's when the player needs to perform a predictable action at a certain time right so we're talking about something that the player can see coming from far away you know they need to hit a baseball in a sport game and they can see the ball coming right they can predict that they need to hit an action but then the window to get it correct is small reaction speed conversely is where the player needs to perform an unpredictable action at a certain time so you might be waiting and watching you know a doorway expecting that an enemy will come through at some point but you don't know when it is right and so you have to react to an unpredictable scenario you can't see it coming and hit the timing and the third one is precision right and generally precision is just about controlling a value to a to a target that's quite small right so often precision relies on a continuous input method like a mouse or joystick that's opposed to a discrete input method like a button which is just on or off whereas a mouse you actually have to control the mouse get move the cursor to right onto an enemy that's very far away that's precision um so you probably already have an idea about how you would create these challenges you know some ideas about these things timing specifically you know remote bombs are like a classic game design mechanic and uh that we use um to create a bit of difficulty and flavor in games you know you watch your enemy walking towards bombs that you've planted and you have to wait until they walk right onto them to press the button and that's timing because you can see them coming right reaction speed blocking an attack in a fighting game is not only reaction speed because you don't know when the opponent's going to attack but often because there are different types of blocks as well you might have to wait until you can see just the edge of the attack that the the opponent's going to do and then you have to do a mid block or a low block specifically right you don't know what kind of action you have to do until you see the scenario and precision you know it's very very common you probably have designed precision into almost every kind of game that you've worked on before you have to aim the cursor on to something specific within you know a certain amount of time or something like that all shooting games rely on precision very heavily so the second type of difficulty is reduced error tolerance right and this is simply limiting the number of mistakes that a player can make before they get a major punishment like returning back to a checkpoint or getting game over right so platform games uh platformers relied 