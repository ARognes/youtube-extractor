 work and often people just like try and and and make as many attacks as they can but a turn-based fighting game where you can only make one punch or one kick and then the opponent gets one punch or one kick suddenly becomes a very different game it becomes very strategic right um you can create resource feedback loops this is a very important thing in strategy games where say you spend some money now in order to create a building that generates more money over time so in 10 turns from now you'll be much richer despite the fact that this turn you're you're poorer right that's a very important thing to create strategy and it's worth mentioning that if you don't want strategy in your game or you want strategy in your game the most important thing to think about is do actions have consequences how can we add more consequences to more actions if we want more strategy how can we take away consequences long-term consequences from actions if we don't want strategy the eighth one is logic so this is essentially creating difficulty by requiring players to understand rules understanding how rules apply to a scenario right and then potentially reverse engineering how to go from one state to another while abiding by the rules and so pretty much all puzzle puzzle games use logic right puzzles are pretty much about logic but you also have meta something that's referred to as meta in complex rpgs which is where people think very carefully about how to create a build for example that produces the most damage or the best survivability in the long term so in terms of creating these challenges you might not have thought about this before but most logical challenges in games are kind of about discovering the correct sequence of events right you have to do certain things in a certain order and the logic is about understanding how the rules will force you to do things in a certain order right if you want to design these types of puzzles like you know i i actually built a puzzle game just recently and i had a lot of questions from people saying oh some of these puzzles are so hard and complicated like it took me like 30 minutes to figure out what the solution was how do you possibly design these right because they assume that you have to be even better at solving the puzzles to design them and that's actually not true the the biggest trick that you can use is working backwards from the final state to the where the player actually starts right so uh if i take for example a dungeon in a zelda game a dungeon in an rpg that uses puzzle elements you start from the boss room you put a locked door on the bus boss room and you take the key and you move the key way over the other side of the dungeon right then over the other side of the dungeon you put a locked door on on that room and move that key somewhere else you just work backwards and then once you've decided on the key the correct path once you've actually figured out what the correct path is through the dungeon then you work forwards and you add all of this like uh all of these tricks right you say oh it looks like you're supposed to go here but go somewhere else instead um that's how that's a great trick for creating logic puzzles from scratch um and if you want to create puzzles one of the like the important fundamental thing is you need some set of rules right as i explained before in this in this uh scenario with a dungeon you need some kind of mechanism like keys unlocked doors right that's a rule that forces players to act in a certain way and it's the interactions of interlocking sets of rules that create really interesting logic puzzles number nine is something i refer to as learning curve and this is kind of a little bit more murky and abstract as a type of difficulty but it's essentially creating the expectation that the player is going to fail at first and an expectation that they're going to play the game many times they're going to practice right to improve their ability to play the game to improve their understanding of the game and this is very different from time investment right because time investment as a difficulty mechanic kind of gives you strength um and gives you new things by default right when you grind in an rpg it doesn't matter if you know by the time you get to level 60 in an rpg for example it doesn't matter if as a player you're just as bad as the at the game as you were at level one right because your character is much stronger the same abilities do significantly more damage that's not the case with learning curves so the learning curve difficulty is where you're relying completely on the player becoming more skillful at a task that they're trying and practicing over and over again it's like playing a musical instrument right so some examples for this is like roguelike games uh yes so hades for example you get um you get yes you you get stronger and you can on unlock abilities but the main thing that you're actually doing is becoming better at playing the game yourself city builders a similar kind of thing um you build a city you know you have a huge fire and everything burns down or you end up with a giant traffic jam and your economy collapses so you restart you learn and you play again you're you're on the learning curve so in terms of how we actually create these challenges as game designers first big thing is you can just not allow saving or checkpoints right so if the player makes a mistake or they lose they don't just get to keep going right they have to practice the part of the game that they lost at over and over until they can beat it reliably right whereas if you have a game that's based on like levels for example there might be a certain type of challenge that a player finds really hard and they play it a bunch of times but then after they beat it you beat the level and you don't have to play the level again right it's an important distinction with learning curve you need to force players to learn how to do the core mechanics of the game better and in general in these games you need to have very satisfying mechanics because it's much harder in a game with the learning curve to rely on the story to generate interest right because your interaction with the story is actually gated on how well you learn to do this repetitive task right you generally don't get to see more of the story until you actually get better at the game right so it's hard to rely on the story you need to have really iron-clad mechanics and the last one uh the last type of difficulty is just multiplayer if you add multiplayer to your game it's hard instantly right it just adds difficulty by default um there are two major categories of multiplayer games the first one is pvp which is player versus player um you're fighting against other players you're competing against other players it creates competitive difficulty and it's worth mentioning that's quite hard to control right if you have a small pool of very good players who are absolutely dominating the large pool of worse players you end up with a lot of people having a bad time right the second type is player versus environment pve and this is where you have players on a team who are coordinating to try and solve some kind of challenge provided by the game itself and this creates a different type of difficulty in coordination and team management right but it's easier to control as a game designer because you can just tweak how difficult the actual encounters are right so that's it in terms of how uh the different types of difficulty and i think it's worth mentioning that it's it's a really good idea to try and mix and match different types of difficulty right and how they're applied right don't always apply difficulty the same way apply different types of challenge you know a mixture of mechanics makes games a lot more interesting so just to finish up for this talk i'm going to go through some examples of games and i'm going to break down what i what it is that actually makes them a challenge so the first one's one of my favorite games one of a lot of people's favorite games the breath of the wild it's a modern zelda games open world rpg obviously it has mechanical difficulty because there's a combat system in the game that requires you know timing precision and reaction speed for different types of things using different weapons it has mechanical puzzles in the game that require you to like lift up objects and move them precisely or for example there's a really horrible puzzle in the game or a shrine in the game rather where you have to freeze a boulder and then hit it with a hammer and try and launch it a really long way into a hole and i just spent so long trying to do that one so that's that's mechanical difficulty right it's about precision timing reaction speed there's a lot of obscurity in the game you have to explore the map find secrets there's actually very little direction it's it's very much an open world game in that there's a small number of core objectives but mostly you're just exploring and and looking around and figuring things out on your own and there's a reasonable amount of logic in the game because the core kind of dungeon replacement mechanic in in this game is these things called shrines and inside them they're generally physics based uh puzzles so you have to figure out how to solve the puzzle in order to complete the shrine now if we look at a game that is not even arguably i'd say objectively much more difficult than breath of the wild counter-strike right the modern iteration is global offensive and you can see there's a lot more different types of difficulty which is interesting it employs a lot of different challenges and as a result i'd argue that counter-strike's a very hard game when you're playing it online against other people of course there's all the mechanical difficulty parts timing reaction speed moving shooting throwing grenades uh counter-strike has very low error tolerance right there's very high ratio of damage to health you can die very easily in one single shot from someone else right and so if you make a mistake and you stand out in the open by accident you know you can just lose the round and and it's quite punishing because you can have to wait up to two minutes before you can do anything again right memorization is very heavy element of counter strike knowing the maps really well the locations of all the spots that people hide the bomb sites the names of areas so you can communicate with your teammates there's a huge amount of strategy in counter-strike in terms of positioning and movement you know guessing what your opponents are going to do careful use of limited resources like grenades and spending money it's very important strategically in counter-strike and of course it's multiplayer which makes it a lot harder you have to coordinate with your teammates as well as competing against other people disco elysium is one of my favorite games recently you know an rpg with no combat at all it's really incredibly well written and the voice acting is fantastic and this creates difficulty in some different ways to normal games right the entire game is based around probability right every time you do any kind of um uh conversation action when you're talking to someone you know you have to do these weighted dice rolls that depend on your abilities and so um you know it's all based around probability and it has both trivial and non-trivial probability events you know checks that cannot be retried and so that's reduced error tolerance you know like uh the fact that you have uh these these checks that can actually you know cause you to to deviate completely down a different path in the game and close off a whole section right it's very low error tolerance in those cases uh leans very heavily on obscurity gives you almost no indication of what you're supposed to do it is a detective game after all right so there's hidden items and areas all over the game uh memorization is a very big element of disco elysium because you have to remember what characters have said so that you can negotiate and accuse them of things right and of course there's a very strategic element as well because there's a skill tree that you can allocate points into and that affects your probability of being able to do certain actions or even uh if your skill points are too low it can lock you out of doing certain things completely and it's always interesting to look at games like animal crossing because if you said to someone uh why is animal crossing hard right they would probably think oh i i don't think of animal crossing as a hard game right and it's because it doesn't use the traditional uh mechanical difficulty right like it's uh it doesn't rely on that type of thing to create a challenge in the game but there is significant challenge in animal crossing it has big time investment right it's got both grinding and time gating you need to catch fish or bugs or whatever over and over again you know mine minerals you do that by doing the same repetitive actions every day kind of thing and there's also time gating where you create you upgrade your house so you build a bridge and you have to wait a whole day you know to the next day items only refresh once a day in in real time right there's a huge amount of obscurity in the game very little direction on what you're supposed to do you have to discover the game for yourself and that's actually a challenge in some ways right um on top of that there's an enormous number of hidden items fish and insects and that type of thing and of course there's a heavy probability element in animal crossing as well because the game is full of randomization right random islands that you fly to random fish that appear in the water random items for sale and and so you have to put in a lot of time to get those favorable probability events oh and of course i've almost got the biggest probability event of all there's a there's a there's like a stock market mechanic built into the game where you buy these turnips and you hope that at some point during the week the price of turnips will go up so you can sell them for more and you won't lose your money right and the last game i just want to have a look at is a city builder game that i really like called city skylines right it's a kind of like sim city it's a city building simulation um it has a big time investment mechanic in that population growth actually takes quite a long time even at maximum game speed you have to wait a long time for your population to grow right has a very heavily heavy strategic element because everything you do has long-term consequences right you need to think and plan your cities very carefully because you can't just kind of retcon things later uh it has probability elements because things like fire do occur like randomly in the game um it actually has quite a solid system of logic quite a challenging logic system because there are lots of interlocking rules in the game the way that traffic works the way that people commute to and from work right and understanding those systems and thinking carefully about how to you know solve traffic problems is very important to doing well in this game and of course it has a big learning curve because your first few cities are just going to be horrible and the idea is just you get sick of your current city and you start again and it's the same game you know it's not like there's a new level with completely different buildings it's it's the same and you just learn to build more effectively your previous games don't carry through resources for example you can't grind in city skylines and then get to level 60 and start a new game with a million resources right it doesn't work like that it's all about you getting more skillful so just in closing i think it's interesting to think about the fact that difficulty has kind of fallen out of focus from the days of arcade games in terms of the the raw number of people who are going to succeed right and the amount of hours of practice that you need to succeed games aren't as directly literally hard as they used to be but they tend to have a much wider mixture of different types of challenge right and it's also worth mentioning that games don't actually have to be hard to be good right there are plenty of amazing games that aren't hard at all that you just interact with and you kind of have a wonderful time slowly going through it without it necessarily ever being an extreme challenge right i will say though as one last thing that while there are plenty of good games that aren't challenging it is worth mentioning that difficulty is something challenge right is something that's unique to games that doesn't exist in other media right when you watch a movie the movie is going to keep playing regardless of whether you understand it or not right and you can keep reading a novel regardless of whether you're actually getting the main point of the story or not right games are pretty much the only thing that can actually physically prevent you from continuing unless you can demonstrably understand how things work or demonstrably get better at the mechanisms that the games are encouraging you to do and so i think that challenge being a unique thing to video games is one of the reasons why it's so important as a designer to understand how it works and to be able to design you know satisfying varied challenging experiences thanks i hope you liked the talk and as always if you want to chat about it i love talking about this kind of thing so you can leave a comment or just message me directly and i'm happy to have a yarn about the different types of difficulty in games thanks
