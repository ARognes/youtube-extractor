ge to succeed some examples you know critical hit mechanics in rpgs like pokemon final fantasy and you can have probability-based item drops in a rpgs like path of exile or diablo that type of stuff um probabilities loosely grouped into kind of like these two big classifications which is a trivial and non-trivial so a trivial probability event uh probably occurs multiple times they have a relatively benign outcome and examples like missing an attack in a battle right you can use this to add a bit of flavor to your game make it feel not so repetitive um whereas a non-trivial probability event actually alters the outcome or the course of a game like permanently right and some good examples of this is like dialogue options in uh disco elysium or or uh the fallout series that type of stuff often you have one shot to do the dialogue uh to convince the npc to do something otherwise they refuse to talk to you ever again um in terms of creating these challenges it's reasonably easy right just and take any action in your game that the player can perform and make it not have a 100 chance of succeeding that's essentially how you design it right it's really important again like reduced error tolerance to think about the psychology of positive outcomes versus negative outcomes right players really really hate when they lose at a chance event that does something negative for them right if they have a lot of chance events to get little bonuses you know they don't really care if they uh lose on a on a chance event that gives them a bonus they're like oh well i missed that one maybe i'll get the next one but if they have a negative effect where they take damage when they lose on a chance event it can be very very frustrating so just be aware of that um some design things to think about can player choices like items or stats or abilities affect the probability right can you design a build in your rpg to make it more likely that you'll succeed at certain types of probability events another thing to mention is if you're using non-trivial probability events that alter the outcome of the whole game often how do you avoid this phenomenon called save scumming where you incentivize a player to try and save the game right before they attempt the probability event so they can reload and just try the same thing over and over do you want to prevent that you know good things to think about and of course it's really important to mention with probability be extremely careful when you use these mechanics in your game because they're very very addictive they hit some psychological bug you know in our brains that makes us vulnerable to gambling and it's very important that you're careful with how you use these mechanics because we want to design ethical games that encourage healthy play not addiction the fourth mechanism of difficulty is obscurity so this is where you create difficulty by hiding things from the player's immediate view items power-ups objectives new areas that type of thing very very common in open world rpgs and and close world rpgs like zelda um skyrim you know fallout series bethesda games platformers like hollow knight you know this type of stuff obscurity is used a lot in rpgs and especially in games where players have freedom of choice to move around right um essentially this is based on the idea that a player can choose to go one of multiple directions and you hide different things in the different choices that the player can make so in terms of creating these types of challenges one underrated tip that i have is that we we tend to focus very much on the visual as game designers right but there are other sensors that we can use to interact with games so try hiding your um secret from sight but revealing it to sound you know revealing it to touch if you're using a console that has haptic you know vibration or a phone or something like that um reveal those to the other sensors so a player walks across a tile on the ground they get a strong vibration and that's where they need to dig for example you can create the implication of there being a secret right this is a big trick in obscurity challenges like have a long tunnel full filled with monsters getting harder and harder and harder and then finally at the end you have an empty room right there's such a strong implication there that there's something hidden in that empty room and that's how you can create this type of challenge and interest make the player search around for something hidden in that room uh you can use records of progress or indicators that there are areas or things left unexplored right so you can have say a map in your game that might have fog on different unexplored areas or like a long hallway that seems to go to nowhere so you can imply oh maybe if you go explore this area you'll find something secret and you know records of progress like say you have some collectible item in your game and you can find a hundred of them and the players only found like 80. they're incentivized to feel like oh there's 20 20 of them hidden somewhere and that creates an interesting challenge um and a very common strategy people use as well is just providing very little direction or indication of where you're supposed to go next allow the player to kind of discover the points of interest in the world themselves without any indication of like here's a point on the map that you have to walk to the fifth form of difficulty is memorization so essentially you just require players to remember facts arbitrary combinations of things names vulnerabilities locations of items locations of areas that type of thing very heavily used in fighting games fighting games are all about memorization knowing all the moves of your character all the moves of the character the opponent has chosen memorizing the combos that type of thing puzzle games often rely on memorization and rpgs like zelda actually have very heavy memorization elements as well so in terms of how we create these type of challenges you know so many games have combos in them commas are a very very common mechanism of creating challenging interest and one of the reasons is it's usually mechanical difficulty combined with memorization you remember the steps of the combo and if you execute them correctly you're rewarded so that's a positive feedback right a very nice little game design trick that they discovered in zelda early on the reason i want to highlight this is because it's a great kind of off the beaten path use of memorization what happens is that as you progress through the game you find areas that are inaccessible right because you don't have the correct item to be able to access whatever it is you might find say a cave where you can see a chest but it's it's blocked by a wall of ice for example and you assume okay i need some kind of item that can melt this ice right but you don't actually get the item until much later in the game so they incentivize this memorization okay oh where where was that cave in the world i have to go back and find where it was they incentivized that and that's a mechanism for creating challenge because they reward you for remembering areas that were previously unaccessible and of course another thing that you might not have thought of with memorization is that a lot of modern games have an incredibly huge horizontal variation in in the content that they present to you that you have to remember in order to play effectively for example in league of legends there's like 140 something different champions different characters and across those uh there's like 878 abilities right and if you don't know what all of those abilities do you're probably going to get wrecked by one of them uh at some point because you weren't expecting something to happen and so having that memorization improves your chances of winning it's a challenge it's difficulty the sixth type is time investment right and i've combined two kind of major categories here that are not necessarily so similar to each other but i think they fall under a nice heading um so this is essentially either forming the player to forcing the player to perform a repetitive task or waiting for some real life time to elapse and essentially what it comes down to is you're just creating difficulty by drawing out the amount of days that a player has to engage with your game in order to progress or hit some victory condition right so mmos uh world of warcraft you know final fantasy um absolutely typical um for them to use time investment mechanics you know we have all these mobile games that use energy and uh games like animal crossing for example use time investment very heavily so this kind of two categories of time investment grinding is like this mechanic where you force a player to perform a repetitive task over and over in order to progress rather than doing different things or solving uh challenges only once and time gating is where you actually prevent the player from progressing until some real world amount of time has passed right so instead of just like creating a building in a game you wait an entire day you have to come back tomorrow right so in terms of creating these challenges um using the real world clock is a surefire way to create time time investment challenge you know like blocking the player from doing something until the next day mobile games use this very heavily but in a kind of unethical way where they'll say oh this unit will create will take until tomorrow to build but you can pay money right now to have it unlock immediately those type of micro transactions um are you know very pervasive in the mobile game world um you can vary the amount of experience that it takes in your game to level up such that players are actually forced to figure out their own way to gather that experience you don't just hand it to them as a result of playing through the predetermined challenges that you create and what a lot of this boils down to is you