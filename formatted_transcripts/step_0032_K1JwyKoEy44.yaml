transcript: 'Hello everyone and welcome to a new video. It''s been a while since I posted a video, simply because I was on vacation and didn''t have time to make any. I also didn''t have the time, or to be perfectly honest, I was just a little lazy. So, today, we''re back with a new video for the start of the new school year, to get back into learning French. And today, I thought, why not try a new concept where I''ll show you memes about France? In French, we say "même," maybe it''s the same in English. I don''t know, but I''m going to show you memes about France and try to give you my perspective as a French person on these memes, to see if what we see on social media, if the memes we see on social media, are true or not. So I''ve selected a few memes, and we''ll go through them one by one. I''m going to give you the video chapters for each meme , and I''ll show you the memes on screen as well, of course. And we''ll start with the first one: "When people think you eat snails and frogs because you''re French." What ? This meme is half true, I think. So it''s true that often when we say we''re French, people think, "Oh, but you eat snails , snails, and frogs! " And to tell you the truth, to the point that, for example, the English call us "Froggies," we call the English "Rosbifs," and they call us "Froggies." So this idea that we eat a lot of frogs and snails is a very widespread cliché, but it''s something that''s half true. Simply because I think eating snails isn''t common, but I think it''s easy to find in France. If you go to a typical bistro, for example in Paris, you have restaurants called "bouillons." In different neighborhoods, there''s a "bouillon," which is a typical restaurant and not very expensive. Normally, on the menu, you can choose snails, often snails. Well, I tried it once, and because it didn''t really appeal to me, I don''t really want to eat snails, and in fact, it''s not , how can I say, I don''t find it very interesting because there are the snails , and then they put butter and garlic on top , and this butter and garlic sauce is what gives it the flavor. So when you eat snails, you mostly get the impression of eating butter and garlic. And the texture is a bit strange. So, for example, as a Frenchman, I don''t eat snails and I don''t eat frogs, so that''s why it''s a cliché, a generalization. In the case of snails, yes, you can find them on a menu in a French restaurant, that''s possible. Are they good? Personally, I''m not a fan, but butter with garlic is generally very good, but the texture is a bit unusual. As for frogs, I find that a bit stranger because the only times I''ve had the opportunity to eat frog legs— and a leg is the upper part of the leg— generally, we eat frog legs. Well, the only time I had the opportunity to eat frog legs was in a Chinese restaurant, I think, an Asian restaurant, but I believe it was Chinese. And that''s what''s a bit strange, there''s this cliché that the French eat frogs. But if you want to find frog legs, I''d almost recommend going to a Chinese restaurant. And I don''t know if it''s something typically Chinese or if Chinese restaurants in France thought, " Let''s please the French and put frogs on the menu." But in any case, typically, in bistros, in restaurants, for example, bouillons, you don''t find frogs. I''ve never seen them on a menu. And that ''s why I said it''s half true; snails, yes, why not, but frogs, you can find those, but not in typical French restaurants, I think. So there you have it, that''s a bit of a cliché. Well, the meme is funny, but there you go, it''s something that''s half true. Next, How different people react when you try to speak their language. So in blue, there are the people who become friends with you right away. For example, in Spain, Italy, Portugal. In light green , it''s a good try, but why are you bothering to learn this language? So here we have all the Eastern European languages, the Slavic languages ​​if I''m not mistaken, and it''s true that they''re known for not necessarily being easy. In red, there''s "cute but let switch to English," so the Germans, the Norwegians, the Swedes there, and the Danes too, there. I think it''s also because these are countries where there''s a good level of English. Germans are generally good at English, the Scandinavian countries too, the "no reaction" because they''re English-speaking countries, and especially in black , France, please don''t! I wanted to talk about this meme because there''s this cliché that... If you try to speak French with French people, they''ll get annoyed. They''ll tell you not to try to speak French if you don''t know how to speak French. First, there''s a distinction to be made between Paris and the rest of France. This distinction is important because I think reactions can be very different from one place to another. In France, and especially between Paris and, for example, a town in the countryside. The reason is quite simple: Paris is the most touristy city in the world. So, when French people living in Paris see a foreigner, they aren''t surprised; they just think, "Okay." For example, people who work in very touristy places often experience pressure, there are a lot of people, they don''t have time, they''re in a hurry, and so, if you try to speak French, they''ll say, "Yes, what do you want?" And I think that''s typical of Paris , and it''s typical of all capital cities in the world— this "I don''t have time, I''m in a hurry" attitude. When I was in Japan, in Tokyo, because there are so many foreigners and tourists, people aren''t particularly curious if you go to the Japanese countryside. Well, when I went to the Japanese countryside, people were curious and asked us, "What are you doing here?" Plus, people didn''t speak English, etc. And I think it''s the same in France. If you go to the French countryside and you meet French people, they''ll be surprised, they''ll ask you questions, and often they don''t speak English, so they''ll speak to you in French. So that''s the first difference. And then I think there''s a more cultural aspect , or for example, if I take Asian cultures, I think it''s very different. Cultures of French or European culture, I mean in the way of being. But if we take, for example, the United States, which is culturally closer, I''m thinking of the United States, there''s always this thing where people give compliments very easily. You''re walking down the street, someone will say you''re so stylish, you''re so well-dressed, etc. And it''s true that this, especially for the French, is very surprising because it''s not something natural to be overly friendly, and I think it''s even quite natural to be a bit direct and sometimes a little too honest. And I think that if you go, for example, to a bakery in Paris and you try to speak French, if the person corrects you, it''s not because they''re mean and saying you''re terrible at French. I think it''s really more like, "Oh well, I''m trying to help you, but you made a mistake." And this thing about saying you made a mistake, this thing, I think it can be a bit shocking for some cultures, especially American or even Asian ones. In Japan, when I try to speak a little Japanese very quickly, I get the famous phrase, " You''re very good at Japanese," even though I just said hello and thank you. So, I think it''s more cultural in that sense, whereas in France, we tend to try to correct people directly to help them. Ultimately, it''s about trying to help people speak French better. And there''s this scene in Emily in Paris where Emily goes into a bakery and says, "I''d like a baguette," she says something like that, and the baker replies —the baker, the person who works in the bakery, replies directly, "No, not a baguette, a baguette," and she says it in a way that can seem a bit aggressive, well, in the series it''s a bit of a cliché, so it''s a bit aggressive. But I think when people do that in France, it''s more to help you speak French. So, I think there are two aspects. There''s the cultural aspect , where in France, people tend to be more direct, more honest. And then there''s the Parisian aspect, where everyone is stressed, everyone is in a hurry. So if you''re in a bistro and the waiter who comes to take your order is in a real rush, and you''re saying, "I''d like... I''d like... I''d like...," well, he''s going to get annoyed. I''m not saying it''s a good thing that he gets annoyed, but it''s because he''s in a hurry that often, often, they''re not happy, even for the French. Sometimes the waiters are really unpleasant. So that''s more of a general stereotype, but there you have it. So, the "please don''t" thing ... I think it''s something that''s been extrapolated a bit, so extrapolating is a bit of an extreme way of saying that the French don''t like it when you try to speak French, but I don''t think that''s really the case. Moving on to the next one. When the French teacher talks to you in fluent French and you don''t have a clue, what the fuck are you going on? Yes, I really liked that meme simply because I think it''s part of language learning. What''s a bit difficult is that when we have a conversation, we''re kind of on a spectrum where our understanding goes from " I don''t understand," "ah, I understand a little," or "I understand very well." And it just varies like that, around that spectrum of "I can understand." And so, our brain is constantly trying trying to guess what the person means. And that part, guessing, is incredibly important because we can''t— well, it''s normal not to have perfect mastery, it''s normal not to understand every word, every sentence 100%. If that were the case, you''d already be fluent and you wouldn''t have to learn French anymore. So, this part of trying to guess, but I''m not sure, and maybe I''m taking a risk by answering something. I''m taking a risk because I assume the person meant that. So I say that. That''s perfectly natural and it''s something we have to accept. Often, we''re afraid of misunderstanding, we''re afraid of misunderstandings. So, a misunderstanding is when we don''t understand exactly what the person meant. For example, I''m going to show you an... I''m going to give you an example of a misunderstanding. When I was in Japan, I worked on a farm , and the family had fish in a bowl. So, a bowl is a container with water for fish, a fishbowl, for example, goldfish . So there were fish in a bowl. And one evening, I wanted to ask, "Have the fish ever eaten?" I tried to ask this question in Japanese , and the person looked at me a bit strangely and said, "No, we don''t eat fish." And I was like, " No, no, it''s a misunderstanding, it''s a misunderstanding. Sorry, I didn''t mean that. I meant to ask, ''Have they ever eaten? Have they ever eaten?'' So, that''s a misunderstanding, and I think you have to accept that risk because it''s perfectly natural." So when someone speaks to you in very fast French, don''t give up, try to understand. And if you only understand a few words, try to guess the meaning. And then, of course, you''ll have situations like this meme where someone speaks to you in very fast French and you''ll think, "Wow!" Yes, yes. And personally, I had the exact same experiences in Japan, and I think it''s perfectly natural. For the next one, I chose a slightly political meme. So this is a meme that I think the French will appreciate, and it''s a meme that deals a bit with misunderstandings. So, in the photo on the left, it''s a meme template, a very popular meme format taken from the Star Wars movies. So these are photos , images taken from the Star Wars films. And actually, that''s it, there are four boxes , and in the first box is Emmanuel Macron, the President of the French Republic, the French president, saying, "I''m going to eradicate the poor." Then, I can''t remember his name. I''m not a big Star Wars fan, but I can''t remember that name. Anyway, it''s Natalie Portman, right? Anyway, she says, "You mean poverty? You mean I''m going to eradicate poverty?" Emmanuel Macron doesn''t answer and says, " You mean poverty, is that it? No, there." So in France, Emmanuel Macron isn''t popular. He''s been President of the Republic for two terms , and there are all the problems that are quite common in Western societies recently, meaning that purchasing power is decreasing, people are getting poorer, and the price of gas is going up, the price of everything is going up, there''s inflation, etc., etc. So overall, Emmanuel Macron isn''t popular. And it''s often said that he''s a bit of a "president of the rich." So these are very French political issues. But here, the amusing misunderstanding— it''s a bit cynical, but amusing—is that he says "I''m going to eradicate the poor" instead of "I''m going to eradicate poverty." Normally, a president of the Republic, to get elected, would say "I want to eradicate poverty." To eradicate means to eliminate completely; I want to eliminate poverty, I don''t want there to be any more poor people in France. But here, he says "I''m going to eradicate the poor." That''s the kind of misunderstanding you can make in French. If you say "I''m going to eradicate the poor," people will look at you like, "Wow! You seem a bit extreme." Whereas if you say, "I''d like to eradicate poverty," people will think, "Wow, that''s really a good person, they have good qualities, good values," and so on. So, that was mainly to show you an example of a possible misunderstanding. And to give a little introduction to French politics , we have the second-to-last meme: Grandma invited us over on Sunday at noon, Grandma on Sunday evening. These are images taken from the film Spirited Away, which is a very popular Japanese film, and I think it''s common to all grandmothers, to all grannies around the world. But often, when you go to eat at Grandma''s in France, there''s a lot of food. And typically, the typical phrase from a French grandmother is that when you''ve finished your plate, when you''ve finished eating, she''ll say, " Oh, would you like some more food? Would you like to eat something else?" Then you say, "No, I can''t take it anymore, I''m so full, I can''t eat anything, I can''t swallow anything." And then she''ll say, "Oh no, you''re so thin, you have to eat, you''re so... you''re so thin. Eat, eat, please, eat!" And that''s really the image of family meals at Grandma''s house in France, on Sundays at noon. It''s quite traditional to go on Sundays at noon, and often these meals last a very long time. Often we start, we sit down at the table— we say "se mettre à table," meaning we start the meal around noon—and often it lasts until 4 or 5 p.m. And we eat and eat and eat, and in the end we''re so full. In the end, we''re rolling around because we''ve eaten so much, we''re rolling around, and so there... Well, it''s kind of cute. Grandma invited us on Sunday at noon, and Grandma again on Sunday evening. When everyone had left... Well, she feels a little lonely, it''s sweet and a little sad at the same time, but there you have it. The classic French Sunday noon family meal. You have to eat more than you should. You have to eat more than you should, meaning more than your head tells you to. And finally, the last one, she is French apparently. So I don''t know if you''re familiar with it, but it''s Lofi Girl. Lofi Girl is a YouTube channel that makes videos with lo-fi music. So lo-fi, chill-hop, these are very calm, very slow music styles that are often used for studying. There are often "Study with me" videos that use lo-fi, chill-hop, that kind of thing. And I think the most well-known channel in the world is Lofi Girl, so that''s the one you see at the top. And actually, the interesting thing, I think, is that the background represents the city of Lyon. The city of Lyon in France for two reasons. Well, mainly for one reason. The first reason is that the creator of Lofi Girl is French. We don''t know him personally; he''s very secretive, so we don''t know much about him. But the second reason, which is the real reason why this animation depicts a French setting, a French background, is that when creating the animation, the person who created the YouTube channel asked art students to create this short animation for their channel. And it just so happens that the person who drew it was a student. He''s a Chilean student, I think, and I believe he''s from Latin America. He''s not French, but he was studying in Lyon. And in his apartment— I don''t want to say anything wrong, but I think that from his apartment, he had the view of the image you see below, the view of the city of Lyon, and that''s what inspired him. Regarding the young girl who was studying, the video originally used a clip from a Japanese film by the same director as Spirited Away, called Whisper of the Heart. It''s a film I really love, and in it, there''s a scene where the young girl, the heroine, the main character, is studying at her desk. Initially, the channel used this image. They couldn''t use it anymore because it''s copyrighted. So, they asked someone to create an animation. The person who did the animation lived in Lyon. Now, I don''t know for sure , and that''s why the Lofi girl is French and the setting represents a French city. That''s all for today. I hope you enjoyed this new format. I think it''s interesting because it''s kind of funny, kind of silly, these memes , and at the same time there''s always a bit of a cultural aspect behind them. It allows me to talk about different topics in a single video, so I think it''s interesting. If you liked it, feel free to let me know in the comments. If you have any memes about France that you like, feel free to send them to me on Instagram. And if you enjoyed this, I''ll make more videos like this one. Thanks for watching until the end , and I''ll see you next time.'
