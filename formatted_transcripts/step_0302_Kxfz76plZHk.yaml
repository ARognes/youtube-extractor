e big amount of text, which is nice. Then another game, we got Llama Villa on this side, which is the Sims with llamas. Then we have uh Wamu Wamu tool over here. And then here we have a tiny arcade cabinet uh made for Reuben's game Pair Quest. And it's it's fully playable, albeit a bit hard to see or read, but it it is working. So yeah, we got all kinds of fun stuff. Then over here we have classic game Similand and Clicky Land. So this is like the god game. uh corner. In this corner, we have a game that shouldn't be here, which is Oh crab. And the label says it's the worst pop game. And um yeah, and then on the big screen, right, there's a big screen. Currently, it's playing Yardlings, but there's a big but because there's a little device over here. Okay. It is currently showing a bit of info about yardlings. But then if you press this button, these people won't be gaming anymore because I will launch a new game. Uh, it plays every sock popup game except the ones that are in the expo. And it's a great way to show all the games cuz you don't have to pick a game. You just press the button and it will start up something completely new every time. And if it crashes, you just press the button. If you don't like the game, you just press the button. So this is the randomizer. Really cool. also a really cool small machine that we built for the expo. Okay. And then back here, we're going to go into the cozy area. Uh, shoes off, please. So, let's take off the shoes and then let's go in. Welcome to the cozy space. There's a few games here. Over here we have capi hockey which is like a super great party game Ruben made uh a whole bunch of years back and it's basically ice hockey with capiaras. Yesterday we had a tournament here and the whole room is filled with people and today we'll have the finals at 4:00 at uh at at our talk that we're doing. So yeah, we got a whole bunch of bean bags here. Over here we have a a station where we have four laptops set up and they're all set up with chat ventures so people can play together and with other people that are online right now and have a little chat based adventure which the controls are type interact. Good to know then over here we have Ollie and Bali and we should probably close that thing. I don't know what that is. See if I can Okay. Well, nope. Uh, Ollie and Bully game by Ruben and me. Really nice one, I think. And back here, we have Hell Bluster with a little bit of info about Hell Bluster. Uh, this is the story that plays at the start. And we have Feather [Music] Vault. I'm not sure if I mentioned who made each game, but that's fine. Let's see. Is there anything I missed? I think we have everything. It's been great. people really seemed to like the expo. We're really happy with how it turned out. It's it was a lot of work to, you know, set up everything and I just want to thank a few people in particular. Uh there was Paul Schmidt who's the curator. There was Jules who helped a lot with all the synography, so building all the cool carpet based things. and then all the amazed crew and volunteers that were here and that are all around the festival to make sure this thing can run cuz uh yeah, we definitely couldn't have done done it without them. I think that's it. Thanks everyone for coming and have a good day. Bye-bye.
