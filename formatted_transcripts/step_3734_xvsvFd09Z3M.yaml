transcript: Is there an adaptive explanation for postpartum depression in women? >> So, I actually think probably not. I think it's more of a sign of an evolutionary cultural mismatch, which is this going back to this idea that we as humans are cooperative breeders and we evolved to have a lot of support around caregiving. So, we evolved to trade off care, to share care with people in the community, with our kin. I think we now place a lot of pressure on individual parents and on the individual nuclear family to serve the roles that dozens of people used to serve when there was a lot more proximity and people helped each other out a lot more with care. So, we isolate new parents, we don't value their work. We've already talked about, you know, the incentives of a very late capitalist society where we want people to be ambitious drivers and we want them to move on quickly from this interruption of births. >> Mhm. >> And and so, we're not providing the support, you know, in this country we don't have universal paid maternity leave or paternity leave. So, a lot of women go back to work probably before they feel like they're ready. A lot of men do, too. We don't give inadequate or we don't give adequate time and protection. >> Right. >> And we, you know, we create an uphill battle where parents feel isolated and drained. >> So, is there any evidence of postpartum in hunter-gatherer societies? >> Not that I know of, but I'm also not sure how well it's been tracked or measured. >> Yep. Okay. >> But I think it's >> I'm trying to see if this mismatch hypothesis >> Yeah. >> kind of it can just be split tested across like civilizations. >> Yeah. I mean, I I think it's a really, really interesting question and depression in general, you know, hasn't been observed as much in those populations. So, it's a really interesting question, but, you know, in hunter-gatherer societies, when a woman becomes a mother, she becomes if anything more socially integrated into the life of the community. In contemporary society, when a woman becomes a mother, she often becomes more isolated. We have all of these public spaces that, you know, don't bring the baby to a wedding, don't bring the baby to a restaurant, don't bring the baby to a cafe. >> People don't want to Yeah, to work, right? Like a hunter-gatherer mom can actually still go to work. She can still be wearing the baby. She can function economically. >> and berries. >> Yeah. >> Had a good day in the office. >> She can occupy a a high-status social role. >> Yeah. >> And and she can be, you know, fully integrated into the community. >> So, the the the this the What is rewarded socioeconomically at the moment specifically for women uh is not baby accommodating. >> We have this kind of sharp divide between work and home, which I think is a legacy of the Industrial Revolution, right? We Before that, work generally happened at home. Dads were around a lot. Moms were around a lot. Kids were raised as workers. They were contributing to the family business, the family economy. >> Jared, if you brought your kid in here and they were able to write good copy If your 8-month-old was able to write good YouTube copy, I'd be down. I would be I would be absolutely fine. I mean, you're allowed to come as long as you contribute, but >> Yeah. >> Yeah, he's trying. >> Yeah. Good way to hone those skills. >> What I'm interested What do you think's the best advice for dads like trying to be great father, great husband, still take care of themselves whilst supporting a mum who's going through postpartum? >> Give yourself grace. Don't expect that it will be easy. Forewarned is forearmed. So, you know, know that this is going to rock your world and it's going to be transformative, but it's supposed to be transformative. And I would say steer away from the myth that dads don't have any innate wiring to know how to take care of a baby. I think we have this idea that moms are just born knowing what to do when a baby arrives, and men are going to be helpless and useless. >> help moms postpartum? >> I don't think so, because I will say when I had my kids, I was like, "What am I supposed to do with these people?" You know, you have to learn, and you figure it out, and it's about your motivation and your willingness to practice. More than it's about just, you know, having some inborn reflex that's telling you how to care for a child. >> Mhm. >> And dads have that capacity to care and to build those empathetic, responsive caregiving brains. >> I've got two potential hypotheses in my mind. Uh first one is like postpartum contagion. >> Mhm. >> Uh I have to assume that if the mom is dealing with it, it's more likely that the dad's going to deal with it. >> Mhm. >> But, I wonder if level of paternal child caring decreases the likelihood of uh female postpartum depression. >> Yeah. >> Uh do we know do we know what levels of household setup can increase or decrease the likelihood? >> So, there is some research on this, and it corroborates both of your hunches. >> Dude, don't test me. Don't test me on this >> So, you can keep the the bro science hat off. Yeah, you don't need it. >> Yeah, good. >> Um good instincts, but there's research that depressive symptoms are correlated within moms and dads. So, if mom is more depressed, dad's more likely to be depressed. If dad's depressed, mom's really to be depressed. And if one partner is well and can support the other partner, that's also a huge resilience factor, that's a buffer. So, they track together. >> Yep. >> And there's also evidence that when dads are more involved, moms benefit. So, one really cool study tested a paternity leave reform program in Sweden where they were expanding flexibility of paternity leave for dads. They found that if you look at babies born right before and right after that policy intervention, you actually see lower rates of anti-anxiety medication prescriptions were filled less often by the new moms. So, if dads have more access to leave, moms actually show this population-level mental health benefit. And my lab has done similar work and we found that if you look at prenatal to postpartum trajectories of depressive symptoms, when dads get access to paid paternity leave, moms are less likely to get depressed after the birth of a baby. >> So, it seems like the postpartum depression may be for dads as well as moms, one of the key drivers is social integration, level of social integration. Does that mean that if you're struggling with postpartum depression, you should try and like turn on the the socialization taps a little bit, do mommy daddy daycare meet up things? Yeah. That seems like an an intervention that might work. >> Exactly, and that goes back to the evolutionary mismatch idea, right? We're supposed to be embedded in social networks that help us care for our kids. We're not supposed to >> Wait, is this >> do it alone. >> Is postpartum basically like this is a lot and I'm overwhelmed? >> Yeah. I mean, that's part of it. >> Right. >> Yeah. Compounded with sleep loss, identity challenges, relationship strain, money and life worries, and your brain and hormones getting totally, you know, disrupted. >> Does that mean Does that mean that there is a socioeconomic predictor for postpartum depression? Because people who are more wealthy are more likely to have child care, which means that they have more assistance, less pressure, and better sleep. >> Yes. >> Dude. >> Yeah. >> Yes. >> So, there is a socioeconomic link between postpartum depression risk. And part of it is, you know, there are moms in the US who go back to work less than 2 weeks after the birth of a baby. So, if you're a shift worker, if you're a gig worker, if you're at Walmart, you are probably not getting time to rest, recover, and bond. And that's really stressful and really taxing to your ability to adjust to parenthood. So, that's part of it. It's also like what are the community resources that are available to you? Can you afford support and child care? But, some of the best interventions for postpartum depression are around shoring up your social support networks. So, helping get people to be more proactive about asking for help. Helping to invest in your relationships. And you can even do preventive intervention before a baby's born to say, and we actually do this. Um my lab leads psychoeducational workshops with a big um hospital system that serves low-income new parents. We say we have them make a social support map. So, we say who are you going to be able to ask for help in different domains after the baby comes? You know, maybe your older brother isn't going to be that helpful when it comes to taking the baby for a nap, but he can help with your lawn care. You know, so how do you plug different people in your life into different roles to make sure that your social support needs are are met? And we try to coach people to be more assertive for about asking for help cuz I think we're conditioned in our society to be very reliant and yes. >> self-reliance, yeah. >> Yeah, yeah, yeah. A quick aside, you've probably heard me talk about Element before and that's because I've started every single morning the same way for the last 5 years now, which is a cold glass of water with Element in it. Element is an electrolyte drink mix with everything that you need and nothing that you don't. It's a science-backed electrolyte ratio of sodium, potassium, and magnesium. No sugar, no coloring, no artificial ingredients. It reduces muscle cramps and fatigue, supports brain function, and helps to regulate your appetite throughout the day. I genuinely notice the difference when I take it versus when I don't, which is why I don't shut up about it, and also why it's used by everyone from Dr. Andrew Huberman to Olympic athletes and FBI sniper teams, and the good sniper teams, not the bad ones. Also, they have a no questions asked refund policy. So, if you don't like it for any reason, they'll 