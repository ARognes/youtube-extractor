other good ones. You can find a bunch of them in Weirdowl's song Bob, which I highly recommend, by the way. So, let's try to make some of these ideal palendromes, or at least as close as I can. With all the advancements and large language models, maybe we could use something like chat GPT. Let's see. Generate a palendrome about a bird who wants to fly. It doesn't actually work. In fact, it's not even close. The problem with LLMs is that they read and produce text one token at a time in only one direction. They don't have the ability to reason about text in the opposite direction. So, this is just about the most difficult possible task you could ask of it. Now, that's not to say you couldn't use LLMs to create palendromes. I had an elaborate plan to train two LLMs, one on forward text and one on backwards text and then cross-normalize their lockets. But since it requires training them completely from scratch, it was going to take way too long. So I ditched that idea. Instead, I decided to go for a more brute force approach. A palendrome can be built by adding one character at a time to both sides. I just need to make sure that the next character I choose means both the left and right could eventually be valid words. This is done with two try data structures for fast lookup. One for words spelled in the forward direction and one for the reverse direction. At each step, I take the intersection of both continuation lists to see which letters are allowed. It's also possible that at either end, a space could be added to finish the current word. Once I have a palendrome started, I brute force all possible continuations up to the next two words. Then, as the human, I can decide which continuation I like best. This strategy can be used to build the palendrome inside out or outside in. By just repeating this process and growing the palendrome, I was able to make some really fun and long ones. So now here's some of my favorites so far, sorted by length. Epic error or recipe. [