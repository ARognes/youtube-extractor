transcript: '{"content":"\n[0.0s] So, if you''re having trouble with a\n[1.28s] presentation, think about what you have\n[3.24s] to offer, not about what they think or\n[5.52s] what they will think or how you''ll look,\n[7.04s] because that''s not why you''re there. Oh\n[8.2s] my god, how do I know if I can answer\n[10.04s] the questions? What if I give the wrong\n[11.64s] answer? What if I give the bad answer?\n[13.28s] That''s a problem and I can learn from\n[14.96s] it, right? You can''t control what people\n[16.44s] like and don''t like. All you can control\n[18.0s] is what you offer. So, you can''t control\n[19.88s] whether you have hair or not. You can''t\n[21.56s] control someone''s original judgment of\n[23.68s] you. The impression that they form of\n[25.36s] you within the first 5 seconds of seeing\n[27.32s] your face, you cannot control that. But,\n[29.4s] what you can control is everything\n[31.0s] afterward, right? So, when one person\n[32.599s] makes a comment on your baldness, does\n[34.08s] it ruin your entire day? Those are\n[36.28s] things that you can control. How much do\n[38.0s] you take care of the rest of your body?\n[40.04s] That is something that you can control.\n[41.56s] In this life, all you can do is like\n[43.64s] control your actions, but you can''t\n[45.52s] control how anyone else responds. And\n[47.48s] the really beautiful thing about this is\n[49.08s] as you start to really focus on what\n[50.64s] you''re doing instead of expecting other\n[52.4s] people to behave in alignment with what\n[54.2s] you want, it actually frees up a ton of\n[56.6s] brain space. Because instead of worrying\n[58.44s] about how this other person is going to\n[60.32s] behave and how can I get them to do this\n[62.04s] and how can I make sure I get promoted?\n[63.64s] Instead of worrying about all this\n[64.68s] that''s kind of stuff, I''m going to focus\n[65.88s] on my work. I''m going to focus on what\n[67.28s] makes me happy. I''m going to focus on\n[69.0s] how I want to live this life. Being\n[70.68s] upset that someone doesn''t recognize my\n[72.32s] value, that doesn''t help me at all."}'
