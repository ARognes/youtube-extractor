transcript: 'This is all that remains of the Government''s cloud  storage in South Korea, all thanks to a series of incredibly stupid mistakes. Also in your hacking  news roundup, teenagers WiFi sniffing for Russia, cyber criminals want to give you $10,  and why you should sign this petition. But first, South Korea, you''ve got some explaining  to do. This data center used to be home to South Korea''s ''G-drive'', The G here stands for  government. And before it looked like this, it was the central cloud storage system  used by hundreds of thousands of government employees. But of course the cloud  is just someone else''s computer. And this particular computer, relied on a UPS.  These things are essentially one big power bank, which keeps your PC running if  the power cuts out. But of course, the data center was using one  that''s quite a bit bigger. However, here comes the problem, they''d been using  a particular set of batteries for a bit too long, to the point where they actually expired in  2024, the supplier, LG told the government that guys... it''s time to replace them. But  the government thought, meh they still work. Eventually when they did get around  to replacing them about a week ago, things went wrong, a witness  said sparks started flying, and a fire ensued. Resulting in photos  of pretty concerned looking politicians standing in front of what remains of their  all important G-drive. Now, usually an event like this would just be incredibly inconvenient  for everyone involved in the recovery effort, but reason the reason these guys all look so  glum is because the one backup they did have was quite literally stored in the same room as  the primary servers, so it was also, carbonised. And the government excuses have already started  rolling in, "due to the system’s large-capacity, low-performance storage structure, no external  backups were maintained". As for that "large capacity" claim. The data stored in the G-Drive  was 858 terabytes, which really isn''t that much. This is what 1000 terabytes, or one petabyte  looks like. Or if you wanted to backup all of that in the cloud, Amazon charges a couple  cents per Gigabyte, so you''re looking at around $20 thousand dollars a month. Which for  a government is close to pocket change. The G-Drive was used by 74 government  agencies, but hundreds more had to be shut down because they were being run from  the same data centre which was now on fire. Even Korea''s Digital ID went down, with people being turned away at Doctor''s  appointments if they didn''t happen to have a physical ID. Yet another reason Digital ID  is a stupid idea, hope you''re listening Keir. But as for the disruption, you know it''s bad  when the government starts extending deadlines for tax payments. But as for how they plan on  recovering from this... they''re scrambling for whatever files employees just so happen to have  saved locally on their computers, as well as grabbing files from email attachments, and they''re  even resorting to re-rescanning printed records. At the moment this disaster is being blamed on negligence with 4 people  having been arrested so far. But this all sounds very familiar. A sub plot  within Mr Robot was quite literally blowing up a datacentre by sabotaging its UPS system, in  this case though sadly nobody''s debt was wiped. But interestingly just a few days after the  fire, there was yet another datacentre fire in Daejeon barely a mile away, with  again the UPS system being blamed. Next up, police in the Netherlands have arrested  two 17 year olds, accusing them of spying for Russia. The duo was allegedly recruited by a  Russian intelligence agent in a Telegram group, who gave them the mission of walking a  route past the headquarters of Europol, Eurojust and the Canadian embassy, carrying what''s  described as a "WiFi Sniffer". We don''t know what kind of hardware they were using, it could be  a purpose built device like a WiFi Coconut, or just a laptop running software like  Kismet. Either way, "WiFi Sniffing", just means mapping out nearby WiFi networks. It''s  also known as "War Driving" which has been around since forever, here''s a news report on it back  from 2003. It''s about as dangerous as taking a screenshot of your nearby WiFi networks list,  and just noting down your current location, but automated. It''s a fun little thing to  do, and by no means in of itself illegal. The Dad of one of the 17 year  olds spoke to a Dutch newspaper, he describes how his house was raided by  police who came looking for his teenage son, who was apparently in the middle of doing  his homework. And with the level of honesty and straightforwardness you would expect from a  Dutchman, which comes across as more of a roast, he describes how "\[his son] doesn’t go out, he  has a job at a supermarket, and shows no interest in exploring the world", "We raise our kids to  be prepared for dangers like smoking, vaping, alcohol, and drugs – but not for something  like this. Who could ever anticipate it?". But something just doesn''t add up about  this story, war driving is not a technical task that requires expertise, I mean there  are apps for this stuff. On top of that, the Russian embassy is quite literally within  walking distance of the targets in question, so why wouldn''t the Russians have one of their own  guys take a little detour on his morning commute? Hiring a couple 17 year olds for this doesn''t  make sense. And even then, WiFi network maps are public and free, using wigle.net you can  easily peruse the electromagnetic spectrum from the comfort of your own home, exploring the  locations of WiFi networks all over the world. And if you do end up going wardriving,  unlike in that news report from 20 years ago, it doesn''t require walking around holding  a laptop connected to a makeshift antenna forged from a pringles can, a laptop  in a backpack is all that''s required, it''s totally incognito. IMO it actually takes  quite a bit of effort *to* get caught wardriving, not that the fact that doing  it is illegal in of itself, so we''re definitely missing something in this  story, the official narrative just doesn''t add up. Either way, so far, only one of  the 17 year olds has been released, and he''s currently strapped with an ankle monitor Next up, a ransomware gang wants to pay  you $10 to help them do cyber crime. The group, ''scattered Lapsus hunters'' grabbed  terabytes of data from SalesForce. However the company hasn''t shown any interest in paying  the ransom. So our cybercriminals have come up with a new idea. They''ve decided a bit  of audience participation is the way to go, telling their Telegram followers, "if you want  to participate in our activities, it''s simple!". They''re asking people to send emails  en masse to the company''s executives, with the reward of $10 in bitcoin per email!  "You have permission to endlessly harass these executives till they comply with us. ...This  will be centralised and well operated." They posted a file with instructions... "WELCOME  [USER]: Today You Will Be Completeing The Doxation Of Multiple Individuals. Please Proceed  With THe Instructions BELOW". Not only do they list the personal and work emails of  SalesForce execs, but also the executives of the companies that were using SalesForce,  who''s data is now in the hands of the group. To claim the cash people are being told to  send proof of their emails, exactly what ''proof'' looks like is a bit unclear, I mean,  faking screenshots isn''t exactly difficult. But people are apparently taking part in this.  In an interview they claim to have paid out over $1000 at this point. But I would caution just  for the record, incase it wasn''t obvious, getting involved in this is a stupid idea, it  might seem harmless, sending an email to an exec and claiming your $10, but extortion is a crime,  and the feds would love to make an example of you. At this point you can imagine the inboxes of  those executives have been absolutely trashed and probably abandoned by now, so the group has  come up with another offer to their followers, encouraging them to conduct OSINT on the execs,  offering $100 for people who discover new email addresses. And on top of that they''re offering to  pay even more than the standard $10 for emails, if those emails are unique and  personal, whatever that means. Next up, I know I''m super late to this  topic, but a quick appeal to the Brits among us to sign the petition against  Digital ID. It''s already passed the threshold for a debate in parliament, but the  more people register their anger the better. And if you still need convincing... this  Digital ID is an obvious trojan horse, the government are telling us you won''t need  to carry it around and present it to police or anything, it''ll exclusively be used to prove  to employers that you have the right to work, in order to cut down on illegal immigrants  working, apparently. But we already have very effective ways of proving the right  to work. And the avenues by which illegal immigrants do work will  be totally unaffected by this. The government are clearly weaponising  the anger about illegal immigration to manufacture consent for Digital ID, something  they''ve been itching to do for decades now. And what really susses me out, is  the fact that this deeply unpopular government are willing to expend  what little political capital they have left for a policy which is  really not very well supported. The big problem here, is mission creep, the  fact they''re calling this Digital ID and not the ''right to work'' app means that they  are absolutely going to be expanding what this thing is used for in future, and where that  leads, I don''t know but I''d rather not find out. The best chance we have to stop this, is before it  becomes a thing, and I''ll link the petition in the description. But anyway, thanks for watching and  I''ll see you in the next video, have a good one!'
