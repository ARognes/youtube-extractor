io, every interesting person who is sort of a software curious or computer curious person in the late '80s was talking about Waterloo, the University of Waterloo. So, I made my way there in the late '90s when I graduated high school and you know, after that the most interesting people I knew were all going to Silicon Valley or to Seattle to work at Amazon Microsoft. And actually, Amazon and Microsoft were both very focused on recruiting out of Waterloo. They were two of the earliest. So, there's strangely a big contingent of Waterloo folks in Seattle. And when I got the Amazon opportunity to go there full-time, even though most of my friends my co-founder ended up coming with me, most of my friends stayed home in Toronto for very good reasons, you know, family and girlfriends and boyfriends and all the real you know, very reasonable jobs with sort of reasonable career paths in Toronto. I instead decided to be more singularly focused on like, "Hey, let me go try to be at the edge of this thing." And as you remember, those were really interesting years at Amazon. You know, it's funny cuz my parents never quite got it. They used to tell people I worked at an online bookstore, which was technically true. I think at the time we had books and maybe CDs and a few other things. Obviously, it turned into something much more substantial than that. But what I remember, I'd love to hear what you remember, is just how serious-minded and technical everyone was. I remember both like serious and then not serious stuff. The the dogs roaming the hallways, the whiteboard conversations, um and staying up all night. You know, like the big launches when we're all in like the room stuck together. >> Christmas. Yeah, the Christmas on Christmas morning. >> on. Yes, yeah. But also, you know, I think we were at the forefront of like service-oriented architectures, uh distributed computing, high-volume transaction processing, serving a ton of requests to end users. And so, it did feel like a really special time. Yeah, yeah. And actually, it's a fun topic. I never get to talk about this. But I remember there was two types of two shapes of problems at Amazon. There was the very high-volume request-reply synchronous systems, which is what I worked on in the you know, software platform team. And then there was the workflow systems that were all built on Tibco Rendezvous, if you remember that. That was everything in sort of supply chain and order management. And there were just I mean there I don't know where else at that time in your career you would have gotten exposure to those two problems at that scale. It was fascinating. So, after Amazon, you said maybe your career is defined by going to the edge. Yeah. And so, why did Amazon stop being the edge and, you know, what were the other opportunities there? Well, a lot of it I mean I sort of always and it's an interesting moment in time to rewind it back because I think that, you know, given where coding agents are today, there's a set of people who whose identity is a programmer and a different set of people whose identity is a builder, and I think the builders have never been more excited and the kind of programmers who live for the output of the programming are perhaps a little bit sad. You know, so for me, I was always interested in putting things out into the world, sometimes more so than the how we actually do it, and there was a entire community forming around the Facebook platform, which was very early and interesting in 2006 because you had these new primitives around social graph and identity, and there's just no concept of that prior to Facebook. Uh not at the scale that they actually were were live with. So, that just felt like a lot of, you know, where a lot of the best builders were gravitating, and then with the release of the iPhone, that then in 2007, it was very clear that the combination of, you know, what the iPhone was doing from a hardware perspective and Facebook was doing from a social platform perspective was where the most interesting people would be thinking and working. So, I quit my job to go work there. In fact, I'll tell you a fun story. Do you remember Rick Dalzell? Yes, of course. >> So, Rick was incredible. When I first got to Amazon, I remember Rick, he was an SVP, he did this all-hands for our our platform team, and and maybe it was the entire sort of infra team, and I came to him after, of course, being 23 or 24, you know, and told him how everything's broken, and I had all these great ideas and how to fix things, and he said, "All right, come to my office and we'll hang out, and we'll meet, you know, once in a while, and you know, you and Aneesh can help me stay up to speed on new emerging technology, and I'll help you navigate Amazon." So, we built this great relationship over the years, and in my last year there, um I came to him one day and I I think we were talking about YouTube, which was a new new thing back then, and he said, "You know, Aneesh, you come in here every month and you talk to me about all these incredible startups. Why haven't you quit to start building one?" And I said, "Well, Rick, I don't know any investors, and I think you have to know investors to start a company." So, he said, "Aneesh, I'm going to introduce you to three investors after this meeting, and if the next time you see me it isn't to quit, I'm going to fire you on the spot." >> [laughter] >> So, that was sort of the moment he gave me that push, and yeah, I left to start a company in 2008, and you know, it really changed my life. Tell me about this. Like, you're 22, 23. Mhm. How were you interacting with the senior vice president of a major multinational corporation? I mean, that's the egalitarian nature of tech, right? I think when our community, when our industry is at its best, you have this fluid interaction between the most senior executives and the sort of youngest engineers. And I don't think that's a a note around sort of ethics. I think that's a note around survival, because, you know, being a new graduate, you're the closest to the technology and emerging consumer trends, and these are things you just don't know if you're, you know, as Rick was then, as I am now, in your 40s and 50s, and you've just got to be able to kind of interplay between the two. And and he was very cool. He, you know, he was happy to meet me once a month and and hear all of my crazy ideas. Well, isn't there a cardinality issue? Like, he has this gigantic organization underneath him. There are only so many junior and and mid-level engineers that he can interact with. Were you lucky? Was there something that you did to catch his eye and and have that conversation? >> I just I came up to him after his all-hands presentation and told him everything that was wrong. And I had a lot of other people who were my peers at the time, but nobody else did. And I didn't do it because it was some sort of career move. I did it cuz I felt strongly, and I didn't have the probably appropriate level of fear of executives that I should, you know? And he took it in stride. Oh, that's amazing. Do you recommend that people do that, that they speak their minds and and just kind of go for it and send it? I think the most powerful way to show up at your job in most organizations is be the founder in the room. This is what I've always tried to do. You know, if you assume that you have that level of agency, if you assume that you're allowed to weigh in on those things, and also if you take on the sort of responsibility of having a point of view, I think it just makes you a really unique individual. But that doesn't mean you've got to be, you know, outspoken to a degree that's unhelpful. But also think that sort of timidity never serves you early in your career. You know, you've got to say yes, you got to be willing to speak the truth, you got to do the extra thing. Sometimes that means leading, a lot of times it means following, but I I I just think that founder mindset can show up in so many positive ways when you're in a bigger organization. If you've been coding with AI agents, you've probably noticed that they're only as good as the context that you provide. They can create high-quality outputs, but only after you do the hard work of crafting stellar context as input. Without the full picture, you get the speed, but the output's not quite right. This is where today's sponsor comes in. Linear is more than an issue tracker. It's the ultimate context layer for your entire product system. It connects to your whole stack like GitHub, Slack, support tools, and your customer data. And because AI agents integrate directly with Linear, when one picks up a task, it can see all of the context that you've accumulated. Which customers were impacted, ongoing projects, historical decisions, and so on. Without you having to spend the time to craft that context. All that matters because high-quality inputs lead to high-quality outputs. If you're going to rely on AI, you need a system that feeds it context automatically, rather than having to bring it yourself manually every time. That's why more teams are switching from Jira to Linear and using agents to resolve issues over three times faster. Check them out at linear.app/ale. So, let's shift over to the elephant in the room, which is AI. Oh, great. Great. Okay. Yes. So, uh discourse on AI is is polarizing, and it's difficult to find like level-headed takes. You have a thesis that the world is short on on software or short software. Can you explain this thought? If you look at software, software for so many years has this been this incredibly precious resource. And even with all the incredible technology that we consume on a day-to-day basis, the number of people that can create technology is very, very small. You know, maybe we have a million programmers, at least order of magnitude. So, the impact in terms of the amount of software created to just making it easier for people to