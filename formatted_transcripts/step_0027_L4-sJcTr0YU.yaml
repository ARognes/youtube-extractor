o list ever going to be empty, right? If everything on your to-do list is done, I think there's this expanding frontier of problems and so, you will have to prioritize those things, right? So, it's sort of like you're squeezing a balloon from one side, you're just displacing it to the other. >> Perhaps, but at a higher sort of uh a higher level of granularity, you know? So, now instead of like talking about what's the ambition of an engineer or a team or a function, you're talking about what's the ambition of us as a company. And like I think that I'm glad that you mentioned the expanding frontier. I think that's exactly right. Like I've said this before, I just I there's no way what we see around us is the peak expression of our ambition. We've read all read enough sci-fi books to know there's like a lot more to build. We don't even have enough skyscrapers, you know? Like come on. Um so, I think that the there is no ceiling on ambition and that's where a lot of this new energy will get pointed. >> Yeah, I do see that the existing constraint now that code is becoming more and more of a solved problem is code review, observability, making sure that the thing that you've created is in, you know, is doing right by your customers. Do you see that as a temporary limitation, these new bottlenecks? Uh, or do you see that as something more fundamental that, you know, there will always be some sort of bottleneck in the process? We have to have better systems than we've ever had before. So, I do think there will be bottlenecks and tradeoffs. I think the magic though for most PMs, like if you look at how most PMs describe themselves or aspire to describe themselves, they want to be the sort of innovative new product thinker. They want to be somebody who's imagining the future and then shipping the future. But, how many PMs actually get to do that work? Very few. I would argue most companies have zero or maybe one person that does that. And there's a question of sort of skill v