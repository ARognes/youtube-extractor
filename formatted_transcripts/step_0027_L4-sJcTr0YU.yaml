lue the next day or even when the game ended. And because of the sort of trade-offs that were implied, you never would have created that prior. You make a an analogy between YouTube in its early days, I think circa 2005-2006, and the moment that we're experiencing right now within AI. Where does that analogy really fit and and where does it end and tail off? That's a good question. If you look at where we were from video creation and sort of just video and, you know, media in in 2005-2006, it felt like we had enough. You know, if you had one of those big satellite dishes in the back of your house, you had 200 channels. But either way, the average consumer probably had access to 30, 40, 50 channels and, you know, there's 24-hour content on all those channels. So, I think a very natural question 20 years ago was, "Hey, do we really need more TV, more video, more media?" And if we do have it, what form will it take? And in a sense, that question people tried to answer that question on the early days of YouTube. When you saw a lot of, you know, home camera footage, when you saw people pirating shows from traditional linear television to YouTube. Over the years, what you saw was all of these emerging sort of YouTube native formats, everything from unboxing toys to get ready with me. These are things that just were inconceivable 20 years ago. And now those things that I'm discussing are bigger and more substantial than linear TV. And in fact, funny enough, so much of traditional media is actually just commentary on emerging and new media. So, I think the same thing is true of software. You know, today our NBC and CBS are sort of like ERP and CRM. They're big and they're serious, and like the trade house makes sense. What is the equivalent of get ready with me or unboxing in software? I don't know, but I think we're going to find out. You know, if I were to channel my own experience in the mid-2000s, it's like, "Oh, cool. You can post a YouTube video, but like you're not seriously thinking that you could create your own Star Wars." You know what I mean? So, I'm like, "Oh, this must be throwaway because, you know, there's this high art or the high production value is the thing that makes the video good." But it turns out I had a demand for things that I didn't know existed, that was actually at lower production values. Absolutely. I mean, look at Twitch. Twitch is such an interesting example. It's like what YouTube It's YouTube's YouTube in a sense. Cuz when Twitch was started in Justin.tv, you could have easily looked at YouTube and said, "Okay, we've got old media, we've got new media, like we're good." And then also, do people really want to watch other people play, you know, uh AAA video games? And it turned out that not only do people want to watch other people play those games, but it was enough to catalyze unique live streaming video platform that of course was bought by Amazon many years later. So, I just think that these things continue to surprise us to the upside, and software will follow a similar trajectory. Let's talk about advice for, you know, the next generation or maybe people that are currently employed and and maybe mid-career. Things are changing so rapidly right now. What's your advice for folks that are maybe early career and trying to get a foothold on things? Yeah. And a lot of this is advice is out there, but I think it's good advice, which is number one, use every product. You just have to use every product. I really learned this from my co-founder. My co-founder both my companies was this He's just a technology enthusiast. So, he was the first person I knew that had an iPod, first person I knew who had a mini disc player, the first weirdo who moved from PC to Mac, the first person who had an iPhone when uh if you remember the iPhone mail app used to say something from my phone, you know, so it just he was this enthusiast and as a result he always had intuition that was 3 6 9 months ahead of everyone else. He was bullish where others were bearish and the inverse and I think that that is so important for all of us to really internalize. There's just so much alpha in using the products and having your own intuition. Really it's about primary sources. And look, there's a lot of products coming out but not so many that you can't try most of the big ones when they're new models. I try to hold myself to a standard of trying them all, using them all. It's great to have something to work on. You know, I've got a bunch of products and apps I've been working on mostly so I have this kind of chassis for exploring the new technology. So I I I'd say that's like if you can only do one thing, it's just obsess about the new products and try to use them even if you feel like your use of them aren't yet very sophisticated. Yeah, I think about the fact that with all of these agentic coding things that are out there, essentially mandates from leadership that they need to get on this AI train, that the AI stuff is really it's highlighting who's actually a builder and who has is kind of like trying to hide and hide from the fact that like they're not really contributing and building because organizations are moving so slowly and and code is being written so slowly. But yeah, I do think that it is a it's a renaissance for people that are really that are really into build like there's so many CEOs and CTOs coming out of the woodwork and you know, staying up all night. It's this the analogy is like the slot machine. You're just like, wow, my prompt actually like made something and you feel really good and then you put it in and then you're like, oh, my prompt didn't actually that's not what I meant, right? And then you're like, I'm going to pull it again. Well, do you remember this concept from the sort of social era of variable scheduled rewards? Yeah. That was like the reason the big brains are the explanation. That's right, exactly. So randomly dispensing rewards or or pain, rewards or pain