se numbers and determine which one's bigger we have to actually compare a single digit one at a time right and so this leads to some exploitative tactics when it comes to sales you know this type of thing is very well known like if i ask you to just tell me what your intuition about how expensive these cars is you'd probably say oh seven and nine thousand seem cheaper and eleven thousand just seems like much more expensive for some reason even though the distance between them all is two thousand right they're all the same right and it's because we crossed that boundary and now we have an extra number right we have an extra digit we have you know two numbers and then three zeros instead of one number and three zeros right and that's actually tricking our brain into thinking that it's significantly more expensive when the the gap between them is the same this is even worse right you've probably seen these kind of exploitative sales tactics before right we have a only one dollar absolute difference between the values almost nothing in the scheme of things right but the ten thousand dollar car seems way more expensive and the main reason is because it has not only an extra digit but it has a comma as well right so we've actually exploited the way that we look at just the size of the physical size of the number on the screen or on the paper before we look at the actual digits inside the number and another example of something that i've noticed in this regard is as food at restaurants has gotten more and more expensive i've noticed that it's fashionable to stop listing the prices like uh dollar sign 5.00 for five dollars and instead they just put the number like 12 because for some reason it seems smaller because it takes up less space on the paper you take out the dollar sign you take out the dot you take out the cents and it seems cheaper than it actually is right and this so this ability for us to like you know perceive things logarithmically as likes one some many is 