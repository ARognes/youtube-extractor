transcript: hi my name is nick barker and this talk is called the logarithmic brain and the rarity paradox and it's about the way that humans perceive numbers and more specifically about how we tend to misperceive numbers as they become very large so i'm going to start off with talking about the logarithmic brain and then i'm going to talk about how this leads to an interesting phenomenon called the rarity paradox so the logarithmic brain idea is very simple right it's just that humans don't perceive numbers in a linear way right numbers are inherently linear they increase or decrease at a steady rate along a line such that the difference between the number one and the number two is exactly the same as the difference between the number a million and one and a million and two right so here's the problem as the number becomes larger and larger humans tend to lose perspective on the differences between numbers right one and two seem very different to each other but a million and one and a million and two seem almost the same right even though the absolute difference between them is identical they're both one apart right so i'm going to talk about a couple of the different quirks of our brains that lead to our perception being like this and i'll give you some examples so the first one is logarithmic perception right which is that we tend to perceive numbers on a logarithmic scale rather than a linear scale and all that means is that as as the number gets larger and larger we tend to minimize the differences between those numbers as they get bigger and bigger right humans appear to think of numbers in terms of three buckets of one sum and many right and there's a reasonable amount of evidence to demonstrate that this is the case both children and amazonian tribes who have had minimal contact with other societies when they're asked to group together numbers they tend to put all the large numbers together on one end of the scale um grouped together even if those numbers are wildly different they're all just big and then they have the the numbers that are kind of like a handful in the middle and then they have the single digit numbers on all together on the left-hand side you know one two three and four so it appears like linear perception of numbers is not natural it's actually something we have to learn and be taught right and this can create some major problems in society right because some of the most important decisions being made in society around money and money is inherently linear right and when those numbers get very large it means that the average person is unable to perceive the magnitude of something like a government budget which is arguably one of the most important things for us to understand as a society right if your government tells you that they're cutting their health care budget from you know 50 billion to 49 billion right it seems like those numbers are almost the same but a billion dollars creates an insane amount of change when it comes down to the small scale right a billion dollars is a huge amount of money but it's so large that we're unable to really perceive those differences accurately the next quirk that we have is called relative comparison which is that when we're determining the difference between two numbers we tend to think of them as how the numbers relate to each other rather than the absolute difference between the two numbers so to give you an example of that say you're at the supermarket and you're used to buying apples for 50 cents each right and suddenly you know one day you walk in and the apples now cost five dollars each right that's a ten times increase in price or like a thousand percent increase uh in the relative difference it feels like they're suddenly extremely expensive right but there's only a 4.50 absolute difference between the price before and price after right the absolute difference in terms of if you lost a five dollar node depending on your financial situation it's probably not that big a deal but the increase between the two things seems very extreme and to give you a counter example you know a lot of places in world housing has become absurdly expensive right so if we're thinking about the comparison between a house that costs a million and twenty thousand dollars and a house that costs a million and fifty thousand dollars right they seem almost the same even when you look at the numbers on the screen right they look almost the same like there's only a 2.8 relative difference between the two numbers right so our brain is telling us relatively these are almost the same right but the absolute difference between these two things is 30 000 which is an enormous amount of money and it's actually so much money that if you were to spend enough time and effort negotiating to get your house for thirty thousand dollars cheaper that would pay for a five dollar apple every day for 18 years right it's crazy when you look at the difference between the magnitude of these two values but you know we tend to fixate over the difference between small numbers because it's it's a much larger relative difference right 50 cents five dollars is 10 times right but a million and twenty thousand and a million and fifty thousand look and feel almost exactly the same so it's uh this bizarre bug in our minds that we tend to behave with a reverse amount of rationality when it comes to prices cheap prices we agonize over the differences and very expensive things seems like they're just the same right the third quirk is rounding which is that humans are chronic estimators right we do fast estimations on everything we don't really sweat the small like accurate differences so we tend to not always but we tend to generally round numbers to the closest power of 10 right like 90 is roughly 100 1.1 million is roughly 1 million right um and this creates a staggering amount of error when the numbers get very large right just a couple of weeks ago i saw this article right that says has announced that microsoft this mega software company is buying this video game company activision blizzard for 70 billion dollars right i saw this article first it's from a reputable publisher right and you can see that a lot of people view the 30 000 people who viewed this article at the time then later on i found that out the number was actually 68.7 billion dollars right and you probably wouldn't fault this person for rounding it up to the closest 10 billion because it's it seems pretty close 68.7 seems pretty close to 70 right but that difference is 1.3 billion dollars even even the rounding error is such a colossal amount of money that you know we can't even comprehend how how much 1.3 billion dollars is let alone 70 right and so it's this chronic estimation even when we're trying to convey accurate information that leads to like these snowball this snowballing amount of error when it comes to numbers um and just something i've personally observed i haven't seen any research or evidence to indicate this but these quirks to me seem to indicate humans can only compare two digits at a time and what i mean is they can only compare two single numbers like that are single digit like zero one two three four five six seven eight nine we can only compare those numbers and we can only compare two of them at a time and i'll demonstrate why i have this particular type of feeling so we're gonna just do a little quick thing where i'm gonna show uh two numbers left and right and you have to guess as fast as you can which of those numbers is larger just try and rely on your intuition and don't think too hard about it just see if you can tell immediately which one is bigger um so pretty quick right it's easily obvious that seven is bigger than five this is obvious fast instinctual it's probably deep inside your mind that seven is bigger than five right next one also obvious fast instinctual right 473 obviously bigger than five how about this 65 360 yes still fast and