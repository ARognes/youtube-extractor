lso go on more\ndepth where they''re like,\n[112.927s] \"If I just get this one person to love\n[115.62s] and obsess over me,\nthen I can love myself.\"\n[119.34s] It won''t work.\n[120.39s] You can''t delegate\nself-love to the external.\n[125.64s] And if you enter a relationship\nwith that as the foundation,\n[129.067s] \"I''m not good enough for me.\n[130.8s] I need someone. I need a relationship.\"\n[133.89s] It''s a desire, a craving,\n[136.8s] as opposed to an intention, meaning,\n[140.107s] \"I''m whole, I love myself\n[142.44s] and I want to be in a relationship,\n[144.03s] but from a place of wholeness.\"\n[145.86s] If you don''t do that, you''ll\nactually not experience love,\n[149.55s] but you''ll experience\ncraving and attachment\n[152.52s] and it will lead to a lot of manipulation.\n[155.58s] Meaning, I don''t love myself.\nI can''t be alone forever.\n[160.23s] Be with me, be with me. Be my other half.\n[163.98s] You''ve seen it in the\nmovies. I''m a half your half.\n[167.49s] And together, do, do, do. We are one.\n[170.52s] You complete me. Be with me.\n[173.85s] Say, he says \"Yes,\"\nand we''re together now.\n[177.09s] I''m gonna experience\ntemporarily a little high,\n[179.49s] an egoic high, yes,\n[182.61s] but immediately it''s gonna be followed by\n[185.347s] \"Don''t you ever, ever leave me\n[189.21s] or else I''m just a half, stay.\"\n[195.99s] Fear of loss, an attachment.\n[198.0s] And it''s not love, it''s\nattachment and craving.\n[200.94s] And I''m gonna try to\nmanipulate him to keep him here\n[203.61s] and have him never leave.\n[205.32s] And if he feels the same,\nwhich also happens a lot,\n[207.6s] he''s gonna do the same to me.\n[209.46s] And we''re gonna be in our\nlittle manipulative bubble\n[212.01s] trying to keep each other there forever.\n[214.2s] Always being afraid that\none day they could leave me\n[216.0s] and then I''m a half again.\n[217.89s] How toxic is that?\n[219.0s] And that''s unfortunately\nmost people''s relationships.\n[223.2s] So until you can truly\n[226.95s] fall in love with yourself\n[229.2s] and instead of being a\nhalf, you become whole.\n[232.29s] And that''s really love.\n[233.22s] It''s not two halves, it''s two wholes.\n[236.22s] And they come together\n[237.27s] and there''s a certain\nsynergy that happens.\n[239.46s] There''s a certain intention that say,\n[241.657s] \"I want to be with you, I love you,\n[243.96s] but you don''t complete me.\"\n[246.78s] Together there''s that synergy,\nbut I''m me regardless.\n[250.92s] Also important to understand\nif you go through a breakup,\n[253.26s] is a breakup fun?\n[254.093s] Of course not.\n[255.48s] But it never diminishes your\nself-worth. You''re still you.\n[259.35s] Nothing out there will ever\nenhance you or diminish you.\n[264.93s] Now, it''s not always fun.\n[265.8s] Like I said, you can have an intention.\n[268.38s] I want in to be in a relationship\nthat''s part of my goals.\n[272.4s] Same in life. Important to have goals.\n[274.74s] You can''t just aimlessly durp around,\n[277.65s] but your goals don''t determine\nyour self-worth ever.\n[284.4s] So that''s the first one,\n[285.233s] I would sink into those fears.\n[286.77s] Being alone forever. Can\nyou be okay with that?\n[290.79s] Don''t let it trigger you.\n[293.16s] The next one is stop chasing\nthe wrong people, for real.\n[299.25s] Ask yourself, what is my ideal partner?\n[304.26s] Now, unfortunately, what we\nsee is people will chase others\n[309.09s] that might impress their\nfriends, impress their family,\n[312.51s] impress society, and they\nnever ask themselves,\n[314.857s] \"What do I want?\"\n[318.27s] Go for you. No one else is\ngonna be that relationship.\n[320.58s] Why are you trying to impress others?\n[322.8s] And be careful of not trapping yourself\n[324.75s] in what we call a golden prison.\n[327.36s] I see this a lot too.\n[328.95s] Meaning there is such a\nthing as natural chemistry.\n[331.92s] If all of us were to hang out\none-on-one, say a minute each,\n[335.49s] are we all gonna get along the same?\n[336.84s] Yes or no?\n[337.673s] - [Audience Member] No.\n- No.\n[339.39s] Some of us are gonna connect,\n[340.47s] some of us a little\nless, that''s chemistry.\n[343.62s] Does it mean that there''s something wrong\n[345.03s] with the person you don''t connect with?\n[347.4s] No, just no chemistry.\n[348.78s] You''re not friends with everyone.\n[350.1s] And that''s okay. That''s natural.\n[352.26s] You''re not meant to get\nalong with everyone,\n[353.67s] and not everyone\n[354.503s] is meant to get along\nwith you, that''s nature.\n[357.57s] Yet what we do is we try to people please,\n[360.15s] we put on a certain front,\nwe try to be someone\n[362.34s] that we''re not in order\nto get the wrong people\n[366.12s] with whom we have no natural\nchemistry, to like us.\n[369.87s] So for example, what''s\nyour favorite movie?\n[373.229s] - [Audience Member] \"Harry Potter\".\n[374.347s] \"Harry Potter\". I do\nnot like \"Harry Potter\".\n[378.24s] Now, that''s actually true.\nI loved \"Harry Potter\".\n[380.28s] I was reading the books\nwhen I was younger.\n[382.44s] I read the four first books\nand the first movie came out\n[386.07s] and I saw that movie and\nit made me hate all of it\n[388.95s] because in my mind I had this\nvision of what \"Harry Potter\"\n[391.41s] looked like and what the story was like.\n[393.0s] And the movie came out. I''m\nlike, \"This is for kids.\"\n[396.062s] (audience laughing)\n[398.1s] And it was over for me.\n[400.29s] Now say, I was like, \"I need her.\"\n[405.27s] What do people do? They\npretend they perform.\n[408.607s] \"Oh, you like ''Harry Potter''? Me too.\n[411.69s] That''s my favorite movie.\"\n[414.72s] Now say I do that. Ultimately, it''s lying.\n[417.72s] Portraying yourself as\nsomeone that you''re not.\n[420.27s] She might be like, \"Oh, that''s great.\"\n[421.41s] We bond over it. Now we''re together.\n[424.41s] You might think you won.\n[425.79s] Look, I got her, but did I?\n[429.06s] No. I created a golden prison.\n[430.53s] Where now, every single day\nI have to lie about who I am\n[435.99s] and keep saying \"I love ''Harry Potter''.\"\n[438.54s] When in reality I don''t.\n[440.52s] And you create a prison of paranoia,\n[442.59s] you''re always walking around on eggshells.\n[444.307s] \"Is the today the day she''s gonna find out\n[446.22s] I actually don''t like ''Harry Potter''?\"\n[448.41s] - [Audience Member] But that''s exhausting.\n[449.82s] - It is exhausting. It''s horrible.\n[451.32s] But that''s actually a\nlot of relationships.\n[453.877s] \"Look, here I am. I''m cool.\n[456.03s] Look how confident I am.\n[457.5s] What if they see the real me?\"\n[459.36s] As opposed saying, \"No,\nhere''s the real me.\"\n[462.66s] If that''s what a relationship feels like,\n[464.28s] this prison paranoia,\nthat''s not a relationship.\n[466.5s] It should ultimately be\nyour own personal sanctuary\n[469.47s] where you can relax and fully be you.\n[472.74s] A good audit is, think of\nyou at your worst, right?\n[478.08s] So for example, you two together, right?\n[480.39s] Do you fart in front of each other?\n[482.436s] (audience laughing)\n[483.269s] - [Audience Member] Yeah, we do.\n[485.03s] Yeah, you do? Good. That''s\nactually really good.\n[487.02s] Do you? You''re kinda like, ah,\nwell, don''t be ashamed of it.\n[489.3s] Own it. Yeah, okay.\n[491.88s] Did you ever see yourselves\ngoing to the bathroom?\n[495.9s] Did you see her going to\nthe bathroom? Like that?\n[498.334s] (audience laughing)\n[499.65s] - [Audience Member] Not this.\n[500.94s] - Okay, but the rest, yeah?\n[504.21s] Okay, good. No, good.\n[506.25s] Now notice how everyone\nkind of cringes around this,\n[508.05s] like, oh no, but that''s also being human.\n[510.99s] That''s a relationship. Guess what?\n[513.63s] What if they entered the relationship\n[514.83s] and they didn''t do that.\n[515.91s] They never farted.\n[516.84s] They were always like,\n[517.673s] \"Oh no, we can never see\nme pee,\" et cetera, prison.\n[521.37s] Now, of course you can\ntake that overboard.\n[522.96s] Like don''t be like, ha,\nha, ha, I''m coming to bed.\n[525.18s] Like, no, no, no\n[526.411s] (audience laughing)\ncommon sense.\n[529.5s] But say that was the case and\nit was like this dirty secret.\n[532.68s] That''s a prison of\nparanoia. That''s horrible.\n[536.22s] ''Cause everyone does it.\n[537.053s] So you''re like, \"I''m gonna,\nsorry, I''m gonna go outside\"\n[539.28s] and then you''re back inside, \"Oh hey.\"\n[541.11s] Like horrible, now that''s just\nwith a very graphic example.\n[545.01s] People do this with parts of who they are.\n[546.93s] Think of you at your worst.\n[547.92s] Say you went out tonight\n[549.45s] and people invited you out to a dinner,\n[551.13s] you eat a ton and people are like,\n[552.247s] \"Hey, have a drink or two.\"\n[553.35s] When you wake up tomorrow,\nyou''re kind of hungover\n[555.21s] and bloated and say, your\nideal partner walked in\n[558.0s] and saw you like that.\n[559.83s] No makeup, nothing. Just\nwaking up outta bed, like, ugh.\n[563.31s] Would you feel comfortable\nbeing you? Being seen?\n[566.55s] If the answer is no, hey,\nyou''re not being real.\n[569.4s] You''re scamming. You''re trying\nto create a golden prison.\n[572.61s] The same as if you feel like your partner\n[574.26s] is outside of your league.\n[576.03s] That''s a golden prison.\nPrison of paranoia, not good.\n[580.14s] The same with your friends.\n[581.07s] If you''re like, \"Oh, if\nmy partner sees my friends\n[582.69s] and sees my life and sees my\nfamily and sees where I live,\n[585.57s] they''re gonna discover the real me.\"\n[587.76s] What are you doing?\n[590.01s] That''s the definition\ntoo of a social scammer.\n[592.83s] The social chameleon.\n[596.31s] You might think you''re\nwinning in the short term,\n[597.9s] but in the long run you\nare trapping yourself\n[600.63s] and it will not be good.\n[602.58s] So stop chasing the wrong\npeople. Put it out there.\n[605.16s] And if someone doesn''t\nlike it, that is good.\n[607.62s] Don''t take the people pleaser\napproach to relationships.\n[610.65s] Do you like me? Do you like me?\n[611.58s] Do you like me? Do you like me?\n[612.63s] Morphing who you are.\n[613.95s] Instead it''s \"This is me.\"\n[616.47s] And go meet people, put\nyourself out there, but screen.\n[620.25s] If I''m gonna meet all these people\n[621.45s] and I''m gonna determine very fast\n[623.07s] who I''m meant to get along with\n[624.39s] and who I''m not meant to get along with.\n[627.24s] But you''re not gonna be able to know that\n[628.83s] unless you put the real you there.\n[631.26s] Like say you''re into something very nerdy,\n[634.44s] you''re into a TV show or something,\n[636.84s] and that''s important\nto you, as an example.\n[639.27s] Well, if you don''t tell other people\n[640.26s] that you like that show,\nlike \"Harry Potter\",\n[643.14s] how are you gonna know if\nthere''s chemistry or not?\n[644.82s] You won''t. You''re delaying it.\n[647.16s] So put it out there from the start.\n[649.47s] Again, it''s simplifying it,\n[650.58s] but say every person you meet,\n[651.75s] you''re like, \"Hey, I like ''Harry Potter''.\n[654.18s] Hey, I like ''Harry Potter''.\n[655.29s] Hey, I like ''Harry Potter''.\n[657.39s] Well, you''re gonna see very\nfast who does and who doesn''t.\n[660.78s] Now people are hurt. \"They don''t?\"\n[663.57s] Well, good, you determine that sooner.\n[665.46s] What if you determine\nthat six months later.\n[667.77s] Hey, after six months of\ninvesting into a relationship,\n[670.627s] \"I don''t like ''Harry Potter''.\n[671.85s] And that was important to you.\n[673.08s] You just wasted six months of your life.\n[675.12s] It''s healthy and good to get rejected.\n[676.92s] You want to be rejected\nby the wrong people.\n[680.88s] If you don''t get rejected, that''s the sign\n[682.86s] you''re being fake.\n[684.09s] You should forever, ever get\nrejected by the wrong people.\n[689.43s] And that''s okay.\n[691.17s] That also comes with being authentic,\n[692.52s] being polarizing, pushing\nthe wrong people away.\n[695.64s] Just like a magnet.\n[696.99s] Attract the right ones,\npush away the wrong ones.\n[699.66s] If everyone likes you,\nyou have no polarity\n[701.94s] and you are ultimately being\nthe fakest person ever.\n[704.49s] The ultimate people pleaser,\n[706.2s] the ultimate social chameleon, okay?\n[711.84s] From there, don''t just\nbase your relationship\n[714.72s] on superficial things, it''s easy to do.\n[717.63s] So, especially if you''re just\nliving up here logically,\n[719.67s] you''re like, \"Okay, well\nthe relationship looks,\n[722.25s] et cetera, et cetera.\"\n[723.51s] And is that important?\n[724.56s] Yeah, to a certain extent,\nbut it''s more than that.\n[728.19s] Meaning, no matter how\nattractive you find your partner\n[730.89s] at first, after a certain period of time,\n[734.7s] that glamor will fade away\n[737.22s] and you''ll see them for\nthe human that they are.\n[740.82s] Let that land.\n[742.74s] No matter how attractive\nyou think your partner is,\n[745.68s] spend enough time with that\nperson, meh, just a person.\n[751.65s] It loses the glamor.\n[753.93s] One thing, the person who actually married\n[757.32s] my wife and I had us write down,\n[759.12s] and it was very helpful,\nwas make three columns.\n[763.17s] I''d suggest you all do\nthis too. Three columns.\n[766.02s] Column one, as you write down,\n[768.9s] you could say attraction\nlove, sexual love.\n[772.68s] What attracts you about your partner?\n[774.99s] So it could be looks, it\ncould be this and that.\n[776.82s] Like make the list.\n[777.99s] What turns you on about\nyour partner sexually?\n[781.65s] Column two, take away all the sexual side.\n[784.98s] What attracts you in terms\nof a person, a friend,\n[789.0s] shared values, et cetera, et cetera.\n[791.13s] And column three, what are you willing\n[792.45s] to sacrifice for this relationship?\n[794.79s] Getting really clear on\nthat helps tremendously.\n[797.61s] And to take it one step further,\n[799.08s] the way I personally view\nit is if you are going\n[800.94s] to enter a long-term serious relationship,\n[803.49s] instead of just thinking,\nokay, are they hot or not?\n[806.01s] View it as, I''m picking\nmy player two for life.\n[810.57s] Back to life being a video game.\n[813.18s] What''s a good player two to team up with?\n[815.91s] Especially if you''re going\nto have kids, by the way,\n[819.6s] because my view or description of kids\n[822.06s] is like signing up to start playing\n[825.18s] the most fulfilling and amazing\n[827.67s] and rewarding video game,\n[829.83s] but at the same time, that\nis extremely traumatic\n[832.32s] and horrible and stressful\n[834.0s] and low sleep, et cetera, et cetera.\n[835.44s] That will trigger every part of you.\n[836.82s] That''s having kids.\n[838.08s] And it''s a game that once\nyou start playing it,\n[839.94s] you can never stop until you die.\n[843.12s] And you can pick a player\ntwo, who would you pick?\n[848.22s] That''s it, that''s having kids.\n[850.62s] Same with a relationship.\nWho''s your player two?\n[853.5s] Imagine if you were playing a video game\n[854.88s] and you''re just like, \"Okay, player two,\n[856.98s] the only thing that\nmatters, are they hot?\"\n[859.869s] (audience laughing)\n[860.702s] Now that''s important too. Yeah,\nbut there''s more than that.\n[863.52s] Shared values, think too\nlong term in terms of kids.\n[866.55s] How are you gonna raise your kids?\n[868.44s] How are you gonna teach them\nin terms of life philosophies,\n[871.68s] religion, so on and so\nforth, parenting style.\n[875.19s] There''s so much to consider.\n[877.29s] So remember, zoom out.\n[880.17s] This really applies, once more,\n[881.1s] to serious committed relationships.\n[882.78s] But think about all those things.\n[885.12s] It''s all important, okay?\