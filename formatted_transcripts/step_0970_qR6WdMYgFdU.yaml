transcript: a person who had, you know, caused a bad situation for me and I was searching pretty hard for forgiveness. And >> and and what stood in the way of you being able to forgive that person? >> I think I felt like she didn't deserve it even though I was trying to forgive to help myself out. >> That's right. Forgiveness uh forgiving others is for yourself. if it's not for others. So what what was it about you that you felt you didn't deserve to be free from resentment towards anyone? >> Gosh, I don't I don't know. I haven't thought about that situation in in those kind of terms, I guess. >> But it's also not about the situation. um to to be able to forgive one person is to be able to forgive all people and vice versa because forgiveness is not something where you judge. You're not supposed to judge. Right? So when you say, "Oh, for this person in this situation, they deserve my forgiveness, so I can give it. But in this other situation, I can't give them my forgiveness. They just don't deserve it. It's just not right." That's not forgiveness. Forgiveness is no matter what, no matter why, no matter who, I wish you well. And we talked about wishing well before, right? Wishing well is to simply not hate someone. And also more specifically, do you not wish this person or any other person that they finally understand what is true and what is wrong? What is right and what is wrong? What is of goodness and what is not? Don't you wish for them to be able to tell the difference between those things in life? >> Oh, for sure I do. So, and and what's a bigger more valuable wish that you can wish to anyone than that? Is there a bigger wish than that? >> Not that I can think of. No. >> Yeah. And if we want that for them, just like the way I just said it now, if we want that for them, then that means we wish them well. And to wish someone well is to forgive someone, is to not hate someone because you wouldn't wish anyone well whom you hate. So as soon as you stop hating someone in this way um you are of love like for yourself you receive you are in a state as we talked about before love is not a feeling that love is not an emotion love is a state of being and that state of being is peace. So once you are able to wish someone well like that that means you are letting go of hate. And when you let go of hate you attain peace. And when you attain peace you you have forgiven that person and every other person because you can forgive 10 people and there can be that one person that still you have resentment and hate for and then you are out of the state of love. You are in the state of hate and resentment again. nonpieace and that's why we always say you cannot love anyone until you love everyone and to love is to wish well and to wish well is to forgive. So if you cannot forgive everyone, you can also in the same way not forgive anyone. And if you cannot forgive anyone, you cannot be in peace. >> Right. Yeah. I hadn't thought about it in terms of that I was holding back, you know, something something from myself and this other person, I suppose. >> Yeah. The reason you couldn't forgive that person is not because of what that person did. It's because of you could not overcome hate within yourself. And that hate within you has nothing to do with that person because they can only bring out something that's within you. They cannot create that. They cannot invent it. They cannot put it there. It was already there. And so whether this person or that other person provokes that resentment, that hate, that anger within you or another person, it doesn't matter. The the issue is in you. The hate is in you. If you had no hate, who could do what to make you a a person who was unable to forgive? That's why I always say whenever we get disappointed, we are wrong. Whenever we get offended, we are wrong. Whenever we are angry, we are wrong. Even if we are right, you know, even if someone does make a mistake and they cost you a lot of time, a lot of effort, a lot of money, um, heck, they even cost someone's life, let's say. If you get resentful towards that, then you're you're wrong still. Those two things are separate. The mistake is one thing that's on that person. It has nothing to do with you. They did that. They carried that out. It comes from them and it is um it mostly impacts them actually also. But the resentment you feel, the anger, the hate um that which makes you unable to sleep at night even that does not come from them. That's inside of you. And and everything we do, you know, everything that philosophy says, the religions really say, even though most people don't seem to see it that it's there, is about letting go of this hate. That's why Jesus said, "Put down your weapons." Because as long as you're fighting, you are hating. Without hate, um, what's there to fight? If everything is okay, if you're in a state of peace, the absence of hate, then there's nothing to fight. And so that's why he says, you know, he never says, "Beat your enemy and then be at rest and then be at peace. Overcome your challenges and then be at peace." No, he says, "Lay down your weapons. Don't even fight." >> Right? >> And so that's what we need to learn to do. Okay? And whenever you're ready to do that, you can forgive that person within you. And I think it's also healthy to go tell um the person because it's an opportunity for them to realize that the world um has released them. you know, people who don't yet understand that the world has no right, other people has no right to put requirements and obligations and um um duties on us. >> Mhm. >> Uh those people are somewhat helped by someone coming to them and saying, "I forgive you. You know, this thing that was over your head this whole time, I release you of it." And then maybe they can realize that wow if they can do that despite me having done the mistake or whatever uh maybe I can forgive people too >> and then the more people the more people that they release they'll realize wow this makes me feel at peace. It's nice for other people maybe potentially but that's none of my business anyway but it makes me freer. I am releasing anger, hate, resentment, regret, worry by releasing people out of my hate. >> I was forcing people into my hate, you know, cuz the hate isn't within me. The thoughts are within me. And I keep in my thoughts dragging that person and like dunking them into my hate. And that's how I spend my time. It doesn't do anything to that person. That's how I'm spending my time. And why would I do that? That's that's the opposite of peace. And so if you want peace, you need to uh love everyone. When you love everyone, you will forgive everyone and anyone. And when there's no one left to forgive, no one left to hate, then what else is possible than peace? Right. >> Yeah. I >> was just thinking about this person now and the question or the video about assigning roles to people. >> Same thing. >> I feel like maybe now, right, I have assigned a role to her as, you know, the bad guy or the the problem causer or the, you know, the whatever. >> That's exactly that's exactly right. Yeah. And that's why you have a problem. >> Even though problems are illusions, but you've made the illusion, so you're going to have the problem. And you're going to have that problem as long as you have the illusion. >> But you gave yourself the illusion and only you can take it away. Again, sometimes it can be interesting when someone else comes and and is able to say or do something that takes you out of your illusion. But still, what's the best? Who's the best person to do that? It's not anyone else. It's you, right? And you're a person who thinks deeply about things. You you don't need someone else doing that. And most people are unable to do it as you know. So, uh you don't want to rely on other people. You don't want to rely on having this random realization somehow. Um you can know this now.
