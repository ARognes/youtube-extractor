 actually happen in their day-to-day well yeah but then it wouldn''t fit into a roughly 1our session in my personal experience in order to a contributing member of the team there needs to be an enormous amount of onboarding before you can even expect to make an impact there you need to learn about the company the business the code base that it uses how the team uses different Technologies certain processes for development and More in fact my team at Netflix told me that it''ll take about 6 months to on board just because there''s so much stuff to learn all these factors are important because when you''re solving a problem you have to make sure that you''re solving the right problem so that you can arrive at the right solution contextual information can make sure that you do that because in software the devil''s in the details like as an extreme example imagine that as part of your interview you need to build a feature that allows a user to post a comment in order to build this you need to know how to install the codebase run the application make changes commit to the repo make a p request and send it to the right reviewer and then once it gets approved you need to make sure it gets deployed correctly not to mention you need to know or build the API that allows a user to post on a comment which then you have to know where in the codebase to go to for that and where to register that new API so that the clients can see it you get the idea there''s a lot that you need to know in order to be able to solve this problem each company and team does things differently so if this question was thrown at you during an interview it''d kind of be a miracle if you can get it done because being an engineer is not just about coding I actually really love how Sophie put it being an engineer is really about combining programming logic with business logic you are trying to build a sign up experience where when when you fill out this information and you click this button an account gets 