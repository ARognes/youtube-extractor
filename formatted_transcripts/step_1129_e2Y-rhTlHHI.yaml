ke Frameworks right so people have done all kinds of different Tech Stacks it''s become harder to to design a process that is perfectly fair for every single person but one of the pros is that it is actually quite equalizing in terms of the the engineering background that you come from so like no matter what text stack you''ve been on what language is your primary language right like typically you''re on a platform where you can choose from like 30 different languages which one and no matter which web framework you came from you can do kind of just the underlying raw coding exercise without being advantaged or disadvantaged from which previous experiences that you''ve had so in creating a data structures and algorithms type question what exactly does that look like well ideally companies would give a question that resembles a real world problem like for a frontend roll maybe it''s a tree traversal question because the page Dom is literally a tree and that''s really applicable for the job but maybe not a dynamic programming question because that''s not really applicable to most front-end roles often times you can make interview questions out of things you encounter at work sometimes those data transformation steps make make good interview questions because they''re super practical coming up with other interview question it''s a little bit more difficult and there''s definitely a bit of a challenge to make sure that they''re novel enough like I have some strong opinions about what makes good ones and in general rule number one is they shouldn''t require a cognitive leap some sort of a Eureka moment they should be solvable by bringing to Bear constructive problem solving techniques right you should be able to explore the problem and ask questions about the problem and then answer those questions your yourself it shouldn''t require like some clever shift of perspective to like suddenly see the elegant solution to the problem because then then it just becomes a a bit of 