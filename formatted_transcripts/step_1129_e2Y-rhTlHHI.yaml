p code if they can communicate technical topics fluently to a lot of different people and if they can take feedback on their code gracefully and so of course there''s other types of technical interviews to get signals for stuff like this pair programming interviews take-home projects life coding interviews technical behavioral questions because here''s the thing there isn''t a one interview question to solve it all there isn''t a one-size fits-all interview type that will Unbreak interviews entirely and that''s because every team every codebase and every company is unique I would really hesitate from saying there''s like a universally good interview format in which if everyone did this the problem is solved it''s also an evolving thing right just like any product development process let''s try something now that we''ve tried something the entire industry as a whole is realizing there are cons to the ways that we''re doing this right and so as an entire industry we''re all honestly trying to figure out better better ways to do that so I don''t think there''s a silver bullet and I also think that the right choice will differ from company to company how and what code gets built has real world implications like what business needs does that company have or what technical challenges does that codebase present or what Engineers are on the team and what kind of values do they have when it comes to writing clean code it would be disingenuous to create like a standardized test for whether a software engineer can really code because everyone is looking for something different of course every team and company has the responsibility to build out a thoughtful interview process that works for them and arguably some of them could really work on their interview processes but I don''t think technical interviews are entirely broken I think maybe they''re just not perfect and I''m not sure if they''ll ever be perfect across the industry because it all depends on the individuals teams 