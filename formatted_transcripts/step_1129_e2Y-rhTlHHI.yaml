nt kinds of technical interviews too there syst system design interviews live coding interviews perir programming interviews take-home projects and Technical behavioral interviews always test different skills for software engineers at different companies for different skills and at different levels all these interviews though are roughly trying to test for a similar thing you''re looking for constructive problem solving technique you''re looking for fluent coding and effective coding and in general I would call I would say that''s coding in a way that clearly communicates the idea or translates the idea from the problem solving phase into code in a way that avoids most of the bugs I mean we all write bugs right so like the expectation is not that there are zero bugs at the outset but it''s that you write your code in a way that shows that you know how to avoid common mistakes and then of course at the end you want the code to be bug free so there''s a there''s a testing component like can you now explore the code you''ve written effectively write the tests fix any bugs that are there that Daniel TOMCO a software engineer who helped craft a lot of Facebook''s interview process but by far the most common technical interview is the data structures and algorithms interview so I''m going to primarily focus on that one for this video meet Adam he''s a fourthe computer science student at the University of waterl and he is no stranger to technical interviews I''ve done technical interviews at like dozens of companies I guess like notable ones would be like Facebook and Citadel Shopify Square figma so like mostly on like the tech company some Thin tech company kind of range I decided to interview Adam to understand what the technical interview process is like for students who are entering the industry right now because you know the tech industry changes at like a rapid speed and I wanted to get a pulse I just felt that it was just luck basically that if you had seen the question on leak code before then you would be able to solve it I knew like to a certain extent that you could learn a lot of these Concepts and be able to do them but but it felt like it was such a grind to get to that point that and it was so unrelated to the job that you would be doing it wasn''t a great metric of my actual skills like I was confident in my abilities as a programmer uh especially like building apps and stuff but I wasn''t confident in my Elite code abilities and I thought how can that be like how can it be that I wouldn''t do well in the interview but I think I would do well on the job I also think that if you get a bad interviewer it can feel pretty disheartening if you go in and you you''re supposed to like this novel question that that doesn''t seem like there''s any way you could have figured it out and the interviewer isn''t trying to push you along and give you pointers and tips then like you''re going to walk out of that feeling like you got railroaded and I''ve had that happen a couple times where like afterwards I''m like I I don''t think there''s anything I could have done differently now in a nutshell from what I can understand from Adam and hearing from others who are breaking into Tech these are the reasons why technical interviews feel so broken they''re not a great way of assessing technical ability because what they test you on is so different from what you''re actually going to be doing on the job and that sometimes if you don''t get a great interviewer or an interview question it can be really disheartening and cost you the job I also asked people who were really well versed with technical interviews to get an opinion on the other side and you know what they said the same thing about them I think the biggest con it''s super obvious is that it''s not similar to day-to-day work it''s not similar in a a number of ways and the there''s just this incredulousness like comparing like okay if I can reverse a link list how does that inform whether I can change the background color on your website there''s kind of like a comical element to like the mismatch between between the interview process and then and then the job there''s a lot of like comical where people say that you know the tech industry is the only industry where the interview is the hardest part of the job and then after that it''s like way easier that''s Sophie Nadi the CEO of formation she''s conducted thousands of technical interviews at top tech companies and now helps people to succeed in them one you''re not typically under such intense time pressure two you typically have your standard IDE tools that you''re used to even with autoc complete or the syntax highlighting that you''re used to whatever tool you''re used to you''re usually not doing that sometimes you''re in a Google doc I''ve heard some companies do right so it''s just like not the ideal environment and then there''s a lot of categories of questions that aren''t similar to Logic on a day-to-day level so why might this be why do we use this as the standard interview process at different companies and why does it feel so broken could companies give better interview problems that give a sense of what the work is actually like and could companies provide better interview experiences for candidates by doing so this is starting to get out why technical interviews feel so broken and I think in order to understand this steep we have to look at it from the company side of what it takes to craft an entire interview experience because obviously when a company is going to hire for a new person they''re going to try to find the best person for the job and so there''s a whole process for this so in the interview process they''ll think about things like what question to ask the candidate to get the best signal what skills are they looking for in the candidate for this particular job what signals interviewers are looking for to evaluate those skills and how to conduct the interview in an unbiased and fair way that judges based on the performance in the interview and basically what all these boil down to are two things that companies really need to figure out how to evaluate the candidate and what to ask the candidate every job at a company comes from what''s called a job wreck or a job requisition which is when a hiring manager submits a formal request to create a new position within the company employee salaries are typically the largest expense for a modern-day tech company and so hiring managers need to make a case for why they want to hire another person they need to figure out what that person''s going to be doing day-to-day and what skills are going to be necessary to make that person successful maybe it''s the knowledge of a specific technology or the ability to work fast or being able to communicate different concepts with a lot of different people in order to figure out what they''re looking for companies and teams need to understand who they are first first they need a level of self-awareness and to be realistic about who they are in order to find this new team member concerted effort from engineers and Engineering leadership to think deeply about what makes people successful in that company''s environment what do they need to know coming in the door what can be taught on the job what skills are important what skills can we develop versus what skills do we need kind of coming in and then thinking about questions that test those skills and a method for evaluating what''s a poor performance on a particular skill versus a medium performance versus a high performance it has to be done really deliberately and just like the self-reflection that we do in our personal life this takes time and energy typically this type of reflection and effort is led by the hiring manager but it really needs everyone on the team including the engineers in order to arrive at some sort of consensus about who they are and what''s important to them some people think it''s HRS or human resour source''s job to do this but it really has to be the engineers themselves who are involved in this since they know best about what''s important to their job doing this work therefore usually requires several meetings brainstorm sessions documents and reviewing and giving feedback to those documents and decisionmaking and this is actually one of those places where interviews can break some companies and teams just don''t have time to do this kind of work or they don''t prioritize it because it takes time and energy away from development itself depending on the company culture advocating for this type of non-technical work from Engineers can be really tough because some people view Engineers primary role to be about building and designing code personally I think this is a great use of engineering time because hiring well means that you''re building stronger teams but even in my experience product work like shipping new features and improving existing ones always took precedence over other work like cleaning up Tech debt writing documentation or other intangible work honestly sometimes it felt like pulling teeth to try to be able to work on stuff that didn''t have a direct or measurable impact to the bottom line so I can totally see how this is barrier number one for how technical interviews can feel so broken but here''s the thing the work doesn''t stuff at just reflecting on what it takes to be successful at a company it then needs to be translated into signals for what to look for in a candidate to assess out whether they have those skills or not most of the time the end product is like a rubric or an evaluation guide that interviewers use to fairly and thoroughly assess someone''s skills usually there''s several categories that a candidate is assessed on using some sort of scale which ultimately ladds up to whether that interviewer thinks that the candidate would be good for the job I think what''s broken about coding interviews is if you don''t have a rubric that''s deeply connected to what''s required for Success on the job then you''re going to end up with a bunch of different problems number one you''re going to get the right people number two you may end up with a diversity problem because one one way like if your rubric is do they solve the problem your your Temptation might actually be to just ask really hard questions and if you''re asking really hard questions then you''re you''re avoiding false positives right well they solved this really hard problem so they must be good right but what then what you''re doing and that might be true but what you''re doing is then you''re selecting for people that either spent the last year on lead code or have a CS degree from a top-notch university and so you''re eliminating people that might actually have a lot of ability and might be great Engineers but maybe don''t have the same the same background instead if you have a really clear rubric across a bunch of different signal areas and then you''re evaluating against that very carefully then you can kind of unbreak the interview to some degree so let''s walk through one of these rubrics to show you what they look like medium posted their grading rubric for engineering interviews in 2016 it''s probably outdated at this point since it''s it''s 6 years old but I still think it''s a good example so let''s go over it the categories that they graded on in the technical interview are the ability to build software the ability to learn and teach and a values alignment in each of these categories they Define the signals they''re looking for during the interview for example in the category for the ability to build software they''re looking for someone who can demonstrate problem solving abilities code fluency autonomy has a basic understanding of computer science knowledge demonstrates resoluteness in finding a solution and for seeing your positions has strong skills in systems design they grade each on a fivepoint scale strong no no mixed yes and strong yes and give examples of what each look like in each of these categories so for example in problem solving a strong no is when the candidate is unable to conceive of any solution to the problem the candidate is able to describe a basic or naive approach but is unable to implement it and a strong yes is when the candidate clarifies the scope as a natural first step is able to articulate multiple approaches and describe the pros and cons of each makes a sensible decision based on the constraints of the interview format and is able to fully implement the approach without any real help from the interviewer the candidate recognizes edge cases and draws attention to them unprompted then solves them these Rubiks are really helpful in calibrating interviewers on on what a great interview looks like without a rubric interviewers might grade candidates on the wrong thing like things that are not that important to a company things like getting the right or wrong answer or getting to that answer in record speed at companies where they have these rubrics it''s usually a core group of really passionate people who want to improve the interview experience who make it but again in order to make one that fully aligns with the team''s goals and values it really does take time energy and effort not to mention what once this rubric is made there''s a larger group of interviewers that need to be trained to interview in a way that aligns with the rubric it takes a village to evaluate someone''s skills so everyone gets involved somehow whether that be Hosting technical interviews or behavioral interviews or doing phone screens or getting lunch with a candidate what many companies do is for interview training it ends up being a meeting with somebody from HR and that meeting is about the legal implications of interviewing so you can''t ask about this again you can''t ask about that and all of that makes sense and all of all of that is good that''s the company covering their butt and they should absolutely do that however that''s not interview training that''s legal covering of butt after that what do you do well how do you take this person who now knows the legal rules around interviewing how do you then turn them into somebody who knows how to evaluate a candidate for that role and that part is lacking at most compan companies that I''m aware of some companies will just have you like Shadow somebody who may or may not be good at interviewing themselves most of the companies that I''ve worked at don''t actually have like internally published like rubric and method to to their interview process it''s just sort of this word of mouth sort of training thing and it takes time to put that together and it''s engineer time which is expensive so we''ve already uncovered a couple of places where interview processes can break at a specific company evaluating what it takes to be successful there and what skills are necessary for the company turning it into a thorough rubric that aligns well with the team and training Engineers to interview well based on that rubric and looking for the right signals these are really important pieces of work that sure a hiring manager could take on entirely but in order to create a good process involvement from Engineers is crucial and unfortunately some leaders or managers or even Engineers don''t feel that this work is as important as shipping code this bias exists in a lot of places and each one of those need to be challenged on their own it takes time trust and a willingness from that individual or group to have their biases challenged in order for change to happen so you might have noticed that we haven''t even talked about the interview question itself yet and that''s because only after the reflection and rubric and training happens can you even begin to think about what question to ask to the candidate which brings us to the next part where I think interviews can break now before we move