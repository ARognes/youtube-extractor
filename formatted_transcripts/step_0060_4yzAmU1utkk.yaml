transcript: Ethan Evans, former Amazon VP, he has this saying, which is "Delivery is the currency of trust." And so, when they're asking this question when you made a mistake, typically, it's about a situation where you lost trust with someone. It's really easy to come up with a situation where you lost trust with someone because delivery is the currency of trust. It's basically, you didn't deliver. You didn't do the thing that you said you were going to do. Usually, there's a reason for it. And so, you can just state that reason, and then you can be like, "Turns out that was incorrect because there's just all this ambiguity and risk around us. We're not perfect people."
