transcript: Hey guys. So today you and I are going to talk about functional programming. So let's get into it. So the questioning question was, "Hi Frederick, what are the benefits of learning a functional programming language according to you?" This is a great question because I think that the answer is as simple as it's going to make you a better programmer. But I also want to say that even saying that doesn't really tell you much because it's the same thing you can always say, right? You can always become a better programmer by reading more books, programming in more different languages and stuff like that and so forth. Let me be a little bit more concrete about it. And that is that basically what I argue is that although the functional style of writing software is not necessarily the mainstream way of writing software in most corporations and even most companies honestly you're going to have to look a bit in order to find a company who uses functional programming languages to be for to start off with. don't have to have necessarily a functional language which is the thing that I want to hint at but for most intents and purposes functional isn't really all that adopted in mainstream at least web programming according to my experiences but the thing that a functional approach will teach you is how to properly think I argue at the very least think about functions how to use them effectively and how to do things like higher order functions and composition and so forth and so forth. And the reason why I think that that is very powerful is because one of the main challenges that I find with people who do object-oriented programming is that they're thinking of how to deal with abstractions is almost always limited to the class level. Now, why is that significant? I'm glad you asked because one of the biggest mistakes that I see quite a lot of object-oriented people make is that their dependency graphs are always based around the class as the minimum level of abstraction. And there's a few problems with that that I think is really nicely solved when you have a more of a functional approach and where you use the type system more effectively than you do usually with people who do traditional object-oriented web and so forth. So situation number one which I really like is that if you understand if you're say in JavaScript land this is pretty normal for you. Lambda functions for example that's really really great. I argue the same thing with higher order functions which I absolutely love where you can basically create a function that creates another function for some intensive purposes and so forth which is another style of writing software that can in many situations simplify your code. But if you're only ever thinking in terms of classes and methods, it's really common and I see it all the time where you have someone who creates an instance method on a class for something that is basically a static function or you know so forth and so forth. And then of course if you are really functional you will learn things about pure functions and how you can think about injecting values into pure functions as opposed to using things internally. One of the most classic issues that you have for example let's to give a silly trivial example time. One of the things that I see quite a lot of software developers do is that they instantiate a datetime object or something like that internally to some class something and then they're going to test it and they're having some problems usually with testing it because the time stamp is always changing of course during execution. But if you take on the approach where you inject everything that is quote unquote impure, which you learn with great example in a functional approach, you can limit the amount of complexity that you're dealing with. And when you truly understand how to use this idea of sort of separating that things into things that you need to do that are impure and add them as independ as a dependency then you in say JavaScript then you learn very quickly that it's kind of effective to just instead of like injecting a bunch of objects and stuff like that into your methods or your functions add a lambda function like it's I actually made a tech talk about that way way back for some summit that was like private summit something something where I tried to explain that one of the things that I think is up for grabs that would be really great if we adopted in the NodeJS ecosystem and so forth TypeScript and JavaScript and so forth would be that a lot of the great enterprise patterns with domain driven design and so forth and so forth aren't really as established I argue in the TypeScript and JavaScript community as I would like to because a lot of the C like and Java flavored languages and those communities they've sort of gotten that down like They're doing that by default most of them at the very least. The thing that I argue is that because they have a very strong background in objectoriented approaches to things going away a little bit now because they languages are more like they are like they're easier to I mean I still am not really 100% sure about the Java approach of doing lambdas. It's not my favorite way of doing it. C a little bit better if you ask me. But when it comes to the JavaScript community, we don't really have a strong background. Like honestly, guys, to this day, I still don't see most JavaScript developers use classes. They've been around for a while now, and most people are still just using functions, which I think is perfectly fine because most of the most of the time you don't really need a class. And this idea of reducing an abstraction to the bare minimum and the lowest level of an abstraction I argue that you can have is a function. And the functional people understand that really really well. And that is very powerful when it comes to injecting dependencies and things like that because especially when you're doing testing. It is a lot nicer in my opinion to be able to inject a function that represents a network call or some database access or something like that than it is to instantiate a whole object and inject that instead. You could literally reduce I don't know how much mocking boiler plate by just having that. that would be like that's how I like and in JavaScript plan that's feasible because we haven't really established those sort of patterns and it's sort of already there because we have this idea of callbacks and like the the the basic components are there. It's just I don't see people put them together in the way I would like to. But the long and short of it is that if you start learning a pro functional programming language or how to write in a functional way, you will get a wider array of tools in your like in your tool belt and composition and using like class functions as first class citizens and like uh what else? Higher order functions and things like that. These are things that even though I work in mostly objective programming languages, I use them all the time. Pure functions the same deal like this concept they will teach you to think a different way about your code that might actually make your object-oriented code a little bit cleaner and a little bit nicer. I still don't think that it's something you should do for career purposes. Although there are people doing F and HA hasll and so forth there it's not that widespread but the basic principles behind it they will teach you quite a lot. And me personally I'm not saying that we should go all functional or anything like that but there are some very useful tools in like the basic toolboxes that you can use as like that comes from the functional style of doing things. One of my favorite things that I changed about my own style of working when I started understanding that if you have a really strong type system, you get a lot of things for free. And this is my favorite tip. Like you know all those objects that you're creating that represents a request coming in from like a post or something like that on the web. Instead of having everything as a primitive like a string or something like that or a number that can be any range, create a type for it that in this case is a class for example that basically just makes sure that when you instantiate that value, it checks the primitive for it having the right length, the right formatting or like you might have reject validation and things like that or say it's a number and then the number can only be in a certain range. really ask yourself is this really just a primitive or is there a type here that I can create that represents a valid value. The reason why I think that is so powerful is because most of the bugs that you will find in production code is almost always either related to some you know programming error or so forth but a lot of the times it's about oversightes in the validation of the data and if you're getting the wrong data in it's easy for you to have bugs further on down in the system. So if your first move is always to try to convert all your primitive data into a strong type system, even if you don't use functional for anything else, that is going to help you with a lot of bugs and a lot of issues. So what I want you to take away from this is that the reason I think you should learn functional programming is not necessarily learning, you know, a functional language just because it's going to give you a job or something like that. It's more like traveling or learning how to speak a second language or something like that. It will educate you in a way where you will think in a different way about the software that you are writing and you're most likely going to pick up some useful tips. Like my favorite one is I say my personal insights. They're not universal. Other people might get other things from it is the value of having a really good type system. The value of higher order functions and things like that. These are very good things and pure functions. Of course, these are some of the main topics that you will learn about in a functional style of working. And I think that regardless of what type of programming you're into, these will be very useful tools for you to know about when you start writing the code that you are writing for commercial purposes or whatever you're doing, even if you don't necessarily commit fully to a functional language as a career choice. Have a great day.
