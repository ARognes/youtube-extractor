u test it and then it works and then you commit it and then that's done. Like if that's your flow, like that is dreadful. Like that's really bad because the thing is what's missing in that flow is you being able to be like, no, that code is terrible. Because you don't know. You're learning programming. You might not even read the code that AI made because you don't understand it. Or like how would you know that you can't like be creating and populating a new STD vector inside like a hot loop? Like you won't be like, yeah, bro, the memory allocation there is wild. No, you won't say that because you don't know anything about it. So therefore AI just does its own thing and you're like, well, it works. And so you wind up getting into that like state of yes, the code works and it's functional, but it's nowhere near like production grade. It's nowhere near like ready for publication. And there's also probably so many edge cases or it runs really slowly. And to an extent, you could go back and you could ask AI to be like, okay, well, here's a prompt or here's some guidelines that I got from a senior engineer that says that like I need to tell you that you can't allocate memory in this function or you can't do this and that. That would probably work to some extent, but it's like you're flying blind. It's like you don't really know what's what the output is. You can't verify the quality of the output if you're not experienced enough to do that. If you haven't gone through that yourself. And that's where I think it's worrisome. That's a worrying thing because the next generation of software engineers who maybe have been brought up in an environment where they do use AI a lot, can wind up in a state where like they have a portfolio that looks pretty sweet, but they don't actually understand how anything works. You know, it's kind of like you and me potentially, uh you know, I don't know who I'm talking to, but like we'll say you and me who are like maybe have over a decade of 