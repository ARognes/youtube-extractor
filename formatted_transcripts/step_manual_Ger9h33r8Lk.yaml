transcript: '{"content":"\n[0.16s] We often equate wisdom with\n[2.24s] intelligence, a high IQ, academic\n[5.04s] degrees, or simply having a good memory\n[7.68s] for information. But the Buddha had a\n[10.559s] radically different understanding.\n[13.44s] So in this video, what we''re going to do\n[14.96s] is explore how the Buddha redefined\n[17.76s] wisdom as something much deeper than\n[20.16s] these kinds of worldly successes.\n[24.24s] In one suta in the Pali tradition, the\n[26.24s] Buddha has a discussion with the Brahman\n[28.88s] Vasakara, chief minister of Magada about\n[32.32s] the qualities of a person with great\n[34.399s] wisdom.\n[35.92s] Now, this this discussion contrasts two\n[38.399s] very different views of what wisdom\n[41.44s] really is.\n[43.36s] Vasakara begins by outlining a quote\n[46.16s] great person with great wisdom as having\n[49.6s] four key qualities.\n[52.0s] First, they''re very learned in diverse\n[54.48s] fields of learning.\n[56.719s] Second, they understand the meaning of\n[58.96s] diverse statements, saying this is what\n[61.76s] that statement means. This is that is\n[64.4s] what this statement means.\n[67.52s] Third, they''re mindful. They''re able to\n[69.52s] remember and recollect what was said and\n[71.92s] done long ago. And fourth, they''re deaf\n[75.84s] and tireless in their household duties,\n[78.479s] understanding how to go about things in\n[81.04s] order to complete and organize the work.\n[85.04s] Now, Chief Minister Vasakara''s view of\n[87.439s] wisdom is centered clearly on learning,\n[90.4s] on intellectual mastery, on worldly\n[93.6s] successes and duties, and we might even\n[95.6s] say worldly successes in our work. It''s\n[99.119s] a view recognizable even today.\n[103.04s] Then in this suta, Vasakara turns to the\n[105.92s] Buddha and asks him if he agrees.\n[109.92s] The Buddha''s response is, I think, very\n[112.56s] interesting. The Buddha says he neither\n[115.04s] agrees nor disagrees.\n[117.52s] Instead, he puts forward his own view of\n[120.479s] the four qualities that make a great\n[122.719s] person with great wisdom. The Buddha\n[126.0s] says first it''s when someone practices\n[129.2s] for the welfare and happiness of the\n[131.36s] people. They''ve established many people\n[134.0s] in the noble system that is the\n[136.239s] principles of goodness and skillfulness.\n[140.959s] Second, they think what they want to\n[143.12s] think and don''t think what they don''t\n[145.2s] want to think. They consider what they\n[147.76s] want to consider and don''t consider what\n[150.08s] they don''t want to consider.\n[152.64s] Thus they''ve achieved mental mastery of\n[155.92s] the paths of thought.\n[158.879s] Third, they get the four absorptions,\n[161.76s] blissful meditations in this life that\n[164.239s] belong to the higher mind. These are\n[166.319s] known as Janna. They get them when they\n[169.519s] want without trouble or difficulty.\n[173.2s] And fourth, they realize the undefiled\n[175.84s] freedom of heart and freedom by wisdom\n[178.56s] in this very life. and they live having\n[181.12s] realized it with their own insight due\n[182.959s] to the ending of defilements.\n[186.08s] Now I think we can see this is a very\n[187.84s] different understanding of wisdom than\n[189.92s] that of Vasakara.\n[192.64s] In this discourse, the Buddha shifts the\n[194.8s] focus of wisdom away from what we might\n[197.519s] say is external knowledge or external\n[200.64s] abilities\n[202.159s] towards something more internal, ethics,\n[204.4s] and an internal kind of transformation.\n[208.0s] That is in the Buddha''s view, true\n[210.4s] wisdom isn''t about knowing facts. It''s\n[213.76s] about knowing what leads to happiness\n[215.44s] and freedom from suffering.\n[218.159s] True wisdom, therefore, isn''t so much\n[220.64s] about being successful in our duties as\n[223.44s] it is about helping others, helping\n[226.239s] others become better and happier people.\n[229.84s] True wisdom isn''t about having a great\n[233.599s] compendious memory of what happened in\n[235.92s] the past, but rather it''s about mental\n[238.72s] mastery and focus. Focus on here and\n[242.159s] now. And I''m going to talk about that in\n[245.04s] a moment. This is wisdom understood as a\n[248.239s] kind of practical skill. That is the\n[250.959s] skill of living well and of guiding\n[253.519s] others to do the same. It''s not an\n[256.16s] intellectual nor a scholarly\n[258.479s] achievement. And importantly, this kind\n[261.84s] of wisdom is not limited or open only to\n[265.52s] monastics.\n[267.12s] Even the householder chitta was\n[269.52s] considered wise. I did a video about\n[271.919s] that in the past. He was considered wise\n[274.72s] enough. In fact, the Buddha called him a\n[277.44s] standard and measure for lay disciples.\n[280.88s] Just as the Buddha''s disciple Sar Puta,\n[284.24s] who was considered the foremost in\n[286.08s] wisdom among his disciples, was a\n[288.88s] standard and measure for monastics.\n[292.96s] Now, what about this mental mastery?\n[295.199s] This idea of mental mastery. In one\n[298.32s] early suta, the Buddha talks about a\n[300.56s] time before he was enlightened when he\n[303.28s] became aware that his thoughts could be\n[305.759s] divided into two key types.\n[309.6s] One sort of thought was, as he says,\n[312.0s] sensual, malicious, and cruel.\n[315.68s] It blocked wisdom. And I think we can\n[318.639s] all be somewhat familiar with these\n[320.32s] kinds of thoughts.\n[322.24s] The other sort of thought was of\n[324.56s] renunciation of goodwill and of\n[326.8s] harmlessness.\n[328.96s] And the Buddha to be that is the\n[330.88s] bodhicattva at the time determined to\n[333.52s] give up and eliminate the first sort of\n[336.16s] thoughts and to cultivate the second\n[338.479s] sort. And this was in a way the\n[341.84s] beginning of his real practice towards\n[343.919s] enlightenment.\n[345.84s] So what does this distinction teach us?\n[349.6s] It teaches us that the wise person knows\n[352.479s] how to restrain and refocus their\n[354.72s] thoughts on those things that are most\n[356.96s] beneficial.\n[358.96s] They don''t chase every idea, nor believe\n[363.44s] everything that they think or everything\n[365.36s] that arises in their minds, but instead\n[368.4s] they work to guide their minds with\n[370.72s] clarity and with purpose.\n[373.68s] This ability to calm and tame this\n[376.639s] monkey mind of ours is associated with\n[379.84s] success in meditation and in particular\n[382.96s] it''s associated with deep absorptive\n[385.6s] meditations like janna that the Buddha\n[388.72s] mentioned above or before when we\n[390.72s] discussed it. These are these uh deep\n[393.199s] absorptive meditations that can lead to\n[395.28s] a pleasant abiding here and now.\n[399.36s] Now we might ask if these two vi views\n[401.84s] of wisdom, these two visions that is\n[404.16s] vasakaras and the Buddhas are in some\n[406.96s] way compatible or if they''re completely\n[409.12s] incompatible.\n[411.199s] It''s important to keep in mind that in\n[413.199s] stating his the Buddha''s views on what\n[415.44s] makes a wise person, the Buddha does not\n[418.4s] reject Vasakara''s views out of hand, but\n[422.479s] neither does he accept them precisely.\n[426.08s] Instead, I would argue that the Buddha\n[428.479s] puts worldly knowledge in its proper\n[431.84s] place. After all, worldly knowledge is\n[435.199s] not a bad thing for the Buddha. It''s\n[437.68s] very useful to be learned in diverse\n[440.08s] fields.\n[441.599s] It''s useful to be able to understand\n[443.759s] diverse meanings.\n[445.84s] It''s useful to be mindful and to have a\n[448.639s] great memory, a compendious memory.\n[451.759s] And it''s useful to be deaf in our\n[453.68s] duties.\n[455.44s] So all of this worldly knowledge is\n[457.599s] useful, but as the Buddha sees it, it''s\n[460.88s] also fundamentally limited. That is, it\n[464.08s] doesn''t necessarily free us from\n[465.759s] suffering. And such worldly knowledge\n[469.68s] can even increase our conceit and our\n[472.479s] attachment if we identify with being\n[475.759s] clever or intelligent or good at our\n[477.919s] work.\n[479.84s] Wisdom in the Buddha''s sense is grounded\n[482.319s] in ethics and leads to peace.\n[486.24s] One suta that integrates these two sorts\n[488.96s] of wisdom actually is the so-called\n[491.759s] great suta on good fortune that I wrote\n[494.479s] my book about which I have a copy of\n[496.4s] here. This is the book um many of you\n[499.28s] will either have a copy or know of it.\n[503.039s] uh this suta that I wrote my book about\n[505.919s] uh and uh included a translation which\n[508.319s] is largely derived from Bikubod''s\n[510.639s] earlier translation. This suta provides\n[512.959s] a fully integrated path for achieving\n[516.24s] what we might call good fortune or true\n[518.959s] benefit in our lives.\n[521.599s] It begins with such worldly wise\n[524.56s] practices as being educated, being\n[527.6s] disciplined, having training and and\n[530.8s] having an honest occupation.\n[533.68s] And it ends up with our seeing of the\n[536.399s] noble truths and realization of\n[538.959s] enlightenment\n[540.88s] understood in this kind of light. It''s\n[543.519s] not so much that knowledge or education\n[546.16s] or deafness in work is entirely\n[548.959s] unrelated to wisdom. And in indeed for\n[552.24s] this reason, the Buddha did not reject\n[554.24s] Vasakara''s views out of hand.\n[558.16s] Rather, it''s that these aspects of of\n[561.36s] what we might call worldly wisdom are\n[564.08s] more like the preliminary steps that\n[566.48s] provide a solid base along with ethical\n[570.0s] practices of course that can allow us to\n[572.72s] progress towards true wisdom.\n[576.8s] So long as we can understand the\n[579.68s] limitations and drawbacks of of this\n[582.16s] kind of approach.\n[584.56s] So intelligence, knowledge, and worldly\n[587.2s] skill definitely have their place. But\n[590.24s] for the Buddha, wisdom is about living\n[592.959s] well and helping others to do the same.\n[596.64s] Not simply about knowing things and\n[598.959s] being a diligent worker.\n[601.6s] True wisdom for the Buddha means ethical\n[603.76s] conduct, mental mastery, and eventually\n[608.08s] complete freedom from clinging and\n[609.839s] egoistic identifications.\n[612.64s] And the good news is that this kind of\n[614.48s] wisdom that the Buddha was after is\n[616.64s] available to everyone right now in how\n[619.519s] we choose to live our lives. What do we\n[622.72s] choose to emphasize?\n[625.12s] How do we frame our successes and our\n[627.6s] failures?\n[629.6s] What is one area in your life where you\n[632.48s] could practice this deeper kind of\n[635.04s] wisdom today? So the question is how do\n[638.16s] we integrate our worldly skills with\n[641.839s] this deeper wisdom with this deeper\n[643.519s] wisdom that the Buddha''s pointing us\n[645.2s] towards. One of the best road maps uh as\n[648.88s] I''ve said is the great suta on good\n[651.6s] fortune and I discuss this integrated\n[654.399s] path in my video which references my\n[657.519s] book. The video is called finding our\n[659.519s] good fortune in early Buddhism and I\n[661.76s] suggest you take a look at it right now.\n[663.76s] It''s on the screen as we as we speak. If\n[666.8s] you''re getting something out of these\n[668.48s] videos, of this approach of mine,\n[670.24s] consider taking a look at my Patreon\n[672.16s] page, which is linked up here on the\n[674.16s] screen and down below in the notes, and\n[675.92s] see if you want to help support the\n[677.279s] channel and the work that I''m doing\n[678.88s] here. Thanks for watching, and we''ll\n[680.88s] catch you on the next video. And\n[682.24s] meanwhile, all of you be"}'
