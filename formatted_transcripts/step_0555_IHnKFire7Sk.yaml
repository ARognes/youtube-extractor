transcript: Hey guys. So today you and I are going to talk about Tang developers. So let's get into it. So the question in question was, "Hi Frederick, I spoke to a friend who said that Google's founders are really great computer scientists but mediocre software developers." He has worked at Google and he believes that fang lacks competent fang companies lack competent software developers. Do you agree? This to me is a little bit like all those times I've been in well when I say all those times I can count on my five fing fingers guys how many times I've been in a sports bar maybe not even a full hand is needed but for some reason there's always two guys who's sitting there and jelling at the screen of whatever team they're rooting for saying what they should be doing or they should be doing this they should be doing that and so forth and so forth. And I always I've never done it because I just don't have it in me. But I've always wondered what would happen if I went up and said, "Why are you not being the why are you you should clearly apply to be the coach? You seem to have all the right ideas of how they're going to win this thing because clearly you are the experts on this topic." right now in this situation, it's probably a little bit of this and a little bit of truth to it as well because as with many things that gain popularity among the masses and becomes sort of a brand name and or a household name perhaps you over like you overestimate how great things are. you project basically what is it they say 20% the average person is going to project like better or worse depending like if something is bad you're always going to add at least 20% of how worse how much how horrible it's going to be in comparison to the reality same thing here 20% more is very very common here where you believe and my little channel here is I would say little bit of proof of that because I got I get tons of questions like this. You believe that all the great software developers of our time seem to be working in a fan company. And I always try to remind you that quite a lot of the best of the best don't work for fang companies. That doesn't necessarily mean that there are none in there because there are tons of great people. And considering that they have some of the most used IT systems in the world and so forth and so forth, that does indicate that there is at least a few people there who knows who know their stuff. But as with every organization guys, you will have some people who are really really really great and you have will have people who are not so great because sadly enough it's this is not like sports where when we screen people we basically we're basically breeding athletes from birth or well from a very young age to be top performers. Software developers don't do that. So we're going to have a bit of a mixed bag. usually in terms of the quality of the software developers and then of course we have to factor in the managers that's also a very important thing who is doing the hiring and I can tell you right now that on average when you go into larger corporations or anything similar to that you're going to find doesn't necessarily have to be a large corporation by the by but you will find that there's a lot of very very mediocre sometimes really really bad software developers working for very big brands. And the main reason being because they are in the bag of people that you can pick from when you're hiring people. And if the person who's picking people out of the bag and trying to put them in the company don't know what they're looking for, then that is what's going to happen. And as you can imagine, for a company the size of Google or Facebook or so forth, you think that they'd have a policy where we're only going to hire ex super rockstar software developers as our managers. Of course not. They're going to hire people who are again hired by other people who like all the way up until you get to the top of the pyramid, right? Like it's almost impossible, guys, to secure that you're only going to get good people in. And of course, if you believe that by working at Google, then you sort of work with everybody. Uh I find it hard to believe that a single individual will give you an accurate estimate of how it's in general working. I'm definitely sure that when it comes to company policies and their departments and things like that because Google is at the end of the day, it doesn't matter if it's Google, Facebook or whatever, it's a large corporation. And from my experience, at the very least, practically everything is identical in large or large large corporations when it comes to the daily grind. I've never seen it differ like internal systems absolutely and like policies of for certain things differ quite a lot, but the daily grind is still the same. And it's down to the same damn thing every single time. I've never seen it fail. It's exactly the same for me. I can honestly say that apart from of course process and lead times and you know all this bureaucracy and stuff like that the difference between working at a large corporation and working in a small startup is it's I I can't even sh I don't even feel the difference. And I suspect that the same thing goes for my friends because I actually have friends who work for fing companies who I would count are pretty gosh darn good at what they do and they say the same thing. Like for them working at Google versus working at one of the other companies they worked for before they went to Google isn't a gigantic difference in terms of like the daily grind and what you're doing and so forth and so forth. So I think you should say take what your your friend here is saying with a bit of pinch like a little pinch of salt because it is very easy to believe that what is true for you and your experiences is true for everything and that that is like some general rule because you have observed a certain pattern and that is what we call a bias and we all have them and it's very very easy to get them and if you're levelheaded you should probably start thinking whether or not your bias is actually really as true as you believe. Or it might be that there are certain conditions or certain areas where you are right about what you're saying and in other under under circumstances or other parts of your organization or whatever you believe it might not be as true and that is nuance. Nuance is great to consider before you start making sweeping statements. So what I want you to take away from this is that no I don't believe that fang companies lack confident software developers because so far I've never been in a single soft in any team guys in any company where literally there's just no one in the entire organization who's competent at what they do. there's always someone and there breaks your their their rule is broken, right? But at the same time, I'm fully aware of and I think a lot of people are who work in the industry and have been around for a while that the ratio of really great people or good software developers to really shitty ones is pretty sad. It's very common that you don't really have all that many competent people. My argument is as usual because when you're hiring people, you need competent people to hire good people, which is not what's happening on the at the average company. And the reviewing processes and screening process and so forth and so forth are usually not done by the best software developers on hand. And even if you do have the best software developers, they also make mistakes. And they're also going to have to go with some gut feeling and so forth. So when you've done the reviewing process and sort of say hi this person or not and that's common that's true for every company guys you I promise you you will not be in a single especially the large corporations where there's not like a range of how good people are the average can be pretty good if you're really lucky but due to internal politics bad hiring like having like rapid projects that need to be developed and you're taking cheap labor from somewhere or like consultancies or so forth and so there's a range of reasons as to why your personal experience in a company might be really poor where you have a team that isn't all that great or you run a system that isn't really prioritized and so forth and so forth where internal politics has more to do with that you're dealing with really bad software developers perhaps rather than that everybody is bad at the company and that's what I would remind people that especially your friend here. If it is true that most of the software developers lack any competency, well, maybe they not they're not filling your criteria for what high competence is, but let's at least admit that first and foremost, I have so far never spoken to a software developer who didn't feel that something is shitty about their system. Yet they, as I remind them, you're working at a multi-million dollar company who is making millions and millions and minutes off that shitty quote unquote software. So yes, you may feel that it's a shitty system, but there's quite a lot of people are paying for it. And the question is then is it really the case that it's so shitty or is it just that you feel that it's really really shitty because your standards are higher than what the common p common people would consider a shitty system. Have a great day.
