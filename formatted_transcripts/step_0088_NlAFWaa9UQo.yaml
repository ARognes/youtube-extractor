transcript: 'Hey, it''s Mark. This is not like a real episode of GMTK. It''s just... I was working on the  video about GTA3 and memory and streaming and I used this short clip  from Cyberpunk 2077, and was like, "Oh yeah, that was from that super impressive montage sequence. Wait. How  did they pull that off?" And basically, the only way to  not get distracted and go down another rabbit hole while I was  already going down a rabbit hole was to promise myself I''d look into  it as soon as the GTA video was done. So. Here I am. Okay, let''s have some context. After you finish the prologue,  whether that''s for the Nomad, Street Kid, or Corpo Life Path, we get  a sequence that follows protagonist V and best buddy Jackie Welles  across six months in Night City. And it''s this super cinematic  montage that jumps from location to location and from scene to scene as  it depicts their successes and setbacks. This whole sequence is about  one minute twenty seconds, and it has fifteen location  changes, seventy-nine cuts, three mirror scenes with three different  costumes, and about forty-five unique NPCs. Now the sensible thing to do,  from a technical perspective, would be to just do it as a pre-rendered video. Like take Expedition 33. Most of the cutscenes in this game are  done in engine, but for this scene, which is a montage of the group collecting  Chroma from all around The Continent, the developer just plays  a pre-rendered video file. But Cyberpunk''s montage is entirely In engine, which means it''s happening in  real time in the game itself. That''s what makes it so impressive. Now probably the most impressive part  is the sheer number of locations. This sequence takes us from a street in Japantown  to Mama Wells'' house to Lizzie''s Bar, to a basketball court in Heywood, a car dealership,  Misty''s shop, Viktor''s Clinic, a random alleyway, a nightclub, back to the Welles''s, then to  a garage, to a gun shop, another alleyway, back to the Welles''s one last time to move  out, and then finally to V''s apartment. Phew! This is a whistle stop tour of  Cyberpunk 2077''s open world. But as we know from the GTA three episode,  it''s not advisable to move so quickly between locations as the streaming tech  needs time to load in the next place. I mean, look how long it takes to  swap between protagonists in GTA V. It''s quick, but there''s still a big delay  to load in the assets for the next area. They''re certainly not doing it in a single frame. So how does Cyberpunk do it? Well, I decompiled the source code...  and no, just kidding, not this time. I just installed a bunch of mods. One of which let me pause  the montage and fly around, revealing that we''re not in Night City at all. It''s actually a special back lot hidden  away in the far corner of the world, and it contains all of the places  we''ll visit in the montage. Like, here''s the street in Japantown. But it''s just a small part of that location. There''s nothing to the left and  right of V''s starting point, and if you travel to the end of the road,  you''ll quickly reach the bounds of the world. And if you turn around, hey,  that''s Mama Welles''s house. There''s also the basketball court,  the alleyways, and the gun shop. The nightclub is floating  directly above the Wells''s house, and the car dealership is  sitting on top of the club. Then as the scene plays out, V will teleport  from area to area in order to swap location. All while the game snaps between day and  night, depending on the current scene. So the benefit of doing it like this, instead of literally moving around the  real Night City is that we only need to worry about streaming the assets we need  for this montage sequence and nothing else. Like this scene''s environment designer says "it  was quite a challenge to make the streaming load in such a fast pace, but each scene was optimised  and close to each other, to facilitate streaming". And you can see how CD Projekt Red aggressively optimised these scenes to keep  everything as lean as possible. They used low-poly models and textures  for stuff in the distance, and they didn''t include things you can''t see, like side  rooms or the backs of certain buildings. The montage also implies more life  and detail than it actually shows. For instance, this scene at the very  beginning makes it look like you and Jackie are walking through a bustling city street, but it''s actually just a bunch of low-poly  cars covered up by a smoke particle effect. And literally four NPCs. The rest of the street is completely  empty, but it feels alive in the moment. Speaking of NPCs, the game also loads  all of them at the start of the sequence. You can find them just hanging  out, ready to pop into action. They''re also often on top of each  other, which looks pretty funny, or just floating in space below their spawn spot. But by loading them in early,  we can avoid that nasty thing when a character''s model loads a  few frames before their texture. The montage also uses cuts, which makes  it look like time has been compressed. For instance, in this scene with the arms  dealer, it looks like V and Jackie are trying all sorts of different weapons, with  chunks of time cut out between movements. But in reality, all that''s happening  is that the characters are teleporting to new locations and starting new  animations, which looks like a jump cut. It''s the same thing that powers this  funny animation in Super Mario 3D World. Then there are the mirrors. Ah, so this is why the scene  couldn''t be pre-rendered. It features the player character  who is completely customisable. So every version of this montage is unique. But yeah, mirrors are as much of a technical  challenge as streaming in the world. But by going out of bounds, we  can see the trick in action. So Jackie''s room features a mirror  but it''s actually not a mirror at all. It''s a window to an identical copy of  Jackie''s room on the other side of the wall. And so when you''re looking in the mirror... Jackie and a clone of V exist in the mirror room,  while the player character is in the real room. And then when Jackie grabs you by the shoulders, he instantly teleports from the mirror room  to the real room to make this shot work. Clever stuff. Though, admittedly, not that new. It''s the same technique that gave us the  mirrored room in Super Mario 64, after all. And so, with these tricks, right, the  fake Night City set, the spawned in NPCs, the staccato animations, and the  mirrored rooms CD Projekt Red pulled off a real time cinematic montage that  plays out perfectly every single time. Okay, yeah, okay. We can''t talk about Cyberpunk 2077 without  talking about its disastrous launch. It''s no secret that this game was full  of bugs and issues and unoptimised code, and it ran like an absolute dog on platforms  like the non-Pro PS4 and the Xbox One. And this sequence was certainly not immune. You''d see pop in, weird lighting  changes, low poly models and textures, Jackie just being straight up  invisible, and other issues. But after a lot of updates and patches, this cutscene does now work  pretty much flawlessly in 2026. On PC, at least. Well, almost. This character''s coat still renders in  front of the smoke, which is hilarious. And if we''re being really nit-picky, then why are the posters in the  mirror not flipped horizontally, eh? Is that some super clever 2077  technology or just a mistake? Anyway, there we go. That''s out of my system. I can stop thinking about it. I know how it''s done now. And now, just because this took a ridiculous  amount of time and hackery to produce, I''ll end with the full cutscene, but this  time from a fixed camera perspective. Thanks for watching. See you soon. DJ: Stanley here with ya, and we got another  day ahead of us in this city of dreams. Oh, I love this town. Love it like you  might love a mother who popped you out on the steps of an orphanage once and now  stops you to ask if you got a smoke for her. Every new day here means a hundred new arrivals. But only half these gonks will survive  a year. And that''s if it''s a good one. And why do these peeps come to NC? Well, to be street samurai like  Morgan Blackhand, and Weyland Boa Boa. The greater the risk, the bigger  the bounty, kids. Or so they say. But you can only be a major  league player for so long. The faster you live, the faster you burn out. If you don''t get a bullet to the brain first! NC''s legends: know where you''ll  find most of them? The graveyard. Matters not where you''re from. Matters not where you start. What matters here is the walk you walk. In Night City. The city of dreams.'
