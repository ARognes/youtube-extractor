transcript: Hey gamers, today I'm releasing Brain School, a deduction puzzle game. In Brain School, you have to decipher a code made up of a set of playing cards. You do that by asking [music] questions such as where is the card with the lowest value or what is the sum of the spades cards. You have to beat a few different [music] rounds to win the game. And after each round, you can get some cool knickknacks which change the rules of the game. There are also a few different game modes and challenges you can try out. I originally made this game in just a few days for my partner. [music] It is based on a two-player card game that we were playing back then, which in itself [music] is based on a mini game which was played uh in one of the episodes on [music] Devil's Plan, which is a Korean reality game show. Anyways, we were having a lot of fun with the game, so I decided to turn the game into a full release and share it with you all. You can grab the game on H.io and Steam, and if you're a patron, be sure to claim your keys on our website. Um, yeah, have fun puzzling and happy holidays.
