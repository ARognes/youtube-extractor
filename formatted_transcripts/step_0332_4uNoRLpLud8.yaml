transcript: And and and I'd like to think, I'd like to hope at least, that people who know what they're doing are still important in the world. That like that I want to hire people because I don't care if they're using AI or not. I need somebody to be responsible for this product. I need to tell you, "Hey, we need you know, two-factor off built into this thing, and it needs to get done, and it needs to get done right." And I'm going to ask Jeremy to do that, not Claude, because I need Jeremy to be responsible and own that at this company. You know? And I need a developer to do that. So, I need somebody to do that, and I think that's just true generally of work. We need people to talk to and to be responsible for things, and and all this type of stuff. Just because the the technical bit is maybe a little easier than it used to be is not like a complete story of employment. So, I'm optimistic in that way, that we need we need responsible people to be doing the work.
