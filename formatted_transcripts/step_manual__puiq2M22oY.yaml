transcript: '{"content":"\n[0.0s] A lot of people, their company pushes\n[2.52s] them into management, but they don''t\n[4.88s] really set the expectation, \"Hey, if you\n[7.16s] move into management, you know how as a\n[8.4s] developer, you have to practice\n[10.52s] programming, and you have to learn new\n[12.84s] skills,\n[14.16s] and you have to read up on new, you\n[16.08s] know, documentation, and try new\n[18.2s] techniques, and adopt test-driven\n[20.64s] development, and learn about continuous\n[22.44s] delivery, and, you know, explore, if\n[24.32s] you''re doing data science,\n[26.12s] you know, different types of forecasting\n[27.76s] algorithms and things like that. Well,\n[29.8s] management''s no different.\n[41.88s] Are you considering switching into\n[43.36s] management coming from being a\n[44.92s] programmer or in DevOps or data science\n[47.76s] or some other individual contributor\n[50.16s] type of technology position? Well, in\n[52.6s] this episode, I''d like to share with you\n[54.44s] some of the things that I''ve learned are\n[56.32s] really important skills that you need to\n[58.72s] develop to be a really great and\n[61.44s] effective manager. These are the things\n[64.0s] that, unfortunately, I see a lot of\n[66.28s] people that get promoted, they aren''t\n[68.4s] taught this, they aren''t told this,\n[70.72s] expectations aren''t set with them. \"Hey,\n[73.68s] if you decide to move into management,\n[75.64s] here''s what we''re going to expect, and\n[77.68s] here''s what you need to get good at.\" I\n[79.24s] think they just expect you to learn this\n[81.76s] by osmosis, watching with other what\n[83.88s] other people do. So, I''d really like to\n[86.76s] share these things with you with the\n[88.28s] hope that if you''re on the fence, if\n[90.64s] you''re trying to decide, \"Is it time for\n[92.8s] me to switch into management?\" This can\n[95.2s] ease your mind or at least let you know\n[97.8s] what you''re up against. And I did do an\n[100.48s] earlier episode on the show where I\n[102.92s] shared five signs that it may be time\n[105.76s] for you to switch into management. If\n[107.48s] you''re just wondering if it''s even time\n[109.08s] or not, this this episode''s more about\n[110.84s] the skills. You can go back and watch\n[112.6s] that one if you''re interested. So, let''s\n[114.72s] get right into it. Here''s five skills\n[117.28s] that will really help you be a more\n[120.16s] effective manager than a lot of people\n[123.2s] if you choose to make the switch. The\n[126.04s] first thing that you really are going to\n[127.64s] have to practice, and it honestly is\n[130.08s] difficult, but I think it sets a good\n[132.6s] manager apart from a poor one, is\n[135.48s] learning to hold people accountable the\n[138.56s] right way.\n[140.28s] Uh\n[140.84s] if you''ve been an individual contributor\n[142.52s] for a long time, it''s easy for us to\n[144.959s] complain about other people. This\n[147.24s] person''s not doing their job, or I was\n[149.52s] depending on this other person for doing\n[151.44s] their job. But when you are in\n[153.68s] management, often you don''t get to just\n[156.8s] complain about it. You have to do\n[159.52s] something about it.\n[161.6s] And I think a lot of us think that\n[163.959s] holding people accountable means\n[166.12s] punishing people, or making sure that\n[168.56s] like, you know, circumstances or\n[170.2s] consequences happen to prevent it from\n[172.6s] happening again.\n[174.28s] And that ultimately is necessary\n[177.04s] sometimes, right? Disciplinary action.\n[179.8s] We don''t love that word. We don''t love\n[182.04s] the idea of it. But hey, if you as an\n[184.88s] individual contributor have been on a\n[186.28s] project and you''ve seen another person\n[188.84s] not pulling their weight, and it''s\n[190.56s] affecting the whole team negatively, and\n[193.0s] you''ve talked to them, and they haven''t\n[194.56s] done anything about it. If your manager\n[197.2s] won''t take action on that, that hurts\n[200.239s] everyone. So, if you''re thinking of\n[202.4s] moving into a management position,\n[204.959s] you will need to practice and learn the\n[208.08s] proper balance between holding people\n[211.12s] accountable by sometimes disciplining\n[213.8s] them, sometimes giving them a warning,\n[216.4s] and sometimes just giving them grace.\n[218.76s] Meaning, you know, they''re human. They\n[220.6s] made a mistake, they need to improve,\n[222.36s] and you try to be understanding of that.\n[224.4s] I think, you know, each situation is\n[226.44s] unique when we deal with people. Each\n[228.76s] person is different. And, you know, this\n[231.76s] is a skill, just like software\n[233.44s] architecture or, you know,\n[235.64s] test-driven development or anything else\n[237.56s] that we do in technology. It''s something\n[239.88s] you''re not going to necessarily be great\n[242.24s] at at the beginning. But, every good\n[244.84s] manager that learned the right balance\n[246.6s] of doing this had to start somewhere.\n[249.44s] And if you at least know, hey, holding\n[251.4s] people accountable, you know, helping\n[253.32s] them improve, helping them change their\n[255.72s] behavior is part of the job, you''re\n[258.0s] going to be an amazing manager and\n[260.239s] people are going to so appreciate\n[262.68s] working for you. The second thing that I\n[265.32s] think is a often\n[267.36s] unspoken, but sort of assumed skill or\n[270.76s] thing that you''re going to have to take\n[272.12s] on if you decide to move into\n[273.48s] management, is taking responsibility\n[277.04s] for other people. You know, when we''re\n[280.24s] an individual contributor and we don''t\n[282.919s] do a good job, we don''t write the code\n[284.96s] right, we set up the infrastructure\n[286.8s] wrong, you know, we\n[288.72s] ran some database query that had\n[290.84s] incorrect results,\n[292.64s] we''re held accountable. We have to fix\n[295.0s] it usually. You know, we have to go in\n[296.96s] there, make the wrong right. And if we\n[299.68s] have a big enough screw up,\n[301.68s] we might get fired. I mean, that''s\n[303.44s] again, the extreme case, but, you know,\n[305.96s] we could be put on a PIP or we could be\n[308.2s] asked to be mentored by someone else or,\n[310.04s] you know, we could start to be getting\n[311.36s] micromanaged if there''s enough trust\n[313.16s] lost.\n[314.28s] Well, when you move into management,\n[316.04s] what''s difficult is now from the\n[319.12s] company''s standpoint and, you know,\n[321.16s] upper management, you are responsible\n[324.24s] for your team''s work. And often many\n[326.68s] managers, they''re not in the same code,\n[329.52s] right, that every developer is writing\n[331.28s] code. And now Now, hear me here. When\n[333.4s] I''m talking about a manager in this\n[334.68s] case, I''m not talking about a tech lead,\n[337.68s] meaning someone who\n[339.56s] is leading the team, they''re helping\n[342.0s] everybody do a better job, they''re\n[343.84s] teaching people, they''re maybe looked at\n[346.2s] as the most sort of tactical person of\n[348.2s] the team, whether that''s true or not,\n[349.92s] but they''re ultimately in the same\n[351.96s] codebase, in the same features, and they\n[353.88s] can look at the same code, and they''re\n[355.16s] working on the same code, or the same,\n[357.04s] you know, if they''re not a developer,\n[358.52s] maybe the same infrastructure, maybe\n[360.16s] you''re using Terraform, whatever it is,\n[362.48s] as everybody else. So, when you become a\n[365.4s] manager, what''s difficult is you often\n[367.64s] don''t have direct insight to the\n[371.6s] specific technical artifacts that the\n[373.72s] people you''re managing are working with.\n[375.8s] You''re trusting them without full\n[377.84s] visibility.\n[379.32s] And I think that''s something that we as\n[381.48s] individual contributors often don''t\n[383.44s] respect our managers for enough, or we\n[385.96s] don''t have enough empathy for them, that\n[388.32s] like, \"Hey, that must be really\n[390.44s] challenging for my manager to have to\n[393.32s] trust me without being able to\n[395.88s] understand everything I''m doing.\" You\n[398.08s] know, in a perfect world, every manager\n[401.12s] on a software project would also be in\n[403.4s] the code, or they''d be just as tactical\n[405.12s] as us. But, you know, hey, I think you\n[406.96s] if you''ve been on a significant software\n[408.68s] effort, you''ve also just experienced\n[410.88s] where team members don''t even\n[412.84s] necessarily understand all the code of\n[414.919s] the whole project, right? A A modern\n[417.08s] software project, depending on the scale\n[419.36s] and the customer, and you know, what the\n[420.72s] solution is,\n[422.12s] many times is too big of a codebase for\n[424.56s] anyone person to know all the code\n[427.72s] intimately. So, if you''re considering\n[430.08s] moving into management, consider that if\n[433.32s] people underneath you don''t get their\n[435.2s] work done, they\n[436.8s] fail to meet deadlines, and you can''t\n[438.64s] renegotiate it sort of with your boss,\n[441.2s] or there''s quality problems, you know,\n[443.8s] even though you don''t have the\n[445.72s] visibility into that, you may actually\n[448.12s] be the one held responsible. You could\n[450.52s] get the disciplinary action basically\n[453.48s] handed out to you as a manager on behalf\n[456.36s] of the failure of the rest of the team.\n[459.16s] And this is a serious responsibility to\n[462.24s] take on if you''re going to consider\n[463.68s] getting into management, but if you take\n[466.88s] this responsibility on knowing this is\n[469.12s] this is true and you actually go, \"Okay,\n[471.68s] I have to actually listen to my\n[473.32s] subordinates. If they''re telling me\n[475.16s] there''s something really dangerous in a\n[477.24s] decision I''m making or the direction the\n[479.24s] company''s going,\n[480.88s] if that thing turns out wrong, I might\n[484.6s] be held accountable for it.\" You know, I\n[486.6s] think some of the worst managers are the\n[488.56s] ones that are just straight-up yes-men\n[490.56s] to all the upper management. Yes, sir.\n[492.52s] Yes, sir. Oh, absolutely. We''ll commit\n[494.08s] to that. We''ll get that done. And then\n[495.24s] they just force all their subordinates\n[497.28s] to do everything so that the upper\n[499.28s] management is happy. They get themselves\n[501.48s] into a place where if anything goes\n[503.04s] wrong, they''re the ones who are held\n[505.28s] accountable. So, this is a complex\n[507.08s] topic. Certainly can''t cover it all in\n[509.24s] one YouTube episode, but I just want to\n[511.24s] make you aware, hey, if you''re thinking\n[512.599s] about getting into management,\n[514.599s] be prepared that you''re going to have to\n[516.0s] develop the skill to be able to\n[518.919s] get comfortable with taking\n[520.28s] responsibility for other people''s work\n[522.599s] and sort of navigate that.\n[525.0s] The third thing that you''re going to\n[526.08s] have to learn to be a really effective\n[527.92s] manager that''s different usually than\n[530.52s] being an individual contributor\n[532.52s] is you''re going to have to consciously\n[534.56s] make yourself more available to your\n[537.08s] team than if you were an individual\n[539.04s] contributor. You know, if you''re an\n[540.04s] individual contributor,\n[541.68s] a developer, DevOps, you know, UX,\n[544.16s] whatever,\n[545.44s] you know, we can often go off for 3 4\n[547.72s] hours at a time, sometimes even all day,\n[550.24s] working on tasks that have been assigned\n[552.4s] to us uninterrupted. Now, in some\n[555.2s] companies, that''s unheard of. You know,\n[557.12s] there''s always Slack interruptions.\n[558.64s] There might be the daily stand-up, but\n[560.52s] it''s kind of expected, hey, the thing\n[562.4s] you''re getting paid for as an individual\n[564.08s] contributor is to contribute. So, your\n[567.48s] time has to be protected and whether you\n[570.48s] feel like this is the case or not,\n[571.92s] management usually understands that.\n[574.44s] Now, do they always respect it? No, but\n[576.44s] they know, \"Hey, I can''t be bothering\n[578.96s] like every developer every 15 minutes.\n[581.32s] They''ll never get anything done.\"\n[583.4s] As a manager, though,\n[585.68s] you are really critical to smoothing out\n[588.8s] communication, dealing with\n[590.0s] interpersonal issues, if people get\n[591.84s] sick, there''s a lot of stuff that\n[594.04s] affects the whole team that one\n[596.32s] individual contributor, they can''t fix\n[598.76s] it themselves. They''re not empowered.\n[600.44s] They don''t have the relationships or the\n[602.28s] responsibility or authority to fix\n[605.28s] those. You do. So,\n[608.12s] one of the biggest mistakes I think\n[609.68s] managers can make is when they switch\n[611.88s] from being an individual contributor\n[613.32s] into becoming a manager, finding some\n[615.48s] aspect of management that they enjoy,\n[618.24s] and just focusing on that in an\n[620.56s] uninterrupted sort of way, and isolating\n[622.84s] themselves from freeing themselves up to\n[625.08s] allow themselves to be available for\n[627.68s] people.\n[628.76s] And so, if you want to switch into\n[630.32s] management and be an effective manager,\n[632.32s] much like we as developers have to have\n[635.04s] buffer time in our estimates so that if,\n[637.48s] you know, tasks take longer because of,\n[640.0s] you know, complexity we didn''t know we\n[642.04s] were going to run into or unplanned\n[643.8s] meetings, we still get close to hitting\n[645.72s] our original estimate. You know, again,\n[647.92s] estimates are complete BS on most\n[649.88s] levels, but most of us have to deal with\n[651.56s] them. As a manager, I think you have to\n[654.2s] build into your schedule or just the way\n[656.28s] that you choose to work\n[658.24s] buffer time so that you''re available,\n[660.56s] you know, leaving yourself\n[663.2s] uh communication channels like Slack,\n[665.32s] or, you know, answering your phone, or\n[666.88s] being available on email, so that if\n[668.68s] people have problems, they''re not\n[670.68s] blocked for half a day. You can really\n[672.88s] stop in and take action and unblock them\n[675.839s] and keep them going.\n[677.68s] And that''s one of the biggest things I\n[679.36s] would consider, you know, you think\n[680.92s] about if you''re thinking about moving\n[682.16s] into management, is if you''re the type\n[683.92s] of person that hates getting\n[685.44s] interrupted, you probably are not going\n[687.52s] to enjoy this job because really to be\n[689.64s] good at it, you have to be somewhat of a\n[691.12s] servant. Um you have to be somewhat of a\n[693.8s] person that like is willing and wants to\n[696.88s] help out people when they''re struggling\n[698.68s] or just, you know, yeah, no problem.\n[700.28s] I''ll come in and fix that. Or sure, I\n[701.92s] can talk to, you know, my manager about\n[704.16s] that issue. Or yeah, let''s get the\n[705.4s] product manager. And you know, if you\n[706.48s] got a willing, positive attitude about\n[709.32s] serving your team and helping people\n[711.4s] adapt and get stuff done, you can be an\n[714.24s] awesome manager though if that''s the\n[715.88s] attitude you have instead. And hey, if\n[717.96s] you''re considering moving into\n[719.36s] management and you''re just wrestling\n[721.52s] with gosh, you know, Jamie''s talking\n[723.36s] about these different skills I got to\n[724.88s] learn. Maybe you watched the other\n[726.56s] episode where I talked about, you know,\n[728.28s] deciding whether it was time. And maybe\n[730.6s] you''re new to management. You just\n[732.16s] switched into it. You''ve been in it for\n[734.0s] a while. You''re looking for kind of tips\n[735.72s] from other engineers or technical\n[737.48s] managers. Or you''re just kind of\n[739.44s] wrestling with all these career\n[741.04s] decisions that are in front of you\n[742.24s] today. I want to encourage you to\n[743.56s] consider joining my Patreon or my\n[746.68s] YouTube membership. These are some\n[748.96s] really cheap ways that you can support\n[751.08s] the content, help me continue to make\n[752.96s] these episodes. But also, you can join\n[756.04s] my Discord server. And there''s a great\n[758.36s] community that just continues to grow on\n[760.48s] there of fans of the channel who are\n[762.839s] supporting it, my career coaching\n[764.88s] clients, people who''ve actually paid me\n[766.48s] a lot of money to coach them one-on-one.\n[769.4s] They get, you know, basically lifetime\n[771.44s] access to Discord, people who''ve bought\n[773.24s] my courses. But these are people who I\n[776.0s] think are amongst the most positive and\n[778.28s] sort of empowering people that interact\n[780.96s] with this channel. So, if you like this\n[782.839s] kind of content and you like the idea of\n[785.48s] getting to know other people who kind of\n[787.4s] have similar uh views on software\n[790.0s] development and how we should work\n[791.44s] together and treat each other as I do,\n[794.12s] check out the link in the description\n[795.6s] and consider joining.\n[797.12s] The fourth thing that''s just essential\n[799.0s] if you''re going to consider switching\n[800.56s] into management is to decide to\n[803.64s] consciously and intentionally study and\n[807.76s] practice management. You know,\n[811.36s] management is a skill. It''s There''s a\n[814.24s] series of skills. Persuasion, building\n[817.92s] confidence, having empathy, listening,\n[820.88s] you know, discipline. There''s all these\n[822.76s] different things. And I think many\n[825.56s] people get the opportunity to move into\n[828.44s] a management position and their company\n[830.0s] maybe offers them more money. I talked\n[832.04s] about this in the episode about why tech\n[835.24s] lead is the worst position for many\n[837.64s] programmers. You can go back and watch\n[839.28s] that one\n[840.44s] if you haven''t already.\n[842.36s] But I think a lot of people their\n[844.36s] company pushes them into management, but\n[847.12s] they don''t really set the expectation.\n[849.52s] Hey, if you move into management, you\n[850.68s] know how as a developer you have to\n[852.4s] practice programming and you have to\n[854.84s] learn new skills\n[856.88s] and you have to read up on new, you\n[858.76s] know, documentation and try new\n[860.88s] techniques and adopt test-driven\n[863.36s] development and learn about continuous\n[865.16s] delivery. And, you know, explore if\n[867.08s] you''re doing data science,\n[868.84s] you know, different types of forecasting\n[870.52s] algorithms and things like that. Well,\n[872.52s] management''s no different. If you go\n[874.68s] into management and you go, \"Well, I''m\n[875.92s] not going to learn anything. I''m just\n[877.08s] going to take this responsibility. I got\n[878.839s] this promotion because my job gave it to\n[880.76s] me. You know, maybe I''ll just kind of\n[882.24s] learn on the job and figure it out as I\n[883.839s] go.\" Can you do it? Yeah. But if you\n[887.24s] treat it like, \"Hey, I just stepped into\n[889.44s] a new role with a whole world of new\n[892.2s] skills I''ve got to learn and that\n[893.88s] excites you.\" And you maybe put together\n[896.64s] a schedule for yourself, \"Hey, I''m going\n[898.2s] to read a book a week or you know, every\n[900.44s] couple weeks. I''m going to start to find\n[902.52s] some really great management podcasts.\n[904.28s] I''m going to reach out to other managers\n[906.48s] at my company and identify ones and and\n[908.76s] talk to them and say, ''Hey, I''m looking\n[910.2s] for mentoring. You know, would you be\n[912.48s] willing to meet with me like once a week\n[915.0s] and I can just tell you how my leading''s\n[916.72s] going, you know, how my management''s\n[918.16s] been going, some questions I have. You\n[919.68s] could really help me just kind of do\n[921.08s] better getting started with this.\n[922.96s] Whatever you got to do, but you know,\n[924.56s] studying and practicing management,\n[926.64s] treating it like just like software\n[928.36s] development, just like, you know,\n[929.84s] devops, any other technical skill where\n[932.72s] you need to continuously learn and\n[934.72s] invest in improving your ability to do\n[936.84s] it with outside resources and resources\n[939.88s] on the project. If you look at it like\n[942.12s] that way and that''s how you go into\n[944.04s] management, you''re going to do an\n[945.56s] amazing job, better than so many other\n[948.64s] people that don''t explicitly,\n[951.56s] intentionally choose to study management\n[955.0s] as a discipline.\n[956.4s] And the fifth and final thing that I\n[957.84s] think is probably very important to\n[960.28s] consider\n[961.6s] if you''re\n[962.92s] thinking about moving into management is\n[965.16s] that one of the things that''ll make you\n[966.64s] super effective is being a translator\n[970.44s] for people''s incentives. What does it\n[972.72s] that mean? Well, somebody in an\n[975.76s] executive position, let''s say like, you\n[977.96s] know, the CFO or the CEO or the chief\n[980.76s] product officer,\n[982.4s] they''re going to be very focused on the\n[984.32s] bottom line of the company. How much\n[986.28s] money are they making? What are their\n[987.6s] expenses? What are new opportunities in\n[989.839s] the market? What''s their competition\n[991.6s] doing? How many new sales have they\n[993.2s] made? You know, they''re going to be\n[994.44s] looking a lot on the health of the\n[996.64s] money, the profit, the revenue, the\n[999.48s] business. And so, many of the decisions\n[1002.92s] that they make, the thing that they''re\n[1004.88s] f