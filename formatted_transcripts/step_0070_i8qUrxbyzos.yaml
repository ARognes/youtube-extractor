transcript: Do you have any regrets or mistakes in your career? >> Yeah, absolutely. I mean, I've made a ton of mistakes. A couple of the big ones though, one period of time, I I didn't really understand that I had a choice when I had a bad manager, right? So, you know, I think I was really naive when I was coming up and I was like, "Oh, managers, they're like our parents. Like, they must know like right from wrong and they all must be like really good and coordinate with each other and talk." No, dude. when you get promoted to a manager, they probably don't even like have extra training for you, right? Like they you just kind of get thrown into this managerial role. And so, you know, it's sink or swim and everybody's got a different style and it's just not like code. Code you can just like run unit tests, you can compile it, it'll give you errors. Like for a manager, you know, there's no guide book. I mean, there are a couple of them, but you know, you can actually get three books on management and they'd be completely contradictory to each
