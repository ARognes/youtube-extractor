transcript: nowadays rendering fractals is just a matter of crunching some equations on a computer to render some really pretty environments or trippy art i mean sure there's natural fractals too but when it comes to actually creating your own detailed mathematically pure fractals you need some kind of computer to generate them right well what if i told you that not only is it possible but these kinds of fractals could have been made with 1930 technology and the interactive real time but how is that possible let me start with the basics if you've ever tried to screen record or live stream something i'm sure you've at some point had the preview window inside the recording area and you get this recursive screen effect to be clear this is not a fractal yet but let's say we drag in another preview window now we can start seeing some fractal-like effects and bringing in more windows with different transformations could create even cooler effects but no one was live streaming in the 1930s right actually they were and it was called television there were cameras there were screens and most importantly there were crt projectors and together they could have been used to create some really intricate fractals though to my knowledge this never actually happened until the computer age nearly 40 years later anyway the way this setup would work is really simple in a large theater have two or more projectors projecting onto the screen with different positions and orientations then have a camera record the entire screen and feed it into all the projectors i really wanted to try this myself but i don't own any projectors let alone two or three of them so i did the next best thing make the projectors virtual on my monitor and use a webcam as the camera this works amazingly well and it's really cool to see real time [Music] so i made this whole demo into an actual website so you don't need to download anything if you want to try it out just follow the link in the description you will need an external webcam obviously and you'll also have to fine-tune your camera settings and put everything into manual otherwise you can get some strobing feedback loops again it's all analog there's no real computations happening any system that can stream video can theoretically render fractals like this and if there's anyone who collects really early television equipment this would be so cool to see on the original hardware but even with just the webcam there's something so fun and charming about physically manipulating fractals with your hands and before i sign off in my last video a lot of people mentioned that they would prefer to use patreon even if i don't have reward tears well i finally set that up so please give these fractals a try if you can i'd love to see what you all can make thank you for all the support and thanks so much for watching [Music] you
