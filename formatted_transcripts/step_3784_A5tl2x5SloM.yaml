transcript: hey guys today we're going to think about what it means to apply math and physics in different dimensions for games there's a lot that goes into creating and optimizing 3D worlds some of it can seem really intimidating and overwhelming but I think if you can reduce those Concepts to 1D and 2D physics you'll see how we can build on those principles for 3D and even 4D worlds working in higher Dimensions just means we're adding more variables and accounting for them so while we may need to do quite a bit more accounting when we move from 2D to 3D or 3D to 4D there are core principles that don't change so let's work from the ground up together and start with the simplest system possible a onedimensional game all one-dimension means is that we have one position variable on one axis let's call this x our character can move along the X AIS to the left or right but it can't move up or down or jump it's stuck on this line in this case a positive velocity means we move to the right while negative means we move to the left we might also Define a maximum speed it moves at along with an acceleration to define the rate it speeds up and slows down with these values we can find its position by adding its current position to its current velocity time time plus 1/2 its acceleration multiplied time squared so for each time step or frame we keep plugging in the character's position velocity and acceleration to this equation to get the position we should render the character at for that frame most engines will handle the frame rate and even all of the movement calculations for you but if you're doing something like working from scratch and openg G you'll have to make sure you have a stable frame rate for this to work but let's add some things to this 1D system let's say there's another dot on the line that's moving towards me I run into it and we both get knocked back to detect the Collision I only need to check if my position is equal to the enemy's position and that's it but how far do we get knocked back well we can use the conservation of momentum to know how we should move and momentum requires that we know the velocities of each object which we do and their masses so we can add a mass attribute to each dot so if I'm 100 units of mass and he's one unit of mass and we're both both moving at the same rate I'm going to send them flying what's important to note though is that mass is completely independent of the world's Dimension just like hit points scores inventory and many other attributes think about minimizing duplicated logic in other words if we want to Port this 1D game system to 2D we need to think about what needs to change and what can be left alone in this case our masses can be left alone so we don't need to worry about those kinds of variables for the rest of this video but let's go ahead and make this into a 2d game let's say we have a 2d game with a block that can move right and left and bump into things but now we have a variable called y meaning we can jump and move up and down what changes in terms of our calculations well the left and right movement is still exactly the same we don't need to touch the Y variable for that but when we jump over things we follow an arc that goes up to the side and down this is where we separate our velocity into horizontal and vertical components we use the same equation for position as before but we solve for the X position and the Y position separately to find the final position so to find the Y position we plug in the acceleration due to gravity for a which is 9.8 m/s squared in real life but it could be anything that makes sense for your game and your game's feel and controls anyway we get the Ang of our jump relative to the ground call this Theta and plug in our character's velocity time sin Theta for our VY component and then our character's initial y position to find the X position there is no horizontal acceleration while they're in the air gravity only pulls you down not left or right so we just take the velocity time cosine Theta to get our VX component time the time plus the character initial X position solving for the EXP position is actually exactly the same as our 1D equation since our Theta would always be 0° and the cosine of 0 is 1 so our velocity would be completely unchanged in reality games Implement jumping and movement in many different ways but this is what's happening in theory all right now let's add Z so we're in a 3D World our movement and physics calculations seem like they would more complicated but they're still the same just with more variables this time we calculate an x and z component for the horizontal velocity and calculate the Y component exactly the same as before these axes are just names though you may have the z-axis oriented vertically with X and Y being horizontal but let's say this angle Theta represents the direction we're facing and this angle Alpha represents the angle that we jump off the ground so our x velocity is V * cosine Theta * cine Alpha and our y velocity is V * sin Theta time cosine Alpha and our Z velocity is V * sin Alpha I'll give you a moment to look at this picture and absorb that it took me a moment we can use these different velocities to find our XY and Z positions which we combine to get our overall position just like in the 2D system these basic calculations aren't so bad but in a 3D World you have to deal with the D dun camera the camera is pretty straightforward and linear in most 2D games but the 3D camera requires us to rotate the entire world to match what the player expects in their view there's no point in space called the camera that's just an illusion to help us visualize what it's doing but let's learn how to actually do this let's learn learn the math behind it so we can manipulate 3D views with matrices they can translate objects to different positions stretch or Shrink them and rotate them so let's look at an example to see what I'm talking about so first is our translation Matrix this can move objects around the screen it's a matrix with a diagonal of ones and the change we want for each variable is in the last column when we multiply this by our position Vector we move the character's position if we want to scale the character's model to make it bigger or smaller we change these ones in the diagonal it's interesting to note that we can also do this in 2D with a 3X3 Matrix and in the First Dimension with a 2X two Matrix the math is exactly the same for both translation and scaling the other thing to note is that our characters usually will not have just one point but will be a collection of points in 3D so we'd apply this Matrix to all of those points and there's also other optimizations to make these calculations faster but that's the basic idea of what's happening but let's look at rotations which are a little bit more complicated let's pretend our camera is pointed at the position 1 0 so if we rotate 90° relative to the Z axis so pretending that the z-axis is like a skewer and we rotate 90° we should end up look at 0 1 0 so this is the rotation Matrix for a z-axis rotation just accept it for now let's plug in 90° to the angle and multiply it by our initial position Vector which gives us a resulting Vector of 0 1 0 which is what we predicted so we could take any three angles about the X Y and Z axis and multiply all of those matrices together with our Vector to do more complex ations the important thing to remember though is that the order of multiplication does matter for matrices but now let's say we want to start at 0 1 0 we're facing at 0 1 0 and we rotate 90° relative to the Y AIS in this case we're adjusting our orientation and the way we're facing but we're not going to move our Arrow If This Were a 3D object our position would stay exactly the same but our normal vectors would change the normal Vector is the vector that is perpendicular to a face of a 3D object and all 3D objects with many polygons will have many normal vectors for each face to simplify this let's say our object is a simple 2D disc in 3D space we'll have our position at the dis Center and then a unit normal Vector sticking out of one of its faces so this is the vector we're multiplying by in all of these Matrix calculations the center of the disc will move only if we apply a translation Matrix and the radi will stretch and Shrink if we apply scaling so if we rotate this disc 90° relative to the Y AIS it's going to face from the side to facing down be mindful of edge cases though when you use rotation matrices since you can experience gimbal lock and get some weird flipped results which is something I discussed briefly in my querian video and is one reason why many developers will use querian but I think for our purposes these are easier to visualize and there are many more techniques for 3D Systems things like Collision detection get more interesting and complex but when you're watching other tutorials or reading textbooks on those topics you're interested in remember to try and reduce it to simpler cases like a 2d world and just see what has to change for the 3D version I think it makes tougher Concepts much easier to visualize for example with these rotation matrices try them in the 1D world and try them in the 2D world to get a better handle on why they work in 3D anyway to see how well we can apply this knowledge now let's briefly think about the fourth dimension I'm going to link some of my favorite videos on 4D geometry since it's a way bigger topic than we can accurately cover today but let's at least try to understand what the fourth dimension means so this is a hypercube the fourth-dimensional counterpart part to the cube and the square some people think the fourth variable is time since we can only appreciate the full geometry if it's in motion which requires the element of time it's important to realize this image is a 2d projection of the 3D projection of this 4D object when we render graphics on a screen in games we're projecting 3D objects to a flat 2D State almost like casting Shadows on a projector as 3D viewing human brains we can only grasp these 4D shapes in 3D slices which we view on the screen in 2D anyway there's another way to view the fourth dimension other than time which is Illustrated really well in an upcoming game called m gaku in this case the world you're seeing is one 3D slice of a four-dimensional world if we have XYZ and W to Define our position instead of just XY or just XYZ we need to f pH out one of those axes so we can see a projection of a viewable 3D space so we might be looking at the yzw or XYZ or xzw slices and the math and physics we discussed would still be valid in this 3D projection the key difference is that rotating your view of this 4D world can be kind of brain bending there's some other crazy stuff the Creator discusses in his videos like how he uses tetrahedral meshes instead of triangles so definitely check out his games channel for more in-depth better explanations anyway guys hopefully some of this helps you think about game physics in a different way and maybe as you work through your studies or other tutorials you can visualize these higher dimensional Concepts more clearly if you want to learn more in depth about 3D and higher dimensional math definitely go through course material for multivariable calculus and linear algebra because at this level you really need those solid fundamentals for 3D game programming and I'll definitely go more in depth on topics that you guys request so definitely let me know what you'd like to see more of in the comments below and if you want to actually learn how to make and apply this stuff we're going to have another challenge on the subreddit where we make a multi-dimensional game everyone is welcome to try you can do as much or little as you like you can team up with people and when the challenge is over I'll feature submissions on my coding stream and then live stream my implementation from scratch I'm also much more likely to answer technical questions on the subreddit then through Facebook or Twitter or YouTube comments and there's a lot of friendly people to help out so if there's anything confusing in this video feel free to post on there and I hope you all give the challenge a try even if you just started programming even if you've never done programming but as always have a happy day wherever you are I'll see you guys next time bye
