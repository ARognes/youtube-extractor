transcript: hi my name is nick barker and this talk is called intuitive education and the mental warehouse so in summary if you don't have the time or the patience to watch the entire talk there is a general perception that the modern western education system that all of us go through isn't teaching us what we need to thrive in the workplace to actually put our knowledge into practice a lot of the reason for that is because the education system teaches us explicitly using facts equations and structured assessment whereas when we get into the workplace it requires that we understand things intuitively identifying patterns relationships and and systems and understanding how to actually apply our knowledge to a real situation so we really need both of these things to achieve mastery of a subject we need a lot of knowledge but we also need a lot of intuition and understanding but the problem is that essentially in the modern education system we're actually teaching these things in the reverse order of how we should actually be teaching them intuitive education and understanding should come first and explicit education and knowledge should actually come later so a little bit of background on what we're talking about here it's no secret that we spend an enormous amount of time money and effort on education in our society it's one of the things that we consider to be the most important as a group goal there are 3.7 million teachers in the united states alone and the department of education has a yearly budget of about 70 billion at the moment which is a lot of money but unfortunately despite this immense investment that we're putting into it there seems to be this general feeling out there in society that the education system doesn't adequately prepare us for the workplace like you'll hear it's a very common opinion that people have that new graduates from university don't necessarily have the practical skills they need to succeed in their job when they start in the first day and also important is that i believe there's a growing concern that the approach to standardized testing an assessment that is done by school districts by departments of education around the world is encouraging and incentivizing a particular type of rote learning and memorization and other short-term strategies that are designed to maximize marks in exams rather than actually encourage a holistic approach to learning so first things first there's an enormous amount of very intelligent people working on education really really great teachers really great educational research researchers out there so why isn't the problem improving why isn't the process of education improving faster than than we kind of see it happening out in the wild and i am going to propose in this talk that we're actually attempting to solve the wrong types of problems i think that the problem is not so much with the content that we're teaching in schools or the way that we're teaching it but it's actually a much more fundamental issue than that and of course when we want to talk about fundamental things we have to start with some fundamental definitions now this might seem a bit silly and reductive but i think it's actually very important to try and answer the question why do we educate why do we teach why do we educate people why do we have an education system because answering these simple questions from first principles can help us locate the source of some deep problems so the definition that i'm going to be using in this talk is that education simply teaches us to solve problems and perform tasks that is what the underlying purpose is there are a lot of side effects but that's kind of what the central purpose is a doctor is expected to learn through the education system how to diagnose and treat diseases a carpenter is expected to learn how to build things using word education is attempting to teach us how to respond to a problem or a task in a particular domain with a specific solution that solves the problem and i think it's actually really helpful to imagine our brains in this context our minds in these particular domains like a warehouse so if you imagine that the problem that you're trying to solve the task that you're trying to perform is like an order coming into your mental warehouse we need to look through the warehouse find the right box on the right right shelf retrieve it and ship it right so what we're talking about in this analogy is that the facts and the approaches that we learn explicitly in the education system the knowledge that is the boxes on the shelves right and the intuition or the feel about relationships and systems you know people call this the feel for the job the understanding that we develop while we're working or trying to solve a problem those are the shelves and the system of organization in our mental warehouse so of course if we extend the analogy a little bit a warehouse full of organized shelves is useless if all the shelves are empty right you can't respond to any orders in a warehouse if you have empty shelves but conversely if your warehouse is just a huge pile of boxes all over the floor with no system of organization that's also useless because you'll never be able to find the right box to actually respond to the order so we need both knowledge and understanding to achieve mastery we need explicit education to teach us the knowledge the facts and we need intuitive education hands-on education to teach us the understanding and to build the best warehouse that we can and here lies the fundamental problem which is that the current education system that we have teaches almost entirely explicit education so we're going to have a bit of a look at what the terms actually mean explicit versus intuitive education so that we can compare and contrast them and understand how each contributes to the way that we learn so the first thing that we're going to look at is the method of instruction or how we actually teach each of these different styles of education we're going to look at the content which is what we're actually teaching and of course important is the method of assessment which is how do we assess whether the teaching succeeded or failed it's actually very important so we'll start with explicit education and if you're watching this video chances are you have already experienced a decent amount of this in your life it's what you expect from modern education systems so the way that we teach it is by direct instruction i'm talking about listening and watching uh listening to lectures reading textbooks it's primarily a one-way communication of information from the teacher to the student right what we're actually teaching in explicit education is storing precise facts processes or structures right we incrementally build up starting from the simple bits of knowledge moving up to the more complex ones we generally follow a standard syllabus so someone's decided you learn these facts in this order from beginning to end and it's also really important to note that what we teach in explicit education is about accuracy right it's about finding the correct answer you'll you'll notice that if you've been through a modern education system there is a bit of a fixation on getting the correct answer out the end right and then finally the way that we actually assess whether the teaching succeeded or not is also something you're probably very familiar with standardized testing exams assignments that you have to do in your time outside of school uh numerical uh assessment like zero to 100 scores or a to f scoring pass or fail and of course there's also statistical comparison with your peers or bell curves so often how you do actually depends on how other students do in these types of tests as well so just some really well explicit i guess examples of explicit education well i mean this talk is explicit education when you think about it but something that you might have encountered in school is like a mathematical formula in a textbook or a lecture that's explicit education you're expected to learn the formula and then apply it precisely without making mistakes exam questions like label all the parts of the cell that require recognition and being able to recall facts from your memory or what is the present continuous form of this verb like in in french for example you're required to remember how to apply this process and to apply it to the correct um example that they give you and get the correct answer at the end uh you can also even use explicit education when you're both the teacher and the student when you're teaching yourself so for example if you're learning language vocabulary with flash cards or that type of rope memorization that's also explicit education you're teaching knowledge and you're prioritizing accuracy getting the correct answer as the measure of whether it's succeeded or failed and just a reminder explicit education all of these facts these figures all this knowledge these are all the boxes on the shelves in our mental warehouse so now we're going to have a look at intuitive education as a contrast to explicit education so intuitive education you actually will have experienced even if you've never been to school because it's something that we primarily do as children children learn very intuitively so the way that we teach intuitive education is through self-directed learning through students engaging with a system and getting feedback from it creative processes that type of thing but also through simulation and through play through intuitive education games for example or simulations that provide a safe environment for experimentation of course we also teach on the job so what we're teaching in intuitive education is developing that feel or the subconscious understanding of the the rules the relationships and the patterns underpinning a system right so when we talk about knowledge in explicit education we're talking about understanding in intuitive education how do the facts relate to each other why is this important not just what it is and another important thing to talk about here is that in contrast with explicit education intuitive education is all about approximation it's about really quickly getting to roughly the area of the answer that you're looking for whereas explicit education is much more about accuracy precisely the correct response right and one of the reasons that intuitive education is not anywhere near as present in schools as it should be is that it's much harder to assess in a standardized way or even a way that a computer can do right you can get a computer to analyze a multiple choice test and market for you whereas if you want to assess someone's intuitive feel for a subject they need to self-assess you need teacher assessment you need peer assessment for example can can work but it's also subject to bias and a whole lot of other things that makes assessing intuitive education much more difficult right so some examples of intuitive education um you might not have thought about this but learning to sing learning to dance you know these things that are considered very human on a bass level are incredibly intuitive you don't learn to sing by looking at the anatomy of the throat and understanding okay i have to tense my vocal chords and then i have to tilt my larynx to this angle and then i have to push air from my diaphragm like that you learn to sing by just trying and by your interaction with your body you know clenching your muscles pushing air out and then hearing it in your ears that feedback loop intuitively allows you to start to understand the rules of the system in contrast to learning a language as an adult as we talked about before learning your native language as a child is an incredibly intuitive process children aren't thinking about verbs and adjectives and nouns they're not thinking about grammar they're not thinking about vocabulary they are just trying to express themselves and they're trying to communicate and trying to get things done through using their language which allows them to develop very quickly an intuitive understanding of the rules without necessarily having that accuracy you see it's about approximation a child might be able to say a sentence that you can understand even though the grammar is a bit incorrect right it's not perfect but it's approximate and it's most of the way there and the third example is of course learning on the job in an apprentice or uh as an apprentice rather or in a trade so you know if you're learning to become an electrician often you'll start working um very early on in your education process and then in parallel the person who is mentoring you through your apprenticeship will teach you uh the correct bits of knowledge they'll give you those little bits of explicit education right when you need them so you know you'll be looking at something and they can tell that you're trying to figure out how it works and they'll give you the information and what this is akin to is you've just created the shelf in your mental warehouse by seeing oh okay there's got to be some way that these things fit together and then the teacher comes along and they give you the box to put on the shelf so just to recap intuitive education that's the shelves and the way that you organize things in your mental warehouse and explicit education teaches you the knowledge the facts all the boxes that fit onto those shelves you need both of them so it's important to point out like i said that what we teach in the modern education system isn't useless by any means i'm not actually criticizing teachers i'm not criticizing the syllabus or the system uh what i'm saying is that you know your warehouse obviously needs to be full of knowledge you need heaps of boxes on the shelves to be able to respond to that input but the problem here is not the boxes but it's the order that it's the order that we learn things in not the things themselves right you can kind of describe this as like the box problem and you can see where i'm going with this which is that because we almost entirely do explicit education in schools what we're doing is essentially filling a huge warehouse floor ceiling uh with boxes that have no system of organization right they're just everywhere all over on top of each other that's all the facts that you learn in school right there there are just arbitrary facts and knowledge and stuff everywhere it's actually kind of a miracle that we can pass exams by cramming the night before and the way that i think about this is that the night before your brain basically says okay i know we're going to need this knowledge tomorrow and all in one place so what we're going to do is just take that squeeze that little pathway between those boxes down on the right walk you know 50 meters back into the that room and then the third pile of boxes on your right that's where all the exam stuff is so just go there you'll find all the stuff related to the exam um and you might be able to remember where that location is for a couple days but if you come back and try and do the same exam like a year later you'll probably fail and to me that's an indication that the knowledge hasn't stuck because you you haven't developed any long-term system for organizing how that information relates to everything else you don't have the intuition you don't have the shelves you can't find the boxes so lots of problems obviously talks are not interesting if they only propose problems with no solutions so here we're going to have a look into some proposed ideas of how we could change the education system a bit to teach intuitive education before or alongside but also how you can apply these kind of procedures in your own teaching or learning so obviously the solution is quite simple if you're building a warehouse you want to build the shelves before you put the boxes in it's common sense right in a practical sense uh this happens automatically as part of work experience or apprenticeships like when you're doing this kind of learning on the job style thing you're building the shelves as you're trying to solve problems you're saying oh i obviously need a solution you know the first time you ever learn to join two pieces of wood together you're looking at the two pieces of wood you're looking at the thing you want to create you're like oh i obviously have to join these two pieces of wood that process is building the shelf and then when someone teaches you how to make the join that sticks really well because you now have a good solution to your problem right what it boils down to is if you're a teacher just try to avoid teaching a concept to a student before they have anywhere to store the concept in their mind if they can't relate that concept to some to other concepts or to some use they're just throwing the box on the floor somewhere and they're never going to find it again so at the university level um the problems uh probably the most easy to solve um because you already have like quite a bulk of education behind you at that point of some fundamental base skill level so my proposal is basically get students into the workplace doing the actual work on day one at the same time they start university day one into the workplace part-time at university and part-time in the workplace right do the explicit education alongside the intuitive education there are two major reasons why this is a much much better approach than what we do now which is like four years of intense knowledge explicit education study with a teensy little bit of like fake work stuff in there the first one is that it's just much easier to memorize and retain information if the student can see immediately how it's going to be used as part of their job you just have a better ability to memorize things that you actually have a use for than things that are esoteric facts that aren't related to other things but the second thing that i think is almost more important than that is to do with how students choose their subjects in university if you've been through university unless you were the most dedicated student who had really thought hard about where you want to go in the future chances are you chose the subjects that you did kind of arbitrarily if you had any choice right if students were working right at the same time that they were at university when it came time to choose subjects for the next semester they would have a much much clearer idea of what kind of subjects they wanted to do because you know you might have seen something at work that or been asked to do a task at work that you did okay but you didn't really fundamentally understand uh you know the the base of it the foundations and then you see a subject at your university you can think oh i need that subject to apply to my work and it also creates a very strong feedback loop with universities because at the moment universities do claim to be preparing people for the workplace they claim to be essential in training people to work in you know knowledge work for example so i i think it would be really important if uh students were able to give immediate feedback on whether courses were actually useful to them in the workplace or not at the high school and middle school level um it's this is your sixth to twelfth uh ish year of school it's much harder uh to get intuitive education in there and the main reason is because in order to do this we would need a really wholesale shift away from standardized testing um i think standardized testing exams assignments these other types of things bell curves these are the types of things that encourage and incentivize the use of explicit education and i think we need to get away from those if we want to start to teach students a more intuitive understanding of the depth of the subject one thing that i think is a reasonably easy pivot to make in some cases and i've i've read case studies of teachers successfully doing this is allowing students to guide their own exploration of the subject through curiosity rather than just rigidly adhering to a curriculum you know rather than saying we're learning this this week we're learning something else next week we're learning something else week three you allow the students to pursue their own curiosity through the course and you just help them with little shortcuts if they're getting stuck or if they get some inaccurate information you correct it for them allowing them to guide it allows them to build the shelves in their mind because they can understand why the fact is actually useful a modern thing but using games and simulations of an initial driver of skill acquisition rather than traditional lecture and and pupil based is actually something that has been shown in some cases to be very effective what you'll find is that even if you just do a little bit of this interactive learning where students just get to explore within the subject before you start bombarding them with stacks of knowledge and fact facts that they have to remember they will probably retain the knowledge and facts better if they have shelves to put the boxes on so some examples here is teaching maths in the context of building a video game or creating procedural art you know this of of building a little simulation doing this type of thing so they can understand how the maths actually applies right rather than just learning these abstract things in isolation or another technique i've heard of that seems to be very effective is in high school commerce or economics people run simulated stock markets where the the students are giving fake money to invest in a in a safe way with a market that actually tracks the real stock market and so each week you know the teacher can talk about what happened in the market why certain things affected some other things it can create a context by which students can really build those shelves which they need to be able to organize things now at the elementary school level funnily enough in the first few years of elementary school it actually has a pretty good mix of intuitive and explicit education i don't think i would necessarily like i don't think i'm qualified for example to to point out anything that would improve that wholesale i think the first three years of elementary education with good teachers are actually done very well i suspect one of the things that allows them to exist like that is the fact that standardized testing and exams and stuff even in gifted and talented programs doesn't really kick in until the fourth or fifth year of elementary school um so that's like uh an important kind of distinction to make there and it's also i think worth pointing out that something i see which is very very common these days is people saying that oh i was a gifted child i was called gifted everyone said i was smart when i was in elementary school when you know first three four years of elementary school i i could read really well really early i could do maths everything and then from high school to university everything went downhill and i started to fail things and now you know like i i don't know what i'm doing that type of stuff i've seen this over and over again and there are definitely other compounding factors here this is not entirely an explanation but i think for me personally i'm a very intuitive learner i have terrible trouble remin remembering things in isolation or like rote applying processes that i don't actually understand so what i think happened to me was that i had a really easy time in elementary school because things were very intuitive all the education was designed so that you know you built things up from first principles you really developed a deep understanding of things even though they were very simple but then when you get to high school there's this kind of hard pivot into standardized testing into exams into assignments into explicit education where memorizing a large number of things or being able to force yourself to memorize things that you don't understand is is critical to your success and i think that that hard pivot there is possibly to blame for this like gifted child syndrome to some extent there are obviously a lot of other things um going on there including you know neurodivergence and uh among among a lot of other stuff so let's say you're not in a position where you can change education policy uh for an entire country which is most of us if you're an individual and you want to know what you can kind of do to move towards a more intuitive education approach let's say you're a teacher right as i said before try to let your students lead the process of learning this is of course assuming that they're motivated and there isn't other things going on uh allow them to seek answers to their natural questions right so if they have a question go down that path allow them to go down there just provide the guard rails for them right if they're getting stuck and they can't figure something out but they obviously know that something's supposed to be there just give them the box right give them the correct box rather than them having to figure it out themselves because if they've already built the shelf they'll be able to store that really easily they'll be able to remember exactly what you tell them if they understand why it's useful right you want to try and design learning so that students feel a real need for the information right before you teach it to them if they have no context like i said don't give them the information yet withhold it if they don't understand how it's going to fit in this something that's kind of obvious and then i think a lot of people are on board with is that you want to avoid one-way lecturing right of course which is you don't want to just get students into a class and just talk to them for 60 minutes and then tell them to leave right obviously a lot of people understand that that's not ideal but one step further than that i think you also want to avoid what's kind of referred to as guessing the teacher's password right that style instruction where it's like one-way lecturing or textbook learning whatever which is just punctuated occasionally by can you tell me why something right and then the student has to try and guess the password to continue basically or what do you think y means you don't want to do this type of thing what you want to do is allow the student to actually arrive at the conclusion for why something's important and then help them understand the simple accurate reason why so if you're a student and you're interested in intuitive education and you think it could help you learn and retain information more easily the spoiler is that it can um there are also things that you can do in isolation even if your education system in your country or at your school is not supporting you um and the the most fundamental rule that you have to think about is uh it's essential that you attempt to put the thing you're learning into practice as soon as you can right there's if you're a person like me there's a very low limit to how many things you can learn in isolation without ever putting them into practice so if you're learning a language seriously try start speaking the language you're learning with native speakers as soon as you can or reading books in that language even if they're just kids books as soon as you can give yourself an external reason or rather get some external stimulus that can help your brain understand not only which things are important but how they relate to each other not just a list of the things you know if you're learning maths find out how the mass that you're learning is used in real life or in puzzles or in specific simulations or something like that and then try and solve some of those problems yourself don't just learn one thing after another and stack the facts on a big jenga tower you know finally games and simulations are actually getting really really good there are some phenomenal games out there that will help you really really help you develop an intuitive feel for the subject like if i was teaching physics at high school i would definitely encourage kids to play kerbal space program there's a very um nice accurate physics simulation in there and knowing how to actually [Music] do the calculations will will help you be better at the game so in that kind of case you'd allow the kid the student to play the game and then you would watch them crash their rocket and then you would give them advice about like oh well you see this equation describes you know this ratio between these two things and that can help you not crash the rocket you know another great example is flight simulator very accurate if i'm i'm sure that uh playing a lot of flight simulator would uh improve your ability your chances of becoming a pilot in the long term um because it just allows you to get that initial uh intuitive feel for the lay of the land how things relate to each other how it all comes together as a big picture and then you can start learning all of those little pieces so a lot to take on there in conclusion the important things to remember are as a student don't blame yourself for not being able to memorize things with no context as a teacher don't blame yourself for not being able to get your students to memorize things with no context it's not what humans were designed for our brains are kind of geographical in nature based on locations you know so focus on where to store the information not just the information itself so when you learn a new fact it's not just a new fact in isolation it's what is it for how is it used how does it relate to other things that i know about this right do i have a shelf to put this information on or am i just putting this box on the floor just think about that every time you learn a new thing in isolation is it's like am i just taking this fact and just putting it on the floor somewhere and hoping that i'll be able to remember it later it's really important to understand that knowledge is useless without understanding and understanding is useless without knowledge so you need explicit education to teach you that knowledge it's essential of course but you also need intuitive education to teach you that understanding how the knowledge different pieces of knowledge relate to each other thanks i hope you enjoyed this talk and if you did i also have another talk on intuitive education games and how we can create uh enjoyable games that don't feel like educational experiences that can kind of hack information into your brain thanks
