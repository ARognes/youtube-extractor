transcript: '{"content":"\n[0.06s] Have you ever been on a software project and thought to yourself, \"what''s the impact of the work\"\n[4.859s] \"I''m doing? How much money is it really making for the business? Is it actually making our customers more successful?\"\n[11.53s] We''ll stay tuned because today\n[13.259s] we''re going to talk about how impact mapping can help you be in a better position to ask for raises and promotions and\n[19.66s] steer the company in the right direction\n[22.029s] right after this.\n[30.49s] Hi, I''m Jayme and at Healthy Software Developer,\n[33.3s] I''d like to help you have a sustainable career where you don''t get burned out,\n[37.899s] you don''t get pushed around by people that don''t really understand software development,\n[42.57s] and you can just make sure you have a long and healthy career.\n[46.68s] I once worked with a software developer that made his company over\n[50.829s] three million dollars in one year, and at the end of that year when he got his performance review\n[56.309s] he was only given a 2% raise in his salary.\n[60.07s] And if you want to be in a better situation where you can actually quantify how much value is the work you''re doing\n[66.909s] causing for the business, or maybe you''re a product manager\n[70.229s] and you want to make sure that the investment you''re making in changing your product really hits its goals then\n[77.229s] understanding impact mapping is really gonna\n[79.59s] help you.\n[80.07s] I talked about a business model canvas in my prior video which is a visual diagram with nine sections that all\n[87.189s] approach the business from different angles\n[89.34s] and how any work a software development team does to try to impact a product\n[94.27s] should be looked at through the lens of one of these sections.\n[98.29s] Before we start impact mapping to help you figure out:\n[101.409s] \"what is the impact of the work that we''re doing?\",\n[104.02s] we have to pick one section in the business model canvas and set a goal. In this example\n[110.34s] we''ll pick the revenue stream section\n[112.619s] Which is really all about\n[113.71s] \"How does this software product or service make money for the company?\". And an example goal in a company that sells its product using\n[121.56s] a subscription could be to increase the subscription revenue by 20%.\n[127.78s] Another example might be if we targeted the channels section of the business model canvas, which is really all about\n[133.989s] \"What are the different distribution channels or ways that we could potentially reach\"\n[139.06s] customers?\". And if your product for example had a half a million people out there that might buy the product\n[145.59s] but you''re only actually serving\n[148.09s] 50,000 of them, one goal could be to reach\n[151.989s] 15% more of that total market. And\n[155.83s] finally the value proposition section of the business model canvas\n[159.67s] Which is really about the theory the company has about why the customers would pay for the core product,\n[166.06s] not its bells and whistles. And one example of a goal there might be let''s say you were selling a mobile app or\n[173.14s] possibly a video game\n[174.64s] you could actually set a goal, \"We''d like to reach a four star rating on the App Store.\"\n[180.15s] and this would be more a goal around customer\n[182.86s] satisfaction. But the important thing about all these goals is you need to actually have a measurable quantifiable fact that tells you\n[190.86s] when the goal is reached.\n[192.549s] Statements like \"We''d like to increase profit\", or\n[196.12s] \"reduce costs\" or \"improve customer satisfaction\"\n[200.41s] don''t cut it here when we''re impact mapping. We need to have a number that when reached we can say to everyone: \"We''re successful!\".\n[208.42s] So once you''ve picked a goal to try to achieve, what''s the next step? Well eventually we want to produce\n[214.239s] what''s called an effort hypothesis and this is a statement that comes in a sentence that you replace\n[221.23s] variables in that gives you a great way of communicating the goal and what the company''s trying to do across everybody in the organization.\n[228.7s] So if anybody needs to ask the question \"Why am I doing this work?\",\n[232.9s] \"What is it gonna actually result in?\", and \"How do we know when we''re successful?\", it answers these three questions.\n[238.959s] And the statement basically goes like this. \"We believe that some\"\n[244.12s] \"capability, whether it''s in our product or our\"\n[246.91s] \"marketing channels or any aspect again of that business model canvas, will result in some\"\n[253.329s] \"outcome, something new in the product some\"\n[256.269s] \"improvement to a capability some better visibility with our customer\",\n[260.489s] \"and we''ll know when we''ve succeeded when some measurable signal is reached\".\n[265.78s] And this is what I was just talking about something that everybody can say \"yes, this fact is now true\",\n[271.19s] \"we''ve reached this outcome\". The important thing about this statement though is it''s a hypothesis,\n[277.37s] it''s a theory and you can note that by the first sentence which says \"we believe\".\n[283.28s] This is an acknowledgment across the company that doing this work is not a guarantee. And this is very key to\n[290.09s] agile and lean philosophy that when we invest in software development, there are no guarantees.\n[296.06s] There''s no certainty and that''s going to have a big impact on how we budget which I''ll talk briefly\n[301.28s] about at the end of this video. The first step in impact mapping is we need to state our goal in a visual diagram.\n[308.47s] There''s many software products available that you can use to do this or you can simply just do it in Microsoft PowerPoint or keynote\n[315.44s] from Apple or a variety of other drawing or diagramming tools.\n[319.31s] But once we pick a goal, and we only want to pick one, in this case this we''re in that revenue section of the business\n[325.87s] model canvas: We want to increase subscription revenue by 20%.\n[330.5s] The next step is we have to pick some actors. Actors are really just people,\n[335.69s] groups of people, or possibly departments inside of our company or that are part of our customer base\n[341.9s] that we''re going to try to impact or influence to hit that goal.\n[346.88s] One of these might be corporate subscribers. This example of having a software product that customers pay for through a\n[353.84s] subscription may have some of those subscribers pay for it because they work for companies.\n[359.72s] There might also be individuals that pay for the product that are just commercial subscribers. And\n[365.93s] finally there may be media subscribers or people that belong to news organizations, or they''re journalists, and they may also subscribe.\n[374.33s] Next what are some impacts we could try to cause that will affect some of those actors to reach our goal?\n[382.48s] Well if we''re trying to impact commercial subscribers one impact might be to try to get more subscribers.\n[390.97s] Another could be to try to retain the existing subscribers and prevent them from canceling their subscription. And\n[399.13s] finally we could also try to find ways through pricing and additional revenue streams to try to earn more per subscriber.\n[408.97s] The last step of an impact map is to pick some features or\n[413.68s] activities that the team is going to do to try to actually have one of those impacts.\n[420.52s] One example might be the software development team or consultants could be invested in to try to add\n[427.03s] Stripe payment capabilities to our product. Now stripe is just a really well-known\n[431.77s] payment processor that lets customers use a credit card and other forms of payment easily to pay for subscriptions.\n[438.639s] But this is just one example of something that could be done to try to have an impact to reach this goal.\n[446.28s] Another example of a feature or activity that could be pursued to try to get an impact that reaches that same goal would be to\n[453.9s] advertise on Facebook.\n[455.52s] Maybe your company''s never advertised their product on Facebook before or they have but they just haven''t gotten the results\n[462.0s] because they''re really new to building Facebook campaigns.\n[465.93s] But this would be a way to try to achieve the same goal, but without software development effort.\n[472.35s] One mistake I unfortunately see many companies make when they''re new to impact mapping is they try to select multiple\n[479.43s] red squares or\n[481.08s] multiple features or activities to perform to try to reach a goal and the problem with this is, if that\n[488.07s] subscription revenue, that goal we''re trying to achieve starts going up now you have to figure out: \"why is it going up?\".\n[494.66s] Maybe we made ten changes to the product\n[497.37s] we need to know:\n[498.69s] \"Are nine of those actually a waste and only one is positive and actually having the impact?\". So you really just want to pick\n[505.11s] one thing to try to actually do to the product at a time and then measure it as an\n[510.54s] experiment and see if it''s getting the results you want. If our example company here chose adding Stripe payment\n[516.87s] capabilities as the thing they''d like to pursue to try to have an impact to reach their goal, the effort hypothesis\n[523.729s] I showed you before would read like this:\n[526.47s] \"We believe that stripe payment will result in more commercial subscribers, and we''ll know we''ve succeeded when subscription revenue\n[534.93s] increases\n[535.98s] 20%\". What''s crucial is you don''t stop here when you budget though.\n[540.9s] This is only a theory remember? And the company may invest money in trying to reach this goal, and most\n[547.41s] likely their first time trying it with their first idea and experiment is going to fail.\n[553.11s] So rather than putting the company into a position where if they do fail,\n[557.06s] they have to go back to the board or the CFO or whoever approves budget and basically be looked at as\n[563.85s] \"we failed!\" and now we need to get more money,\n[566.79s] how could we actually budget ahead of time to assume that we might fail and\n[571.77s] keep the culture more healthy where people can just do work to try to reach that outcome and still stay profitable?\n[578.16s] Well, let''s say this fictional company if they were to increase their subscription revenue by 20%, that would generate an additional million\n[586.17s] dollars for the company that year. The question becomes:\n[589.41s] How much money is the company willing to invest to make an extra million dollars?\n[594.87s] Let''s say that answer were\n[596.85s] \"four hundred thousand dollars\". The most money that the company can possibly\n[601.589s] spend to try to make that million dollars before it starts to get a little too scary for people, and this is going to depend\n[608.06s] on the company, would be four hundred thousand dollars. The critical thing to do here is not to spend all\n[615.87s] four hundred thousand dollars on one thing, but rather to only spend a percentage and in this case as an example maybe\n[623.97s] 20% of that four hundred thousand dollars to do your first experiment to try to hit that subscription revenue goal.\n[631.2s] What''s great is let''s say the team actually hits that revenue goal through their first\n[636.51s] experiment and investment now there''s extra money available to reward people and\n[641.459s] Invest in future growth and if they don''t succeed\n[644.94s] they''ve got multiple other things they can then try and measure\n[649.26s] Independently before the budget that''s been allocated to try to hit that goal\n[653.339s] has all really been spent. So do you know the impact of the work\n[657.62s] you''re doing? Is your company building impact maps? if not, why not? And have you thought about asking\n[664.68s] product management if they''re doing these types of things? I find if you have access to this\n[669.87s] information you''ll be in a better position to steer your company to make sure it''s profitable,\n[674.76s] you''ll enjoy your job more because you''ll know what you''re actually\n[678.209s] Impacting as far as the business and the customer, and you''ll be in a better position to ask for raises and promotions\n[684.24s] when you get that opportunity. If you''re new to my YouTube channel go ahead and subscribe. You can also click the bell icon\n[690.93s] and it''ll notify you when I release new videos.\n[693.56s] I also have these videos available on four podcast platforms if you''d rather listen there.\n[699.529s] Google Play, Stitcher, iTunes or SoundCloud.\n[704.61s] So until next time,\n[707.019s] thanks."}'
