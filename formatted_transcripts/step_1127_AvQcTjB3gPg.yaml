he SlashCommand builder. So this is something you''ll see in a lot of the Discord.js API, how it works. If I want to have a message attachment, I need a message attachment builder. If I want a button, I need a button builder. So this idea of builders is very common. Here, I want to build a SlashCommand. The way that I do that is by creating a variable. I''m going to call that variable "data" for a very specific reason I''ll get to in a bit. And then I''m going to put in that variable a new SlashCommandBuilder. Then I can start to set its properties. I can say data.setName. It''s going to be called "choochoo," data.setDescription. It''s going to be called-- the description will be like, "This is a demo choo choo." You can think of a better description when you do it. And even though I did this as three separate lines of code, when you look at my example-- it''s kind of a nice-- a nice thing you can do is just chain these. So rather than have a separate line of code, I can just say, make the new SlashBuilder .setName. And then, from there, I can even chain .setDescription. And then, when I save, my autoformat will put line breaks there because that line of code is too long. Now, the next thing I need to do is write a function that will handle any interaction with this command. I''m going to call that function execute. And it''s going to receive as its argument an interaction object. Now, you don''t have to call it "execute." But again, the naming is specific here because I''m going to do something else that is going to look for something called "data" and something called "execute." And I''ll get to that later. The other thing you might notice here is the keyword "async." So I''m using promises-- the concept of promises-- in this code, with the keywords "async and await." If that''s completely unfamiliar to you, I will link to a whole set of videos, where I go through that. The main thing you need to realize is that certain things you do with the Discord API are asynchronous events. It takes some time for them to complete. And if I want to write my code in a way where I''m sequencing them properly, I''m going to need to use the "async" keyword to describe the function that has asynchronous events as part of it, and the "await" keyword to make sure I''m waiting for the asynchronous events to complete. And what is the asynchronous event I want to happen? I want to reply to the interaction. So again, this bot barely does anything. You can actually have commands that take different arguments, that play a game with you, that reach out to other APIs, that post images. But I just want a Hello World-style bot that sets up a command and, when you execute the command, it just posts a reply to the server itself. Now, something important here that I''ve left out of the code. This separate file is one that I''m going to need to reference and work with from this main bot.js file. How could I possibly do that? Well, I''m doing that already, actually. I''m referencing objects and functions from discord.js and from dotenv. I want my choochoo.js file to be something that I can actually import into this file. How do I make things in other files that I can import into other files? Guess what. I just need one more keyword, the keyword "export." So now you''re learning a little bit about making your own modules that can be imported into other JavaScript files in a Node.js project. And in fact, I can add that right now. I''m going to say import star-- because I just want to get everything-- as choochoo from "choochoo.js." So I think this will work. Oh, no. It''s in commands-- "commands/choochoo.js." I might need a dot-slash here just to say that it''s in the root directory of this project, but I''m not entirely sure. We''ll try it both ways. But I think best practice would put that dot-slash there. So there''s another step. And if I go back to here-- we can see I''m at the end of this Create a command step. And the next step is Deploy the commands. So this is a little bit weird. This is not actually code that''s part of the bot itself. This is a one-time operation that essentially says to the Discord server, hey, this bot is going to have these commands associated with it. So I only need to do this once. Now, if I were to change the name of a command or add new commands, then it would have to do this again-- but a one-time only thing. I''m not going to go through the code for what''s in deploy commands. I actually just pulled it entirely from this guide here, under registering SlashCommands. I might have made a few little adjustments to it in case I did something differently in my code. But essentially, you could just copy-paste it. By the time you watch it, this will be a link. Here is the code. I''m going to copy it. I''m going to create a file called deploy-commands.js. I''m going to paste this in here. And if I''ve done everything correctly-- if I''ve set up my client ID, my server ID, my token-- this should just work. You''re also going to notice here, if "data" in command and "execute" in command. So it''s looking for those exports called "data" and "execute." So that''s why I needed those function names, because the deploy commands code is specifically looking for those. All right. Let me try running that. Great. Started refreshing 1 application commands. Successfully reloaded 1 application commands. So that means it worked. If you get an error there, it might be like a token or client ID is wrong. You might have not named it "data" or "execute" properly. Your file might be in the wrong directory. Maybe it''s not in a folder called "Commands." So look for those things. But if you followed my instructions, this should hopefully just work. Now, if I log my bot in by calling bot.js, and go back to Discord and type in Slash, that command is listed there. So let''s just try running it. I''m going to hit Enter. It didn''t respond. So I did register the command. I did write the code for what I want to happen when the command is executed. But I need to handle it from here in the main bot code. Last step. There''s another event. So client.once is for events that can only happen once; client.on is for events that could happen multiple times-- like, somebody could issue the command multiple times. So the event I need to handle is InteractionCreate. Then I need a function to handle that. And now it''s time for me to write that function. The argument to that function is an interaction object. I want to first make sure it actually was a command. If that interaction wasn''t a command, I want to just get out of here. Other kinds of interactions, I will get into later. But right now, I''m only handling interactions that are commands. Then I need to check, what was the command name? Dot-commandName equals "choochoo." And I should probably use a more strict equality there. So if the command''s name was "choochoo," then I want to run the execute function that''s part of the choochoo.js file that I''ve imported. And I want to execute that interaction. So there''s not a lot here. This is essentially saying I want to handle any interactions and then farm those off to my commands file. So I could have multiple command files. I could load multiple ones. I could check to see which commands it is and execute the proper execute function. I will say, if you have more than just one or two or three, this if statement isn''t the best way of doing it. But this is perfect, I think, for a quick Hello World, let''s just get it working demo. I forgot something important that I just realized. The execute function. Oh! I almost shouldn''t have realized this because I should let myself get the error. But the execute function is asynchronous. I need to await it to finish. And I can''t say "await" unless I''ve labeled the handle interaction function "async." So this readyDiscord event doesn''t need to be asynchronous because all it''s doing is console logging. That''s not an asynchronous event. It''s just console logging. But handling the interaction is asynchronous. OK. I think I''m ready to go. By the way, there are different tools which will automate the rerunning your node program over and over again any time you change the code. Something called nodemon, or node monitor, is something you could use, but I''ll maybe demonstrate that in another video. Let''s just run it manually. OK, it''s running. I go to Discord. The bot is online. I do my SlashCommand-- run this command. [MUSICAL CRESCENDO] It worked. [TRAIN WHISTLE] So that''s actually it. That''s all the pieces for a Hello World Discord bot, essentially, that doesn''t do very much. But if you can get this set up and running, if you can follow these instructions, if you can piece all the parts together, then you are on your way. Now, there''s a whole bunch of things I haven''t covered. Number one, probably the most important thing is it''s much more interesting to have a command that can take an argument. For example, I think I have a GIF command-- let''s try running this one-- and I can give it a query, which is like an argument. And I can get a kitten GIF. So there''s lots of other kinds of ways that you can interact with commands that are much more sophisticated. What kinds of things would you like to make? It''s going to be a little while before I make the next video in this series. So you can let me know in the comments, and I can try to design some examples and demonstrations. You can also have bots do all sorts of things-- respond to emoji reactions, play games with you, do things outside of the SlashCommands. I will explore that in future videos, as well. I should also mention that I''m doing something kind of strange here. You can just stop watching now. But if you want to give me a minute, I''m going to just talk about the pieces of where they are and how they''re working on the whiteboard if you want to think about how you might want to have your bot running in the future. So the thing that''s strange about what I''ve done is, on my laptop, I am both running the Discord client-- the actual Discord application. That''s the thing that I as a human type into and read people''s messages and react to them. I''m also running this Node.js bot, essentially. And you would think, oh, it''s a bot. It should just communicate with the Discord application. But the whole point of this is that your bot isn''t running on your laptop. Your bot you probably want to deploy somewhere else, to a server that''s always on. And ultimately, the Discord API, the Discord Web Service, is hosted on a server somewhere in a closet or an underground bunker. But sure, we could call it the cloud. And essentially, what happens is your bot is logging in and authenticating here and sending messages here. And your client is also connected to and receiving messages and sending them. This way, other people, who happen to be running Discord, are also seeing the messages that your bot is doing and also able to send commands that will then interface with the bot and then send them back-- and back and forth. So it''s important to realize that this is a distributed network of clients that are all connected to a centralized Discord server. And your bot is just an automated one that happens to be running from Node rather than some user interface. So this maybe is something that I''ll have to address later. But if you want your bot to be running without you having to just run it manually from terminal, and then if you turn your computer off it stopped, you''ll have to find a place to deploy it. And I can cover that in other videos and provide some resources here as well. And so I should also leave you with-- if you want to explore this more, you should really look at the discord.js documentation. I already prepared to walk through this tutorial so I''ve pulled the pieces out that I need to know. But if you want to look at what all the things that are possible, the names of the functions, the different things that I''m using, this is really where you want to look. And I''ll dig into this more in the next video. So let me know if you got your bot working. Share that with me. There''s actually a place on the Coding Train-- we''ll include this as part of the passenger showcase. You can share a bot. And then things you want to try that you don''t know how to try that you think would be fun for me to do in a video, leave those in the comments. Or better yet, join the Coding Train Discord itself, and let''s chat about it. All right. Thank you so much for watching this. I hope you get a bot running up that''s fun for you. And I''m sure you''re going to be very creative with it. I don''t know what I''m talking about. I got to go. I''ve been recording these videos. Do you notice I''m wearing the same clothes in, like, five videos straight? I''ve been doing this all day long. Time for me to do something else. Goodbye. [TRAIN WHISTLE] [MUSIC PLAYING]'
