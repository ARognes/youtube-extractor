transcript: 'Hi. I''m very excited about this video. I''ve been recording a whole bunch. You could watch the previous ones, but you don''t have to. Because if you''re ready to write a Discord bot in Node.js-- you''ve got Node set up on your computer, you''ve got a code editor, you''re just waiting to type what you need to type in to make your Discord bot work-- then you are in exactly the right place. If you don''t have Node set up, if you don''t know what I''m talking about, there''s a few videos where I went through some workflow stuff before this that you could go back and watch. But let''s just get started. I''m going to make a list here of what I want to accomplish in this video. The first thing I want to do is create-- I want to create a Node project with the discord.js dependency. That is the package that I''m going to use to work with the Discord API. I need to create a Discord application through the Developer Portal. And I need to make it into a bot. I''m going to need to set all of its permissions and add it to the server-- the Discord server I want to interact with it. I''m going to need to save the secret token that goes along with the bot that allows me to work with it from my code. And then I want to write the code for loading the discord.js package for authenticating with the token and then setting up a SlashCommand. So I''ll look at what a SlashCommand is, but it''s the basic primary function of a bot. Although my plan is, after this video is done, do all sorts of other fun and wacky and weird things that you can do with Discord bots outside of just plain SlashCommands. But that is a great place, I hope, to get started. I should also mention that I made some Discord bot tutorials a while back, and they''re completely out of date. And I expect that the one I''m making right now will probably go out of date relatively soon. So I''m going to try to minimize the post-production and editing here and just go back to my roots of the raw, unedited Coding Train mess that is trying to make a project and teach it in a video and-- and-- and-- stutter and weird and trip over things and all that stuff. All right. But there will be some edits. Like, I''m going on for too long right now so let''s just edit right here. [BEEP] So good news. You actually don''t have to watch this video. There is a guide that I have put together, with a lot of help from several wonderful, generous members of the Coding Train community, which outlines all of the steps. And you might just be able to follow it without watching me go through it. But if you would appreciate watching me go through it, that''s what I''m going to do. I should also mention that my guide is based almost entirely on the Discord.js Guide itself. So this is a little bit confusing. There are three things at play here. The Discord API is the Discord Application Programming Interface, which is a general purpose thing made by the company Discord itself to allow people to write applications that work with the Discord service itself. There is also something called discord.js, which is a Node Package that allows you to work with the Discord API from Node in JavaScript. It is made by other people, not officially from the Discord company itself. And third, there''s actually a whole Discord.js Guide, which I''m linking here in the video, where you can read lots of information and a nice walkthrough about all the wonderful things and possible things you could do with discord.js itself. What I''m doing is building on top of the work of the wonderful people who made the Discord.js Guide to try to make a smaller version of a little guide to help you get started working with discord.js to make something that works with the Discord API. I''m going to start from a clean slate. I am in terminal, in the desktop, and I''m going to make a directory. So I''m now in a directory, called discord-bot-choo-choo. I want to turn it into a node project. I''m going to say npm init. And I''m just going to say -y so that it fills all the package.json stuff out by default. Great. I know that the Node package primarily that I want to use is discord.js. So let''s install that. And I think I''m ready to go, but maybe I should open up this project in Visual Studio code. I know I''m going to be using ES modules, import statements, so I better add that to package.json. Then I need a JavaScript file, where I''m going to put my code for the bot. I''ll call it bot.js. Let''s rename index.js and package.json to bot.js. OK. So I''ve set up the project by saying npm init, and I installed discord.js. I forgot to install the dotenv package. Let''s add that. I did add "type" : "module" to package.json. Great. So this first step was just to get the node project set up, but, really, it''s not worth trying to start writing the code until I''ve actually made the Discord application itself. And I need to do that through the Discord Developer Portal. Now, you will need a Discord account. I''m not going to show you how to sign up for the Discord service, generally, in this video, but there''ll be links in the description for just making a general Discord account. But once you''ve done that, as long as you go to the Developer portal and you are logged in-- which I am-- you will see a page that looks like this. Now, most likely you won''t see all these example bots and applications just right there. I''ve been making them over the years in different workshops and scenarios. So this will be blank. And what you want to do is create a new application. So I''m going to do that. I''m going to name the application Coding Train Choo Choo Example. I''m going to agree to the Discord Developer Terms of Service. And why not add a nice profile picture here. There we go. I could write more about the description, et cetera. But one thing that I do want to make note of is this application ID. It''s also sometimes called client ID. We''ll need it later when you start writing the code. To be continued. Now, the application is just the start. The next thing I want to do is click on Bot. The other thing I''m really going to need, but I''ll come back and get it later, is this Token. Token is the most secret part that you need to hold on to as carefully as possible. It''s essentially your password for using this bot anywhere. The next step is to add a bot to a server with the proper permissions. Now, a really important thing for me to say here is you can''t just willy nilly add bots to servers. So what server are you going to add it to? I''m going to use the Coding Train Official Discord Server because I am the owner of that server and I have permission to add bots to it. But you will most likely need to create your own server unless you already happen to be part of a Discord server, where you have permission to add bots. This is the official Coding Train Server. It''s what it looks like in the Discord application. At the bottom left, if you scroll all the way down, there is a Plus, where you can add a server. You could obviously join an existing server or create your own. So most likely, if you want to follow this tutorial, you''re going to need to create your own so you have permission to add bots to it. Back to the instructions. In the Developer Portal, you want to go under OAuth2, and under URL Generator. Here is where you are going to select the scopes and permissions you want your bot to have. There might be many more things that other future examples and things that I''m going to demonstrate might require, but right now the only things I''m going to demonstrate to you are applications.commands-- that''s the SlashCommand; I''ll show you how that works in a bit in this video-- and then bot. Once I''ve done that, there''s a lot of other permissions here. Again, we could get into the very granular level of what your bot can and cannot do. But all I actually need is to copy this URL that''s been generated at the bottom. Then, I can paste that URL into the address bar, hit Enter, and it''s going to come up with this menu. An external application Coding Train Choo Choo Example wants to access your Discord account. I''m good with that. And what it''s going to be allowed to do is add a bot to the server and create commands. If I had selected some other things, those might be listed here. It really should be allowed to bake a cake. That would be quite nice. And I could pick what server I want to add it to. It''s by default, somehow just already pre-selected, Coding Train Choo Choo. So that''s great. But other servers I could select here. I''m going to hit Authorize. This is always the part that I have the most confusion with because I am a human, but I''m making a bot. I guess it wants to know that a human is making a bot and not a bot is making a bot. Then I need to two-factor authenticate, which I would highly recommend you set up for your account. I''m still human, as far as I know. Authorize. And now it''s been added to the server. Let me go back to my server and see if I can find it. I made a private channel, called Bot Example, just for the purpose of recording this video. Let me try adding it to this channel. Ah, Coding Train Choo Choo Example Bot. I''m going to select that. And I''m going to hit Done. Again, I''m pretty sure if you set up a general new server, you''re not going to have to worry about adding the bot to a private channel. That''s just something I''m doing here for the purpose of testing inside of this little sandbox. Let me @mention the bot just so we can see and make sure it''s there. OK, it didn''t talk back to me. That''s something that we could have it do once we learn how to do the code. But I can also click on it and I can now see this is definitely the example that''s a member since today. Ah, it''s in Waiting to board, which is a role that I have before people sign the Code of Conduct. So I''m going to take that out. I''m also going to give it this bot role which is special for the channel. So anything that you can do with a regular user, you can do with a bot user of your Discord server. The important thing here is it is offline. I need to get it online. The other thing I want to make sure that I do is enable Developer Mode in Discord. This is going to be really helpful for various things that I''m going to need to look at in the Discord application itself in conjunction with coding the bot. If I go to Settings, Advanced, Developer Mode-- I already have this checked, but this you''ll want to make sure is checked. Now, before I write the code, I need to create a special file called dotenv. I''ve made videos before about the dotenv package and hiding API keys in a dotenv file. I''m doing the same thing here with the Discord bot. The dot means it''s a hidden file. There are ways that I''m going to want to ignore that file, not include that file, if I publish an upload my bot to different places. But for now, all it means is, as part of my node project, let me make a separate file called dotenv and I''m going to paste this into it. Now, what goes in the file is not 1, 2, 3, 4. I now need to get the client ID from the application, the server ID from the server, and the token-- the secret token. The client ID is the same as the application ID. I could copy it here. It''s also under OAuth2, right here under client ID. So let''s copy that one. Paste that here. The server ID is the specific server of the bot. Now, bots can live in multiple servers. But right now, I want my code and my bot to only work in this one particular server. If you want to make a bot that you''re publishing publicly that anybody could add to their server, there are other kinds of restrictions and things you need to worry about. But for us right now, this is essentially just a developer experiment so I don''t have to do much beyond just get that server ID. I can right click the name of the server and go to Copy Server ID. That''s there because I have Developer Mode on. Paste that here. And then it''s time for the token. Back to the Developer Portal, under Bot, and I have to reset the token. If I don''t have the token, there''s no way to get it without resetting it to a new one. It''s telling me my bot is going to stop working, which it doesn''t work yet anyway so that''s fine. But if I had already made it and I want to reset the token, I''ve got to make sure to update it. I''ve got to two-factor again. And then I want to copy this token and put it in. Now, you might be saying to yourself-- you fool! Your token is visible in your YouTube video. And yeah, that''s a problem. But don''t worry. By the time you''re watching this, I''m going to have reset it. But if you were doing a tutorial live, you wouldn''t want that token to be visible. Guess what. It is time to start writing the code. So the first thing that I need to do is import the things that I need from the various node packages. So let me copy-paste these two lines of code and put them into bot.js. Now, if this syntax is unfamiliar to you, I''ll refer you back to the previous video, where I covered how to make a node project and how imports work. But what you can take away from this right now is that I''m going to need from the discord.js package the Client, the Events, and the GatewayIntentBits. So that''s something I want to talk about and investigate further. But right now, I know I just need those things and I need this function called config from dotenv. So the very first thing I want to do is execute the config function. What that means is it will now place everything that''s in this file, under CLIENTID, SERVERID, and TOKEN, into a variable called process.env. To confirm that, I''m going to say console.log(process.env). Let''s now run this code. I realized just now that in some of my earlier videos I forgot to show that VS Code actually has a terminal built into it. So we could actually do all this from there. I could go to View, Terminal, and I could start writing my terminal commands in here. I''m just out of the habit of doing that. I''m going to work separately in my separate terminal application. But you should certainly feel free to do that instead. Oh, my goodness. I forgot. So one of the wonderful things about process.env-- this idea of environment variables-- is there are a ton of them on my computer. There are all sorts of things. And in fact, if I were on a web server, on a different machine, there''d be different environment variables. But you can see here that the CLIENTID, the SERVERID, and the TOKEN are here on the bottom. So just to be a little bit more explicit about it, if I were to say .SERVERID, I can now see that SERVERID is accessible in the code, but not saved in the code. I''m doing all of this because I don''t want to have this. This is a bad idea. The next step is to authenticate and actually log into Discord from the bot itself. I''m creating a new client object. That client class is something I imported from the discord.js package. And it needs as an argument-- I forgot. I have to look it up in my guide. So in future, things that I might want to try with a Discord bot, maybe I need other properties here. But the core base property that I need is called intents. And I need an array that keeps track of all of my intentions, essentially. Now, why is it called GatewayIntentBits? Kind of a funny name for this variable that holds all of these other constants, like Guilds. Why is it called Guilds? Well, Discord was originally created as a chat platform for gaming. So you can see where the "Guild" terminology stems from. And in the Developer Docs, I can see this list of intents-- all the intents and gateway events associated with them. So this is something you''ll have to pay more attention to as you think about what other things you want your bot to do. But, at present, I essentially don''t want it to do anything. It''s just going to respond to one single basic SlashCommand. So I just want to make sure it essentially has the permission, the generic Guilds intent. "Intent" is a word for intention. What are this bot''s intentions? We''ve got to list them in advance to make sure it''s allowed to do those things. And the reason why it''s called Bits is actually these variables are holding numbers. And based on the binary values of these numbers, different bits being on or off, it turns on and off different kinds of intents. So that''s a whole other discussion. I''ll include some more links to information about how that works in this video''s description. So next, I want to handle different kind of events associated with the Discord bot. One of them would be just being ready, logged in. So I can call the once function for any event that happens just one time. And I can access from the events property that I imported the ClientReady event. And then I can give it a callback function. I could write that in as an anonymous function here. But just to be super friendly, let''s call it readyDiscord. And let''s define the function. And I''m just going to say console.log, the train emoji. And I could put in here, I think, client.user.tag-- maybe-- as a way of getting-- just to make sure I''m getting the actual correct bot name. But you can see that this client object that I''ve created has different properties on it-- like its user tag. All right. Let''s try running this. Ooh, that didn''t seem to work. Oh! I realize I forgot-- so this is the event for when it''s logged in, but I actually have to tell it to log in. So I also want to say client.login. And what do I need to log in? I need its token. The token is hidden away in process.env because of how I''m using the dotenv package. OK. Now, let''s try running this. Great. It''s logged in. Let''s go back and look at the Discord server. Look. The green light is on because this bot is online and it''s logged into the server. As soon as I hit Control-C, I''ve quit the Discord bot code. Now it should log out. I have a feeling, if I go back and look, it''s still going to be