transcript: here's a question how big of a square can you make where every row and column is a different valid English word it's not too difficult to come up with a 3X3 that works and a 4X4 is challenging but doable by hand but what about a 5x5 or 6x6 or larger the answer is they get surprisingly large but before we go there let's go over the basics just like my word chains video this video was also inspired by my son who likes to make his own crossword puzzles and he wanted to know how densely we could pack them and so of course I instantly wanted to make a solver to answer the question if you've ever played a US style crossword you'll know that they don't generally stick to word game rules it's really common to see acronyms abbreviations names of people companies countries cities and even phrases there 's really no rules for what's allowed in a crossword puzzle so maybe you could argue that any large grid of random letters is a solution as long as you can come up with clues for each row and column but that's no fun for this challenge let's just stick to actual words you would expect to find in a dictionary there is a lot of options but I think going with the Colin Scrabble dictionary makes the most sense here since it's one of the largest ones so what's the fastest algorithm to find these squares well here's what I came up with we just go through the list of every possible word horizontally and see if it could be the start of each word vertically if it passes we repeat the process on the next row if it fails we try the next word instead and if we run out of words we backtrack to the previous step now it sounds like brute force and it is but all these step steps are made efficient by one of my favorite data structures the try the try is like a tree but instead of storing any data the branches themselves are the data either a branch exists which means it's the start of a real word or it doesn't exist which means that sequence is impossible so from the try I can keep one iterator for the current word being spelled horizontally and one for each vertical column and when when one of the tries doesn't work I just try the next letter or if there's no more I backtrack to the last step so even though it does need to try every possible combination the vast majority of these will never make it past the first few rows and there's so few valid words that can fit after that the search ends up being surprisingly fast for what it is in fact this might actually be the fastest possible way to do it but let me know if you have any other ideas to speed it up the whole algorithm was only like 20 lines of code so let's try it out on a 4x4 yeah it turns out there's way too many solutions and most of them will be with some of the most obscure words you've never heard of but since we have so many we want some way to filter them to be the most common easiest words possible luckily I found a list of over 300,000 words sorted by frequency from the Google Books engram viewer so you might ask why not just use this list instead of the Scrabble dictionary well the problem is that the frequency list contains all English text including names acronyms Roman numerals typos and so on which are actually very common and show up surprisingly high on the list instead I can use it as a filter on the Scrabble words so for example let's say I want solutions for a 4X for but only if the words are also in the top 1,000 most used words here's one of those Solutions it's much nicer now but you might notice a problem most of the solutions end up with the same words for the rows and columns I mean it's technically correct but it's much more interesting to have unique words so I also added a filter to show only solutions that contain all unique words whenever possible and that's how we get to something like this so it's easy to get a nice 3x3 or 4x4 even by hand but how high can we go now well here's a 5x5 with very common words all in the top 15,000 we have swamp three Roots asset Piers strap who aose meter and pests how about a 6x6 they're starting to get a little less common now we've got gnomes repent outage origin moment snares Grooms neuron Optima meager engine and Sten so what about a 7x7 well just barely I'll need to whip out a dictionary for this one so we have bed poost iable decrete flatlet airik sneezer testers bedfast eyeline decares partlet obiz sleer and tedar but if you prefer words that are more common there are solutions with repeats like this one with scapula cab Bas abusers passage uneaten largest and asense as for 8x8 unfortunately there weren't any solutions with all unique words but there are still Solutions with repeated words and the best one I found is opes Pimon amending lentando in danger stinging condense and engorged on to 9x9 there's more than 42,000 words with nine letters in the Scrabble dictionary which means we have 42,000 to the 9th power or over 400 Duo deilan possibilities after trying every possible one of them there were exactly Zero Solutions and yes it sounds insane that I can do that but remember as soon as the Sal gets into a state where it's impossible to insert a word it backtracks immediately skipping later combinations it doesn't need to check so I guess that's the answer at least with the Scrabble dictionary the biggest we can go is a 7x7 for Unique words or an 8x8 for repeated words but there's more extensions we could add to make things more interesting first what if we wanted to include diagonals and second what about rectang angular grids of different sizes let's start with diagonals first we can definitely make some nice 3x3 and 4x4s that shouldn't come as a surprise but what about a 5x5 it's possible but we might have to learn a couple more words together we've got class L Acres Mains platty clamp local Atria stent sassy and the diagonals corny and strap if we're already getting some obscure words at 5x5 can we get to 6x6 yes we can with aphids Bluey balded online tener stress abits Planet holler iodine dine saders allies and sidles okay 7 by S nope that's unfortunately the highest we can go with diagonals all the source code is on my GitHub if you want to make other squares or try it in other languages there's no sponsor today but I appreciate all the support on patreon and coffee and any support for my games they make videos like this possible and and as for rectangular grids there's a lot of them so rather than reading through every single one I'll just play them here uninterrupted and give a big thanks for watching [Music] n [Music] [Music] [Music] oh e [Music] 3 [Music] 2 [Music] oh [Music] n [Music] [Music] [Music] [Music] [Music] oh [Music] [Applause] [Music] [Music] [Music] n [Music] [Music]
