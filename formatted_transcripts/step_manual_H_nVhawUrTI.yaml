transcript: '{"content":"\n[0.0s] You know that sensation of a inner click\n[2.88s] when an idea snaps into place and just\n[5.6s] feels right?\n[7.68s] Not I think that this is so, but I can\n[9.96s] see that this is so.\n[12.4s] We treat that feeling as evidence.\n[15.8s] That inner clarity itself seems to vouch\n[19.12s] for its own accuracy.\n[21.24s] And the clearer the insight, the more\n[23.44s] that we trust it.\n[26.32s] Now, I''m going to be making an\n[27.44s] uncomfortable claim in this video.\n[30.08s] That that feeling, no matter how deep,\n[33.2s] how clear, how hard-won, it''s not an\n[36.32s] infallible indicator of accuracy and it\n[39.8s] never was.\n[41.92s] Not because feelings like that are\n[43.8s] worthless,\n[45.28s] but because there''s no inner position\n[47.52s] that can certify itself.\n[50.96s] There''s no private vantage point from\n[53.16s] which our knowledge is going to be\n[55.12s] guaranteed.\n[57.64s] Around the world for thousands of years,\n[61.36s] people have looked for just such a\n[63.96s] guarantee and the search keeps failing\n[66.96s] and the failures can teach us something.\n[71.24s] The upshot of this all is not despair\n[73.88s] though. It It only means a change in our\n[76.32s] perspective.\n[78.92s] So, here''s going to be the plan for this\n[80.6s] video.\n[81.76s] First, we''re going to pin down what a\n[83.88s] privileged epistemology would even be.\n[87.6s] Then we''re going to see three brilliant\n[90.2s] Western thinkers, Descartes, Kant, and\n[93.36s] Kepler,\n[94.64s] each trust their own inner certainty and\n[97.2s] each get things wrong in the same way.\n[102.04s] We''ll look at why that keeps happening.\n[105.28s] Then we''ll turn that same question on\n[107.84s] meditation and on the Buddha himself\n[111.4s] and ask whether deep contemplative\n[113.68s] insight fares any better.\n[117.6s] And we''re we''ll end with where this all\n[120.36s] leaves us, which is not quite as bad as\n[123.28s] as we might fear.\n[128.759s] Okay, what do we mean by the phrase a\n[131.76s] privileged epistemology? It''s it''s a\n[134.12s] mouthful. It''s something philosophers\n[136.0s] say.\n[137.4s] But plainly speaking, it''s the idea that\n[140.16s] there is some way, some method, some\n[142.8s] kind of access, some faculty,\n[145.959s] some state we can get ourselves into\n[149.92s] that must deliver truths to ourselves in\n[152.68s] a way that is self-evident, that''s\n[154.84s] obvious.\n[157.24s] That''s to say this state or place or\n[159.32s] whatever it is\n[161.32s] uh is somewhere where we could certify\n[163.6s] that those truths are true from the\n[166.36s] inside all by ourselves.\n[170.28s] Now, the appeal to looking for this kind\n[172.32s] of thing is is obvious. If we had it,\n[175.68s] we''d have a firm foundation for knowing\n[179.28s] things, everything perhaps.\n[181.64s] Someplace that we could stand where we\n[183.68s] couldn''t be wrong.\n[185.8s] And upon which everything else we know\n[189.08s] could be built perhaps.\n[191.92s] It''s one of the oldest dreams in\n[194.16s] philosophy to find this kind of\n[196.6s] foundation for knowledge.\n[200.0s] And we''re going to see three of the most\n[202.04s] brilliant attempts to secure something\n[204.0s] like this and watch each of them fail at\n[206.6s] the same place.\n[211.4s] Now, René Descartes was a brilliant\n[213.56s] French philosopher who took it upon\n[215.8s] himself to undermine what he believed\n[219.32s] were outdated beliefs about the the way\n[221.959s] the world is, that the West had\n[223.84s] inherited in particular from Aristotle\n[226.8s] and other earlier thinkers.\n[229.44s] And once he demolished all of that to\n[232.28s] then rebuild all of knowledge on what he\n[235.28s] thought were firmer foundations.\n[239.24s] He did this primarily through an\n[242.16s] internal method of rejecting any belief\n[245.96s] that he felt left any room for doubt at\n[249.48s] all.\n[251.32s] For example,\n[252.72s] it seemed quite obvious to him that he\n[254.48s] was sitting in his room in front of the\n[256.2s] fire.\n[257.519s] But he asked himself,\n[259.4s] \"What if I were just dreaming? What if I\n[261.28s] were asleep?\n[262.919s] What if I had been deceived by an evil\n[265.72s] demon of some kind?\"\n[268.64s] Well, even in those cases, at least at\n[271.72s] the very least, Descartes said he knew\n[274.88s] he would know that he was thinking.\n[278.72s] And he thought, \"If I think, then I must\n[281.96s] exist.\"\n[284.28s] What he was left with\n[286.48s] was a kind of general method\n[290.28s] that only whatever he could perceive\n[292.76s] clearly and distinctly as true\n[296.32s] must be true.\n[298.72s] Everything else, everything that he\n[300.04s] couldn''t perceive that way would be\n[302.12s] doubtful and so rejected.\n[305.68s] So, clarity to our reasoning faculty\n[308.04s] became the mark of truth to him.\n[311.44s] Now, notice what has happened here.\n[314.04s] Descartes has named an inner feeling\n[316.36s] that is clarity, distinctness,\n[320.36s] and made it the certifier\n[323.2s] of truth.\n[325.12s] And this is what we mean by a privileged\n[327.28s] epistemology.\n[330.68s] But this\n[331.8s] process left Descartes certifying\n[334.88s] knowledge of himself\n[336.84s] as a substantial, existing, persisting\n[340.72s] soul.\n[342.36s] Now, he said that he had seen that\n[345.28s] clearly and distinctly.\n[348.56s] But other thinkers like David Hume for\n[351.04s] instance and for us the Buddha\n[353.8s] would have strenuously disagreed with\n[356.04s] Descartes.\n[358.2s] They would say that Descartes had only\n[360.12s] seen various thoughts, but he had never\n[363.32s] seen a substantial thinker as well who\n[366.36s] owned those thoughts.\n[369.68s] And anyway\n[371.2s] even that even thinking of himself as a\n[374.32s] as a thinker wouldn''t have taken\n[376.48s] Descartes very far.\n[378.84s] Further knowledge\n[381.0s] uh only would have become available to\n[383.8s] Descartes on the supposed proof\n[387.24s] that God existed.\n[389.919s] Which Descartes also felt that he knew\n[392.28s] clearly and distinctly\n[395.32s] but which has also proven less than\n[397.56s] convincing to many others around the\n[399.76s] world.\n[402.56s] Notice that the problem here isn''t just\n[404.8s] that people disagree.\n[407.72s] It''s that that very same inner feeling\n[411.4s] that supposed clear and distinct\n[414.16s] luminosity\n[416.2s] certifies a substantial soul and a God\n[419.48s] for Descartes and no such soul and no\n[423.28s] such God for David Hume.\n[426.76s] And a feeling cannot be the mark of\n[428.68s] truth if it shines just as brightly on\n[431.88s] incompatible claims.\n[437.88s] Now Immanuel Kant took the problem of\n[441.44s] epistemic validation very seriously.\n[445.919s] His project was to map the way that the\n[448.8s] structure of our thinking imposes itself\n[453.36s] on our experience, on what we\n[454.96s] experience.\n[457.48s] He argued\n[459.16s] that we could know that Euclidean\n[461.76s] geometry was true of the world in\n[465.4s] advance of any possible experience that\n[468.6s] we might have.\n[470.92s] Because that geometry described the\n[473.6s] necessary structure of any possible\n[476.84s] experience that we might have.\n[480.56s] That is Kant believed that we could know\n[482.16s] intuitively without fear of error\n[486.2s] that in our world parallel lines would\n[489.28s] never meet.\n[491.52s] That the angles of a triangle would\n[493.6s] always sum to exactly 180°\n[497.36s] and so on.\n[499.8s] But then\n[501.04s] the ground moved.\n[503.2s] Non-Euclidean geometries were discovered\n[505.76s] to be perfectly consistent.\n[509.36s] And further\n[510.919s] Albert Einstein showed in the early 20th\n[513.36s] century that actually our own universe\n[517.24s] is not Euclidean at all. Spacetime is\n[520.719s] actually curved. It''s not flat as in\n[525.16s] Euclid''s picture.\n[528.12s] So the structure that Kant said he knew\n[530.08s] had to be true\n[532.44s] not only wasn''t true, it wasn''t even the\n[534.04s] geometry of the world that we live in.\n[538.12s] Now it was the same problem that\n[539.8s] Descartes had earlier.\n[542.68s] His thinking that I can''t conceive\n[544.76s] otherwise\n[546.32s] got mistaken for it can''t be otherwise.\n[554.8s] The case of Johannes Kepler is perhaps\n[557.0s] the most vivid because it isolates that\n[559.8s] feeling quite cleanly.\n[562.64s] At the time that he was active there\n[565.04s] were only six known planets in our solar\n[568.08s] system.\n[569.839s] And Kepler asked, \"Why are there only\n[572.32s] six?\n[573.68s] Why aren''t there five or seven or a\n[576.08s] hundred planets.\n[579.04s] The answer that he came up with was\n[581.12s] ingenious and breathtaking.\n[584.12s] Now, Kepler knew that it followed from\n[587.08s] that very same geometry we just\n[588.72s] discussed, Euclid''s geometry,\n[590.92s] that there were only five of what are\n[593.2s] the so-called Platonic solids.\n[596.28s] That is, there are only five perfect\n[598.16s] three-dimensional shapes made up of\n[600.44s] identical regular polygons.\n[604.32s] Kepler asked himself,\n[606.44s] \"What if we nested each of these\n[608.44s] Platonic solids inside of one another\n[610.88s] like a set of Russian dolls, so that\n[614.04s] they could\n[615.28s] rotate freely?\n[617.8s] And suppose each of them supported a\n[619.4s] sphere that touches that touched its\n[622.0s] vertices,\n[623.8s] as well as there was an innermost sphere\n[625.72s] that touched the centermost solid?\"\n[630.64s] That arrangement would explain why there\n[632.96s] were exactly six planets\n[635.68s] and nothing more.\n[638.24s] The shape of the cosmos seemed to fall\n[641.56s] out of pure geometry.\n[645.16s] Now, Kepler was a serious thinker, and\n[647.72s] this was not a lazy idea of his. It was\n[650.0s] mathematically elegant.\n[652.44s] And it gave him the feeling of having\n[654.44s] touched the mind of God.\n[657.68s] His insight felt to him like a kind of\n[659.96s] revelation.\n[661.6s] And he spent years trying to make it\n[663.839s] square with the observational data.\n[667.36s] But he never could.\n[669.16s] The reason why is that Kepler was\n[671.64s] completely wrong.\n[673.56s] There, as we know now, aren''t only six\n[675.8s] planets.\n[677.24s] The spacing between each planet does not\n[679.839s] correspond to that between nested\n[682.48s] solids.\n[684.839s] And so Kepler''s whole project was a\n[687.56s] beautiful coincidence dressed up as a\n[689.92s] kind of potential proof.\n[694.4s] What was so great about Kepler\n[697.32s] is that he himself is the one who\n[699.56s] noticed this.\n[701.52s] Even before his book on the subject\n[703.52s] called the Mysterium Cosmographicum was\n[706.36s] finished,\n[707.64s] Kepler had already realized that the\n[709.76s] solids didn''t quite fit these real\n[713.08s] orbital distances of the six planets\n[715.4s] that he knew.\n[717.12s] And years later, when he was working\n[719.0s] with\n[719.88s] Tycho Brahe''s observational data, which\n[723.16s] is the best in the world at the time,\n[726.16s] Kepler found that the planets weren''t\n[728.08s] even moving in circles at all, but in\n[730.8s] ellipses.\n[733.0s] A discovery that finished off this\n[735.16s] nested solids model for good.\n[739.96s] So, the this kind of felt rightness of\n[742.88s] Kepler''s insight\n[744.6s] came apart from the measurements. And\n[747.6s] we all know now that his his\n[750.32s] measurements were actually what was\n[752.0s] right.\n[753.4s] So, what do we learn from these examples\n[755.44s] and particularly from the example\n[757.8s] of Johannes Kepler?\n[760.2s] We learn a general principle.\n[763.0s] That the phenomenology of insight,\n[766.48s] this felt sense that we have that an\n[768.92s] idea must be true,\n[771.32s] is not a perfectly reliable indicator of\n[774.56s] truth.\n[776.44s] A false idea, such as idea of these\n[779.28s] nested solids,\n[781.0s] can feel exactly as luminous\n[784.12s] as a true one.\n[786.16s] From the inside, we can''t tell them\n[787.88s] apart by their feelings alone.\n[791.88s] Descartes, Kant, Kepler, all of them\n[794.8s] were absolutely brilliant thinkers,\n[797.36s] all with the same sincere felt sense of\n[801.04s] clear insight.\n[802.8s] And all were in error.\n[809.0s] So, that idea of inner certainty that we\n[812.16s] all know, that eureka moment. I''m sure\n[815.28s] that we''ve all had it from time to time.\n[817.84s] Maybe when we''re working on some hard\n[819.92s] problem that we had in school or\n[821.6s] something that we''ve\n[823.44s] figured out for ourselves in daily life.\n[827.0s] One of the most incisive philosophers of\n[829.44s] the 20th century was a man named Ludwig\n[832.32s] Wittgenstein.\n[834.4s] In his posthumous work called On\n[836.52s] Certainty,\n[837.96s] he discussed the gap between feeling\n[840.72s] certain on the one hand and being right\n[844.76s] on the other.\n[846.8s] One of the most famous lines from that\n[848.84s] book of his\n[850.48s] is misleadingly obvious in a way, but in\n[853.36s] fact quite profound.\n[855.88s] It''s this.\n[857.6s] He said,\n[860.16s] \"One does not infer matters of fact from\n[863.24s] one''s own certainty.\n[865.72s] Certainty is, as it were, a tone of\n[868.52s] voice\n[869.8s] in which someone states facts.\n[872.8s] But one does not conclude from the tone\n[875.6s] of voice\n[877.32s] that he is justified.\"\n[881.48s] That is, a feeling of certainty is not\n[883.44s] something that we can always take to the\n[885.12s] bank.\n[886.4s] It points at the depth of our inner\n[888.68s] convictions, not necessarily out at the\n[891.6s] world.\n[893.8s] This move of treating our own certainty\n[896.839s] as itself self-certifying\n[900.4s] had already been given a name by the\n[903.2s] philosopher Wilfrid Sellars earlier than\n[906.36s] the what what Wittgenstein had said.\n[909.16s] Sellars called it the myth of the given.\n[913.52s] The given is the supposed bedrock of\n[916.96s] knowledge.\n[918.96s] A layer of experience that''s supposed to\n[921.44s] be, on the one hand immediately\n[924.32s] available to us\n[926.96s] and on the other hand able to justify\n[929.76s] our beliefs about the way that things\n[931.92s] are.\n[935.12s] In a nutshell, Sellars'' argument is that\n[937.2s] nothing can do both of these jobs at the\n[939.36s] same time.\n[942.32s] To give justification to our beliefs\n[945.84s] a state has to have conceptual content.\n[949.96s] It''s got to say something to us.\n[953.68s] It has to be the kind of thing that\n[955.04s] could be right or wrong.\n[958.04s] That could stand in logical\n[959.52s] relationships to other claims that we\n[961.4s] might make or other people might make.\n[965.2s] But anything with this kind of\n[967.0s] conceptual content\n[969.52s] is already going to be shaped by the\n[971.56s] framework of concepts that we''ve learned\n[974.92s] and that we could in principle decide\n[978.36s] need to be revised.\n[981.28s] That is\n[982.44s] data that''s presented to us like this is\n[984.68s] not actually immediately available to us\n[988.4s] at all\n[989.92s] although it might seem that it is.\n[992.8s] In fact, it needs it needed\n[994.76s] interpretation.\n[996.92s] Even if that interpretation from our\n[999.36s] minds seemed automatic or effortless to\n[1001.96s] us.\n[1003.839s] And any interpretation like this could\n[1006.76s] be in error.\n[1011.331s] >> [snorts]\n[1011.76s] >> Now, every contemplative tradition\n[1013.76s] carries some version of this same dream.\n[1019.28s] That is to try to find a state that''s\n[1021.24s] deep enough that it can deliver truths\n[1024.079s] to us directly\n[1025.92s] in a way that is self-certifying and\n[1028.16s] incapable of error.\n[1031.28s] That is to find a state that needs no\n[1034.439s] outside authenticity check because the\n[1037.68s] seeing itself is\n[1040.0s] the authentication.\n[1042.72s] This kind of state\n[1044.64s] is among the most powerful experiences\n[1047.56s] that anyone can have.\n[1050.84s] It''s often life-changing to believe that\n[1053.24s] we have seen things like this.\n[1056.52s] That is, this kind of clarity is real\n[1058.72s] clarity,\n[1059.96s] and the temptation to treat clarity as a\n[1062.68s] as something self-validating\n[1065.72s] can be overwhelming.\n[1069.36s] But, let''s step back for a minute and\n[1071.0s] consider the descriptions\n[1073.96s] of realizations that we find across\n[1076.84s] contemplative traditions, the\n[1079.04s] very ones that contemplatives take to be\n[1082.32s] self-certifying.\n[1085.68s] Deeply realized practitioners\n[1088.4s] across traditions\n[1090.56s] describe what they are awakened to in\n[1093.76s] flatly incompatible ways.\n[1098.52s] The Advaitan from Hinduism reports\n[1102.44s] identity with an absolute transcendent\n[1105.0s] self,\n[1106.4s] the Atman, who is Brahman.\n[1110.32s] The Buddhist reports the opposite.\n[1113.56s] A feeling of non-self, of no permanent\n[1116.56s] unchanging self to be found anywhere.\n[1121.72s] Theistic mystics report finding union\n[1125.0s] with a personal God, which is something\n[1128.32s] different yet again.\n[1130.16s] And on and on.\n[1132.8s] We might expect to find that if direct\n[1135.4s] meditative seeing delivered truth to us,\n[1139.72s] the reports of deep meditators would\n[1141.92s] converge.\n[1143.56s] And sure, there are some real\n[1145.28s] similarities that they all point to,\n[1147.24s] such as stillness and so on.\n[1150.6s] But, as descriptions of reality, they''re\n[1153.4s] all radically different. And this is all\n[1155.88s] deeply unsettling to many of us.\n[1159.28s] Now, it could of course be true that\n[1162.2s] most everybody''s wrong.\n[1164.72s] And that one group has the monopoly on\n[1167.52s] truth because only they\n[1170.72s] have found the true practice, the true\n[1173.28s] route towards meditative realization.\n[1177.6s] This is something that the Buddha\n[1178.68s] himself believed in and argued for in\n[1180.88s] the suttas.\n[1182.92s] That is that rivals who claim to found\n[1185.92s] their own truths\n[1187.96s] only seem to lead to freedom.\n[1190.4s] But in fact, all of them left some\n[1193.16s] residue of craving\n[1195.36s] in their wake.\n[1197.84s] And perhaps the Buddha was right.\n[1200.76s] But the deeper problem is that as we''ve\n[1203.04s] already seen,\n[1204.76s] experience itself is concept-laden.\n[1209.04s] And the Buddha knew all about that.\n[1212.32s] The concepts that we bring to our\n[1213.92s] practice don''t just label experiences\n[1216.56s] after the fact, they actually help shape\n[1220.08s] what it is that we experience.\n[1223.52s] This is a point that scholar and\n[1225.0s] monastic Bhikkhu Bodhi made a while back\n[1227.6s] in a lecture of his when when it came to\n[1230.04s] working with a teacher.\n[1232.96s] That is the confidence we place in our\n[1235.04s] teacher\n[1236.2s] is going to color the very experiences\n[1238.96s] that we have under their guidance.\n[1242.44s] In just the ways that we discussed.\n[1246.44s] That is to say, if if we''re studying\n[1248.52s] under a Hindu Advaitan, we''re going to\n[1251.28s] learn to see that unity with Brahman.\n[1255.16s] If we study under a Buddhist,\n[1257.2s] we''re going to learn to see non-self or\n[1259.52s] emptiness and so on.\n[1262.48s] This implies that direct seeing,\n[1265.44s] so-called, is not a concept-neutral\n[1268.32s] window onto reality.\n[1271.2s] We''re not given the world even during\n[1273.48s] our deepest meditation.\n[1277.96s] Now, one standard rejoinder to this is a\n[1280.48s] form of what''s known as perennialism.\n[1284.04s] That is that the experiences that we''re\n[1286.0s] having are all the same,\n[1288.56s] only their descriptions differ.\n[1291.96s] That is that all these diverse\n[1293.88s] traditions are really experiencing that\n[1296.64s] same given,\n[1299.48s] but laying their own descriptions on top\n[1301.68s] of it, which muddies the waters.\n[1305.8s] Now, there are various problems with\n[1308.72s] this perennialist viewpoint.\n[1312.12s] First, we have to be clear it itself is\n[1314.16s] a substantive doctrine.\n[1316.56s] That is that what is directly given to\n[1319.0s] us in deep meditation is actually some\n[1321.96s] sort of indescribable experience.\n[1326.8s] Second,\n[1328.36s] this kind of perennialism tends to lead\n[1330.36s] us nowhere.\n[1332.4s] That is if these experiences are in fact\n[1335.96s] literally indescribable,\n[1338.12s] then there''s nothing that we can\n[1339.44s] conclude from them.\n[1340.88s] I did a video about this in the past\n[1342.4s] that I''ll leave down below in the notes\n[1344.36s] where I talked more about that.\n[1347.32s] In fact, perennialism of this kind\n[1350.24s] cannot even support its own central\n[1353.12s] claim.\n[1355.04s] That is to say that two or three or a\n[1358.88s] dozen practitioners'' experiences are the\n[1361.84s] same is itself\n[1364.6s] a description,\n[1366.12s] which is exactly what we were told these\n[1368.2s] experiences can''t bear.\n[1371.72s] That is if nothing can be said about\n[1374.4s] these deep meditative experiences,\n[1377.68s] then neither can we say that they are\n[1379.44s] all the same.\n[1383.52s] As to the case of Buddhism in\n[1384.92s] particular,\n[1386.48s] one place of some significant friction\n[1390.24s] involves the night of the Buddha''s\n[1391.8s] enlightenment and his claim to have\n[1393.4s] gained these three knowledges through\n[1396.56s] direct insight.\n[1400.16s] That is knowledge of his own past lives,\n[1402.76s] of the workings of karma,\n[1405.44s] and of the complete destruction of the\n[1407.8s] taints.\n[1409.32s] Now, the first two knowledges