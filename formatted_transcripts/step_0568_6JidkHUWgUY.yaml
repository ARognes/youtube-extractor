transcript: Hey guys. So today you and I are going to talk about front end. So let's get into it. So the question in question was, "Hi Frederick, I'm a new full stack junior developer. Am I crazy for thinking that the state of front-end development is actually more complex than back-end development? Yet front-end development has no respect." Well, I'm not so sure about the respect part. Usually, it goes and maybe a few you can relate. The coolest people are the people who are working the low at the lowest levels usually. So, if you're working on a kernel or an operating system like that, you're cooler than all the web developers and all the back-end developers are cooler than the front-end developers and the front-end developers are cooler than the QAS and the testers. That's usually how it goes. But in terms of whether or not you get respect as a front-end developer, I'm guessing that's a little bit about who you're working with, because I've never really had a problem with people respecting front-end developers and not respecting front-end developers. At least where I work, we might have had some old bitter backend developer who has at one point expressed something or another about front end and so forth and so forth. And I always do the same thing when those sort of situation happens. I'll give you my secret tip. Then just turn to them and ask could you do the CSS for this website. Center align that box. Usually they say no. Like they usually don't. Oh okay cool. So you can't do it. and then usually get into a debate uh or not a debate about whether or not something is easy or understandable as I like to say. It is so common for people to assume that something that is easy to appreciate is easy to do. And if you want to take that to the bank and like go and have a really really interesting conversation, go and talk to every photographer, every music or whoever's ever tried to get paid for something that most people think is quote unquote easy to do. Anywh who as for whether or not I think that it's easy in comparison to do backend versus front end it's a bit again it depends a little bit on what you mean but I will agree to a point the reason being because it has been a bit of a ride I would argue for the frontend community because back in the day when I started it was still kind of common that you had front end being done by literally like just backend developers who knew some basic jQuery or some basic JavaScript because the UI part was still very much static HTML and most of that was happening on the back end anyway where we server side rendered everything which is a term that existed before react and like so forth they made it cool and it used to be that the old applications and not just the old ones they're still there's quite a few that are still doing it would just render out some HTML some basic styling and serve up a web web page and that was it no Java script needed really over very minor amounts of JavaScript. And today I would go as far as to say that the amount of stuff you need to do to know in order to be effective as at front end depending on your setup because it is maturing a little bit. I was in that I'm not going to say it's sweets but maybe the dark ages call it whatever you want before things like you know uh say v or other sorts of bundlers and sort of these tools that abstract away the need to know everything about webpack various test runners and I configure how to configure those etc etc before all that you had to do it by yourself it's a bit like when so for say the Java people in the ant days or people who are still say using make files. I'm not saying make files are bad or anything like that, but it was more primitive in terms of tooling. You needed more knowledge in order to do things. And now front end has matured a little bit to the point where you don't at the very least need to know every single little detail about everything cuz I mean even like if we take the main tools like React and say Angular if we talk about UI frameworks and libraries and so forth they have a pretty good tool suite now which makes it a lot easier to get started and get a working setup which was not the case when I started. really have I mean I still to a certain degree benefit from that because I have some knowledge that some of my co-workers don't have. It's actually very common. I will tell you that most front end developers don't actually know anything like they have no idea what a bundler is. They have no idea how anything works or so forth and so all they know is that if I run like the build for video angr just magically does everything and that's basically it. But for the backend developers that has been the case for quite some time depending on the language now because if you take for example say C or so forth or Java or one of the major ones that major languages you do have quite a lot again that is sort of ready made for you like you're setting up web web frameworks and so forth and so forth and on top of it you don't have to deal with any visual elements. So when it comes to logic and so forth, you still have a lot of that going on in the back end. But for us who do web development, I hope that most of us can testify to at the very least the bulk of what you're doing. If you're building, you know, standard REST API, the sort of, you know, bread and butter stuff that most web developers do, at least in the back end, there's not a lot of logic per se going on depending on what you're doing. you're saving something, you you know, you're taking a request, you're mapping it to some with some TTOS or like request objects or so forth into some data structure that you're going to process and you're going to store that into a database. Now, I'm of course simplifying grossly here. But at least for me, the past several projects, that has been the basic flow. And although it requires enormous amounts of skill and talent and so forth and so forth to get to a point where you feel that that is trivial because it's not just something you do and then you magically you know every junior's ever tried to figure out how to set up their database and all this sort of good stuff right and then actually create good data models and like the right data structures and so forth will testify to that it's not easy but I would argue that it requires less of you than if you go to front end land and you have to learn how to work with a different type of styles of pre CSS prep-processors. Then you need to learn TypeScript and potentially JavaScript and so forth to learn how the DOM works and like all the interfaces that you have to do to do there. And then of course you have to learn how to ship the thing because again building it and bundling it and then deploying it and so forth is also part of it which is not something that UI people may be also that ready for. It's something that I actually say to a lot of software front end developers that the honestly I feel that the easy part is to learn how to make the UI like to make it look the way it does. The harder part is actually to learn how to you know build the whole thing and then ship it and all the surrounding ecosystem all the tools around with different types of test runners. And then of course you have things like um you know if you're going to do unit testing in front end then you have to have some type of way of s implementing like say jsdom or something like that where you have to fake certain methods on the DOM and you have different runtime environments where you have some interfaces for in when you're dealing with uh libraries in say JavaScript in node or something like that versus when you run it in the browser versus when you run it in the test runner. and so forth and so forth. So there are a lot of moving parts and they're all a little bit well I will agree that that is pretty complicated to learn although even if most of what you're doing is you know creating select boxes and so forth and so forth or forms or panels etc etc depending on the UI application I do agree that it can be a lot more complicated in the most advanced cases it's really really complicated usually more complicated than I doing work on the back end. And in the simpler cases, well, let's just say this guys, usually it's pretty easy for me to use an AI agent today to create my entire story in the back end without a lot of issues. But it's very difficult to do the same thing in front end because front end has a lot of more chaos related to it or a lot of let's just say no one form is always going to work the exact same way and no UI is always going to look the same and so forth. You're basically always doing things from scratch and reusability and things like that. It does exist but it requires a lot more to get any of that and make it work in front end. And then of of course on top of it you have usually very limited knowledge of good system design and architecture in front end because most front-end developers are just learning how to make the styling and you know the UI look the right way and then some basic coding and then they're off to the races whereas backend developers usually have more focus on theory and so forth and so forth. These things don't matter all that much on small applications. But there is a reason I argue that quite a lot of front- end code bases these days have the by word of saying your front end is always ugly like our code is always messy. There is a reason for that and that is not because front end is impossible to get right. It's just that it requires a lot from you to do it well I argue. So, what I want you to take away from this is that again, I really am not the sort of guy you should be asking about one is easier than the other because I always say the same thing, which is boringly obvious by now. I hope that regardless of if you find something easy or hard, the thing that someone else is doing, if you are not able to do it or if it's not trivial, it is still worth doing. It's still worth getting paid for and having a competition on who's more important. Like I mean I don't imagine that the people who you know compete in throwing the javelin are looking down on the people who are throwing you know sledges or something like that. It's like it's two different types of competitions. It's the same deal here. Both front end developers and backend developers are necessary in order to ship value. It's the same thing I say about UX designer whether or not their job is easy or hard. Again go and try do it yourself. See how far you get with it. Same thing I tried to say to people about as I was saying earlier photographers. I mean, can you imagine trying to sell a picture for I don't know how much they have to charge for certain pictures and have people just how can this be so much? Well, again, you probably had to buy a lot of stuff and probably had to figure travel to places and so forth and so forth to get that picture. So, it costs money. Same deal here. Front end used to be so quote unquote simple that backend developers were more or less saddled with doing it with some basic jQuery. Today it's a full-blown profession to or like a special specialization in of itself to do front-end development. And as someone who does quite a lot of both front end and backend I can agree to a point that backend can on an average day be simpler because most of the time we're building the same sort of basic CRUD operations over and over and over with different data models. that is completely you know simplifying it and so because there's a lot of like other situations where that's not completely true but for a lot of us that is the bulk of the work whereas for front end although you're creating forms pages so forth and so forth there's a lot of more manual work involved and there's a lot more room for error because you have visual elements apart from the logic and so forth and so forth and then of course your ecosystem depending on which one you have may fit may not fit and so forth and so forth And you know what? I hope you know the pain of having someone go crazy with too many libraries in the front and then you have to maintain all of that. It's not fun. Have a great day.
