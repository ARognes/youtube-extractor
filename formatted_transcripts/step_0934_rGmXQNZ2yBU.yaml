 was going to meet. If I'm going to do this, I have to play a game. It's not my preferred game. I like I prefer other things in life, but if I'm going through this, here's what it's going to require. >> Lawmakers remain deadlocked more than a week into this shutdown now. Any sign [music] that there is going to be some bipartisan agreement? >> Um, no. >> Why fight this battle now? >> Enrollment period opens on November 1st. Premiums, co-pays, and deductibles [music] for tens of millions of Americans are going to dramatically increase. Once you step into a political landscape, you bifocate the world. You're either on one side or the other. So, you are friendly with one side, you make enemies with the other, and I've not wanted to do that. I went into the meetings as someone interested in health. Nothing [music] is going to define the world more than AI. So, I think that don't die really is more than just a fad. It's like [music] a new way of being human. And so, we're betting really big that this moment is bigger than we think. >> Just right now, and I don't want anybody to take this the wrong way. If it doesn't come from the guy sitting in the White House, >> it's hard to get to where [music] you want to go. >> Yeah. >> Really, we have to be a support staff. We can't be the lead. >> Yeah. Yeah. >> So, >> don't die is not important to them. They're dealing with [music] urgent priorities of how do I get my campaign funded? How does this bill get resolved like they see right in front of their face? And I'm talking about this future of like, hey, where are we headed as a species? How do we think about long-term health as a country? There's such a huge divide. We're in different [music] worlds all together. >> It said you can easily sign on. >> You're embarrassing yourself right now. >> In the DC ecosystem is an intense social game. [music] It operates on lack of sleep, enormous amounts of alcohol, and a work ethic. Like you grind all the time. There are rules, there are 