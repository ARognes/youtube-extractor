ink you can win by changing the healthare system. You have to build over it. [music] And so what I'm trying to do with Blueprint is like rebuild the health care system from the ground up from the most basic things like how do you sleep all the way through advanced therapies. We raised $60 million to build [music] blueprint and try to become the best health system in the world to combine wearables, basic blood draws and food, skincare, hair care, prescriptions, protocols. No one does that. And so I think if we can solve that elegantly, it's a model for the whole country to follow. We don't aren't able overnight to solve all the problems that this country faces. But is that any good reason why we should say let's not even try? [music] All who are committed to this great effort of moving this country forward, come and give us your help.
