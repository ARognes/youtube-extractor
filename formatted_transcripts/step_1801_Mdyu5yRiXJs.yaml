transcript: "Le Porge, situé entre le cap Ferret et Bordeaux, a été gravement touché par la propagation des incendies en Gironde : 152 maisons sont sinistrées, selon un bilan officiel de la mairie. Les images prises par drone témoignent de la violence du feu : des rangées de maisons ravagées, des voitures carbonisées et des bâtiments entièrement détruits.\n\n__\n\n✅Pour comprendre l'actualité, abonnez-vous à la chaîne YouTube du Monde (et activez la cloche pour les notifications \U0001F514 !) \U0001F449 http://www.youtube.com/subscription_c...\n\n__\n\n\nEn raison de la menace que les feux constituent dans le Sud-Ouest, 55 000 nouvelles évacuations ont été ordonnées samedi soir dans des communes situées au sud-est du bassin d’Arcachon ou proches de la métropole de Bordeaux (Marcheprime, Le Barp, Biganos, Mios, Cestas), portant à 220 000 le nombre de déplacés dans le département de la Gironde. C’est l’une des plus grandes évacuations jamais organisées en France en raison d’incendies.\n\n#incendies #gironde #france"
