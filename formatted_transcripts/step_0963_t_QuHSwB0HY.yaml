sed off its training data, is almost gone. It's just giving me random stuff. Let's just throw in a slider so that we can adjust this in real time. In p5, you can make a slider with-- I think you give it the initial value, then the range. Actually, I'm forgetting. I think it's the range, 0.1 to 2. Let's give an initial value of 1 and a step of 0.01. Actually, let's let the temperature go up to 4. Let's turn the slider down. We can see I'm getting this sort of classic pattern with less variation. Turn the slider all the way up, and I'm getting something completely unrelated to my query. All about here berries, which sounds delicious. Since this video is already a hundred years long, I should probably mention a couple other things. So we talked about softmax. We talked about temperature. Softmax being the mathematical function to calculate all the probabilities based off of raw scores. Temperature being a way to squash or stretch those probabilities. But you'll also see terms like top K as well as top P. And these are variations off of temperature-- not really variations, but they're also properties that allow you to adjust the way the sampling happens. Top K is actually the same thing, in a way, as argmax. So argmax is top K with a K of 1. But what top K does, if I had a K of 3 and I had a thousand possibilities, I'm only going to pick from the top three. So it's a way of allowing sampling to still happen but reduce the number of possibilities to only the most common ones. So that's a property you could adjust also in the generate function. As well as top P, which is like top K, but instead of only picking the top n number or top K of options, you're picking only the options within a certain probability threshold. So, for example, a top P of 50% would use-- well, in this case, it would only use world because it's already above 50%, but you could imagine taking all of the most frequent options and adding them all up. And as soon as you got above 50%, you stop and let a