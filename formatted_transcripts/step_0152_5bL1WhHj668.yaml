transcript: Like, if I think if you talk to any of the organizers from this year, I think if any if you ask any of them like, "You saw Rachel being very stressed out and very like she was she was just kind of losing it at some points." I think all of them would say like, "It's just because she's so passionate about this." Like, there's I would never ever take back the time that I took doing TreeHacks and and all the stress that I went through because number one, I got great stories out of it and I feel like I grew a lot as a person, but I just genuinely adored it. And I when the hackers were coming into the the building that we hosted TreeHacks in and just getting to meet all these people that I feel like I've worked so hard for. Like, I I always knew that a thousand people are going to come to this event and then finally actually like meeting them and being like, "I put all this work and effort into this event for someone like you who's also worked really hard to get here." It's the most fulfilling and heartwarming thing ever.
