transcript: Like if you're standing by yourself, and you're like, "It's just me. I'm by myself. I'm applying to conferences or doing my resume, and I'm trying to survive on my own." It's going to be really hard for you cuz there's a whole group of people that are talking, communicating, and helping each other out. Like recently, you know, I have a friend who's switching jobs, and I was like, "Hey, if I can help you in any way, either negotiate cuz I've had to go through the negotiation process before or do anything, like look at your resume." I've reviewed resumes of friend Like Like they are not going at a job alone. They're going at a job with 20 friends who are supporting them and helping them land the role both internally in the org and outside. Versus like if if if we go alone at it, it's much harder cuz you don't have all the all the support. And so, I think that's huge. Like be supportive, support others, have a good time, meet other people. You learn so much.
