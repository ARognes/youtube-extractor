les, which I have hundreds of blog articles at this point. If we just open up this section, you can see there are just tons and tons and tons of different blog articles inside of here that I've written over the last I don't even know, six, seven years. So, it's able to ingest all that data and essentially synthesize it into how I actually write my blog articles. Now, it's not perfect. I have to change a lot of things about it, but this is the first draft of this particular skill. It explains what I do, how I write, all the different sentence patterns that I use, different formatting things that I use for like text and code and so on. And then finally, the big ticket, what not to do. You can see we have an entire section right here on how I don't write code or how I don't write text. So, this says what not to do, how not to write things, and so on. This is the most important section and the thing that you'll probably change the most as you're tweaking and going through with your skill. The what not to do section is generally the first place you add things into. It even has some examples of good versus bad. And then finally, we have some additions here that are being added after I created my skill originally talking about different ways I handle, for example, browser support. In all my articles that have browser support, I format it in the exact same way. This explains that because the original skill didn't have that information. And then we have a checklist again explaining to make sure that everything is just like we wanted to. And then finally, this is where the most important part is. Like I said, your first draft of a skill is probably not going to be very good. It'll be better than nothing, but it's still not going to be great. So, you want a way to refine that skill. So, I actually created my very own skill to refine what this outputs. Now, the easiest way for me to refine the output of this is to save the original output that was created by the AI. So, I have 