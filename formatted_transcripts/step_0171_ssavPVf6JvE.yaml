transcript: Every letter, number, and emoji on your keyboard is there because three people make it so. Because in 1987, a tiny California nonprofit decided that instead of using a bunch of different text encoding systems, maybe everyone should use the same one. Huh? Can we do that, guys? Now, this small group has more power over what you type than your government, and they answer to a shadowy council of tech giants. So, how did they end up holding the keys to digital language? Who actually decides what makes the cut and what happens if they screw it up? This is the story of Unicode. Before Unicode, text encoding was chaotic and inconsistent. Russians had to juggle three different encoding systems just to read email. Swedish programmers' dev tools turned nice neat C code into garbled gibberish. And in Japan and China, incompatible systems meant some people literally couldn't type their own names. So, three engineers started sketching out a fix. Joe Becker and Lee Collins at Xerox and Mark Davis at Apple proposed giving every character in every language a unique number in one giant shared registry. Becker wrote the original draft of the standard and coined the name Unicode in a 1988 paper. Davis then went on a world tour to convince everyone to switch. Pretty successfully, given that I'm talking to you about him right now. And four years of refinement later, in January 1991, the Unicode Consortium incorporated as a California nonprofit and shipped version 1.0 that October. The Unicode standard was simple and elegant. The ID code for a capital C, for example, is the number 67. Really, guys? Fine. Anyway, the label is the same on every device on the planet. iPhone, Windows, your smart fridge, anything. And the good thing about the ID being a regular number is that there's no upper limit on how far the encoding can be expanded. So, you can keep adding languages and emojis till the cows come home and never have to repeat an ID. That expandability is why Unicode now defines roughly 155,000 characters across 168 writing systems on 23 billion devices. What? Handling all that must take a lot of people. >> We only have three full-time employees. >> Excuse me? >> We work with uh hundreds of volunteers and contributors who are, you know, distributed around the world. Um >> Ah, okay, yeah. That makes sense. See, that's Toral Cowason, CEO of the Unicode Consortium and one of those three full-time employees. Together, they handle the day-to-day, overseen by the nonprofit's board of directors, who are super important, but they're not technically the ones who decide what ends up on your keyboard. That would be the technical committee, which has a few different types of members. Eight of those members are big companies that pay $50,000 a year for a full vote on the committee. Those being Microsoft, Apple, Adobe, Google, Meta, Salesforce, Airbnb, and an Italian AI translation company called Translated, who may be there because they have something on the other seven. They vote on every new Unicode character and elect the board of directors. Then, there are four supporting members who pay $20,000 a year for half a vote each on technical matters, but they have no say on board membership. Past that, there's a long tail of associate members, organizations like the Wikimedia Foundation that pay $5,000 each to attend meetings and voice opinions, but they don't get to vote. Then, there are individual members, passionate volunteers, and academics who've taken on a slice of Unicode's work. They pay nothing, get zero votes, but they can still speak up in committee discussions. That is a lot of different voices, probably all clamoring for different things. But, Toral says that somehow it works. >> I think of Unicode as a bit like um this neutral ground, right? Or Switzerland where these organizations that are ostensibly competitors, they saw value in working together to make something that is for the greater good. >> Aw, that's nice. But, how does the process of approving new characters actually work? We'll get into that right after a word from our sponsor. >> Odoo, if you can think of an application you would need to run your business, guess what? It's available on Odoo. CRM, sales, point of sale, accounting, invoicing, inventory management, employee management, surveys, help desk, marketing, and there's more, too. Don't use 10 different services for 10 different functions, just use Odoo. It's simple. And if you only need one app, it's totally free. Click our link below to start your trial today, or book a free demo, no credit card required. So, how do new characters get added to the Unicode standard? >> We'll use emojis as an example. How do we get from an eggplant-shaped idea in some pervert's head to an eggplant-shaped collection of pixels on that pervert's phone? It starts with a proposal. Someone, a Bloomberg engineer, an aubergine enthusiast, a frat guy named Chad, files one. It goes to the emoji subcommittee, and if they're into it, it goes to the technical committee for a vote. If you get a simple majority with at least half the full members present, it passes. Then, the Unicode consortium assigns it a unique ID and adds it to the next version of the standard. And then, every platform vendor, think Google, Apple, Microsoft, draws and ships their version of the emoji on their own keyboards, which means even after Unicode approves something, if one of those tech giants decides not to render it, you might never see it. Like back in 2016 when Apple refused to deploy the rifle emoji, and instead of making a big stink about it, the rest of the committee kind of just fell in line. So, while the rifle is still part of the Unicode standard with an official ID and everything, it never appears on your keyboard. The emoji battle is winding down, though. Keyboards seem to have hit a steady state with Unicode approvals dropping from 117 in 2020 to just eight in 2024. And honestly, character encoding is just the tip of the iceberg when it comes to Unicode. It's the part we all see, but there's way more beneath the surface. >> If you convert time, if you um sort anything alphabetically, if you use bidirectional text, if you switch between Imperial versus metric, if you use different calendar formats, non-Gregorian calendar formats, Unicode underpins all of that. >> So, Unicode's just quietly running in the background, facilitating stuff you never even think about. Like telling your computer how to display things like dates, numbers, and currency based on where you are. It also handles line breaking and text wrapping for languages that don't use spaces between words, for example. All of this just works, and all of this stuff, too, because of Unicode. Three full-time employees and hundreds of volunteers holding digital language together. Honestly, the amount of systems and functions for which Unicode is essential is huge, and we obviously can't fully explain all of it in this video. If you want us to go deeper on any of that, drop a comment and we'll make another video about all that cool stuff. Speaking of another video, if you're curious about other ways Big Tech controls what you see online, check out our video on why Google Chrome is blocking ad blockers, because that rabbit hole goes even deeper.
