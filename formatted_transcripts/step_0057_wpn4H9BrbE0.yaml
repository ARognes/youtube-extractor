transcript: So, what they're doing, the interviewer's doing on the other side is they're doing pattern matching. Okay, Aaron's got a problem that he's describing on this side, a junior-level problem, a mid-level problem, a senior-level problem. You don't even have to give the solution. You're just basically saying, "I I work on these size problems." And what they're doing on their side is like, "Oh, we have problems on our side. Does he solve the junior-level problems? Does he solve our mid-size problems? Does he solve our senior problems?" They're just trying to square up those problems and then match those across. Cuz they have this role >> that they're hiring for with certain size problems they're expecting. >> Yep. >> And they want to hear that you've handled similar or larger problems.
