act lines being duplicated. It's about 100 lines of duplicated code. So that's what the duplicate section is. If we keep going a little bit further, you can see some things about clone families. But again, that's just mostly all about duplication. And then we get to this complexity section, which is kind of like the health section of your application. And it determines how difficult are different things to understand. For example, here, this just shows us all of our functions that are very large. So you can see we have a function that's nearly 1500 lines. This one's 450. This one's 350. These are definitely bad functions if you have them that long. So this is definitely code that we want to be able to clean up and make much easier to work with. So this gives me a good rough place for where all my largest functions are. You can also see this section on high complexity functions. This may look really complicated at first, but essentially it determines how difficult your function is to parse for you as well as how difficult it is to test. So cyclatic function complexity that just means how many different branches are there in your code. Every time you have like an if statement or a turnary or a switch statement, those are different branches for your code and every single place you have one is going to add to this cyclomatic complexity. So you can see this has 115 branches in this one function. That is massive. Next we have the cognitive load that has a value of 133. And this is like how difficult is the code to read. For example, if you have nested if statements or nested loops, for example, those can be very difficult to parse and understand. So if you have nested things like that that are difficult to read, that's going to increase this score right here. And then finally, we have this crap score. This score essentially calculates not only how complex your function is, but how much of it is tested. For example, if you have a function that's very complex, but it has a 