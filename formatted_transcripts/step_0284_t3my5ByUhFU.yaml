transcript: One huge problem with AI is it tends to write code that's not very maintainable. One really common example is it likes to duplicate the exact same code between multiple different places. You can see this code is identical, but it's in two different places of the same file. And this happens all over the place. You can see here again this massive section of identical code between different places. On top of that, it also loves to create massive files. You can see this file is hundreds of lines long. And the functions in this file are actually quite complicated and difficult to parse for anyone that's trying to read what's going on. On top of that, it's very common when you're changing around things for entire files to be completely unused because you change how the code is working and the AI just leaves the old code behind or it'll create a bunch of different exports for various different things. But these things never actually get exported or used anywhere else. So you have tons of dead code, duplicated code, and difficult to read code. And the problem is AI is really bad at actually finding and solving these problems, which is why the tool is absolutely amazing. It's a completely free command line tool that works very similar to ESLint, but it's built in a way that can be useful for your agents to be able to help fix particular problems and is really built to solve the problems that AI coding has. But it's not just useful on AI projects. I'm going to show you how to use this on both an entirely handcoded project and an entirely vibecoded project. so you can see the pros and cons of using it in both scenarios and see how this is a perfect fit for any agentic workflow that you're using. Welcome back to WebDev Simplified. My name is Kyle and my job is to simplify the web for you. And to get started, we're going to be using. And to use inside of a project, all you need to do is just run npxallow. And that'll get you started with a baseline of everything that you can see that this tool does. And then I'll show you how we can configure it and use it in a little bit more fine-tuned approach. You'll also notice that what we're focusing on here is the static intelligence. That's honestly the thing I think is most important about this tool and it's entirely free. But if you wanted some runtime related intelligence, you can pay for that optionally. But really the main thing you're going to be getting from this is that static intelligence. And again, it's entirely free, which is really nice. And this isn't like a sponsored video or anything. I just really think this is a super useful tool. So any project that you want, we're going to go inside this project that's entirely vibe coded to show you what it looks like in like an agentic workflow. You can just type npx fow and then you're going to just say you want to install that and it's going to run through and it's actually going to give you a bunch of information. If we just scroll to the very top of where this is run, you can see a ton of information and I'll kind of explain exactly what everything inside this section is doing. So the first thing that I think is really useful is that will automatically detect plugins. That essentially means like if you're using vit or nexjs or tanstack or various different frameworks or languages that are very common, it'll detect those plugins and automatically try to set up preconfiguration things based on those plugins you're using. So since this is a Tanstack project with Vit and I'm using Tailwind and so on, it'll have all those different plugins for me. The next thing here you can see is just some basic metrics about like dead code and so on. But really the important stuff is everything that comes below here. So you can see we have an entire section on dead code and you can see it talks about like different files that are never even used. So I have a few shad sand components and then an entire file right here from a feature that used to 