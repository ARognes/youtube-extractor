transcript: '{"content":"\n[2.023s] Копиране на врагове.\n[10.368s] За Люк.\n[13.843s] \"Ако си лягате с кучета, тогава се събуждате с бълхи\"\n — Бенджамин Франклин, Алманах на бедния Ричард.\n[23.712s] Бягството от насилствена среда\n[25.888s] — насилствена връзка,\nсемейство или идеологическа група —\n[30.41s] може силно да изпита вашите вътрешни ресурси.\n[33.7s] Вашето търпение, вашата устойчивост, вашата почтеност\n[37.34s] вашата решителност, вашето его.\n[40.303s] Всичко това може да бъде подложено на тежки изпитания, докато се измъквате от сложните конструкции на фалшивите идеи.\n[46.643s] За съжаление отровата може да проникне много по-дълбоко, отколкото си мислим.\n[50.52s] Живеейки живота си, не забелязваме, че част от зловредността, от която мислехме че сме се отървали, е останала с нас.\n[57.48s] Без да го осъзнаваме, можем да забележим, че копираме някои зловредни поведения, които трябваше да останат зад нас.\n[63.87s] Разбираемо е.\n[65.22s] В среди на злоупотреба нездравословното поведение се нормализира.\n[69.2s] Учим се от лоши примери.\n[71.542s] Ние също така разработваме изкривени стратегии за адаптиране с насилието.\n[75.78s] Това са способи за самозащита.\n[78.42s] Понякога ние пренасяме тези стратегии в нашите нови взаимоотношения\n[82.54s] не осъзнавайки колко разрушителни са те или как наподобяват поведението на нашите насилници.\n[88.3s] За много бивши жертви на злоупотреби\n[90.58s] идеята, че те копират по някакъв начин своите насилници, е отвратителна.\n[94.86s] Но по-късно ще разгледам как привидно противоположните манталитети\n[98.8s] понякога могат да създадат същото разрушително поведение.\n[102.34s] Копирането на враговете ни може да има значителни странични ефекти в няколко отделни области.\n[107.12s] Може да повлияе на способността ни да се развиваме като индивид.\n[110.28s] Може да повлияе на това как се отнасяме към други хора\n[113.059s] който също са избягали от насилствени среди\n[115.94s] и как се отнасяме към хората, които остават в насилствени среди\n[120.49s] включително начините, по които може да се опитаме да отворим очите им за насилието.\n[124.407s] Искам да разгледам всички тези области.\n[127.02s] За да дам контекст на това изследване\n[129.16s] Искам накратко да ви разкажа как попадаме в насилствена среда\n[132.76s] и как можем да избягаме от нея.\n[139.616s] Някои са родени в, насилствена среда.\n[142.014s] Някои влизат в такава среда в зряла възраст.\n[144.52s] Целта е една и съща на всяка възраст.\n[147.18s] Независимо дали те са партньори, членове на семейството или членове на идеологически групи,\n[152.431s] насилниците искат да ни накарат некритично да приемем тяхната изкривена версия на реалността за истина.\n[159.04s] С течение на времето индивидуалностите както на детските, така и на възрастните жертви постоянно се потискат.\n[165.18s] Проявите на независимост се срещат чрез порицание или наказание,\n[168.64s] така че жертвите да започнат да свързват индивидуалността с вина или страх.\n[172.76s] Те са научени да не се доверяват на собствените си чувства и критични разсъждения.\n[176.88s] Вместо това те се научават да търсят външно потвърждение от своите насилници\n[181.229s] които стават техни дилъри, които им дават чувство за самооценка.\n[186.324s] Всички зловредни среди предават едно и също послание:\n[189.4s] чувството за самооценка има основание само когато е осигурено от други хора,\n[193.4s] и когато ние самите се опитваме да осигурим нашата самооценка, това е непълноценен и порочен продукт.\n[199.04s] В крайна сметка жертвите стават актьори на сцената на своите насилници\n[203.459s] придържайки се строго към сценария, който им дават насилниците.\n[207.52s] Дори ако те са били трансформирани почти до неузнаваемост, следите от предишната им личност остават, макар и дълбоко потиснати.\n[215.505s] Дори и хора, индоктринирани още като много малки деца\n[218.299s] понякога могат по-късно да си спомнят този кратък период от детството,\n[221.419s] когато за първи път започнали да мислят за себе си\n[224.18s] и когато не чувствали притеснение да задават неудобни въпроси.\n[228.14s] Те си спомнят колко глупави са им прозвучали отговорите и как не се поколебаха да го кажат.\n[233.62s] Но тогава дошло наказанието и смехът спрял.\n[238.2s] И връзката им с автентичния индивид, който са били преди\n[241.98s] постепенно избледнява от гледката, докато се потапят в сценария на насилника си.\n[247.46s] За някои от нас тази връзка с нашата истинска личност в крайна сметка се връща.\n[257.488s] Това се случва по различен начин за всеки човек.\n[260.14s] Може да бъде о��криване на въпрос, на който не можем да отговорим\n[263.366s] логично противоречие, лицемерие, лъжа.\n[267.668s] Може би сме видели малтретиране на хора, за което не сме били подготвени,\n[271.88s] или намиране на неочаквани съюзници сред хората, срещу които са ни настроили нашите насилници.\n[277.66s] И така нататък.\n[278.821s] Каквото и да е, ние осъзнаваме, че има сериозен проблем\n[281.8s] с версията на реалността, която ни е дадена.\n[284.38s] За някои хора, магията веднага се разпада.\n[287.7s] За други този процес може да отнеме седмици, месеци, години.\n[292.36s] Но вече е започнало. Установили сме, че има проблем.\n[296.309s] Някои от нас ще се опитат да го решат сами — само за да намерят още повече проблеми.\n[300.72s] Започваме да виждаме някои от сериозните изкривявания\n[303.082s] използвани за да поддържат фалшивата реалност на насилника.\n[306.3s] Без да забелязваме това, ние даваме началото на нашето независимо мислене.\n[310.52s] Започнахме да разчитаме на собственото си разбиране\n[313.72s] за да тестваме собствения си опит.\n[316.1s] Част от нашата дълго потискана индивидуалност се събужда.\n[320.26s] Много от нас правят разбираема грешка.\n[322.615s] Ние се обръщаме за съвет към други членове на малтретиращата система.\n[325.96s] Но има голяма вероятност от тяхна гледна точка единственият проблем да бъдем самите ние.\n[330.06s] Ще приемат, че вината е наша и ще ни обяснят\n[333.12s] как трябва да подходим към проблема от друга посока.\n[336.479s] Ако проблемът ви е, че баща ви унищожава семейството ви чрез злонамерени атаки\n[341.269s] ще ти кажат, че трябва да се съсредоточиш върху доброто, което е направил за теб.\n[345.385s] Ако проблема ти е, че религията, която се предполага, че носи само любов, е пълна с обещания за садистични мъчения,\n[351.18s] ще ти кажат да се довериш, че трябва да има основателни причини за това мъчение\n[354.77s] дори и да не можеш да ги разбереш.\n[357.072s] Ако проблемът ти е, че група, която твърди, че се бори за равенство, непрекъснато допринася за явното неравенство,\n[364.25s] може да ти се каже, че някои хора са по-равни от други.\n[367.76s] Когато търсим съвет от други членове, търсим отговори от грешните хора.\n[372.293s] За да можем да разберем проблема, който представяме\n[374.78s] тези хора ще трябва да излязат извън сценария.\n[376.92s] Шансовете са, че не могат.\n[378.68s] Може да бъде изключително изолиращо, когато започнем да противоречим на сценария на насилника.\n[384.04s] Можем да забравим колко мощна може да бъде хватката му.\n[386.78s] Когато споделяме притесненията си, многократно сме посрещани с празни лица\n[390.58s] и се отнасят с нас така, сякаш ние сме проблемът.\n[392.998s] Когато изследваме по-дълбоки и по-тъмни нива на проблеми, можем да се почувстваме напълно изолирани, сякаш говорим друг език.\n[401.733s] Въпреки че нашите страхове се срещат с мълчание, избягване и отричане\n[405.82s] понякога по-късно научаваме, че сме достигнали до някои хора,\n[409.54s] които започнаха да разбират в какво са се забъркали и да си отварят очите.\n[414.212s] Нещата започват да приемат изцяло нов фокус за тях\n[416.719s] когато започнат да виждат проблемите, които посочваме.\n[419.6s] Но само защото виждат истината, не означава, че ще действат.\n[422.88s] За тях действията означават риск от неудобства или загуби, за които не са подготвени.\n[427.925s] Вместо това, те могат да изберат да продължат да пребивават във фалшивата реалност и да се опитат да намерят начини да омаловажат проблемите, които виждат.\n[435.62s] Те могат да си кажат, че всяка група има своите недостатъци.\n[438.9s] Което е вярно.\n[440.86s] Но не всяка група се съгласява и насърчава злоупотребата.\n[445.28s] Критиците не се задържат дълго в зловредни среди.\n[448.42s] Изборът обикновено е краен. Подчини се или напусни.\n[452.8s] Понякога изборът се прави за нас, когато сме официално отхвърлени и отбягвани.\n[457.66s] Въпреки че това е зловредна ситуация, напускането може да бъде трудно.\n[461.56s] Понякога трябва да работим с много емоции\n[464.12s] и да се откажем от мощните фантазии, че нещата могат да се оправят;\n[468.18s] че винаги има надежда за промяна.\n[471.12s] Това са само форми на отричане и договаряне.\n[474.7s] В крайна сметка приемаме, че злоупотребата ще продължи.\n[479.532s] Когато излезем от среда на злоупотреба\n[481.9s] земята напред може да изглежда разпокъсана и нестабилна в началото.\n[485.576s] Но постепенно започва да се запълва.\n[487.9s] Започваме да се разхождаме по-уверено в новия си свободен терен.\n[492.5s] Животът ни бавно започва да намира някаква форма отново.\n[495.84s] Но понякога изглежда сякаш напредъкът внезапно спира.\n[499.24s] Можем да открием, че се заплитаме в стари познати модели.\n[503.62s] Понякога имаме работа с така наречените „бълхи“.\n[506.92s] Терминът произлиза от фразата\n[508.76s] „Когато си легнете с кучета, ставате с бълхи“.\n[512.6s] Бълхите са дефектните навици и черти\n[515.24s] който ние сме прихванали от насилствената среда\n[517.919s] и те са различни от човек на човек.\n[521.08s] Пример за \"бълха\" може да бъде триангулацията.\n[524.34s] Триангулацията е манипулативна стратегия, използвана от насилниците\n[528.02s] където трета страна се използва, за да насъсква хората един срещу друг.\n[532.42s] Жертвите могат да бъдат отрицателно сравнявани с някой друг.\n[536.316s] Насилникът може да предизвика конфликта между две жертви\n[539.68s] като ги лъже, че са направили негативни изявления един за друг.\n[544.06s] Триангулацията може да бъде мръсна и разрушителна афера.\n[548.16s] Но след като са избягали от насилниците си\n[550.527s] понякога жертвите се виждат, как те самите използват триангулация\n[554.2s] не злонамерено, а защото се чувстват безсилни.\n[557.782s] Директното взаимодействие все още може да причини твърде много уязвимост.\n[562.06s] Индиректните методи могат да се чувстват по-безопасни.\n[564.96s] Вместо директно решаване на проблеми с отношенията, те могат да се обърнат към други хора, за да ги защитят, като мътят водата.\n[572.418s] Вместо да бъдат директни за привличането си към някого\n[575.22s] те могат да прибягват до триангулация, като използват трета страна, за да се опитат да предизвикат ревност.\n[580.5s] Въпреки че няма злонамерено намерение\n[582.78s] триангулационната страна все още може да се чувства предадена или манипулирана.\n[587.348s] Когато жертвите на злоупотребата се научат да изразяват директно своите недоволства, нужди и желания,\n[593.21s] желанието да се триангулира ще отпадне.\n[597.76s] Друга \"бълха\" е емоционалната нестабилност.\n[600.92s] Жертвите на продължителна злоупотреба често трябва да потискат мощни инстинкти\n[605.54s] инстинктите да се защитават, да се бият, да избягат.\n[609.512s] Много жертви се опитват да потиснат собствените си мисли\n[612.34s] защото са били научени да вярват в мисле-престъплението.\n[615.46s] Агресивните среди също са пълни с непризнати емоции.\n[619.7s] Жертвите се учат да потискат неприемливите чувства.\n[623.36s] Кои чувства се считат за неприемливи, ще варират от група до група\n[627.44s] но гневът обикновено е забранен.\n[630.1s] В здравословни ситуации емоциите като гняв имат контрол на силата на звука\n[634.82s] постепенно преминавайки от раздразнение към ярост.\n[639.34s] В ситуации на злоупотреба, гневът се потиска\n[643.064s] и става по-скоро като копче за включване-изключване.\n[645.8s] Гневът на жертвите може да се прояви при внезапни разрушителни изблици\n[649.12s] точно както се проявявал като били с насилниците им.\n[651.64s] Други примери за \"бълхи\" включват избягване на отговорност\n[655.08s] свръхчувствителност към критика и проблеми с спазването на границите.\n[659.0s] При техните насилници тези черти идват от място на привилегированост.\n[662.92s] При жертвите тези черти възникват в отговор на прекомерно наказание\n[667.036s] и от липсата на здравословно уважение към тяхната собственост, неприкосновеност на личния живот и лично пространство.\n[672.96s] Когато жертвите виждат че се държат като техните насилници\n[675.8s] те често се чувстват унизени и се чудят дали не са се превърнали в нещото, което презират.\n[680.397s] Но фактът, че се чувстват унизени, показва, че не са.\n[683.5s] Техните насилници не изпитват угризения, и разкаяния.\n[686.32s] Всички тези махмурлуци от насилствената среда\n[688.8s] може да имат отрицателно въздействие върху бъдещите взаимоотношения и личностното развитие.\n[693.777s] Но идентифицирането им е първата стъпка към възстановяването.\n[697.9s] Всички тези тревожни навици могат да бъдат заменени с по-здравословни реакции\n[701.9s] с течение на времето, осъзнаването и образованието за последиците от злоупотребата.\n[712.18s] Копирането на насилници може да бъде проблем в отношенията ни с други избягали.\n[716.98s] През Октомври 2012 г. прочетох статия във вестник\n[720.22s] от бивш Сциентолог, наречен Мартин Падфийлд.\n[723.555s] Този ден той промотираше конференция на няколко километра от мен\n[727.02s] наречена „Култ в Задния ви Двор“.\n[729.5s] Тогава не бях запознат със Сциентологията, така че потеглих към конференцията.\n[733.92s] Научих, че организацията на сциентолозите е псевдонаучна авторитарна група,\n[738.565s] която споделя някои паралели\n[740.6s] с религиозната авторитарна група от Свидетели на Йехова.\n[743.88s] Те включват официалното насърчаване на измамни тактики\n[747.14s] срещу външни лица, включително светските власти\n[750.78s] и практикуват отчуждаването от бивши членове.\n[753.58s] Попитах участниците в конференцията какво първоначално ги е привлякло към Сциентологията.\n[758.239s] Чувайки техните истории докрай разбрах, каква разнообразна група от хора са те\n[762.84s] в техния произход, техния опит и отношението им към Сциентологията.\n[767.806s] Някои участници все още се придържаха към системата от вярвания на сциентологията, практикувайки Сциентологията независимо.\n[774.556s] Един практикуващ участник в конференцията се оказа, че вярва на твърденията\n[777.98s] че някои Сциентолози са проявили способности\n[780.58s] като да търкаляш молив по масата, без да я докосваш и да виждат през стени.\n[785.642s] Друга участничка заяви, че може да излезе от тялото си по желание.\n[789.36s] На другия край на спектъра\n[790.76s] други участници в дискусията бяха открито против твърденията на Сциентологията\n[794.92s] включително и предполагаемите супер-сили, за които е казано, че се предоставят като телекинезата и овладяването над болестта.\n[801.74s] Те разглеждат Сциентологията като вредна по своята същност и не я одобряват под никаква форма — независима или корпоративна.\n[808.7s] Поразителното беше уважението, което всички тези бивши членове си показваха един към друг.\n[812.88s] Въпреки непримиримите различия в техните позиции\n[816.0s] панелът — и публиката — бяха в състояние да изразят себе си\n[819.66s] без страх от цензура.\n[821.52s] Нямаше принуда, нямаше заглушаване на мнения, нямаше лични атаки.\n[826.6s] Няма потискащи индивиди.\n[828.714s] Участниците бяха обединени от концентрираното осъждане на злоупотребата.\n[832.5s] Това беше чудесен пример за това каква може да бъде зрялата атмосфера на свободно изразяване.\n[837.6s] Както всички знаем, отношенията между избягалите\n[840.22s] от насилствените групи не винаги са толкова гладки.\n[843.46s] Някои хора биват осъждани, че са твърде меки и прощаващи.\n[847.04s] Някои са осъждани че са твърде-непоклатими и непрощаващи.\n[850.431s] Но това, което наистина изгаря, е, когато бегълците започват да използват\n[854.04s] злоупотребяващата тактика на бившата си група помежду си.\n[858.06s] На конференцията „Култ в Задния ви Двор“ един участник, Джон МакГи\n[862.833s] отбеляза, че понякога независими Сциентолози\n[865.42s] който се се откъснали от организацията\n[867.68s] все още се занимавали с практикуване на отчуждаване, известно като разединяване.\n[872.306s] Да познаваш болката от отчуждаването просто заради несъгласие\n[875.97s] и след това да го причиняваш на другите просто заради несъгласие\n[879.5s] е изключително тъжен пример за копиране на насилника.\n[883.229s] Някои хора, с които съм говорил, са напуснали групи за насилие\n[886.38s] които са имали фиксирани йерархични структури\n[888.98s] разделяйки членовете на елитни и подчинени подгрупи.\n[893.4s] Надявайки се да открият отворена, егалитарна общност от бившите членове\n[897.52s] те съобщават, че изпитвали подобно йерархично настроение\n[901.3s] от някои техни другари бегълци.\n[903.5s] Има го чувството, че някои хора са вземали предишните им —роли и сценарий— със себе си.\n[907.44s] Чувстват се че все едно са скочили от големия пържещ тиган\n[910.261s] в малко по-малък тиган.\n[912.88s] И това може да предизвика много неприятни спомени.\n[916.34s] Понякога хората копират враговете си по коварни начини, които в началото могат да изглеждат положителни\n[921.58s] но техният принудителен стил на държание е улика, че се случва нещо друго.\n[925.56s] Някои бивши жертви на злоупотреба се опитват да прокарат други бивши жертви, да простят на насилниците си.\n[931.052s] Те продължават да повдигат въпроса, дори когато съветът им многократно е бил отхвърлен.\n[935.78s] Те спорят и настояват и оказват натиск.\n[939.42s] Те намекват, че липсата на прошка показва някакъв морален недостатък\n[943.6s] или че по някакъв начин ще има обратен ефект за непрощаващия индивид.\n[948.3s] Това са същите манипулации, които насилниците използват за да извлекът прошка.\n[954.16s] Тези отзвуци на нашите насилници са депресивни, но разбираеми.\n[958.386s] Когато сме изправени пред определено поведение за дълъг период от време\n[962.02s] той се превръща в познатия ни модел на поведение.\n[964.68s] Понякога, без да се замисляме, се връщаме на онова, което се чувства познато.\n[969.28s] Макар че е разбираемо, важно е да се разпознаят тези насилствени практики\n[973.523s] и да направим каквото можем, за да ги изкореним от себе си.\n[976.3s] Всеки път, когато съзнателно отхвърляме унизителните практики\n[979.4s] на бившата ни среда за насилие\n[981.56s] ние измиваме още повече от последните остатъци от отровата им.\n[990.361s] Копирането на врагове може да се превърне в проблем в отношенията ни с бившите ни насилствени групи.\n[996.06s] Нашите взаимодействия с тях могат да предизвикат много емоции.\n[999.718s] Да ч��встваш гняв е напълно естествено.\n[1002.6s] Някои хора са против изразяването му.\n[1004.88s] За мен изразът на гнева сам по себе си не е проблемът.\n[1008.96s] Гневът е здравословен и подходящ, когато е фокусиран върху злоупотребата\n[1013.258s] както беше в Конференцията по Сциентология.\n[1015.8s] Но става разрушителен, когато започнем да си изливаме душата диво и безразборно\n[1021.16s] атакувайки невинни личности, които ние смесваме заедно с насилствените елементи.\n[1026.04s] Понякога цялата демография се демонизира.\n[1029.14s] Атакуваме тялото вместо тумора.\n[1032.0s] Тормозеният може да се превърне в побойник носейки маската на загриженост.\n[1036.16s] Мислейки за себе си като спасители, които се застъпват за справедливост\n[1039.52s] те се пренасят в положение на гонител, активно извършвайки несправедливост.\n[1045.0s] Ненасоченият гняв не помага на никого — включително на самите нас.\n[1049.03s] Тъй като ясно виждаме фалшивата реалност, която стои в основата на нашата стара група,\n[1053.06s] тогава може да ни се струва невероятно да наблюдаваме как членовете й се разхождат из празнотата,\n[1057.92s] отправяйки твърдения, без да има на какво да ги обосноват.\n[1060.9s] Разбира се, от техния ъгъл земята под нас може да изглежда също толкова крехка\n[1065.5s] както навремето й ние сме си мислели.\n[1067.6s] Стигането до място, където и двете страни могат да се чуят един друг може да бъде деликатен процес.\n[1072.38s] Помага, ако сме наясно какво точно се опитваме да постигнем.\n[1076.12s] Защо правим това?\n[1077.8s] Да се ​​чувстваме по-добре?\n[1079.84s] Да отбележим точки?\n[1081.42s] Искаме ли на всяка цена да изтръгнем хората от групата?\n[1085.96s] Преди около десет години един Атеист Ютубър ми каза\n[1089.22s] той и някои други Атеисти държали в плен един от приятелите си теисти\n[1094.7s] подлагайки го на интензивно разпитване и опровержение за съществуването на неговия Бог.\n[1099.6s] Той каза, че са успели и са насочили неговия приятел към Атеизъм\n[1103.18s] въпреки че приятелят му съобщавал за страхотно усещане за мрачност.\n[1106.7s] Ютубърът прогнозира, че вероятно няма да одобря техния метод\n[1110.0s] но подчерта, че проработил.\n[1112.82s] Той беше прав. Бях ужасен.\n[1115.4s] Бях ужасен, защото беше направено върху мен — само че в обратен ред.\n[1119.06s] Имаше време в детството ми, когато се отдръпвах\n[1121.6s] от религията, в която бях индоктриниран.\n[1123.97s] Но бях принуден да остана против волята си.\n[1127.66s] Чувствайки се безсилен, се предадох на един вид реакция на Стокхолмски синдром\n[1132.26s] възприемайки догматична идеология, от която се чувствах затворен, като в окови.\n[1136.71s] Бях разбит.\n[1138.74s] Принудителните тактики като тези са превърнати в кариера от някои хора.\n[1143.0s] Роден през 1930 г., Тед Патрик става известен като професионален депрограмист\n[1148.3s] работейки за преодоляване на неоправданото влияние на насилническите групи върху индивидите.\n[1153.08s] Роднини на хора, които са били вербувани от авторитарни религиозни групи\n[1157.06s] се обръщали към него, за да им помогне за спасяването на техните близки.\n[1160.54s] Въпреки че намеренията на Патрик били положителни\n[1163.24s] методите му били изключително спорни.\n[1165.999s] Той уреждал насилствени отвличания\n[1168.59s] и държал жертви против волята им, на сигурно място.\n[1171.882s] Членове на семейството влизали за\n[1173.84s] да призоват жертвата да се върнете при тях.\n[1176.42s] Това може да бъде емоционално хаотична среда\n[1179.262s] в която родителите са били свободни да подлагат своите жертви\n[1181.999s] на заплахи, подигравки и сълзливи чувства на вина.\n[1185.412s] Въпреки че намесата на Патрик наистина дала резултат при няколко успешни истории\n[1189.08s] много от тях давали обратен ефект\n[1190.7s] което връщало хората към техните насилници\n[1193.08s] като техните защитни реакции скачали до небето.\n[1196.64s] Стивън Хасан, бивш член на \"Църквата на обединението\",\n[1200.36s] иначе известна като Moonies\n[1201.88s] също така е отдал живота си\n[1203.852s] за борба с прекомерното влияние на авторитарните групи.\n[1207.38s] Въпреки че признава, че понякога организира срещи с жертви при малко измамни условия,\n[1212.34s] методите му се различават съществено от тези на Патрик.\n[1215.52s] Жертвите идват свободно и могат да напуснат по всяко време.\n[1219.48s] Те просто са представени с подробна точна информация\n[1222.96s] за групата, в която са се включили\n[1225.17s] и им е позволено да решават за себе си.\n[1228.28s] Ако информацията води до това, че потиснатият човек се е събудил — страхотно.\n[1233.456s] Но дори и жертвите да се върнат към техните насилнически групи\n[1236.6s] те не са оставали със страшни спомени за отвличане.\n[1240.273s] И точната информация, която са получили,\n[1243.06s] може да зап��чне да се потвърждава за тях в групата.\n[1246.78s] Те имат сила.\n[1249.16s] За мен това отразява основната цел.\n[1251.51s] Целта не е да накараме хората да мислят това, което искаме да мислят.\n[1255.505s] Точно това правят насилниците.\n[1257.72s] Целта е да се даде на хората инструменти за самостоятелно мислене.\n[1262.07s] Никой не ме е измъквал от насилническите групи, в които се озовах.\n[1265.88s] Излязох сам, защото бях в състояние да мисля независимо.\n[1270.905s] Когато приемаме независимото мислене като наша отправна точка\n[1274.24s] принудителните войнствени решения могат да отстъпят на образователните решения,\n[1278.19s] съсредоточени около идеята за личностно израстване.\n[1281.08s] Например, когато видим, че децата са принудени да влязат религията на родителите им\n[1285.69s] някои от нас може да искат да премахнат индоктринирането на деца.\n[1289.399s] Но друг подход е да се гарантира, че малките деца са образовани за всички религии\n[1294.14s] и относно възможността да маркират „нямам религия\".\n[1297.24s] По този начин им помагаме да разширят възможностите си чрез информация.\n[1301.5s] Винаги ще има насилници и догматизъм.\n[1304.76s] Вместо да се фокусираме върху ограничаването на поведението им\n[1307.63s] можем да ограничим тяхното влияние\n[1309.831s] чрез възпитание и овластяване на нашите деца.\n[1314.54s] Когато си легнете с кучета, ставате с бълхи.\n[1318.22s] Когато напуснеш отровна среда\n[1320.74s] понякога вземаш малко от отровата със себе си.\n[1323.66s] Но това не трябва да бъде за постоянно.\n[1326.425s] Всеки път, когато забележим част тази отрова в себе си, имаме шанс за детоксикация,\n[1331.668s] избирайки растежа и определяйки себе си според собствените си условия\n[1336.284s] вместо да копираме враговете.\n[1344.965s] Много благодаря на всички абонати, които поддържат канала на сайта Patreon.com/TheraminTrees"}'
