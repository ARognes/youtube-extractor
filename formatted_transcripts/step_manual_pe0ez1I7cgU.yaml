transcript: '{"content":"\n[0.0s] The brand new corner shape property in\n[2.0s] CSS is amazing. By default, it''s round,\n[5.08s] which just gives you a normal rounded\n[6.8s] border radius corner, but you can do so\n[8.8s] much with this. For example, scoop gives\n[10.56s] you an inverse border radius. You can\n[12.88s] use notch to essentially give you a\n[14.92s] fully squared-off border radius cutting\n[17.08s] inward. You can use square to\n[19.04s] essentially remove your border radius.\n[21.2s] You can also use squircle. This gives\n[22.92s] you a kind of extra rounded, not quite a\n[25.32s] super round version as you would get\n[26.76s] before. You can even use bevel to give\n[28.68s] you straight lines for your border\n[30.08s] radius. And the really great thing is\n[31.72s] you can actually customize this even\n[33.16s] further by using the super ellipse\n[35.32s] function and passing in the value you\n[37.28s] want for what you want your shape to\n[38.6s] look like. So, if we pass in a value of\n[40.04s] one, that gives you a normal border\n[41.84s] radius. While a value of -1, that''s\n[44.16s] going to give you that scooped version.\n[45.92s] And if you go greater than -1, you can\n[47.68s] see it starts to scoop in further and\n[49.32s] further and further until you almost get\n[50.96s] to that full-on notch behavior. And as\n[52.92s] you increase this number more and more,\n[54.96s] you start to again get less and less\n[56.84s] rounded until you eventually get to a\n[58.2s] practically square border shape. And\n[60.16s] zero gives you that perfect 45° angle.\n[63.04s] And this can be animated between and\n[64.6s] customized however you want to give you\n[66.2s] the exact border shape you need instead\n[67.96s] of just a perfectly round corner. If you\n[69.8s] want to see some of the amazing stuff\n[71.0s] you can do with this property, I''ll link\n[72.2s] a full video at the bottom of your\n[73.32s] screen for you that covers this property\n[74.76s] in depth and gives lots of really cool\n[76.24s] examples."}'
