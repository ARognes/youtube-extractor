transcript: "\uFEFFElizabeth Gilbert, who you may know as the \nauthor of the worldwide phenomenon \"Eat, Pray, Love,\" published another memoir a couple months \nago called \"All the Way to the River: Love, Loss, and Liberation.\" Despite what you may have heard \nabout Elizabeth Gilbert, I want to clarify that we are not talking about some vapid chick-lit writer \nwho creates Hallmark plots here. In the '90s, when she lived in New York, she was shortlisted for the \nNational Book Award twice before even writing Eat, Pray, Love. Her early short stories, The Finest \nWife and Elk Talk, are still frequently taught in MFA programs. You may be familiar with the movie \nfrom 2000, Coyote Ugly, Tyra Banks's third best movie after obviously Lifesize One and Lifesize \nTwo, which was also an adaptation of an essay that Gilbert wrote for GQ about herself and the girls \nwho worked at a gritty New York City dive bar, where she says she measured a successful \nnight by how many marriage proposals she got. For the 90s and early 2000s, Elizabeth \nGilbert was a promising, scrappy, and plucky indie author who everyone, from \nthe stuffy academics to the New York City underground artists, pointed at and said, \n\"That girl… is going to do something big.\" And then\nshe did. In 2006, she wrote Eat, Pray, Love. A quick recap:"
