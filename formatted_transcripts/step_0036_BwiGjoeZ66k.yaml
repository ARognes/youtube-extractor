transcript: Hello world. I'm an unemployed ex big tech software engineer with 25 years of experience in the tech industry. So, involuntary early retirement has given me a lot of time to think. And one of the things that I think about a lot is this idea of escaping the permanent underclass. So, to give some context, America is becoming a K-shaped society where the top leg of the K represents people who own assets. Think assets like financial investments. The bottom, vastly larger leg of the K represents people who don't own capital. People who must survive based on the wages of their labor. Now, the theory here is that over time, the value of that capital it should grow exponentially. The idea being that capital ownership of things like AI, robotics, and automation it should over time do more and more the work required to keep society running. Whereas the value of labor, it would gradually decrease over time, right? As a person's mind and body gradually ages and degrades over time. Now, it's possible that this gap becomes unbearable and at some point we get a revolution. The game board gets turned upside down and everyone can start off equal again. It's a real possibility. But as I've discussed in past vlogs, it's also possible that the two legs of the K will grow wider and wider over time until social mobility becomes impossible. And that massive bottom leg will eventually transform into a permanent underclass. And the entire society would become a kind of techno-feudalism where you will own nothing and be sad. Now, if we look at societies throughout history, feudalism is actually pretty common. And in fact, it may be a more stable social system than our own current system. So, bottom line, barring a major social transformation or a violent revolution, most people will enter the permanent underclass. Possibly in as short of a timeline as 5 to 10 years. And the most realistic way to escape this permanent underclass is to gain financial independence. That is, you must gain ownership of financial assets that would allow you to survive without having a job. But, how do you gain financial independence within this 5 to 10 year timeline when you have little or no money to begin with? What if you're in debt with a negative net worth? So, I have spent some time thinking about this and I got some advice to share. So, let's jump in. Now, a lot of people, they view the journey of achieving financial independence kind of like stumbling upon an easy money miracle. Usually, this is something like getting in on the ground floor of an insanely speculative investment, like an NFT that promises insane returns, something like 1,000% return per year, or something like stumbling upon an easy source of passive income, where you could work 4 hours per week on a laptop on a beach somewhere and make $1 million a year, or building an AI-powered business where the AI does all the work and you're pulling 100K monthly reoccurring revenue while you sleep. I'm going to tell you guys all right now that this is all a fantasy. A fantasy sold by countless numbers of financial influencers and internet gurus. Passive income is rarely truly passive. Like, if you publish a $20 ebook, it won't automatically make you rich. AI won't magically automate a business into profitability. And speculating on those NFTs, man, that's just gambling with extra steps added in. So, you got to stop believing in the myth of easy money. Becoming financially independent for the vast majority of people in this world is a difficult and long-term undertaking. Now, if you're starting from $0, it is critical that you build a base of financial stability before even thinking about financial independence. And achieving this stability requires that you embrace frugality. This involves taking a hard look at your expenses, your income, and your debt to understand your true starting point. It involves understanding which of your expenses are essentials, things like housing, food, utilities, and which expenses are optional. Now, [snorts] being frugal, it's a pretty broad concept. Some people are totally comfortable with insanely tight budgets. Imagine cutting all non-essential spending, things like subscriptions, eating out, consumer goods, maybe even heat and meat consumption. Some people can be perfectly fine with this extreme level of frugality. For other people, some creature comforts are actually essential, and they cannot cut down their budgets the absolute minimum. And even for the same person, a person's relative level of frugality, it could actually shift and [snorts] change over time. So, it's up to the individual to find their own threshold for sustainable frugality. With frugality, you're living below your means. You're spending less than you earn, and you're pocketing the difference as savings. With the savings, you can build an emergency fund, something like 3 to six months of essential living expenses. So, an unexpected event doesn't completely upend your life. You can pay down and eventually pay off your debts. And eventually, you'll be able to redirect these surplus savings towards safe and sustainable investments. Now, one way to accelerate your journey to financial independence is to create actual value. The basic formula here is simple. Find a real difficult problem. Become good at solving that problem. Help other people and get paid for the value that you create. This requires mastering the skills that allow you to solve these hard problems. Skills for whatever these problems are, right? Like, for example, engineering skills to make things, marketing skills for getting attention, sales skills for closing the deal and monetizing, management skills for project execution, and so on. With focused effort, most people can achieve mastery in a specific skill within a pretty reasonable amount of time. Like, less than a thousand days. Being able to solve these harder problems allows you to get higher income. Now, you can get this higher income via working for somebody else, like in a day job, or by working for yourself. In my opinion, it's a good idea to have an income engine that you control entirely. Build a business that you own, rather than entirely relying upon a job to get money. The goal here is to create something that can eventually make you money without directly consuming your labor. Now, I have discussed in detail on a past vlog about all the opportunities that are presented by the age of AI. But, the bottom line here is that today's technology, it allows us to create businesses and reach potential customers much faster than in past eras. To create value, you don't necessarily need permission from gatekeepers or a prestigious degree or even decades of experience. And here's the thing, time waits for no man. It's easy to sit there and just consume content. You might even have some clever ideas. But without action, it's just not enough. Remember, we may have only 5 to 10 years before the window of opportunity is permanently closed. So, you need to stop consuming content. Stop endlessly preparing. Stop making excuses and start doing. You need to get out there and solve the problems that people actually care about solving. Now, once you got some money coming in, it makes sense to make that money work for you. Because after all, we live in a hyper-capitalist system. What does that mean? It means to take your savings and invest it in assets that has a high probability of preserving its value and a high probability of delivering a good return. Now, speaking of investment, sometimes it's necessary to use leverage, also known as debt, to invest in highly productive assets. In my opinion, it's very important to distinguish between good debt and bad debt. An example of good debt would be like using debt to buy assets or to grow a business. One where there's a super high probability of that asset delivering a good return while preserving its value. Bad debt is when you take on debt to get things that has a low to zero probability of delivering a good return. Things that may actually depreciate in value. Think status symbols, lifestyle, man toys, and so on. As a rule, you should never spend money on things that don't generate future returns. Now, I'm not a financial advisor. I'm just speaking from my own personal experiences, so you should take it with a massive grain of salt. But for me, ownership of certain assets like rental real estate near major urban centers or large diversified index funds or ownership of businesses that I know very, very well, businesses where I have an asymmetric advantage. These asset classes seem to have done very well for me over long periods of time. So, net-net, financial independence doesn't come from finding some sort of magical easy money hack. For the vast majority of people, there is no easy silver bullet. It comes down to living below your means, solving valuable problems that other people are willing to pay for, and then putting that money to work where it can generate for you more money. And I truly believe that if even some of the people listening to this puts these principles into action, they can build real financial independence, gain control over their lives, and escape the permanent underclass. And that's all I have to say about that. Hope it helps. Anyways, if you have a morbid curiosity to join me on this life journey, please feel free to subscribe to this channel and subscribe to my Substack newsletter. If you want to support me in my vlog creation efforts, please become a member of this channel or a paid member of my Substack or just buy me a coffee. If you want a one-on-one coaching session with me, just schedule it. Anyways, thanks so much for watching. Talk soon. Bye.
