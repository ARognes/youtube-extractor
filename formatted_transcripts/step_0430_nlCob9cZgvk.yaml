transcript: hi my name is nick barker and this talk is about intuitive education games so just a high level summary if you don't have the time to watch the entire talk play is about learning we all play as children most intelligent animals have been observed playing and the purpose of play is to build up an understanding of the rules and the limitations of your own body and the world in a safe environment right you practice things that you're going to do in the real world with play so that you're not doing them for the first time when you actually have to do them for real right and very recently in evolutionary terms humans have invented video games which are essentially play but on steroids they are allow us to play in environments that are way beyond the limitations of what we would be able to do in the physical world and just like the play that we did in the past we learn so much about the environment inside video games and the systems that they use when we play video games right so why not use video games to learn real skills intuitive education games are essentially just video games that are carefully aligned with real world systems so that by playing them and having fun the player subconsciously learns something relevant to real world knowledge or skills while playing them so just some introduction and background in general people seem to understand the potential for education in games if you speak to people and you talk to them about the future of education they tend to mention gamification often right people seem to accept that at some point we'll figure out a more highly motivating way to do education but i would argue that we haven't quite really figured it out like emotion imagination for what really could exist in this space is is kind of limited and we can't really say that there's been really significant developments in educational games in the last 30 or 40 years they all kind of end up turning out like interactive textbooks and in general education games don't tend to be critically acclaimed or highly successful compared to just straight games right and i think one of the reasons for that is that we view education and fun as these oppositional you know mutually exclusive concepts and that we have to choose one of them right and if we're going to choose one and we're making an educational game people generally say it's better that the game is educational and not fun rather than the other way around because if it's fun and not educational it's just a game right so what i'm going to talk about in this talk is maybe we can get both of them together in one package but how do we design things so that we can make games that are both educational uh and fun and i think before we start to look into that we we have to think about what is actually happening when we play games right when we play what's what's going on in our brains and in our environment and if you've ever owned like a pet like a kitten or a puppy a baby pet they love to play right and the thing is that the majority of intelligent animals have actually been observed playing in the wild the strange thing is of course that play is very physically intensive right uses a lot of resources uses a lot of energy and so there has to be a very strong evolutionary incentive for the existence of play right otherwise we wouldn't waste all this resources all this food for no reason right and so one of the big prevailing theories around why play is found across all of these different species is because it allows animals when they're small in a safe environment to measure and understand the limitations and the rules of their own bodies and the environment that they live in so that they can extrapolate that to real situations later on if you've ever watched a cat playing in either a kitten or an adult cat with one of those fishing rod toys or if you've ever seen a cat you know try to catch a bird they so obviously have an intimate understanding of motion and flight they can predict where the object is going to end up if you ever drop a cat or you see a cat fall they they end up on their feet because they're very good at being able to manipulate their bodies to twist in the air right but of course in in the sense that we think about education cats don't understand physics right they can't understand physics from an equation's perspective um and it's the same kind of thing with with children with most children at least they can't explain the rules behind projectile motion but if you watch them when they start to learn to play sport they're obviously figuring out how to apply force at a certain angle with a certain rotation in order to you know make a ball go where they want it to and being able to uh subconsciously observe the rules of the environment that you're in and running small experiments and building up that understanding so that you can manipulate it with your body that type of thing this is generally what we refer to as intuition right the ability to do something without necessarily understanding logically how it actually works now as we extrapolate that out to games right we start to see that video games are essentially the same as the play that we engage in as children or the animals engage in it's just amped up to the next level right it's a very recent development using modern technology and as a result we're able to take play way way further than we are able to in the wild you know video games allow us to play at an immense scale way bigger than we'd ever see uh normally you know they allow us to to play in situations that would be way too dangerous or even completely you know paradoxical or impossible in real life you know they allow us to push our boundaries at play way further than we could otherwise everything from you know pure fantasy you know with orcs trolls that type of thing through to like future sci-fi fantasy dystopian alternate realities post-apocalypse that type of stuff and then all the way on the other end we have you know like simulation games that allow us to fly jets and launch rockets or even manage a football team that type of thing doing things in a way that allows us to do it safely and importantly cheaply with very few resources you don't need to buy your own football team in order to practice managing a football team playing football manager right and the most important thing to recognize here is that because video games are just an extension of the type of play that we normally do they're constantly teaching us things about the world that they're set in right as you play games uh more often for more hours you develop a stronger intuition well usually you develop a stronger intuition for how the games work and it's because your brain is running all these tiny little experiments doing performing inputs seeing what outputs it gets back and it's building up this big neural web of probability of what will happen given what conditions right we develop a deeper intuition and understanding of the world that the game is set in to the extent where if you play through a game once and then you watch your friend play through it you're probably able to give them some really good tips like oh that monster's probably too strong for you or uh there's probably some going to be some treasure over there that kind of thing even if you don't remember the exact location you've built up an intuition for the systems and the world that the game is set in right even if you can't explain oh here's the precise formula for the the damage that monsters do right you probably guess that the monster is too strong and that's your intuition kicking in so when we talk about intuitive education games uh i think it's important first for us trying to try and explicitly define what i'm referring to and then we'll start to look into the mechanics and think about how we can try and design intuitive education games so it's worth pointing out at this point that in general the systems that exist in games that we play aren't aligned with systems in the real world right uh you can for example if if you if you play a first person shooting game um that's not likely to make you better at shooting a real gun right i'm sure if you went to a firing range and tried to shoot a real gun it would be incredibly different to playing counter-strike right um that's a good thing in in that case right so intuitive education games are essentially games where the player picks up knowledge or understanding of a real world concept as a side effect of playing the game for fun right so they're not specifically educational games but as you play the game and you enjoy it for fun you actually pick up some real world skill not an imaginary skill or not knowledge of an imaginary world of a real thing so we can define intel uh intuitive education games with two specific uh criteria the first one is that of course the player needs to learn some kind of real world skill or knowledge as a result of playing the game and the second one is that the main focus of the game can't be the learning itself right this is really important it needs to be fun and engaging as a standalone even if the player isn't interested in learning at all right even if you're if your game is about teaching people a language it's not an intuitive education game if they need to be interested in the language in order to actually find the game fun and you'll know you've succeeded when it's essentially impossible to not learn the skill while playing the game it just goes in somehow passively so we're gonna look at how like what the specific mechanics are uh to actually add intuitive education elements into games and those two things aren't knowledge on one hand and understanding on the other so knowledge based elements in intuitive education games are essentially about memorization right when you align your content in your game with facts in the real world and when i say content i mean you know weapons people dates places uh you know governments plants animals that type of stuff when instead of inventing new ones you align them with real ones uh in the real world you can provide a fun environment to help the player memorize things without it really feeling like memorization right to give you a specific example when i was growing up i i played age of empires and age of empires 2 and the image on the right here is a chinese repeating crossbow right and when earlier when i was thinking ah what were the games i played as a kid and i thought of age of empires 2 the first thing that came to my mind was this unit in age of empires 2 called the chukonu right it's a unit with a crossbow that fires a lot of crossbow bolts really quickly it's quite strong unit from what i remember and it's a special unit that you get when you play the chinese army right so i remembered chukonu and i just went to google and i typed cheukonu and the first thing that came up was a wikipedia article about the chinese repeating crossbow that was used in like 100 a.d right so amazingly something like that which is a piece of knowledge that actually corresponds to a real historical fact right stuck in my brain for like 20 years that's how strongly it went in there and i think for example if we'd learned about this in history uh in school if i'd done this in primary school and in high school i'd learned about this i'm sure it would have gone in one ear and one out and out the other but for some reason you know it feels like it's stuck really strongly and when i started to dig into the reasoning behind it what i realized was it's because there was an external motivation for me to actually remember it right when you play a game in age of empires it will show you what the different armies are that you're you're fighting against and if you see that someone's playing the chinese army you'll know that they'll have these units and if you don't remember that they have the chukonu that could possibly put you at a huge disadvantage because you don't realize that the chinese army has this special unit that they use so it's actually providing an externalized motivation to memorize the fact which isn't just like memorize it and you get an achievement or a tick which is i think a whole that traditional education games tend to fall into so the second type of education that you can put in your games is understanding and understanding uh contrasted with knowledge uh is much much more powerful but exceptionally difficult to pull off well and understanding is where you manage to align an entire gameplay system uh inside your game with a system that exists in the real world so i'm not just talking about facts and concepts but i'm talking about the actual rules of the system so that you can interact with it and do experiments and it would behave as if it would behave in the real world and a really great example of this is redstone circuits in minecraft so redstone circuits in minecraft allow you to automate parts of of your constructions your the things that you build you can make doors automatically open and close that type of stuff and it's actually uh a good complete representation of logical circuits right so if you learn how to build really complex redstone circuits for for example people have built uh c emulated cpus in inside minecraft using redstone which is incredible and if you if you learn how to use redstone really well that's actually real transferable knowledge that can go across into computer science into electrical engineering this type of thing um and but the reason that it works is because it's a complex system where there are relationships defined in code between the different concepts and it allows that push and pull that experimentation that allows your brain to kind of intuit the rules of the system it's not just a bunch of facts that will map onto things in the real world and you can probably see how this is so much more powerful but also much harder to do so just to clarify because these three concepts kind of get a little bit murky together intuitive education games as i said before fun is the main focus and learning happens as a side effect traditional educational games learning is the main focus they're sometimes fun uh if they manage to pull off things well not often that happens and there's a third category of things which i'd refer to as simulations and they kind of walk a fine line between the two types of educational games by providing a realistic simulation of real-world conditions right so i'd say microsoft flight simulator is a perfect example of this and one of the problems with simulations is that you might find it really enjoyable if you're really interested in the thing that it's simulating right if you're interested in flying a plane or becoming a pilot amateur pilot whatever you might find flight simulator really fascinating but if you're not into that kind of stuff it's probably not really fun as a game because there's not that attempt to create those kind of gamey elements beyond just what the actual real world system is we're just trying to emulate it as closely as possible so i've described you know knowledge um and understanding as these two different ways to approach intuitive education elements but they're both kind of quite general and high level so i'd like to get into the the nitty gritty kind of specifics of how we could actually procedurally implement these features in a game how do we actually create education intuitive education games um from either from scratch or or in integrating them into existing systems and it and it is uh important to realize that you don't have to do this stuff from scratch you you can actually put intuitive education elements into a game that you're already creating or or that you've already put out and you want to make an update to right the the one most important fundamental thing that you need to do is just observe every time you need to create a new system or a new cons concept set of concepts specifically in your game so if you need to create a new mini game if you need to create a new kind of set of mechanics for a boss fight if you need to create say like 20 new um herbs in in a new zone in your game because you gather them to make potions and that kind of stuff whenever you have to create a set of concepts or a new system that's a perfect chance to examine oh could i do an intuitive education element here could i insert a real world concept or system here instead of an invented one so we'll start off with an example of a knowledge based system so say you're creating a game where the player can cast spells right and the way that you cast spells is you use runes and runes can be combined together with other runes to make more complex spells and say runes like there's a there's a fire rune and a frost rune and that type of stuff um and it's probably really tempting at this point to invent your own new system of really cool runes you can get your artist to draw some really nice simple symbolic designs and they can fit the lore of your world all of that kind of stuff but this is a perfect example you're creating a new set of things and a set of combinations of things this is an example of a time when you could consider using an intuitive education element so what if we look at what the set of things actually is okay so we have pictographic elements our runes that represent fire frost or that kind of thing and they can be combined together to create kind of compound things why not use say chinese characters if most of your player base is going to be english speaking this could be a new intuitive education opportunity for them you know instead of using runes you could use the real chinese characters the chinese character for fire the chinese character for frost and you could actually do some basic like real accurate compound words two character words three character words that type of stuff the player doesn't need to know how to pronounce them or even necessarily the exact uh accurate dictionary meaning but uh the thing is that you've gotta remember that you know if a player is playing your game and you've invented a system of runes they have to learn that system anyway right they have to learn the combinations they have to learn the runes anyway they're learning a new system regardless of whether you use something invented or something that exists because if they don't know chinese and they don't know your runes it's kind of all the same to them right so you're not actually putting any additional burden onto the player to put this type of element in but they're getting something a little bit extra and special out of it that they might not even realize you know later down the track they might try to learn chinese or go on a trip to a country that uses um chinese characters and suddenly be shocked at the fact that they just like know that that one is fire for some reason so let's look at an understanding based example as i said before these are much more subtle and difficult to implement and to pull off well and it requires kind of thinking at a really deep level about the core mechanics and the systems in your game so say you're making a fighting game like tekken or mortal kombat right if we look at fighting games and we strip back all of the extraneous stuff all the graphics um you know all the sound all of the law and we go even deeper deeper deeper down we strip away even the concept of attacks blocking positioning what do we end up with well at the very very base fundamental level when we just look at the inputs and the data transformations fighting games are just about timing right they're about you inputting a timing of different buttons that is counted by the game system as superior to your opponent's timing of buttons right if you both do the same attack and you time your attack earlier you win right if they do an attack and you time your block correctly you can block their attack right so given that fighting games are all about timing at the very base level what other systems are there in the world that are about timing right that's how you do it you figure out what the base system is what is it at the core level and then what other systems exist in the real world that are based on those same kind of concepts so in this case what if we say chose music music is all about timing right so what if we align the timing of the game with the music on the current stage that you're fighting on right so that moves are stronger if you're perfectly on the beat or if they could fail or stumble if you're out of time right you could actually subconsciously train the players to have a really really strong sense of rhythm without making it a rhythm game right it's just a subconscious aspect of this particular fighting game it probably wouldn't necessarily even end up feeling that different to a regular fighting game because i'm sure that when people are trying to execute complex moves in fighting games they have some internal sense of rhythm or timing in their head anyway it helps you remember this stuff and we're intrinsically rhythmic as people right thinking deeply about this kind of stuff can help you understand your game and how it applies to real world situations and then potentially adopt a real system here's another example what if we go one level higher and we think of fighting games as okay well sure they're about timing but more specifically than that they're about attacking blocking and positioning right three the three base important elements of fighting games so say we looked specifically at just attacks right fighting games in terms of attacks are all about combos right what if combos you know what what is it about combos um that actually makes them combos right what what is the base system that is actually going on there when you think about it it's like okay you know we can combine moves together in a specific order and combos have some shared parts like there might be five different combos that start with the same three moves um and then have a different kind of ending if we look at a system of combining things together in a specific order what kind of stuff like that exists in the real world well what about grammar the grammar of a human language human spoken language like english or spanish whatever what if you classified all the moves that your fighter has as verbs or nouns or adjectives right and high kicks could be future tense mid kicks could be present tense low kicks past tense for example for verbs you could design the combos in the game in a way where you subconsciously pick up the grammatical the correct grammatical ordering of words in a language because the only way that you can do a combo is by putting the words in the right order and you don't have to have it so on the nose about it being like specifically words the whole point is that you can make it align with a system that you would have had to create in your game anyway right regardless of whether players are learning the combo grammar order or the combo order that you just invented for your game they still have to learn the combos right they have to learn an arbitrary system of combos of moves so why not give them something a little bit extra with the the investment that they're making to learn the systems in your game by using a real world system right you get all of the richness and the complexity of that system for free you don't have to invent all of this stuff yourself from scratch right you don't have to invent all the combos from scratch um and i think when people think about this they think about it as costing something to try and align it well with the real world system but sometimes rather than constraining you integrating these intuitive education concepts actually opens up possibilities for your game design that didn't exist before right if your fighting game now has a rhythmic element to it suddenly the music for the particular stage that you're fighting on is really important right it has a big impact on the pace and the difficulty of your fight as a player you might be much more comfortable on on stages with fast music than slow music and suddenly now you have an incentive for when players are fighting each other to vote on what stages they want to play right and to learn how to play at different rhythmic intervals becomes part of the strategy that wasn't there before and if the combo ordering for example is based on the grammar of a language you could have playable fighters from lots of different countries as many of these fighting games do tekken for example has characters from all different countries right and you can have each fighter having a different combo style based on the grammar rules from their native language right you have your korean character who does taekwondo and their combos might use korean grammatical ordering and then you might have your brazilian fighter who's doing capoeira and their combo system might be based on portuguese instead and when you think about it from this perspective you realize like oh now i don't actually have to think about inventing all these combos right i just have to look at the grammar for korean and the grammar for portuguese and i can just use that to lead the way that the moves will knit together into a combo it unlocks this richness and this this vast corpus of ideas that have been refined over a very long period of time that you don't have to invent yourself from scratch right inventing your own system for your game is incredibly fun and rewarding and i don't discourage you from doing it at all there are some amazing things that have been invented specifically for games that that don't exist at all in the real world you know things like portal for example but it is important to mention that inventing this stuff can also be very difficult and time consuming and just think about the fact that you may actually save time and end up with a better result if you try and align your system with something that already exists in the real world rather than trying to invent something new from scratch so that's an overview of intuitive education games and the kind of things that you can think about when integrating the mechanics and i just want to quickly uh talk about some ethical concerns with this type of game in general because i think it's really important whenever we're thinking about uh perhaps a step forward or some new type of thing in technology uh these things are very rarely one-sided positives right there's always kind of like a way that this sort of stuff can be abused so firstly it's really important to acknowledge that intuitive education games if they're really done well can kind of be interpreted as a form of subliminal messaging right it's actually not possible to resist that information going into your brain i mean the example of i can remember the tukonu from 20 years ago you know it's it's actually crazy that it's stuck that that hard into my brain um so it's really important to just think about the fact that you're kind of doing this without consent and you should really try and do it ethically in a way that can only benefit the user or the player the second thing is it's possible that as we work down this path we will discover some psychological phenomena about the way that human brains work to make that information transfer much more efficient and you can already tell that that kind of stuff has a high potential for abuse right uh game companies have actually been at the forefront of discovering kind of bugs in the way that our brains work in order to enhance the addictiveness of games to make people more likely to spend money on microtransactions so it's really important to understand the ethical implications of the research that you're doing and how that research is disseminated and framed right and the third thing of course is that there are industries adjacent to games um that are all about exploiting these types of weaknesses so if we don't if we figure out really effective ways to do this type of thing we have to be really careful with how these games intersect with advertising you know with with government um propaganda that that type of thing uh because we we really don't want games to turn into these engines of of of subconsciously inserting ideas into people's minds um and the last ethical thing to think about is that it is incredibly uh important that when you align your game with a real world system you align it accurately honestly and truthfully right and what i mean by that is if you put a system into your into your game that is close to a real world system but has some inaccuracies or misrepresentations you risk actually creating or intrinsic entrenching misinformation in the minds of your players in in the subconscious right a great example of this is uh there are a lot of games that use kind of percentage um chance turn-based games that kind of stuff you know you can take a shot at someone and have a 90 chance to hit there are a lot of these games that don't represent that probability accurately and the reason that they don't do that is because we have some cognitive bias around probability and if you take a shot that has a 90 chance to hit you kind of assume that it's going to hit every time whereas if you're playing a game and you're taking thousands of shots it's actually not you know too unlikely that you'll have several misses in a row at some point on a 90 chance and if that happens your brain will perceive that as incorrect like the probability is broken or something and so what games have done is they've actually said okay well if you're taking an uh a 90 chance of getting something having something good happen we'll actually secretly represent that as 99 in the background so it succeeds much more often than it's supposed to and if you have a ten percent chance of a really bad thing happening we might lower that down secretly to one percent in the background so that happens much less often because that creates a more satisfying experience it makes people feel like they're getting a better payoff on the risks that they're taking than they actually deserve right it's it's like giving someone an artificial lucky streak in a casino right it breaks their brains interpretation of what probability should be and you can basically poison a player's subconscious by doing this because then they're going to take their perception their their skewed perception of probability out into the real world and potentially make uh misinformed decisions in terms of taking risks because they perceive probability intuitively incorrectly it's it's off base compared to the actual reality so it's it's really important to understand that it needs to be accurate and truthful if if you can't make it work and you can't make it fun without making it inaccurate just can the whole thing and invent your own system invent a fantasy system don't don't poison someone's perception of a real world system um if you if you can't make it fun um so just to wrap up uh the the main things that make an intuitive education game is firstly the the player needs to learn some kind of real world skill or knowledge as a result of playing the game and the second thing is the main focus of the game shouldn't be learning that skill right the game itself needs to be fun and engaging as a standalone thing even if the player isn't interested in learning that skill at all they should be able to come and play your game and still have a good time even if they have no interest in learning that that skill or knowledge right and if you want to really know if you've if you've nailed it don't mention the educational aspect in the marketing or description of your game at all see if you can make a popular game with these intuitive education aspects without even mentioning it that is really hard i'm i still can't do that not yet um so thank you for watching uh i should mention that i make intuitive education games i'm trying to get better at making them and understand more deeply how they work i have one out at the moment called matcha it's a simple kind of tile based puzzle game and it's based on the korean writing system hangul so when you finish the game when you when you beat all 380 levels or whatever um you should be able to read korean writing uh you won't know what the words mean but you'll be able to read them so i've tried to align my in-game system with the korean writing system and still make it fun i hope you enjoyed the talk and go out and make some intuitive education games thanks
