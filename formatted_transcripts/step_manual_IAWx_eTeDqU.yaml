lem they arise and pass as all\n[117.039s] things do the problem is that we tend to\n[120.0s] get attached to the pleasant emotions\n[123.479s] and we tend to resist the unpleasant\n[126.6s] emotions in this way for example we may\n[130.239s] be happy one day but as that happiness\n[133.04s] dissipates as it ordinarily will as it\n[136.12s] always will we become sad or upset or\n[141.04s] pain pained in some way because of the\n[143.56s] loss of that happiness becoming aware of\n[146.92s] the transient nature of all of our\n[149.44s] emotions\n[150.56s] can help us to release our attachment to\n[153.84s] them so that we don''t suffer so much as\n[157.239s] they pass away so that we aren''t\n[160.68s] constantly being either attached or\n[163.08s] aversive to to whatever sorts of\n[165.72s] emotions arise second I want to\n[169.08s] discuss options for transforming some of\n[172.36s] our emotions while it is generally true\n[175.72s] that we should view our emotions\n[177.36s] neutrally as unpr problematic and as\n[180.239s] arising and passing due to causes and\n[182.519s] conditions it''s also true within early\n[185.2s] Buddhism that certain emotions are are\n[187.92s] seen as\n[190.0s] inherently unskillful or unhelpful to us\n[193.36s] unhealthy a key one of these perhaps the\n[196.159s] key one is anger or hatred this is\n[199.64s] viewed as an emotion which on the one\n[202.04s] hand is of course painful to us when we\n[204.959s] feel it but it''s also can be painful to\n[207.72s] the people around us in so far as we act\n[210.64s] out on that anger or hatred through\n[213.4s] actions or through speech now there are\n[216.36s] various ways that we can try to\n[218.799s] counteract that emotion of anger when it\n[221.64s] arises so that we don''t act out in\n[224.319s] unskillful ways perhaps the foremost of\n[228.12s] these is a practice of kindness or\n[230.2s] loving kindness the PO word is\n[232.959s] meta this is a practice it can even be a\n[236.079s] formal meditative practice where we sit\n[238.56s] down in formal medit a in a quiet space\n[242.04s] focus on breathing to begin with to\n[244.0s] quiet the mind and then try to find some\n[248.72s] Avenue towards a feeling of\n[252.0s] kindness that is bring to mind something\n[255.079s] that makes kindness arise in us the\n[258.479s] current uh uh tavada meditation teacher\n[261.32s] of John Braum talks about bringing to\n[263.56s] mind a pet thinking of that pet may just\n[267.52s] immediately bring kindness to mind or we\n[270.16s] could bring to mind somebody a\n[272.44s] benefactor in our lives somebody who''s\n[274.12s] helped us a great deal a parent a great\n[277.52s] friend that sort of person is somebody\n[279.68s] that we automatically feel kindness\n[282.84s] towards and when we touch into that\n[286.24s] feeling of kindness then we can work\n[288.479s] with it and try to bring it out into the\n[291.68s] rest of the world we can work with this\n[295.039s] through phrases such as may they be well\n[298.28s] may they be happy may they be healthy\n[301.199s] may they be safe may they be at peace\n[305.16s] and then we can expand that over a\n[308.16s] practice over a lengthy practice we can\n[310.88s] try to expand that out to Encompass the\n[313.88s] whole world may all sentient beings may\n[317.08s] all beings be at peace may all beings be\n[320.0s] happy and well may all beings be safe we\n[323.8s] can also consider a practice of\n[326.039s] compassion in certain\n[328.28s] circumstances one of these might be if\n[331.039s] somebody is difficult in our lives again\n[335.16s] in in in these cases it''s generally best\n[337.24s] to begin with somebody who''s a little\n[339.08s] bit difficult not the most difficult\n[341.72s] person we think of that person that\n[344.039s] somewhat difficult person and we try to\n[346.6s] consider what is behind their being\n[349.6s] nasty in the way that they\n[351.44s] are how are they hurting how are they\n[354.84s] suffering how is the suffering in their\n[356.8s] life causing them to act out if we can\n[360.52s] think in that way and try to figure out\n[362.84s] these background causes and conditions\n[365.52s] they may help us to generate compassion\n[368.599s] for them compassion for their suffering\n[371.56s] that''s causing them illness that''s\n[374.44s] causing them to act out in ways that\n[376.56s] hurt other people around them and that\n[378.88s] kind of practice can again help to\n[381.16s] mitigate this anger we feel or if we''re\n[384.36s] feeling resentment or jealousy because\n[386.919s] of somebody else''s success in life\n[389.759s] because somebody else is happy then we\n[392.319s] might consider a practice of sympathetic\n[395.16s] Joy what''s known as mudita in Pali this\n[398.88s] is a practice of taking joy in the\n[400.84s] successes and happiness of other people\n[403.919s] now again we begin small it''s best to\n[406.599s] begin small We Begin perhaps with\n[409.599s] somebody that we already feel kindness\n[412.759s] towards we begin with this perhaps this\n[415.84s] pet or this benefactor good friend and\n[419.639s] we think of them as being successful in\n[422.16s] whatever way they are we think of them\n[424.44s] as being happy in whatever way they are\n[427.759s] and allow that to generate in us this\n[430.28s] feeling of sympathetic Joy of joy in\n[432.96s] their doing well joy in their\n[435.84s] well-being and then again we work to\n[438.639s] expand that feeling of well-being out\n[441.68s] into the entire world again beginning\n[444.36s] small beginning with the or I should say\n[446.879s] continuing small with the people who may\n[448.96s] be difficult in our lives that we feel\n[450.639s] some resentment towards but perhaps are\n[452.84s] not the most resentful the person we\n[455.84s] feel the most resentful towards that''s\n[458.12s] the way we can help to sort of work with\n[460.28s] this in our practice all of these\n[463.479s] practices can help to\n[465.68s] transform anger or resentment hatred\n[469.68s] judgmentalism into more of a feeling of\n[472.24s] care and connection for others around us\n[475.639s] another key to\n[477.36s] transforming difficult or un skillful\n[479.96s] emotions is simply to observe them\n[482.759s] mindfully to observe them objectively\n[486.36s] instead of framing them or considering\n[488.879s] them as mine that is to say instead of\n[491.8s] thinking I am angry we frame it differ\n[495.96s] as anger is arising as this is what\n[499.28s] anger feels like as if we can objectify\n[503.12s] it in that way if we can create that\n[505.44s] slight amount of distance then perhaps\n[508.44s] we can look at it in a more generous\n[511.919s] light and try to figure out how it''s\n[514.919s] working in us we might ask ourselves\n[518.159s] what that emotion really feels like what\n[521.159s] does it feel like in us what does it\n[523.32s] feel like in our body is it Pleasant is\n[526.92s] it unpleasant where is it felt how is it\n[530.56s] felt is there something that we''re\n[532.68s] clinging to or resisting that''s causing\n[536.08s] that emotion to\n[537.6s] arise as we investigate with curiosity\n[541.8s] these difficult emotions we may find\n[544.839s] that they dissipate on their own and\n[547.24s] that we''re less likely to act out on\n[549.2s] them in ways that are\n[550.92s] unskillful further seeing and\n[553.839s] understanding these emotions as painful\n[556.68s] as difficult as unhelpful can help to\n[560.519s] dissipate their power over us over a\n[563.519s] period of time and it may indeed be a\n[566.36s] long period of time I don''t think we\n[568.04s] should expect to have immediate success\n[570.56s] here but if we continue with these kinds\n[572.76s] of practices I think over a period of\n[575.6s] weeks or months we''ll find the emotions\n[578.72s] diminishing to a degree third I want to\n[581.44s] discuss coming to a state of equinity\n[584.8s] what''s known as UPA in Pali the three\n[588.04s] states we''ve already described of\n[591.079s] kindness of compassion of sympathetic\n[593.68s] Joy are the first three of the four of\n[596.8s] what are known as the Brahma viharas in\n[598.8s] early Budd practice that is these abodes\n[601.32s] of the Gods these positive emotional\n[604.36s] states that we can try to cultivate in\n[607.079s] order to make our lives better now the\n[610.279s] fourth of these Brahma viharas is the\n[612.24s] state of equinity now equinity means\n[616.32s] different things many different things\n[617.92s] in the sutas but in in in a nutshell\n[621.36s] what it means is a kind of a\n[623.92s] balanced calm quiet state of mind that\n[628.56s] remains un perturbed in the face of\n[631.279s] life''s highs and\n[633.24s] lows it''s I think well analogized by the\n[636.519s] Buddha in one of his discourses his\n[639.0s] early discourses which is a discourse to\n[641.76s] his son rahula where he recommends to\n[646.04s] his son a practice that we might call a\n[648.639s] kind of an elements meditation to view\n[651.44s] the world to view himself as if he were\n[655.48s] each one of the major elements as he\n[658.92s] says\n[660.2s] suppose they were to toss both clean and\n[662.56s] unclean things on the earth like feces\n[666.32s] urine spit pus and\n[668.88s] blood the Earth isn''t horrified repelled\n[671.959s] and disgusted because of this in the\n[674.639s] same way meditate like the Earth for\n[677.959s] when you meditate like the Earth\n[679.959s] Pleasant and unpleasant contacts will\n[682.079s] not occupy your\n[684.04s] mind and then the Buddha goes on to give\n[687.0s] rahula the same kind of instruction with\n[689.92s] air fire and water in this way he''s not\n[694.24s] saying that rahula should\n[696.16s] become detached or\n[698.839s] disinterested but rather that he should\n[701.6s] approach life without being overwhelmed\n[704.36s] by it we practice so as not to take\n[707.44s] experiences so personally we practice so\n[710.92s] as not to be overwhelmed by our emotions\n[713.639s] when they arise and so allow so not\n[716.72s] allowing ourselves to be carried away by\n[719.0s] them we can cultivate this kind of\n[721.12s] equinity through a practice of\n[723.519s] reflection on the impermanent nature of\n[726.36s] all emotions as I discussed at the\n[728.12s] beginning of this video through an\n[730.2s] awareness that all of our emotions no\n[732.279s] matter how intense they may appear to us\n[734.959s] right now are impermanent and will pass\n[737.92s] away we can perhaps reflect on a past\n[742.16s] time a time in our lives where we had\n[746.48s] such an intense emotion and it''s no\n[749.399s] longer with us it only persisted for a\n[752.079s] time even though it seemed to be the\n[753.72s] entire world for that time if we could\n[757.24s] reflect on this way it may take some of\n[759.199s] the power away from those emotions we\n[762.12s] can also cultivate this equinity through\n[765.16s] a practice of regarding both painful and\n[768.8s] pleasant experiences equally now this I\n[772.56s] have to say is not an easy practice uh\n[776.04s] certainly not one that I would say I am\n[778.44s] comfortable with in all parts of my life\n[782.16s] but nevertheless it is true that an\n[785.639s] equanimous approach to life is one that\n[789.04s] Witnesses pleasures and pains in such a\n[791.56s] way that we do not become attached to\n[793.72s] the pleasures and we do not reject and\n[797.04s] and flee away from the pains if we can\n[800.72s] come to such an understanding to such an\n[804.44s] equinity even for a moment it can be a\n[807.6s] moment of real freedom for us\n[809.92s] fourth in conclusion what is the role of\n[813.0s] emotions in the path of early Buddhism\n[816.32s] emotions are viewed as ordinary natural\n[819.68s] parts of our mental environment things\n[823.04s] that arise naturally and pass naturally\n[826.199s] based on causes and\n[828.24s] conditions as such they''re all\n[831.079s] impermanent they''re subject to change\n[833.6s] and\n[834.72s] disintegration and they''re best looked\n[836.92s] upon not as possessions of s not as our\n[840.36s] emotions not as I am angry but rather\n[844.32s] again more objectively simply as things\n[847.24s] that arise and pass in our mental\n[851.12s] environment states of mind that as such\n[854.12s] do not need to be acted out upon and the\n[858.72s] difficult or unskillful emotions such as\n[862.0s] hatred anger maybe greed those kinds of\n[865.519s] things they can be worked with through\n[868.56s] these prac practices of the Brahma\n[870.399s] viharas of kindness of compassion\n[873.68s] sympathetic joy and equinity in all\n[877.32s] cases though working with these emotions\n[879.56s] in early Buddhism is not a practice of\n[882.079s] trying to suppress them rather it''s a\n[885.079s] practice of acknowledging them mindfully\n[887.959s] working with them trying to transform\n[890.56s] them and then trying to release them and\n[894.0s] as always in these kinds of discussions\n[896.48s] I want to leave us with a caveat which\n[899.04s] which is if you''ve been pursuing these\n[901.759s] practices and you don''t find them\n[904.0s] helpful and you find that you are being\n[906.079s] overwhelmed by difficult or problematic\n[909.16s] emotional states then please do seek\n[912.279s] professional help from a licensed\n[914.519s] psychologist or therapist in your region\n[918.519s] they can be a real help because there''s\n[920.56s] no point in suffering with emotions that\n[923.44s] can be helped through discussion with\n[926.44s] somebody who is properly trained so my\n[929.199s] question to you is what tools have\n[931.519s] helped you to work with your own\n[933.639s] emotions how do you manage to to stay\n[936.279s] grounded in the face of your own\n[938.56s] emotional\n[940.16s] challenges I I did a series of past\n[943.079s] videos about these Brahma vih