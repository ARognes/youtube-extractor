transcript: (upbeat music) - Ice hockey's the coolest sport, right? Even if you don't play, even if you don't follow a team, there's just something about this that's undeniably awesome. (upbeat music) But despite this obvious awesomeness, hockey has never really been as popular as many other global sports. Sure, they love it up north, and if you grew up in a cold part of America, you probably have fans in your local bar, but it's always been the little brother to the sports with balls. And given the cost of making AAA games in 2023, that's kind of a problem. These days, annualized sports games are the norm, but that wasn't always the case. When Electronic Arts started making yearly sports titles in the early nineties, it had more to do with the lightning fast design evolution of these games than it had to do with rosters. Today, the studios that make these games have grown exponentially, but so too have the games and with a market that now expects a new title every year. And since this year marks the 30th anniversary of NHL '94, I wanted to explore the design of this classic game and how games like NHL '94 laid the foundations of sports games for decades. So today, we're gonna talk about NHL '94, but to do that, you sort of have to talk about NHL '95 and NHLPA93 and EA Hockey. Look, we're gonna have to talk about John Madden football too. And while we're at it, I'm gonna talk to some of the folks working on the modern NHL games to explore the pros and cons of living in the shadow of a classic. It's kind of incredible, it's taken us this long to do a documentary on a sports game, no offense, Rocket League. So it's probably just as well that we're doing it on arguably one of the best sports games ever made. Here I go, here I go. (upbeat music) (laughs) (upbeat music) - People have been through the code, so to ask about specific bugs and I mean, yeah, that's something that we should have caught, but it's like, have you ever had a bad day at at work? It's like did you get asked about it 30 years later? Like there were different groups building sports games. And so Don Traeger's group was building basketball and golf and we were working on baseball and football and the history of Madden was that Trip Hawkins was a big sports fan, he'd actually made a football game before he even joined Electronic Arts. So that was kind of his thing, and he'd went and signed Madden and they built a PC version of football and it really pushed the envelope on football just to get 11 guys animating was really pushed the system so it was pretty clunky. And it definitely overreached the technology at the time, even though it was pretty sophisticated as a sim, it was kind of clunky and it didn't sell very well. And Rich Hilleman kind of wanted to build a Genesis version of the game 'cause you could do so much more with the Sega Genesis. So he wanted to build a football game from scratch that really was a EA football game and it was meant to be an arcade game. I was brought in because I was a big sports fan and I was also into computers and that was good enough, they couldn't find people who were sports fans and into games at the time, if you can actually believe that. So I was brought in to help produce the game. So I was an associate producer on the EA Football Game that we were building for the Sega Genesis. And it had nothing to do with John Madden at the time, it was meant to be the arcade game, and I'm the associate producer and there were meant to be eight teams that were just made up teams. I was kind of like, I'm supposed to do all these detailed ratings for all the teams. I'm like, I'm gonna model these after eight teams in real life and and we'll call them San Francisco and Philadelphia and my favorite eight teams. And so we did that, and this is pretty realistic and everybody wants their team in. So we managed to get eight more teams in at the last minute, 16 teams, but we didn't even have all the teams in the game, we had just gone public in the last year and accounting came to us maybe like three weeks before we're due to final the game and said, "We've got this huge balance that we paid John Madden as an advance and we're gonna have to write it off, that looks really bad, but if we can attach it to your football game and give him a high enough royalty rate, then it'll chew it up and we don't need to write it off at all. And we can push it forward and that'll help the quarter out." So we said, okay, we'll add John onto the game, like, I don't think he's gonna make a difference 'cause video gamers don't really know John Madden. We did that and then, we based our royalty rate off the 75,000 units that were projected and we sold 300,000 units. And then good luck trying to renegotiate with Madden to knock that rate down 'cause his agent is like, oh, that's because you added John Madden onto the game. So we sort of just went with that and like we used Madden's plays. And so Madden in the original John Madden Football got built in in the last three weeks. (upbeat music) - [Narrator] Football's a fairly popular sport, obviously in the US and I'm sure it is in Canada to a certain extent as well. Hockey seemed like it was a, like a smaller fish to fry maybe within the world of sports games. When did the idea of doing the hockey one sort of come around, you know? - Yeah, so we got the first football game out, it shipped like almost a year early 'cause I mean for competitive reasons. So we really didn't get to finish the design that we had in mind until Madden '92. It ended up taking Jim Simmons six months to really program the game. So we felt we had some time between when he needed to start on Madden '92, and when we finished Madden, which by the way, he also knocked out Joe Montana football for Sega in that time, that's a whole different story. But basically, the sports that were kind of open to us, because basketball and golf and baseball and football were already taken, Rich Hilleman and I were big hockey fans, so that was like just a total natural, we're gonna do hockey. I put a proposal forward to let's, we should really do soccer as well. And that was a tough sell, if you can believe it. That took about a year to really make the sell that we're gonna do a do a soccer game. So hockey was the natural 'cause we were both hockey fans and I grew up in Philadelphia in the seventies, so I was a huge Flyers fan and I'd actually made a hockey game that I had sold as a kid, a dice and chart based game. So between us, we really knew hockey pretty well and that was a pretty easy decision, let's do hockey. And then I really wanted the NHL and NHL Players Association licenses for that. We were just starting to do license deals, so Madden didn't have the players. Time Warner was handling the licensing for both the NHL and the NHLPA. And I went to them and I said, "we want both." And they came back with, "We can't give you the players, we can only give you the teams." So, I said, okay, well I'll take the teams then and we will use numbers for the players. When we finished our first game, NHL Hockey, we got the approval from Time Warner and we went to the NHL Stanley Cup playoffs, the finals, Minnesota and Pittsburgh, and we're in Pittsburgh and we're showing the game in the media room and the press is there, and John Ziegler, the commissioner of the NHL and all the NHL brass are sitting there. And of course we'd built fighting into the game. And Time Warner had approved it and some of the reporters had figured out how to get fights to happen. So they had number 99, Wayne Gretzky like getting in fights and there's the commissioner and he's not really happy and they're like judging his reactions. And so by the time I got back, the NHL had said, you can't ship this game with fighting in it. And we're like, we've already honored like $10 million worth of carts 'cause you approved it and it's gonna come out with fighting, and they said, okay, but never again, you can't do it next year, and they said, what would you like to do? Do you want the teams or do you want the fighting and the game? And I felt fighting was probably more important for the game. Whenever there was a decision on like, how realistic should you be or how much fun should it be? We tended to go with the fun part of it. So for instance, the goalies are invincible 'cause you can't push around a goalie, there's no refs in the game 'cause that would impact the frame rate so they're not skating around. So those are the kind of decisions that we made. I felt like fighting was definitely a big part of the game. And in fact when we programmed it in, we had a very sophisticated system where if you were delivering checks on the stars of the other team, like the enforcer would, kind of pick some of your better players out and try to get in a fight with them. And fighting actually mattered, if you could knock out a guy, you could knock him out for the period or for the game. So there was a goal in getting into a fight and it was strategic. I didn't wanna pull that out of the game. So I went to the NHL Players Association, I told them we tried to get you guys and Time Warner said no, they actually sued Time Warner because they had never heard of this. They're like, this is the first time we're hearing about this opportunity. They said, as long as fighting's realistic, we'll let you put it in the game. They said, look, we'll do the license, just make the number of fights that happen, be like the normal amount that would happen in a game. It was like 1.7 in a game. So I said, okay, we'll do that, the NHL wouldn't be a part of that. So they basically, they didn't have the license for the second game and it was NHLPA '93 and that was tremendously successful, even more than the original NHL version. So we're quickly making NHLPA '94, then the results of NHLPA '93 are coming out and the NHL now wants like back in. At that point, we started to have a really sophisticated fighting system. We wanted the NHL on the game because it was starting to get more important with CDs were coming out, we knew we need real footage and that was controlled by the NHL, so we didn't wanna lose the NHL and we didn't want them going off somewhere else. So we had a great fighting system built in, we'd really enhanced it in an NHLPA '93 and then '94. We ended up ripping that out of NHL '94, even though it was fully implemented, it's very sad, that was a really cool feature. Obviously it didn't hurt the sales of NHL '94 not to have fighting in, but fighting didn't come back into the NHL series until '96. And I was no longer involved with it at that point. (slow music) - What's incredible about early computerized sports video games is that most of them weren't so much inspired by the real world sports they were emulating, but by these arcade and handheld toys that had established the gameplay long before microprocessors were involved. It's about time we met Mark Lesser, a guy who was so good at programming video games that he didn't let small things like not knowing the rules of hockey get in his way. - I graduated with a degree in electric engineering, didn't learn anything relevant, but it was a good education I guess. I went traveling after college and came back, no job. So I went looking for a job and bumped into Rockwell, which was kind of funny, I had long hair in a ponytail and Rockwell was about as straight a place as I could imagine. And I ended up going in there as a circuit designer on bus-fit based designs and worked on handheld calculator chips and small systems, they had a couple of small microcomputer systems. And then I think it was George Close and Richard Chang from Mattel came to Rockwell and gave him a proposal to convert one of the calculators into a handheld game. And my boss called me in and gave me some options about what I wanted to do. And one of the proposals was that proposal from Mattel. And I looked at it and I thought, well, a game, that would be something. And then after that, I did nothing but games. That was Mattel Auto Race, then there was Baseball. I don't think the rest of them were sports games though. So we had Space Alert or Flash Gordon, oh and Football. Don't Wanna Forget Football 1, of course, so there were three. The basic rules are if you think about what's in a game, you eliminated all characters, no personalities, there are no players, there's no team names, there's no teams, it's all just the rawest kind of baseball. It's like something, like kids may have played when they were, four years old and a lot, they didn't know anything about the game. The kicker is in all these games that in order to make it intriguing, there had to be some hook. And the hook usually had little to do with the sport. So like in auto racing, it wasn't so much the idea of passing, it was more an obstacle avoidance thing. But how do you make that interesting? Where's the hook? And the hook came in the tuning that it had, it was a balance between predictability of where these obstacles are gonna be and how easily or more difficultly you can get it in without getting stuck. Baseball's so simple, look, if you think about the arcade games in those days, there was this ramp game they always had when I was a kid, I loved it. And basically it was like a pinball game, but the ball would be pitched to you and you swung a little bat and hit the ball up ramps. And depending on how it went, it either went, over the fence or into the stands or, or was a grounder like that. So the essential quality was there. This captured this to some degree. Baseball's the easiest sport to program I think. So I met, through a friend, Paul Neurath and he had I think Blue sky productions, it was, they changed the name later they got sued and changed the name thing to Looking Glass or something. But I went visiting him for about a year at his studio. He had some really bright people working there, a lot of MIT people. And somehow, EA gives him a contract to do Madden '93. And there was nobody in his studio and had any Genesis experience whatsoever. And I'm thinking of, what is going on here? And so Paul is asking me, he's never worked for, I've never worked for him. And he's out of the blue, he's asking me to do, do you want to do Madden 93? And I scratched my head, is like, yeah, yeah, "I'd love to do it, but I'm," the thing I didn't say is, you really think EA will trust me, who they don't know? And you who has no experience, you're gonna trust us to do this game, but I guess they did. And they didn't want the game to be changed in certain ways, they really wanted to, have it remain the same flavor, and there were a lot of things in it that they wanted the same. They wanted, basically they had features, there were a lot of graphic changes. They wanted crowd being visible when you kick the ball of the goalpost, which was the most difficult thing to do. I was finaling the game in EA in California in San Mateo. And a member of the production staff came into my little lab there and said, "Why are you working for Blue Sky? Why are you working for Paul Neurath?" And I said, oh, because he gave me the job, I don't know, I know I'm not a businessman, and he said, "Why don't you work for EA directly?" And so that's how it came to be. And, but I also felt bad, so I felt good they were giving me this hockey thing and I asked about it, I asked around, it wasn't, it was a great game, people said, but it really didn't sell that much, I don't know anything about that. But, and so I thought, oh, this is like a demotion, they're giving me, they're shuffling something off on me. I didn't have a studio, I didn't have anybody who worked for me, I was on my own. So Doug Wike was the artist who worked for Blue Sky and they assigned him to do Madden. And after EA approached me to do hockey, I sort of panicked and realized I don't have an artist, how am I gonna do? And I thought of hiring Blue Sky to do it, but I didn't think that was a smart move. So I went to Doug Wike. So EA stole me from Blue Sky and I stole Doug Wike from Blue Sky. When we had a kickoff meeting at EA for hockey. Once again, there was a big table, a lot of people around, the production staff, Jim Simmons was there, I believe. I think that's the last time I ever saw Jim Simmons. I don't think I had any contact with him whatsoever that I can remember anytime after that. So he just dumped the code on me and then I was left with a decision whether to take that code and really revamp it and tear out the AI and redo it. And I didn't think I would've time to finish. And also being nervous 'cause I thought I had been demoted from football, so I think, oh no, I can't finish late. So I thought I decided to use the code and just tear out sections. I think now looking back, it was a mistake and I should have just rewritten, but I didn't know that then. And over the course of the next several versions of hockey, I did tear out more and more. (whistle) (upbeat music) I didn't know anything about hockey and my experience with hockey was limited to rod hockey, which I loved as a kid. And that's what I knew about hockey. I didn't know anything about players, I didn't know anything about teams, I didn't know anything about rules, nothing. I relied on EA people to inform me. - [Narrator] What do you remember about the features that were sort of like required? Like when you were having those early meetings, what was the type of stuff that they wanted to have in '94? - Oh my God. They wanted goalie control, what wasn't there. That's pretty huge. What didn't they want? They wanted four player, four user mode, crowd special, crowd animations. They wanted one timers, good choice. They wanted flip passes, season mode, shootout mode and all kinds of visual changes, including, I think they wanted to redo all the players as well. There had to be new ones also, you couldn't really improve the graphics that much, but you had to make it consistent. And since we were doing new animations, we had to, for a lot of special moves, goalie one timers. So you had to make it consistent so you might as well redo them all. Oh, and they wanna reverse instant replay and that's not hard to implement. Except it really messed things up because one of the hardest parts of, I mean of this programming was hit detection for a number of reasons. The hit detection is loose goose anyway. And it wasn't tunable in the previous code. So I had to really tear that out and redo it. It had to look okay in the instant replay. And this is the problem, you get situations like, like in one timers, one of many examples, the puck would be passed over to the guy waiting to shoot and sometimes it would appear as if the reflection from his stick was happening 10 feet away from him. And it didn't look like that when you played the game. It was okay, but you're not getting every frame in the instant replay, so you're missing things. So the hit detection had to be really tight and careful in certain circumstances, but not too tight. It was really difficult, and basically what you did is, what I did is I drew a sphere, a mathematical sphere around the points I was interested in, where hit detection might take place. And that isn't just on the stick, it's also on different parts of the stick and maybe his feet and different other player's foot as well. And then see whether the puck goes into this sphere. But if the sphere's too small, the puck would actually go through it and you'd never notice it'd be on the other side. So it was really tricky stuff. And reverse instant replay made it worse 'cause you could see a different angle now. And so things that looked okay on the front angle didn't look so good on the back angle. Another thing, it's not perfect, but it was as good as, I think it was good as you could get at that point. So EA, the people there were pretty rabid hockey fans, a lot of them, they had become rabid hockey fans, and they were really interested in the individual players and the ratings were critical thing. I don't know, I don't know who Jeremy Roenick was on it. I wouldn't know him when I met him. But the problem is how do the numbers reflect themselves in players' behavior? Being on my own, I had to make decisions about how things should work and how they feel. And I would make those decisions, send them to EA and then they would feed back. But the people at EA couldn't have known and didn't know how to tune it. They didn't know what, like they say, well crank this number up one, well maybe cranking up one wouldn't do anything 'cause the resolution of the ratings isn't fine enough to make a difference and that's all on me. And so I'm busy tuning these numbers and figuring out what should it be like, not knowing what these players in real life are and then sending it to EA and they'll, they'll say, no, this guy is, he's not that good a shooter, or something, he's not that smart. - I didn't know all the players in the NHL that well to tell you the speed and all that, but you know what, it was important enough to me to get it right that I went and I hired a professional scout, Igor Kuperman to provide all the ratings for all the players and all the lines and all that. So that level of detail in an early video game, like the first one where you actually have the player names was just kind of crazy. It was a nice time at Electronic Arts because the producer really was a god and you could do your own licensing. and there was actually a pretty sophisticated system, I don't even know if you remember the sound meter. There was logic that was based on what would happen in an arena. And the home ice advantage increased as you got the crowd louder and louder. So I loved building in these real features where it wasn't just the thrills, it was actually, there was a strategic part of it and you were getting feedback like, what's the crowd meter out? Oh wow, if I can get that higher, like I have a better chance of scoring or my guys skate a little faster. I love going to that level of detail 'cause I just, I always had faith that real hockey fans are going to like figure this stuff out eventually and appreciate it. - There were two internal factors. One was the kind of player awareness and what, how I implemented and what I did with that. And then the other was a kind of game temperature thing, the crowd meter indicating the loudness of the crowd of sort of building tension. But internally that was represented as a temperature variable. And that variable, I spread all over the place trying to do what I did know about sports games and watching games that it's the build-up, the build-up, particularly true in baseball and football, but very much true in hockey too. And trying to use that temperature of the game. For example, well we had to pull fighting out, that's its story into itself, but if there had been a fight, okay, so if there was a board check, right? The people would get more excited and the temperature would go up a little. So all kinds of things. Or if there was a close shot, hit the goal post, then the temperature would go up and you could hear it and you could feel it and the players would move sometimes a little faster. Where there were awareness, I would just bump up overall awareness of all the players. They were like, they were, it was adrenaline, I should have called it that adrenaline, but I think, I don't remember the name I used for that variable, but awareness affected multiple things and a lot of it had to do with the aiming of shots for example and the aiming of passes. But also in pass reception it was, the calculation of where the puck is gonna be was slightly in effect altered so that he thought the puck was going, he was going to a spot that wasn't exactly right, and depending on the awareness, that kind of thing. Then there was also a general sensibility of how many players around you you were aware of. So there was a picture of big circle on the ice around a player and how big that circle was, which players he was aware of, like somebody passed to him, if they weren't in that circle, he was really, he would flub the pass up. And so that circle the size of that sort, the diameter that circle was very based on awareness. The larger the circle, the more aware. So there are a couple of things, a number of things going on with that. For a person who wasn't into hockey, for me, the build-up of tensions, if I could feel it, if I could really feel it viscerally, then I felt that that would make a fun game that would be good. And I tried to do it as much as possible, and EA helped with that too. Of course you are giving feedback what worked and what didn't work. But it was subtle because there were a lot of things, this is deep in the program, but I'm even altering the spheres that determine hit detection that I talked about before. And I'm altering those slightly because I want things either to become easier or more difficult. So everything this was scattered all through the program. If all the realistic things in the game, and that is because the players all get excited on a team or both teams or whatever and their adrenaline goes up and things happen and kind of in unison and you see that and fights break out more often and that's why I didn't want fights to be eliminated. Not the fact that we spent a lot of time with it trying to improve it and Doug did all the animations and we had to cut it out, that wasn't fun. But it was also the idea that that really added to the tension. It was a kind of perfect release for tension, you had this, I was worrying that things are going but instead of a goal or something, a fight broke out. Just like in real life. (slow music) - This is like the stuff of myth, right Mark 'cause there's the, people say like, you could, like, there's blood or you could like pull the jerseys over their heads or what did you actually change in '95 that we never got to see when it came to the fighting? - Yeah, we added a whole bunch of moves, I don't remember them all, but I mean pulling the jersey over the head was one kind of thing. I think there was some ground action too. I don't remember if it was some kind of wrestling or a headlock or so, I don't know. And there were the punches would alter, there was a, just a whole set of the kinds of things you don't like to see at, well maybe you do like to see, I don't like to see it at hockey games, but I also played around with the motion of them. So when you a player got hit, the way he reacted to that with not just falling down, but something else like bouncing off the other guy or that kind of thing. And there were several different kinds of punches, it was kind of a boxing element to it, but I don't really remember all the animations, it was a traumatic experience working on that and then tearing it out that it was, like I said, not fun. - Yeah, was that a very late-minute call? - As I remember. After we had done it, after we'd done all the work, - Right. - Yeah, we had some really cool fighting and, and injury stuff that we had in '94 that had to unfortunately come out because as we progressed and it got more popular, NHL wants to protect their sport and their brand, it made sense. I wish we still had some of those old ROMs around that we could put on an emulator or something like that just to do like a retro, but yeah, that stuff, long gone. The thing that was great about testing back in those days was like you basically got paid to break the game and tell them what you liked and what you disliked. I think the first game I ever worked on was like Tony La Russa Baseball or something like that on the Sega Genesis. As I started to get familiar with those teams and the people working on the sports games, you would get assigned something else. And I remember telling them, oh, in my interview, the reason that I wanted to go and work at Electronic Arts was because of the hockey game, right? Like me and my friends played it all the time, it was really just a culture of people that were into sports, into wanting to bring those fun things about sports into our games and have it feel like you were in control of what was happening in those arenas and play fields and stuff like that. So it really was just this really cool atmosphere of trying to break the game, trying to tell them what you liked and disliked. And it's still probably one of the best jobs I think I've had throughout my career. A team of assistant producers, associate producers, producers, testers that all sat in the same area, right? And we'd all be working on different things, but we would all take time out and we'd play NHL, right? Everybody played NHL. It was very competitive, very, you wanted your voice heard, you wanted to debate with people about what was working, what wasn't working. Even if you were working on something else, toward the end of the day or at lunch, you'd have time to put in on NHL. And I think it was really like, how do we improve upon, that first one? And then it was NHL '93 and there were always little tweaks. And I think like the best thing working with Mark is there would be a period of, all of us kind of compiling our notes and there was obviously a lead on each product, whether it was the Genesis or Super Nintendo back in those days. And they would compile it and they would really champion the best ideas. But everybody had kind of an input on what was working and what wasn't working. We'd go through a lot of the design changes, a lot of the, putting the base game together and then we would play the heck out of it, right? And we would just continually pound on it and see what was working, what wasn't working. And then there'd be a period of time that Mark would fly out from Maine. And that was always exciting, right? Like there'd be continual, hourly trips down to Mark and saying, oh, look at this thing that I, oh, and this is the thing that I want to do now and wouldn't it be cool if we did this? And Mark was always just a sponge for those ideas. He wanted more, he wanted to make it the best that it could be and continually sought our feedback for that. So it was a really cool time to actually, and back then, the teams were very small. So anytime that you got to spend with somebody, especially the lead programmer, it just felt like your feedback and your passion for it was having a direct impact on the game. - A good part of every day for sure was, was playing the latest version of the game 'cause we get a new version every day and then we'd hammer on that version. Different people would find different things. Our testers were very good and they were very professional. And so all of us played a lot every day. - This game was written the old-fashioned way, it was a big game loop and it wasn't object-oriented. Modern code is object-oriented, this would've been a perfect game to do in C++. The way it's organized is much, much cleaner for multiple player games like this. So it would've been easier, you send a message out and then each player responds. But instead, this was a game loop and each player had his little stack of states. So this is how the AI was organized. And so let's say he was in a state of, skating towards an object, he has to skate over there towards the puck, he's skating over there. But suddenly something happens, the puck gets hit by somebody and puck's way back and he has to change his state. And so there's a stack, and so you actually stack these states and then when one state is finished, it brings up the previous state, the old state. And so you have that to reference and that's the way it worked. It doesn't matter how many players there are so much as the kinds of things that were happening and how they interacted. For example, a one-timer, which was a coordination between two players and the puck. - One of the best features of NHL '94 was the addition of one-timers, that's when somebody passes you the puck and you instantly take a shot into the top of the net. And I'm gonna demonstrate that right now, I've never actually played hockey before. (groans) That wasn't meant to happen. (upbeat music) - One-timers were a mess, you would have it to where you would pass through and the animation guy would hold up a stick and he'd get stuck there, or you'd get the pass and it would go right through them. But it took a fair number of weeks to actually tune that and get that working in a way that it actually turned out really, really, I mean, I still think it's perfect, but like, it still feels like one of those satisfying things when you pass and you do a one-timer in NHL '94, you're just like, it has that feel, right? As a gamer, as a player, you're like, oh my God, they nailed it, that's one of the credits of Mark was that, we were so passionate about it and it wouldn't work and Mark always made something work for us, right? He would always figure it out. - You have to make sure that the players are in the right state at the right time. Before, in passing, you didn't know that, there was no, there wasn't really a pass reception thing. You shot the puck. If the puck came within some distance of the, of another player's stick, it would be grabbed by him or reflected depending on certain things. But in this case, you had to tell the receiver that, get ready, you're doing a one-timer. - He was able to figure out the math of it all. And Doug Wike, he played hockey, so he kind of knew the animations and he knew what we needed. And with his limited space that he had to actually make an animation, he was able to get us the right frames and we're able to kind of lock the player in for the one-timer, so, very tricky. But from a game play standpoint, I think it was like, oh wow, okay, this is kind of a bit of a game changer because now you've got a move that you can pull off, which it sped the game up. (slow music) - One, I just wanna talk about the process for a minute here with not only was I working in coding isolation, with nobody to really talk to about this code, but not only am I out in program isolation, I'm also remote, really remote. And eventually I'm in, well not then in '94, I was in Maine already working top of a barn and I was alone, I didn't have the internet really at that point. So everything was sent you'd send a disk to EA and they would get the disk and then several days later, they would give it to their testers and they would try it out. And several days later you got feedback, by then I had forgotten what I was wanted to get from them. I was working on other stuff, so very difficult. And so that process of feedback was really, really difficult. - These are teams of like, they were the only programmer on there and there might be one graphic artist and, and then I was playing multiple roles as a producer and designer and there might, some of the games there wasn't even really an assistant or associate producer. So it was a pretty small, small group of people working on these games. And as a result we were able to make a lot of changes at the last minute. And some of those ended up being really cool stuff. - I'm working in a barn, right? This is a two-hundred-year-old barn. And the first floor, you walk into the barn, there's hay on the floor and the beams are hand-held beams that have been chewed by animals. And you walk in and then I built a little sort of high-tech bubble in the loft and you climbed up the ladder to get up there and then suddenly, you were in the studio. And these guys are coming from, it's a high-paced California, freeways, high-tech. And it was always fun to watch that and watch how they came to this, and it was really a sort of a metaphor for the whole contrast between where I and how I worked and what they were into. There were, I think they were a little baffled by what was going on. Let me, I wanna mention something. There was a lot of questions about why Hockey '94 came out well, and since I programmed it, I also wondered, but one of the things was, there was sort of magic going on in Maine at that time. In 1993, Umaine is a few towns away from us, it's in Orono. And the Umaine Hockey team won for the first time, the NCA championship that year. And this was happening at the same time I was programming NHL '94, all happening within a few miles of each other. Maine had kind of forgot, I mean, hockey's big here, but it was, they were never very good at it. And there was something going on. I just thought it was really strange that why would this hockey game be produced here and why would the Umaine team be winning that particular year? And I don't think there was anything to do with each other, but maybe there was. (slow music) - Making games is hard, man. If you've watched enough of these no clips, you probably know that. So what's it like making a AAA annualized sports game in 2023? Does the shadow of NHL '94 cast that far? Or are there lessons that the contemporary team can take from that classic game? (slow music) - Definitely appreciate what those guys did back then, those small teams 'cause it's like, I remember as a kid playing those games and going like, you see the screen with like four or five names. You're like, is that it? Is that all the guys that have done this? You're like, oh yeah, it is, that's crazy. So like, kudos to those guys for what they did. And in some ways I'm a bit jealous 'cause it would've been awesome to work on like a, I've worked on small teams, those four or five person teams are, you get some really awesome chemistry. For us, I mean obviously we're orders of magnitude larger in this day and age than, than back then. We're divided into sort of major groups. So we'll have gameplay group, presentation group, we've got an art group, we've got online group, a game modes group. And each group will be built of different jobs depending on what's what's gonna be done, you typically have design across most of those, you have programmers or software engineers. And a lot of it nowadays is really making sure that each of the different groups are communicating. - Yeah, we're definitely a hundred plus across the board and I know that that flexes, that can go up and down just depending on where we are in the development cycle. - And then you obviously have the sort of EA support network outside of that as well, right? - Absolutely, with all the partner teams and everybody else that we end up interfacing with, it goes well above that. We were having discussions this morning about NHL '25, '26, '27, and we, we've been working on 25, a very small group for a number of months already. And one of the goals that Mike and I have is to buy back production times. And then we do have more time for a team to actually focus on the next version and iteration of the game. We're trying to buy back time, so then we can ultimately build a bigger and better game each and every year as our community has very high expectations year over year of what the game should have in it, what we should be investing in. And it's, it is, it's a challenge for us, we're a small team compared to the FCs, the Maddens and I'm sure many other titles out there. So we have to make difficult decisions each and every year when it comes to where we wanna prioritize our team, what we want them to focus on. And oftentimes, we do consult with our community. We wanna understand where the greatest needs are, what their wants are. - Does NHL '94, when you are ideating on the game and when you're thinking about the game, the game you're making is so much more larger and complex and is in a different era of NHL as well than existed in the nineties. But do you, is there any element of '94 that is sort of like in the background, be it like a pressure or be it a inspiration in some way for the ways in which you guys make the games today? - I would say so, I mean, I know there's some fairly, active communities out there that are still playing, modding, running eSport competitions with '94. So I think, I look at all that stuff very actively just as part of my job. And if anything, you try to take that and go, what is it about that game that's holding people still today? And we talk a lot about, we're trying to make pushes to find a middle ground between retaining the depth that the game has now, but also looking back at accessibility, games have become very complex over time. Putting a Sega Genesis controller in somebody's hands was hard back then if they never played games. Putting a PlayStation 5 controller in somebody's hands today that's never played games is, the reaction is like, no, no, I don't want to be embarrassed. So I think for me, the one thing I try to think about is '94 was, it was accessible, the reason we could get people into it, the reason why people play today that aren't even hockey fans necessarily is because it was just easy to pick up and play and fun. And so that in itself is something, it seems that, like, it's obvious, I think you can easily lose sight of that when you're making games and get too fixated on too much simulation, too much authenticity, too much complexity. And I will say like '94, it played like hockey, right? For what it was, smaller rink, bigger players, but it had good hockey flow, net scrambles, chaos in the crease. So there's a lot of that stuff that is just the true to the sport nature of the game is also something I think you wanna respect and bring forward with you as we work on this series. - The first Madden, I don't think it had a Nintendo version or a super Nintendo version, but then from that time on, we started to build out Super Nintendo versions and initially, they were ports of our Genesis version. So I would always do the initial design for the Genesis and then convert it just 'cause for the most part, you could do more stuff on a Genesis back at that time, people hadn't figured out the Super Nintendo and the CD version was almost like an afterthought. It's like, okay, we can add video, but it was hard to make the video have an impact on gameplay, and so we kind of went through a period when the first PlayStation came out and Xbox where, all of a sudden the graphics, are way better, but the gameplay isn't necessarily better. So it's sort of like, okay, the gameplay almost is taking a step back and yeah, it looks great, but if you're into playing the game, it's clunkier, it's not quite, quite fitting. I told you there, it's really subtle to get the tuning right. I mean it can be wrong, wrong, wrong, and then you get it right and you say, okay, lock that in. And I think gameplay for the most part took a step back until it finally started to catch up later on. - I worked on NHL '94, '95, '96, '97 So, and the thing that was always interesting was trying to improve upon the look, right? Like the player angle, like you could see it, the camera starting to, the angle of it starting to shift up or shift down. And it's funny 'cause once you start to introduce those little tweaks, just a little bit of camera angle or the skating animation, some of the feel starts to go away. I think we did a really good job on trying to deliver something new, but it's still like after all these years, like if I go back and I say the one that I want to play is, is still NHL '94. I think it's one of those magical, come together universal things, right? The timing, the atmosphere, what was going on in the world, people's daily lives and being able to remember back, right? Like, I still think about it with my buddies in college when I didn't work at EA of like, oh my God, the fun that we had and that feeling that we captured, just a magical time to capture that feeling. And then being able to, get hired by EA and work on the product that, not only being a hockey fan but being in that atmosphere of people that were just having fun. And you can almost, you could still feel it, you know what I mean? So there's this untangible thing of saying, we captured the feeling at the right time, we all had a stake in it and it was something that you wanted to put time in, you wanted to put overtime into, and you wanted to actually have this be the best possible experience, not only for the people we were making it for, but each of us that we worked with and competed against. - Why do you think it is though that, like, whenever we talk about NHL of that era, it tends to be '94 that gets brought up? I have my own sort of idea of this, but I'm interested in why you think you keep getting called up about '94 in particular. - Because it was Maine magic that year. It was done in Maine and no, I think that the leap between '93 and '94 was probably so much greater than the leap elsewhere in part. And the other thing is there was a, a certain spirit about doing it, and I'm not sure why it was there that never really reproduced itself and it had to do with the spirit of the team. And I don't know why exactly what that was, but it was just something, something really clicked. And I will say that probably a lot has credit, the people that don't get any credit are testers, but I really think their feedback a lot of times is, is really critical. And it just, some combination of people had a big effect. The number of changes, that fact you're going from a kind of toy like game to a much more realistic game in a sense. (upbeat music) - NHL '94 is one of the best sports games ever made, a near perfect one timer that sounded the horn and made the crowd go wild. But it's also a byproduct of its era, a time in which you could make fundamental gameplay changes and then test them out in just a matter of hours. And who doesn't wanna be a sports hero in a video game? Especially when the real sport requires you to ice skate and use this huge stick and try and score that, ah, screw this, I'm gonna go play my Mega Drive instead. - Every designer and producer kind of has their own way of making the game and what they think are important. I left EA after the '94 game to join Mark Lesser, and we did the development of '95 together. And then I was out like, EA kind of just took it their own direction and people decided to like change the speed of the game and the balance. And we'd spend a lot of time tuning the game in the '94 version, I think in general at that time, it was taking about three versions, three years to get to the real implementation. So Madden was the same thing where, until Madden '93, we didn't really get everything in. So we knew there's stuff that we wanted in there that just, we didn't have time to get it in this year's version, we'll get it in next year's version. After like the third version, then we finally got around to, things like adding season play and stuff like that. But the early versions, the first couple versions of Madden or of NHL, definitely had some weaknesses. It is a little bit of rocket science and to have a guy like Mark Lesser who has a degree from MIT, that's pretty helpful in those situations 'cause there are a lot of elements where it is like rocket science. - And also the fact, the tuning of it, I mean, it has a certain feel to it that is very hard to define because it was a lot of different things. But it was in there and it was the first time people experienced that. In later versions, since I was doing them. A lot of that stuff was in there, but it wasn't new anymore. So I'm not sure, but that's, I still think it was the Maine magic that did it. (slow music) - It is fun though, that's a lot of fun. The stick part is similar to hurling, the Irish sport. I'm gonna take, I'm gonna try and take one of those fucking empty net fucking goalie shots. Fucking last five seconds of the game. (hits puck) Oh, fuck. Too much air. (Danny harmonizing) I'll take some, I'll hit some pucks at you. - [Trainer] Yeah, that works. (Danny hits pucks) - Wrist shot. That's it.
