transcript: So, one day at lunch, this is the the first time I'd done this, I thought, "Oh, maybe I'll go back to the computer lab uh and see who's around." And when I got there, the the lab manager had told me, "I uh you know, one of our professors uh got ill and like class was starting in a day or two. And this lab manager friend told me, 'They're going to make me teach the course for him. You know, they're desperate, basically.' And he said, 'Mark, would you would you please do it cuz I I definitely don't want to do it.'" >> Called the great Mark >> I can't do it. I'm I was a student here like a year ago." But then I went home and I thought about it and I thought, "Uh might look good on a resume to say I, you know, I taught a course one time." So, I forced myself to do it and it actually went great. I I know this term wasn't used back then, but fake it till you make it. I I definitely decided I'm going to fake it. I'm going to pretend I know what I'm doing and the students, they couldn't tell. They just assumed I knew what I was doing.
