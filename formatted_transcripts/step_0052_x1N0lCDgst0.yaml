transcript: Have you ever looked at an electric vehicle and thought, "Why does it look like a refrigerator? Can it just look normal and cost $30,000 less?" Better yet, have you ever looked at an old car and thought, "Man, if we could shove a bunch of newer technology into this old relic, that'd be really cool." Me too. This is an all-electric 1980s pickup truck. A year ago, I bought this 1982 Toyota pickup. This thing is 44-years old. Back then, these were manufactured with practicality and cost in mind, and you can definitely tell. But, this isn't your average old pickup. Its powertrain is all-electric. So, in this video, I'm going to show you how I took this old pickup truck that I bought with a blown motor and converted it into an all-electric commuter with mostly recycled parts. Let's get into it. We'll start with a quick overview of the base of the conversion. As I mentioned, it's a 1982 Toyota pickup, and that is literally the model name on the title. It's a regular cab, long bed, two-wheel drive, and best of all, it's a five-speed manual. And it stayed that way. I bought this truck with a clean title and a blown motor, and sadly, the 22R had a rod cap go bye-bye. The truck has some rust in the bed, but the cabin and frame are pretty clean, and I was determined to keep this old truck on the road. So, the first order of business was to remove the old engine and the gas tank. That's pretty easy, just disconnect some hoses, undo some bolts, edit out about 7 hours of labor, and we have an empty engine bay. Now, how are we going to power this thing? In comes this big DC electric motor that I got off of Craigslist. This is a NetGain Warp 9 DC motor. It's about 140 lbs, has two output shafts, and is rated for 144 volts at 1,000 amps, or 144 kW of peak power. If I was to do this again, I would probably use a Leaf drive unit or some other AC propulsion, but this is what I could find cheaply and locally at this time. But, wait a minute. This thing just has a mangled spinny thing on the front end of it. How's it going to drive the wheels of the truck? I decided that it would be best to leave the manual transmission in place. Yes, this electric truck still has a manual transmission. And honestly, that might be my favorite part of the whole build. I did this for two reasons. For one, because I think it's cool. And two, because I can retain the mechanical advantage of having gears. And I don't need to do any fancy switching with contactors to get into reverse. I can just shift the transmission into reverse. So, I decided I'd take the clutch out, drill out the rivets, and bolt it to said mangled spinny thing. Now, it just slides onto the transmission, and the motor and the transmission rotate together. It's secured to the transmission using an aluminum adapter plate that I bolted to the motor and the bell housing. For the front mounts, I basically used a bunch of scrap steel angle and welded it in such a way that it bolts up to the stock engine mount. It doesn't look pretty, but it's actually plenty strong. Now that that's done, we're going to dive into some of the more complicated stuff, but in the interest of keeping this brief and simple, I won't go too deep into the details. I'd be happy to make a more detailed video on each of these parts if people are interested. So, let me know in the comments. First, much like modern gas engines, electric motors need computers to be able to run them properly. For gas engines, these are called ECUs or engine control units. For electric motors, these are simply called motor controllers. In this instance, my motor controller is just a device that takes input from me, such as the push of the throttle, and pulls power from the battery pack, and sends it to the motor accordingly. It is essentially the middleman between your battery pack and your motor. There are plenty of options for controllers, but I found a good deal on what is widely believed to be the holy grail of DC controllers. Not that that means much in 2026. The Zilla 1K. This was another Craigslist find, so I honestly wasn't even sure if this controller worked, but it seems to be doing great so far. The The needs to be protected from water, so I found this gasketed electrical enclosure on Facebook and decided that's where all of my controller circuits and chargers would go. It's mounted in the bed so that all the wires can stub through for the necessary connections. I mentioned earlier that the controller receives input from the driver and this occurs in a few different forms. First, I wired it in such a way that when the key is not on, the car won't move. Pretty smart. I did this by wiring one of the spare ignition fuses to the key switch input on the controller. For my throttle input, I chose to use a throttle pedal from a 2009 Toyota Prius. Naturally, it took a bit of custom fabrication to get it to fit right, but I was able to make it work. This pedal is safe and redundant and I wired it directly into the controller. You got to love an '80s pickup with drive-by-wire. And of course, aside from the 12-V signal connections, the controller also has high-power connections to the motor and the high-voltage battery pack. The high-power connections to the controller are fused and the connection to the battery also has a main contactor, which is kind of like a big switch. [clears throat] That main contactor is what allows me to turn the vehicle on and off using the original key. And that brings us to our last big piece of the puzzle. Of course, no electric vehicle is complete without a high-voltage battery pack, otherwise known as the traction pack. Much like the motor and controller setup, there are many, many ways you can build a traction pack. In my case, I chose to use battery modules from an old Tesla Model S. This is a common choice for conversions because they generally have the best energy density around. I only use part of the original Tesla pack, which you can do because the batteries are built from a dozen or so identical modules, depending on the size of the battery in the Tesla. Personally, I used five wired in series to give me a 120-V pack. The pack weighs about 250 pounds and is just over 26 kilowatt hours in capacity. For obvious reasons, I've never completely drained the pack, but based on similar setups, I estimate around 75 to 85 miles of range. If you're like me and you have everything you need within a couple miles of your house, that should be plenty. This beautiful battery enclosure is from EV West and it's secured to some steel angle that I welded to the frame underneath the bed. Don't worry, it has almost 10 inches of ground clearance and sits about 2 inches above the rear diff. One very important thing about electric vehicle batteries is that they need to be continuously monitored with automated fail-safes in place. This is done using a battery management system or BMS for short. The most common ones for custom applications are Thunderstruck Motors or Orion BMS. I chose Thunderstruck for their cost effectiveness and good customer support. The BMS is housed within the battery pack and it continuously monitors the temperature and cell voltages of all the batteries in the pack. It shuts everything down if any readings are out of a specified range. The last thing I had to do was figure out a way to charge it and since all of the accessories still run off the 12-volt battery, I need a way to charge both a 12-volt battery and the traction pack. Let's start with the traction pack. My high voltage charger is from Thunderstruck Motors and it is controlled by the battery management system that I mentioned earlier. This device takes 120 volt or 240 volt power in and sends out about 126 volts to the traction pack. I thought it would be cool to put my charging port where the gas cap was as a little Easter egg. These prongs are not hot, but once you plug the vehicle in, it will automatically start charging. Charging for the 12-volt battery is pretty simple. Since the traction pack is so large, I can pull power from that to top off my 12-volt battery as needed. I did this using a step-down DC-to-DC converter. This one is from, you guessed it, Thunderstruck Motors. Anytime the truck is on, it takes 120 volts DC from the traction pack and sends about 13 and 1/2 volts to the 12-volt battery to keep it charged. And that covers most of the big ticket items in an electric vehicle retrofit, but there's one more thing I'd like to show you guys, and that is the first time that I took it out for a drive, which I had my girlfriend film against her will. At this point, I had spent months of wiring and troubleshooting trying to get this thing working, and I got to say the payoff when those wheels spun for the first time was pretty great. I was babying it pretty good with it being the first time on the road and everything, but hopefully you enjoy the following footage which we captured just a few weeks ago. Gabby, would you like to do the honors? >> Yeah, I'm going to try my best. >> All right. Room for Gabby? >> [laughter] >> You want to jump in? >> Yeah. >> The low-speed control is way better with the Zilla controller. With the Curtis controller, it would it would jerk around when you if you try to go 1 or 2 mph. Okay. Pretty smooth. We're in first gear. Just barely giving it some throttle. It has a good response. The Prius throttle works well in this, it seems pretty smooth. Don't mind me, nothing to see here, folks. Just uh normal car. Here we go, to the here. And I'm going to start from second gear. Nice. It's driving pretty good. What do you think? >> Yeah, it's very smooth. >> I haven't gone much over 25 yet. Uh but I'm not I'm not hearing any funny noises or anything, which is good. I'm pretty happy with this. >> Yeah. >> Power steering is such an amazing thing. And you don't realize it until you drive without power steering. And it's a total pain in the butt. But that went well, I think. What do you think? >> I think so, too. >> Nice. Wow, what an awful park job. >> You want me to make you a light truck? >> Yeah. Yeah. It's a lot of work. >> I'm wondering what you've been doing in there for the month. >> Yeah.
