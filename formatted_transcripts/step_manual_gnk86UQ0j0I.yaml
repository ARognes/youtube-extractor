transcript: '{"content":"\n[0.08s] Why do some software companies build exciting products customers can''t wait to buy,\n[5.58s] and people love working there, they can be really creative -\n[9.24s] while other software companies build BORING products customers could care less about,\n[15.26s] and people feel like it''s a pressure cooker to work there?\n[18.62s] We''re going to talk about why if your company is being led by control freaks,\n[24.02s] You might really hate your job, and your company can''t really profit - right now.\n[36.72s] If you''re building software at your company, and you''re using agile methods of any sort -\n[41.42s] scrum, kanban, maybe some other method that''s closely related to it,\n[45.86s] you''ve probably used a backlog at some point. This is really just a list of ideas,\n[50.94s] for what the customer might want, that the software team then goes and builds.\n[56.24s] An important thing to talk about is when are features identified.\n[60.48s] Many companies focus a lot on the features that are identified before they''re built.\n[66.74s] So, at your company you might do some usability studies, or customer interviews,\n[72.12s] or ask people what they like about the prior version of the product.\n[75.76s] And then the software team has to build user stories, or acceptance criteria\n[80.84s] or requirements to describe \"what is that feature going to do?\"\n[83.98s] And that''s put into the backlog and the software development team then starts building it.\n[89.2s] But often the leadership at your company doesn''t really think about -\n[92.9s] \"What''s going to happen when we release our software, our ideas that we think that they want\"\n[98.34s] \"maybe those customers have even told us that they want,\"\n[100.86s] \"What''s going to happen when we release that, and we find out there''s NEW things that they want?\"\n[106.42s] When ideas that we put into our software products are identified has a big impact on how much money the company you work for is going to make,\n[115.44s] and thus, how much you''re going to get rewarded, and the company''s going to grow.\n[120.14s] And many companies focus on the blue bar in this chart, they just want to know,\n[125.24s] and they want to invest in everything they can think of up front.\n[128.82s] So they already may have a list like in this case of 150 ideas,\n[134.04s] for what we think, and our customers have told us, are valuable for the product.\n[139.28s] But there''s a hidden, additional set of features people don''t think about as much,\n[144.1s] which are features and ideas that don''t come out until customers start using the product.\n[151.06s] And that''s what this red bar represents.\n[153.16s] And there may only be a small number of these features or ideas, in this case as an example, 25 new features.\n[159.86s] But the important point of this chart is just to show you that,\n[163.38s] when you release a software product to your customer,\n[166.52s] There is undiscovered work, or new things that NOBODY can predict, they''re not going to come about,\n[173.32s] until customers begin USING your product,\n[176.36s] And those can actually be the MOST profitable, and they can make WAY more money\n[182.38s] Than a big list of ideas that everybody thought of AHEAD of time!\n[186.96s] Another way of looking at the prior chart, is \"what is the VALUE of the features that are released?\"\n[192.98s] In this example, those 150 features that the company thought up\n[197.4s] AHEAD of time based on talking to their customers,\n[200.68s] and doing research, and surveying maybe what the programmers and\n[204.84s] everybody else in the company thinks customers want -\n[207.68s] maybe only produced, $150,000 in this example of value for the company as far as revenue.\n[215.54s] But there may be those additional features, those ones that are undiscovered\n[219.98s] that are really the ones that are most VALUABLE to your customer, and that''s what''s represented by the second bar.\n[227.54s] So that small list of features in the prior chart that was only 25 features,\n[233.32s] a lot of people tend to think on their software project,\n[236.68s] \"We don''t need to budget really for changing the product too much,\"\n[240.34s] \"We know what our customers want, we''re going to build the product that WE KNOW they''ll love,\"\n[245.4s] \"and then when we release it to them, we''ll have a little bit of money left over to change the product.\"\n[250.26s] But in my experience, and if you look at many successful software companies out there,\n[254.68s] who have been able to truly be agile,\n[256.92s] it''s really these undiscovered features that customers tell you about once they''ve used  your product\n[262.48s] that cause the most revenue and profit to happen.\n[266.0s] And in this example I''m showing,\n[267.88s] there could potentially be a half million dollar amount of money in revenue that comes into the company\n[274.22s] just based on some of those 25 features.\n[277.8s] So the question becomes:\n[279.64s] If you''re working at a company, how can we structure the company, and how can we make it working on your software project like,\n[287.68s] to make it a better chance that the company actually puts EFFORT\n[292.14s] into releasing things that make a ton of money,\n[295.76s] if they can''t PLAN for them?\n[297.86s] Well the easiest way I''ve described this to people in the past is,\n[301.26s] to ask this question:\n[303.04s] When you work at your software company, does it feel more like you work at a factory, or a college?\n[310.24s] Does it feel like you work somewhere,\n[312.34s] where everything''s predicted \"up front\"and  all the focus is on OUTPUT?\n[317.56s] Or does it feel like you work somewhere where people can be CREATIVE and discover and LEARN things?\n[324.16s] If you''re going to work at a company that''s going to make a lot of money off their products,\n[328.76s] and the people who work there aren''t going to just get burned out after a couple of years and LEAVE,\n[334.02s] You need to have a situation, and a culture, and a set of processes in place at your company,\n[339.52s] that feels more like a college.\n[342.08s] Now if you work at a company,\n[343.88s] that''s structured more focused on output like a factory,\n[348.06s] everything''s going to be focused on PREDICTING value. Basically,\n[352.54s] Doing a whole bunch of math,\n[354.38s] and building a whole bunch of data and charts and a bunch of validation to help everybody FEEL SATISFIED\n[361.7s] that they''re going to build things that are going to make a CERTAIN amount of money, and that''s going to be the focus.\n[367.36s] If instead you''re at a company though that''s focused more on learning,\n[371.44s] It''s going to be more about DISCOVERING value.\n[374.225s] The way that software development''s done\n[376.265s] is going to basically assume:\n[378.04s] We can''t predict everything! We have to DISCOVER things all the time and be ready to CHANGE.\n[384.74s] Also a company that''s focused on output is going to be CONTROLLING people a lot.\n[390.9s] Putting boxes around what people can do.\n[393.58s] Measuring how many hours they''re working.\n[396.02s] Forcing them to control the way they go about software development to\n[399.955s] try to make it as predictable and UNIFORM as possible,\n[403.045s] because everything''s focused on output, and predicting the future.\n[407.36s] On the flip side, a company that''s willing to learn and discover potentially\n[412.34s] REALLY profitable new ideas that they just can''t come up with themselves,\n[417.36s] is going to be more focused on TRUSTING people, they''re going to empower people to be flexible,\n[423.02s] and make decisions ON THE FLY,\n[425.52s] based on FEEDBACK and information that''s coming into the company that''s changing all the time,\n[431.72s] so that they can IMMEDIATELY respond to things that the customers tell them they want,\n[436.02s] that''s totally DIFFERENT than what the plans are!\n[438.98s] A company that''s focused on output, that''s like a factory,\n[442.96s] is going to focus a lot on the \"burn-down\" chart.\n[446.02s] This is a tool that comes from scrum, and some methods of agile development,\n[450.22s] that helps managers be able to determine:\n[453.24s] \"Are my software developers completing planned work as quickly as they can?\"\n[458.78s] Well if you''re at a company that isn''t focused on planned work, that''s focused on building THE RIGHT THING,\n[465.76s] then measuring how fast people can build planned work\n[469.46s] is actually a BAD thing!\n[471.56s] Instead you want to be measuring: \"What are we LEARNING about the customer?\"\n[476.22s] Every time we release something new to our customer,\n[479.3s] are we actually learning that we''re maybe WRONG in our assumptions on what they want?\"\n[484.115s] \"Are we learning that we''re right? Are we learning that - \"\n[487.145s] \"there''s whole new maybe UNTAPPED aspects of our market or our product that we''ve never even THOUGHT about?\"\n[493.0s] And are we actually taking that into account?\n[495.74s] So if you''re working at a company that could either be,\n[498.76s] an output or factory type of environment,\n[501.64s] or a learning or college type of environment,\n[504.62s] How productivity is MEASURED can have a huge impact\n[508.3s] on how successful, and how profitable, those products are.\n[512.18s] If you''re at a company that''s focused on predicting the future, and output,\n[516.14s] they''re going to do a lot of work to budget the PROJECT.\n[519.68s] to figure out: \"When we spend money,\"\n[521.96s] \"is it the same amount of money that we PREDICTED it was going to cost to build this product?\"\n[526.9s] But a company that''s focused more on learning, they''re more like a college,\n[530.56s] they''re going to just set a MONTHLY budget,\n[533.2s] and use that money every month,\n[535.7s] to do WHATEVER it takes to build the products that are going to be most profitable,\n[540.36s] without being controlling, and uptight about whether the amount of work being done met the plan because:\n[547.54s] We DON''T want to build software to plan if we want to adapt and change and DISCOVER new valuable ideas.\n[555.64s] A company that''s setup like a factory, and they''re focused on output,\n[559.74s] is going to be heavily weighed on tracking EXPENSES.\n[563.38s] There''s going to be a lot of estimation done,\n[565.52s] there''s going to be a lot of cost cutting procedures,\n[567.665s] and everybody''s going to focus a lot on:\n[569.7s] \"How much is this COSTING us?\"\n[571.76s] \"Can we make it cost LESS to INNOVATE?\"\n[574.82s] That''s a horrible mindset, and if you want to build a product that''s really going to cause\n[579.68s] astronomical GROWTH in your market and really\n[583.02s] build something and deliver something that your customers\n[585.88s] SHARE with other people and are EXCITED about\n[588.88s] and you don''t have to CONVINCE them is valuable, they''re SOLD on it -\n[592.52s] then the company needs to be focused on tracking PROFITS,\n[595.82s] NOT expenses!\n[597.56s] Every time we do work, don''t look at how much it''s COSTING us to build the software as a sign of SUCCESS,\n[604.06s] if it''s costing us less we feel like \"job well done!\"\n[607.5s] We need to look at how much NEW MONEY is the project causing???\n[611.86s] Is the work we''re doing to invest in our new software development causing us to LEARN NEW THINGS,\n[616.86s] and then causing it to PROFIT!\n[619.04s] You can work on a software project that meets its budget,\n[622.8s] that comes in even UNDER budget and deadline,\n[625.66s] but it causes the company NOT to profit,\n[628.545s] because your customers DON''T CARE about it!\n[631.8s] So are you working at a company that''s more like a factory?\n[635.22s] Or a college?\n[636.64s] Would you rather work somewhere where everything''s predictable, and constrained, and controlled?\n[642.8s] Or somewhere where people can be more creative,\n[645.64s] And they can really come up with and DISCOVER NEW ideas so everybody makes a lot more money and can have more fun?\n[652.54s] Leave me some comments below!\n[654.26s] If you''re new to my YouTube channel, please subscribe and hit the \"bell\" icon\n[658.36s] you''ll be notified when I release new videos,\n[660.76s] and you can also listen to this as a podcast on\n[663.36s] Stitcher, Google Play, Soundcloud, or iTunes.\n[667.44s] So until next time, thanks!"}'
