transcript: (graphics clacking) (solemn music) - Like, one of the main things that "Disco Elysium" talks about is that some defeats are unrecouperable, that there is permanent damage that you can't go on from. And while people really, and I admire this about them, they really wanna make, there's an expression, Estonian expression, which is (speaking in Estonian), bread out of shit. They wanna turn something, you know, unsavory into something that can be used. Harry's story is not really about getting over anything, it's about accepting that some things will never get better and learning to live with those things. (solemn music) - [Danny] Hello, and welcome to the final episode in our series on the development of "Disco Elysium." Once the original version of "Disco" was released, there was no parade. As we discussed in the previous episode, a large number of the original team, including all of the original engineers, several writers, producers and more, had been let go by ZA/UM leadership. By now the studio was largely based in London, and in the weeks and months that followed "Disco's" release, and the groundswell of sales, awards and recognition of the studio and it's story, the studio was finally in a more stable financial situation, and so they quickly got to work on a new version of "Disco Elysium" called "Final Cut." This would add full voice acting to the game, four new political side quests, and a wide array of bug fixes and quality of life updates. It would also see the series make its debut on consoles. But for the people who had been working on "Disco" from the start, there was no respite. While everybody who had worked on "Disco" had crunched, many of the team, including Robert, Argo and Helen, had been struggling with the workload for years for a variety of reasons. This delta in energy and enthusiasm would be a crowbar in the already emerging splits within the team. And it didn't help when a global pandemic landed on everyone's front door. (solemn music) (grim music) - After this period, things really changed. Pandemic happened, and people weren't, literally, like, meeting up. This is, like, kind of where, I think, things started going really south, and relationships started going really south. I don't know, I've been thinking about it now for years. What has it been, four years? Trying to kind of wrack my brain what exactly happened. I think it was the pressure of the pandemic, along with the fact that a lot of people who had stayed, they were very tired, and then we had some new people coming in, and some people returning, Justin and Kaspar. Justin Keenan and Kaspar Tamsalu, they had left to do their own projects at some point. And now they had, you know, rejoined and had a lot more energy than maybe me or Argo who had been, like, working through the entire thing. Culture started changing as well, of course. I think part of it is natural and expected. You know, we were now a different company, a company that had released something. So a lot of it was just like very, seemed normal in the beginning, like, yes, we're gonna have to, like, you know, grow up, you know, be a lot more, like, structured. All of it seemed really good. - Regarding how things went, I cannot imagine how they could have gone much worse. I just simply cannot. Like, even in my worst nightmares, I could never have cooked up, like, this kind of story. It's like, you know, there's a... You know, I'm a millennial, so I'm gonna, like, resort to a "South Park" reference here. There's a "South Park" story where they, like, build this underdog team of, like, little preschoolers who go against the biggest, baddest ice hockey players, is this "South Park" episode. And it ends with the underdog team of little preschoolers absolutely annihilated by the grownup men because, I mean, what do you think is gonna happen? And it turns out to be their story, actually, and then they get all the money and their endings for their, like, personal psychological narratives with their fathers or whatever. And these underdogs just get pulverized. So I feel it's a little bit like that. It's like this, like, absurdly negative and they go almost like comically negative ending or like, then the commies got pounded to smithereens again. - It was interesting because I thought that, okay, this is actually where it's going to get easy. Like, you know, we can lay back, you know, we can just enjoy fruits of everything that we have achieved. And it was the opposite, where this is where I finally realized that I had really burned out when, you know, I left the company. Took me, like, years to recover before I was able to start working again. I had, like, really strong questions of like, "Do I even wanna work in video games?" - I did always have the idea, and then all of us did, that we're gonna get to tell the whole story of the return basically. The little work that I got to do on "Disco Elysium 2" was just basically taking all of these old dreams waiting to be realized, and kind of structuring them into some kind of size, content size, that's achievable by human beings. Yeah. - [Danny] Are those dreams you keep close to your chest? Do you think that they kept going with that initial work or do you think they- - They gave up on it, I think, about four months into it. They're not doable, like, it's not something that, you know, they're barely doable if the whole gang is together and in a good company and under, like, normal circumstances. Yeah, I don't think that's ever gonna see the light of day unless everyone just makes up and becomes friends again. (solemn music) - [Danny] In this new era of ZA/UM, Helen had been promoted into a leadership role, while Robert's influence on the writing had been given more guard rails. This wasn't without good reason. While the first "Disco Elysium" had been written over years and Robert, by his own admission, had been hands-on with as much of it as possible, taking on too much work and, as we discussed in the previous episodes, becoming a production bottleneck for other areas of the game. This was going to be a much bigger problem with a large studio attempting to make a sequel in a reasonable amount of time. Justin Keenan, who had contributed a lot of important writing and editing work on the project, had come back to ZA/UM and was later installed as Robert's right-hand man or handler, depending on how you look at it, responsible for many of the elements of production and the management that had become issues with Robert during the initial games development. Robert, Helen and Rostov took a period of extended leave to decompress after years of burnout. But for some of the people working on "The Final Cut," the lack of input from these three during the project became deeply problematic. It was seen by some as Robert and his inner circle taking extended time away to enjoy themselves while the rest of the team toiled on the new version of the game. This ongoing tension only increased when work on "Disco 2" started, a game that would have to be written from scratch, with new characters, new locations, quests, side quests, and skills. Unlike in films where scripts are written, re-written, and converted into screenplays before the busy and expensive rest of production kicks in, in narrative games development you have a studio full of people who are downstream from this writing waiting for direction, or having to change elements of the game down the road as the narrative changes. And in either case, burning money every month. It was this schism within the team that would ultimately lead to its downfall. Either because of a genuine existential threat to the game's development, or as a convenient smokescreen for other nefarious actions being taken by studio leadership at that time. All of this came to a head in late 2020 when Robert, Rostov and Helen were fired from ZA/UM. The justifications for these firings are part of ongoing legal battles. In the years since, ZA/UM has alleged that these three took too much time away from the studio, were engaged in bullying behavior, and that Robert attempted to steal the source code of the game. While Rostov and Robert allege that ZA/UM leadership, namely Ilmar Kompas, had engaged in an illegal takeover of the studios shares using the studios own funds, and had worked to push them out. - [Evrart] Mr. Du Bois, I hear the meeting with Titus was a glowing success. Now, what can Evrart Claire do for you today? [Danny] When this news broke it  immediately created turmoil within the Disco Elysium fan community. A living nightmare for  those celebrating a game that laid bair the power  and machination of capital. Because what makes this all so tragic for fans of the series is that at some point during the development of "Disco Elysium," Robert, despite protestations from some of his friends, allegedly signed paperwork that handed the Elysium IP over to ZA/UM. The details of this are complicated and covered in great detail by People Make Games. But currently, the rights to a now unlikely "Disco Elysium" sequel lie across a number of shareholders and companies, with Robert and Rostov ultimately owning around 21% of it each. In any case, Robert has denied such knowledge of the creation of this IP holding company, and signing any of the documents. What this means is that the only people who can make a game set in the world of Elysium, the world that Robert and his friends created as young adults, rests at ZA/UM, a studio that in firing Robert, Rostov and Helen regardless of the motivation, has burned the mountain of goodwill the game garnered the studio when Disco was born into the world. At that moment an untreatable wound between the fans and the studio was created, and ever since then it’s  continued to fester. Many fans rallied behind  Robert, Helen and Rostov. With little power to influence  a perceived injustice, fans turned their anger  towards the studio. They critiqued the strategies  and motivations of ZAUM ownership. They became distrustful of the people still remaining at the studio. The story of Disco and ZAUM was now being told in the court of public opinion. When People Make Ga mes  released a video detailing the allegations against Robert, alongside a report into the alleged illegal activity on the part of ZAUM it kicked fan anger into overdrive. In the eyes of some it also conflated two distinct issues one of alleged workplace misconduct, and another story about alleged IP theft and crucially it would seem  to justify one for the other. These allegations are the basis of ongoing court cases But while fans around the world were distraught to hear about the firings, for those original members who had left the studio, and those who remained, the splitting of the soul of "Elysium" was a difficult pill to swallow. (solemn music) - You know, the rumors that I've heard later and stuff I've heard through people, like, I wasn't there, I wasn't present for any of the weird legal stuff and any of the accusations of, like, abuse or whatever, that have come out later, but at least, you know, when I started hearing stuff about them in news, items started coming out, at least I have to admit, like, one of my first reaction was like, "Okay, this mostly sounds believable." And, like, almost everything sounds believable, right? Even though I, like, wasn't present for anything, but it's like, "Okay, this kind of makes sense." It's like a worse version of the thing that I already started, like, noticing in 2018, right? This something had gone more intense and something had gone overboard. Like, looking back, there was some sort of a burnout thing happening as well. - It was difficult for different reasons, not because it wasn't seen by people because even after Robert and Rostov's departure, like, so many of the original team members were still in ZA/UM. So this kind of soul rejuvenating effect that working together with other creative people has, this was still there. - I stayed for a while after Robert and Rostov and Helen because there's a lot of good people in town and I had... So I was tech art lead, I had a little team that I had hired on my own, brilliant people, and I was really enjoying my little tech card bubble there. So I was trying to keep myself quite neutral about, like, the drama and stuff going on. So I don't have any facts about it, so I'm gonna just try to be undecided for a while. But the problem that comes with that is that you get paranoid about, like, everyone. That kind of ate me away for a long time, until I decided to leave the company. I'm not trying to figure out who's good or who's bad or who's right or who's wrong. So, instead of trying to figure out who's right and who's wrong, I kind of went back to the feeling of I wanna make games with my friends and who the friends really are because ... Yeah. There's a lot of good people [at ZAUM], and some of them are friends, and that's kind of what got me... what was the deciding factor in the end. (solemn music) - Well, it was the collapse of everything I had ever known the death of my art movement, loss of several important friends, realization that several people who you thought were your friends, that you were actually like a pig being led to slaughter. It's like suddenly you have to look back at, like, years of working together with these people and understand that you are in their eagle hawk sight, so that was very wonderful. I tried to seek psychological assistance through the NHS, the healthcare systems of the United Kingdom failed me. I don't know, there were a few wistful thoughts about walking into the Brighton sea, ocean and not stopping. Yeah, yeah, it was catastrophic. The first couple of years or, like, before it sort of went public, I felt, like, completely severed from it, just like cut off from it, externalized from it, like all of the work and the art, it's now, like, theirs. That is quite a shock for an artist to be disconnected from his, like, work and stuff 'cause all of this stuff, it's like an extension of myself. I'm this big fat creature that's constantly just injecting stuff into the world and all of this is my body, or, like, it's this weird sense that you have about it. It also, like, housed my paint, my brushstroke in it, so it felt like my sort of, what I considered, my main weapon of expression, the brushstroke, the thing that I had mastered over the years of making the game that's basically only about the brushstroke. And it really felt that, like, all of it was, like, in there and that, "What am I to do now? How can I paint?" Which is a little bit melodramatic and silly. Of course you can paint, but also a lot of it is still, like, in there. And I've been amputated, like, this entire... The greatest thing you have ever made, all of these are like tiny pictures, but Disco is like a massive thing, has been cut off from you. Aye-yai-yai, what is a poor artist to do? - I don't know what the answer to losing something like that is. I just don't know. I expected to be able to tell those stories for the rest of my life. And they're not these places and this montage that I see of these places, it's also not... It's more than just creativity or, like, a career or something. It's also just a way of thinking and like going to sleep, for example, I would come up with new names, and then I would look at different cities in my head, and I would add a couple of cities here, and I would, like, place a couple of aesthetics, and then I would think, "You know this place would be more, like, would have the white of lilies on it, and, like, the smell of lightning," and then I would move these things around and kind of reorganize reality, and it would become like a very, like, calming way of feeding my brain something nicer to think about than this place here. And the loss of that, just kind of, like, completely unrecoverable, I don't really know what to replace that with. I don't want to be too grand here, but, you know, go to Abraham and say that, sorry, you've lost your IP. You can't think about the ancient of days anymore, I hope you like thinking about grain and swords, you know? And, you know, of course, this is my view of it, that a work of art belongs to the audience, and then their opinion of it, just as much as mine, I'm just one guy. But for me, that was how I looked at it, how to live with defeat and continue going on. I don't have this register of this bittersweet... But then, you know, I think it's all a learning experience or something like that, as a Soviet person. There are just some dreams that forever fall away and they're not... It's not guaranteed that they come back. - Just think for a moment about this amorality, of the injustice of taking a world that someone has been finding solace and kind of peace of mind for, at this point, like 20 years, in Robert's case, to not only just take away the ability to financially benefit from it, but take away the ability to actually mentally visit it. Like, this is just wrong in a whole new level. Like, no matter how this IP war goes financially, like, it should absolutely end in a way where Robert can, again, dream in the world that he made. - Yeah, I think if there's something that I'm, like, really sad about, is kind of that there wasn't this culture of, like, mentioning those things before 'cause I think what surprised and hurt me and why I didn't know how to react a year ago was because a lot of it was a surprise to me. I thought that, you know, some people there, I was, like, meeting up as friends and everything seemed to be all right, but, like, clearly there was hurt and just for it to come out like that, I kind of wish that... I kind of, to this day, I keep wondering and wondering and wondering, like, what I could have done better to make sure that people could, like, you know, come and tell me or even mention it somewhere to someone else, things like that. - The great work has been interrupted. Like, this was simply the prequel, the game, this project, like, and the Elysium was going to be basically the life's work. I did not much imagine what else I would be doing, maybe painting with oils or something, but even then I would have tried to link everything into this Elysium to build this mega massive art effort out of this, like, this giant work of art that is Elysium and then Disco would be a part of it. I don't know. I'm a robust person. I have the tool of philosophy to help me contextualize stuff into interesting and maybe perhaps even slightly romantic chapters of this life I intend to live so it doesn't feel so overwhelming. And you can externalize yourself a little bit and see yourself as a character in this story, and you understand fairly obviously that, ah, this is the interesting chapter, and now you need to, like, work on the following chapters. Looking at it now, in a way, I am weirdly thankful for it. Going through this crisis, it's like you really need to get your shit together and, I don't know, feels like it has made me into a greater and better man 'cause without adversity, without pain, how can one grow and become, you know, the Nietzschean Ubermensch that you are supposed to become. Adversity to overcome, what's not to love about it. And now I get to say I have enemies now. - And there was a period of time where I felt much more comfortable talking about the origins of us and of Disco Elysium in this gang and all of the people who were participating in and then contributing to the pen and paper sessions. Because when you talk about friends with whom you're still very close friends, you feel much more comfortable attributing thing and talking about these memories. So because that specific story is currently in a... That doesn't mean that it's end state, but it is in a state that is not good, then it is a little difficult or even painful to talk about the past or where we come from. And I don't even feel that I have, like, full possession of the past anymore, I don't feel like I'm a reliable narrator of the past. So that part of the interview where I talk about that, maybe it's good if it has a little caveat that I no longer feel that I am a reliable narrator of it because I have my own bitterness and pain now that, you know, might not be there in a couple of years or that I might get over. But I'm not currently in that place where I don't have any negative feelings about it. (solemn music) - [Danny} When we tell these stories, I like to stay out of the frame so that the developers themselves can tell us what happened as much as possible, but obviously as documentary filmmakers we ultimately have control over the narrative, and there are two things I want to give context to at this point. The first is that while I talked off the record with many people about the ongoing legal disputes, and I stand on the shoulders of the work done by People Make Games to explore exactly what's going on, it is essentially impossible for us as interviewers to get authentic answers about anything that directly touches those cases. Nobody is going to admit, on camera, to things that may incriminate them in legal cases down the road. So anything they will say is inherently not the full picture, which ultimately creates a narrative and factual void that is wildly open to misinterpretation. Secondly, and downstream from this initial point, while I reached out to many of the original team for comment, I chose not to reach out to those still working at the studio which includes just over a half a dozen people who touched everything from writing to art, animation, marketing and technology. My hope is that we celebrated their work, like so many others, by having many of our interviewees talk about their contributions. But if I was to talk to them, there is no way I could do so in good faith and not ask them about the behavior of Robert, Helen and Rostov. Doing so would require us to air more dirty laundry from the other side of that argument, conversations that would produce great headlines but ultimately one-sided answers to complex interpersonal matters, matters that are currently being argued in court cases. A lot has been reported about all of this, and with good reason, the fractures within the team are connected to the future of this beloved franchise. But for me there is an element of over-analyzing of what essentially boils down to the sort of managerial or interpersonal office bullshit that most of us have unfortunately encountered at some point in our lives. Conflating all of that with the many different waves of layoffs, would seem to justify the actions taken by studio owners. It's clear that many of the old team, be them at ZA/UM right now or not, had or still have issues with how Robert and others behaved. And I would say they are absolutely justified in doing so. For me, though, a lot of the interpersonal issues within this story are, frankly, none of our business. Like in most office conflicts, there is no singular truth here, people have different perspectives, different motivations, and different levels of baggage coming out of all of this. Power is often something people see in others and don't recognize in themselves. And it's clear that most of the people on either side of this conflict are victims in some way. Each of them will feel justified in believing what they believe. So, for me, unpacking the dirty details of who says or thinks what, and what people feel about all of this is something that should be done, but between those people in private. But sadly, with these court cases looming over everyone's head, many of those conversations are currently impossible to have. - You know, what's not a good time to start a growth narrative, is during free ongoing court cases. There is something very specifically brutal about not being able to admit any shortcomings if it can be used against you in the court of law. There's just a complete difference between what I emotionally feel and then what I would like to feel like, and then what, like, I can say, No one's going to go out and generate court acceptable testimonies against their own character when they're in free court cases. But I guess the best I can say is that I'm not an inflexible idiot who just thinks that they behave in the best possible way in life. I will develop the magnanimity over the time, I'm sure, but as long as I still feel that my primary duty to the art is to try to get, for myself and for all of us, the opportunity to continue working, perhaps, in this intellectual property. In a perverse way, if I become a sorry cop now, then we're not gonna get it. And that's not an excuse. I would very much like to, you know? Who doesn't like someone who accepts their shortcomings and who doesn't wanna be that, and I definitely wanna be that, but I can't do it publicly. - [Danny] Yeah, seems like a very frustrating position to be in for a number of years. - Really, really, really fucking frustrating to be in. And I don't have any of the... Like, I don't have the antagonistic energy in me anymore. I don't have... I'm not angry at anyone, I really am just... You know, even the tiger just is a tiger, who just eats other animals, that's the way the tiger is. So emotionally and I don't have any of that in me. I would just very much like to be friends with my friends again, and I would like it to be over but it just seems like it's gonna take a very long time to be over. - I'm gonna ask you a question, is that okay for me to say that? It's a very strange thing to ask an interviewer, is it okay for me not to become sorry cop? Like, is it understandable in a way? You know, I'm not looking for compassion, but just an opinion. - No. Well, I'll put it this way. When you wrote the letter that was written, I'm not sure if you've watched the people in the games video. - No, I don't, I'm not gonna watch this one either. - Okay. There was a response that Chris asked you further questions, and you responded with a text that he reacted to negatively 'cause he thought that it wasn't empathetic to those people. - Yeah. - [Danny] I read it as that person's in a court case. - Yeah. - So, no, I think you're in a difficult position. I don't know what you do privately, 'cause you can probably reach out to these people privately and it not be part of the court case. Again, that's none of my fucking business. I think the battle for public opinion around this thing is not the worst part, but it's close to the worst part of it. And I hate- - Humiliating is what it is. - Right. - It is extremely humiliating to have your relationship with your friends, like, be part of some public domain. It's kind of like... It's participating in, not basically, but completely and directly, in tabloid journalism. It's just tabloid journalism. If you want to be a dignified guy like Clint Eastwood, then just let everything be taken away from you and say, (growls). You know? - Walk off into the sunset. - It's very undignified to fight. It is a very undignified thing to do. - [Danny] Why fight? - Elysium, it's just... You just can't let it go. You can't just let it be, like, destroyed or... It's like a child of yours or whatever. There's no other option. If there's a possibility and you have to fight for your rights as an author simply to just tell some cool stories to people. Like, wouldn't it be great if it would get to play this "Disco Elysium 2" one day? Like, would you like, if there would be a chance, would you, like, break it? Would you throw it away? Like, you can't, you have to safeguard it even if it's a small chance. (solemn music) - [Danny] In the years since all of this, the world has continued to spin, and the influence of "Disco Elysium" has continued to inspire artists around the globe, those who were part of that original story, and those who were touched by it. At the time of this video's release in Spring of 2026, Robert, Rostov and Helen are at work on a new project at their new studio, Red Info. We conducted our interviews at their office, located in Tallinn's old town, a picturesque, short walk from their original home. Little is known about the project, though they've received a hefty investment from NetEase and appear years away from announcement, let alone release. ZA/UM has had a difficult few years. Online sentiment towards the company has been fraught with negativity since the firings, and there has been more layoffs in the wake of project cancellations. One such game was a spinoff of "Disco Elysium" which reportedly focused on Cuno and Cunoesse, originally pitched by one of our interviewees, Argo Tuulik, who has since himself been laid off along with 25% of the studio upon that project's cancellation. ZA/UM released a mobile version of "Disco Elysium" last year, but most fans' attention is pointing towards "Zero Parades for Dead Spies," an RPG set in a new world, which, if you've played the recently released Steam Demo, plays a lot like "Disco Elysium," but with some novel new additions to encounters and how your player's psyche is affected by your choices. That said, ZA/UM is a difficult studio to talk about these days. It's clear that a lot of very talented, passionate fans of the original games have made their way there, and I'm sure most of them are kind people who are determined to make a great game. But the firings, court cases and alleged IP theft have cast an inescapable shadow over the studio and it's doubtful that "Zero Parades for Dead Spies" will launch into a particularly sympathetic marketplace. For the folks at ZA/UM who were part of the original team, it must be particularly frustrating to work for years on a new project, and know that there are so many people hoping it fails on release. But I sincerely believe that most of the frustration within the "Disco" community is pointed to the top of the ZA/UM pyramid, To the people with whom studio decision making power ultimately rested and whose decisions whether they believed they were justified or not, ultimately led to the situation the studio now finds itself in. It's a terrible shame that once again, the workers will suffer because of decisions that were outside of their control. There have been other breakaway studios, with some having more of a connection to the creation of "Disco Elysium" than others, some connected to that original team like Kaur Kendar's "Dark Math," and others with more tenuous connections like "Longdue Games" which includes the CEO of Knights of Unity, the team who we previously mentioned took over programming when all the original ZA/UM engineers were fired. And they've also hired original ZA/UM member, Martin Luiga. In fact, while we're talking about Martin, he did jump in to the comments on our first video to clarify exactly who he wrote first drafts of and also mentioned that he didn't draw those early sketches of Martinaise we had given him credit for. Apologies, Martin, just another example of our interviewees' memories being a little hazy. Argo Tuulik and another post-Disco ZA/UM hire, Dora Klindzic, worked on both these other projects for a time, but have since founded Summer Eternal, a game studio/art collective that hopes to fund and release their own game in the future. When we talked to Argo, he was also attempting to wrestle the "Disco" franchise away from ZA/UM in a separate court case to Robert and Rostov. But what's heartwarming is the ways in which "Disco Elysium" has encouraged developers around the world in more subtle ways, encouraging indies and larger studios to add imaginative narratives and decision-making into their own games. For me, games like "NorCo" and "Citizen Sleeper" feel steeped in this confidence. While recently released indie Disco-like "Esoteric Ebb" has come out to rave reviews, clearly inspired by "Disco Elysium," without being cynically derivative. It remains to be seen if we'll ever see another "Disco Elysium" from the original creators, but the fallout from the game's release can still be felt across the industry. And it's my hope that this series is full of lessons that developers can learn from. A lot had to go right to make "Disco Elysium" a modern classic. A group of friends with new ideas, banding together to create something truly new and dangerous. A workplace which gave writers the time to edit and edit until the narrative was ready. Non-traditional video game artists that created a world we'd never seen before. Non-combat gameplay that challenged conventional design. But "Disco Elysium" is also a cautionary tale about trusting capital, about treating your colleagues with respect, about crunch and burning out and making sure that no matter what happens with the first game, you and your team are ready for the second one. There's a romantic idea that to make great art you have to suffer. And I've worked long enough and covered enough games to know this is sentimental nonsense. There is a universe in which "Disco Elysium" came out as good as it did, and a unified ZA/UM went on to bigger and better things. We don't live in that world, a fact that both fans of the game and the people we talked to mourn over. Much like "Disco Elysium" itself, there is no all-encompassing victory at the end of this story. There's just people, their strengths, their weaknesses, their dreams and their baggage. Are there good guys and bad guys? Outside of the studio leadership of ZA/UM, this reporter doesn't really think so. Just people who made decisions based on their egos, desires and material conditions at the time, and who ultimately have to live with those decisions as they move forward through life. This story, much like Harry's, is to be continued. (solemn music) - Believe me, these days, I don't think a day goes by where I don't think how incredibly difficult it must be to be a "Disco Elysium" fan nowadays. Like, it's not just that Robert and Rostov were fired, the original creators, the work was taken away from them. But nowadays, like, every time you hear the word "Disco Elysium," it's something shit that's attached to it. It's been a long, long time when you've got some good news associated with the word "Disco Elysium" so I do really admire the people who still have the resilience and the kind of faith to stand by it. - You know, quite often people who make games say we're very proud of the creativity it has kind of induced in the people who play it. I don't go online to the forums and stuff like that. I have, you know, seen the subreddit, but I don't do that and I don't listen. I don't read comments and reviews and stuff like that. But people send me, like, screenshots and stuff. And then I see people in real life on gaming conventions and stuff, and they just seem like the coolest guys. Yeah, they just seemed like heroes and poets to me, all of them. - That's amazing. And that's like, I never... I don't know, I just never thought it would happen. I don't know, as I said, like, I thought it would be like a small game and maybe there's, like, 50 fans there and, you know, something like that. Like, the amount of, like, video essays and art that has come out of it, I think it's the kind of the best thing to kind of, you know, set a spark to other people's creativity. And it means very, very much that it means so much to people 'cause, like, that's what art is. It's like communication. It's like it has to reach someone else. Otherwise, you're just, like, talking to yourself, like things that you described there have to reach someone else and touch them. And, you know, when I was, like, thinking, like, "Was it all worth it?" Like, the end result was always, "Yeah, it was, like, fucking worth it. Absolutely." - I felt walking into, you know, that building that I was walking into the building of the most amazing people I'd ever met, really just having all these great people really committed to a game, just that sense of mutual belief and the fact that what we were doing was the most worthwhile thing we could all be doing for our lives. - I stumbled upon, like, a YouTube video or, like, a blog post that differentiated TV shows based on whether they had hearts or not. I think "Disco" is kind of one of them. Like, it's a thing that kind of climbs into your heart, makes a little mess there, and it kind of plays into the bittersweet of the "Elysium" world where it is to be continued and will forever be. That's kind of the story of the world of "Elysium." - [Danny] You guys are working on something else or trying to figure out something else or whatever it is. I hope we get to talk again in the future. - Yes. - [Danny] And hopefully, it's not seven or eight years from now, but if it is, it'll probably have been worth the time. - Yes, I hope the same, yeah. Definitely. - Life goes on. Bills need paying. I still know how to write some thigh-slapping material every now and then. I still know to write characters and so on. I still have all of my, like, tools of my trade and all of the aesthetic things that we learned over those years. But if I'm able to do something after this, it would have to be something that stares right into the barrel of this defeat, into losing another world, into, into losing even the hope of anything else than this place here, right? It's almost like a perfect hellish Aesop or fable. So I guess the one thing that I can say is clearly the answer is not to try to imagine another world now. Like, that's not the answer. The answer, creatively, is to then look at this desert that we have here and say, "Okay, what can we do about real history...." Yeah. (solemn music) (solemn music continues) (keyboard sounds)
