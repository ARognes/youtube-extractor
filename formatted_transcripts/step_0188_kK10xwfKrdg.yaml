transcript: I'm super busy finishing up 40 golf but I still wanted to do one last devlog before the release because I keep getting this question will it have multiplayer and can I wish list the game right now the answer to both is yes and yes you can hit someone else's ball into the fourth dimension but I should explain a few things first as you can imagine 40 golf does have a learning curve so multiplayer is not something I'd recommend jumping into right away in beta testing it typically takes about 30 minutes into the tutorial for 40 to really click for people and I think that's pretty decent I've spent a lot of time trying to get the tutorial right so that anyone can play the game right now I have hot seat multiplayer completed meaning you share the same physical computer and take turns with your friends I'm planning to include online multiplayer too but I'm not sure if it'll be ready before the release date which is why I haven't officially announced it yet either way it will definitely be coming soon but if you absolutely can't wait there's still the option of using Steam remote play as long as you have a decent internet connection it shares your screen and lets your friends control the same game it's a pretty cool feature and it does work in 40 golf bumping into another player's ball is pretty rare unless you do it on purpose that's because the volume you golf in is much larger than it would be in a 3D game but it's still really fun to knock someone's ball off the track or into the hole or into the literal fourth dimension another frequently requested feature is VR I'm happy to say that that's coming soon too in fact I have all the 40 rendering working the main roadblock is redesigning all the UI for VR and integrating the motion controllers motion controllers are actually really ideal for a 4D game since they each have way more degrees of freedom compared to a mouse which just has left right up down in a 3D game you use a 2d Compass because there's only one one plane of rotation on the ground but in 4D games a 3D Compass represents all the different views on the 3D ground so it's really convenient that motion controllers map exactly one to one to those rotations allowing you to look everywhere with one control I've also seen questions floating around about if 40 golf will make you motion sick in VR my last game hyperbola had a ton of non- ukian walking platforming and racing so it was definitely a recipe for feeling disoriented by contrast 40 golf is really tame since you mostly stay stationary and teleport around even when you're changing your view in 4D so there's very little risk of motion sickness for most of the levels lastly a lot of people wanted to know about the music in the trailer it's made by Phil makes noise who's made the entire soundtrack for 40 Golf and hyperbola he's releasing some bonus tracks from 40 golf on his YouTube channel right now so you can check out some of the pre-release Tunes and you can see his process of making music in Dev vog number four if you're curious I hope that cleared up some things before fory golf releases in March and comment below if you have any more lingering questions I do read all the comments and take into consideration a lot of suggestions don't forget to smash that wish list button and I'll see you in the next video
