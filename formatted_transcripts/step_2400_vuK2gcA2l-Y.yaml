transcript: Hey guys, so today you and I are going to talk about AI in front end. So let's get into it. So the question in question was about AI. What a surprise. Hi Frederick, can you give me an example of a repetitive task in front that you use AI AI consistently to do for you? Yes, I can. Now for me it's a little bit trickier to use AI in the front end in than in back end. I find that it's easier for me to do like big things in back end when it comes to to AI. But one of my favorite use cases for AI these days is when I'm dealing with a like I'm have story I'm supposed to create a component or something like that. What I usually want the AI to do because these days I work primarily in React. My favorite thing is to just create a component like just a placeholder component or something like that and then either we can take a screenshot if we have artboards or I can just describe what I want it to do and I basically tell it can you create a static component with some fake data that just you know if let's say it's a table I'm making I need a table it needs roughly this like these columns and so forth and so forth. Can you set something up for me? Because what happens then is that of course it's not going to most likely get it completely perfect on the first try but it will get pretty close and then I look at the results and I see okay this is nice it's pretty close and so and then I ask it can you like iterate again and let's add you know the things that were missing and then I just use an iterative process to get the static component done in seconds or like not even a few minutes rather than me writing it all from scratch. This is extra powerful if you have things like standard components and so forth and so forth with a lot of good references. The messier your codebase, the harder this gets. It's the thing that I usually try to teach or to to do in my teams where I try to explain to them that one of the powerful things about having some reusable components or code that is very similar and create being pretty consistent with certain patterns is that both humans and AIs have something to reference when they're going to create new UI elements and so forth and so forth. So for me it's this is as easy as saying I need a two like a two two column layout or three columns is usually pretty pretty common and I needed to have this these elements and so forth and so forth and then it just looks at hopefully some other reference I have for similar sort of setups and it's going to spit out something that is closer and even if it can't get it perfectly that's not an issue for me because all I have to do is to tell it okay upd this do that and so forth and so forth and once I'm pretty happy with like the like the basic structure of the page. What I will do is to ma usually manually because I find that to be a little bit easier for me to do than for the AI to take a look at what the code is generated and then I usually segment things out into smaller components and things like that because by default and honestly it's not just AI who does this. It's like I would argue a rookie. Like I mean I can almost I'm not going to judge you if you do this but I can almost spot a mid-level juniorish especially in React land this front-end developer by the size of their components. If you have which is like the most common thing I see if you have a whole page you have a page component and everything is in that page there's not a single subcomponent or nothing that to me is not all that sustainable but it's pretty common to see and an AI will spit out a similar sort of thing if you ask it to make a whole page and that's when I go in and I go okay these components I would like to break them out into smaller components and import them and so I do a basic some refactoring so you can almost think of it as that the way that I use AI in front end is a little bit like a f like it's just a quoteunquote junior software developer doing a first draft of a static mockup for me and then I will go in like refactor it and do the things that I usually do and so forth and so forth. That is the most consistent thing I use AI for. Other than that I use really it's not that much I use it for you know I mean obviously I hope testing and things like that is also a great use case for AI it doesn't matter if it's front end or back end so I use it for testing quite a lot but honestly apart from these sort of things I still haven't figured out a nicer way of dealing with some of the complexities of front end because the thing that is a little bit tricky with front end is that practically everything that you are making unless it's a completely standard component because if it is a standard component that's also a great use case for AI but I mean now you can do it yourself as well like if you standardize a table you standardize some UI element or so forth and so forth then it's super super great at like asking the AI to you know rewrite this component so that it takes all the input parameters so that I can create you know some that I can reuse this component some somewhere else but again I can do that myself and sometimes it's easy to just do it yourself because a I may not be seriously good at it because as we're saying, we're talking about something I do consistently and consistently I'm only ever actually creating my first draft with a static component or page or something like that with some basic static fake data that I can use to like showcase what the UI is going to look like and writing tests. Those are the two main things. But as I was saying, it can be useful sometimes for me to use AI to re create a reusable version of a component or in some cases if I have a really really fancy component. I had I remember the other day like I had one of the more sophisticated u components that I had to make honestly in my career as a front-end developer and the basics of that component was to create a canvas. Well, it didn't have to. I mean, it wasn't specified. It had to be a canvas. But I hope when you understand what I'm building, you're going to understand that choice was to me sort of the best solution. So, basically, we had a flowchart type of thing where you know boxes and arrows that point to various relationship and it's sort of like a diagram of decisions where if you go you have one box pick pointing with an arrow at another one and then if it's a yes or no, it goes to one flow or it goes to another one. So these sort of decision flows, it needed to be on the web. And as you can imagine, for me, drawing a bunch of boxes and arrows and stuff like that, then dynamically being able to span around and so forth, immediately I go to, okay, canvas, that's a pretty good use case for this. That's a perfect situation to use AI, which I use it for because when it comes to UI rendering code and like WebGL, it doesn't have to be WebGL. you mean anything that has to do with placement and so forth, usually you're going to deal with a lot of X and Y coordinate mapping and some basic mathematics and so forth and so forth. And since I know that the AI is going to be a hundred maybe a thousand times faster at ma doing all the meth necessarily adjustments and the because I don't of course know the you know the canvas APIs by heart and all the graphic graphical components that I need in order to draw everything sadly enough but the AI does. So here it's pretty nifty to be able to just tell it can you please set up like a flowchart like a canvas element it should take these inputs and so forth and so forth and use specifications as opposed to just you know having it u having my own implementation because if it doesn't work perfectly it's not the end of the world because I can ask the AI to rewrite it and this is one of those situations where the you don't necessarily have to be a master of everything in the component and understand fully how everything works because you can very easily empirically evaluate the results by simply saying all right create me a component that takes a bunch of like you know JSON data or like something which shows like the different boxes and the relationships and everything like that and then you create a bunch of combination like a combination of different inputs and you just use like snapshot testing or something like that for it like visual diffing and that should be good enough and then you can use the AI to sort of debug it and so forth if necessary because as you can imagine It's quite a lot of work to create a sophisticated canvas solution and have all that math and so forth always work perfectly. AI is really really great at that sort of stuff. So what I want you to take away from this is that me what I use AI for most consistently in front end is number one create the first draft of everything I'm making because usually it's going to be able to create the component and create a basic layout and like all that stuff with just a few sec within just a few seconds and then I look at the work and I see that you get a feel for like how much you can ask it to refine and then I try to ask it to refine until the point where I feel like yeah this is good enough I can showcase this as a demo or like a early draft or something like that to my stakeholders and then I start refac break when they feel like it's fine or so forth I start breaking things out into my own components and sort of doing my own flavor like that I usually do when I write code because I find it to be a little bit easier than just asking the AI to sync the way I do when it comes to the sizes of components and so forth. So I try to keep this problem simple for the AI so it gives me a first working draft and then I refine. Second thing is of course testing super super nice to use AI for testing. I just like ask it to consider a few test cases and then if it has some ideas that I don't have, it's going to add them naturally. And then lastly, if you have something like a canvas element or something more sophisticated that you need to make, especially if it requires a lot of mathemat mathematics to get everything in position and so forth, AI is really nice at that because then you can basically create a component that as a consumer, you really only need to know what the input is supposed to be. You don't necessarily need to understand all the mathematics underneath. As long as you have a rigorous test bed of different use cases that sort of mimics what you're going to have in production. That's what I did where I know that we only have three or four like flowcharts that we need to visually represents they represent. And so as long as I have tests to make sure that they are rendering correctly in like we're used to story book for that then I'm good. like I don't have to overanalyze and like make like a million tests for it and so forth and so forth because the AI is going to be able to produce the necessary result and then I can sort of just let that code live there and most likely it's never going to be touched again because the use case is pretty straightforward. Have a great day.
