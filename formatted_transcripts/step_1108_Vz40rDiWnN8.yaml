transcript: STD expected. A phrase I have never said before and probably never will again. In fact, I might break my rule and say standard instead of std today. So, C++ 23 has finally introduced something that I think is actually a strong way of dealing with errors properly in C++. Now, we're going to spend the rest of this video talking about this, but before we do, let me just cut to the chase and show you what it is. Say, for example, you have a function that needs to divide two integers. There's a possibility that that second integer could be zero. And if it is, that's an error. What expected allows you to do is return two possible results. Either the actual result if the function succeeds or an error result. So you can see here that we take in two integers A and B, but if B is zero, we instead return an unexpected result which is going to be of this type. Otherwise, we do the division and we return the result of that as an integer. The caller receives this expected object and can check whether or not it's valid. That is to say whether or not we actually have the result because it succeeded or we get the unexpected result. If it is valid then we can use it however we like such as printing it in this case. But if it's not valid then we can retrieve the error which in this case is a string and do what we will with it. So for this example I'm trying to divide 10 by two. If I run this code then as you might expect we print result equals 5 because that's what we're doing over here. However, if I change this to be zero, which is invalid, then instead we're getting a divide by zero error, which is what we set our unexpected object to. So, in a nutshell, that is what expected is. It allows you to either return one value or another based on whatever conditions you define. The way this works internally is very important because of course, we care about what our code is actually doing and performance. So internally an expected object is actually a union of either the succe