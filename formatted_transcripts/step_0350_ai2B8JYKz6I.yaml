transcript: huge announcement everyone i am officially doing game development and youtube full time for those that were not aware hyperbolica and my youtube projects have always been things i worked on in my spare time usually only working on them for an hour or two per day and because of that when anything else is going on in my life that's the time that gets eaten away so it's really hard to give any kind of accurate release dates because it's always in flux and that's been the situation recently there was the pandemic obviously but also i moved into new house which needs a lot of work and we just had a new baby so as you can imagine it's been hard to make a lot of progress recently but now that's all going to change doing hyperbolic a full time means i can persistently work with a known schedule and actually make deadlines i set for myself on the other hand it's really scary to leave a full-time job and mostly live off my savings while hoping the game does well enough to make it all worth it obviously i'm confident enough that we have enough savings and the game sales will be good otherwise i wouldn't be doing this but it is still a gamble in the past i know a lot of people have wanted to help out with patreon or donations or something and i've always turned those down because it would never have led to more videos or game progress but now i can see a legitimate reason so starting today i'm gonna add the donation option to the games on my itch page they're still free of course i'm just enabling the option i could start a patreon but i feel like creating a tiered system and satisfying a bunch of rewards and perks will just be too time consuming for me and that kind of defeats the purpose so instead i just created a coffee account it just seems like a simpler option i also wanted to mention that my discord is now more than just hyperbolica it now has places to discuss my videos and other projects so consider joining if you like the kind of content on my channel and i apologize for the lack of videos recently again since i've had less free time it's been almost exclusively focused on hyperbolica and not on video production but i do plan to make another devlog soon so look out for that and thanks so much for watching
