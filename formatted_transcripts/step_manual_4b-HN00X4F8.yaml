transcript: '{"content":"\n[0.0s] One of the most frustrating things has\n[1.96s] to be when you just finished some code\n[4.08s] and somebody comes to you and asks you,\n[5.72s] \"Hey, can you make a last-minute change\n[7.64s] to it?\" Well, today we''re going to talk\n[9.48s] about why product managers, who can\n[11.92s] sometimes be the person on your team if\n[14.08s] you''re a developer, that seems to drive\n[16.48s] you nuts, can actually be your biggest\n[19.76s] ally.\n[27.84s] Hi, I''m Genie. In a healthy software\n[29.76s] developer, I want to help you stay calm,\n[32.279s] not get stuck, and keep growing in your\n[34.4s] development career, and have a good\n[36.4s] balance between your career and your\n[38.76s] life. I was on Reddit the other day\n[41.04s] browsing the programmer humor subreddit,\n[43.68s] and I came across this post.\n[55.6s] I can certainly identify with this, and\n[58.48s] the title of the post was, \"They do it\n[60.84s] to themselves.\"\n[62.52s] But, I think this meme, or this little\n[65.48s] funny graphic somebody put together,\n[67.28s] really underscores a disconnect I think\n[69.84s] many software developers, especially\n[71.72s] myself earlier in my career, have\n[73.56s] between their responsibility as a\n[76.12s] developer to make sure that the project\n[78.32s] goes smoothly, and their ability to just\n[81.08s] take commands from people higher up in\n[83.36s] the company. So, I''m going to use this\n[84.76s] video today to educate you a little bit\n[87.36s] on what it means to work with the\n[89.44s] product manager, and why actually, if\n[91.48s] you have a good relationship with one\n[93.16s] and you understand the expectations\n[95.52s] between you as a developer and that\n[97.88s] product manager, they can be your\n[100.4s] biggest ally in your career. Hey, if\n[103.08s] you''re new to my channel, consider\n[104.36s] subscribing. I release new videos every\n[107.0s] Tuesday and Thursday.\n[108.96s] Most developers know the more\n[110.64s] frameworks, programming languages, and\n[112.72s] technologies we get a chance to work\n[114.64s] with, the more experienced we are, and\n[116.8s] we usually do a better job of picking\n[118.84s] the right tech stack or patterns to use\n[120.92s] on a project. Well, similar to that, a\n[123.479s] product manager can do a very different\n[126.12s] job depending on the company they work\n[128.2s] at and what their strengths are. So,\n[130.759s] first of all, what is a product manager?\n[132.959s] I know you''ve worked with one before,\n[134.72s] and you may just look at this person as\n[136.36s] somebody who talks to customers, designs\n[138.88s] a product, and then tells developers\n[141.48s] what they should build through a spec of\n[143.36s] some sort. But, the important thing to\n[145.52s] think about as far as what a product\n[147.56s] manager really does on your team and how\n[149.2s] they can help you is they''re really the\n[151.04s] CEO of a product line. So, at a company\n[154.68s] a larger company where there''s\n[156.0s] potentially multiple software products,\n[158.56s] there''s often a product manager over\n[161.52s] each individual product. In working with\n[163.88s] over 30 software teams, one of the\n[165.959s] things I''ve definitely experienced is\n[168.36s] that the way a company''s set up and what\n[171.12s] product manager means can vary a lot\n[173.64s] from company to company. But, in\n[174.959s] general, a product manager is\n[177.4s] responsible for the overall success of\n[179.92s] the product. You as a developer, right?\n[182.239s] You''re accountable for the quality of\n[184.2s] your code, getting work hopefully done\n[186.28s] either on time or pretty close. Well, a\n[189.04s] product manager is accountable for some\n[191.12s] different things that can also be\n[193.0s] equally stressful. They''re accountable\n[195.36s] for the overall success of that product\n[198.84s] financially. So, they''re not actually\n[200.92s] rewarded and measured based on if the\n[203.32s] development team builds their product\n[206.04s] correctly, they''re measured on if that\n[208.16s] product that they designed for their\n[210.239s] customers actually makes money for the\n[213.16s] company. And that can be really\n[214.76s] stressful. As you can imagine, to pull\n[217.08s] that off, they''re actually accountable\n[219.44s] to their customers and their customer\n[222.16s] satisfaction. So, if you''re a developer,\n[224.32s] you''re usually accountable to your\n[225.92s] project manager, your team lead, maybe\n[227.8s] the CTO. It depends on where you are and\n[229.6s] how big the the is. And your really\n[231.84s] biggest thing that you need to make sure\n[233.76s] happens is deliverables get done, people\n[236.76s] understand the code, testing''s done\n[238.6s] well, right? All the things that we know\n[240.04s] as developers. Well, as a product\n[242.16s] manager, one of the biggest things that\n[244.24s] they''re measured on that will directly\n[246.08s] contribute to whether that product is\n[248.04s] successful is if their customers like\n[251.08s] the work that they''re putting out. So,\n[253.92s] just like we as developers often focus a\n[256.56s] little too much, this is just in my\n[258.359s] opinion, on our technical skills, and we\n[260.64s] sometimes forget that knowing how to\n[263.56s] develop good relationships with people\n[265.88s] and actually communicate well will\n[267.6s] advance our career. Product managers\n[270.24s] tend to lean more towards understanding\n[273.28s] their customers'' needs and their\n[275.24s] business, and depending on the product\n[277.48s] manager, not so much on understanding\n[280.2s] the development process and all the\n[282.0s] things that you and I know we need to do\n[284.76s] to build a solid and quality software\n[287.16s] product. A really important fact that\n[290.24s] many people don''t think about unless\n[291.919s] they''ve been in a product management\n[293.4s] role or worked very closely with one, I\n[296.24s] as a consultant have worked very closely\n[298.88s] with many product managers, so I''m very\n[300.68s] familiar with this, is they don''t really\n[303.16s] have direct authority over anyone. So,\n[305.8s] if you are, let''s say, a software\n[308.8s] development manager or a CTO or a\n[312.28s] director of engineering on the technical\n[314.76s] side at a at a medium-to-large size\n[316.76s] company, there are people who directly\n[318.8s] report to you, and you essentially have\n[321.32s] the ability to kind of tell them what to\n[323.12s] do. Now,\n[324.48s] this isn''t a video to get into\n[326.12s] management styles and whether you should\n[327.84s] boss people around, but ultimately,\n[330.36s] there are people that report to that\n[332.4s] person as a lead on the technical side.\n[335.24s] A product manager, it''s important for\n[336.919s] you to understand, does not have any\n[339.12s] direct reports. The engineering team\n[342.04s] doesn''t report to them, the support team\n[344.48s] doesn''t report to them, the UX team\n[346.24s] doesn''t report to them if there is one.\n[347.92s] The ops team, if there is one, doesn''t\n[349.76s] report to them. So, the way that they\n[352.12s] get work done is by influencing people.\n[355.2s] So, they have to really know how to\n[356.76s] build good relationships with everybody\n[359.12s] at the company\n[360.48s] and inspire them to actually do the\n[363.16s] right thing by getting them to buy into\n[365.64s] their vision and understand that the\n[367.56s] work that''s being done is the right work\n[369.72s] for the company. So,\n[371.6s] it''s a very different skill set. And I\n[374.68s] think this is really important to\n[376.0s] understand because as I go into this the\n[378.24s] rest of this video, I''m going to get\n[379.52s] into some tips at the end and about how\n[381.8s] you can improve your relationship with\n[383.72s] your product manager so that you\n[385.64s] actually have a healthier and easier\n[387.6s] career. One thing you may have noticed\n[389.96s] is that if you talk to a software\n[391.88s] developer at a different company, their\n[394.28s] experience with their product manager\n[396.2s] and what they think they do might be\n[398.16s] totally different. And this is really\n[400.24s] because depending on the company that\n[402.0s] you work at, some product managers will\n[404.72s] design the product themselves, so\n[406.64s] they''ll actually do the UX or or screen\n[409.32s] designs and all that work. They will\n[411.24s] also maybe run some usability studies.\n[413.44s] They might interview customers. And they\n[416.24s] might also directly with specifications\n[419.68s] tell the development team, \"Here''s the\n[421.64s] work that needs to get done.\" At other\n[423.96s] companies, a product manager may more\n[426.6s] just talk to potential customers and be\n[429.76s] on the business side of things, but\n[431.76s] instead use the user experience and how\n[434.6s] the software''s designed and all that\n[436.24s] interaction might be done by a different\n[438.32s] person. At some companies, there''s\n[439.8s] actually technical product managers that\n[442.28s] are separate from a regular product\n[443.8s] manager. So, if you want to understand\n[446.08s] your product manager better and have a\n[447.96s] better relationship like I''m going to\n[449.4s] talk about in a second here,\n[451.28s] one of the important things I think you\n[452.8s] need to figure out is try to understand\n[455.04s] when you''re getting to know your product\n[456.44s] manager what kind of product manager are\n[459.32s] they. It''s also important to understand\n[461.68s] the history of your product manager if\n[463.6s] you''re going to have a better\n[464.32s] relationship with them. One thing to\n[466.64s] know is did they come from a more\n[468.4s] technical or engineering background?\n[470.8s] Many software developers or support\n[473.16s] personnel or ops people, if they show a\n[475.64s] lot of interest in the business and in\n[477.24s] the product, they can become product\n[479.08s] managers. And so the way they manage the\n[481.28s] product, they''re going to understand a\n[482.68s] lot more about technology and the things\n[485.12s] that you and I have to deal with as\n[486.56s] developers.\n[487.96s] Other product managers may come strictly\n[490.32s] from more of the business side. And so\n[492.56s] they''re going to know maybe a lot more\n[494.88s] about competitive research and designing\n[497.68s] software experiences and all the things\n[499.8s] that go into the business side. They''re\n[502.6s] really deeper in maybe out the gates\n[505.24s] when they start their career. And the\n[506.8s] challenge for them is to really\n[508.64s] understand how to work with engineers\n[511.24s] and development teams. So that''s\n[512.96s] something also that you should probably\n[514.599s] keep your eyes out for when you''re\n[516.32s] trying to figure out how do I improve my\n[518.919s] relationship with my product manager so\n[520.88s] they can really help me at my job and in\n[523.0s] my career. I talked about in one of my\n[525.28s] other videos how as developers we''re\n[527.839s] often frustrated with other people that\n[530.72s] are non-technical at the company we work\n[532.72s] at because we feel like they don''t\n[534.28s] appreciate how complex our work is.\n[537.68s] And as a developer, I think and this is\n[539.76s] something that I didn''t really learn\n[541.24s] well until I got into consulting and\n[543.0s] working closely with product managers, I\n[545.6s] don''t think we necessarily understand\n[547.839s] how complex the job of a product manager\n[550.64s] is. And so sometimes the decisions they\n[552.56s] make, like in the Reddit post that''s an\n[555.52s] example of this that I showed in the\n[556.8s] beginning, look like really horrible\n[559.4s] ideas to us. And so here''s three things\n[561.88s] that you should consider that''s actually\n[563.48s] really hard about a product manager''s\n[565.4s] job that you might not be aware of.\n[567.4s] Product managers have very limited time\n[570.16s] and money to accomplish their goals. As\n[573.08s] a developer, I''m sure you''ve often times\n[575.8s] been stressed out trying to get your\n[577.56s] work done quickly enough and often you\n[580.56s] might think I wish they''d hire more\n[582.32s] developers or I wish I had more time.\n[584.84s] Well, a product manager has similar\n[586.92s] stress. It''s in a little bit different\n[588.52s] way, but as far as time, the pressure\n[590.92s] they''re under is they need to actually\n[592.64s] deliver something, especially if this is\n[594.48s] a new product or maybe it''s a startup.\n[596.76s] They need to deliver something to their\n[598.32s] market to tell them whether it''s\n[600.6s] actually a good idea and it''s going to\n[602.04s] be successful quicker than their\n[604.08s] competition. And that''s a different type\n[606.8s] of pressure and it''s part of the reason\n[608.44s] why sometimes as developers we can look\n[610.96s] at product managers like why are you in\n[612.84s] such a rush? You know, let''s make sure\n[615.28s] we build this correctly and I''m going to\n[617.0s] talk about further in the video how you\n[618.76s] can help them understand why quality''s\n[620.84s] so important. But just understand when\n[623.4s] you''re working with a product manager\n[625.52s] the reason why there''s some urgency\n[627.48s] behind them getting things out quickly\n[630.28s] is because they''re not trying to be\n[632.36s] pushy to you as an engineer or a\n[634.08s] developer and look at it like, you know,\n[636.16s] you need to work as quickly as possible\n[637.92s] because they think you''re costing the\n[639.68s] the company a lot of money. Now, some\n[641.68s] companies that are unhealthy may look at\n[643.4s] it that way. It''s more often that\n[645.96s] they''re just stressed out and anxious\n[648.36s] about whether they''re going to get their\n[649.6s] idea in time before another competitor\n[652.64s] does. And the same types of issues that\n[655.32s] we deal with like I''ve talked about in\n[657.0s] other videos around stress and anxiety,\n[660.08s] those are also issues that product\n[662.0s] managers grapple with. Product managers\n[664.36s] also have very limited data and insight.\n[667.32s] We like to think that they know\n[669.48s] everything about their customers. As a\n[671.4s] developer, we think, you know, if their\n[673.52s] whole job is to build the product, they\n[675.68s] must have all kinds of data and\n[678.4s] information that''s helping them know\n[680.32s] exactly what the right decisions are to\n[682.56s] make. And you know, as I''ve talked about\n[684.839s] in many other videos, software\n[687.16s] development is very uncertain and when\n[689.48s] we go to build a feature or we go to\n[691.76s] write some code as a developer, or maybe\n[693.52s] we''re in UX and we go to design\n[694.96s] something, we often run into roadblocks\n[697.36s] that there''s no way anybody could have\n[699.24s] anticipated just with engineering and\n[701.76s] getting the work done. Well, product\n[703.52s] managers run into the exact same problem\n[705.76s] that they run into issues that their\n[708.64s] customers have or information they can''t\n[711.16s] get access to or regulatory issues, all\n[713.44s] kinds of problems that they have no way\n[716.32s] of predicting until they actually hit\n[718.36s] that wall and have that happen. So, one\n[721.24s] of the traps I would often fall into\n[723.36s] earlier in my career is I would look at\n[725.76s] a product manager that would come to the\n[727.4s] team after they''d already built a spec\n[729.52s] or wrote user stories or, you know,\n[731.16s] describe what they wanted. And when that\n[733.2s] product manager started asking us, \"Hey,\n[735.04s] we need to change this or I didn''t think\n[736.88s] about this, let''s do this.\" You know, my\n[739.36s] gut reaction was, \"You don''t know what\n[741.16s] the hell you''re doing. Why don''t you\n[742.44s] decide what you want before you ask us\n[744.56s] to build it?\" And I didn''t understand\n[747.28s] that the nature of product management,\n[749.6s] it''s not that that person''s not doing a\n[751.68s] good job. It''s really that they''re\n[753.8s] discovering new things every single day\n[757.48s] about what their customers do and don''t\n[759.56s] want. It''s very similar to how we as\n[761.96s] developers, we discover new things every\n[764.64s] day about maybe what we do and don''t\n[767.12s] understand about the code, how skilled\n[769.28s] or not skilled our co-workers are, etc.\n[772.44s] And the last thing that makes a product\n[773.92s] manager''s job really hard, that if you\n[775.68s] understand this, it''s going to help you\n[777.32s] have a good relationship with them, is\n[779.44s] that they''re ultimately responsible for\n[781.96s] what are customers really going to pay\n[784.0s] for? And in some companies, a product\n[786.28s] manager will talk to customers and hear\n[788.92s] what customers say they want and they''ll\n[790.88s] just build it. And you know, if you''ve\n[794.0s] used any product or you''ve went on\n[795.96s] Amazon and read reviews that often\n[798.04s] customers ask for things that they think\n[800.76s] they want, but then when you actually\n[802.52s] give it to them, it''s not something\n[804.68s] they''re really willing to pay for. And\n[807.56s] so, you know, if we''re going to as a\n[809.44s] team at software companies use lean\n[812.6s] methods for software development where\n[814.68s] your team, your development team is just\n[816.6s] building a little slice, a little idea\n[818.48s] at a time, and kind of testing it with\n[820.4s] the customer, then you need to\n[822.16s] understand that it''s probably going to\n[824.04s] be more often than not that what a\n[826.48s] product manager asks the team to build\n[829.16s] from one release to the next, or if\n[830.8s] you''re doing Kanban from one set of\n[832.52s] tasks to the next, is going to change\n[835.76s] dramatically because they''re going to\n[837.44s] find out that things that customers\n[839.52s] asked for, they really won''t pay for,\n[841.96s] and now they have to have you as an\n[843.76s] engineer build something different. So,\n[846.4s] I said at the beginning of this video\n[847.72s] that a product manager can actually be\n[849.96s] your biggest ally. How is that true? How\n[853.0s] can they really help you? Well, the\n[854.2s] first thing is they have a lot of\n[856.12s] influence at the company over how budget\n[858.88s] is spent. If you as a developer or an\n[862.04s] architect or lead are reporting to,\n[864.44s] let''s say, a CTO or a development\n[866.6s] manager, and you find that there''s a\n[868.08s] tool that your team wants, usually you\n[870.56s] have to go to that CTO, director, you\n[873.96s] know, your your software development\n[875.52s] manager and try to convince them that\n[877.72s] that you need that tool. And usually\n[880.6s] that department, the engineering\n[882.16s] department, has a fixed budget. This is\n[884.12s] the amount of money that we have for\n[885.64s] tools and training and developers each\n[887.8s] year. And that might change from time to\n[889.28s] time, but if you ask for something and\n[892.6s] it''s outside that budget, now that\n[894.64s] person, whoever you''re reporting to,\n[896.64s] they have to go to the business side of\n[898.72s] the house and convince them to actually\n[901.839s] spend the money to get you the tool, the\n[903.88s] training, or whatever you need to keep\n[905.44s] going. Well, if you as a developer have\n[908.0s] a good relationship directly with the a\n[910.48s] product manager or with the business,\n[912.28s] and they trust you, you can actually get\n[915.04s] them to approve budget for things that\n[917.8s] the technical side of the company\n[920.08s] doesn''t have the ability to do. And so,\n[923.08s] I think it''s really important if you\n[924.8s] want to have a great career and for it\n[926.76s] to be healthy, that you have a good\n[928.88s] relationship with a product manager\n[930.48s] because ultimately, they can get you\n[932.6s] money to do things that nobody else can.\n[935.92s] Another big benefit to having a good\n[938.16s] relationship with your product manager\n[940.44s] is ultimately, if they''re successful,\n[942.96s] you''re successful. I''ve worked at\n[945.72s] companies before where developers have\n[948.88s] impressed their you know, architect or\n[951.44s] team leader, co-workers and they build\n[953.48s] all kinds of great code and they\n[955.4s] engineer all kinds of really\n[956.96s] sophisticated things and everybody on\n[958.64s] the engineering team loves what they\n[960.84s] build, but they take so long to do it.\n[964.04s] They''re so difficult when they work with\n[966.16s] the business and at the end of the day,\n[968.2s] the product then fails in its market and\n[971.88s] either people get laid off or there\n[974.36s] aren''t isn''t really money available for\n[976.24s] raises. So, if you have a good\n[978.24s] relationship with your product manager,\n[980.08s] you''re making a relationship with the\n[981.64s] person who''s going to make decisions\n[983.36s] that actually affect the financials and\n[986.32s] the bottom line of the company. And the\n[989.0s] final way that product managers can\n[990.68s] really help you if you have a good\n[992.36s] relationship with them is they can help\n[994.52s] you brainstorm compromises.\n[997.16s] It''s very common that you as a developer\n[999.0s] will get handed some work from the\n[1001.24s] product management or business side of\n[1002.92s] the house and it might come in the form\n[1004.92s] of of a user story and not have all the\n[1007.16s] details just yet. Or you might have a\n[1009.24s] full specification for it. But once you\n[1012.08s] as a developer begin implementing it,\n[1014.16s] you hit some roadblocks. You find out\n[1016.44s] parts of it are way more complicated\n[1018.28s] than you thought. And so, rather than\n[1020.36s] just saying, \"Well, I can''t do this.\" If\n[1022.64s] you have a good relationship with your\n[1024.319s] product manager, the two of you can work\n[1026.92s] together to come up with what''s the best\n[1029.56s] compromise? What''s the best alternate,\n[1032.24s] you know, design or way to get around\n[1034.439s] this? And I''ve worked with some somewhat\n[1036.52s] more junior developers or people that\n[1038.6s] are have been doing it a long time, but\n[1040.199s] they just haven''t realized this yet, who\n[1042.92s] as soon as they find something that''s\n[1044.959s] asked of them that they can''t do, they\n[1046.439s] just kind of look at it like, I can''t do\n[1047.92s] this. You need to figure something else\n[1050.08s] out. And they really miss out on the\n[1052.08s] chance to learn from that product\n[1054.52s] manager maybe a little bit more about\n[1056.24s] the challenge around that aspect of the\n[1058.16s] product or the business and to help them\n[1060.92s] as a developer. I really think that the\n[1063.72s] the healthiest teams that I''ve ever\n[1065.48s] worked on in my career are the ones\n[1067.04s] where the developers are looked at as\n[1069.76s] partners in success of the product. And\n[1072.84s] there are some companies where there is\n[1074.24s] no product manager. I mean, it''s\n[1075.52s] literally just a bunch of developers and\n[1077.4s] they just build stuff and try it out.\n[1079.04s] And if that works at your company,\n[1080.68s] that''s great, you know, I I have no\n[1082.16s] problem with that. But most companies,\n[1084.76s] you know, whether it''s startups,\n[1086.08s] middle-size, or or big Fortune 500s,\n[1089.04s] there does tend to be somebody who''s\n[1090.88s] responsible for the overall success of\n[1093.08s] the product. And if that person has a\n[1096.0s] good relationship with you as a\n[1097.52s] developer, you can actually help them a\n[1100.28s] lot with designing the right product\n[1102.88s] because you may understand technology\n[1105.48s] way better than them. So, how can you\n[1107.56s] improve your relationship with your\n[1108.96s] product manager so you can help them be\n[1111.44s] more successful with the product and you\n[1114.16s] can get the raises, rewards,\n[1116.16s] recognition, and less pressure on your\n[1118.76s] projects if they trust you. Well, I\n[1120.76s] think the first thing is, you need to, I\n[1123.2s] think as a developer, look at it as it''s\n[1125.4s] your responsibility to educate product\n[1128.52s] management about best practices around\n[1131.16s] software development. That post that I\n[1133.4s] put at the beginning of the video, the\n[1135.32s] thing that I think it underscores is it\n[1137.96s] tries to paint the product manager as\n[1140.2s] they have full control over putting that\n[1143.2s] change in at the last minute that\n[1144.76s] derailed the project. And that is not\n[1147.0s] true. You as a developer have the\n[1149.76s] ability to say no to a product manager,\n[1153.24s] no matter how hard they push against\n[1154.92s] you, you have the ability also to\n[1157.04s] estimate it for as long as you think it\n[1159.16s] will take to do it right. You have the\n[1161.12s] ability to, when you start working on\n[1163.32s] that feature, if you find out it''s going\n[1165.08s] to take you longer to communicate that\n[1167.32s] and not be pushed back. So, when I work\n[1170.72s] on a team or I come in as a consultant\n[1173.08s] into a team and there''s not a good\n[1174.6s] relationship between development and the\n[1176.64s] product management side of the house,\n[1179.12s] I find it''s usually because one or the\n[1181.84s] other sides of that relationship,\n[1184.44s] they''re just blaming the other side and\n[1186.28s] they''re not willing to do anything to\n[1188.04s] actually help the other side understand\n[1190.4s] how to do the their job better. Now,\n[1193.68s] obviously it''s not your job as a\n[1194.96s] developer to do everything a product\n[1197.24s] manager does, nor is it a product\n[1199.68s] manager''s job to do everything that you\n[1202.08s] have to do to write code. But, if you\n[1204.68s] expect your product manager to\n[1206.28s] understand all the things that go into\n[1208.76s] engineering software, not just designing\n[1211.44s] the user interface, but everything\n[1212.96s] behind it, you''re going to be\n[1214.48s] disappointed because most of them don''t\n[1216.72s] understand that. The thing is, they want\n[1219.72s] to understand that, but you got to take\n[1221.64s] the time to talk to them about it. And\n[1224.48s] I, earlier in my career, would often get\n[1226.72s] frustrated with product managers and\n[1228.52s] look at it like, you know, well, you\n[1230.56s] should know this. I mean, you design\n[1232.88s] software. What are you, some kind of\n[1234.28s] idiot? And I wouldn''t necessarily say\n[1235.76s] that to them in those words, but that\n[1237.24s] was kind of my attitude. And I think\n[1239.32s] instead if you have the attitude of hey,\n[1242.68s] I want to help you understand. This is\n[1244.8s] actually something about how we develop\n[1247.08s] software that is the reason why this is\n[1249.64s] more complicated than you maybe think it\n[1251.4s] is. And you explain it to them and you\n[1253.96s] let them know you''re you''re helping them\n[1255.6s] understand this because you want to help\n[1257.68s] them, not because you want to belittle\n[1260.2s] them, product managers are extremely\n[1263.08s] receptive to that. Now, there''s\n[1264.96s] exceptions to the rule, sure. There''s\n[1266.72s] people that just like to walk around and\n[1269.08s] blame everybody, but you can''t control\n[1271.68s] that. The thing that you can control, if\n[1273.88s] you choose to stay on your project or at\n[1275.8s] your company, is you can control how you\n[1278.4s] present information that they may not\n[1280.76s] know.\n[1281.76s] The second way you can really help your\n[1283.64s] product manager and help them be\n[1285.72s] successful and have a good relationship\n[1287.76s] with them is to never allow them to make\n[1291.24s] a compromise to the quality of the\n[1293.68s] software product. So, it''s always going\n[1296.8s] to happen that product manager is going\n[1298.92s] to ask you to do things that you don''t\n[1300.8s] want to do. Maybe you just finished a\n[1303.24s] really complicated piece of code that\n[1305.24s] had a lot of moving parts, and now that\n[1307.88s] you''re done, all of a sudden they want\n[1309.6s] you to go back into it and make a huge\n[1311.88s] change, and it just feels overwhelming.\n[1313.88s] Man, have I been in that situation a lot\n[1315.84s] of times.\n[1317.0s] That''s fine, actually. You just though\n[1319.72s] need to not allow them to pressure you\n[1322.52s] into just like getting it done quickly,\n[1324.52s] or if they''re just like, \"Hey, I just\n[1325.84s] want this quick change, you know, you''ve\n[1327.56s] got a day to do it.\"\n[1329.4s] That''s when you have to have the courage\n[1331.08s] to just say, \"I''m happy to implement\n[1333.76s] this change for you, but I need time to\n[1336.04s] figure out what it''s going to really\n[1337.24s] take because this isn''t a trivial\n[1340.04s] change. It''s actually a big change\n[1342.92s] that''s going to be complicated. It may\n[1344.8s] break our tests, and if I don''t take the\n[1347.36s] time to do this right, what you release\n[1350.28s] is actually going to blow up in your\n[1351.92s] customers'' faces, and they aren''t going\n[1353.72s] to care whether they had this change or\n[1355.6s] not.\" Now, you have to do this. You have\n[1359.0s] to have the courage to do that, and you\n[1360.48s] have to take the time that it takes then\n[1361.96s] to look at the code and look at what\n[1363.64s] they''re asking you to do, and ask some\n[1365.68s] hard questions to try to figure out,\n[1367.76s] \"Hmm, you know, what what is this going\n[1369.48s] to take to really do it?\" And you might\n[1371.0s] need to reach out to other developers,\n[1372.8s] and you''re probably again going to be\n[1374.24s] wrong because estimates suck in software\n[1376.92s] development. They''re not very accurate.\n[1378.8s] But, I just so many times find people\n[1381.8s] get into this situation and they let\n[1384.36s] themselves come compromise the quality.\n[1386.6s] They let themselves be pushed into a\n[1388.72s] last minute change simply because they\n[1391.16s] look at it like it''s my job. I can''t say\n[1393.52s] no to the product manager or I can''t say\n[1395.88s] no to the development manager. And I''ll\n[1398.24s] tell you this, if you only have a\n[1400.6s] relationship, meaning you only talk to\n[1402.64s] let''s say your CTO or your director or\n[1404.92s] your team leader or your development\n[1406.28s] manager on a day-to-day basis, well,\n[1408.44s] then if a product manager asks you to\n[1410.8s] make a change, now you have to go\n[1412.84s] through that person to even convince the\n[1415.6s] product manager that they should maybe\n[1417.92s] give you some time to estimate it or\n[1420.04s] figure out a better design. Wouldn''t it\n[1422.04s] be better if you just have a\n[1423.48s] relationship with the product manager\n[1425.64s] directly? It is. So, this is why I''m\n[1428.8s] really encouraging you in this video\n[1430.6s] that you you should get to know your\n[1433.12s] product manager better and build a\n[1434.84s] relationship with them. Then when things\n[1437.48s] are asked of you, they''re not just\n[1438.88s] looked at like, \"Whoa, I got this thing\n[1440.68s] handed down to me and I have no idea\n[1443.04s] where this is coming from. How do I even\n[1445.08s] push back against this, right?\" The\n[1447.28s] third thing you can do to really help\n[1449.24s] your relationship with your product\n[1450.6s] manager and help them be successful is\n[1452.8s] to learn more about their customers.\n[1456.16s] My first job out of college, the first\n[1458.96s] year I worked there,\n[1460.68s] the development team could actually call\n[1463.0s] up customers and talk to them and they\n[1465.0s] would actually even come into the\n[1466.4s] building and meet with the development\n[1468.2s] team. And we knew what, you know, our\n[1470.88s] customers needed, we knew what their\n[1472.84s] work looked like, we knew what their,\n[1474.56s] you know, work day and experiences were\n[1476.28s] like. And so, we had a direct line of\n[1478.32s] communication them. A lot of companies\n[1480.48s] nowadays, especially when a company\n[1482.0s] grows to like a medium to large size,\n[1484.84s] they will often disconnect that and the\n[1487.48s] development team no longer has a direct\n[1489.88s] connection to the customers anymore. And\n[1492.24s] if you you''re in that situation, it''s\n[1494.32s] really then going to put you into a bad\n[1497.12s] place where you have to go through\n[1498.88s] somebody to understand what customers\n[1500.64s] want. So, I think if you''re going to\n[1502.08s] improve your relationship with your\n[1503.4s] product manager, one of the best things\n[1505.48s] you can do is ask them, \"Hey, next time\n[1508.64s] you''re going out to a customer to look\n[1510.68s] at, let''s say let''s say it''s\n[1512.24s] manufacturing software, their facility\n[1514.28s] where they build something, or if it''s a\n[1515.96s] mobile app, you know, we''re going to\n[1517.56s] maybe go to a conference and talk to\n[1519.52s] some people or an event and see how\n[1521.24s] they''re using our app. Can I come along?\n[1524.08s] Can I actually see what our customers\n[1526.12s] do?\" I think this is a really, really\n[1528.68s] valuable exercise for you as a developer\n[1530.64s] because then you''re going to understand\n[1532.4s] much better when a product manager asks\n[1535.8s] you to do some work, why are they asking\n[1538.16s] you to do that work. If you never meet\n[1540.64s] with customers, then you''re really just\n[1542.4s] relying on kind of you''re reading the\n[1544.0s] specs, you''re maybe reading user stories\n[1545.96s] of what the work is that you''ve been\n[1547.52s] asked to do, and kind of trying to guess\n[1550.28s] or infer what the customers'' problems\n[1552.92s] even are.\n[1554.16s] And the fourth and final way I think you\n[1555.72s] can really improve your relationship\n[1557.88s] with your product manager is to\n[1559.8s] collaborate on design. I talked about\n[1562.4s] this before, but you know, as a\n[1564.68s] developer, we often look at it like\n[1566.72s] we''re just order takers when we''re right\n[1568.44s] out of college. You know, we''re we''re\n[1569.72s] brand new to the industry, we don''t\n[1571.76s] really understand maybe much about the\n[1573.48s] business side, so we look at it like,\n[1575.68s] you know, you got to tell me as a\n[1577.48s] developer exactly what I need to know to\n[1580.52s] build this, and then I''ll build that and\n[1582.52s] nothing else. And I think as your career\n[1585.36s] moves forward, if you want to be more\n[1587.0s] happy and more healthy, and you want to\n[1588.8s] help your business make more money so\n[1590.8s] you make raises and your job goes\n[1592.92s] better, well, then if you actually work\n[1595.28s] closely with the product manager and not\n[1598.04s] have them look at it like, \"Hey, I\n[1599.64s] talked to customers, you know, I''ve\n[1601.4s] understood my market, I''ve evaluated the\n[1604.32s] competition, I''ve looked at pricing, you\n[1606.04s] know, all the different things I''ve\n[1607.08s] talked about in the lean canvas uh video\n[1609.76s] that I did.\"\n[1611.08s] If you basically look at it like once\n[1613.16s] the product manager does all that and\n[1614.92s] then now they want to build the product,\n[1616.76s] it''s up to them to design the product,\n[1619.16s] then you''re missing out on the ability\n[1621.0s] to help them build a product that''s\n[1622.56s] easier for you to code. If, however, you\n[1625.8s] have a good relationship with them and\n[1627.84s] you get involved up front, and you might\n[1630.04s] need to ask your product manager this,\n[1631.68s] you know, hey, I want to help you get\n[1633.32s] the work out quicker and have it be\n[1635.28s] higher quality and better for customers.\n[1637.16s] I have some ideas about, you know, how\n[1640.16s] design the product going forward where I\n[1642.08s] think we can both be successful. Would\n[1644.6s] you invite me next time and we can just\n[1646.6s] kind of sit down and look at what\n[1648.04s] customers are asking for and maybe I can\n[1649.88s] help you with some of the ideas that you\n[1652.52s] have. If you pitch this to a product\n[1655.0s] manager and they''re not the control\n[1656.92s] freak type, and I think most product\n[1658.96s] managers are not going to be successful\n[1660.64s] as a control freak, cuz remember they\n[1662.08s] don''t have direct reports. They only\n[1664.68s] influence people. They often, at least\n[1666.96s] in my experience, are very receptive to\n[1669.6s] this. And so you can make your job much\n[1673.56s] easier if you actually have the ability\n[1676.48s] to get involved up front with what\n[1678.76s] they''re designing and then make sure\n[1680.44s] what''s handed down to the development\n[1682.28s] team is even feasible. One of the most\n[1685.12s] frustrating things I''ve experienced and\n[1687.36s] many developers have is when you''re\n[1689.36s] asked to build something that feels like\n[1691.68s] it''s way too complicated for the value\n[1694.16s] it''s providing to customers. And the way\n[1697.16s] you can avoid that is to get involved\n[1700.12s] early. So, what are some other ways that\n[1702.32s] you can improve your relationship with\n[1704.32s] your product manager? Leave me some\n[1706.36s] comments below. If you''re new to my\n[1708.44s] YouTube channel, consider subscribing.\n[1711.24s] I''m also on four podcast platforms if\n[1713.8s] you''d rather listen to this. Google\n[1715.68s] Play, Stitcher, SoundCloud, and iTunes.\n[1720.12s] So, until next time,\n[1721.92s] thanks."}'
