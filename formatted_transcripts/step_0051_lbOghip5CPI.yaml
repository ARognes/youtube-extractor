transcript: '[Danny] Here at Noclip we’re no strangers to documenting the development of videogames, but over the years we’ve heard calls from our community to dive much deeper into specific aspects of game dev. Things like how characters are designed, how physics works, and where developers get all this yellow paint to help show us where to climb. So about two years ago we started collaborating with a new indie studio to capture dozens of distinct areas of making games, so we could produce a special series diving deeper than we ever have before. That studio is Torbie – helmed by Riley Gravatt and Zabir Hoque, two developers who previously worked at System Era, creators of Astroneer. In fact, you may recognize Riley from our documentary on Astroneer we filmed back in 2019. Since then, the two have gone solo and, with the help of a handful of hires and contractors, are working on Everbloom – a whimsical farming and social sim which looks so adorable it makes my eyes bleed. It’s also available to Wishlist now on Steam. For the past two years they have been capturing the design of their game and sorting the gameplay and dev diaries into over a dozen, specific design "buckets". Everything from how to make doors, to getting controls right, how lighting works. Even things like marketing, dialog, and much more. This is the first episode in this series and on today''s episode, we’re going to explore the world of sound design. Everything from how sounds are recorded, to the ways in which they are mixed. How the engine processes sound, how they deal with sound priority, and much more. You’re watching Noclip and this is How Games Are Made Episode One: (ident clicks) (Minimalist marimba music) [Riley] The most important thing for sound is communicating feedback to the player and also creating emotion inside the game experience, and so, sound is usually one of the first things the player hears to confirm that they did something correctly. Whether it''s swinging a sword and hitting something, and hearing that feedback. In a lot of shooter games, you shoot someone and you get a little "tick" sound to show that you''re doing damage. In our game, it''s doing an animation and getting a sound confirmation, whether it''s a "pop" of hitting something or a knock, or some kind of UI sound that confirms that, "Yes, what you did is correct." (Rocks break) (Ambient nature sounds) In our biomes, you can run around different areas, whether it''s a beach, a city, a farm, a field, a woodland area or a swampy area. And the game''s ambience needs to support those changes in locations. (Crashing waves; seagulls) And so, the simplest way of doing that is, create a bunch of volume layers and you just trigger the sound effect to change, and it fades between them. To get more advanced with it, though, and to make it more... feel like a living, breathing world those sounds need to be dynamic. So if you think about your experience in real life: in the morning, birds are chirping a lot more than at noon. At night, the birds aren''t going to be as active but you''re gonna have more insects, or crickets, or quiet. If it''s the winter time, there''s that kind of crisp sound, where sound travels a little bit further, so you need to adjust for that. And so, all that leads to feeling that emotion and the vibe of... Really, one of the goals of the audio experience in the game is to make it feel like you''re in that world, and its cozy vibes and ambience is super important for that. And so, with that, is having dynamic sounds that support the player''s location and experience. What we''re using right now is Unreal''s MetaSounds to actually facilitate that. One of the examples there is, in the world, we''re able to count up how many trees are around you and randomly play bird-chirping sounds from those trees. And what''s great about that is, we can create a base 2D layer sound effect that is playing no matter where you''re at in that biome, and then have 3D sounds play around the player but because it''s a dynamic game, you can chop those trees down, maybe clear-cut an entire forest, so it''s weird to then hear bird sounds. And all that is then driven by the time of day, birds chirp more in the mornings, they get less active or play a different kind of chirping sound at night. [Danny] Can you have it so that, if you chop down the entire forest, that there''s the sounds of birds crying and sad music and stuff? I didn''t think about that, but we could, actually. [Laughs] We totally could support that. (orchestral music) [Zabir] For the majority of my career, I''ve actually been a graphics programmer. Audio has just been an area where there is a level of technical specialization that is required and it''s just an area that I''ve never had to veer into. Of course, on our team of six, at least right now, there''s only two programmers and so, given my engine background, that''s the area that I will most likely be the one to take on. The nice thing about evolving games these days, is that Unreal does a ton of mapping features and systems that you need – like audio – onto the multitude of hardware that exists because the audio encoding, and compression, and decoding is different on the Xbox, versus the PlayStation versus the Switch, versus PC and who knows how many different types of sound chips exist on the PC market. And so, having a middleware – or, I guess, game engine – like Unreal really alleviates that concern. So audio, of course, one of the biggest considerations that we make when looking at audio in a game engine or a videogame is how much memory it takes up. You''d be surprised as to the payload that we have to deal with. Generally, in games, textures are probably the largest consumption of memory, and audio is almost immediately the one right after. So, a lot of times, you want to be able to record, I don''t know, a million different sound effects, and music, and everything and put them all into the game. The problem is, you''ll never be able to fit it into the memory that you have. And so, we''re always constantly fighting how do we stream in the right amount of audio into the game. You''re constantly, again, having to scale how much audio you can stream in and you need fallback solutions for when you can''t stream in all the exact sound effects or music that you wanna play, but also – on devices that are really, really high-powered – have enough variety and make it even more over the top and interesting because now you have more memory available. So, I think that''s one of the first considerations we make when looking at what audio capabilities an engine or a particular game is going to need. (Crickets chirping; hooting) (click) (European folksy music) [Riley] In games, you want the best user feedback possible. (axe hit) You can totally go online, search for "axe chop" and find thousands of different recordings of them. And it''s amazing, all the variations you have, whether it''s, like, the performance of it is different... And usually, it''s good coverage. But, to really get quality sound effects, you have to perform it yourself because foley is all about performance and textures interacting with each other, and so, in that performance, in that choice of materials, is how you get something that fits what your goals and themes are. For us, it was this softness of performance, the lightness. ''Cos one, our characters are smaller, lighter. They''re not a lumberjack hitting a log. But, at the same time, you need that user feedback of confirmation that you were successful with it. (Crash) When you record, honestly, the best resource you have is a mic on hand and so, sometimes I have a little portable recording device and other times I have a full recording setup with a digital audio recorder plugged into a shotgun mic that''s gonna really isolate all the sounds you can get, a lot of the details, with that. And that''s my preferred approach but also, I''m not gonna be always carrying around a big, heavy recording set with me. But, yeah, I was able to record a bunch of things for the game on my parents'' farm, and it worked out really well. (Shovel sounds) With every sound, we kinda break it down into parts and dissect it and that''s what we wanna do. And so, already I''m kinda doing that. With this, I''m kinda making mud pies here. But I''m... (Trickling water) ...pouring it on the dirt, and that sounds cool. But at the same time, we have some grass... (Lightly trickling water) ...and you get a different sound. And, in the game, you''re kind of wanting to give different feelings. So I''m kind of walking around my parents'' property pouring water on different things trying to figure out what has the best texture. And usually it''s kind of both. So here''s some different dirt... (Quiet trickle) ...and that doesn''t really sound that great. So, so far, what I feel like is the best is actually a little bit of grass on the side but mostly dirt, and the dirt gets kinda saturated and wet, erm... (Sharp trickling) Like, that''s not bad? But... Yeah, so it''s all about textures, and finding the right bit and going from there. (Chuckles) And being a sweaty mess. But it''s actually kind of a fun break from being at a computer. When we edit and work on sound effects it''s always gonna be wanting a lot of different takes and different versions, ''cos people are gonna hear the same sound over and over again, and it''s just not gonna feel right. ''Cos sounds sound different, right? Different footsteps, when you walk, you''re not hearing the same sound. Just a little bit of the cadence is different. So we wanted to make that accurate in games as much as possible, without going crazy with millions of different sounds. So, when I record, I record at least 20 different times and then, when I edit, I''m looking through those samples. Some of them are gonna sound identical, which is really interesting, and so you take a couple different variations. Usually, for me, it''s anywhere from three to seven depending on how often that sound gets heard and what those samples sound like. Edit them down, layer them with different textures. So, it might not be one recording of foley, but maybe two takes of different things. Layer them together, create three to seven assets, and then import them into the game. And so, on the implementation side of things, when you trigger that sound effect, it''s randomly selecting those three to seven sound effects every time. There''s a pitch-shift onto it as well and then maybe a little bit of volume variation. And then that becomes what feels like a bunch of different sound effects. And you''re never really noticing the repetition, as long as I did my job right. (Pops and thunks) (Rhythmic violin) [Riley] One of the most challenging things with building out a soundscape of a game, is making sure it feels nice. And so, to do that, you really have to balance what you''re hearing and what you, as the audio person, want the player to hear. So you might have a bunch of sounds playing at once but you start prioritizing them with your mixing to say, "Okay, well, things far off, we''re going to attenuate that volume." We set the priority level for certain things. So, maybe if something''s playing and there''s a lot of sounds being triggered at once, those just don''t play, because you don''t really need to hear your footsteps when a bomb goes off in the game and there''s a huge explosion. So you''re not gonna hear that anyways, and it''s just gonna muddy up the soundscape. So it''s a lot of culling things that might not be necessary. And, at the same time, it comes down to the editing standpoint of how you''re designing your sounds. So, you want softer things, you want a mixture... One sound effect that might be playing over the top of another one is in a different frequency range so they kinda layer on top pretty nicely. But it''s a lot of mixing and tuning to make things feel right. [Zabir] When we look at our dynamic soundscape one of the first challenges, or I guess maybe the primary challenge, especially in an open world game like ours, is how many sounds are trying to play at the same time. Because a lot of times, when you design these systems, you''re designing an area at a time and a dynamic gameplay situation may lead to seven of those things happening at once. And so everything is just fighting for being able to be played back. If we played them all back, all at the same time, it would sound like a car crash and you wouldn''t really be able to identify anything, and it certainly would be... not a pleasant experience. Almost everything that we play back has some sort of priority attached to it, and how important is it that we let the player know that this is happening or this is what they''re hearing. And so, that''s one thing, when it comes to dynamic soundscapes, again, that we''re always trying to balance. A lot of it is driven by playtest and feedback as far as, what are the important sounds, how did the player feel or what were they unaware of that they should''ve been, as they occurred. (Birds chirp) (Uplifting Eastern strings) In our game, there''s sounds that have real-world connections to it: Whether it''s like, a watering can, footsteps. All those things were recorded, they''re analog. At the same time, there are synthetic sounds. So, those more fall in line with UI sounds. Certainly they can be layered into other things. So, all the UI stuff is created with synthesis or unique plug-in chains that will create that bubbly, poppy sound of you collecting an item, or you clicking on a button. All of those are the kinda non-diegetic things. Whereas some of the diegetic stuff, with pickups or interactions, there''s usually a hybrid approach that I like to do where you get the bubble-pop sound from a synth, but then you might also have some kind of texture that''s more physical-based like me tapping on my desk and recording that. Those combined might make a really good-sounding pickup or something. Also, some UI sounds that do sound synthetic actually are just voice sounds that I might make. So, like, a simple one that''s really good that I use all the time, is like the standard, like, making a popping sound with your mouth... (Pop) ...like that! That, you could make digitally, or also just record yourself doing that and that''s even easier. [Danny] That was really good one of those. [Riley] That was the best one I''ve ever done! [Laughs] That was a really good one! [Danny] We''ve got the take! (Tapping) What''s important here, is like, the actual performance of it as much as the texture of it. So that''s why I think games with good audio usually have some kind of foley ''cos there''s really a specific-ness to it. So I''m gonna give this a shot. (click) All right, this is wood desk recording for fence tiles. (Tap) (Whimsical accordion music) [Riley] One of the mistakes with foley is trying to be too literal on your approach. If you''re recording a bone-break, you might not need a skeleton bone. Use a cucumber, a carrot, or whatever fits that kind of feeling. We had a few times where I tried to do the literal approach, of like, "Okay, you''re placing a fence pole," or placing a path and using wooden 2x4 sounds clanking against each other, and it just didn''t sound good. It sounded too harsh. It didn''t sound fun and playful. Sometimes it''s the simple stuff or the simple approach that really does it. So, for our path placements, I kinda looked through my apartment for inspiration and found some poker chips or dominoes, and those smaller things, with that performance and a little bit of tweaking, actually that felt way more fun and more accurate to what stylized experience that we were trying to get with our game. One of the hardest things that I''m still iterating on is actually the "pickaxe against the rock" sound (thunk) (Crunch) Very tough to make that sound slightly accurate while also not awful and grating to the ear. So, if you can imagine taking a sharp piece of metal and slamming it against a rock it''s not gonna sound good. But, you need to find a happy medium. I think, actually, one of the really great examples of that stuff done well is Minecraft. It''s not literal. It''s very simple, but you can listen to it a million times. It feels great. (Pickaxe sounds) (Slow drum beat) [Zabir] The second area – when we look at audio – is what type of CPU overhead it''s going to have. Whether it''s played back on the CPU game thread. Historically, on the Unreal Engine, there was a lot of overhead on the gameplay thread for the amount of audio work that''s being done. And, in recent years, they''ve started to move a lot of that work to background threads, which makes it a lot better in terms of the performance characteristics of the engine. The other thing we also consider is, what does the scalability feel like? So, while we might have certain platforms where it sounds great, we want it to be a reasonably sounding thing on lower-power devices which have a lot less memory. And so it''s almost thinking about, what does low, medium, and high-quality versions of everything sound like? So, a lot of times, I''ll go back to Riley and say, "Hey, this thing is just using up "one too many sounds, you gotta remix it with a simplified layer of things." [Danny] It''s funny to hear you talking about that, ''cos it''s not something I ever really consider. But, like, when it comes to game graphics, we hand a lot of control over to the player and the settings, and their ability to optimize the graphics experience with their computer. But you''re saying that, under the hood, you''re actually doing a lot of this with audio too, it''s just it never gets surfaced to the player in settings or anything? [Zabir] Exactly. There''s a lot of audio mixing, and a lot of audio "LOD" to... lack of a better term, that are at play. Historically, it''s just never been exposed to the player. A lot of times because of the technical nature of a lot of audio mixing it''s difficult to have an easily-understandable set of knobs or dials that the player can really tune. And the challenge is, we might say 32-source playback is the limit for a medium-spec PC. In which case, because the player might not have a reference point for how many is that actually, how many things are actually playing sounds, it would be difficult for them to identify. And, in fact, even an audio designer may actually not know without seeing the visual cues inside of an editor to go, "Oh, where''s that sound coming from?" "Oh, actually, I have this hidden thing that''s underneath a rock "that somebody placed 6 months ago playing back sounds "eating up some of the performance," right? And so, now you go and track that down. And, of course, you miss stuff all the time. And so, I think those are some of the things that make it difficult to expose a setting that players can control. So, sound is sometimes really easy to implement, when it''s a linear experience, it''s just a one-shot that gets triggered, it plays, maybe there''s some randomization on the sound. And mostly all that design is done in Pro Tools or any other linear media editor. When it gets tricky, is with games where it''s dynamic and it can change based on different variables. Whether it''s the surface type, or the physics of the intensity, the mass of the object. And so, to do that, you really have to deconstruct the sound from the beginning and then build that in layers in the game. (Crash) In the game, when you implement it, you break those apart and so, then you get those parameters fed into the audio engine to say, "Okay, I am this type of tree, I weigh this much, "or I''m applying this much force to the ground, and when I hit the ground..." And then, feeding that all into a system, that then triggers different individual sound effects that layer nicely into each other to create that experience. (Splinter; crash) (Thunk) (Thunk) (Thunk) (Thunk) (Thunk) (T