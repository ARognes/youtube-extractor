transcript: Zustand is an incredibly powerful state management library that I've used to build applications from simple counters all the way to completely in-browser card games all running entirely with Zustand as the state management library. In this video, I'm going to show you everything you need to know to get started building your first Zustand project all the way to what it takes to build out full-scale real-world applications. Welcome back to WebDevSimplified. My name is Kyle and my job is to simplify the web for you. And to get started, we have a really basic counter application. I kind of want to walk through the code though cuz there's some important parts about it that you need to understand. For this application, we are using context for everything so we are wrapping our entire application in this counter provider. And if we open that up, you can see this is a very basic implementation of context in React. If you're not familiar with context, I'll link a full video in the cards and description telling you everything you need to know about context, but you don't really need to understand what it does to understand this video. Essentially, we're just putting all of our code for incrementing, decrementing, resetting, and keeping track of what our count is inside this context. This context is then wrapping our entire application. And then we're using a custom hook we called the created use counter. And all this does is access the information in our context and give us to it. So you can see here, we have our count inside this count display. That's this top card up here. And then we have our counter controls. That's this bottom card down here. And here we're getting that increment, decrement, and reset function. And we're going to use them to interact with our counter. Now the key is I actually have it so that every single time one of our components re-renders, it'll flash on the screen a separate color and this render number will increment by one. So you can see when I click this plus icon, both of these flash green and that render number increments by one. And you can see as I click it, every single time that render number is increasing and these are flashing green. Now the reason that this is happening is because when you use context inside of React, every single time you access your context through that hook of use context or whatever custom hook you create, every time that the context changes, no matter what changes in the context, even if you're not using it, it'll re-render every single component accessing that data. So in our case, when our count changes, our display obviously updates, but all of our controls down here, which don't have anything to do with our display at all, are also re-rendering. This can lead to massive performance problems because if you have a context that's wrapping most of your application and you use it in lots of different places, it could cause your entire application to re-render every time even small minute pieces of data change that only affect 1% of your application. Also, context in general just becomes hard to scale as your application grows in size. And this is where Zustand really comes in. So what I'm going to do is I'm going to show you how to take this simple application, convert it over to a basic Zustand application so we can understand how easy it is to do the comparison between the two. So to get started, usually you're going to have like a folder called store or something like that. I'm just going to do it in this state folder we already have. And I'm just going to create a brand new file called use counter store {dot} ts just like that. And this is because with Zustand, you're essentially creating a custom hook. That's why we prefix this with use. Now we need to install the Zustand library. So let's just make sure we say npm i Zustand just like that. That's going to install that Zustand library for you and give you access to everything that you need inside of it. Once that's done, we actually have access to a function which is called create and that allows us to create our store. So we can just call create just like that. And this create function is a little bit complicated and interesting to work with. Essentially, it takes in a single parameter which is set and this is part of another function. So it takes in a function as that parameter. And then what we need to do is you need to return an object of all the different values we want inside of our store. So for example, we may have a count variable that we want which we're going to set to zero by default. And right now we've essentially created a store. We're not even using set cuz we're not updating our state. And this store has one single value which is our count. And if we want, we can set that to a variable. So we'll just say export const use counter store just like that. And now we've created a custom hook called this use counter store that just stores a count variable in it and nothing else at all. Now if we go back into our counter context and actually let's go into our counter component here, we can actually get that information if we want. So here, I could say use counter store. Call that function just like that. And now I get access to all the data that's inside of here. So if I want to, I can destructure out our count variable and have access to that from our counter store instead of our default counter that we had up here. Now you are noticing I'm getting some errors and stuff and that's because this all requires TypeScript if you want to use TypeScript. So in our case, we're going to take this counter state which I have right here, copy it over into our basic store, and we're going to set that as the type. And to do that, we just come in here with this create function. It's a generic and we can just paste in the type just like that. And now we need to supply those other parameters of increment, decrement, and reset. And you'll notice this is very similar to creating a context. You can see when we create a context, we pass it a generic. Usually we have to default the value to null, but the nice thing about Zustand, since it lives entirely outside of React and you can use it however you want, you can just define what your default value is right here. You don't have to worry about setting the default to null. Then we essentially set all of our different functions which I'm just going to copy all these functions over so we can use them directly as is. And that's pretty much it. So essentially, Zustand just replaces context almost one to one when you actually want to use it. So we're going to have those functions. I'm going to make them inline functions just like this. So let me just get those inlined. Make sure I put commas after them. There we go. And then instead of calling set count, we're going to call this set function. And this set function takes in our current state and then it's going to ask us to return a new value state just like when you call set state inside of React. It's the exact same way. So we have our current state which is this entire object right here and we need to return what our new state is. Normally, if you're doing this inside of React, you would need to spread out your current state. So you'd spread out your current state just like that. Make sure I wrap this in parentheses so I know it's being returned. There we go. And then we could update our count to be our state {dot} count plus one just like that. The nice thing about Zustand is essentially any time that you're updating your state, it's going to merge your current state with the new state. So this whole adding of the state on like this is not actually required. It automatically does that merging for you. I essentially now need to do the exact same thing with decrement and reset. So here we have our state and we're subtracting one. And here we're just setting our state directly to zero. So we can just change this to set zero. Again, just like we would work with React. And actually I need to make sure this is count of zero. There we go. So just like with set state, you can use the function or non-function version. And essentially, this set function works just like set state, but instead of updating individual variables, we can use it to update our entire state variable at once. We just have one variable in here which is all we're currently storing. So now I have this counter store. I have all of my default data stored inside of here. I have my type set up for everything. Now I can essentially go into my counter here and anytime I was using that use counter, I can replace it with my new counter store version. And I can get rid of all of my context stuff. I no longer have any context in my application at all. And as long as I wrap this in a fragment, everything else should work exactly the same as before. But now you'll notice we automatically get some nice performance wins in our application. So now you can see here, when I click the plus button, it's actually still rendering both of them as you can see they're flashing and increasing the render number. The reason for this is you don't actually get the performance wins of Zustand unless you make sure you only extract out the variables you need when you call the use counter store function. So if you call this function as is, it returns your entire context object or your entire store. So it's returning to us count, increment, decrement, and reset every single time. Now in our case, we're only accessing the count variable here and we're only accessing the functions here. So I want to be able to essentially narrow down only get the data I want. That way it'll only update when that data changes. You can do that by passing a function to use counter store. It'll take your entire state as the value you get for the parameter of the function. And then we just want to extract whatever we want. So in our case, we want the count variable. So now what essentially is going to happen is it's going to extract that count variable out and it's only going to re-render this component when this exact state variable changes. I can do the exact same thing down here, too. So I can say increment is equal to use counter state or counter store, sorry. Take in our state and I want to get our state {dot} increment function just like that. Now I'm going to do this for our other functions as well which is decrement and reset. Just like that. And now I'm making sure that I only update the code in this section anytime either of those three functions change. And since they never change, the code in this section should never re-render. So let's try this out. I can click plus as many times as I want, minus as many times as I want, reset, all these different functions. It doesn't matter what I do. You notice the only component re-rendering is the top one cuz the only thing ever changing is our count variable. And since these functions never change, we never have to re-run this at all. Now there's a lot of things about this that we can modify to make the code a little bit easier to work with and so on. One thing you'll notice is I have to write three separate selectors. The reason for that is because the way that it compares things is by doing a deep equality. So if I were to come in here and instead I return an object of all the things I want. So I return increment is equal to our state increment. I do the exact same thing for decrement and reset. Just like that. And then I extract them out using the rest op or the destructuring just like this. This code looks like it works exactly the same. As you can see I get my increment, decrement, reset function, and so on. But you'll notice nothing's actually rendering. And that's cuz we're technically getting an infinite loop. And that's because the way that this works is it does a deep equality. So it checks, is this object exactly the same as the object I got last time? And since a new object is being created every time this function runs, it's saying this is different. So let me re-render the component again. Then the object is different, re-render, and so on an infinite number of times. If you want to be able to get essentially derived data or create like an object of data to return all at once, you can do this by wrapping your entire function call in a call to the hook called use shallow. So let's just get that use shallow hook. Make sure that this gets imported from Zustand and we can wrap our entire function call directly in this hook. And now everything works exactly the same as before. You can see it's only re-rendering the bottom or the top section. The bottom section stays the same. And the reason that this works is cuz now it's doing a shallow equality where it checks each key of every single property instead of doing a deep equality where it's only checking to see if the object reference is exactly the same. Now, another huge benefit to using Zustand is that you can actually access your entire state independent of React or any framework that you're using. All you need to do is just access this use counter store variable anytime you want to access your store. So, in our application, we have this function called increment outside React. You can see when I click plus one, it still increments my count, but I'm doing this somewhere outside of my React component where I don't have access to my increment function. When I did this with context, I needed to pass my increment function in because there's no way to access it outside of my component. But, the nice thing is I don't need to pass this in anymore, and that's because I can access my store anywhere I want to. So, for example, what I can do inside this section for increment outside React is I can make sure it takes in no parameters at all, and I can access my store, which we called use counter store, and here I can call get state to get whatever my current state value is, or I can call set state to set whatever my count state is going to be, and I can set it to whatever I want. For example, here I could set my state to a count of 10, and now when I click this button, it's just automatically going to change my count to 10. You can see here, doesn't matter what my count is. I click this button, it automatically sets it to 10. Or, I could get my state, and I could call that increment function just like this. And now, it's essentially going to work just like the normal plus one button. They both are going to increment my count by one. And this is entirely separate from React. Technically, yes, I'm calling this from a click event listener here, but it's accessing this data without being passed anything from React, which is really nice cuz now you can access your state variable not only in any component or function you want, but you can even access it outside of your normal React components, which is very, very powerful for managing more complex state in larger scale application. Now, another thing you can do with Zustand for some best practices is how you actually store your actions. They recommend in the documentation to store your actions inside of your store directly alongside the data that you're storing for those actions. This is something that you can do if you want to do. You can see that's how we're doing it here. And if you do decide to go that route, I highly recommend essentially taking your actions and putting them in a sub object like this. So, we can take this actions object and put all of our actions inside of here. This just makes it a little bit easier for us to actually work with our code because now we essentially have this sub module. So, it's easier to see, okay, here's my state, and here's all the actions that I can perform on that state. And you can even break it out into like counter actions just like that. You can essentially take all of these, move those into there, and then we're just going to merge these two together just like that. So, essentially, now I have my actions right here, and here I have my state, which contains my state as well as my actions on top of it. And to do that, actually, I need to put actions with my counter actions. There we go. So, that's combining those two different things together if you want to go that route. That's one way that you can do it. And inside of our code, all we would need to do to change that to make it work is first here, call actions.increment, and up here when we're trying to get all of our different information, again, just make sure that we're getting that actions object. So, we can come in here, and we get state.actions just like that. Give that a quick save, and now everything works. We don't even need to wrap it in a use shallow because this object never changes inside this section. It's always the same object. So, we don't have to worry about that use shallow context. Now, I personally like to just keep my actions outside of my store, and my store is essentially a location just for data. So, what you can do instead is you can essentially create your actions like this. So, I can create an increment action that's going to set my store. So, I can say use counter store.set state, take in my state, and I can essentially set the value here for my count to be my state.count plus one just like that. So, now I have an increment function. I can remove that. And I can paste this down for decrement and reset. So, here we have reset. Here we have decrement. This is going to be a minus one. And for reset, we're just going to set this to zero just like that. Now, again, all these actions I can completely remove. I can remove all the actions here and here. And now, just the actual state information is what's being stored inside of here. I don't even need to use this set function at all. And then, anytime I want to increment, decrement, or reset, I can just make sure that I export these, and now I can use them wherever I want. So, we can come into our code, and where we were originally getting this data from our actual store, we can now just directly call the increment, decrement, and reset functions just like this. Those are being imported from that location. Same thing here. I can just say increment. There we go. And now you can see for the most part everything's working the same, but reset is broken. That's because here, I need to set my count to zero. There we go. That should actually solve all the problems I have. So, now you can see I can increment, I can decrement, I can reset, plus one from outside React. All of that is working exactly the same as before. And the nice thing is is now our actions are entirely separate from our state, and only our actual state stuff is what we get from our store. Now, that's essentially the basics of how you use Zustand, and for 99% of your code, that's all you really need to know. There's a few additional things you can do. For example, you can actually make it so that your entire store is persisted inside of some location. By default, you can persist to local storage, but you can change that location with custom stuff like the URL or other places. In our case, we just want to persist to local storage. So, what we can do is we can call the persist function from Zustand. It's a middleware function. And all you do is you just pass it your entire normal function that you have right here. So, you just wrap all your normal code inside this persist. And then, as a second parameter to this persist function, we're going to be passing it an object. Now, you see there's a bunch of different stuff I can specify on here like where I want to store things and so on. But, for ours, I just want to set a name, and that's going to be the name of where this is stored in local storage. And let's just say that I want to set this to count just like that. Now, you will notice we are still getting some errors. Essentially, when you want to use middleware and you're working with TypeScript, what we want to do is we want to make sure we call the create function first, and then we call essentially the return of that create function with all of our code. So, the only changes, you take your normal code, and you just call the create function one additional time right before you do all your persist stuff. Now, this data should be stored inside of local storage under a variable called count. So, let's just modify this. We're going to change the variable to eight, and I refresh my page, and you notice it reloads that data of eight. It persists properly, and everything works without me having to write any complex code to handle this for me. Another optional thing that I pretty much recommend for every use case of Zustand is that you use Immer or some others type of immutable state management library to make managing nested state much easier. Let's take for example that we have some additional state besides our count. Let's say that we have a user object. This user object can have a name property on it. We also inside this user object want to have an address. This address may have a street on it, and let's just say this street is Main Street. And let's say it's also going to have like a zip code or something like that. We'll just come in here with a zip code. There we go. So, now we have this brand new user object. Let's make sure that we type it out. with a string address that's going to be a street which is a string and a zip code which is a string. There we go. That gets rid of all of our type errors. But, updating this user object is kind of a pain. Let's say that we have a function that's going to be called update street just like that, and we want to update the street to a brand new value. Well, what we need to do is first get our counter store. So, we'll say counter store, and we want to set the state. We're going to be getting our current state, and we want to return a brand new state variable. So, we're going to be updating our user object, and we specifically want to update inside this user object the address property, and we specifically inside of there want to update the street property to our new street just like that. But, you notice we're getting errors. And that's because when I'm writing my state, you notice that it merges like our count here. We don't have to define our user or pass in our state because it merges that top level for us. But, anytime you have nested state, you need to merge it manually yourself. So, I need to take all my normal user code and merge that in here. And here, I need to take all of my address code, and I need to merge that in as well. When I do that, I now no longer get any errors, but you can see managing this is incredibly difficult and painful to do, especially as you get more and more nested code. And when you have large global state, it's very common to have deeply nested state objects. This is a huge pain to do. This is where the idea of Immer or similar libraries comes in. All we need to do is just like we used our persist library, we can wrap our code inside Immer instead. We don't have to pass along anything additional, and we just need to make sure the extra function call is there. And when we do that, we can now use Immer to actually make our state updates much easier to work with. So, in our particular case, let's go down to where we have update street. And before we actually do anything, we first need to install Immer. So, I can just type in npm install Immer. That's going to install the Immer library to use with us. And all we need to do is instead of manually typing out what our nested state's going to be, the really nice thing is is now I can just mutate my state directly, and Immer will do all the work behind the scenes to stitch everything together. So, I can say s.user.address.street is equal to new street, and that's going to automatically update my address for the street property only and leave everything else exactly the same. Now, another really nice thing is we can do the same thing with our count variables down here. For example, I can just mutate my count by saying count plus plus, which is s.count. That'll increment my count. I can do the exact same thing here where I want to decrement my count. And then, of course, down here we're already setting it to zero. And now you can see when I click plus, it's updating my count, minus is decrementing my count, and reset is setting me back to zero. So, you can see that Immer just makes it much easier to directly modify my state variables, especially when dealing with nested state cuz this one single line is much easier to read and understand than that super long nested bit of code that we had before. Now, Zustand and state management in general is amazing, but sometimes you just don't need it. In this video right over here, I talk all about why you may not need a state management library and how you can make do with other features instead. With that said, thank you very much for watching, and have a good day.
