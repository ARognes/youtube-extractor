transcript: They say it's the largest data leak  in history, downloading the profiles of every single WhatsApp user, that's  over 3.5 billion people, including you. Also in your hacking news roundup, police  bring violence to cyber criminals, and how North Korean infiltrators are larping as Mexicans. But first, by exploiting a super basic security  flaw researchers downloaded the phone number, name, and in most cases even the profile picture,  and about text, of every single WhatsApp user. This was made possible by the simple fact that  WhatsApp allows you to use a phone number to look someone up, giving you instant access  to this basic information. But to do this at scale researchers created a list of 63  billion possible phone number combinations, then they used an unofficial open source WhatsApp  client, to simply brute force the lot, testing every single phone number until they'd scraped  together a complete list of every WhatsApp user. And remarkably this was all done from a 'single  physical machine and IP address'. There was no rate limiting at all, that's the same principle  that locks you out of your account when you try to log in, one to many times, which should've  easily put an end to this. Instead researchers were able to grab personal information  at a rate of 100 million phone numbers per hour. And they made some pretty  interesting discoveries in the process, they put together a leaderboard of just how many  people use WhatsApp in each country. And whilst WhatsApp is banned in several countries,  that hasn't stopped people using it. In North Korea for example, there are a total of  5 people actively using WhatsApp, apparently. But in China, where it's also banned  there's millions of users. And those people could have a very bad day if their  government gets their hands on this data, because the Chinese government has a record of  arresting people for merely downloading WhatsApp. More widely though, the about  text field also has its problems, this allows you to share a short custom  message, publicly. But the researchers found that a surprising amount of government and  military employees are sticking their official email address in here, not the best for opsec.  They also found that, unlicensed self employed pharmacists, shall we say, were also using  this field to advertise their merchandise. Grabbing profile pictures en masse is also  slightly problematic. Lets say cyber criminals wanted to target someone for a sim swap  but didn't know their phone number, with a data set like this they could easily use facial  recognition to find their matching phone number. But there's a bit of a debate about whether  this really qualifies as the largest data leak in history, or even a vulnerability  at all. I mean - the ability to look up a phone number is pretty core to WhatsApp, so  is this really a bug or just a feature? Well, it's a feature, but, it's the lack of rate  limiting that's the issue here, grabbing user data at a rate of 100 million per hour, from one  machine with a single ip shouldn't be possible. But it'll come as no surprise that  getting Meta to even care about this, sounds like it was the hardest part of  this whole research, the researchers nagged Meta for almost a year with barely any  response. It was only when they sent Meta a copy of their research, and threatened  to publish it, did Meta suddenly wake up, immediately inviting them to join a conference  call, and kindly requesting them to postpone publication until they'd implemented  a fix, which they now have, finally. Exploiting WhatsApp is one thing, but have  you ever thought about hacking a bank? Well, with today's sponsor you can start your  ethical hacking career by doing just that, that's the hands on approach  you can expect from TryHackMe. Forget boring books and complex tutorials, TryHackMe is the one learning  tool I wish I had years ago. Let's start their cyber security 101  course where we get to hack that bank, well a fake bank, but a bank nonetheless. It's all done with a virtual machine  that spawns right in our browser, there's nothing to download and  no setup at all. Our mission is to search for an admin page that  the bank hasn't properly secured. And we'll be doing it using 'Gobuster', it'll  scan the bank's website for hidden pages which might match possible names found in a wordlist.  So in our VM let's open a terminal and run the command. This looks promising, it's a page called  'bank-transfer'. And if we head to that in our browser, something tells me we could exploit  this portal to make ourselves a lot of money, but I'll let you guys give this a  go to find out what happens next. And this is all just the first lesson,  TryHackMe gives you a structured roadmap, helping you level up. There's plenty  of learning paths to choose from. If you get stuck on something, you have 'Echo', your AI assistant ready to point  you in the right direction. TryHackMe is the worlds largest hands  on cybersecurity training platform with over 6 million users. So get started  for free today, using my link in the description. And for full access, you'll  get 25% off TryHackMe's annual plans. Click the link in the description  to get started for free, today, and using my code you'll get  25% TryHackMe's annual plans. Next up, a monster of a SIM farm  has been taken out by Europol. The great thing about Eastern European  raids is these guys don't hold back, here's Latvian police tearing into this criminal  enterprise. With the bad guys finding out the hard way that a glass door won't hold police  back long enough for you to destroy evidence. But in fairness it would've taken quite  a while to destroy this much stuff, this was a true behemoth of an operation. Police  arrested 5 suspects, who didn't put up much of a fight. With a Latvian government hackerman,  equipped with standard issue hacker hoodie, quick to shutdown the servers all whilst  preserving evidence. This was part of operation SIMCARTEL, 1200 SIM boxes were seized,  with each one holding dozens of SIM cards. With each card then being rented out via  gogetsms dot com. The premise here is simple, scammers need to create social media accounts  en masse to run their scams, but pretty much all platforms nowadays require a phone number  to sign up. Which is where gogetsms comes in, here you select what country your need your  SIM card to be from, the service you'll be using it for - like Facebook, then you rent  the number out for as little as 10 minutes, which is all the time you need to  receive that all important 2fa code, create an account, then you're free  to go on and scam someone's grandma. But since a number can only be registered with  a service once, this creates a constant churn of SIM cards, with the operators of the SIM farm  constantly needing to switch out old sims for new ones, which explains why they kept a stash  of hundreds of thousands of SIM cards on hand. Gogetsms dot com, is now seized, but it *was* a  totally clearnet site, claiming to have over 10 million numbers available from 80+ countries.  And Europol says it was used to register more than 49 million accounts for illegal  activity. But SIM farms do have other uses, with this farm being used for a whole  array of creative phishing attacks. And someone is going to be very disappointed to  hear about this raid, because SIM Farms are not cheap to set up, I found each of these SIM boxes  on sale for around 2000 euros, and given 1200 of them were seized that's well over 2 million  Euros worth of gear. This is big business, as evidenced by the Porsche parked outside,  which is now property of Latvian law enforcement, as well a few other vehicles that were seized  and hundreds of thousand of Euros in cash. Next up, North Koreans are using  brown face filters to get jobs, apparently. The setup here is nothing new,  for years North Koreans have been trying to land remote jobs at Western companies, all  in an effort to make money for their supreme leader so he can buy expensive watches,  Gucci handbags, and Nuclear weapons. But the first hurdle is getting past the  job interview, which thanks to sanctions is impossible under their real identities. So  the North Koreans have to commit identity theft, or in some cases they'll straight up buy  identities from willing participants. Then they have to try their best to pretend to be  that person in the interview. The crypto company Bitso has a lot of experience with this. Crypto  companies are a common target for North Koreans, probably because there's the possibility of  later stealing the company's crypto assets, which is a separate side hustle that has  been unbelievably lucrative for them. So, Bitso recently advertised for a software  engineering job, with one prospective applicant being 'Mateo'. He's from Mexico, apparently.  He rolled up to the interview looking like he'd just walked out of Madame Tussauds. There's  just something seriously uncanny about this waxy looking dude. If you look closely his mouth  movements just don't fit his speech, and if we go frame by frame you can see his teeth just don't  move with the rest of his face, they stay still. Clearly some bad AI filter, but the easiest  way to catch out a fake Mexican is just to ask them if they speak Spanish which Mateo  couldn't. So, unfortunately for Mateo on this occasion he didn't get the job, and his  profile quickly disappeared from LinkedIn. In other examples the North Koreans ditched the  crappy AI filters, but made other mistakes, this guy forgot that he was meant to be “Julián” from  Colombia, accidentally leaving his name on Google meet, as some other guy he'd stole the identity  of. In all examples the North Koreans use a state issued headset, and interestingly they all change  their background. Probably to disguise the fact they're working from an office along with half  a dozen other North Koreans larping as Mexicans. And whilst this is all genuinely hilarious, one  interview clip shows a North Korean tweaking, kinda anxiously shaking uncontrollably. And to be fair it must suck  to be in this situation, it's not like they have any choice but to work  for the North Korean government in some way, and this is better than working on some  communist potato farm. But for Alfredo here, it looks like his career in scamming  might be over because it's hard to get hired you're famous with recruiters on  LinkedIn but for all the wrong reasons. As always thanks for watching and I'll see  you in the next video, have a good one!
