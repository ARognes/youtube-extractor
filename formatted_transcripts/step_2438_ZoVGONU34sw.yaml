 fall either fall off of you or you will lose interest in it. And it's the most effortless natural way of living because this is human nature. Human nature is not does not delight in being conflicted, confused, angry, and resentful, hateful towards the world all the time. Human nature is simplicity. Human nature is love. Human nature enjoys truth, no matter how painful it can be, is always glad to experience truth. And if someone else is not interested in this, they just won't be interested in you anymore. So, you don't have to do anything. You just have to live according to your nature. And that only because you want to do it, not because you have to do it, because it's just peaceful. And everything else takes care of itself. And this constant anxiety of pleasing others, pleasing situations, pleasing the idea of oneself has of certain things, of expectations, of hopes. This constant anxiety and and disappointment and hoping and being frustrated as a result, or being excited by it only for a short time. All this can go. All this is is going to naturally stop. So, I just wanted to affirm you on this. This is indeed uh what you are feeling and this is there's nothing wrong with this. This is your nature calling you. Your nature of reason, your nature that is yearning for peace and then already really has peace, but wants to experience it. This is where philosophy helps us. This is all that philosophy is. It's a set of suggestions for you to hear, for you to try, for you to experiment with it, and for you to naturally incorporate into your life if it makes sense to you. And it's an effortless, natural, peaceful, still, simple way of living. No more complication. No more anxiety. No more uncertainty. No more confusion. No more frustration. No more expecting things from others only to fill a hole in oneself. Total self-sufficiency. Total love for self and everyone else. No expectations, no frustrations, no demands, no fear. All that it requires, it does not require intelligence, it does not require you to be smart, it does not require you to be rich at all. All this work requires is dedication. Simply showing up and not allowing distractions anymore. And the rest, once again, will take care of itself. You only need to show up to the classroom. The teacher is the teacher, not you. It's a paying of attention. Paying for a certain amount of time. And then no more paying anything to anyone. So, I invite you to do this to start today in a small way. Cut out Cut out one distraction. Cut out being a distraction one time today to someone else or to something else. And there are simple simple other videos here to watch to get started in this. There are many reading recommendations that I uh always put up on the website. The link is in the description, also. And we have even have a whole Discord server, a little community from like-minded people all around the world that feel the same way, that are taking this time, that are dedicated in this way to finally live like this. Can join that as well. Um these are people who are not looking to distract anyone and are not looking to be distracted and are simply talking about timeless and universal philosophical ideas to incorporate into their lives and to make sense and to simplify. But, even outside of that, the whole world is your resource. The whole world serves you in this. Your own nature is what is making you yearn for this. So, everything is automatic, everything is effortless, and and intuitive already. And uh you are fully within your right and within your nature to disappear for a while, to come back, right?
