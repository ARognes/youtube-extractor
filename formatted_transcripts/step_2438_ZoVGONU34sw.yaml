b to that at all and keep gaining weight. Just like that, we can go into any situation spiritually also and say, "No, you know, you can do that. You can be around me. You That's totally fine. I don't need to run away from you. I don't need you to stop any doing anything, but I will not be participating in this." I don't want to think about other people so much and I don't want to talk about other people so much. So, gossiping at the at the workplace or in the family, I don't want to participate in that. And you will see that your simple simple presence, once this is established, your simple presence actually quiets everyone else down. When gossip starts and you're just not participating, you're not running away, and you're also not looking at them like this, like you want them to stop. You're just there. Okay. You're just listening. All right. But no feeding into it. No real response. No saying, "Oh, I can't believe they did that. Tell me more. What did you do after that?" It's a simple calming presence. And these are the people we love being around most, actually. He's calm, confident, often silent, but also when there's something to say to say it with with love and understanding and appreciation. These are the people we love being around most. And this is exactly the person that that we want to be. The personality that we want to have. How is this going to be cultivated? In the midst of the opposite of it, when we don't have the strength of it, when we don't even have the understanding of of how to do this. When philosophy is saying, "Come over here, and there are many suggestions I can give you and many things you can try out, but it's not in the middle of where you are. I need you to come to the classroom. I need I need that nice quiet space where we can concentrate and pay attention to these things that really almost no one ever has told us about. So, these are new things. They need our concentration, our attention to get established. Once they're established, 