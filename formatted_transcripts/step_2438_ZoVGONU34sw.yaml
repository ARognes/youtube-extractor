transcript: I want to make a video today for everyone who needs to hear it, for everyone who no longer wants to lay that which they know is absolutely important and necessary. And I want to affirm you that taking some time away from everyone and everything is not only okay, but it's fully your right and it's actually the correct and best thing to do. But for some reason we have this idea, this belief that our constant presence in other people's lives is a show of love. It's a show of support to be able to say, "I am there through everything. Whenever you need me, I am always there." And I'm always present in your life. This seems to be a point of pride. But actually am I doing the loving thing, like being present in the way that I am? All confused. All full of habits that I know are not serving me, are not serving anyone around me. But I just can't get to them. I I can't seem to find the time and space to understand what's going on and and to work on all of that. Simple example, you and I could be best friends and if you finally decide that for whatever health reasons or anything that you want to go on a diet, you want to lose some weight. Uh and I'm always the friend who comes around or who asks you to go out with them to eat things and and to and and enjoys fast food or and snacks and all kinds of things. At some point, sooner or later, you would have no problem telling me that, "Look, this is the right thing to do. There's no doubt about this. I just cannot engage in this activity anymore. I'm not asking you to stop. But you cannot expect me to do this with you and when I decline to call me a bad friend, no one has the right to do this. So there we feel able to say because we absolutely are sure that that's the right thing to say that look, I for a while, at least for some time, I will not be participating in this. Do not call me about this. I simply cannot do this with you. But for some reason, when it comes to spiritual things, for the lack of a better word, right? All our beliefs, our ideas, our opinions, the habits, the things that keep us acting and moving a certain way, when it comes to those things, we feel like we have no right to excuse ourselves from life, from our friendships, from our regular environments and ways of doing things in order to take some time and to fast on those, to give ourselves a diet away from all the habits and all the influences that keep us the way we are. In that way, we always allow the friend who is always gossiping or or always talking about something that is not so important, being a distraction, being a an escape also many times from that which, even though it's difficult, needs to be thought about. Needs to be dealt with. And we know we need to examine some of our most core beliefs. But we keep accepting this outside influence from other people. Can be your family, your friends, your co-workers. There we do not say, "Look, I need to go away for some time." But to say this here is actually the most crucial thing to do, even more important than physical health. Because what does it matter if the body is in top shape, but we're walking around with that body completely confused, desperate, conflicted, angry, resentful, disappointed, frustrated at everything? And so there for some time we need to say, "I need to be away from you." And with you I do not only mean people. Everything that has an influence on us. This can be your TV shows, your podcasts, the kind of books you're reading, or again, the people you're around. And we have to see that this is true, see that this is necessary, just as necessary as it is to be healthy physically. We need to come to a point where we say, "Look, this is happening. I'm doing this. Family, friends, regular habits, I'm taking a step away. And I will take my time. This needs to happen as long as I need it to happen. And uh if any of you feel that this is not loving, that this that I somehow owe you something or that I'm obligated to uh not take this time and instead spend this time with you, with our regular habits and our regular activities, then I'm sorry, but this is not the loving thing for you to say, and for you to do, and for you to expect of me. But no one tells us this, no one gives us this encouragement and this affirmation to be able to do this, so we keep faltering. We keep not being confident enough in being able to say this. We wait for the doctor's note to go do the diet, but no one's ever going to give us a doctor's note on this. This authority, this prescription needs to come from the self. And in fact, that's part of the work. That's part of the work. To be able to say, "Look, I know what's important. I know what comes first. Truth comes first. Wisdom comes first. Pure religious, God comes first." It's just a synonym for these things anyway. And I need to go there. I need to be there to strengthen myself. Because actually the most loving thing to do is for me myself to be right. For me to be an influence on other people or or on environments and and animals and anyone anyone and anything that's part of my life. If I'm not right, how is my presence ever going to be a loving thing? How is my involvement in anyone's life ever going to be a a loving act? And so once I've done the diet, once I've become healthy, and once I've also found the confidence and the resolve to stick to what I know is right and healthy, I can come back to the friend who likes to go out, who likes to eat, who likes to drink, who likes to go to uh restaurants and say, "Look, today I can eat a little bit. Uh next time, you know, I'm today I'm not eating anything. I'm just going to sit here with you. I might have a drink. I'll still enjoy myself." Um but don't expect any more of me. And then actually we are that influence to say, "Hey, let's consider maybe going to this place instead. Much healthier. Or you know, why don't you come over and I'll and I'll cook something for you. In my time away, I've learned how to cook healthy and 