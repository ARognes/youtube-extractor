t you can go get more. So you go get, you know, get your dopamine hits and get some life and avoid the death. And so whenever you focus on something negative, whenever you react negatively, it creates a negative feeling. And because the body speaks the language of feelings, now it's paying attention. You've basically handed it a threat on a silver platter and said, "Hey body, there's a problem here. Send me into survival mode non-stop. Give me a whole bunch of fear, worry, and anxiety so that I could be motivated to get rid of this problem. But the problem is it's like it's really good at running away from grizzly bears but not really running away from like threats. It's not good at dealing with thoughts because you can't escape your thoughts. So what happens is we get stuck in this negative feedback loop of death where we keep reacting to the negative thoughts. They keep feeling worse. So our body keeps saying, "Oh my god, there's even a big survival." Like more and more grizzly bears are popping up all around you and they're attacking you. And so it's like, "Okay, we need more energy, more energy, more energy. Use all of your energy." And so all of your resources get consumed into the present moment. And over time, you just you get drained of your life. You become exhausted, overwhelmed, easily overstimulated. You don't have the energy to do nothing. You get depressed and then you die. And that is what happens to people all the time because they don't realize what is actually happening. They don't realize that their mind and their body, their feelings and their thoughts are working together in a system to keep them alive. and their ego, their sense of identity is getting in the way of that process and basically malfunctioning the whole thing on accident because the ego says, "Well, there's something wrong with me." And so every time a negative thought comes, it threatens that identity. And so you get shocked with stress chemicals. Oh, no. I don't want this. I don't want this. I don't want this. I don't want this. But it's happening. It's happening. It's happening. So, we just basically become a powerhouse for stress chemicals and we stress ourselves to death. But it's all because we don't know how to stop reacting to those negative thoughts. Because the moment you stop reacting to your negative thoughts, you stop creating negative feelings about them. Your body doesn't know anything other than what you as the conscious mind tell it. You as the ego are telling the body to either freak out and give you fear, worry and anxiety or to be completely calm and at peace. And this is great news because if you think that you have to stop and get rid of your negative thoughts to be at peace, you will never be at peace. Another misconception, you try to get rid of your thoughts. [snorts] You try to stomp them. You fight them. And from this perspective, what do you think this does to your survival mechanism? It's saying there's a problem here. I'm trying to get rid of it. I'm really, really trying to get rid of it because it sucks, but you're just keeping yourself stuck in survival mode. Doesn't matter if you're trying to get rid of it. Doesn't matter if you're trying to do the right thing. You're either sending yourself into survival mode or you're not. And you send yourself into survival mode by reacting to your negative thoughts as if they are a problem. You go to war with your own mind. And then, you know, do you ever question who's going to win this war? I mean, who's even fighting it? These are some serious questions here, Buckoo. But think about how tricky this can be. Like, if you get a negative thought and it's really disturbing you, it makes you feel uncomfortable to be in your own skin. It's really hard not to react. And you would think that, well, of course, I'm reacting negatively. I [snorts] have to. This makes sense. But the reason we're reacting negatively is because we're so attached to our ego identity, our sense of self, that well, it feels like we are being attacked. But you have to allow that ego to crumble. Those negative thoughts, the suffering to break down your sense of self, of who you believe you are because it was just a prison to begin with. It's like wearing like a monkey wearing a tuxedo. The monkey wears the tuxedo to fit in with society to make sure it's like, you know, acceptable. It doesn't want to, you know, seeing its balls hanging out all the time and people make them making people uncomfortable. But eventually the monkey grows and it expands and the tuxedo gets too tight. So it has to take off the tuxedo and maybe just maybe put on a larger size. Your sense of self-identity has to expand to also include the darkness that is inside you and has been inside you the whole time. And if you think that there's something wrong with you, you're going to continue to fuel shame, which is going to trigger that feeling anytime the negative thoughts come up and you're going to stay stuck in low vibration. You're going to stay stuck in negativity. But there's nothing wrong with you. It's completely normal. you just haven't maybe been exposed to the darkness all that much, to the evil in you. And trust me, it's there. Like if you think that you're a good person, right, that's your ego identity. No matter who you are, there's also evil demons in you. And they are also equally part of you. It's just they're not in your conscious. They're in your unconscious. They're in your shadow. And that is where the negative thoughts come from. And so they come up from the depths and they shock your ego identity and your ego starts to freak out and so then your body starts to freak out and then you know bad things. One easy way to think about this is um is a character I like to call the monster mind. Think about it this way. As we grow up we develop an ego, a sense of self-identity that becomes more and more solid as we age. So, we take on all of the beliefs and all of the ideas that allow us to fit in with our families and our friends and society at large. But there's a cost. Every personality trait that you latch on to and you say, "This is who I am, and this is who I want to be." The equal and opposite trait gets cast into your shadow. The ego, imagine like a mini sun, casts a shadow with all of those rejected parts of yourself. And if there's a lot of them, it turns into this Frankenstein beast of all the parts of yourself that you've rejected. And it becomes the monster mind. And that is the source of your negative thoughts, of your fear, of your worry, of your neurotic holding patterns, of your addictions, your self-sabotage. Think about like um Dr. Hyde and Mr. Jackekal. Is that what it is? One guy is a normal, you know, upstanding citizen. The other one is some crazy beast. And so to you have a crazy beast. And so that crazy beast is incredibly shocking to the ego, but it's also equally incredibly necessary because the ego limits you. It limits your potential. And down here in the unconscious, the monster mind, that is where the gold is, the gold of your potential, the gold of your life. All the amazing things that you could ever desire in this life are found in the darkness. Because those lost parts of yourself, if integrated consciously, you expand to become a more whole individual. That is what shadow work is. It's realizing what are the parts of yourself that you have rejected and be beginning to consciously integrate them into your ego. But if you don't get out of the first phase of just reacting negatively to the monster mind, of just reacting negatively to your thoughts, you'll never get there. You'll never realize that your negative thoughts are actually here to help you. Your body is trying to guide you. The monster mind is not an evil enemy, but if you treat it as an evil enemy, it will be. And so what you begin to find is that your negative thoughts have a specific pattern to them. This not just random. It will never be random. You will have specific negative thoughts about specific things that you need to integrate into your conscious identity. And once you integrate that trait, your negative thoughts begin to subside naturally. But we cannot get to that place where we can do the real work if we're just reacting negatively to our thoughts all the time. So this is very useful to begin preparing you, planting the seeds to realize that okay well you can ask yourself how are these negative thoughts serving me instead of how are they destroying my life? That's what reframes it in your mind so you could transmute that darkness into light instead of just suffering miserably. Because so long as you're reacting to your negative thoughts as threats, am I crazy? Is there something wrong with me? Every time a negative thought comes, it will just perpetuate the negative cycle. So right now, we're shifting our mindset, our attitude to realize that, well, there are no such things as demons. There are only angels in disguise. And you might not see that at first. You might not see how your negative thoughts are helping you. But over time, you begin to shift your attention and you begin to use them instead of being used by them. And so the first practical thing we have to do, this was just preparation, getting you a little idea just to help you realize, okay, you're you're not going crazy. It's all part of the journey. But you will go crazy if you don't stop reacting to the thoughts and if you don't eventually do the work. So, for example, the people who fall and and go all the way down, whether they're homeless pooping in buckets or where they get, you know, stuck in a mental hospital or where they where they they go to prison for killing people or whatever. The reason that happens, the monster mind takes them over and consumes them and consumes them and consumes them until they do something terrible, whether to themselves or whether to another person. The mastermind hijacks their life like a parasite and forces them to do evil things. And if you've ever experienced an addiction, you know what this is like. You're forced to do it. You don't want to do it necessarily, but you're doing it anyway because something is hijacking your attention, hijacking your actions, the feeling, and then you just you're along for the ride. And that is because there's some part of you that you have not integrated some trait, some way of being. And until you do that, it's very hard to overcome the addiction. And you certainly can't do that if you're reacting to the addiction. Oh, I'm such a bad person. I'm such a bad person. I hate this. I hate this. I hate this. I hate this. I hate my wife. I hate everybody. I hate it. That whole psychological drama does nothing but just steal your life. So if you ever find yourself doing that, stop it. And this is how you're going to stop it. You have to change the way you react to your thoughts. This is step one. You got three ways you can react. You can react negatively, you can react neutrally, or you can react positively. If you react negatively, it means it sends you into survival mode. You either fight your negative thoughts, you run away from them, you're scared of them, you're afraid of them, you avoid looking at them, you suppress them. So, that doesn't work. You can't do that. To react to them neutally means to not react at all. And this is a very, you know, powerful way of dealing with your thoughts. You might not be able to transmute them into positivity at first, but here's some methods that we can use. And this is what I teach you in the monkey mind mastery dojo. Are you ready? To react neutally means to spend a little bit of time and face those negative thoughts. Just to look at them. It's not even a method. It's literally you're just looking at them and you're not avoiding them because your negative thoughts are like a monster under your bed. If you're not paying attention, if you don't look at them and face them, then the fear stays in your imagination and you ruminate on it and you ruminate on it and you just suffer endlessly. But you go and take a moment to look under your bed, you realize there's no monster. Well, the illusion dies. You stop ruminating on it because you realize it was just in your imagination. Same thing. Your negative thoughts have no power over you. They're just thoughts. You project meaning onto them. And by the meaning you project determines how you react. And how you react determines the whole cycle. And if you stop projecting meaning onto them, you stop trying to figure it all out. You stop trying to think about what this means about you. And you just look at them. You just notice them. You just remain aware of them. You just observe them. And you got to take some time to practice this a little bit each day because if you're going about your day, there's too many distractions. You're just going to be too easily pulled all over the place by those thoughts. And so you have to take the time to change the way you relate to them. And that is one way. Another way is simply by breathing. This is a good way to, you know, transmute that darkness into light. Because think about it, if you have the power to relax your nervous system through the breath, you could shift out of survival mode on command. And if you shift out of survival mode, the whole process you undermine it. You undermine the whole negative cycle because it's the survival mode that's causing the whole problem. Your body is forcing you to hi is hijacking your attention and causing you to hyperfocus on the problem as a survival mechanism. But if you tell your body, well, there's no threat. The negative thoughts come up, you react differently. You don't react negatively. Your body learns, oh well, that was once a survival problem, but it's not anymore because obviously they're not reacting as if it were. So, it must not be a problem anymore. Stop giving them anxiety. Stop giving them worry. Stop giving them fear. And as you stop feeding them, they just naturally dissolve over time. But think about the main point. You just have to change the way you react to those thoughts. And that takes training. That takes skill. It's not like you're going to magically be um a master at dealing with your thoughts if you've been reacting negatively to them for a long time. So there's many things. There's the practical aspect of just dealing with the mechanics of your mind. And there's also the psychic attitude adjustments that we need, positioning ourselves differently in relationship to our negative thoughts so they stop being such a problem for us. And all of these things, they come together to take us out of survival mode and into relaxation mode. Because when you stop reacting to your negative thoughts, your body stops sending you into survival mode about them. Stops treating them as problems, as threats. But from an attitude perspective, you have to end the inner war. You have to stop fighting with them. You have to stop attacking your thoughts or stop feeling like they're attacking you. Even though, well, it seems that way, but that's not true. Your negative thoughts are just a message from the unconscious telling you like a a check engine light that something needs to be addressed. And if you don't address it, well then there's going to be big problems. But in order to address it, like the shadow work we mentioned earlier, you have to stop getting consumed by those negative thoughts first. So the practical mechanics are the first stage and then over time you can begin doing the deeper research once you found a sense of freedom and safety and relief and you can deal with your thoughts normally. Like for example back in the day where I started to do this work, I could not have ever done it until I learned how to deal with my thoughts properly to, you know, stop them from affecting me so much. Because when you're being consumed by your thoughts, when you're in survival mode, all of your mental resources are being drained. You don't have the faculties. You don't have the energy to do all that much. So, you have to take your power back. That's the first stage. And this is how you do it. You stop reacting to your negative thoughts in the same way. And you practice this a little bit each day. And you begin to pay attention because it's not going to be perfect at first. You're going to still react negatively. It's still going to happen. That's not the measure of progress. The measure of progress is how negatively do you react. And when you react negatively, how long are you stuck in the spiral? And so what happens is that as you change how you react, you catch it more and more and more. The more aware you become of these patterns, of these tendencies, you'll be ready for them. And so when the negative thoughts come, you can find yourself start to spiral and then you can just naturally dissolve it. But you have to know the methods to do that. And I've showed you a few here. simply observing your thoughts simply by changing what you focus on. Whether it's the breath or just literally anything else because your mind can only focus on one thing at a time. If you want to stop focusing on negative thoughts, you got to focus on something else. But you can't run away from them. You can't fight them. You have to learn how to relax your body to remain calm and at ease even if negative thoughts arise. And that is where freedom is found. I am Ray and if you want to learn how I became free and developed a stable baseline of peace after seven years of dealing with negative thoughts, then come join us in the monkey mind mastery dojo. I'll show you everything you need to know and you can join us for live weekly calls. Much peace and many blessings. And remember, just be
