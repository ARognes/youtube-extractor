transcript: Whoa, it looks like my my forehead is huge carrying all that knowledge. I am Ray and you probably think you're going crazy. But it might just be your intrusive thoughts. You see, this is a very reasonable question that we ask ourselves when we're getting crazy thoughts. We start to wonder, well, am I going to be like this forever? Is there something wrong with me? And this is where shame can creep in from down below and grab our cheeks and pull us down under to Australia, God forbid. Now, personally, I wish I would have had this video and these videos back in the day because it would have saved me so many years of suffering. Because when we're stuck in the thick of it, when our mind is going crazy, the mind storm, it's very hard to have clarity. And if you don't have clarity, you don't know what to do. And so it's very easy to spiral out of control. But once you get an idea of what's actually going on, luckily the solution is very simple. It ain't that complicated. The first thing we got to understand that all it is is a thought feeling loop. My eraser tried to attack me. Did you see this? I caught this on camera. I will be pressing charges. You have a thought and you react to that thought and that reaction creates a feeling and that feeling fuels more thoughts. The stronger the feeling, the worse the thoughts get. And what determines how strong the feeling is? Well, it determines how strongly you react. So, all we got to do is break that loop and over time the thoughts begin to diminish. Now, here's the problem. If you think you're going crazy, it's going to shatter your identity of who you believe you are. So, you have an ego identity right now, and that is the person you believe yourself to be. And when you get negative thoughts, those thoughts begin to poke at that ego. For example, let's say you have a self-image of being generally speaking a normal human being and then you get a negative thought that is very abnormal and that basically threatens your whole idea of reality because well what happens is that we perceive reality through this ego box. So what it is, it's basically a whole bunch of identities and stories and beliefs about who we are, about what we think about the world and other people. It basically like imagine a campfire. You got a little campfire going on, but all around you is a dark forest that well there's could be monsters out there. It basically is like a little life raft on the ocean of chaos and it helps us kind of not freak out all the time. It gives us a sense of direction, right? So when that sense of direction is threatened, everything begins to fall apart. That's why, for example, you see people attack other people's religious beliefs and people freak out and get really freaky. This is why you're not, it's not as simple as, oh, my beliefs are on the line. It's oh my entire reality is being threatened by this person. I have to kill them. And so that is what your negative thoughts feel like are doing to you. It's like a threat to everything you've understood about the nature of reality. Now there's a whole big problem that well your ego never really gives you a full sense of safety. It's a false sense of safety. The ego has to fall away and be built back up and fall away, you know, many, many times. But what happens is that sometimes the negative thoughts, they come in and they shatter everything in one big fell swoop and you're caught in the underworld, which is basically just chaos. You don't know what is true. You don't know who you are anymore because the truth of what is happening and your perceived understanding of reality are not compatible. For example, if you're having the thoughts of a serial killer, but you think that you're a normal human being, well, that's going to mess with you a lot. Now, one of the biggest mistakes that you can make in the beginning and as you're going through this journey is trying too hard to figure out why you are like this. Don't ask yourself why. 