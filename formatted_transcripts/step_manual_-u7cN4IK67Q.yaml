transcript: '{"content":"\n[0.0s] The really interesting thing about this\n[1.48s] is that both dissociative identity\n[3.6s] disorder and depersonalization\n[5.8s] derealization disorder are heavily\n[7.84s] heavily heavily influenced by trauma. In\n[10.28s] the case of these frank disorders, the\n[13.2s] trauma is so severe that it makes\n[15.88s] certain changes within us that cause us\n[18.0s] to develop multiple personalities,\n[20.12s] dissociative identity, depersonalization\n[22.28s] derealization. But what is really\n[24.12s] interesting about this is that there are\n[26.16s] subclinical versions of this. So, if you\n[29.68s] are someone who is Let''s say like you\n[31.72s] are able to be your best self in one\n[34.6s] situation, but in a another situation,\n[37.2s] you''re like not able to bring that\n[39.44s] person out. The neuroscience involved in\n[41.92s] multiple personalities and dissociative\n[43.52s] identity disorder is the same\n[45.24s] neuroscience involved with being unable\n[48.04s] to be your best self at work. Similarly,\n[50.56s] depersonalization derealization\n[52.8s] disorder, when we get disconnected from\n[55.16s] ourselves, when we don''t feel an\n[57.16s] internal driver, when we don''t feel the\n[58.84s] passion from within, then it is very\n[61.8s] easy to become amotivated. So, when we\n[63.68s] get to like unreal or absent self,\n[66.32s] emotional or physical numbing, it''s like\n[68.16s] very hard to act. And when you work with\n[70.28s] these people, like that''s their problem.\n[71.84s] Like they can get up and they can go to\n[73.32s] work every day, but there''s no sense of\n[75.64s] zest in life."}'
