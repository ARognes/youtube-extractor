transcript: They watched hundreds of hours worth of spicy  content, reduced their prison sentences, and even gave themselves a million dollars. Here's  what happens when inmates get admin access. Also, in your hacking news roundup, the Indian  government wants to make it impossible to delete this app and hacking a radio station.  Subscribe to my channel at youtube.com/ But first, this story begins in Romania in a prison in the  city of Dej. They provide inmates with a system of kiosks, each equipped with a mouse and keyboard,  where inmates can log into a platform run by the Ministry of Justice. Here, they can do basic  things like see details of their sentence and add money to a prison balance that they can then  buy things with in a small prison shop. But just like any good kiosk, it's only a matter of time  till someone decides to mess with it. This is where we meet Aurel. He's been serving time for  his part in a money counterfeiting operation. Somehow Aurel managed to grab credentials belonging  to the prison's former director. How? Well, initial reports from Romania's Union of Prison  Officers said that a different inmate who claims to be a member of Anonymous apparently was  able to escape the software running on the kiosks by simply spamming the start menu.  From there, he explored the operating system, finding a shared printer service which somehow  exposed those credentials. There isn't a technical explanation here, sadly, and the union later said  that they just couldn't reproduce this anyway, leaving the mystery of how the creds were grabbed  unsolved. But regardless of where they came from, the creds granted unrestricted admin level  access to the platform used across virtually all Romania's prisons. However, his fun only began  when he was transferred to a prison in the south. With his newfound powers, he had total access to  the personal details of every single prisoner. But Aurel has more important plans with logs showing  that he spent quite a bit of time browsing corn spicy content the hub. And he didn't keep this to  himself. Reports say that he granted access to his fellow inmates with in total prisoners spending  over 300 hours logged into the system. And I I think we know how most of that time was spent.  But once the important stuff was out the way, Aurel turned his attention to data alterations.  in particular his prison balance deciding that the one thing this prison needs is a bit of  quantitative easing. The official reports say that this quite literally involved adding zeros to the  end of deposit amounts. Ironic given that the guy was in prison for financial crime. Over 15 inmates  in prisons across Romania benefited from this in some way. One inmate had the equivalent of over a  million dollars deposited right into his account. But prisoners were also able to reduce the lengths  of their sentences. This involved modifying what they call earning days, as in reduced punishment  earned through work or participating in education. But less than two months after all the fun began,  financial auditors noticed certain inaccuracies, and the party came to an end. As you might  imagine, this has been a source of embarrassment for Romania's Ministry of Justice, especially  because their platform is only a couple years old, and since it was introduced, there have been  several reports that it's at least a little bit buggy. The Ministry of Justice has put  out a statement in which they seem a little bit frustrated by how much media attention  this is all whipped up, claiming that the IT incident in question doesn't represent a data  breach, but rather just a temporary impairment of the confidentiality and integrity of some  data sets. Sounds awfully like a data breach. A full investigation is now underway, but as  for Aurel, he was nearing the end of a 9-year prison sentence and was meant to be released just  next month, but now that doesn't seem so likely. Next up, India wants everyone to use their new  app. This news was broken by Reuters revealing that the Indian government sent a secret order to  phone manufacturers including Apple, Samsung, and Xiaomi, privately asking them to preload all new  phones destined for India with a new government cyber security app. And worse, the app must be  impossible to delete. And for phones already in use, a mandatory software update would force  the app on everyone else. With manufacturers only given 90 days to comply, the government's made  a website for their new app. It's not the best designed site in the world. For starters, if we  want to know what this app is even called, we've got to zoom in right up into the logo up here.  Sancharati translates to Telecom Helper. Not the most catchy name, but I'm sure it makes way more  sense in Hindi. The website has the kind of awful design only a government could come up with. And  the scaling ain't so great on my ultrawide. Let's avoid a UI induced aneurysm and take a look at it  on the app store. It's already live and has been willingly downloaded by over 14 million people.  On the surface, it does try to solve a genuine problem. Whilst India has a bit of a reputation  for scamming the rest of the world, do not read. Indians scamming other Indians is actually way  more common with cyber fraud having doubled in the last year. This new app makes it easy to  report malicious texts and phone calls. You can run IMEIs through it to see if a phone is stolen.  And if your phone is lost or stolen, you can remotely block it. But it doesn't really matter  what the app does. Making any app mandatory is a very bad idea for several reasons. Firstly, this  is coming from a government that is known to abuse technology when it's convenient. Take one example  from a couple years back when they quite literally shut down cell service for 27 million people all  over a manhunt for a single guy. The potential for the app to one day be repurposed for surveillance  or some other kind of evil is a bit of a worry. And if it's as badly designed as the website, it  could introduce a ton of vulnerabilities to the mobile phones of 730 million people, which on an  app that comes with remote blocking functionality is only a disaster waiting to happen. Just a few  days after the secret order was issued, it was leaked to the media, probably by one of the phone  manufacturers. Lots of people aren't thrilled with the new app with clips circulating of intense  debates in India's parliament set to the backdrop of dramatic Bollywood music. Apple was the first  company to say that they just wouldn't comply with the order. And it looks like I can forget my  future video on every Indian phone being hacked. Because before this story could really take  off, barely a couple days after the leak, the Indian government has already announced they're  backtracking on the idea altogether. Next up, Subscribe to my channel at youtube.com/grimplay  stuff. Follow me on Blue Sky Gwim Wolf Work. On Twitter, Grimplay Stuff. Also on  Reddit, Poke Husky64. At this point, a certain country song plays, and I don't want to  get copy strike, or worse, a community guideline strike because the song in question is by the  country singer Johnny Rebel. And going off the titles of some of his songs, I think you can  guess why I'm not too keen on playing it. Turns out the radio station ESPN had been hijacked. They  reported that this wasn't a case of someone with a very big antenna just overpowering their signal,  but rather confirms that they had actually been hacked. And this wasn't the first radio hack of  the week because just a couple days beforehand, the same thing happened to a different  station, prompting the FCC to get involved, putting out a public notice reminding broadcasters  to take their security a bit more seriously. Not only are the FCC annoyed about the broadcast of  obscene materials, but also the misuse of the emergency alert system attention signal. That's  the annoying noise you hear in the video. It's just an 853 and 960 Hz tone overlaid, which fun  fact is totally illegal to broadcast in the US for any reason except in an emergency broadcast.  Even using it in a TV show or ironically in a comedy skit will get you some pretty big fines.  The FCC thinks that this hack was made possible by something like this, a studio transmitter  link made by the company Barracks. These things just take audio input from the studio and relay it  to a remote location where the audio is actually transmitted. According to the FCC, these hacks  aren't highly sophisticated, but rather radio stations just haven't been securing their hardware  properly. We're talking default passwords and not bothering to install security updates. Security  is pretty important here because whilst they can communicate via a dedicated radio link, by default  they use the internet. So, someone probably just used a service like Showdown to find transmitters  exposed to the open internet. It's not the first time this has happened. In 2016, cyber bad guys  infiltrated the same kind of hardware to broadcast NSFW furry noises. But in this latest hack,  if you're wondering what the YouTube Blue Sky, Twitter, and Reddit accounts link to, nothing  apparently. All these accounts seem to have been deleted. As always, thanks for watching and  I'll see you in the next video. Have a good one.
