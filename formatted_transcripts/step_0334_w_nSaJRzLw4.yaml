transcript: I would say you should spend 100% of your time focus on the fundamentals and the learning and the principles and the and the and the the foundational pieces of like what is soft what even is software? How does it work? How is good code structured and organized? And then also 100% of your time engaging with AI agents. Like for me the question feels like a false dichotomy because it would be like saying like what percentage of your time should you be like learning computer science concepts and what percentage of your time should you be learning your code editor? Like it's those are orthogonal to me cuz I think like frankly having a a coding agent or having an LLM with tools like the ability to to uh um search the web and then like you know compress and like understand a whole lot of uh you know books worth of data in order to like you know craft a reply that is personally tailored just to your context in this moment. That is the best education system that's ever existed.
