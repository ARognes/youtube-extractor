transcript: You receive a really important message on  Signal. You read it, and because you’ve turned on disappearing messages, it vanishes. And  just to be extra sure that the message is gone, you even go so far as to delete the app entirely.  Surely that message is now deleted forever, right? Apparently not. A recent court case has exposed a  dirty little trick that law enforcement are using to recover deleted messages from iPhones,  and this works with all messaging apps not just Signal. This ability has kinda been an  open secret in digital forensics for years, but there was no real confirmation that law  enforcement was actively using it, until now. Herein lies the problem. Every notification you  receive is stored on your iPhone in this folder. This works on the OS level, so it doesn’t matter  if it’s some whimsical purchase suggestion from Amazon or an end to end encrypted message meant  for your eyes only, if it shows up here it gets stored here. Every app has its own folder, which  stores everything from the heading to the content, there’s even an attachments folder that  stores those little preview images. iOS does need to store notifications somewhere,  but there’s been a ton of controversy over how this database can be exploited to recover  messages that you thought were long gone. Last year there was an incident at an ice  detention center. A police officer was shot, and several people were subsequently  found guilty of various crimes. During the arrests a defendant’s  phone was seized. It was probably hooked up to something like this in order  to perform a full file system extraction, this essentially makes a copy of the device  so it can later be forensically analysed. The subject of Digital forensics is a bit  mysterious, the companies that sell this stuff to law enforcement definitely don’t  publicly advertise their capabilities, so we only know what we know about them thanks  to leaks, or in this case, from people sitting in the court room listening to how evidence was  obtained. “Messages were recovered … through Apple’s internal notification storage”. And  this comes after Signal had been deleted from the target device, the notifications were still  preserved in the internal memory. Though of course this only affects incoming messages, not the  messages that were sent by the target phone. Journalists at 404 media spoke to  people supporting the defendants and they said that the target phone  was using disappearing messages and that the messages that the feds  recovered had already disappeared. This is slightly confusing because by the time a  messages disappears in Signal, it’s notification is already long gone from notification center.  so the fact it was still recoverable implies that dismissed notifications still linger  in this database for some period of time. No one seems to know how long notifications  hang around for and under what circumstances these files are cleared, which isn’t helped  by the fact that Apple has no documentation on this. And unsurprisingly the fruity giant  didn’t respond to a request for comment. Now there’s inevitably going to be comments  down below saying that none of this is news, and they’re half right. The fact that  notifications can be recovered at all has been an open secret for years. The  earliest documentation I found comes from 2019 when a researcher explained how  it’s possible to recover this kind of data, and since then various open source tools have  popped up that make it easy to parse this stuff, and if you dig real deep you’ll even find  release notes from digital forensics companies, the same ones that sell gear to law enforcement,  adding support for grabbing this stuff. But until now there’s been  no real reporting on it, in part because forensics companies don’t  advertise their capabilities and also because law enforcement agencies are never to keen  on explaining how they obtain their data. Probably because Apple has a bit of a habit  of patching things that get them bad press. For example, a couple of years back it was  revealed that governments don’t actually need to extract notification data from physical  phones, instead they can actually request push notification data from Apple themselves.  But in that case it was mostly metadata, since push notification content is usually end  to end encrypted. But metadata is still valuable, and the fact that Apple was just handing  it over, and conveniently forgetting to include it in their transparency  reports, got a lot of bad press. So Apple responded by making it more difficult for the feds to grab this kind of  data, though not by a huge margin. Clearing this database manually is totally  impossible, however there is a super easy thing you can do to make this problem go away,  but believe me, you’re not going to like it. In Signal’s settings you can change  notifications to show no name or content. Now this absolutely sucks because  now all your notifications are going to look like this, which is way too much for  me, personally I’ll just take my chances. Journalists at 404media reached out to Signal  for a comment on this, but for whatever reason they didn’t have anything to say, despite  this problem not really being their fault. If there’s any update on all this I’ll make  sure to leave a pinned comment down below, but as always thanks for watching and I’ll  see you in the next video have a good one.
