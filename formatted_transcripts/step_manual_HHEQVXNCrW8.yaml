transcript: '{"content":"\n[0.0s] Reactions and delivery receipts aren''t innocent \nas they might seem. Researchers have revealed\n[5.0s] they can be used for surveillance, revealing \nwhat time you leave your house every morning,\n[9.0s] when you arrive at work, when when \nyou''re in the middle of a phone call,\n[12.0s] and even what kind of phone you''re using. This \naffects almost everyone using Signal or WhatsApp,\n[18.0s] it requires no malware, and \nit can all be done silently.\n[21.0s] Also in your hacking news roundup,\n[23.0s] WiFi hacking on a plane just cost a \nsuper creepy guy 7 years in prison\n[28.0s] But first, for someone to exploit \nthis, it only requires that they\n[31.0s] know your phone number. It was discovered \nby researchers at the university of Vienna,\n[35.0s] raising the alarm in their \npaper, ''Careless whisper''.\n[38.0s] So, when you send a message, it''s first \nsent to a WhatsApp or Signal server and\n[42.0s] you get your first checkmark, but only \nwhen the message actually reaches the\n[46.0s] recipient do you get a second checkmark, \nwhich acts as your delivery receipt.\n[50.0s] Now, on the surface, this only reveals when your \nmessage was received. But by timing how long\n[55.0s] this whole process takes, you can reveal a scary \namount of information about the recipient. There\n[61.0s] is a bit of an explanation coming up here, but \nstick with me because this is really very cool.\n[66.0s] First, lets take the most basic example, where a \nsender can determine what state your phone is in,\n[71.0s] is it locked, unlocked, or have you got \nWhatsApp open? (We''ll be using WhatsApp\n[75.0s] as an example going forward, but \nall this applies to Signal too).\n[79.0s] In the researcher''s demonstration here, \nthe victim phone starts of as locked,\n[83.0s] all the while it''s being constantly \nspammed with messages by an attacker.\n[87.0s] With each blue dot representing the time \ntaken for the attacker to receive their\n[91.0s] delivery receipt. But when the phone is \nunlocked the time taken goes way down,\n[95.0s] and when it''s locked again it goes right back \nup. But when WhatsApp is actually open, the\n[100.0s] delivery receipts are received almost instantly. \nThis makes it really easy for an attacker to\n[105.0s] differentiate between whether a victim''s phone \nis locked, unlocked, or if WhatsApp is open.\n[111.0s] But if the victim is being spammed why aren''t \nthey getting any notifications. Rather than\n[115.0s] regular messages, the researchers are spamming \nreactions, these also generate delivery receipts,\n[121.0s] but don''t generate notifications, well, at least \nthey don''t when you react to your own message.\n[125.0s] On top of that, using open source WhatsApp \nclients they''re able to send reactions to\n[130.0s] messages that just don''t even exist, resulting \nin a victim phone just discarding them, with\n[135.0s] the user having no idea they''re being spammed, \nmaking this totally invisible. And on WhatsApp\n[140.0s] there''s no rate limiting, making it possible \nto send one reaction every 50 milliseconds,\n[145.0s] that''s 20 reactions per second. But rate limiting \non Signal limited them to just one per second.\n[151.0s] And by the way, unlike read receipts. Delivery \nreceipts cannot be turned off because they''re\n[156.0s] integral to the way that these apps work. And it \ndoesn''t matter whether whether a message is coming\n[161.0s] from someone in your contacts or a total stranger, \nyour phone will still send delivery receipts.\n[167.0s] Other than being able to tell \nwhat state a phone is in,\n[170.0s] fingerprinting what brand the \nphone is, is also possible here.\n[173.0s] Fingerprinting what brand phone a victim is \nusing is possible here. For example, phones made\n[174.0s] by Apple, Samsung and Xiaomi all have on average \nslightly different response times. And an attacker\n[180.0s] can also tell whether you''re currently on WiFi \nor using cellular. On WiFi the ping time is very\n[186.0s] predictable, however on cellular it''s all over the \nplace. And you can even see some very concentrated\n[192.0s] activity here, that''s when the victim had the \napp open and were in the middle of a phone call.\n[197.0s] This whole chart could be generated \nfor almost any WhatsApp or Signal user,\n[201.0s] with only knowledge of their phone number.\n[204.0s] And if you use desktop clients, that \nonly multiplies the problem. Thanks\n[208.0s] to the way encryption is handled, each \nof your devices generates its own read\n[212.0s] receipts. So an attacker can grab the same \ndata for them, and overlay this information,\n[217.0s] showing which devices are currently able \nto send read receipts, and therefore which\n[221.0s] devices are online. All this activity is from \na willing participant or so the researchers\n[227.0s] tell us. We can see when someone''s home PC \nis on, and exactly when they turn it off,\n[231.0s] and the same thing for their work laptop. \nMaking it really easy to work out where this\n[236.0s] person physically is throughout the day, are \nthey at home, work, or somewhere in between.\n[242.0s] Remember no malware is needed here, you \nonly need to know someone''s phone number,\n[246.0s] making it easy to put together a detailed \nmap of someone''s daily activities. The\n[250.0s] kind of thing that would give \n3 letter agencies a wet dream.\n[253.0s] And if an attacker used the previous \nWhatsApp exploit we saw in a recent\n[257.0s] video. They could leverage a single image of \nsomeone''s face to grab their phone number,\n[262.0s] then use this latest vulnerability \nthis to spy on their habits.\n[265.0s] An attacker can also use this to infer \nconnections between a whole list of targets,\n[270.0s] like if two people consistently \nhad the app open at the same time,\n[273.0s] you could assume they''re \nprobably talking to each other.\n[276.0s] But let''s forget about the surveillance for \na second, remember the zero rate limits on\n[280.0s] WhatsApp? By constantly spamming reactions an \nattacker could really inflate your phone bill,\n[286.0s] eating through data at a rate of 13 Gigabytes per \nhour. Which would also annihilate your battery,\n[291.0s] at a rate of up to 18% per hour. And \nyou''d have no idea because again,\n[296.0s] this is all done silently. But this \nisn''t as much of a problem on Signal\n[300.0s] because thanks to rate limiting an attacker \ncould only cost you 360 Megabytes per hour.\n[305.0s] Disclosure is always a fun topic, \ndid our techno overlords care about\n[310.0s] the problem? Ye- no... Both Meta and \nSignal were informed in September 2024.\n[316.0s] Meta responded with just a a copy paste \nmessage saying they''d received the report,\n[320.0s] but fell silent until a whole year later when they \nprovided an update, that the report had now been\n[326.0s] forwarded to the relevant team. As for Signal, \nthe researchers didn''t hear anything back at all.\n[332.0s] But there are preventative steps you can take,\n[334.0s] on Signal change your phone number privacy \nsettings so no one can find you using it. As\n[339.0s] for WhatsApp they recently introduced \na new privacy setting under advanced,\n[344.0s] which lets you block high volumes of messages \nfrom unknown accounts. It''s unclear if this was\n[349.0s] introduced in response to this attack method, \nand we don''t know if it even prevents the kind\n[354.0s] of attack that uses sneaky invisible reactions. \nBut enabling it is free, so you might as well.\n[360.0s] The researchers gave a defcon talk on this, which \nI''ll make sure to link down in the description\n[365.0s] Next up, guy has just been sentenced to 7 years in \nprison for WiFi hacking on a plane. If this gives\n[371.0s] you deja-vu, we did briefly look at this story \nlast year, but now we have a lot more details.\n[376.0s] This began in a flight over Australia when \nairline employees noticed a suspicious\n[381.0s] WiFi network. It looked some kind of a \nclone of their actual in-flight WiFi,\n[385.0s] but when you connected to this one, the \ncaptive portal offered you free internet\n[389.0s] if you logged in with social media. Far too \ngenerous by airline standards. And n reality,\n[394.0s] it was just a fake login page \ndesigned to grab your credentials.\n[398.0s] Making this a textbook example \nof an ''Evil Twin'' WiFi attack.\n[402.0s] The airline radio''d this in to police, \nwho after landing searched peoples bags\n[406.0s] until they found the one guy with one of \nthese in his carry-on. It might look like\n[410.0s] some kind of WiFi hacking device, and \nthat''s because it most definitely is.\n[414.0s] After seizing and analysing his devices, \npolice found this wasn''t his first attempt\n[419.0s] at WiFi hacking. He''d done the same thing on other \nflights, and at various airports across Australia.\n[425.0s] But why grab random people''s \nsocial media credentials? Well,\n[428.0s] he''d log in to their accounts, \nspecifically targeting women apparently,\n[432.0s] monitoring their communications \nand stealing their noods.\n[436.0s] And this seems to have been quite \na hobby for the guy because police\n[439.0s] found thousands of intimate images, \nand videos. And to make matters worse,\n[443.0s] we can clearly see from the bodycam that we''re \nnot dealing with a hormonal 16 year old who''s\n[448.0s] watched one too many hacking tutorials, \nbut rather a fully grown 44 year old man.\n[453.0s] Who keen on making things worse for \nhimself, just a day later, started\n[457.0s] deleting files from his cloud storage and even \nunsuccessfully tried to remotely wipe his phone,\n[463.0s] earning him a couple extra charges for \nthe attempted destruction of evidence.\n[467.0s] He also tried to spy on meetings \nbetween the police and his employer.\n[471.0s] But law enforcement aren''t telling us much \nabout this, only that he used a ''software\n[475.0s] tool'' to do it and that the meetings \nwere supposed to be ''confidential''.\n[479.0s] Eventually the man plead guilty \nto a whole array of charges,\n[482.0s] and will spend the next 7 \nyears and 4 months in prison.\n[486.0s] At most free WiFi might try to \nmilk an email address out of you,\n[490.0s] but having to log in to any 3rd party account \nis a huge red flag. However in their press\n[495.0s] release Australian police wrongly seem to think \nusing a VPN is some kind of a defence for this.\n[502.0s] As always thanks for watching and I''ll \nsee you in the next video, have a good one"}'
