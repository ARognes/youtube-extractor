transcript: Recently, Amazon announced that they're laying off 30,000 employees. Why do you think that was the case? Was it because of AI or overhiring or any other reason? >> What I would say is probably due to overhiring. You know, when you talk about layoffs, like those are actual people, 30,000 or 16,000 or whatever that number is. It's like that's how many people are affected. That's how many families are affected. And so, super terrible situation. But I think ultimately there were like a 100,000 corporate employees at the company when I left. If you really like squinted at it, like were those 100,000 people like strictly necessary? You know, Amazon has a like a history of taking big bets, right? So the idea at least in Jeff Bezos's time was we would take a bunch of big bets. the ones that did really well, we would double down on and then the ones that didn't do well, you know, we should have the like the courage to cut those and then to move those resources into the bets that are doing well. I think with the layoffs, it's basically they didn't want to redistribute those resources into the the other bets. So, I don't know. I it doesn't seem very Amazonian to me. I think we should have a ton of ideas, especially in this AI age. We should, you know, Amazon should be starting a ton of different businesses. And so, you know, I think fine if you want to you cleaver a bunch of features or a bunch of products that weren't working well, I think that's totally an Amazonian thing to do. The real Amazonian thing to do though would be to take all of those folks and then redistribute them and then to just really double down on the stuff that is working because there's a ton of stuff that is working really well at the for me.
