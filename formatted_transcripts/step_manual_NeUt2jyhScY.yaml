transcript: '{"content":"\n[0.4s] We live in a culture of busyiness. Our\n[3.679s] to-do lists seem endless. We''re\n[6.48s] constantly distracted by one thing and\n[8.72s] another, and we feel overwhelmed. We''re\n[12.4s] busy, but we don''t really feel\n[14.48s] productive. So, we look for solutions.\n[17.84s] But when we turn to Buddhism, we run\n[20.4s] into a kind of a paradox.\n[22.96s] I recently did a video on how Buddhist\n[25.439s] progress is about relinquishment and\n[29.039s] wearing away rather than about\n[31.679s] accumulation and piling up. But how can\n[35.36s] we possibly be more productive, doing\n[38.399s] more, making more, while also letting\n[41.68s] go?\n[43.28s] Today, we''re going to try to solve this\n[45.12s] conundrum. We''re going to explore how\n[47.6s] the Buddha had two different but related\n[50.239s] paths. one for the lay person and\n[52.399s] another for the monastic.\n[54.96s] And we''re going to discover that the\n[56.879s] Buddhist secret to true productivity is\n[60.16s] not so much about doing more. Rather,\n[63.28s] it''s about learning how to relinquish\n[65.519s] skillfully in four particular ways.\n[70.4s] To begin with, let''s clear this up. Did\n[73.04s] the Buddha want all lay people to\n[74.88s] relinquish their jobs and stop being\n[77.36s] productive? No. The SA''s continued\n[80.799s] survival depended on lay people''s\n[83.92s] generosity. After all, the Buddha''s path\n[86.96s] for lay people assumed that they would\n[89.759s] be productive. The Buddha praised right\n[92.64s] livelihood, which is central to the\n[94.56s] eight-fold path.\n[96.88s] He wanted he expected lay people to earn\n[100.079s] a living in a way that was ethical and\n[102.24s] nonharmful.\n[104.32s] In the suta on debtlessness,\n[107.119s] the Buddha talked about four kinds of\n[109.28s] happiness for lay people living ordinary\n[112.24s] lives. They include the happiness of\n[115.84s] ownership, the happiness of using\n[118.32s] wealth, the happiness of debtlessness,\n[121.439s] that is of not having any debts, and the\n[124.079s] happiness of blamelessness.\n[126.96s] Now, of these four, the Buddha says that\n[129.759s] blamelessness, that is being able to\n[132.319s] speak and act ethically, so without any\n[134.72s] blame, is by far the most important of\n[137.76s] the four.\n[139.76s] Nevertheless, the other three do provide\n[143.28s] happiness as well, and they are all\n[146.08s] about productive worldly successes.\n[149.92s] That is, we''re made happy by owning\n[152.879s] things. We''re made happy by using\n[155.92s] whatever wealth we have to make\n[158.16s] ourselves and others happy or to be\n[161.68s] generous.\n[163.44s] And we''re made happy by paying off\n[165.519s] whatever debts we incur.\n[168.64s] The point here is that the SA depended\n[171.44s] on the skillful productivity of their\n[174.319s] lay supporters to generate the surplus\n[177.28s] wealth that supported the SA itself with\n[180.239s] food and lodging and clothing and so on.\n[184.239s] So our goal as lay supporters was not to\n[187.68s] stop producing things altogether.\n[191.84s] So if doing things, making things,\n[194.72s] selling things is not the problem, what\n[198.08s] is? Well, there''s many things, but one\n[201.28s] problem, one central problem that I want\n[203.44s] to touch on today is the mental state of\n[206.239s] busyiness.\n[208.0s] Think about it. Business is a state of\n[210.159s] frenzied, distracted, anxious, and\n[213.12s] restless activity. It''s the mind\n[215.76s] spinning its wheels.\n[218.08s] This busyiness is simply another name\n[221.04s] for what we might term mental\n[223.12s] proliferation or the five hindrances.\n[227.84s] That is when we''re scrolling on our\n[229.599s] phones instead of working. That''s\n[232.239s] sensual desire. looking for stuff to\n[235.519s] grab onto, maybe to buy.\n[238.48s] When we''re stuck in a doom loop of dread\n[241.36s] for work, that''s a kind of aversion.\n[245.28s] When we''re feeling overwhelmed, foggy,\n[247.84s] and tired, that''s an example of sloth\n[250.72s] and torper.\n[252.64s] When our minds are overwhelmed with\n[255.36s] multitasking and the multitude of things\n[257.359s] we have to do every day, that can be an\n[260.079s] example of restlessness and worry\n[262.24s] depending on how it manifests.\n[265.44s] And when we spend time thinking of other\n[268.88s] ways to make a living or to give it all\n[271.52s] up, that is a kind of doubt.\n[275.199s] Now, this is these this whole syndrome\n[277.919s] is what I''ve termed the term the\n[279.68s] dissatisfaction engine that''s running\n[282.4s] our to-do list.\n[284.88s] This suffering we go through comes not\n[287.44s] so much from the work itself, at least\n[289.919s] let''s assume that that''s the case for\n[292.0s] argument''s sake here, but instead from\n[294.88s] the craving for the work to be over and\n[298.08s] the aversion to doing the work.\n[301.199s] Now I I want to make a an important side\n[303.84s] note here. This aversion and the doubt\n[307.52s] that it''s associated with may also be\n[310.56s] telling us something important. It it\n[312.72s] does totally depend on the situation.\n[315.919s] So what you should do is to ask ask\n[318.479s] yourself if you''re in that kind of\n[320.16s] state, am I being made to do something\n[323.12s] at work that I find improper or wrong,\n[326.4s] unethical?\n[328.56s] Do I feel myself better suited to some\n[331.68s] other kind of pursuit?\n[335.12s] If the ca if the answer to that is yes,\n[338.479s] then we can let these feelings provide\n[340.4s] us with energy that we can use towards\n[343.44s] ski skillful change in the future, maybe\n[345.28s] to get a different job or try to make\n[347.68s] change within the one that we have.\n[350.479s] However, if that''s not really the case,\n[352.72s] if we don''t find that we really need to\n[354.88s] change jobs or make any important change\n[357.199s] to the job that we have, then we''re\n[360.16s] probably simply subject to the very\n[362.479s] human syndrome of these busyiness\n[365.039s] hindrances.\n[368.08s] The Buddhist guide to productivity is\n[370.72s] not some kind of life hack that allows\n[372.8s] us to to do more in a given amount of\n[375.28s] time. Instead, it''s more like a complete\n[378.16s] model for skillful action. We might call\n[381.36s] it right effort. That''s the way the\n[383.199s] Buddha called it. Right effort has four\n[386.08s] parts. And it is indeed the most\n[388.96s] complete to-do list that we''re ever\n[390.96s] going to have. It begins with preventing\n[394.8s] unskillful states from arising.\n[397.68s] In our example here, that might mean\n[399.919s] something like not opening the\n[402.319s] distracting tab in the first place. that\n[406.0s] that prevents problems from arising. The\n[409.759s] second one is to abandon unskillful\n[412.0s] states that have already arisen when we\n[414.319s] notice it. That is, we notice that we''re\n[417.039s] getting distracted by our cell phone. We\n[419.919s] acknowledge that and we close the tab or\n[422.24s] we set the phone down.\n[425.599s] Third, we cultivate skillful states. In\n[429.599s] this case, we might look for ways to\n[431.36s] make our work more engaging.\n[434.24s] Or, as we discussed before, if we notice\n[437.44s] that what we''re doing is not right for\n[439.68s] us in some way, we make the effort to\n[442.24s] find work or to change our work in ways\n[444.4s] that are more skillful for us.\n[447.759s] Fourth, we maintain skillful states.\n[452.319s] That is, we cultivate the focus to\n[455.44s] continue the work that we find engaging.\n[459.68s] When we accomplish these four aspects of\n[463.12s] right effort, it this is what we might\n[465.36s] call true productivity.\n[468.4s] It''s simply or can see it can be seen as\n[471.199s] simply the practice of abandoning the\n[473.599s] hindrances, the busyiness and\n[477.12s] cultivating focus on what''s skillful.\n[481.28s] And that''s that''s it. The output then of\n[483.759s] our work is just a side effect of this\n[486.8s] process.\n[490.479s] So how do we apply this kind of plan in\n[493.199s] our own lives?\n[495.36s] Perhaps not surprisingly, it also\n[497.84s] involves relinquishment. This is the\n[500.56s] secret to solving our productivity\n[502.72s] paradox.\n[504.319s] We can contemplate the Zen saying, the\n[506.4s] famous saying, chop wood, carry water.\n[510.56s] This saying is all about embodied\n[512.8s] mindfulness. When we''re just doing the\n[515.599s] task, just do the task.\n[519.839s] Think also of Tiknad Han, the famous Zen\n[523.12s] monk''s advice that we wash the dishes\n[527.2s] simply to wash the dishes.\n[530.72s] What he means by this is we is that we\n[532.959s] don''t need to wash the dishes and also\n[536.8s] tell ourselves a story about how much we\n[539.68s] hate washing dishes. If we can\n[542.48s] relinquish that story, we can act with\n[545.44s] minimal inner friction.\n[548.32s] Second, we can cultivate a mindset of\n[550.64s] relinquishing the outcome of our\n[553.04s] actions. We apply full intention and\n[556.32s] effort to the task that''s in front of\n[558.64s] us. But we practice letting go of our\n[562.24s] obsessive ego-driven clinging to the\n[564.959s] results of whatever task is in front of\n[567.68s] us.\n[569.04s] That is, we can''t always control the\n[572.0s] outcome. In fact, we really can''t ever\n[574.399s] entirely control the outcome. We can\n[577.36s] only control our skillful actions right\n[580.08s] here and right now.\n[583.279s] Third, we can cultivate relinquishment\n[585.6s] as our work is done. That is, we let go\n[589.2s] of our mental load. We practice letting\n[592.16s] go of our work and letting our mind\n[594.32s] rest. Perhaps we decide to meditate for\n[598.0s] a time once we get home after work. This\n[601.519s] can allow us or help us to wear away the\n[604.8s] stresses that we''ve accumulated during\n[606.88s] our workday.\n[609.6s] And finally, we can cultivate\n[611.68s] relinquishment through acts of\n[613.839s] generosity.\n[615.36s] By using whatever wealth we''ve managed\n[617.68s] to gain through our work, we can be\n[620.56s] generous to ourselves in the first\n[622.8s] place, to family and friends, and to\n[625.839s] worthy charities and people in need.\n[629.36s] Such generosity and the pleasures that\n[632.399s] it invariably creates is the true fruit\n[636.32s] of our labors.\n[638.399s] Skillful relinquishment is in this case\n[641.6s] the antidote to hoarding to clinging to\n[645.04s] stinginess and to ownership entitlement.\n[650.0s] So our Buddhist practice of productivity\n[652.32s] as we''ve seen is to learn to relinquish\n[655.839s] four things or in four different ways.\n[658.959s] relinquishing our stories, relinquishing\n[661.92s] our outcomes,\n[663.76s] relinquishing our work when the work is\n[666.0s] done, and relinquishing the fruits of\n[669.12s] our labors themselves.\n[672.48s] The Buddha''s secret to better, healthier\n[675.12s] productivity involves a profound\n[677.76s] reframe.\n[679.44s] It''s not so much about doing or making\n[682.16s] more as it is about suffering less. It''s\n[686.399s] about shifting from frenzy busyiness,\n[689.6s] wallowing in one or another of our\n[691.44s] hindrances, towards skillful action,\n[694.399s] which is right effort.\n[697.12s] It''s about learning to relinquish what\n[699.519s] needs to be let go in order to pursue a\n[702.64s] more harmonious work life.\n[705.519s] True pro productivity is not measured by\n[708.0s] the length of the list that we have to\n[710.16s] do. Instead, it''s measured by the\n[712.56s] quality of our minds while we''re\n[715.12s] checking off the items. Can we maintain\n[718.64s] focus, balance, and energy? Are we\n[722.399s] fulfilled by what we do? This entire\n[725.519s] idea of letting go, of doing less in\n[729.2s] 