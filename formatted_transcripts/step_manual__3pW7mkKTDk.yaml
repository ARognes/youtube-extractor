transcript: '{"content":"\n[0.08s] Let''s add this physical phone to a free\n[2.24s] cloud phone system in 60 seconds. This\n[4.64s] is so easy, it''s going to blow your\n[6.319s] mind. And we''re using 3CX, which is free\n[8.48s] for up to 10 users. First, in your 3CX\n[11.12s] admin console, [music] go to users and\n[12.88s] choose the user you want to add the\n[14.16s] phone to. Next, go to IP phone and\n[16.4s] configure a phone. Now, check out how\n[18.32s] easy this is. [music] It''s asking me for\n[20.0s] the phone model and the MAC address. So,\n[22.16s] this is the phone I''m using. It''s the\n[24.0s] Snom D735. [music]\n[26.32s] You can see right there. And for my MAC\n[28.0s] address, it''s also on the back of the\n[29.599s] phone right here. You can see it under\n[31.199s] MAC address. Now, I can''t show you mine,\n[32.559s] but this is going to be a 12digit\n[34.239s] hexadimal [music] number. So, we''ll put\n[35.84s] it in and click on next. Now, it says\n[38.399s] connect via SPC or router [music] phone.\n[40.559s] This is because I''m on the free plan,\n[42.239s] and that''s fine. That means my 3CX is\n[44.64s] hosted in the [music] cloud and all the\n[46.32s] physical phones in my network need a way\n[48.399s] to communicate with that cloud, [music]\n[50.399s] a gateway. For this, you have two\n[52.16s] options. You could use a router phone\n[54.399s] like this or you could use a Raspberry\n[56.985s] [music] Pi. That''s the option I''m going\n[58.719s] with. So to do that, we''ll flash the\n[60.559s] Raspberry Pi. You''ve done that a million\n[62.48s] times by now, right? And then back in\n[64.0s] our admin panel, we''ll go to admin and\n[65.84s] then voice and chat. And right here,\n[67.92s] there''s a button to add SPC. That''s what\n[70.32s] we''re looking for. We''ll click that.\n[71.395s] [music] Choose Raspberry Pi and copy\n[73.92s] this command. Then just SSH into your\n[76.64s] Pi. Paste [music] the command in. Then\n[78.64s] you''ll put in your provisioning URL and\n[80.64s] authentication ID. Don''t worry about\n[82.32s] that. It gives it to you right here. And\n[84.08s] there you go. You''re done. And if we go\n[85.92s] back to our phone setup, you can see my\n[87.6s] SPC is right here. [music] So, I''ll\n[89.68s] click it and boom. That''s it. We now\n[92.0s] have a phone system that connects to the\n[94.079s] cloud through your Raspberry Pi. That''s\n[96.286s] [music] pretty sweet. Set up 3CX\n[98.079s] yourself by using this link."}'
