transcript: All right, everyone. Welcome back to Cody's Lab. So, you might remember this from a video I posted last year. This is a machine that converts urine into nitrates by use of bacterial oxidization. So, the bacteria lives on the charcoal. I pump the urine over it constantly to oxygenate it, and the bacteria will convert the urea into nitric acid, which reacts with some uh limestone pieces that I've got in there to make calcium nitrate primarily. Now, I shut it down for the winter because it's too cold for the bacteria to work. But, when I tried to turn it back on in the spring, the pump wasn't working. So, I just sit here for the last few months. And I've decided I want to start up on the project again, but I've come up with a much better design. So, I'm going to take the charcoal, I'm going to reuse it. Hopefully, the bacteria is still in there. And the liquid, which has got some molds in there, I'm going to pump out. I'm going to recover the nitrates. So, I've got a pump, and a sock to filter it. I'm just going to put it in this barrel. And then, I'm going to pump the water. >> [sighs] >> So, here's the hose that I got connected to the pump. I'm pumping the water up into my greenhouse here, where I've got all these plastic tubs laid out. I'm just going to fill these tubs with the liquid. There it is. I'm going to try to not put very much in. The idea is to spread it out so it evaporates quickly. So, I'm going to try to evaporate the water out in order to concentrate the nitrates. There we go. Now, in principle, I could recover the water. Like, if I put a dehumidifier in there or something. But, for now, I just got the windows open. So, someone's probably going to ask. But, you can see there's a little bit of salts there in the tubs already. Uh that's actually a potassium carbonate. I was evaporating down some ash water using this same method. Uh the amount that's in there is very little, though. It'll only help me make potassium nitrate. You can hear the pump's gone dry. So, I've pumped it all up into these trays. I could do this outside. In fact, it'd be faster to do out there. The wind would help uh evaporation happen faster. But, also, I really don't want the cows to come by and drink it. Like, the cows will drink anything that's wet. They would They would love this. So, I'm putting it up here to protect it from the animals. All right. So, now I've got the solution concentrated and most of the large debris is removed. So, now, I've got a solution which contains calcium nitrate, ammonium nitrate, and various other salts. I'm I'm to try to eliminate these salts one at a time. To start with, I'm going to convert the ammonium nitrate into more calcium nitrate by reacting it with some calcium hydroxide. To make that, I'm going to start with some quicklime, some limestone that has been roasted to convert it to calcium oxide. I'm going to react this with some water to make slaked lime or calcium hydroxide. All right. So, that released considerable heat. I have some milk of lime. Now, got some muriatic acid. I'm just using this as an indicator. You can see there's no ammonia. I'm going to add this to it. Give this a good mix. You can actually see most of the calcium hydroxide dissolved away. It's cuz I'm forming calcium nitrate, which is soluble, and ammonia. Makes ammonium hydroxide. I'm just going to continue adding this until it stops dissolving. See, calcium hydroxide's poorly soluble, but the calcium nitrate and ammonium hydroxide are very soluble, so the white clouds kind of go away. As soon as that stops, I'll know it's done. All right, looks like the calcium hydroxide sticking around, so that means that I've gotten all of the calcium converted to calcium nitrate. And you can see the clouds of ammonium chloride forming as the ammonia reacts with the hydrogen chloride. I'm going to transfer this over to a pot. Yeah, I can smell the ammonia. So, now the solution contains a lot of ammonia dissolved in the water to make ammonium hydroxide. I can decrease the solubility by heating up the solution. If I bring this to a boil, most of the ammonia will be removed. I could let it evaporate slowly, but that'll just take a lot more time. As the solution approaches the boiling point, you can see the amount of ammonia being released has increased. I'd recommend doing this in a well-ventilated area. Now that the solution's been boiled for a while, most of the ammonia is now gone. So, now I'm going to pour it back through a filter to remove as much of the calcium hydroxide as I can. So, now that the solution's been filtered, I've removed most of the calcium hydroxide, it's time for the next step. Now, you remember earlier in the video, I mentioned evaporating down some water that I'd run through some hardwood ashes. This is that concentrate that I produced. This is a solution containing primarily potassium carbonate. Now, when I add this in, it makes white clouds of calcium carbonate. And the potassium stays in the solution as potassium nitrate. I'm just going to add this in a little at a time until it stops reacting. I don't want to add too much potassium carbonate cuz it's difficult to separate from the potassium nitrate. So, if I have very little of it, it'll be good. Ah, see? No white cloud. Means I've reached the finished point. So, I'll give it one last stir. Let the calcium carbonate settle out, and I'll decant the liquid. Now, now that it's settled out a little bit, I'm going to decant the liquid and then add more water to rinse it out. I'll fill it back up. Give it a bit of a stir. And let it settle out again. So, something I've noticed about this is overnight it only settled to about halfway here, and then it kind of stalled out. I dumped it off and added more water. And then I let it go through the day. The daytime, when the sun was shining on this directly, it settled out much faster and more completely. So, I guess the heating from the sunlight must do something. It's very interesting. Anyway, it's good news for me. I won't have to rinse it as many times. >> Well, that's the majority of it. Let's set this up and let the water evaporate. There we go. Piece of wire to keep the wind from blowing it away. >> [sighs] >> Just let that sit there in the sun, evaporate the water down. So, here's the calcium carbonate byproduct. I'm going to get it out of this settling column and evaporate it dry. This should make chalk. I might be able to reuse it into the next iteration of my bacterial oxidation rig. So, this calcium carbonate here will dissolve and make more calcium nitrate later. Now that it's dry, I have some carbonate chalk dust. Super fine powder. So, it's been a few days. Most of the water's evaporated off and the salts have begun to crystallize. If you look at it real close, you can actually see the different kinds of salts that are crystallizing out. So, right there we can see some little white cubes. Those are sodium chloride crystals, commonly found as table salt. These long needly crystals, those are potassium nitrate. And some of this uh fluffy material down in there, I think is actually some calcium carbonate that was left over. There's probably traces of other salts, but the concentration is not enough to, you know, have recognizable crystals. Now, if I were to take some tweezers and pull out the different crystals like this, since crystals exclude other salts from them as they form because it doesn't fit the pattern, I basically have some pure potassium nitrate right here. But there's a couple of reasons why I wouldn't do that. First, it's a lot of manual labor to go through and, you know, separate the crystals. And second, these potassium nitrate, it's basically like a bundle of fibers, and stuff gets trapped in between those fibers, so it's not as pure as I would like. So, instead, I'm going to let this continue to evaporate dry, I'll scrape it up, weigh it, add a little bit of water to it, and do a a separation by solubility. I'll let it go another day, but it appears but it appears to form sort of a skin that's preventing the water from evaporating, so I'm going to give it a stir to kind of help the water get out more easily. I will stir it occasionally. Breaking up that crust really helped let the water escape. Now, it can continue to dry. All right, it's finally dry. So, now let's take it and transfer it over to this other container just so I can move over to the scale and figure out how much of this salt mixture I have. So, here's our salt mixture. I'm going to put it into this jar. It's on a scale. Okay. There we go. So, let's call that 450 g. Now, I'm going to weigh out some water. Enough to dissolve all of it, assuming this was pure potassium nitrate and the water was boiling. So, after some quick math, I've determined I need about 180 ml. I'm just going to call it 180 g. Which I'll weigh out in this jar here. There we go. 180. Now, the first thing I'm going to do with that water is rinse out our evaporative tub here. Just to get what I couldn't scrape out. Transfer it jar over to a pot of water, which I'm heating up on the stove. Pour in my water. It's kind of crazy to imagine that small amount of water dissolving all this. But, potassium nitrate dissolves very well. Especially if the water's hot. Sodium chloride dissolves basically the same amount, whether this water's hot or cold. So, we're going to exploit that in order to separate the two. Okay. So, it takes a long time to heat up cuz potassium nitrate absorbs heat as it dissolves. We haven't dissolved everything. That was the goal. All right, let me warm up a second jar so it doesn't shatter when it hits the hot liquid. Okay. I'm going to pour off everything except for the last little bit. I'm just pouring through a screen because it's got some bugs and stuff that have landed in it. It's what I get for evaporating it outside. Okay, there it is. So, that's probably a little potassium nitrate left in it, but that should be mostly the sodium chloride. This over here has got some sodium chloride which is dissolved in the water. Mostly potassium nitrate. Now, I'm actually going to add a little bit more water to rinse this down, but also that little bit of extra water will keep the sodium chloride which I've dissolved into solution from precipitating out as this cools down cuz now there's enough water to fully dissolve all the sodium chloride. All right. [snorts] Let me warm this back up for a minute. >> [snorts] >> Okay, so I'm just going to set this out with a cover over it. Let it cool overnight. Most of the potassium nitrate will settle out of the solution as some white crystals. Sodium chloride will remain in the liquid. >> [sighs] >> So, this is the next morning. This has cooled off. The nitrates have crystallized back out of the solution. The solution should contain my sodium chloride. The steam out that had dissolved. So, I'm going to pour this off. I'm going to crush it up a little bit. Transfer it to the screen so it can drain. Okay. It's dripping through. Of course, this liquid will contain potassium nitrate. I'll evaporate it down and reprocess it. I've also got to reprocess this sodium chloride we pulled off the bottom cuz I think it still has quite a bit of nitrate in it. I'm going to rinse this with a little bit of cold water just to drive more of the sodium chloride solution out. Now that the nitrate crystals have had time to drip, I'm going to set this aside. I'm I'm to pour off the sodium chloride containing liquid. We're going to evaporate that down cuz it still does contain some nitrate, so I'm going to reprocess it. Basically do everything what I just did again. Okay, so I'm going to take these crystals, drop them in a pan, and I'm going to redissolve it with some water. Just room temperature water. This time I want to run it through a filter, so water can't be hot. Now that I've added just enough water to redissolve all the crystals, I'm going to pour them through a paper filter just to help clean out all the large bits of debris and stuff that have fallen into it. All right. So, I think that worked. So, here's our potassium nitrate solution. I've come into my greenhouse so that I get less stuff falling in it. I'm going to pour it into this dish to let it evaporate from. I'm going to just keep an eye on this and pull out crystals as they form. Sun's gone down and things have cooled off a bit. So, now the solution has started to crystallize. There's my potassium nitrate crystals. So, what I'm going to do is pull them out, drain them on a screen, just like this. >> All right. So, there's my pure potassium nitrate. Pull that out of solution. Let this continue to evaporate and more crystals form. In the meantime, this is the potassium nitrate that I got by reprocessing the stuff that we discarded earlier. I'm just going to add this to the tub. That'll form a little bit more. Yeah. There it is. Now, I got some nice big crystals this time. Let's see. Those out. Okay. And it's getting to the point where crystals are kind of tan in the color. Contaminants are building up. Probably going to have to be the last harvest. Contaminants are building up so much that well, it's not going to make pure crystals anymore. Going to rinse these a little bit of cold water. Just to make them look more pure. Need some kind of spin dryer. All right. Let's get it out. So, the water's finished evaporating and this is mostly potassium nitrate that's left over, but I'm not going to collect it because if I zoom in, you can see some sodium chloride is also crystallized out. It managed to make it over with the first crystallization. I I knew it would be there. That's why I was separating out the crystals as I was. But, this over here should be pretty much pure. >> [snorts] >> It'll be usable for just about anything that I want to use it for. >> [snorts] >> There's my potassium nitrate. Let's see how much I've got by transferring it over into a jar. So, there we are. 200 g of pure potassium nitrate processed on site from my own urine. Awesome. And of course I have some impure calcium nitrate, which I could reprocess to get a bit more. I've got about 120 g of that. Here's the sodium chloride that I extracted. I got about 50 g of that. Calcium carbonate. About a 100 g or so. I also got some of this material which looks a lot like sand. It precipitated from the water as it was being evaporated the first time. I think it's either calcium sulfate or maybe a calcium phosphate. Not entirely sure. I'll have to do some tests, but I've got about 36 g of that. So, how much urine did I process to get this? I wasn't really keeping track, but it was like half a liter a day for a month or two, so really only a few gallons, like five somewhere between five to 10 gallons probably. Anyway, hope you enjoyed. I'll see you next time.
