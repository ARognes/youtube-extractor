transcript: Um, I tell people when they're learning stuff, um, don't try to learn a language for the sake of learning the language. Don't try to learn the framework for the sake of learning the framework. Decide a thing that you want to build for you, just to play with if for nothing else, and then learn the language toward that goal rather than just trying to get a laundry list of all the different features of the language and let me figure them out. Once you've built the project, right, and you've run it and you're confident in it and you you're, you know, you had fun doing it, then you can go back and go, "Okay, so let me look go look through the the the um the the website or the documentation or the book or the table of contents or whatever, and let me figure out what are the things that, okay, I didn't have to touch that for this particular project, so let me go figure spend some time figuring out what that is. And maybe even make a side project that uses that feature." But, I've found that people learn a lot better if they're working toward getting something done rather than just trying to learn a language in the in the in a vacuum.
