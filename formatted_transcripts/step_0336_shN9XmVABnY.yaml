transcript: If you're learning right now, and you're out there, it's like, build the new thing. Build it to be valuable, see it through to completion, and once you've done that sort of like what we used to call the software development life cycle, like once you've done that for yourself on your on something that you really care about, and you've you've felt that like the wind at your back, now just the next step is get in touch, find a find a way, talk to somebody who's got a business that needs software. And congratulations, like that's that's basically you've built a consulting company that that can provide real business value. And the reason you can, you know, lean on your own experience to know like you have the capability to do it cuz you did it for yourself. And I Now, when you go up against the person who's got 10 years, 15 years, 20 years of professional software development experience, maybe they worked at Google or Meta or whatever, you know, you're actually going to be able to outcompete those people because you're going to be able to actually serve somebody and demonstrate as an individual how you're going to generate ROI for their business.
