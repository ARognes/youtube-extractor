transcript: Today I'm interviewing Steve, [music] an ex Amazon principal software engineer, which by the way is a level only 1.5% of engineers reach to. He spent 18 years at the company, did over 850 interviews, and even helped set the hiring standards at Amazon. So today we're going to be pulling back the curtains, exposing everything that you need to know to get hired in this crazy competitive tech market from rums to interviews to AI. So I hope you enjoy and let's get started. >> Okay, so getting into your story. So you were a principal software engineer at Amazon. So how I think about it is you've reached in a sense to some people the pinnacle of software engineering being that and also having the experience of hiring a lot of people conducting over 800 interviews at Amazon. I got to ask what makes a good resume? >> So think about a resume as being if you were to put a heat map >> on like recruiters or hiring managers or other people that are looking at your resume. >> It's essentially this F shape. >> Okay. where the like the top left is super hot and they just trace down on the side and then they trace across and it kind of tails off. So it's a it's an F shape. Anything in that hot zone is like super expensive real estate. >> And so whatever it is, whatever you are, whatever makes you kind of special and unique, you want to put it in that real estate. >> Yeah. >> The um you know, if you're keyword packing or trying to like inject a GPT prompt or something like that, >> I've seen [laughter] a lot of those. Don't put it in the in the F, right? Cuz like a recruiter, hiring manager or like bar raiser, whoever is looking at your your resume, they're going to look at it for like 6 to 10 seconds. And so you it's it's kind of like content on social media. You kind of want to hook them. >> And you know, if you're thinking to yourself like, "My past accomplishments aren't anything. I don't have anything to put in that stuff." You have to start somewhere, right? And so just just be aware that like you just want to pack all of your the good stuff, whatever it is. If you just if you know a framework and the company's hiring, put it there. >> Mhm. Do you think it's worth it to have a summary section in that hot zone? >> Yes. >> Okay. >> Yeah. So, you want a summary there? I think you want like one or two sentences that are really easy to digest. Um because if you think about what a recruiter or hiring manager is doing, they're qualifying a candidate. >> Mhm. And so basically, they're going to scan your resume for six to 10 seconds in that F-shape, and then they're going to be like, "This person we should follow up with, or this person." It's a it's a Tinder thing. They're swiping left and swiping right. >> And what you don't want to do is you don't want to add more cognitive load to the person that's looking at your resume. >> If the important stuff is like buried, if the only way that you know like how good somebody is by clicking on their GitHub link and then like digging through, you know, the read me isn't even there. They're not going to do it. >> So links, no. Or should you have links? No links. >> No. Why would you? Like literally, nobody is going to look at your Now, maybe an interviewer will look at the resume after you've been called back and be like, "Okay, I'm going to check out this guy's GitHub." So, back to your question, you want to put a really easy to digest sentence or two, maximum three, that tells you why you are qualified for the job that you just applied for. >> You have to make it super simple. What are those eye-catching things for recruiters though? >> Well, it depends on the company. So, different companies depends. >> So, say for Amazon, what's the most eye-catching thing on a resume? >> It depends on the level. If it's it's high level versus low level, I would be looking for somebody that like has bias for action. >> So, basically has a history of like doing the thing that was like needed without having to be prompted. I would be looking for things like delivery like what what things have they landed? What things have they delivered? >> Yeah. It can even be a school project or something like that, but just like an impressive delivery of some sort would be eye-catching. And I think as you go up in the levels, right, things like customer obsession, you can teach that um to people as they come in. Some of these things are sort of teachable and some of these things are innate. >> What are other common mistakes you see either on résumés or candidates do when applying to jobs? >> They will stuff like list every framework that they've ever written like one line. >> Yeah. Yeah. in it's just like oh you know node and PHP and SQL and cobalt and you're like okay >> I guess they think that that's the eye-catching part like they they think if they put like AI machine learning or all these buzzwords NLP LLM that it will catch the eyes of recruiters but I'm guessing that's not the case >> breath versus depth depth will always win >> and so what you want to do is you want to be like if you're like really good at a particular framework or a particular aspect of a framework >> putting that there and just being like I am so deep on this one thing that's so much better than what everybody does which is like names 30 technologies >> that are there and so like if you can be like an inch wide and a mile deep >> that's so much better in terms of like okay so hey I'm not getting any call backs trying to get a job well like go into your favorite framework go to the release notes look at like the new features or capabilities that are there and then just be like okay well whatever this capability is nobody knows how to use it. I'm going to become an expert in this thing, >> right? Just on that one feature and you can go write up a blog post on it >> and then like teach the entire world how to use that feature. >> Uhhuh. >> And then like >> people will reach out to you after that. >> Yes. Now you're a magnet, right? Instead of like searching for other just post it on your LinkedIn. >> All right. So, moving on from that, you applied, sent your resume in. Instead of swiping left, the recruiter swiped right on you and they're giving you a call back. What do you do then? >> Yeah. So, you you have to realize that the recruiter and the hiring manager have different incentives. >> Okay. >> So, a recruiter is a higher performer if they get more offers extended and more hires. >> Mhm. >> But a hiring manager, they're trying to find like the best person possible for the team. And so, a recruiter when they call you back is just like trying to figure out if you speak English, if that's, you know, the language they're using, that you are who you say you are. and that like all of the things on the resume like that you're looking for sanity check pretty much. >> Yeah. They're like, "Okay, well this position is, you know, in person. Are you prepared to move here? Can you hold a conversation?" >> Yeah. >> You know, I'm I'm going to ask you some questions and you answer them. You're not a robot. You're not some sort of AI. That's all they're trying to do is just the double check that you're qualified. And if you're qualified, then they're going to set up the technical screens. But you have to just recognize that like recruiters are on your side. I think a lot of times people have this misconception that recruiters and hiring managers and people at the company, they're all it's like perfect communication and they're all trained up. Like the recruiter is just trying to get as many people hired as possible. You have to recognize that they're on your side. They might just give you a guide on the questions that are going to show up in the interview. Okay? >> They'll be like, "Hey, there's a behavioral round. Here's a video or here's a set of questions or here's a slide deck of all of the questions that we might ask. Those questions are going to be on the interview." >> Uh-huh. Uh-huh. So just like take those and make sure that if they ask you any of those questions, you're not like trying to formulate something like right away. Like if the recruiters could, they would tell you exactly what was on the interview, but they can't. So they're going to do the next best possible thing. And so any resources that they give you, like you should take and just take really seriously. But, you know, I think the call back is just be like, "Yeah, I'm a normal person looking for a job." >> Yeah. What do you look for in a candidate for a behavioral interview? Well, it depends on the the question, but really what I'm looking for it's do do people have perspective on their actions? Right? So, give give me a behavioral question. >> What are your biggest strengths and weaknesses? >> Sure. There's the topical question which are like what are my strengths and weaknesses? The question behind that question is basically do I am I like self-aware? And so the best way to answer that question is to have done those behaviors. Mhm. >> Have you thought about your strengths and your weaknesses? >> I mean, >> I'm not literally asking. That was that was rhetorical. But what I'm getting at is like, "Oh, well, I'm pretty good at like data analysis. I'm really good at like unblocking myself." >> Mhm. >> Right. That would be an okay answer. Most of the time people don't think about their weaknesses, >> right? And so, like, do you ever want to work with somebody that's like super stubborn and doesn't take feedback and, you know, is just like blissfully unaware of the world? The best answers are people who have thought about those things. So if you haven't thought about those things, do that now >> and then think about like, oh well, nobody gives me feedback on my stuff. Well, have you asked for feedback? >> I want to ask you about AI. What's your opinion on that? Will AI replace software engineers? >> No. >> No, >> absolutely not. >> Expand, please. >> Uh, what am I an AI? You're like, [laughter] hey, this sentence needs to be a little >> needs to be longer. Yeah. >> Yeah. I I just the code was never everything, right? And so just think about what a programming language is. It's a a programming language is basically a set of instructions that turn those instructions into zeros and ones like instructions that you would send through your CPU or GPU. And so it's just another layer of abstraction. I think with AI, instead of the programming language being syntax like C or Java or Python, >> the programming language is English. And so you still have to like tell the computer what to do and it just goes off the rails a lot of the times, but it doesn't replace the problem solving, right? And so I think, you know, guys that are my age, so I'm like 43, we have a very we're very skeptical about AI cuz at the end of the day, like bad work is so expensive because you paid this person to create bad work and >> waste of time. So there's an opportunity cost associated with it, but then also now you have to fix it. So now you've like double or tripled it. And so like in this situation where you're trying to move faster, it's actually very expensive. And then you and you still have to do it. >> So the risks of AI is too high right now. So you don't think AI will ever become 100%. >> If it could, then um I'll eat my words and I'll be wrong. If they can go from zero to one and a non-programmer with English can just like build a thing without like security vulnerabilities and like no bugs >> then yeah it will replace us >> but it will also replace essentially every job where you use your >> in the world. Yeah. >> Uh every every office job. >> So what will software engineering look like in say 10 years from now in your opinion? What it will look like is you will have a set of agents that know how to code and you're going to get assigned a problem >> and your job is to like farm that work out to your agents and make sure they don't go off the rails and then make sure that the thing that you were assigned to do that has, you know, that's super important actually gets done. >> And so your job is probably going to look a little bit more like what a team lead does today. >> Is learning to code still worth it in 2025? Yeah, I think so. There is an overemphasis on code. And so just like what what are we doing with code? What are we trying to do with code? And I think what it comes down to is like we're trying to solve problems. We're trying to solve problems that are easy for computers to solve but kind of hard for humans to solve. That's what we're doing with code. >> Mhm. >> And so you should learn how to code so that you understand how coding works and how that your solution is going to work. And then also how to fix things. >> Mhm. >> I think it's it's super important. It's not going to be important for everybody, but for the people that are problem solvers, I think it will be important because you will be taking all of these AI coding agents and then making sure that they're doing the right thing. Well, Steve, thank you so much for being on this video. I really hope that you guys got a lot of value out of it. And if you did, make sure to hit the like button, subscribe if you haven't already. Be sure to also check out Steve's YouTube channel. Link for that will also be in the description. And just as always, I'll see you guys next
