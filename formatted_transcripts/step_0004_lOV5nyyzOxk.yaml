transcript: Today's video will require much more bravery than I actually have. So, it's going to be tough. But, I thought about doing this and insisting because I know that some other people might be going through the same and that being the one who was left is not pretty. The aftermath I've been experiencing is quite long. Being the one who was left is lonely in a very particular form because all I can remember was having to destroy expectations, my hopes, my desires to share something. And the moment in which you have to do it tends to be the moment that you're feeling them more intensely. And I was really willing to stay so much. I made some mistakes and I forgot uh to value what I was and what I had to offer. I reached a moment in which all I had felt weak, felt unnecessary, and even a little disgusting. After a couple of frustrations, I learned how to expect things to end. And I learned not to hope too much. That happened because I was once caught off guard and being quite honest, I'm still uh picking up the pieces of missing someone for way too long and realizing I was not wanted uh even near. It's not very easy for me to turn something deep into something uh meaningless or at least indifferent. I don't think I possess that capability of becoming indifferent to something that once mattered to me a lot. And I struggle with uh the absence of whoever was there. I struggle so much. It taints everything I am and everything I do. I still have many nightmares of someone who hurt me a lot in the ways that he chose to do things. And these nightmares happened for over 5 years. There were moments in which they happened daily until they didn't. Not that they they didn't happen anymore, but they stopped happening so often. However, something I could never run away from was and and it's bad cuz I start shaking when I talk try to uh tell this story, but it was someone who used to hurt me a lot and then accept me again. And I was walking on eggshells very constantly, but I wanted him so much. But he was the person who hurt me the most and the person who I went for comfort as well. That became so intertwined that years later, whenever I go through something that's very difficult, the hardwiring still activates. And it's very humiliating to admit that. Nowadays, it doesn't activate as in wanting him to be here, but it is still there regardless of going after his memories. But what is difficult to explain is that we are the ones who who are left don't choose. It sounds simple. It sounds like you can just choose to stop thinking about it. But it's sometimes it's even unconscious. And it's very very very very humbling. I I changed a lot. The version that existed before didn't anymore. And that brought me to another moment that was more difficult because I had to rebuild slowly and I had to try to find some senses, uh some extra hopes in life, and I had to become brave enough to want connection again, and that hurt me profoundly later cuz I thought after many years I was stronger, I could recognize signs, and be better, but I am still as vulnerable as before in many ways. I'm slightly more aware, boom boom, my awareness doesn't always protect me. It does when I hear it, but the moments I decided to shush it were the ones that hurt the most, and I don't like to say that it was something bad. I think I felt, and I don't know how to leave this, but I think I felt embarrassed for trying too hard, wanting to stay. And I even need to admit that I was so desperate to stay, I would accept anything, however small. Uh things changed forms, I would accept that. Things were a little, I would accept that. But after years, you realize it's too expensive to s- to continue shushing yourself and ignoring your needs. And even though I tried, I couldn't. I spent a lot of energy trying to understand the other side and knowing that they were struggling, that they had other things that went beyond me, but it really sucks to to realize that no matter what I did, I wasn't enough of a reason to stay, and that I I can't accept, but I wasn't enough of a reason to be treated a little bit nicely. I had to figure things out. I had to make sense of words that didn't match, of actions that were changing, and things that I quite frankly missed. And it was such a dark period cuz I had to admit I wanted the small things back. I wanted I wanted to feel as if I was wanted. And nowadays, I expect even more for everything that's on the table to be fleeting. Up to a point I don't I don't relate anymore. I tried. But it hurt uh so much that I think that part of me kind of accepted that it's it's not for me. My my brain knew that maybe even my presence would bother them somehow. And that is such a shameful place to be. Like, you don't you don't consciously want to be insisting on a person who just [clears throat] the thought of you makes them want to escape. You don't want that. But it normally comes after attachment. It comes after you saw a version of them who was different, who who was there with you. Something that keeps coming back to my mind was when I was noticing I was developing some attachment. I told him, "Just please don't make me dream." And I said it so honestly. But he made me dream just for me to see how much of that would never happen. All all I know is what it is to try to build something by yourself when somebody leaves. I ended up realizing that somehow there's something so broken in me that's kind of unapproachable. Each time someone got close, they saw something they needed to run away from. That doesn't make it very comfortable for me to want people to see who I am anymore. Because the ones I wanted to stay were the ones who left. I stopped understanding that as a genuine. I I lost the ability to imagine that one person wants to stay with me for good or at least for something that lasts. >> [snorts] >> I lost that ability. It's like now I expect people to go and not want to stay. That doesn't make any less painful. It still hurts a lot. But it's my default system. And I became tougher on the outside, but all the internal world that I still possess doesn't really have where to go. I put energy on my hobbies, on things I like, but I lost a lot. I lost part of my identity. I lost a part that believed that was >> [sighs] >> worthy of something. And I wish I understood the whys. I wish things were different. And I I wish I didn't miss the feeling of being cared for the way I do. Cuz I had to destroy the the things I lived >> [snorts] >> that became super ugly, forced me to destroy any [snorts] sense of them mattering to the other person. Not mattering in their own way, mattering at all. Many years ago, I had a conversation in which he told me I would forget it easily. It would be easily gone. And I I think today I'm here to say it's not gone. That day I refuted you and I told you that I knew that it wasn't like that. That angry words alone wouldn't help me and that I wouldn't forget easily. You did, but I did not. I'm still living the consequences of how things were done and I know you're not here anymore. I know you don't want to. I know you don't even think of me when I lie down and I'm feeling distressed, your face comes to me. >> [snorts] >> I dream of you constantly and not in good ways. I I dream of you hurting me. I dream of you ignoring me. Your face remains untouched in my mind. And all this makes me feel completely weak and perhaps feeling this much is also being a source of pain to someone who maybe by hearing this won't become me. I just hope whoever's watching this, I hope you validate yourself in ways I could not do cuz I just I I wanted to be validated so desperately. I wanted to show that I cared. I I cared about the insignificant things. I I cared about everything. Maybe I wish I could protect my previous version the way I did not cuz I frankly believed that you would want to protect her as well, at least a little bit. I believed that if you were ever to let her down, that you would try to let her down slowly and that you wouldn't leave her suffering that much cuz she didn't know, but you did. And this is whatever's left of me after so long. I carried this to other relationships even though I didn't want to. To how I present in the world and to how I sleep at night. And you know what? I wish I had been brave enough, bold enough to speak up since the beginning cuz maybe today I would be a little bit prouder of who I was. She She deserved a little more humanity. Not that you stayed but a little more care. Cuz I showed you care. But I guess I ended up learning what it is to give something without expecting anything in return. And how that can be very painful. So much I don't think I want to give it anymore. If you're also going through this I'm sorry. I I know the confusion in my own ways. I know the embarrassment. I know the shame. And I know how hard it is to escape. I know how much you try with all your energy sometimes. And I also know how certain days can be much much harder. If you feel like you want to share or put your story out there, if you feel like this is going to give you any sense of relief, I invite you to do it. And I really hope that you trust yourself a little bit more than I do. Cuz I'm still learning. I hope you look at me and even if you feel that's too embarrassing and you see that feeling too much as a prize and that you need to protect it or at least you need to find people who will also protect it or treat it carefully instead of letting you with the whole mess to yourself. The one reason why this hurts so much is because I was afraid. And I wish I was held in my fear instead of being alone with it. But I learned what it is to protect myself later. But I know I could survive. Even though this is the version that survived. I wish one day I can say I'm a little bit prouder than I am today of my own self.
