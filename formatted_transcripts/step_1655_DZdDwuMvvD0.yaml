transcript: You will walk away from today's video with this. This is the schematic document for the embedded systems project that you and I will be completing as part of a video series. Not only that, I'm going to take you through every single design decision that was made on the way to creating this so you can understand why things are done, not just how they are done. I want to start off with what this tutorial is intended to be and what it is not intended to be. It is not intended to be a tutorial that you blindly follow along, copy and pasting everything that I'm doing and end up with something you have no idea or understanding of like a lot of coding tutorials out there. I'm going to be going through and thoroughly explaining every design decision that I make. And what I want you to do is think about why that decision was important, what trade-offs were made because of that decision, and how you could apply that in a more broad context. This is an example of embedded systems design on an example project. What I want you to do is take the concepts that I'm trying to convey in this video, isolate them from the project. Okay? The project doesn't matter. I want you to learn how to make these design decisions in your own projects, in your own designs, because that's actually what's important. This is also not a tutorial that will in-depth teach you the electronics design tools. I'm going to be using Keycad in this video, but it is not a tutorial on how to use Keycad. There are plenty of them out there on YouTube, and me doing one adds no value to the scene. What I want to do is show you how to use the tools in a meaningful way. So, what exactly is this project? Well, this is Silly Scope, an oscilloscope that nobody would or ever should use. The reason for that is because it's an introductory project, its scope is going to be quite limited in terms of what it can do, but it's still going to be pretty fun and teach us a lot of good fundamentals. Now, you might remember an oscilloscope is something I talked about in my previous video where I introduced three embedded projects that students did at a real university. We're going to be going through the second one because personally, I believe this one is super valuable for teaching you the fundamentals of electronics and electronic design. Now that we know what our project is, we come to the first important design step, which is taking the abstract idea of an oscilloscope and actually mapping it out into highlevel substructures and components. The reason we do this is because it takes our just random idea and we say, okay, these are the requirements. This is what features it needs to have. This is what it has to do. And it actually breaks that up. And we need to identify how that's actually going to happen. So let's go with our oscilloscope over here. The first thing we notice about our oscilloscope is this big beautiful display. So naturally our oscilloscope project will also require a big beautiful display. And I want you to take your project idea and do the same process. So your project idea you want to be able to do this and this and this and this. What components are actually required to make that happen? Let's keep going. The next thing we notice are these four channel connectors down here. 1 2 3 and four. Now of course this is the line that our signal input is going to come in. So, of course, our oscilloscope is going to need these as well. And we can decide on how many channels and how many connectors we're going to want. We also have this channel selection button, channel enable button here. And that's important, right? If we're going to have multiple channels. So, we might want to incorporate some buttons into our design. We've also got these knobs for the scale controls. Maybe we also want to do that as well. We've got this run and stop button here for starting and stopping. They are signal display updates. And we have a USB connection down here where we can save recordings to a USB drive. Finally, and arguably the most important component of all, is an analog to digital converter. So, of course, our oscilloscope is operating in the analog domain. But in order for our microcontroller to display and record the information, it needs to be converted to the digital domain. So, of course, we're going to need an analog to digital converter. This is going to make up the core of our oscilloscope function. These are all really useful and really important things that our project might want. And you can sort of see the process I'm going through here where I'm taking the abstract idea of an oscilloscope and breaking it down into components we can add to our design that will actually make the functionality happen. Now that we have a vague idea of what the project is going to look like, we have to define the requirements and the scope. And of course, these are going to change as the design progresses, but they give us an initial target that we're going to aim for because of course the initial design is going to have problems. Of course, as the project progresses, we're going to add to the scope or remove from the scope. You know, like this would be nice to have or we can't technically feasibly achieve this with the current direction. This is called iterative design, and you're going to see iterative design throughout this video series. The key takeaway for the moment is that I have defined my hardware requirements in red and my firmware requirements in pink. Let's go through the list. The first thing is a hardware requirement. I want to have two channels. I need to have two physical connectors that I can attach oscilloscope leads to and probe my channels. The next thing is a hardware requirement as well. I need a graphic display and the firmware requirement is it has to show one channel. So I have to code my firmware such that on the graphic display which is a hardware thing. We've got to have one on there. We can show one channel at a time. The next thing is a hardware requirement. I want to have a 0 to 3.3 volt range. Now the reason I have done this is to keep this introductory project simple. You can add an analog stage to our input pipeline before it reaches the ADC to add offsets or to scale higher voltages. The reason we've done this is because our little ADC chip, it can't take infinite voltage. All right? And it certainly can't take negative voltage without assistance. So, what we have to do is limit our input range to 0 to 3.3 volts for now. We could add an analog stage with op amps if we want to shift negative voltages up or scale large voltages down. But this is a thing for a future uh iteration of the design. And this is what I'm talking about. Right? For now, we're keeping things simple and accepting only this 0 to 3.3 volt range. Next, I need it to be accurate to 500 kHz. Why is this a hardware requirement? Well, the ADC that we are going to be using needs to be able to provide a sample rate of this. Now, you guys might have heard of the Nyquist rate. That means that to avoid aliasing, we need to sample at a rate of 2F max. That is fine for uh getting the gist of a signal, I suppose, but in order to display a high resolution signal, we're going to need a bit better than that. And I'm going to display a graphic up on screen that illustrates this. Ideally, I kind of want to aim for at least 10 points per signal period. Uh so, in this case, we have to be operating or sampling at 10 times this rate in order to achieve that. The next thing is listed as both a hardware and a firmware requirement because it kind of is. data streaming and logging to the PC. Of course, I want to be able to record signal sessions and log them to a PC and potentially even display the other channel because remember we can only show one channel on the LCD. I could potentially show that other channel on the PC if I'm streaming the data over in real time. So, what that's going to look like is a little USB connector on our device. And we're going to need some PC software that receives data and logs it to like a CSV or something like this. So this is both a hardware requirement because we need a USB connector on there and a firmware requirement because we have to implement some kind of data streaming and logging protocol. The next thing I want to do is be small form factor. Okay, this is why I've selected two channels for this. I think having a small form factor kind of signal an analysis device would be pretty cool. It's definitely no logic analyzer or proper oscilloscope, but keeping this thing small form factor would add some value to the project. So I want to try and make it as small as possible. How small can we make it? I actually don't know at this stage. I just know that that is something I want to have and we can define that later on as we get a better idea of how this project is going to come together. And that along with everything else I've been showing you is this iterative design process. Next, I want to have buttons, which are a hardware requirement. I need physical push buttons on there for channel activation. So, just like our oscilloscope examples we were looking at, we need to be able to push buttons to turn channels on and off. We also need a button. That's another hardware requirement with the firmware requirement of it needs to start or stop recording. So, for example, it could start or stop the data streaming to the PC I was talking about just before. Next, I need LED indicators. This is a hardware requirement. I've got to have LEDs on the board for power, channel activity, recording, etc. So, this is implemented in firmware like what those LEDs are actually used for. And these are the initial requirements of my system. Without further ado, let's get designing the hardware. The next thing I want you to do is open up a spreadsheeting application and lay it out kind of like this. This is a bill of materials. You can think of it as a shopping list for all of the electronic components that we need to construct the hardware of the device. Also, I want you to get up the website of your favorite electronics manufacturer. At least here in Australia, the main ones we use are usually Digi Key or Mouser, but it may vary for your country. Choosing a microcontroller is one of the most important decisions you make about your project. And I'm going to make a completely separate video detailing how to decide on which microcontroller to use because I think that will be much more useful than hamfisting it into this particular video. But I'm going to briefly go over the reasons why I chose this particular one right now. I'm going to be straight up with you guys. The main reason I chose this one is because I have a dev board of it lying around. This is a STM32 uh L432 devboard. I have one of those lying around, but there are technical reasons as well, which I'll briefly cover right now. First off, they are very small. This particular one is really small. It is 32 UFQPN package. It's a very small chip and that fits my small scope requirement. The reason why I went with an STM32 microcontroller is also because this is an introductory tutorial for you guys. I want to show you how to use the STM32 cube ecosystem because it is a really powerful code generation utility and we use it all the time in industry. So I want to give you an introduction to that. That's why I chose an STM32 microcontroller. Additionally, this particular microcontroller has an ADC built in. So let me see if I can find that. Here we have a 12bit ADC at 5 mega samples per second. So think about that number. 5 mega samples per second. That is 10 times our 500 kHz rate. So technically this should in a perfect world work out just perfectly. This is also described as an ultra low power chip. This is important for us because of our small scope. We can add battery power as a power source later on down the line. And for that we'll want to use an ultra low power chip maybe in advance so that that's an easy transition for us. Now you'll notice that I didn't add battery power in the previous section. That's because I'm adding battery power in as a later design iteration we can do somewhere down the line after the first prototype. But I'm making this decision now knowing that that could be a possibility in the future. So, we want to use a low power chip. You'll notice it also has support for USB, which is essential because we want that data streaming functionality. Now that we've decided on this, I can go ahead and add it to our bomb. You'll see I put the part number in here, the description here, the manufacturer, the package, the designator. This can change depending on how we mess with our schematics. So, just keep that in mind. The quantity that we're going to need, the price, this is in Australian dollars, by the way, and the real price, which is the quantity times the unit price. And of course, a link to the URL where we can buy this component from. So, we're going to fill this out as we find out what else we need. Open up Keycad, start a new project, and head on over to the schematic editor. We're going to start with a completely blank schematic. So, what I want you to do is go on over to the page where we have our component. And most providers will give you this little models tab right here. So, if we go on over to the models, you'll notice we have three things available to us. We have the symbol, the footprint, and the 3D model. If you're not familiar with these, I'll briefly tell you what they are. The symbol is what's going to go on our electronic schematic. The schematic is the electrical representation of what's going on. You might have seen like a PCB layout. All right, a PCB layout and a schematic. These are two different things. The schematic, it refers to how electrically everything is connected. The PCB is the physical manifestation of that where we actually put the thing on a circuit board, place all of the individual components with their real sizes and their real layouts and we do the routing all all like that. The schematic is the pure electrical representation and it's an important first step so that when we do our PCB design, we know how everything should wire together. The footprint is what I was referring to just before. So the footprint is this physical representation of our component. It's what it will actually be when it's placed on our PCB. And the 3D model is what we can use in a lot of designers like Alteium for instance will have a 3D model where you can actually place these components and see what your PCB is going to look like. Go ahead and download with select download format. And for me, I'm going to choose Keycad V6, of course, because that's what I'm using. If you prefer to use something else, go ahead and do that. And then just hit download. Go ahead and place that on the schematic. Like I said before, this isn't a tutorial on how to use the tool, so I assume you already know how to import the symbol that you've just downloaded and just place it anywhere you like. Digi Key and Mouser do have a selection of displays, but oftent times I find it's a bit limited, not really what I'm looking for, or they're a little bit on the expensive side. So, I also use this distributor here. This is by Display. Now, be aware this is a Chinese distributor, so shipping times to your location will probably be a little bit poor compared to DigiKey or Mouser. Let's go ahead and look at their product selection. So, I'm interested in graphic LCD displays. Of course, they sell a variety, including character LCD displays, which you've probably seen in Arduino tutorials before, but we want to display fullon graphics, custom graphics. And so, we're looking for these graphic LCD displays. And I'm going to have a look at the modules. You'll notice right off the bat, there are some that we won't be interested in, like these sort of more slimmer profile ones. They're not going to be very good for displaying our captured signal, which is what our oscilloscope is all about. We're more likely to be wanting ones like this with this kind of aspect ratio. I want a SPI interface because our microcontroller is quite small and it doesn't have that many pins. We don't really have the budget for an 8bit parallel interface. So, we're going to use Spy for that. Also, I want one with a backlight, which we can select here as well. So, backlight color. And this one here looks like an excellent fit. This is a 2.8 in, so pretty small. It's got a white backlight, which is going to look pretty sharp. It's 192 by 96, so I think that gives us quite a lot of room to play with. You can see here it's detailed enough for this picture of a guy's face. So, I think it's going to be good enough to draw our received signals for our oscilloscope. And it uses the ST75256 controller. So, guys, it's important when you're choosing a display, there are two things to consider. The first is this panel. So this panel module is actually not the same thing as the controller. You can mix and match panels and controllers. So what this is saying here is we've got a white 192x96 panel that is using this controller here. So this controller is what we're actually going to be talking to over three wire spy. And you can see down here if we look at the data sheets, there's a data sheet here which is for the panel like the panel module which is going to include the uh pin interface, the sizing and things like this. But you'll also notice there is a much more detailed ST75256 which is the data sheet for the driver. And you can see here we've got some timing diagrams and things like this which is going to be important when we write our communication driver. Another thing I really like about by display is that they give code examples for the drivers. Now I have found the code quality of these examples to be quite poor. But what it is good at is giving you a code-based illustration of these timing diagrams so that we can write our own communications library kind of based around this but with a little bit better code quality. And if you don't know how to write your own communications library based on this by display example code, well, I have a full tutorial where I go through and do it for an e-aper display that I used in a different project. So, this is a really good introduction to embedded graphics. You'll learn about frame buffers, bit maps, vectors, fonts, and things like this. And also how to write your own communications library, which is going to be important for our oscilloscope project, but we'll get to that later on. The only thing about buyisplay is that they don't give you a footprint or a schematic. Footprint doesn't really matter because this is a breakout module. But in terms of the symbol for our schematic, that's going to be important. I've done one up here with Keycad symbol editor. Again, like I said, this isn't a tutorial on how to use Keycad. So, I assume that you already know how to do this. We've got two big components here. We've got our microcontroller and our LCD. Let's start wiring some things up. Now, the first thing that we're going to notice is there's no power. We don't have any power in this design yet. And this is where the concept of power rails comes in, guys. So a power rail, you can think of it as essentially just a line that you can draw power from. So for example, with this VDD here and VDD1 and VDD ref, these all need to be connected to a power rail. The same thing goes for LEDA and VDD. And the number of voltage rails we need is going to be dependent on the differing voltages required by our components. So, for example, if this MCU over here needs 3.3 volts and this LCD backlight requires 5 volts, then we'll need a 3.3 volt and a 5V power rail in our design. Fortunately for us, as we'll see in the data sheet, we only need one power rail in this design because this guy works off 3.3 volts and this guy works off 3.3 volts. But let's go ahead and show you where you actually find this kind of information. First, let's check out the display that we just chose. So if we scroll down and click on the module data sheet, you'll notice in the sidebar, we have a section called electrical specification. And one of these headings is called absolute maximum ratings. So if you come over here, you'll see that the power supply for the logic. Now, this is the controller chip that we were just talking about. Remember I told you there's a difference between the controller chip and the panel. You'll see that the maximum voltage this can take is 4 volts. So the power supply for the LCD that's the backlight or the for the panel module the maximum this can take is 19 volts. So we have to be careful not to be exceeding these values. Now if you look down here we can see the typical characteristics. So the power supply for the LCM that's VDD to VSSs is typically 3.3 volts and so we'll aim to have a 3.3 volt power rail but we do have tolerance to go a little bit below or a little bit above depending on the other components in our system. If we take a look at our little microcontroller, you can see immediately there's a 1.71 to 3.6 volt power supply. So that 3.3 volts is looking pretty fine. We can also see there's an absolute max rating section over here as well. And you'll see that the absolute max of VDDX to VSSs is 4 V. We don't really want to be hitting that. So as long as we stay in that range of 1.7 to 3.6, we're going to be chilling. So, let's just add one 3.3 volt rail to our design. Whoa, whoa, whoa, whoa. Buddy, hold your horses. Hold your horses right there. We've already made a critical mistake. So, guys, all I've done is wired up 3.3 volts to our display and our microcontroller. What could be so wrong about this? Oh, my sweet summer child. Let me tell you what's wrong with this. We have forgotten to include decoupling capacitors. These are really important. I'm not going to go on a big spiel about how they work. Dave from EEV blog has an excellent video on it, so I'll link that in in the description. But essentially what a decoupling capacitor is, as our integrated circuit switches, so turns on and off, this is going to create noise on our input voltage rail that we want to avoid by adding a local power supply to help stabilize it when the voltage ducks due to the transistors switching on and off. So that sounds really complicated, but actually we have a nice little application note from ST that essentially tells us how to do this. So what I'm looking at here guys is application note 4555 getting started with STM32 L4 series hardware development. If we come down here to the recommendations section, you'll see that we have a decoupling section where it tells us what we want to be doing. So you can see here we want to add this decoupling capacitor to VDD and VSSS as close to the chip as possible. You'll notice over here in the recommendations section for decoupling you'll see each power supply pair. So that's VDD and VSSs should be decoupled with ceramic capacitors of 100 nanopharads that's 0.1 micro and a tantelum or ceramic capacitor of around 10 microfarads connected in parallel on the devices. What that means in real terms, and we can see that down here with the reference design as well, is that you need one of these for every VDD VSSS pair. Now, you can see the decoupling capacitors are in place according to the application note. And I've also added a note of my own to say where these individual capacitors should be placed in proximity to these pins. Now, if we scroll down to the bottom here, you'll note that they are connected to the VSSs pairs and ground, which is as it should be. You'll notice I have not actually added a decoupling capacitor on this LCD module. Why is that? Well, if we go over to the website and we actually look at the back here, you'll note that there are some capacitors already on the back of the board. This may not always be the case. So, it's a good thing to just check out for yourself. We can trace from this VDD pin here that there is a capacitor C1 which is actually already decoupling VDD. So, do we actually need this? We can look further into this. If you scroll down to this uh tutorial and example and just download it, there is a interfacing guide that already says this. And you'll notice that there are no capacitors in this thing. So, I'm going to take their word for it and say we don't need it. We can always add some later if we find that we do need it. But for now, I'm going to leave them out because of this. For this next part, we're going to start using STM32QMX to do the pin definition on our microcontroller. So, go to the link in the description and download this if you haven't already. I believe you need an ST account. But anyway, once you've done that, all you want to do is go to file, new project, and it will open up the MCU selector window where we're going to actually choose the board that we need. Up here where it says commercial part number, we can just simply start typing our MCU. So, we're using the STM32 L432 KCU6. And once we've done that, you come over here and you can go ahead and hit start project. Now, what STM Cubmax is going to let us do is it's going to let us configure the hardware of the device. Previously, you might have seen people configure things on the register level, and I still genuinely believe that is really important if you haven't done anything like that before. But once you have done it and you understand how all the register stuff works, SCM32 Cubamax accelerates the hardware initialization by generating it all for you. once you configure it in this nice graphical interface. So here we have our representation of our microcontroller and we can change all kinds of things about it. And the first thing we can go ahead and do is go over to connectivity and we'll select spy 1 because remember we're talking to our LCD over spy. So we can go ahead and change this mode. There's a lot of modes here. What we're interested in is transmit only master because we're not getting anything back from the LCD. We're only transmitting to it. You've got other modes here if you need to receive from devices as well, but for this case, we're a transmiton master. And I'm going to disable the hardware NSS signal, that is hardware chip select signal, because I'm not really sure what kind of protocol this thing uses, and I'm not sure if we can just hand it all over to the spy controller and let it just do its thing. So, we're going to use software chip select for now. I may come back and change this in the future, but you can see down here now that we've enabled it, we've got two pins that are assigned to spy one. And we can actually go ahead and change these to a different one. You'll notice that if you click on one of these pins, you can get a whole list of alternate functions. You'll notice we can change other things about the spy controller as well, like the data size and the speed. I'm going to leave these for now as default. They are incorrect. Let me get this across. They are incorrect in the default settings as they usually are unless you get super super lucky. But right now for our schematic, I only care about pin definitions. So I'm going to leave these for another video. Of course, one of the main reasons we chose this microcontroller is because it has an ADC on board. So let's go ahead over to analog and enable ADC1. But I'm just going to use these ones. We're going to change this to single-ended differential. Don't worry about it too much for now. And you'll notice something crazy happened. Spy 1 clock which used to be over here on PA1 I think has jumped because our ADC input is only available on this pin but the clock can be on PA5 as well. So STM32 CubaMax has resolved that conflict for us. Very nice of it but be careful. This might trip you up if you are enabling and disabling things in your own design and suddenly something has jumped and you didn't anticipate it. So just be very careful when you're changing these things. Now, when we're assigning GPIO, it's a good idea to group like things together. So, things that are going to go to the same place. Generally speaking, you want to group them together because this is what our microcontroller layout is going to look like on the PCB. So, for example, I want the chip select for the spy to go to the LCD, of course. And so, I'm going to group it with the rest of this spy bus because that's going to go to our LCD. So, I'm going to say PB0 here is probably going to be a good option for our LCD chip select. And I'm just going to enter a user label and call it LCDCS. Thinking about the other GPIO we're going to need, if you look back at our requirements, we have three GPIO inputs that we're going to need for these buttons. And we have a few LED indicators that are going to be outputs. So, what I'm actually going to do is assign the buttons as interrupts and the LEDs as just GPIO output. There's a trap for young players doing GPIO interrupts on STDM32s. If you look, we have A, uh, we have B, and we have C. Now if you click on this you'll notice GPIO XTI6 for PA6 right so each pin like PA6 does not actually get its own dedicated interrupt line it shares it with similarly named pins so for example GPIO XTI6 would be shared with G uh PB6 right here you can see like that so we can only have one per thing you can see if I change this to XI6 we get disabled on PA6 so we have to have a dedicated pin number for each GPIO interrupt we want to do. So, I'm just going to go ahead and do that. PA4 is button channel 2, PA6 is button record, and PB1 is channel one. The reason I've grouped them with the spy stuff is because I envision the buttons on my PCB to be underneath the LCD. So, they're going to go to roughly the same place on the board. And of course, the button GPIOs are all interrupt pins. So, when the user presses the button, our firmware will get an interrupt about it. Up here, I'm going to define three GPIO outputs for our LEDs. Just do them like so. And now I've given them user labels. Since we desire USB streaming functionality, I'm going to go ahead and enable USB. So, we come down here in connectivity, enable the device, and under middleware and software packs. If you scroll down, you'll see USB device. We're going to change this to communication device class virtual compport. This is going to give us a serial port that we can open and read data that's going to be streamed to us. I'm going to leave it unconfigured for now, but you can see USBDP and USBDM have appeared over here on PA12 and PA1. I know this is getting boring, guys. All of this same STM cube application blah blah blah. We're nearly done. I promise. We need to add a debug interface to our application. Otherwise, we're not going to be able to program any software onto it. So if we go back over to this beautiful application note we had which previously we used for decoupling capacitors, it's AN4555. It gives us a note about debug interfaces. There are two main ones really that people use. There's JTAG and S SWD. We're going to use S SWD because it only requires two GPIO wires whereas JTAG takes up much more than that. And of course we have our small little microcontroller which is a bit GPIO constrained on a 32 pin. So, I think SWD is the better choice. So, we're going to need three wires for this. NRST, S SW clock, and S SWDIO. If you head on over to system core, and you go to SIS on debug, we can change this to serial wire. And you can see our S SW clock and S SWDI load up. Now, I also want a UART to be able to debug this thing on. So, I'm going to go over to UART one under um connectivity, and I'm going to go ahead and enable asynchronous mode. And you can see UART1 RX and UART1 TX have just lit up as well. Now that we've done a fair amount of our pin definitions, we can actually start filling out our schematic. So, what I'm going to do is fill out all of the signals that our microcontroller is going to use that we've defined in STM32 Cube. If you've got two monitors, this is where this really helps. These changes look really scary, but I promise guys, literally all that I've done is broken out all of these pins into little signals according to what we did in Cuba Max. It's literally identical, one to one, and that's what we want to be doing. We've got a whole heap of blank space over here. So, I'm going to go in and add some LEDs. If you remember, we need three of them because that was part of our requirements. And the next thing I'm going to add to these LEDs, guys, is current limiting resistors. Cuz here's the deal. We are going to connect these LEDs directly to our microcontroller. Now, this guy cannot draw infinite current from the GPIO's. So, what we're going to have to do is limit the current that goes to all of these LEDs. Number one, so that we don't burn out these LEDs, and number two, so that we don't burn out our little microcontroller. Now, we're in the data sheet for our little microcontroller. Underneath the absolute maximum ratings heading, if we go on over to table 19, which is current characteristics, you'll notice here we have the sum of IO. So you look at this one. The total output current sourced by the sum of all IO's and control pins cannot exceed 100 milliamps. So that means we cannot output more than 100 milliamps of current on all of our IO's combined. There is a trick to calculating the resistor value that we need to use for our LED. It's this formula right here. So it says the resistor is going to be equal to the VBAT. So in our case, that's our power source, which would be 3.3 minus the voltage of the LED, the forward voltage of the LED divided by the current that you want to go through that LED. So we're going to calculate that with real LEDs. If we go on to DigiKey and we go products and we go LEDs and then we go LED indication discrete, we can get an idea of what kind of forward volta