 set yourself up to fall in love. Cuz\n[79.28s] people don''t fall in love anymore.\n[80.56s] Dating has become like a job interview.\n[81.96s] What do you How much money do you make?\n[83.04s] And what do you do this? And do you want\n[84.04s] to have kids? And do you want to do\n[84.92s] this? It''s not like this organic feeling\n[86.76s] of falling in love is is governed by\n[88.68s] dopamine. That phase is dopamine.\n[90.04s] >> That is so true."}'
