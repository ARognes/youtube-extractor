type: video
transcript: What can you do with hope that you cannot do without hope? I want to collect your answers on this because by the end of this video, I promise you your answers are going to change dramatically. And I want to talk about hope today because I think I'm realizing that hope stands in between us and peace. Hope is a motion. It is always moving. And it always wants to be in the future. It is dissatisfied with the current situation and it is hoping for a better one. And it always looks forward to the future. But this wanting state this discontent state is opposed to the state of peace, which is contentment and not motion but stillness. Because the wanting mind, which is the hoping mind will always want. That's what it does. The better we get at wanting, at hoping the worse we are at being content, at arriving at the place we're looking forward to this whole time. The people who are best at pursuing peace are the worst at having peace. Because the pursuing mind, the wanting mind, even when it gets there to what it wants, says, "Now what?" And so I truly believe that we must abandon all hope in order to arrive at peace. And I know the voices that are coming up right now, they're saying, "Tell that to someone in a war zone. Tell that to someone who went through the Holocaust." And I will do you one better. Not only will I tell this to someone who went through the Holocaust, I will listen to people who went through the Holocaust themselves, and from this from these people will I derive the answer. So, even if you do not want to listen to me, even if you don't think I have the right to say abandon all hope, perhaps you will listen to people who went through the Holocaust and are telling us the same exact thing. And I want to start with Edith Eger. She went to the Holocaust as a very, very young girl. And she mentions this one story, which is a very apparently was a very, very common occurrence throughout the Holocaust, where people used hope to go through these extremely challenging situations, but it ended up being to their detriment. She talks about this one person who uh was looking forward to be released by Christmas. That was her fantasy. And that was the motivation that kept her going. She said she always said, "By Christmas I'll be out, and I will see my whole family again, and they'll all have survived, and we're going to have dinner together, and live happily ever after." Now, yes, this thought motivated her, and perhaps it was the reason for her to survive. But when Christmas came and went, and no one liberated them, and the camp still went on, she lost all hope and died right there. And again, this seems to be a common occurrence where people set these deadlines and have these fantasies, and when the day comes and passes, and it essentially is a slap in the face saying, "It's not going to happen. It did not happen. Your hopes did not come true." Then they lose all motivation to continue to live. And I think this is exactly why we allow hope in our lives, because it gives us motivation. It gives us something to look forward to. It gives us something to live for. So, how then can we give up hope? And we're going to get to that. Um but before that, I also want to say read another thing that Edith Eger has uh is showing us here what the hoping mind, what that leads to. She says, "Survival is black and white. No buts can intrude when you are fighting for your life. Now, after liberation, the buts come rushing in. We have bread to eat. Yes, but we are penniless. You are gaining weight. Yes, but my heart is heavy. You are alive. Yes, but my mother is dead." And this is exactly what has happened in her story after she survived the Holocaust. She went back home. She found her sisters. She got a job. She got married. She had children. And pretty much everything she ever wanted happened for her, but there was always yes, but. Yes, but. And this is exactly what the hoping mind, what the wanting mind always does. Even if it arrives at its hopes, it just starts hoping for another thing, because there is always something to be dissatisfied with. Do we see that? Yes, but. Yes, but. And this is never, ever going to stop. In every situation, there's something that we can say, yes, but And this is because, like I said, the wanting mind is only good at wanting. It is not good at having. And so, we might say, yes, I see, okay, hope is really has this effect, and all disappointment comes from hoping, because without hoping, there wouldn't be any disappointment. But hope, as we've seen, is a motivator. Hope gives us energy. Hope gives us brings about change. We cannot give up hope, because things need to change, and things need to happen, and certain situations are simply terrible. And we must find the motivation to do something about them, to go through them. Yes. But we do not need hope for that. And this is where I call my other friend, Victor Frankl, in, because he, also having gone through the Holocaust, has noticed something very, very interesting during the Holocaust. He saw, once again, many people fantasizing and hoping, and setting those deadlines, and looking forward to then being bitterly disappointed, and even dying from that disappointment. But he also saw people who did not hope, did not fantasize, did not imagine in this way, and still survived better than anyone else, and even once they were out of the war and everything, they could go back to their lives, that's when they did indeed get back to meaning, to happiness in their lives, even. How did they do that? This is what Victor Frankl calls the choice. He [snorts] says, we have no control over, really what happens to us clearly. But what we do have control over is how we respond to every situation. There we have full control and that control we have in every single moment in every single situation in our lives. So he observed people who were aware of this choice of this inner control that were freedom and peace always there. And even though they were starving, even though they were being beaten, even though they too of course had family that they were unsure of they were still alive if they would ever see them again. They managed even to smile sometimes, to give other people who they think needed it more their last piece of bread, their coat, their jacket, their their boots. And these were not mentally ill people. These were not people who were not aware of the situation and that's why they were able to do that. Quite the opposite. Unlike those people who are fantasizing in their imagination hoping for some change in the future and then being bitterly disappointed, they were actually much more in the moment. They were they they were saying, "In this present situation, what can I find that is right, that is good that I can do? How can I be in this very situation right here right now be that which I want to see in the world myself?" And these are not people who denied what was going on. They knew the injustice that was happening, that this was not right, that this in fact was a crime against humanity. But they saw even in that situation they had the choice to treat others around them the way they thought was right. And in that choice in that very real, not fantasy, not hope, not imagination, in that very real choice they found meaning. And everyone who has a why has a how, as we know. In that control, in that choice, we can find meaning and in that meaning we can find peace in every situation. Having covered a situation such as the Holocaust, certainly any smaller thing this applies to as well. Our daily frustrations, our daily disappointments, the unfairness, the injustices that we in our daily, regular, normal lives encounter. Surely this would work in those as well. And this is actually why the other book is called The Choice, cuz she realized this as well, not having known Viktor Frankl's work also. Hope keeps us wanting. Hope keeps us lacking. And we will always be hoping, no matter how perfect even our situation seems to be. Even if our hopes come true, as they say, beyond our wildest imagination, there will be a yes, but. And if we do not learn to be content, not happy, not ecstatic, not completely approving of the present situation, but to be content with it, to say, here too there is meaning. Here too there is peace. Even though peace is obscured, even though peace is in the other room, I can't see it right now, I know that things that are in the other room do still exist. Just because they disappear from in front of my eyes does not mean that they stop existing. It's the same with peace. We will not always be able to see peace in our lives. But this goes back to the old example when we put our thumb in front of the sun. The sun completely disappears for us. But is the sun gone? The sun is there regardless. Peace knows of no obstruction. It is only our vision of it that is sometimes obstructed due to our situations in our lives, due to the things that happen to us over which we have no control over. But once again, how we react to those situations, how we act in those situations, that is always under our control. That control and that meaning and that peace is always accessible to us. And so the excuses have run out. Because if people who go through the Holocaust can find meaning in their present situation and even peace, then who are we to say that we cannot? That we are somehow going through something in which there is no choice. In which there is no possibility to be that which we want to see in the world. To however small extent, even if it is just our reaction that we can control. And this is why we hang on to hope because we say without hope I have no motivation, without hope I could never bring about change in my life, without hope I would just be disadvantaged, everyone would pass me. No, it is especially people who have given up being dissatisfied with the present moment and seeing the peace even in present moment, That's where they draw all their power from. And with that power, they affect greater change than any hopeful ever could. And this is proven time and time again. So, this is the pitch of hope that it tells us, "I will motivate you. I will give you energy. I will give you reason. I will give you something to look forward to." But it's just an imaginary carrot dangling in front of us. Because even if it gives us the carrot, it puts right something else in front of us to chase. And this will go on forever. It has gone on for so many people in every situation in life. But those who gave it up also were still not only functioning in every situation, they did it even better. And so, well and truly, there is not a single thing that we can do with hope that we cannot do without hope.
