transcript: '[Music] what I''m about to talk about will be a major spoiler for 4D golf so you really should play the game first before watching this but with that disclaimer out of the way how did I do that finale yes it is actually a 5D game and that was a significant part of the development time maybe even a third of it and if you thought any of my other devlogs were complicated oh boy where do I even start since I already built a 40 engine could it be as simple as just replacing some fours with fives well there''s actually a few places where that is reasonable to do like with the colliders physics camera controls and other utilities but even for those it''s not so simple you see since the code is written in C there''s no way to do proper templates with numbers like I''m used to doing in C++ but I''ve never let things like language specification stopped me before so I literally wrote my own pre-processor to add integer templates to C yes this was necessary Microsoft but a pre-processor can only take you so far most things are a lot more complicated than just replacing one number with another for instance Unity only supports up to Vector 4 and Matrix 4 so I had to remake the basic classes myself for things like vector 5 and Matrix 5 and then there''s the 5D slicing how can I even render 5D stuff to the screen well I discussed how I made the 4D meshes in devlog 3 and those techniques do generalize to higher Dimensions it''s just that 5D is way more complicated and impossible to visualize in that last devlog when we sliced a 4D tetrahedron with a 3D space or Hy plane we cut the 1D edges to get up to four intersections which can render as two triangles but what I''m showing here isn''t strictly correct because this is a 3D tetrahedron with a 2d plane slicing it it just happens to visually match what''s going on in 4D but there''s not really a similar way to show that for 5D when you slice a 5D pentac coron with the 3D space or hyperplane we intersect 2D faces to produce up to five intersections which can render as three triangles yes a 3D space intersects a 2d plane in a single point in 5D it''s really hard to wrap your head around even weirder is how you determine which faces are intersected in 40 you just look at which side of the hyperplane each vertex is on to find out if the edge will be sliced so there''s 2 4th or 16 possibilities to consider in the lookup table but in 5D um it''s harder to explain but you have to compute a directed Edge graph kind of thing and if the triangle has a cycle that means it has an intersection I don''t really understand it but that''s just how it works out since there''s 10 edges that means this time we have 2 to the 10th possibilities or 1,24 combinations adding all those bits plus the index X bits results in a much larger lookup table which is now a 128x 64 RGB texture and here''s how that looks generating and using this lookup table was definitely the most challenging part of getting 5D to work and it''s the core reason this game is able to run at all with reasonable frame rates now the 5D struggles don''t end there of course first of all gpus were not designed for 40 rendering but they''re even more not designed for 5D rendering 5D vectors and matrices are just not supported at all period no data structures no dot products nothing so how did I get them working well I just used more Fields a 5D Vector is really just a 4D vector and an extra float and a 5x5 Matrix is really just a 4x4 Matrix with an extra four row four column and single float I was able to make that somewhat taller Able by creating some Shader macros but it''s still very annoying you know what''s even more annoying remember in devlog 3 how I had to store an entire copy of the tetrahedron for each 4D vertex well now I have to store an entire 5D copy of the pentac coron at each vertex that''s a lot of data to transfer luckily I can finagle the fields a bit to group them together for a slightly more efficient GPU transfer and don''t get me started on the vertex normals to reduce the size of this massive vertex data I can press the normals to 8 bits per coordinate then unpack it and interpolate them in the vertex Shader which makes for some really ugly and confusing code but sometimes that''s just the way it has to be anyway those were the most challenging parts of the Shader the rest of it is more or less the same as 4D but with an extra dimension in fact I designed the shaders to generalize by making the dimension a parameter in the Shader pre-processor so one Shader can be used in both dimensions the only thing I have to Define for a custom Shader is the 4D and 5D fragment color and that''s polymorphism at its finest that still leaves the question what about the 5D meshes how do they even work well it is mostly similar to the 40 tetrahedral meshes except with 5D pentor instead but generating 5D meshes usually means I need to start with a 40 model and do an operation on it like an extrusion or revolution so there''s an extra step on this modeling ladder to do anything in 5D which is only possible because I can use all the 4D stuff I''ve already made the main problem with 5D meshes is that they''re enormous let me give you an example if you wanted to make a flat Square in 3D you only need two triangles when you move to 4D it''s actually 3D things that appear flat and a flat Cube ends up needing five tetrahedrons so how many pentacorn does it take to make a flat Tesseract in 5D it turns out 16 of them there''s an exponential growth that happens when you add a dimension so 5D meshes are typically 10 times larger than 40 meshes for the same visual shape which are themselves about 10 times larger than a similar 3D shape that meant I had to really limit what kinds of objects I could make for the Beyond courses and rely more on the procedural shaders to fill in the details believe it or not the worst culprit of inflated triangle counts was the ball it turns out there are no good ball shapes in 5D because it doesn''t have any other point group symmetries just the cube and tetrahedron ones all the other dimensions around it have more symmetries why is 5D so cursed I don''t know but it made it a real pain in the genus to make a golf ball that wasn''t ridiculously high poly you''d think the ball would be the easiest shape to make so I ended up using the uh let''s see the pentac coric tri skilla OCTA COA let''s just call it the 3840 Terra since that''s how many terrons it has here you can really see that exponential growth as the dimension increases it''s an awful bang for your buck but there''s not much I can do for Hardware that wasn''t designed for this in the first place building the tracks was also extremely obnoxious because these have to be built vertex by vertex with a manually crafted algorithm just like in 40 but twice as bad I ended up with Godly functions like this with 35 arguments and a full screen of conditionals thankfully these scripts just generate the track assets so that code never actually runs in the game I Hope That Forgives my coding sins the way these 5D track pieces connect is also surprising when connecting two flat pieces in a 3D environment there''s two possible ways to connect them and in four dimensions there''s there''s four possible ways so in 5D there''s what maybe six or eight nope there''s actually 24 different ways since the boundary of a 5D track is a 3D cube it''s the same as asking how many ways can you connect one cube to another there''s six faces times four orientations each which is how you end up with 24 all in all designing the courses for the Beyond levels wasn''t really that difficult it''s exactly the same track building system I used in 4D the hardest part is trying to create Unique Mechanics that work in 5D but not in 4D so players have to think five dimensionally for example this double rotating platform that you can walk on I needed to make sure there weren''t any levels that just became 40 when you looked at them from a particular angle so that''s a peak under the hood of what a 5D game is really like I''m so happy to finally get this off my chest it was so hard to keep this part secret especially with all the jokes and the comments but I''m glad people enjoyed the reveal and gave such a positive reception to the game so keep spreading the word and let your favorite streamers know about the game it''s been cool to see everyone not just play 40 golf but really start understanding four dimensions on a deep level it''s an intuition you only get from hand Hands-On problem solving just like today''s sponsor brilliant Hands-On Interactive Learning is a way more effective way to learn a difficult subject from math and data analytics to programming and AI brilliant has thousands of courses for anything you''re curious about and gives you personalized lessons to build your critical thinking skills they even have a great course on vectors which are the building blocks for working in higher dimensional spaces so if any of this video went over your head this could be a good place to start you can try everything brilliant has to offer for a full 30 days free so visit brilliant.org Cod parade or click on the link in the description you''ll also get 20% off the annual premium subscription and support my channel so thanks again to brilliant for sponsoring this video VR and online multiplayer are still coming soon as well as the source code for the engine but I''m also looking forward to taking a break from the devlogs to make some classic code parade videos and besides purchasing my games you can always support my projects through patreon coffee and my merch store it''s been an amazing journey so thanks for watching [Music]'
