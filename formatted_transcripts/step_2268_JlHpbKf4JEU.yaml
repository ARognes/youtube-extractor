transcript: "Ask and answer in Spanish using \"llevo\", \"desde\", and \"desde hace\". Say what activity  you have been doing from a moment in the past until now. Use the Spanish verb \"llevar\" to say for example: \"Llevo 40 años estudiando español\" (I have been studying Spanish for forty years). This Spanish grammatical structure consists of using the verb \"llevar\" in present + the period of time + the gerund for the main verb. For example, \"llevo dos días estudiando... para el examen.\" In this sentence we are using the present of llevar for I (llevo), the period of time which in this case is dos días, and the activity, the main verb of the sentence which is estudiar but in gerund, estudiando.\n\nRemember that the Spanish verb llevar has many primary meanings such as to bring, to take with you, to be wearing certain clothes, to have been doing an activity, to carry something somewhere, to express if you get along with someone or not, and so on. I will show you to correctly use llevar when you want to express what activity you have been doing.\n\nUse the two words \"desde hace...\" when you say \"I have been studying studying Spanish for six years\" – \"desde hace seis años estudio español.\" This grammatical structure consists of first placing the magic words desde hace + period of time + main verb of the sentence in present. You may also use the  word \"desde\" (from) + the year in which you started doing the activity we are talking about + the main in verb in present. Por ejemplo, \"desde 2023 estudio español\".\n\nDonate to me, Ana, if you feel my videos are helping you learn español!\n\nIf you feel like donating to me because you feel you are learning Spanish with my videos. you can do so through the secure Stripe system on my website:\nhttps://www.butterflyspanish.com/\nor through PAYPAL: \nhttps://www.paypal.me/ButterflySpanish\n\nAnd before I place the final period of this text, I want to thank those of you who have donated. I appreciate it very much from my heart. Your donations help me very much in everything in my life. It helps me make more videos, to eat, drink coffee. I am deeply thankful. Thank you for giving me your support. Muchas gracias por darme tu apoyo.\n\n\n\n00:00 Introduction\n02:50 llevo + period of time + gerund\n04:32 I have been, llevo\n04:53 ing, ando, iendo, Spanish gerund\n05:52 Present of verb llevar\n07:35 Verb llevar,  Spanish conjugation\n08:20 Examples with llevo, lleva, llevamos\n10:28 Quick review Spanish gerund\n14:03 Desde hace in Spanish\n17:40 Desde in Spanish"
