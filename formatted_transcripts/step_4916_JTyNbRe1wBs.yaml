transcript: Engineering is often not really like a science. It's like engineering is is pretty much just trade-offs, I feel. >> It's essentially an art. >> Yeah, it's not scientific. That's a a huge part of software engineering, and it was a part that confused me for a long time because I I felt like when I was making decisions that I couldn't go to my colleagues and say, "This [music] is objectively what we should do." I had to take my subjective opinion of why it's a good design, and then argue for perhaps the trade-offs. Like, it does this, but it doesn't do this, and [music] we don't care about the con, but we do like the the pro. And I I suppose in that way [music] you can try to make it less of an art form, and maybe try to logically defend it.
