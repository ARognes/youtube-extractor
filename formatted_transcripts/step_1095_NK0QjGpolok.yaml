transcript: Burnout is one of the biggest reasons that people quit programming even if it's something they love. So, avoiding burnout is definitely something you want to consider. And one of the best ways to avoid burnout when it comes to programming, or really anything, is to incorporate seasonality into your work. So, instead of just constantly going hard all the time when it comes to programming, constantly pumping out new projects, learning new things, instead you should have intense periods and slower periods. What I mean by that is certain periods of time you should go super intense working on learning new things, building new projects, but then during other times, you should scale back, do less work, focus on building less projects, learning less new things, and that way you have these ups and downs where when you're super motivated, you can go really hard, but then you also have time to slow down and focus on other things in your life. This is actually built into a lot of different jobs such as teachers. They have 9 months of the year where they're going really hard teaching, and then they have 3 months during the summer where they have less responsibilities. This is something that everybody should try to incorporate into their passion or jobs to avoid burnout, and it's one of the easiest ways to avoid burnout. Now, this is just one of many ways to avoid burnout. If you want to see more ways to avoid burnout and even overcome it, I have a full video. I'll link it at the bottom of the screen.
