hip with\n[239.84s] life that Ken Mloud points to. This path\n[244.239s] is captured in the famous verse from the\n[246.879s] damapada.\n[248.72s] That is the supreme conqueror is not one\n[252.159s] who conquers a million in battle but one\n[255.12s] who conquers a single person oneself.\n[260.239s] This this passage this uh uh stanza\n[265.199s] expresses more of a quietest dimension\n[267.36s] of the dharma.\n[270.8s] So it seems like we may be forced to\n[273.6s] choose here between a mundane activist\n[276.16s] or a super mundane quietest path. But\n[280.24s] this is a false choice. The true genius\n[283.52s] of the Buddha''s teaching is how these\n[285.759s] two paths unify and support one another.\n[289.84s] On the one hand, the mundane path\n[292.8s] protects the super mundane one. The\n[296.4s] practical reality is that it''s very\n[298.96s] difficult to have a deep internal\n[301.36s] practice of liberation if society is m\n[304.639s] is mired in chaos. It''s not impossible,\n[307.68s] but it becomes more difficult.\n[310.479s] The solitary path within its SA is best\n[314.0s] supported by a world that is that is\n[316.639s] otherwise peaceful, just and safe.\n[319.643s] [snorts] That is a world framed by\n[321.919s] ethical and mundane actions.\n[325.199s] Just such actions help reduce suffering\n[328.479s] generally on a societal level, which\n[331.28s] after all was the whole point of the\n[333.36s] Buddha''s endeavor to reduce suffering.\n[335.84s] Even if such actions again on a mundane\n[338.16s] level are not going to eliminate\n[339.759s] suffering completely,\n[342.08s] it''s ethical actions like these that\n[344.24s] also help the SA to deal with those who\n[347.44s] might try to disrupt or suppress it. For\n[350.32s] example, I did a a video about that in\n[352.8s] the past. I''ll leave a link to it down\n[354.32s] below in the notes.\n[356.56s] So the mundane help the mundane path\n[359.28s] helps to build and support the container\n[362.96s] for the super mundane path that is the\n[365.199s] sana. On the other hand, the super\n[368.88s] mundane path purifies the mundane one\n[372.8s] and this is the core of their unity. As\n[376.0s] we practice the internal path, as\n[379.44s] craving diminishes within us, our\n[382.88s] relationship with life changes.\n[386.4s] What then happens to our speech and our\n[389.68s] action?\n[391.199s] Well, they become purer. It''s not simply\n[394.4s] that we become activists. That''s too\n[396.88s] quick. It''s more that if we decide to go\n[400.72s] that route, our activism becomes less\n[404.0s] likely to be driven by\n[406.0s] self-righteousness,\n[407.6s] by anger, by egoism.\n[410.56s] We learn how to act for the good of the\n[413.039s] world, not for our own fame or our own\n[416.72s] personal gain.\n[419.039s] This for example is what the Dalai Lama\n[421.52s] meant when he said recently that world\n[424.24s] peace can only be based on inner peace.\n[427.599s] If we act if if we ask what destroys our\n[430.479s] inner peace, it''s not weapons and\n[432.88s] external threats but our own inner flaws\n[436.4s] like anger.\n[438.72s] By doing the super mundane work, the\n[440.72s] inner work, our outer mundane work\n[444.0s] becomes purer and more effective.\n[447.84s] So Buddhist practice understood in its\n[449.919s] entirety clearly supports both ethical\n[454.0s] action within the world and insight into\n[457.44s] reality that leads to purification.\n[460.88s] But we have to add a critical note of\n[463.28s] caution here.\n[465.28s] Anytime that a belief system, even a\n[468.639s] benevolent one like that found in the\n[470.639s] early dharma, anytime this enters the\n[473.44s] political sphere, there are going to be\n[475.84s] risks.\n[477.68s] The first substantial risk is that power\n[480.879s] corrupts.\n[482.4s] As we see in some majority Buddhist\n[484.96s] states today, the interaction of SA and\n[488.72s] state has not necessarily been\n[491.199s] beneficial.\n[492.879s] ideals become corrupted.\n[495.759s] Power is a dangerous force no matter who\n[498.96s] wields it. So if your wish is for\n[502.879s] everyone to become a Buddhist or for our\n[505.84s] government to become a Buddhist\n[507.68s] government, be careful what you wish\n[509.919s] for.\n[511.919s] The second risk is that we can be led\n[514.88s] into partisanship and clinging to views.\n[518.64s] It''s easy to say that Buddhist ethics\n[521.36s] transcends political differences, but I\n[524.88s] think as a matter of fact, as Bikubot''s\n[527.279s] concerns show, Buddhist ethical ideals\n[531.04s] often align more closely with one side\n[534.08s] of today''s political spectrum than the\n[536.32s] other. And this can lead to a furthering\n[540.0s] of political partisanship, a furthering,\n[543.36s] a deepening of clinging to views and\n[545.519s] opinions. And it can risk turning the\n[548.16s] dharma into just another political\n[550.399s] football.\n[552.24s] Now just because there are risks does\n[554.64s] not mean we shouldn''t act it. What it\n[557.68s] means is that if we decide to act, we\n[560.399s] should do so with wisdom, humility, and\n[563.279s] a cleareyed view to the dangers.\n[567.92s] Our dilemma between the cushion and the\n[570.24s] street, let''s say, is a false one. The\n[573.36s] Buddha''s teaching is not an eitheror\n[575.92s] teaching. It''s a both and teaching.\n[579.44s] We need the inner work of the super\n[581.92s] mundane path to purify our intentions.\n[586.72s] And we need the outer work of the\n[588.959s] mundane path to sustain a world where\n[591.68s] the SA and the practice that it contains\n[595.12s] is truly healthy and viable.\n[598.64s] The Buddha gave a lot of specific advice\n[600.88s] on how to build a harmonious world.\n[604.959s] If you''d like a deeper dive into this\n[607.12s] into the Buddha''s teaching on social and\n[609.2s] communal harmony, I''m going to link a\n[611.44s] playlist on the topic here on the\