transcript: '{"content":"\n[0.48s] We live in a turbulent world. Every day\n[3.28s] we''re confronted with news of social\n[5.68s] injustices, political divisions, and the\n[8.88s] effects of climate change just for\n[11.36s] three. If you''re a Buddhist\n[13.519s] practitioner, this can create a real\n[15.44s] tension. Indeed, if you have a heart, it\n[18.32s] will do so. The question for today is\n[21.439s] whether the Buddhist path is meant to be\n[23.68s] solely internal,\n[26.0s] a quiet journey of finding inner peace\n[28.48s] and conquering yourself,\n[30.96s] or does it call on us to stand up, to\n[33.36s] become engaged to fight for a better\n[35.44s] world?\n[36.96s] This is not a new question. It''s a\n[38.879s] debate that goes to the heart of the\n[40.879s] practice. Today, we''re going to explore\n[43.28s] this controversy. Should a Buddhist be\n[45.76s] an activist of a sort or rather a\n[48.48s] quietest?\n[50.399s] The answer from the early texts might\n[52.719s] surprise you.\n[55.039s] There are two competing views of\n[56.879s] Buddhist practice. On the one hand, we\n[60.0s] have the activist view. Powerful voices\n[63.359s] like that of Bikubodi argue that\n[65.68s] Buddhism has vital ethical lessons for\n[68.08s] the world. Lessons about dignity,\n[70.4s] fairness, and protecting our planet.\n[73.76s] Bante bodhi suggests that Buddhists\n[76.08s] should be an organized active force for\n[79.52s] social change.\n[81.6s] On the other hand, we have the quietest\n[84.32s] view teachers like Ken Mloud or Ahmad\n[87.84s] Lele who argue that the practice is\n[90.159s] essentially at a kind of right angle to\n[92.32s] social issues that Buddhist practice is\n[95.28s] fundamentally an internal even a kind of\n[98.479s] mystical path aiming towards giving\n[101.52s] expression to a different relationship\n[103.52s] with life. as Mloud says it''s not\n[107.04s] fundamentally about making the world a\n[109.6s] better place.\n[111.68s] So which one is right