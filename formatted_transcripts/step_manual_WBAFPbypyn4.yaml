transcript: '{"content":"\n[30.04s] Anxiety disorders, or what traditionally have been classified as forms of neuroses,\n[35.24s] are so prevalent in the modern world that some suggest we live in an age of anxiety.\n[40.74s] But what is causing so many people to suffer from anxiety disorders?\n[44.98s] The psychologist Carl Jung spent much of his career trying to answer this question.\n[50.24s] Jung''s theory of neurosis, however, is largely overlooked in our day\n[54.46s] where pills are seen as the panacea for virtually all mental ailments.\n[59.0s] But Jung''s theory demands our attention because,\n[62.34s] unlike the pharmaceutical model, which focuses on symptomatic relief,\n[66.92s] Jung viewed the neurotic illness as signalling to us that change in our way of life is needed.\n[72.48s] If we merely mask the symptoms and go on with life as usual,\n[76.88s] then we impoverish ourself, losing access to the crucial information that the neurotic illness provides.\n[83.5s] \n[86.555s] \n[89.165s] \n[92.225s] \n[93.78s] In this two part video series, we will provide an overview of Jung''s theory.\n[98.38s] In this first video, we are going to explore what anxiety disorders can teach us about our way of life,\n[104.52s] by examining what Jung saw as their root cause.\n[108.18s] In part two, we will discuss how Jung proposed we can escape the clutches of our demons\n[113.92s] in order to return to a more flourishing way of life.\n[117.74s] A defining feature of Jung''s theory is that the cause of the neurosis is always to be found in the present.\n[124.46s] As he wrote,\n[145.78s] Jung was not denying that our neurotic suffering may have started in our childhood,\n[150.4s] nor was he overlooking the influence our upbringing has on our psychological development.\n[156.04s] Rather, he focused on the present because he believed that what generated the symptoms of the neurosis\n[161.56s] was a conflicted way of life in the here and now.\n[165.14s] Conflicts may have been present in our childhood,\n[168.12s] but those conflicts have changed and are no longer the source of our present suffering.\n[172.66s] Or as Jung explained,\n[191.28s] What is the nature of the conflict that leads to the neurosis?\n[194.98s] In his essay, \"The significance of the father in the destiny of the individual'''',\n[199.36s] Jung provides a quote by the Greek Stoic philosopher Cleanthes which helps unravel this mystery.\n[205.94s] \n[208.88s] \n[211.34s] The Fates were the three weaving goddesses of Greek mythology who spun the threads of individual destiny.\n[217.42s] Jung did not believe in gods or goddesses determining our fate,\n[221.38s] but he did believe that each of us is presented with a series of life tasks,\n[225.62s] which are not of our choosing, and so can be conceptualized as our fate.\n[230.0s] These tasks are a product of our evolutionary history,\n[233.72s] our immortal nature, and the culture in which we live.\n[236.92s] Foremost among these is our biological drive to pass on our genes,\n[241.32s] but others include the need to achieve psychological independence from our parents,\n[245.72s] to cultivate a social life, to contribute to our community,\n[249.28s] to find a purpose, and eventually, to face up to death.\n[252.72s] According to Jung, we are naturally driven to accomplish these tasks.\n[257.06s] Our instincts, our nature as social animals, the pull of conformity, and our ever approaching death,\n[263.24s] all impel us in this direction.\n[265.72s] But while we are naturally driven to achieve the tasks of life,\n[269.68s] we also have a tendency towards inertia and self-sabotage, or as Jung put it,\n[274.96s] \n[279.4s] \n[283.96s] If we can get the upper hand on our laziness and display the courage to face up to the tasks of life,\n[289.68s] then these tasks act as guides, marking the path toward a healthy development.\n[294.76s] ''Fate leads us forward.''\n[296.48s] But if our laziness and fear get the upper hand, and we neglect the tasks of life,\n[301.6s] then they become chains around our neck.\n[304.26s] We become the unwilling; in the words of Cleanthes,\n[307.22s] ''whom Fate drags forward.''\n[309.9s] The neurotic, according to Jung, is the man or woman who walks among the unwilling,\n[315.26s] who has adopted, in other words, a faulty attitude towards the tasks of life.\n[321.54s] When treating his patients, Jung emphasized that the problem for the neurotic lies always with their attitude,\n[327.84s] achievement of the tasks being of secondary importance.\n[331.22s] For life can present us with immense challenges which make it impossible to achieve a certain task.\n[336.96s] But this does not destine us to a life of neurotic suffering.\n[340.46s] In such cases, acceptance of the situation,\n[343.7s] and a shifting of our energy to another of life''s tasks is the appropriate reaction.\n[349.14s] But usually the obstacles that impede us are not of an insurmountable nature;\n[353.66s] rather, what holds up back is a moral incapacity.\n[357.1s] We are either too lazy, or we lack the courage to face up to the challenge.\n[361.5s] Being impeded in this manner is not unique to the neurotic,\n[365.38s] as we all face times where our resolve is tested.\n[368.78s] But what is unique to the neurotic is that, rather than acknowledge their incapacities,\n[373.84s] they choose to deceive themselves and to lay blame solely on the obstacles in their path,\n[379.4s] or as Jung explains,\n[414.38s] In such a conflicted state, our desire to achieve the tasks of life,\n[418.78s] and all the energy which impels us in this direction, does not simply disappear.\n[423.76s] Rather, it seeks an alternative outlet, or as Jung explains,\n[436.9s] In other words, if we cease to moving forward in life, we tend to regress to more immature\n[442.44s] or what Jung called infantile, modes of adaption.\n[445.64s] And this regression in the response to the conflict is what generates the various symptoms of the neurosis.\n[452.18s] Be it the pervasive anxiety, phobias, compulsive behaviors, depression, apathy\n[457.7s] or obsessive and intrusive thoughts.\n[460.28s] But as uncomfortable as such symptoms may be, they serve an important purpose,\n[465.3s] by alerting us to the fact that we are descending down a dangerous life path.\n[469.56s] For while we regress psychologically, our physical maturation does not cease,\n[474.66s] and a glance in the mirror forever reminds us that we are not keeping pace with the seasons of life\n[480.04s] and the inexorable march of time.\n[482.38s] The longer we exist in this conflicted state,\n[485.56s] the less adapted we feel, and a vicious cycle takes over whereby\n[495.98s] When caught in the grips of a neurosis, we are likely to wonder why we were cursed in this way.\n[501.8s] What led us to react to the challenges of life in this inappropriate manner?\n[506.44s] Jung did not see a single cause for this incapacity;\n[510.0s] rather, each case is unique.\n[512.08s] For some of us it can be blamed on our genes.\n[514.7s] Certain newborn babies, Jung observed, display a\n[519.84s] which predisposes them to the neurotic attitude later in life.\n[523.78s] In other cases, it is a poor upbringing:\n[538.78s] But for most people it is an indecipherable combination of\n[542.14s] genetic and environmental influences which is ultimately to blame.\n[546.82s] Whatever the cause, crucial question is how to break the cycle of our neurotic suffering.\n[551.8s] If we are willing to acknowledge our conflicted way of life,\n[555.34s] what can we do to resolve it?\n[557.14s] In the next video, we''ll explore Jung''s ideas regarding this question.\n[561.9s] As we will see, his prescription did not involve digging through the events of our childhood\n[567.04s] or working through what he called the\n[573.1s] Rather, Jung maintained that the best way to conquer a neurosis is through the construction of something new.\n[578.78s] Specifically, a new attitude to life.\n[581.78s] We  must look forward, not back."}'
