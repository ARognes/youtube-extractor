transcript: Look, what a wonderful thing it is you're doing. Trying to work on yourself, trying to better yourself, trying to become more kind, loving, patient, determined, responsible, eating better, sleeping better, trying to be more honest, and kinder to everyone around you, trying to educate yourself, and inform yourself. But, if you notice, the more we do that, the more we dedicate ourselves to all these beautiful things, we tend to become more judgemental towards others who are not practicing these things, when they very well could, just like as we are doing it. And we start resenting people around us. We start resenting the whole world. We see the dishonesty, the disrespect, the the violence, the ignorance, all around us and in the world, and we start becoming angry with it. We become also disappointed with it. And because we wouldn't do it, we judge others who do do it. And the reason why we wanted to work on ourselves in the first place, the reason why we wanted to better ourselves, whatever that may mean for you, wasn't it to finally achieve peace? Wasn't it to finally live without confusion, without conflict, without fear, without anger, without resentment towards the entire world, and towards oneself? And so, notice the more honest we become, the more dedicated we become to these things, the more we hold others in contempt who don't do them. And everyone who holds someone in contempt, anyone who is resentful against the world, anyone who has any hatred, any anger, any disappointment in their lives, are necessarily people who do not have peace. Because as we're fighting the world, we are fighting the world. We do not have any peace. And so, the very things that we are engaging in to better ourselves, to bring us peace, to make us better in every conceivable way possible, is making us worse in all those areas. It's making us more judgemental. It's making us envy more those people who are doing better in being honest, uh being more understanding, being more patient. And it's setting us back in all the exact areas into the exact degree that we practice them in all the areas that we want to get better at. And this seems to be the golden one of the golden laws of life that everything you do to others, you do to yourself. And the more our judgement grows by way of judging others, by way of resenting others by way of being disappointed in others we judge ourselves as well. When we think of someone as worse off because they are not so honest when they could be because they are not so kind to those around them because they're not patient, they're not loving they're not understanding, they're still ignorant. They don't get up as early in the morning as they should, as they could, as would be good for them. We apply those same standards to ourselves, too. Of course we do. Isn't that how this whole thing started? It started with ourselves, for ourselves. And then, this is a very subtle thing I'm trying to point out to you because this is this is why this is happening. This is why we are getting kinder and more honest and more at peace and then reverting back to even lower levels in those things at the end. Because we're doing it to others, we start doing it to ourselves, too. Our expectations become higher. Our so-called standards become higher. Our responsibility becomes higher. Our need for improvement becomes higher. And so every time we fail to do something that we were just getting better at we get disappointed in ourselves. And we judge ourselves as lazy ignorant rude, cruel resentful uh at uneasy, and all the hell we see in others and judge them for, we, of course, see in ourselves and judge ourselves for, as well. So, it's a wonderful thing we're doing by adhering to these values. You might call them virtues or or whatever you think is going to make you better. Whatever your work consists in. But, the more we identify with them, the more we say, "I am an honest person. I am a fair person. I'm an informed person. I'm a I'm a very hard-working person. I'm a respectful person. I respect other people." the more we make it our identity. And the more we make it our identity, every time we fail to be, so-called fail to be, as respectful, as loving, as kind, as patient as we wanted to be, as hard-working as we wanted to be, we become more and more resentful, disappointment, disillusion, resentful, self-hating. And so, if we want to stop judging ourselves, we have to stop judging others. You might say easier done easier said than done. But, consider this. Isn't it because we find it offensive that other people don't do these things that we judge them for that? Isn't it that they offend us with their rudeness and their ignorance and their dishonesty and their cheating and their deceiving that we resent them for it, that we judge them for it? It is because we think that other people's actions, opinions, beliefs, the way they treat the world and their environment and themselves and the people around them we think it it's our values, what we're working for, what what we think is so important is under attack. And we're constantly defending the beauty that we're engaged in, the goodness that we're engaged in. Constantly saying, "How dare you not see this? How dare you not see that honesty is important, that respect is the right way to go, that kindness is the way to go, that patience is the way to go, that one should be informed, that one shouldn't be ignorant." But ask yourself this. Has justice truth patience, love ever demanded of you that you go and protect it? That you go and fight for it? That you go and fight against its enemies? It has never demanded that of you. It has said, "I am here. I am perfect. I am untouchable. If you wish to partake in me, if you wish to partake in love, truth, justice, goodness, beauty, all these things and the so-called virtues then you are welcome to do so. That's uh life aligned with truth. It's a life aligned with love. And if you want to give these things, which by the way are the very best things, our our ancient Greek philosopher friends called these things the highest good, the highest good, then you may give yourself these things. Or in other words, you may partake in them. You may be of their nature. And certainly that will benefit you. This is what a human being is made for. This is the highest privilege, the highest joy, the highest alignment and nature of a human being to partake in these things. It was our confusion that the more we identified with them, that we thought we are them. We are respect. So every time someone disrespects, they are offending us. They are attacking us. They are taking something away from us. They're attacking all the goodness and the beauty and what is right in this world. They can't touch justice. They can't touch truth. They can't touch love. If they choose to not give these very best things to themselves, let them. It takes nothing away from you. It takes nothing away from you. And they never asked you to pick up weapons and to go start start fighting you the perceived enemies of love, all those unloving, hateful people. Love never asked you to fight them. It is hate. It is anger. It is resentment. It is disappointment that always asked you to take up arms because there's something in us that doesn't want this peace, that doesn't want this truth, that cannot sit still, that always needs to have a problem, something to work on, something to get better at, and something to be disappointed in. And that part of ourselves disguises itself as the very things that we love and cherish and value and put above everything else. And it assumes their their voice and it says, "You need to fight for me. Don't you see this disrespectful person insulting love, insulting what is right, insulting moral values, insulting innocence, insulting beauty, nature, everything that is right and beautiful in this world? Go attack them for me." Truly, the universe does not work like that. It does not need you. You are not the soldier of someone. You're a human being whose birthright it is of love, of peace, of truth, of what is right. And you have the capability and the put and the potential and the privilege. There's so much talk about privilege. No one's talking about this. The highest of all privileges to partake in good, to partake in love and truth, and everything that a human being is born for and has the capability to partake in. If If it wasn't meant for you, you would not have the capability of it. You would not be looking for peace. Notice every single individual, whether they take it to be in their religion or in philosophy or in money and wealth and fame, every single person is looking for peace. And they think they can find it through this or that. That's That's where we differ. How we think we may find it, what's what the best way is, what the most efficient way is, but we're all looking for peace. That already tells you that is proof that we were made for peace. But peace has never ever asked you to go to war for it. Yet that's what we're doing every day. We're fighting battles. We're fighting disrespectful people, unloving people, unkind people, unjust people. And we think we have to do that. And notice every time you so-called fall short of a kindness, of a lovingness, of a of an informedness, of of a knowledge that you already know, but that you keep not being able to live up to at least every now and then. I tell you this, it is not a failure that this happens. It is not a setback even. Because every single time you do something not as kind as you wish yourself to be, it is pointed out to you what kindness is, what its opposite is. You used to not even know what is fair, what is right, what is true, what is loving. Then you started to tell be able to tell the difference. Then you really wanted it for yourself. Then you really started pursuing it. And now you still fall back into it again. These terms I don't find right, but it is a language and we must use it. But every time you so-called fall back into these things, they are pointed out to you why not to do them. And you might say, "Well, I thought I was beyond that." But listen to reality. Clearly you weren't beyond that. And there's nothing wrong with that. The truth has never hurt you. The truth has never hurt you. And there is no bigger truth-teller than reality itself. And so, every time you slip back into it, thank what is happening for pointing out to you why you pursue these things. Every time you do something dishonest, every time you lose patience, every time you get angry, see how it is like hell, how being angry is like burning in hell, how being ignorant feels so wrong. It's not the way you want to live. It's pointed out to you every single time on the value of it. And just like we judge others for it when we shouldn't, we judge ourselves when we shouldn't. Every single opportunity we let go because we think it's a setback. But every single so-called bad thing can be turned around and made use of. By seeing a what every single time until we become sick of it, we must become sick of these things. Until we become sick of it, we will keep doing them. And if we keep judging ourselves and keep dis- being disappointed in ourselves and angry and resentful and all these things, we are only That's the true setback. When we think as these things as failures, it is there to make you sick of itself. Thank every time you become angry, every time you are displeased with yourself or with the world. Say thank you for showing me that I am not yet sick of it and thank you for doing it yet another time so that I really really become sick of you. And what has happened every single time you truly became sick of something? You didn't do it again. It just fell off of you. The interest is not there anymore because you well and surely became sick of it. There wasn't this lie in it anymore. Oh, maybe this time it will be good. Maybe this time it will do no damage. Maybe this time it will really actually feel good and be good. It has let you down every single time and you need to see that. And may I say one more thing because I feel like if you're still here and this is being understood, I can tell you one more thing. It is the same just like just like the saying goes, everything you do to others, you do to yourself. It is the same thing with forgiveness. Don't we hold on to unforgiving our unforgiving nature? Don't we say, "No, I cannot forgive that person for what they have done"? Because we think that if we forgive them, they will not be held accountable. They will be let off scot-free. They will not get what they deserve. It will be like it never happened. And so we think that by not forgiving a person, we are holding them accountable for what they did. But once again, it is not true. Justice did not ask you to fight for it. Everyone who doesn't make a mistake, just like when you make a mistake. And you become angry and resentful with yourself and disappointed in yourself and it's the worst feeling. They have that for what they did to you. It might not seem like it, but they they do not have peace. You know this. They do not have peace. Everyone who steals, lies, deceives, uh is disrespectful, and treats other people, takes advantage of other people, none of those people are at peace. And peace is what everyone's after. And peace is the first thing that is taken from you when you do wrong, plain and simple, objectively. By not forgiving them, all you are doing is carrying that anger, carrying that hate, carrying those memories and and purposefully keeping it fresh so that you don't forget because you think that if you forget, justice will forget. And so you're fighting for justice. You hold it you're holding something for it so that the person gets what they deserve or at least they're not released out of the bad deed that they did, this unforgivable thing. And when you forgive others, you can forgive yourself. When you give forgiveness, you get forgiveness. When you stop judging others, you can stop judging yourself. When you stop being disappointed in others, you can stop being disappointed in yourself. So this is my first attack on your self-judgment, on your self-discontentment, on your disappointment with yourself, on not being able to forgive yourself, all these things, on your shame, on your regret, everything. And if you dedicate yourself in the right way without identifying with these things that well and truly are good for you. Of course, honesty, kindness, love, justice, truth, to be an an adherent of these things and to partake in these things is the very best thing for us. But as soon as we identify as a fair person, a kind person, a loving person, a just person, a patient person, a an informed person, a wise person, those very things or rather that inside of us which identifies with them, which takes pride in them or gets disappointed when they're not there, that turns against us. And the very things we are pursuing slip further and further and further away. And the mind is of reason. If you stay with this knowledge, if you stay with this understanding, if you start seeing this in your life, that's all you need to do. All you need to do is to observe it so that you may sick become sick of it so that it may naturally and effortlessly fall off of you.
