ed with making that better and I found that the best way to do that was not simply to make the CLR better, but to um help others be better. And that's when I started I started calling myself a performance preacher. I wrote an article once where I said, "I'm pretty much a performance preacher now. I just go and tell people what to do and and that's a big part of what I do. And of course I was in the code all the time as well, but but a big part of it was this sort of evangelization of you. And that's when pit of success got coined. Right? So that's when I started talking to people about like, "No, no, we're doing this wrong. We're making it way too easy for people to make mistakes. Like we have to make it so that the default way isn't isn't a good way. You know, if you pick the default off constructor, that's probably the constructor you want, you know? And there were too many cases where it's like only an idiot uses the default constructor. >> [laughter] >> Close those. You have to use, you know, and it V2 EX5, you know? That's the fast one. What are you, stupid? Like, okay, we can't be doing that. >> Okay, there's two things there. So I want to talk about both of those. So just to be clear, so when you when you said that it sort of started moving to the CLR team, I'm guessing that that wasn't so much evangelizing to the other people in the CLR team. >> Some. >> So so but some potentially, but it sounds like it was probably wider, right? So So you're kind of talking about like talking to the to the to the language designers, to the people who are or library designers probably more so than language designers. >> Both. >> Both. And so it's kind of like you're talking about just to the whole kind of C# ecosystem like hey, this is a problem we need to start thinking about it, that kind of thing. >> And industry, too. That's why I started blogging. I had I had, you know, people were not being successful. And so I met with people in fintech. I'm not going to drop names, but like people you've heard of in fintech were having problems. And so I helped them. People People who built computers that you've heard of were having trouble with funky things like printer drivers. And so I would help them. And and I would this would give me information to bring back to the teams, like folks are not being successful. They're doing the obvious thing, you know, and it's going south, you know, this is like also why I'm such a fan of Rust and outcome and not so much a fan of C++, right? You pick up a C++ book, do what it says, and you get a catastrophe. [laughter] Whereas if you pick up the Rust book and do what it says, you get like good outcome. I'm I'm like I like a language where picking up a book and doing the idiomatic things is a good idea. Like is that too much to ask? >> Okay, so let actually let's talk about that specifically, but let let me throw one thing. I'd like people to know about the pit of success who don't know about that. So since that's exactly what that is what you're basically talking about here, can you give a little just explanation of of where that came from, what pit of success means, and then we can move into the like like hey, C++ kind of going down this this loop of like the pit of success is nowhere to be found. >> Okay, I'll tell you I'll tell you the exact story of the exact day it happened. It's not that long, okay? So it turned out that Microsoft Research at the time had this habit of creating about once a year an event they called Mind Swap, okay? And at one of them at the Microsoft Research Mind Swap, they were talking about software performance, especially you know, the performance of like the managed systems and what are we going to do to help get C# and Windows under control. Okay? And I was not the keynote speaker, but I was the first scheduled talk that day. It was a fant- like the audience was crazy nuts, like you know, multiple technical fellows and Turing Award winners in the audience. I never been so ter