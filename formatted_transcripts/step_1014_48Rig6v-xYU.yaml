transcript: On computerenhanced.com, I try to put up a lot of educational materials that help people understand how hardware runs the software that they write and how to make sure that things are performing the way that they should be. However, this is all about the programming part of things. It doesn't really tackle things like the institutional concerns about why software performance might not be emphasized or how you might have to evangelize software performance internally to teams or to corporations in order to get the leeway or to get the production processes to line up to produce high-performance software. Well, today I'm joined by someone who's spent a lot of their career doing exactly that, Rico Mariani. He worked at Microsoft on performance issues for a long time and he's actually the person who coined the term pit of success, meaning this idea that you want to try to create circumstances where the natural thing that a programmer will do when using a language or an API or a tool set uh will lead to well-performing software or well-written software rather than making it an uphill battle all the time. In this interview, we talk about a wide range of topics, but we tend to keep circling back to this general idea of what do you do to try to emphasize performance concerns inside a larger organization uh that maybe doesn't have that as part of its DNA or maybe had it uh but is losing it over time. So, without further ado, please welcome to the program Rico Mariani. So, Rico Mariani, thank you so much for joining me today. For people who don't know your background, can you give me like sort of the the the high-level summary? Like, how did you get into doing stuff like performance, uh you know, programming? How how did you get to where you are today, basically? >> I've been I've been doing this a long time, like 45 years. Uh I started working on embedded controllers for 6502 stuff like in the you know middle 80s. >> Awesome. Okay. [laughter] >> So I have like this experience building, you know, like controllers for highly sensitive scales and 192 bytes of memory and, you know, 64 pins of kind of like the 1980 version of an Arduino Nano or something, right? And and so when you only have 192 bytes of memory, you're like on a first name basis with memory bytes. >> [laughter] >> You know, you're like, "Oh, I don't need these two timers." He's like, "Well, that doesn't seem like it adds a lot." Well, that's 4 bytes, which is a significant fraction of 192. That's like 4% more memory if I don't use the timers. So, you know, so I started like penny-pinching from the beginning. Um I went to school University of Waterloo. Um I did, you know, a bunch of work there, typical training. Uh I worked at the Ontario Science Centre. I built some really cool exhibits. That was super fun. But again, budget budget budget. You know, the exhibits are kind of like building games, right? Like, you know, they were like on these 60,000 things. Everything's, you know, like what's the space? How what can we squeeze in? Oh, I want to do this quantum mission. How can I possibly do that? You know, and then I started working on tools at Microsoft and like they had to run in DOS, you know, so not people didn't even have the full 640K. Like, you know, there were people with like 512K. Like, how do I give them a compiler? How do I give them an editor? And so I'm building systems where like the editor has to exit during the build. Like you can't do an integrated build, right? Because there's no room for the editor. So you exit and you somehow make the build look like it's in an editor window, but it isn't really, you know, and so you're squeezing every byte out. We're trying to do debugging and like how can I do debugging in about 30K, you know, so I can like have something like a debugging experience and let the person's program actually run. Everything's constrained. And then like OS work, you know, I mean, people have background bitmaps that are bigger than all of Windows 3.1 put together. >> Yes. Yep. They sure do. Yeah. Yeah. >> It's just crazy like the amounts of memory we throw around now. So, but living in constraints just always makes you think about, okay, what do I really need to do? What's actually necessary? Like what what really matters, you know, and how can I get that done? Um and from there I started working on uh some server stuff. I sort of worked in MSN for a while and then it was like throughput and how do I get that going on and I mean, we were running on fumes compared to a typical, you know, cloud right now, you know. Um then I worked on .NET um and again, like .NET has to get out of the way as much as possible. The whole point is to leave room for the user's program, right? And economical getting, economical garbage, it's always economy, economy, economy. You know, and how do you do that? Uh same for Visual Studio. When I worked in Visual Studio, like we need room for the user's solution. Like we can't be taking up all the memory with like stuff we wanted to. So, how do you do all these toolbars? How do you make it look like there's 22 packages installed without activating them all? And and actually it's more like 200 packages, right? >> Nowadays, yeah. >> Not 22. So, Visual Studio's in the business of smoke and mirrors. Like you know, your packages aren't really loaded and yet they're there if you need them, but like who actually uses COBOL and Fortran and APL and Basic and C# and and and in the same session, right? It has to be smoke and mirrors. The whole thing has to be smoke and mirrors. You could. You know, I use the WinForms designer and the WPF designer and, you know, the ASP.NET designer and probably not, right? So, it there's a lot of illusion in the in that system. VS Code is the same, you know, in many ways. Um and now I do security and like everything's, you know, like if you're in the security space, resources are crucial, you know, you can't be spending all the compute during verification. Like there's actual work that has to happen. So, it's always about like what's the budget and how do you, you know, how do you do a good job with the budget? >> So, let me ask a question about the the history there, too, because there's kind of an interesting thing that happened implicitly in sort of what you were describing and I'm kind of I'm interested to know sort of how this happens, which is that at the beginning, you know, it's kind of like uh performance and efficiency and things like that by necessity. You're like, "Look, we we're programming on this microcontroller, so it's not about, you know, saving memory because we're trying to be efficient. It's like we literally just can't fit the code in this thing. Like we can't fit the variables we need to store or whatever it is, right?" But at some point in your sort of history, you kind of started talking about like, "Then I went to work on thing X and I did like efficiency work on X." And so, I'm kind of wondering like in a larger corporation like Microsoft, how does it end up like like could could you describe did you even notice and can you describe the transition from I work on efficiency because I have to because the project demands it to I'm a person in a big company who goes and works on this the the fact that we want efficiency on this project, but the other developers may not necessarily be doing that, right? Like like kind of this this specialization of the role, if you will. Do you know what I'm talking about? Like it sounded like there was kind of a slow transition there and I'm interested in how that happens. >> Some of it is kind of the same. Like you talk about it like it's a transition that is sort of a very natural thing. Like let me give you a sense of what I'm talking about. You say, "Oh, well, we in one case we had an abundant we had hardly any memory and because we had no abundance, of course we had to do the conversions." Okay, but like if you think about Windows, Windows is also completely constrained at all times. It doesn't fit. It never fits. So, it's as constrained, maybe more constrained than that 192 bytes was. And And the reason is that the moment you start working like in a big corporation, there's probably bunches of things going on. So, like if only Windows had to run and there were no user programs, okay? They're just so inconveniently problem. We just wanted the whole machine for Windows. That would be much easier, right? We can agree, right? But Windows is frequently thinking, "No, no, like maybe there's 2 GB of memory, but I can't use it all for me. Like I have to leave bunches, you know, for other people." And so by the time you subtract out like, "Okay, well, what can I really use? You know, how much is reasonable for me to use?" You're right back at that embedded controller thing. And it's it's kind of like I don't know, did you play pinball as a kid? It used to be that the scores were like in the tens of thousands and now they're in the millions. And I'm like, "They just added zeros, okay? It's the same thing. The bumpers are now worth like 100 million each or something and they used to be 10." And I'm like, "How is this not, you know, it's it's that same moment from uh you know, old old my my amplifier, this one goes to 11. Like, "Who are you kidding?" >> Well, I guess Okay, I let me let me rephrase the question then cuz I do know what you mean, but I guess what I'm saying is uh with with respect to everyone else. So, in other words, you know, if you were on that microcontroller, then if there was another like let's say another person was brought on to the team to do something, the chances They they would know like it wouldn't be like they'd bring someone on and they brought like a a 16 MB executable and said, "Here, can you run this on the 192 bytes?" That's not going to happen, right? So, you were you weren't like the performance guy on the 192 byte microcontroller or whatever it is, right? But what I'm saying is sort of sort of later it's like or you're talking about making Windows fit, well, maybe Windows 1.0 everyone on the team is kind of aware of those limits, but by the time you get to Windows 3, certainly by the time you get to Windows 10 or something >> Right. >> most of the people on the team you're working with a large number of people who don't even read assembly language, who aren't sure how much memory their thing takes other than by looking at the like an actual like taskbar readout or something I mean a task manager readout or perfmon or something. And so what I'm wondering is like how that transition from I'm used to ever like just this is a thing that is ambiently thought about and you know, the people who are programming this thing would just know to I'm sort of now doing a a niche discipline almost. That that's kind of where what I meant not that obviously there's always a lot of fat to trim, but yeah. >> Okay, so I I think the the thing that I can say that's really maybe the most helpful is like a lot of what I do doing performance in a big corporation is actually education. Like I'm constantly working with team members to help them understand the context, the problem, the constraints, how they should think about it. And a lot of times you want to net it out to a small number of things that they should really be thinking about. Like just think about your memory usage. Memory usage is what's killing you. Think about memory, think about bytes, think about page faults, think about how can I get them thinking about a comparatively small number of things that is going to give them a real sense of am I going to get in trouble or am I still in a pretty good place. And it's interesting like if you're if you're coding a game, okay? Like say I'm a developer on some game. I'm working on a team develop developers on games. Every one of those guys has an FPS counter like right on the screen, right? You you look at the screen, it's always like 60 FPS, 60 FPS, we're doing fine, we're doing fine, 60 FPS. And if that drops to like 20 or something, people like, "Oh crap, I can't land this. I'm at 20 FPS. What did I do? Oh my goodness." Okay. So, at least metaphorically, and sometimes literally, you want to have like, what's the number that should be on the screen that they need to know, right? Is it their total memory usage? Is it like the number of libraries they loaded? Is it you know, classes loaded if it's Java? Is it like, what is it? What is, you know, the proxy for like, I'm in a pretty good place, okay? And then, when that goes south, the next thing you want them to know is like, okay, how do I diagnose that? Where's the place that I look? What are the typical things that go wrong? And so, that's where the education happens, right? Kind of helping them to understand the economies of the program that they're working on, and then helping them to understand the diagnostics, like, how do I understand those economies? This is This is why How many times have you seen me write like, I hate latency, like, stop measuring latency, latency sucks, latency's not probative. Like, it's it's because it's it's running slow. Oh boohoo, like, what do I do? Like, I just I just don't know what to do now. But, if you're showing them a number like, you're burning this much memory, you can be like, no, where's the extra memory burning coming from? What are the systems that typically burn memory? Which was it? Where has it gone south? It gives you like, um something to to grab onto. And like, a person would be like, who do I need to call? You know, like, oh Dave must have screwed up because we're we're burning too much on styles in the browser. Let's call Dave. I mean, obviously I made up the name, but you get the idea. Like, it gives you a sense of who do I need to talk to? What tool should I pull out? You know, it's not a coincidence that uh task manager shows CPU, memory, disk, network, right? They're They're the big consumption things. So, like, for starters, you pull out task manager, you're like, holy mackerel, network usage has gone through the roof. What the hell? Like, where what's going on? What kind of traffic is it? What what is it? What socket is it?" Like, it gives you diagnostics. So, the thing that changed for me is increasingly I spent time uh teaching people how to do this, showing people how to fish. What's the, you know, and and giving them a sense of like, given that your program is of type XYZ, this is how you think about programs of type XYZ. Because if you're building a compiler, right, the way you think about things is very different than if you're building an editor, you know, like editors don't want high throughput. Editors want to be asleep. Like, your optimal place for an editor is like nothing is happening. >> [laughter] >> Okay. >> Okay? Like, that's where you want to be as often as possible. I don't want to be burning battery. I don't want to be burning like I would like to be blocked cuz I'm so fast, you type a letter, bam, I'm asleep again. And if you look at it in a profiler, it's just asleep. This is not the case for compilers, okay? Compilers are the reverse, right? You know, with when you start the compiler, it's like full power to the compilation engine, you know, >> [laughter] >> just burn everything, right? Okay, this is not the answer for an editor. I mean, okay, maybe it is when you when you do like find in files or replace in files, okay? For that moment, you're like, "Okay, guys, full power, you know?" But mostly you want to be like idle. And so these, you know, interactive workloads are very different than compilation workloads. And it's different again than like some kernel piece, you know, which is different again than some networking stack or whatever. And so depending on context, you know, the way you think about perf a web server is very different than the way you think about perf an editor. But I mean, okay, I say it's very different. Like, all the concepts are the same, but like the goals and the key metrics are are different. And um you so you want to give people that information. Like how do I need to be thinking about it? What does good look like? How should I think about this? You know, like what aspects do I want to be considering in my algorithms? Um there's stuff that works for everybody, you know, like using less memory is always better. You know, like I'm hard for me to think of a situation where using more memory is better. You know, I mean less is better, you know, less everything is better. But uh but what really matters, you know, um for a particular workload can often be turned into just a few numbers. And if you can get that in people's head, and then kind of get them thinking about the the discipline of like what is economy look like? What is constitutes forward progress? What am I doing that's wasteful? Um all that stuff ends up mattering. Um and you spend tons of time teaching it. I mean like I've taught so many classes, like probably 500 somewhere between 500 and 1,000 uh classes at Microsoft on just like first >> Wow, okay. >> And over the like over 30 years like it's Right, it adds up. Okay. So but almost all of them were introductory, I would say. Like virtually probably 95% of them were like stuff that I just talked to you about. How do you approach the basics? And how do you change the culture of your team? That's the other thing. Like team culture matters. You have to cure people of this oh premature optimization is the root of all evil, so don't think about it until the finish line business. Like until you cure people of that stuff, they're going to just run into one truck after another. And um and they're screwed at the finish line. And and that's just not good for anybody. >> That that actually I'd really like to talk about that in a second cuz I think we're probably going to I'd like to hear about that for sure. But I want to kind of like dig into what you said before just a little bit just to kind of finish off this section as well. Uh So, you said in the course of that you uh there's a couple things I want to ask about, but one is you said you kind of said people were too fixated on latency. And uh what I heard you saying, I just want to make sure I understood this correctly, what I heard you saying was sort of like, well, you know, that's good and all because we do want the latency to be low, but the problem is kind of like it's not it doesn't tell me very much. Like, so the latency's bad, I have no idea why. Is that sort of what you're saying? Like, what we need is a little bit more targeted like give me a couple numbers like like you said page faults would be a good example or cache misses or whatever it is so that we can start to know like what is the latency actually coming from uh because if you just tell me like, oh, bad news, the latency went up to 250 milliseconds and it used to be 100, uh it's like, okay. >> [laughter] >> Is that Is that what you're saying basically? I just want to make sure I understood. >> So, no, no, that's exactly right. Latency is a symptom, not a cause. So, uh which is the, you know, the the briefest way of saying it. And there's always something at the crux of that. Like, what is the resource that's causing the problem? Am I burning way more CPU? And if I'm burning way more CPU, is it because my CPI just went to hell or is it because I just added a bunch of path length? Right? Like, it could be either of those and the solution is different. So, if it is if it turns out that it is CPU, then the next thing I want to know is like, wait a minute, like, did I just like kill my poor processor because I shot my low priority to hell or or did I just add a giant loop in the middle of something? And those are very different problems and you attack them very differently, right? So, and latency just basically tells me to look without >> [laughter] >> So, like, is it disk? Like, it could be, right? So, I always go back to what is driving the latency in this instance. Now, it's important to track latency. Executives want to hear about latency. My mom never once called me up and said, "Rico, there's too many page faults at the start of Word. You need to get that under control." Yeah, yeah, yeah, yeah. It's not going to happen, okay? So, of course latency matters, but as a diagnostician, get over it. That's not your go-to at all. You know, that's your safety check to make sure the stuff really is turning into good responsiveness. But, also, like if you are managing a fleet of things, okay? Like, let's say I have an opportunity to cut my CPU usage in half, and it will not touch the latency at all. Right? Like, people will be like, "Ah, it's fast enough." I'm like, "Dude, you're leaving 50% CPU usage on the table. That's money. Like, what are you talking about? You're contributing to the heat death of the universe." Like, >> [laughter] >> Okay. >> So, that or it's battery or something. Like, just don't burn CPU that you don't need to. Then, don't tell me, "Oh, well, but it's not affecting the latency." Like, you're killing me, right? And maybe someone else wants that CPU. Like, you know, if we didn't burn it, we would some other workload on those servers. And, you know, at the very least, we could mine Bitcoin. >> Right. [laughter] Right. Yep. >> You know, like, better than just completely burning it. And, so it's important to look at where's your consumption and just to make sure that you're doing it economically. Like, you know, maybe you are able to parallelize that consumption away, but you could still go after it. And, it could give you battery time. Or something, you know? Um, or at at the very least, capacity to do something else with that same hardware. You know, and save you cash. Like, it matters. You know, people have systems with tens of thousands or more, you know? Like, millions of servers running potentially. And, like, it matters, you know? So, yeah. >> So, uh I guess also in in the all 