transcript: '{"content":"\n[0.24s] A few weeks ago, I had to go to the\n[2.159s] emergency room. In this video, I want to\n[4.799s] discuss how Buddhist practice helped me\n[7.359s] through that ordeal. That''s what I''m\n[9.599s] going to be discussing today. Now, to\n[12.48s] begin with, I should be clear. I am not\n[14.96s] a doctor. I don''t even play one on TV.\n[17.92s] So, I''m not going to be giving any\n[19.279s] medical advice here. I''m just going to\n[21.039s] be talking about my experience.\n[23.68s] and I''ll discuss six aspects of practice\n[27.76s] and how they integrated into my\n[29.84s] experience and helped get me through.\n[33.68s] To begin with, we''ll discuss mindfulness\n[35.68s] of the body.\n[37.84s] On Sunday morning a few weeks ago, I\n[40.079s] began to have some abdominal discomfort.\n[42.96s] I mean it wasn''t anything serious when I\n[46.16s] but I was aware that when I sat down to\n[48.399s] meditate uh that that morning the\n[51.039s] discomfort was indeed pretty primary. It\n[53.76s] was something that I was directly aware\n[55.44s] of. I knew that we were going to have uh\n[58.16s] friends over to dinner that night and so\n[61.039s] I was concerned about you know how I\n[64.479s] would be in a few hours. I had a bunch\n[67.52s] of what we might call mental\n[69.76s] proliferation papa around the\n[72.24s] possibility that I might have some sort\n[74.72s] of stomach bug. But I was also aware\n[78.08s] during my meditation that morning that\n[80.56s] the fact that I was somewhat hungry for\n[82.799s] the lunch that was coming up that made\n[85.2s] me feel somewhat at ease.\n[88.08s] Now, as I ate lunch that that day, that\n[91.36s] that middle of that day, I didn''t have\n[93.84s] any problem and I continued to observe\n[97.28s] the symptoms I was going through\n[99.28s] mindfully.\n[101.439s] By about 2:00 p.m., however, that\n[103.52s] afternoon, the abdominal discomfort that\n[106.32s] I''d had began to radiate upwards into\n[108.88s] the stomach area,\n[111.04s] and I began to feel pretty nauseous.\n[115.2s] Uh at that point in the day, I was\n[118.079s] getting relatively sure that I had that\n[120.96s] dreaded stomach bug. It was must have\n[124.56s] been either something that I ate or\n[126.479s] perhaps I had caught some virus, but I\n[129.92s] was aware that my wife was all right and\n[134.16s] we had eaten more or less the same\n[136.239s] things in the last several days. So, we\n[139.36s] I tried and we both tried together to\n[141.28s] figure out if there was something that\n[143.28s] we had eaten different. And there were a\n[145.28s] couple small things, but there was\n[146.56s] nothing that stuck out to me. In any\n[149.44s] event, as the early afternoon went on, I\n[153.519s] decided we should probably cancel dinner\n[155.92s] plans because I didn''t know how I was\n[158.16s] going to feel by the time that dinner\n[159.68s] rolled around.\n[163.28s] Second, we can talk about mindfulness of\n[165.44s] feelings. That was another thing that I\n[167.599s] went through. As this pain intensified,\n[171.599s] my mindfulness practice turned, I would\n[174.4s] say, from a more general, we might say,\n[176.879s] non-judgmental body awareness, awareness\n[179.599s] of the body, mindfulness of the body to\n[182.56s] an awareness focused on the pain itself.\n[186.159s] Now, mindfulness of feelings, as many of\n[188.4s] us will know, involves uh an awareness\n[191.76s] of the painful and pleasant sensations\n[194.48s] in the body. Now in my case uh I was not\n[198.0s] focused on pleasant sensations. That was\n[200.159s] not really what was important.\n[202.64s] But what I did was to reflect upon the\n[204.959s] aim of the practice. The aim of this\n[208.239s] practice is to hold pains and pleasures\n[212.0s] lightly without desire or aversion\n[216.0s] basically with equinimity.\n[219.36s] And that kind of process, that kind of\n[222.879s] attitude can work, I think, for a time\n[225.36s] for most of us or many of us if the pain\n[228.08s] isn''t terribly bad. But what I was going\n[231.68s] through was really well over that line\n[234.48s] of where the pain was bad. I really I\n[237.68s] was really wanting the pain to go away.\n[240.239s] I was very aversive to the pain. Well,\n[243.519s] what could I do? I shifted my attention\n[247.519s] to being mindfully aware of the aversion\n[250.799s] itself,\n[252.64s] of the strong feeling of wanting that\n[254.879s] pain to go away, of dreading the next 24\n[259.919s] hours. As many of us will know who''ve\n[263.12s] had a stomach bug, 24 hours are really\n[266.16s] not very pleasant.\n[268.639s] I also turn to being mindfully aware of\n[271.6s] the changing nature of the pain. This is\n[274.4s] something that many people suggest if\n[276.16s] you''re going through intense pain to\n[278.16s] become aware that the pain is not\n[280.56s] literally the same over time, but it\n[282.639s] changes. It''s subtly variable. It\n[286.639s] changes in both intensity and in type.\n[290.16s] So, a pain of one kind may change into a\n[293.04s] pain of another kind or radiate into a\n[295.52s] different part of the body. However,\n[297.84s] what I was aware of during this time was\n[300.56s] that the pain although it did change\n[303.44s] only changed in a very narrow band\n[308.0s] and I was also aware of the fact that I\n[310.4s] was getting more and more nauseous.\n[313.68s] However, I wasn''t able to throw up so\n[316.24s] you know that was not very good either\n[317.84s] in a certain sense.\n[321.199s] Now turning to the third aspect which is\n[324.0s] clear comprehension or sumpa.\n[328.08s] Here in the day is where I'' I''d say that\n[330.72s] clear comprehension began to enter the\n[332.96s] picture. That is beginning to see the\n[335.44s] things as they really are. Now there are\n[339.44s] many aspects to clear comprehension.\n[343.12s] uh in this instance what I''m talking\n[344.72s] about or what I mean is that I became\n[347.12s] aware that something in my experience\n[350.16s] was not developing as I had expected\n[354.4s] in particular with a stomach bug there''s\n[357.52s] pain and nausea indeed which I was\n[359.44s] feeling but that pain and nausea at\n[361.759s] least in my experience in the past tends\n[364.639s] to be quite variable that is at times\n[367.919s] the pain and nausea are really bad and\n[370.8s] then at times they fade away over the\n[373.36s] course let''s say of several hours and\n[375.919s] then both of them will return and so\n[378.56s] they go up and down over the course of a\n[380.8s] day. However, what I was experiencing\n[383.919s] was not like that. It was a pain that\n[386.8s] was and nausea that were relatively\n[388.72s] constant and unyielding.\n[391.44s] Now, my wife had been suggesting that we\n[394.4s] go to the emergency room for a while\n[396.479s] already, but I hadn''t wanted to so long\n[399.919s] as I felt that this was just a 24-hour\n[402.88s] stomach bug. I didn''t want to spend an\n[405.759s] hour\n[407.6s] talking to the people in the emergency\n[409.039s] room and having them tell me that I\n[410.8s] really should just go home and, you\n[412.72s] know, take fluids.\n[415.44s] But by 6 around 6:00 p.m. on Sunday\n[418.96s] evening, my mind began to change. With\n[423.12s] this kind of clear comprehension, I\n[425.52s] began to feel that I might not actually\n[428.479s] have a simple stomach bug. Perhaps I had\n[432.0s] something like a stomach ulcer or\n[434.479s] something anyway more serious because it\n[436.96s] felt so painful and that pain seemed\n[439.039s] unyielding.\n[441.199s] So I made the decision that we should\n[443.28s] probably go based on that clear\n[445.759s] understanding that something seemed to\n[448.08s] be seriously not right.\n[452.0s] So now the fourth aspect turning to\n[454.88s] mindfulness of feelings as well as\n[457.039s] mindfulness of mind.\n[459.919s] Now the practices that I found helpful\n[462.4s] in the hospital\n[464.56s] over overlapped somewhat but also\n[466.479s] introduced some new elements into my\n[469.44s] practice.\n[471.12s] I certainly aimed to retain mindfulness\n[473.68s] of these symptoms that I was undergoing\n[475.919s] of what was going on inside me.\n[479.52s] Now clearly\n[481.36s] even in the hospital as I lay there on\n[484.08s] the the gurnie I was only dimly aware of\n[487.759s] whatever was going on within me but at\n[490.24s] least I knew enough to believe that I\n[493.039s] wanted expert help because I didn''t know\n[496.16s] enough.\n[497.919s] And as you might expect, once I got\n[499.84s] there, they fixed me up with all sorts\n[502.72s] of IV lines, asked a lot of questions,\n[506.8s] including whether or not I''d had my\n[508.8s] appendix out, and I hadn''t.\n[511.919s] They also asked me about the scale of\n[514.08s] the pain. And here we get back to\n[516.0s] mindfulness of feelings.\n[518.479s] my estimate in so far as I could give an\n[521.12s] estimate. Uh they they always ask you on\n[523.839s] a scale of one to 10, one being no pain\n[526.8s] or almost none and 10 being the most\n[528.959s] severe pain you can imagine. My feeling\n[531.68s] was that I was oscillating between a\n[533.839s] seven and an eight on a scale of 10 and\n[536.56s] that I was mostly somewhere up around\n[538.959s] eight.\n[541.12s] So in any event, at that point, they\n[542.88s] gave me they decided to send me to get a\n[545.519s] CT scan to see what was going on inside\n[549.2s] me. They gave me as well an IV\n[552.16s] painkiller. That is a painkiller through\n[554.72s] my IV line. And I noticed in the next\n[558.0s] few minutes that it made no difference\n[560.16s] at all.\n[562.16s] So what happened then is is quite\n[564.24s] interesting. The the nurse said that\n[566.64s] since that painkiller they''d given me\n[568.959s] didn''t seem to have any effect, they\n[571.04s] were going to fix me up with a morphine\n[573.12s] drip as well as some anti-nausea\n[575.76s] medication. And I can recall quite\n[578.16s] clearly that through this kind of pain\n[580.48s] that I was in, my curiosity began to\n[583.76s] perk up. I''d always wondered about the\n[586.88s] effects of morphine.\n[589.36s] In particular, I do remember reading or\n[592.08s] hearing sometime in the past that some\n[595.279s] people had said that the when you took\n[597.44s] morphine, the pain remained the same,\n[600.8s] but that you stopped caring about the\n[602.8s] pain. And I''d wondered what that\n[605.36s] experience might be like. That is to\n[607.839s] undergo exactly the same pain but not to\n[611.6s] care about it. In other words, to have a\n[614.0s] kind of equinimity in front of very\n[617.279s] serious pain.\n[619.279s] Now obviously I didn''t want to get there\n[622.0s] you know get to that knowledge by way of\n[624.399s] some kind of addictive opiate that is\n[626.64s] taking morphine myself unless this was\n[629.44s] absolutely necessary and under a\n[631.839s] doctor''s care but now that I was in in\n[635.279s] fact under a doctor''s care I was curious\n[638.24s] to know how this process would feel\n[642.64s] and indeed the nurse told me it would\n[645.04s] take about 10 to 15 minutes for the\n[647.36s] morphine to take effect.\n[649.92s] By the time this happened, the results\n[652.48s] of the CT scan that I had had were\n[654.8s] becoming available and the emergency\n[657.92s] room doctor came to tell me that it\n[660.32s] seemed like I had early stage\n[662.399s] appendicitis\n[663.92s] and that they would therefore schedule\n[665.839s] surgery later that same night or the\n[669.04s] next morning. By this point, I began to\n[671.839s] notice the effects of the morphine. Now\n[674.399s] I can only speak to my own experience\n[676.399s] here because everyone''s experience may\n[679.12s] be somewhat different but at least in my\n[681.839s] experience I noticed that the pain\n[684.32s] declined let''s say from an eight which I\n[686.399s] had felt before to around about a three.\n[690.32s] I did feel relaxed. I felt a bit drowsy\n[693.12s] but not sleepy. And the anti-nausea\n[696.72s] medication I I had taken meant that my\n[699.279s] nausea went away as well. All these\n[702.48s] things together meant me me me me me me\n[703.44s] me me me me me me me me me me me me me\n[703.44s] me meant that the pain was now at a\n[705.04s] level where I could deal with it\n[707.12s] mindfully as as I mentioned before I\n[710.16s] felt basically all right and more or\n[712.48s] less contented in the hospital lying on\n[714.48s] the gurnie.\n[716.399s] Now it was not the case therefore that\n[719.04s] this was the same pain that I had\n[721.04s] experienced before but that I didn''t\n[723.44s] care about it. It was indeed that the\n[725.839s] pain level had changed significantly. So\n[730.0s] I felt that that answer or I should say\n[732.399s] that that question had been answered for\n[734.48s] me.\n[736.079s] Now fifth, what''s often overlooked in\n[738.88s] mindfulness practice is the early\n[741.76s] Buddhist focus on mindfulness of death.\n[745.839s] While I cannot say that mindfulness of\n[748.48s] death played a huge role for me that\n[751.2s] day, it did come up in my mind. I was\n[755.2s] wheeled to the emergency room later that\n[757.279s] night, probably around 11.\n[760.16s] I had a talk with the anesthesiologist\n[762.959s] and the surgeon about the procedure that\n[765.6s] I would be going through. I knew\n[768.8s] basically that the procedure was\n[770.88s] routine.\n[772.48s] I''ve learned since then that the that\n[774.8s] having an appendecttomy is perhaps the\n[777.04s] most common surgery. So, it was not\n[779.2s] something unusual.\n[781.04s] However, they told me that the surgery\n[783.68s] would involve general anesthetic. In\n[785.839s] fact, I was glad it would and that it\n[788.48s] would involve a breathing tube.\n[792.0s] So, knowing that it would involve both\n[794.48s] of those things, in particular, a\n[796.079s] breathing tube is is something serious,\n[799.04s] I knew that this procedure I was going\n[801.839s] to be undergoing was not a joke. And\n[804.48s] that caused me to reflect indeed for a\n[806.959s] short period on the possibility that I\n[810.56s] might not come back from it. I knew\n[813.44s] there was a indeed a very very small\n[815.6s] chance but to be honest I felt at peace\n[819.519s] with it. Now I don''t think that this was\n[822.88s] an effect of the morphine\n[825.44s] but it''s impossible for me now to know\n[828.16s] for sure looking back on it. I think it\n[831.6s] was simply the awareness that this\n[833.839s] surgery had to happen and that it would\n[836.959s] therefore unfold as it had to unfold.\n[840.959s] If I wasn''t around on the other side of\n[843.68s] the surgery, then so be it. There was\n[846.56s] nothing that I could do about it. This s\n[849.92s] this situation, this process of being\n[852.959s] mindful of death might have been harder\n[856.399s] if I''d had more time to ruminate on the\n[858.88s] subject. ruminate on possibilities of\n[862.079s] not coming back or if I hadn''t been in\n[865.76s] any pain and instead been let''s say\n[868.72s] resting at home anticipating the\n[871.279s] eventual pain of surgery. But in the\n[874.399s] case that I was in I had no time to\n[876.959s] ruminate on anything basically I mean I\n[879.36s] was there in the emergency room already.\n[882.32s] I was there in the waiting room for the\n[885.92s] surgery uh to happen and I was indeed\n[889.6s] already in some pain even though it was\n[892.32s] manageable. So I knew that there was\n[894.72s] really only one way out of the\n[896.72s] situation.\n[898.88s] The other thing that I reflected upon\n[900.8s] while I was at the hospital, and it was\n[902.959s] perhaps the most important reflection\n[905.04s] that I think I went through that day was\n[908.24s] a reflection on meta, that is to say,\n[911.12s] kindness or loving kindness.\n[914.88s] When I was younger, when I was a young\n[916.88s] kid, I had a real fear of doctors and a\n[919.68s] fear of needles.\n[921.76s] I saw the whole situation of being with\n[924.24s] doctors and hospitals only from the\n[926.959s] egoistic perspective that these\n[929.839s] whitecoated strange people I had never\n[932.16s] met were causing me pain and discomfort.\n[936.88s] There are many causes and conditions\n[939.92s] through my own life that allowed me to\n[942.48s] see through these kinds of delusions.\n[946.24s] But one of those one of those aids to my\n[949.68s] seeing through these kinds of delusions\n[952.079s] was Buddhist practice itself. That is an\n[955.6s] awareness of the compassion of others\n[959.6s] that makes them at least some of them\n[961.759s] pursue a degree in health care as let''s\n[965.12s] say a tech as a nurse as a doctor. The\n[968.72s] three kinds of people that I was\n[970.24s] generally surrounded with.\n[972.639s] I felt that compassion from everybody\n[975.36s] that I met at the hospital.\n[978.48s] All of them, without exception, were\n[980.88s] very kind and relaxed people who\n[983.6s] certainly seemed to be trying to do\n[985.36s] their best for me. Now, I''m sure that\n[988.32s] many of them had their own stresses and\n[990.399s] worries to deal with just as all of us\n[992.24s] do, but they didn''t come across to me.\n[995.6s] And I''d like to think that I would have\n[997.839s] understood somewhat even if they had.\n[1000.72s] After all, the ER is a stressful place\n[1003.04s] to work. But in response to that\n[1006.639s] compassion I felt from them, I felt real\n[1009.839s] compassion in return or I should say\n[1012.32s] real kindness in return towards them all\n[1015.44s] and towards the hospital environment\n[1017.36s] itself.\n[1019.68s] Indeed, when we, my wife and I,\n[1022.16s] eventually arrived home late the next\n[1025.12s] morning after spending the entire night\n[1027.839s] in the hospital resting,\n[1030.319s] my wife commented on how happy she was\n[1032.959s] that we were finally back at home. And I\n[1036.24s] have to say I agreed, but with the\n[1038.559s] difference that I also had felt at home\n[1041.679s] in the hospital. I felt under the kind\n[1044.799s] care of the people there, the\n[1047.039s] compassionate care of the people who\n[1048.72s] worked there. I felt that they had done\n[1051.28s] their best for me, which was no small\n[1054.64s] thing.\n[1056.72s] So in summary, mindfulness, clear\n[1060.4s] comprehension, awareness of impermanence\n[1063.039s] and death, and kindness and compassion.\n[1066.88s] All of these are key Buddhist practices.\n[1070.16s] and reflecting on them now, I can see\n[1072.64s] how they helped frame the experience I\n[1075.6s] had, turning what could very easily have\n[1078.799s] been a dayong scary ordeal into\n[1083.36s] something that was really meaningful and\n[1085.76s] in in its own way almost wonderful. Now,\n[1089.919s] do you have to be a Buddhist or know\n[1092.32s] about Buddhist practice to do any of\n[1094.799s] this to be able to pursue any of these\n[1097.76s] kinds of of of techniques? Of course,\n[1101.28s] you don''t. Uh people can do it from any\n[1103.28s] walk of life. However, what I think\n[1106.32s] helps is that the practices of early\n[1108.88s] Buddhism give us an easy framework that\n[1112.559s] we can use to approach life and in\n[1115.039s] particular somewhat difficult aspects of\n[1117.6s] life skillfully.\n[1120.4s] So my question to you is, have you ever\n[1122.88s] had a time when your Buddhist practice\n[1125.679s] helped frame a painful experience in a\n[1128.799s] way that made it feel better to you? If\n[1132.24s] you''re interested in the general\n[1133.6s] question of working with kindness, then\n[1137.44s] I suggest an earlier video of mine on\n[1139.919s] the power of kindness, which talks about\n[1142.64s] compassion and kindness and cultivating