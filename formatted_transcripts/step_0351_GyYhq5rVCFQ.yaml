transcript: almost everything you see on my channel is either a finished or soon to be finished project but i also have a lot of failed unfinished or abandoned projects that i've never really talked about and the largest one was humanoid [Music] this goes back all the way to 2012. i was heavily inspired by the game cave story and how a sole developer wrote the entire game in his own custom engine including all the music sprite work story and even the tools and editors and having always wanted to write an engine like that i decided to try and build one myself mostly as a learning experience after a lot of work i did have a working sandbox and tile editor that i was happy with but i decided against making any kind of full game with it because i was busy with other things and it would have just taken me way too long [Music] but fast forward to 2015. i was trying to come up with an idea for how i would propose to my wife and i had the idea to make her a video game using my engine i mean the engine was already written and all i had to do was build a short game on top of it well i did and it took me about four months to finish non-stop i actually have a full playthrough of it on my channel though it's kind of an older video so not that many people have seen it and it really was a full game or at least a full demo and after working on it for so long and so many hours i was exhausted and that's kind of where i thought it would end so fast forward again to 2016. at this point i was feeling the itch to do some game dev again and after playing undertale it finally pushed me over to continue developing some kind of game and that's when i came up with humanoid [Music] set in the near future it's a world populated by humans and robots though robots are still not considered human enough to have sentience you play as the first sentient robot that's hoping to be considered an equal in society but of course there's a lot of challenges you have to overcome and other robots to battle as you make your way to a big competition [Music] i added a lot of improvements to the engine like dynamic lighting a real-time synth and texture compression but what was really starting to slow me down was the sprite art you see in the proposal game because it was really only designed to be played once and not released to the public i kind of just stole whatever sprite art and music i needed and just reworked it to fit the game now that i was making a real game i had to start making all the assets myself but i'm not a sprite artist and it just takes me a really long time to make something that i'm happy with and so i started to slow down more and more and just feel less and less motivated to work on it and then tragedy struck in 2018 my car was broken into and my backpack was stolen that had the laptop with the game and it just happened to be that the most recent backup was also in the backpack on the thumb drive i had some older remote backups too but i was probably missing about 50 to 100 hours of work and that just made me really depressed i was already sort of losing interest and this kind of just felt like the nail in the coffin to my absolute surprise though a month later i got a call from the police department apparently they had found the backpack that just so happened to have a receipt inside with my phone number obviously the laptop was gone but when i opened the other compartment there it was my flash drive with the recent backup and that's really the only way i'm able to show you any of this footage today so if i got everything back why did i still decide to abandon the game well in the indie game world it's really hard to stand out when there's thousands of new titles coming out every day the easiest way to stand out is to do something radically different which is what happened with marble marcher and hyperbolica i just felt compared to my other projects like those there just wasn't enough unique things in humanoid to justify the enormous time sync i'd have to put into it my time just feels better spent on these other more interesting projects and unlike the proposal game which would only need to run on my one computer supporting any kind of cross-platform is way more difficult when i have to port an entire custom engine to different platforms and handle every possible configuration but it wasn't a complete loss because i managed to salvage a lot of pieces from it for instance did you know that the avatar i used to use on my channel is based on the main character and i also managed to transfer parts of the story and dialogue to hyperbolica and other parts will be in a future game plus i learned a lot of lessons along the way about game design planning and of course the importance of continuous backups anyway that's the story of the game it's a dead enough project now that i don't have to worry about spoiling anything and that's why i decided to finally make the video thanks for watching and i hope you enjoyed this untold bit of code parade [Music] history [Music] do you
