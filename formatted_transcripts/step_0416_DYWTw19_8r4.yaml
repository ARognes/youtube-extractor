transcript: earlier this year I released an open source project called clay which is a high performance UI layout Library written in C if you're not familiar with what a layout Library actually does imagine you're building part of a user interface like a drop- down menu with a list of options if you had never built a user interface before the simple naive approach you might take would be to just draw the whole thing to the screen manually one piece at a time and what I mean by drawing manually is by literally drawing the shapes you start by drawing a dark blue rectangle as the background then maybe you draw in all the horizontal lines one by one and then you draw in all the text labels and while the result looks pretty good at first there are actually some pretty significant issues you'll run into doing things this way the first issue is that you have to calculate the onscreen position of all of these elements individually this is not only timec consuming and error prone because because you can easily just mess up and draw one of the elements in the wrong place but is also ignoring one of the fundamental truths of how people actually think about user interfaces when you look at a drop- down menu like this you don't think of the text and lines just being drawn over the top of the background you think of them conceptually as being inside the drop-down menu if I was to move the background rectangle you really would expect the contents to move as well but because we're drawing each item individually the position of every single one of these items needs to be updated independently the second issue is that you have to calculate the dimensions that is the width and the height of every single one of these individual elements as well again not naturally how we think about user interfaces just as we imagine the text items being inside the dropdown we imagine the dropdown as enclosing all of its contents but with our current approach if one of the text items gets too big it just spills out over the edge we can increase the width of the background rectangle to compensate but now the horizontal lines don't extend the entire way the same kind of overflow happens vertically when we're adding new items and when we remove items from the list we need to remember to shrink the background rectangle again or we end up with extra space at the bottom these issues continue to compound and when you have a large and complex graphical application that expects to be able to deal with the window or the screen being arbitrarily resized it becomes very difficult to manage things this way so rather than you as the programmer having to calculate and specify the exact position and size of every element on the screen layout libraries allow you to build your interface out of flexible building blocks these blocks can shrink or grow automatically to the size of their contents and they can also be nested inside other flexible blocks that way when you move the parent block all the child blocks move too and when the inner blocks grow or Shrink the outer block grows and shrinks to match essentially emulating the way that we naturally think about user interfaces which is as a series of nested boxes so in contrast to our initial flat list of draw commands that are all independent from each other with a layout Library like clay you Nest these flexible building blocks inside each other building something that we refer to as a UI hierarchy and to illustrate a bit more clearly how this actually works in code if I was going to build a drop- down menu like this using something like clay I'd start off by creating a flexible outer container to put everything else inside we'll configure the container so that our menu items are laid out from top to bottom and we'll give it a dark blue background color then instead of rendering text over the top we create the text items inside the container which automatically grows to fit without us having to think about how big the container is supposed to be to make it look a bit nicer we'll put in some padding around the inside of our container and we can configure a nice consistent gap between the elements as well now it's looking a bit skinny so we'll give it a minimum width and instead of having to draw all of these horizontal lines individually we can just ask the layout tool to put a border between all the list items for us in its current state this container will automatically resized to fit the children inside it growing or shrinking vertically when you add or remove items and horizontally when the text of the items gets longer if I wanted to I could also specify a maximum width for this drop down which would cause the layout library to automatically wrap text that's too wide onto a new line handling any changes in height or positions of other list items along the way very convenient and so much less work than having to calculate all those positions and sizes yourself and that's all the UI layout Library does really it just takes that flexible UI hierarchy that you've defined and uses that to build that simple list of draw commands that you were originally creating by hand and then the process of rendering them to the screen is exactly the same so you can almost think of it as like automating that combersome process of creating all those draw commands and this process of taking our UI hierarchy figuring out what size all the elements should be where they should go on the screen is called Computing the layout the Second Step which is taking that list of draw commands like rectangle text or image and actually drawing them on the screen is called rendering the layout and the reason that I'm drawing attention to these two distinct steps Computing the layout and rendering it is because this is the point at which clay starts to differ a little bit from other UI layout libraries out there the most famous UI layout library of all is called CSS which stands for cascading stylesheets it's built into every web browser and lays out almost every web page and web application you've ever used contrary to popular opinion I actually love CSS I find it to be very flexible and expressive but one of the major issues that CSS does have is that you can only use it to build uis inside a web browser and as a result applications with uis that are built using CSS like Spotify and Discord vs code and slack to name a few actually have to bundle an entire web browser inside their application the reason you need a browser to be able to use CSS is because those two steps we talked about earlier Computing the layout and rendering the layout for CSS that whole process happens inside the blackbox of the browser so if you want to use CSS to lay out your interface you have to use a browser to render your interface Clay on the other hand only computes the layout it doesn't render it it gives you the flexible building blocks to use you build your UI hierarchy and then it generates the list of draw commands for you and as a result it's possible to plug clay in almost anywhere that you can draw rectangles and text Clay has a few pre-built renderers included in the repository that you can use out of the box or it's very easy and actually quite fun to write your own renderer in a few hundred lines of code AS community members have done and as it turns out if you really focus on just Computing the layout you can come up with a pretty simple and elegant solution the core UI layout logic in Clay is only about a th lines of c and the library is simple enough that it ships as just a single C header file so if you want to use it in a c or C++ codebase it's pretty much as simple as just including clay. there are also bindings for the Odin programming language in the repository with more languages on the way and because Clay is internal logic is so small and simple I ended up implementing everything clay needs by hand which means clay has no dependencies at all it doesn't even use the C standard library that means that you can very easily compile and run Clay on almost any platform including compiling it directly to about 17 kiloby of web assembly fun fact the clay website itself is actually written almost entirely in C using clay compiled to web assembly instead of CSS pretty cool right the second major point of difference between Clay and other UI layout libraries is how it handles changes now it's one thing to correctly render a single still image of your user interface but an interface isn't very useful if it doesn't respond to user interaction users expect to be able to scroll content that's too large for the screen for drop downs to open when clicked or tapped on and for entire sections to be swapped out when they interact with navigation elements like tabs the way that clay handles changes to the interface is in the simplest and most foolproof way possible with Clay whenever anything at all has to change in your user interface like a button changing color when you click on it you just regenerate everything from scratch to match the new state rebuild the UI hierarchy recompute the positions and sizes of everything regenerate all the draw commands and reender the entire UI to the screen and in UI terminology this approach is known as immediate mode now on the surface this probably seems quite wasteful right why should we bother to recompute the entire interface when we're doing something as small as changing the color of a button and you're not alone in thinking that a number of other UI layout libraries including our friend CSS allow you to directly change a small part of your current UI without having to throw the whole thing away and rebuild everything from scratch in contrast to immediate mode this approach is referred to as retained mode because you retain or hold on to the UI that gets computed so that you can make changes to it so just to reiterate if we have a yellow button that we want to turn pink when you click on it in immediate mode because you've thrown away all of your previous interface you get to decide from a blank slate whether the button should be yellow or pink you can see in this function that creates our button we have a Boolean that tells us whether it's currently being clicked on or not and we can use that to deter determine what the color of the button should be by contrast in retained mode we create the button once and it's retained so we keep a reference to it and then sometime later we use that reference to directly change the color of that specific UI element which of course on the surface makes it look like retained mode is significantly more efficient so given that I knew this before I built clay and I'm also claiming that clay has very high performance why did I choose to use use immediate mode well the primary reason is that the code required to build a complex user interface in immediate mode ends up being radically simpler than the equivalent in retained mode I'm going to put a link in the description to a much deeper discussion of the two approaches but at a high level what it breaks down to is the difference between building something new from scratch compared with changing something that already exists if you're a programmer you will definitely already have some intuitive feeling that building something new to solve a problem is much easier than modifying something existing to solve a problem and we can demonstrate this with a pretty trivial example say you have a tab bar in your application that has three tabs you can click tabs to switch between them and the selected tab has a lighter background as a visual indication in an immediate mode UI the code to create these buttons including the selected state is Trivial you store the index of of the selected tab as a variable and then you just Loop over the data that represents your tabs if the loop index matches your selected index you give the tab a special background color to indicate that it's selected because in immediate mode we're throwing away the UI from the previous frame and rebuilding it using this function this UI will always correctly represent the data all you have to do is change your selected index variable and then when the function gets rerun it will rebuild a new tab bar with a different tab selected in retained mode something as simple as this becomes so much more complicated firstly in retain mode you can't just update the selected tab index variable and expect the UI to update as well you have to remember to also trigger an update to your UI that is when a user clicks on a tab to select it when they change tabs using keyboard shortcuts when they open a new tab when they close a tab all of these are cases where you can end up just changing the selected tab index and forgetting to update the UI but by far the biggest problem is not only do you have to remember to select the new active tab but you also have to remember to correctly deselect the old active tab because the state of the old tab is retained and so it will stay selected until you specifically deselect it as an example of the kind of problems this can cause you need special case handling for when you close the tab that's currently selected because if you try to set the background color on a tab you've already destroyed you'll end up crashing your program what it boils down to is that in immediate mode you only have to think about how your UI is supposed to look now given the current state of the data by contrast in retained mode you not only have to think about how your UI is supposed to look now but you have to figure out how to transition your old UI into your new UI and as your application gets more complex and larger you end up with a combinatorial explosion of things that can go wrong during that transition but you don't have to just take my word for it you just have to look at some of the most popular JavaScript Frameworks like react and realize that the reason that those libraries are popular is because they allow you to use an immediate mode UI over the top of the retained mode UI that's built into the browser and so because of that massive difference in complexity for the developer it was essential to me that clay used immediate mode but just because I can make a good justification for it doesn't mean that those performance questions just go away if all I cared about was immediate mode and not about performance I would have just built my applications using react in a browser and called it a day but because I personally believe that building efficient high performance applications is really important it was critical that I managed to keep the cost of computing a layout in clay down to the absolute minimum and I'm very happy to say that clay now can generally compute a layout with thousands of interdependent elements in under 200 micros with most average interfaces coming in at about 50 microc for the layout a microsc is 1 millionth of a second which means that a 50 microc layout is the rough equivalent of 20,000 frames per second rendering an application or game at a standard 60 frames per second gives you 16 or 17,000 micros to get your frame on screen so the couple hundred micros clay might spend doing out is a rounding error as part of that high performance design clay uses a fixed size memory buffer that for most applications won't exceed more than a few megabytes now that you're somewhat familiar with how clay works and why it exists let's walk through building a small user interface for theoretical application so you can get a feel for how you actually use it I'm going to be using the rib renderer which is available in the repository but you can use any renderer that you like rib is just a simple C library for drawing 2D and 3D graphics and it's fantastic so I recommend that you check it out if you haven't seen it before first off you can head to the clay repository on GitHub there are official releases but for the purposes of this video we're just going to clone the entire repository cuz that will give us access to the renderers and the examples to get started with Clay Inc we use this Define to tell clay to put its implementation into this translation unit then we can include the clay. H file that's in the root of the repository as well as the clay rib renderer file that we use for actually drawing the UI to the screen we're then going to initialize rib and we're going to pass it a flag that will allow us to resize the window clay doesn't do any internal allocations so we're going to have to allocate some memory and pass it to Clay to use the Min memory size function will tell us exactly how much we need need to allocate now we can go ahead and create an arena for clay to use by creating a clay Arena struct and passing that minimum memory size to maloc we then initialize clay by passing it the arena that we just created along with the dimensions of the layout that we're building in this case we'll pass the dimensions of the screen that we can get directly from rib finally we'll set up a loop using rayb that runs once every frame so that we can recal calculate our layout and use clay in an immediate mode style to use clay you start off by calling begin layout you then build your UI hierarchy and then call end layout when you're done end layout returns you an array of render commands which we can then pass to the RB renderer to actually draw to the screen in a similar way to Clay in rib we need to start off by calling begin drawing we can then pass our commands to Clay rib render and finally call end drawing so far so good now we're going to go through step by step using clay to build a simple interface for a text editing application all elements are defined the same way using the clay macro and then inside the parenthesis we can configure the element any way we like I'm going to use the rectangle configuration and at first I'm going to give it a bright red color so we can see what we're doing then I'm going to use the layout configuration to tell clay that this element should expand to the full width and height of its parent which in this case is the width and height of the screen there are a number of different sizing modes that you can read about in the documentation I'm also going to tell RB to just clear the screen with a black background color every frame so we don't have any dirty pixels left over let's run it and see how it looks and there's our beautiful bright red container expanding to the width and height of the screen but there's a little problem if we reize the window we get these black bars at the right and the bottom that's because clay doesn't actually know that we've resize the window to get clay to update its internal Dimensions we want to call the set layout Dimensions function every frame and we can pass in the same dimensions that we used to originally initialize clay if we run the application again we can see that resizing now behaves as expected with the container correctly stretching to the full dimensions of the screen I'm just going to change that background color to something that's a little bit less of an isore and we can start building our application ah much better now we're going to start giving our application a bit of structure to add child elements to our container we add them inside the braces that follow the clay macro I'm also going to start tagging elements with IDs so it's easier for us to see what's actually going on first off we're going to divide the screen into a top header bar and some lower content and to do that we can configure our outer container to layout elements from top to bottom I'm going to configure the header so that it has a light background color a fixed height of 60 pixels and it also expands to the full width of the screen all right so we've got something visible going but I think the header would look a little nicer if it was inset from the outer container and had slightly rounded Corners so to do that we can find our outer container and add some padding to inser its child elements then we can find our header bar and update the rectangle configuration to have rounded Corners it's looking pretty nice and as you you can see the header can adapt its width to the size of the window while the height remains constant let's get started on the lower content we want the lower content to take up all the remaining space apart from the header so we'll set the layout configuration to grow on both axes this is becoming quite a common configuration so I think I'll extract it out into a variable to save some boiler plate all clay element configurations are just structs underneath so you can reuse them as you wish and you can see that I can just replace the sizing in the layout with this new layout expand variable now inside the lower content we said we wanted a leftand sidebar and then a main content panel on the right hand side that would take up all the remaining space I'm going to configure the sidebar to have a fixed width of 250 pixels and to take up all the remaining vertical space and for the main content I can reuse that same expand configuration that I've been using elsewhere now I think it would look nice and consistent if these two other panels had the same visual look and feel as the header bar so what I'll do is I'll extract out that rectangle configuration into a variable just like I did with the expansion then it can not only be reused but if I ever want to update the visual look and feel of the background panels I can just update this struct in one place I'll paste in this same rectangle configuration on the sidebar and the main content and then we'll have a look look ghh that's not what I wanted at all but if you look closely you can see that there actually are three containers there they're just visually merging in together because they're the same color and there's no gap between them luckily that's an easy problem to fix inside the layout config there's a property called child gap which automatically creates a gap between child elements We'll add a gap to both the outer container and the lower content and then let's take another look ah much better you can see that we've got a nice consistent gap between our containers now and when we resize the window everything behaves as it should and the reason that there's that slight squashing and stretching of the UI as it's being resized is because rib actually doesn't support rendering and resizing at the same time not such a big deal but just something to be aware of now that we've got a nice skeleton structure in place let's continue on and fill it out with some content I'm going to start by adding some buttons to our top header bar because the buttons are going to have text inside them I need to do a little bit of setup to get text working in clay in order to compute our layout clay needs to know how large text is going to be when it's rendered on the screen with a certain font and font size the way that it gets that information is by calling a measure text function provided by the renderer because we're using the rib renderer we can pass a function pointer to the ray Li measure text function the next thing we need to do is to actually load a real font to use fonts in clay are identified by an integer so I'll start by creating a font ID for the font we're going to load I'm then going to load a font from the disk using rib and map the font to its ID in the rib renderer as you can see there's a little bit of boilerplate around setting up text but there's plenty of examples to look at in the repository now that we've got our text set up I'll move on to creating those header buttons because I know I'm going to to be creating a few buttons that are all very similar I'm going to create a function which declares a reusable component it's going to take the button text as an argument and create an outer clickable colored button with some internal text to make the button look nice I'll add some padding to the layout config and I'll set a background color using the rectangle config then inside the button container I'm going to use the clay text macro to create a text element I'm going to pass in the text argument from the outer function and use the text config macro to pass in text specific configuration like the font ID the font size and the text color now I can create as many buttons as I want for the header easily by just calling this function with different arguments I'll also just add a gap between the buttons I'll use the child alignment property to vertically Center the buttons inside the header container and finally I'll just add some padding on the left and right hand side all right let's see how it looks now this is really starting to look like an interface we've got some text and reusable components working well and I'm just going to show you a little trick say we wanted to split those buttons into two groups with file and edit on the left hand side in the other three buttons on the right hand side if we create an empty container between those buttons and we tell it to grow as wide as it can it's going to push the last three buttons all the way over to the right hand side of the screen and the best part is that container will adapt when the screen size changes the header bar is looking pretty good so let's get to work on the sidebar now we're going to make a vertical list of document titles that are clickable and will change the contents in the main body so we set the layout direction to top to bottom and this time we might render a list of dynamic data rather than something static like our header buttons let's assume that our documents are defined something like this each document has a title that will display in the sidebar and contents that will display in the main content view if the document is selected we'll make a type for an array of documents just so we can have nice balance checking and I'll just paste in an array of documents with some filler text that we can use as an example and because clay layout definitions are just C you can use any standard C programming and control flow so I'm just going to Loop through the documents in the array and render the titles as buttons and of course because we're using immediate mode any changes to the documents array will render to the screen immediately and as always I'm going to add some padding and child Gap to the sidebar component just so the buttons are nicely spaced apart from each other let's have a look awesome we've got our document titles rendering to the sidebar font size is a little small but we can get that fixed up finally we can render the contents of the selected document in the main viewport first I'll create a VAR aable to keep track of which document is actually selected and then inside the main content I can get the selected document from the array and render the text I think I'll render the title first at the top and then the contents below I'm also just going to pull out the color code for white so that I can reuse it instead of having to type out that long number every time so we've got our document title rendering first and I'm just going to copy paste this block to render out the contents underneath finally as usual we just need a little bit of padding and gap between the elements and then we'll be able to see how this looks well our title and contents are rendering correctly so that's good but you can see at the bottom here that the contents are so long that they're actually spilling out over the edge of the container and off the edge of the interface to fix this we're going to configure the main content to be a scroll container this allows content to scroll in the direction that you choose and any content that falls outside of the boundaries of the scroll element will be hidden so you can see that now instead of overflowing out of the main content container the text is now nicely masked off at the edges but there's one problem I'm using my scroll wheel right now and the content's not actually scrolling this is very similar to the window resizing bug we had earlier clay doesn't actually know that you're using the scroll wheel unless you tell it so to get scrolling working in clay there's a few small things we need to do firstly we'll get the current Mouse position and scroll wheel state from rib and then we're going to call the clay function set pointer state to tell clay where the mouse position is on the screen we need to do this because we only want to scroll the container that the mouse is currently hovering over and while we're here we're also going to tell clay when the left Mouse button is being clicked for interactions next we're going to tell clay when scrolling is occurring by calling the update scroll containers function the first argument is whether we want to enable touch scrolling and then we pass the mouse wheel delter as a vector and finally the Delta time which if you're not a Game Dev is the time that has passed since the last frame so that clay can do nice smooth momentum scrolling all right we've got nice smooth scrolling working so we can see our entire document contents and as a final touch we're going to add a little bit of interactivity to our app firstly we want to be able to select a document by clicking on it in the sidebar we already have a variable that controls which document is rendering in the main viewport so we just need to wire up some inter active changes to that variable to do that we're going to use Clay's onhover function on each of our sidebar buttons to build some mouse interaction Behavior onhover allows us to pass a function pointer which will be called every frame that the mouse is inside the element's bounding box as for the actual callback function clay will pass some useful data like the element ID and the current Mouse State along with some user data that we can specify when we call on Hover which in this case is going to be the index of the document we want to select we can check the state of the pointer data to determine if a mouse click has occurred this Frame and if so we can update the selected document index to select whichever document was clicked always remember your array balance checks in see folks it really is worth doing now that we're done implementing our callback function we can pass the function pointer to onhover along with the document index let's see if we got this right there you go we have click interactivity you can select different documents by clicking on them on the left hand sidebar and seeing the main content update but it does feel like it's missing something there's nothing to tell us which document is selected at the moment also it would be nice to have a bit of visual feedback when we're hovering over clickable items too we can just put a simple if statement into our for Loop to check if the current index is the selected document index and render something different in that case what I'll do is I'll give this selected document a permanent background and disable the click interactions and for the other documents I'll use the clay hovered function to conditionally color them when they're hovered over clay hovered just returns a Boolean so it's very simple to use to do conditional styling I'll just reduce that background Alpha a little bit on the hover elements and then we should be good to go this is much better we've got a nice Snappy visual indication of the hover and selection state of the items in the sidebar although I'm not that much of a fan of how it looks visually I think I want to expand it out to the full width of the sidebar and give it some rounded corners of course expanding them to the width is super easy to do we just set the sizing mode to grow on the width and I feel like I've repeated myself a bit too much with these two different buttons so I'm just going to extract out that layout configuration into a variable so I can reuse it finally I'll just give that background rectangle from the selected and hover State some rounded Corners to look a bit nicer and then we can take a look this is starting to look like a real application we'll just do one more small piece of interactivity before we finish up I'd like to create a drop- down menu that appears when you hover over the file menu I'm going to start by pulling out the contents of my reusable header button component so that I can make something custom for the file button I'll also add an ID to the file button so that we can check its Mouse overstate later now that I've got that set up let's actually create the dropdown in order to make the drop down float over the top of other content without affecting the layout we can use the floating configuration floating elements won't cause their parents to expand or affect sibling elements we'll give the menu a nice darker background color we'll tell it to lay out its items from top to bottom and we'll give it a minimum width of say 200 pixels and now just like we did for the header buttons I'll create a function to declare a reusable component for the drop- down menu items we can then use that function to create three menu items for our dropdown new open and close and now you can see our drop- down menu in action the first problem here is that it's covering up the file button in the header this is because by default floating elements in clay attached to the top left corner of their parent we can fix this up by telling clay to attach the top left corner of the floating element to the bottom left corner of its parent that's much better positioning now we can start on our interactivity we want the dropdown menu to be visible both when we're hovering over the file Button as well as hovering over the drop-down menu itself clay has an imperative API pointer over that you can query using the ID of an element to tell you whether the mouse pointer is currently within the bounding box of that element or not we already added an ID both to the file button and the file menu so we can just use them both here and because this is immediate mode we can just check the Boolean in an if statement and then conditionally render the drop down if the file menu is supposed to be visible or not check it out it works exactly how we wanted it to appears when we Mouse over the file button and stays open while the mouse is within the boundaries of the drop- down menu I'll just make some tiny changes to make it a little bit more visually appealing and then I think we're done rather than the drop down being snapped right up against the button I want it offset slightly downwards so I'm going to use the offset property in the floating configuration I'm also going to give it some some rounded Corners to just make it more consistent with the rest of the UI I think that's looking really good and it's a great place to finish up hopefully this gives you a window into why I wrote clay in the first place and whether you would find it useful to use in one of your projects we have a community Discord if you need to ask questions or if you just want to chat and please feel free to open issues or pull requests on the GitHub repository if you have bugs or contributions oh and one more thing clay actually has built in debug tools similar to Google Chrome's inspector that you can use to browse your UI hierarchy and figure out what's going on you can enable these using the set debug tools enabled function and they work by injecting extra draw commands into your command list so there's no extra setup or dependencies required have fun
