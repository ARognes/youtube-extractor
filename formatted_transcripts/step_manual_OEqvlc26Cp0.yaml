transcript: '{"content":"\n[0.56s] If you''ve lived long enough, you''ll\n[2.56s] eventually face a sobering diagnosis, a\n[5.6s] chronic pain condition, or some other\n[9.36s] evidence that old age is going to catch\n[12.16s] up to you or is catching up to you. The\n[14.799s] Buddha was very clear. Having a body\n[17.039s] living in samsara means being subject to\n[20.24s] illness and to decay.\n[23.039s] But when this happens, we often feel\n[25.359s] betrayed by our own bodies. We we panic.\n[28.24s] We despair asking why me? Why now?\n[33.12s] Today we''ll look at the Buddha''s\n[34.559s] specific advice for those facing\n[37.28s] illness, old age, and the grief that\n[39.76s] arises from them. We''ll begin to learn\n[42.96s] how to separate physical pain from\n[45.28s] mental suffering, and how to keep the\n[48.079s] mind healthy even while the body breaks\n[51.6s] down due to age and illness.\n[56.48s] But before we dive in, we need to make\n[58.64s] one critical distinction.\n[61.199s] The Buddha was a spiritual teacher, not\n[63.84s] a medical doctor or a psychiatrist.\n[66.88s] In one of his famous early sutas, the\n[69.84s] Buddha taught the parable of the two\n[72.0s] arrows.\n[73.6s] The thing to keep in mind about this\n[75.439s] parable is that the first arrow, the\n[79.119s] arrow of physical pain or we might say\n[81.6s] biological illness and aging\n[84.479s] is unavoidable.\n[86.64s] It cannot simply be meditated away.\n[90.4s] We can''t cure a broken leg by sitting on\n[93.6s] the cushion.\n[95.84s] Neither is that going to help with a\n[97.52s] chemical imbalance in the brain, nor a\n[100.56s] cancerous tumor.\n[102.799s] So dealing with that first arrow\n[105.2s] requires competent medical advice. It\n[108.88s] requires medicine or therapy or\n[111.68s] professional help.\n[113.84s] Seeking help in these situations\n[115.759s] constitutes right effort.\n[119.04s] So please don''t use the dharma as an\n[121.36s] excuse to avoid medical or psychological\n[124.719s] treatment when it''s necessary.\n[127.439s] If you''re struggling with something like\n[129.679s] clinical depression or severe trauma or\n[132.64s] some other serious mental or physical\n[134.959s] roadblock, meditation alone is often not\n[138.319s] enough. It can sometimes even be\n[141.44s] counterproductive without competent\n[144.08s] intervention. So, you should rely on the\n[146.319s] experts. I did a video a while back on\n[148.64s] some dangers that are involved in in\n[151.12s] meditation at some places and points,\n[153.2s] and I''ll leave a link to that video down\n[154.8s] below in the notes.\n[158.959s] So with that out of the way, where does\n[160.879s] dharma practice come in? It comes in\n[163.84s] with that second arrow.\n[167.04s] As we say, the first arrow of physical\n[169.2s] pain, of organic imbalances, of illness,\n[172.16s] of aging is unavoidable.\n[175.36s] However, what is avoidable is that\n[177.599s] second arrow of mental reactivity.\n[181.2s] This is the chatter inside of our heads\n[183.44s] telling us why me? Why now? This is so\n[187.04s] unfair. I can''t stand this anymore. When\n[189.76s] will it ever end?\n[192.319s] That is the second era which is\n[194.8s] basically entirely self-inflicted. We\n[197.44s] inflict it on ourselves.\n[200.319s] As the Buddhist says, we inflict\n[202.64s] ourselves with this additional pain\n[204.879s] because we are attached to rebirth, old\n[207.92s] age, and death, to sorrow, lamentation,\n[211.28s] pain, sadness, and distress.\n[214.4s] we or in the Buddhist case he says they\n[216.959s] they are attached to suffering I say\n[221.92s] that is we frame suffering as ours as\n[225.599s] our suffering and as such it creeps into\n[229.04s] our sense of our own identity clashing\n[231.92s] with it infecting it and we struggle to\n[235.519s] deal with this cognitively\n[239.04s] as I say the goal of our practice should\n[241.68s] not be seen as dealing with the pain of\n[243.76s] the first arrow. If that sort of pain\n[246.48s] can be dealt with, it''ll be dealt with\n[248.64s] by doctors and medicines and so on.\n[251.519s] Instead, the goal of practice is to\n[253.36s] remove the second arrow, which is the\n[255.76s] mental suffering caused by that first\n[259.199s] arrow.\n[261.359s] The second arrow is [snorts] highlighted\n[263.36s] by that troubled and obsessive\n[265.84s] rumination known in Buddhism as papancha\n[269.12s] or mental proliferation.\n[272.08s] Now, how might we practice to remove\n[274.96s] that second arrow? To a great extent,\n[278.4s] that''s the point of all of Buddhist\n[280.16s] practice. It''s a it''s a vast field. But\n[283.68s] to let''s touch briefly on three possible\n[287.04s] avenues we might consider for today.\n[293.36s] One early suta tells of the lay person\n[296.08s] Nakula''s father who goes up to the\n[298.56s] Buddha and says, \"Sir, I''m an old man,\n[302.08s] elderly and senior. I''m advanced in\n[305.28s] years and have reached the final stage\n[307.199s] of life. My body is ailing and I''m\n[310.479s] constantly unwell.\"\n[313.28s] He asks the Buddha for advice on what to\n[315.6s] do. The Buddha begins, and this is very\n[318.8s] interesting, by affirming the man''s\n[321.039s] condition. Buddha says, \"That''s so true,\n[325.039s] householder. That''s so true,\n[326.96s] householder. For this body is ailing,\n[330.24s] swaddled in its shell. If anyone\n[333.68s] dragging around this body claimed to be\n[336.479s] healthy even for an hour, what is that\n[339.199s] but foolishness?\"\n[341.919s] That is to say, what the what the Buddha\n[343.52s] is saying here is that we''re never truly\n[346.0s] and completely healthy. We''re always\n[348.96s] dealing with some issue somewhere.\n[352.639s] Therefore, it follows we should not and\n[355.759s] never, I should say, expect practice to\n[358.56s] lead to perfect health. Even the Buddha\n[361.44s] himself had backachches. I''ll leave a\n[364.479s] video about the Buddha''s pains down\n[366.16s] below in the notes.\n[368.96s] In any event, the Buddha urges Nakula''s\n[371.199s] father, \"You should train like this.\n[374.96s] Though my body is ailing, my mind will\n[377.84s] be healthy.\n[380.24s] Well, now excellent. You''re going to\n[381.68s] say, but that''s easier said than done.\n[384.479s] What does the Buddha mean by suggesting\n[386.8s] we should practice in this way?\n[389.68s] As the as the suta continues, Nakola''s\n[392.88s] father goes to the Buddha''s chief\n[394.72s] disciple, Sar Puta, and Saruta\n[398.16s] elaborates on the Buddha''s point.\n[401.36s] What is it to train such that one''s body\n[403.919s] is ailing but one''s mind remains\n[406.96s] healthy?\n[409.36s] Sarah says that that means to give up\n[413.039s] identifying with our body, with our\n[415.6s] feelings, with our perceptions, with our\n[418.479s] actions, and with our consciousness.\n[422.0s] So that when all of these various\n[424.8s] factors inevitably decay or become ill\n[429.28s] or age or eventually perish, we''re not\n[432.56s] going to be perturbed by it.\n[437.68s] When we undergo pain, it often feels\n[439.84s] like it''s never going to end. It feels\n[442.56s] solid and enduring like a like a block\n[445.039s] of concrete.\n[447.199s] But if you''re willing to look closely,\n[450.319s] mindfully,\n[452.16s] pains are always actually subtling,\n[455.12s] subtly shifting, shifting rivers of\n[457.919s] sensations.\n[459.84s] Pain moves, it throbs, it burns. It\n[463.52s] stabs, it fades in and out. It''s\n[466.479s] actually impermanent like all things.\n[470.639s] If we can come to see pain as a kind of\n[473.52s] flowing process\n[476.08s] rather than as an unmoving and\n[478.16s] unchanging block of concrete,\n[480.96s] it can become slightly more bearable. We\n[484.24s] can begin to take each moment of\n[486.24s] sensation separately.\n[491.599s] When it comes to the pain of losing\n[493.84s] somebody else, someone outside of\n[496.0s] ourselves, our grief can be particularly\n[499.36s] acute.\n[501.039s] Buddhist commentaries mention the story\n[503.36s] of Kisotami\n[505.44s] who had said lost her mind when her only\n[508.56s] son passed away.\n[511.199s] She wandered around carrying his body\n[513.919s] looking for somebody to be able to cure\n[516.32s] him and bring him back to life.\n[518.959s] It''s said that when she came to the\n[520.959s] Buddha, he told her that he could make\n[523.919s] her a medicine for her son, but it would\n[527.36s] require a mustard seed from a family\n[530.72s] that had never before experienced death.\n[533.831s] [snorts]\n[535.44s] So, Kisagoti went around the town\n[538.399s] looking for just such a family. But\n[541.68s] everywhere she turned, she found only\n[544.48s] families who knew death.\n[548.16s] It''s said that the insight into the\n[551.04s] universality of death cured Kisagottomy\n[554.8s] of her madness, whereupon she could\n[557.68s] finally let go of her son.\n[561.279s] The lesson here is that grief can become\n[564.72s] unbearable when we overpersonalize it.\n[568.8s] That is why did this have to happen to\n[570.8s] me? Why did this have to happen to my\n[573.36s] child?\n[575.04s] The Buddha helps us to see that actually\n[578.399s] impermanence, pain, loss, old age, death\n[583.44s] are universal laws of nature.\n[586.72s] Now, knowing all of this may not\n[589.12s] completely alleviate our sadness, but at\n[592.16s] least we may begin to become aware that\n[594.8s] we''re not alone. We''re in good company.\n[601.279s] Now to be fair, none of these strategies\n[603.92s] is going to be a kind of magic bullet\n[605.92s] that cures us instantly of our\n[608.24s] suffering.\n[609.839s] But with steady, steady and dedicated\n[612.399s] practice, these kinds of things can\n[615.04s] help.\n[616.56s] Meanwhile, when you''re sick and\n[618.0s] grieving, be kind to yourself. Don''t use\n[621.04s] the dharma as an excuse to beat 