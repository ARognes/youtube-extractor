transcript: '{"content":"\n[0.32s] In a video I made quite a while ago, I\n[2.639s] talked about how the Buddha recommended\n[5.44s] kindness, that is meta or loving\n[7.44s] kindness, as a protection against fear.\n[11.519s] Specifically, the fear of external\n[13.759s] things like snakes and stuff that goes\n[16.16s] bump in the night. But for many of us\n[19.52s] living in the modern world, the most\n[21.76s] dangerous snake is not in the grass.\n[25.76s] It''s in our own heads. It''s our inner\n[28.48s] critic. the constant nagging voice of\n[31.84s] anxiety that tells us you didn''t do that\n[35.28s] right or you''re awkward, you''re not\n[37.76s] productive enough, you''re not the right\n[39.76s] person for this job.\n[42.16s] Today, we''re going to look at how early\n[43.84s] Buddhist psychology helps us to diagnose\n[46.719s] this inner critic, not so much as\n[49.84s] telling us to have higher standards or\n[52.879s] have better motivation, but instead as a\n[55.92s] specific form of suffering called\n[57.92s] aversion.\n[60.079s] We''re also going to see how the practice\n[62.0s] of kindness can help us to dial down the\n[65.519s] volume on this inner critic.\n[70.56s] Anxiety comes in many flavors, including\n[74.0s] anxiety about external things like the\n[77.119s] politics or society that surrounds us.\n[80.64s] Today, however, we''re going to look at\n[82.32s] one specific kind of anxiety. That is\n[85.04s] the anxiety that reflects inwards back\n[87.6s] on ourselves.\n[89.759s] This is our inner critic. We tend to\n[93.28s] think of this inner critic as trying to\n[96.0s] make us better people, more productive\n[99.2s] people, wealthier people, more famous,\n[101.759s] and so on.\n[103.759s] But in Buddhist terms, this voice is\n[106.479s] simply a manifestation of ill will\n[109.36s] directed inwards.\n[112.24s] Here''s the mechanism. When we make a\n[114.799s] mistake, two things happen.\n[118.479s] First, there''s the mistake itself. Let''s\n[121.6s] say we''re making a presentation to a\n[124.24s] group of people and we lose our place.\n[127.84s] Then second, there''s the reaction we\n[130.56s] have to our mistake. We attack\n[132.959s] ourselves. How could I be so stupid?\n[136.72s] The Buddha famously described this\n[138.959s] syndrome in his suta on the two arrows.\n[143.68s] That is, we all experience pain. We all\n[148.08s] make mistakes of one kind or another\n[150.48s] from time to time. Even the Buddha made\n[153.76s] mistakes. I have a video on that I''ll\n[155.519s] leave down below in the notes.\n[158.239s] Undoubtedly, when we fall short to some\n[161.04s] degree, it''s not going to be pleasant\n[162.72s] for us. This is like being shot with\n[165.76s] that first arrow. It''s a pain we all\n[168.879s] have to suffer from from time to time.\n[173.12s] But by adding self- flagagillation to\n[175.92s] this, ramping up our mental anguish,\n[179.36s] it''s like being shot with a second\n[181.36s] arrow. And that second arrow is our\n[184.8s] inner critic, a kind of mental\n[187.92s] proliferation\n[189.599s] or papuncha in Buddhist terms that we\n[192.08s] inflict upon ourselves.\n[195.44s] And because our minds perceive it as a\n[198.319s] kind of attack, our body responds with\n[202.08s] feelings of anxiety,\n[204.48s] tension in the muscles. We can become\n[208.0s] chronically anxious when we''re living\n[210.08s] with this bully who''s always sitting\n[212.799s] there within us calling us names.\n[218.4s] In the modern world, we often struggle\n[220.56s] with selfhatred or this inner critic. It\n[224.959s] may be something relatively new and\n[226.879s] unusual in the world. That is when the\n[229.36s] Dalai Lama first heard about this idea\n[232.56s] of self-hatred that some people had, he\n[235.519s] was genuinely confused by it. I have a a\n[238.159s] video about this as well. I''ll leave\n[239.76s] down below in the notes.\n[242.4s] In fact, commentators, later\n[245.2s] commentaries I should say, like\n[246.799s] Buddhagosa''s fifth century Vudi Maga\n[251.28s] suggests that we start our kindness\n[253.519s] practice with ourselves.\n[256.639s] And here''s the fascinating point. Buddha\n[259.44s] who wrote this commentary suggests that\n[262.079s] we do this because he thought that\n[265.199s] loving ourselves was the easiest thing\n[267.6s] to do. He assumes self-love, self-care,\n[271.919s] self-kindness as the default.\n[275.919s] But for many of us nowadays, starting\n[278.479s] with ourselves as being kind is not the\n[281.36s] easiest step. It may even be the\n[283.6s] hardest. Our inner critic has turned our\n[288.24s] natural self-regard into a kind of angry\n[293.04s] self-judgment.\n[295.6s] To compat to combat this problem, modern\n[298.96s] self-help diagnoses often talk about\n[302.56s] ramping up our self-esteem.\n[305.919s] But from a Buddhist perspective,\n[308.16s] self-esteem can become a kind of trap\n[311.68s] because it''s often based on kinds of\n[314.4s] conceit. That is measuring ourselves as\n[318.08s] good or as successful\n[320.479s] through comparisons with other people\n[322.639s] around us.\n[325.68s] Kindness or meta on the other hand\n[328.32s] directed towards ourselves is the\n[331.039s] Buddhist alternative to this kind of\n[333.759s] self-esteem.\n[335.84s] And kindness is not a matter of thinking\n[338.72s] that we''re great people. Instead, it''s\n[341.84s] all about treating ourselves with\n[343.919s] friendliness and care, no matter how we\n[347.12s] are, regardless of whether we''re great\n[349.84s] or not.\n[351.6s] So the upshot here is that we need to\n[354.24s] practice kindness towards ourselves not\n[357.44s] because it''s some kind of easy warm-up\n[360.8s] to the harder practices as Buddhagosa\n[363.44s] may have thought but instead because\n[366.479s] it''s for us the essential missing\n[369.28s] foundation.\n[371.44s] We practice self-kindness to help heal\n[375.6s] the specific wound of our inner critic.\n[380.88s] Step one in our PRA practice is simple\n[383.52s] recognition. That is mindfulness.\n[386.96s] We can''t deal with any of this situation\n[389.6s] skillfully if we don''t know that it\n[392.4s] actually exists. If we don''t know it''s\n[394.319s] there. So when this kind of\n[397.039s] self-destructive anxiety arises in us,\n[400.56s] we can for example label it saying to\n[404.24s] ourselves ill will is arising or\n[406.96s] something like that.\n[408.72s] Now we don''t do this labeling in order\n[411.199s] to start fighting this critic. We don''t\n[413.84s] want to label it and then start getting\n[416.0s] angry at ourselves. We do it simply to\n[418.96s] recognize ah this is that second arrow\n[422.0s] again. This is aversion.\n[425.759s] And then step two in our practice is to\n[428.72s] reframe it.\n[430.96s] The Buddha often used aversion of the\n[433.599s] golden rule. that is don''t do to unto\n[436.639s] others what you wouldn''t want done unto\n[439.199s] you. Again, I have a video on that I''ll\n[441.52s] leave down below.\n[443.68s] For our practice today, however, we need\n[446.16s] to flip this around.\n[448.4s] Don''t do unto yourself what you wouldn''t\n[451.12s] do to a good friend or to a a beloved\n[454.639s] pet of yours. For example,\n[457.36s] if your friend made a mistake, would you\n[459.68s] scream at them? Uh, no. You''d offer\n[461.599s] support.\n[463.28s] You''d help if your pet got itself into a\n[465.759s] jam.\n[467.68s] Kindness or meta is simply speaking to\n[471.039s] yourself with a sane tone that you would\n[473.68s] use for a good friend.\n[477.039s] And step three in our practice involves\n[480.16s] active cultivation.\n[482.56s] We aim to replace that critic''s script\n[485.84s] with a new and better one. Now, this is\n[489.199s] not meant to be a simple affirmation.\n[492.16s] Instead, we should think of it as\n[494.4s] cultivating an intention.\n[496.96s] When we feel that anxiety of not being\n[499.919s] good enough, we can, for example, offer\n[503.44s] ourselves a phrase like, \"May I be safe\n[506.479s] from inner harm?\" or \"May I be at ease\n[509.84s] with my imperfections.\"\n[512.719s] We''re working to cultivate a place of\n[515.36s] safety and security within our own\n[517.919s] minds.\n[520.959s] Now, one common objection to this uh to\n[523.519s] this practice\n[525.44s] is to worry that if we stop criticizing\n[528.08s] ourselves, we may become slothful and\n[530.959s] lazy and stunt our own advancement.\n[535.839s] But there''s a big difference between\n[537.76s] making right effort and spinning up the\n[541.279s] stories, the mental proliferation, the\n[544.16s] hindrances of energy directed against\n[546.56s] ourselves, the anxiety. Again, a video\n[548.72s] I''ve done a video on this topic. I''ll\n[550.64s] leave it again down below in a link.\n[554.56s] In fact, folks who are kind to\n[557.2s] themselves are actually likely to be\n[559.6s] more resilient and productive because\n[562.08s] they''re better grounded and not\n[564.48s] paralyzed by fears of failure.\n[567.92s] So, we can at least contemplate dropping\n[571.519s] that heavy backpack of anxiety and walk\n[575.04s] ahead more lightly.\n[578.72s] Anxiety directed at ourselves often\n[581.6s] comes from the feeling that we''re unsafe\n[584.08s] and under threat. And so we''ve got to\n[587.279s] make ourselves perfect as quickly as we\n[589.68s] can.\n[591.68s] And if that''s the case, the first step\n[594.08s] here is going to be to realize that that\n[596.399s] call, that worry is coming from inside\n[599.839s] our own house. That is our threat such\n[603.68s] as it is comes from our own inner\n[606.56s] judgments.\n[608.08s] By practicing kindness towards\n[610.24s] ourselves, we''re not going to try to\n[613.04s] cultivate narcissism.\n[615.36s] Instead, we''re simply agreeing to stop\n[618.24s] sticking ourselves with that second\n[620.56s] arrow. Pull it out. Put it aside.\n[624.959s] Now, this tendency to judge ourselves\n[627.839s] often comes from a misunderstanding of\n[630.88s] who we really are. If you want to dig\n[634.079s] into the root of this self that we''re\n[636.56s] criticizing, I''ll link my playlist on\n[639.6s] self and non-self on the screen in a\n[641.92s] moment.\n[643.6s] Meanwhile, for the next week, consider\n[646.88s] trying out that best friend test that I\n[649.44s] mentioned. Try to see if you can catch\n[652.32s] that inner critic of yours when it\n[654.16s] starts to chatter and rephrase its\n[656.8s] comments as if you were talking to your\n[659.68s] best friend or perhaps a pet of yours.\n[662.88s] Let us know how that works below.\n[666.8s] If this dive into our anxieties has been\n[670.0s] helpful to you, a like and subscribe are\n[672.56s] always appreciated. Thanks so much for\n[675.12s] your continued practice and please all\n[677.12s] of you be"}'
