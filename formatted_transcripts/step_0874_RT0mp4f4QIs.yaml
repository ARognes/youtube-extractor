transcript: I'm working on building this digital breadboard clock and in my first video I showed how we can use an AC to AC adapter to build a DC power supply and use that to power a comparator that extracts a 60 hertz square wave from the utility company's AC sine wave. And I'm going to use that to keep time for the clock because the utility company provides a surprisingly accurate 60 hertz sine wave and as I talked about in my last video the comparator is generating the square wave based on this threshold voltage and whether the sine wave goes above or below that threshold and then we're nudging that threshold up or down at each crossing to avoid any double counting. I talked about all that in my last video. But that means the actual shape of the square wave is going to depend on how big the sine wave is relative to that threshold. And so if I change the amplitude of the sine wave coming in you can see the shape of the resulting square wave here it changes. Now does this duty cycle really matter for the clock application that we're building here? You know not really. The most important thing is that it's 60 hertz not that it has a particular duty cycle. But I thought it would be interesting to see what it takes to normalize this square wave to to truly be a square wave and not just a rectangle. Particularly because I think we can do it without too many more components than what we have already have. Now one way you might think we can get a square wave is just to tune the threshold and we can certainly do that. Now so here's our circuit. We've got one input here is this sort of lumpy looking sine wave. The other input to the comparator is our threshold that's set primarily by these two resistors and then the output is going to be either high or low depending on whether that sine wave is above or below that threshold. Right now we're getting about a a 45% duty cycle. But we can adjust these resistors to change where that threshold is. So if I bump this from 47k up to say 200k that's going to give me a a lower duty cycle. So you can see now our duty cycle is like 29%. Um I can go the opposite direction make this a 20k and that duty cycle will then go up in this case to 56% or so. And so you might think well let's just tune this threshold to get it, you know, as close to 50% as as we can. And you know, 30k gets us about there. Um, 30k is not really a standard resistor value, but uh, none of this matters because as soon as our voltage changes, let's say our voltage goes up to 15 volts, that duty cycle is going to drop again. So now the duty cycle is 44%. And we can't really count on that input voltage being exact. You know, if we look at one of these wall transformers, it'll say 120 volts AC in, 12 volts AC out. But if I measure what's coming out, it's closer to 15 volts AC. And the mains voltage isn't going to be exactly 120 volts either. And of course, if you're in a country that uses 240 volts, you definitely don't want to use a 120 volt transformer. And so the option I found for my kits is this 240 volt transformer that claims to have a 9 volt AC output. But if I actually plug it into a 240 volt source, it seems to output closer to 12 volts, not the 9 volts it claims. And since these AC to AC adapters uh, are already hard to find nowadays, I want this design to work across a wide range of of voltages. That said, the more important part is that the output is 60 hertz, not so much the duty cycle. But let's see what it would take to make the output of this more predictable. And to do that, I want to basically ignore the shape of the square wave coming out here because the only thing I really care about is the frequency. So, I'm going to get rid of this. And what I'm going to do is first turn it into a series of pulses. So I can use a capacitor and then pull this high with a resistor. And now if I look at this, let me stop it right there because right here the comparator turns on and the capacitor charges right up. And then the capacitor will slowly discharge through the resistor. And then every time the comparator turns off, so it just turned off, the capacitor discharges. And now it's going to slowly charge through the resistor this way. And right now this isn't happening as fast as I'd like. So maybe you make this capacitor smaller. If I go with a 0.1 microfarad, and maybe that's a little too fast. So, we've been using these like 4.7k. So, let me do 4.7k. That's a little bit more like it. So, now this is normally sitting around 5 V. You can see kind of sits at 5 V through here. And so, with a comparator off like this, the capacitor now is charged to 5 V. But then when the comparator turns on, you can see this jumps up. We now have 5 V coming out of the comparator, plus the capacitor is charged to 5 V. So, this output here spikes up to, you know, 10 V or this is showing 7.5 or so. You know, in theory it does spike to 10 V, but you know, it immediately starts discharging. You can see this discharge here. It immediately starts discharging through this resistor back to 5 V. Oops. So, it spikes, and then it immediately starts discharging to 5 V. So, now we have 5 V on both sides. The capacitor is actually completely discharged at this point. So, now when the comparator turns off, you're going to have 0 V here now in series with a capacitor that that was discharged. Um so, you have end up with 0 V. So, you can see it drops to 0 V. And then very quickly, the capacitor starts charging through this resistor. And so, what we've got here is a basic edge detector. You know, we're detecting the positive-going edge of the square wave, and creating a spike from 5 V to, in theory, 10 V briefly. And then we're detecting a falling edge of the square wave, and creating a spike that's going from 5 V down to 0 V briefly. But I'm only interested in one of these sets of spikes because I want to generate a consistent pulse at 60 times a second. Now, the obvious choice here is to get rid of these 10 V spikes because I'd rather keep all my logic signals in the 0 to 5 V range. So, if we could just get rid of these 10 V spikes, that would be perfect. And like I said, these 10 V spikes happen because the capacitor is already charged to 5 V at this point. Kind of in that state now, right? We've got 0-V on this side, we've got 5-V on this side, so the capacitor charges. You can see the unequal potential on both plates there that's visualized here. And then when the comparator comes on, gives us 5-V plus the 5-V of the capacitor to get us 10-V at least until the capacitor discharges. So, the faster the capacitor discharges, the shorter that spike. If I make this resistor smaller to discharge the capacitor faster, you know, it looks better, but I think the simulator just isn't catching that spike. And to completely eliminate the spike, we'd have to remove this resistor entirely and just replace it with a wire. But of course, now there's no negative-going spike either since the resistor's used to charge the capacitor as well as to discharge it. So, this hasn't really gotten us anywhere. But what we can do is put this back back to 4.7 k. If we put a diode in here to 5-V, we can use the diode to discharge the capacitor instantly. But unlike a wire, the diode's going to block current in the opposite direction, so the capacitor won't be able to charge through the diode. So, the capacitor will discharge instantly through the diode, but it'll charge more slowly through the resistor. And so, that gives us this downward-going pulse, but we don't have the same positive pulse. And we do have this little bump here because the diode is always going to have about a 0.6-V drop across it. So, you know, really the capacitor can discharge to about 0.6-V instantly through the diode, but then it'll have to discharge the rest of the way through the resistor. But that's fine, that's not going to be a big deal. But now that we have this pulse, we can add another comparator just like we did here to turn this pulse into a a nice clean digital logic pulse. So, I'll copy this comparator, and the pulse will go into the plus input. And then the minus input, I'll just set up using a voltage divider uh like I did before. And I'll use 47 k resistors like we've been using. And then this output is open collector, so we need to tie it high. And now I can add this to our scope. And now we have a nice clean digital logic pulse there. And unlike before, this no longer depends on our input voltage. I can go to 18 volts, nothing changes. I can go to 9 volts, nothing changes. But it's still not the square wave we're after. We just have these these pulses. So now I'm going to use this pulse to discharge a capacitor. So if I add a capacitor here, and we'll just make this 1 microfarad, and connect that to ground, what you'll see is that the capacitor is charging through the resistor, and then whenever the comparator or whenever that pulse comes, that comparator pulls it low, and it discharges the capacitor. And because that pulse is very brief, the capacitor just immediately starts charging again. And you know, this all works because the LM339 comparator that we're using can pull its output hard low, discharging the capacitor, but the open collector output means it doesn't pull it high, it just releases the output, it just releases that low output I should say, and relies on the resistor to to pull it high. But how quickly it can pull it high depends on the time constant of this resistor and capacitor. And the time constant is just the resistance in ohms times the capacitance in farads. So we've got a 1 microfarad capacitor, which is 1 * 10 ^ -6 * a 1k resistor, do 1,000. So that gives us a 1 millisecond time constant, which would make sense if we had a 1,000 hertz signal. But for 60 hertz, you know, we need a time constant closer to 16 or 17 milliseconds. But actually I want to target about half that time because I'm going to use this RC timer to time the end of the the final pulse. So I'm looking for divide that by two, about 8.3 milliseconds. And what I came up with for that is a 0.1 microfarad capacitor times a 100 K resistor, which gives a 10-millisecond time constant. That's close enough to 8.3, and 100 K and 0.1 microfarads are nice common values. So, if I set this resistor to 100 K, and this capacitor was 0.1 microfarads, and now this looks like a nice even ramp. And again, you know, this curve isn't affected by our input voltage as long as it's reasonably sane. You know, right now we're at 9 volts. If I go to 12 volts, this output doesn't change at all. I can go to, you know, 20 volts if I want. Still no change. So, a nice consistent shape here. And so, now you guessed it, I'm going to add another comparator to compare this nice clean ramp that we've got to a threshold to get our final stable square wave. So, I'll copy the comparator. And I realize this seems like a lot, but you know, the LM339 chip that we're using has four comparators on it. So, why not, you know? And so, I'll add the divider network again to set that reference voltage. And I'll use 47 K resistors for that again. And then the output needs to be pulled high by a resistor. And I'll make that a 4.7 K resistor like we've been doing for these pull-ups. And then just like in the last video, we want a hysteresis feedback resistor here just to make sure we don't get any extra pulses. And so, now if we look at this output here, we see a nice even square wave looking thing that's based on that ramp voltage. And then we can also look at the comparator voltage here if we want and see where it's switching. But now none of this is affected by the input voltage. So, if we we've got 20 volts here, if we change this to 9 volts input, none of this changes. It's the same square wave. You know, and the truth is that the exact duty cycle really doesn't matter for this application. You know, it's a clock, so as long as we can count pulses, it doesn't really matter how wide each pulse is. I just thought it'd be interesting to see how we could control that. But that's not to say that this additional circuitry is worthless. There's actually a subtle benefit that's very useful for our application. You know, in the last video I talked about the importance of this feedback resistor here in uh preventing extra pulses from getting through if the AC sine wave from the utility company was noisy. And so you're thinking, okay, yeah, we took care of that problem. It shouldn't have any extra pulses here. So, do we really need all this other stuff? You know, what is it really doing for us? And my answer is maybe maybe we do need it. You know, yes, the circuit from the last video is going to do a good job of handling noise on the AC line with this hysteresis feedback resistor, but you know, I really can't emphasize how important it is to get this right. You know, even if some noise occasionally slips through, say, 0.01%, you know, one in 10,000 times, you know, there's 10,000 minutes in a week, so the clock would lose a minute a week. And that's completely unacceptable for this application. So, if there's any noise here, you know, hopefully this hysteresis neutralizes it, but if a double pulse did sneak through, the rest of the circuit actually does a lot to help us. So, here's a copy of that same circuit where I've added some noise. Um so, I've got the 12-V AC signal here and it's in line with this 2-V of noise, and you can see the signal here is, you know, looks pretty noisy. If we look at the output, though, it's still nice and clean. Unless I get rid of this hysteresis resistor. If I get rid of the hysteresis resistor, now you start to see if we especially if we zoom in a little bit here, you'll start to see some uh some issues. So, here we go. This should be a nice clean transition, but we actually have a couple different transitions here, and so this is going to get counted multiple times and throw off the timing of our clock. But if I put that hysteresis resistor back in, that cleans it up nicely. And that's of course what we saw in the last video, uh which is great. But let me up the noise. Let's go from 2 V to uh 5 V. So, we've got a lot of noise in our signal here. You can see the the signal's gotten a lot noisier, and it's still pretty good. If we look at that output, it looks pretty clean. There's a few things as it ramps up. But if we let this run, yes, here we go. Something like this. So, even with this hysteresis resistor in here, we got enough noise that we got some extra pulses here. And we just never want that. That's just not acceptable. Um cuz then our our clock is going to be off. So, we could try to tweak this hysteresis resistor and and you know, maybe and maybe you know, try to try to up the amount of noise we can handle. But with the rest of the circuit, let's look at see, you know, is this actually a problem? Cuz if we look now after this capacitor, let's add that to our scope and see if we can see this problem again. Um here we go. So, here's a another example. And so, sure enough, going into our comparator, we have, in this case, two pulses. And then of course, this returns to 5 V. But now let's look at what's happening on the output over here. So, let's add that to our scope, run that again, and let's see if we can get another glitch. So, here's another glitch. And here you can see, so again, we've got that double pulse. But if you think of what that pulse is doing, whenever we get this down pulse like this, this red trace, you can see when it pulses down, that's going to pull the output of this comparator low and discharge this capacitor. And so, that's the orange trace here. You can see you can see that capacitor gets pulled, you know, or the this output here now gets pulled down, that capacitor discharges. And then it starts slowly recharging, right? This orange trace, or I can highlight a little bit better here. You can see it slowly starts recharging. Then the second pulse comes and it discharges it again. Well, it's barely started recharging at all. So, this capacitor as it's slowly ramping up, watch that orange trace, slowly ramping up. If we get another pulse or two here that just resets it, big deal, doesn't matter. Cuz it's taking so long for that to slowly ramp up that we're basically eating any additional pulses right in here. And so, you can see basically anytime we have these extra pulses, it doesn't really matter because okay, we're we're just restarting this ramp up and the net result, if we just zoom this out, maybe not that much, the net result is that we get that nice clean ramp up every time. And then if we add in the output here, let's look at that final output. Got a lot of things going on here, but you see that final output just looks like a nice even square wave. So, even with all that noise, even with the double pulses where the hysteresis here isn't quite enough to get it, we've got a nice clean output here. Now, we still have the hysteresis here, so if there's any like noise in here, you know, we definitely want to make sure we're taking care of that and not getting any double pulses here. But we would expect a lot less noise at this point because we have that big capacitor. And so, the end result here with all of that is I I think we have a very robust way of extracting the frequency of an AC line regardless of the voltage, you know, as long as it's not something crazy, and anywhere from say 7 V to 30 V, I guess. And it should be very resilient to noise or whatever other garbage from spikes and dips that happen. You know, I think we've all seen lights dim when some appliance turns on. Hopefully, our clock will still keep time, you know, perfectly well despite all of that. Um so, let's go ahead and build this and see it in action. So, here's our circuit. We're currently only using one comparator and that's this one here. The input's four and five and the output is pin two. So, our output right now is on pin two here. And we want to bring that around to our second comparator. We're going to use this one with inputs of pin six and seven, and its output will be on pin one. So, we no longer want to ground the inputs. And so, I'll start by connecting that 0.01 microfarad capacitor to couple the output of the first comparator to an input of the second comparator. So, that goes from pin two to pin seven, and then we want to pull that high, as well as add that diode to clamp those positive pulses that we're going to 10 V. So, we've got our edge detector with the capacitor and resistor, and then we've got the diode, so we only see the negative going pulses from 5 V to 0 V. And then the other input of the comparator is just going to be a voltage divider with two 47 k resistors, one to ground, and one to 5 V. So, those are the inputs of that comparator, and then the output is the open collector, so we're not going to see anything on that output unless we pull it high with a resistor. And this was that 100 k resistor, so we'll go from pin one, the output of the second comparator, to 5 V with that. So, that's the second comparator wired up. Let's take a look at how the circuit's working now. All right, so let's power this on, and we've got our original sine wave there, and we can also look at the original output here. And so, again, if we change that input, you can see the duty cycle changes on that output there. But now, if we look at the output of the second comparator, turn that on, it's kind of hard to see, but you can see these little spikes here for each transition. And actually, if I get rid of some of these other waveforms, it'll be a little bit easier to see. So, there's a little spike if I zoom in. If I zoom out, you can see all of them there. And so, that's with just the resistor pulling the output of the comparator high. Let me add in the capacitor here. Let me move my probe for a second, and the capacitor will go to ground, and you can see as soon as I put that in, we get that nice ramp that we saw in the simulator. And now, that's going to be the input to our third comparator. So, let's get all this out of the way, and I'll disconnect power, and uh let's take a look again at what we've got. So, I just added this capacitor to the ground, and so we've got the capacitor and the resistor that are forming that RC timing network to give us that nice ramp. So, now we want to take that output from pin one of this comparator and go into another comparator. So, I'm going to use this comparator up here, so pins eight and nine, and then the output of that will be over here on pin 14. So, let me get rid of the ground connections that are currently on those inputs. And now I'll connect the output of the second comparator to the negative input of the third comparator. And then the plus input of that comparator is just going to be a voltage divider with two 47k resistors, one from 5 volts and the other to ground. And the output's on pin 14, so I'll pull that high with a 4.7k resistor. And then we have our 100k feedback resistor for hysteresis on that final stage. And so, with that third stage hooked up, let's take a look at what we've got. So, I'll connect the scope back up the way I had it, and then go ahead and connect power. And there's our sine wave. And on channel two, I should see our ramp. So, there's the ramp that we saw before, and so again, that's not going to be affected by the amplitude of the sine wave if I change that input. But now, stage three is going to compare that ramp to the reference voltage here, which Oh, I need to turn that on. Reference voltage is here, and you can see we've got the um hysteresis applied there. And then the output is going to be that square wave based on the ramp. So, if we get rid of that for a second, you can see that square wave triggers at a certain point on that ramp. That gives us a square wave, and so if I change the input, which you can't see, nothing changes. Let me bring in that input. And now you can see as I change that input, the output remains rock solid. We got a nice perfect 60 Hz signal. Should be perfectly clean. Shouldn't matter too much what voltage is coming in. Shouldn't matter too much how noisy our power supply is. At this point, we should have a nice solid 60 Hz signal that we can now use to build the rest of our clock. Now, if you're interested in following along at home and building your own clock, I put together kits you can buy with all the components you need. You can check them out at the link there, eater.net/clock. But, there are two different versions of the kit, and you want to make sure you order the right one. One includes a 120-V power adapter, the other includes a 240-V adapter. And these are AC-to-AC adapters, and they're not dual voltage, so it's important you order the correct one for your country. And both kits include all the parts you'll need to either build the clock as a 12-hour clock where the hours go from 1 to 12, or a 24-hour clock where the hours go from 0 to 23. Both versions of the kit can be built either way, but do pay attention to which voltage that you need for your country. Again, these kits are available on my website, eater.net/clock. Go check it out so you can follow along and build your own cool-looking clock, and maybe learn something about digital electronics along the way. So, hopefully you found that interesting. Hopefully, you find this project interesting, and I'll see you in the next video, which is already available on Patreon. And as always, I want to thank everyone who supports me on Patreon. You know, I've been working on this project for a while, and as I post this, the first five videos in the series are already available to supporters on Patreon. Their feedback with each video shaped the project, and I'm really grateful for them.
