transcript: Google almost never released Gmail, because people internally thought it was unnecessary. Back then, email was already solved. You had inboxes, folders, attachments. What else do you need? But one engineer at Google called Paul started building an email app on the side. It was all part of a 20% project. Basically, something Google employees worked on as a side part of their job. And his idea was simple. What about instead of deleting emails, you can search with them, kind of like you search all your folders. This sounds normal now, of course, but back in 2004 this was quite the enormous shift. Especially when Gmail launched with 1 GB of storage. Now, this back then was insane. Other email providers offered megabytes, but Gmail was offering gigabytes. Well, 1 GB to be precise. People literally thought this was an April Fool's joke, but no, this was essentially the start of something insane. Gmail was born.
