transcript: Hey guys. So today you and I we're going to talk about learning something important in 2025. So let's get into it. So the question in question was basically Frederick, what is a really important skill that all software developers should learn in 2025 according to you? I think it doesn't really matter where when you're watching this. I suppose that it's going to apply anyway. I hope so at the very least cuz I like to make content that isn't specific to a given year, but the list is going to be pretty short. So, basically, if you go back to forever ago when I had this question the absolute first time, which is like I don't even know how many years it's been now. Then I said googling skills. And the reason why I said that is because as software developers, although we do sometimes have teammates and sometimes they're extra nice and they will help us and things like that, we are in a profession where a lot of our success the success of our work depends on our own ability to solve our own problems. Autonomy and self-reliance is a very big factor for professional software developers because one part not every coworker you will have will have a good understanding of how to help you or they might not know anything and so forth. So you sort of have to do your own debugging your own investigations and things like that. And because the domain that you are working within the area of IT so to speak is so diverse and so complicated, it's very unlikely that you will have a coworker who can always help you. It is equally very likely that someone on the internet has had similar sorts of issues. Luckily, not always, but luckily enough. And the trick you need to learn is to have to find that information. And that is why googling skills or searching and so forth is a very important thing that you need to learn almost immediately because for most of the part of when you're searching for answer to your solution. Sometimes you're going to have a problem that is cookie cutter which is like there's a perfect description on Stack Overflow or some GitHub thread somewhere or so forth that explains perfectly how to solve your problem. But on average that is not the case. Usually what's on average can happen is that you will find information that is somewhat relevant to your problem and that will give you a hint how to solve your own problem. And that is the key trick to understand how to figure out how to express your issues with the code that you're having that that you're writing, right? And then finding something that can give you a lead on what could be wrong. test a few things out and then return with more information. Like classic one is you have an error, you fix that error and then now you have another error. And that process is pretty standard where you try something, try something, you just see the same error, you don't know why you're getting it, and then you try something that is slightly different where you have a bit of an epiphany and then you have a different error and that is still progress. another error. If you've been facing the same error for a long time and you're getting from that error to another error, that is at least progress that you figured out some part or even maybe you even made it worse. I don't know, but usually you should count that as a win. Now, this is the only thing that I would argue is specific to 2025 or so forth and so and that is that now this rule of learning how to Google for things and learning how to express yourself so that you find relevant information, it also applies to AI. The reason being because what I argue is basically that the the value or the return on investment you're going to get from using AI will be at a certain level regardless of who you are. But if you want to be truly productive, you need to learn how to prompt your AI correctly, how to give it the right information, how to structure your queries or your conversations with it so that it has the highest likelihood of giving you the correct answer or giving you the information that you need. The reason why that is important is because I see quite a lot of software developers that I work with who have more or less just started using AI and they are complete at it. like they they it's like they're talking to the AI as if they're talking to a human and for the record AIs are not humans. They don't reason and like at least that not now the models that we have they are as the best way I can describe it is that they are very very sophisticated calculators. The problem is that with a regular calculator, you can almost always trust that the numbers that you're going to get back is an exact answer to your question or to your like arithmetic problem. AI doesn't work that way. AI is much much much closer to something like a search engine where you will get something back, but it's usually an approximation of what you're asking for. And that is great when you want to make art that isn't specific or you might want to structure write code or anything like that where the outcome isn't super super super important like the details of the outcome. But once you get into those real details AI is going to have a harder time without some type of useful feedback loop that you the human provide so that it can narrow in on the exact details of what you want it to do. And that is a process in of itself. And I can tell you that from when I first started using AI in part of my workflow in today, I am much more productive. I know more tricks of how to talk to it and how to make sure that it does the thing I'm expecting and so forth and so forth instead of just giving it a bunch of information and then sitting and seeing it try to sort of figure out what I mean and so forth. Then you learn those sorts of tricks. It's no different from as I was saying learning how to use the search engine cuz you know when someone who doesn't really know how to use a search engine uses it where it's classic is that they create a query to the search engine that is like super super super specific and you and I both know that probably if you're looking for information on something. It's not a great idea to be overly specific. It's better to give it a little bit of wiggle room and like use some keywords and expressions and so forth that might match and then do some manual investigation to figure out if you found something that is complete like relevant to you. AI works in a very similar way. If you learn how to structure your code and your queries and the things that you are using in order to make the AI do you work for you in a proficient way, you'll be a lot more productive than if you have not taken the time to really understand what's going to work and what's not going to work with the different models that you might be using. So, what I want you to take away from this is that regardless of it's in 2025 or wherever you're listening or watching this, I I would say that the two main skills, if we're just glossing over obvious things like learning how to program, learning how to talk to stakeholders, like all the sort of stuff that we do every day, if we're just going to focus on some core skills that falls outside of the natural coding skills that you're going to need to be a programmer, number one, make sure that you understand how to use a certain Who knows by the time you watch this we might not even like Googles and like like they've been replaced completely by just talking to AIS instead. But the same tip always applies. Number one be the sort of person who can understand roughly what you need to do to solve a problem and then go and find the answer to that question. Used to be that you had to go to a you know learned people or library or something like that to get the information that you need. And when I was growing up, we went to the search engine and we figured out how to search so that we could find articles that could help us and so forth and so forth. And today, you also have AI to consider. And the same thing applies. Learn how to use these tools of these methods of finding relevant information and then learn yourself to be a little bit of an investigator and figure out how to piece things together. And that is one part learning how to find information on the internet and one part learning how to talk to an AI so that it know so it's better at doing the things that you want it to do for you and that requires practice. I've seen it many times guys that people who really embrace AI and are really good at it and like are curious about it. They're usually more effective than the people who are just you know doing the barebone basics. And I argue the same thing is true when you're looking at software developers at least when I was growing up. the people who really cared and like were really hungry about learning and so forth, they were usually very good at figuring out how to fix their problems and so forth. The people who didn't care all that much, I mean, they were having a hard time just even thinking about, oh, maybe I should go and search for this on the internet rather than just sitting there waiting for someone to come and help and fix my problem. That sort of mindset doesn't get you very far as a software developer. taking responsibility for your own commit and committing to making sure that you do everything you can to figure out your own problems. That's going to take you a lot farther. It's always okay to some degree to ask for help when you need it, but as a rule, be self-reliant. It's going to serve you a lot more than if you just sit and wait for other people to do it for you. Have a great day.
