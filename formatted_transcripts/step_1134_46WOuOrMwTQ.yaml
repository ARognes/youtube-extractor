transcript: Hello. In 2018 or thereabouts, I was making a lot of video tutorials around different kinds of things you can make with code that weren't processing or P5JS. And I am ready to do some of that again. In particular, I am going to make a series about how to code a Discord bot in JavaScript with node.js. So I wanted to take a minute for this, in what you're watching right now, to refresh my old workflow series. If you've watched those, great. Maybe skip this one. Or if this is totally new to you, if you have never programmed outside of P5JS or processing, this is the video for you because I'm going to show you terminal access. And I'm going to show you how to install node and how to create your first node.js project. And the videos that follow will hopefully cover in more detail like why you would want to do that in terms of making a Discord bot or some other kind of web server or project. I should say that I am on a Mac. And unfortunately, what I'll be showing you on my screen is restricted to Mac. When possible, I will try to show you screenshots and captures of the equivalent on Windows. But at a minimum, if you go to the video description, if you go to the codingtrain.com the web page associated with this video, I will include additional information for the equivalent kinds of things that you might want to do on Windows if you're on Windows because I know most of you are on Windows. But I'm on a Mac. So the concepts will be the same. My enthusiasm will be the same. So hopefully, this will be helpful to you. If not, you could just skip to the next video or a different one. It's fine. You don't you don't have to stay. I made a list of what I'm going to cover. So you also could look in the time codes and skip to whichever part is of most interest to you. So I'm going to go over terminal, shell, what is node, and using a text editor like Visual Studio Code. So I'm going to cover all those things in this video. I will not be covering git, what is git and all of that. That is a big part of how I work also outside of the P5 web editor and processing. So if that interests you, make a note to me in the comments encouraging me to refresh my old git and github for poets series, which was probably recorded in like 2016 at this point. So that really needs an update. If you're a computer user like me, you probably like to make files and open programs and click around and drag windows and type stuff. You're used to operating your computer with the graphical user interface, whether it's Windows, Mac, et cetera. I want to open a window to the computer soul for you. I want to show you how to operate your computer in interface with the operating system-- do everything you could possibly ever do on your computer but through text-only based commands. And the way that you do that is through terminal access. Now if you watch any of my Apple II videos, you'll know there are computers that just open immediately to a terminal prompt, a text prompt where, if you want to do anything, you've got to type in the commands. My computer does not. However, built into the Mac under Applications Utilities is a nice little program called Terminal. So you could go and open that up. On Windows, you might do Start Command, there's something called PowerShell. The syntax will be different. I'll try to address that as I get a little further along here. But for me, I like to use a different piece of software called iTerm. So any terminal application will do. Terminal is the piece of software that you run on your computer that opens up that terminal prompt for you to type a text command. If you're trying to follow along and you're on a Mac, go ahead and download this right now. And run it. This is what it's going to look like. Now, Mac OS is actually a flavor. It's built on top of the Unix operating system, a very well known, tried and true, olden times operating system. Developed in the late '60s, early '70s at Bell Labs. And there are a slew of standard Unix commands that I'm obviously not going to teach you all of them. I'll include some links of where you can look them up. But here are some basic ones. For example, if I type in echo and then some text, echo is like print. And it will print it back out to the terminal window for me. I could also type PWD. That stands for Print Working Directory. And it's telling me the folder I'm in on my computer is slash user slash teaching. I could also type CD, Change Directory. Maybe I want to go to the desktop. Now, I'm on the desktop. And I could type LS for list, which will show me everything that's on the desktop. I can give it an argument, LS-all. And it's going to give me the listing of everything on the desktop but with some more information about permissions, and file size, and date, and all that stuff. I can also do command K, which will clear the terminal window for me, and make it all nice and fresh where I can just start over again at the top. Those are some basic Unix commands. Now, there is also this concept called shell. So while I'm in the terminal software, the place where I can type the commands, this is all based on Unix, the operating system, the shell is the command line interface to that operating system itself. And there are different kinds of shells. They have all sorts of funny names like born, and corn, and bash, and-- list your favorite shell in the comments. Mac OS by default, didn't used to be the case, comes with the ZSH shell installed. One of the reasons why I love ZSH is you can have plugins for it as well as themes. And I love a good theme, especially if it's rainbow colored. I like to use something called oh my ZSH, which is a, and I agree, delightful open source community of and framework for managing your shell's configuration. So you don't need to use this. You can do everything without it. You might have a different one that you love. Somebody else might recommend one to you. Go for it. Just have fun with your shell, color, theme it however you want. Let me know in the comments. But I'm going to show you if you want to use exactly what I'm using how to install this one. So I can click here on this button, Install Oh My ZSH. And it's going to show me this kind of scary-looking thing. So I should mention, if you ever see, oh, just run this shell script install thing in your terminal, pause for a moment. Ask the question, is this a trusted source? This is not something you just want to willy nilly just copy paste shell install scripts from anywhere into your terminal. They could wreak havoc. It could be malicious, all sorts of things could arise there. But I happen to know, I've used this one. This is the oh my ZSH install script. I don't want to get into all the details about what all these things mean. I will mention that that word curl there, that's a good one for you to know. Curl is a command line utility that allows you to fetch data from another server. In this case, we're fetching a file, text file, called install.sh that has a whole bunch of shell commands in it. And all of those shell commands install the theme. So without getting into it too more, all I need to do is hit Copy, go back to my iTerm window. You could use Terminal, whatever you're using. I'm going to hit Paste and then I'mma hit Enter. And look at that. Already, I see a rainbow of color of oh my ZSH. There's some more information here. Something really important is this dot ZSHRC file. That is essentially your configuration file for your shell. That's going to come up as I start to install some things later. But I'm just going to wipe the window clean with command K. I have a lovely blue, indicating what folder I'm in right now, which is the desktop. Now, I'm ready to install Node js. What node is, I'll come back to in a little bit. I'm going to walk through how to make your first Node project. But now, let's just look at installing. Installing Node, a JavaScript runtime, I'll explain what that means in a bit, is as easy as going to nodejs.org and downloading the version for your operating system. I do want to mention that the tutorials that I'm going to make, I will be using Node 18.18, which includes some features that are necessary for the code that I will write. So that's probably the one you want to use, though you're welcome to try a later version, one of the-- 21 apparently is the current version with the latest features. In addition to just downloading the installer that's on the Node website, there's a wonderful tool that I like to use called NVM, or Node Version Manager. This is a separate command line tool from Node, not to be confused with something called NPM, which I will get to. There's a lot of commands and things that I want to do with node. NVM is separate from Node. It is just a utility that will install and maintain multiple versions of Node on your computer, which I sometimes need to do because I have a project that's compatible with an earlier version. I want to move back and forth, I'm helping students, and they have this version, let me test it. So you don't necessarily need to. But let me show you how NVM works. I think NVM is technically available on windows. But you might have-- it's maybe a little bit more difficult to get it running there. So if you're on Windows, I might just go in and install Node directly. I'm going to click here to install script. You can see here's another one of these like, oh, just curl this thing, grab this shell script, and run it. I'm choosing to decide that this is trustworthy and this will allow me to install NVM properly. Copy, back to my terminal, Paste, Enter. Now, it's telling me that NVM is already installed. That's because I already had it installed. And it is also saying that it's appending NVM source string to users/teaching.zshrc. So this is important. When you install a new command line utility, it's going to put some things in that ZSHRC file. So what might happen to you, I'm going to type NVM right now. And oh, I'm so glad this happened. I wasn't sure if it would. But it actually told me, command not found. The reason it's not found is because it's newly installed. And the shell isn't aware of it yet. So a quick thing I could do is just open up a new window. If I open up a new shell window, I just hit command N. And I type NVM. Now, I can see, oh, it's telling me all sorts of stuff about what I can do in NVM. But back here, if I didn't want to open up a new window, I can reload that configuration file. The way that I do that is by saying source. And then I happen to know that configuration file is in slash user slash teaching. That's my home directory. A shorthand for my home directory is tilde slash and then the name of that file, which is dot ZSHR. And by the way, if you're typing in a file name and you want terminal to autocomplete it for you, you can often hit Tab. It only had one more letter left, but hit Tab, and it did it. So now, I'm going to type that, I'm going to enter that. That reloaded the configuration. We essentially restarted the shell. And now, if I type NVM, it's there. So what do I want to do once I have NVM? You can see there's lots of commands here, install, use, run, exec, alias. I encourage you to look through the README on the github website about how all this works. Pretty much what I want to show you how to do is just use it to install Node. So I want to say NVM install 18.18. I don't have to say, Node. The only thing NVM installs is Node. But I do want to give it the version. I'm going to say 18.18. Let's see what happens. It's already installed because I already did this. I could just show you like, I could install an older version. It's already installed. I could install an even older version. And now, look. It's downloading and installing it. So you can see, you can install-- and you can install with a specific version, or just the major number like 15 or 16. And it'll pick the last version of that, which is 15.14.0. Now, what I could do is I could say NVM list. And this is going to show me-- there's some other stuff here. But basically, look. I have version 15, 16, 18.-- 18.0, 18.18.2, 20.8.0. And actually, what's important here, even though it's kind of maybe hard for you to see with this blue color, the default is set to 18.18. I've already set it up that way. I'll put on the screen what the command is to set the default. But since I've already set it up that way and that's the one I want to use, I can type NVM use, I could give the number, but in this case, I'm going to say default. And now, it's using Node version 18. Before, it was using 15 because you can see that's highlighted in green. And I can confirm that by actually executing our first Node command, Node dash dash version. So typically with anything like NVM, Node, curl, these command line utilities, there's the name of the command and then arguments to it. And different commands have different syntaxes with dashes and et cetera. So I don't know how to be comprehensive about that. But here, I'm saying, hey, Node. Tell me what version you are. And version 18.18.2. So I am good to go. The next thing that you will need to start your first Node.js project is a code editor, somewhere where you're going to be able to type the code. Now, to be-- the truth of the matter is you could actually get a code editor right here in Terminal. And one of the ones that I love is something called Nano. But there's Vim, and VI, and all sorts of other esoteric, interesting, strange tools you can use right there in Terminal. You could use Notepad, you could use TextEdit, anything will do. I happen to, these days, be using a code editor called Visual Studio Code. It is a product of Microsoft. It integrates well with a lot of the other things that I'm doing. It has some great features. So I'm going to show it to you. You're welcome to follow along. But again, you could use whatever you want. If you're using a different code editor, you have your own favorite one, please let me know in the comments. I'd like to hear those things. Step one is to download and install it for your operating system. I'm going-- you'll pause the video if you want to do that while you're following along. I've already installed it. And there it is. Visual Studio Code. Now, Visual Studio Code is something-- I could probably be here for the next six hours going through all of the features, and possibilities, and configuration settings. I am not the most adept at Visual Studio Code and all of the latest and greatest on the bleeding edge things you can do with it. I'm just an old man trying to use a modern text editor to write some code. But I am going to show you a few things. The very first thing is let's just look at the Visual Studio Code preferences. Now, extensions is going to be something very important. There are so many extensions and add-ons you can install into Visual Studio Code. I'll show you a couple. But let's first go to Settings, which can also get to with command comma. And maybe the first thing that I want to do is right here just make the font size bigger, which maybe you don't want to do, but I really have trouble seeing. These progressive lenses only get me so far. Plus, I'm recording a video tutorial. So let's make this bigger. Now, you don't see anything yet, but you're going to in a minute because I'm going to make a new file. New text file. So soon, I'll get into more about how to open a directory of files, and configure a project. But let's just pretend for the moment that I am going to save this file on my desktop and call it choochoo.js. And in this text file, I am going to write a little bit of code. Now, on purpose, I've made this kind of horrific to look at. I'm having a slight mild amount of panic right now. Not to worry. I'm going to show you one of the most wonderful extensions you can get for Visual Studio Code. And it is called Prettier. This button over here on the left is for extensions. And you can see some recommended ones, some popular ones. I have none installed. Again, I did wipe my Visual Studio Code settings before I started so I could show you these steps. I'm going to type in, prettier. I'm going to click on it. And we can see more information here about the code formatter, Prettier. I am going to hit install. It is now installed. I'm going to go back to my file. And now, I want to issue a Prettier command that will reformat all of the indentation and everything in my code. One of the ways you can execute any possible thing that you could ever do in Visual Studio Code is through the command palette. So most things are available through the interface, there's view, selection, run, et cetera. You can see here, right? Where was that? Command palette. Shift command P. This now is a giant list of all sorts of things you can do in Visual Studio Code. You can see the two that I use and what I intend to show you are already at the top because I've recently used them. But I can just search for one. I want to search for formatting document. I'm going to click Format. Ah, look at this. It's telling me to configure a default formatter. I forgot about that. So what I want to do is I want Prettier, the extension, to format my code. So let's click on Configure, and I'm going to pick prettier. And then look at that. It made it all pretty for me. Let's pretend for a moment this was a p5.js sketch just so there's a little bit more code. Let me format that again. Beautiful. I don't really want to have to run that format command every single time I want to. I just want it to auto format every time I save. Guess what? There is a format code on save preference. It's somewhere in here. But I'm not sure where. Luckily, with all of these preferences and settings, there's so many of them, I can actually search for something. So let me just type in, format. And oh, it came up. Editor, format on save. So let me click this. And now, I am going to add some more code. I'm going to hit Save. And the code autofor