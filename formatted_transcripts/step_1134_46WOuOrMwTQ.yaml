older for a syllabus, there's the codingtrain.com website. Lots of stuff. I'd right now really like to look at all of the files that are in the codingtrain.com, that folder that has all the source code for the Coding Train's website. Guess what I can do. I can type in code, and then I can type in the name of that folder. I can tab complete it, I can hit Enter. And all of a sudden, I have now a new Visual Studio Code window open that has along the left, this directory tree of all the files inside that folder. I was able to open the codingtrain.com project in Visual Studio Code directly through one command. I can also do that through file open folder. For example, I could go to the desktop now and pick the nature of code book directory. And now, you're seeing this. I'm going to close this file. I don't want to make any changes to it. I'm going to close these files, I'm going to close the nature of code book workspace, and I'm back now to just this single file. Now, this is me typing some p5.js code into a JavaScript text file on the desktop of my computer. I could build this out into a full P5 sketch that I run from Visual Studio Code and host locally. That's something that I'm sure I've done that in another video somewhere. I'll link to it if I can remember. That's not where I'm going right now. This isn't any code that I could run. The next thing I want to do is show you how to actually run JavaScript code with Node. What does it mean that Node is a runtime for JavaScript? And what does it mean to run node scripts as well as build out Node projects? I'm going to put that into a separate video where we'll follow directly from this one in a playlist or a track that's on the Coding Train website for making a Discord bot. So if you want to learn about that, I'll see you there. [MUSIC PLAYING]
