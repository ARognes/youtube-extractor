transcript: '{"content":"\n[1.773s] Откажи се от идеята\n[5.195s] за поправяне на хора.\n[15.549s] За бивш Мормон\n[17.907s] Вчера на стълбите\nСрещнах човек, който не беше там\n[21.834s] Днес той не беше там отново. Иска ми се, иска ми се да си отиде — Антигонист, Уилиам Хюз\n[26.46s] Много жертви на злоупотреба са изправени пред желанието да \"поправят\" хората, които са малтретирани.\n[32.34s] Понякога това желание е насочено към техните насилници.\n[35.832s] Жертвите дават безгранична любов, утеха и разбиране с надеждата да се противодейства на негативността на насилниците и да се излекуват техните разрушителни пориви.\n[46.84s] Понякога желанието за корекция е насочено към други жертви, които се надяват да спасят от злоупотреба.\n[53.211s] И в двата случая хората могат да се изтощят, опитвайки се да поправят хора, които не могат да поправят.\n[59.883s] Ще предложа моите разсъждения за тези опити да се \"поправят\" хората и какво причинява техния неуспех,\n[65.714s] и ще покажа някои по-продуктивни техники.\n[68.877s] п — п — пр — промяна\n[72.88s] Може да изглежда странно, че психотерапевт говори за изоставяне на идеята да се поправят хората.\n[78.14s] Не е ли това, което терапевтите правят — поправят хората?\n[81.669s] Не е точно така. Ако клиентите наистина се поправят, това се дължи на факта, че те работят върху поправката си.\n[88.072s] Ролята на терапевта е да улесни този процес на самоусъвършенстване.\n[93.092s] Важно е да разберем какво се случва в терапията, защото това показва някои причини, поради които не можем да променим хората.\n[100.082s] Можем да мислим за терапията така:\n[102.36s] между мястото, където клиентът е сега, и мястото, където иска да бъде, има пречка.\n[107.331s] Заедно клиентът и терапевтът разглеждат препятствията напред и обмислят как да ги преодолеят,\n[113.56s] като оценяват и сравняват рисковете от различни варианти.\n[116.76s] Някои са много прости, други изискват по-голямо участие.\n[121.037s] Терапевтът остава в близък контакт, предлагайки допълнителни гледни точки и посочвайки капани, които клиентът може да не забележи.\n[129.08s] Но клиентът трябва да преодолее препятствията и да работи върху проблемите, които е дошъл да реши.\n[135.102s] И не всеки клиент е готов да направи това.\n[138.583s] Някои клиенти се надяват, че терапевтът ще даде магическо бързо решение на сложна криза,\n[145.582s] решение, което няма да изисква от тях никакво усилие да мислят или да се борят с труден избор,\n[151.0s] нито да се сблъскат с неблагоприятни последици, нито да понесат загуби.\n[155.05s] В метафората на състезанието с препятствия те искат терапевт да ги носи на гърба си, за да ги доведе до финалната линия.\n[161.92s] Дори ако това беше възможно, избягването на саморазвитието, което се случва, когато се работи за преодоляване на кризата,\n[168.713s] клиентът ще остане също толкова неподготвен за следващата криза и също толкова зависим от другите, да му решат проблема.\n[175.959s] Някои клиенти искат терапевт да им помогне да поправят някой друг в живота си.\n\"Ако само този човек беше различен, всичко щеше да е наред.\"\n[184.203s] За такива клиенти няма пречка за личностно развитие, която да бъде преодоляна.\n[189.36s] Проблемът не е в тях, а в другия човек.\n[192.56s] И все пак, те са тези, които идват на терапия.\n[195.98s] Понякога насилници, включително злокачествени нарцисисти, идват на терапия, но не непременно за да се поправят.\n[204.65s] Преди години, работех за благотворителна организация, която предлагаше на клиентите шест безплатни терапевтични сесии\n[210.794s] една клиентка дойде, мислейки, че това ще я направи по-достойна, в съдебните заседания за попечителство над деца.\n[216.833s] След като присъства на първата от шестте й сесии с мен, в които тя прояви редица нарцистични черти,\n[223.06s] за следващите четири сесии тя повече не се върна.\n[226.695s] По-късно разбрах, че е решила да отиде на почивка по прищявка,\n[231.349s] принуждавайки ме да запазвам празна стая в продължение на четири седмици,\n[235.396s] и забавяне на други клиенти в списъка на чакащите, които можеха да бъдат видени.\n[240.338s] Когато тя се яви на последната сесия,\n[242.657s] тя беше възмутена от отказа ми да удължа сесиите й, за да запълни отсъствието си,\n[247.613s] и че няма да получи писмено потвърждение от мен, че се е подложила на терапия.\n[253.4s] Подобни клиенти се опитват да създадат препятствия които терапевта сам да разреши, но това няма нищо общо с личностното израстване.\n[261.54s] Да бъдеш в терапевтичен кабинет не означава, че терапията ще се осъществи.\n[266.096s] За да се случи това, клиентът трябва да е отворен за промяна.\n[270.593s] Опитът да се наложи промяна на съпротивляващи се клиенти може да влоши нещата,\n[275.138s] Чрез активиране на всякакви психологически защитни механизми, които могат допълнително да ги укрепят в тяхната позиция.\n[281.565s] В научната работа от 2002 г. \"съпротива в психотерапията\"\n[285.832s] Бойтлер и колегите му откриха, че терапевтичните подходи с ниско ниво на напътствие и самонасочване, могат да са полезни за някои силно съпротивляващи се клиенти\n[294.686s] оставяйки ги да поемат пълен контрол при воденето на сесиите.\n[298.9s] Но дори и най-гъвкавият терапевтичен стил няма да работи в случаи на екстремна непримиримост,\n[305.773s] и за съжаление, някои от най-непримиримите личности са нарцисистите — и техните жертви.\n[314.334s] Когато никоя от страните не е готова да се промени, резултатът е психологическа безизходица.\n[320.78s] Грешка е да се разглежда екстремната несговорчивост на двете категории като съзнателна упоритост.\n[327.899s] Това, което наблюдаваме, не е умишлена порочност, а дълбоко вкоренени аспекти на тяхната психология.\n[335.393s] Симпатични и нарцистични хора\n[Звезди] и [черни дупки]\n[339.449s] Когато разглеждаме човешките качества, те рядко са черни и бели.\n[343.319s] По-полезно е да се мисли за спектри, обхващащи всичко между липсата и излишъка.\n[349.193s] Има огромни вариации в обхвата\n и интензивността на нарцисизма,\n представен от различни хора\n(дясна стрелка: слаб / лява стрелка: силен).\n[357.359s] От \"слабата\" страна на спектъра може да има едно до две нарцистични качества.\n[362.48s] Ако имат значително влияние върху взаимоотношенията,\n[366.225s] и индивидът притежава достатъчно самосъзнание, емоционална устойчивост и откритост за промяна,\n[372.835s] тогава има известна надежда, че терапията може да поправи това.\n[376.802s] В много случаи тези качества могат да бъдат по-добре разбрани, като се разглеждат като лоши навици,\n[382.099s] така наречените \"нарцистични бълхи\"(буквален превод от английски няма еквивалент на български), взети от контакт с нарцистично поведение.\n[388.256s] Колкото по-големи и по-интензивни са нарцистичните качества, толкова по-малко надежда е да се предизвика промяна.\n[395.692s] Може да е известно осъзнаване на проблема. Възможно е дори да има опит за участие в терапия\n[402.268s] но резултатите могат да бъдат нестабилни.\n[405.209s] Сред моите близки и далечни роднини няколко души показват ясно изразени нарцистични черти.\n[411.972s] Една от тях изразява нарцисизма си с безсрамна неприкритост,\n[415.875s] заявявайки, че хората трябва да бъдат използвани и че те са като шахматни фигури,\n[420.739s] трябва да ги местиш на местата на които искаш.\n[424.507s] Тя със самодоволство разказваше истории за това как манипулира някои хора по различни подли начини, включително романтични партньори.\n[434.627s] Когато животът й започна да се разпада, след като емоционалната й връзка приключи, тя отиде при терапевт.\n[441.889s] Тя беше объркана, когато той започна да я разпитва за манипулативното й поведение и липсата на интерес към чувствата на другите.\n[450.32s] Не беше това, което очакваше. Но през следващите месеци имаше някои промени в поведението й.\n[456.87s] Вместо непрекъснато да говори за себе си, тя за пръв път започна да задава въпроси на други хора да разкажат за тях.\n[464.237s] Въпреки че беше ясно да се уседят напътствията на нейния психотерапевт в механичното й държание, това изглеждаше като стъпка в положителна посока,\n[472.415s] но усилията й да покаже минимален интерес явно я изтощаваха,\n[477.584s] и след няколко седмици поведението й рязко се върна обратно в още по-негативна територия от преди\n[485.28s] когато започна да използва социалните съвети на терапевта си, не за да подобри връзката си, а за да стане още по-порочен манипулатор.\n[494.504s] Когато се приближим до по-екстремната страна на нарцистичния спектър, надеждата намалява експоненциално.\n[501.646s] Започваме да виждаме много мрачна клинична картина.\n[505.723s] С завършените нарцистични хора дори не наблюдаваме разпознаваема човешка личност, а по-скоро броня.\n[515.659s] Всички ние трябва да носим някаква броня, за да се защитаваме.\n[519.508s] При здрави сценарии тази броня е подвижна и икономична, тя се адаптира според специфични социални ситуации.\n[528.627s] За разлика от това, нарцисистите поддържат пълна броня под формата на човешки костюм\n[534.941s] — измислена личност, фантом, който те използват за навигация из социалния свят.\n[541.5s] Този аватар не е случайна измама.\n[545.273s] Той предпазва нарцисиста от парализиращ страх: страха от отхвърляне от другите,\n[552.262s] и страхът да се изп��авиш пред безжизнената празнота на вътрешния си свят.\n[557.614s] Това е инструмент за оцеляване.\n[560.216s] Опитът да се промени този инструмент за оцеляване може да предизвика усещане за крайна екзистенциална заплаха.\n[566.66s] Промяната е немислима.\n[569.877s] Същият абсолютен отказ за промяна може да се види във\n[574.0s] нарцистични колективи, които се покриват с броня от фалшив образ на идеологическа перфектност.\n[580.558s] Отново този фалшив образ е инструмент за оцеляване.\n[585.54s] Приемането на външна критика и признаването на недостатъци и злоупотреби подкопава непогрешимостта и висшата морална добродетел\n[594.96s] което дефинира самото им съществуване.\n[598.49s] Както при терапията,\n[599.846s] можем надеждно да предвидим, че опитите за налагане на промени върху силно съпротивителни групи, само ще ги накара да засилят защитата си.\n[608.303s] Ще има още по-строга политика, повече контрол върху управлението на имиджа, повече тайна, повече параноя.\n[617.006s] Индивидите, които се поддават на нарцистичния тормоз, често претърпяват подобна загуба на себе си,\n[622.621s] чрез вредно излагане при нефункционални хора в техните ранни години.\n[627.035s] Но докато нарцистичните хора реагират, като се извисяват над другите чрез въображаемото \"аз\",\n[633.84s] тези индивиди реагират чрез издигане на други хора над себе си.\n[638.636s] Те се стремят да угодят на другите, да ги поправят, стават съзависими,\n[643.329s] превръщайки се в каквото искат другите хора.\n[647.763s] В „Марсианските хроники“ на Рей Бредбъри,\n[650.915s] марсианците имат подобна черта: като симпатизират на хората, те могат да променят формата си.\n[656.92s] Когато Марс е колонизиран от посетители на Земята,\n[660.396s] марсианците се опитват да избегнат унищожението, като се трансформират\n[664.686s] в хората, които колонистите искат от тях да бъдат.\n[668.086s] Един от тях става отдавна изгубен син на възрастна двойка, която го приема като свой.\n[674.26s] Но когато една двойка го отвежда в града, Марсианецът не може да устои на мечтите и фантазиите на други заселници, които се разхождат по претъпканите улици.\n[684.049s] Той е принуден да приеме поредица от различни идентичности:\n[687.478s] издирван убиец, изгубен съпруг, кметът на града, младо момиче.\n[694.508s] Той е като глина, оформя се в умовете им.\n[698.933s] След време изтощен от това че се опитва да бъде всичко за всички, Марсианецът умира.\n[706.267s] Подобно на Марсианеца, съзависимите могат да почувстват неудържимо желание да бъдат това, което другите искат, от тях\n[713.06s] и може да започнат да се чувстват като разкъсани между едновременните противоположни желания на хората.\n[719.53s] Те са били обучени да служат на другите и да се чувстват отговорни за чувствата и нуждите на другите,\n[725.651s] като се жертват и отхвърлят своите.\n[729.08s] Те са били научени да се чувстват отговорни за проблемите на другите и за тяхното коригиране.\n[734.891s] Точно обратното на нарцисиста, който носи прекомерна защитна броня,\n[740.222s] съзависимите страдат от липса на броня и увеличена уязвимост.\n[746.015s] Тази уязвимост е нож с две остриета:\n[748.84s] При правилните обстоятелства тяхната свръх приемливост към идеите на други хора може да бъде пътят към възстановяване.\n[756.536s] Ако зависимите хора имат шанс да се срещнат със здрави партньори или да започнат да се срещат с група достойни хора, които ги подкрепят,\n[763.555s] има всички основания да се надяваме, че те могат да изградят самочувствие,\n[767.084s] и с течение на времето да се научат да интернализират чувството си за себестойност, така че вече да не се нуждаят от други, които да я предоставят.\n[775.17s] Но резултата може да бъдат много различен, ако не са достатъчно късметлии, и се забъркат с нарцисист,\n[782.039s] и за съжаление тяхната уязвимост действа като блестящ сигнален огън за емоционалните хищници.\n[789.3s] Всъщност, двойка, съставена от емпатичен зависим човек и егоцентричен нарцистичен човек, работи като звезда с черна дупка.\n[798.42s] Силния емпат е като ярка звезда, която непрекъснато дава светлина на другите,\n[803.471s] разбирайки ги, виждайки нещата от тяхна гледна точка, утвърждавайки чувствата им.\n[810.448s] Докато нарцисистът дехуманизира, емпатът хуманизира.\n[815.994s] Нарцисистът е като черна дупка.\n[819.259s] Навремето самия той звезда, сега черната дупка се руши под собствената си гравитация.\n[824.575s] Сега вместо да излъчва светлина, той поглъща светлина от звездите, които попадат в неговото гравитационно поле.\n[832.272s] По подобен начин нарцистичните хора се сриват под чувството за собственото си величие,\n[837.285s] и жадно се подхранват с потвържденията на другите.\n[842.48s] Някои съзависими идеализират нарцисиста безрезервно и се опитват да бъдат каквото иска нарцисистът.\n[849.6s] Други съзависими, осъзнали, че нарцисистът е повреден,\n[853.685s] но вместо да направят крачка назад, те се втурват напред,\n[857.477s] предлагайки безгранична съпричастност с надеждата евентуално да запълнят тази дупка.\n[862.465s] Те нямат представа за дълбочината на тази дупка, която има място за тях и още стотици като тях.\n[870.859s] Когато са изцедени до кокали, като са дали всичко,\n[875.045s] те ще бъдат изхвърлени рязко и заменени със следващата порция от съзависими\n[879.879s] Те не можеха да разберат, че симпатизират на измамника.\n[884.549s] Състрадание, съпричастност и прекомерна идентификация\n[890.233s] За да разберем отговорите на другите хора, обикновено използваме собствените си умове като пътна карта\n[896.369s] Предполагаме подобен пейзаж: подобни ценности, чувства и основни мотиви.\n[902.949s] Когато получаваме по-подробна информация,\n[905.602s] актуализираме пейзажа, изтривайки погрешни предположения, добавяйки нови елементи.\n[911.299s] Ние сме емоционални картографи, създаваме умствени карти на хората, които срещаме.\n[917.378s] Създаването на надеждни и подробни карти на ума изисква много фокусирано слушане и наблюдение.\n[924.2s] Неспособността да слушате и наблюдавате може да доведе до огромни грешки: може да пренебрегнем важни различия или да надценим незначителните.\n[934.987s] Ако сме в състояние на примитивен мироглед, тогава когато гледаме нечленове, можем да си представим извънземни пейзажи,\n[942.943s] въпреки че в действителност те са много подобни на нашите.\n[947.4s] Емпатичните съзависими често правят обратното,\n[951.475s] погрешно наслагващи познат терен върху много непознати пейзажи.\n[956.761s] Изглежда противоречиво да се предположи, че силните емпати могат да бъдат толкова безконтактни с емоциите на човека,\n[963.405s] но емпатите са толкова зависими от другите, колкото и всички останали на картата, която използват.\n[968.19s] Имайки правилната карта, силният емпат може почувства чувствата на другия човек, докато слаб емпат може просто да си ги представи.\n[976.531s] Имайки грешната карта, силният емпат все още ще усеща емоциите, посочени на тази карта, те просто ще бъдат грешните емоции\n[984.637s] За съжаление силните емпатични съзависими могат да имат специални проблеми с картите.\n[990.802s] Един от тези проблеми е свръх идентифицирането.\n[994.722s] Съчувствието включва стъпване в света на друг човек, за да видите нещата от тяхната гледна точка.\n[1000.607s] Всъщност сме с крак в нашия свят, а с другия в техния.\n[1005.688s] Поддържането на двата крака в нашия собствен свят\n може да се опише като съчувствие.\n[1009.927s] Тук виждаме нещата от нашата гледна точка и нашите оценки могат да изглеждат малко отдалечени и несвързани.\n[1017.66s] От друга страна, ако поставим двата крака в света на другия човек, можем да изпаднем в свръх идентификация.\n[1024.346s] Линиите се замъгляват в двете посоки.\n[1027.763s] Започваме да бъркаме чуждите работи с нашите и обратното.\n[1034.147s] Ставаме емоционално оплетени.\n[1037.38s] Поради неясните си емоционални бариери, силно съпричастният съзависим човек може лесно да се плъзне в свръхидентификация.\n[1045.451s] Може да се видят в насилника си:\n[1048.445s] повреден човек, който трябваше да бъде спасен, но никой не дойде да спаси,\n[1054.188s] и те може да се окажат заклещени в непряка спасителна мисия, решени да бъдат тези, които ще спасят насилника си.\n[1061.494s] Изглежда двойна победа: спасявайки насилника си, те спасяват и себе си.\n[1067.676s] Но това е двойна загуба.\n[1070.229s] Техния насилник не е като тях, и техния насилник ще ги държи във вечно страдание.\n[1077.263s] Ако емпатите пренасочват огромното си състрадание към себе си,\n[1082.09s] те биха могли да отбележат поне една победа, единствената възможна.\n[1086.879s] Собствената им.\n[1088.571s] Но за съзависимия емпат състраданието към себе си, може да изглежда като богохулство.\n[1094.049s] Поддържането на солидна основа в нашия собствен свят ни дава известна степен на обективност.\n[1099.563s] Слушаме думите на хората, но наблюдаваме и техните действия.\n[1103.776s] И когато те не съвпадат, тогава осъзнаваме, че трябва да се съсредоточим върху действията.\n[1109.262s] Без тази обективност силните емпати могат да бъдат много впечатлени от емоционалните прояви,\n[1116.61s] когато насилниците им обещаят за пореден път, че никога повече няма да злоупотребяват отново и се кълнат, че ще се променят.\n[1124.19s] Емпатите усещат отчаяната емоция, излъчвана в тези думи, до точката, в която дори могат да утешат насилника си.\n[1132.632s] Изпълнен със съпричастност, съзависимият човек губи от поглед това, което знае от горчивия опит.\n[1139.568s] Обещанията на агресора са просто безполезни думи, никога не са подкрепени с действия.\n[1146.28s] Освен неадекватната съпричастност, съзависимите хора могат да покажат редица други неадекватни навици, които се укрепват взаимно,\n[1154.642s] включително неадекватна надежда, неадекватно заемане с ненужни проблеми и неадекватно любопитство.\n[1161.98s] Съзависимите се научават да чувстват фалшива надежда в мимолетните моменти на щедрост на техните насилници.\n[1169.41s] Малкият акт на привидна доброта се тълкува като слънчев лъч,\n[1174.922s] сякаш е израз на личните ценности на агресора.\n[1178.56s] Те се надяват, че зад мрачните сиви облаци наистина има ярко слънце,\n[1183.92s] и че един ден облаците ще се разделят за постоянно, но там няма слънце.\n[1189.371s] Съзависимите толкова са свикнали с тъмнината, че всяка приглушена светлина може да изглежда заслепяваща.\n[1197.094s] Съзависимите избират стратегии за решаване на проблеми с неадекватно въздействие,\n[1201.228s] Обучени да се чувстват отговорни за всички проблеми, решаването на проблеми е непрекъснато занимание.\n[1207.107s] В кратки моменти, когато няма текуща криза,, с която да се заемат,\n[1210.826s] съзависимите често се спират на минали проблеми или очакват бъдещи.\n[1217.41s] За съжаление всичките им усилия са безсмислени.\n[1220.789s] Решаването на проблеми за съзависимите работи като суеверие.\n[1225.664s] Суеверието служи като илюзия че имат влияние, че могат да променят нещо.\n[1229.469s] Извършвайки суеверни ритуали или избягвайки суеверни предмети,\n[1234.597s] ние си даваме фалшивия комфорт, че сме си донесли късмет или сме избягали от лошия късмет.\n[1241.18s] Корените на суеверното мислене са достатъчно ясни.\n[1244.85s] Хората търсят модели.\n[1246.68s] Търсим връзки между събитията, между действията и последствията.\n[1252.318s] Там, където нашето търсене на модел е дисциплинирано с критична мисъл, ние придобиваме нови идеи за нашата вселена.\n[1258.887s] Там, където нашето търсене на модел е без критична мисъл, изпадаме в предразсъдъци, догми и суеверие.\n[1266.463s] Жертвите на злоупотреби често смятат, че оставайки на това колело за хамстери, безкрайно  работейки за решаването на проблеми,\n[1272.858s] те имат положителен ефект върху ситуацията\n[1276.077s] Жертвите, които слязат от колелото, често установяват, че ситуацията остава почти същата.\n[1282.274s] Част от ефективното решаване на проблеми е идентифицирането на суеверни компоненти,\n[1287.157s] излишни процедури, които нямат ефект.\n[1291.101s] Това означава проверка на нашите основни предположения.\n[1294.652s] Непрекъснато обяснявате на онези, които ви малтретират, как поведението им ви засяга, няма положителен ефект.\n[1300.846s] Този суеверен ритуал погрешно предполага, че насилникът не знае какво прави и че се интересува от вашите чувства.\n[1308.762s] Поправете тези предположения и ще спрете да се обяснявате.\n[1313.043s] Предлагането на прошка и безгранична любов в лицето на малтретирането няма положителен ефект.\n[1319.164s] Тези суеверни ритуали предполагат, че агресорите ще бъдат благодарни за шансовете, които им се дават, и че ще уважават повече жертвите си.\n[1326.841s] Вместо това, това, което насилниците научават е, че жертвите ще приемат всяко нещо и насилниците ще ги ценят още по-малко.\n[1333.86s] Привързвайки се към тези фалшиви предположения за техните насилници, жертвите стават собствен невъзможен проблем.\n[1340.9s] Неадекватната съпричастност, надеждата и решаването на проблеми, могат да поддържат жертвите ефективно приковани за насилниците си.\n[1348.897s] Дори онези, които са успели да избягат от ситуацията, могат да станат плячка в друг капан: неадекватно любопитство.\n[1356.82s] Много бегълци от злоупотреба изпитват изкушение да проверят за предишни насилници, за да видят дали са се променили.\n[1363.987s] Може би заминаването им имало трансформиращ ефект.\n[1368.1s] Ако открият, че техните насилници се държат по-добре, това може да съживи всички стари илюзии, които са имали, че надеждата още е някъде там.\n[1377.08s] В рамките на дни след даването на втори шанс, фалшивата усмивка се изкривява и злоупотребата започва.\n[1385.007s] Любопитството е здрав инстинкт, желанието да знаете и да научите.\n[1390.521s] Но любопитството, което не е в състояние да усвои информацията, започва да изглежда като нещо друго, а именно: отричане.\n[1398.18s] Когато сме в отказ, имаме цялата информация, от която се нуждаем, но отказваме да я използваме или да се учим от нея.\n[1405.802s] Когато гледаме съзависимите отвън с отделено състрадание, може да се запитаме: \"защо просто не си тръгнат?\"\n[1413.899s] Но когато видим част от техния вътрешен свят, удивително е, че изобщо успяват да оцеляват.\n[1419.767s] Една жертва на злоупотреба каза, че вътрешният му пейзаж се чувствал като  мъничка лодка в бурен океан,\n[1426.176s] постоянно захвърлян зад борда, без да вижда никаква земя,\n[1430.809s] и използвайки кратките моменти, когато морето е спокойно, само за да си поеме дъх преди следващата ударна вълна.\n[1438.976s] Някои жертви са описали вътрешните им пейзажи като влакче, от което не можете да слезете.\n[1444.691s] Темите за увеселителния парк са често срещани; едно от изображенията, които използвам, за да опиша стария си вътрешен пейзаж, беше зала на огледалата,\n[1452.461s] задънена улица, където постоянно ви налагат някакви странни изкривявания.\n[1458.536s] Лабиринти, калейдоскопи, живи водопади. Метафорите за вечна дезориентация са безкрайни.\n[1468.208s] Всеки от нас трябва да иска да търси изход от тези пейзажи,\n[1472.1s] да намериш земя, да слезеш от возенето, да откриеш изход.\n[1478.24s] Никой друг не може да ни принуди да искаме това. Никой не може да ни поправи.\n[1483.628s] Но като външни хора можем да сме готови да помогнем, когато желанието за промяна съществува.\n[1491.033s] бивша жертва, излекувай се сам\n[1497.308s] Оцеляването на средата на злоупотреба често е придружено от смес от радост и болка:\n[1503.627s] радостта от възстановяване на умствена земя които преди това била колонизирана от насилника,\n[1509.989s] но и болката от оставянето на другите след себе си.\n[1514.046s] Да се откажеш от опитите да поправиш хората не означава да изоставиш хората.\n[1518.148s] Това просто означава да признаем, че можем да помогнем само на хора, които са готови да се променят.\n[1524.057s] Няма вълшебна пръчица.\n[1526.545s] Няма нито едно нещо, което можем да кажем или направим, което да гарантира, че някои ще се възстанови.\n[1533.16s] Когато чуем историите на хора, избягали от насилници или групи, има огромно разнообразие от индивидуална повратна точка.\n[1541.522s] За някои това се случва, когато насилникът им ги тласка твърде далеч.\n[1545.446s] Колкото и невъобразимо да изглежда, след всички злоупотреби, които са претърпели,\n[1550.057s] те откриват, че имат праг на толерантност, линия, която не може да бъде прекрачена.\n[1555.443s] Това откритие може да промени цялата ситуация.\n[1559.191s] За някои жертви това е страшно преживяване — един ден да погледнете в този костюм от броня и да видите, че вътре няма нищо.\n[1567.224s] Хората го наричат, виждане на истинското лице.\n[1570.9s] Това е момент, който може да остане с вас и бързо да разруши всичките ви предишни илюзии.\n[1576.796s] За някои емпати които са жертви това е опитът от това да видят други хора малтретирани.\n[1582.7s] Въпреки че собствената им болка често е невидима за тях, те могат да усещат болката на другите и то силно.\n[1589.549s] Тези моменти на лично прозрение не могат да бъдат нагласявани отвън.\n[1594.608s] Хората ще видят това, което са готови да видят.\n[1597.279s] Маската на насилниците може би вече се е изплъзвала много пъти, преди жертвата най-накрая да я забележи.\n[1604.302s] Опитът да наложи промяна на хора, които не са готови, може да доведе до повече щети, предизвиквайки мощни съпротиви.\n[1611.104s] И в техните очи ние просто ставаме поредния човек, който им казва какво да правят,\n[1616.553s] можем в крайна сметка допълнително да подсилим чувството им за невидимост\n[1620.673s] липсата им на самостоятелност и независима мисъл, тяхната липса от собствено Аз.\n[1626.233s] Възстановяването е разрушаването на нефункциониращите модели, и противодействието на нефункциониращите послания.\n[1632.218s] Въпреки че може да не успеем да събудим жертвите,\n[1634.937s] можем поне да работим срещу тези стари модели и послания.\n[1639.07s] Можем да покажем на жертвите, че са видими за нас.\n[1642.434s] Можем да ги поканим да направят свой собствен избор, да насърчим тяхната самостоятелност\n[1647.01s] Можем да предложим не насочваща съпричастност; можем да ги уведомим, че виждаме объркването и болката, които изпитват.\n[1654.332s] Понякога само знанието, че са били видени и чути, е най-важният опит, който жертвите могат да получат\n[1661.442s] Постоянно затънали в мислите на други хора, това им напомня, че съществуват; това може да бъде началото на усещането за себе си.\n[1670.424s] Говорейки за разбиване на модели, е поучително да разгледаме нашите собствени.\n[1674.842s] Какви стари модели могат да се крият зад желанието ни да поправим хората?\n[1679.45s] Поемаме ли отговорност за проблеми, които не са от наши?\n[1684.32s] Къде се научихме да правим това?\n[1686.985s] Прекалено ли се идентифицираме с другите жертви, че не можем да се разделим?\n[1693.661s] Може би и ние ще се възстановим.\n[1697.132s] Всъщност може да се каже, че един от най-големите признаци на нашето излекуване ��, когато се откажем от това да оправяме другите хора.\n[1706.938s] Не можем да поправим разбитите хора. Но можем да подкрепим онези, които се опитват да се поправят.\n[1715.224s] Този канал изследва въпроси, свързани с манипулация, злоупотреба и Догма. На всеки съпричастен човек, подкрепящ тази работа, благодаря от сърце.\n[1723.583s] Специални благодарности: горният списък"}'
