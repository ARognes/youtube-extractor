transcript: are you afraid that you're ruining your career without even knowing it looking back on things i can clearly see times where if i just knew what to look out for i would have shaved years off my career progression and saved a bunch of grief in this video i'll tell you exactly about the three biggest mistakes i made in my career and exactly how to avoid them they're so simple once you say them out loud welcome to a life engineered where we take an engineering approach to your software engineering career my name is steve wynn aka scuba steve metta uncle steve or the coolest steve you know on this channel i give you all the advice i wish i had when i was coming up packaged into a short bit of snackable content that makes you smarter and more experienced this is my free gift to you in case you're new to this channel i'm an l7 principal software engineer at amazon where i've spent the last 16 years of my career but maybe i'd be a retired man of leisure if someone had given me this advice when i was just starting out so let's jump right into it starting with big mistake number three which is about getting your money right i didn't start saving or investing for like the first five or six years of my career i started working in 2006 and by 2007 a friend of mine convinced me to open up an ira a type of tax advantage retirement account in the u.s the contribution maximum back then was four thousand dollars it's around six thousand dollars now and by 2008 this account was decimated because of the great recession and resulting stock market crash it lost a couple grand and i was spooked i liquidated that account taking a huge penalty and didn't really save and invest for the next five or six years i just contributed to get my employer match on my 401k another type of tax advantage retirement count in the u.s and i missed out on one of the best stock market rebounds in history i ran some numbers and calculated i lost out on if you calculated it out to today like three hundred thousand dollars and about a million dollars if you project it out to my retirement age in 2012 i started doing what i do now which is to max out both types of retirement accounts you might say to yourself steve i'm young i can't touch that money until i'm 55. first of all i'm not saying you should max out your retirement accounts you probably should but my point is that you need to invest time in the market is so much better than timing the market if you don't want to max out your retirement put it into a taxable account buy some index funds huddle some cryptocurrency buy some real estate or invest it in yourself by growing a side hustle or learn a valuable skill you have to pay yourself first the second thing i'd say to you is that 55 is not that far away i just turned 40 last month i felt like my 30th birthday was yesterday and i'll blink and my 50th birthday will be going on people are living longer and longer lives save and invest your money and you'll have more options when you get old like me get that money working for you now while you sleep so you can sleep in i just put 10 grand in my daughter's college fund when she was born last year with the current market downturn the latest quarterly statement has the balance at around 8 500 i don't care i'm just gonna stack and by the time she's ready to go to college she can go to the nicest private four-year liberal arts college and get a degree in medieval literature doesn't matter not selling okay let's move away from money and talk about mistake number two which is what i'm calling preferring output over impact everybody thinks they're important because if they weren't around how would everything you currently do get done turns out that most of the time if you weren't around somebody else would have picked up the slack for the first years of my career i thought doing more things meant i was a high performer i prided myself on picking up the most bugs writing the most code and resolving the most tickets i thought that fixing a critical bug meant that my work was critical but the reality is if i didn't fix that bug somebody else would have now i'm not saying don't fix bugs and resolve tickets that would cause a different type of problem you need to do your part the issue was that i thought doing more of these tasks made me stand out but the reality is in the grand scheme of things there's no difference between doing 45 stickies in a year versus doing 60 stickies in a year especially if you're sacrificing a bunch of things to do so the right way to think about it is in terms of differentiated impact what you should cultivate is what rahul pandi great channel by the way calls having a nose for impact those that get promoted unreasonably fast and get the highest performance ratings have the ability to make an outsized impact relative to their level using my example something that would be impactful is a refactor that prevents defects or going above and beyond to find the root cause to a class of tickets so they stop cropping up and paging your team so let's go to one extreme and suppose your job consisted only of upgrading the package versions of your team software and making sure that there's no regressions or migrating software from one dependency to another that's it just package upgrades and migrations well that's a terrible spot to be in because you can't possibly be impactful the only thing you can do to differentiate yourself is by doing things faster and nobody would notice you want to be in a spot where people can tell the difference between just getting something done and doing an amazing job and then you want to do an amazing job it's such a simple thing to say but it took me years to understand that simple concept develop that nose for outsized impact well you might be saying steve i'm not in a spot where i have the ability to make an impact i get my orders and i go from there well that leads me to my last mistake number one not thinking clearly about staying or leaving teams while i've only worked for amazon for the past 16 years i've had 18 different managers so i've been around the company and have worked on a ton of teams this tip is spread across two concepts waiting too long to leave and leaving a good thing leaving teams is really difficult thing to do it takes time to find a new team so let's talk about the easy situations first your team's toxic deadlines are unrealistic or you only take orders from your manager and there's no room to make an impact you need to leave software engineers are in such high demand now that there's no reason to be on a team that's not treating you with respect you can come and work for my team i work on a team that's healthy and kicking butt if it stops being that way i'll move to another team super fast if your team is awesome don't go and chase a marginal improvement you can't really tell if the team you might join is better or worse from the outside what's harder is if the choice isn't clear-cut staying or leaving is a big decision with a lot of emotions involved but the key thing is to think clearly about the situation so here are some considerations 1. the quality of your manager if you have a terrible manager it almost doesn't matter if everything else is great a good manager can also save a bad situation and not only make things tolerable but also give you room to thrive despite a terrible situation don't know how to tell if your manager is good or bad here's a video i made on the subject okay number two is pay if your pay is out of line with people doing the same job as you then you probably should go check levels.fyi to get a sense of what others in your position and role are making don't worry too much about outliers on the top end because they can skew and distort what's normal you should ask for more money or leave a team if you're an outlier on the bottom end if you want to completely maximize compensation go for it but realize that you may be leaving a good thing and moving to something worse and really don't chase a marginal increase if you're in a great spot so suppose you're a senior engineer with a total compensation of 350 000 and things are great don't upend everything to go and chase 360 000 number three promises that things will change if things are bad now it's likely to continue unless you see tangible evidence that people are taking steps to address things here's my tip to figure this out you should not be swayed by words only by deeds people might say don't worry about the attrition we're hiring backfills in this case i would take a look to see if they're addressing some of the root causes of the attrition and whether they're taking the necessary steps to hire backfills if people are leaving because operations are bad and your sprint is just filled with only new features operations are likely to stay the same or get worse if it's been a year since becky michael and leslie left but nobody has come to fill their place and you just had coffee with michael too and he's thinking about leaving don't stay on his sinking ship it's only gonna get worse only when you witness action should you ever believe that things are gonna get better finally number four is lack of growth if you're the biggest fish in the pond you need to leave unless you're happy with where you are and you don't mind retiring with your current scope if you're not growing and getting challenged it's probably time to look for the next adventure either you should stay and get more scope where you are or you need to find greener pastures the best teams that i've been on are ones where you're surrounded by awesome people that you can learn from and you complement the group because they can learn from you as well i've definitely stayed on teams way too long when i was in l6 looking to get promoted to l7 i once reported to an l5 manager because i loved the product i was working on so much i have no problems with him he's an awesome dude but it set my career back quite a while because i wasn't thinking clearly about the situation if you're in a good spot don't go throwing it all away another thing i've learned over my career is that golden ages aren't often recognized in the moment only after some time do you realize man that was an awesome team i was on i just couldn't see it in conclusion if you get your money right prefer impact over raw output and think clearly about whether you should stay on your team you're going to go far in your career and zoom past what i've done i'm just giving you ideas though you have to take them and apply them to your life thanks for watching if you found this content useful hit that subscribe button if you'd like to ask a question leave it in the comments below and i'll give you an answer in my office hours if you like this video you'll love my video on how to tell whether you have a good manager or not i hope you're having a great day and go make uncle steve proud
