transcript: look at this this is words this is a lot of words and these words feel and read the way they do for very specific reasons typography is a very intentional thing and there is a lot more to it than you would ever think about let's take a look at stray you're a cute little cat in this game and the whole world is very cyber it's very colorful lots of Neon Lights you're in an abandoned and overgrown Society that's now lived in by robots when these robots talk to you it looks like this pause okay what are we looking at doesn't this font feel techy and modern like it fits the world but why how well this font is actually considered to be something called Sans serap which means it does not have seraps seraps are the little lines that hang off the edges of your letters fonts that have seraps generally feel like they have age or wisdom to it since that's what physical books are printed with it's pretty common in Fantasy games since you want the text to feel more settled in so when you take away those seraps you get something that does not feel old you get something that feels modern and is the opposite of that Sarah feeling now the Fallout games are also pretty futuristic and modern but they use something called a monospace font which basically means that all the letters individually take up the same amount of space they're the same width it's pretty commonly associated with that hacker computer programmer aesthetic which is also what we see in the Fallout UI the use of brackets the green colors it works together beautifully it's great UI is its whole can of worms and when I talk about UI I'm referring to user interface which is basically any anything that's meant to give the player information but doesn't necessarily exist in the game world so things like a map your toolbar an inventory that's UI this right here is the UI for this super underground small game nobody's heard of called Hollow night you may notice here that a lot of the UI is based around similar styles of line work and shapes you have these long winding lines that spiral and sometimes come to a sharp little point we look at the title screen and this framing surrounding the name of the game right of swirls going around this crest of a bug you see the same aesthetic and Line work all over and it's even built into the physical world itself so how does this relate to the font that the game uses well notice two things here first off notice how the font is very sharp and it has these blunt seraps on the edge of the letters then secondly look at the line work and how it's kind of the opposite of that it's a lot of curvature and winding lines and it's very fluid because of that contrast your eyes are drawn to the sharp things but has this beautiful UI to soften it and complement it qu of the Lamb also does something like holl night where you have these more curved stylistic line work line Works surrounding a sharper serif font there's a reason why games do this and it's because that contrast is giving your eyes a buffer it's introducing the text on screen it's framing it and it's not framing it in a way that's competing for your attention it's framing it in a way that genuinely compliments it and it feels good to read and it feels nice look at the font and start ardu Valley boom this time it's the text box that has these angles to it and very sharp corners and then the font is what's quirky and kind of has more shape to it beautiful your eyes know what to look at here let's look again at the dialogue boxes in stray right this is a complete square of a text box and look at the letters what are they oh my gosh completely rounded at every corner in every letter you see how it was like a super Square so instead for a font we get a super rounded shape oh my gosh it's very pleasant to look at even if you're not consciously thinking about it and it's very cool from a design perspective at the end of the day our brain isn't actively thinking about the lack of seraps and stray and how that makes it feel modern it just feels modern in the same way that this feels friendly and this feels loud and this feels Southern and this one feels cute and dainty you see what I mean it's just a Vibes thing like the technical choices behind a font absolutely matter but at the end of the day especially with games you just have to ask yourself does this font belong in this game World Games usually have to answer this question with varying degrees of accuracy because a title screen that's read once is going to be more exaggerated and stylistic than UI or dialogue text that needs to be readable and fast look at the dialogue here in Hades the name of the Gods is this very stylistic Greek aged font it's very Majestic but then the text itself in the dialogue is much more subtle it's still reads as oh this is age this is important this is mythology but it's not the exact same type face because it needs to be readable you could also think about Skyrim right you probably think of that title screen font or this very runic iconic one but neither of those are actually that common in the game you see this is the title screen for Skyrim and then this is the inventory for Skyrim you see the difference in the font here Skyrim's UI design as a whole is truly iconic at this point mostly for bad reasons is it all text no visuals do I just have to brute force my way through this inventory yep you do yeah that's that's rough thanks for coming to my my TED talk I'm not done complaining now I want to look at an example where the font does not belong in the game world and that example is Celeste okay before you have my head on a plate I love Celeste Celeste is fantastic streamed it 10 out of 10 some of the most refined and fluid platforming physics I've ever seen it's great but I've always had a little bit of be with the dialogue the font feels so flat and basic which is kind of sad for a game as multi-dimensional and beautiful as celest it immediately stood out to me when I played it I thought maybe it's because it's kind of a more generic looking font so maybe it's recognizable but we have had pretty successful games out there that use basic fonts so why does it feel so out of place is it because it's a pixel art game with a non-pixel art font well no because look at Terraria Terraria is a pixel art game with a handwritten font you can't get more of a disjunction than that except with Terraria the font is integrated into the world you pick up an item you see the font you open your inventory you see the font you kill something you see the font you are always seeing the pixel art at the same time on screen as the font so it doesn't feel as jarring and foreign as it does in Celeste when you go from this fully immersive beautiful pixel art to all of a sudden flat looking words on the screen you have to let the player eyes warm up to two very different styles when it's something very smooth and then something very pixelated even with that though I think that a different type face just would have been better maybe a little bit smaller and can we fix the margins because what is happening with the margins dude see you have a dialogue box here that has a little middle marker with this little icon but then the font isn't relative to that it's going based off of where the dialogue like portrait is so you end up with text that's in the middle of nowhere and to a different margin every time you try read it that's a problem it's a big problem anyway love the game hate the font does not belong in the game world I could say the same thing about that subtitle font and Metal Gear Solid or this iconic sign from Silent Hill 2 this is Comic Sands in a horror game by the way that's supposed to be scary the remake of Silent Hill 2 actually makes fun of this though and you can find the comic Sand's font in the trash Canon game so that's that's kind of funny there's even this 2D version which wait a second what's this oh oh this is actually made in game maker today's sponsor I've worked with game maker a lot on this channel but it's for good reason because it is a fast and easy to ouse 2D game engine used to develop lots of well-known Indie Games he undertale was made using it okay so that says something even if you're a complete beginner like I used to be with very little coding knowledge I was able to pick things up online and make some pretty cool stuff game maker lets you make all kinds of games with a written or a visual scripting language and tons of built-in tools made to help you even game templates and pre-made asset bundles so you can focus on what's important to you not to forget that there is a truly Vibrant Community out there online for it so you're always able to get help when you get stuck you can jump right into making your own game by following one of their official tutorials they just put out this fantastic one for making a top down RPG game maker is completely free to use until you're ready to sell a game with it and even then it is a onetime fee so download Game Maker using my link in the description where were we Silent Hill Silent Hill has had a pretty interesting typographical Evolution over time particularly with its logo a lot of games will usually stick to the same type of font if they're doing a series so that you get that Nostalgia and emotional appeal but Silent Hill just wanted to try everything man I honestly wish that they had kept their typography a bit more consistent cuz it's usually pretty cool when you're able to get that Nostalgia memory feel when you play a more recent game cuz it reminds you of an old one it's kind of like if you have a book series and all the covers match or they're like the same style cuz that's what we see with Animal Crossing with Assassin's Creed with Fallout because we can so strongly associate an image to that game in our heads through the typography and that is pretty cool I might have bashed Celeste for its font a little bit earlier but for a typographical logo for an individual game it kills it dude it's literally a game about climbing a mountain so the fact that it's angled upward like the text is and then it's 3D it gives it so much depth and then there's snow on top of the letters because there's snow on mountains the letters colors even match the way that it's shaded on the mountain which is really cool just very cool design here and this arguably matters a lot more than the dialogue since this is like the marketing behind the game Nintendo games also do a really good job with iconic typog graphical logos you can think Animal Crossing Pokémon Zelda these games are actually super interesting because more times than not the logos will be so iconic so memorable but then the actual dialogue and UI font is surprisingly simple and unstylish so having a more generic font just makes that translation a lot easier there's absolutely cases like Paper Mario where you immediately think of this font but for the vast majority of recent Nintendo titles like breath of the wild this looks like helvetica the benefit benefit of this is that you don't read the font in a certain tone there's this meme that went around of like this water fountain oh god let's see if I can describe this there was this picture going around a while ago of this water dispenser and because the different words for water are in different fonts your brain will read them differently in your head the point is that the same thing goes for games I wasn't going to talk about undertale in this video but it's just the perfect example of what I'm trying to say because all the characters in undertale are named after fonts and they all act like caricatures of that font so Papyrus which is this font is very loud and boisterous and ra you know what I mean and then Sans has the Comic Sans meme vibe to him so when you read the more bland fonts in breath of the wild there isn't already an emotion attached to it like there is in something like undertale it's much easier to manipulate something neutral when you're trying to convey a wide range of tone than something that already has its own voice to it breath of the wild and I think tears of the Kingdom also use ATT Al in a lot of their fonts which I find interesting and I'm not fully sure what the purpose is there but I think it's just to further develop that neutral tone make it even more neutral you know make it read a little quieter more calm especially when you look at the atmosphere of breath of the wild you want it to read very calm very quiet obviously not the entire game but most of it the UI also lends itself to that Vision you know it's usually transparent backgrounds it's very quiet it's not the point of focus by any means this amount of rounding is the opposite of what like a pixel art font can do and we're going to talk about pixel art fonts cuz that's a whole cool thing you'd think that dealing with a very constrained space with pixel art when you're making a font would make all the words read the same way or all the fonts feel the same but when you see the variety of pixel art fonts that are out there oh my gosh could not be more false look at Eastward this feels clean real sexy look at stardo Valley look at kin seed and Fields of mistria right this feels friendly this feels welcoming and if you look close enough they even use these little gray pixels behind the font which is called anti-aliasing and that actually makes it look less pixelated from afar because it's making it look rounded and shadowed a lot of pixelar games do that and you probably don't think about it like if you look at the main menu on Minecraft if you were to get rid of the anti-aliasing pixels it would look like this it looks cheap it looks a little bit fugly and you probably didn't even realize there were Shadows happening there but anyway look at the font in Katana zero right this is colorful this is bold it's very loud it has noise to it and it's very stimulating my point here is that there is so 