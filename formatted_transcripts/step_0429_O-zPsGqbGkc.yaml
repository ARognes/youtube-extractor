transcript: hi my name's nick barker and this is a technical programming talk on something called the single source of truth principle and in a wider sense it's an exploration of what a source of truth is and how mistakes or errors with sources of truth are one of the most common causes of bugs in software so if you can understand the way that sources of truth work and when you're creating multiple sources of truth it will lead you to writing much higher quality software i think so just a summary of the talk if you don't have time to watch the entire thing the principle's very simple right it's just that you should only ever have one copy of mutable data as in data that changes data that you can modify right because if you have multiple copies of mutable data i.e multiple sources of truth eventually you're going to modify one of them and forget to modify the other and now you have a bug because you have data that's out of sync right one of the variables maybe contains an old copy of something you know there are a million ways in which it can go wrong it's worth mentioning that it is okay to have uh multiple copies of immutable data that is data that doesn't change but it's important to mention that it won't necessarily stay that way in the long run eventually at some point another developer or just you in the future is going to come along and decide that one of those pieces of data should change and now you have a bug again so overall if data's going to change you should only ever have one copy of it and that's one single source of truth right so just some background so we can kind of understand what the fundamental idea behind a source of truth is and why it's such a common cause cause of bugs uh if we look at an analogy in the real world if you've ever moved house before you'll know that it's a huge pain to have to update your address in all of the different places that send you mail you know banks governments um services delivery you know apps or services whatever you know i i actually have a pile of mail at home in a drawer in my house that i need to go and return to sender because it's been incorrectly sent to me when they meant to send it to someone who used to live at my address but since moved somewhere else right you've probably received mail if you've ever lived in a rental you've probably received mail that wasn't addressed to you because someone forgot to update their address you know it's a huge problem that affects basically everyone on earth and the reason that this happens is because we don't have a single source of truth for our personal data right we have multiple sources of truth that all these different services rely on and so we need to update all of them and eventually you forget to update one of them right conversely this is another interesting thing was with the concept of sources of truth sometimes we actually want multiple sources of truth right because say if i go over to my friend's house and we want to order pizza and i open up like a delivery app and i'm inputting my friend's address to order pizza i don't want that to become the single source of truth from my address i don't want my new credit card sent to my friend's house i don't want to be enrolled to vote in my friend's area right so sometimes we actually want multiple sources of truth and this is getting a kind of like a deeper problem which is like humans are very good at discerning when things look different but are actually the same and when they look the same when they're actually different right we're very very good at those those subtle distinctions computers are not good at that type of thing they're very literal and there are very clear rules about when things are the same and when they aren't right they don't have any of that subtlety just to illustrate the point you know if you give the two pictures on the top uh left to a child they'll probably be able to tell you that they're both dogs right they look very very different from visual perspective but they represent the same concept we understand that they're the same even though they look different whereas in the bottom right hand corner you'll see that there's four blueberry muffins and four chihuahuas right and we understand that muffins and dogs aren't the same thing even though they look very similar and this is you know one of a very large number of examples where ai tends to confuse things that look similar but are actually very fundamentally different from one another and this is what i'm talking about what it comes down to is when you're programming you have to remember that the computer doesn't understand that different memory is representing the same data representing the same idea right the computer doesn't understand that just because there are two values in two different places in memory that are identical it can't uh know that it has to keep them in sync for you right you have to manage that in your code yourself and that's where bugs come up so i'm just going to run through some well a lot of examples of source of truth bugs and hopefully you can start to see how pervasive these issues are and how if you carefully think about them and if you're aware of sources of truth it can lead to building better software so the first and one of the most obvious examples is the mistake of storing derived data right so when i'm talking about derived data all i'm talking about is you take some piece of data you perform some kind of calculation on it and you get a result right but the result is entirely dependent on the input right you get the same input if you get the same output if you have the same input right so in this case on the right hand side you can see we have a list of five numbers and we've calculated the average right the mean which is 4.6 so this is accurate right now but if we save the average if we save the derived data we've actually made the mistake of creating multiple sources of truth so there's a bug case obviously which is you add a new value to your list we've added seven here and we've forgotten to update the average right because we had multiple sources of truth we ended up with one of them becoming out of date or incorrect and you could say that this was a mistake from the developer or its operator error whatever you want to call it but i actually disagree i think this type of bug is inevitable with multiple sources of truth i think it's basically impossible to prevent this kind of thing from happening eventually right we can't rely on just like experts always doing the correct thing so how do we solve this problem in a way that we prevent us from making mistakes prevent operator error and the solution of course is calculating derived data on the fly we never actually save the average anywhere in memory instead when we need to use the average we provide a function that calculates the average on demand right and if we do this it means that the derived data is always going to be recalculated based on the single source of truth that's the important thing here we have a single source of truth around numbers and our average we can compute and then discard the value after we've finished using it and we can prevent any case of operator error in calculating the average here it's worth mentioning just as a caveat that sometimes calculating the drive data is very expensive say we had like 200 million numbers in our list we probably wouldn't want to recalculate the average constantly but that leads you down the path of having to do caching for performance reasons and we all know that catching is very hard there's an adage which is there's only two hard problems in computer science cache invalidation and naming things and i'm not going to go down the rabbit hole of talking about caching for a whole hour but i will say one of the interesting things that you might not have thought of is that the reason that caching is hard is because it fundamentally forces you to have multiple sources of truth the whole point of caching is that we keep multiple copies of the same data because uh the derived value is expensive to calculate or it's far away in the world and takes a long time to retrieve that type of thing it forces us to have multiple sources of truth and as a result we have all the bugs that come with multiple sources of truth so the next thing i'm going to talk about is absolutely fundamental to programming with modern programming languages i'm going to talk about the way that variables and values and references are passed around in code when they're copied when they're passed and if you work professionally as an engineer you will encounter this type of thing these mechanisms hundreds of times every day it is incredibly important to understand precisely how they work and when you can end up with multiple sources of truth and when you can end up with single sources of truth and i apologize this is going to be a little bit abstract and dry but it's really important to understand how each of them work so the first thing i'm going to talk about is pass by value right so most languages when you call a function and you provide an argument to the function that's a primitive value say a number for example the number is actually copied into the function right so you have two copies of your number right the copy outside the function and the copy that gets passed in as the argument as a result you might not have thought about this before but passing by value in this case copying the value into the function actually creates multiple sources of truth and this is a common bug that very new engineers can fall into if you have a look on the right hand side of the screen we have a function called increment which takes a number as an argument and increases it by one and then prints the value to the console right so lower down we define our value as one we call increment with our value and we can see that two is output to the console but then if we log our original value we can see it's still one right and that's because we have two copies we have two sources of truth this is one of the most obvious examples if you're an experienced engineer you probably very rarely make this mistake now but it's important to be aware that it exists and it is tricky for new engineers so getting a little bit more oh actually sorry um another thing to mention that's a little bit more obscure that you might understand intuitively but i might not have actually actively thought about is that pass by value is also used when we're putting uh values into arrays or into properties on objects for example so you can see i've defined a value of one here and then i've inserted it into an array and i've added it as an uh property to an object and then i've incremented my value you can see that the original value increases to two but the value in the array is still one and the object property is still one right in this case we actually have three copies because we copied the value twice uh to insert into our array and into our object so it's important to be aware of when we're copying these values and when we're creating multiple sources of truth the next thing i want to talk about is pass by reference right so most languages if you're passing something that's not a primitive value say an array or an object right we are actually passing a pointer into a function to that array or object right and as a result the function can actually access exactly the same array for example as the code outside the function we have a single source of truth for the address that our pointer is uh pointing to the memory of the array is our single source of truth right so you can see on the right hand side we have this you know generic kind of create config function all it does is take an array of values and returns you an object which has that value has those values attached right so we create our values array with one two and three we create a config using those values and then we call push on the values and we push the number four into the end of the array right because push actually mutates the array it modifies the data right you can see that the config values have changed as well right unlike the primitive value that was passed by value before we're passing the array by reference which means that inside the function we're referring to the same array as outside the function so we have a single source of truth here but here's a tricky part and this is something that even a lot of experienced engineers forget about or don't really understand the pointer that we pass into the function is actually passed by value right which means it's copied into the function so if we follow the pointer and mutate the array in this case using push to add a value to the end of the array sure we have a single source of truth but look at the last two lines right if we reassign our outer values uh array to a new something new what we're actually doing is we're modifying the values pointer to point somewhere else and see how the config values is still the old array it's not one and two it's one two three and four and the reason for that is the pointer was actually copied so despite the fact that we only have one at ray we have multiple sources of truth of pointers that point to the array we have two different pointers right and that can be a big source of confusion you know if you reassign your array to a different value you're not actually modifying the array or the pointer that was passed into the function then we have a third kind of scenario which adds another degree of complexity to the way that values are passed around and that's closures right so languages that support lambdas anonymous functions callbacks that type of stuff an increasing number of language support these languages support these types of things because functional program is kind of coming in so in this case all the closure is is a function and it's all the variables that it can see because of the scope that it was defined in right that might sound a little bit abstract but if you look on the right hand side you'll see what i mean see how we define value uh on the first line and our increment function from before now doesn't take any arguments right all it does is increments this thing uh this value variable so if it's not an argument how can it see the value variable it's because it's in a closure right the function was defined in the same scope that value was defined in and so it has visibility of our value variable right so our increment does the same thing as before it increments value and then prints it out and you can see here if we call value and we increment value right we get two right but then if we reassign our outer value outer value to five right and then call increment again we get six right and it's because our outer value and the the value being referred to inside increment are precisely the same thing it's a true pass by reference in this case so we don't have a copied pointer or anything like that so if we were to assign our outer value to you know undefined and then we call increment we would get either an error in some languages or you know bizarre behavior in something like javascript um so yeah that's something to think about as well you have passed by value pass passing references by value as in copying the pointer and then you have closures where you actually have a really the same source of truth um and it's worth mentioning you know as an aside here there is a special place in hell for any the person who decided that javascript should have a mixture of mutate in place and copy and return style functions and what i mean by that if you look on the right hand side we have this process elements function right and it takes an array of elements and all it does is it pushes 5 to the back of the array and then sets elements using this concat function which essentially just sticks two arrays together so you can see we call we we define our array that has elements one and two and we call process elements we push 5 to the back of the array and then we set elements with this concatenation with this other array that just has 10 in it and you can see there that elements is now 1 2 5 10 right but if you look down the bottom you can see that our outer elements array is one two and five right and the reason for that is push mutated push followed the pointer and mutated the memory there so it's it's referring to the same array whereas when we called concat we reassigned we we had to reassign the elements uh variable because concat makes a copy of the array and returns it right so now we have two different arrays so i've seen countless bugs with people misunderstanding uh mutate in place versus copy and return these two different styles and one of the reasons that this happened is because we have this long long-running fight between object-orientedness and functional programming you know in functional programming you know people often think oh you should be always making a copy data should be immutable you should make a copy whenever you want to change it whereas in object-orientedness you know you want the array itself to have a state and be able to mutate itself with functions you know um there's a lot of different stuff going on but i think the main thing is you just want to try and maintain a consistent style so i know that seemed like a lot and in terms of the solutions to creating bugs accidentally by misunderstanding past by reference past by value that kind of thing there unfortunately isn't really a solution the only way to protect yourself against accidentally creating multiple or single sources of truth erroneously with the variable mechanisms in programming is just to really understand how they work it's incredibly valuable to deeply understand how your language of choice moves values around where it copies them where it uses a reference where it copies a reference that type of thing take special care with function arguments closures and anonymous functions they're very easy to shoot yourself in the foot with and one last little tip here one thing that can really help is just adopting a consistent programming style so when i said that there's a mixture of mutate in place and copy and return in javascript you could decide to only use one or the other of those things and that way you wouldn't accidentally mix them together and create an unintended multiple source of truth bug so pointers are a wonderful way to create these types of bugs and i'm not going to go all the way down the rabbit hole on this because there are some fantastic talks you know lectures articles about all the ways that you can screw yourself over with pointers um but i just uh want to point out um that languages like cnc plus plus allow you to use raw pointers right which are just unsigned integers that point to an address in memory and you might not have thought about this before but as soon as you have multiple pointers to the same data you have multiple sources of truth and as a result you have all the bugs that can occur as a result of having multiple sources of truth right if we think back to the analogy about moving house that i made at the beginning of the talk this is exactly like that right a pointer is essentially an address and you know one of your pointers runs out of space because it's a string or it's an array and it needs more length or something and it reallocates yourself it moves house and now one of your pointers is pointing to the wrong address it's extremely easy to create bugs in this type of situation um so there are a couple of solutions you know that have been attempted you can use smart pointers which are like a wrapper around pointers so you can access pointers indirectly you know you can update the pointer internally without having to update all of the places where it's used you know they can keep track of the number of references and automatically deallocate the memory for you that type of thing you can use in-memory databases or some approach like that where instead of storing a pointer to an object you instead store like an id and you use that id to look up the object in an array or in a in a data structure that type of thing there are alternate memory management approaches that allow you to do low low level memory stuff without necessarily using uh raw pointers um raii is common thing in c plus plus and the rust borrow checker is like a different type of attempt to fix some of these problems without having to expose raw pointers and all the bugs that comes with that but the main thing to just remember here is again you might understand that two pointers are supposed to be the same they're pointing to the same thing but the computer doesn't right the computer has no idea that two regions in memory just because they have identical values it doesn't understand that they're supposed to be the same so remember that you have a lot of context that the computer doesn't and you have to be aware of when you're assuming something that the computer doesn't know and the last big thing that i'm going to talk about in terms of sorts of truth bugs is the rise in prevalence of stateful libraries right and i think this is actually one of the biggest drivers of bugs and decline in quality in modern software so [Music] programming you know in the modern world relies on like thousands and thousands of libraries if you've ever worked in front end web stuff you'll know that it's a meme that you have a 10 gigabyte node modules folder for an application that has like 2 000 lines of code right um and one of the reasons for this is that there are some tricky things that have been uh mostly figured out and wrapped up in libraries like networking and graphics reasonably tricky to re-implement yourself from scratch if you don't understand how they work and they can you know be used in a bit of a generic way um and so all that stateful libraries are right is libraries that include uh that create some long-lived memory and hold onto it themself right so they have some internal memory that they use to manage their state and you don't necessarily get the same result every time you call a function right you might call the same function twice and get different results because internally the library has some memory that it's using to keep track of its internal state it's totally possible to create stateless libraries that only expose pure functions that is they always do the same have the same output uh given the same input and they don't have any side effects more and more libraries and apis these days are stateful they they include this whole blob of memory on their side that you don't necessarily have access to or the access the the api that you use to access it is very poor and this kind of thing almost by definition leads to multiple source of truth problems right you end up always needing to duplicate data in your user code that exists somewhere in private inside the library and i'm going to demonstrate a couple of ways that that has had an enormous effect on on the quality of of software overall so the case study that i'm going to use is the way that the browser works right so inside the browser there's an api that we use to drive the graphics display things on the screen that's called the dom or the document object hierarchy the document object model rather it's a stateful hierarchy of node objects so it's a big tree you've probably seen it represented as html so you have an outer html tag inside that you have a body inside that you have potentially a whole bunch of different tags of divs and titles and whatever so you essentially mutate this giant stateful object which is stored in the browser and those mutations that you do cause images and shapes and text and things like that to be rendered on the page and i think one of the reasons that the browser has been so incredibly successful as a programming model is because it's so accessible right as a brand new developer who's never done any programming before it's quite a thrill to be able to go to google.com and to type document.body.style.background just you know mutate the body um background and set the color to red and you know watch google turn red that makes you feel very powerful that you're able to modify things in front of you and see the visual result you know we love doing stuff that has instant feedback and i think that's one of the reasons why the browser has become very successful as a way for programmers to get started but here's the huge problem the browser as we know it and as we build front-end applications in it these days is actually fundamentally non-fit for purpose and the main reason for that is because the state of the dom is almost by definition all derived data right and if you remember that earlier on in this talk i was i was mentioning how saving derived data is a way to create multiple sources of truth and you end up having bugs because you forget to update your drive data right the the browser forces us into this model by design so i'll demonstrate how that kind of thing occurs like say you know our horrific bright red google page that i should showed you before imagine for some reason google decides to that they want to use uh this kind of style whenever there's a server error so if you type something into google.com and press enter and you know one of the servers is down they want to turn the background red right here's the problem in order to do that you need to mutate an object that's stored inside of this stateful library inside of this stateful api which is the dom you need to mutate the background and set it to this red color but the problem is you almost certainly want something in your code that tells you whether there's an error as well right because you might want to do something like disabling the buttons or displaying a error message or sending some analytics event somewhere saying there was an error and you can probably start to see where the problem is here now right we probably want even if we had just like a page error boolean right in our code on google.com and that can be true or false so if we have we can see we can make a if statement here if there's a page error do some stuff right send it send an error event to some analytics service you can see the problem right we can set page arrow to true and we can set page error to false that doesn't have any effect on the document background color right these are multiple sources of truth we have to remember whenever we set the page area to true to set the background color to red and we have to remember that if we set the page arrow back to false we have to set the background color back to white this is creating a classic situation for operator error or for for a programmer to create a bug and you might think okay well we have multiple sources of truth how could we reduce it to a single source of truth well the dom doesn't provide us any other way to make the page background red so i guess maybe we could try and rely on the data inside the stateful library instead of having our own version of the data and as i mentioned before often the apis to do this are terrible right so imagine if instead of an if statement that says if there's a page error do something right you went you're looking through the code on google.com you're an engineer at google and you see this if statement which is like if the document has a red background do some stuff that's crazy right no one writes programming no one writes code like this um not only is it impossible to understand for new engineers but you have this other huge problem of like you know what if someone has a browser extension installed because they're color blind and it changes all of the bright red to some other color right suddenly your error handling code doesn't work right this is it's crazy it's not possible to expect that we would rely on the badly uh well not badly rely on the data that's not fit for purpose inside the stateful library just to try and get to a single source of truth and so we create multiple sources of truth and then we have bugs another kind of classic example in web applications if you've ever done this type of development you know you have an array of products that you return from server or something like that and you have the products displayed in the dom you know so you call render products and it inserts you know three divs with three bunches of text inside them this is multiple sources of truth immediately if you remove an item from your products array it's not going to remove it from the interface if it gets removed from the interface it's not going to remove it from your products array operator error will happen and your ui will get out of sync with your data it's worth mentioning like if you're not convinced by this argument that react angular view all of these declarative rendering libraries you know some of i think react is probably the most starred project on github right or at least it's close right declarative rendering was literally invented to solve this multiple sources truth problem in the dom right it was literally invented to provide a guarantee that the data on your side in your code would always be represented correctly in the ui right they refer to it as ui as a function of state but what it really is is ui as derived data and this is speaking as someone who has worked you know extensively with react professionally for five or six years now right um the way that react works is that exactly as i mentioned at the at the beginning of the talk about derived data right instead of saving our derived data we provide a function that allows us to calculate the derived data on the fly so you can see here we provide a function called create body you know and it returns the actual body tag with the background set to either red or f or f or white red or white depending on whether there's a page error or not right and this seems sensible and it seems you know when i first discovered react i was like this is genius i'm so glad that we can do this now because i was implicitly feeling the freedom from that multiple source of truth problem but the insane thing is here that react wouldn't even need to exist if the dom was designed to actually uh designed correctly so that it would allow you to have a single source of truth without having to build an entire framework for interacting with the dom right we see this as a really cool solution but it's a solution to the wrong problem in my opinion um and so it's interesting to think about like okay well if the dom is so fundamentally incorrectly designed like why is that the case well remember right at the beginning of the talk one of the first things that i said was that it's okay to have copies of immutable data data that doesn't change but they won't necessarily stay that way in the long run right remember the reality is that the dom was not designed to be mutated right javascript didn't exist when we first created the dom we had html and css and there was no way to actually run scripts inside the browser it was designed as a way to pass visual documents from a server to a client and so the way that we used to do stuff was you would access a page online and a server would generate the entire page in the correct state from scratch and send it back to your browser and then when you clicked a link to a different part of the site your entire page would be wiped and the browser would regenerate a whole other page from scratch and send it to you right this model meant that the dom was immutable right because you never changed it you only deleted your current uh copy and requested an entirely new copy that's how you made changes right so we never had to deal with the concept of mutation mutating a document is a new thing got brought in by javascript and and has evolved into this insane beast that it is now so it's really interesting to understand that this was not necessarily any one person's fault it's just like this is kind of the folly of adding incremental features without thinking about when that new feature is breaking some fundamental promise or assumption about the way that the architecture was designed in the first place um it's it's fascinating to me to think about how these historical decisions have cascaded because we're spending you know millions of human hours doing you know huge complex projects in react and not really thinking about the fact that all of it you know we could potentially significantly reduce that if we had not bolted on this inappropriate model on top of something that was designed for something else so in conclusion there are a couple of important things to remember when well i put five here um a few things to remember when you're dealing with single and multiple sources of truth the first one is the most important that's knowing what data you actually have recognizing when something is saved to memory and what that data actually represents are there two things in your data that are the same if so try and combine them together and reduce them down to a single reference right second thing be aware of derived data sometimes derived data doesn't look at all like the source data but you have to be aware of data dependencies when one piece of data directly depends on another right try not to save the derived data try to calculate it on the fly if you can be aware of all the rules around pass by value parts by reference closures variable capture that type of thing because it can bite you in surprising ways when you think that you have a single source of truth but you actually have multiple or the other way around the fourth thing is just really beware of stateful libraries be aware when a library that you're using is storing some memory and doing its own kind of calculations on that internally what you want to always aim for is libraries t