transcript: a great app ui is one that minimizes the friction between a user and its functionality an excellent way to reduce that friction is to highlight and showcase the parts of your app which are integral to its usability this is particularly handy when a user launches your app for the first time or when you update the app with some new features showcase view is a customizable and simple to implement package you can use to show your users around the most important features of your flutter app [Music] hello everyone and welcome to risocoder our goal here is to provide top level education and teach you the skills needed to become an in-demand flutter developer don't forget to subscribe and hit the bell icon so you don't miss a single video let's get started first let's take a look at the app we're going to build when we restart our app our showcase will start the showcase will highlight pre-defined widgets in our app and display either a tooltip with a description a tooltip with a title and a description or a completely custom widget next to them when we tap on the screen we're taken from one widget to the next until there are no more widgets to be showcased we can also hit this gear icon here to be taken to the settings page where we have yet another showcase we can tap here to end it and go back to the home page we can also start our showcase by hitting this help icon here and there's one more thing we can do when we're in the middle of the homepage showcase we can hit this gear icon run through this showcase go back and now our homepage showcase starts right from where we left off in this tutorial we're going to be working with a starter project that way you don't have to worry about setting up any of the ui and can just focus on implementing the showcase view package however let's still get familiar with the starter project so that we're not lost along the way this is our starter app it is a demo water tracking app that doesn't really have much functionality 