ion will run now we also have an auto play parameter right here which by default is set to false but if we set it to true we don't actually have to tap through all of these widgets in the showcase they will instead be displayed automatically if you are setting the autoplay to true you can also mess around with this autoplay delay right here which by default is set to 2000 milliseconds but you can change it to whatever you want depending on how much time you want to pass between every widget transition all right we're pretty much all done here so let's save it close it up and move on to the home page before we finally go ahead and implement the individual showcase widgets like this one we're going to do one more thing and that is for every widget in our showcase we need to have a individual global key we're going to use these global keys to communicate to this main showcase widget in our main.dart file which widgets in our home page we want to be have as part of the showcase and also in which order so our homepage is going to have three widgets we want showcase so let's create three global keys we're gonna say final key one global key and we can just copy this down and change one to two and two two three awesome now let's move on to making our first showcase widget and first widget we want to be displayed is this settings icon right here so let's go to the app bar actions and this is where a button is now we don't want the showcase to highlight the entire button itself we only want it to be focused on this gear icon here so we're going to wrap the icon with a widget the widget is going to be showcase and make sure to import the showcase view package here as well now the showcase has a few required parameters one of them is key and here we're going to provide our key one that we just created because this is the first widget we want displayed in the showcase also we're required to provide a child and we're doing that here already and lastly we need to provide a descrip