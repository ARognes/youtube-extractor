transcript: |-
  A first experiment blending handpan with a compact modular setup, layered with a field recording captured in the French Alps this winter, as the sun dropped below the mountains and dusk took over. The hang drum was a gift from my brother, brought back from the US, and this is my first time playing with it. What you'll hear is deliberately simple. I'm uploading it as a starting point rather than a finished piece, because there's something genuinely interesting about pairing something as acoustic and resonant as a handpan with a generative modular system, and I want to keep pushing this combination further.

  Perfect for focus, meditation, or slow evenings.

  Patch Notes

  1. NOH Pianist drives Chord V2 by Qu-Bit, cycling through a slow minor chord sequence.

  2. Pam's Pro Workout modulates the Chord V2 wavetable while also sending a quantised looping sequence to the lead input, blending harmonic control between the Pianist and a generative lead line.

  3. Both the chord and lead voices feed into a loop via the 1U mixer.

  4. In parallel, the hang drum is captured with an Ensol microphone, amplified through Intellijel Amps, and brought into the same mixer alongside the modular voices.

  5. The full mix goes to the TX-6 by Teenage Engineering, which handles the final blend. A separate stem of the hang also feeds directly into the TX-6 for more control over the acoustic layer.

  6. The mixer output passes through Ghost by Endorphin.es, where a slow LFO sweeps the filter cutoff, a little delay is added, and a sidechain from Pam's Pro Workout introduces subtle movement.

  7. Everything then hits the Strymon Starlab, mounted in a 3D-printed standalone mini rack, set to a dense diffuse reverb that ties the acoustic and synthetic elements together.

  8. The final mix is captured from the TX-6 onto the TP-7 by Teenage Engineering, and blended with the alpine field recording captured on the same device.

  The field recording brings a stillness to the piece that suits the handpan well. The sound is a little more resonant than ideal and the playing is basic, but the combination of acoustic instrument, modular system, and mountain ambience feels like a direction worth developing. More to come.

  A blend of handpan, modular ambient, generative textures, and alpine field recording, great for deep focus, meditation, or letting your mind wander.

