transcript: '{"content":"\n[0.0s] If I have a patient who has a very\n[2.36s] strong external locus of control, this\n[5.44s] is a big problem. So, what is external\n[7.36s] locus of control? When I have a patient\n[9.04s] who comes in who says, \"The things in my\n[11.6s] life happen because things outside of me\n[15.08s] control my life.\" So, that''s an external\n[17.36s] locus of control. Where is the center of\n[19.6s] control in your life? Is it this is\n[21.24s] society is this way, your boss is this\n[23.84s] way, your parents are this way, your\n[25.52s] wife is this way, your husband is this\n[27.08s] way? Does the patient feel empowered or\n[29.36s] they just a victim to everything going\n[31.68s] on around them? A lot of people think\n[33.12s] that therapy is about talking about your\n[35.2s] feelings. So, you come in and you talk\n[37.16s] about, \"Oh, this person did this and\n[38.48s] this person did this and I feel this way\n[39.84s] and I feel this way.\" And there are\n[41.68s] forms of psychotherapy that are like\n[44.48s] that. So, something called\n[46.48s] supportive psychotherapy is an example\n[48.88s] of psychotherapy that''s just supportive.\n[50.64s] So, patient comes in every week, you\n[52.24s] just try to do your best to support\n[53.88s] them. Now, sometimes this is what people\n[55.92s] need. Like, if their life is genuinely\n[58.0s] falling apart and they have nowhere to\n[59.72s] turn to, they just need one place to go\n[62.04s] for 1 hour a week where they just vent\n[63.96s] everything out where we''re not working\n[65.88s] on what what''s your responsibility,\n[67.56s] we''re not working on what to change.\n[69.32s] They''re just carrying so much weight\n[71.76s] that they need to unburden it some. They\n[73.84s] need to vent some. But for me, when I\n[75.72s] work with people in their emotions, the\n[77.36s] goal is to decompress the emotion so\n[80.44s] that the emotion no longer clouds your\n[82.68s] thinking. And then you should be able to\n[84.64s] see the situation, right? So, yeah, this\n[86.92s] person you got get this person a gift\n[89.28s] and they never give you a gift and that\n[91.36s] hurts. You feel angry, you feel\n[93.56s] frustrated, so be it. Right? Like, let''s\n[95.68s] get those emotions out."}'
