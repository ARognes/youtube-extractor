transcript: Hey, so I don't give a [ __ ] if it's been painted, cooked, danced, filmed, photographed, built, sung, sculpted, or written about. It's been done before. It's been done before. It's been done before. But not by you. But that's not what people tell you when you're in your 20s. Or at least not when I was in mine. And funny enough, what I'd tell myself then are still [music] the lessons I need reminding of now. The time will pass anyway. Do it scared, unprepared, doubtful, raggedy, with applause, without applause. Do it in the summer of your life. Do it in the winter of your life. It does not matter. For how far has your hesitation, [music] your shyness, your shame gotten you? What good is tracing your mistakes until you've memorized the grooves? Don't waste more time trying to hide your missteps and use that energy to take another step and another and another. All of the most meaningful things in your life will be a byproduct of compounded effort and care, of watering [music] and tilling the thing when no one is watching. Devotion to that which you deem worthy, regardless of how long it takes, will prove more useful than any accolades. Their permission is not a prerequisite. Their praise and approval isn't a necessity. You can start where you are with what you have. You can change your mind, your philosophy. You can [music] pivot and pilot and pursue. You can scream and sever and disappoint. You can proceed without well wishes and understanding and not shatter into a million pieces. Nothing will be yours until you allow yourself to declare it. No real door in your life truly unlocked until you realize you have the key. That you are the key. Don't go to the ocean of your life with a teaspoon or a thimble or a bottle cap or any other tiny [music] objects other people may hand you. And it won't just be from strangers or society. It'll be from people who care for you deeply and still can't [music] help but pry open your palm and say you can't be this, do this, take this, [music] take what little you can of your life and drink. In love, in work, in health, [music] in friendship. I would tell 20-something-year-old me to toss those tiny objects one by one. Return to the ocean of your one wondrous life and submerge. What advice do you wish you received in your 20s? Cannot lie, y'all. You could not pay me to go back to my 20s, and that's not to say there weren't amazing times, life-changing moments in [music] that decade, but I do think that that few decades are more trial by fire when your frontal lobe is still being developed. Of course, there's a million pieces of advice I I would give my 20-something-year-old self, but I think I know her. I know her very well. I know that she did not need to be told even more what to do and what she should do and exactly how she should follow it. I think she just needed affirmation >> [music] >> and for her desire to walk her own path to just [music] be met with like, do that [ __ ] Do it. Do it. Do it. Do it. Because I just turned [music] 36 this month and I was just 26. It goes by ridiculously fast. I try to be that annoying voice to the 20-somethings in my life because you should fail and fly and leap [music] and succeed and try at whatever it is you deem worthy and know that that is going to change. I really wish I would I was able to give her the encouragement that she's given me, that she's provided me. [music] I really wish I I could do that for her, and maybe I am in some way shape or form, multiverse, you know. I think this is this is specific. You know 20-something-year-old you, right? And what advice they needed to hear. Can't wait to read your answers to this one of of what advice do you wish you received in your 20s. All right. I'll see you on the next one. I'm just excited to see what the future holds. I'm sitting here at 10:34 a.m. on August 10th, 2018. Like you are unstoppable. You. You. You're unstoppable. And what makes you unstoppable is the fact that you start. Now play that back. Love you. >> Whisper had told her who she was, my only one. But it's too late. It's too late. She's gone. It's too late. She's gone now. I know she's [music] gone now. It's too late.
