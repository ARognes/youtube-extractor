transcript: Hey guys. So today you and I are going to talk about AI. So let's get into it. So the question in question was, "Hi Frederick, would you say that AI has sped up your software process significantly?" Software development process I would say. So I would say that now depend it depends a little bit. It depends a little bit. But if if we take uh one of the recent projects that I made for my company, I I'll explain sort of what how I managed to to do the thing I was doing. But I think that based on like some rough, you know, don't quote me on this or anything like that. I think my personal productivity had gone had went gone up by like hundreds and hundreds like several times in comparison to how long it would have taken me to write a lot of the code that I did by myself. And so the thing is though it depends on what you're doing or like at least what I am doing because as I like to say we have a few I have a few um stakeholders who seem to believe that AI is just some like a spice that you just sprinkle in and all of a sudden everything is faster and for some reason they can't understand that if I use an AI then it's going to take a certain amount of time and then if some of my co-workers or maybe like or you or them they themselves are using it then it's going to take a different amount of time and I try to explain it to them like this it's an AI is a tool that helps your productivity it's a little bit like a calculator depending on who's using the calculator they they're going to get more like more done than of course then if you are a person who's just sitting and doing you know pen and paper calculations or something like that but you still need to know how to use the calculator and know your math and you know all sort sorts of stuff, right? To get the results that you're looking for. So, it has the potential to increase your productivity. Not always, of course, but depending on the individual and depending on the task, it can increase your speed by a lot. I'll give you a few of the tips that I have used in order to get those sort of really high returns on investment. So my manager the other day actually asked me about like how's thing has had been going in the project that I had been working on and I explained to him that we had a strategy that worked pretty well I would say that was very AI friendly and I showed him how we could build like a new you know a new REST API in just a few minutes while he was watching basically. And so the way that I explained it to him is that the way that I design a in this case a rest api is that I make a a basic um a basic architecture. So for those of you who have never built a rest api, you will probably not have heard this, but we have something we call crowd operations. Create, read, update and delete operations. Now those operations are usually in some format part of any rest API that we are going to create. Now the thing however is that for most software developers what they will do is that they will create APIs based on whatever specification they have at the moment. So in other words, you might have certain APIs like say for users and products or so forth and so forth where maybe they just include the get getting a user or listing a bunch of users or so forth and so forth and then in another API endpoint or another API they include updates and in some case they don't and so forth and so forth and the approach that I take which what when I do AI development is that I say to my co-workers and so forth we're going to support at least the basic crowd operations. Sometimes I omit the update and so forth, but that's basically what I'm saying. Now, the basic idea here is that what I want is for those very simple operations that are going to be for every single client that you're ever going to deal with is going to need them to some degree. Especially if you have like a front-end team or something like that, they're going to be able to need to often create data, list it, you know, update it, stuff like that, right? And then what I do is that I create one instance of an API. So for example, let's take the users API. And now I create it with those endpoints even though I may not need exactly every single endpoint immediately. And the reason being because now I can give the AI a very simple to follow template for how to implement the next API. And that's what I told my manager. That's why I was saying that let's pretend now you and me that we're going to create a new API and because we know that at the very least we're going to use the same basic template for how that API is going to work because we already have an implementation that follows that principle and then all the other APIs that I've created over the time I mean the product is gigantic. We had like I think we had 40 API and like over 300ish endpoints like calls that were being made in the system and they were all cons all consistent every single one of them and due to that they were consistent. It was very easy to like I mean it took me seconds to just you said tell the AI give give it the prompt and say I want a model for prices and the fields are going to be you know amount and unit or something like that use this folder which has a bunch of other APIs as reference and then generate the code and I mean it I can't I can I can't keep up with that like that's insane how fast it solves that problem. The other trick that I add on top, which is the thing I was telling my manager, I'll give you the same suggestion. I think I've mentioned it at some point in some video and another. Another thing that I'd like to do is that to because as you can imagine, even if the AI has a lot of reference material and or you have like rules files or definition files of what you want it to like what principles it wants to follow, there is something you can do that is slightly better and that is to use the AI to create custom llinters. Now me who's old and gray and so forth, I actually took the time before we were using AI to learn how to work with a like abstract abstract syntax tree and how llinters are working and how programming languages are evaluated and all this good stuff that you need to nerd to be a little bit of a nerd to to do if you're interested in making programming languages or llinters. And I was doing that even before AI but now it's even easier so now anybody can do it. I mean I have in that project I think I have had 130 custom lint rules. The reason why I want them is because that way I can create the feedback cycle for both for humans and when they want to merge like pipeline stuff or so forth, but also for the AI because if I have a lint rule saying for example that the AI is making a mistake in the way it names URLs or that it forgets one of the endpoints or something like that and I have a custom lint rule saying that every controller has to have a create, list, get, delete and update method and if that actually shows up to the AI like then it selfcorrects itself and that is what this my manager was pretty impressed with where because I could tell him that it instead of me sitting there reading through everything after I mean I will of course I don't just merge stuff without checking what the AI has written but it becomes more efficient because because of the linting it fixes its own mistakes because mistakes are going to be made both by humans and by AIS But when you have such a cookie cutter setup, the AI will be a lot faster because it's basically just boiler plate every single time with a different data, a different data model. And that is what's so nice about it because once you have that set up and you just have the mindset of some you know how for example TV like your your your network networks are using for like television and stuff like a cable TV and stuff like that. They ship you an unit and a box of you know you technically you can have all the channels right and then they lock away the stuff that you're not supposed to get because you're not paying for it but the unit itself has support for it. The same basic setup here because if you have too many permutations or if you have like you know messy code bases where like one API works in a completely different way from another because different people were working on it. If you just take the time to write some basic lint rules and then come to this understanding that if you just keep the API very very like consistent then the AI is going to be able to do a really really great job usually. So what I want you to take away from this is that for specific situations like developing new APIs or things like that if I just measure like I mean I can't even estimate it. It's like night and day. It's so so so much faster. It's not very fast when it comes to certain things where like you know in some cases like honestly guys I found myself do the dumbest thing ever sometimes where I sat and I was trying to get the AI to rewrite a bunch of references in my files and then I realized that here I've been and it's been failing now for an hour and for some reason I didn't think of that you know I still have certain and replace in my in my editor. I could have just done that and that would have been easier. So, honestly, it's a little bit dangerous because some of the stuff becomes so simple that I start going to the AI before I start thinking about is this faster to just doing do by myself. But for that sort of stuff I was talking about where it's like boily plate stuff, you're going to create a new API with a different data model so if you follow those trips I gave you, you hopefully will see like an enormous difference in how fast you can be because I mean guys something that I mean it's the same thing for testing. Same deal there. If it's literally exactly the same API every single time with the basic setups and it's just different data models, then I challenge you to be faster. like uh I know how to be faster in theory than the AI in those sort of situations, but it's still like it requires a lot more work than if you just ask the AI to basically take your reference and just say, hey, use the same setup, use every single like all the patterns and the name conventions and everything like that, but just use different type a different type of data model and add some limiters on top and then it's probably going to be even faster and be even more accurate than if you just tell it to copy what it's seeing. Cuz with the llinters, it can fix its own mistakes. Have a great day.
