transcript: '{"content":"\n[35.86s] Tribalism is broadly defined in neutral terms,\nas the state or fact of being organized in tribes:\n[42.12s] social groups sharing common\ninterests or attributes.\n[45.4s] The word \"tribe\" is often used in a positive way\nto describe supportive communities.\n[50.46s] Individuals from abusive environments are\nencouraged to \"find their tribe\":\n[55.04s] to find others who, like them,\nreject abusive relationships.\n[59.26s] But tribalism''s also taken on another meaning,\nreferring, typically in a negative way,\n[63.86s] to behaviour and attitudes that stem from\nstrong loyalty to one''s own social group.\n[68.94s] Group biases have been studied by\nsocial psychologists for decades.\n[72.76s] In the 1960s, researchers proposed two main\nexplanations for group discrimination.\n[77.9s] They suggested it arose from\npre-existing competition between groups,\n[82.04s] or as an irrational attempt to find emotional\nrelease by scapegoating others.\n[86.94s] But in the 1970s, Henri Tajfel found that\nneither of these causes were necessary.\n[92.22s] All it took to create discrimination was\nthe act of dividing people into groups.\n[97.12s] He took 64 teenagers from the same school,\ndivided them into two arbitrary groups,\n[102.2s] and asked them to assign\nmonetary reward points\n[104.92s] to anonymous members of\ntheir own group and the other group.\n[108.22s] Awarding others instead of themselves\ntook away direct self-interest.\n[112.92s] Not only did subjects assign more money\nto their own group than to the other group,\n[116.7s] they often maximised\nthe difference in rewards,\n[119.5s] even if it meant their\nown group received less.\n[122.12s] For example, rather than give 15 points to an ingroup\nmember and 10 points to an outgroup member,\n[127.44s] They might give 11 points to the ingroup member\nand 1 to the outgroup member.\n[132.22s] So, there was no self-interest, no meaningful\ngroup identity, and no pre-existing conflict.\n[139.08s] Being from the same school,\nthere was a fair chance\n[141.32s] some anonymous out group members\nmight even be close friends.\n[144.56s] But the overriding instinct was\nloyalty to a random group.\n[149.12s] In his book, Moral Tribes, Joshua Greene\nexplores this tribalistic response,\n[153.78s] in relation to the problem of cooperation.\n[156.46s] Greene cites ecologist Garrett Hardin''s\n‘tragedy of the commons’ problem,\n[160.9s] in which some self-interested herders\nraise livestock on a common pasture.\n[165.44s] To maximise their own profits, they\ncontinue to increase their livestock.\n[169.64s] Eventually, the pasture succumbs\nto overgrazing.\n[172.68s] The grass goes, the animals die,\nand the herders are left with nothing.\n[177.52s] Hardin''s thought experiment\nillustrates how\n[179.62s] individuals who act only in their own best\ninterests can all end up worse off.\n[184.54s] Greene frames morality as a set of\npsychological adaptations,\n[188.3s] that allow otherwise selfish individuals\nto reap the benefits of cooperation,\n[192.4s] aligning individual interests\nwith group interests.\n[195.52s] He illustrates how a range of elements in\nour common human emotional apparatus\n[199.92s] encourages cooperative behavior.\n[202.4s] We feel empathy, gauging the experience\nof fellow group members,\n[206.24s] not just in some abstract way,\n[208.02s] but actively simulating their feelings and sensations\nin our own brains, from pain to pleasure.\n[214.5s] We feel loyalty towards fellow group members,\ninspiring us to help and defend them,\n[218.8s] sometimes at significant cost to ourselves.\n[221.56s] We feel guilt when we assert our own self-interest\nagainst the interests of fellow group members.\n[227.24s] On the flip side, we feel contempt for members\nwho behave selfishly at the expense of others,\n[232.64s] like freeloaders, who exploit the group''s\ngenerosity without contributing.\n[237.64s] These and other reflex emotional reactions reinforce\ncooperative behaviours that lead to group benefits.\n[244.3s] Further reinforcement comes\nfrom concepts like reputation.\n[247.3s] As social creatures, we''re highly attuned to information about trustworthiness.\n[251.68s] A trustworthy reputation can carry great social value\nin helping to forge cooperative relationships.\n[257.2s] And, a reputation for consistently punishing\ntransgressions against the group\n[261.28s] can discourage uncooperative behaviour.\n[264.54s] When reputations are damaged, the concept of redemption allows people to repair them,\n[269.64s] opening a path back to the group, and restoring\nthe win-win of mutual cooperation.\n[275.1s] Tribalism arises from our attempts to distinguish\ncooperative strangers from non-cooperative strangers.\n[281.7s] To help make that distinction, we develop social indicators of shared values:\n[286.18s] indicators like social rituals, language, clothes.\n[290.34s] We hunt for those indicators in others, and\nadjust our behaviour towards them accordingly.\n[296.52s] So, the same processes that facilitate\ncooperation between group members\n[300.56s] also create sharp divisions between\nmembers and non-members.\n[304.7s] This leads Greene to an important qualification:\n[307.4s] morality didn''t evolve\nto promote universal cooperation.\n[311.62s] Our moral brains developed to align\nthe individual with the group,\n[315.16s] but left us with the higher-order problem of\n‘the group versus everyone else.’\n[319.54s] We moved from ‘me versus us’\nto ‘us versus them’.\n[324.0s] Expanding on Hardin''s\n‘tragedy of the commons’,\n[326.38s] Greene presents\n‘the tragedy of common-sense morality’.\n[329.94s] Instead of individual herders, we have individual groups,\neach with its own ideas about cooperation.\n[336.98s] Group 1 thinks land should be\ndivided up into plots.\n[340.22s] Members have total freedom\nto use their plot how they want.\n[343.56s] Herders who prosper through hard work\ncan purchase neighboring land.\n[347.58s] Herders who are lazy or foolish, or who greedily graze,\nsuffer the consequences alone, including death.\n[355.26s] Group 1 forms a council with minimal powers,\n[358.12s] simply ensuring property is respected\nand promises are honoured.\n[362.38s] Group 2 thinks the whole land\nshould belong to everyone.\n[365.62s] Here no individual prospers, but\nno individual is left to die.\n[370.76s] Group 2 forms a council with extensive powers,\n[374.0s] assigning and supervising all work for\ngroup members who have no autonomy.\n[378.88s] Hard workers are forced to share\nall proceeds with lazy workers.\n[383.24s] Both groups believe their own system\nrepresents common-sense morality,\n[387.28s] while the other group''s system is\nirrational and immoral.\n[391.1s] But their convictions about their moral values\nmight not be as solid as they think.\n[395.48s] In 2003, social psychologist Geoffrey Cohen\nrecruited liberal and conservative college students\n[401.08s] with strong opinions on welfare\nfor a study in group influence.\n[404.74s] He presented them with one of\ntwo versions of a welfare policy:\n[408.12s] one provided generous benefits;\nthe other offered slender, stringent benefits.\n[413.58s] Pilot tests confirmed predictions that\nliberals would prefer the generous version,\n[417.52s] and conservatives would\nprefer the stringent one.\n[420.14s] In the actual experiment, when one of\nthe policies was presented to a participant,\n[424.02s] half the time it was claimed to be\nsupported by the Democrats;\n[426.98s] half the time it was claimed to be\nsupported by the Republicans.\n[430.24s] So, half the time the policy and\nparty support were politically consistent;\n[434.4s] but half the time they were\npolitically conflicted.\n[437.1s] Cohen found that when they conflicted,\nparticipants showed a strong tribal bias,\n[441.5s] focusing on the party support\nrather than the content of the policy.\n[445.8s] Liberals strongly favoured conservative policies labelled\nDemocrat over liberal policies labelled Republican.\n[452.0s] And conservatives strongly favoured\nliberal policies labelled Republican\n[455.88s] over conservative policies labelled Democrat.\n[458.84s] Subjects later denied being\ninfluenced by the party labels,\n[462.18s] although many of them believed\nother people would be influenced,\n[465.08s] especially their ideological adversaries.\n[468.3s] To know that group identity can effectively nullify\ngroup values in this way should give us serious pause.\n[475.4s] It means when we have reasonable,\nuseful, positive ideas from other groups —\n[480.16s] or unreasonable, corrupt ideas from our own group —\n[483.46s] we might be responding to them purely on the basis\nof their group origin, instead of their content.\n[488.9s] This helps to explain how subjects\nfrom evolution to climate change\n[492.48s] are sometimes denounced or defended by individuals\nwith no knowledge or understanding of the evidence,\n[498.22s] instead of being assessed on the data\nfrom the relevant scientific disciplines.\n[502.84s] Greene notes when false beliefs become\ntribal badges of honour, they''re difficult to change.\n[507.86s] It''s no longer just about teaching the facts,\nbut about combating overbearing group influence.\n[513.44s] So, is there any way out of this\ntribalistic ‘us versus them’ thinking?\n[526.4s] Finding common ground in the\nshort term is clearly possible.\n[529.6s] In the face of a common enemy, many groups\nhave managed to temporarily forget their differences.\n[535.22s] Alan Moore and David Gibbons''s\nbrilliant graphic novel, Watchmen,\n[538.9s] plays with the question of whether an ongoing\ncommon enemy could be artificially manufactured\n[543.54s] to bring about permanent peace\nbetween hostile groups.\n[547.04s] The novel is set in an alternative timeline,\n[549.58s] during a nuclear standoff between\nthe United States and the Soviet Union,\n[553.92s] this time populated with superheroes.\n[556.7s] Retired superhero Adrian Veidt stages a hoax alien\ninvasion on New York that devastates the city,\n[562.84s] creating a truce between the two earthly superpowers.\n[566.44s] The movie adaptation has a different twist.\n[569.28s] As the novel acknowledges,\nsolutions based on deception hold big risks.\n[573.82s] Discovery of the subterfuge\ncould destroy the truce.\n[577.68s] Uniting against a common enemy can\njust create tribalism on a larger scale,\n[582.5s] perpetuating all the same distorted thinking.\n[585.74s] Sometimes the common enemy might be\na genuine malevolent threat,\n[589.42s] but sometimes we might be demonising\na group that just has different preferences.\n[593.84s] The group might be falsely labelled\nan enemy for political reasons.\n[597.6s] It''s easy to become the monsters\nwe think we''re attacking.\n[601.38s] When targeted groups lash back in self-defense,\nwe take it as proof of their aggressive nature.\n[607.48s] It''s a self-fulfilling prophecy;\n[609.68s] by looking for trouble we create it.\n[612.72s] Uniting against a common enemy\ndoesn''t resolve our differences;\n[616.32s] it just puts them on ice.\n[618.08s] When the enemy''s defeated,\ndifferences can resurface,\n[621.42s] and even turn a former ally\ninto a new common enemy.\n[625.44s] Appealing to our common\nhumanity feels more positive.\n[628.94s] But again, things can backfire\nif we try to sweep away our differences.\n[633.2s] Any unresolved issues we have about our differences\ncan block our collective progress,\n[638.24s] and the most trivial-seeming differences\ncan arouse unexpected issues.\n[642.98s] When I studied psychological\ntherapies at university,\n[646.02s] during a two-day retreat exploring\na range of personal differences,\n[650.06s] We were scored on our preference for\nplanning, structure, and resolution, versus\n[654.84s] improvisation, spontaneity,\nand open-endedness.\n[658.26s] The tutor arranged us in a\ngiant U-shape according to our scores,\n[662.06s] with the highest-scoring planner at one end\nand the highest-scoring improviser at the other,\n[666.72s] then invited us to form small groups with our\nnearest neighbors and discuss our preferences.\n[671.98s] It later emerged that in those private discussions,\nimprovisers were labelled unnatural by planners,\n[678.18s] and planners were labelled unnatural by an improviser.\n[682.18s] These therapy students\nwere trained in empathy.\n[684.98s] But on finding out other folks\ndidn''t share their preferences,\n[687.64s] they tried to pathologise\nand stigmatise them.\n[690.64s] Some valuable lessons were learned\nthat day about appreciating differences.\n[695.24s] We''re not all the same, and overcoming\ntribalism doesn''t entail being the same.\n[700.14s] It''s about finding enough common\nhumanity to be able to hear each other\n[703.6s] and discuss our differences rationally.\n[706.08s] And let''s be real — some folks have a vested interest\nin not finding common humanity:\n[711.48s] leaders of high-control groups,\nsegregationist groups,\n[715.22s] doomsday groups who welcome Armageddon\nas the fulfillment of their faith.\n[719.9s] But finding common humanity\ndoesn''t require everyone''s participation.\n[724.16s] It''s a choice any individual can make at any time,\nincluding disillusioned members of separatist groups.\n[731.18s] Each person who makes that choice\ngets the chance to experience:\n[734.58s] wider communication with people\nwho might otherwise have been dismissed,\n[738.58s] deeper understanding from information that\nmight otherwise have been distorted or censored,\n[743.46s] and greater personal autonomy from\nan enhanced awareness of our options.\n[748.56s] Establishing a common humanity means\novercoming two distinct problems.\n[752.76s] One is the tribalistic wiring\nof our moral brains,\n[755.96s] which naturally favours ingroup cooperation\nat the expense of intergroup cooperation.\n[760.82s] Another is the clash between\nthe moral systems of different groups.\n[764.88s] Overcoming these problems involves effort,\nand possibly some psychological discomfort.\n[770.22s] But every individual who overcomes them\nmakes a difference.\n[774.2s] Regarding our tribalistic wiring,\n[776.18s] psychologists and neuroscientists have repeatedly\ndescribed two different human thinking styles.\n[781.54s] A. David Redish calls them\nPavlovian and deliberative.\n[785.46s] Daniel Kahneman calls them\nsystem 1 and system 2, or fast and slow.\n[790.68s] Joshua Greene refers to them as\nautomatic and manual.\n[794.04s] They all capture the same idea.\n[796.12s] We have a reflexive style of thinking,\n[798.4s] that''s instinctive, effortless, emotional,\nand produces automatic responses.\n[803.889s] And we have a reflective style of thinking,\n[806.38s] that''s conscious, effortful, logical,\nand allows us to assess alternative responses.\n[812.22s] It''s not that one thinking style''s\nbetter than the other;\n[814.62s] they''re just suited to different jobs.\n[816.8s] Greene uses the analogy of\nautomatic and manual camera settings.\n[820.98s] For everyday purposes, the camera''s\nautomatic mode will give good results.\n[825.28s] It''s designed to cater to a range of\ncommon photographic conditions.\n[829.28s] But it has trouble outside those conditions.\n[832.08s] Photos come out under- or over-exposed,\n[834.88s] colour balance suffers,\nimages get blurred.\n[838.16s] To correct these errors,\ncameras have a manual mode,\n[841.12s] allowing us to adjust focus,\nshutter speed, and white balance.\n[845.16s] Takes more time, but produces\nmuch more accurate pictures.\n[848.86s] Likewise, in everyday conditions, our social brains\ntend to do a decent job in automatic mode,\n[854.52s] using a range of fixed emotional reflexes that\nencourage beneficial cooperation with fellow members.\n[860.46s] But outside those conditions,\nthe limitations of our fixed reflexes become clear.\n[865.66s] We might falsely denounce some groups as immoral\njust because we find them strange,\n[870.0s] and our simplistic, automatic thinking\nequates strange with wrong.\n[874.16s] Like a camera, we can move over to\nmanual mode to correct our mistakes.\n[877.82s] We can widen our lens, take in and\nevaluate more complex information,\n[882.54s] and produce a clearer moral picture.\n[885.52s] If we find someone strange, instead of responding\nwith reflex condemnation, we can ask ourselves:\n[890.3s] Has this person done wrong?\nHas anyone been harmed?\n[895.28s] And we might reach\na different conclusion.\n[897.82s] Our capacity for manual thinking\ngives us an extraordinary opportunity\n[902.02s] to move beyond the confines\nof our limited reflex instincts.\n[905.96s] Manual thinking is our ladder\nout of tribalism.\n[909.7s] Unfortunately, that ladder can turn into a\nhamster wheel, locking us into tribalism.\n[915.06s] This is the double-edged nature\nof manual, deliberative thinking.\n[919.1s] We can use it in a critical, detached way to scrutinise\nour moral instincts and correct our tribal prejudices.\n[925.08s] Or, we can use it to try and invent elaborate\njustifications that confirm those prejudices.\n[930.54s] Unfortunately, a psychological phenomenon\ncalled cognitive dissonance\n[934.26s] often pushes us towards the\nhamster wheel instead of the ladder.\n[937.82s] When we experience conflicting cognitions —\nbeliefs, emotions, thoughts —\n[942.9s] we feel a discomfort that drives us to\nreduce that conflict and seek consistency.\n[948.02s] In seeking consistency, it''s easier\nto invent fallacious reasons to confirm\n[952.32s] what we already believe, feel, and think,\n[954.94s] than to do the tough mental work\nof questioning our assumptions.\n[958.36s] Take the earlier example of asking ourselves if\nanyone''s been harmed by a person we find strange.\n[963.44s] If we can''t find any evidence\nof injury or damage,\n[966.58s] we might twist the meaning of the word\n‘harm’ to prejudice the answer.\n[970.3s] We might say the person''s\nstrangeness violates nature.\n[973.98s] Even if the person''s strangeness is\nobserved throughout the natural world,\n[977.28s] we can still claim it wasn''t intended for humans —\nonly other animals.\n[981.9s] We might claim the person''s strangeness defies the\nwishes of invisible supernatural entities, called gods.\n[987.82s] We might suggest the person''s strangeness\noffends the tribes sensibilities.\n[992.72s] If we take the easy hamster wheel\nof self-justification,\n[995.82s] using our manual thinking\nto confirm our prejudices,\n[998.62s] we can fool ourselves that\nthese accusations are valid.\n[1002.46s] If we take the ladder, using our manual\nthinking to challenge our prejudices,\n[1006.72s] we might notice none of these accusations\nidentify any injury or damage.\n[1011.26s] They''re all just ways of confirming\nthat strange means wrong,\n[1015.18s] and they can all be arbitrarily applied to absolutely\nany activity people want to stigmatise.\n[1020.86s] Folks who use these\nspurious tribal accusations\n[1023.72s] might not appreciate that it''s in their\nown best interest not to use them.\n[1027.88s] In using them against other groups,\n[1029.92s] they have no come back when other\ngroups accuse them of violating nature,\n[1034.06s] defying other gods, or\noffending other sensibilities.\n[1037.82s] Live by the fallacy,\ndie by the fallacy.\n[1040.52s] This is the second problem in\nestablishing common humanity:\n[1043.9s] the clash between the\nmoral systems of different groups.\n[1047.74s] Philosopher John Rawls''s thought experiment,\n‘the veil of ignorance’,\n[1051.28s] invites us to construct a moral system, while\nimagining we''re just about to be born\n[1056.02s] with no knowledge of what our abilities, preferences,\nphysical traits, or position in society will be.\n[1062.62s] It''s in our interest not to disadvantage any group,\nbecause we could be born into that group.\n[1068.22s] The idea is that a fair system is\none we''d happily be born into at random.\n[1073.48s] In discussing morality with other groups,\nwe could imagine a veil of membership.\n[1078.36s] Here the task is to explain\nour ideas on their own merits,\n[1081.86s] without reference to the common-sense\nnotions of any specific group.\n[1086.3s] Developing a common moral language means\nacknowledging that it''s pointless\n[1090.1s] constructing moral arguments in ways\nwe wouldn''t accept from others.\n[1094.04s] If we''re not persuaded by the supernatural\nthreats and inducements of other groups,\n[1097.86s] why expect them to be persuaded by ours?\n[1100.36s] If we wouldn''t accept authority-based moral declarations\nfrom the authorities of other groups,\n[1105.54s] we can''t expect others to accept authority-based\nmoral declarations from us.\n[1110.04s] If we wouldn''t accept bold assertions about rights\nand responsibilities from other groups,\n[1114.68s] we shouldn''t make bold assertions about\nrights or responsibilities to them.\n[1118.7s] When we''re used to assuming the\ncommon-sense truth of our groups ideas,\n[1122.52s] it can be jarring and illuminating to try\nto explain them from first principles,\n[1127.82s] to move from automatic to manual thinking.\n[1131.14s] Joshua Greene cites the case of\n18th-century philosopher Jeremy Bentham,\n[1135.32s] who tortured himself for years trying to find grounds\nto justify harsh punishments for homosexuality,\n[1140.82s] which he called an abomination.\n[1143.0s] But, working through the arguments\nagainst homosexuality in a detached way,\n[1147.3s] he finally concluded it represented\nno harm or cause for public alarm,\n[1151.82s] and argued for its decriminalisation, catapulting him\ncenturies ahead of the tribal common-sense of his era.\n[1159.78s] Detached manual thinking\nchanges the freedoms we defend.\n[1163.36s] Some people are surprised when\nan atheist defends religious freedom,\n[1167.3s] when a Jew defends the freedom of\nexpression of Holocaust deniers,\n[1171.06s] when an ex-Muslim defends\nthe freedom to wear hijabs,\n[1174.76s] when a Muslim defends the freedom\nto draw the author of Islam, Muhammad.\n[1179.36s] Superficially, they might seem to be\nworking against their own interests.\n[1183.18s] But they''re just thinking on a\nhuman level instead of a tribal one.\n[1187.12s] Detached manual thinking\nchanges our loyalties.\n[1190.54s] When we expand loyalty from tribal to human\n[1193.32s] concern for truth and justice can be aligned on all levels:\nindividual, group, and human.\n[1200.04s] When loyalty''s tribal,\nthe group is misaligned.\n[1203.48s] The region of non-overlap could be labeled hypocrisy,\n[1206.96s] where the group reserves special treatment for itself\nthat it doesn''t extend to other groups.\n[1211.74s] We see tribal loyalty when groups who condemn\nchild abuse shield molesters in their own ranks,\n[1217.56s] and when fraudulent politicians are protected\nfrom the jail-time any other citizen would serve.\n[1222.88s] It''s one law for us and another for them.\n[1226.72s] Detached manual thinking changes our empathy.\n[1229.56s] It''s easy to feel empathy\nfor members of our own groups.\n[1232.32s] But to cross the ‘us versus them’ divide, we need to be\nable to empathise with people outside our groups.\n[1238.24s] Sometimes we hold back from that because we confuse\nempathising with validating someone''s viewpoint.\n[1244.2s] Empathy is just about understanding\nwhy someone feels a particular way.\n[1247.82s] Without understanding someone''s position,\ncommunication is blocked.\n[1251.78s] Some theists claim\natheists just want to sin.\n[1255.56s] They fail to understand not only that atheists\ncan derive morality through secular principles,\n[1260.12s] but that we have a very\nobvious moral motivation:\n[1262.92s] to enjoy the benefits of\nmutual support and cooperation.\n[1266.56s] Some atheists claim\nall theists are mentally ill.\n[1270.02s] Rather than arguing that\ntheists hold flawed beliefs,\n[1273.24s] they leap to a psychiatric explanation.\n[1276.5s] We all hold flawed beliefs\nand for various reasons.\n[1280.22s] Sometimes we''re mistaken.\nSometimes we''re deliberately deceived.\n[1284.16s] Sometimes we''re indoctrinated,\nwhich is how I became a theist.\n[1288.06s] I required no psychiatric intervention;\n[1290.32s] my indoctrination was broken\nby detached reflection.\n[1293.62s] I started out on the hamster wheel of self-justification, \ntrying to confirm my indoctrination,\n[1298.84s] but I unwittingly ended up\non the ladder to atheism.\n[1302.42s] When we expand empathy beyond\nthe tribal level to the human level,\n[1305.86s] false judgments start to fall away.\n[1308.22s] We start seeing the individuals\nbehind the group label,\n[1311.6s] and communication opens up.\n[1314.72s] When we form groups,\n[1316.3s] our social brains are wired to encourage cooperation\nand social cohesion within those groups.\n[1322.36s] An unfortunate downside to that\nbeneficial wiring is tribalism,\n[1326.7s] leading us to elevate\nourselves above other groups.\n[1330.58s] But, tribalism isn''t inevitable.\n[1333.32s] Our capacity for detached reflection\noffers a path out of it.\n[1337.98s] It involves more effort than\nour everyday reflex thinking,\n[1341.14s] and it can arouse discomfort when\nlong-held ideas are challenged.\n[1345.08s] But the benefit to our collective\nmoral progress is clear.\n[1349.88s] It''s often said, ‘there''s no ''i'' in team’.\n[1353.18s] But there is in ‘tribe’.\n[1355.22s] And it''s a great reminder not to be\nswallowed up by our groups,\n[1358.46s] but to value and preserve individuality,\nintegrity, and independent thought;\n[1364.52s] to always feel able to question our\ngroups and resist the errors of tribalism."}'
