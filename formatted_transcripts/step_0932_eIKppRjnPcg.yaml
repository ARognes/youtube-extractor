transcript: The reward of the bravery test today is going to be nothing less than to be able to love without attachment, without the fear, the anxiety, and the worrying that usually goes along with every single thing we love. But, if you really want this reward of experiencing love and beauty without any fear and anxiety about it, then you're going to have to give up every single thing that is special and important to you. And we have to realize that the things that are special and important to us, they become special and important in the first place because they promise the experience of love and beauty, don't they? So, if by giving them up, our reward actually is that very love and beauty, that experience of it, then we're actually not giving up anything at all, aren't we? And your first challenge in this is going to be that I'm going to introduce you to someone, and you have to try your very best to not feel sorry for him at all. And I promise you, he doesn't feel sorry for himself. So, I want you to meet Ferguson, and as you can see, he has an amputated leg. Because donkeys' hooves need to be trimmed. If they If they're not trimmed, they just keep growing like fingernails, and his hoof grew back into his leg and severely damaged his leg to the point that, you know, he couldn't walk on it anymore. He must have lived with that for a long time, and then he finally came here, and they decided to do something about it. And this is normally not done. We don't usually do these surgeries for animals, right? And they just they have to live with it, or they die from it. But, in a remarkable case, you know, he was on the news and everything. The veterinary college here did the operation. They amputated the leg as much as they needed to, and then actually another person donated their services who normally makes prosthetics for humans, and they made a prosthetic for Ferguson. And now he has actually two so that they can be changed in the so he can always have a clean sock on. And uh that's actually what we witnessed today. It was the changing of the prosthetic and the sock, which needs to be done now for him on a regular basis. This is what I want you to see. This is the most amazing thing we can learn from animals, from donkeys like these right here, like Ferguson. The abuse and the neglect is real. It happened. Clearly, you can see. But what animals show us by their actions is when the abuse and the neglect is over, it is also over for them. Some donkey ASMR right here. They don't make an identity about it. They don't make a story and a narrative about it. They don't call themselves an abuse and neglect survivor. Uh Ferguson doesn't wake up in the morning and looks at the other donkeys and and is jealous of them and and is depressed that he doesn't still have all of his four legs. He gets on with it. And they're happy. They live in the present. We had a fearful past. We had an anxious past. All of that happened. But it's over now. And even if it's not over, even when for Ferguson, when that situation was still his daily experience, he went through that abuse and he went through that neglect and dealt with it the best he possibly could. And as soon as he was out of the situation, he was out of it. His mind was out of it as well. He didn't keep living in the past. He is now here grazing peacefully. He comes up to everyone. He lets everyone pet him. He asks for pets. He asks for carrots. And he eats them in a very crunchy way. And this is the situation now. And so in his ability to not make narratives, not to make stories out of his past, is now what enables him to live fully and happily in his new reality. This too is his reality. So, why should he live in the past instead of living in the present where all of life takes place, where all all of reality takes place. This is the most amazing thing. All right. Were you able to not feel sorry for Ferguson? If you weren't, that's okay. That's exactly why I set this challenge up because if you were not able to not feel sorry for Ferguson, this shows irrefutable proof that you believe in the idea that Ferguson, other animals, or people can be harmed by the actions of others. And that's exactly the belief that I want to challenge today. See, what made Ferguson's surgery that saved his life possible in the first place was his loving, trusting, calm nature. Be these These surgeries are very very rare because these animals weigh so much and they go into flight or fight mode. Uh but because Ferguson had this calm, beautiful, loving nature, it was able to be done for him. And that's why he still lives today. And I want to ask you this. That kind, loving, trusting, calm nature can that be harmed by abuse, neglect, disease, or even death? Because this is not even hypothetical. Ferguson did go through neglect and abuse. And he did go through pain and suffering. Yet after all of that, the same calm, loving, trusting, kind nature, friendly nature of his remained. Nothing changed. And while Ferguson's eyes are beautiful and his fur is nice and soft and he's just cute all around, we would not care about any of these things if he was a mean old donkey. And so, that which makes him lovable, that is immortal. He is a mortal, but that which makes this mortal lovable is immortal. He changes, his body changes, it can get sick, it can die, it will die. But that nature of his, that one is changeless. And he again exists within time and he has a certain lifespan. But that nature of his, that which makes him lovable, that is timeless. And it's the same with human beings. We do not love human beings for their physical appearance, for the money, for the luck and chance that they had in their lives, for the parents they've been born to, for the country, the culture, the time they've been born to. Imagine someone coming up to you and saying, "I love you for the parents that you were born to, the language you speak and the place you grew up in and uh all the luck that you had in your life." These are all things that you either had no control over or that can be taken away from you at any time. And this is not what we love people for and this is not what we want to be loved for. When we love someone, we love them for their kindness, for their integrity, for their honesty, for their loving nature, for their courage, for their generosity, for their friendliness. However you define lovable, and whatever it is that you love about people, notice all of those things were not given to them, and they cannot be taken away from them. There is nothing anyone can do to you to make you less loving, have less integrity. That's the whole point of integrity. If someone has integrity, that means they act the same under all situations, under all conditions. And not only do pretty much all animals prove to us that the nature cannot be changed, no matter what someone else's actions, opinions, or beliefs are, but many, many humans in fact have demonstrated this throughout history as well. So, that which makes you you, that which makes you lovable to anyone, that cannot be taken from you. That cannot be diminished. Therefore, you cannot be diminished. And how can we feel sorry for someone whose real self, whose true nature is untouchable, cannot be harmed? And this is why in the beginning of the video I said the price for seeing, or the reward for letting go of everything that is special and important to us, is love and beauty. Because truly, now we are able to see and enjoy this love and beauty without the anxiety, the fear, the anxiousness that usually goes along with losing it or constantly fearing that other people can damage this. Other people cannot damage exactly those things which makes someone lovable. They cannot touch them. And so, someone who sees this automatically also sees that in this particular way, nothing is special or important because nothing needs to be protected. Nothing is rare. Yes, this animal is beautiful, her nature is beautiful, her trusting, loving, kind nature is beautiful, just like Ferguson's, just like so many other people's. But it does not depend on her or him or me or anyone else for that to survive. We did not invent these things. We did not inherit these things. We are not the keepers of these things. We We cannot protect them just like we cannot damage them. We partake in these things. And in that, we have full control. Like we discussed before, no abuse, no neglect, no pain, no suffering can change that if we truly have this nature. Just like every animal demonstrates to us and so many human beings have demonstrated this to us, also. The Buddha, Socrates, Jesus, whoever you want to name, all these kinds of people, they have demonstrated this to us as well. Only the one who does not see the true nature of love, beauty, truth, justice, only those people will see things as special and important. They'll say, "Oh, this is such a special dog. There's no dog like this because it's such a beautiful, loving, kind, smart, uh trusting nature. So kind, so gentle." And And they think that by protecting the body of this animal, they can protect those things. By protecting their family and friends who are so lovable. They can protect those things. In fact, they must protect those things because there are so many people that are the the enemy of love, the enemy of truth, the enemy of justice. And and those people are right. There are people who think of themselves as the enemy of these things, who think themselves powerful enough to be able to do anything to these things. But don't we see? Is this not proven to us so many times by so many people and animals that this is not true? As Socrates said, "You can strike me. You can kill me, but you cannot harm me." This is what I want us to see. And this may take some time, I understand, but but the the the potion is in now. You have heard this. And this will, if you allow it, especially, this will expand. It doesn't have to make sense now. Love, beauty, truth, justice, all these things, whatever else you want to add to the list of truly lovable, the highest good, those things do not need our protection. We cannot fight for them. We cannot protect them, just like we cannot damage them. We cannot touch them. No one can touch them. And please don't allow that voice inside of you that right now may be saying that okay, so why should we save any of these donkeys? Why should we care for them? Why should we go uh fight criminals and try to catch them? Why not release everyone out of the prisons and all that? It is of the nature of a lovable person, of a person with integrity, who knows right from wrong, who knows love, the true nature of beauty, and everything that is fair and right. It is of the nature of such people to simply take care of things, to be gentle to things, to be loving to things, to um live in alignment in accordance to truth and love and justice as much as possible. But they know that what they are protecting is just the instance, the particular example of something that has beauty. But they know that even if every single beautiful object, animal, and human would perish, that what is lovable about them, beauty itself, love itself, those things do not perish with them. And so So, they know exactly what they're protecting and what they need not protect. And this gives them the peace, the strength, the calmness, and the rationality, and the power to actually protect these things much better than someone who is under the illusion that anything beautiful that they protect, by doing that, they protect beauty itself. And give themselves this impossible task. These are the truly effective people who know the true nature of love and beauty. And of course, it is not right for us to abuse and neglect. We don't do it, and so we also in the physical, in the logistical realm, we go after those people who do these things. But we do not do it with the angst, the fear, the anxiety of thinking that we must protect love and beauty and justice and truth itself, that it all depends on us. There's always this important differentiation that I talked about before, the logistical realm and the non-logistical realm. Love, beauty, truth, justice, the self, your true nature, everything that makes you lovable, or everything that makes someone else lovable whom you love, all these things are in the non-logistical realm. And the logistical realm is the realm of the physical, the body, where disease and sickness and death and abuse and suffering and pain, all these things can take place. But they can only touch the body, they can only touch the physical, they can only touch the instances of beauty, not beauty itself. When we try to protect a victim or when we uh put on trial a perpetrator, we do that in the justice courts. And if there is a mistake, a failing, a problem, and an incompetence, or even a corruption in the justice courts, that does not even put a nick, it does not at all harm justice itself. These are two different things. The justice courts, the courts of justice, are modeled after justice. Certainly, they aim for it, they aim to be aligned with it, but any failing of theirs does not diminish justice itself, and any success of theirs does not glorify justice itself. Justice is untouchable. And so it is with love and beauty and truth and everything else that is truly lovable about anything at all. And so now, let this be our gauge. If we see anything and we feel sorry for it, we've we feel protective over it, let us make sure that we are not under the illusion of being the savior of love and beauty and justice and truth. No, we are only protecting individual beautiful examples of these things. And that's great. That's our human privilege, it's a great activity, it's a beautiful thing to do, and it's of your nature to do. These activities come from your lovable nature. That which makes you lovable, also motivates you to do these actions. But, it is not a failure of yours when you fail. When you fail because you were prevented, you didn't have the means, or you weren't paying attention. You made a mistake. Love is not disappointed in you. Truth is not disappointed in you. Justice and beauty are not disappointed in you. For every donkey that is saved on that farm, there is probably also some that can't be saved or that weren't gotten to in time, even though one could have and should have and would have all these things. But, this is not how to cherish love and beauty. This is not how to honor it. This is not how to live with it. This is not what a loving, beautiful nature is in alignment with. It does not ask you of this. This is our confusion. We We think that when we protect something lovable, we protect love itself. It is not so. So, now, for the first time ever, if we understand this and this understanding grows, and we see this more and more in the world by looking at the proof, by looking at the proof, by looking at animals that always live in the moment, who don't feel sorry for themselves. We We need to see how silly we are when we feel sorry for things who don't even feel sorry for themselves. All the lovable people do not feel sorry for themselves. Truth, justice, love, they do not feel sorry for themselves. They are more powerful than any enemy. And, in fact, they have no enemies. We are the ones who make up these enemies. And we become the enemies of ourselves by being constantly by being consumed and and allowing fear, worry, anxiety, hatred, anger because this understanding or rather rather lack of understanding is also what gives us anger, what makes us hateful towards the people who we deem as hateful. This person is an abuser. This person neglected an animal. This person is a liar, cheater, deceiver. Let them. Again, on the non-logistical level, they cannot touch you. So, let them think that they are doing this. Let them think that they have this power. And in the logistical realm, we go do whatever is necessary to put an end to that habit, to that abuse, to that suffering, to to that negligence, to that corruption, whatever it is. What we are rightfully protecting is our daily life, our logistical comings and goings, and our ability to enjoy love and beauty, but not love and beauty itself. So, we can have this part in ourselves, this this realm in which we live, in which we see what's what, love and beauty, and we have a fundamental, eternal, timeless, changeless, immortal peace there. And out of that immortal peace, we go act in our daily lives, and we set things right, and we help things, and we help people, and we encourage, and we support, but always with this big picture in view. That although our loved ones can die and will 100% certainly die one day, we can rest assured that which is lovable about them, that which makes them lovable and lovely, that can and will never die.
