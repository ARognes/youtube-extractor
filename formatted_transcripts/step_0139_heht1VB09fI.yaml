transcript: I mean, I I always go back to problem-solving. I don't have uh you know, I don't think there's any one particular language that uh somebody has to learn or any one technology, but just problem-solving in general. And often that means really uh getting comfortable with debugging code. Like when we write code, it's different than when the code runs. And the only way to really see what's happening is to step through that code and see what effect it's having on the other parts of the system. So, if you build something from scratch or you build on top of, you know, something, uh being able to to debug it and fully understand what effect it's having, I think is the To me, that's the core of problem-solving.
