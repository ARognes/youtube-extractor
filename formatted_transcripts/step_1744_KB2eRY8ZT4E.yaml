transcript: some people think the word engineer is overused we often call technicians Engineers the distinction being supposedly that a technician assembles and repairs things while an engineer designs new things I've been referred to as an engineer software engineer Hardware engineer electrical engineer and none of these terms are wrong but I never really think of myself as an engineer the way I'd like to be referred to is as an inventor now aside from the Wallace and Gromit connotations not necessarily a bad thing if you introduce yourself as an inventor people always ask what are we invented sure my business card that's a stylophone world's smallest synthesizer nothing I've invented yet it's going to change the world for the better but I think a big part about being an inventor is preparation and practice honing your skills so that when the really great ideas come to you you have a means to make them happen because ideas are worthless if you can't turn them into reality now I don't know if in this day and age it's even possible for an individual to come up with a really great invention every Leap forwards is corporations institutions with a budget and resources that I can only dream of but that doesn't mean I'm not going to try and while I dream of Great Inventions I find it's hard not to reflect back on the all-time greatest inventions in fact it's a question I often ask of other Engineers what is your favorite invention what do you personally consider to be the greatest invention of all time You could argue quite rightly that agriculture or writing are great inventions but what I'm really getting at are technological inventions of the last few hundred years there are a lot of excellent candidates it could be as broad as the internet or digital computers or as specific as the sewing machine the jet engine the transistor mortally screw cutting lathe an excellent invention but right now because it's so hard to choose one I'm going to list my top three favorite inventions three things that I personally consider currently to be the greatest inventions of all time in third place I'm going to put the bicycle ordinary Diamond framed pedal bike as an invention it's pretty much perfect and the reason the design hasn't really changed in over 100 years I mean sure there's folding bikes fancy gearing systems but fundamentally as a concept the bicycle is impossible to improve upon they're very cheap they're very reliable they're very simple which on a list of greatest inventions could be seen as both a positive and a negative but the Simplicity of a bicycle is the result of optimization the thing that sticks with me is that a bicycle makes a person more efficient if someone on foot can travel a certain distance or a certain speed if you put on a bike they can go faster and further something I'd love to think about is that if a bicycle lets a person travel as fast as a horse can gallop then how fast could a horse go if it was riding a bicycle it might be difficult to train a horse to ride a bicycle but with four legs it would be able to ride a tandem so greatest inventions um in second place I'm going to put the liner type complements the bicycle quite well because everyone knows about bicycles not everyone knows about liner times bicycles are mechanically simple liner types are mechanical Marvels I'm always pleased to meet someone who's never heard of a liner type because then I have the honor of explaining to them what a marvelous machine it is for context in the 19th century all printing was done by handset movable type every book publisher and every newspaper relied on teams of people to set the type the process involved picking up individual letters carved into the end of little bits of metal and arranging them upside down back to front so that eventually you can cover it in ink press your paper against it and the text is printed of course afterwards you then had to manually sort the pieces back into the boxes they came from which was an incredibly tedious process the amount of human labor expended on manual type setting is Bonkers to think about newspapers would have teams of people working like crazy overnight in order to publish the morning's paper surely a machine could automate this well no that would be too difficult instead we got a machine that does something far more complicated hot metal type setting instead of arranging letters we want to print we arrange matrices or molds of the letters and using a molten lead alloy we injection mold the line of type the liner type machine has a magazine of these matrices and when you type at its keyboard these matrices fall into position the line is cast trimmed injected and then the matrices are carried to the top where magically they get sorted back into the magazine there are so many bits to love about this ridiculous machine like the little arms that carry the matrices around the way the timing is controlled as they drop from the magazine the way the space bars adjust so as to justify the text the way the Sorting is done the ability to change fonts by cycling magazines the fact that of course everything is synchronized from a huge series of cams at the back there's a feeling I get when I look at it that the inventor Otto Mergenthaler lived and breathed mechanisms and every problem encountered every new feature and every bug fix could be implemented with more mechanisms it's nuts to think that this system worked at all but it didn't just work it was the dominant printing method for almost 100 years linot types were invented in the 1880s and were still being used in the 1980s I could go on but if you want to learn more I can hardly recommend a 1960s documentary film called typesetting liner type a superb half hour that you will not regret watching and also farewell etwin Sherwood which is about the last liner type run of the New York Times nothing will quell my enthusiasm for this machine so bicycles the liner type but my number one favorite invention has to be cameras and by extension I suppose it includes films in my television even smartphones anything that has or uses or relates to a camera in some way I suppose it's a bit of a cop-out but anyone who's met me in real life can attest but I am a photography nut I love cameras to appreciate them it helps to understand them and Engineering behind cameras covers so many separate disciplines there's Optics of course the physics of lenses and forming an image of Flint glass and achromatic doublets and anti-reflective Coatings and aspherical grindings then there's a mechanical engineering of shutters and moving mirrors and adjustable apertures some cameras have mechanisms that surpass mechanical watches in terms of complexity then there's electronics the metering and exposure melding of electromechanics particularly in modern Zoom focus and shutter systems there's chemistry if we're talking film or if we're digital then there's DSP there's software modern cameras favor lenses not with low Distortion but predictable Distortion because of its predictable you can correct for it the impact of photography on human history is unfathomable but we all know that's got nothing to do with why I like cameras it's simply that they are a joy to use one of my favorite cameras is the Nikon F3 and I might do a follow-up video well explain how it works and why I like it so much but to conclude this video I'd just like to sing the Praises of the science museum in London there's a certain room there called making the modern world and if you are as fanatical about invention as I am this room is Heavenly right in the middle there is the very first lock stitch sewing machine built by Elias Howe there is another excellent museum in London called the sewing machine Museum and it is well worth a visit they even have an example of some monia's sewing machine which is much earlier but it was a chain stitch machine and wasn't very good this is the machine that made sewing machines good if you want to learn more I strongly recommend Tim hunkins The Secret Life of the sewing machine the science museum also have mordsly's screw cutting lathe and the screw originating apparatus they say the lathe is the only tool that can build a copy of itself in fact I don't think it's a stretch to argue that every single metal lathe was built using another lathe so in addition to being the conceptual parent to every leave this machine might also be the literal parent to every lathe if you're interested in Machine Tools there's a book called tools for the job by rolt which I personally found absolutely fascinating they have the Prototype induction motor built by the hands of Nikola Tesla at the time everyone thought it was impossible and whether or not you believe the stories of how he came up with the idea of the rotating magnetic field the importance of this invention cannot be overstated there's also more than one prototype jet engine including the earliest types where the airflow does a kind of zigzag there's this really weird promotional film where Frank Whittle appears as himself and reenacts the conception of the jet engine it's on YouTube and worth a watch just for how bizarre it is these few examples are only scratching the surface and no doubt next time I visit it'll all have been replaced with flashy interactive things instead I understand the modern exhibits are great at getting kids interested in science but I'm still bitter they got rid of the model engines and the model ships anyway that concludes this small fraction of my feelings on invention
