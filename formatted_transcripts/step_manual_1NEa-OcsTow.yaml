transcript: '{"content":"\n[0.0s] You can go out there and find probably a\n[2.24s] hundred articles from very\n[4.12s] well-respected programmers and authors\n[6.68s] and people that will tell you\n[8.52s] self-documenting code is a great\n[10.52s] practice and why you should do it. And\n[12.48s] if you really want to believe that,\n[14.16s] you''ll go out there and confirm your\n[15.6s] bias.\n[27.24s] You ever join a software project and as\n[28.96s] soon as you get on it, some senior\n[30.88s] programmer or maybe lead developer tells\n[33.16s] you, \"Hey, we follow self-documenting\n[35.72s] code here, so don''t add any comments to\n[38.36s] your code.\" Well, today I want to talk\n[40.2s] to you a little bit about why this has\n[41.6s] become such a popular practice that a\n[43.68s] lot of people suggest and why you may\n[45.88s] reconsider following it even if you''ve\n[48.48s] heard this from a lot of programmers\n[50.24s] because ultimately comments do exist for\n[52.96s] a reason and they actually can help you\n[54.96s] a lot more than you realize if you step\n[57.52s] back for a second and really think about\n[60.0s] it. Over 25 years ago, when I first went\n[62.68s] to college to learn to professionally\n[64.48s] program, we added comments to\n[66.68s] everything. And once I got my first job\n[68.88s] in the industry, I joined a team that\n[70.92s] was writing a lot of C++ code. There was\n[73.28s] a little bit of Visual Basic, a little\n[74.96s] early Java there as well. And at least\n[77.08s] at that first company, now again, every\n[78.88s] company''s different, everybody added\n[80.88s] comments to their code. And so, that''s\n[82.32s] just kind of a habit I picked up. And I\n[84.04s] went to couple other companies after\n[86.04s] that. We added comments to all of our\n[87.88s] code there, too. We actually had tools\n[89.72s] that would make sure that there were\n[90.92s] comments added to every method. Now,\n[92.68s] there were cases where we''d make\n[93.96s] exceptions because this isn''t really\n[95.6s] about following a practice just for the\n[98.04s] sake of following the practice, but we\n[99.8s] wanted to have documentation available\n[102.0s] generated from our code that anybody on\n[103.92s] the team could look at. But once I got\n[105.68s] into consulting, this was about 15 years\n[108.2s] ago, I noticed something immediately and\n[110.52s] that is that all the other co-workers I\n[112.56s] worked with on consulting engagements\n[114.8s] never added any comments to their code.\n[117.52s] And I would ask them like, \"Hey, how\n[119.52s] come you guys don''t comment your code?\"\n[121.08s] And they would often just say, \"Well,\n[122.6s] the client isn''t paying for comments.\n[124.479s] They''re just paying for functionality.\"\n[126.16s] And about 5 years after that, I started\n[128.28s] to see in the industry this popular lie\n[131.6s] basically of self-documenting code. And\n[134.08s] really the concept behind it just being\n[135.959s] that if you write your design clean\n[137.84s] enough, if you use variable names that\n[140.0s] represent the business well enough, if\n[141.959s] your code is simple and you''ve\n[143.16s] structured it properly, really comments\n[145.52s] are unnecessary. And so, I want to talk\n[147.2s] to you a little bit today about why I\n[148.8s] actually believe that''s something you\n[150.32s] should be very careful to consider\n[152.52s] adopting if you want to have a long\n[154.2s] career, because it can actually really\n[156.4s] make it hard for people to extend and\n[158.56s] maintain your code. It actually makes\n[160.44s] your life harder when you have to go\n[162.04s] back and revisit code you wrote a while\n[164.2s] ago.\n[170.4s] So, why do you people love to believe\n[172.48s] that self-documenting code is a good\n[174.959s] practice? Well, the first reason, and\n[177.28s] you''re not necessarily going to like\n[178.48s] this, but I think if you''re really\n[179.8s] honest with yourself, you''ll believe it,\n[181.92s] is laziness. You''ve heard this popular\n[184.72s] trope that a good programmer is a lazy\n[187.12s] programmer. And I''ll make a whole video\n[188.92s] in the future about why I think that''s\n[190.519s] actually not true, and it actually\n[192.48s] fights against your ability to be a good\n[194.519s] programmer. But, at the end of the day,\n[196.28s] writing comments takes effort. It\n[198.4s] doesn''t happen automatically. Now,\n[199.92s] there''s tools out there that can look at\n[201.8s] your method signatures and generate\n[203.6s] comments, but there''s different types of\n[205.32s] comments we write, right? Sometimes\n[207.16s] they''re at the top of a public method or\n[209.56s] a class or some variable, but there''s\n[211.56s] also comments that we put in algorithms\n[213.48s] just to help people with reading the\n[214.8s] code. You''ve probably heard of this\n[216.0s] concept of confirmation bias. It''s\n[218.2s] basically that we all have things that\n[220.48s] we wish were true, that we''ve adopted.\n[222.48s] And I think if we''re honest with\n[224.04s] ourselves, and and I''ve fallen prey to\n[225.88s] this, too. I want I want you to know\n[227.36s] that out there. It''s not like I didn''t\n[229.0s] ever want self-documenting code to be a\n[231.72s] really good practice myself, but you can\n[234.92s] go out there and find probably a hundred\n[237.32s] articles from very well-respected\n[239.8s] programmers and authors and people that\n[242.48s] will tell you self-documenting code is a\n[244.72s] great practice and why you should do it.\n[247.0s] And if you really want to believe that,\n[248.8s] you''ll go out there and confirm your\n[250.2s] bias. But equally, if you go out there\n[252.8s] and look for articles and information\n[255.36s] and documentation that says why\n[257.32s] documenting your code actually is\n[259.2s] valuable and you should take the time to\n[261.48s] do it, you''re going to find just as many\n[263.64s] articles and as many opinions. So\n[265.6s] ultimately, I''m not here to just try to\n[267.2s] force my opinion on you and say, \"Hey,\n[269.52s] you watched this video afterwards, you\n[272.16s] must document all your code.\" I''m just\n[274.28s] trying to help you think maybe about the\n[276.64s] other side of the argument if you are\n[278.36s] someone who really has practiced\n[280.76s] self-documenting code and wants to keep\n[283.0s] doing it. The second reason people love\n[285.24s] to believe this self-documenting code\n[287.96s] principle is they don''t like to see the\n[290.04s] comments in the code. When you''re\n[291.72s] reading code, having comments there\n[294.08s] introduces more lines, right? You You''re\n[296.72s] scrolling through the file before you\n[298.72s] get to the method declaration or as\n[300.84s] you''re reading an algorithm, there''s now\n[302.84s] comments littered in there, and it does\n[305.08s] add visual clutter. Now most IDEs and VS\n[307.84s] Code can do this. They have settings\n[309.919s] where you can just say collapse comments\n[311.8s] by default. You''ll see a little line\n[313.64s] that''ll show you that there''s a comment\n[315.24s] and you can expand it if you want to\n[316.64s] view it. Now I know a lot of us like to\n[318.32s] follow some arbitrary number of well, if\n[320.8s] a file gets to a certain length of lines\n[322.72s] of code, then it''s too big and we need\n[325.36s] to separate it out into separate files,\n[327.36s] and I think that''s a a good principle,\n[329.88s] but in practice, I find I often use\n[332.12s] there''s like a document outline of some\n[333.96s] sort or a class outline of some sort.\n[336.16s] When you''re reading your code, you can\n[337.96s] kind of click on that and jump between\n[339.56s] members. And so if there''s comments, you\n[341.12s] can kind of skip over them and navigate\n[343.04s] anyway. The third reason many people\n[345.32s] like this principle of self-documenting\n[347.24s] code is they don''t want to have to\n[348.96s] refactor comments along with code. If\n[351.64s] you take the time to add comments to\n[354.16s] your code, well, when that code needs to\n[356.08s] change, now the comments need to change.\n[358.44s] And I just personally believe if you''re\n[359.88s] going to be a professional, things like\n[362.16s] unit tests, code comments, code coverage\n[365.68s] tools, all those things, they''re built\n[367.96s] for a reason. They''re there because they\n[369.76s] actually do help us do a good job. And\n[372.76s] so, I would just say you might want to\n[375.08s] gut-check yourself a little bit. And if\n[377.56s] you''re really thinking that the reason\n[379.56s] why you don''t want to write comments is\n[381.48s] because it''s extra work and you have to\n[383.76s] refactor them, that''s not really a\n[386.08s] reason not to do it. That''s just a\n[388.36s] reason why you don''t want to put the\n[390.16s] effort in. At least be honest with\n[391.8s] yourself about it.\n[399.96s] And the fourth big reason many of us\n[401.48s] love this principle of self-documenting\n[404.48s] code is because, honestly, we think our\n[407.56s] code is easier to read than it is. If I\n[411.52s] get a task assigned to me to write some\n[413.919s] code, often I have to talk to the\n[415.84s] product owner, or I have to read\n[417.4s] requirements to understand what''s that\n[419.8s] code got to do. And I may understand a\n[422.56s] whole bunch of terminology in the\n[424.08s] requirements that''s related to that\n[425.8s] business. Let''s say it''s in, you know,\n[427.32s] auto manufacturing, and I''m creating\n[429.24s] some feature that has something to do\n[430.919s] with testing like the pressure of tires\n[432.96s] when they''re installed on the vehicle.\n[434.44s] I''m going to have to understand all\n[435.88s] these business terms that are specific\n[437.919s] to tires and specific to pressure tests.\n[440.88s] And so, I''m going to write, hopefully,\n[442.28s] my code and use a lot of variable names\n[444.48s] and a lot of method names that match the\n[446.68s] business domain. But when somebody else\n[448.68s] comes along to read our code, if those\n[450.76s] variable names introduce anything\n[452.8s] different or anything they''ve never been\n[454.68s] exposed to, now they have to read the\n[457.84s] code. And if you don''t have any comments\n[460.4s] in there, it''s going to be really hard\n[462.2s] for them to understand what you did and\n[464.36s] why you did it and why you designed the\n[466.24s] code the way you did unless they go all\n[468.08s] the way back to the requirements or they\n[469.64s] have a discussion with you. So, I''m not\n[471.44s] here just to bash self-documenting code.\n[473.4s] Again, it''s up to you if you want to\n[475.2s] follow that principle or not, but let me\n[476.88s] just share a couple really valuable\n[478.88s] benefits to commenting. And if you''re\n[480.48s] not doing it on your project, you''re\n[482.44s] missing out from all this. The first\n[484.28s] thing comments do, if they''re applied\n[485.96s] properly, is it''s going to help people\n[488.04s] understand the code quicker. Hey, if\n[490.88s] every time people want to understand\n[492.48s] code, they got to go into that method\n[494.76s] and read all the source code, that takes\n[496.76s] a lot longer than if you take the time\n[498.68s] to just write some good comments. And if\n[501.24s] you''ve written anything that''s an API\n[502.96s] that''s used by the rest of your team,\n[504.44s] let''s say it''s even just a helper class\n[506.24s] with a few methods or, you know, a\n[507.72s] couple classes that have relationships\n[509.64s] to each other, but they''re used\n[510.8s] everywhere, having your development team\n[513.159s] have to go through all the code and read\n[515.64s] that just to understand what it does is\n[518.2s] really putting a much bigger burden on\n[520.24s] them than if you just take the time to\n[521.919s] think about how can I describe what this\n[524.08s] code does and what each of these methods\n[526.12s] do and let that be the only information\n[528.4s] they need to know to use the code. The\n[530.72s] second thing that''s really valuable\n[532.2s] about comments is it lets you map your\n[535.0s] code''s terminology, the names you''ve\n[537.08s] chosen, to the business domain. This\n[539.0s] goes back to the point I was talking\n[540.36s] about earlier, but if you know something\n[542.44s] about a business problem that you''re\n[543.8s] solving, sure, we all do the best job we\n[546.6s] can. Hopefully, we''ve read domain-driven\n[548.56s] design and we''re trying to come up with\n[550.64s] names for our classes and our\n[552.04s] identifiers and our symbols that map in\n[554.68s] some way to the business domain, but\n[556.68s] many of us find we have to introduce new\n[559.44s] concepts into the code to make it dry or\n[562.04s] reusable, and sometimes there''s no\n[563.92s] mapping between that term that you sort\n[566.04s] of invented in your code to represent a\n[567.92s] concept and something in the business\n[570.0s] domain. And so, the only way you''re\n[571.48s] going to let somebody quickly understand\n[573.76s] that without having to read all the code\n[575.96s] and understand all the behavior is if\n[578.56s] you take the time to think, \"How can I\n[580.48s] write comments that explain this concept\n[583.6s] and really hammer home how they got to\n[585.64s] use this code so that they don''t have to\n[587.92s] go through and read everything in my\n[589.96s] design.\" The third big benefit to\n[591.8s] comments is it lets the developers on\n[593.88s] your team use the tools that they have\n[596.72s] and all the features of those tools to\n[599.0s] call your APIs. When most text editors\n[601.76s] first come out, they don''t have\n[603.76s] intellisense or auto complete when\n[606.08s] you''re writing code. And eventually they\n[608.0s] add that feature, you can hit the period\n[609.76s] character or some other character that\n[611.6s] indicates that you''re about to invoke a\n[613.12s] method or access a property or something\n[615.24s] like that. And eventually they''ll add\n[616.72s] support for comments and that''s always\n[618.52s] really appreciated by the industry. If\n[620.48s] you go look at VS Code for example, it\n[622.6s] has really rich ability for you to view\n[625.28s] not just the types of parameters you''re\n[626.92s] going to pass to a method when you call\n[628.52s] it, but if you put code examples in\n[630.72s] there, if you put error conditions, all\n[632.84s] that information surfaced\n[634.36s] instantaneously to the person who''s\n[635.84s] about to call that method without them\n[637.68s] having to go find the class, open it up,\n[640.56s] have it side by side, or you know, use\n[642.44s] multiple monitors. And now they got to\n[643.96s] look at the code they''re writing plus\n[645.76s] read your code. Let them use the tools\n[647.64s] they''ve already got. If you don''t take\n[648.96s] the time to add comments to your code,\n[650.92s] you''re really missing out on everything\n[653.52s] your editor or your IDE of choice has to\n[656.16s] offer.\n[663.72s] The fourth big benefit to writing\n[665.16s] comments in your code is it encourages\n[667.4s] you to surface behavior in the comment.\n[670.16s] Again, if you have an error, let''s say\n[672.44s] that''s thrown in some condition in your\n[674.36s] code, you have a couple decisions to\n[676.36s] make. You could either just throw that\n[678.6s] error and have a unit test and hope the\n[680.44s] developers are reading the output of the\n[682.04s] unit tests. You could create some object\n[684.68s] that''s returned that has a error type\n[687.16s] property. Now they have to understand a\n[688.839s] whole another contract for a response\n[690.8s] type. They have to read all the\n[692.16s] documentation if you wrote it for that,\n[694.76s] or they have to read all the code for\n[696.08s] that. Or if it''s a simple type of error\n[698.08s] in a certain condition, you can put that\n[700.36s] right in the comment for that parameter\n[702.52s] and talk about the behavior. And you can\n[704.24s] also describe, depending on the state of\n[706.68s] the parameters that you pass in, how\n[708.92s] that method might behave differently.\n[711.0s] They might have to read 100 lines of\n[712.92s] code split across six different methods\n[715.36s] in three different files just to\n[717.32s] understand the behavior of something\n[719.16s] that you can tell the rest of the\n[720.6s] developers and people calling your API\n[722.76s] ahead of time if you just take the time\n[725.8s] to put it in the comments. The fifth\n[728.12s] thing that''s really great about adding\n[729.64s] comments to your code if you''re not\n[730.96s] doing it today is a lot of tools that\n[733.28s] will generate documentation from code,\n[735.56s] things like TS Doc or JS Doc or DocFX if\n[739.32s] you''re using C#, almost every language\n[741.36s] has some way of generating\n[742.52s] documentation, Ruby Doc. As many of them\n[744.64s] allow you to also add markdown files or\n[747.24s] just other separate files from your code\n[749.68s] that let let''s say, a collection of\n[751.56s] classes within a namespace or something\n[753.8s] like that. They also let you add\n[755.6s] separate whole topics with examples.\n[758.08s] Basically, they give you all these\n[759.56s] really rich ways to add documentation to\n[762.32s] your code above and beyond just the\n[764.64s] comments for the code itself that makes\n[766.72s] it easier for people to understand it.\n[768.76s] And the sixth reason, and I think this\n[770.36s] is one of the most important for using\n[772.56s] comments, is it really encourages you to\n[774.92s] treat your code like a product. Many\n[778.44s] times I work with other developers and\n[780.48s] they''re frustrated because they can''t\n[782.24s] read somebody else''s code, and then they\n[784.64s] go on to write their own code, and they\n[786.96s] shortcut their unit tests, and they\n[788.72s] don''t add comments, and they''re\n[790.24s] basically doing the same thing that the\n[792.24s] person they just complained about did.\n[794.56s] But if you really want to reduce the\n[796.12s] amount of time it takes to understand\n[797.88s] code, if you want to make it faster to\n[799.76s] refactor, if you want to be able to\n[801.36s] onboard people quicker, if you want to\n[803.56s] be able to go into code you wrote 6\n[805.64s] months ago and not spend a day trying to\n[808.64s] wrap your head around what that code\n[810.44s] does, consider having the discipline to\n[812.8s] just take the hit and take the time and\n[816.08s] add comments to your code. So, what do\n[818.4s] you think about self-documenting code\n[821.0s] and whether there''s any value in\n[822.6s] comments or if there''s really good\n[824.48s] reasons to add comments or to skip them.\n[827.44s] Leave me some comments below. Until next\n[829.8s] time, thanks."}'
