transcript: "heyyyy how are youu :]\nhere i present you: \"birds flying towards the horizon\", a new track for the being alive project.\nthis one was inspired by the feeling i get when watching birds passing by, and flying towards the distance. those moments when, seemingly out of nowhere, a flock of birds flies near you and disapears on the horizon. there's something captivating about that. something magical. and i think it perfectly fits on what this project aims to portray. it's a simple and spontaneous moment that makes your life, for an instant, solely be this present moment. right here, right now..\n\nthis might be my most experimental track to date, and i'm very proud of it. \nsome cool things about it: \n~the birds taking flight sound you hear twice on the track was the result of a beautiful coincidence. while at the lake with some friends, we found a group of ducks near the shore (from the Chloephaga poliocephala species) and we stayed there looking at them from a few meters. since they were making duck sounds and i had my recording equipment with me, i decided to record them. i spent some time near them and after a few minutes they suddenly decided to fly away in sync, leaving me with a wonderful recording and a big smile. at the time, i already had his track idea on the works, so that recording made everything make more sense. it was like a gift from the universe.\n~the track is on a 11/8 time signature.\n~some instruments on the track, most notably the piano and synth at the beginning, have recordings with delay effects that get triggered whenever the instrument is played, and that sounds awesome and is very fun to play with. it's like having a piano merged with synthesizers and echoing bird sounds that's just... ethereal.\n\nthe sky pictures were taken over many days and weeks. \n\ni hope you like it :]\n\n~~~\n\nif you want to stay tuned and follow the progress i'm making on this project from up close you can check my Patreon ! where i share music demos, animations, ideas, inspirations, creative crisis, and any news regarding me and my art:   / camiidae  \n\n~~~\n\nhaving said all of this, i'll leave you to be. go experience life. feel the matter, feel the time, feel the love. go outside, be open, be kind. when people in power want us to be miserable and keep us under their control, being joyful, kind, and creative is punk.\nkeep going. with love, a human that’s just trying to be,\n~ cami"
