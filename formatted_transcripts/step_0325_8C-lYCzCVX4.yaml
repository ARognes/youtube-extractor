transcript: Netflix was created because of a late fee. Netflix completely changed the way you watch movies, but it didn't start off as a streaming app. It started with a fine. Back in the late '90s, Reed Hastings rented a VHS from Blockbuster. He returned it late and got hit with a $40 fine for one movie. And that was the moment. Because the problem wasn't the movie, it was the friction. So, he asked himself a simple question. What if rental movies didn't punish you? No late fees, no deadlines, no stress. And that idea became Netflix. At first it was DVDs in the mail, as in the post, and then it became streaming. And eventually they put Blockbusters out of business essentially because of a late fee. How crazy is that? Because sometimes the best startups don't come from amazingly big ideas, they come from small frictions and frustrations that need to be fixed.
