transcript: '{"content":"\n[4.213s] Фалшива еквивалентност\nqualiasoup & theramintrees\n[8.673s] С тази фалшива еквивалентност винаги е същото: Преструват се арогантно, че не намират разлика между агресора и жертвата и казват, че жертвата е тази, която \"истински подбужда\" насилието.\n[17.989s] — Кристофър Хитчънс, \"Спорно\" [в отговор на критиките срещу бившата мюсюлманка Аян Хирси Али]\n[24.24s] Концепцията за справедливост често се изобразява като двойка везни\n[28.243s] с цел представяне на справедлива и безпристрастна оценка на доказателствата,\n[31.885s] където всички страни се придържат към едни и същи стандарти.\n[34.96s] Справедливостта може да бъде неудобна — и трудна за определяне.\n[38.787s] Някои от нас инстинктивно ще искат специално снизхождение\n[42.414s] когато ние или хората, които обичаме, сме прегрешили срещу чужди хора\n[45.968s] и се застъпваме за твърдост, когато другите престъпват спрямо нас.\n[50.043s] При възможност за размисъл, справедливо мислещите хора се съгласяват, че прилагането на различни стандарти за различните хора подкопава самата концепция за справедливост.\n[58.163s] Но някои хора са решени да наклонят моралните тежести в своя полза\n[62.18s] — последователно те свеждат до минимум собствената си вина и замърсяват моралния облик на невинните страни.\n[68.754s] Отличен пример са нарцисистите\n[71.051s] —твърдо егоцентрични и безчувствени към нуждите и чувствата на другите хора.\n[77.018s] Но дори и иначе справедливите хора могат да имат своето морално чувство\n[81.52s] извадено от равновесие от изкривяващо влияние\n[84.525s] —например, ако са наети от догматична идеологическа група.\n[89.308s] Малтретиране на хора при запазване на чувството за морална добродетел\n[93.502s] изисква големи концептуални деформации.\n[96.52s] Джо е нарцисист, който е романтично свързан с Мо.\n[101.18s] След краткотрайния меден месец\n[103.62s] Джо става все злоупотребяващ, хвърляйки обиди и лъжливи обвинения.\n[109.03s] Мо се опитва да обясни на Джо, че тези агресивни изблици вредят на отношенията им.\n[114.655s] В отговор Мо е обвинена, че всичко иска да контролира\n[118.12s] и че няма уважение към свободата на изразяване на хората.\n[121.742s] Джо заявява: \"Ти не си по-добра от мен.\"\n[124.788s] Джо използва формата на психологическа манипулация, позната като — \"приравняване\".\n[129.588s] Това е, когато човек или група, чието поведение е много по-лошо от това на другите, по всички обективни показатели при анализа на ситуацията, и се опитва да претендира за равностоен морален статус,\n[139.21s] като претендира фалшива еквивалентност в поведението и на двете страни.\n[142.498s] добавяйки фалшиви елементи от страна на противника\n[145.314s] и отричайки неудобните елементи от своя страна.\n[148.829s] Джо се опитва да направи фалшива еквивалентност между \"да се съпротивляваш на насилие\" и \"да бъдеш насилник\".\n[155.108s] Нарцисистите често правят \"приравнителни\" изявления\n[157.88s] когато са изправени пред неоспорими доказателства за тяхното насилие.\n[161.78s] Те могат да твърдят, че \"и двете страни имат недостатъци\".\n[165.22s] Разбира се, никой не е без недостатъци,\n[167.5s] но намеците тук са, че недостатъците на двете страни имат еднаква тежест,\n[171.84s] което понякога е далеч от истината.\n[174.18s] Те могат да твърдят, че всяка история има \"две страни\".\n[177.54s] Отново намека е, че и двете страни имат еднакво обосновани гледни точки.\n[182.657s] Те могат да заявят, че те и човекът, когото са насилили, \"просто виждат нещата по различен начин\"\n[187.628s] загатвайки, че дали насилието е настъпило или не, е само въпрос на гледна точка.\n[192.835s] Във всички случаи целта е да се замъгли личната отговорност — и по този начин да се избегне отговорност.\n[199.144s] Лицемерието на тези \"приравняващи\" твърдения става още по-очевидно\n[203.08s] когато нарцисистът се оплаква, че е бил наранен.\n[206.094s] Опитайте да им кажете, че всяка история има \"две страни\"\n[209.18s] но заемете дистанция преди това.\n[211.5s] Езикът е онова, което е необходимо за ефективна комуникация.\n[214.78s] Той се разширява, за да ни позволи да опишем преживяванията си с по-голяма точност.\n[219.42s] Например убийството е разделено на под категории като убийство, оправдано убийство и подпомогнато самоубийство\n[227.32s] като признание за огромните различия в обстоятелствата и намеренията.\n[231.757s] Езикът ни позволява да различаваме различни величини, както и качества.\n[236.168s] Ще се забъркаме в истинска каша\n[238.0s] ако винаги, когато поръчаме супа в ресторан��\n[240.6s] получим 14 чинии, когато искаме само 1.\n[244.1s] Но точно такава бъркотия приравняването и фалшивата еквивалентност създават.\n[248.74s] Те изкривяват езика, размиват величини и понятия.\n[253.92s] И те идват при нас от всички посоки.\n[257.504s] Измамници, които търгуват с фалшиви лекарства, често твърдят, че това е просто равностойна алтернатива\n[262.62s] на научно обосновани методи на лечение.\n[265.408s] Те причиняват непоправима вреда на хората в отчаяно положение, които хора често не започват ефективно лечение.\n[273.333s] В някои ненаучни видове семейна терапия и медиация самата идея за преценка на поведението всъщност е табу.\n[281.056s] Умишленото насилие може да бъде преформулирано като „недоразумение“ или „несъвместимост на характера“.\n[287.706s] Този вид упорито наблягане на неутралния език насърчава \"приравняването\".\n[293.536s] Когато догматичните политически групи заявят „Вие сте или с нас или срещу нас“\n[298.16s] те фалшиво \"приравняват\" оправданата селективна критика с пълното несъгласие.\n[303.76s] От друга страна, подкрепата фалшиво се \"приравнява\" само с абсолютно безкритично одобрение.\n[309.976s] Много от нас, са запознати с нетолерантни личности и групи\n[314.105s] на които им е много удобно да тормозят другите хора\n[317.188s] чието единствено престъпление е че се разграничават от тях.\n[320.286s] Но когато им бъде забранено да тормозят,\n[322.64s] те заявяват, че тази забрана е тормоз срещу тях и че противниците им са също толкова нетолерантни. [Забрана за тормоз = тормоз] [непоносимост към тормоз = нетолерантност към хората]\n[328.02s] Това са примери за това, което се нарича взаимодействие между ястреб и гълъб.\n[332.322s] Ястребът е егоистичен и войнствено настроен към останалите,\n[335.682s] докато гълъбът действа с цел да намали егоизма и агресията, като насърчава справедливостта.\n[341.0s] Това не са равни позиции!\n[343.14s] И ястребите само влошават неразумното си поведение, когато заявяват, че гълъбите \"не са по-добри\".\n[351.04s] Някои хора, които създават фалшиви еквиваленти, не разбират, че като добавят фалшив товар към опонента, може да се окаже че товара е върху тях.\n[359.134s] Това се случва, когато атеизмът е фалшиво \"приравнен\" с религията — нещо, което някои религиозни вярващи упорито продължават да правят.\n[366.369s] Разбира се, атеизмът няма прилика с религията.\n[369.478s] Това е просто липса на вяра в съществуването на богове.\n[372.5s] Няма доктрина, учение\n[373.92s] няма ритуали\n[374.8s] няма система за поклонение\n[376.266s] няма символика\n[377.38s] няма писания\n[378.46s] няма митология\n[379.6s] няма свещени предмети и концепции\n[382.04s] няма вяра.\n[383.451s] Антропологът Клифърд Гърц дава една от най-широките дефиниции за религията\n[388.37s] описвайки я като „система от символи\n[390.8s] която действа за създаване на мощни, убеждаващи и дълготрайни настроения и мотивации...\n[395.82s] Формулирайки разбирания за всеобщ ред на съществуване\n[399.34s] и обличане на тези понятия с такава аура на истинност\n[402.7s] че настроенията и мотивите изглеждат изключително реалистични.\"\n[406.439s] Това по никакъв начин не е като, атеизма.\n[408.835s] Интересното е, че теизмът(вярата) също не е религия.\n[412.2s] Можете да вярвате в боговете, без да сте член на някоя религия.\n[415.9s] Теизмът има общи черти с теистичната дефиниция на религията:\n[419.547s] вярата в свръхчовешката власт, която контролира всичко.\n[422.68s] Въпреки това, теизма не отговаря на критериите на религията.\n[426.092s] И ако теизмът не се квалифицира, как е възможно да се квалифицира атеизмът?\n[430.86s] Атеизмът и религията са фундаментално различни неща.\n[434.76s] Някои атеисти са изградили широк спектър от опровержения\n[437.874s] срещу лъжливи аргументи и твърдения за съществуването на богове.\n[441.206s] Но отхвърлянето на аргументи и твърдения не се свежда до доктрина/учение или вяра.\n[445.845s] Това са просто отговори на опитите за убеждаване от други хора.\n[449.547s] Да наречеш атеизма религия е фалшива еквивалентност\n[452.8s] проектирана за \"приравняване\" на противоположни неща.\n[455.794s] Това често се прави за атеисти, които не претендират че знаят истината,\n[459.44s] с фалшива тежест на доказване, за да съответства на тежестта на доказване на религиозни претенции.\n[463.934s] Или се опитват да направят, и религията, и атеизмът да изглеждат като позиции, основани на вяра, когато атеизмът не е основан на вяра.\n[470.823s] Опитът да се приравнят атеизмът и религията със фалшиви еквиваленти се проваля.\n[475.18s] Но е по-лошо и от това.\n[477.2s] Религиозни теисти са вярващи само по отношение на бога на собствената си вяра.\n[481.897s] Що се отнася до всеки друг Бог, те са атеисти.\n[484.94s] Ако не вярването в богове, беше отделна религия сама по себе си\n[489.275s] това би означавало, че тези вярващи изповядват две религии\n[492.62s] Тяхната собствена вяра и религията на тяхното неверие във всички други богове.\n[497.545s] Това е бъркотията, в която попадаме, когато някои се опитват да \"приравнят\" полето с фалшиви еквиваленти.\n[504.044s] Любопитно е да чуете как някои религиозни хора използват термините\n[507.991s] като ''религия'' и ''вяра'' по подигравателни начини.\n[511.26s] Чували ли сте някога учен или скептик да се опитва да омаловажи религиите\n[515.276s] наричайки ги \"научни\" или \"скептични\"?\n[518.159s] Едностранчивостта тук е доста показателна.\n[521.299s] Използването на думи като \"религия\" и \"вяра\" като подигравателни термини\n[525.467s] само подкопава религията.\n[528.079s] Някои се опитват да приравнят атеизма с тоталитарни идеологии като Сталинизма, и те грешат по същата причина,\n[534.96s] както и тези, които се опитват да омаловажат атеизма, като го наричат религия.\n[539.024s] Атеизмът не е идеология.\n[541.4s] Той няма система от доктрини, и вярвания.\n[543.865s] Ако някой е просто атеист, все още не знаем нищо за моралните му ценности.\n[548.26s] Някои хора (включително хора, които трябва да знаят по-добре)\n[551.74s] се опитват да \"приравнят\" насилствените, неморални жестокости\n[554.779s] на някои не теистични тоталитарни режими\n[557.4s] със светски хуманизъм.\n[559.52s] Светският хуманизъм е естествено\n[561.76s] отхвърлящ свръхестествените възгледи за реалността\n[564.454s] и наистина има набор от организационни принципи.\n[567.42s] Но принципите му напълно се противопоставят на принципите на тоталитарните идеологии.\n[573.105s] Светският хуманизъм се фокусира върху правосъдието, благосъстоянието, подобряване на условията на живот, демокрация и освобождаване от авторитарните системи за управление.\n[582.833s] Той защитава стойността на разума, доказателствата, скептицизма, научната методология и свободното изследване —\n[589.56s] не блокиран от религиозна или политическа коректност.\n[593.02s] Приравняването на светския хуманизъм с тоталитарните режими показва само липса на разбиране.\n[602.155s] Хората, които използват фалшиви еквиваленти, за да омаловажат насилието си, често показват най-сложната словесна и интелектуална странност,\n[609.63s] за да покажат варварските си практики като нещо достойно за уважение и дори благородно.\n[614.335s] През април 2019 г. султанът на Бруней, Хасанал Болкиах\n[618.608s] представи на Европейския парламент\n[620.66s] това, което той нарича паметна бележка\n[622.78s] за да се изяснят механизмите на прилагане на \"шериатския Наказателен кодекс\" в неговата страна.\n[628.62s] В този документ Болкиах се опита да обоснове своето решение да въведете убиването с камъни до смърт, като наказание за прелюбодеяние и анален секс, заедно с ампутация заради кражба.\n[638.802s] Той заяви, че тези наказания не са човешко творение, а са предписани от Ислямското божество Аллах —\n[644.3s] абсурдно изявление, което е представено на не-мюсюлмани, които не вярват че Аллах съществува.\n[648.916s] Фундаменталната природа на теистичните религии\n[651.574s] е, че всички те действат, като се обръщат към авторитет, който никой извън религията не признава.\n[656.92s] В първа точка на документа се посочва:\n[659.06s] „Силни религиозни ценности с богато наследство от традиции и култура\n[662.733s] формират самата основа на уникалната Брунейска идентичност\n[666.44s] — любеща, мирна и уважаваща общност —\n[669.06s] което е много важно да се запази\n[670.92s] и затова тази страна се нарича дом на мира.\"\n[674.53s] Популяризиране на закони, които се застъпват за садистичното убийство на сексуални партньори\n[679.42s] като същевременно определяте себе си като любещ, мирен и уважителен\n[682.38s] е класическо \"приравняване\"\n[683.88s] — изтриване на бруталността от картината, сякаш жестокостта не съществува.\n[688.138s] Когато чуем изказването „дом на мира“, какви очаквания идват на ум?\n[693.08s] Представете си две общества.\n[695.42s] В общество А законите на държавата нямат морален смисъл.\n[699.3s] Те забраняват редица безобидни дейности\n[702.02s] и раздават неравномерни свободи на различни подгрупи.\n[705.42s] Тайни агенти на право прилагащите органи се смесват анонимно сред населението.\n[710.2s] Непослушните граждани биват залавяни нощем и отвеждани в очакване на екзекуцията.\n[715.82s] В общество Б гражданите се радват на еднакви свободи\n[719.12s] и получават морално образование, което насърчава съпричастността, състраданието и уважението.\n[724.24s] Законите са прозрачни, минимални и се ограничават до случаи на ясно разпознаваема злоупотреба.\n[730.4s] Престъпленията са адресирани с акцент върху възме��дието и рехабилитацията.\n[735.82s] Външно, поведението на хората в двете общества е поразително сходно.\n[739.886s] Престъпленията са също толкова редки, а публичните прояви на уважение и цивилизованост са преобладаваща норма.\n[746.409s] Бихме ли считали и двете общества за „домове на мира“?\n[751.251s] Социалната основа на насилствената принуда \"приравнява\" ли се на доброволното сътрудничество?\n[757.38s] Дали мирът е само за изкуствено гладък социален ред —\n[760.931s] дори и да се постигне чрез страх и потисничество?\n[764.835s] Ако нашите определения за мир не съвпадат\n[767.426s] може да ни очакват неприятни изненади\n[769.88s] когато се озовем в \"дом на мира\".\n[773.86s] Определението за мир на Болкиах остава под въпрос.\n[777.5s] Точка 8 от документа на Болкиях гласи:\n[780.16s] „Шериатския наказателен кодекс— има за цел да уважава и защитава законните права на всички хора...“\n[785.8s] Това е още по-нечестен \"приравняващ\" език.\n[788.56s] Болкиах рисува себе си като почитател и защитник на правата на хората\n[792.41s] като в същото време, той прилага закони, които грубо пренебрегват и нарушават правата на хората.\n[797.66s] Точка 9 гласи:\n[798.944s] \"Шериатския наказателен кодекс се фокусира повече върху превенцията, отколкото наказанието\" и и \"целта му е да образова, възпира и реабилитира и възпитава\".\n[808.216s] Опит за \"приравняване\" на смъртните заплахи с образование, рехабилитация или възпитание\n[813.178s] това отново е извращение на езика.\n[816.08s] Точка 10 гласи:\n[817.58s] „Шериатския наказателен кодекс не криминализира, нито има намерение да накърнява статуса на човек\n[822.843s] въз основа на сексуална ориентация или вярвания, включително еднополовите отношения “.\n[828.0s] Както членовете на Брунейската гей общност отбелязват\n[830.76s] когато вашите съседи ви убеждават, че заслужавате да бъдете замеряни с камъни, ставате по-малко човек в техните очи.\n[837.254s] Твърдението на Болкиах, че няма намерение да се ангажира със статута на човека, отново е кухо \"приравняване\",\n[842.74s] показвайки го, като поразително малоумен\n[845.225s] или поразително лицемерен.\n[847.8s] Точка 10 продължава:\n[849.2s] \"Криминализирането на содомията има за цел да защити святостта на семейната линия\n[853.92s] и браковете на Мюсюлманите, особено на жените.\"\n[857.688s] Всъщност криминализирането на някои форми на секс нарушава святостта на връзката\n[862.519s] като се опитвате да диктувате какво могат и не могат възрастните да правят едни с други.\n[867.146s] Това е натрапчиво и инфантилизиращо за всички възрастни, независимо от пола\n[872.98s] Точка 12 гласи, че\n[874.18s] \"...присъди на Хадда— убиване с камъни до смърт, и ампутация\n[877.8s] наложени за престъпления на кражби, грабежи, изневяра и содомия\n[881.4s] имат изключително високи прагове за доказване\n[884.004s] изискващи не по-малко от двама или четирима мъже\n[886.724s] с висок морален статут и благочестие като свидетели .... \"\n[889.848s] Правителството може да въведе смъртно наказание за свирене във вторник\n[893.305s] и да твърди, че може само да доведе до смъртно наказание\n[895.766s] ако доказателствата за свиренето са наистина добри.\n[898.647s] Стандартите за доказателство не са проблемът тук.\n[901.34s] А варварската, примитивна природа на наказанията\n[904.14s] и фактът, че безобидното поведение е неразумно криминализирано.\n[908.624s] Болкиах използва израза \"мъже с висок морален статут\"\n[912.08s] да създава впечатление за целомъдрие\n[914.169s] но високо-моралните хора не биха имали нищо общо с тези варварски закони.\n[919.166s] Може би най-непочтителните твърдения на Болкиах\n[922.06s] са в точка 3-та от Априлския му документ, гласящ:\n[925.323s] \"Трябва да разберем, че разнообразието от култури, традиции и религиозни ценности в света е голямо\n[931.08s] което означава, че няма нито един стандарт, който да отговаря на всички\"\n[934.854s] Повърхностно изглежда, сякаш Болкиах насърчава многообразието.\n[939.16s] Но действията му не съответстват на думите му.\n[942.007s] Чрез въвеждане на Ислямското право върху не-мюсюлманите\n[945.021s] той ги лишава от религиозна свобода.\n[947.789s] Болкиах призовава за толерантност, уважение и разбиране от другите\n[951.7s] но не успява да демонстрира тези качества той самия.\n[955.32s] В началото на май 2019 г.\n[957.7s] дни след публикуването на документа\n[959.86s] широко се съобщаваше, че Болкиах казал, че няма да наложи смъртното наказание\n[963.84s] след глобална реакция срещу законодателството му.\n[967.421s] Това, което всъщност каза, беше, че ще има мораториум върху смъртното наказание\n[971.646s] което просто означава временно отлагане или забрана.\n[974.96s] Той също така заяви, че има много въпроси и погрешни схващания относно прилагането на Шериатския наказателен кодекс\n[980.837s] и че след като те бъдат изяснени\n[982.62s] основателността на закона ще бъде очевидна.\"\n[985.24s] Изявлението на Болкиах не е успокояващото послание, което някои тълкуват като такова.\n[989.905s] Каза само, че ще има временен период без прилагане, докато погрешните възприятия се коригират\n[995.46s] след което той очаква законът да бъде широко признат като много добър.\n[1001.114s] Нека да разгледаме употребата на тази дума „погрешни схващания“.\n[1004.9s] Това е често срещана техника за объркване.\n[1007.365s] Когато насилниците искат да отрекат насилието си, те често твърдят, че действията им са неразбрани или неправилно възприети.\n[1014.72s] Вместо да признаят и коригират вредното си поведение\n[1017.743s] те се опитват да ни накарат да поставим под въпрос нашето възприятие за него.\n[1021.467s] Но да убиваш хора с камъни, защото правят секс, не е някаква загадъчна концепция, която обикновените хора трудно разбират.\n[1028.9s] И запазването на варварските закони в условията на временно спиране не е равносилно на отмяна на тези закони.\n[1035.182s] Болкиах тук няма някакво специално разбиране\n[1037.839s] \"с което всички бихме се съгласили, ако само го възприемахме по правилния начин\"\n[1041.9s] Не, предложенията му са морално осъдителни\n[1044.68s] а опитите му да ги защити са лицемерни, нечестни и манипулативни.\n[1050.0s] Бруней от известно време върви по пътя на екстремизма.\n[1053.36s] Тези наскоро наложени наказания са само най-новият етап\n[1056.98s] в приложението на своят Шериатски наказателен кодекс от 2013 г.\n[1060.86s] който се въвежда поетапно\n[1063.44s] Преди около пет години\n[1064.78s] Болкиах започна да изпълнява смъртни присъди за вероотстъпничество\n[1068.168s] добавяйки Бруней в списъка на страните\n[1070.4s] където да си бивш Мюсюлманин е държавно престъпление.\n[1073.83s] Внушавано е, че Шериатски наказателен кодекс на Болкиах\n[1076.8s] е просто опит за привличане на бизнес от заможни Ислямски нации\n[1080.44s] и че тайно той няма намерение да го налага.\n[1084.48s] Но — ако това беше вярно — какво се случва, когато той умре?\n[1088.0s] Какво ще стане, ако някой от неговите наследници реши да активира цялото законодателство, което той така услужливо изработил?\n[1095.04s] Въвеждането на тези закони застраши живота на хората.\n[1099.08s] Отрезвяващо е гледането на тези назадничави стъпки към невежеството и жестокостта.\n[1104.18s] Но назадничаво е предвидимата посока\n[1106.64s] на индивиди и идеологии\n[1108.84s] които лъжливо \"приравняват\" невинността с вината\n[1111.62s] и порок с целомъдрие\n[1114.16s] Важно е да разделите правилно отделните понятия,\n[1116.96s] и не позволявайте те да бъдат замъглени от фалшиви еквиваленти.\n[1120.52s] Само чрез точно изобразяване на реалността\n[1122.98s] можем да изградим справедливост във взаимодействията и моралните ни системи\n[1127.664s] Ако внимаваме да оспорваме недостатъците и предразсъдъците в нашите разсъждения,\n[1132.008s] да се правят преценки за поведението е напълно подходящо, а не нещо, което трябва да се избягва.\n[1137.5s] Оценка върху поведението\n[1139.06s] — нашето, както и на другите хора —\n[1141.18s] е начинът, по който развиваме моралното чувство.\n[1144.64s] Не всички нагласи и поведения са морално равни.\n[1148.16s] Някои са по-лоши от други и заслужават критика.\n[1151.962s] Опитите да се \"приравнят\" неравномерните представи и поведения — поради егоистични мотиви или поради настройката \"да изглеждаш безпристрастен\"—водят до деградация на нашите морални компаси.\n[1163.025s] В тази епоха, когато манипулативните тактики са оръжие, ако искаме да се доближим до истината и справедливостта, трябва да сме напълно наясно с \"приравняването\" и фалшивите еквиваленти.\n[1179.117s] Този канал изследва проблемите, свързани с манипулацията, злоупотребата и догмата. Много благодаря на всички, които подкрепят тази работа."}'
