transcript: '{"content":"\n[4.601s] \"العُيوبُ الخياليّة\"\n[10.268s] من أجل \"لوغان\" و\"تيم\"\n[12.557s] \"أدْهى المُحتالين لا يبيعونا دواءً مُزَيَّفًا لأوجاعٍ وآلامٍ حقيقيّة. فعندما يستمر مرضنا تنتهي اللعبة.\"\n[17.49s] \"أدْهى المُحتالين يبيعونا أمراضًا مُزَيَّفة وعيوبًا خياليّة. عندها يمكن للّعبة أن تستمر مدى الحياة.\"\n[22.34s] \"دوافعٌ خفيّة\"\n[26.778s] مُعَلِّمَة الدَّورة طلبت منّا جميعًا أن نتخيَّل بأنّ عميلنا قد وصل متأخرًا للعلاج،\n[31.188s] مُدَّعِيًا بأنّ القطارات قد تعطَّلَت.\n[33.608s] دعتنا لاقتراح أسباب أخرى مُحتَمَلة لهذا التأخير.\n[37.808s] أحد الطلبة اقترح بأنّه قد يكون فعل عُدواني سلبي،\n[41.083s] ربما عميلنا كان غاضبًا تجاهنا.\n[43.423s] طالبة أخرى اقترحت بأنه قد يكون مُشكلة بتقدير الذّات.\n[46.483s] بعض العُملاء يشعرون بعدم استحقاقهم لأي وقت يُمضى لأجلهم.\n[50.293s] أحدٌ آخر اقترح بأن العميل قد يكون خائفًا من التغيير الشّخصي،\n[53.673s] وأن تأخيرهم قد يكون مُحاولة لا واعية لتخريب العِلاج.\n[57.966s] التخمينات هذه وغيرها حول الدّوافع الخفيّة للعميل\n[61.796s] كلها استَقبَلَت هزّة رأس قبوليّة من قِبَل المُعَلِّمة.\n[64.64s] عندما جَفَّت الاقتراحات، أضفتُ ما كان يبدو سببًا أخيرًا واضحًا:\n[69.086s] ربما القطارات كانت مُعَطَّلة، كما قال العَميل.\n[72.717s] المُعَلِّمَة عبَسَت وقالت: \"كلا!\"\n[75.217s] قالت: \"علينا دومًا أن نفترض أن للعميل دافعٌ ما.\"\n[78.636s] كُنتُ في حيرة.\n[80.246s] قُلتُ: \"القطارات تتعطَّل فعلًا. السيّارات تَتَعَطَّل فعلًا.\"\n[84.246s] \"أحيانًا تحصل أمور خارج سيطرتنا تجعلنا نتأخّر.\"\n[88.047s] لكنّها رفضَت النقطة، وكرَّرَت بأننا يجب دومًا أن نفترض دوافعًا شخصيّة.\n[93.679s] قلت: \"عندما نفترض دوافعًا شخصيّة قد لا تتواجد،\"\n[96.889s] \"نُخاطِرُ بوصف عميلنا بمشاكل خياليّة لا يملكونها.\"\n[101.169s] \"ذلك ليس دعمًا لهم، بل إضافة فعّالة لمشاكلهم.\"\n[105.608s] المُعَلِّمَة فجأةً رمت يدَيْها للأعلى وصرخت:\n[108.448s] \"إن لم أفترض أن عُملائي يمتلكون دوافعًا غير واعية لا أستطيع العمل معهم!\"\n[113.047s] قُلتُ: \"بالطَّبع يمكنكِ العمل مع العُملاء بدون افتراضات.\"\n[117.107s] قلت: \"يمكنك التَّحَقُّق بشكل منفتح ما إذا وُجِدَت أسبابٌ أخرى خلف تأخيرهم.\"\n[121.727s] \"يُمكنكِ سؤالهم عن شعورهم حيال جلسات العلاج،\"\n[124.537s] \"أو إعطائهم المجال للنّقاش عن أية مؤاخذات، أو قلقٍ بشكل منفتِح.\"\n[129.227s] \"لكن من المُهم جدًّا أن نكون مُنفتحين لفكرة أن أعذارهم للتأخير قد تكون صادقة.\"\n[134.844s] ذَكَّرتُها عن رأيٍ يُنسَب إلى \"فرويد\":\n[138.154s] \"أحيانًا السيجار فعلًا مُجَرَّد سيجار.\"\n[141.219s] أحيانًا الأمور هي كما تَبدو فَقَط، بدون معنى أو رمزيّة مخفيّان.\n[146.307s] جلست في صمتٍ لوقت طويل تُحَدِّقُ في الجِدار.\n[149.447s] الأشخاص في المجموعة نظروا لبعضهم البعض بارتباك،\n[151.827s] مُتسائلين عمَّا يحصُل معها.\n[153.797s] أخيرًا أرجَعَت انتباهها للمجموعة، واستمَرَّت للتمرين التّالي،\n[157.877s] وكأنّ شيئًا لم يحصُل.\n[160.21s] كان مُجرَّد مرّة أخرى في سلسلة من الانفجارات الصّارخة من قِبَل العديد من أعضاء الطّاقم،\n[164.82s] في دورة علاجيّة حضرتُها قبل سنين قليلة.\n[167.7s] كنتُ مُعالجًا مُؤهَّلًا في ذلك الحين،\n[170.01s] وقد انضممت للدّورة فقط لأبني على خبرتي الموجودة.\n[173.55s] الطّلبة الآخرين الذين لم يتأهّلوا بَعْد كانوا على المِحَك أكثر منّي.\n[177.26s] حوالي ثُلث المَجموعة انتهوا بمُغادرة الدّورة،\n[179.82s] استجابة لإساءة تَصَرُّف مُستمرّة وانتهاكات أخلاقيّة من قِبَل الطّاقَم.\n[184.84s] كُنّا نُوَجَّهُ تِكرارًا لتشخيص عُملاءنا بمشاكل نفسية زائفة.\n[189.69s] على الرغم من عدم امتلاكهم تدريبًا طبّيًّا،\n[191.595s] الطاقم وَجّهونا لافتراض أن الأمراض الجسدية للعملاء كانت لأسباب نفسية فقط،\n[196.425s] ولإبقاء العُملاء في العلاج بأي ثمن،\n[199.315s] حتى عندما يُعَبِّرون عن استعدادهم بإنهائه.\n[202.075s] طُلِبَ مِنّا تحذيرهم من مخاطر مُغادرة العِلاج مُبَكِّرًا،\n[205.665s] ومن السُّقوط مُجدَّدًا في الأنماط المُدَمِّرة القَديمة.\n[209.106s] عندما جادَلَ الطّلبة حول مُمارسات مركز التّدريب،\n[211.956s] اقترح أعضاء الطّاقم بأنهم يُعانون من مشاكل نفسيّة يجب أن يناقشوها مع مُعالج.\n[217.849s] المكان كان مليئًا بالعُيوب الخياليّة.\n[221.635s] بالطبع، إنه جزء من الحياة اليوميّة أن نُتَّهَم أحيانًا بعيوبٍ بدون أي أدلّة جيّدة،\n[227.355s] لكن في ميادينٍ مُعيّنة، تلك الاتّهامات تُشَكِّل لكمة أقوى،\n[232.088s] العِلاج النّفسي هو أحدها،\n[233.847s] والدّين هو الآخر.\n[235.518s] انتهاكات مُنافية للطبيعة\n[237.957s] التّلاعُبات الموجودة في حقل الأديان ليست أمرًا مُمَيَّزًا،\n[242.0s] بل هي مُنَظَّمَة أكثر، ومُغطّاة بِعباءة عدم المَساس التي تُسَمّى بـ\"القداسة\"،\n[247.23s] وهذا نفسه تلاعُبًا مُصَمَّمًا لإخراس المُعارضة.\n[250.98s] إنها أيضًا أكثر ضخامةً.\n[252.93s] الأديان ذاتها التي تُدين المُقامرة بكل وَرَع،\n[255.8s] تطلب منا المُقامرة بحياتنا كُلها مُقابل تَصوُّراتهم للكون غير المُثبتة.\n[260.971s] هذا الرِّهان الدّيني يستخرج منّا أكثر - لحدٍّ لا يُحصى - من الرّهان على الأحصنة.\n[266.271s] أحد أكبر الحِيَل الدينيّة هي إقناعنا ��أن فينا خلل كامن.\n[271.708s] المسيحيّة تَدَّعي بأننا كُلنا نحمل وصمة عار \"الخطيئة الأولى\"،\n[275.868s] التي ارتكبها البشر الأوائل الخُرافيّين \"آدم\" و\"حوّاء\"\n[279.078s] عندما عصيا الإله المسيحي بأكلهم من شجرة معرفة الخير والشّر.\n[284.545s] الإسلام يرفض قصة الخطيئة الأولى التّابعة للدين الإبراهي الذي سبقه،\n[288.965s] لكنّه مع ذلك لا زال يُصَوِّر البشر بأنّهم ناقصون بطبيعتهم،\n[291.925s] ويؤكد على الحاجة المستمرّة للتكفير عن الذُّنوب، وطلب المَغفرة الإلهيّة.\n[297.055s] مؤسّسه \"محمد\" وضع سُبلًا عديدة لكسب المغفرة.\n[301.056s] أحدها يتضمّن ما يُسمّى بـ\"ليلة القدر\"،\n[305.646s] التي تقع في شهر الصّيام \"رمضان\".\n[308.256s] \"محمد\" ادّعى بأن الإله الإسلامي \"الله\" سيغفر كل الذنوب الماضية للنّاس\n[313.176s] الذين يدْعون خلال هذه الليلة.\n\n[صحيح البخاري - حديث رقم ١٩٠١]\n[315.146s] المشكلة هي أنه لم يُحدِّد التاريخ الذي تقع فيه.\n[318.536s] قِيلَ للأتباع بأنّها إحدى الليالي الحارّة من أواخر عشر ليالي من رمضان.\n\n[صحيح البخاري - حديث رقم ٢٠١٧]\n[323.404s] بعض علماء الإسلام يعترفون علنًا بأن هذا الغموض حول \"ليلة القدر\"\n[327.534s] مُصَمَّمًا لجعل النّاس يتعبّدون خلال الشّهر،\n[330.484s] أملًا في اصطيادها.\n[332.807s] لكن حتّى أشدُّ المُتَعَبِّدين التزامًا يُمكن أن تُمحى كل ممارساتهم التّعبُّديّة بمشيئة الإله.\n[338.377s] في كتابه \"الكبائِر\"، مؤلِّف القرن ال١٣م المُبَجَّل \"الإمام الذّهبي\"\n[343.626s] يشرح ذنب \"الأمن من مكر الله\".\n[347.495s] ادّعى بأن النّاس الذين يظنّون بأنّهم قد تأهّلوا للفردوس\n[350.045s] يُمكن أن تُستَبدَل وُجهَتُهم عمدًا من قِبَل \"الله\"\n[353.565s] عندما تكون الفردوس تَبْعُدُ بمقدار مُجرّد ذراع.\n\n[الكبائر للذهبي - الكبيرة الثالثة والستون]\n[356.545s] بعض المُدافعين يدّعون بأن ذلك مُجَرَّد تحذير للأفراد الذين ينغمسون بفعاليّة في الذّنوب،\n[361.235s] على افتراض أنهم سيُغْفر لهم تلقائيًّا إذا أتمّوا واجباتهم العباديّة.\n[366.275s] لكن \"الذّهبي\" يُشير لتفسير أبعد مَدًى من ذلك يُورِّطُ الجَميع.\n[371.074s] أيُّ أحدٍ - صالح أم طالح - يتجرَّأ للشعور بالطمأنينة حول مكانهم في الفردوس،\n[375.564s] يُمكن إجباره لارتكاب الذّنب من قِبَل \"الله\" في الدقيقة الأخيرة،\n[378.962s] ويتم إرساله للنّار.\n[380.835s] \"الذّهبي\" يقول بأن \"الله\" يمكنه اختيار\n[382.865s] أن يجعلَ أحدًا ما قابلًا، أو رافضًا، أو راغبًا، أو كارهًا.\n[387.865s] ويستشهد بادّعاء \"محمد\" بأن قلب الشّخص في قبضَة يد \"الله\"\n[392.725s] الذي يستطيع تغييره متى شاء.\n[395.446s] ما يتم تشجيعه هنا هو حالة من عدم الأمان المُستَمِر.\n[400.236s] يُقال للنّاس بأنهم مريضون نفسيًّا،\n[402.746s] ويُتلاعب بهم كي يُلاحِقوا علاجًا دينيًّا لا ينتهي،\n[406.096s] ويُتركون يُخمِّنون للأبد عمّا إذا نجح العِلاج،\n[409.586s] ويُحَذَّروا بأن أمورًا سيئة قد تحصل\n[411.806s] لو تجرَّأوا على الظّنِّ بأنّهم على ما يُرام.\n[415.595s] \"جوزيف سميث\" مؤسس فرع المسيحيّة \"المورمونيّة\"،\n[419.145s] أيضًا رفض القصة المسيحيّة عن الخطيئة الأولى.\n[422.485s] قال بأن الناس سيُعاقَبون على خطاياهم، لا على خطيئة \"آدم\".\n[427.095s] وبالطّبع، ليس هنالك عدالة في مُعاقبة الناس على خطايا الآخرين،\n[432.465s] لكن ليس هنالك عدالة أيضًا في مُعاقبة النّاس على أمور لا تضر الآخرين.\n[437.432s] تمامًا كالجماعات الدّينيّة الأخرى،\n[439.171s] المورمونية تستنكر نطاق من الممارسات غير المُضِرّة على أنّها ذنوب.\n[444.001s] للأسف، عندما يُصَنِّف القادةُ الدّينيّون شيئًا بأنّه \"خطيئة\"،\n[447.151s] العديد من الأتباع لا يتساءلون أبدًا عن وجود تبرير سليم لذلك التصنيف.\n[451.744s] عوضًا عن ذلك، يحاولون بجُهدٍ تبرير التّصنيف.\n[455.776s] اختَر أي نشاط عشوائي:\n[458.026s] الغناء، أو الرّسم، أو استعمال المظلّات، أو السّفَر للفضاء.\n[463.006s] صنّفه كـ\"خطيئة\" ولاحظ مدى سهولة إيجاد أسبابٍ زائفة لإدانته.\n[470.228s] عندما نتعلم قبول أسبابٍ زائفة كأساس لتفكيرنا،\n[473.988s] القادة الدّينيّون يُصبحُ باستطاعتهم إطلاق صفة \"الخطيئة\" لما يحلو لهم،\n[478.198s] وسنتبعهم بدون تفكير.\n[481.483s] وهذا ما يجعل المُمارسات الإيجابيّة و الصّحيّة والعقلانيّة تمامًا\n[485.453s] تُصبح مُسَمَّمة بالشعور بالذّنب والعار غير المُبَرَّر.\n[489.413s] أحد الجوانب التي نجحت الأديان في جعلها وصمة عار هو الجنس.\n[493.873s] القادة المورمونيّون يُصنّفون العديد من التعبيرات الجنسيّة الطبيعيّة\n[497.334s] - بما فيها الذاتيّة، ومثليّة الجنس، ومُمارسات قبل الزواج مع الجنس الآخر -\n[501.904s] كأخطر أنواع الخطايا.\n[504.734s] يُدينون حتّى الأفكار الجنسيّة،\n[506.834s] مُجسّدين \"جرائم التفكير\" للكاتب \"جورج أورويل\".\n[509.474s] \"البكارة\" تُبَجَّل، وغير الأبكار تتم مُقارنتهم بالعلكة المُستعملة.\n[514.855s] المورمونيّون السابقون قد أخبروا عن دروسٍ دينيّة\n[517.145s] حيث تُدعا المجموعات لتناول \"الكاب كيك\" من طبق،\n[520.575s] حيث أحدها تم لعقها علنًا من قِبَل المُدرِّس.\n[523.885s] عندما تكون آخر ما يتم اختياره، يتم إيصال الفكرة.\n[527.135s] \"لا أحد يرغب في البضائع المُستعمَلة.\"\n[529.641s] لكن هل هذه المُقارنة المُهينة تصمد؟\n[532.716s] في ورقة علميّة نُشِرَت في ٢٠١٦م في صحيفة للأبحاث الجنسيّة عنوانها\n[536.516s] \"هل فقدت البكارة فضيلتها؟\"،\n[538.726s] \"أماندا غاسيلمان\" وزملاؤها وجدوا أن الأفراد ذوي الخبرة الجنسيّة\n[542.686s] يحملون جاذبيّة أكبر كشركاء رومانسيّين مُحتَملين.\n[546.286s] حتى الأفراد معدومي الخبرة فضَّلوا درجة من الخبرة في شريكهم.\n[550.706s] يبدو بأن غير الأبكار يُرَون غالبًا بأنّهم \"كاب كيك\" أكبر، لا مَلعوق.\n[555.976s] بالطّبع، مُقارنة \"الكاب كيك\" هي رنجة حمراء [مغالطة تغيير الموضوع].\n[559.196s] عوضًا عن تقديم حُجّة أخلاقيّة، توصم النّاس بالعار فحسب.\n[563.371s] أي نشاط - جيد أم سيء - يمكن وصمه بالعار.\n[566.831s] اللاأخلاقيّة لا تُعَرَّف بوصمة العار.\n[569.451s] القتل العمد والسّرقة لا يُعتبران لا أخلاقيّان لأنهما غير محبوبَيْن اجتماعيًّا،\n[573.501s] بل لأنهما يتضمّنان ضررًا يُمكن التّعرُّف عليه.\n[576.667s] في انعدام دليل واضح على الضرر،\n[578.667s] القضيّة ضد جنس ما قبل الزّواج تفشل.\n[581.865s] الجماعات المُتلاعبة تستعمل كثيرًا ما تستعمل المُقارنات لمحاولة قطع تيّار تفكيرنا،\n[586.235s] لكن كادّعاءات الحقيقة، المُقارنات أيضًا تحتاج للتمحيص.\n[591.587s] التّزمُّت المورموني غير محصور على جنس ما قبل الزّواج،\n[595.899s] في رسالة كُتِبَت عام ١٩٩٢م إلى رؤسائها والأسقف،\n[599.009s] المكتب المورموني للرئاسة الأولى قال بأن المُتزوّجين المُذنبين\n[602.609s] بممارسات غير طبيعيّة، أو غير نقيّة، أو غير مُقدّسة،\n[606.329s] بما فيها الجنس الفموي،\n[608.049s] يجب أن لا يدخلون المَعبَد قبل التوبة والتوقف عن تلك الممارسات.\n[613.215s] قادة أديان آخرين أيضًا حاولوا التّدخُّل في الجنس الزّواجي.\n[616.805s] \"محمد\" أدان الجنس الشّرجي بين المتزوجين المسلمين.\n[620.708s] القادة في منظمة \"شهود يهوة\" أصدروا حكمًا في البداية\n[623.748s] بأن الجنس الفموي داخل الزواج يستحق الطّرد.\n[627.988s] بعد ذلك ألغت ذلك الحكم، مُعترفين بأن تلك العلاقات الحميميّة الزوجيّة ليست من شأنهم،\n[633.366s] فقط ليجعلوه جريمة يُطرد فاعلها مُجدَّدًا بعد سنوات قليلة.\n[638.128s] ما لا يُعد من النّاس يُعانون من العار والقلق غير المُبرَّرَيْن،\n[641.918s] بسبب العقائد دينيّة التي توصم العار.\n[645.327s] عندما يدّعي النّاس أنّك مُعيب، لا تقبل بالمُقارنات.\n[649.197s] لا تقبل بوصمات العار.\n[651.027s] لا تقبل اتهامات بارتكاب الذّنوب.\n[653.777s] كل تلك الأمور يمكن إطلاقها على أي نشاطٍ على الإطلاق.\n[657.208s] اطلب الدّليل.\n[659.288s] إن لم تُقَدَّم الأدلّة، النقاش انتهى.\n[663.272s] \"تحيُّزات مخفيّة\"\n[666.793s] أحد مجالات الحياة حيث يتوافر الدّليل هو التمييز:\n[670.513s] المعاملة غير العادلة والقائمة على اعتقادات مُسبقة تجاه النّاس،\n[673.373s] بالخصوص ذلك القائم على التصنيفات الجماعية.\n[676.283s] بعض أنواع التمييز تكون وقحًا، وبدون أي ندم.\n[680.033s] أنواعٌ أخرى تكون خفيّة أكثر.\n[682.523s] لما كنا أطفال، العديد منا قد تعلّم إدراك حيثيّات التمييز الماكرة وغير المُعلنة.\n[688.553s] أبواي قد أنهيا مِرارًا صداقاتي مع أطفالٍ مُعيَّنين،\n[692.493s] لكن لم يعترفوا أبدًا بأن السبب هو لون البشرة.\n[695.503s] عوضًا عن ذلك، التجؤوا إلى تلميحات بتصنيف أصدقائي\n[699.933s] بأنّهم \"غير لائقين\"\n[700.943s] و \"غير مُحتَرَمين\"\n[702.013s] و \"تأثير سيِّء\".\n[704.431s] بالطّبع الأطفال يتعلّمون قريبًا فك شفرة هذه اللُّغة.\n[707.631s] عندما يُصَنَّف الأطفال المُضحكين والدّافئين واللّبِقين بأنهم \"تأثير سيّء\"\n[711.821s] لا يأخذ الأمر طويلًا كي تُدرِك المُشكلة الحقيقيّة.\n[714.96s] قَبل فترة، قِيل لي عن اختبار نَفسي مُصَمَّمٍ لتناوُل الأنواع الخفيّة من التمييز.\n[721.53s] كان يُسمّى \"اختبار الترابط الضِّمني\"،\n[725.57s] وصانعيه ادّعوا بأنه يقيس التحيُّز اللا واعي.\n[729.53s] عندما أدّيتُ بعض من تلك الاختبارات عبر الانترنت،\n[731.8s] وجدتُ بعضَ المشاكل المفاهيميّة الضّخمة.\n[735.035s] عندما حصلت على نتائجي،\n[736.395s] لاحظتُ بأن صانعي الاختبار قد أرفقوا بيانًا\n[739.045s] يُصَرِّح بأن هذه ليست تقييمات نهائيّة.\n[742.018s] لكن بعد أشهرٍ انزعجت باكتشاف أن هذا الاختبار\n[745.738s] يتم استعماله حاليًّا كجزء من التدريبات على التّنوُّع في أماكن العَمَل.\n[750.048s] مُصطلَح \"التحيُّز اللا واعي\" له استعمالَين مُختلفَيْن\n[754.038s] أحدُهما ببساطة يُشير إلى سلوكٍ مُلاحَظ يكمن خارج إدراكنا.\n[758.598s] مثلًا، المُعَلِّمة قد تُفضِّل بعض الطّلبة على آخرين دون أن تُدرك ذلك.\n[763.628s] هنا يمكننا تبيين دليلًا للأشخاص على تحيُّزهم،\n[766.288s] وبذلك نُعطيهم فرصة لفهم ومُعالجة المُشكلة.\n[770.052s] الاستعمال الثاني يُشير للتحيُّز الذي يكمُنُ خارج إدراك الشّخص،\n[773.722s] والذي ليس له أدلّة مُلاحَظَة.\n[776.832s] عندما لا يشعر الناس بأفكار متحيِّزة أو يُظهِرون سلوكًا مُتحَيِّزًَا،\n[781.352s] الاتهامات بالتحيُّز تُصبح أمرًا إيمانيًّا،\n[784.102s] تاركةً النّاس عاجزين عن فهم أو مُعالجة المُشكلة المزعومة.\n[788.896s] \"اختبار الترابط الضِّمني\" ينحدر تحت ذلك الاستعمال الثاني.\n[792.112s] \"اختبار الترابط الضِّمني\" يختبر زمن الاستجابة.\n[794.842s] يأخُذُ صفة بشريّة واحدة\n[796.862s] - مثل لون البشرة، الميل الجنسي، الجنس، الوزن، العمر -\n[801.112s] ويُقسِّمُها إلى قسمين.\n[803.151s] مثلًا العُمر يُقَسَّم إلى \"يافع\" أو\"كبير السن\".\n[806.931s] على المُختَبَرين تصنيف صور وكلمات عديدة بأسرع ما يمكن\n[810.574s] باستعمال زِرَّيْن من لوحة المفاتيح.\n[812.484s] في بعض المُحاولات يتم تعيين صور لأشخاص يافعين وكلمات حسنة لزرٍّ واحد،\n[818.772s] وصور لأشخاص كبار السِّن وكلمات سيّئة للزِّر الآخر.\n[823.859s] في مُحاولات أخرى يتم تعيين اليافعين والكلمات السيّئة لزر واحد،\n[828.831s] وكبار السّن والكلمات الحسنة للزر الآخر.\n[832.841s] زمن الاستجابة الأسرع لظهور أزواجٍ مُعيّنة\n[835.191s] مثل \"كبار السّن والكلمات الحسنة\"\n[837.141s] يُؤخَذ كإشارة لتحيُّزٍ لا واعٍ في ذلك الاتجاه،\n[841.401s] وكمُتَنَبِّئ للتمييزٍ في العالم الواقعي.\n[845.146s] مفهومان جذريّان هما أساس الاختبارات النفسيّة:\n[848.876s] الموثوقيّة، والصلاحيّة.\n[851.43s] الموثوقيّة تتعلَّق بمقدرة الاختبار على إنتاج نتائج ثابتة.\n[855.97s] أحد أنواع الموثوقيّة - ما يُسَمَّى \"موثوقيّة الاختبار وإعادة الاختبار\" -\n[859.46s] ينظُرُ إلى ما إذا كان الأشخاص الذين يؤدون الاختبار مرتيْن يُظهِرون نتائجًا ثابتة.\n[863.7s] أكبر قيمة للموثوقيّة هي ١.\n[866.16s] الأقل هي صفر.\n[868.19s] قيمة تساوي 0.8 أو أكبر تُظهر مستوى جيِّدًا للموثوقيّة.\n[872.2s] صانعوا \"اختبار الترابط الضِّمني\" قد وضعوا قيمة \"موثوقيّة الاختبار وإعادة الاختبار\"\n[875.48s] ما بين 0.5 و0.6\n[878.408s] قد اعترفوا بأن تلك الموثوقيّة الرديئة قد تُسبِّب مُعدّلات عالية من الأخطاء.\n[883.088s] إن كان هدفنا المُعاملة العادلة،\n[885.277s] إذًا تصنيف الناس كـ\"مُتحيِّزين\" أو كـ\"مُنصِفِين\" عندما لا يكونوا كذلك\n[889.707s] هو الذهاب في الاتجاه الخاطئ تمامًا.\n[893.723s] الصلاحيّة تتعلَّق بما إذا كان الاختبار يقيس ما يدّعي قياسه.\n[897.573s] صانعوا \"اختبار الترابط الضِّمني\" بأن الاختبار يقيس المواقف.\n[901.23s] لكن كما أشار الباحثون، حتى لو كان يقيس الترابطات النفسيّة،\n[905.68s] وذلك نفسه مشكوكٌ فيه،\n[907.59s] الترابطات لا تُساوي المواقف المُؤَيَّدة شخصيًّا.\n[911.508s] قد تعكس ببساطة إدراكًا بالصور النمطيّة المُنتشرة.\n[914.978s] صانعوا الاختبار يدّعون علاوةً على ذلك بأن الاختبار يتنبّأ بالتمييز في العالم الواقعي،\n[918.738s] لكن حتى هم يعترفون بترابطٍ ضعيفٍ جدًّا بين \"اختبار الترابط الضِّمني\" والسلوكيّات التمييزيّة.\n[924.912s] في عام ٢٠١٧م، فريق من العاملين في طب النّفس وطب الطّوارئ\n[929.582s] راجعوا العديد من الدّراسات التي استُعمِلَ بها \"اختبار الترابط الضِّمني\"\n[932.222s] للتحقيق في وجود التحيُّز بين الأطبّاء.\n[934.722s] من بين التسع دراسات التي تمت مُراجعتها، ٧ لم تجد أي تأثيرًا على اتخاذ القرارات الطبيّة.\n[939.352s] الاثنتان الأُخرتان أظهرتا نتائجًا مُحيِّرة للغاية.\n[941.932s] مثلًا \"أليكساندر غرين\" وزملاؤه وجدوا بأن الأطباء الذين حصلوا على نتائج منخفضة في\"اختبار الترابط الضِّمني\" عن العنصريّة،\n[946.902s] ما يُشير لانخفاض التحيُّز،\n[948.322s] قد أظهروا تفاوتًا كبيرًا في قراراتهم العِلاجيّة.\n[951.522s] كانت احتماليّة تقديمهم علاجًا فعّالًا مُعيّنًا لمرض الشرايين التّاجيّة أكبر للمرضى السود،\n[956.484s] مقارنةً بالمرضى البيض.\n[958.414s] في الوقت ذاته، الذين سجّلوا قيمة عالية في \"اختبار الترابط الضِّمني\" للعنصريّة،\n[961.204s] ما يُفترض أنه يتنبأ بإظهارهم تحيُّزًا لصالح البيض،\n[963.284s] عالجوا المجموعتين بشكل مُتساوٍ تقريبًا.\n[966.27s] ورقة علمية في علم النفس صدرت بعام ٢٠١٢م من قِبَل \"جاكي فوراور\"،\n[969.93s] وجدت بأن المُختَبَرين الذين أكملوا \"اختبار الترابط الضِّمني\" حول العنصريّة،\n[972.47s] تصرَّفوا بحذرٍ في التّعاملات القادمة ما بين الجماعات،\n[975.83s] ما قد حدَّ من إفصاحهم الذاتي، وبدوا بأنهم غير لطفاء أو منعزلين.\n[981.22s] آنواع القلق والصراعات تلك مُتوَقَّعة.\n[984.65s] عندما يُخبَر النّاس بأنهم قد يمتلكون عيوبًا نفسيّة دون إعطائهم أي أدلّة سليمة،\n[989.91s] سيُتركون في حالة من اليقظة المُفرِطة،\n[992.153s] ويفكِّرون مُجدَّدًا في كل استجاباتهم.\n[995.203s] التمييز ليس خياليًّا، بل هو موجود،\n[999.193s] في أشكال علنيّة وخفيّة،\n[1001.843s] لكن الاختبارات التي ثبت بأنها غير موثوقة، مثل \"اختبار الترابط الضِّمني\"،\n[1005.403s] - حيث تُنتج تنبّؤات خاطئة حول التمييز -\n[1007.993s] تُساهم فقط في تعكير المياه.\n[1012.086s] سنجدُ دائمًا أُناسًا يقترحون بأنّنا مُعيبون،\n[1014.776s] لكن مجالات مُعيَّنة من الحياة\n[1016.666s] - مثل العلاج، والدين، ومكان العَمَل -\n[1019.376s] تلك الاقتراحات قد تحمل سلطة غير مُستَحَقَّة.\n[1022.73s] عندما نُعطى أدلّة مُشاهَدة على سلوكيات مُضِرَّة،\n[1025.9s] عندها يكون لدينا شيء نتفحَصه،\n[1028.12s] لكن ليس عندما نُواجَه بِمحض وصمات عارٍ وافتراضات،\n[1031.81s] فلا داعٍ لأخذ العيوب الخياليّة بعين الاعتبار.\n[1036.23s] \"أحيانًا السيجار هو مُجرَّد سيجار.\"\n- قولٌ يُنسب إلى \"سيغموند فرويد\"\n[1041.73s] Arabic Captions by: TranquilOblivion"}'
