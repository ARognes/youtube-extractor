transcript: The new corner shape property in CSS allows us to create some absolutely wildlooking border radiuses with relative ease. Essentially, this property takes in a super ellipse function or a few different keywords. For example, you can use the keyword round and that'll just default to the normal border radius. You can see as we scale this, it's just a normal border radius. But you can also do something like square, which removes the border radius, or notch, which allows you to essentially create an inverse border radius where you have this notch taken out. Or you can do something like scoop which is a true inverse border radius. And all of this is based on that super ellipse function. If we take a little bit of a deeper dive into that super ellipse function, you can see that as you increase this super ellipse function that we get less and less of a border radius. A value of zero is essentially a perfectly diagonal 45° line. While a value of one is the default border radius and anything larger starts to remove that border radius until you get all the way to essentially infinity, which is no border radius at all. When you go below zero, you start to get an inverted border radius. As you can see here, a value of negative 1 is the exact opposite of a standard border radius. And as you go lower and lower, you can see it essentially becomes a squared off value until you get to negative infinity where it's a full notch just taken out of your border radius. This is a super powerful function and feature that allows you to create really intricate shapes using your border radius combinations. And you can see here if we scroll down and look at an animation, as you can see, this is animating purely just the corner shape property. and it gives us a really cool effect through that animation. And this is one of the coolest CSS properties that I'm seeing right now. And unfortunately, it's only available in Chromiumbased browsers, but I'm sure it's going to be coming to Firefox relatively
