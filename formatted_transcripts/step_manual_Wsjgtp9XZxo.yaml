transcript: '{"content":"\n[0.16s] Physicists have shown that \nobjective reality doesn’t exist.\n[4.24s] This is allegedly an insight derived from \nquantum mechanics. And not only this,\n[9.36s] it’s been experimentally confirmed. Really? How \ndo you prove that reality doesn’t exist? Has it\n[15.52s] really been done? And do we have to stop saying \n“really” now? That’s what we’ll talk about today.\n[25.84s] Many of you’ve asked me to comment on those \nheadlines claiming that reality doesn’t exist.\n[30.72s] It’s a case in which physicists have outdone \nthemselves in the attempt to make linear algebra\n[35.28s] sound mysterious. The outcome is patently \nabsurd. In one article, Eric Calvacanti,\n[41.12s] a physicist who works in the foundations of \nquantum mechanics, writes: “If a tree falls\n[46.0s] in a forest and no one is there to hear it, \ndoes it make a sound? Perhaps not, some say.”\n[51.52s] So what are those people talking about? The \nstory begins in 1961 with the Hungarian physicist\n[57.44s] Eugene Wigner. Wigner was part of the second \ngeneration of quantum physicists. At his time, the\n[63.52s] mathematical basis of quantum mechanics had been \nsettled and was experimentally confirmed. Now,\n[69.2s] physicists moved on to quantum field theory, which \nwould eventually give rise to the standard model.\n[74.48s] But they still couldn’t make sense of what it \nmeans to make a measurement in quantum mechanics.\n[79.92s] The way that quantum mechanics works is that \neverything is described by a wave-function,\n[84.32s] usually denoted psi. The change \nof the wave-function in time is\n[88.48s] given by the Schrödinger equation. But the \nwave-function itself isn’t measurable. Instead,\n[94.32s] from the wave-function you just calculate \nprobabilities for measurement outcomes.\n[98.72s] Quantum mechanics might for example predict \nthat a particle hits the left side or the\n[102.88s] right side of a screen with 50% probability \neach. Before the particle hits the screen,\n[108.32s] it is in a “superposition” of those two states, \nwhich means it’s neither here nor there,\n[113.6s] instead it’s in some sense both here and there \n. But once you have measured the particle,\n[119.36s] you know where it is with 100 percent probability. \nThis means after a measurement, you have to update\n[125.76s] the wave-function. This update is also called the \n“reduction” or “collapse” of the wave-function.\n[132.24s] What is a measurement? Quantum mechanics \ndoesn’t tell you. And that’s the problem.\n[137.68s] Wigner illustrated this problem with a thought \nexperiment now known as “Wigner’s friend.”\n[142.96s] Suppose Wigner’s friend Alice is in \na laboratory and does an experiment\n[146.72s] like the one we just talked about. Wigner \nwaits outside the door. Inside the lab,\n[152.16s] the particle hits the screen with 50% probability \nleft or right. When Alice measures the particle,\n[158.24s] the wave-function collapses and it’s \neither left or right. She then opens\n[163.2s] the door and tells Wigner what she’s measured.\nBut how would Wigner describe the experiment?\n[168.64s] He only finds out whether the particle went \nleft or right when his friend tells him.\n[173.28s] So, according to quantum mechanics, Wigner has \nto assume that before he knows what’s happened,\n[179.36s] Alice is in a superposition of two states. \nOne in which the particle went left and she\n[184.8s] knows it went left. And one in which it \nwent right and she knows it went right.\n[189.92s] The problem is now that according to Alice,\n[192.48s] the outcome of her measurement never was in \na superposition, whereas for Wigner it was.\n[198.16s] So they don’t agree on what happened. \nReality seems to be subjective.\n[203.36s] Now. It’s rather obvious what’s going \non, namely that one needs to specify\n[207.92s] what physical process constitutes a measurement, \notherwise the prediction is of course ambiguous.\n[213.76s] Once you have specified what you mean by \nmeasurement, Alice will either do a measurement\n[218.88s] in her laboratory, or not, but not both. And in a \nreal experiment, rather than a thought experiment,\n[226.0s] the measurement happens when the particle \nhits the screen, and that’s that. Alice is\n[230.8s] of course never in a superposition, and she \nand Wigner agree on what’s objectively real.\n[236.72s] If that’s so obvious then why did Wigner \nworry about it? Because in the standard\n[241.92s] interpretation of quantum mechanics the update \nof the wave-function isn’t a physical process.\n[247.52s] It’s just a mathematical update of your knowledge, \nwhich you do after you have learned something\n[252.24s] new about the system. It doesn’t come with any \nphysical change. And if Alice didn’t physically\n[258.48s] change anything then, according to Wigner, she \nmust indeed herself have been in a superposition.\n[264.88s] Okay, so that was Wigner’s friend in the 1960s. \nYou can’t experimentally test this, but in 2016\n[272.0s] Daniela Frauchinger and Renato Renner proposed \nanother thought experiment that moved physicists\n[277.36s] closer to experimental test. This has been \ndubbed the “Extended Wigner’s Friend Scenario.”\n[283.36s] Before we talk more about Wigner and his \nfriends, I want to thank our sponsors on Patreon,\n[288.24s] especially our tier four supporters. Your \nhelp is so important to keep this channel\n[293.36s] going. And you too can help us. Go check out \nour Patreon page or click on the join button\n[298.72s] right below this video. Now what’s \nwith the extended Wigners friends?\n[303.84s] In this thought experiment you have two Wigners, \neach of whom has a friend. We will call these the\n[309.52s] Wigners and the Alices. The Alices each measure \none of a pair of entangled particles. As a quick\n[315.76s] reminder, entangled particles share some property \nbut you don’t know which particle has which share.\n[321.76s] You may know for example that the particles spins \nmust add up to zero, but you don’t know whether\n[327.12s] the left particle has spin plus one and the right \nparticle spin minus one, or the other way round.\n[332.64s] So the Alices each measure an entangled particle. \nNow the thing with entangled particles is that if\n[339.04s] their measurements don’t collapse the \nwave-function, then now the two Alices\n[344.16s] are entangled. Either the left one thinks the \nspin was up and the right one thinks it’s down,\n[349.28s] or the other way round. And then there’s the two \nWigners, each of which goes to ask their friend\n[355.68s] something about their measurement. Formally this \n“asking” just means they do another measurement.\n[362.32s] Frauchinger and Renner then show that \nthere are combinations of measurements\n[366.56s] in which the two Alices cannot agree with the two \nWigners on what the measurement outcomes were.\n[372.8s] Again the obvious answer to what happens is that \nthe Alices either measured the particles and\n[377.6s] collapsed the wave-function or they didn’t. \nIf they did, then their measurement result\n[383.28s] settles what happens. If they didn’t do it, then \nit’s the Wigners’ results which settle the case.\n[389.68s] Or some combination thereof, depending \non who measures what. Again, this is only\n[395.2s] problematic if you think that a measurement is not \na physical process. Which is insanity, of course,\n[401.6s] but that’s indeed what the most widely held \ninterpretation of quantum mechanics says.\n[406.64s] And so, Frauchinger and Renner conclude \nin their paper that quantum mechanics\n[411.2s] “cannot consistently describe the use of itself”\n[414.88s] because you run into trouble if you’re one of the \nWigner’s and try to apply quantum mechanics to\n[419.92s] understand how the Alice’s used quantum mechanics.\nYou may find this a rather academic argument,\n[426.64s] but don’t get fooled, this innocent sounding \nstatement is a super-important result.\n[432.48s] Historically, internal inconsistencies \nhave historically been THE major cause of\n[437.6s] theory-led breakthroughs in the foundations \nof physics. So we’re onto something here.\n[442.48s] But the Frauchinger-Renner paper is \nsomewhat philosophical because they\n[446.48s] go on a lot about what knowledge you can have \nabout other people’s knowledge. But in 2018,\n[452.16s] Caslav Brukner looked at the problem from a \nsomewhat different perspective and derived\n[457.12s] a “No go theorem for observer independent facts.”\nHis formulation allows one to use the measurement\n[463.84s] of certain correlations in measurement outcomes \nto demonstrate that the observers in the extended\n[469.04s] Wigner’s friend scenario actually had measurement \nresults which disagree with each other.\n[474.72s] If that was so, there would in certain cases be no\n[478.24s] “observer independent facts”. This \nis the origin of all the talk about\n[482.88s] objective reality not existing and so on.\nAnd yeah it’s really just linear algebra.\n[488.64s] There aren’t even differential equations to \nbe solved. I assure you I’m not saying this\n[493.68s] to be condescending or anything, I just \nmean to say, this isn’t rocket science.\n[498.72s] Finally, in 2019, a group from Edinburgh \nactually measured those correlations which\n[503.68s] Brukner calculated. That’s the experimental test \nwhich the headlines are referring to. Now you\n[509.92s] may wonder who in Edinburgh played the role of \nthe two Alices and the two Wigners? How did the\n[515.44s] Alices feel while they were in a superposition? \nDid the Wigners see any wave-functions collapse?\n[521.44s] Well, I am afraid I have to disappoint you \nbecause the two Alices were single photons\n[525.84s] and the two Wigners were photo-detectors. That’s \nokay, of course, I mean, some of my best friends\n[531.6s] are photons too. But of course an interaction with \na single photon doesn’t constitute a measurement.\n[537.44s] We already know this experimentally. A \nmeasurement requires an apparatus big enough\n[542.4s] to cause decoherence. If you claim that a single \nphoton is an observer who make a measurement,\n[548.08s] that’s not just a fanciful \ninterpretation, that’s nonsense.\n[552.48s] The alleged mystery of all \nthose arguments and experiments\n[555.6s] disappears once you take into account that \na measurement is an actual physical process.\n[561.2s] But since quantum mechanics does not require you \nto define just what this process is, you can make\n[568.4s] contradictory assumptions about it and then more \ncontradictions follow from it. It’s like you have\n[574.0s] assumed that zero equals one, and then show \nthat a lot of contradictions follow from it.\n[579.28s] So to summarize, no one has proved that reality \ndoesn’t exist and no experiment has confirmed\n[584.64s] this. What these headlines tell you instead \nis that physicists slowly come to see that\n[590.16s] quantum mechanics is internally inconsistent \nand must be replaced with a better theory,\n[595.52s] one that describes what physically happens in \na measurement. And when they find that theory,\n[601.6s] that will be the breakthrough of the century.\nThis video was sponsored by Brilliant.\n[606.72s] I wasn’t kidding when I said quantum mechanics \nisn’t rocket science. It’s really mostly linear\n[611.2s] algebra and not remotely as incomprehensible \nas most physicists want you to believe.\n[616.16s] If you want to understand quantum mechanics \nin more depth, Brilliant is a great starting\n[620.72s] point. Brilliant is a website and app that \noffers courses on a large variety of topics\n[625.84s] in science and mathematics. Whether you want to \nlearn something new or freshen up your knowledge,\n[631.68s] Brilliant is a simple and fun way to do \nit. All their courses are interactive,\n[636.56s] so you are challenged with questions and can check \nyour understanding along the way. For this video,\n[642.08s] for example, I recommend their courses \non linear algebra and quantum objects.\n[646.96s] To support this channel and \nlearn more about Brilliant,\n[649.76s] go to Brilliant dot org slash Sabine and \nsign up for free. The first 200 subscribers\n[655.28s] using this link will get 20 percent \noff the annual premium subscription.\n[659.6s] Thanks for watching, see you next week."}'
