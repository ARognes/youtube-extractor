] In today''s complex multicultural world,\n[386.479s] we no longer expect people to be brought\n[388.88s] up under the umbrella of a single\n[391.28s] religion''s teachings.\n[393.52s] We expect a well-rounded education that\n[397.28s] includes exposure to different\n[399.199s] viewpoints so that we can best navigate\n[401.919s] the complexities of our modern world.\n[406.56s] We expect that everyone understand\n[408.56s] topics such as politics, finance,\n[411.6s] science, technology, and ethics.\n[414.72s] Recent events have brought home to us\n[417.28s] all too directly that a representative\n[420.08s] democracy depends on a well-informed,\n[423.12s] not misinformed population to be\n[425.759s] healthy.\n[427.68s] Without proper education, we''re more\n[430.16s] easily made victims of ignorance and\n[433.039s] delusion.\n[435.28s] A society that devalues its education or\n[439.36s] that makes it financially ownorous\n[442.72s] is a society that necessarily cultivates\n[446.08s] ignorance and foolishness.\n[450.479s] Some of you might well say, \"But but\n[452.72s] Doug, monastics renounce the world. They\n[455.28s] renounce all true ownership. They\n[457.52s] survive on leftovers. You can''t compare\n[460.24s] that to modern food assistance and\n[462.72s] Medicaid.\n[464.88s] But here''s the thing. In practice,\n[467.68s] monastics renounce luxury, not\n[470.639s] necessity.\n[472.479s] The Buddha didn''t want his monastics\n[474.4s] starving themselves or getting ill.\n[477.199s] Those were extremes to be avoided in\n[480.479s] favor of the middle way.\n[483.28s] The Buddha wanted and expected his monks\n[485.52s] to remain healthy, safe, and well.\n[489.52s] Similarly, we aren''t talking about\n[491.759s] handing out luxuries. We''re talking\n[494.4s] about the requisites, the floor. A\n[498.24s] society that provides a floor like this\n[501.36s] allows its citizens space to build up a\n[504.319s] house.\n[507.759s] Clothing, food, shelter, medicine,\n[510.16s] education. These are the five requisites\n[513.12s] of a dignified human life. Imagine a\n[516.8s] society where these five were guaranteed\n[519.2s] to all its citizens. How much\n[521.919s] creativity, kindness, and spiritual\n[524.159s] practice might be unlocked if folks\n[527.519s] weren''t so terrified of losing their\n[530.0s] homes or dying of some treatable\n[532.48s] illness.\n[534.32s] Imagine what good might be unlocked if\n[536.32s] folks were inoculated against the\n[538.64s] propaganda of greed and hatred that\n[541.2s] surrounds them every day.\n[544.56s] If you want to understand more about how\n[546.959s] the Buddha viewed wealth in general,\n[549.12s] about and about how he viewed the way\n[551.92s] that lay people should make use of their\n[554.08s] wealth, check out my video on what the\n[556.48s] Buddha taught about that. It''ll be up\n[558.88s] here on the screen in a moment.\n[561.839s] Meanwhile, here''s a small thought\n[564.08s] experiment. Consider what your life\n[566.72s] would be like without these requisites.\n[569.839s] Something happens. You''re you wake up\n[572.0s] from a dream or are reborn into a\n[574.8s] different situation all of a sudden and\n[577.44s] there you are homeless and hungry in a\n[580.08s] strange city.\n[582.24s] Consider how you''d be changed.\n[585.2s] Now, it''s a heavy thing to think about,\n[587.519s] that''s for sure. But millions live\n[590.16s] something very similar every day.\n[594.16s] To all of you, thanks so much for your\n[596.08s] continued practice. And please all of\n[598.399s] you be"}'
