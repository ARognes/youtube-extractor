came to include\n[127.52s] such objects as a shaving razor, a\n[130.8s] sharpening stone, perhaps an umbrella,\n[133.2s] sandals and similar minor objects.\n[138.879s] The second of these requisites that is\n[141.12s] alms food was of course intended to\n[144.16s] sustain the body and keep it healthy but\n[147.04s] it was not intended for any kind of\n[149.04s] luxurious enjoyment.\n[152.56s] Again while some aesthetics like\n[155.44s] Davidata urged the Buddha to disallow\n[158.48s] monastics from eating anything other\n[161.04s] than food that they gathered themselves\n[163.28s] on their alms round. The Buddha wasn''t\n[166.8s] quite so strict. He also allowed\n[169.36s] monastics to accept prepared meals from\n[172.64s] lay people at at particular places like\n[174.959s] houses.\n[177.68s] Uh the third lodging was a place to be\n[180.56s] safe from the elements and from\n[182.4s] dangerous animals or dangerous people.\n[186.08s] While once again Devodata urged the\n[188.959s] Buddha to require monastics to live only\n[192.4s] at the root of a tree, the Buddha\n[195.12s] disagreed, instead allowing for for\n[197.36s] simple dwellings for his monastics.\n[201.599s] Finally, the fourth of these, medicine,\n[203.84s] was of course meant simply to cure or at\n[206.959s] least ward off illness.\n[210.0s] Now these were the minimum that\n[212.48s] monastics needed to support their\n[214.319s] practice\n[215.84s] and making use of these four things.\n[218.799s] They were still the monastics considered\n[221.28s] basically to own nothing.\n[225.28s] Today we might think of the four in a\n[227.599s] somewhat different context particularly\n[230.72s] when we bring them into ordinary living.\n[234.879s] We might think of them as starting with\n[237.12s] dignified clothing, not simply rags, and\n[241.04s] basic personal supplies.\n[243.92s] We might think of them as including food\n[246.48s] security, the absence of hunger.\n[250.4s] We might think of them as including\n[252.