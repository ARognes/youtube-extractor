transcript: Welcome to the ultimate guide to the French verb tenses. In the next 20 minutes, I'm going to explain all the French verb tenses you need to know. French has several different moods. I'll cover more than 10 French verb tenses. That might sound like a lot, but don't worry. Not all of them are equally useful in everyday French. And I will show you which ones really matter. And to help you review everything after the lesson, we created a free PDF with the different tenses. You can download it from the link in the description. For each tense, we'll see when French speaker actually use it, how to form it, and one simple example to help you remember it. So, whether French grammar feels completely overwhelming or you're an advanced learner looking for quick refresher, this video is for you. And make sure you stay until the end. I'll also tell you which tenses you should prioritize if your goal is to speak French confidently. Here's our plan for today. We'll cover the three verb groups, as well as forms like infinitive and participles. We'll go through the moods. indicatif subjonctif impératif, conditionnel, and their tenses with clear rules and examples. We'll finish with a super fast recap. Let's get started. Before we look at the tenses, here is one quick reminder. French verbs are traditionally divided into three groups. The first group contains regular verbs ending in -er like parler. The main exception is aller, which is irregular. The second group contains regular -ir verbs like finir with a present participle ending in -issant. finir finissant The third group contains all the other verbs including prendre, voir, partir, and aller. French also has non-conjugated forms such as the infinitive, present participle, the gerund, [music] and the past participle. These are not part of our 16 conjugated tenses, but [music] you'll see the past participle again and again because it helps [music] us build all the compound tenses. Let's begin with the indicative. This is the mood we [music] use to present actions and situations as facts or realities. The present is essential. You'll use this one constantly. For action happening now, habits, and general truths. The endings depend [music] on the verb group. With a regular -er verb like parler, remove -er and [music] add the present endings shown on screen. Parler would be je parle tu parles [music] il elle on parle nous parlons vous parlez ils elles [music] parlent. Je parle français tous les jours. And now, let me take a coffee break while Jonathan explains the passé composé. >> The passé composé is also essential. It is the most common way to talk about completed past actions in everyday spoken French. Form it with avoir or être in the present tense followed by the past participle. J'ai parlé tu as parlé il elle on >> Did you recognize the tense I just The imperfect is essential to, especially when you tell stories. Use it for past habits, descriptions, background information, and actions that were in progress. For most verbs, take the new form in the present. Remove on and add the imperfect endings. Etre is the main exception. >> [music] >> With the stem ET. The key difference is this. The passe compose moves the story forward with completed events. While the imperfect describes the background or what was already happening. Now that you are getting this more than easily because you're more than perfect, we are going to review le plus que parfait. This tense is useful, but you won't need it as often as the previous three. It describes an action that happened before another one in the past. Form it with avoir or etre in the imperfect followed by the past participle. J'avais mange. Tu avais mange. Il elle ont avais mange. Nous avions mange. Vous aviez mange. Il elle avais mange. J'avais deja mange >> So, let's do a quick checkpoints. If you understand the passé composé for completed events, the imparfait for the background, and the plus-que-parfait for what happened earlier, you already have a strong system for talking about the past. >> Let's keep going with the passé simple and the passé antérieur. The passé simple is recognition only. It replaces the passé composé in literary narration. As in il parla, meaning he spoke, but you won't need to produce it in everyday French. >> [music] >> The passé antérieur is also recognition only. It marks an action completed before another action in literary narration. As in quand il eut parlé, il partit. >> Before the final two indicative tenses, there is one essential future structure you all need to know. The futur proche is not counted as a separate tense in our list of 16 because it uses a present tense of aller plus an infinitive. [music] But in spoken French, you'll hear it all the time for plans or events that feel close or already have been decided. For example, je vais parler au directeur. >> The future simple is essential for future events, promises, and predictions. For most verbs, use the infinitive as the stem [music] and add the future endings. For verbs ending in -re, remove the final -e first. >> The futur antérieur is used for but less common. It describes a future action that will be completed before another future moment or action. Form it with avoir or être in the futur simple followed by the past participle. For example, >> Great job. You can now talk about actions >> [music] >> in the present, the past, and the future, which means you can handle a huge part of everyday communication in French. And now, let's take it one step further and learn how to talk >> [music] >> about what would happen. >> The conditional has two tenses. We use it for hypotheses, wishes, polite requests, advice, and unreal situations. The present conditional is essential. You will hear and use this one all the time, especially when you want to sound more polite or describe what would happen. Use the same stem as the futur simple but add the endings of the imparfait. For example, >> The past conditional is useful for regrets and hypothetical situations that did not happen. Form it with avoir or être in the present conditional followed by the past participle. For example, j'aurais aimé venir à ta fête. If that makes sense. You can already express facts, past events, future plans, hypotheses, and regrets. Next comes the mood that makes many learners nervous. But, it is easier when you focus on the two forms used in modern French. >> [music] >> The subjunctive presents an action through a subjective reaction, such as I wish, an emotion, a doubt, a judgement, or a necessity. It often appears after expressions followed by que, such as il faut que, je veux que, or bien que. The present subjunctive is what you really need. You'll hear it regularly in modern French. With regular verbs like parler, start from il parle, remove the ent, and add the subjunctive endings [music] shown on the screen. For example, >> [music] >> il faut >> The past subjunctive is useful >> [music] >> when the action in the subjunctive has already been completed. Form it with avoir or être in the [music] present subjunctive followed by the past participle. For example, The imperfect subjunctive is recognition only. A literary form such as qu'il parla is replaced [music] by a present subjunctive in modern French. The pluperfect subjunctive is also a recognition only. A literary form such as qu'il lui parlât is replaced by the past subjunctive in everyday modern French. If you can recognize a subjunctive trigger and choose between the past and the present subjunctive, you know all the forms you need for everyday French. We are almost there. One final mood and a very useful one for speaking. The imperative. [music] >> The present imperative is essential. >> [music] >> You'll hear this one regularly. For most verbs, use the tu, nous, or vous form of the present tense without the subject pronoun. For example, The past imperative is rare, but it does exist. It tells someone to make sure an action is completed before a particular moment or a deadline. Form it with the imperative of avoir or être followed by the past participle. For example, ayez terminé avant midi. >> Now, let's bring everything together with the verb parler. The complete 16 tense table, including the literary forms, is available in the free PDF. But, these are the forms you should focus on for real communication. Présent. Je parle. Passé composé. J'ai parlé. Imparfait. Je parlais. Plus-que-parfait. J'avais parlé. Futur proche. Je vais parler. Futur simple. Je parlerai. Futur antérieur. J'aurai parlé. Conditionnel présent. Je parlerai. Conditionnel passé. J'aurais parlé. Subjonctif présent. Que je parle. Subjonctif passé. Que j'aie parlé. Impératif présent. Parle. Notice how the compound tenses follow the same basic pattern. The conjugated forms of avoir or être plus a past participle. Once you recognize that structure, the whole system becomes much easier. >> So, which tenses [music] should you prioritize? >> You should first master the présent, the passé composé, the imparfait, and the futur proche. These will carry a large part of your everyday conversations. Next, add the futur simple, the conditionnel présent, and the impératif présent. Then, learn the subjonctif présent and the compound tenses as you need them. And for the passé is simple, the passé antérieur, the subjonctif imparfait, the subjonctif plus que parfait, recognition is [music] enough unless you're really studying literature. >> And that's it. You've just covered every French tenses in under 20 minutes. Remember, [music] you don't need to master every single French tenses at once. Start with the ones you'll actually use in everyday conversation. There are two past tenses that every intermediate learners needs to understand. Passé composé and imparfait. They can both describe the past, but they are not interchangeable. And choosing the wrong one can completely change the meaning of your sentence. So, watch this video next where we explain the difference between the passé composé and the imparfait >> [music] >> with clear rules and real-life examples. Take care. Keep practicing. Et à bientôt dans une prochaine vidéo sur Talking French.
