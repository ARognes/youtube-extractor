sing I was covered from head to toe in coconut oil I was the number one person in the class something clicked inside of me and what it really was was the realization yeah smarts will get you far but hard work will get you further any day of the week and I was just murdering it by the end we had a final and it was a 2-hour long test I did it in less than 30 minutes and was the highest grade in the class it's just like something happened I was changed and I started to love school I started to build this passion for learning for wanting to pursue excellence and it just kept happening every class I took I kept being one of the best or the best at it every single time but still during all of this I was struggling with porn and cigarettes and it's just like I couldn't break these addictions and it was just eating me up on the inside I hated it then after probably my 5,000th time quitting pornography for whatever reason it just clicked it stayed it was you know my my head and my heart finally made a connection and it just left me along with smoking it was like I was finally free of these chains it was amazing and from there I just really have felt Unstoppable in the sense that I can learn anything I have proven to myself I can do it I liked what I was doing I liked programming and so I just went nuts over it I tried to start my own company I was working like 80 hours a week my wife and I didn't have a very good relationship at that point because I was working way too hard I really wish I could have done things probably a little less enthusiastic at that point you know fostered a better relationship would have been a smarter move I got rejected from Google I got rejected from local compan I got rejected actually a few times went from the top of the top to the bottom pretty quick but I ended up getting a job at a local place and I hated it again it's just like man I'm so bored I'm dying here and finally when I just made the commitment in my heart I'm going to be happy in this situation I'm going to find Joy regardless of how entertaining my job is about how much I like doing it I am going to have joy I don't need to be happy because of my job I kid you not I made that decision on my way to my job that day and as I was getting coffee someone from a building next door went hey you program right and I was like yeah I I am a programmer over at schulist and he was just like hey you want to come work over here I'll give you 50% more money I was like yeah yes yes yes I do and I did it it was hard it was awful but it was amazing all at the same time it really really helped uplevel me a significant amount and yes it did strain my wife and I's relationship yes I probably should have said no more often but it was also really really good long term for my career which is a hard balance to have and I really didn't have a good way of saying no at that point but during all of that I got to go to a conference where I learned about rxjs yes laugh I know just laugh about it go ahead laugh about it right rxjs right any who I put that on my resume that I knew it and I started learning and playing with it and guess what happened Netflix was looking for people that knew rxjs and they saw that I did it and they offered me interview and then I got the job and for me again that shows that hard work with a little bit of luck preparation with timing and boom I got a great job and I've been there for the last uh you know eight nine years you know I failed a lot during that intro part of my story I failed a lot it took years upon years there was no magic bullet there was no one night things went from bad to good it was a decision I made every single moment it was a decision I had to make every single day multiple times a day to do it right and during this time of the year this is by the way Christmas season 2022 there's this whole idea of New Year's resolutions and I've always hated them because there's not just some point in time some new turning of the wheel in w