transcript: '{"content":"\n[0.08s] The brand new React activity component\n[2.08s] is a super simple component that can\n[3.919s] drastically increase the performance and\n[6.08s] reliability of your code. Let''s take a\n[7.919s] quick look at this example right here. I\n[9.519s] just have a button that toggles this\n[11.04s] counter section down below. I can\n[12.8s] increase or decrease the counter, add\n[14.559s] something inside this text box. And when\n[16.0s] I remove this and read it, you can see\n[17.84s] all of my state is reset. The reason for\n[19.92s] this is because this counter component\n[21.439s] is being completely removed every time\n[23.119s] that I toggle this button. And in this\n[24.8s] counter component, the default state is\n[26.32s] zero. And this input has no default\n[28.08s] value. So it just defaults to an empty\n[29.84s] string. This is the problem with adding\n[31.599s] and removing components is they always\n[33.28s] reset to the default. But sometimes you\n[35.2s] don''t want that behavior. This is where\n[36.88s] the idea of the activity component comes\n[38.8s] in. This component works pretty much the\n[40.719s] same as you would if you wanted to wrap\n[42.079s] something in a conditional render.\n[43.44s] Instead of using that conditional\n[44.559s] render, you just wrap it inside of an\n[46.079s] activity component and set this mode. If\n[48.48s] the mode is equal to visible, then this\n[50.239s] content is showing up. And if it''s set\n[51.76s] to hidden, then the content is removed\n[53.199s] from the page just like conditional\n[54.719s] rendering. The big difference though is\n[56.32s] that it''ll properly work with keeping\n[57.84s] your state in sync. So, for example, if\n[59.68s] I come in here and I change my state and\n[61.28s] this state here and I remove this, it''s\n[63.199s] removed from the page, but when I read\n[64.72s] it, it keeps that previous state that I\n[66.479s] had. This isn''t the only use for the\n[68.32s] activity component, though. I''m going to\n[69.76s] swap out this component with a brand new\n[71.439s] one. And this component is slightly\n[73.04s] different. You can see we''re wrapping it\n[74.32s] inside of a suspense as well. My\n[76.08s] activity is exactly the same. And the\n[77.68s] thing inside this component is this\n[79.04s] async data component. The really\n[80.96s] important thing you need to know about\n[81.92s] this component is it just has a 2-\n[83.36s] second timeout before it returns data.\n[85.28s] So if we refresh our page and we open\n[86.88s] this up, you can see it says loading for\n[88.32s] 2 seconds before my data shows up. The\n[90.56s] key though with this activity component\n[92.24s] is it''s actually smart enough to preload\n[94.079s] all this data. So if I refresh my page\n[96.0s] and I wait two full seconds and I click\n[98.159s] toggle, you can see my data has already\n[100.0s] been loaded in the background for me. So\n[101.52s] I don''t get this loading state. This is\n[103.2s] something you were unable to do before\n[104.72s] this activity component. So it not only\n[106.56s] helps you with maintaining state but\n[108.079s] also can increase the performance by\n[109.68s] preloading different parts of your\n[110.96s] application. Now this is just scratching\n[112.56s] the surface on what this component can\n[114.0s] do because there''s some really deep dive\n[115.68s] stuff related to performance that this\n[117.2s] component can handle that you couldn''t\n[118.399s] do before at all inside of React. And if\n[120.32s] you want to learn more about that, I''m\n[121.36s] going to link a full video at the bottom\n[122.64s] of your"}'
