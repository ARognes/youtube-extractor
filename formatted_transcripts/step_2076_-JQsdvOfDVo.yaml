transcript: Hey everyone, it's Zsolt here. This is the same talk that I gave at the PKM summit in Utrecht just today. But I thought that there are many of you who are not able to join the PKM summit in person, so I wanted to share it with you here on YouTube. So, the title of my talk is independent thinking in the age of AI. And I want to start with this statistics. Essentially, it says that the PKM market is growing very quickly. And in fact, around the globe, there are roughly between 8 to 40 million people who are actively practicing PKM focused on linking ideas, on critical thinking, skill building in note-taking and writing and all the good stuff, which means that if you're watching this talk, then I safely make the assumption that you're one of the 0.1 to 0.5% of most thoughtful and intelligent people globally. And for that reason, I think this talk is especially important to you. Because if it is not human extension and it is not loss of our jobs, then what is the greatest risk AI poses to us? And I believe the greatest risk is losing our agency. Or in other words, I think the most important question we can ask in this age of AI is how can we retain our agency? Now, this is one aspect of my talk. The other aspect, or I would rather say the other root cause or reason I started to work on this topic is you could say I'm in a sort of a midlife crisis. I have a successful career. I have a successful family. I have Corona children and overall I can't complain. But this quote from Dante from the Divine Comedy often comes to mind in terms of trying to figure out where I want to go next. And the other idea and that this then brings together the two angles having agency and figuring out what I want to do with my life is this quote from Steve Jobs from the Stanford commencement speech. He said that your time is limited, so don't waste it living someone else's life. Don't be trapped by dogma, which is living with the results of other people's thinking. And I would argue that today maybe Jobs would also say machines thinking. Maybe he wouldn't, but this is definitely today's challenge that AI is doing the thinking instead of us. And my fundamental thesis for this talk is this belief that the quality of your life is directly proportional to the quality of thinking you do every day. So we're going to touch on six topics today. We're going to look into this issue of who's actually doing our thinking. We're going to then look at text, visuals. We're going to look at how we can outsmart our lazy brains, how we can hack our brains to actually think. We're going to look at this paradox of why we're better at organizing our bags than our thoughts. And finally, we'll bring it all home in terms of how you can use visuals to do independent thinking. And by the way, the layout of this presentation, you can see in the corner Dave Gray's Gamestorming 2 book. This is a squid diagram, which is a diagram that's organized around questions and answers. So, I thought that would be a fun way to represent this presentation. But let's dive in. So, who's [snorts] doing your thinking? I think this is a super important question and I would actually ask this question first, do you still keep a paper atlas in the glove compartment of your car? I have to admit, I don't. I don't think I even have an atlas at home, not to mention my car. And you know what? I was reflecting on this situation that over the past 20 years, since we have GPS and we have Google Maps and we have all this technology, my navigation skills have degraded. In the past, in the '90s, I would pick up a map, I would plan my journey, I would turn the pages and navigate. And I believe that today, most young people might not even be able to read a paper atlas. We are so dependent on this technology. And this is where I thought I would reflect on this is this is Gmail and this is a super convenient function. I type and Gmail automatically predicts my the how I would want to complete the sentence based on my earlier conversations. But, you know, there is a question that comes to mind here, and the question is who's actually doing the driving? If AI predicts the way how I'm going to complete my sentence, am I completing my train of thought, or is it actually AI completing it for me? And would I have completed it differently had AI not recommended that completion? And I think even more so, if this is not only the end of a sentence, but I ask AI to generate an email, I might not add the end that yes, this is great, but was that my thought, or was that someone else's thought? But, let's look at this next question. Is text failing us? And I would argue in a lot of ways, of course, text has been amazing in terms of where we are as a civilization. Gutenberg and the democratization of knowledge has been great, but text is like looking through a keyhole. Viewing the world through a keyhole, you absorb it one word at a time. Meanwhile, your mind works hard to try and stitch the pieces together, constantly looking at how the information fits to what you already know. So, this is how text works. You read it linearly. And if you're not convinced, um here's a quick test for you. Find the word that does not fit this list. There are 100 words here. Tell me which is the word that doesn't fit this list. And this is extremely hard or actually not that hard, but takes a long time because you need to scan lots of text. And of course, this is where AI becomes super powerful because if I go to AI and I drop in the same text and say says say, "Find the odd word out." then AI will quickly spit out the response, "The box is the odd one out." And you know, I I fully see the reason they're using AI extensively because it's amazingly powerful at functions that our brains are not that powerful at. But my argument is that this is partly because we're using the wrong medium to engage with our minds. Because look at this picture. How long did it take you to identify the odd one out? It was instantaneous. It was faster than the AI spit out the text. How long did it take you to recognize that this is a collection of animals and there's one box there? It was instantaneous. And I think this is how text and visuals are different. I believe that our brains are hardwired for visuals. In fact, let's fork here in our road two ways. I would first start here that our ancestors did not survive the savanna by reading bullet points. They Annie Murphy Paul uses this term, a mind on the hoof. This because thinking is navigation. Our mind evolved for navigation. We even use these in our words. The future is ahead of us, the past is behind us. But, think about survival on the savanna. You need to look out. You need to specially navigate the savanna. You need to be specially aware if a predator is coming, but also you need to recognize which berries you can pick and which ones are poisonous. So, our mind is a mind on the hoof, on the move. And this video by David Kirsh or this talk by David Kirsh, I'm going to include the link in the video description, is extremely interesting. He talks about how thinking evolved as the simulation of movement. Our ancestors, many many millions of years ago, didn't think to come up with big abstract ideas. They thought to simulate movement of how if they move their limbs, what's that going to do in the real world. And in fact, in our minds, we have what's called mirror neurons. And when we look at someone, for example, doing some motion, we're going to be simulating that movement with our mirror neurons in our own mind. And that's how we're going to make sense of that. So, this is I think is super interesting in terms of the structure of our mind and why I believe spatial visual thinking is natural and super powerful. But, then here's the other aspect that I want to bring in and this is from a video by Yuri Moshenka. He talks about This is his explanation for visual thinking. He says that we hear complex information. The other person has something complex to share with us, but it's translated into words, which are going to reach our ears one word at a time or our eyes if we read. So, we're going to get this sequential series of ideas. And as we are listening to it or as we are reading it, we're constantly going to try to build this mental model of linking the new concepts to existing concepts that we understand with new relationships. And where visual thinking comes in is if we then create a drawing of this new understanding, we can create a feedback loop where we can verify that what's in the in our mind's eye matches what's on the paper, and it's going to enable us to ask questions. Because in fact understanding and remembering abstract ideas is slow and hard. In this paper by Paul Martin Lester, The Syntactic Theory of Visual Communication, I read about this study where psychologists have found that we remember concrete nouns like ball, book, bottle, baby, et cetera easier than we remember abstract ones like freedom, peace, ethics, love. And I believe that illustrations help turn the abstract into the concrete, and this is how they help us actually process the world. So, putting this all together I believe that we think in space, we think with our eyes, we think with movement, and we think in concrete objects. But if you're still not convinced, let's play a game, and I hope that this is going to convince you. This is called the game of 15. It's a super simple game. Players take turns to pick unique numbers from 1 to 9. And the first one to collect any three numbers that sum to 15 wins. You can only pick a number once. So, if I pick one, then you cannot pick one. You can only pick 2, 3, 4, 5, 6, 7, 8, 9. So, imagine a game play, and in this game all the numbers were taken because it was only the last number that completed the sum to 15 for one of the players. So, my question is, if you look at this game, who won this game? And it takes a little bit of calculation, but yes, it's player two because player two has the numbers 3, 5, and 7. 3 + 7 is 10 + 5 is 15. And so, in this case player two won the game, and then you can imagine how the game might have gone. I won't go into that. But [snorts] what I recommend you do right now is you stop this video, you find someone to play the game with, explain the rules, and spend a couple of minutes playing this game. What you'll find when I played this game with my wife, my mind was literally burning. It was so hard trying to juggle all the numbers in my mind, doing the additions. And these additions are not so difficult, but when you have lots of numbers and I thought I was winning when actually my wife announced that she won. So, it was also hilarious from that perspective. Try to play this game. And now that you've done playing with the game, let's continue because I want you what to introduce to you this concept of the magic square. This is an amazing mathematical thing here. Every row, every column, and every diagonal on this magic square adds up to 15. So, you can see that for example 9 + 1 is 10 + 5 is 15. So, that's the middle row. Or we can take one diagonal. 4 + 6 is 10 + 5 is 15. So, you can see the diagonal. Or we can take a column. So, let's say 9 + 2 is 11 + 4 is 15. So, whichever way you look at this it adds up to 15. And then let me change the the same rules apply in terms of who wins. The first one to collect three numbers that add up to 15 wins. But we're going to change the visual layout of how you play the game. My recommendation is player one uses circles, player two uses X's. And my question is which player won this game? And of course, how long did it take you to realize who won the game? And just think about this. Just think about how the same problem, the same exact problem is so much easier like this. This way a 3-year-old can play the game. The other game is hard even for adults who are well-educated. And so this takes me to this quote from Saul Amarel. His idea was or his observation was that solving a problem simply means representing it so as to make the solution transparent. And I took this a little further and I have these three ideas here that I firmly believe in. First of all, I believe that different problems benefit from different solutions. And I think even more so the representation we use to solve the problem will drive the solutions that we will find. And for this reason, I believe that discovery through discovery emerges through iterative experimentation. Because it's impossible to find the right tool in the first step. But if you try multiple tools, you're going to discover solutions that you didn't believe existed before. So let's now move on to a little bit of a different problem that's very closely linked. And this is about how can you outsmart your lazy brains? And when I say lazy brains, I'm referring to what Daniel Kahneman in Thinking, Fast and Slow calls system one thinking. So just to recap what the idea here is. System one is your reactive thinking. It's your uh it's your routine. It's It's It's your immediate thoughts. So, if I ask you 2 * 2, you don't think about it. You don't calculate. You immediately know the answer. It's four. And system two requires much more energy. It's a much harder thinking mode. So, if I ask you to calculate 174 * 211, your mind is going to work super hard to come up with the answer. And indeed, our brains are energy conservation machines. So, we will fall back to system one thinking, to this reflective re- thinking reflex, or this routine thinking for the vast majority of the thinking problems. To put this into a slightly different spin, I want to bring in this idea from Edward de Bono. He talks about this this thinking pattern, which he doesn't think is good, and he is offering a different approach. We'll look at that in a second. There's a situation, we see it, and then we immediately jump to conclusions. So, this is indeed system one thinking. There, you pattern match on what you see, and you immediately respond with a solution. To understand this, I love this framework from Designing Your Life. This is the WYSIATI framework. What you see is all there is. So, your system one mind will convince your system two mind that there's nothing to look for. I've seen the data points, and I know the solution. And your brain is always going to pattern match on what it sees immediately, and it's always going to find a solution. Albeit, that solution can often be based on incomplete understanding, and for that reason could be a wrong conclusion. So, what Edward de Bono recommends, and this corresponds with system two thinking, is to inject an exploration between seeing and judging. And how do you do exploration? You collect different data points, but you know, there's a problem. The problem is short-term memory. Our short-term memory can hold up to 7 plus minus two items in active memory at once, which means that if you have more data points than this, you're going to start to drop things as you're trying to keep them in mind. So, what do you do? Well, of course, you take notes. So, you write them down. But you know, we already looked at writing. And I want to ask you this question. How many of you here still has or had a Walkman? You know, these are these cassette tape players. I had one. I no longer have one. Actually, I threw out all my cassettes. >> [snorts] >> But, you know, a text is like a cassette tape. You need to rewind it. You need to fast forward it, but you can only do it in a straight line. Remember finding the box in between the different animal words. You need to scan that line by line. It's inefficient. It's slow. It's really not how our minds are designed to work. Our minds are designed to work with iTunes. Visuals are iTunes where you see your entire library at a glance. You can click on something and the music is going to play immediately. And so I argue that diagrams, for example, this is a force field diagram there in the center. Diagrams are what you call you could call visual prosthetics for better thinking. Okay, so let's now move on to this very interesting question, this dilemma or paradox, I think is the better word. Why is that that when when we're going to think about this, you are going for a trip and you need to pack your bag. As I was traveling to Utrecht, I had to pack my bag for the trip. So what did I do? I took my clothes and I laid it out on the bed so I can inspect that I have enough of everything. And I took my toiletries and I laid them out on the bathroom counter and I inspected it and once I inspected it and organized it, I neatly packed it into my suitcase. But the interesting thing and think about this. So when it comes to organizing concepts, why do we lose our natural instinct to organize and why do we fall back to text? Why do we immediately switch out iTunes for a Walkman? And I believe that this is you could say I'm blaming the school system for this. It's much older than that. I think it roots back to the time of Gutenberg. I won't go into that, but my argument is that millions and millions and millions of years of evolution has trained us by nature. We are excellent visual navigators. We think in space. We think in motion. We are excellent with our eyes. More than 30% of your brain is focused on visual processing. That's our nature. But, our nurture, the school system, how much time did you spend learning to read and write? Unbelievable amount of time. So much practice, so many essays, so many books. It was just a constant practice of writing because writing and reading is hard and is not natural. And how much time did you spend learning different visual frameworks? How much time did you spend learning how to organize ideas visually, to create visual summaries? I can tell you practically none. We had art class, and sort of that was it all. And, of course, we created some diagrams in maths, but I think that's a slightly different topic. Even that I learned later in business when I had to do presentations. So, if there's one thing you take away from this talk is that the single best way to become a better thinker is by building a library of visual primitives. Here are some different tool sets that I have in my library. I have a huge library of different visual frameworks and primitives and approaches that I can use. And I do try to be very deliberate in how I apply these. Notice that pretty much none of these are visuals in the sense of stick figures or nice drawings. These are layouts. These are spatial layouts for understanding information. And so as we're coming to the end of this talk, I want to bring this back to something practical. How do we map our way back to independent thinking? Now let's see this in practice. This builds on the previous video I published on the circle maps. And it also builds on one of my favorite tools, the double bubble map. We're going to look at this dilemma of should I quit my day job to start my own meaningful business? That's the basic question. We're going to use the circle map to define a problem context. And we're going to use the double bubble map to contrast and compare different perspectives. Indeed, we're going to use the circle map. We're going to create two circle maps. One for me, the aspiring entrepreneur, and the other for my wife. In both cases, so this is how the circle map works. In the center, you have the question. So in this case, or the statement, the situation, that is quitting my job to start a business. Then in the donut or the bigger circle around it, you define that concept. You give it a context. And around it, you have the frame of reference. In this case, the frame of reference is myself. So, for me quitting my job and starting a business is something about following my passion project. It's creative control. It's freedom. It's finally being my boss. And of course, it's working long hours, but for myself. And it does feel risky, at the same time exciting. But then, if I do exactly the same circle map, but now the frame of reference is my wife the partner sharing the risk then the context suddenly changes. So, she is definitely proud that I'm making this big decision, but she's also terrified. She knows that we're going to lose weekends and holidays, and for sure we're going to have a higher stress level at home. She's concerned about the unpredictable schedule. And she realizes that maybe she will need to work more to pay the bills. And so now, let's take these two circle maps. And we are now combining these two layouts, the circle map with the double bubble map. And I'm going to take the two circle maps, and they are going to be the two focus [snorts] bubbles in the double bubble map. The way the double bubble map works, it's very simple. In the center, you have the similarities, and on the sides, you have the differentiators. And the way I like to work with differentiators is if I add a differentiator on one side, I look for the difference on the other side that matches it. So, I believe that I'm going to achieve creative freedom. My wife probably feels that these are forced life cycle lifestyle changes or I might feel that I'm going to be my own boss. She feels she's losing her freedom. She might be logged into her job because someone needs to provide for the family. And of course, we all we both of us agree about hard work, about change to our daily routine, about high stress, and wanting to live a fulfilled life. So, those are the areas where we both feel the same. And I think I I highly recommend if you have a a dilemma that involves others, you do something similar. You create the circle maps, and then you look at the double bubble map to understand to empathize with the other party and to understand where the differences might be. And really now to conclude, I want to just come to this final idea of how can visuals become an intrinsic to our notes. Not just for illustrations, but the way we navigate, think, and create. This is what I've been practicing for a number of years now. This is why I developed Obsidian xCalidraw. And I just want to quickly take you through this idea. So, when you think about note-taking and personal knowledge management, it all starts with one-dimensional personal knowledge management. I call it one-dimensional because you have individual pieces of paper where you take notes. It's one-dimensional because you need to read it from left to right, from top to bottom to understand your notes. You jot things down, and that's it. Now, if you have a notebook or where you can maybe you have a diary and you can turn pages, then that becomes two dimensional personal knowledge management where on each page you have linear text, and then you have different diaries, for example, or you have different files in your folder system, and each holds some data, but it's in your mind only where they connect. You need to remember that, oh, that was in that document, woo, and that was in that document, and then you make the connection. And this is where modern PKM tools come in, and this is where things like building a second brain by Tiago Forte or Linking Your Thinking by Nick Milo comes in, or tools like Logseq and Roam and Notion and Obsidian, not to mention the Wikipedia and the whole World Wide Web, where you connect notes with links. You have links that if you click on it, it takes you to another note, and you create this web of notes, but you're still working with mostly text. When you open a note, you're faced with this wall of text that you need to read from top to bottom, from left to right, line by line. It's slow and hard, and our brains are not wired for that. And this is where 4D visual PKM comes in, where each of your notes are visual first and foremost, and they add text as additional metadata and context. It flips the whole story around. It's not that it's text first, and visuals are illustrations, but that it's visual, and you add text to add additional metadata. And I do believe in text. I believe writing is thinking. I write a lot, but I also believe that we think much better in visual. So, I first think in a chart. I think on a whiteboard, a virtual whiteboard. And then, in Obsidian X CollaDraw, you have this feature where you can flip the page over. It's like a postcard. On the front, you have the image. On the back, you have the text. This is how each of these documents work. And by the way, they're not going to go into that. I'm going to link some videos below that if you want to explore it further where you can. Here, every single visual and even every single block that you see on this presentation is a link to another note or it's an embedded visual, and I can navigate this whole system through visuals. So, this is the end of my talk. If you want to reach me or if you want to learn more, I think the best way to start is to get my book, Sketch Your Mind. It's available on Gumroad DRM-free, and you can also buy it on paperback and Kindle on Amazon. You can join the visual thinking workshop. Cohort 16 is coming up in middle of May, and that's my This is Cohort 16, so it means that this has been going on for a couple of years now. It is my workshop where you learn how to create visual hybrid notes through the case study of reading and illustrating a book. Then, there's Sketch Your Life, which is a new course I'm working on right now. You can join the waiting list for that and I'm going to inform you when I have more about it. This is about developing that library of visual primitives, the whole Sketchnoter Life curriculum is about using visual [clears throat] thinking, not so much illustration, but more the diagrams and spatial layouts to think better, to make better decisions. Then there's the Obsidian X Calidraw plugin. So, this entire presentation sits in my Obsidian vault and everything here is X Calidraw, the presentation, the animations, the illustrations, everything. And as I said, these are all linked documents which you can find some examples of. It's a super powerful tool. You can download it for free, so I recommend you try that out. You can join my newsletter and I don't send frequent newsletters. I try to send different newsletters than others, so I typically send a visual newsletter that you can view on a canvas, not so much an email with linear text. And finally, you're already here, but I recommend you explore my channel. There are lots of different topics, lots of videos, so I think my YouTube channel is a goldmine of visual thinking, of PKM, of X Calidraw and of lots of other stuff, so I highly recommend you check that out. And other than that, I just wanted to thank you for watching until the end. It's a privilege to that you stuck around and I hope to see you in my next video. Thank you.
