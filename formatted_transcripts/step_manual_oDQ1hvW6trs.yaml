ults provide\n[737.6s] evidence that some LLMs, that is large\n[740.959s] language model artificial intelligences,\n[743.68s] have granular representations of the\n[746.32s] motivational force of pain and pleasure.\n[749.76s] Though it remains an open question\n[751.76s] whether these representations are\n[754.16s] intrinsically motivating or have\n[756.72s] phenomenal content,\n[759.839s] we conclude that LMS are not yet\n[762.8s] sentience candidates but are\n[765.12s] nevertheless investigation priorities.\n[770.399s] And this raises the vagueness issue\n[772.399s] again. Perhaps there might be some space\n[775.519s] in between feeling nothing and feeling\n[779.12s] pain exactly as we do. These systems\n[782.88s] perhaps are somewhere in that murky\n[784.959s] middle.\n[787.36s] With regard to the aggregate of\n[789.279s] valitional formations, sankaras or\n[791.92s] willpower will we might say agency.\n[796.16s] Things have changed more clearly in the\n[798.48s] intervening years.\n[800.88s] Agentic AI systems are now all the rage.\n[804.8s] They can indeed browse the web for us.\n[807.92s] They can write and execute code. They\n[810.56s] can use tools. They can make multi-step\n[813.839s] plans. And they operate with increasing\n[817.36s] autonomy.\n[820.079s] However, it''s not clear that these\n[821.92s] agentic systems really have something\n[824.0s] like their own internal agency or\n[827.68s] whether they''re simply following\n[829.279s] external human agency.\n[832.48s] It''s not even clear we would want\n[834.48s] internal agency from our AIS, though we\n[837.44s] may get it whether or whether we want it\n[839.6s] or not.\n[842.56s] What is clear is that the behavioral gap\n[846.32s] between AIs that can only respond as\n[849.199s] versus those that can initiate and plan\n[851.76s] has largely closed.\n[855.519s] Whether that constitutes genuine agency\n[858.56s] remains vague, however.\n[861.76s] So where does this leave us? Not with a\n[864.16s] clean answer.\n[866.399s] The aggregates that seemed most\n[868.079s] obviously absent, that is feeling tone\n[870.56s] and valition,\n[872.32s] now have functional analoges that are\n[874.639s] closer to the real thing than a few\n[876.959s] years ago.\n[878.959s] If things keep going in this direction,\n[881.68s] we may eventually end up granting AI the\n[884.32s] fifth aggregate of consciousness whether\n[886.56s] we want to or not.\n[891.76s] This brings us to what I think is the\n[893.519s] most important point, the one that\n[895.279s] challenges even some Buddhist\n[897.36s] assumptions.\n[899.279s] In my earlier video on vagueness, I\n[901.44s] argued that personhood is vague at its\n[904.8s] beginning, that is, when does a person\n[907.199s] really begin? It''s vague at its middle\n[910.48s] that is persons can split in various\n[912.72s] ways and vague at its end that is death\n[917.04s] itself is a kind of process\n[919.92s] and we learned that personhood does not\n[922.24s] have sharp boundaries anywhere.\n[926.32s] Philosopher Derek Parett argued much the\n[928.72s] same thing. Persons are vague things.\n[931.76s] They''re not unitary souls.\n[935.68s] That is what matters is not the fantasm\n[938.8s] of some kind of personal identity but\n[942.0s] rather causal connectedness of mental\n[944.72s] and physical states over time. Indeed,\n[948.32s] Parfett himself said that the Buddha\n[950.16s] himself would have agreed.\n[953.68s] And now AI adds a new dimension to Derek\n[957.36s] Parfett''s argument.\n[959.519s] We''ve seen how AIs seem to be marginal\n[962.8s] persons or marginally sentient in\n[965.44s] certain respects.\n[968.48s] The surprising result is that sentience\n[971.92s] or personhood comes out as a vague\n[974.56s] matter that it''s not it''s not all or\n[976.88s] nothing.\n[978.8s] And this is the famous what''s known as\n[981.36s] the paradox of the pile or as it''s\n[983.759s] called in philosophy the serites paradox\n[986.639s] applied to consciousness.\n[989.839s] That is one grain of sand is not a pile.\n[993.6s] Adding one grain to a non-pile doesn''t\n[996.959s] make it a pile. And yet somewhere along\n[1000.48s] the line of adding grains, piles start\n[1003.44s] to exist.\n[1005.92s] Similarly, a thermostat is not sentient.\n[1010.48s] Adding one more layer of complexity to a\n[1013.199s] non-scentient object doesn''t make it\n[1016.0s] sentient. And yet, sentient beings\n[1019.12s] exist. Somewhere along the line of\n[1022.24s] adding complexities,\n[1024.24s] sentience gradually comes into being.\n[1028.72s] AI makes this vivid in a way that prior\n[1031.36s] examples couldn''t because we''re building\n[1034.16s] these systems layer by layer, node by\n[1037.439s] node. We can actually watch that pile\n[1040.48s] grow over time.\n[1043.039s] We can see the transition begin to\n[1045.679s] happen.\n[1047.12s] Or rather, we can see that there''s no\n[1049.919s] definite transition at all, simply a\n[1053.12s] gradual continuum.\n[1057.679s] In one early text, the Buddha''s asked\n[1060.0s] how to define a sentient being.\n[1064.48s] The Buddha defines it in terms of we\n[1066.64s] might call functional relationships, not\n[1069.12s] in terms of essential inner properties.\n[1073.12s] He says when you cling strongly cling to\n[1076.96s] desire, greed and relishing and craving\n[1079.52s] for form and for the other four\n[1081.44s] aggregates then a being is spoken of.\n[1086.48s] So a sentient being is defined in terms\n[1088.799s] of craving and attachment to the\n[1091.76s] aggregates.\n[1093.52s] That is a being is a kind of a process\n[1096.48s] rather than a substance.\n[1099.6s] Now, does AI have craving? It''s not\n[1102.88s] obvious that it does. The Buddha''s\n[1105.12s] specific criterion here involves the in\n[1108.48s] the poly word tanha, that is thirst or\n[1111.039s] craving. And we don''t have good evidence\n[1113.919s] that AI systems crave anything except\n[1117.28s] perhaps in ha