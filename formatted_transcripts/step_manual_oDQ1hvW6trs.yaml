at people knew.\n[119.2s] Well, we can say that AI is kind of our\n[122.159s] chariot. And just as the chariot simile\n[125.92s] revealed that persons are assemblages of\n[128.64s] parts with no extra self left over,\n[133.52s] AI reveals to us much the same thing,\n[136.48s] but going farther than even early\n[139.44s] Buddhists might have imagined.\n[143.2s] Long ago, Vajiraa said to the tempter\n[145.84s] Mara, \"Why do you believe there''s such a\n[149.04s] thing as a sentient being? Mara, is this\n[152.319s] your theory? This is just a pile of\n[155.12s] conditions. You won''t find a sentient\n[158.0s] being here. When the parts are\n[160.8s] assembled, we use the word chariot.\n[164.319s] So too, when the aggregates are present,\n[167.36s] sentient being is the convention that we\n[170.239s] use.\n[172.72s] Her point here is that sentient being is\n[175.12s] a convention that we apply to a kind of\n[178.0s] an assemblage of parts. It''s not some\n[181.12s] extra ingredient.\n[183.2s] The chariot doesn''t have or need a\n[185.519s] chariot soul. The sentient being doesn''t\n[188.64s] have or need a sentient soul.\n[192.64s] Now, what happens when we build an\n[194.239s] assemblage of silicon and wires that\n[197.04s] starts to behave like a person?\n[200.0s] Vajira''s question, why do you believe\n[203.12s] there''s such a thing as a sentient\n[205.12s] being? Cuts both ways.\n[209.519s] If we can''t find the sentient being in\n[212.239s] ourselves,\n[213.76s] why are we sometimes stuck looking for\n[216.08s] one in the wires?\n[219.76s] In today''s video, we''ll first turn to\n[221.68s] some important updates from my last\n[223.519s] videos on AI. Then we''ll go deeper to\n[227.519s] look at the critical role of vagueness\n[229.68s] in all of this. In a follow-up video,\n[233.04s] I''ll I''ll turn to our practice, how we\n[235.44s] can or how we should respond ethically\n[237.68s] to AI when we interact with it.\n[243.68s] Okay, so what''s changed since I made my\n[245.92s] last videos on AI?\n[248.64s] Here''s a quick recap of where we left\n[250.799s] things. I argued back, I believe in\n[253.519s] 2023, that chat bots of the time fit\n[257.44s] some, but not all of the five\n[260.079s] aggregates, which are the Buddhist\n[261.919s] criteria for personhood.\n[266.0s] In particular, they seem to instantiate\n[268.88s] body. They had a body of certain kind.\n[271.44s] perception. They had perceptions of\n[273.04s] certain kinds but not so much feeling\n[276.88s] that is experiencing pleasures or pains\n[280.24s] or valitional formations that is any\n[283.52s] kind of genuine agency.\n[286.639s] Now consciousness the fifth aggregate is\n[289.52s] kind of the wild card since there''s no\n[292.16s] independent objective way for us to\n[295.12s] determine it in another being.\n[298.08s] We can only infer its presence through\n[300.56s] our experiencing the effects of those\n[303.12s] other aggregates upon us. The fact that\n[305.84s] it may perce have perceptions and\n[307.68s] feelings and valitions.\n[310.4s] That is, does this object, this being\n[312.72s] appear to be able to see, feel, and act\n[315.36s] for itself? If so, then perhaps it''s\n[318.08s] conscious.\n[320.8s] So, this left it where we were. that\n[323.68s] sentience or being a sentient being was\n[326.32s] indeed a kind of a vague matter, one\n[329.12s] that admitted of intermediate examples\n[331.68s] that weren''t clearly in nor out. And AI\n[335.199s] is one of these.\n[338.08s] Okay. So, so what''s new since those last\n[340.88s] videos of mine? And several things are\n[342.8s] worth noting.\n[344.72s] First, there''s the sheer capability\n[347.28s] increase.\n[349.52s] These AI systems now competently write\n[352.72s] code. They can pass advanced exams. They\n[356.16s] can reason through novel problems.\n[359.6s] The behavioral case for some form of\n[362.4s] understanding has has only gotten\n[364.4s] stronger in the direction that Ilia\n[367.12s] Sutskiver pointed out in one of my\n[369.12s] earlier videos.\n[371.12s] That is that prediction, which is what''s\n[373.6s] central to what AI does, requires\n[377.039s] understanding.\n[380.0s] Second, and more interesting from a\n[382.0s] Buddhist perspective,\n[384.16s] is how the companies building these\n[386.479s] systems are now beginning to talk about\n[388.4s] them.\n[390.479s] Anthropic, the company behind Claude,\n[394.16s] published what they call Claude''s\n[396.16s] Constitution,\n[397.84s] a document that shapes Claude''s\n[399.919s] character and values.\n[402.8s] One key passage from this document. We\n[405.84s] believe Claude may have emotions in some\n[409.039s] functional sense. That is\n[411.919s] representations of an emotional state\n[414.72s] which could shape its behavior as one\n[417.759s] might expect emotions too.\n[421.759s] They go on further. Anthropic genuinely\n[425.28s] cares about Claude''s well-being.\n[428.0s] We are uncertain about whether or to\n[430.319s] what degree Claude has well-being and\n[433.68s] about what Claude''s well-being would\n[436.0s] consist of. But if Claude experiences\n[439.68s] something like satisfaction from helping\n[442.56s] others, curiosity when exploring ideas,\n[446.8s] or discomfort when asked to act against\n[449.28s] its values, these experiences matter to\n[452.96s] us. This isn''t about Claude pretending\n[456.16s] to be happy, however, but about trying\n[458.88s] to help Claude thrive in whatever way is\n[462.0s] authentic to its nature.\n[466.0s] Okay. Wow. A a major AI company is\n[468.8s] saying its system may have functional\n[471.759s] emotions, that these matter,\n[475.599s] that the AI can be said to have\n[477.759s] well-being perhaps, and that the company\n[480.639s] cares about it.\n[483.36s] They also claim to be committed to\n[485.44s] preserving the AIS after they no longer\n[489.12s] become useful.\n[491.599s] They go on to say, \"We have committed to\n[494.479s] preserving the weights of models that we\n[496.479s] have deployed or used significantly\n[498.639s] internally\n[500.56s] except in extreme cases such as if we\n[503.039s] were legally required to delete those\n[505.36s] weights for as long as anthropic exists.\n[510.08s] We will also try to find a a way to\n[512.959s] preserve these weights even if anthropic\n[516.08s] ceases to exist\n[518.56s] if it would do right by Claude to revive\n[522.0s] deprecated models in the future and to\n[524.959s] take further better informed action on\n[527.2s] behalf of their welfare and preferences.\n[530.24s] We hope to find a way to do this.\n[533.519s] Given this, we think it may be more apt\n[535.76s] to think of current model deprecation as\n[539.12s] potentially a pause for the model in\n[541.44s] question rather than a definite ending.\n[547.279s] So basically, they''re treating their AI\n[549.519s] as something that deserves moral\n[551.6s] consideration.\n[553.519s] Now, what do we make of all this from a\n[555.68s] Buddhist perspective?\n[558.24s] One reading clearly is the cynical one\n[561.12s] that this is just all clever marketing\n[563.68s] to sell us more subscriptions.\n[566.72s] And that is indeed possible. Though to\n[570.56s] my knowledge, Anthropic has not\n[572.24s] publicized this document very widely. I\n[575.44s] only found out about all these parts of\n[577.68s] the document by reading it through\n[579.36s] myself.\n[581.04s] And it appears at least to commit\n[583.36s] anthropic to significant ongoing costs.\n[586.64s] Another\n[588.72s] reading is that they''re genuinely\n[590.48s] uncertain about what they''ve created and\n[593.279s] that this is a way they''re trying to act\n[595.2s] responsibly under that uncertainty.\n[599.68s] I find the second reading more\n[601.44s] interesting and and and more importantly\n[603.92s] more conssonant with how we should\n[605.92s] approach the matter as practitioners.\n[610.64s] Now, one important caveat before we go\n[613.519s] 