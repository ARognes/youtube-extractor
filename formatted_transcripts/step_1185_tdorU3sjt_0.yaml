transcript: '[music] Hello and welcome to Stockholm, capital of Sweden, a country in Northern Europe that''s been punching well above its weight in terms of games development for quite a [music] while. Stockholm is the home of Imbark Studios, the creators of Ark Raiders. And for the past few years, I''ve been documenting the development of this game. But while most games change over the course of development, the story of Ark Raiders is a unique one. Because not only has this game changed dramatically, but the original version of the game that was shown to the public no longer exists. And ever since it was first shown, the internet has been asking one question. What exactly happened to that [music] version of the game? When the Arc Raider teaser trailer was first shown to the world at the Game Awards in 2021, it was a very different game. You see, back then it was being pitched as a co-op PvE experience with players able to jump high and run across a wide openen map working together to defeat massive machines with emergent behaviors. Players selected their characters from a set of defined heroes. And crucially, it was a free-to-play game. Over the next four years, Arc Raiders would evolve into something very different. A PVPVE extraction game with denser, more livedin levels. Machines of all shapes and sizes would populate this world. The enemies were driven by physics and groundbreaking locomotion tech, turning a once arcadey experience into something far more grounded. In this three-part series, we''re going to reveal not only why the original concept was killed, but how the current version of Arc Raiders rose from the ashes of that project. We''re going to detail the bleeding edge locomotion technology powering the movement of their most intimidating machines. How elements like gunplay and loot evolved over the years. why they dropped freeto play, the impressive work done by the audio team, and much more. First things first, though, to fully understand what happened to Arc Raiders, the game that was meant to kickstart this new studio, we have to go back to the founding of Embark itself. How did this new studio come about? And most importantly, how did they decide what type of games they wanted to make? [music] >> [music] [music] >> Like a lot of the initial employees at Embark and the founders came from Dice and I''ve been in the industry for close to 20 years. Most of that spent with with the people here. I shipped 21 games, one at EH. I think >> during my 20 years of building games or more, you know, the first game we built, we were seven people in a in a an apartment basically, you know, to then oversee productions with over a thousand people. Are the games themselves better? They''re more of them. They''re at higher fidelity, but are they actually better games? [music] How do we move away from productions that are so large that they''re difficult to manage? I mean we I was part of the uh the group the founders group. So I was here when we were six people. Technology wise I mean we quickly settled on Unreal and then in conjunction with that we also had proprietary tech that we were developing and then also of course invested heavily on procedural tools uh for especially for the content team. The initial uh gang sat around a a big table and discussed things that we want to explore and games that we want to try and see if if this fits into something that we want to do. So we started this endeavor of making micro pitches that [music] we would come up with a simple game concept and talk about it for just a couple of minutes and we started seeing doing this over and over. We started seeing common thematics. They slowly formed into the initial pitch for what we wanted to make. So we pitched it to ourselves. A couple of these explorations were left by the wayside. One of them became the finals. A couple of thematics that we knew we were excited about was of course the the prospect of space travel, the impending sort of ecological collapse, the the rise of of AI and the man versus machine angle that was a game in there and I think when we were the first initial group sort of vetting different concepts, I think those were the things that were sticky in there. I think from a mechanics perspective, I think the first pitch was something along the lines of sessionbased raids. To give you an idea, we talked about uh some sort of ven diagram between Shadow of the Colossus, Left for Dead, and PUBG. somewhere in the middle there. There was a game concept that I mean on paper that''s a was a super compelling concept to us especially the the making you a small human in a in a in a in a vast world with huge machines. That''s what we started to explore. Not knowing at all what kind of game loop we were supposed to have but just like looking at the prospects of different mechanics in that context. So, we wanted to make something completely [music] our own and everyone had a an idea of something fantastical, sci-fi leaning because it''s it''s comfortable. Everyone kind of likes it, but it''s also a challenge to carve out your own niche in [music] that. And it was I mean, it was certainly challenging. Even my my kid who was like 11 or 12 at the time just had the sentiment going, "Oh, new studio sci-fi game, very original." Embark''s first game was going to define the studio, and they wanted to work on something that was outside of their familiar firstperson military backgrounds, a game that was on the bleeding edge of technological innovation. The team entered a long period of brainstorming and ideation as the studio slowly built up around them, a process that gave them many of their most attractive ideas, but also created significant design culde-sacs that would prove troublesome down the road. This project was known internally as pioneer. We developed I think core mechanics at the same time as we were testing out some initial ideas about the game [music] mode itself. Uh there was no one was thinking about a larger meta game at that time like what is the actual economy that drives the players motivations and so on. We were literally exploring the initial mechanics of how does it feel to play against these machines and cuz I think all games needs to go through that like is there something fun in the second to second mechanics like is it fun to even in FIFA if if it''s not fun to kick a ball against the wall it''s not going to be a fun football game sort [music] of put these large machines in this large world and I mean we again testing out playing against these large machines just from a pure [music] sort of game and spectacle there was something there. >> You can say it was a extremely [music] ambitious project. It''s supposed to be a new genre or was supposed to be a new genre and session [music] based raid uh with say 40 players and uh you''re supposed to take down huge obstacles together like uh big bosses, [music] big AI enemies that evolve over time. So every time you go into a session, you play against a new version of the AI. three to four teams or more I don''t remember but scattered out uh in a in a in a big world [music] and uh at some point giant machines would arrive like they were already it was already populated with smaller machines but then we would have these larger machines arrive and then we would sort of have the surviving players would then converge into these epic moments at the end tail of [music] a session. We had some amazing play tests and amazing moments when we did that and we saw we saw the potential there like uh and we wanted to believe that we could replicate that on a consistent basis but that''s where the I think where the sober eye [laughter] should have come uh perhaps a little bit earlier than we wanted. [music] We wanted to believe that we had something there that that there are some incredible moments in there, but the individual player there, [music] if we were being honest with ourselves and and looking at the game with a lens of trying to capitalize on that and make a game out of that again, consistenc consistently replicating [music] a player session um that would hold those moments over and over again. I think uh that was much much harder than we thought. This version of the game, now known as PIO1, was a very different game to the Ark Raiders we know today. Player movement was far more bombastic. Characters were powerful, adopted the personas of various heroes, and worked collaboratively to hunt down these large machines. Very different to Arc Raiders in terms of both gameplay and tone. But many fundamental aspects of the game were developed in this period. highly detailed, vast open terrain, the feel of the weapons, the look of the world. One such aspect, the technology driving the locomotion of these large robots is going to require its very own video in this series. So, look out for that soon. What''s exciting and what''s still exciting is the fact that using this technology for our locomotion system is the door that opens up when you are training something to behave and walk by itself and the nature like when this player starts interacting with that and losing limbs and still it wants to stand up. It it just opens that door to a new type of experience that players uh haven''t had before. I think they''re literally playing against a machine. Um we spent the majority of our first year just building tools. I also knew that we weren''t going to get things right. That we were going to make a ton of mistakes along the way and we had to plan for those mistakes and kind of [music] get ourselves in a cushion to be able to make those mistakes. Guess what? You know, if you''re trying to send people to Mars, you will crash a bunch of rockets. We crashed a bunch of rockets. >> I remember one of the earliest things I worked on was the the dog. Do you remember like the fourlegged little pouncing thing that ran around the world? >> Yeah. Yeah. That''s long gone. >> Yeah, long gone. But that was one of the first things that I that I started working on. >> Sometimes ideas written down on paper or that people talk about, oh, it''ll be so cool. We''ll have these enormous things and they can come down and you can fight them. And then in practice when you put them into the game and you kind of go, okay, well, how does this actually work? [music] It sounded really cool when we were talking about it, but actually now I''m just running around looking up all the time cuz it''s 200 m tall and how do we even get up there? And what happens if I fall off? I think the one of the core problems was that what we were building then was something pretty new in terms of like how the game play would be and it felt like we were moving in the same direction. Uh but then with the pandemic we started to drift apart quite a lot. >> The way we built the game before was very [music] loose. that kind of mixing pot produces a lot of cool moments and we just couldn''t find that the nugget that makes you want to persist. Uh what is the main retention mechanic behind some of all this uh what''s in the mixing pot of fun experiences? >> I remember they had this like sort of crazy idea about um projectiles that would remove the parts of the the enemies. Uh so that was one of the first things that I actually worked on was a uh a function for the the launchers that we had to be able to like suck off the plates on uh one of the kind of bigger uh scarab bots that we had. >> Finding the fun is always the thing that you cannot just automatically say that we''ll just do this and it will be fun. What you know is like you work and you put the thing in and it''s not working as you want it to. So then you need to start reworking it and reiterating on it and maybe rethinking some of your initial assumptions that there''s limitations in certain aspects and there''s other ways that actually it''s more fun because you play the game and you realize you know what it''s more fun throwing these rocks at this robot or it''s more fun you know jumping and that I think uh comes from playing the game and just playing around with what you created and allowing that to express itself in the game''s creation. I think that''s when you can actually do new meaningful things. >> The way we developed our game by, you know, people put things in there and we feel it out together and we change what''s wrong uh together worked well when we were a smaller team and met each other all the time. But then it just didn''t work well once we were separated through the pandemic. Behind the scenes, Pioneer was struggling to find its identity. The pandemic was partly to blame. Problem solving is much more challenging with teams spread apart, but more worryingly, the various departments were beginning to drift with each milestone. Communication was challenging remotely, and as a result, the game was beginning to feel less cohesive. More worryingly, the moments that made the game feel special when all the players got together in the center of the map to destroy a large machine were difficult to replicate. So, in order to fix this, the team entered a six-month phase in which they would try and distill this PVE experience into something that would deliver satisfying rounds more consistently. This phase was known internally as the pivot. >> If I remember correctly, we had actually reduced the game uh to a point where say, okay, we we need to make this one part fun, [music] and if we can make this part fun, then we can replicate it, right? uh even though we had this huge word, we''re just using a small portion of it and my first task was uh the moment I realized we are uh very ambitious which was uh Kyle can you put a timeline to deliver [music] this game right in 2020 and I said well from what I can see here did all the the estimates talk to the whole team understand the whole scope of it I like okay I think the best we can do is like we need around 2 years and the answer was no way we have 6 months uh how can we make a plan that fits uh 6 months and I remember even the name of [laughter] the presentation was called Hail Mary plan uh and we had a plan for trying [music] to get something out there in 6 months. >> At that time it was in a state where we were looking at trying to launch it um [music] or at least getting ready to launch it. Um, so we had had what we had called closed beta at that point. And I think as part of that process, uh, realized that what [music] we had there wasn''t really a viable thing there. Game loop, it wasn''t really there. So you''d have some sessions where you had an amazing moment >> and you you loved it and [music] you never had anything like that in a game ever before. And then the following 10 sessions, you were running for 10 kilometers with nothing happening and nothing to interact with. So, it it really kind of [music] hinged on these highly emotional moments that were few and far between. It''s not like every player who goes into the game is going to be like, "Oh yeah, I ran into this giant boss and I had this cool encounter." Because that''s [music] how we designed the encounter to play out. It''s like some people ran in there and like I just got stomped on the head and died immediately. It''s like, "Oh, sorry." Yeah. We don''t actually control where it''s putting it. >> Exactly. Or I ran in and someone had already pulled three legs off of it. So now it was laying there and kind of like trying to, you know, kind of go at you >> felt kind of cruel. >> Yeah, exactly. And it and it was really difficult to [music] make it consistent for all the players. >> This whole idea about kind of raiding together against these large robots that there was elements of of of fun in there for sure and there was elements of spectacle in all of it [music] for sure. But what I couldn''t see was not that there wasn''t moments of fun or that what I couldn''t see is that I didn''t I couldn''t see the big picture [music] of it. I didn''t quite understand how all of this would meaningfully add up to something that could stand the test of time and consistently do so. We had at the end of the pivot period there was a play test or there was a was a play test where we invited friends and family. a mode where you broke into the spaceport level and uh activated these things which culminated in one of our giant bosses coming down. We went out with that in the the closed beta and you know it did what it needed to do but it also affirmed that outside of those emotional highs and the novel gameplay there was nothing that stitched it together. We lacked any sense of metagame or progression. So you''d have these fun sessions for a few times but there was nothing that actually pulled you back or kept you going forward. You know, I think a couple of us already knew what that test was going to be, but at the end of the day, it became even clearer as we got closer to the deadline that while this has of course it''s fun and there''s something here, it''s still lacking a big component. So, Patrick already said, I think the first day I I started here is that I think you need to add PvP. >> I we had conversations and I I certainly as I''m always was very opinionated towards [music] the team around what I thought. I mean, I all from the start I said, "Listen, I I think that we need this to be a PVP game to some extent. I think we''re going to struggle with getting a PVE game the way that we want to with the tech that we have." And that''s really when we uh had a lot of internal discussions and I think we we had our summer party and then went on break and came back and then everyone was informed that we were pivoting to a new genre and starting to explore what that could mean and lifted everything we could. So a lot of the environments, the enemies, [music] the characters or things about the characters were lifted and sort of repurposed. >> It didn''t work. The the larger recipe for the game wasn''t there. And again, we couldn''t replicate the sessions consistently enough. So I think that that''s enough to start talking about, well, should we consider adding the PVP component? >> I understand that a lot of people, and frankly me included, wanted this to be a PVE game. and I wanted for our vision to work. But when it doesn''t work, you have two options. You can either well three. You [music] can release what you have to the public and they will crucify you. We''ve seen that happen multiple times. Or you decide I don''t want to continue with this. We shut it down. That we''ve seen that multiple times. or you still have a belief in the lore, everything [music] that you''ve built and the core kind of gameplay loop and you say, "hm, maybe I can just make this something different." The pivot had not worked. The team knew that a more drastic solution was required. A new phase in which the older version of Arc Raiders would be put to rest and a new game built around PvE and PvP combat would be built. This phase, the most significant beat of Ark Raiders''s development story, is known internally as the reset. But to buy the studio enough time to reset Arc Raiders, they''d first have to push forward the release of the studio''s other multiplayer project. What the studio needed to do once we actually made the decision was that one of the reasons we could make it was we switched the order of the games. So that would be the implication of it because we wouldn''t be able to add PvP and figure out what the new game was all about and still keep the the kind of targeted release window. That was pretty clear from the beginning, which meant that we had to put the finals front and center. Um, which of course for them was perhaps okay, suddenly we''re in the hot seat now. And that that certainly must have felt like a challenge to to that team. The reset wasn''t just going to be a case of sticking PvE into their PvP game. It was going to require a fundamentally new approach to the way sessions would play out. A way of merging the best parts of their enemies and world building with PvP gameplay that felt exciting but not overly punishing either. So, what was going to get cut and what did they keep? >> So, we had the world which we knew we liked. We knew the world that was crafted and I think one of the reasons were I was playing the game quite early. I was just walking through these empty hallways and these uh corridors of offices and and and I I was thinking to myself like I just want to explore this place. I want this to be more than just a static backdrop where you know I''m fighting robots. I [music] want this to be something. I want to be here because you already built one half of it. So I feel like you already you already made me want to go and explore this world. So what game type then would be the game that kind of fits there? How can we kind of apply that with a new game type? [music] When we broke it all down, it started to become more and more apparent on, you know, we had the uh the arcs, the AIs that we wanted to continue building. We wanted to keep the large robots, we wanted to keep the world, we want to keep the brand and IP because we we saw the response from the players and all those things. So we didn''t feel like we needed to reinvent all those things. [music] It was a game telling us that that''s what it wanted to be to some degree. >> If we think about the different phases, the phase we were in when we did the reset felt absolutely right because the game we had at our hands at that point wasn''t at the peak fun that it itself had even been right. There was one thing that they kept bringing back to me like you know when was the game most fun and they said like M12 I think is the name M12 you need to go back and look at M12. I was like okay milestone 12 I have to go back and look at it which was um a scaledown version of the full experience but it took place around the spaceport area and there was players going through a bunch of arcs and then eventually ended up inside of the spaceport and then fought one of the large robots inside the spaceport. Um, and so they they felt like that was the strongest that the game had been. So we tried to recreate that to some degree as at least take some of the things that we knew worked from that point and put that into the game. I think what worked was the emergent nature of how players were interacting with each other and the machines and there was a good sort of rhythm of play in that one. I think the destruction of the [music] machines themselves. There were some sort of you know gradual gratifying juicy [music] destruction and we could see how the machines were navigating across this spaceport repeating it. If you''re asking yourselves, would I do this over and over again? Even if you just change the environments and the machines for slightly different and so on, like what is the then you start asking the right questions about why would I come back? And in a context of a free-to-play game where retention is crucial, you have to be able to see yourself doing that over and over again. The game we''re making now was the game I sort of imagined when we started building it. [music] It was a game about exploring and being in this world and the world was supposed to challenge you and you were supposed to go places to find things and the just the way the game was playing earlier was this action game where things just came [music] at you. To me, it''s it''s it''s much better because it has a slower pace. This is the best [music] game I''ve worked on for me because it''s a game about listening for [music] things. And that''s why PvP is such an important uh addition to the game. Like I think a lot of people have a strong reaction to what that might mean. But if you think about what happens when [music] you play against other humans, uh you you just realize that that finite distance gets closer [music] to infinite because now you have all the permutations of human behavior in the session. Some players might not like playing another person [music] cuz you''ll get tryards that are very, very good. But if we do our job well, then you''ll have something that feels balanced and fun. Even if you''re not the best at aiming or the best at shooting, you should still be able to, you know, find something rewarding in that [music] experience of extracting stuff back uh out of the world. >> You''re coming in to a world where Ark is operating and there is something going on. I think the com the gameplay components there when they discover you, how they discover other players and how that becomes noise traps for other players is super interesting. So I think that the toolbox for our designers here to [music] build emergent moments, it it''s actually really strong. [music] Um, I mean, I understand that some people are upset that it didn''t work. So am I. [laughter] But at the same time, what we have now is a an incredible game that I believe um, works really well that I think people will have an amazing time with. That''s all that we can do as game developers. try our best to deliver that to the players out there. Um, simple, not not more complicated than that. >> Our chief concern [music] is to make a game that is fun at its core and that stays fun and keeps being [music] fun and keeps evolving into something that that is even more fun cuz that I mean that was the culdeac [music] we ended up with before rebooted the game, right? It was really fun, but it was the same kind of fun over and over, and that doesn''t really cut it. >> In the reveal trailer, what we were literally selling to [music] our players is even though we''re saying fictionally like there''s large machines out there, well, in that video, we are dominating the machines. We''re jumping on top of them, smashing [music] them, and inviting players to have fun with that. That''s been flipped around, and I think that''s for the better. like really having players fearing the [music] machines is a completely different game. That''s a 180 in terms of how we relate to the machines as the players. The old version of Arc Raiders was now dead, a dream [music] that the studio was going to have to wake up from. But what could they retain from those early years? What stuff could they bring forward into this new version of Arc Raiders? And what [music] new tricks did they have up their sleeves? In the next episode of this three-part series, we''re going to tackle the experience of being a raider, how elements like combat, the loot system, audio, and world building evolved after the reset, and crucially, why the studio dropped the plan to go freeto play. See you then. [music]'
