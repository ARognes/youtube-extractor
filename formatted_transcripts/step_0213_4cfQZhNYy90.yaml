transcript: Anybody who's worked with me knows that I like to finish meetings with who, what, when. And so it's my very simple management algorithm. That's about it. Everything else you can learn from Laya. But these three, this is what I do. And so at the end of a meeting, I'm like, who, what, when, right? Who is going to do what by when. Very, very simple, right? And here's where if you want to go to the 2011 level, whenever someone tells you the by when, okay, uh, today is Monday and you want to do this by next meeting, next Monday. How much actual time is this going to take? time on task. And so people will be like, uh, I think it'll take me four hours. It's like, okay, what are you doing in the next four hours that is more important than this? A lot of times the answer is nothing. In which case, great. Do it. Do it by end of day and let me know. And so if you ever want to speed up the movement of a team, increase communication cycles. So that means instead of going end of week, go end of day. It's 7xes the speed of a team. You will be amazed at how much more you get done. So who what
