transcript: '(ident clicks) (ambient music) - Hello there, traveller! And welcome back to our series on the development of Dwarf Fortress If you missed our first episode, that''s where we first met Zach and Tarn Adams, a pair of brothers whose shared love of game-making had them create dozens of experimental titles playing with systemic design. When we left them last they were on the eve of releasing the first free version of Dwarf Fortress, a game they would go on to spend the next 5,964 days updating before it had any type of broad commercial release. In this episode we’re going to explore that 16-year period: The work the brothers did, the community that embraced their game, and the real-life drama that pushed them into commercializing their life’s work. We''re gonna be dumping a lot of Dwarf Fortress knowledge on you in this episode. I''m just gonna come out and say it. But don''t worry. My mission is that, by the end of this video, you will be a fan of Dwarf Fortress. Even if you''ve never played the game, you''ll be a fan. You''ll kind of understand it. A little bit. So let''s start with something ... easy. A nice boat trip. Y''know. Before we get to the ... 20 minutes of ASCII gameplay. (rootsy acoustic guitar) - [Tarn] Yeah, always nice to see the city, of course. And also just to, kinda, look around at what we got. Yeah, no, it''s great. I love it out here. Everyone loves this. I mean, everyone loves the ferry boat. This is one of the highlights of coming out here, being in the center of the water. And being surrounded by mountains, erm... Especially on a day... Like, it''s nice in the summer, too. You get less snow on the mountains. But when it''s not overcast you get blue skies everywhere. - [Danny] Oh yeah. - [Tarn] And you can see Mount Rainier. You can see... all the mountains all the way up north to Canada. And every single one of these mountains, you can visit, y''know? There''s hikes everywhere, it''s great. - [Danny] You''re like Todd Howard: "You see that mountain over there? You can climb it." - [Tarn] Yeah, no, this is... This is the kind of place that would inspire you to make those kind of systems, right? And ... and that was one of those things... When I was talking about, like, weird little games we worked on, and stuff. These are the kind of ideas everybody has. We had a game we were making in like, erm,  1994, or so... that was kinda based on – and this is the first place we saw this – "War in Middle Earth" was this old game where you had a strategy map but you also had this weird combat view that was side-scroll-y? Like, you could see little Hobbits and Orcs walking and you could see the background. So if you were close enough to Mount Doom it''d put a Mount Doom in the background. So we were gonna proceduralize that, make this procedural map and detect the distance to the landmarks, and then show them behind you when you were walking through these areas and stuff? - [Danny] Right (laughs) - [Tarn] And so, yeah, it''s like the kinda thing that everybody... Everybody wants to do. Erm... All these, all these different games were always kinda headed in the same direction. (acoustic guitar strum) - [Tarn] Dwarf Fortress is a colony management game. You basically have a group of Dwarves, and they mine in the mountain. You don''t control any specific Dwarf, but you just kind of order their general activities, and just make the best of things as trouble comes your way, on occasion, as it tends to do with the poor little Dwarves. And make sure that you have enough alcohol to drink, and, er, make sure that you''re farming mushrooms and making little golden goblets, and so forth. But when it comes to what makes the game more unique is that it actually takes place in a persistent world that the game will cook-up for you each time. So you can run a "world generation", which is sorta this historical procedure that runs out some hundreds'' of years of history in a world map that''s been cooked-up just for you. And then you can play as many fortresses as you want, in that map and the old ones will impact the new ones, and so forth. You might have a Dwarf from your old fortress come and migrate to your new fortress and you''ll recognize them. It''ll be the same Dwarf, with all the same... Their personality''s intact. Whether or not they''re missing their pinky finger is intact. All that stuff is, is there. It''s the same Dwarf. And, erm... You can also play a single-player RPG. So you can visit your retired fortresses, talk to your old Dwarves. I mean... It''s not that great, right? We don''t have, like, a scriptwriter writing this whole story of your Dwarves, or whatever. But they''ll talk to you about what they''ve been doing and so forth. And over the years it''s become incredibly complicated, and so forth and that, that feeds into this whole, erm, notion that''s at the center of the game which is "emergent narrative", right? It''s the idea that you can be playing a game without a story but a story will still arise as you follow the different threads and pieces of information that are presented to you ''cos your own mind is a story-building engine and we can help that, by, in our game-design processes, to encourage that kind of thing to happen. So it''s really, sort of, a collaboration with the player to produce a bunch of stories. And you can just look-up "Dwarf Fortress stories" as a Google search and you''ll see what we mean, erm, by that, ''cos people have done really amazing work. (jazz music) - [Danny] Just as Tarn said, every game of Dwarf Fortress’ main mode "Fortress Mode", begins with world generation where thousands of years of history are simulated, laying the cultural, geological and architectural foundation of the world your Dwarves will mine, and drink, in. From here you''re told to "Strike the Earth": To mine and find minerals that can better your fortress and attract more Dwarves. But you’ll also have to make sure that the Dwarves you have are happy. You see, each Dwarf has their own needs, skills, desires, and moods. They form friendships, faith groups, and have pets. They even have their own fears and nightmares based on things that happen to them in their lives. The trick with Dwarf Fortress is slowly understanding the layers of complexity that exist within its complex network of menu screens, as it''s in these menus that information about your Dwarves and their lives is buried, and it’s this information that helps build stories. Hey, did you notice how some of the gameplay earlier looked... slightly easier to understand than some of the earlier-earlier gameplay? Like, slightly? That''s because, while the core version of Dwarf Fortress uses ASCII graphics, at a certain point in time, users of the game decided to make their own graphical tile-sets to make it slightly easier to parse the noise. In fact, modding the game through third-party software like "DFHack" has become part and parcel of being a Dwarf Fortress player. This is just one of the ways  in which Dwarf Fortress has evolved over the years, and to truly understand the game as it exists today we need to appreciate how far it’s come. I know, this sounds like homework, but it''s relevant context that we need. So just give me three minutes. Three minutes to compress, like, 16 years of Dwarf Fortress history. And I promise, at the end I''ll... I''ll give you one of Tarn''s funny anecdotes. Okay? Deal? Let''s do it! On 8th August 2006 the first version of Dwarf Fortress (v0.21) was made public. In this you could play Fortress Mode or Adventure Mode. Fortress Mode is the main mode in Dwarf Fortress, where you run a fortress of Dwarves. And Adventure Mode is where you control a single character and explore the world. In this early era, the main reason for Adventure Mode was, really, to load up old fortresses you’d built and run into the ground (no pun intended), to explore them one more time. The big difference between this and modern versions of the game is that there was no Z-axis. The game had no depth. You couldn''t dig down – into the ground underneath you. Something that seems pretty critical to a game about mining. No, instead you started outside of a mountain, and dug laterally into that mountainside. After about a year of updates (mostly concerning bug fixes) the next major update came... Version 0.27 added the elusive Z-axis, allowing Dwarves to dig down! And, as such, it also included several updates to caverns. New biomes in world generation, plenty of new creatures, and objects to create. Dwarves were given updates, too, including more detailed skills. The next major milestone came on April Fools'' Day 2010 with v0.31. A massive update, which added materials and attributes to objects, more detailed fortresses with an expanded suite of rooms and cavern types. Huge updates to how military combat worked – including training, equipment, tactics, combat, and detailed body parts. Hospitals and healthcare were added, too. Dwarves had more stats, including emotions. They had more detailed body parts with organs, skin, nails and bones. They had more appearance attributes and they even got souls, which stored mental-health attributes. Two years later on Valentine''s day, v0.34 added towns, trading markets, grazing, food, Vampires, Werewolves, undead creatures and "evil" parts of the world. It had historical figures, Dwarves needed to eat and drink and law and justice was added. The v0.4 updates began in the summer of 2014 and this is where Dwarf Fortress’ complexity began to get really out of control. In these updates, changes were made to the game’s code, allowing the world outside of your fortress to be simulated instead of it being in a frozen state when you weren’t looking at it. The tavern update allowed people to visit and trade with your forts, passing visitors could become citizens – even including non-Dwarves – so you had to figure out their needs. Bar fights could happen in taverns. Stealth and sneaking were added. And there were loads more objects and room types. Libraries could attract scholars. Those libraries needed books, but also books could be written. Books could also be read, providing knowledge to Dwarves which could be spread to other Dwarves. The game was converted to 64-bit and Adventure Mode was updated throughout this process, too. Of course, back then all of this was done on the old ASCII version. Dwarf Fortress wouldn’t get official tile-art until v0.5 and the Steam release. But we''ll get to that later. (jazz ends) - The thing is, we had what was called "the Dwarf economy" er, which was a thing that turned on when you got your, your... your settlement large enough to, kind of, have a broker, maybe a mayor or a baron. I don''t remember quite what the switch was. And it was famously broken (chuckles). Like, there was... Like, we immediately gave every Dwarf an account. An abstract account. They would try to take the minted coins and match their account to their rooms, so everyone would be hoarding different amounts of coins. And we did this for Adventure Mode so that you''d go back and there''d be treasures everywhere in these rooms, and stuff after your fortress fell apart. But, the thing was, they... We, we just started throwing in concepts. And we were like, "Okay... "So now the Dwarves have to pay rent on their rooms," and stuff like that. And if you''re not doing that with all of the concepts that come into play, then it''s going to fall apart. And it did. Immediately, the rents kinda went higher than they could pay and you have all these homeless Dwarves everywhere, and... and so we took it out. And then we were like, "We''re gonna approach this properly." And so, yeah... I got tons of economy books. Learned a bunch of stuff. Said that, "Okay, now the caravan arc, where we do Fair Cycles," like medieval fair cycles and markets, and all of this stuff. Thinking about, like, "sea loans" for ventures and things like that ''cos our year is 1400, and stuff like insurance and stuff had been invented at that point, or whatever. There''s all this cool stuff. and it''s all kinda just out there as an "upcoming" for the last, y''know, 16 years. - [Danny] Is that why it''s a project that''s easy to keep working on? Because there''s all these new types of game you basically get to add to the main game? - [Tarn] Yeah. No, I mean, how can you get bored with this, right? I mean... It''s, er... There''s so many things that are like that. I mean, when we were talking about laws for the, y''know, the economy. Doing this change so there can be, like, law-making. Like, what does that actually look like? Do we add, like, little senates and stuff? And little village councils and things? And then they have these deliberations and stuff? Er, it''s... Yeah, endlessly fascinating. So, yeah, we''ve just got new, er, files uploaded by the artist. Which is, er, Dwarven hair for children. And somewhere in here... I believe these little things here might be the little mutton chops and beards for the youngsters (laughs). - [Danny] Are Dwarven children born with beards? - They''re born... I think they''re born clean-shaven, but it instantly begins to grow in. Erm, just like, erm... Yeah, their fingernails and everything else will grow. I mean, I guess kids are born with fingernails, obviously. But the length of them, they don''t... Actually, that''s a fascinating question to me, that''s gonna disturb the heck out of me now, is like... Are little babies born with fingernails? But why weren''t they, like, growing before? Why aren''t they born with big curly nails?  Like, when does... When do they start growing? Or are they born without fingernails And they come in? This is the promotional image for our PAX party. (Chuckles) - Er, I think that''s Zach, me, and Alexander our Community Director. (party noise) - [Tarn] Oops, sorry. - [Fan] It''s okay. (ambient guitar) - All right. - [Fans] Thank you. - Excellent. ''Sup? - [Fan 1] While you guys are up would you mind if we got a picture as well? - [Fan 2] You walked away, and we were like, "Oh, we should ask..." (laughs) - Yeah, no, you gotta ask. Yeah, yeah... - [Fan 2] Thank you so much! - So, however you would like to arrange yourselves... (Laughter) - [Ryan] Dwarf Fortress is the game that makes me feel stupid (chuckles). Honestly, you try to play it and there''s so much depth to it that you never know what to expect. You start off with just, like, a small little fort. Like, "Hey I wanna build, like "a couple little rooms for my people." And then you never know... Immediately you''re hit with goblins coming in or an invasion, or any kinda, like, Christmas present coming your way. But I still think the best thing that carries forward, like, not even the game, is that it''s fun. No matter what, if you win or lose, you have fun. You''re creating a story and having a good time with it. - [Aaron] You''re looking up from heaven and looking at all these little guys running around, basically. And you tell them what to do, and sometimes they listen and sometimes they don''t. Sometimes they get into trouble. Sometimes one of them will open the gate and all the goblins''ll get in and kill everybody, or one of them will get sick and you''ll have your own little pandemic going on. Sometimes they won''t feed each other, or leave people to die in the beds and the nurseries, like... They''re very clumsy Dwarves. - [Nick] I was a member of a forum called Something Awful. 2006/2007 maybe. Like, 2008, somewhere around that timeline. And I downloaded it. It was, it was a little daunting because especially back then, it was still all, like, ASCII graphics. So, like, y''know... You didn''t have, like, a Dwarf or a camel. You had like an H or a semi-colon, or a... Grass was dots and periods. And an equals sign was a door, maybe, or something. I''m trying to remember. Like, X is a floodgate. And it was a different type of game because you didn''t "do things". You requested things. Like, "Hey, I want you to build this." Well, maybe the Dwarves''ll get around to that if you''ve done it kinda right. Things happen that you not only don''t intend to, but, like, you''re surprised by. Even if... Everything can be going to plan and you can still be surprised by the game. - [Noah] I think, on the website or somewhere, it says like, "Your new favourite hobby!" or something like that. And I took that very much to heart. Where, like, I''d be doing homework and it would just be on in the background (laughs). And then I''d always be checking back in and then something would happen. I''d be like, "Oh, great." It''s so fun. - [Aaron] We were going great. Like, in the Fall, we''d collect peach pits and we''d make wine, and my Dwarves would be happy. And we''d farm a little bit. I think there were mushrooms. They, they love the mushrooms. Erm... And everything was generally going great and peaceful. When a giant lamprey came and descended upon the fort. Erm... I think the siege lasted a couple years. The lamprey hung around the walls. He wouldn''t let anyone out or in. He killed traders, he killed all the wildlife. Erm, and eventually the food stores really started to dwindle. It got really desperate. So I sent the army out ... and they were massacred. They were all gone. The lamprey made his way inside, and by the end of it there was a single child left, er, dying in a hospital bed. Erm, no one was there to give her water so, er... She lived out the last couple months of her life with the lamprey lurking the halls. And that was it, y''know? Eventually it ended. Erm... It was amazing, yeah! You don''t get that in any other videogame (laughs). I love Dwarf Fortress, man. (ambient guitar music) - [Danny] If Tarn and Zach are Dwarf Fortress’ engine then the community is its fuel. Each player in Dwarf Fortress is a god, stretching down to try and decipher the tiny lives of their world’s inhabitants. And the ways in which these stories are told has evolved just as the Internet has. Arguably the most famous story of them all is "Boatmurdered" a darkly comedic telling of the fate of a particular fortress over the course of 14 in-game years – each year operated by a different member of the Something Awful forum, each of whom told their story and passed the save-game on to a new player. The YouTube era has given birth to creators like Kruggsmash, who combine his fortress gameplay with charming artistic renders and a comforting voiceover. Streaming has led to channels like BlindiRL who, as it happens, we hired to capture much of the gameplay used in this documentary. The Dwarf Fortress forum has been the heart of this community over the years. There are countless Reddit threads sharing stories. Podcasts like "A Strange Mood" and "Dwarf Fortress Roundtable" provide whimsical stories from the hosts'' games. I''ll leave links to all of these creators in the video''s description. To help make their stories more vivid, many fans have added mods of their own including texture packs, interface tweaks, and custom sound effects. But for Tarn and Zach, the most important part of designing Dwarf Fortress is ensuring that players are given the moments that inspire stories – whether the brothers plan them or not. - [Danny] A core part of the storytelling aspect of it as well, seems to be player imagination, to a certain extent? - [Danny] Like, they also add... It''s like a soup, kind of. - Yeah, you can''t stop that. Like, people... People are going to try and explain what happened. And sometimes the game flipped a coin. That''s literally what it did. And they''re like, "No. This was the rich personality model "and I looked through and I found that this Dwarf "was somewhat miserly "and that is why they would not... "Y''know, they didn''t bring this item here," when literally they just, like, called off on another job or something. Right? And, and you, you feel a little guilty about that a bit, sometimes. That, like, "No, that''s not there," or you feel like you want to correct somebody or something like that. But, no, this is just... Everyone knows that this is how it works, I think. At least after a while. When you''ve been playing games for a while, you know that you''re, kind of You''re adding to it. You don''t know quite what''s there. It''s kind of like a magician. You don''t wanna go in and just, like ask them all their tricks, or whatever. But occasionally they actually underestimated what the game did (laughs). I''ll spool a giant thing out for them like, "No, this was actually..." y''know? "This is a really cool thing that happened," or whatever. - [Danny] Some bug reports? - [Tarn] Yeah, yeah. We''re looking through all the new bug reports. And there are some weird ones. It looks like dogs are spoiling parleys, possibly (laughs). So that if you... you''re going to have this high-risk meeting with the goblins and maybe exchange an artefact so they''ll leave your fort if you bring a dog with you it''ll just start attacking, or whatever. (Chuckles) It''s like, it does not respect what''s going on here, ''cos the dog knows best. - [Tarn] "Crossbow bolts falling through the floor." "They don''t stockpile hair." - "Caravan got stuck loading goods." "Departure wagons get killed." - Wagons get "killed"? (laughs) It says "killed" in quotes, so something bad''s happening. Er, "tame goose refuses to lay eggs." Well... Uh-oh. "Were Iguana and Were Jackal graphics are reversed"? - Oh, yeah, I don''t know. - Mm. No, it''s easy to fix, but just another... - [Danny] Are there Were Babies? - No (laughs). No, well... I mean, there... - [Zach] Could a baby turn into...? I think a baby could turn into a Were... - A baby... Yeah. A little baby could turn into a giant Were Creature, but it''ll be an adult, but then when it''s done... And will actually, as it''s doing that thing, it will understand its environment as an adult. But then it''ll turn back into a baby. - "How do you handle a Gorlak? - [Tarn] I bet the... Had a Gorlak in a cage.." - [Tarn] The Werewolf would form memories, too. Oh god, that''s terrible, because the... When they''re in their Werewolf form they would form memories only during that time that would get saved in their long-term memories but then the baby would, like, be able to reflect only on those Werewolf moments. But they would reflect on them as if they were an adult. So they''d be trapped in this, like, weird time bubble like they were a ghost of themselves, kind of (chuckles)... This weird lunar cycle. And then suddenly, when they''re two and they''re a child in the game, suddenly that''s just all contextualized and fine, as their... (Laughter) But as their childhood. And they would think of it as "All this weird crap that happened to me when I was zero years'' old." (Laughter) But that traumatizes me for the rest of my life because those memories would all be bad. It''s like, "the time I murdered my father," or whatever, "and ate him," or whatever. And then you''d just be remembering that over and over, but... (Laughs) - [Fan] Erm, my question is: How do you resolve conflicts within yourself between the side of you that wants to make a game that''s awesome and the side of you that wants to write code that works? (Laughter) - [Tarn] Well, I mean, how many open bugs are on the tracker? - [Zach] Oh, there''s many. - [Tarn] Yeah. Apparently that conflict is just resolved... (Laughter) - [Tarn] "Cave Floater skin is made from frozen Cave Floater juice"? - (Chuckles) - What the fuck? - [Zach] Latex? - [Tarn] Oh, like latex, yeah. So maybe it''s, like, this icy... Yeah, this orange ice-cube that squirts latex at you. Just because we screwed-up some numbers. - (Chuckles) Yeah. - [Danny] Do you guys fight much? - Not anymore. We''ve had our fights, back when we were teenagers about, like... The one I remember is that gladiator game we were making were we finally had VG graphics and we were making this body with muscles, one muscle at a time. And we had a violent disagreement over whether they should be kinda, like, colour-coded, single-colour muscle groups whether they should kind of have striation on the striated muscles And stuff. Just... And we don''t even remember who was who, I think, at this point. We were just... - I remember, like, I had, er, dissected a foetal pig in science class and that''s where my idea of what the muscles should look like was. Yeah, also I think I was looking at mom''s medical books or something. Yeah. It was just, just not... - It was a violent disagreement. - It was a violent disagreement. - [Danny] How difficult is it, now, to put new... What would you even call them? Like, what do you call a "thing" that goes into Dwarf Fortress? - [Tarn] Like, we just have a checklist. There''s, like, 50 things you have to do to add a thing. Like, when we added musical forms or poetry type "things", or when we added, er, the notion of being poisoned by a rattlesnake. Like, these "syndromes". We called them syndromes. Like... - [Danny] Wait, so that''s not "being poisoned", that''s the notion of being poisoned? - Yeah. Like, like, any... ''Cos it also works when you''re, like, cursed by a Mummy and you fail more of your skill rolls. It''s like being poisoned by a rattlesnake, but it''s kind of a permanent instance of this thing that lives over you. - [Danny] Right. - In a way that can affect you. Er, but the Mummy curse... We have these on the procedural creatures... Or "procedural undead", could just be as easily, like: They point at you and you have a necrotic thing growing (chuckles) where it says: "if a rattlesnake bit you on your arm," right? And, erm, people are always entertained by that. We have, like... The Forgotten Beasts have these, like, dust clouds sometimes, or slimes on them that leave a trail. And then if you let your Dwarves'' shoes rot away and don''t replace them, then occasionally, you''ll have your Dwarves pathing through a place where one of those creatures... You vanquished this creature years ago, but there''s just a mess in your fortress. And, like... Your Dwarves will be walking around, and the stuff will transfer to their feet and then immediately you''ll have all these Dwarves in the hospital – the ones that don''t have good shoes – erm, and their feet are just rotting away. And then the doctor has to come and do, like, the surgery to, like, excise the rotten tissue. - [Danny] Like...? - Like, just saw it off. And they have to do this surgery roll which is the same as a combat roll, which is the same as a butchery... Erm... It''s all the same structures. And, er, yeah, just cut-off that chunk. A notion like that, we''d have: "Here''s the 50 places in the code to add a new concept of that kind." Of all the things, that''s something that''s worked really well over, say, the past 10 years. Like, we can introduce a new concept, introduce the player-facing side of it for modders, introduce the exposition side of it, saving and loading to the disk when your game is active. So, making sure we hit all of these things. But the thing it doesn''t get you, is how does it interplay with all of the other elements of the game? Which is something you just have to do. I mean... No one can do that for you, right? You just have to think about it. Sit down and think about it. And you''re not gonna be able to do them all. Now, we have... Let''s say we had 200 concepts in the game and we''re gonna go up to 201 concepts, you have to just accept that you''re not gonna have 200 possible connections. You''re gonna have, like, the five that you thought of. (ambient guitar music) - [Danny] Over the years, Dwarf Fortress carved out a reputation both inside the games industry, and out. While stories bled out from the Dwarf Fortress forums, gaming websites would often comment on its unique place within the industry. While both the New York Museum of Modern Art and the New York Times celebrated the game’s idiosyncratic origin story, and distinctive vision. But regardless of this attention, throughout all these years, Tarn was living incredibly frugally. Programming all day, never travelling or having much of a social life. And for much of this time the boys were giving away the game for free. That was, until one fateful day, when a fan showed Tarn how to stick a PayPal donation button on the Bay 12 website just so he could send him some money for his birthday. Over the next weeks and months, more and more players donated via this button. It was never enough for both boys to work on Dwarf Fortress full-time, but it was a massive help. But when the membership platform Patreon launched, the boys set-up their own page, allowing them a small but steady income from their patrons. At this stage it was enough for Zach to leave his convenience store job and join Tarn on the project full-time. But Tarn wasn''t getting out much. He locked himself in his apartment and focused on Dwarf Fortress. He told me how he fixed a wooden plank across the one window in his room to stop the sunlight from getting in. He slept during the day, choosing to work from 11:00 at night until 7:00 in the morning to limit distractions. And while Zach had worked many difficult jobs over the years at least he had somebody else to share the tough moments with… I think it''s about time we introduced you to the third member of this crew. She doesn’t program or make art. But her contribution to this story is ... quite significant. (acoustic guitar) - Er, so I''m Annie Forsman-Adams. I''m married to Zach Adams. So I''m Tarn''s sister-in-law. Yeah, we met online. He, just, was so genuine and he was so... He wasn''t afraid of looking silly or just... anything like that. He just wanted to be himself. He''s also pretty weird, which I really liked (chuckles) and, I think on our first date, he told me a story about, erm, celebrating Tarn''s cat''s birthday. My family''s really important to me, and he said the same thing. He''s like, "If we don''t get along with each other''s families "there just isn''t a future here." I met Tarn and it was the same thing. It was just like, here are these two, like... I think we went to the zoo. That was, like, our first "family date". Erm, I think my favorite thing about them is they are so silly. Like, they are just so silly. It''s really easy for them to just find the funniness in everyday life. And that makes life fun to live. Like, it just makes them fun to be around. It makes hard days better. It makes, erm, the tragedies of the world easier to, kind of, stomach. - [Annie] Erm, so I grew up here. I grew up in an Indigenous reservation called Suquamish, which is not far from here, where we currently are. We actually live there now. My life was pretty difficult, growing up as a kid. Erm, my parents struggled with mental health and addiction. And we had, erm, we had a lot of trauma that happened. And we also, y''know, we were constantly dealing with the generational trauma of being Indigenous people living on an Indigenous... in the Indigenous community that we had lived in forever. So my family, we can trace our ancestry back to Chief Si''ahl. We''ve lived on the reservation, unbroken. I was raised there. If we ever had children, we would raise them there. I''ve gone through dozens of years of therapy. And, y''know, they talk about the "family roles" and my role was very much the caretaker. And so I was taking care of my mom, who was chronically ill, and taking care of my dad, and just, kind of... That was my role. Erm, and then one time... one day that all just kinda stopped. My dad had been sober, my brother who also struggled with addiction got sober, and my mom had passed away. And all of a sudden, I was kind of like, "Well, what do I do now? "I don''t have a role." Zach and I met just as I had started my career and I was working as an advocate. And then he really helped me. He was really a big support in being like... "Okay, you wanna go back to school, that''s what you wanna do, let''s do it. "We''ll figure out a way to make it work." - [Danny] Annie had been part of the boys'' family for most of the development of Dwarf Fortress. She later graduated with a BA in Criminology, and has had a great career in the local justice system since – rising to Project Director for the Washington State Native American Coalition Against Domestic Violence. She was attempting to wrap-up her Master''s Degree when we conducted this interview. This also meant that, as her husband, Zach was covered by her employer''s medical insurance – while Tarn, on the other hand, was not. Annie is a good soul and, like the boys, disarmingly intelligent. In Zach, she found a rock. Somebody who made her laugh and smile, and feel safe. They made a home for themselves, and filled it with animals. Life wasn''t always peachy. Zach, like Tarn, has struggled with his own mental-health issues over the years. But, in Annie, he found somebody to advocate for him in those moments of need. But all of this was suddenly under threat, when Zach went to the doctor about something that was worrying him. - To be honest, it''s still a little bit of a fever dream. It was like... Y''know. He went in, er, he had this thing on the side of his nose and he went to the doctor. And the doctor said, "No, we need to have that checked out." And the dermatologist said, "It''s cancer." Then it was suddenly like, "Well, what the hell do we do?" Like, cancer, that''s a really scary word. We were living with his parents at the time, so we had a ton of support. We had all the support we needed. Er, he was on my health insurance. I had great health insurance. But, y''know, it still ended up... We got a bill for thousands of dollars. And then, like, he''s very prone to skin cancer and so the idea that it could come back at any time is really, really scary. And then we started thinking about Tarn. And Tarn has kinda all these same risk factors. All these same early-lifestyle things. And if that happened to him, he would be wiped out. Like, that would just wipe him out. So we really started to think... 1) About, just the importance of, like, taking care of ourselves, and getting regular checks and being able to go to the doctor regularly, and being able to keep up on all of that. And then 2) Like, what is our long-term plan here? Because, obviously this is going to be something that continues to happen and we''re gonna have to have the money to pay for it. Y''know, we didn''t know what we were gonna do. But we have this thing, we have Dwarf Fortress, which was, like, this constant in all of our lives. And so it ended up being the thing that kinda saved us all. - After investing two lifetimes of time, energy, and passion into the Dwarf Fortress project it was finally time for the game to give something back. But monetizing a buggy sim with no graphics and a hardcore fanbase who were used to playing it for free, was gonna be no easy task. On the next episode in this series we cover the development of Version 0.5 – the version of Dwarf Fortress that would be sold on Steam. Fitted with modern conveniences like graphics, sound effects and a UI you don''t need a Master''s Degree to navigate. Thanks so much for watching this episode. If you''d like to watch the third in this series, you can do so next week here on YouTube or right now, over at Patreon.com/noclip and you''ll also be helping support our small, independent team create more stories like these. (click) (ambient music) (ident clicks)'
