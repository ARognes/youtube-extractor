rent apis all talking to one and then turns out that was like exactly what major league soccer was looking for right they wanted a full stack developer who knew really how to work from the api gateway down but understood at least what was happening a little step further so i think it's uh it's also a matter of being able to talk about things and so um i always like to think about things as like drip learning like you hear about different learning styles like shallow learning which is like you know know a little bit about everything or t learning know a little bit about everything dive deep in one thing i'm a big fan of drip learning like only learn what you need to know to do like the very next step and sometimes you'll learn a little bit and sometimes you'll get down further but you have this shallow pool and some things just to kind of drip all over the place yeah and a way to achieve that a really good way to achieve that is to focus on hows or sorry on whys over house and what i mean by that is like when you hear about a new framework instead of stopping everything you do spin up a new project and start building something with it like savelle or something like that step back and say well what is the problems felt is trying to solve why was it created you know what is the difference between it and react and why would i pick it one over the other that information is way more valuable because anybody's going to be able to pick up spell and eventually learn how to use it right not everybody understands why you pick spell or why you would want this or why you pick a microservices architecture over a monolith and what are the benefits of those two things right right and so i think i you know i spent a lot of time there's something like thoughtworks has something called a technology radar uh which is a really good like quarterly newsletter where they cover all of the technologies that are like emerging uh and what they were built for and the problems that they solve an