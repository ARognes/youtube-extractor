transcript: Only 30% of people ask for raises. 70% don't. But of the 30% who do, 70% of them get something. They may not get what they wanted, but they get something. The bottom line is the math favors asking. How do you ask? The best way to ask is, number one, don't open with I want a raise because that's personal. It's selfish. It's I would like more money for the same work. And if you just step back, why would I do that as a as a company? I'm paying X dollars today. You wanting X plus N dollars tomorrow is bad for the company's bottom line. So, give me reasons. One reason you can give, of course, is high performance. Look at what I've done. The second one I often recommend is find a framing that humanizes it. The most common one, if it's true for you, is family. The fundamental thing is, how do you enlist the manager in wanting to do this? It's not, you need to give me a raise. Conversation I would like to make more money in order to better take care of my family. How can we work together so that that's an obvious case? That's the collaborative.
