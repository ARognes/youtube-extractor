التواصل البشري\n[133.2s] كإيصال فكرة, رأي, صورة\n[136.76s] من عقلٍ لآخر.\n[138.58s] يمكن أن تكون عملية حساسة\n[140.3s] تتطلب المهارات على عاتق\n[141.62s] كلاً من المرسل والمتلقي.\n[143.58s] ودائماً ما تنهار\n[145.09s] عندما يلوث أحد الأطراف الحوار\n[147.56s] من خلال إدخال عناصر مربكة.\n[150.22s] إن سوء الفهم البريئ لا بد أن يحدث في بعض الأحيان.\n[153.22s] ولكن مع الايديولوجيات المتزمتة\n[154.98s] يمكن أن تكون الحواجز التي تعترض الحوار مستديمة ومستمرة.\n[158.96s] أحياناً يمكن لمناصر عقيدة متزمتة أن يظهر\n[161.44s] بشكل سطحي للانخراط في حوار محترم مع خصمه\n[164.98s] ولكن بعد ذلك يستمر دائماً بسوء فهم\n[167.599s] موقف خصمه\n[169.09s] من خلال تحريف كلماته -بمهارة أو بدونها-\n[173.01s] في أحيان أخرى, يجري توظيف استراتيجيات أكثر عنفاً\n[175.73s] بما في ذلك حملات الافتراء والتشهير.\n[178.56s] في هذا الجو المشوّه\n[180.6s] إنه من المهم أن تبقى على المسار الصحيح.\n[184.26s] وإحدى الطرق الشائعة لتلويث الحوار\n[186.609s] هي عبر مغالطة \"رجل القش\".\n[188.629s] هنا, عوضاً عن مواجهة ما يقوله الخصم بالفعل\n[191.48s] يجري تحريف موقف الخصم\n[194.48s] ليسهل الهجوم عليه.\n[196.36s] وإحدى أشكال التحريف هي \"المبالغة\".\n[199.5s] إذا أدلى الخصم ببيان معتدل\n[202.28s] يتضمن مؤهلات دقيقة\n[204.8s] وأهملنا تلك المؤهلات\n[206.78s] ونسبنا لخصمنا وجهة نظر أكثر تطرفاً\n[209.269s] عمّا عبّر عنه فعلياً\n[210.88s] فنحن لم نواجه ما قيل\n[212.82s] بشكل صحيح.\n[214.88s] أحد الأسباب خلف مبالغات \"رجل القش\"\n[216.62s] وتكرر حدوثها في النقاشات حول الدين والسياسة\n[219.84s] هو أن الحوار الايديولوجي\n[221.54s] يجذب التطرّف, والآراء المستقطَبة.\n[224.72s] إن أتباع الايديولوجيات المتزمتة\n[226.579s] غالباً ما يعرضون تفكيراً بالأبيض والأسود\n[228.879s] هادمين بذلك النواحي المتباينة للبشرية\n[231.06s] إلى تفرع ثنائي \"إما / أو\".\n[233.54s] تتجاهل هذه التقسيمات البسيطة فارق بسيط مهم\n[237.6s] التعقيد والغموض.\n[240.38s] لذا مهما كنا دقيقين\n[242.34s] للإدلاء بتصريحات معتدلة ومعقولة\n[244.489s] لدعم جزء من حجة صحيحة\n[246.639s] فإن مبالغي \"رجل القش\" يحاولون دفعنا\n[248.79s] نحو موقف \"إما أبيض أو أسود\"\n[250.72s] ليس لمجرد تقديم \"تفسيرات صلبة\" لما نقوله فحسب\n[254.08s] ولكن لإساءة تمثيلنا كلياً.\n[256.68s] تخيل مجموعتين غالبا ما تجدان نفسيهما في تضاد.\n[260.2s] المجموعة الأولى غالباً مايتم تمثيلها بشكل سلبي\n[262.36s] في الإعلام ووسائل التواصل الاجتماعي.\n[264.14s] المجموعة الثانية غالباً مايتم تمثيلها بشكل أكثر إيجابية\n[267.44s] والآن لنفترض أن \"تريسي\" أدلت بالتصريح التالي:\n[270.98s] \"الكثير من الأشياء السلبية التي سمعتها عن المجموعة الأولى هي خاطئة\".\n[275.3s] ماذا يمكننا أن نستنتج بدقة حول موقف \"تريسي\"؟\n[278.83s] هل يمكننا أن نخلص أن \"تريسي\" توافق بدون أي نقد\n[281.29s] مع كل ما تقوله المجموعة الأولى؟\n[283.5s] كلا, بل إن استخدامها الدقيق للكلمات\n[287.04s] \"الكثير من\" عوضاً عن \"جميع\"\n[289.2s] يوحي أن لديها بعض التحفظات\n[291.46s] أو مخاوف بشأن المجموعة.\n[293.88s] هل يمكننا أن نخلص بأن\n[295.06s] \"تريسي\" توافق مع أغلب ما تقوله المجموعة الأولى؟\n[297.82s] كلا.\n[298.58s] إذا كان هنالك 50 شيئ سلبي يُقال عن المجموعة الأولى\n[301.06s] وتعتقد \"تريسي\" أن 20 منها خاطئة\n[303.4s] فهذا يترك 30 شيئ توافق على أنه سلبي.\n[307.12s] هل يمكننا أن نستنتج أي شيئ حول\n[308.66s] موقف \"تريسي\" من المجموعة الثانية؟\n[311.3s] كلا. هي لم تقل أي شيئ يخص المجموعة الثانية.\n[313.94s] \"تريسي\" لم تعلن تحالفها\n[315.94s] أو معارضتها لأي مجموعة\n[318.0s] ولكن فقط أدلت بملاحظة معتدلة\n[320.52s] أن عددً من الأشياء التي تُقال عن المجموعة الأولى هي خاطئة.\n[324.2s] إن محاولة جذب الخصوم للدفاع\n[326.38s] عن مواقف أكثر تطرفاً مما لديهم فعلياً\n[328.8s] هو تكتيك مشهور وغير نزيه في النقاش.\n[331.74s] إنه من الجيد التعرّف على هذا التكتيك عندما نواجهه.\n[335.64s] تدوير خفيف لمغالطة رجل القش يحدث\n[338.14s] عندما يحاول خصمنا جذبنا\n[339.95s] للدفاع عن عضو آخر في مجموعتنا\n[342.1s] قد تختلف أفكارهم عن أفكارنا.\n[344.72s] قد يُواجه الملحد\n[346.49s] بما قد يظهر أنه اقتباس أو اقتباس مزيف\n[349.56s] من ملحدين مشهورين حيث يُتوقع أن يدافع عنهم\n[352.56s] وكأنهم كلمات الملحد ذاته.\n[355.28s] هذه المحاولة لتحميلنا عبئ حجج\n[356.98s] شخص آخر, ترفض تباين وتنوع مجموعتنا\n[360.31s] باعتقادٍ مسبق أننا جميعاً نحمل نفس المعتقدات.\n[362.63s] هذا نوع من أنواع التثليث\n[364.87s] محاولة سحب طرف ثالث إلى نزاع\n[367.06s] هو حقيقةً بين طرفين فقط.\n[372.6s] كان البشر على دراية بالآثار المحتملة لتلوث\n[374.94s] العواطف الجدال لآلاف السنين.\n[378.27s] كتب في القرن الرابع قبل الميلاد\n[380.64s] أشار \"أرسطو\" في أطروحته حول \"البلاغة\":\n[384.0s] \"\"إثارة التحيز والشفقة والغضب والعواطف المماثلة..\"\n[388.12s] \"لا علاقة له بالحقائق الأساسية..\"\n[390.45s] \"ولكنه مجرد نداء شخصي\"\n[393.16s] كما قال: \"إنه ليس من الصواب تضليل القاضي..\"\n[395.95s] \"من خلال إثارة غضبه أو حسده أو شفقته..\"\n[399.09s] \"كمن يلوي مسطرة النجار قبل استخدامها.\"\n[402.381s] على الحجة أن تصمد\n[404.54s] سواءً قُدمت مع أو بدون عواطف\n[407.36s] وهذا ينطبق ليس فقط على التعابير الجسدية للعاطفة\n[410.08s] ولكن على اللغة المشحونة عاطفياً أيضاً.\n[412.72s] إذا جردنا العواطف من أداء الخطيب\n[415.52s] ووجدنا أنه لايوجد حجة\n[417.8s] عندئذ لدينا حالة من المظاهر, بدون مضمون.\n[420.98s] قد نجد على سبيل المثال أن \"الحجة\" المفترضة\n[423.82s] تتألف من لاشيئ سوى الابتزاز العاطفي.\n[427.28s] عند مناقشة المواضيع التي جمّعت بالفعل\n[429.33s] الكثير من الأعباء العاطفية\n[431.07s] من السهل للغاية الانزلاق بعيداً عن الحقائق\n[433.86s] وإلى عاطفة مشتِتة ومضرة.\n[437.86s] ولهذا السبب, عند مناقشة هذه المواضيع\n[440.36s] قد يكون من المفيد بشكل خاص أن تكون متيقظاً بشأن المحتوى العاطفي.\n[447.2s] أحياناً, يوصف الأشخاص بأنهم \"العدو\"\n[450.0s] لأنهم يدافعون عن حقوق جميع البشر\n[451.68s] بمن فيهم أولئك \"الأعداء\" الفعليون.\n[454.06s] المحامون اليهوديون الذي دافعوا عن الحقوق الانسانية\n[455.82s] لموكليهم المعادين للساميّة, تم وصفهم\n[458.26s] بالمنافقين, والمباعين, وحتى بالفاشيين.\n[461.97s] أحياناً, يُدانون الناس\n[463.9s] لأنهم انخرطوا في حوار مع \"العدو\" المُتصوَر\n[466.9s] المسلم العلماني الليبرالي \"ماجد نواز\"\n[469.25s] الذي شارك بتأليف كتاب حول الإسلام مع الملحد \"سام هاريس\"\n[472.84s] وصفه المُرقِّعون الإسلاميون\n[475.27s] بأنه \"المناصر المسلم لـ هاريس\"\n[477.57s] \"كلبه المدلل\", \"قرده الأنيق الناطق\"\n[480.98s] و\"قرده الكسول\".\n[483.02s] كانت هذه محاولات واضحة لإبطال آرائه\n[485.82s] من خلال تصويره كدمية غير إنسانية\n[488.56s] عوضاً عن مفكر مستقل.\n[491.06s] في بعض الأحيان، يتم الترويج للتجريد من العضوية بالعنف\n[495.56s] في تغريدة مصورة لا تُنسى\n[497.42s] الناشطة الإسلامية والمؤسِسة الشريكة\n[499.14s] لـ \"مسيرة النساء في واشنطن\"\n[501.08s] \"ليندا صرصور\" صرّحت أنها تمنت\n[503.78s] لو استطاعت أخذ \"مهابل\"\n[505.5s] المسلمة السابقة \"أيان هيرسي علي\"\n[508.15s] وناقدة الاسلام \"بريجيت غابرييل\"\n[511.1s] لأن \"ليندا صرصور\" قررت أنهن لا يستحقن أن يكونوا نساءً\n[515.4s] \"صرصور\" تعترف بمخاوف حول حقوق المرأة\n[518.38s] ولكنها تقترح التشويه الجسدي\n[520.42s] للنساء اللواتي يخالفنها.\n[522.96s] في أي مجموعة واسعة, سواء كانت على أساس\n[525.7s] لون البشرة, الدين, الجنسانية\n[529.07s] الآراء السياسية, الجنس, وإلى آخره..\n[532.12s] سنجد أعضاءً من كل مجموعة\n[534.92s] عدا تلك المستبعدة في طبيعتها\n[537.78s] في مجموعة \"الرجال\"\n[539.0s] سنجد أناساً من مختلف ألوان البشرة\n[540.82s] الأديان, الجنسانيات, والآراء السياسية.\n[544.22s] في مجموعة \"اليهود\"\n[545.56s] سنجد أناساً من مختلف ألوان البشرة\n[547.44s] الجنسانيات, والآراء السياسية, والجنس, والطوائف اليهودية.\n[553.08s] عندما يبدأ دعاة حقوق الانسان\n[555.4s] بتحديد نطاق هذه المجموعات الواسعة\n[558.28s] على سبيل المثال, القول بأن جنسنا أو لون بشرتنا\n[561.02s] يجب أن يملي علينا معتقداتنا\n[562.42s] إذاً, فحقوقنا الإنسانية لا يجري الدفاع عنها\n[564.52s] بل تتآكل.\n[566.62s] قد يُقال للمجموعات الديموغرافية الواسعة\n[569.069s] من قبل الايديولوجيات المتزمتة, من يجب عليهم أن يحبوا\n[571.129s] لمن يجب عليهم أن يصوتوا\n[572.41s] من يجب عليهم أن يكرهوا\n[574.2s] عندما يخطو أعضاءً من المجموعة\n[575.26s] خارج الحدود الايديولوجية الضيقة\n[578.08s] من خلال انتقاد تلك الحدود\n[580.32s] من خلال دعم حقوق أولئك الذ��ن يُتوقع منهم أن يبغضوهم\n[583.92s] من خلال التصويت للحزب \"الخاطئ\"\n[585.94s] من خلال حب الناس \"الخطأ\"\n[587.84s] فغالباً مايتم إظهارهم\n[589.44s] بأن لديهم مشاكل نفسية\n[591.78s] وقد يوصفون بأنهم \"تالفين\" أو \"كارهين لأنفسهم\"\n[595.7s] هنا, ثنائية الأبيض والأسود هي \"السليم\" و\"المريض\"\n[600.34s] هؤلاء الذي لديهم نفس الآراء فهم \"صحيّون\"\n[603.28s] وهؤلاء الذي يختلفون من المؤكد أنهم \"مريضون\"\n[605.78s] إن كانت آراء الناقدين والمنشقين\n[607.8s] يُمكن أن تمثل -دون وجه حق-\n[609.85s] على أنها نتاج مشاكل عقلية\n[611.54s] فيمكن فصلهم دون فحص.\n[614.46s] تلميحات المرض تشبه\n[616.379s] تلميحات التحيّز اللاواعي\n[618.67s] في أنه لايوجد عادةً تقييم نفسي دقيق\n[621.44s] يسبق التشخيص\n[623.06s] ولا يتم تقديم أي دليل لإثباتهم.\n[626.22s] بدلاً من ذلك, يتم استخدام مغالطة \"الاستدلال الدائري\":\n[629.92s] \"الناس مريضون لأنهم يعتقدون بـ س\"\n[632.72s] \"الناس يعتقدون بـ س لأنهم مريضون\"\n[638.92s] أحياناً, يُدان بعض الأشخاص\n[640.839s] ليس لإجرائهم حوار متحضّر مع \"الأعداء\" ذاتهم\n[643.86s] ولكن ببساطة بسبب التحدث بشكل إيجابي\n[645.84s] - أو عدم التحدث بشكل سلبي-\n[647.74s] عن شخص آخر كان قد أجرى\n[649.04s] حوار متحضّر مع \"العدو\".\n[650.72s] حيث سلسلة الارتباطات\n[652.32s] تتوسع أكثر فأكثر\n[654.84s] الطريق إلى العدو يصبح\n[656.26s] معقداً أكثر فأكثر.\n[658.38s] هذا الميل للتنديد بالأحزاب المعتدلة والحيادية\n[661.459s] كأنها \"عدو\", قد يبدو غير مثمر\n[664.17s] على المستوى الظاهري.\n[665.78s] حتماً إنه ليس من الجيد لقضيتك\n[667.52s] إن كنت تدين وتنبذ الناس باستمرار.\n[670.9s] ولكن العائد يوجد في مستوى آخر.\n[673.36s] تزدهر بعض المجموعات المتزمتة أيديولوجياً في عقلية الحصار\n[677.5s] الاعتقاد بأنهم محاصرون\n[679.06s] ومُهاجمون ومضطهدون من قبل الأعداء.\n[681.98s] الحفاظ على عقلية الحصار هذه\n[683.86s] يتطلب مؤن مستمرة من الأعداء\n[685.92s] لكي تستطيع المجموعة الإشارة إلى تهديد كبير.\n[689.4s] \"صائدوا الساحرات\" يحتاجون مؤونة من الساحرات.\n[692.76s] في بعض الأحيان, يتم لعن الأشخاص بالارتباط\n[695.9s] حتى عندما يفصلون أنفسهم باستمرار بينهم وبين \"الأعداء\"\n[699.44s] تم الحكم على بعض ناقدي الإسلام\n[701.839s] ليس لأن انتقاداتهم غير صحيحة\n[704.22s] ولكن لأنه يُزعم أن انتقاداتهم\n[705.99s] توفر ذخيرة للمتطرفين المعادين للمسلمين.\n[710.28s] حتى عندما يكونون صريحين علناً أنهم ضد العنف\n[713.399s] يُدان الناقدين على أنهم \"سبب تمكين التطرف\"\n[716.97s] أو حتى كمتطرفين أنفسهم.\n[719.94s] والنتيجة أن جميع النقد يُدان\n[722.6s] سواءً كان زائفاً أو صحيحاً.\n[725.08s] عندما تجعل الإيديولوجيات الأفكار الخاطئة غير قابلة للمس\n[728.74s] وحتى مقدسة, فإنهم يضمنون استمرار الصراع البشري\n[732.8s] لأن المفكرين الناقدين ملزمون\n[734.46s] بمواصلة الإشارة لتلك الأخطاء\n[736.8s] جيلاً بعد جيل.\n[742.34s] ربما واحدة من أكثر التنوعات الغريبة\n[744.68s] حول موضوع \"الذنب\" عبر الارتباط\n[747.22s] هو مفهوم \"الذنب الوراثي\".\n[749.4s] هذه الفكرة التي يشاركها الناس أنه -بطريقة ما-\n[751.62s] إن الجرم الأخلاقي لأفعال أسلافهم\n[754.38s] له جذور قوية في بعض الأديان.\n[756.74s] في الإنجيل\n[757.64s] مفهوم الذنب الوراثي يظهر بشكل متكرر.\n[760.36s] كتابا الخروج والتثنية\n[762.7s] ينصان بصراحة على أن الإله اليهودي \"يهوه\"\n[766.04s] سيعاقب الأطفال لذنوب أهلهم\n[769.2s] التعليم المسيحي للكنيسة الكاثوليكية\n[771.22s] يصرح بـ \"حقيقة\" أن آدم\n[773.24s] نقل اثماً إلينا\n[774.88s] معه وُلدنا جميعاً مبتلون.\n[776.94s] بالإضافة إلى\n[777.76s] أنه اثمٌ مستجلب وليس مرتكب.\n[781.2s] تظهر هذه الأفكار ارتباك أخلاقي عميق\n[783.76s] ونقص التفكير النقدي.\n[785.86s] إذا ارتكبت \"جوان\" تعدياً أخلاقياً\n[788.48s] فلن تتمكن من تمرير ذنبها وراثياً\n[790.74s] أكثر مما يمكنها أن تجعله يُغفر من صلب قديم.\n[794.2s] المسؤولية الأخلاقية تقع على عاتقها\n[796.72s] وإذا كانت تتوق إلى المغفرة\n[798.52s] فالأشخاص الوحيدون الذين يمكنهم إعطاؤها لها\n[800.14s] هم الذين آذتهم.\n[801.84s] نحن لا \"نستجلب\" الخطيئة\n[803.74s] وفعل \"الولادة\" لا ينقل الذنب\n[806.08s] من الآباء إلى أطفالهم\n[808.84s] لا زال على المواليد الجدد تنمية حس أخلاقي.\n[811.96s] كل فرد يدخل العالم بدون تاريخ أخلاقي.\n[815.46s] ومحاولة  إلقاء عبئ على أي شخص\n[816.74s] بتاريخ أسلافهم\n[818.52s] متضمناً الذنب بسبب مخالفاتهم الأخلاقية\n[820.78s] هو تعيين لوم خاطئ\n[822.92s] وهو أمر لاأخلاقي بحد ذاته.\n[825.1s] ومع ذلك فإن الذنب الوراثي هو مفهوم\n[827.5s] لا يُرى فقط بالدين, بل يُرى في ايديولوجيات اخرى\n[831.08s] ملوثاً النقاش في وسائل التواصل الاجتماعي\n[833.08s] وحتى الأكاديمي.\n[835.16s] كما أننا لانملك سيطرة على أفعال أسلافنا\n[838.16s] فنحن أيضاً لانملك سيطرة على سماتنا الشخصية\n[841.16s] مثل لون البشرة أو الجنس.\n[843.56s] ومع ذلك هنا أيضاً\n[845.559s] يوجد أناس يلوثون النقاش\n[847.199s] بمحاولة إنشاء \"ذنب جماعي\"\n[849.619s] على أسس تلك الخصائص\n[851.769s] ساعين لوصم الآراء\n[853.829s] الوضع, والمشاركة الاجتماعية\n[856.23s] لديموغرافيات بأكلمها من الناس.\n[858.94s] هذا النوع من الأخلاق القبلية\n[860.66s] هو غير عقلاني في أساسه\n[863.34s] يتعارض مباشرة مع مبدأ\n[864.98s] المسؤولية الأخلاقية الشخصية.\n[867.7s] عندما يتم شيطنة مجموعات كاملة من الناس\n[869.84s] استناداً على لون بشرتهم أو جنسهم\n[871.82s] لدينا كلمات تصف هذا\n[873.1s] في أي اتجاه يتم توجيه الشيطنة. (عنصرية العرق وعنصرية الجنس)\n[876.52s] أفعال أسلافنا, وجنسنا ولون بشرتنا\n[880.64s] لا يجعلونا ملامون أخلاقياً\n[883.04s] أو متفوقون أخلاقياً.\n[885.38s] هم لا يحقرون ولا يرفعون من قيمة\n[887.3s] آراءنا, حقوقنا, أو إسهاماتنا.\n[891.72s] إن الأحكام المسبقة والتحيزات موجودة\n[893.88s] في التعاملات اليومية\n[895.76s] ومن الجيد الإحتراز منهم.\n[897.779s] لكنهم غالباً ما يُروا في شكلٍ مضخم\n[900.42s] داخل الايديولوجيات المتزمتة كنتيجة طبيعية\n[904.06s] من التفكير \"الأبيض أو الأسود\" غير المرن.\n[906.96s] فارق بسيط يتم تجاهله\n[908.46s] مع أي مفهوم لايناسب الايديولوجية.\n[911.58s] بعض الايديولوجيات تذهب بعيداً\n[913.2s] إلى حد استبعاد قيمة العقل\n[915.52s] أو تدّعي أنه \"لايوجد حقيقة\".\n[918.18s] مع التخلص من الحقيقة والعقل\n[920.16s] كيف يمكن للخصوم أن يوجهوا انتقادات فعّالة؟\n[923.54s] لكن بالطبع مثل هذه التكتيكات\n[925.54s] هي أهداف فلسفية في نهاية المطاف.\n[928.12s] إن لم تكن هناك حقيقة\n[929.74s] إذاً فتصريح أنه لايوجد حقيقة\n[931.42s] لايمكن أن يكون صحيحاً.\n[932.76s] إنه يدحض نفسه.\n[934.62s] وبشكل مساوٍ, إن لم يكن للعقل قيمة\n[937.149s] إذاً أي أسباب تُعطى لتبرير الايديولوجية\n[940.35s] ليس لها قيمة.\n[941.84s] الايديولوجيات التي تذهب لأبعاد متطرفة\n[943.86s] في استبعاد الحقيقة والعقل\n[945.72s] لا تترك لنفسها أي أدوات\n[947.44s] للمحاججة الأساسية\n[951.96s] استعادة الفارق البسيط والتعقيد\n[954.569s] الذي يمحيه تفكير \"إما أبيض أو أسود\"\n[956.28s] يعطينا نظرة أكثر استدارة ودقّة على للواقع.\n[960.14s] بعض معارضي الحجاب\n[961.88s] يقولون أن جميع النساء مُكرهون على ارتدائه.\n[965.04s] بعض أنصار الحجاب يحاججون\n[966.92s] أن النساء أحرار تماماً في الاختيار\n[968.88s] ويرتدونه بسبب تفضيلهم الشخصي.\n[971.639s] الواقع أن هنالك العديد من الأسباب\n[973.98s] التي قد تجعل شخصاً معيناً يرتدي الحجاب.\n[976.74s] البعض يرتدونه بسبب تفضيلهم الشخصي.\n[979.48s] والبعض مُكرهون.\n[981.68s] والبعض مُكرهون ولكن يقولون للناس\n[983.92s] أنهم يرتدونه بسبب تفضيلهم الشخصي.\n[986.36s] والبعض يرتدونه ببساطة لإرضاء\n[987.74s] بعض الأشخاص - مثل الأهل.\n[990.44s] وللبعض الآخر, فعدم ارتداء الحجاب\n[992.26s] بكل بساطة لم يخطر ببالهم كاختيار ممكن.\n[994.82s] عندما نعترف بالتعقيدات\n[996.5s] التي أنكرناها سابقاً\n[998.02s] يستطيع الناس رؤية مجال أوسع\n[999.44s] يعكس تجاربهم الخاصة.\n[1002.42s] استعادة الفارق البسيط والتعقيد\n[1004.4s] يقلل من لاعقلانية الاستقطاب.\n[1007.38s] شعور: \"أنت إما معنا أو ضدنا\"\n[1010.02s] قد يكون مناسباً في مسألة ما\n[1011.999s] حيث يوجد فقط إجابتان.\n[1014.48s] هنا, من المتخيل أن الناس\n[1016.14s] يمكن تقسيمهم إلى \"مؤيد\" و\"معارض\"\n[1018.98s] ولكن هذا الشعور يُعبر عنه بتكرار\n[1021.04s] من قبل مجموعات تقترح خليطاً من الأفكار\n[1023.48s] الجيدة والسيئة\n[1025.16s] والتي حتماً ستنتج طيف من الإجابات في نهاية المطاف\n[1028.1s] من التأييد الشديد إلى المعارضة الشديدة\n[1031.2s] مع الكثير من التدرجات بينهم.\n[1033.12s] يميل المفكرون الناقدون إلى مقاومة\n[1035.3s] تحويلهم إلى قطيع \"إما أبيض أو أسود\"\n[1037.48s] الذي يفشل في الحفاظ على التفاصيل الدقيقة لوجهات نظرهم.\n[1041.58s] الايديولوجيات المتزمتة التي تملك عقلية \"إما معنا أو ضدنا\"\n[1045.3s] تحجز عدائية خاصة للمرتدين\n[1047.6s] - الأعضاء السابقين الذي اختبروا\n[1049.8s] الايديولوجية من الداخل.\n[1052.46s] من أساليب التشكيك الشائعة هي الإدعاء\n[1055.1s] أنهم لم يكونوا قط أعضاءً حقيقيين من المجموعة.\n[1057.649s] أو حتى ربما أنهم كانوا دجالون منذ البداية\n[1060.3s] يعملون كجواسيس.\n[1062.52s] \"الساينتولوجي\" مشهورة بحملات التشهير\n[1065.38s] ضد أعضائها السابقين.\n[1067.3s] الإسلام يحكم على الأعضاء السابقين بالموت.\n[1070.92s] بعض الايديولوجيات لاتلوث الحوار فحسب\n[1073.64s] - بل تحاول قتله.\n[1078.18s] هل ستدوم الايديولوجيات المتزمتة؟\n[1081.06s] \"جورج جان ناثان\" و \"هـ.لـ. مينكين\"\n[1083.44s] يميلان للاعتقاد أنها ستدوم.\n[1084.96s] في كتابهم \"العقيدة الأمريكية\"\n[1087.26s] يقترحون وجود دورة متكررة\n[1090.14s] يبدأ فيها الناس المتحدون ذات مرة\n[1091.96s] من خلال الشعور المشترك بالحرية\n[1093.64s] بالتجمع في قبائل فردية\n[1096.24s] التي يجمع كل منها أوهامه الخاصة\n[1098.68s] حتى ظهور القبائل المستبدة\n[1100.78s] التي يجب الإطاحة بها.\n[1102.76s] \"ناثان\" و\"مينكين\" كتبا:\n[1104.5s] \"يخرج رأس الملك..\"\n[1106.02s] \"والطغيان يفسح المجال للحرية..\"\n[1108.5s] \"ثم شيئاً فشيئاً, يشتد عود وجه الحرية..\"\n[1112.61s] \"وبهذا يصبح الوجه القديم للاستبداد.\"\n[1116.44s] وهكذا تستمر الدائرة.\n[1118.94s] فمن المنطقي أن الايديولوجيات المتزمتة\n[1121.18s] ستستمر بالظهور.\n[1122.6s] فبالنهاية, هي نتاج\n[1124.36s] عمليات نفسية طبيعية للغاية.\n[1127.07s] تولد عقولنا باستمرار\n[1129.07s] نظريات برّاقة معادية للتجربة العلمية\n[1131.34s] والمفاهيم القابلة للدحض.\n[1134.04s] وكباحثين عن الأنماط\n[1135.46s] نرسم بشكل طبيعي الارتباطات\n[1137.02s] والعلاقات بين الظواهر\n[1139.2s] - ولكن أحياناً ننسى\n[1140.54s] عوامل تفسيرية باطنية هامة.\n[1143.92s] عندما يبدو أن نظرياتنا تعمل لصالحنا\n[1145.9s] نجد أحياناً صعوبة\n[1147.1s] بالتعرّف على الأمثلة المضادة التي لا تناسبها.\n[1150.08s] ونقوم دائماً بإسناد الصفات\n[1152.18s] حول دوافع الناس.\n[1154.04s] كبشر خطائين، من الطبيعي أن نرتكب الأخطاء.\n[1158.14s] لكن في سبيل التعرف على أخطائنا\n[1160.64s] علينا أن نكون منفتحين على الانتقاد والمعارضة.\n[1164.28s] تنساق الايديولوجيات المتزمتة خارج المسار\n[1166.58s] لأن عدم تحملهم للنقد والمعارضة\n[1169.14s] يعني أنهم يعاملون أخطائهم كمعطيات يمكن الاعتماد عليها.\n[1173.3s] إذا كانت الايديولوجيات المتزمتة ستبقى, ماذا إذاً؟\n[1177.14s] العلامة على صحة الكائن الحي\n[1179.28s] ليس غياب وجود مسببات الأمراض بداخله\n[1181.9s] لكن وجود مسببات الأمراض\n[1183.389s] - التي تظهر أن هذا الكائن الحي\n[1185.35s] قد طوّر مناعة.\n[1187.62s] بدلاً من الرغبة في غياب الأيديولوجيات المتزمتة\n[1190.4s] يمكننا أن نفعل ما بوسعنا لنطور مناعتنا تجاهها.\n[1193.46s] للقيام بذلك, نحن بحاجة تعلم\n[1195.17s] كيفية التعرف عليها وفهمها.\n[1198.32s] بسبب عدم تحملهم للنقد والمعارضة\n[1201.24s] إن أنصار الايديولوجيات المتزمتة\n[1203.16s] يمكن أن يكون لديهم مشاكل جمّة في الانخراط\n[1205.24s] في حوار مع أي شخص يملك رأياً مختلفاً.\n[1208.22s] حتى النقاد الأكثر عقلانيةً وصبراً وحياديةً\n[1211.48s] يمكن أن يتعرضوا للافتراء والتجريد من الانسانية\n[1213.98s] دون أي تردد من قبل الايديولوجيات\n[1216.38s] التي لاتظهر أي مراعاة للمواقف المعتدلة.\n[1219.12s] هذا الاستبعاد الاعتيادي اللاإرادي للنقد المدروس\n[1222.88s] له أثر تدميري عميق على أي تواصل\n[1225.7s] ويعزز الميول القبلية.\n[1229.06s] عندما يكون التواصل ضعيفاً بالفعل ومعرضاً للتشويه\n[1231.789s] بسبب العدائية و/أو عدم الاتفاق\n[1234.26s] من المهم أن تكون واضحاً\n[1236.46s] حول مايقوله أي طرف\n[1238.12s] وتوضيح الطبيعة الدقيقة لأي خلاف.\n[1242.94s] إننا ركزنا على أمثلة حول كيف أن الآراء\n[1245.14s] والقيم في الايديولوجيات الدوغمائية (المتزمتة) تحرف مسار الحوار.\n[1248.78s] لكن علينا تجنب فخ\n[1250.24s] معاملة جميع أعضاء الايديولوجيات المتزمتة\n[1252.98s] بنفس عقلية \"إما أبيض أو أسود\"\n[1254.6s] التي قد نُعامل بها من قبل بعضهم.\n[1256.78s] داخل مجموعات الايديولوجيات المتزمتة,\n[1259.18s] يمكن أن يوجد مجال من التقبل.\n[1262.0s] يمكن أن يكون هنالك\n[1263.02s] من ابتلع الايديولوجية بأكملها;\n[1265.3s] وأولئك الذين قد يؤمنون أو لا يؤمنون بالإيديولوجية\n[1267.78s] ولكن يستغلونها لكسب سلطة شخصية.\n[1270.64s] وأولئك من تم إغراؤهم\n[1272.149s] بالمبادئ التي تبدو إيجابية\n[1273.82s] ولكن عليهم اكتشاف\n[1274.96s] التشوهات الباطنية للايديولوجية\n[1277.58s] تتركهم في حيرة من النقاد.\n[1281.36s] قد يكون هناك من رأوا بعض الشقوق\n[1283.58s] وبدأوا بالتشكيك;\n[1285.64s] أولئك الذين لديهم شكوك وتحفظات جدية;\n[1288.86s] وحتى أولئك الذين -وبشكل خاص- رفضوا الايديولوجية\n[1292.04s] ولكنهم يحافظون على صمتهم لأسباب مختلفة\n[1294.46s] - على سبيل المثال, بسبب الخوف من الرفض أو التصعيد\n[1298.56s] أو بسبب ولائهم لأحبتهم.\n[1301.66s] هذا المجال من التقبّل يشير\n[1303.72s] إلى أن بعضاً من الحوار المثمر يمكن أن يتحقق.\n[1307.1s] عندما نتواصل مع أفراد\n[1308.72s] منفتحون حقاً للنقاش\n[1310.84s] عندها قد يكون لدينا تبادلات مثمرة.\n[1313.18s] لكن يجب أن نكون مستعدين\n[1314.22s] لحقيقة أن الايديولوجيات المتزمتة\n[1316.54s] بطبيتعها التي ترفض تقديم التنازلات\n[1318.92s] ستميل إلى جذب ورعاية الأنصار\n[1321.34s] الذين يصدّون عن النقاش بدلاً من الترحيب به.\n[1324.92s] عندما نواجه هؤلاء الأشخاص\n[1326.96s] من المفيد أن نفهم لم يبدون\n[1328.58s] مصريّن جداً على سوء فهمنا\n[1330.84s] ويحاولون إبعادنا عن مسار الحديث.\n[1333.48s] من المفيد أن نفهم\n[1335.02s] كيف يلوّث التّزمت الحوار."}'
