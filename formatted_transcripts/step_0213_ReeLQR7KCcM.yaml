ing memory issues or commits on popular open source libraries in other words how do you show you have more value than just another UI engineer that you are one of those Engineers that everyone wants to hire an engineer that is curious and the third thing I want to tell you is be prepared for tomorrow I see a lot of people who are just running a life of minimaxing right they do what they minimally can at a job so they can maximize what they get out of it and that's that that's all they want to do but the reality is those that are pricked by curiosity that are driven by determination those that are researching new ways to solve problems keeping up with what is changing those are the ones that are going to weather this storm significantly better because the reality is the people that are in positions that you want to work in that are working on Tech that you want to work in it's almost never by accident it is the sum of small decisions over time so ask yourself what language is going to be popular for the next 10 years what tech is going to make you really hirable over the next few years or just learn something you want to work in someday day if you have the time if you're interested in compilers become great at them and just a little bonus piece of advice interviewing is a skill practice it experience is what people hire for earn it be the developer that you want to work with you know we've all had that developer that when you ask them questions they just know so many things they are ex making you excited about tech they have just this passion this desire and they give you great advice you can be that person too thanks for watching this I think YouTube wants you to subscribe and YouTube also has a video of mine that they think you're going to like okay they're a really impressive Ai and they they just they know so just click it made by me just for you the name is the primagen
