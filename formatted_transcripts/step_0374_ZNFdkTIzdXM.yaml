s mutable because it's behind an immutable reference meaning that if I were to erase this make this immutable I would then then be able to actually mutate in place Fu reverse mutate that then iter then go down to the bottom and mute mute and of course you also have to declare the variable as mutable itself now what this has done is it's clearly told you what's going to happen reverse and print will mutate your vector to be reversed and to be printed whereas with this example it's not necessarily clear nor unless if you have experience with reverse is it obvious so this is what is making people so excited about rust I know some of you saw that and thought oh gosh I would never want to do that but at the same time you do have to admit the fact that you can know when something gets mutated and doesn't get mutated does just completely cross off an entire set of bugs and the reality is that immutability used everywhere often can slow down a system you can see chunks while scrolling you can feel these garbage collection bad moments happening especially on something like mobile so it's not always the answer just to make a cop of everything so hopefully this helps you really understand the borrow Checker in a more complete way thank you so much for watching again please like the video hit the Subscribe button and take the chance to you know try out rust Advent of code is happening right now at the end of the 2022 it's amazing a really great problems for rust the name is the primagen
