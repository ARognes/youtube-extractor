ou continue to make content um or art or whatever it is you're doing, that gap slowly like closes. I don't like I've been making videos for four years, you've been doing it for five. I I still can't do the type of video that I want to do. And so, you know, I think there is a there's a sort of challenge that's there where it's like, okay, well, it's actually kind of fun to be a beginner again and to learn about some stuff. And so, we all have these seasons when it comes to creating content. Sometimes it's like really easy and sometimes you put yourself on a crazy schedule and it's like the last thing that you want to do. Um, and so, you know, I think just like really understanding why you want to do this stuff and then making sure that it's valuable and there's some stuff that you want to say that you're going to say. Um, that's the stuff that sort of like allows me to continue to make content over the like last four years and hopefully, you know, we can get to like 10 or 20 years. I would just like to make content for the rest of my life. >> So, do you see yourself more as a creator or a business person? That's a it's a it's a good question. I think ultimately so we had talked about it before. I was a creative writing major. I see myself as a content person. I won't say creator uh because you can also create a business like ultimately like you want to I think I have some things to say right and I would like to say them. Um and I think that's my business now is saying those things. Um, at the end of the day though, like you need to leverage that and and turn it into something where you can make a living and and make some money off of it. And so it's just like that video editing or like creating a YouTuber thing. It's like I didn't know anything about business other than like being able to read, you know, like a like a quarterly report like at Amazon, like a corporate quarterly report. I knew how to read one of those, but I didn't know anything about running a business. Um, and so that was good. It was just like, cool, there's another thing, another set of things to learn and be a beginner at. >> Yeah. When I talk to a lot of creators and entrepreneurs, I've noticed that there is a bit of a spectrum where it goes all the way on the left is that pure artistic creator and then all the way on the right is just the, you know, literally the the faceless business just producing corporate content, right? Just to drive leads. And I've noticed that wherever someone lies on that spectrum, usually what they're not doing is is going to actually take them to the next level. So for me, as soon as I I think it was about a couple years ago when I really actually realized that I was a business, I don't think I actually realized I was a business, you know, more than two years ago, I just thought, hey, I'm I'm a YouTuber, I'm a creator, I'm making all this content in different areas, I'm giving life advice, I'm also vlogging, I'm doing all these different things. But as soon as I niched down and just launched an offer and, you know, went all down the business route, everything exploded. And I know a lot of creators who are lifestyle creators who, you know, they're a bit like reluctant to go down the business route. They're reluctant to launch an offer to sell a product. And that would actually change their life if they got over that and literally just understood sales, marketing, and offer creation. Literally ran a business. Similarly, there's a lot of business creators out there who are really struggling with like or a lot of business people out there who are struggling with I want more eyeballs. I want more lead yet jet. I have no clue how to do any of this organic content. >> I would love to have a YouTube channel with 65,000 subscribers but then you know coming from the wrong place. >> Yeah. Yeah. Absolutely. So they would benefit more from understanding just the creative side of things. And you see like the the people who own businesses who a