e I'm around the same age as you." >> I was like, "What? You're 30?" I thought you were 50. >> So just abuse shows up over time. >> Yeah. you know, I I uh I had some like carpal tunnel ulner stuff, you know, in my 30s, and it was just cuz I just I didn't care about ergonomics. You know, I was like an otter, you know, do like this or like my keyboard was up here. And it's that stuff over time that accumulates. You know, if you eat bad, it doesn't matter in your 20s, but then it catches up to you and it accumulates in your 30s and 40s and beyond that. But also, you know, I've really prioritized health recently because, you know, there's just unhealthy people around me. Like, you know, my mother-in-law is like disabled. My mom like has mobility issues now, like health issues with my kids. My dog has like a tumor. And so, like I have to go and do all of that stuff. and and like how can I like learn to be grateful about the body that I have without like having a health incident, right? Can you learn a lesson through somebody else? Like that's the that's the cheapest way to learn a lesson. I don't want to like ruin my body and then have to get myself out of a hole. Uh and like only because something has happened, you know, am I actually grateful for what I have, right? And so I'm just always trying to to to see if I can't learn a lesson when bad things happen to other people within my life, you know. But at, you know, at the end of the day, like I have to work out at night, which is not optimal for me, you know? So like, you know, 10 10 at night, I'm like trying to lift heavy weights and like I'm just done with the day. And so, but I I know I have to do it because, you know, I think ultimately if you're watching this podcast, um, you've won the Galactic Lottery. you know, you're alive, you're a human, you speak English, you understand what I'm saying right now. Um, you're thinking about launching a business or you're in tech. Um, like life's good. Like, like AI is around and like like it's never just been a better time to to launch a business, you know, and so you you want to hold on to that, you know, at the end of the day. I I really think that, you know, um if you're a if you're a somebody with some amount of experience and thinking about starting a business, the the internet has not yet unfolded completely. People aren't going to go to college and and learn a vocation. And you know, my mom worked at Boeing for like a long time. There are these Boeing lifers. They just, you know, they just started at one company and they worked there for their entire life. Like that's not the world that we're going to live in. What's going to happen is you're gonna find somebody that you resonate with if you're young online. You're going to be like, "That guy lives a life that I would like." Um, and you're going to be like, "Well, how can I be like that person?" And all you have to do is have an offer that's just like, "Hey, I'll teach you how to have my life, and you know, we'll just do a bunch of shortcuts. You don't have to go and explore all these dead ends. you can learn a lesson through me. The person that's receiving that advice is going to learn something valuable because they've saved all of these years. You are going to um benefit from that because you you can scale over the internet and like it's just much more efficient than like going to a state school and getting a degree and then like starting off as an associate and doing all of that other stuff. Like I think that type of business makes a ton of sense and it hasn't even started yet really. >> What's next for you? What should people look forward to content business-wise? >> Yeah. Uh I'm writing a book. Don't write a book if you you know don't have like a ton of free time or it's it's been a grind. You know, the way that I think about it is uh distribution is paramount when it comes to writing a book. So I thought that if you wrote a good book, it would just sell really well. Now, it turns out like if you have big distribution and you write a midbook, like it will do okay. If you write a bad book, it will still do okay. But if you have like distribution, so you have like a following and you write a really killer book, like that's when you're multiplying two large numbers together. You know, as much as I'd like to get this book done, like I just really am obsessing over quality, which is why it's just taken, you know, more than a year to to get it out. So, I'm working on that. What I really want to do, I want to basically do a conference for principal engineers or people that aspire to be principal engineers and this have them fly into Seattle area where we're at and um just have like a bunch of really awesome speakers and then it'll be the sum of you know greater than the sum of the the participants that are there. Um so that's the idea that I'm kicking around. Um, you know, I need another line of business. Like, I need a hole in my head. But, you know, maybe I'll try to get really big on YouTube and just start posting again every week. You know, maybe I'll uh start a podcast. I've already shot a couple of episodes uh for my podcast. Um, but I don't see those as like gigantic leaps from what I'm already doing. Um, and so I, you know, I have to take stock and and figure out like whether I should just be maximizing what I already have, um, or starting new things. And so that's the that's the perpetual choice that you need to make as an entrepreneur. >> Awesome. Thanks for doing this, man. Had a lot of fun. >> Absolutely. Thank you. That's today's episode of Liftoff. Thank you so much for watching. Now, if you want early access to every single one of these episodes, head over to Apple Podcast or Spotify or any other podcast app of choice and follow Liftoff with the Mama. That's right. You can listen to every episode early on the podcast apps before they get released on YouTube. So, make sure to go over and follow on Apple Podcast or Spotify, turn