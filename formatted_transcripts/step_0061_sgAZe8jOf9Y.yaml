transcript: What's the question that if I asked it would strike the most fear in you? >> Tell me about a time you really messed up. >> I'm here to deliver some good news, which is I think things that you are thinking of in terms of mistakes aren't as bad as you think they are. I'll just give you this analogy. We don't operate at work in a environment of perfect information. Chess is a game of perfect information. I can see exactly where your pieces are, you can see exactly where my pieces are. It's much more like poker. We operate in this big environment, there's more problems than people. These systems are so big that you can't keep them all in your head, and so there's just risk everywhere. There's a trap that we can fall into, which is outcome-ism. I made this bad decision, but the outcome was fine. Or you made this like really good decision, but you think it's a bad decision because the outcome wasn't good. So we need to think about decisions separate from the outcome because we aren't operating in this game of perfect information. Let's get back to a mistake. It should not be a judgement when you make a mistake because you're just bound to make a mistake because we don't operate with perfect information. And so what we want to do is we want to frame it a little bit. We want to be like, "Hey, I should have done this, but I didn't do it because I thought something different than what the reality was." And it turned out that the reality wasn't there.
