transcript: It's 1956. A young programmer is taking his girlfriend shopping in Amsterdam without knowing that he would develop one of the most important algorithms in history. No one could possibly know that in just 20 [music] minutes the world as we knew it would be transformed. That was the day when a soon-to-be a world-renowned Dutch programmer and mathematician, Edsger W. Dijkstra, came up with an algorithm that would power GPS navigation, network routing, social media networks, supply chains, robotics, and more. He literally changed the world in the time it takes us to drink a cup of coffee. Can you imagine that? Dijkstra was working as a programmer at the Mathematical Center in Amsterdam. The center was about to unveil a pioneering Dutch computer, the New Am computer. He wanted to showcase the power of this computer by choosing a problem that would be challenging enough to surprise people, but general enough so that people who were not specialized in computing could still understand it. He chose the problem of finding the shortest path between two locations. He kept thinking about this during and after his work hours. When Dijkstra and his girlfriend felt tired from walking around the shops that day, they sat down at a cafe terrace to drink a cup of coffee. He kept thinking. He just kept thinking. How could he find the shortest way to travel from Rotterdam to Groningen? But then, he realized the potential of making the question more general. Why not come up with a general solution that would find the shortest path between any two given cities. You might picture Dijkstra very focused on his cafe table sketching and brainstorming in hundreds of pieces of paper to come up with the right solution. Interestingly, that's not how it happened. Dijkstra literally said that he didn't use pencil and paper. He designed it entirely in his head. At that time, Dijkstra didn't know that those 20 minutes would become the cornerstone of his fame, reshaping the world by unlocking capabilities that we didn't even know existed. This story proves how inspiration can come from the most unexpected moments >> [music] >> and how brilliant discoveries can have a profound impact in the future of humankind. Dijkstra literally changed the world with [music] his 20-minute masterpiece. To learn more about Dijkstra's algorithm, check out my full video essay on the freeCodeCamp YouTube channel.
