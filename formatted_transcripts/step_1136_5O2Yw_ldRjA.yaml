transcript: Hello, my name is Dan Shiffman and I am here to tell you about the new coding trade website, which you can find right now at the codingtrain.com. The website is meant to catalog, organize all the videos, help you find them, as well as include all of the metadata for all the videos and it has something called a Passenger Showcase, which is a way for you to submit projects that you made and have them featured on the website along with the videos themselves. I've been making videos for a little over 10 years. At some point I started putting them on YouTube and the channel grew and found an audience. Then the community helped build a website for the channel, which was an alternate way to organize the material beyond what YouTube offers, which is essentially video pages and playlists. That a year ago or so, I don't remember the timing, I invited Design Systems International, which is a design firm that works with code and computation to develop systems for design, to help imagine, reinvent, and build a new Coding Train website that helps you navigate through everything. One of my favorite things about what they did with the website is they used the inspiration of a train ticket as the design for the website. I'll read to you from the case study, just as a train ticket uses a horizontal grid to organize travel information, we built out the page layouts in a horizontal grid format containing buttons, headings, text, and images. When you first arrive on the website, there's a homepage which is going to show you a preview of all the different aspects of the website. There's coding challenges, there's tracks, there's the passenger showcase, and there's all sorts of ancillary material like an FAQ and guides for how to contribute to the website and how to learn to program and all that kind of stuff. Then once you're there, it's a matter of picking, choosing where you want to go. A coding challenge is a video where I build a project from start to finish. It doesn't necessarily require that you watch other videos, although it does require a basic foundation in programming. But for those videos on the webpage, there are time codes. There's metadata like the coding examples, so if I built it in processing, you can click and find the processing code. You can find p5.Js code, which will link you right to the web editor so you can just run the code right there in the browser. Any things that I referenced in the videos, you'll find links to those related videos, other challenges. Then the passenger showcase things that people have made inspired by or related to the video are there on that page as well. That's the coding challenges. There are also the tracks. The tracks are collections of videos, so the main tracks, which are essentially sequences of videos. Sometimes I have videos that all follow what is something like a syllabus for a full semester course. There's nature of code, there's beginner's guide to machine learning. There's code, just an intro to programming with p5.Js. Then there are also side tracks. The side tracks are collections of videos that are maybe linked by a theme, so let's about watching them in order. But I've made videos for Pi Day, so anything that has to do with maybe polar coordinates or trigonometry, the number Pi might be in a sidetrack of videos. I have a side track called Algorithmic Botany. It's any videos that have to do with algorithms to generate plant-like or tree-like structures. For those, when you go to the track page, you'll find all of the videos listed in order, and you can click around them and then find the individual video pages as well, which has all the same material as the challenge page. There's also an FAQ. Those frequently asked questions that I've always getting over email or on YouTube comments, how do I get started? How do I find the code or how do I suggest a topic? Those questions are all there on the FAQ. Maybe you have some questions that aren't on the FAQ. Please send them to me, ask them, and then there are the guides. There's a guide for how do you get started if you're totally new to programming and have never done anything before? That guide will walk you through where are the videos that you can start with and how do you approach beginning. There's also the how to maintain the website guide, which is not for the faint of heart, it's a bit more technical. There's a lot of different aspects to how the website is designed, built, and generated. But if you're interested in that and you want to help contribute to improve the website or have new ideas, that guide will really help you. Then there's the passenger showcase guide. This is really the most important part of the website in my view, it's really one of the reasons why I wanted to create a new website to have a way to feature the hundreds and maybe thousands of projects that people have made over the years from watching the videos. Every video page has the passenger showcase on it. There's an entire passenger showcase page which shows everything that's ever been submitted. You can also search by passenger or author I don't know the right term to use here and you should submit. The guide will show you how you can enter all the information to a form to submit your project. You could also make a pull request, which might be something that sounds a little scary to you. Maybe it's something that you haven't done before, but the Coding Train community will welcome you with open arms. Please, if you've never made a pull request or use GitHub before, this could be a place for you to try at and don't worry, you can't break anything, you can't do it wrong. We are here to help you do that. There's also the about page which I would really encourage you to take a look at. Many people over the years have helped me with the Coding Train, I have made the coding trade happen and then all ways that maybe you don't even know about. I'll try to include everybody linked in the video description here who has helped make the Coding Train happen. All right, everyone, I'm going to wrap this up. I'm going to take us out with this train whistle that is a laser etched with some of my favorite coding projects. We've got the 10 print design here. A random walk. This looks like marching squares of Perlin noise and then the snake game. Let's see what sound this thing makes. There we go. That's actually pretty darn good.
