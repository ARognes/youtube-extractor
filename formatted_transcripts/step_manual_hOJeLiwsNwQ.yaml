transcript: '{"content":"\n[0.08s] “In society you will not find health,\n[2.48s] but in nature. Unless our feet at least stood \nin the midst of nature, all our faces would be\n[7.76s] pale and livid.”  \nHenry David Thoreau,\n[9.725s] A Natural History of Massachusetts\nA growing body of research shows that spending\n[12.08s] time in nature elevates our mood, reduces stress, \nenhances creativity, restores our powers of\n[17.6s] attention, and even improves cardiovascular health \nand the functioning of our immune system.\n[22.88s] “There is growing . . . empirical evidence to \nshow that exposure to nature brings substantial\n[27.36s] mental health benefits.”\nDr. Jo Barton et al., Green\n[30.72s] Exercise and Green Care\nSuch findings confirm what lovers of nature\n[35.36s] have always intuitively known. In this video, \nwe draw from the insights of the 19th-century\n[40.72s] American philosopher Henry David Thoreau and \nshow how spending time in nature serves as an\n[45.92s] antidote to the psychological and spiritual \nsickness that plagues modern society.\n[51.28s] “I cannot preserve my health and spirits unless \nI spend four hours a day at least—and it is\n[56.8s] commonly more than that—sauntering through \nthe woods and fields absolutely free from all\n[61.84s] worldly engagements…Ah dear nature…I come to \nit as a hungry man to a crust of bread.”\n[69.49s] Henry David Thoreau, Journals\nThere is a growing recognition\n[70.8s] that we live in a spiritually impoverished age. \nMany of us have lost a sense of the sacred and\n[76.32s] no longer experience the world as infused with \nthe divine. What is often overlooked, however,\n[81.52s] is that we don’t need to attend church or pledge \nallegiance to an organized religion to re-awaken\n[86.88s] our spiritual faculties. Spending time in nature \ncan help accomplish this end as the natural world\n[93.12s] is the ultimate temple of the divine.  \n“Nature is full of genius, full of the\n[97.92s] divinity…Blessed are they who never read \na newspaper, for they shall see Nature,\n[103.44s] and through her, God.” \nHenry David Thoreau, Journals\n[105.52s] Unlike organized religions, the temple of \nnature does not demand adherence to any dogma,\n[110.72s] the acceptance of any moral code, or belief in \nany particular god. Even if we are an atheist, the\n[116.8s] grandeur, beauty, and complexity of the natural \nworld can inspire a profound awe and wonder in us\n[122.8s] that gives rise to peak or spiritual experiences. \nOr as Thoreau wrote in his Journal:\n[128.24s] “I have come forth to this hill at sunset to \nsee the forms of the mountains in the horizon—to\n[133.36s] behold and commune with something grander \nthan man.…alone in distant woods or fields,\n[138.48s] I come to myself, I once more feel myself grandly \nrelated, I suppose that this is equivalent to\n[144.72s] what others get by churchgoing and prayer…I \nsuppose that what in other men is religion\n[149.76s] is in me love of nature.” \nHenry David Thoreau, Journals\n[152.48s] Another benefit of spending time in nature \nis that it offers refuge from the suffocating\n[157.28s] tentacles of the modern state, the propaganda of \nmainstream media, the negativity and hostility\n[162.72s] that pervade social media, and the trivialities \nthat consume so much of social life. When immersed\n[168.96s] in the beauty of nature we enter a reality \nfar more expansive, liberating, and joyful,\n[174.24s] than the banal, corrupt and often depressing \nworlds of politics and modern-day society.\n[179.44s] Or as Thoreau observed in his Journal: \n“I love Nature partly because she is not man,\n[184.64s] but a retreat from him. None of his institutions \ncontrol or pervade her. There a different kind of\n[191.36s] right prevails. In her midst I can be glad with \nan entire gladness. If this world were all man,\n[197.76s] I could not stretch myself, I should \nlose all hope. He is constraint, she is\n[202.8s] freedom to me. He makes me wish for another \nworld. She makes me content with this.”\n[209.01s] Henry David Thoreau, Journals\nNature also restores our capacity\n[210.96s] to focus, which in modern life is being eroded \nby constant stimulation and distraction. Emails,\n[217.04s] notifications, screens, apps, and social-media \nfeeds deliberately designed to capture and hold\n[222.48s] our attention pull our minds in many \ndirections throughout the day. One\n[226.56s] study found that the average American worker \nremains focused on a single task for only about\n[231.76s] three minutes before becoming distracted. \n“…we are now developing “an attentional pathogenic\n[237.36s] culture”—an environment in which sustained and \ndeep focus is extremely hard for all of us,\n[243.36s] and you have to swim upstream to achieve it.” \nJoel Nigg, Quoted in Stolen Focus by Johann Hari\n[247.6s] The phenomena of nature evoke what psychologists \ncall “soft fascination”, which counteracts the\n[253.52s] negative effects produced by constant distraction \nand overstimulation. Clouds drifting across the\n[259.28s] sky, birdsong, flowing water, and leaves moving in \nthe wind capture our attention without demanding\n[265.04s] intense concentration. Nor do natural phenomena \nforce us to rapidly switch our attention from\n[270.48s] one stimulus to another or constantly tune out \ncompeting distractions – both of which tax the\n[275.04s] cognitive systems that sustain concentration. By \nengaging the mind in a soft and undemanding way,\n[281.6s] nature gives our attentional faculties \na chance to rest and recover.\n[285.84s] One influential study demonstrating nature’s \nrestorative effects on attention was published\n[290.24s] in 2008. It found that participants’ memory \nand attention improved by 20 percent after a\n[296.88s] short walk through a natural environment, \nwhile a comparable walk through an urban\n[301.12s] setting produced no such benefit. Subsequent \nresearch suggests that longer periods immersed\n[306.4s] in nature produce even greater benefits for \nattention and cognitive functioning. Thoreau\n[311.68s] recognized this restorative power of nature more \nthan a century before psychologists attempted to\n[316.88s] demonstrate it scientifically. For him, the \nnatural world was medicine for the mind:\n[322.359s] “This stillness, solitude, wildness of nature is a \nkind of thoroughwort, or boneset, to my intellect.\n[326.56s] This is what I go out to seek.”   \nHenry David Thoreau, Journals\n[363.76s] Nature also teaches us important lessons about \nlife and serves as a source of self-knowledge,\n[368.88s] for the movements and rhythms of our inner \nworld often mirror those of the natural\n[373.2s] world. For example, we pass through psychological \nseasons that resemble the seasons of nature.\n[379.36s] “The seasons and all their changes are in me.”\nHenry David Thoreau, Journals\n[383.84s] The most difficult of these inner seasons are the \nwinters of life – periods of despair, exhaustion,\n[388.88s] or stagnation in which our vitality diminishes \nand we may even lose the will to live. Yet just as\n[395.04s] winter is a season of dormancy in which seeds rest \nbeneath the soil, trees conserve their energy,\n[400.8s] and tightly sealed buds preserve the beginnings \nof new growth, an inner winter can be a period in\n[406.24s] which vitality retreats into the depths of \nthe psyche in preparation for renewal.\n[411.6s] “To us snow and cold seem a mere \ndelaying of the spring. How far\n[415.76s] we are from understanding the value of \nthese things in the economy of Nature!”\n[419.76s] Henry David Thoreau, Journals\nRecognizing this parallel can help us\n[423.12s] endure our own psychological winters with greater \npatience. For just as nature requires the dormancy\n[429.36s] of winter before the renewal of spring, the darker \nseasons of our own lives may also serve a similar\n[435.28s] regenerative purpose. Or as Thoreau wrote: \n“If rivers come out of their icy prison thus\n[441.04s] bright and immortal, shall not I too resume my \nspring life with joy and hope?…Shall a man not\n[447.28s] have his spring as well as the plants?” \nHenry David Thoreau, Journals\n[450.32s] Katherine May echoes this insight in her \nbestselling book Wintering: The Power of Rest\n[454.96s] and Retreat in Difficult Times. As she writes: \n“Wintering is a season in the cold. It is a fallow\n[461.36s] period in life when you’re cut off from \nthe world, feeling rejected, sidelined,\n[465.44s] blocked from progress, or cast into the role \nof an outsider…. However it arrives, wintering\n[471.04s] is usually involuntary, lonely, and deeply \npainful…Winter is not the death of the life cycle,\n[476.96s] but its crucible…that’s where the transformation \noccurs…We have seasons when we flourish and\n[482.56s] seasons when the leaves fall from us, revealing \nour bare bones. Given time, they grow again.”\n[488.96s] Katherine May, Wintering: The Power of \nRest and Retreat in Difficult Times\n[489.6s] Studies have shown that we need not venture deep \ninto the wilderness to experience the benefits\n[494.16s] of nature. If we live in an urban environment, a \ndaily walk through a park filled with trees and\n[499.28s] greenery can enhance our well-being. And \nwe shouldn’t overlook the fact that even\n[503.76s] in poor weather, time spent in nature is still \nbeneficial. In a study conducted by Mark Berman at\n[509.6s] the University of Chicago, participants who took \na walk in nature on a cold and blustery winter\n[514.56s] day performed better on tests of creativity, \nshort-term memory, and attention, despite not\n[520.24s] particularly enjoying the experience. \nSpending time in nature is a low cost,\n[525.2s] high benefit way to improve our life. And in an \nage when most of us are glued to screens for a\n[530.64s] good portion of the day, it is now more important \nthan ever to connect to the natural world and\n[535.76s] allow its restorative powers to rejuvenate our \nmind. “The more high-tech we become, the more\n[541.36s] nature we need.”, observed the psychologist \nRichard Louv. Or as Thoreau wrote:\n[546.8s] “All nature is doing her best each moment \nto make us well—she exists for no other\n[551.92s] end. Do not resist her…We must go out and re-ally \nourselves to Nature every day. We must make root,\n[558.96s] send out some little fibre at least, even every \nwinter day. I am sensible that I am imbibing\n[564.96s] health when I open my mouth to the wind. Staying \nin the house breeds a sort of insanity always.\n[570.96s] Every house is in this sense a hospital.” \nHenry David Thoreau, Journals"}'
