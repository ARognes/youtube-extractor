transcript: '{"content":"\n[0.16s] Nobody likes to be thought of as a fool.\n[3.04s] But in early Buddhism, foolishness is\n[5.68s] more than simply a lack of intelligence.\n[8.96s] The Buddha used the term fool to\n[11.759s] describe people who through their\n[14.4s] actions and words, deeds, created\n[18.0s] suffering for themselves and others. In\n[20.48s] this video, we''ll discuss the early\n[22.64s] Buddhist concept of the fool, how it''s\n[25.6s] connected to ignorance and attachment,\n[29.039s] and how we can overcome our own foolish\n[32.16s] tendencies in everyday life. First, what\n[35.36s] is a fool in early Buddhism? There are a\n[39.28s] number of words, at least two, that are\n[41.16s] generally translated that way. One is\n[44.32s] the term bala, which basically is\n[46.64s] translated as a fool or an idiot. The\n[49.52s] other is\n[50.6s] moapurisa which basically means empty\n[54.0s] man or useless person which is also\n[57.76s] sometimes translated as fool. Now these\n[60.559s] do not specifically mean somebody who is\n[63.479s] unintelligent but rather someone who\n[65.76s] lacks wisdom and s so who therefore acts\n[69.68s] in ways that are unskillful. This kind\n[72.159s] of unskillfulness is related to\n[75.36s] ignorance and to delusion. These are\n[78.479s] fundamental misunderstandings of what is\n[81.36s] the well-lived life and what is the path\n[84.159s] to freedom. Again, this is not simply a\n[86.72s] matter of book knowledge or of general\n[89.24s] intelligence, but rather a matter of\n[91.84s] personal integrity, of ethics, of\n[94.84s] kindness, of wisdom and how to live a\n[98.079s] proper life. There are several key suda\n[100.96s] references that discuss this kind of\n[102.96s] topic and the general way they put it is\n[105.68s] this. A fool is characterized by their\n[108.72s] deeds and a wise or astute person is\n[112.399s] characterized also by their\n[115.24s] deeds. Now when the Buddha uses the word\n[118.32s] deeds here that is basically translating\n[120.96s] the word karma. That is how we think,\n[124.56s] speak and act intentionally with\n[127.56s] intention. Again being a fool is not\n[131.039s] about failing to pass tests nor again\n[133.84s] about intelligence in general. It''s\n[136.16s] about the purity of our intentions when\n[138.8s] we think, speak, and act. We might say\n[141.599s] that there are three key aspects to\n[144.52s] foolishness. The first of these is an\n[147.28s] ignorance of the way the world works and\n[150.319s] of, we might say, the four noble truths.\n[153.2s] That is to say, ignorance about the fact\n[156.4s] that all things are impermanent. That\n[159.04s] all things are in a state of change.\n[161.68s] That things arise due to causes and\n[163.76s] conditions and pass away due to causes\n[165.92s] and conditions. That there is no\n[168.0s] permanent\n[169.56s] unchanging core to our being. That all\n[173.519s] things are to an extent unsatisfactory.\n[176.48s] and that suffering is brought about\n[178.239s] through craving and clinging and\n[180.319s] ultimately through ignorance itself. The\n[183.599s] second aspect of foolishness involves\n[186.56s] unskillful action. As I''ve said, the\n[190.319s] fool acts in ways that are unskillful\n[193.04s] and therefore bring suffering to\n[194.8s] themselves and those around them. They\n[197.36s] tend to lack kindness, compassion,\n[201.04s] sympathetic joy, that is to say the\n[203.44s] ability to take joy in the successes of\n[205.76s] others around them rather than getting\n[207.84s] jealous about them. And they lack\n[210.599s] equinimity. And third, the fool engages\n[214.799s] in attachment and egoism. That is, they\n[218.72s] get attached to their own views. They\n[221.28s] cling to them. They get attached to\n[223.44s] their own possessions, the things that\n[225.36s] surround them. the objects of their life\n[227.92s] and they get attached to their own\n[230.0s] identity of who they think they really\n[232.319s] are and as a result these kinds of\n[235.12s] attachments bring suffering to\n[236.72s] themselves and indeed can easily bring\n[239.519s] suffering to those people around them.\n[241.439s] Now there''s one key upshot here which I\n[243.76s] hope you will have gathered so far which\n[246.799s] is that all of us to the extent that we\n[249.439s] are not yet enlightened are to some\n[252.159s] extent fools. This is an extremely\n[255.28s] important thing to keep in mind which\n[257.959s] then allows us to turn to our second\n[260.88s] point which is recognizing our own\n[264.52s] foolishness. The Dhamapata perhaps the\n[267.12s] most famous uh book in early\n[269.24s] Buddhism has a chapter entitled the fool\n[272.479s] which has some of the most important\n[274.08s] discussions of foolishness in the canon.\n[277.759s] In that chapter, we read, \"The fool who\n[280.8s] thinks they''re a fool is wise, at least\n[283.199s] to that extent. But the true fool is\n[285.919s] said to be one who imagines that they\n[287.919s] are\n[289.24s] wise.\" The biggest problem with fools,\n[292.08s] we might say, is that they lack the\n[295.52s] insight into their own lack of\n[298.16s] understanding.\n[299.919s] One example we can think of nowadays is\n[302.08s] what''s known as the Dunning Krueger\n[303.96s] effect whereby people typically will\n[308.0s] overestimate their own abilities in\n[310.88s] fields in which they have limited or no\n[313.919s] competence.\n[316.16s] One example of this is brought forward\n[318.72s] by a survey done by the AAA the American\n[322.639s] Automobile Association where they say\n[326.56s] 3/4 that is 73% of US drivers consider\n[330.56s] themselves better than average drivers.\n[333.28s] Men in particular are confident in their\n[335.759s] driving skills with 8 in 10 considering\n[339.039s] their driving skills better than\n[341.12s] average.\n[343.199s] And it should be clear that it is\n[345.44s] mathematically impossible for 80% of\n[348.24s] drivers to be above average. And this\n[351.68s] kind of conceit, which is what it is,\n[354.0s] it''s a feeling that we''re better than\n[355.759s] other people in regard to things we know\n[357.919s] nothing about. This kind of conceit\n[360.32s] carries over into many aspects of our\n[362.56s] daily life where for example instead of\n[366.0s] relying on experts who spend their\n[368.479s] entire working careers studying\n[371.88s] something, instead we turn to some\n[376.0s] well-paid TV presenter to tell us about\n[378.56s] it, a TV entertainer. Basically, one uh\n[382.479s] really key and upsetting and and\n[384.88s] concerning example of this has to do\n[386.72s] with global warming. The key lesson here\n[389.36s] is that learning about our own ignorance\n[392.4s] is the first step, the key step in\n[395.6s] gaining wisdom. Now, it''s really not\n[399.039s] possible to change other people. Other\n[401.919s] people have to want to change in order\n[403.52s] to do that. However, we can work with\n[407.4s] ourselves. As again this this section of\n[410.88s] the dhamapata talks about it says don''t\n[414.24s] find faults with others with what\n[416.56s] they''ve done or left undone. You should\n[419.36s] only watch yourself what you''ve done or\n[422.639s] left\n[424.28s] undone. So we might ask ourselves before\n[427.12s] engaging in discussions do I have true\n[431.52s] competence in this particular field? Am\n[434.319s] I helping or hurting by engaging here?\n[437.84s] And if I''m not helping, perhaps it''s\n[440.24s] best simply to step aside. And there are\n[443.039s] some signs we can look out for in order\n[445.44s] to not act the fool. For example, are we\n[449.0s] engaging, we might say, mindlessly or\n[451.759s] thoughtlessly, out of anger or some kind\n[454.479s] of immediate response without\n[456.88s] considering it? Are we clinging to our\n[459.599s] views and refusing to accept other\n[462.639s] evidence that''s brought forward in a a\n[465.52s] reasonable fashion? Are we repeating\n[468.8s] harmful habits despite knowing that\n[471.84s] they''re harmful? Knowing better. So, as\n[474.56s] I''ve already established, we are all to\n[476.72s] some extent fools. But how can we\n[479.68s] overcome that foolishness? Now, I want\n[482.24s] to turn to four different methods we can\n[484.879s] use to help ourselves to overcome this\n[488.56s] foolishness that we all share. First of\n[491.759s] all, we can start to do so with good\n[495.0s] companionship. Again the Buddha talks in\n[497.599s] the Dhamapada about this. He says if\n[500.8s] while wandering you find no partner\n[503.199s] equal or better than yourself then\n[505.44s] firmly resolve to wander alone. There''s\n[508.16s] no fellowship with\n[509.96s] fools. Now the this stanza here mirrors\n[513.12s] the advice we find in a different early\n[515.68s] Buddhist poem, the poem on the\n[517.36s] rhinoceros that I did a video about a\n[519.599s] while back. I''ll leave a link to that\n[520.88s] down below where the Buddha essentially\n[523.12s] or whoever wrote this uh early poem\n[526.08s] essentially argues that if we cannot\n[528.8s] find good companionship then it''s best\n[532.0s] simply to wander alone in this case like\n[534.48s] a rhinoceros like a lone\n[536.76s] rhinoceros. If however we are able to\n[539.6s] find good companionship then we should\n[542.0s] treasure it. For many of us, associated\n[545.44s] associating with wise people is the\n[547.68s] first and most most important step in\n[550.399s] reaching wisdom ourselves. In one early\n[553.6s] suta known as the chunki suta that again\n[556.16s] I did a video on. I''ll leave a link to\n[557.68s] that one as well down in the notes if\n[559.2s] you want to hear more about that. The\n[561.44s] Buddha has a discussion with a young\n[564.36s] Brahman. And in that discussion, they''re\n[567.68s] trying to basically discover the ways\n[570.64s] that we can find truth, that we can lead\n[573.6s] ourselves to truth, that we can, we\n[575.519s] might say, become\n[576.92s] wiser. And the Buddha goes through a\n[579.2s] long number of steps here, and I''m not\n[580.959s] going to go through them all, but one of\n[583.279s] them is to try to find an appropriate\n[586.16s] teacher, a teacher in whom we have a\n[589.399s] settled confidence, a well-grounded\n[593.0s] confidence. and then to follow their\n[596.279s] instructions. And what is it to find or\n[599.12s] to believe that we have this confidence\n[601.44s] or have this well-grounded confidence?\n[604.64s] It''s to understand that the person we\n[607.279s] look to as a teacher really knows\n[609.76s] directly what they''re talking about. In\n[612.0s] a related way, the Buddha also talks in\n[614.72s] a number of places about the importance\n[617.04s] of spiritual friends or kalyana mittas.\n[620.88s] These are again friends uh among us who\n[623.839s] are perhaps wiser than we are a little\n[625.839s] bit farther along the path and who can\n[628.079s] help to direct us in the right in the\n[630.959s] right direction. This is the role of\n[633.8s] Sana in the Buddhist triple gem. The\n[636.8s] idea of Buddha Dharma and Sana the role\n[638.88s] of Sana is here to direct us to help us\n[642.24s] to find and to preserve us and to give\n[645.6s] us support while we''re along the path.\n[649.04s] The second key step to overcoming our\n[651.92s] own foolishness is a sense of openness\n[655.839s] to criticism, willingness to learn. Once\n[659.2s] again, from the Dhamapata, we read,\n[661.519s] \"Regard one who sees your faults as a\n[664.399s] guide to a hidden treasure. Stay close\n[667.2s] to one so wise and astute who corrects\n[670.079s] you when you need it. Sticking close to\n[672.56s] such an impartial person, things get\n[675.2s] better, not worse.\"\n[677.92s] This kind of humility is so important in\n[680.959s] order to overcome our own\n[683.0s] foolishness. Now, there is, I think, a\n[685.36s] very key distinction to be made between\n[687.92s] destructive criticism and constructive\n[690.76s] criticism. But assuming that the person\n[692.959s] we''re talking about criticizes us in a\n[695.68s] constructive way, gives us constructive\n[698.24s] feedback that helps us to grow rather\n[700.48s] than simply knocking us down, they are a\n[704.16s] true gem to us. They they''re they can be\n[707.36s] extremely helpful. Only a fool resists\n[710.64s] wise counsel. And yet many of us resist\n[714.32s] being corrected about anything. I know I\n[716.8s] myself have had that fault and have had\n[720.0s] to learn from it. So ask yourself if you\n[723.839s] resist these kinds of corrections or\n[726.48s] instead embrace them. It''s not an easy\n[729.6s] kind of practice. The third way we can\n[732.32s] try to overcome our own foolishness is\n[735.76s] through mindfulness and wise reflection.\n[739.44s] In one early suta, the Buddha is\n[741.48s] discussing just this kind of attitude\n[744.079s] with his son Rahula. And the Buddha\n[747.12s] says, \"What do you think Rahula? What is\n[749.839s] the purpose of a mirror?\" Rahula\n[752.24s] answers, \"It''s for checking your\n[754.0s] reflection, sir.\" In the same way, deeds\n[757.519s] of body, speech, and mind should be done\n[760.399s] only after repeated\n[762.68s] checking. That is, the Buddha suggests\n[765.279s] we should reflect mindfully before\n[768.32s] committing acts of body, speech, or\n[771.12s] mind. Now, if that''s not possible, if we\n[774.399s] don''t have the time or foresight to do\n[777.279s] that, then at least we should reflect\n[779.6s] mindfully while we are engaged in these\n[782.079s] tasks. And if even that is too much for\n[785.04s] us, the Buddhist says, then at least we\n[787.839s] should try to reflect mindfully after\n[790.079s] having done the actions. Were these\n[792.72s] things that we did beneficial or\n[795.88s] harmful? Did they bring happiness or\n[798.8s] suffering to to ourselves and others? Of\n[802.079s] course, if they brought suffering, then\n[804.079s] we should consider not doing them again\n[806.24s] in the future. The fourth way we can\n[808.8s] strive to overcome our own foolishness\n[811.6s] is by working to let go of our own ego\n[815.76s] and attachment. Are we clinging to our\n[819.24s] views, to our status, to our identity?\n[823.68s] How are we doing\n[825.16s] this? Are we engaging in a kind of a\n[827.839s] conceit of thinking ourselves superior\n[830.639s] to others or indeed inferior to others?\n[833.44s] This kind of comparing mind.\n[836.48s] For example, we might think, you know,\n[838.88s] I''m better than the people around me\n[840.48s] because I''ve given up clinging to my own\n[843.8s] identity. Of course, once we engage in\n[846.48s] that kind of thought, we''re right back\n[848.24s] into clinging to our own identity. So,\n[850.88s] the wise among us will be people who are\n[853.12s] truly able to give up clinging to and\n[856.48s] identifying with status, identity,\n[859.76s] views, and such things. In conclusion,\n[862.959s] in early Buddhism, the fool is is not\n[865.44s] somebody who is unintelligent or lacks\n[868.399s] book knowledge, but rather someone who\n[870.88s] is unwise and therefore acts in ways\n[874.88s] that are unskillful, harming themselves\n[877.44s] and other people. It follows that we are\n[880.48s] all to some extent fools to the extent\n[883.36s] that we are not yet enlightened.\n[886.399s] The route towards overcoming our own\n[889.519s] foolishness is through humility. The\n[892.56s] ability to learn from others, to learn\n[894.959s] from our mistakes, to learn from the\n[897.279s] world, to accept wise counsel, to be\n[900.72s] aware of our own limitations and\n[903.639s] imperfections, and be willing to grow.\n[906.639s] While foolishness is tied to ignorance,\n[909.92s] attachment and ego, the wise person is\n[913.12s] one who is able mindfully to overcome\n[915.839s] these things, to give up attachments, to\n[919.519s] overcome their ordinary sense of egoism.\n[923.36s] So my question to you is, how have you\n[926.0s] tried to become wiser in your own life?\n[928.959s] Have you noticed your own foolishness at\n[931.12s] times and worked to correct yourself and\n[934.16s] learn from your mistakes? and how I did\n[937.199s] an earlier video on the distinction\n[939.199s] between wisdom and knowledge, which is\n[942.079s] really what I''ve been discussing here\n[943.6s] all along, that there is a distinction\n[945.92s] between wisdom and we say knowledge or\n[948.639s] book learning. And I''ll leave a link to\n[950.639s] that video up here on the screen if you\n[952.24s] haven''t seen it. If you''re getting\n[954.24s] something out of these videos of mine,\n[955.92s] consider taking a look at my Patreon\n[958.079s] page, which is linked up here on the\n[959.839s] screen and down below in the notes, and\n[961.759s] see if you want to help support the\n[963.12s] channel and the work that I''m doing\n[964.399s] here. Thanks so much, and we''ll catch\n[966.32s] you on the next video. And meanwhile all\n[968.56s] of you be"}'
