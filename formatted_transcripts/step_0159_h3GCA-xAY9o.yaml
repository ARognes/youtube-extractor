transcript: "Palme d’or du Festival de Cannes 2026, « Fjord » est disponible dans les salles françaises depuis le 19 août. Dans cette vidéo, son réalisateur, le roumain Cristian Mungiu, décrypte pour « Le Monde » comment il a construit la première scène du film.\n\n« Le premier et le dernier plan du film sont les deux plans que je dois connaître avant d’écrire le scénario » explique Cristian Mungiu, réalisateur de Fjord. Le cinéaste roumain insiste sur l’importance d’embarquer le spectateur dès la première image du film. Dans Fjord, Palme d’or du Festival de Cannes 2026, il utilise le premier plan pour introduire les trois personnages principaux, tous membres d’une même famille.\n\nD’abord, la mère. Placée au premier plan, elle enlace sa fille : « Elle tente d’apporter un équilibre dans la famille », décrypte le réalisateur. Plus loin, dans le flou de l’image, la silhouette du père signale une autorité froide qui pèse sur l’ensemble du foyer : « C’est une caractéristique des familles traditionnelles. Les valeurs ne se discutent pas. » Enfin, leur fille, le visage enfoui dans le pull de sa maman : « Cela installe d’emblée une forme d’intensité et de mystère. »\n\nDécouvrez l’entièreté de son analyse dans cette vidéo.\n\nRéalisation : Marceau Bretonnier\nMotion Design : Marceau Bretonnier\nSuivi éditorial : Brieuc Beckers\n_______\n\n✅ Pour comprendre l'actualité, abonnez-vous à la chaîne YouTube du Monde (et activez la cloche pour les notifications \U0001F514 !) \U0001F449http://www.youtube.com/subscription_c..."
