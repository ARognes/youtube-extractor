transcript: hey everyone we have a new game for you Bachelors Bachelor is a local multiplayer game where you play as a bachelor trying to find love you run through a set of dungeons competing with other Bachelors trying to see who can get the most amount of coins in every dungeon you have 2 minutes time to go in grab as much as you can and head back out before the play collapses afterwards you go to a marketplace where you can buy items to get stronger or you can hold your coins for later because at the end of the game the player with the most amount of coins wins the game and gets to marry a prince or princess there are many different ways you can make money like defeating enemies opening Treasure Chest investing saving a baby claiming Awards following other players waiting till they die you grab their stuff defeating the other players in the arena hitting the slot machine donating your blood and many more I originally made this game for us to play with our friends but we had so much fun that I decided to release it to the public you can play the game locally with your friends or you can play it single player against computer controlled AI we also tested the game online with steam's remote play together and that work great so if you have the chance be sure to check that out I hope you have fun with the game
