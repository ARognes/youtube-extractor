ват на работните места, и правят сцени.\n[559.72s] Те поемат грижата за внуците, без консултация с родителите.\n[564.2s] Спазването и уважението на граници е една от основните прояви\n[567.1s] на респект, който показваме към другите хора.\n[570.42s] Демонстрира това че ние признаваме тяхното управление\n[574.02s] върху тяхното собствено съществуване.\n[576.34s] И по тази причина, прекрачването на граници без покана\n[580.18s] е запазено за много специфични ситуации\n[583.4s] например когато индивиди не са способни да се грижат за себе си\n[587.24s] или когато има опасност от нараняване.\n[590.4s] И дори и в тези случай, ситуациите се преразглеждат\n[594.08s] за да се изясни дали преминаването на тези граници е наистина оправдано действие.\n[598.66s] Когато тези граници са обикновено игнорирани\n[601.06s] това е дело извършено от неуважение и надмощие, господство.\n[605.04s] Изграждането... и поддръжката... на солидни граници\n[609.12s] е едно от най-важните неща и един от най-трудните\n[611.92s] аспекти на преодоляване на инфантилизацията.\n[615.66s] По-късно ще се спрем на това от какво се състои инфантилизацията\n[618.28s] включително и някой капани за избягване.\n[621.58s] Преживяванията на Доминик в банята демонстрират друг аспект на инфатализацията:\n[626.48s] постоянното въздържане от доверие.\n[628.86s] Знанието, опитът и уменията са постоянно отхвърляни.\n[634.32s] Предполага се че те не могат да се справят с нищо.\n[637.2s] На нейния Рожден ден ставайки на 30 и който организиран от леля й\n[640.92s] Ингрид казва че иска да направи групова снимка.\n[644.19s] Баща й и казва да даде камерата на него\n[647.2s] —тя е обречена да го направи погрешно (мисли си той)\n[649.6s] По късно когато тя започва да реже тортата\n[652.29s] баща и грабва ножа от ръцете й и започва да реже\n[655.56s] казвайки и каква бъркотия е направила.\n[658.3s] Каквото и да се опита да направи\n[660.15s] да отвори шампанско, да пусне музика, да организира игри...\n[664.82s] Той се намесва и я спира.\n[667.58s] Много жертви на инфантилизация са подложени\n[670.22s] на безмилостно омаловажаване каквото и да се опитат да правят.\n[673.46s] Очакваният резултат е винаги провал са мислите на Инфанализиращите\n[676.92s] Които също искат, техните жертви да спрат да се опитват да правят нещо.\n[682.0s] Това е само изпълняващо се пророчество.\n[685.4s] Спиране на жертвите от опитване ги спира от това и да се научат на нещо\n[689.2s] което от само себе си ще довежда до още провали\n[691.34s] което пък после се използва за спиране на жертвата от опитване.\n[695.56s] Ироничното, е че Ингрид е много по способна и\n[698.32s] завършена личност от нейния баща.\n[700.82s] Но като много жертви, тя трябвало да добие своите умения и опит\n[704.94s] другаде, далече от нейния насилник.\n[708.02s] Нейните възможности и талант не се признават.\n[711.06s] И в редките случай в който се осмелява да демонстрира своята опитност\n[713.54s] то просто се отхвърля като случайност, единичен случай.\n[716.38s] По същия начин обширните таланти на хора\n[719.06s] който са част от тези инфантилизиращи религиозни и политически групи\n[722.17s] биват незабелязани защото в тези групи те се приемат като\n[725.84s] подчинени човешки същества.\n[728.65s] Те биват отхвърляни от ръководни роли и позиции\n[732.88s] и се ограничават до слугински задачи.\n[735.98s] Не е и случайност факта че тези групи са често ръководени от некомпетентни глупаци.\n[741.72s] Понякога, поемането на грижата от високопоставения, е подмолно прикрито като загриженост.\n[747.18s] 25-годишният Николай отлита на почивка в курорта, за да се срещне с родителите си.\n[754.06s] На първата сутрин той казва че отива да поплува в морето.\n[758.19s] Неговата майка се впуска в театрални изпълнения\n[761.2s] настоявайки неговият баща да е със \"силния плувец\", да не вземе да се удави.\n[766.23s] В крайна сметка, за да я успокои, той и баща му отиват на плажа, където Николай не получава никакво удоволствие от плуването,\n[773.63s] осъзнавайки недоволството на баща си и неговото собствено.\n[777.84s] Това е много познато преживяване.\n[781.16s] Майката на Николай обосновава постоянните си унизителни интервенции с вида на мъченичеството на майката, зая��явайки:\n[788.247s] \"Не мога да спра да се грижа. Аз съм майка!\"\n[792.46s] Но докато тя безкрайно \"се грижи\", тя никога не помага.\n[797.001s] Всъщност, тя не е била наясно с нуждите на Николай от самото му раждане.\n[803.76s] И в последствие се разбира че има сериозно разстройство на личността\n[808.523s] и никога не е чувствала нищо дори близо до майчината любов.\n[812.08s] Така че нейната така наречена помощ винаги е създавала проблеми.\n[816.143s] и, винаги когато е била необходима истинска помощ\n[818.895s] тя винаги намирала извинения и бягала.\n[823.1s] Нейните пристъпи на инфантилизираща грижа били просто карикатурни изпълнения\n[827.94s] на майчината любов в нейното разбиране.\n[830.96s] Освен че се опитва да получи признание за себе си, за това, че е \"грижовна майка\",\n[835.82s] тези изпълнения осветяват друг елемент на инфантилизация,\n[839.7s] откриван в много области на тормоз.\n[842.74s] Жертвите са обучени да се страхуват от външния свят.\n[846.938s] Членове на религиозни организации са предупреждавани\n[849.683s] че светът е обхванат от зли свръхестествени същества.\n[853.4s] Политическите пропагандатори се учат да виждат нечленове като врагове или съучастници на злото.\n[860.089s] Гражданите се приспособяват към разделящата параноя от корумпирани правителства.\n[865.0s] Внушението на страх има за цел да привлече жертвите\n[868.55s] със съобщението \"Аз ще се погрижа за вас\"\n[871.497s] насърчавайки доброволното отхвърляне на свободите\n[874.19s] и да се попречи на жертвите да изследват свят,\n[876.95s] който могат да намерят разнообразен, красив и привлекателен.\n[881.18s] Като резултат членовете на тези групи\n[884.73s] обграждат себе си във балони с еднакви възгледи\n[887.86s] блокирайки и избягвайки несъгласни мнения.\n[891.075s] Гражданите предлагат неограничен достъп до личните си данни на правителства и корпоративни гиганти\n[896.22s] с детинското доверие, че това е, в техен най-добър интерес.\n[901.7s] И децата, които порастват без да осъзнават каквато и да е небрежност\n[906.55s] или които нямат възможност да развият подходящи умения за самоуправление,\n[910.55s] включително възможността за справяне с конфликти\n[913.19s] без да се обръщат към външни компетентни лица, така че те да се намесят и да получат справедливост.\n[919.3s] Хронично омаловажаващата природа на инфантилизацията\n[923.22s] я отличава от автентичното покровителство и грижа.\n[927.96s] Здравите родители не омаловажават потомството си.\n[931.3s] Здравите партньори не се омаловажават един друг.\n[933.96s] Те не използват неуспехите на близките си за да ги засрамят\n[937.08s] или да ги лишат от възможността за по-нататъшни опити.\n[940.4s] Те разбират, че чрез преодоляване на проблемите ние се развиваме.\n[944.66s] Здравите групи не ограничават контакта с нечленове.\n[948.56s] Те разбират, че други възгледи\n[950.89s] включително критични възгледи\n[952.98s] —като неуспехите—  могат да бъдат важни източници за развитие.\n[957.14s] Обидният характер на инфантилизиращото покровителство също се разкрива в действия срещу хора, които се опитват да го избегнат.\n[966.86s] Реакциите под формата на емоционално изнудване, кампании за дискредитиране, отчуждаване, заглушаване, дори заплахи за насилие\n[974.54s] ясно показват от кого жертвите наистина трябва да се защитават.\n[978.564s] Друга инфантилизираща тактика, маскирана\n[981.176s] като положителна  е постоянното потапяне в идеализираното минало.\n[986.56s] Всеки път, когато 36-годишният Тай говори с майка си\n[990.04s] тя задейства същия дълъг сценарий.\n[993.04s] С глас, като за приказки преди лягане, тя разказва мътните спомени,\n[997.54s] които припомняли стотици пъти, за ранното му детство.\n[1001.84s] Историите са осеяни със повтарящите се фрази:\n[1005.46s] \"Защо трябваше да пораснеш?\"\n[1007.82s] \"Винаги ще си останеш моето малко бебе.\"\n[1010.82s] Тай не помни нито един от тези стари спомени\n[1013.368s] и постоянното слушане на техните повторения\n[1015.647s] го карат да се чувства отдалечен от майка си и изолиран.\n[1019.3s] Сякаш животът му е спрял, когато е бил на три години\n[1023.11s] в началото на това, което майка му нарича \"трудни години\"\n[1026.319s] това е когато започва да се развива като независима личност.\n[1030.88s] Те със сигурност са били трудни за Тай\n[1033.14s] чиято нарастваща независимост била посрещната с ярост, мълчание и отчуждение\n[1038.73s] включително изгонване от къщата за няколко часа,\n[1041.75s] и оставен да се скита по улиците.\n[1044.515s] Десетилетия по-късно, все още не желае да признае нейният син\n[1047.839s] като независим човек, тя продължава да се опитва\n[1050.98s] да го върне в първите три години, когато се чувствала център на неговата вселена.\n[1058.46s] Много насилници многократно разказват няколко мал��и добри моменти,\n[1063.38s] опитвайки се да блокират години на злоупотреба, които истински характеризират връзката\n[1068.78s] и потопят жертвата си в изкуствена мъгла от фантазия.\n[1073.36s] Трезвата оценка за това колко малко добри моменти всъщност са били,\n[1077.38s] дава ясна индикация за това колко малко добри моменти ще дойдат по-нататък.\n[1082.58s] При инфантилизация спомените за беззащитност и уязвимост\n[1087.14s] са специално подбрани, за да поставят жертвите обратно в това психологическо състояние.\n[1093.52s] Друг чест признак на инфантилизация\n[1096.14s] е, че сексуалността на жертвата е отречена или препятствана.\n[1100.297s] Когато Лео и неговият партньор са поканени\n[1102.6s] да прекарат уикенда в дома на родителите му\n[1104.98s] баща му му казва, че ще трябва да спят отделно.\n[1108.42s] Това правило не важи за никой друг.\n[1111.64s] Организирането на места за спане по време на семейни посещения е бойно поле за много хора.\n[1116.876s] Възрастните се третират като невъзпитани тийнейджъри каквито всъщност не са, и не им позволяват да спят със собствените си партньори.\n[1123.6s] Авторитарните религиозни и псевдонаучни групи\n[1126.26s] често се опитват да възпрепятстват или потискат сексуалността сред своите членове.\n[1131.0s] Мастурбацията често е забранена.\n[1133.441s] Лидерите на групи като Свидетелите на Йехова и Мормоните си позволяват да налагат на двойките какъв вид секс могат и не могат да имат\n[1143.045s] Тези интервенции са предназначени да научат жертвите, че дори и в най-частните аспекти на техните взаимоотношения и телата им, те остават под царско управление.\n[1154.66s] Когато се занимавам с клиенти като Лео, които изпитват родителска намеса в тяхната сексуалност, предлагам следната хипотетична ситуация.\n[1163.62s] Представете си това, когато посещавате родителите си\n[1166.409s] преди да ви бъде позволено да влезете, вие и вашият партньор\n[1169.48s] ще трябва да се съгласите да ви ударят и двамата по лицето.\n[1173.34s] Колко вероятно е да ги посетите?\n[1177.32s] Стандартният отговор е \"Не е много вероятно\".\n[1181.131s] Следващият въпрос е следният:\n[1182.92s] Как се различава от това, което родителите ви вече ви причиняват?\n[1187.0s] Родителите, които настояват за отделни легла за децата си и техните партньори,\n[1190.695s] им казват, че връзката им е невалидна\n[1194.4s] че има нещо неприемливо в нея\n[1196.82s] което я лишава от уважение.\n[1200.041s] Когато потомството се подчинява на тези интервенции\n[1202.7s] те потвърждават собствената си невалидност.\n[1207.1s] Те позволяват на себе си и на партньорите си\n[1209.72s] да бъдат удряни по лицето.\n[1212.64s] Винаги ще зависи от потомството и техните партньори\n[1215.875s] да решат какви интервенции са готови да търпят и толерират\n[1218.85s] от родителите си и родителите на партньора си.\n[1222.572s] Както и трудещите се трябва да решат какви интервенции\n[1225.14s] са готови да понесат от своите работодатели;\n[1227.503s] граждани от техните правителства;\n[1229.82s] религиозни последователи от техните религиозни лидери.\n[1233.16s] Но последиците от даването на обезсилващи сили\n[1236.9s] не са за подценяване.\n[1239.4s] Когато се държим като покорни деца\n[1241.837s] нашите емоции и мисли се приспособяват към това.\n[1244.7s] Ние се чувстваме и мислим като покорни деца.\n[1247.88s] Ние регресираме към скромна, понижена и очакваща разрешение позиция,\n[1252.74s] по-скоро надявайки се на уважение, отколкото очаквайки го.\n[1257.08s] Като ставаме все по-малки, ставаме по-уязвими към по-нататъшни посегателства.\n[1262.12s] По същия начин, когато реагираме като възрастни\n[1264.94s] тогава се чувстваме и мислим като възрастни.\n[1267.7s] Ние действаме от еднаква позиция\n[1270.18s] и ясно даваме да се разбере, че очакваме уважението, на което имаме право, от любимите си хора.\n[1275.86s] Преди посещението си Лео, даде на баща си\n[1278.5s] някои шансове да преразгледа позицията си.\n[1281.5s] Три пъти той обяви, че той и партньорът му ще спят заедно.\n[1287.52s] След третото отхвърляне на тази идея Лео каза, че повече няма да идват.\n[1294.075s] Когато решимостта на Лео стана очевидна, баща му беше принуден да промени решението си и да приеме условията му.\n[1300.72s] Лео избягва няколко чести капани, в които жертвите попадат,\n[1304.1s] докато очертават границите с инфантилизиращите хора.\n[1307.672s] Един капан е да се опитате да аргументирате позицията си на инфантилизиращ индивид\n[1311.832s] или да обясните защо заслужават уважение.\n[1315.28s] Но жертвите не трябва да изтъкват причини,\n[1317.66s] поради които трябва да бъдат третирани с основно уважение.\n[1321.18s] Вариация на този капан е договаряне за уважение.\n[1325.539s] Някои жертви се опитват да предложат някаква отстъпка или компромис\n[1329.598s] за да спечелят основно уважение.\n[1332.28s] Но това просто ги държи в позиция на загуба.\n[1335.64s] Те дават безплатно уважение, но плащат за уважението, което получават.\n[1340.84s] Друг капан е блъфирането.\n[1343.009s] Когато жертвите обявят какво ще се случи, ако се постъпи несправедливо с тях,\n[1346.5s] те трябва да са готови да приложат обявените последствия.\n[1350.5s] За да бъдат взети на сериозно, жертвите трябва да се държат сериозно.\n[1354.72s] Последен капан, който си струва да се спомене е загубата на контрол.\n[1359.161s] Колкото и депресиращо да е да се подложите на инфантилизация,\n[1362.249s] изливането на емоциите само отговаря на очакванията на насилника\n[1365.45s] и подсилват детския образ, които те имат в техните представи.\n[1370.46s] Гневът е много полезно емоционално гориво\n[1373.76s] когато се използва целенасочено.\n[1375.92s] И за много жертви това играе огромна роля за прекратяване на малтретирането им.\n[1380.8s] Гневът може да ни вдъхнови; да укрепи нашата решителност.\n[1384.62s] Има дори доказателства, че може да изостри нашите умения за обработка на информация.\n[1389.56s] В своя документ от 2007 г. „Мисли трезво, когато ти причернее“\n[1393.72s] Уесли Муун и Даян Маки откриха, че ядосаните индивиди\n[1397.12s] били по-склонни да разграничават слабите и силни аргументи\n[1401.049s] отколкото индивиди в неутрално настроение\n[1403.659s] и че гневът насърчава аналитичната мисъл\n[1407.04s] дори при лица, които нямали силни аналитични склонности.\n[1412.02s] Но когато гневът стане неконтролируем\n[1414.559s] неговият конструктивен потенциал се превръща в разрушителен потенциал\n[1418.96s] който може да повлияе отрицателно на жертвата.\n[1422.3s] Всички тези грешки произтичат от една и съща основна грешка —\n[1426.28s] жертвите преувеличават значението на уважението от техните насилници.\n[1430.02s] Искайки уважението им, те дават своето разрешение на насилниците да се държат надменно с тях.\n[1434.549s] Когато жертвите насочат фокуса си навътре към своето собственото си самочувствие\n[1438.823s] често има естествена промяна.\n[1441.255s] Те престават да се държат като хора от втора класа\n[1444.389s] и започват напълно да овладяват своето пространство за възрастни.\n[1448.54s] В по-леки случаи, когато няма дълбоки душевни рани\n[1452.28s] трайната съпротива понякога може да разклати\n[1455.86s] инфантилизиращите индивиди от тяхното заблуждаващо поведение\n[1459.94s] въпреки че си струва да се подготвите за някои последващи отстъпления\n[1463.08s] и удвояване на съпротивата в някои случаи.\n[1465.58s] Но в злокачествения край, където индивиди и групи\n[1469.21s] са вкоренени в дълбоко изкривени фантазии на властта\n[1472.96s] е време да помислите за създаването на сериозни лично разстояние\n[1476.42s] намаляване или прекратяване на контакта.\n[1480.332s] \"Пораснал човек не може да бъде нечий питомец\" — Шелдън Коп\n[1488.34s] В много религии — със сигурност в авраамските —\n[1491.58s] Инфантилизацията е вътрешно изтъкана в централната Божествена концепция.\n[1496.82s] Божият характер, описан в библейските митове за сътворението,\n[1500.24s] създава неизмеримо по-низши същества, наречени хора,\n[1504.88s] които са възпрепятствани да постигнат някога\n[1506.9s] познаването, уменията или разбиранията на Бога.\n[1510.78s] Хората умишлено се държат в неведение\n[1513.289s] и са длъжни да се подчиняват без да се замислят.\n[1516.931s] Библейският мит за сътворението излага това отслабено инфантилизирано състояние\n[1521.509s] като съвършенство, чистота, невинност.\n[1526.06s] Това невинно състояние е почитано като върха на идеала на човешкото съществуване.\n[1530.92s] И тази невинност след това е подложена на невъобразимо насилие.\n[1534.74s] В мита за сътворението Божият герой създава райска градина, наречена рай,\n[1539.24s] и създава първия човек, Адам, за да се грижи за него.\n[1543.1s] След това създава първата жена, Ева, за да бъде асистент на Адам.\n[1547.62s] И двамата са оставени да се разхождат из градината,\n[1550.74s] където им е позволено да ядат плода на всяко дърво.\n[1553.62s] С едно странно изключение.\n[1556.3s] Богът избира Райската градина\n[1558.5s] като мястото за две магически дървета:\n[1561.54s] дървото на живота и дървото на познанието на доброто и злото.\n[1565.929s] Той инструктира Адам и Ева да не ядат от второ от тези дървета\n[1569.35s] предупреждавайки ги, че ще умрат, ако това се случи.\n[1572.3s] Но всичко е наред. Той ги е създал невинни.\n[1575.68s] т.е. невежи, неопитни и покорни.\n[1580.38s] Какво може да се обърка?\n[1581.98s] Е, почти всичко.\n[1584.42s] Говореща змия, описана по различен начин: коварна и хитра\n[1589.22s] казва на невинната Ева, че няма да умре, ако тя яде плодовете.\n[1593.38s] Вместо това тя ще стане мъдра, като Бог.\n[1597.78s] Тя яде и убеждава Адам да яде.\n[1600.98s] Думите на змия��а се оказват верни, те не умират и придобиват мъдрост.\n[1606.46s] В знак на изгубената си невинност, те се обличат с листата.\n[1611.42s] След това богът ги наказва за неподчинение\n[1614.519s] прогонва ги от Рая, преди да могат да ядат, плодът на друго магическо дърво\n[1618.59s] — Дървото на живота, което би им дало безсмъртие.\n[1623.28s] Този мит за сътворението илюстрира защо невинността не е нещо, което трябва да се почита.\n[1628.244s] Адам и Ева получиха противоречиви послания, за които не бяха подготвени.\n[1634.18s] Когато змията каза, че няма да умрат.\n[1636.12s] Тя имаше предвид просто яденето на плода няма да ги убие веднага.\n[1640.56s] Когато богът каза, че ще умрат, когато се хранят от дървото\n[1643.84s] той имаше предвид, че той лично ще осигури смъртта им в бъдеще.\n[1648.504s] В действителност, неговата умишлено объркваща формулировка е причинила целия проблем.\n[1654.109s] Можем надеждно да го наречем умишлено объркващо,\n[1656.839s] защото като всезнаещо божество той щеше да знае\n[1659.94s] как Адам и Ева щяха да го тълкуват погрешно.\n[1662.9s] Той щеше да знае, че ако просто им беше казал,\n[1665.259s] той ще ги прогони и ще ги остави да умрат.\n[1667.429s] Изявлението на змията не би било в конфликт с неговото.\n[1670.68s] И разбира се, знаеше, че нямат способността.\n[1673.76s] Да обработват противоречивата информация, която са получили.\n[1677.48s] Те бяха наказани, защото се провалиха на теста, които е създаден, за да се провалят.\n[1682.78s] Отговорността за този провал е изцяло Божия.\n[1686.26s] Ако искаше да запази човешката невинност\n[1689.34s] щеше да създаде условия,\n[1691.64s] при които тя никога нямаше да бъде нарушена.\n[1694.54s] В Библейската митология всемогъщият, всезнаещ Бог\n[1699.46s] е напълно способен да създаде такива условия,\n[1702.1s] ако наистина го е искал.\n[1704.3s] След като създаде цяла вселена, той може да постави магическите си дървета извън обсега на някоя далечна планета.\n[1712.14s] Всъщност няма обяснение защо дърветата трябваше изобщо да съществуват.\n[1716.26s] Той може да направи хората неспособни да общуват с никого, освен с него.\n[1721.02s] Ако искаше да запази невежеството им\n[1723.37s] можеше да ги създаде без любопитство.\n[1726.46s] За всезнаещо всемогъщо божество\n[1729.169s] ще има много прости и очевидни мерки\n[1732.1s] за да се избегне застрашаване на човешката невинност.\n[1735.58s] Фактът, че нито една от тези мерки не е била приложена\n[1738.14s] показва глупост, некомпетентност, небрежност или активен садизъм.\n[1745.7s] За разлика от митичния Бог на Библията\n[1748.119s] хората нямат магическа сила\n[1750.24s] да създадат среда, където невинността може бъде запазена.\n[1753.82s] И все пак мнозина все още се покланят на невинността\n[1757.019s] все още се опитват да я запазят в децата си\n[1759.42s] и все още ги наказват за светското знание.\n[1762.64s] Катастрофалният резултат е, че безброй деца\n[1765.98s] които са държани в състояние на невежество и неопитност\n[1769.0s] остават уязвими към експлоатация\n[1771.92s] — отличен пример са децата на които не е предадено\n[1774.16s] познание за секс или сексуалност\n[1776.52s] и стават лесна плячка за насилниците.\n[1780.36s] Тази комбинация от отричане на сексуалността\n[1782.86s] и почитането на невинността е особено отровна.\n[1787.06s] В училище една от приятелките на 14 годишната Ясмин\n[1789.927s] носи едно от старите копия на майка си на списание \"Плейгърл\".\n[1793.3s] Те се кикотят на снимките на мъже.\n[1796.19s] Приятелката на Ясмин откъсва една страница за нея и й я подарява.\n[1799.24s] Тя я крие под леглото си.\n[1801.489s] Един ден се връща от училище, тя открива че снимката изчезнала.\n[1805.52s] Майка й идва по-късно размахвайки същата снимка.\n[1809.64s] Тя я разрязва наполовина, разкъсва тялото и оставя главата.\n[1814.9s] Тя заплашва да я покаже на бащата на Ясмин.\n[1817.62s] — за да знае колко е покварено малко момиче.\n[1820.98s] Тя продължава да дразни с тази заплаха дъщеря си\n[1824.16s] държейки Ясмин в постоянно състояние на срам, страх и тревога.\n[1829.64s] Изнудването спира само когато майка й по невнимание\n[1833.5s] разкрива къде е скрила снимката, и Ясмин събира смелостта да я унищожи.\n[1839.68s] Много години по-късно, борейки се със суровите проблеми с доверието и срама\n[1844.22s] Ясмин напомнила на майка си за този период за изнудване когато била тийнейджър.\n[1848.56s] Майка й казала, че просто не може да приеме факта, че бебето й е пораснало.\n[1852.644s] Тя искала Ясмин да остане нейното сладко малко момиче завинаги.\n[1858.7s] Друга черта която инфантилизирани семейства и религии споделят\n[1862.22s] е практиката да се налага безкрайно чувство за дълг.\n[1866.82s] Някои родители се опитват да получат благодарност с фразата: \"Ние ти дадохме живот!\"\n[1871.28s] Сякаш са ти направили услуга.\n[1873.46s] Не са.\n[1875.18s] Преди зачеването си не сте били някаква потенциална личност, която чака своя час,\n[1878.36s] надявайки се да се роди.\n[1881.4s] Нямало те е.\n[1883.36s] Раждането ти не е подарък за теб.\n[1885.84s] Това е подаръкът от родителите към самите тях.\n[1888.43s] Те са си направили бебе.\n[1890.86s] Да поискаш благодарност за подаръка, който си дал на себе си, е абсурдно.\n[1895.88s] Инфантилизиращите религии учат последователите как да бъдат благодарни за живота си, на техния Бог.\n[1903.16s] Но отново, ако някой от тези богове съществуват\n[1906.14s] тогава няма за какво да им благодарим.\n[1908.9s] В авраамската митология бог не дава живот на хората.\n[1913.82s] Той си подарил хора, за да си ги управлява.\n[1917.86s] Той си подарил империя.\n[1921.3s] В акта на раждане или сътворение няма за какво да бъдете благодарни.\n[1925.92s] Това е напълно егоистичен акт от страна на родителя.\n[1931.0s] Само това, което родителите правят за децата си след раждането, има значение.\n[1934.8s] И дори тогава, много неща, които често се характеризират като подаръци за детето,\n[1939.87s] всъщност са задължения на родителите.\n[1942.74s] Това не е подарък за децата да ги хранят, да ги обличат,\n[1946.46s] да им дават подслон, да ги защитават, да ги отглеждат.\n[1950.12s] Това са просто основни отговорности, които родителите са поели\n[1952.94s] когато са решили да имат деца.\n[1955.56s] И дори тези основни потребности не се изпълняват от божествени герои, които очевидно липсват.\n[1964.1s] Подаръците по дефиниция се дават безплатно.\n[1967.78s] Опитвайки се да вкарваш чувство за постоянен дълг\n[1970.8s] доказва липсата на родителски дарби.\n[1974.52s] Това също така показва много манипулативно мислене.\n[1978.14s] В здрави отношения хората не се опитват да се хванат в капан едни с други\n[1981.94s] с вина, отговорности или дълг.\n[1984.82s] Те са заедно, защото се харесват и обичат.\n[1988.68s] Ще завърша с още един знак: използването на омаловажаващ език.\n[1993.78s] Набелязаните жертви често биват назовавани с умалителни имена\n[1996.98s] или термини, които намекват за незрялост като \"млади господине\" или \"млада госпожице\".\n[2002.36s] Подобно на други аспекти на инфантилизацията, контекстът се определя от поведението.\n[2007.4s] Когато действията са приятелски настроени и уважителни, тогава няма уловки.\n[2011.74s] Когато действията са снизходителни и омаловажаващи, думите стават заредени с скрит помисъл\n[2016.84s] В религиозните групи инфантилизиращият език\n[2019.36s] понякога формално се вгражда в длъжности.\n[2022.88s] Деноминация като Християнската, в която бях насилствено въведен като дете\n[2026.52s] се учат да се обръщат към свещениците като „баща“\n[2029.54s] — недвусмислено инфантилизиращ термин.\n[2033.18s] Извращението на тези родителски и детски отношения се подчертава,\n[2036.88s] когато по-възрастните енориаши наричат младите свещеници \"баща\".\n[2041.28s] Лично аз избягвах да използвам това име.\n[2044.08s] Наричах свещениците \"викарий\".\n[2047.26s] Титлата \"баща\" ми изглеждаше неестествена, поради причини, които не можах да опиша в този момент.\n[2052.92s] Сега мога да ги определя.\n[2055.159s] Бях инструктиран да се отнасям към тези абсолютни непознати, сякаш бях техен син,\n[2060.76s] прескачайки установяването на лични взаимоотношения и изграждането на някакво доверие.\n[2067.178s] По същия начин, както при \"Небесния Отец\"\n[2069.6s] тези неща се очакваше да се случат магически, да се появят от нищото.\n[2074.48s] Но, не се появиха.\n[2076.5s] Това е небрежно отношение към много важен инстинкт за оцеляване\n[2080.139s] когато отслабваме естествената детска бдителност към непознати.\n[2085.239s] Някои религиозни текстове се спускат до животински образи,\n[2088.84s] сравнявайки последователите със стада овце, водени от овчари.\n[2093.78s] Като дете си спомням, че се отвращавах от този обиден образ.\n[2098.58s] Но сега е ясно, че това е много по-подходящ образ от майчиния и детския език.\n[2103.62s] Овчарите не се грижат за овцете от доброта или любов.\n[2107.46s] Те се грижат за овцете, докато са полезни\n[2109.84s] в случая на овцете, полезни за вълна, месо и печалба.\n[2114.06s] Истината на тази метафора е изпитана\n[2116.62s] от милиони хора, отглеждани в религиозни общности\n[2119.52s] които осъзнават, че тяхното значение се дължи на тяхната полезност,\n[2123.1s] и който открили, че тези сурогатни семейства\n[2126.08s] които \"с любов\" ги защитават от знанието и опита\n[2130.02s] биха били щастливи да се отърват от тях в мига когато тяхната полезност се изчерпала.\n[2140.78s] Инфантилизацията често идва маскирана\n[2143.58s] като любов, привързаност, игривост, защита.\n[2148.94s] Но когато тези неща са истински\n[2151.1s] не ни оставят да се чувстваме задушени, изтощени, парализирани.\n[2157.16s] Те не ни оставят зависими, т��евожни и невротични.\n[2161.52s] Ако чувстваме нещо от тези неща, това е знак че е време за проверка на реалността.\n[2166.78s] Не можем да изберем общността, в която сме родени.\n[2169.82s] Но можем да изберем общността, в която ще продължим да бъдем.\n[2173.112s] В повечето ситуации от реалния живот, разказани тук,\n[2175.64s] инфантилизираните деца в крайна сметка защитиха свободата си,\n[2179.74s] като не осъществяват контакт или минимален контакт със строги граници.\n[2185.18s] Няколко души трудно реализираха наученото в действия,\n[2190.34s] и все още позволяват изтощително ниво на контакт с техните обезкуражаващи родители.\n[2195.8s] Инфантилизираните жертви често се примиряват с прекалено много изисквания\n[2198.98s] за контакт със техните насилници\n[2201.86s] изтощителни ежедневни телефонни разговори и дълги посещения.\n[2207.14s] Те са обучени да дават на насилниците си по-голямата част от личното им време\n[2210.38s] колкото си искат насилниците, когато си поискат.\n[2214.72s] Ограничаването на контакта често допринася за много други положителни промени.\n[2220.18s] Със големи времеви интервали сложени на място\n[2222.54s] насилниците имат по-малко шансове за нарушаване на границите поставени от жертвите\n[2225.924s] защото жертвите вече не са там.\n[2228.48s] Известно време отделени може да помогне за предпазването от инфантилизиращи навици\n[2232.34s] и укрепването на нови навици за зрели хора.\n[2235.68s] Много жертви се борят с въпроса за доколко време контактът е разумен.\n[2240.24s] Дали 5 минутно телефонно обаждане е твърде малко?\n[2242.86s] Може би 15 минути е по-разумно?\n[2245.54s] Подобни засилени разсъждения на жертвите показват, че те очакват осъждане.\n[2251.42s] За да се измъкнат от това състояние на ума\n[2253.82s] е полезно за жертвите да се научат на навика да си представят\n[2257.1s] как те биха отговорили, ако им се гарантира липса на осъждане.\n[2260.8s] Ако знаеше, че няма да бъдеш упрекван за това\n[2264.66s] колко контакти би искал да имаш с този човек?\n[2269.1s] Каквото и да отговорите отговора е разумен.\n[2272.7s] Поставянето на въпроса по този начин разкрива нашите истински чувства.\n[2277.68s] Да бъдем нащрек срещу манипулативните тактики на инфантилизацията\n[2281.82s] не означава, че трябва да отхвърлим всичко детско.\n[2285.48s] Ние сме сбор от всички наши преживявания\n[2288.34s] преживяванията на нашето детство, нашата младост и нашият зрял живот.\n[2293.77s] Няма нищо нездравословно в това да се върнеш към миналото с любов\n[2297.29s] игри, книги, телевизия и филми, на които се радвахме в нашето детство.\n[2301.75s] Музиката за това видео е хоровата версия от песен която заобичах толкова много.\n[2305.94s] Откакто я чух по един касетофон, когато бях на пет:\n[2310.58s] Camille Saint-Saëns’s ‘Кукувицата в дълбините на гората’.\n[2314.156s] Да пораснеш не означава да се откажеш от миналото си, а по-нататъшен растеж въз основа на него.\n[2318.729s] Да се развиеш и обогатиш с опит.\n[2323.52s] Няма нищо нездравословно в удоволствието от детската привързаност\n[2327.82s] и игривост в нашите възрастни отношения.\n[2331.02s] Проблемът възниква, когато връзката работи\n[2333.92s] с принуда на това \"детско\" ниво.\n[2337.98s] Осъзнаване на фините и хлъзгави елементи на тази принуда\n[2342.14s] и разбиране на разликата между грижата и изолацията\n[2345.605s] — това са първите стъпки в освобождаването от инфантилизационната клетка.\n[2355.222s] Този канал изследва проблемите около догмата, манипулацията и злоупотребата. Голяма благодарност на всеки, който подкрепя тази работа."}'
