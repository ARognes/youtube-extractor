сякакви останки от предишната монархическа среда.\n[346.8s] Когато идвате от положителна семейна среда като тази\n[349.84s] е понякога трудно да си представите безбройните семейства\n[352.98s] където родителите стават вечните диктатори, мързеливи с тяхната сила.\n[357.48s] Където ролите са разменени и децата се използват\n[359.88s] да задоволят, незадоволени нужди и фантазии и неразрешени проблеми.\n[366.24s] Възрастване (преждевременно израстване) се случва когато детето е преждевременно възложено със\n[369.78s] задължения и отговорности които са за възрастен човек за който детето не е подготвено.\n[373.8s] Възрастването поставя детето във ролята на полу-партньор\n[377.36s] отваряйки вратата към емоционално ако не и физическо кръвосмешение.\n[382.64s] Възрастването описва смяна на ролите\n[385.8s] в които от детето се очаква да се грижи за родителя.\n[389.78s] Като всички измамни схеми на лошите родители\n[392.78s] инфантилизацията произлиза от отказ\n[394.88s] за признаването на детето като напълно\nотделен човек.\n[399.6s] Инфантилизацията е атака от няколко страни.\n[403.12s] Появява се по най-различни начини\n[405.78s] като всеки един е предназначен да подкопае, да обезкуражи някои аспекти на индивида\n[409.24s] които придават статус на зрял човек.\n[412.08s] Един пример е отказът за признание на възрастови граници, подходящи за определена възраст.\n[416.94s] Въпреки че 8 годишният Доминик неведнъж казваше\n[420.14s] че той е достатъчно голям да се къпе самостоятелно\n[422.2s] неговият баща продължавал да го къпе.\n[425.06s] Накрая Доминик поема нещата в свой ръце и решава да се изкъпе сам.\n[429.66s] Откривайки вратата на банята заключена, неговият\nбаща побеснява\n[433.61s] и казва че ако Доминик не се нуждае от помощта му\nпри къпане\n[436.47s] то тогава той няма да му помага за нищо никога повече.\n[439.849s] Доминик е подложен на продължително мълчание и намръщен поглед.\n[443.98s] Този пример от реалния живот илюстрира сценарии без печеливши страни, който