transcript: A lot of you guys have asked if I'm scared. I think like I have a healthy amount of concern. I would say concerned about things more than scared. I'm much more excited than I am scared. I think in the beginning I was absolutely terrified for the first month because I had planned my whole year in a way that did not accommodate me being pregnant or having a child. And it scared me that I was making all these changes to my life. How's that going to affect my business, my life, just everything, my perception of myself. There's a lot of unknowns and a lot of things that are outside of your control with pregnancy, which is different than business. Business that feels like I can control a lot of aspects of what happens, whether that's an illusion or not. So, it's definitely a different feeling in that regard. But like scared to have a kid, no. I have a lot of trust in myself. There's a lot of situations that I've been in in life where I've been facing something that's unknown or that I'm not I don't have experience with. And like I just trust myself to figure it out.
