transcript: "\U0001F4D8 AI can write your code. It can't tell your story. Behavioral interviews are the new differentiator, and I wrote the book on them: https://geni.us/BehavioralInterview-yt\n\nDhruv is an L5 engineer at Amazon with five and a half years of experience — and he's doing what 90% of smart engineers do in interviews: telling stories that sound great to him but get him down-leveled.\n\nSteve Huynh, a former Amazon principal engineer who conducted nearly a thousand interviews as a bar raiser, coaches Dhruv live on the three things holding him back: decoding what the interviewer is actually asking, picking stories that land at L6, and packaging them so the interviewer can capture his signal before the debrief.\n\nCHAPTERS:\n00:00:00 - The 3 Mistakes That Get Smart Engineers Down-Leveled\n00:01:15 - What They're Really Asking About Conflict\n00:05:36 - Answering at the Wrong Depth\n00:06:00 - The Pyramid Framework\n00:07:00 - What Question Scares You Most?\n00:08:23 - When Escalation Is the Wrong Move\n00:09:27 - Disagreeing With Your Manager\n00:14:00 - Strong Opinions Weakly Held\n00:30:47 - Your Biggest Interview Advantage\n00:38:20 - Tell Me About a Time You Helped a Struggling Coworker\n00:40:09 - Getting Lost in the Philosophy\n00:41:14 - Context Can Wait\n00:58:00 - Tell Me About a Problem You Solved by Going Deep\n01:05:08 - The Amazon Ireland Launch\n01:08:51 - Front-Load the Entire Story\n01:22:57 - What's Your Biggest Weakness? How to Answer Without Deflecting\n01:25:49 - Dhruv Tries the Weakness Answer LIVE"
