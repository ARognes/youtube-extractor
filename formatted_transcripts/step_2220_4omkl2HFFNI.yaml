transcript: Hi, today is the ending of a story and the beginning of a new one. Three days ago, there was a solar eclipse. People throughout the ages have thought that a solar eclipse pretends an upheaval, an ending of something, the beginning of something new, a changing of the established order. Well, something shifted inside me about three days ago. A big shift. I realized that one story in my life is ending. And that story is part to do with this YouTube channel. For the last two years, I've been exploring um ideas and well really questions. Questions that have been with me my whole life. Some of them for my whole life and some for my adult life. Questions that really permeated my existence in a way plagued me. The questions are, why does my mom hurt me when she says she loves me? Why do I hurt myself? Why do I not trust myself? How can I love myself and trust myself and take care of myself in the way I need to be taken care of? Th those were questions that's been with me since I was a child. No, since I've been an adult. There have been questions in a very similar vein. Why do we collectively hurt ourselves and all the other living beings we share the planet with? Why do we destroy the life support systems, the ecosystems on this planet, thinking we're somehow separate and can live without them, without a balance with all the other living beings that provide life for us and each other? Why do we do that? Why are we making ourselves go extinct? Why are we choosing that as a choice? How can we live a different way? How can we love ourselves collectively? Not only ourselves, but all the other beings we share the planet with. How can we end this nightmare and dream a different dream? That is the basis of or the essentially the theme of of the first main talking video I made on this channel. The the one I talked about why I left my job. When it comes down to it, that video was talking about ending a nightmare and living a different dream. It was talking about trusting myself. Trusting no loving. Trusting and loving myself. Acting. Doing. Choosing. Being. It was a video about choice, about free will, about the possibility, the possibility of living a life that I want to. Well, I've made a lot of videos since then, over the last two years, and they've all been exploring these questions. All of these questions, the environmental videos, the science videos, the psychology videos, the trying to understand evil videos, the scary stories with Gooby videos. I' I've been exploring these questions and um well it became my job unexpectedly uh for the last two years. Ironically, I made a video about a month ago saying um I was going to go all in. I had turned down job offer to return back to medicine. I said, "I'm going to just make YouTube videos for a living and um live the way I want to." Now, part of that is, I think, true. I I am living the way I want to, but part of it was unexpectedly wrong. [laughter] That's what came with the solar eclipse. I I I was making a series of videos called How to Not Go Extinct. I Baby girl, come back. There's a deadly cliff here, so just making sure she's Hey, come here. Come here. Touch. Come here. Let me hold you. You're too close to the cliff. Here. Okay. Are you hungry? You want some treats? up. Come up here. Here. Have some treats. There's some deadly cliffs. So, I'm I'm just don't want her to go too far. I really appreciate being friends with her and being alive with her. That's part of why I made this channel is to be out here in the beautiful mountains with my dog, have her live a happy life, a full life. And I've been doing that. I'm happy I've been doing that. I'm happy I've explored a lot of things. [sighs] Uh but yeah, coming back to the last two episodes, these episodes, how to not go extinct. Well, gosh, you know, how to not go to sync, that sounds pretty complicated. That sounds like that sounds like something that requires a lot of thought. Here's Doobie. You want to say hi? You have anything to say to our channel? The viewers on our channel, a lot of them have said hi to you. I'm going to hold on to you so don't go too far. Okay. Well, how how to not go extinct? That sounds really complicated. I think I thought there was going to be several episodes. I thought it was going to be a whole series like uh help your body heal series that that I think had something like eight or nine episodes. I don't remember. It was a lot. After making the second one, well, first of all, I I I got to say that um I did go all in. I went to places I was afraid to go to. I went I asked I went to I I explored answers to the questions that I was afraid to explore. I said things I was afraid to say. But I felt like I needed to. I needed to go down into the dark caves. I needed to climb up the mountains next to the deadly cliffs like where I am. I needed to do that. I needed to do it for myself. And I did do it. And I made I made those videos. I I the four videos that really stick out to me out of all these like several hundred videos I made. I think I made like 300 videos or maybe 400. Um the four that stick out to me are letting go of being a good person. Um there was one called a text that led to reconciliation and a butt dial that led to a deep sadness. And then the last two videos, How to Not Go Extinct episode 1, diffusing the population bomb and How to Not Go Extinct episode two, starving the psychopaths among us. and within those four videos really sum up my explorations and my answers that I've come to the wisdom that I was seeking for myself. The answers I was seeking for myself. I came across them. I found them. I was actively seeking them and I found them. I uncover them like an artifact, like a fossil that I've been hunting for. And like I I I cleared the dirt off of the fossil. I found what I was looking for. It was amazing. I thought there would be more, but there isn't. As far as how to not go extinct, their answer really is live in balance with all the other living beings we share this planet with and realize that we're not we're not separate. We're we're part of all the living beings. We're this part of this magnificent life on this planet together. Humans are not separate. And there are people among us that don't want to live in balance. And we got to take care of them. take care of them can be taken in a lot of different ways. That's it. That's how to not go extinct. It's actually very simple, but very difficult to put into practice. Or maybe it's not even that difficult. Maybe we just tell ourselves it's difficult. Uh maybe it's actually very easy. Maybe what we're doing right now is very difficult. Maybe the life we're living is extremely difficult. It certainly feels that way. Yeah. Well, I realized I had come to those answers that I was looking for and I had shared them on these videos. So, three days ago, I was thinking, "Oh, wow. I think I made all the videos that all the talking videos that I um that I had set out to do. I had answered the questions that had been permeating my existence my whole life. I answered them for myself." Wow, that was unexpected. It came at an unexpected time. I thought it was going to take years, way more time, but it didn't. It just happened. [laughter] That was deeply unsettling. I was afraid. I was angry. I was I was confused. I didn't know what to do. Yeah. [panting] How could this be it? This is it. What? Okay. Now what? I thought there was more. No, that's it. Yeah, solar eclipse of the soul. Oh, I I was also angry and sad and frustrated because I've been both Duby and I have been cooped up in our apartment um because the forests in these mountains have been on fire and the smoke has been making the air quality very unhealthy. But there's a small window uh this morning uh where the air quality is good before the wind shifts again and blows smoke into where we live. and in the mountains. So, this is like the few hours in the last couple weeks that we have clean air in this beautiful part of beautiful part of the world. I I look forward to the summer so much living up here because the the fall and winter time are just rainy and dark uh and cold uh and the mountains are full of snow. So it's it's treacherous to be up here. So I I look forward to the summertime so much. Um but then this summer because the snow pack was so low uh over the winter it didn't snow much. We were in a drought and all the trees are parched and uh lightning lightning has started so many fires. So that's part of why I've been in a tough place. Um, but I'm out here right now and I was thinking, well, what to do? What do I want to do now? I've I've sorted out what I wanted to sort out. I've explored and figured out what I wanted to figure out. have even shared it on a YouTube video that four YouTube videos that like a lot of people have seen. I I and I'm alive and I'm going to be alive a lot longer maybe. Well, the important thing is I'm alive for right now and I'm with my friend and my wife and my online friends, you all. So, I've I've been coming to terms with the ending of this story, but also realizing that um that's also the beginning of a new story because while I don't think I'll be making talking videos very much at all anymore, I I might make some in the future if there's something I feel inspired to talk about. But the the the last two years, these videos were to explore these questions that I've had my whole life, or at least some of them my whole life and some my whole adult life. I I'm not exploring that anymore. So, I'm not making talking videos about those things anymore. There are videos that I do want to make. Uh there are things that you can't say in speech like what I'm doing right now that you can't say in a siloquy you cannot say in a monologue there are things that you can't say but you can say them in art in music. There's something about music, well, and art that moves and stirs the soul. There's something about creating that just like harnesses the power inside of us. It uses this power that I feel like doesn't get used. It's like this boundless potential, this energy that is just untapped. It's there. Some people tap it. Well, I tap it some in making these um talking videos, but but I feel like I I'm just like uh sipping through a tiny straw. I feel like there's a geyser, a fountain of water waiting to gush out from the earth. Yeah. So, I just wanted to share that that that's that's where I I am and where I've been and the shift that I've been feeling and uh realizing. Um I want to make music. I've made some music on this channel. And I I'm going to post music to this channel. Music well essentially videos, but it it'll be similar to these videos except in music form and lyrics. So they'll be much shorter. I I still want to share beautiful parts of the mountains, but I want to marry them with uh a music that expresses how I feel. and words that express how I feel that I can say some words I can't say here in this format in this medium but I can say in music accompanied to the sounds of guitars that are heavily distorted I was thinking about like all the um bands that I've liked over the years and there's really one band that I keep coming back to because every it it's like it's like age ageless to me that it just their Music is like that geyser coming out of the earth. The Rage Against the Machine. I I wish they were still making music. It's funny because I I even this morning I was looking at one of their music videos on YouTube and every time I look at one of their music videos on YouTube, I look at the comments and there's inevitably just like a few comments down someone says, "Please come back. We need you. I wish." Or someone else will say, "I wish Rage Against the Machine was still around. We we we we so desperately need them now. And I I I I feel I feel the same way. I I wish that they were still making music. Is their their music really speaks to me. I have all this rage and anger about the way humans treat other humans and other living beings and them themselves. How I treat myself. How I'm watching the world burn. This beautiful earth burn. It makes me really freaking mad. I need to sublimate those feelings and ideas. Uh because if I don't, they'll destroy me. Um so that's that's what I'm going to do on this channel. I know like uh I know that kind of rock music isn't everyone's cup of tea. I appreciate all the many hundreds of thousands of subscribers that have been following this channel and I understand some of you may not continue on that journey with me as I make music. I will come across new new uh subscribers who will join the journey and there'll still people there'll still be people that continue along with me on this journey. Um I understand that. Uh, but this this video is to let you know where I'm at and why I'm doing what I'm doing. Not that I really need to explain why I'm doing what I'm doing, but I there's been a lot of people that have come with me in the last couple years and I think it's just polite is polite. It's considerate to let let you all know what's going on. So it is the ending of one story, a big story and the beginning of a new story. Bye.
