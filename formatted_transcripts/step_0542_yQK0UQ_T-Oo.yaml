transcript: Hey guys, so today you and I are going to talk about experience. So let's get into it. So the question in question was, "Hi Frederick, do you have some real life examples where your experience as a citizen developer proved more crucial than just knowing the latest technology?" Yes, I think I have a few. So let's talk a little bit about for example like we'll do do one in front and one in back end I think so you whoever is watching this whether you're full stack or back end or front end you have something to relate to I hope so the latest time that I had a chance to quote unquote showcase my experience and then instead like suggest something that might have been a little bit nicer I think than using of the latest and the best and so forth when it comes to front end was when I was dealing with a group of front-end developers who had this idea that they wanted to use basically redux in order to in this case it's react they wanted to use Redux in order to do state management at the global level because it has the concept of slices and so forth and so forth and of course they want to sort of follow a pattern that they have been using for quite some time And so I showed them that due to the way that you can use uh there's a slightly different approach I argue that you can use instead. And they were asking me but yeah but it's going to be per more performant if you have like a large render in your in your form state or so forth and so forth. And I said yes you are correct. Can you just let me show you how I would approach this without using redux because the thing is for the most part we don't really need the global state in this application. For the most part, we're just dealing with local components that don't really need that because I know after working with Redux for many years that quite a lot of software developers have this tendency when they don't really know how to work with it to basically bloat the global state or the store as we call it. What happens instead of using it sparingly, which is definitely the way I suggest you do it, is that they just put everything on there and sooner or later you're going to end up with someone basically loading an entire list of, you know, I don't know how many objects and then the performance is really going to hit you, right? And I've seen it many many times before and I came up with a solution that is I a little bit nicer that doesn't really require you to use redux and the way was very simple. I actually use when it comes to holding you know a state over a longer period of time. I use the same basic principle as Redux does for I can't remember which library it is but it persists through local storage and that is exactly how I did it. So some basic memorization and actually using the browsers API to do like local storage. Yeah, I didn't need needed to persist the state of the entire, you know, the entire form at the global level. I could do it at each component level instead, which solved the problem. And that I didn't, I mean, that's not I would argue like bleeding edge technology. It's just experience working with both like React and in vanilla JavaScript and building a bunch of different applications that I know that although local storage is not of course the best thing in the world for render performances but if you do use it as a bit of a caching strategy instead where you basically just re if their value is there you read it up and when you know someone clicks and submits the form for example then you clear all the state and so forth well then it's really not much of an issue I I would say I I found it to be very effective and it did solve the problem with u in this case render performance in a very big form and for backend development what can I say there well so even though I these days work primarily in C I am not like I haven't worked most of my career in C it's been just a few years or so forth and so forth and I know a ton of people who are better at it than I am and one of the things that kept on coming back to me in my current role was that teams that I were was working with because in my current role I am a senior principal software engineer whatever yeah something like that and so I have about I think 260ish software developers who work in like 18 or 20 different teams I can't remember exactly now uh in my department where they all take guidance from me when it comes to like software to design principles and so forth and so forth And the thing that came back over and over and over across basically the entire like all the teams that we were dealing with was that most of the software developers who were new to the project or like the juniors and so forth they had a hard time with onboarding and so forth. And the thing that we found was or rather that I found when I was talking to them and going straight like trying to understand like what is the issue with being onboarded in this department was that most of the seniors had adopted a style which is called clean architecture which is very popular in in C world and ASP like net and so forth and so forth. Now it's actually to the point where most of the senior software developers that I interview don't actually know of any other architecture than clean architecture. Literally they just immediately when I ask them about you know basic MVC patterns for example like they immediately assume that I'm talking about the MVC library or the MVC framework that is innet because they've never actually worked in anything else. And as soon as I talk to them about say a layered architecture, their first comment is always oh yeah then I create an infrastructure layer and I go like you need a domain layer and I go no no no like maybe I'm old and weird but the layered architecture is not something that the clean architecture gets to hog all to itself. It's a very basic concept that use is actually a little bit I argue simpler than that and it's used in every single basically every single application that you're ever going to build at least by default and so Java people know it and you know NodeJS people python users like anybody's ever worked with a web server and has the concept of you know a controller a model and a view and like service layers or you know persistence layers and so forth will know these basic concepts right but most of our seniors they did not because in their world this is the only way you write applications. And so what we did was that um we had a new project which I started u working on because in my current role one of the most important responsibilities that I have is to quote unquote guarantee success for the for projects basically and give as I was saying coaching to software developers and so what we said was that all right since I'm going to be temporarily the the tech lead for this project I'm going to sit and like create a draft of what I believe to be an AR architecture that might be a better fit and I will showcase that to one of my fellow principal engineers who is going to be the future tech lead and he has been working in C for 15 20ish years something like that and so I showcased like a basic module model is set up that I've battle tested myself over many many many years in different languages with some basic you know it's nothing fancy in any way like any Java developer for example wouldn't recognize it immediately like you have control, you have a service, you have a like a repository or something like that so forth and so forth and once we were done and I showcased it to him he sort of loved it and then I showcased it to another C# developer who were more juniors and so forth and they actually told me that this felt a lot easier to work with when than what they had been doing in their projects and I'm not in any way bash talking the clean architecture but just for their sake they had literally like been forced into something that is I argue a very big trend in the C andn net community but it's not really a trend as far as I've seen anywhere else. I might be wrong of course but in this situation rather than just hope jumping on the hype train which had been the case for their own projects that had happened with other seniors we tried something that had to do with my personal experience working in many different languages some just following a pattern that I know that it's going to work in every product doesn't matter if it's you know Ruby or Python or PHP or so forth this basic concept have at least for me always worked fairly well And so far we're a few months into it and everybody seems to be pretty happy overall and you know getting a lot of praise. Of course it's going to turn to in one or two years I'm sure. But right now they're a lot happier than they were and then they are when they had to deal with you know using mediator and auto mapper and so forth and so which is you know libraries that are great. They're pain now as far as I know. So there you go. But with this setup, uh I think I proved that even though I may not be an expert in C, I do have some experiences working in quite a lot of different other languages that proved useful in this scenario. And the same thing goes true for when we work in say NodeJS and other similar sort of things or front end. If you have experience, it's usually the case that you don't necessarily always jump on like the latest library and the latest trend because you've seen some stuff and you can start to sort of figure out if this is useful or if it's just there's a simpler way of doing it. So, what I want you to take away from this is that I have some I have quite a lot I would say like situations where I would argue that a trend is less worthwhile than some experience that I had. other things that I can apart from you know being able to use local storage as opposed to creating a having a library for that my and so forth that's one situation and I mean I was kind of against and there actually on record if you go back to like my first first first videos the CSS and GS thing like never ever want to touch it if I can avoid it because I thought it was a bad idea in the beginning with one exception which is atomic CSS or like minification and stuff like that which is pretty nice. Me personally, I love BM. Everybody hates to hate on BM because for some reason everybody hates the syntax style but like when I work with my software developers these days and so forth like they have all kinds of flavors of doing it and I still believe that it's like it's just going to work across the whole board. Same thing I have with back-end developers where I tell them that you know there are easier ways to deal with a monolith and spaghetti code than using microservices. Using a mo monolith and knowing how to write segmented modularized code is going to help you a lot more which is what they're doing in this specific project. And again, they absolutely loved it because now they don't have to learn Kubernetes to run a application that's just going to have a 100 users and they don't have to like do all these extra things that might get pushed on them uh and has been pushed on them in other teams. And of course, they're pretty happy that they can use something that feels a little bit more natural and simpler to them than just jumping into the clean architecture immediately. As you can imagine, it's the same thing when you do functional programming or whatever you're doing, right? If something is a bit complicated or if it's something that is like new or so forth, there's always a cost of learning and when you're more experienced, you sort of start to see that for some people who are really into it, it's easy to pick up because like they're going to learn it like that and for some people it's going to be trickier. And that is a mark of maturity. Not to just jump on the bandwagon and like pick up something because it's cool and so forth, but to actually figure out whether or not it's going to be used correctly in your specific project because you mean if you add the latest and the greatest to your project, but the people that you are working with are not really into it, then the tool is going to be misused. And sure, in those situations like everybody loves to hate JavaScript, right? And I always say the same thing. For some reason, the people who really love JavaScript and are good at it, they always make it work. But it's the people who don't like it that for some reason have all the problems. Have a great day.
