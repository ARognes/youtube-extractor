transcript: '[ALEKSANDER ROSTOV] "Ah, the disco." People say weird stuff about it. They say that it is about detective stuff, or some people say that it''s about politics, Or some say it''s about some deep internal turmoil, or the human condition. I don''t know what these people are talking about. It is obvious that Disco Elysium is about painting. (Spaghetti Western music) It has a little bit of everything in it. It has portraiture, it has landscape. It has metaphysical portraiture, the isometric of course, the study of composition; these dialog framings, when you''re in conversations with characters are often comic-bookish if you look at them. Y''know, of light and shadow and of techniques like edge hierarchy, where you obfuscate a line between one shape and another to make the gradation smooth and not pull your eye in, as a part of this complex composition of the image. That is all in the game. The game is a study about all of these things and all of these techniques come together to make this game. (Guitar strum rings out) [DANNY O''DWYWER] In these documentaries, we often dive into the technical. It''s a somewhat inescapable byproduct of exploring the work of pieces of software. But today, in the fourth episode of our series on Disco Elysium, we''re gonna try our best to keep things Artistic. Disco Elysium had a small art team by any standards. A couple of artists, one animator, a 3D guy and a few other contributors. But before we dive into their work I wanted to start with Aleksander Rostov, as his painterly style was the visual fulcrum of this entire project. What was the pathway through which he achieved the look of Disco Elysium, and what practices and decisions led him down his particular artistic path? [ALEKSANDER] You need to develop your taste, and you need to look at a lot of art. Once you see what is good, what is bad, you try to make it like the good guys and you try to not make it like the bad guys. Physical practice. You can finally process it into a thing and understand what it is that you were doing. Trying out this art stuff autodidactically was just: grind the anatomy until you remember it, and draw from memory until it looks good enough and compare against the reference drawing. All right, just keep painting the colors until they work (chuckles). And then the internet as well. I''m of the generation of the internet. At first there was a little less information there. Today there is... You can get wonderful information on how to draw, how painting works, what are the fundamental concepts of it. "In my age, when I was a wee little lad," we only had "how to draw an anime face" tutorials. And look and look at your anime faces now. (Laughter) [DANNY] And look at your anime faces now! Oh my god! There was a critical moment in my youth, where I had to... Now... It''s like "this is like a fork in the river in the upstream." Does it drown this town, or does it flood this village? Where does the river go? "Do you choose the anime, or do you choose the realism?" And I agonized over that decision! But it did give me a kind of perspective on it – well, later it came, a perspective on it. That decision didn''t really mean anything – that it''s all the same thing, and that you''re simply learning different aspects of image craft. Well, before me was, then... Well, when I was very young, was the collapse of the Soviet Union, the end of the world, and an apocalyptic event, in which the great endeavor collapsed in on itself, and horrible things came out of it. And maybe some nice things... What the Soviet Union did, was that it pumped a lot of money into cultural arts so the artists in the 60s and 70s – the people who were translating books – were like the intellectuals of the age, so this literary quality was extremely high and the works that they were writing and, y''know, the artist could get a beautiful apartment on the top of the building somewhere and it was a respected class. And then with the ''90s, the artist... Suddenly it became derogatory, as an artist, and so the prestige of the artist started declining, but this mysterious... I don''t know, some sort of an "aura" remained, still like this Elven world of the arts, that people just didn''t know how to draw like the old masters anymore like we''ve forgotten ancient, secret knowledge impossible to reclaim. Later, I thankfully found out that was wrong. So, for me, growing up in this – like a ghost of arts being respected, and then the state that it was in then... The state that it was in, it was unacceptable. I don''t know. The artist was reduced to running around after getting grants and then backstabbing each other for €700, so you can make your lousy little art thing that can be in the gallery, that you barely have any time to conceptualize, or think through, or make into something wondrous and big like art needs to be. And so all the art you see is mediocre and miserable, and the artists are mediocre and miserable and the world is mediocre and miserable. In the ''90s and early 2000s. So it makes one very critical towards that and towards the art institutions. Art must be done outside of institutions. (Greeting noises) [DANNY] Nice to meet you! (Laughter) [ALEKSANDER] Hello! [HELEN HINDPERE] Oh my God! What happened? [DANNY] What''s Doggy''s name? [ALEKSANDER] Pushti. [DANNY] Pushti? [ALEKSANDER] Pushti. [DANNY] Pushti! [HELEN] Yeah. [DANNY] Hello Pushti! [ALEKSANDER] This is the neighborhood. This is where I grew up. This is the Soviet dreams. You have the panel houses, you have the kindergartens and schools in between the panel houses. The panel houses are like fortress walls around, protecting the children. Much like the children''s creche in Alpha Centauri. The best of the civilization games. Then you have this forest here. There''s horses there, that just ride around because the hippodrome is over there. And then if you follow this... wooded road down, then you get to the Stroomi Beach. Which is what the Martinaise Beach is sort of modeled on. The sad, autumnal version of it. If you go there today, you will see the happy summer version of it (chuckles). [DANNY] What''s it like in the winter? [ALEKSANDER] Oh, it''s dreadful! Sometimes it ices over, and there''s just this line of ice that goes into the horizon. But other times, if you get temperature fluctuations happening, you get this cool thing where the sheets of ice, they come on top of each other, and it''s like shark teeth coming out of the water at you. That''s very fun. But it happens quite rarely. The garage is the most important building for a child growing up in Eastern Europe. Because behind the garage is where The Dominion of the Child lies... Where the eyes of The Parent do not reach. So, behind the garage is where you keep... Well, where you burn the matches of course. I might have caused... a couple of wildfires here in my youth (chuckles uneasily) It is also, of course, where you keep the porno mags, with the other children, that you find on the roof of the garage, so any adults walking dogs back there don''t see them. And here they''re gonna build a tramway. But this just used to be a wasteland. A wonderful wasteland. [DANNY] Did you find porno mags in The Wasteland? We used to find them in the woods. [ALEKSANDER] Yeah. [DANNY] Sorry I''m asking so much about porn mags. [ALEKSANDER] Yeah, I don''t know. The porn mags are very important for the children. It''s where you learn the female form for the artist, you see? And it''s also this secret for children to bind or bond over. [HELEN] Great loot. [ALEKSANDER] Great loot! [HELEN] Looting them from the wasteland. This was our Wasteland, too. (Laughs) [ALEKSANDER] What''s going on, Siim? [SIIM RAIDMA] Mmm. [ALEKSANDER] Mmm? He''s doing something with code... Why are you sitting in my seat? That''s where I sit. So the art team was quite cozy. It was me, Siim Raidma, who I already mentioned, who was doing the technical stuff. Kaspar Tamsalu, who was doing location concept art. He has a wonderful sense for domestic compositions. Quite a few of the dialogue frames are also sort of designed by him, because he''s a comic book artist by heart. When you meet Everart Claire, you have these... In the image, you will see that the container frames (clicks) put Everart here, and you''re here and you''re lined in between these frames and all of this stuff. Yeah, Kaspar designed those locations. Rauno Somelar, who was our 3D heavy-canon. He was... He knew how to do 3D. Nobody else knew how to do 3D. Young Markus Härma was our junior artist. It''s hard to sort of pinpoint down what he did. He helped out with a lot of stuff, and in the end just... It''s a little bit all over the place. He did the loading screens, for instance, that''s an image that he did, and modeled a bunch of stuff. On the character side, we had a wonderful Eastern European caricature, Pavel Kuba. We called him "Pasha". So he came... He came on quite late. He sculpted some of the characters. He sculpted the Armors and Everart Claire and Morell, some of these more involved characters. There''s Eduardo Rubio, who was the animator. He basically animated the entire thing. [ARGO TUULIK] Eduardo, I think, came on board around the time I came on board. He was there from the beginning and he was there all the way. Like, I have nothing but positive things to say about working with Eduardo. A wonderful, wonderful person. Such a distinct and unique animation style as well. It kind of takes this character model art style of Disco and it puts a little bit of cartooniness on top of it. But exactly this right amount of cartooniness. Anything more, and it might actually feel a little childish. But anything less, and it would just not have that charm. [SIIM] We went for Unity and Blender because that''s the tools I knew. And the privilege of coming in early is that we''re going to use this and this. And anyone else we''re going to hire is going to either deal with it or not join us. Which is great, because Blender is really scriptable, and something even I could build a pipeline out of. So it starts with either a sketch of the level – like the interior or the exterior – or just a block-out inside Blender. Then we flesh it out, but not too much because most of the details will be painted in. In Blender, we get to a point where it''s mostly color blocked. And enough details are there so that objects have their silhouettes, which we do need for the height maps and rendering. Blender will render out colors, normal maps, like the surface normals for the whole map. Absolute height, which is a trick we got from the Pillars of Eternity video. Then we have a clown map, which is like a different color for each object, which helps with the painting over and masking in Photoshop. Rostov would grab the color map and just paint over it. I got my first Wacom Cintiq. "Oh my God, this is the happiest day of my life!" This giant screen that I can draw on all day for the next five/six/seven years of my life! Oh my God, I was so happy. A big distinction in the performance of art is whether you are drawing from the wrist, doing little sketchbook drawings. This gives you this curvature of the wrist or whether you are doing it from the shoulder, which gives you this absolute control to do straight lines, or anything. From the internet, I learned that they teach you to use your shoulder to draw, that this is the superior, more controlled way to do it. And with the Cintiq, you can really do it. It''s big enough. You''re drawing to imitate painting in the small, but on the big, you can kind of paint. You can like do these strokes and (whoosh). The isometric image is wonderful, in that it is flat. There is none of this 3D, a million viewpoints. It''s just this one image. So in essence, you can design the entire game as if it was like a painting. And that''s kind of what we did. It''s also the cutest image. It''s this... It''s the image of children playing with toys. It''s just like a childhood wonder of the toy house, and moving little guys around, and so on. That''s why the isometric thing basically just works so well. You just plug the painterly knowledge into it, and you simply make a better isometric image. Because painting is all about the study of the image and how to guide the eye, and make this part of the image clean,  and this part of the image very textured and active and complex, to pull your eye here. And then design these motion lines through the image to draw the eye of the viewer. Well, of course, a complex problem then, is if you paint this background with all of these brush strokes, and then you have these 3D models that you want there to move around, because it''s so complicated to do... 2D animate them. And then you have this challenge of, "Oh my God, how do you take this Blinn-Phong-shaded rounded, bulbous 3D form, and how do you integrate it into the painterly sensibilities of the image?" So, if you know about normal maps, a normal map takes a 3D surface and then maps an image on it, which says that this point is actually looking that way. So you can do this small detail stuff. It''s standard video game techniques, but what is not very standard is what we try to do, is that we try to hand-paint them! And that is like, oy oy oy, mind arithmetic... And in the end, we discovered that you can just kind of sculpt it like this, that you just do this planar simplification. It''s like... Soviet monuments often have this (booming sounds) happening. The magical Siim Raidma. He''s just like... He''s the coder, which basically... He made the pixel math and he made the screen do the thing that it needed to do. I don''t know, this goal would''ve been impossible without him, basically. [SIIM] So the interesting stuff, which is... we made up on the go, which was a shadow map, which we had... We rendered three directions of shadows, which is the morning, noon and evening. And it was interesting to get the angle just right because the whole game will have the same direction of sunlight in the morning and in the evening. [ALEKSANDER] Basically, three times of day with their own lights and the night time, which is sort of like without, I guess, shadows in that sense. But this shadow information is multiplied over the main like painting. So it''s just this one painting and then the shadow does like all the... [SIIM] And at the last moment we decided, for the noon shadows, the sun was going basically from above the camera. At the last moment, before rendering out most of the stuff, Rostov decided to put the sun on the other side of the map, which means all of the ground is still light, but all of the buildings are now in shadow, dark. So that increased contrast. So it was really flat before. And that decision made the noon shadows a lot better. So this... It''s three directions because we had like three channels in a PNG, right? So RGB will be the three direction of the sun. [ALEKSANDER] And the occlusion, he reverse-engineered the depth map thing. So that the world is just a flat image, but it has rendered out a height map. So that it knows if your character is standing behind something or out in front of something, Some trigonometric calculations are being done for each pixel to like occlude and do stuff like that. There''s a lot of little shader effect stuff happening there. If you walk around the world, for instance, we have a remnant of fog of war. But we didn''t end up using it in a sort of a traditional way. It sort of serves as a, what do you call it? vignette in photography, just a vignette around it. But because the world is so painterly and such a textured thing, then it doesn''t work if you just have a gradient on the edge. It like makes the image cheaper. So instead, the fog of war, this darkness of the image, it almost (hisses) snakes through the image. Because, what it does is, it goes first from the lighter parts and remains longer in the darker. So it''s like if you''re walking along this tiled floor, Martinaise ground there, then you will see that this fog at the edges, it''s (hisses) just snaking away into the cracks of between the tiles and the tiles come gleaming out. And it''s like super subtle, but it adds so much to the liveliness of the image. ''Cos there was a big problem, in general, that the painting is so still, how do you bring it to life? Yeah, that was a big problem. We just, over the years, developed some... There''s some obvious things, put a little rotating fan in a room and you put these 3D assets that are like doing some stuff somewhere. The characters are doing their little like idle loops and stuff. Little things like trees are lying about perspective. The tops of trees are slightly doing a parallax, and then it fades out to the root. So just as you''re walking, the trees are like slightly just sliding. Other things, when you walk, for instance, when you go into the courtyard behind the Whirling-in-Rags, you will see that the houses that are in the foreground [high] up, they get shadowed. So it gives you depth perception to the image as well. The courtyard is normal color, but it calculates this trigonometry that this is closer to the camera and it sort of turns it into a silhouette. It makes the image more readable. Because part of this isometric image is also that everything is of the same importance. You can''t quite... You lose one of these tools of like control over it. But then with that, we''ve got to get it back. And it also just makes the image change as you''re moving. It adds a little bit of this life in there. I don''t know, simmering light beams that are just planes with like an animated texture on it and little bugs somewhere flying around, I think. But the compositions are mostly in the dialog compositions. For the mouse, you just click on the character and then your guy walks into a predefined position that looks good. They''re talking to each other, which is kind of annoying when you''re gamepad controlling. You''re up to the character, talk to him, but the other guy needs to (clicks) move a little. I don''t know how to design around it, ''cos it''s kind of important for the composition and the psychology of how the two characters are communicating with each other, that they are in these specially designed locations. And then it goes into this image composition and so on. It was quite the effort to figure out how to paint this giant painting, ''cos you can only have so many pixels in one Photoshop file before the computer runs out of RAM. Which is a constant problem. RAM, my eternal enemy. In Photoshop, you can link images into other images. So the mega massive painting of the world is basically a bunch of Photoshop images that are these tiles that have been (slotting noise). Here''s the tiles of the... behind the Whirling-in-Rags courtyard. And this edge overlaps with the... what is at the Doomed Commercial Area. The outside area, the bookstore and stuff. And then you paint this image and you paint this image and then you carefully paint what''s in between, thinking exactly which surface should be considered "the master," the overriding truth of of which one. And then you just stitch these Photoshop files together into a giant, giant, giant painting. [SIIM] So we have a lot of pixels in the game, right? So the exterior of Martinaise is like... I found the number, quoting myself, is like 10 gigapixels of texture information. It''s a lot of pixels, and we wanna make it work without loading screens. Virtual texturing came to mind, which was... id Software''s Rage, in 2011 I think, did the megatextures thing. It was quite big at one point. Being arrogant and ambitious... "Sure, why not? Let''s do this instead of loading screens." It''s a miracle that it worked out. But Unity was at a weird spot at this exact moment where they had... I think they had bought a company that did virtual texturing, but they hadn''t done anything with it. It''s... At this point, it wasn''t the pattern for Unity yet. So it was, that was unavailable to us. And the only other competitor with virtual texturing was Amplify Texture 2. It was a bit of a gamble, because it wasn''t ported to the console yet. But luckily enough, they were like super responsive. We just started using it and asking dumb questions. They kept answering them to the point where they just sent the whole source for the plugin. So fast forward, Amplify Creations ended up being ZA/UM Porter, which is part of the studio. [DANNY] So much of the soul of Disco Elysium comes through the various character portraits. Like much of the art in the game, while Rostov was the primary vision holder, there were collaborations between art, writers, and design. Doing more than just showing the face of the person or skill you''re talking to, but giving subtle visual insight into their own place within the story. So what was the process through which these iconic images were created? [ROSTOV] For every portrait artist, there is the hero portraitist. And for a lot of them it is of course the Velázquez. The original psychological portraitist. And there, you look at his portrait of that Pope Innocent X. Not so innocent. But the look in the eyes and... It reveals something. It is not simply a flattering picture of some guy, but you can also tell that that guy is a bit of an asshole. That is the minimum accepted quality. The portrait needs to be as good as Velázquez (laughs). So there needs to be something in there, it just can''t be a picture of a pretty person. But I don''t know, this is sort of just like intuitive stuff. You, I don''t know, try to read yourself into the character. Which is fortunately quite easy, because the writers are very good at making them into proper characters. Someone who you can read into and really picture a depth of emotional world behind those words. And eventually the image. Ah! yes, of course: Symbolism. Shapes and images and things. They all mean stuff and they do stuff. Well, what we do is, we take in the external world. The external world is so big! But if you put the frame around it, it becomes this image that you can comprehend. It''s like this "framing of the image," I call this event. The portrait is this framed image. But it is still basically sending in this direct, strong, raw signal into your head. And different shapes, they have different effects on us. Y''know, a circle is round and somehow warm and welcome, ''cos goes on forever. There''s like other aspects to it. But it''s like, for the character of Kim, that is the sort of round, solid... Is not falling apart. Does not have weaknesses in the corners or structural issues or... So you just feel this. It just communicates with your spine, somehow. While Jean has the rectangle and the stuff. And it keeps us straight-back and shit together. But also it''s kind of rotten and black. And it''s kind of scribbled in, a little (growls). And it''s also black because of depression, and the color of black. And all of these sort of, when you sort of say them out loud, are very banal things to point out. But when you don''t mention it and they''re just in the image, they just do what I said. And you just layer these different effects upon you. And eventually it''s just, there''s so many of these effects that you layer upon each other. That it just does stuff to you. It''s like when you look at the Rothko''s paintings. If you look at them like online, on a computer screen, Mark Rothko. It''s like... He just made a canvas, right? But when you like see it in real life and you stand in front of it and the uninterrupted, unisolated, pure signal enters your eye (gasps) so that you''re transfixed around it and you understand the strength of what is happening there. Very subtle, very easy to make fun of, as well. But also incredibly powerful. And then, I don''t know, then there''s the semantic symbolist layer, that''s sort of above it or together with it, with Ikon painting, the halo, the nimbus and so on. So all of these things are just... Whenever you go in to make one of those portraits, you''re just trying to feel out like what is a kind of an appropriate trick, technique, a curveball that you can put into this image to manipulate the player into feeling an emotion. And in a way, the entire art style of the game is sort of this; is a study into subjectivity. When a painting differs from the natural, Real of it, one can ask a question: Why does it differ? And if you''re careful about it, then each of these why''s can... You can say something with it. It''s the space that you can put meaning into an image. The entire game is a little bit like that. But the portraits are like a small, focused study of that. A lot of the obvious effects have been sleuthed out by the fans. They now point out that Kuno is in the same pose as Half-Light. Sort of like embodying that like fight-or-flight response. But otherwise Kuno is fairly naturalistically painted. Like, it''s this child that''s in front of you. So the symbolism, it''s less to do with that. These abstract things, it''s just a pose. It''s like really embodying that character. Measurehead is a little bit boring. He''s just trying not to look mega black. So just, so it would be... The joke would be a little bit more sophisticated than "ha-ha, black racist". And it''s also a little bit like, all the colors are there. So it''s, you know, universalizing him a little bit. The Klaasje and Sylvie portraits. It''s interesting to compare the two actually, yes. Sylvie is painted in a kind of a naturalism. It''s just a girl that you talk to, who does not pretend to harbor great mysteries behind her. Lives a decent life. While of course, Klaasje is just all shadow behind the fringe, the bangs. Yes. Klaasje was also one of the first portraits that I did. So it''s a little bit more true to the original structure that I devised for the portraits. So one of these tasks of, "Oh my God, can I make this game and have to paint so many portraits?" is to figure out how do you do the portraits. What kind of techniques do you use to do it with optimal time, while also giving you all of these tools of symbolic expression. It was constructed out of these flat layers with less rendering time. almost like posterized sort of feel with dark blacks, kind of like a modernist technique, to use like black lines and stuff in there. And Klaasje was one of the early ones. So she really exemplifies this approach of simplified flat shapes. Later portraits can get more complex as I get more comfortable working in the style. But yeah, these are two people who are trying to communicate different things about themselves to you. So you perceive them differently. All the paintings are the perception of the Mr. Dubois. Are all the Mr. Dubois'' perception of the other. So for instance, the twin kids who are painted, Lilienne''s twins, they''re just the same image flipped, which is a wonderfully cheap production trick. But also really does reflect the understanding that like a drunkard middle-aged man has... "This child is like a flipped copy of that child!" (laughter) [DANNY] What about Mr. Dubois himself then? ''Cos he gets a number of different expressions. And "The Expression", of course. Ah yes, The Expression. The Expression had to be painted many times to find the exact nuance. I''m very glad that they repainted the mirror painting at the nick of time before release. But yes, Mr. Dubois, Mr. Dubois''s visage also keeps changing across every single image of him. One of the reasons is that, you see, I am an amateur autodidact and I never learned how to draw the same face twice. And then, too, it''s also... No, actually, no, no, forget I said that. It''s, y''know, "his self-image. Sometimes he thinks he''s handsome, sometimes less so." Y''know, it''s all about that...? (Chuckles) But yes, well, the cool trick is that the first painting is this Francis Bacon-like mystery man, who even is this, you only see the soreness of his nose there or something. It''s red a little bit. And then you get to change the portrait, really. And it''s just, also, every time a game does something on the UI, that it changes a UI element or... I don''t know, it''s postmodern game design. It''s sort of a game design rule, or a game event that happens outside, the usual event space where stuff happens in the game, that''s just juicy, juicy art school shit. (Laughter) Same thing when you go talk to the light-bending guy, then the net worth (whirring) your money goes like crazy. And then, I think you can get the net worth counter on your user interface and so on. I''m a big proponent of that type of game design. I must admit, I might have learned that from Mr. Kojima. [DANNY] And so ends the fourth episode in our series. In the next episode, we wander into the programmers'' room and then follow the team as they split apart from their home base in Tallinn, in the months leading up to launch. This period of time was the most tumultuous for the team, and planted seeds for difficult times many of the development team would have over the coming years. If you''d like to watch that episode right now, you can do so over on our Patreon. Our work is entirely funded by people who care about telling the stories behind games. So we really appreciate all the folks who have contributed to our Patreon over the course of this season. We simply couldn''t do this work without you. [ALEKSANDER] Whether you draw with a pencil or whether you paint with a paintbrush and some wonderfully smelly natural medium with potentially toxic chemicals or whether you do it digitally, in the end you''re doing the same thing. And whether you are doing anime or realism, you''re doing the same thing. In essence, there is this total truth of the image that you are trying to construct, an expression of an individual image. And any tool and any technique, any stylistic approach that you use is sort of equivalent in it. Fundamentally, you''re always thinking the same sort of thoughts about what shape, value and color should be next to what other shape. How does it make you feel? What are the cultural symbolic implications of those things? So there is a great equivalence to all of them. But it is also, of course, a great superpower if you have managed to build up competency in all of them. ''Cos there are tricks that are more easily discovered in one medium that you can then translate to another. Oil painting teaches you a certain thing which you can then try to recreate in digital. Digital teaches you other things which you then try to recreate in oil. It''s this back and forth. I''m glad that I got to do a little bit of everything. It really like taught me a lot about it. (Ident clicks) (Click)'
