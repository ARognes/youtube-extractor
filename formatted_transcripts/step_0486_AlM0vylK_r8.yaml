transcript: In the last few hours Iranian hackers  announced that they hacked the director of the FBI, Kash Patel’s, personal gmail account. It’s very clear from the hackers’ blog  post that they’re really super proud of themselves. “All personal and confidential  information of Kash Patel, including emails, conversations, documents, and even classified  files, is now available for public download.” They link to an 800MB zip file, and dedicate  the hack to the crew of the “Dena destroyer”, an Iranian frigate that was torpedoed by  a US Navy submarine, killing 84 sailors. The group behind all this is none  other than the Handala Hack Team, we took a look at them in a recent  video that you should totally check out. They brand themselves at a  pro-Palestinian hacktivist group, their logo being a famous Palestinian cartoon. But  given just how sophisticated these guys are it’s thought that Iranian government intelligence  are really the ones running the show here. The 800MB zip file is a complete archive of Kash  Patel’s personal gmail account. Handala were kind enough to categorise the emails, making them way  easier to sift through. But to be clear this is his personal gmail account, not his official  FBI account. However there is a lot here, the emails span from 2011 all the way up to 2022.  There’s dozens of photos, however I’m not too keen on finding out YouTube’s policy on distributing  hacked photos from the Director of the FBI, but I will give you this studio ghibili ai re-creation  based on one of the images, but that’s the best you’re going to get from me. However you’re not  really missing out on too much, this is facebook photo gallery level stuff, it’s mostly super  mundane. There’s no obvious bombshells in here, the emails don’t reveal that he’s not having  an affair, or doing anything untoward. But that doesn’t take away from just how insanely  embarrassing this is, conversations with his friends, photos of his children, and an extensive  web of his personal life is all revealed, this is a total osint goldmine. There’s a lot  of communication with government and military email addresses in here and let’s just say a  lot of people are going to have to change their email addresses and get new phone numbers. This  data dump is going to be exploited to the max. There’s no question about this being legit, the  FBI themselves have confirmed it, but of course downplayed the significance, saying that these  emails are old and at this point historical, in fairness most of them are from over 10  years ago. Nevertheless the feds have a reward of up to $10 million for anyone who  can identify the hackers behind Handala. The group took notice of the bounty,  and published a response, putting a bounty of their own on the heads of Trump and  Netanyahu. One upping the feds by offering $50 million dollars. But this bounty isn’t for  their location, but for their “elimination”. I’ve lost count of just how many domains Handala  has gone through over the past few weeks, they keep creating new ones and  the feds keep on seizing them, it’s a similar story for their Telegram channels. Handala clearly wasn’t impressed with Kash  Patel’s security, but they aren’t telling us how they pulled this hack off. It’s probably  something really silly like a reused password. And this isn’t the first time Kash Patel has been  targeted by the Iranians, back in 2024 they gained some kind of access to his communications,  but no details were ever made public. If you want to get up to speed with all  the other hacks of the Iran war so far, this is the video you need to watch. I hope  you enjoyed this little breaking new video, let me know if you want to see similar  videos like this in the future. And as always thanks for watching and I’ll  see you in the next video, have a good one!
