transcript: '{"content":"\n[0.16s] Have you ever wondered whether someone\n[1.92s] you admire, perhaps someone in the\n[4.4s] public eye or a teacher or a friend,\n[7.2s] might be fully enlightened? In early\n[9.519s] Buddhism, Arass, that is those who have\n[12.719s] uprooted all greed, hatred, and\n[15.64s] delusion, are considered fully\n[18.359s] enlightened. But how do we know if\n[20.56s] someone is an Araant? In both\n[23.6s] traditional and modern Buddhist\n[25.279s] communities, people at times debate and\n[28.48s] discuss whether such and so person is or\n[31.519s] is not enlightened. This can lead to\n[34.96s] unfounded skepticism or unfounded\n[37.84s] devotion or confusion in a lot of\n[40.48s] people. Well, what did the Buddha say?\n[42.719s] What does early Buddhism have to say\n[44.64s] about this topic? As we''ll see, early\n[47.76s] Buddhism has or gives a surprisingly\n[50.32s] skeptical take upon our ability to know\n[53.84s] whether or not someone is fully\n[55.6s] enlightened. Is an arahant. The arahant\n[58.879s] or enlightened person as I say is one\n[61.68s] who is understood to be completely free\n[64.159s] from all the defilements, free from\n[66.56s] greed, from hatred, from the delusion\n[69.6s] about the rising and ceasing of\n[71.84s] suffering along the lines of the four\n[74.159s] noble truths. It''s understood that such\n[77.36s] people from the outside would appear\n[79.52s] calm and mindful and ethically pure. But\n[83.68s] and here''s the problem. So too would\n[87.04s] somebody who is not yet enlightened. So\n[90.64s] what''s the difference in these two\n[92.2s] cases? Well, one key difference is what\n[95.759s] happens in conditions of where when\n[97.68s] they''re under pressure. what does or\n[100.72s] does not arise in their minds and in\n[102.88s] their behavior under pressure. And this\n[106.88s] raises an epistemological gulf. That is\n[110.079s] to say, we''re no longer talking about\n[112.479s] what we actually see in front of us, but\n[115.439s] what we might see or would see under\n[118.36s] certain speculative or possible\n[121.399s] conditions. That is to know for sure\n[124.24s] whether somebody is enlightened or not,\n[126.88s] we would need to know their possible\n[129.599s] reactions to an infinite number of\n[132.08s] possible scenarios and know how they\n[135.04s] would react and whether they would react\n[137.12s] purely in all of them or not. And of\n[140.0s] course, that''s a standard to which\n[142.8s] nobody can meet. In many early texts,\n[146.879s] the Buddha outlines the difficulties in\n[149.28s] knowing whether or not someone is as\n[152.239s] settled and equinimous as they appear.\n[155.68s] For example, one famous one famous case\n[159.28s] involves the lay woman Videika of whom\n[162.4s] it was said she had this good\n[165.08s] reputation. The housewife Videika is\n[167.92s] sweet, eventempered, and calm.\n[171.76s] However, her maid colleague perhaps\n[175.44s] because she was familiar with Vidhika in\n[178.72s] a very intimate basis in a day-to-day\n[181.48s] basis seems not to have been convinced\n[184.159s] by this uh uh\n[187.319s] reputation. And so she decided to test\n[190.599s] Videika. She did this by getting up\n[193.599s] progressively later each day in order to\n[196.239s] do her duties. And as she did this,\n[199.44s] Vadehika got madder and madder, angrier\n[203.28s] and angrier, more and more full of\n[205.36s] hatred, until eventually she took a door\n[208.48s] pin, it said, and cracked Kie on the\n[211.599s] head with it. Whereupon Video lost her\n[215.599s] good\n[216.76s] reputation. The Buddha told this story\n[219.04s] and then took the following lesson from\n[221.04s] it. He says, \"In the same way, a\n[224.159s] mendicant may be the sweetest of the\n[226.159s] sweet, the most eventempered of the\n[229.159s] eventempered, the calmst of the calm, so\n[232.72s] long as they don''t encounter any\n[234.48s] disagreeable criticism. But it''s when\n[237.28s] they encounter disagreeable criticism\n[239.84s] that you''ll know whether they''re really\n[242.159s] sweet, eventeered, and calm.\"\n[246.08s] In other sutras, the Buddha repeatedly\n[249.439s] counsels us to keep a close eye on\n[252.48s] potential teachers to see if their\n[255.439s] supposed purity is really true. For\n[259.04s] example, in several sutas, the Buddha\n[261.44s] talks about how we can know four things\n[264.32s] about a person. We can know that whether\n[267.6s] they''re ethical, whether they''re pure,\n[270.16s] whether they''re resilient in times of\n[272.32s] trouble, and whether they''re\n[274.6s] wise. But in order to know these things,\n[277.28s] the Buddha says, we have to do so by\n[281.199s] living with them. But only after a long\n[284.24s] time, not casually. Only when attentive,\n[288.56s] not when inattentive, and only by the\n[291.36s] wise, not the witless.\n[296.08s] Note the Buddha''s point here that this\n[299.04s] long process of vetting a potential\n[302.0s] teacher, which includes, by the way,\n[304.16s] actually living with\n[306.28s] them, requires also wisdom and\n[309.44s] attentiveness are on our own part. If we\n[312.56s] ourselves are going to be inattentive or\n[315.08s] unwise, we''re simply not going to be\n[317.36s] able to see the clues that lead that\n[320.16s] should lead us to believe that this\n[321.68s] person is not actually enlightened. and\n[324.479s] other sutas make the same point. That is\n[327.36s] that we have to repeatedly scrutinize\n[330.08s] someone in order to be able to know\n[331.68s] whether they or whether or not they are\n[334.52s] enlightened. Do does their speech or\n[337.12s] their behavior show any corrupt\n[339.6s] influences or any mixed influences even?\n[342.8s] He says and this investigation has to\n[345.199s] continue on as this person attains fame\n[349.199s] and renown because as the Buddhist says\n[352.8s] so long as a mendicant has not achieved\n[355.12s] fame and renown certain dangers are not\n[358.08s] found in them but when they achieve fame\n[360.88s] and renown those dangers\n[364.039s] appear and so on. And we should notice\n[367.84s] here that this implies that you cannot\n[370.479s] know whether someone is truly\n[372.72s] enlightened if they''re not yet famous\n[375.919s] because they haven''t yet app they\n[379.039s] haven''t yet experience these temptations\n[381.68s] that fame provides.\n[384.24s] Similarly, in the famous Chungi Suta,\n[387.199s] the Buddha discusses a number of ways\n[389.36s] that we should vet a possible teacher in\n[392.8s] order to know whether or not they''re\n[394.72s] enlightened and therefore know whether\n[396.4s] or not they can lead us to true\n[398.4s] knowledge about the way the world is.\n[400.72s] First of all, we have to ask, does this\n[403.6s] person cause greed, hatred, or delusions\n[407.36s] to arise in other people? If so, then\n[410.56s] they themselves are not enlightened.\n[413.6s] He goes on to say, \"Is the principle\n[416.639s] that they teach deep, hard to see, hard\n[419.919s] to understand, peaceful, sublime, beyond\n[423.759s] the scope of logic, subtle,\n[426.319s] comprehensible to the\n[428.84s] astute. And if all of this is true, that\n[431.68s] is, they behave in these ways and also\n[434.8s] teach a dharma that''s like this, then\n[437.199s] and only then is it okay, the Buddha\n[439.28s] says, to place confidence in them as a\n[441.919s] teacher.\" Now, in a past video, I''ve\n[444.479s] already described some potential\n[446.72s] pitfalls and problems even with this\n[449.039s] approach. I''ll leave a link to that\n[450.88s] video down below in the notes. In\n[452.96s] another suta from the Pali tradition,\n[455.599s] the Buddha talks with the householder\n[457.84s] Daruk Kamika. And the householder Daruk\n[460.72s] Kamika says that he is generous,\n[462.88s] regularly generous to Ara and to those\n[466.8s] he believes are on the road to Ara ship\n[469.759s] because they live in the forest because\n[472.88s] they eat only alms food and because they\n[475.68s] wear rag robes. However, on hearing\n[478.96s] this, the Buddha reprimands Darukamika.\n[482.319s] He says, \"As a layman enjoying sensual\n[485.599s] pleasures, living at home with your\n[487.44s] children, using sandalwood imported from\n[490.36s] Cassi, wearing garlands, fragrance, and\n[493.199s] makeup, and accepting golden currency,\n[496.08s] it''s hard for you to know who is\n[498.4s] perfected or on the path of perfection.\"\n[501.68s] Because the Buddha goes on to say, just\n[504.72s] because a monastic lives in the\n[506.56s] wilderness and eats only alms food and\n[509.84s] wears only rag robes doesn''t mean\n[512.56s] they''re they aren''t actually\n[514.64s] reprehensible in their mental and\n[517.36s] physical conduct. And similarly, just\n[520.8s] because a monastic lives in a town and\n[524.24s] accepts invitations from lay people to\n[527.32s] eat and accepts robes from lay people to\n[531.44s] wear doesn''t mean that they''re actually\n[533.519s] not praiseworthy in their practice. So\n[536.8s] the Buddha recommends that Daruk Kamika\n[539.04s] simply be generous to the SA as a whole\n[542.24s] and leave the issue of purity to the to\n[544.959s] the members of the SA themselves. That\n[547.36s] is, it''s very difficult for a lay person\n[549.92s] to really pick and choose who and who is\n[553.04s] not enlightened. Outward appearances of\n[557.08s] holiness don''t really amount to much in\n[559.839s] the Buddha''s telling. And ordinarily, a\n[562.64s] lay person with very limited access to\n[565.519s] such people simply is not going to have\n[568.08s] the information to be able to\n[570.2s] distinguish true from counterfeit when\n[572.8s] it comes to this kind of ability and\n[574.959s] wisdom. But what about monastics\n[578.36s] themselves? When it comes to knowing\n[580.64s] whether or not someone is truly\n[582.44s] enlightened, even monastics are at some\n[585.8s] difficulty. And this probably explains\n[588.72s] the existence of one early suta that\n[592.48s] gives essentially what are a series of\n[595.12s] exam questions for a monastic to to ask\n[600.64s] of of another monastic who claims to be\n[602.959s] enlightened. And the suta says that if\n[605.44s] they claim to be enlightened, they\n[607.279s] should give this kind of answer to this\n[609.519s] kind of question. But I think we may\n[612.64s] reasonably wonder how useful such a\n[615.839s] process could really be when clearly any\n[619.04s] reasonably competent monastic could\n[621.36s] simply memorize the answers to these\n[623.839s] questions and parrot them back if asked.\n[627.279s] And this kind of situation leaves a\n[630.56s] contemporary scholar Patan saying\n[634.0s] essentially that it only that only an\n[636.8s] arahant can really tell another arahant.\n[639.76s] That is only an enlightened person is\n[642.279s] truly able to know whether or not\n[644.8s] someone else is truly enlightened. And\n[647.2s] of course where does that leave the rest\n[649.04s] of us? There has indeed been some\n[651.76s] speculation that one of the situations\n[655.6s] leading to the arising of the Mahayana\n[659.04s] involved just such a problem. That is\n[661.6s] the problem of determining who really\n[664.0s] was an Araant and who was not or\n[667.959s] alternately whether an Arahan could be\n[670.72s] subject to backsliding. that is somebody\n[673.279s] could attain perfection and then fall\n[676.959s] out of that perfection by doing\n[679.16s] something unskillful in the in the\n[681.76s] future. Now, we may wonder what\n[684.8s] difference all of this makes to our\n[686.48s] practice today. Well, the upshot here is\n[689.279s] that there are always problems with\n[691.2s] putting people on pedestals.\n[693.839s] First of all, we can\n[695.959s] overestimate their abilities and so\n[698.399s] perhaps give unwarranted confidence to\n[701.2s] the teachings that they provide\n[703.24s] us. Or we can\n[706.76s] unwarrantedly reject uh true examples of\n[710.88s] their own misconduct because we believe\n[713.04s] that they are holier or more perfect\n[715.279s] than they really are. Or on the other\n[718.36s] side, if we have unfounded skepticism,\n[723.279s] we may toss out teachings that are\n[725.44s] really helpful to us because we don''t\n[728.0s] understand that the person giving them\n[730.16s] is really quite wise. Now the Buddha''s\n[733.68s] advice to us all along in a number of\n[736.12s] sutras is not to take something just on\n[740.76s] authority nor to take something simply\n[743.279s] on\n[744.2s] tradition but instead to ask ourselves\n[747.6s] and find in our own lives in our own\n[750.04s] experience whether or not the teachings\n[752.56s] that we hear tend to diminish greed,\n[756.8s] hatred, and delusion in ourselves.\n[759.68s] whether they make our lives better or\n[762.36s] worse. Now, even that kind of a\n[766.56s] methodology for determining whether or\n[769.12s] not someone is enlightened is itself\n[771.36s] fallable. As I''m sure we can understand\n[774.079s] in questions of perfection, I think an\n[777.12s] attitude of humility, of uncertainty is\n[780.56s] warranted. Our own uncertainty can help\n[783.36s] keep us grounded and inquisitive instead\n[787.44s] of doctrinal and dogmatic. We can focus\n[791.279s] on our own practice rather than on\n[794.32s] looking towards idols. All we can really\n[797.68s] know on a momentby-moment, week by week,\n[801.68s] monthby-month basis is whether our own\n[804.519s] practice seems to be helping ourselves\n[808.079s] and others by\n[809.959s] reducing our our suffering, by reducing\n[812.959s] our greed and our hatred and our\n[814.76s] delusions by increasing our kindness and\n[818.839s] compassion and our calm and\n[821.839s] centeredness. So my question for you is,\n[825.279s] have you ever met somebody that you felt\n[827.279s] was enlightened? What were they like?\n[829.92s] And how did it change your own approach\n[832.24s] to\n[833.16s] practice? I have a past video on this\n[836.0s] general topic of not uh not treating\n[840.16s] people as idols. And I''ll leave a link\n[842.16s] to that video up here on the screen if\n[844.0s] you haven''t seen it or would like to\n[845.68s] refresh your memory. If you''re getting\n[848.0s] something out of these videos of mine,\n[849.839s] consider taking a look at my Patreon\n[852.0s] page, which is linked up here on the\n[854.079s] screen and down below in the notes, and\n[856.0s] see if you want to help support the\n[857.36s] channel and the work that I''m doing.\n[859.6s] Thanks so much to all of you and\n[861.44s] meanwhile I hope you will all be"}'
