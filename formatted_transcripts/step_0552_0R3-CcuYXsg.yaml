transcript: Hey guys. So today you and I are going to talk about AI. So let's get into it. So the question in question was, "Hi Frederick, are you scared of AI coding replacing developers or do you think it will create a new area of AI augmented programmers instead?" My kingdom for a question that is not AI related these days. It's all about AI for everybody everywhere. But I would say that that is pretty much what I believe. So I have on occasion mentioned that I don't really think that people have to be as concerned with AI taking over as they are today to a certain point. I definitely think that some people should be more concerned than others. But for us programmers and practically anybody who's working in a specialist field where what your core function within the company is is to have someone who is coming with you to you with some type of business need something that they think they is going to streamline something improve something make more money so forth and so forth. they don't really know how to do it and then they ask you to do it and that the leap between them being able to just go to the AI and ask it nicely to do it and then getting the results that they are looking for that it's a pretty big leap. It's a very big leap. I would say it's not something that you're going to see anytime soon. But the leap that we have right now is that they come to you and historically they have because that's the reason you became a software developer I presume to be able to build things with software and so they ask you to build the thing or do the thing or so forth and so forth and they get something out on the other side. I would even go as far to say that sometimes I reflect a bit about it and because we're I'm a programmer I think of myself as a function. I'm a magic function. They just put in a bunch of data or like requirements into me and then the code comes out the other way basically. And for me AI is just part of that tool suite. So in order for me to be able to deliver the thing I'm talking about because remember the basic value that you are bringing to the table is that you are able to create a digital system in a more effective and quicker way. In other words, cheaper quote unquote than what it would have been required for them to go through the whole process and learning and all this stuff. Like I mean that's the it's always the case, right? When you're paying somebody else to do something on your behalf, it is because you don't want to do it yourself because if you could do it yourself and be fairly certain that your results are going to equal or even surpass the person you're paying, well then you wouldn't be paying them. In our situation, that is not something that's going to happen very soon because even if you give an AI to a layman, they're not going to be able to tell it how to get all the things right, deploy everything, and do all the things that we need to do in order to just create a system. That is the thing that most people don't really understand when they see these videos, I argue at the very least, who show you that where they show you how to create a static website or how to, you know, do basic things and so forth and so forth. And even if again you get to a point where that is how you want to do work, it will still on average be more effective to have a professional doing it for you. And asking the AI is just part of that process. Now, so when I use AI, for example, my results are on average going to be pretty good with or without it because I know how to talk to the and know how to prompt it and I know how like how to evaluate the results and whether or not it gets things right or wrong and so forth and so forth because I have a lot of experience building systems. And to me using an AI is no different from me writing the code myself because at the end of the day it's just text in a file which I could have written or the AI can write it. And in sometimes I ask it to write something I know it's going to get right on the first try because then it's going to save me a lot of time because I know it's a pretty standard problem. And in some cases I just ask it to do part of the problem like a few things or my favorite tip. This is the one that I think you can steal when I know that I'm going to repeat basically a process a 100 times. My favorite example being creating a rest API. Well, all I really have to do is to create one endpoint sequence with CRUD operations. Let's say for users or products or orders or something like that, right? And if I know that I can be pretty consistent with my way of writing code, well then I know that if I'm going to create, as I was saying, if I create a user API and I need to create a products API and a, you know, order API or so forth and so forth and they're basically the same, then it's very convenient for me to just tell the AI, use the code that I wrote as reference and please make these other things because it's just boil the plate that I would have had to write myself. And here it can save me quite a lot of time. So the thing that I suggest the software developers to do leverage the AI in order to make yourself more enhanced as a software developer. And that is what I believe is going to be the future because fundamentally we are so far away from this idea that a person who knows nothing about writing software can go and sit and have a conversation with an AI and explain it in terms you know what they want and then have the AI just magically spit it out. AI is very very powerful and I suggest that you use it. But I don't think you have to be concerned that it's not it's gonna put you out of a job at least at least when you're talking about software developers. On the contrary though the thing that might leave you behind is if you refuse to use it because it will I guarantee you increase your development velocity if you know how to use it. So to me the most important right thing right now which is the thing that I'm focusing on is to think about this as you know when git came along or when say docker became a thing or cloud or anything like that it's just another tool that now I need to learn in order to be effective at my job and that is how I suggest you view it as well. So what I want you to take away from this is that I definitely believe that what's going to happen next or what's happening right now is that we're moving from like a post like like before we were using AI and now that is going to be a pretty standard thing for you and I suspect that we will find more and more advanced ways of using it right now because everybody's sort of experimenting to figure out okay so how can I make this thing help me be more productive and stuff like that. I shared you with you a few tips here. Out of the tips that I have is like ask it to make shell scripts for everything. Like I absolutely love the fact that I can use an AI to do something that takes, you know, would take me minutes, hours, I don't know, to create, you know, CI more robust CI pipelines with automatic checks and like file scans and static analysis and all this sort of stuff that is really quote unquote nice to have, but simply takes too long to write manually because you have deadlines and features and stuff like that. All those sorts of things that you can put in place or to like speed up your workflow, AI can do really really effective effectively. And I absolutely love that. And that is what I believe is in like the future that the people who resist this change, they will be left behind and the people who adopt it and so forth and so forth, they will have more productivity and you know so forth and so forth. And I don't really think we're in a state right now where you have to be in concern that it's going to take your job as a programmer or anything like that. It's it's just at for the moment at the very least going to be another tool in your tool. It's going to be a very important tool potentially one of the most powerful ones that you have save for you know your programming language perhaps. So make sure that you practice. That's the thing I preach. practice with the AI and learn how to use it just as you learned how to use a search engine just how it'll ask you with a programming language or your editor. It's again it's just a tool that you need to learn and master. Have a great day.
