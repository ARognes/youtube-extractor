transcript: By far one of the coolest features in CSS is the animations dev tools. If you're in Chrome and you just type in animations, hit control shiftp, type in animations, it'll bring you to this tab where you can view all the animations on your page. As you scroll throughout your page, whenever you view a new animation, it'll show up right here. And now I can actually scrub through this animation. I can play it at a slower speed, speed it up, and I can even modify what that animation does. For example, I can make it a much faster animation. And now you can see if I were to play this animation, the ball up top is moving much faster than it did before. So, this is a great way to play around with and see what happens with your animations when you do different changes to them. And if you want to really dive into various different CSS dev tools that you can use, I'm going to link a video right at the bottom of your screen that leads to a full overview of every single CSS dev tool you need to
