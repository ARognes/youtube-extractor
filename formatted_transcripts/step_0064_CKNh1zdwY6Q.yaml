transcript: I used to train a a ton of interviewers. I told the interviewers, if you got the data point that you needed, there's no need to follow up to take [music] the story to its logical conclusion. So, sometimes you might be in an interview and they ask you a question and then you give an answer and they're like, great. And then they like move on and you might think to yourself like, oh, I must have answered that incorrectly. The way that you should actually interpret that is like they got what they needed. >> Yeah.
