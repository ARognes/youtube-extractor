transcript: A dead SpaceX rocket just hit the moon near Einstein crater. This is only the second accidental rocket impact on the moon ever. But almost nobody talks about is the company that built the engines on that rocket has a direct bloodline to a lab that tried to hit the moon on purpose 65 years ago. In 2002, Tom Mueller left TRW to become employee number one at SpaceX. He built the Kestrel engine for kept Falcon one and then the Merlin engine that powered the rocket stage that is now sitting in a fresh crater on the moon. He worked at the same Redondo Beach Labs as John Tabor and many others while they were working on the Atlas Able rockets at the dawn of the space age. Space Technology Labs only lasted from 1957 to 1965 before being absorbed by TRW, but they had a lasting impact on space exploration. These light sensors or photodiodes are the ones used in the Atlas Able moon probes. They are 1N2175s and were used in the sun scanner that helped orient the satellites and keep them on course. Explorer 6, that took the first pictures of Earth from space, used one of them to keep its orientation stable. There is no data on when TI first developed the 1N2175, but the Space Technology Labs photo is from 1959. I have a couple of different versions with and without flexible gold leads and a longer and a shorter body style. As you can see, these are marked TI on one side and 1N2175 on the other. The top epoxy has glass bubbles that make it hard to see the silicon die underneath. These sensors only have openings at the top because they are very directional in nature. Here's how it worked. As the spacecraft spun, the scanner slit swept past the sun once every revolution, firing a single pulse each time it did. That pulse told ground control exactly which way the spacecraft is pointing. In turn, thrusters could be used to adjust the satellite's attitude. Let's drop in this transistor diode tester. On a photo diode, it'll only display the amount of resistance. Let's see what happens. Pretty easy to see exactly what the sensor can do. When we increase the amount of light on the sensor, its resistance drops significantly. It drops from 2.37 megaohms to 387 kiloohms. Don't forget to like and subscribe to Real Space Junk.
