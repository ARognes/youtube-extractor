y where you're free from feeling like the political difficult aspects that you run into on projects are you know constantly something on your mind I've just had to learn that you know I have to put all that stuff last and I have to put you know the purpose of my work first and one of the things one of the uh men who kind of was a mentor of mine when I was going through my my addiction recovery asked me to do is he's like well why don't you start tithing 10% of your income to the church and at first I was like dude I I've been broke I'm barely you know making enough month to month I'm kind of coming out of it but like you know I have no retirement I have no emergency fund I have no you know stocks and bonds all these things that I had before are all gone and now I'm supposed to give 10% of what I make you know to the church and you know he really challenged me and said well you know you have to decide if you think this believing in God thing is just like an intellectual exercise or if you really believe if you really believe in God and you believe that he loves you and cares about you and wants to see you flourish in your life giving some money to the church as just a way of showing like I trust that I I don't have to hold on to all my money and have all this tension around it and be worried and you know if I if I got to spend 10% less month-to Monon on things making whatever change is necessary to do that he was like you know that's something that will break you free of this fear of being provided for cuz you got to imagine at that time I was really scared about having enough money for my family and I've been doing that now for almost three years and it's really been amazing I I'd love to tell you that since doing that I've made way more money and all this stuff again that'd be BS it's BS and also I hope you're getting my point with this video and all my videos is like I'm not here to try to make you rich I'm not here to try to make you you know the smartest programmer and everybody look up to you I'm here to help you be healthy about this industry and about your job and a big part of that I think is if you find a way to spend some of your money in a way that benefits people other than yourselves and I'm not trying to tell you what to do I'm just saying how I did it it really can change your relationship with work in a way where I'll be honest with you I still worry about money sometimes but I'm not nearly as worried because I I really put my faith in in my my case the Lord to provide for me not just my ability to do the work and then the other thing is you know I've been sober now for almost 5 Years it'll be 5 years in March I really got sober about six years ago I had one slip up the first year so I don't count it but you know after you've been sober for almost 5 years you know you have to learn a lot of new ways of coping with things in life uh when stress used to happen I had a lot of things I would run to that just don't work anymore and once you start to learn some of those new coping mechanisms and strategies um life does start to get a little bit easier at work the other thing I do um when I make these videos when I coach people if I'm on a contract I try to put pleasing God above other people I know this will seem like an abstract concept if you don't believe in God and that's okay you don't have to to to watch this video but if I put my faith in like that this manager is going to reward me or this client's going to appreciate me I can't control that I may do the best job ever and they don't give a crap what am I going to do then just stew around and uh that's what I used to do it's much better I'm like Lord I'm going to do a good job regardless and if I get rewarded great if I don't get rewarded fine you know you've got some other purpose for me I focus almost exclusively whenever I can now on the good things in my life I try to protect myself from negative crap on social media uh I post on Twitter but I honestly don't read it a lot uh because it's just not good for me and you know I try to just accept that part of life and growing is suffering you know I'm going to have times where I don't make as much money you know I in my future I can't guarantee I'm not going to get sick you know and have something happen and I'll I'll go broke or lose my house right I can't guarantee any of those things but I also can't guarantee that better things aren't in store for me in the future and you know this whole process of going on YouTube and meeting so many people and coaching people and getting all the feedback that you all give me in the comments that's not something that I force to happen there's no guarantee that when you put a video out there people are going to give a crap there's no guarantee anytime I share anything that anybody's going to benefit from it or talk to me and finally the last thing that you know I I continue to try to put first is to not put my personal value who I am as a human being in my work and the money I make I'll be honest when my marriage was falling apart when my relationships with my children were falling apart heart when I was in the midst of my addiction how I was doing at work was the one thing that I held on to that was sort of the measuring stick for me as to whether my life meant anything and when that all fell apart I started to find what really mattered in my life and who really cared about me and I found very few people that I thought cared about me actually cared about me my wife was the number one person that I found even though our marriage was I thought falling apart when when we really got sober and we went through a lot of of our problems I found she was probably the biggest person in my life who really did care about me even when I was down um my mom also I found you know even though we've had a very contentious relationship over the years was one of the people in my life that that really kind of tried to lift me up when I was falling apart there for a while so I know this video is long and and it's been kind of uncomfortable to make if I'm really honest with you but I just want to encourage you that you know when you're watching these videos from me yes I'm trying to help people yes I'm trying to build a business yes I'd like to get my videos viewed but what I'm not trying to do is clickbait people into watching videos just to get views or you know shove a bunch of my ideology down your throat so that you think you like I've got all the answers I know I have a lot of experience um I know that you know my heart is in a place I hope that I can help you but as much as I can be doing as a human I mean I'm flawed right I I I have needs I make mistakes AK Still to this Dad of stupid my heart I'm trying to keep it in a place the best I can I pray about this all the time to have these videos really be of True Value to you um and they're not just some trendy you know about the latest new programming fad that's come out that's going to get you know half a million views but then in a year from now nobody's going to give a crap because you know the the tides have changed I'm trying to make things for you that are Timeless and that you know hopefully 5 10 years from now at least a significant portion of the videos I've made will still be pertinent and practical to you and so thanks for watching this uh if you have any personal experiences with burnout uh if if you got anything you're struggling with yourself that you want to share if you've recovered from burnout you got tips for other people um if you see yourself in danger of burnout you want to share what's going on maybe get some help from me and other people you know leave me some comments but until next time thanks [Music]
