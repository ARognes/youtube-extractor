transcript: so I was scrolling through Twitter and I saw this tweet and I just had to make a video I could not believe it and I kid you not oh I'll try to make this video on this side oh no these are just terrible lies don't let people lie to you why is 5G what are the hashtags so when you see tweets like this and if you happen to be new to programming this has to be so defeating if you've been programming only for a few days and you feel like you don't understand the language that's totally normal it took me so long to understand and learn programming so let me tell you a little bit about my story so when I first really got into programming it was after a long life of making many mistakes including smoking meth failing out of college multiple times I was about 20 21 when I really started taking things seriously so I'm not like some sort of child prodigy yeah I did some programming when I was younger I had some basic familiarity with like ifs and while Loops but I wouldn't say that I had really any idea how to program and something bit me during that time I always attributed to the stupidest thing ever which is The Social Network movie it just somehow gave me the inspiration to really want to be better at things it's not that I thought oh I'm gonna make a billion dollar company though I hope I would have I tried to start my own company but it was that I could build anything I could build anything thing that I wanted you know what that gets you through so much more than hey learn how to program in 10 days having a goal having this desire having the ability to build whatever you want or believe that you can is so much more beneficial to your career than any of this crappy advice out there on Twitter okay you can't just digest 10 resources and become better you need to put into practice the things that you've read and do it multiple times to be able to gain the experience to see the different errors and be able to apply those to new situations and I don't want these people seeing these things that tell you you can do it in such short period of times and wonder why am I not good enough why am I not understanding it why am I not getting a job in three months the reality to this situation especially in this economy right now in 2022 end of the year is that we have a very hard time for the next couple years coming up and if you're not willing to be the hardest working the one that's putting in the most hours the one that's trying the best to learn everything they can I think that the next couple years are going to be hard sure and a couple years after that it could become really easy again there could be a plenty of opportunity for everybody but I do think that in the next couple years you really either have to be willing to be the best which means you're gonna have to put in effort or it's gonna be rough there is no 10-day there is no two weeks there really is no three months sure in three months you could learn how to use react you could be okay at JavaScript but you're not a great programmer you're not even a good programmer you don't even really understand it I know that feels kind of like I'm talking down to people or being mean but it's something that you only understand in retrospect when I look at how good of a programmer I was in 2017 I think man that person was an idiot and I practically had a decade of experience at that point when I look at my code I made yesterday I think man that guy's an idiot and that's me yesterday so when you see these things when when you see these people celebrating hey you can get a job in three months get 100K in six months and get this much money yeah I'm talking about you Mr prank I don't want you to be discouraged I don't want you to feel like you can trust me if there's one thing that I could try to convince you of more than anything else is that you have the capability to be great it's just the willingness for yourself to do the step after step that it takes to be great it is hard work there is no shortcuts and only those who are willing to go the distance will achieve it I have been programming now for 15 years and I still program about 60 hours a week and about 15 of those hours are spent to learning new things because I just have to keep on getting better at what I do so I hope this is really encouraging for you I hope that it helps you feel like you're in an okay Place hey if you like the video hit the like button subscribe to the channel you know I would appreciate it I really want to get that 200 fifty thousand Subs I know that's a huge number I'm only I'm slightly more than halfway there but I want to get it hey thank you the name is the prime machine
