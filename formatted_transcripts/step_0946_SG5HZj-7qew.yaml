transcript: We tend to, at least I speak for myself, act in an unreasonable way. If I love someone, >> that's because you're confusing love with care. See, when when people say you are my friend, you are my sister, you are my my wife, my girlfriend, you are supposed to care about me, meaning you're supposed to sacrifice for me. You're supposed to show me attention. And if you need to do something unreasonable to demonstrate this so-called love that you have for me, this attention, this care, the support, then so be it. That's what I require of you. But when they say that they require care, not love. Because as you know, as we all know, love doesn't make any demands. And love doesn't ask for sacrifice. And love would never want you to go into vice to to prove itself to someone. And love never asks you to prove anything to anyone. Love never asks you to prove anything to it or to yourself to anyone. So what makes you think that it becomes more difficult when you love someone to act out of reason? Because uh love quite the opposite tells you do not sacrifice. I don't ask it of you. If you sacrifice anything for anyone, not because you wanted to, but but to prove love, but because they demand it, because they require from you, then you are in fact out of love. You do not have me. That's what love tells you. So love makes it easier for you to not make sacrifices in the name of someone else which goes against reason against justice against truth against what is right and proper and real. So and and with everything else I'm just mentioning sacrifice but again all these other things. Love does not ask you to prove love does not ask you to judge anyone. Love does not ask you to look down on anyone else or to look down on yourself. Love does not ask you to idolize anyone or anything. In fact, it says the opposite. The more you concentrate me on someone, the less you shall have me. This is why all those people who adore certain people, they're almost like worshiping them, right? They're saying, "I love this person and I will do everything for that person." And that very much includes, by the way, cheating, lying, deceiving, stealing, um, literally anything, anything that this person would require of them. And more often than not, in fact, I would say every single time, those people who are loved the most are then hated the most because you're idolizing someone or something that cannot be an idol. It cannot be perfect. It cannot be a god. It will make a mistake. And as soon as someone that you idolize makes a mistake, they fall out of idolatry, they become lesser than an idol. And then you say, "You stabbed me in the back. You lied to me. You pretended to be one thing." And now it turns out you're not perfect. You're not like you said you were or like you thought they were. Whatever it may be, either way, you will get disappointed. That's the point. And so love doesn't require any of those things that care requires. And so whenever we think though we are in love, we are of care. And in so in fact the the very last thing we have when we care about someone in this way, the very last thing is is love that we have. And so if you want to discuss how care makes it more difficult to be of reason, no problem. That's that's very clear to you, right? And you wouldn't even have that confusion. You wouldn't even ask that question. But that love makes it harder to be of reason. No way. It makes it easier. In fact, love and reason are are tightly related because reason brings you to peace and love is peace. You're not at peace when you're sacrificing. You're not at peace when you're trying to prove something to someone. You're not at peace when you're suffering to to to show anyone how important they are to you. So, love is not peace. I mean um care is not peace and love is not care. And uh love makes it easier to reason to be of reason and reason makes it easier to be of love not harder. Does that make sense? >> But certainly loving someone loving someone implies care. How do we make like that distinction between >> loving someone does not require care. Loving someone No, loving someone requires that you don't care. So to love someone is to wish them well. >> Okay. >> Yeah. Of course. >> And and to wish someone well is this that they know the difference between right and wrong. good and bad, uh, vice and virtue, awareness and unawareness, all these highest, most beautiful, most proper things for a human being. That is love. To wish these things onto onto someone else is love. And this is how it is possible to love everyone. You see, you cannot romantically love everyone. Impossible. and you wouldn't want to. But in this way to wish well to wish the greatest things a human being can experience and be in the presence of onto someone else. What is more loving than that? So to wish well is actually a much more loving thing to do both in intensity as well as in quantity. So now you are able to love every single human being on earth and everything else thing else because even someone who you think is a criminal is a bad person is is a liar, cheater, deceiver, a cruel, violent person. Even to them you would wish this no that they know good from bad, right and right from wrong and and vice from virtue and awareness from unawareness. Who would you not wish them on to? In fact, the so-called worse a person, the more they are in need of this and the more they would benefit from this and the more we all would benefit because there is nothing more beneficial to an aware person than other unaware people becoming aware. And so love in this sense is something that we can do for everyone and will want to do for everyone and thereby we will exclude no one. We will judge no one because all it is is to wish well. It is not to apply a certain standard which is what care is. Love does not apply a certain standard. Love is simply a wish. I wish you well wherever you are at whatever stage you are. I wish you well. And so in that sense I love you. This is the best most important most fundamental um highest and most valuable thing you could say and wish on to more importantly anyone. Whether this is your romantic partner or a complete stranger. It is the best thing you can do for anyone including yourself. This is why so many people who are unable to love themselves try to go and love someone else with the expectation that that will fix them too. There's so many people out there you hear it all the time. They say, "I want to learn love, learn to love myself by learning some by loving someone else." They think that if they pour love onto someone else, this person is going to pour love onto them and thereby make them worthy of them loving themselves. What a convoluted plan. What a mess. And then when they pour all this love onto someone with that expectation which is extremely cruel and selfish if you think about it and then this other person either they don't receive enough love from them or they or this is the problem. No matter how much love this other person would give you so-called love it would never be enough for you because you don't know how to love yourself. And so then you're going to think there's something wrong with that person because they're not able to give you enough love or the love that you deserve or the love that you're looking for. And since a romantic partner is supposed to be your only partner, I mean, in case you believe that way, you should never romantically be involved with the with the entire world at the same time. That's for sure. Then you say, "Oh, okay. I just picked the wrong partner." And then you then they move on to the next one and the next one and the next one and the next one and they can never do that with every single human being. So they will never realize that it's not them and that what they're trying to give and receive it was never love and they will never know and they will never love. But this is what love truly is. And so the more you concentrate it on someone, the more you can be sure that it is care, not love. Because love cannot be concentrated. As soon as you take love and you try to squish it together so that it becomes concentrated, dense enough to give to one person, it will slip out of your hands and it will go away and and you will be out of love. It will say love will say I'm out. You are forcing me into something that I am not. And love will not let you do that. Care will let you do that. You can break pieces off of care and you can put them together and and you can do whatever you want. You can shape it and give it to someone else. And then of course you're going to want them to do the same thing in return for you. And if they don't do it, uh oh. And even if they do do it, they're going to have to do it again. one time isn't enough and the next time better be bigger and better. So on and so forth until it becomes impossible to show that much care which was never right to begin with. So when you truly understand what love is and when you truly love everyone, that's when you can love someone. That's why we always say around here, I didn't invent this, but I certainly partake in it. The idea that you cannot love anyone until you love everyone. And this is what it means to love everyone, to wish everyone well. So once you are able to wish everyone well, you are able to love anyone, yourself or anyone else. The one and only thing that stands between you and the ability to wish everyone well is your anger, is your hatred, is your resentment, is your bit bitterness, your your disappointment, your frustration, your pride. All of the passions, all of the extreme emotions, those are what stand in the way. As soon as you let go of hatred, of resentment, of anger, of pride, of of judgment, all these things which are uh emotions, passions as well as vices, coincidentally or not so coincidentally, as soon as you let go of them, you are able to wish everyone wealth. You see it so many times. You say enemies enemies do not wish each other well. Is there a more obvious thing to say than that? Enemies cannot do not wish each other well. Why? Because they hate each other. They resent each other. And if they were would let go of their anger, they think that they would let the other person win. And so they would rather suffer. They would rather never know what love is, including for themselves, and rather keep fighting and struggling and suffering and live a life of agony than to say, "Anger is destroying me. Anger is wrong. And I wish I wish that person well because especially like we said before if they're wrongdoers, if they're c criminal so-called evil people, especially then I wish them well because especially then are they in lack of all of those things that would benefit me also at least in a physical way. Right? If all the ignorant, dangerous people that you meet out when you're driving your car out in traffic, if you wish them well and that wish came true, that they finally understand right from wrong, awareness from unawareness, it would be safer for you. Never mind them. But of course, that's mixing the physical and the spiritual. Again, we don't want to get into that, but you know what I mean. It's just an example. And so, this is what love is. So now tell me again that love makes it more difficult to be of reason.
