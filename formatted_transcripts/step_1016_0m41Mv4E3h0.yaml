transcript: "Si tu veux progresser en français encore plus vite, rejoins le club Gaspard Français \U0001F449 https://gaspardfrancais.carrd.co/\n\n20 expressions françaises que les jeunes utilisent vraiment pour mieux comprendre les séries françaises, les films et les discussions entre amis.\n\nDans cette vidéo, je t’explique du français familier et de l’argot français avec des situations simples et concrètes. Grâce à la méthode comprehensible input, tu vas comprendre naturellement le sens des expressions et mieux les mémoriser.\n\nCette vidéo va t’aider à :\n• comprendre les jeunes Français quand ils parlent\n• découvrir des expressions françaises familières\n• mieux comprendre les séries et les films français\n• améliorer ta compréhension orale\n• apprendre du vocabulaire naturel et actuel\n• parler français de façon plus naturelle\n\nTu vas notamment apprendre :\naskip, en vrai, j’avoue, grave, de ouf, vas-y, t’as capté, je suis en mode, j’ai la flemme, je suis déter, je suis à la bourre, je suis en galère, je suis en PLS, j’ai le seum, je suis refait, tu forces, c’est chelou, c’est cringe, c’est relou et ça me fume.\n\nJe t’explique chaque expression avec du français simple, pour que tu comprennes ce qu’elle veut vraiment dire et dans quelles situations tu peux l’entendre.\n\nAttention : ces expressions sont surtout utilisées entre amis ou dans des conversations informelles. Ne les utilise pas forcément avec ton patron, ton professeur ou dans une situation très professionnelle.\n\n\U0001F449 Regarde une première fois pour comprendre les expressions\n\U0001F449 Puis regarde une deuxième fois pour mieux les retenir\n\U0001F449 Écris en commentaire l’expression que tu préfères\n\nSi tu veux apprendre le français naturellement avec du vocabulaire du quotidien, des expressions utiles et du comprehensible input, abonne-toi pour plus de vidéos en français facile.\n\n#apprendrelefrançais #françaisfacile #argotfrançais #expressionsfrançaises #françaisfamilier #frenchcomprehensibleinput #vocabulairefrançais #comprendrelefrançais #LearnFrench #FrenchListening #frenchlanguage\n\napprendre le français, expressions françaises, expressions françaises jeunes, argot français, français familier, français oral, comprendre les jeunes français, comprendre le français parlé, vocabulaire français, vocabulaire français familier, expressions françaises du quotidien, apprendre l’argot français, askip, j’ai le seum, j’ai la flemme, je suis à la bourre, je suis en galère, c’est chelou, c’est cringe, c’est relou, French slang, French slang expressions, informal French, spoken French, everyday French, French expressions, French vocabulary, French listening practice, understand native French speakers, learn French naturally, French for intermediate learners"
