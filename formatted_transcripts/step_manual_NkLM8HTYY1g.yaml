transcript: '{"content":"\n[33.6s] Many people who get drawn \ninto destructive relationships\n[36.32s] — from domestic to professional to ideological —\n[40.52s] often find that the destructive \nbehaviour only emerges\n[43.56s] some time into the relationship.\n[46.04s] We find ourselves in a spin\n[47.68s] struggling to recognise the \npeople we thought we knew.\n[51.8s] Unfortunately, by the time we get our \nbearings and realise what’s going on\n[55.68s] it’s sometimes too late to extract \nourselves straightforwardly.\n[59.48s] We might’ve formed social connections \nthat are tough to untangle,\n[63.32s] made commitments that are difficult to break.\n[66.2s] Be great — wouldn’t it? — \nif before we’d got involved\n[69.52s] we’d had a list of clear, unambiguous \nwarning signs to watch for.\n[74.2s] ‘Red flag’ has become a common term for attributes\n[77.04s] considered to be indicators of bad actors.\n[79.72s] But there are problems with the concept.\n[82.4s] One massive issue is overuse.\n[85.16s] The term ‘red flag’ gets applied\n[87.08s] to a ridiculous range of traits and behaviours.\n[90.2s] Some of the more absurd examples I’ve come across\n[92.56s] include not paying for both parties on a date,\n[95.32s] no religious belief, a love of classical music,\n[98.76s] being an only child, having \nthe ‘wrong’ kind of phone.\n[103.44s] These kinds of false red flags can \narise from individual prejudice\n[107.76s] or — on the group level — tribalism.\n[111.2s] Attributes are labelled red flags not \nbecause they signify any actual threat\n[115.88s] but merely because they don’t \nconform to personal preferences.\n[119.92s] More credible lists of red flags\n[121.76s] feature manipulative tactics \nknown to be associated\n[125.2s] with genuinely destructive, \nexploitative individuals and groups\n[129.76s] including various superficially \npositive behaviours\n[132.68s] designed to reel targets in.\n[135.36s] For example, love bombing —\n[136.88s] showering targets with \nattention, affection and praise\n[141.0s] or mirroring — professing \nsimilar interests, beliefs,\n[145.0s] preferences and experiences to \ncreate an illusion of connection.\n[149.92s] But even here, things are far from clear-cut.\n[153.44s] Many people have commented to me over the years\n[155.76s] that these well-documented \nkinds of red-flag behaviours\n[158.84s] are commonly exhibited by innocent parties.\n[162.24s] Someone I’ll call Jason\n[163.8s] who was love-bombed by members \nof a deeply damaging group\n[167.12s] said he became convinced his \nferociously friendly new neighbours\n[170.88s] would one day reveal some murky agenda.\n[174.64s] After a couple of years, he realised \nthey were just genuinely warm people.\n[179.84s] But, for Jason, it raised \na very reasonable question:\n[183.88s] how do you tell the difference between \nharmless and harmful love-bombers?\n[188.96s] The same question holds for mirroring.\n[191.96s] Years ago, in a group interview for \none of my first counselling courses\n[196.0s] we were asked to organise \na hypothetical group meal.\n[200.32s] It was a completely arbitrary exercise\n[202.76s] designed to see how we interacted.\n[205.96s] Someone suggested everyone should \nshout out their favourite dessert.\n[210.16s] I said, ‘Zabaglione’ — which is an \nItalian alcoholic whipped custard.\n[215.56s] To my surprise, the next \nperson also said zabaglione.\n[220.12s] So did the next. And the next.\n[224.04s] Only the fifth person chose something different.\n[228.12s] I’ve jokingly called it the zabaglione effect.\n[231.68s] It stretched credulity to believe this obscure \ndessert was such a universal favourite.\n[237.56s] And indeed one group member later confessed\n[240.44s] she just said it to help us \nget to a group consensus.\n[244.6s] Another said he couldn’t think \nof anything else in the moment.\n[248.36s] The third made no retraction.\n[251.36s] Professing preferences, interests \nand beliefs we don’t necessarily hold\n[255.92s] can stem from various motivations.\n[258.8s] Many targets of abuse habitually echo other people\n[262.96s] because historically voicing their own views\n[265.84s] led to punishment and ridicule.\n[268.8s] So if a behaviour can be \ndriven by all kinds of motives\n[271.94s] — bad and benign —\n[273.92s] what does it even mean to call it a red flag?\n[277.72s] The term ‘red flag’ isn’t about saying:\n[280.28s] when you see this behaviour, run.\n[283.08s] That sentiment applies more to what we \nmight call ‘red lights’ or ‘deal-breakers’\n[287.44s] — i.e. instances of coercive, \ncontrolling and destructive behaviour\n[292.96s] including violence, threats and mind games.\n[296.96s] Labelling a behaviour as a red flag\n[298.96s] is more about saying: this needs a closer look.\n[302.68s] This person or group could be innocent\n[305.68s] but bad actors are also \nknown to behave in these ways\n[308.8s] to manipulate and exploit their targets.\n[312.24s] So I need to pay attention, \nkeep a healthy guard up\n[316.12s] until I feel confident about \nthe motives at play here.\n[320.28s] Of course some of us prefer to keep things simple\n[323.2s] and treat red flags like red lights.\n[326.24s] Take them as evidence of wicked intent.\n[330.0s] In doing that, we can end up \npushing lots of good people away.\n[334.52s] And for individuals who already \nhave a tendency to self-isolate\n[338.64s] that can further magnify their isolation\n[341.28s] and cut them off from valuable support.\n[345.84s] Assessing the motives behind red-flag \nbehaviour isn’t always straightforward.\n[351.12s] None of us are mind readers\n[352.8s] and making an informed judgement \ncan require a lot of observation\n[356.72s] across many situations over a span of time.\n[360.76s] Like a court case, we have to \nconsider the weight of the evidence\n[365.24s] assess it dispassionately\n[367.4s] tolerate ambiguity as we entertain \nthe possibility of guilt or innocence\n[372.72s] and take whatever time we \nneed to arrive at our verdict.\n[377.72s] I’d like to explore this \nprocess of assessing motives\n[381.146s] with a case study of a therapy \nclient I’ll call ‘Isak’.\n[394.6s] Isak came to therapy following a \ncouple of abusive relationships.\n[399.32s] His confidence had taken a hefty hammering\n[401.64s] and he was annoyed at himself \nfor falling for a second abuser\n[405.04s] barely months after leaving the first.\n[408.08s] He’d thought he was on safe ground\n[409.96s] because the second one was so different.\n[412.72s] The first, Sam, had been \ngentle, humble, intellectual.\n[418.48s] When Jake came along, he \nseemed like the total opposite:\n[421.88s] playful, excitable, goofy.\n[425.44s] But over time, Jake’s behaviour \nchanged just like Sam’s had\n[429.76s] becoming fiercely critical, \ncontrolling and coercive.\n[434.88s] When we’ve had damaging experiences \nwith an individual or group\n[438.84s] we sometimes avoid people who appear \nsimilar in terms of basic temperament.\n[443.68s] But by focusing on surface presentation \nstyle, we can miss deeper patterns.\n[449.52s] Despite their apparent differences, Sam \nand Jake employed very similar tactics.\n[454.68s] As we explored these tactics\n[456.64s] Isak saw how Sam and Jake had swiftly \nforged a false sense of connection.\n[462.24s] But he still had a hard time seeing \ntheir behaviour as red flags.\n[466.4s] Because he’d seen it before. In his \nvery first relationship with Greg.\n[473.48s] Greg swept into Isak’s life like a dust devil.\n[477.04s] They crossed paths in their college \ncanteen and instantly clicked.\n[481.28s] Shared the same outlook, interests, experiences.\n[485.2s] Confided things they’d never confessed before.\n[488.2s] In no time, they were living together.\n[490.72s] It was the happiest time of Isak’s life.\n[494.24s] Tragically, after just a handful of years together\n[496.96s] an aggressive cancer that Greg had \nsurvived in his teenage years returned.\n[502.04s] This time he didn’t make it.\n[504.72s] Isak’s relationship with Greg became a benchmark —\n[507.84s] a template for what a \nrelationship should look like.\n[511.0s] Spontaneous, impulsive, no holding back.\n[515.56s] While it was plain to see \nwhy Greg — and now Isak —\n[519.2s] had taken this seize-the-day approach to life\n[521.92s] we looked at the idea that ‘Carpe diem!’\n[524.24s] might not always be the best guiding principle.\n[527.52s] Great if you were lucky enough to meet a Greg.\n[530.16s] But a red carpet for bad actors \nlooking to bypass security checks\n[534.44s] and shortcut their way into someone’s life.\n[538.28s] A few months into therapy\n[539.92s] Isak revealed he’d started \nseeing someone called Devon.\n[544.0s] He hadn’t wanted to talk about it until now\n[546.04s] because he thought analysing it would kill it.\n[548.96s] They’d met one lunchtime at a park \nnear Isak’s work and instantly clicked.\n[554.68s] Things went well for a few weeks.\n[556.76s] They’d had some great days out \nand found they had tons in common.\n[561.0s] Recently Devon had organised an \namazing weekend break to Europe.\n[565.52s] But on their last night, the mood changed\n[568.04s] when Isak suggested they should take things slow.\n[571.48s] Devon became suddenly distant.\n[573.84s] And Isak feared he’d ruined everything.\n[577.48s] We hit rewind and reviewed \nthe events in more detail.\n[582.6s] Sitting in the park one day\n[584.28s] Isak’s joined by a passing jogger, Devon.\n[588.0s] They get talking.\n[589.84s] Everything Isak likes, Devon seems to like too —\n[593.48s] same music, same films, same food.\n[597.8s] When Isak mentions he’s \nalways wanted to visit Berlin\n[601.08s] Devon says it’s been his dream too.\n[604.32s] Isak said it crossed his mind that \nDevon might be trying to mirror him.\n[608.28s] But he’d spoken so fluently \nabout their mutual interests.\n[612.48s] He then reminded himself \nthat Sam and Jake had too.\n[616.52s] Isak and Devon exchange phone numbers.\n[619.92s] Over the following month, they go for drives out\n[622.16s] to the countryside and the coast.\n[624.64s] Isak now remembers that \nDevon commented on his shirts\n[628.36s] and bought some in a similar style.\n[631.24s] He also remembers that Devon \nseemed intensely interested\n[634.24s] in his family and past relationships.\n[638.08s] Again, this could be completely innocent.\n[640.68s] We want to know who we’re with.\n[643.28s] But this intense probing is also consistent\n[646.0s] with the period of interrogation \ncommonly experienced by targets\n[649.84s] as abusers try to gauge weak \nspots and potential obstacles.\n[655.32s] Isak tells Devon about Sam and Jake.\n[658.72s] Devon says he’s had some abusive relationships too\n[661.76s] and gets emotional speaking about \nhow they shattered his confidence.\n[666.12s] He says he’s never been this open with anyone.\n[668.8s] But he feels safe with Isak.\n[670.92s] He has total faith in him and \nfeels like he can say anything.\n[675.56s] Again these sentiments could be sincere.\n[678.2s] But overblown expressions of trust \nare also a common manipulation\n[682.36s] designed to create a false bond.\n[685.52s] After a few weeks, Devon arranges \na weekend trip to Berlin.\n[690.16s] Isak is thrilled.\n[692.56s] In Germany, Devon showers \nIsak with gifts and attention.\n[697.32s] He tells Isak he’s never met anyone like him\n[700.04s] and he’s in constant awe of him.\n[702.92s] On their last night, Devon tells Isak\n[705.6s] he’d like to spend the rest of his life with him\n[708.12s] and asks if he can move in with \nIsak when they get back to the UK.\n[713.16s] The rush to commit is extremely \ncommon among bad actors\n[717.48s] from abusive partners to abusive \nideological groups to online scammers.\n[723.44s] Targets are pressured into situations \nthat are difficult to get out of.\n[728.68s] Isak suggests they take things slow.\n[731.64s] He needs time to think. Devon \nsays he doesn’t need any\n[735.56s] time — he’s sure. Isak says \nhe wants to be sure too.\n[741.68s] It’s worth underlining again \nthat all these behaviours\n[744.58s] — mirroring, interrogation, love bombing,\n[748.4s] overblown statements of trust, rushing to commit —\n[751.92s] can spring from benign motives.\n[754.6s] Some people are just impulsive and enthusiastic\n[757.88s] like Isak’s first partner Greg.\n[760.76s] The point is it’s a mistake to allow ourselves\n[763.48s] to be swept off our feet by these behaviours\n[766.04s] and abandon all caution\n[768.28s] especially when sizeable commitments are involved.\n[772.16s] In the morning, Devon is cold and distant.\n[776.04s] After a bleak taxi ride to the airport\n[778.44s] he says a breezy goodbye and \nleaves Isak to catch his flight.\n[784.0s] Devon’s dramatic mood swing \nshows a chilling ability\n[787.28s] to switch off the sunshine.\n[789.56s] The honeymoon is definitely over.\n[792.6s] But going over the events with a clearer head\n[795.08s] Isak begins to wonder how real the honeymoon was.\n[799.72s] Between this and the next therapy \nsession, Isak doesn’t hear from Devon\n[803.96s] although he notes Devon has been active online.\n[807.52s] He recalls that Sam often subjected him\n[809.88s] to silent treatments when they lived together\n[812.44s] sometimes ignoring him for days.\n[814.88s] Isak remembers it felt like \nbeing physically starved.\n[819.28s] With Devon’s mood swings \nand use of punitive silence\n[822.88s] the red flags are now giving way to red lights.\n[827.36s] Isak starts imagining life without Devon.\n[832.28s] In the next session, Isak reports \nthat Devon sent him an email\n[835.84s] saying he didn’t believe Isak \never wanted a relationship\n[839.2s] and that Isak had just used him.\n[841.72s] He made it clear the burden was \non Isak to prove his intentions.\n[847.24s] Isak recalls similar dominance tests \nin his relationships with Sam and Jake.\n[852.84s] It was always Isak who had to prove himself.\n[856.76s] For Isak, Devon’s email is the tipping point.\n[860.64s] He sends Devon a brief, \nterminating reply and blocks him.\n[865.56s] Over the next few sessions, \nIsak wrestles with ambivalence.\n[869.92s] Did he overreact? Were things really that bad?\n[874.12s] He remembers sweet moments with \nDevon that knock him off balance.\n[879.24s] This is the insidious effect \nof the abuser’s love bombing.\n[882.92s] It creates a tantalising idealistic \nimage of what might have been.\n[888.84s] Isak wonders if maybe Devon wasn’t a \ncomplete monster like Sam and Jake.\n[895.2s] Maybe Devon’s previous abusive \nrelationships just made him\n[898.52s] overly sensitive and he just \nneeded extra reassurance.\n[903.0s] Leaving aside the question \nof whether Devon’s accounts\n[905.52s] of those relationships were true, \nIsak raised an important point.\n[910.12s] Some targets of abuse begin relationships\n[912.44s] when they’re not yet ready to handle them\n[914.4s] — not able to negotiate,\n[916.56s] to set and/or meet reasonable expectations,\n[920.24s] to navigate conflict.\n[922.72s] Getting involved with people \nbased on who they might become\n[926.08s] instead of who they are right now\n[928.2s] can set both parties up for a very bumpy ride.\n[931.84s] Recovery has to come first, then relationships.\n[935.84s] People don’t have to be ‘monsters’ \nor predators to be unfit partners.\n[941.16s] We don’t have to diagnose them \nwith malignant personalities.\n[945.0s] We just have to look at their behaviour\n[947.32s] imagine it’s never going to change\n[949.36s] and ask ourselves if we’d be \nprepared to live with that.\n[954.76s] Some weeks after finishing with Devon\n[956.8s] Isak encounters him again at the park.\n[959.76s] Devon embarks on a lengthy monologue\n[962.0s] telling Isak he regrets how things ended.\n[964.96s] He says Isak was right to dump him.\n[967.28s] But he’s a different person now — thanks to Isak.\n[970.88s] He admires Isak for taking no nonsense.\n[973.88s] He wishes he was that strong.\n[976.32s] He wonders if they might be friends.\n[978.48s] And maybe down the line — who knows.\n[982.24s] I call this the revamp.\n[985.04s] Here, abusers come back for a second \ntry, claiming to have evolved.\n[989.76s] But all that’s evolved is their deviousness.\n[992.96s] Having underestimated the \ntarget the first time round\n[995.76s] the abuser attempts a more subtle game.\n[999.6s] Isak says he’s seeing someone.\n[1002.28s] It’s a lie but it’s all he can \nthink of to get rid of Devon.\n[1006.52s] It doesn’t work.\n[1008.04s] But it achieves something much more effective.\n[1011.12s] Devon explodes, repeating \nall his previous accusations.\n[1016.984s] Sometimes, when we arrive at a negative verdict\nabout a person or group\n[1021.44s] some part of us is left wondering \nif we made the right judgement.\n[1025.48s] But sometimes life hands us total vindication.\n[1030.2s] Isak observes him silently until he leaves.\n[1035.32s] There are no simple formulas \nfor identifying bad actors.\n[1040.0s] When we rely on simplistic \nideas about who to avoid\n[1043.52s] we often end up pushing away more good people.\n[1047.56s] Some bad actors make \nthemselves known very early on\n[1050.6s] with obvious red-light behaviours.\n[1053.8s] But others are extremely convincing.\n[1057.08s] Their red-flag behaviours can appear identical\n[1060.12s] to positive innocent behaviours\n[1062.464s] — the only difference being the underlying motive.\n[1065.92s] Even highly trained abuse experts \nare sometimes taken in by them.\n[1070.8s] To some degree, every new relationship \nrepresents a leap of faith.\n[1075.08s] But it doesn’t have to be a reckless one.\n[1077.88s] When we’re encouraged to make \ndecisions in states of intense emotion\n[1081.86s] — feeling swept off our feet, \nfeeling confused, feeling panic —\n[1087.4s] we need to take a step back, slow down\n[1090.6s] and assess the situation with a clear head.\n[1094.319s] Benign actors can stand close inspection.\n[1094.36s] As Isak’s story illustrates, we \nalso need to scrutinise ourselves.\n[1099.48s] The more we fill our heads \nwith magical idealistic notions\n[1103.56s] about relationships, families, life\n[1107.52s] the easier we are to exploit by bad actors\n[1110.24s] ready to promise us that magic.\n[1113.2s] If we want to see their red flags clearly\n[1116.04s] we need to remove our rose-coloured glasses."}'
