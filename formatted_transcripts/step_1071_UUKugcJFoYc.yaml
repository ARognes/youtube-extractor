transcript: One of my favorite features in VS Code that nobody talks about is the ability to port forward. All you need to do is click on this triple dot right here when you have your terminal open, or if your screen's bigger, it'll just show up, and you can see where it says ports. Click on that, and now we have the ability to forward a port. If we click on forward port, we can type in whatever the port of our application is. So, if we're running localhost 3000, we would type in 3000. In my case, I'm running on port 5173. You hit enter, and it'll take a few seconds, and it'll run up right here a forwarded port for you, which allows you to access this website from outside of your local computer, which is really useful for working with webhooks or working with other people, so you can share your site with them while it's still running locally on your computer. If I want to access this link, I can just click on it to open this up, and it'll open up your site. The very first time it opens, it'll ask you for a confirmation. You just have to click continue, and it'll bring you directly to your site. Now, if you want to use this for webhooks, this is why I really find this super useful, you need to change this visibility here to actually be public, because if it's private, it's going to ask you for that confirmation, but if you want this to be publicly available to anyone, you need to make sure cuz otherwise with private, you have to log in and authenticate with like your GitHub or Microsoft account, but while it's public, it's publicly available to anyone on the web, which means you can get webhooks sent directly to your computer from the web, which makes testing so easy. Honestly, this is a super underrated feature that I find not nearly enough people even know exist, so I highly recommend that you try this out the next time you need to be able to forward a port for anything.
