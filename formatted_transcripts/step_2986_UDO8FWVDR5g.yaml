transcript: It's funny doing these solved episodes because there is a consistent pattern that has begun to emerge, which is that whichever episode we're doing, the experience of doing it seems to take on the character of that episode's theme. So, for example, when we did an episode on procrastination, it took us like an extra 3 months of preparation to actually shoot that episode. When we did the episode on shame, Drew and I screwed that episode up so much that we actually felt very ashamed of how much we screwed it up beforehand and how much stuff we had to reshoot. When we did the happiness episode, we felt very light and easy and fulfilled cuz it was a very easy episode to shoot and a ton of fun. When we did confidence, I felt very confident about it. When we did change, we completely changed the set and the format. And this episode is about luck. And since we began taping this episode, everything unlucky seems to have been happening. Drew was having health issues, sleep issues, we had production issues, we had a hard drive failure, and now I have an empty chair across from me because Drew's flight got delayed and he was not able to get here for the last day of recording. So, I carry on to the end of the luck episode. I stumble through the finish line of this luck episode all alone. But let's go back to the top. Why is luck so underrated as a factor? Why like why don't we think about it more and why do we tend to think about it the wrong ways? Because as Annie Duke said, everything in life either is skill or luck. It's either a decision you made or it is chance. And we spend so much time thinking about our decisions, we rarely think about the chance element. And when we do, it's usually to preserve our good feelings about ourselves. It's a self-serving bias. We tell ourselves, like, oh, there's nothing I could do, that was just bad luck, even though it likely was a bad decision. We tell ourselves that we're brilliant and we're so smart even though maybe we benefited from good luck. Why do we seem to have such a hard time thinking about luck and fortune? And why do we avoid doing so? Well, I think there's a few reasons. For one, there's a legibility issue. It's it's unclear how much of what happens in our lives is ultimately within our control and how much is just a factor of circumstance. Like that's a blurry line that we often don't have a clear sense of what is what. And to get clarity around that line, we have to ask honest questions of ourselves which are quite uncomfortable, which is how much control do we have over our own lives? How much can we affect in our own lives? And that doesn't feel very good. We don't like to admit a lot of those things. On top of that, our brains' natural tendency is to ascribe meaning and value to good fortune or bad. We operate based on the just world hypothesis that if something good happens to us, it must be because there's something great about us. Or if something bad happens to us, it must be because we did something wrong. And ultimately, this can lead us into one of two traps. There's the fatalism trap, which is everything is luck, I have control over nothing, so why even bother and try? Or you have the self-serving delusion, which is I earned everything, there is no luck in my life, I'm pretty awesome. Don't even bother me with this The fatalism trap removes our responsibility to improve our own lives, and the delusion trap protects our ego and prevents us from learning from our failures. We briefly covered some of the western thought around luck, and we landed on the ancient Chinese framework of San Sai, which is heaven luck. It's the genetic lottery, the ovarian lottery, what you're born into. The earth luck, which is the broader environmental context that you put yourself in, which is generally determined by a handful of very high-leverage decisions you make throughout your life. And then there's the human luck, which is your ability to navigate each choice, each decision on a day-to-day basis to maximize your probability of achieving your goals. If life is a game of poker, then heaven luck is the cards that we get dealt. Earth luck is the table we choose to sit down and play at. And human luck is the choices that we make as we play. All three have a very profound effect on our outcomes. Heaven luck we have zero control over. Earth luck we have some control over, but on a very macro broad level. And then human luck we have full control over our decisions. When it comes to heaven luck, there's generally a temptation to ascribe some sort of inherent value based on where we were born, the circumstances we were born into, how we grew up. And the funny thing is is that it works against us in both cases, whether we were born into really good circumstances or we were born into the really bad circumstances. So, if we're born in the really great circumstances, there's a tendency to experience some sense of guilt of like, "What did I do to deserve this? Why was I blessed with all of these privileges and benefits when I didn't earn anything that the other people around me had to work really hard for." Now, while it's useful to see the discrepancies and the benefits that maybe we were born into, kind of a just an ever-present sense of guilt is not very useful or productive. Ultimately, we should take all of the things that we've been blessed with and try to leverage them to help others. If you were born with a particularly large amount of heaven luck, then I would say you have a moral duty or responsibility to leverage that heaven luck to distribute some of the benefits that you've received to as many people as possible. Now, on the flip side, if you were born into a situation with very little heaven luck, then that doesn't really change the fact that you are responsible for the outcomes in your life. It may not be fair that you were born into West Africa instead of Norway, but even if you were born there, it is still your responsibility to make the most of that situation that you possibly can. So, heaven luck tells us a lot about the circumstances from which we came, but they don't really tell us about what we should do. And because ultimately, the longer we're alive, the more our individual decisions play into our long-term results, it is hard to say that heaven luck should necessarily matter a whole lot to us at all. Our takeaway in this episode is that the goal with heaven luck is simply to become aware of it and to develop some sense of gratitude around it. And the way we develop that sense of gratitude is to remind ourselves and take perspectives of all of the potential realities that we could have been born into, but we were not. So, while there may be things about our lives that we feel bad about today, surely you can imagine an infinite amount of worse possible lives that you could have lived, but you're not living. And because of that, gratitude is accessible in any moment, at any time, to any person. First, a quick word from our sponsors. This episode is brought to you by Purpose, the app that I actually co-founded and built. Purpose is a coach in your pocket. It's an AI that you can actually [music] talk to about your life and all the issues that you're struggling with. But here's what makes it different. Every other app on your phone is engineered to keep you hooked, to make you feel good. They have feeds that pull you in, notifications that drag you back, and the hours disappear without your life getting any better for it. Purpose actually does the opposite. You tell it what's going on, it gives you honest, no-bullshit answers, and then it hands your time back to you. In fact, if you try to use it too much, it will just tell you to go touch grass. We recently rebuilt it. There's a fresh design, new tools, and some new quests made specifically to help you break your worst habits, [music] and a voice mode that is now available to everybody on iOS and Android. So, you can just talk it out instead of typing. So, if you want an AI mentor that gives it to you straight and then let's you get on with your life instead of an app built to keep you scrolling, get started for free at solved.deals/purpose. That's solved.deals/purpose. And we're back. Welcome back to Solved. Now, this brings us to Earth Luck, which is a set of broad environmentally-based decisions that we each have to make throughout our lives and the result of those decisions is that it either increases or decreases the surface area for good things to happen to us. For example, if I aspire to be a famous television actor and I'm trying to start my acting career in Boise, Idaho, I'm probably going to run into a lot of bad luck or at least I'm going to have very little good luck. But, if I move to Los Angeles and I surround myself with Hollywood and hundreds of other aspiring actors and producers and screenwriters, I am increasing my surface area for something serendipitous to happen to me that I can leverage and take advantage of and benefit from. So, there is a class of decisions throughout our lives that greatly influence the probabilistic outcomes of hundreds, if not thousands, of other decisions that happen down the road. The job or career you decide to pursue, the city that you decide to live in, the partner that you decide to marry and spend a life with. All of these things are one-time decisions that not only will greatly influence thousands of other decisions, but in many cases they will set the context and basis of all of those thousands of decisions. And so, maximizing Earth Luck is really just about understanding yourself, your goals, and what is the best environment to place yourself into that is going to maximize the opportunity of achieving those goals. This happens with the relationships you choose to build, the networks you choose to immesh yourself into, the environment that you choose to live in, all of these things have outsized impacts on all of the other decisions that you make, but also the decisions that are foisted upon you in the first place. Now, what's interesting is that Earth luck is kind of the first luck that there is some research on how you can develop skills to expand it. So, for example, developing good social skills can expand your Earth luck. If you are better able to meet and talk to and connect with new people, it's going to open doors for you wherever you go in situations that doors might have otherwise been closed. Another skill that we talked about is simply having an open mind. Being open to more consequences or more experiences seems to allow people to draw connections and find opportunities in environments that people who are a little bit more close-minded literally don't even see in front of them. In fact, some researchers have even gone as far as measuring luck in people based on how much they're aware of in their environment, how much they pay attention to, and how quickly they act on opportunities once they spot them. And then once you spot those opportunities, this is when human luck comes into play because even the best opportunities in life, there's always going to be a chance of failure. Nothing is ever 100% and nothing is ever 0%. There is always some probabilistic distribution of outcomes that you are setting up bets when you decide to pursue them. And because every decision you make has a probabilistic outcome, it means that you can't necessarily judge the quality of your decisions based on the quality of your results. You can move to LA to try to make something happen, but even if nothing happens, it doesn't mean that moving to LA was a bad decision. You can marry the partner you're in love with and be extremely happy with them for many years, but that doesn't necessarily mean it's a good decision depending on their traits and qualities and personality and the situations that they place you into over the coming years. Now, we have to be careful around this because we have all sorts of cognitive biases that prevent us from judging our decisions objectively and accurately. We have a self-serving bias, so we like to take credit for all the good things that happen and blame bad luck for all the bad things that happen. We have loss aversion, which causes us to overestimate the negative impact of failure and therefore not take a chance even when the odds are in our favor. Annie Duke and I talked about all sorts of different methods and ways that you can kind of counteract these biases and try to make better decisions consistently. And she raised a great point that it's we're always doing kind of this probabilistic thinking underneath the hood. It's just what we experience as intuition is our subconscious doing some of this statistical analysis and placing bets accordingly. But the problem is is that our intuitions under the hood are not super accurate. So, the best way to make these decisions accurate is to take the implicit intuitive decision-making and make it explicit. To actually write it out, try to forecast the results of a major life decision, try to see all of the contingencies and path dependencies and and what the the actual cost of failure looks like. Because once you do that, not only do you get more objectivity and more clarity around the decision itself, but it creates a form of accountability. You can go back and look at old decisions that you made and spot blind spots, spot biases, spot things that you didn't consider that you didn't look for. Find patterns of mistakes that you consistently make when you try to make decisions. The other thing that she talked about is developing a practice of doing a pre-mortem. This is very similar to the Stoic practice of negative visualization where you intentionally imagine the worst-case scenario and ask yourself, "What factors led to this worst-case scenario? What are the warning signs that this thing is not going to go well? How are we going to define and measure success and define and measure failure in the context of this decision?" Developing a sense of what all these things are going to look like before you make the decision is going to help you make a much better decision and then ironically make failure much less likely because you're going to know what to look out for and you're going to know what to prevent before it happens. And then finally, there's a volume approach to a lot of these decisions. Because the fact of the matter is is that anytime you were doing something with a probabilistic outcome many, many times in sequence, there's going to be a lot of volatility. You're going to go through periods where you do have a lot of negative outcomes even though you made good decisions. You're going to go through periods where you have a lot of positive outcomes even though maybe you made bad decisions. There's always going to be a little bit of variance and the best way to negate the impact of that variance is to increase volume. Because the more you increase volume, the more you weight everything towards skill and the less you weight things towards luck. On top of that, as you increase volume, you give yourself more opportunities and reps to learn from your failures and because you're moving quicker, you will find out if something is not the right path quicker as well. So, how should we really approach luck and consider luck in our lives? I think there's a general rule of thumb that is probably useful to follow, which is that anything from the present moment forward you should act as though you have full control over everything even though you don't. You should make decisions as if everything is up to you even though there's going to be things that you can't predict that are going to happen. Then when you're looking in hindsight, that's when you should try to be honest about what was you and what was the environment. What was heaven luck, what was earth luck, and what was human luck. So, while that's how we should approach our decisions, there's still a few other levers that we can pull to help us gain more perspective, more clarity, and a little bit more luck in our lives. So, one is kind of like a gratitude journal, but with a twist. Sit down every night or every week or whatever it is, write down some good things that happened to you, some things that you're grateful for, but also be very explicit on why you're grateful for them. What are the worst possible outcomes that could have happened, but didn't happen? But next, I want you to go a step further, which is to write out what are some potential things that you could be lucky about in the near future, that could break your way, that could go well, could happen. This is a simple exercise in drawing connections in your environment, so that you are more well-equipped to spot them when they do emerge. Right? When you tell yourself like, "Hey, I could actually meet somebody really cool at this event I'm going to this weekend." Instead of dreading it, you help prime your mind to see the opportunities in it. The second easy thing you can do to increase your luck today is just show up. Just do more things. Be in more rooms. Accept more invitations. Introduce yourself to more people. Again, the more surface area you create for yourself for serendipity, the more likely that serendipity is to happen. Now, a lot of people don't do this because they feel like it's a waste of time or, you know, it's if nine out of 10 people they meet, nothing's going to come of it, it's like, "Well, why why waste all that effort?" But if you think of it the other way, that one out of 10 people you meet could have a pretty significant impact on your life, then it makes sense to work through those other nine people as quickly as you possibly can. There's also something to to said about making asymmetric bets. Annie talked a lot about how emotionally our approach to betting is asymmetric to the downside, which is that we tend to overestimate the cost of failing and underestimate the the benefits of success. You can look for situations where there is an outsized benefit with very little cost. Again, walking into a room and introducing yourself to someone is a perfect example of that. I mean, when I met my wife, I was in a loud nightclub and she was just like the first girl that walked in the door that I saw that I was attracted to. I lost nothing by going over and talking to her, but what I gained was a partner for the rest of my life. And then finally, the last lever is how you choose to respond when things go wrong. There's a lot of research showing that people who experience more luck in their lives, they tend to bounce back faster. They don't dwell on the failures as long as others. They don't get mired in like the why me, what did I do to deserve this? This isn't fair. The world's unfair. They just try to learn something and move on as quickly as possible. And so ultimately, we imagine luck as being kind of this cosmic force that is thrust upon each of us in different ways. Some of us are just seem to be born extremely lucky and others seem to be born extremely unlucky. But like Annie said, luck is actually just kind of this ever-present roulette wheel to everything we do. And over a long enough period of time, all of us are going to experience good luck and bad luck in different proportions. And we're actually going to be very poor at identifying what the good luck is and what the bad luck is and where it begins and ends. Instead, it's simply more useful to acknowledge that everything we do in our lives has some element of chance to it, but we can manipulate our circumstances and our situations and our decisions to leverage our chances more optimally. We can put ourselves in situations that increase the odds of positive outcomes based on our goals. We can develop habits and skills that allow us to have more opportunities and to gain that volume that minimizes volatility. And then we can implement some basic decision-making practices and some basic mental practices that help us notice opportunities and make high conviction decisions on them sooner than we otherwise would. In sum, this is what luck actually is. It's developing a series of perspectives towards chance and probability that benefit ourselves and developing habits and behaviors that leverage the randomness in the world better than others. And so at the end of the day, Will's father was correct. Maybe there isn't such a thing as luck. There's just when opportunity meets preparation. Thank you all. I will see you next month with another great episode. And just a reminder, we do have a free PDF guide for this full episode. If you go to solvepodcast.com/luck, you can download it for free, get all of our resources, citations, references. Big thank you to Annie Duke for coming out and helping us out with this one. And as always, please follow, subscribe, support the show any way you can. We really appreciate it. My name is Mark Manson. I have no co-host. I'm terribly unlucky or am I lucky? Stay tuned. We'll find out next month. What's up, everybody? Thank you for watching. This video is one chapter of a much longer podcast episode about luck where Drew and I cover everything from why we underestimate luck's role in success to how the most lucky people actually engineer their own odds. You can find the other chapters here on YouTube. But if you want to watch or listen to episode now, click on the link in the description to watch the whole thing on Spotify. And if you want to work on the topic at your own pace, we have a free PDF guide with all of the resources, citations, and exercises at solvepodcast.com/luck. See you guys in the next section.
