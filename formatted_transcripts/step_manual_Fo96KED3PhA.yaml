transcript: '{"content":"\n[0.4s] Time feels like the backdrop to\n[2.399s] everything in our lives. We age, we\n[5.12s] plan, we reminisce, but how often do we\n[8.24s] really think about what time is and how\n[10.24s] it shapes our\n[11.8s] experience? And what did the Buddha have\n[14.08s] to say about time? In this video, we''ll\n[16.72s] explore what early Buddhism says and\n[18.96s] doesn''t say about time and how it\n[21.68s] relates to our practice, to\n[23.72s] impermanence, and to our lives. To begin\n[26.96s] with, it''s important to know what the\n[28.56s] Buddha does not say about certain\n[30.4s] aspects of time. For the Buddha, there\n[33.44s] were certain questions that were\n[34.88s] considered, he says,\n[36.52s] undeclared because they aren''t\n[38.399s] beneficial or relevant to the\n[40.079s] fundamentals of the spiritual life. They\n[42.719s] don''t lead to disillusionment,\n[44.32s] dispassion, sessation, peace, insight,\n[46.8s] awakening, and extinguishment.\n[49.92s] Included in this list of undeclared\n[52.44s] questions are those about whether the\n[54.96s] cosmos that is the the universe all\n[57.199s] there is is infinite or finite is\n[60.239s] everlasting or not\n[62.52s] everlasting. That said the Buddha also\n[65.68s] argues in a number of places that the\n[68.72s] past that the universe is\n[70.52s] essentially is discoverably\n[74.119s] beginningless. As he says, monastics,\n[77.68s] this ssara is without discoverable\n[80.159s] beginning. A first point is not\n[82.4s] discerned of beings roaming and\n[84.72s] wandering on hindered by ignorance and\n[87.2s] fettered by\n[89.24s] craving. Now the important thing is that\n[92.24s] strictly not the time not having a\n[95.0s] beginning is different from us not being\n[97.759s] able to discover a beginning to all\n[100.4s] things to beginning to samsara. That is\n[103.36s] to say, the only thing that the Buddha\n[105.92s] is saying here is we can''t find a\n[107.759s] beginning. That it''s pointless to\n[109.6s] speculate on a beginning or not a\n[111.84s] beginning to time because we can''t find\n[114.64s] one or we can''t find its opposite. So,\n[117.92s] it''s best simply to leave that question\n[120.439s] aside. Second, the Buddha illustrates an\n[123.92s] important difference between the present\n[126.88s] as it is as it relates to our lives and\n[129.679s] the past and the future. In particular,\n[132.72s] it''s the present and only the present\n[134.879s] that is our realm of effective action.\n[138.64s] As he\n[139.64s] says, don''t run back to the past. Don''t\n[142.879s] anticipate the future. What''s past is\n[145.28s] left behind. The future has not arrived.\n[148.959s] And any present phenomenon you clearly\n[151.44s] discern in every case. Today''s the day\n[154.64s] to keenly work. Who knows? Tomorrow may\n[157.519s] bring death.\n[159.68s] That is to say, the past is gone to us.\n[162.56s] We can''t actually see the past. And the\n[165.36s] future is not yet accessible to us. We\n[168.0s] can''t see the future. All that we can\n[170.72s] see, all that is truly present to us is\n[173.84s] here right now. That''s all we have to\n[176.48s] really work with actively. However, in a\n[180.319s] different suta that retells this same\n[183.0s] point, the Buddha says this and then\n[185.36s] leaves. And the SA asks the monk\n[188.08s] Mahakachana to explain the Buddha''s\n[190.879s] point in more detail. And Mahakana makes\n[194.239s] a very critical\n[196.36s] elaboration which is to say that there''s\n[198.72s] really nothing particularly special\n[201.519s] about the present about today. That is\n[204.56s] we can also he says falter in the\n[207.36s] present just as we can falter with\n[209.68s] respect to the past and the future. That\n[212.239s] is we can falter with it if we become\n[214.799s] attached to it. The same way we might\n[216.48s] become attached to something in the past\n[218.879s] or something in the future. As the\n[221.2s] Buddha says famously in the\n[223.08s] dharmapada, let go of the past, let go\n[225.92s] of the future, let go of the present,\n[228.879s] having gone beyond becoming.\n[232.48s] So that is to say that the Buddha''s\n[234.56s] attitude towards these three times, the\n[237.84s] past, present, and future, is not that\n[240.879s] one is more special or realer than\n[243.439s] another, but simply that one is our only\n[247.04s] place of effective action. Only one is\n[250.159s] the place that we can actually engage\n[251.92s] with our practice. And this is indeed a\n[255.599s] council of urgency. That is as the\n[258.16s] Buddhist says, we saw tomorrow you may\n[261.04s] die. You may not have more than the\n[263.12s] present. You may not have more than\n[265.12s] today to work with. So work diligently.\n[268.479s] Also, when discussing time in early\n[271.04s] Buddhism or in Buddhism at all or even\n[273.759s] really time in Indian religions, it''s\n[276.56s] important to note one difference that it\n[279.759s] has from a generally western conception\n[282.16s] of time. That is to say, in early\n[285.199s] Buddhism, time is essentially thought of\n[288.0s] as cyclical rather than linear. That is\n[291.759s] in the west, time is often framed or\n[294.96s] understood in religions and in\n[297.24s] philosophies as something with an\n[299.919s] identifiable beginning, a first moment,\n[302.8s] a moment of\n[304.12s] creation, and something with what we\n[307.12s] might term an identifiable end. What''s\n[310.08s] known sometimes as the escaton or end of\n[312.88s] time, the place at which all things will\n[316.24s] come to be or come to pass or come to\n[319.28s] fruition. Instead, in early Buddhism,\n[322.56s] time is understood to wander on in\n[326.08s] various respects with no again no\n[328.4s] discoverable beginning, no discoverable\n[331.32s] end. Samsara itself literally means a\n[334.72s] wandering on. The metaphor is here is\n[338.0s] often given as the wheel where things\n[341.36s] become come into being and then pass\n[343.44s] away.\n[345.039s] experiences are pleasant at one point,\n[347.199s] painful at another point, and then\n[348.96s] pleasant again. But we have to\n[351.199s] understand this as not being a kind of a\n[354.72s] gamblers''s fallacy that, you know, if\n[357.36s] you''re if you''re dealt a bad hand at one\n[360.0s] time, you''re guaranteed or much more\n[362.56s] likely to get a good hand the next. It''s\n[365.36s] rather that what hands you''re dealt\n[368.0s] depends upon your karmic baggage,\n[370.4s] depends upon how you''ve acted in the\n[372.8s] past and therefore what karmic seeds\n[375.039s] have been laid down for you and will\n[377.36s] come to fruition at a future time or at\n[379.84s] the present. And as I say, traditionally\n[382.56s] this is understood to be a beginningless\n[385.56s] process. That is that we have already\n[388.0s] undergone a beginningless number of\n[390.4s] lifetimes.\n[391.919s] a lifetime a number of lifetimes that is\n[394.319s] so enormous we cannot even consider\n[396.8s] counting them and the Buddha gives a\n[399.12s] number of simileies to sort of get this\n[401.36s] idea across in the in the early sutas\n[404.4s] for example he says if the bones of a\n[407.28s] single person for a single eon were\n[409.84s] gathered up they''d make a pile the size\n[412.16s] of a\n[413.24s] mountain and this simile and many others\n[415.84s] like it underpin the importance of\n[419.479s] practice because Without liberation,\n[422.56s] again on a traditional early Buddhist\n[424.919s] understanding, we are essentially\n[427.039s] trapped in this wheel of samsaric\n[429.759s] suffering indefinitely. That said, the\n[433.52s] context of our actual practice is in\n[437.28s] everyday time, is in our psychological\n[440.199s] present. We see thoughts and emotions\n[442.88s] arise. We see them pass. We see\n[446.88s] experiences coming into our senses and\n[449.44s] our reactions to them. This experienced\n[452.72s] time is where our practice takes place.\n[456.4s] And in this context, theorizing,\n[459.36s] speculating about a past or a future\n[461.919s] that goes on indefinitely isn''t really\n[464.319s] very helpful. Instead, what is helpful\n[467.28s] is to become aware of the ways in which\n[470.88s] craving and clinging can cause suffering\n[473.759s] to arise. right here and right now. We\n[477.36s] experience impermanence in all of what\n[480.24s] surrounds us and yet cling to the the\n[484.479s] what we think of as permanent. We see\n[487.84s] change all around us and yet crave for\n[490.879s] something unchanging. And this brings us\n[493.599s] around to the concept of the present\n[496.24s] moment. Some contemporary teachers like\n[499.52s] to explain this by saying that the\n[502.4s] present moment is really all that there\n[504.68s] is. But even this idea that the present\n[508.319s] moment is all there is is\n[510.72s] philosophically fraught is a complex and\n[514.159s] troubling question.\n[516.479s] to begin with in Einsteinian physics. We\n[519.2s] know from the relativ relativity of\n[522.839s] simultaneity that there is actually no\n[525.68s] privileged reference frame in which all\n[528.399s] beings experience a now at the same\n[531.0s] time. That is the present is something\n[533.92s] that itself is relative. And from\n[536.8s] neuroscience and indeed from early\n[539.44s] Buddhist conceptions of perception, we\n[542.32s] know that the the our sense our senses\n[546.0s] and our brain takes time to process\n[548.8s] information from the world. And so to\n[551.2s] that extent, we''re always living in\n[554.0s] something like a little bit in the past\n[556.959s] because all the information we''re\n[558.48s] getting and processing is no longer in\n[561.12s] the specific present in which we live,\n[563.279s] but in a fraction of a second. the p in\n[565.92s] the past. Now, the Buddha didn''t really\n[568.8s] engage with these kinds of contemporary\n[571.68s] scientific theories, at least not\n[573.44s] directly. That would be an anacronism.\n[576.24s] However, he certainly understood our\n[578.16s] tendency to crave for the permanent. He\n[581.519s] understood the illusion of such\n[583.76s] permanence. And so the point here in our\n[586.72s] practice is not to look for some\n[590.36s] illusory privileged present moment that\n[593.839s] really exists, but rather to understand\n[597.76s] the ways that craving and clinging arise\n[600.48s] and pass away. That is to let go of our\n[604.08s] fixation on or our craving for a fixed\n[607.6s] past, present or future. In a nutshell,\n[611.279s] the Buddha''s understanding of time was\n[613.279s] both cosmological on the one hand and\n[616.32s] practical on the other.\n[618.76s] Cosmologically, the Buddha did indeed\n[621.12s] reject many uh very\n[624.44s] fundamental speculative questions about\n[626.959s] the extent of time, the extent of the\n[629.2s] universe. But also he subscribed to a\n[633.32s] very dense and important and heavy we\n[636.88s] might say cosmological theory about\n[640.92s] samsara. This time without a\n[643.839s] discoverable beginning. This continuous\n[646.88s] wandering on this idea of karmic\n[651.0s] cyclicality based on beginningless\n[653.519s] karmic causation. However, practically\n[656.88s] the Buddha focused on the present moment\n[658.959s] as the arena of our practice, as the\n[662.16s] arena of effective change. He gave us a\n[665.519s] way of living within time so as to\n[669.12s] minimize suffering and increase wisdom.\n[672.24s] So the focus for the Buddha wasn''t so\n[674.32s] much on what is time, but rather what do\n[678.0s] you do with your time? What are you\n[680.16s] doing with the present moment right now?\n[682.72s] So my question for you is how has\n[685.279s] witnessing this kind of impermanence\n[687.6s] changed your relationship to time or has\n[690.44s] it? If you want to learn more abou