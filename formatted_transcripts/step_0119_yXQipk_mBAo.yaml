transcript: (melancholy music) (keyboard clacking) (seabirds calling) - The thing about indie games these days is that they just come out of nowhere. You throw a line into that big ocean of Steam, and soon enough, you've got yourself a tasty catch. Across that ocean there, there's an island called New Zealand, and on that island, there are people, and some of those people are making video games. From "Path of Exile" creators Grinding Gear Games in Auckland, to Wellington's Dinosaur Polo Club, the kiwi game dev scene is one of the most under-reported, much of this due to their geographic isolation, but also due to business and economic realities that the New Zealand government is attempting to course correct with a new rebate scheme. But today we're here to talk about a crew from Christchurch who go by the name Black Salt Games. They burst out onto scene in 2023 with their debut game "Dredge" which combines cozy fishing and cosmic horror. Today, through interviews, concept art, and dozens of hours of recorded gameplay over the course of the title's development, we're going to explore the design and development of "Dredge". The team at Black Salt Games was initially made up of three people from a local work for hire studio called Cerebral Fix. Nadia Thorn left her job as studio lead there with enough funding to cover three people for two years. The other two people ended up being Senior Programmer Joel Mason, who would code the game and write the narrative, and Senior Artist Alex Ritchie, who would be art lead on the project. With no time to spare, they jumped into making prototypes for their debut game. Three of them, in fact. So what were the other two, and what was it about the fishing one that made it their prized catch? (cheerful music) - I think the first thing we did as a studio was do, like, we did regular meetings to kind of get on the same page and decide or discover kind of where our interests overlap in video games and what kind of things we would want to make, and then originally, we did three prototypes because we came away with three ideas we wanted to try to make, and we did the prototypes, and we tested them on our former colleagues and friends, and "Dredge" as a prototype got the best reaction, and we also saw a lot of potential in it. - One was an RTS that used some sort of novel resource mechanics which we thought was slightly interesting, but at the same time, as a first time studio with a pretty small budget and a pretty small timeframe, we didn't feel like we could compete with "Age of Empires" and other RTS games. So while we liked it, it didn't fit right, business-wise. And then the other one was like a sort of stealthy vehicle game which I think has sort of been made in the last two years anyway by another studio somewhere. - The prototype we had was like a stealth Roomba, is kind of what it was. You were this little robot that was like a Roomba, and you could get upgrades for it, and I remember seeing a very similar game, which was really interesting. - The prototype is not too dissimilar from the finished game but it is wildly different from the original concept, which was on a two paragraph Word document somewhere, and that was kind of inspired by "Papers, Please", I think, and a bunch of other games here and there. But with the constraints that we had, I was sort of looking at games that I thought were small, but were sort of achieving something interesting, and also one of the things that we had identified, as the three of us, that we liked, was games that had more than one aspect to them. So we pointed to "Moonlighter" a lot of the time. So you've got the dungeon crawling roguelike part, and then you've got the shop element. So we wanted to have a game that had two main elements to it. So the original concept for "Dredge" was a top down, turn-based, grid-based navigation. You would go out every day and you would use your time, which is your resource, to move three squares to this mackerel over here, and then two more squares to this tuna, and then you might get some kind of narrative event that says, "You come across a mermaid, what do you want to do?" And then you choose three options. And then after your day finished, presumably you got back in time before sunset, or maybe you didn't, you would then go home, sell your catch, and then maybe you would, I don't know, choose whether to feed your family or buy medicine, "Papers, Please" thing. So that was the original pitch, but I think the core element from that pitch was cosmic horror fishing, and as soon as that was on the whiteboard, I think we all thought, yeah, there's something in here. So yeah, the first prototype was very similar to "Dredge". There was no... It wasn't turn-based. It wasn't grid-based. It wasn't top down. But it still had a central resource, which was your time. You're still sort of scouting around for maybe an optimal route. You're planning what you're going to do every day, and you're probably going to get overconfident, stay out at night, and then that is where the interesting gameplay kind of comes in. - I think it's just my personal preference to have more real time, so I don't know exactly how the conversations went, but we obviously ended up going more real time, although it's kind of like time doesn't move when you move, so we found some middle ground that seemed to work pretty well. And also that actually turned out really nice, because it's less stressful. We didn't want a completely stressful game all the time. - Yeah, after the first week, Alex had the idea of it being a spatial inventory, and we threw that in there. The prototype didn't have any fishing minigame, which is kind of sacrilegious, I think, for a fishing game. But also, it isn't something we felt like we needed to test, because we kind of assumed we would have one eventually. I think one of the interesting things that came out of the prototype, sort of born from the time constraints, is actually the art style, because Alex, you went super low poly, right? And that sort of informed things going forward. - Yeah, all of our prototypes were. Because of the time constraints, kind of, all the prototypes, as you imagine, are pretty blocky. But I got to focus on picking colors, kind of muted colors, and then simple shapes, and there was something about the contrast of this sort of cartoony art style and an uneasiness when nighttime comes around and the fog rolls in. I think that really clicked with people. I think they really liked that. It threw them off, and that was perfect. So yeah, going forwards, that became one of the references for the final "Dredge" art style. It got more detailed, but only slightly. Right from the very beginning, I wanted to have like a sort of abstractness to the art style, and I was thinking of things like "Disco Elysium" and the way that their portraits kind of just melt into abstractness. There's a lot of details in there that are up for your imagination to fill. I thought at the time that I probably wouldn't have the time to paint portraits quite as detailed as they did, thinking I would be the only artist for the whole project. That was another constraint I had in mind. But I wanted the game to look really nice, so going forward from the prototype, keeping the cartoony, sort of low poly look, I'm going to call it cartoony and low poly, and you kind of know what I mean when you see it, but I also wanted it to look, to reflect the other side of the game too, the harsher side. So I tried to keep a lot of hard edges into the art style, so you don't see a lot of gradients or softness, and then the colors are, as you said, kind of more muted than you would traditionally see with that kind of art style. The water shader in particular, it's like a beast. The game's made in Unity, and we used Unity's shader graph for shaders for some of them, and this one in particular is massive, and it went through so many iterations over the game. There's things that we ended up being able to tweak, like the colors of the water, for instance, change as you go move area to area. The amount you can see through the water is different in each area as well, so we can control all of this stuff. And other than that, because we've joked all the time about how hard it is to have a game set completely on water, there are some effects that you just can't have, because the way that computer graphics work, and rendering transparency, there's a bit of an issue that you can face where you don't know what will render in front of another thing, and there's only so many things you can do to combat that. So we had some effects that are kind of just not possible. We can't have soft, glowing transparency under the water, for instance, but we get around that through our stylization. - I think some early builds of the game, mid water shader shenanigans, I think we had no transparency in the water, and it was just kind of quite opaque, and then we sort of wanted players to be able to see a little bit and identify fish at a glance, and actually, that's one of the things that we have now. Most of the fish in the game have unique particles that swim around, so you can visually see that's a bronze whaler shark or that's a cod just from all these little particles that Alex has modeled up individually. - Come on! Come on! Come on, you fucker! Yes! Woo! (laughing) The prototype for "Dredge" was located in an area that would later be known at The Marrows, but to create pacing and gameplay variety, and to make the player want to explore more, they'd have to make new biomes full of new fish and new stuff to do. So how did they approach this task, and in what way did these new places give "Dredge" a sense of place? Plaice is also a fish. That's a fish pun. I didn't even realize it. It's impossible not to do them. - The Marrows came from the prototype. That's, you know, very similar to what was the kind of starting location. And then we spent sort of the first six months of development just in The Marrows, really. There was, sort of about three or four months in, Alex took a week or two just to block out, kind of, sort of the other four biomes, so we could just kind of get a sense of how big the overall world was, and I think that was important for us in terms of just defining the context, you know, and the boundaries of the whole game as also, you know, kind of starting on writing the narrative. But yeah, we did spend a lot of time just in that starting biome establishing everything, getting all of the base kind of mechanics down. We spent a lot of time on the controls and the input system. We were playtesting that sort of every couple of weeks for the first few months, and so once we felt we had an understanding, we'd had the Marrows and we'd had the kind of first iteration of everything in the game, or most of the things in the game, that's when we then started to branch out and build the other biomes up. We spent probably about two to three months on each of those. - Yeah, so the main areas are the Marrows, which is your starting area, which is mainly just to get you used to the game, and there sort of isn't anything hugely threatening in that area. There is a little monster that sort of comes out at night, which is a fun moment for some players, but there isn't a core thing that happens there. And then the, I'll say second biome, but you can visit them in any order you want. In fact, this was almost a pilar of our design, was that we liked what "Breath of the Wild" did, which is, it's an open world, and you can sort of do things in any order. So we always had to maintain, oh, but you need to be able to do this one first, so you need to not lock off this thing. So we kept that quite open. The second area is Gale Cliffs, which is sort of a Scandinavian inspired area, and the cliffs are sort of being eaten from inside by a giant rock eel that is your sort of first really aggressive threat in the game, and it's maybe slightly harder to navigate than we had anticipated. A lot of players get hit by this rock eel. The next one, it's basically clockwise. The next one is Stellar Basin, which is your tropical island inspired area, and there is... It's, in fact, inspired by a blue hole, which is a geological structure that I think also "Dave the Diver" is based on, and inside this blue hole, there is a large tentacled monster that you have to deal with, I'll say. A lot of our monsters or threats are more obstacles than enemies. We never really allow players to kill them most of the time. Next around is Twisted Strand, which is a mangrove swamp inspired area, and is very foggy all the time, even during the day, and is maze-like, and I still get lost sailing around that area even after like 2,000 hours. And there's a shipwrecked or plane-wrecked airman, a soldier from a war that is left there and trying to deal with some monsters that are sort of threatening his sanity there. And then the final area is Devil's Spine, which is your standard video game volcano level, which has a whole bunch of volcanoes and red lava and stuff, and a blind monster that sort of locates you through some interesting means, and there's other ways of getting around that. But the biomes basically are your sort of video game tropes of tropical, swamp, volcano, and then we also did originally have an ice biome planned, which we left on the cutting room floor quite early on, but then were able to revisit with our first DLC, which is "The Pale Reach". Yeah, I guess our scope control was actually making them so isolated from each other. You touched on sort of the main quest, which is essentially a guy in the central area tells you to go out and get four things, one thing from each area, and you can do it in any order you want, and the things that you do in each area don't really affect your other areas, and so we could develop them in isolation. We could develop them one by one without necessarily having nailed down all of the story points for the final area, say, and that sort of just allowed us to treat them as standalone areas. - With the benefit of hindsight, is there any aspect of the game that you would've tackled a little bit differently, or done more of, or less of, or anything like that? - I mean, it's a boring technical answer, but I think I would've changed the way that the world was structured a little bit. It's all like one big scene, and it all loads at the same time, because from anytime, you can look across to any of the islands, and I didn't have the time or the expertise to do a fancy streaming world thing, and it's slowly coming to bite us in the ass as we add more and more things to this scene that has millions of objects in it. The Switch isn't particularly happy with me right now. - There's no shortage of horror games on Steam. In fact, if anything, we're going through a bit of a renaissance when it comes to spooky games being made by small indie teams. But "Dredge"'s specific version of cosmic horror is less about jump scares, and more about rising tension. There's nothing stopping you from docking before night comes, but what if you stayed out a little bit longer? What happens if you damage your boat and lose some of your catch, or worse still, destroy your engines or fog-light, and find yourself exposed in the open ocean? Designing tension is a delicate balance, so how did the team at Black Salt Games use fear to drive the player's actions? When is cosmic horror not just about tone, but influencing gameplay itself? Oh, we got a big one. We got one. Come on! Come here! Come on! (grunts) By the gods! What is that? (ominous music) (Danny cackling) - I think a lot of what we did was overly telegraphing through sinister dialogue, where certainly in the first area, everybody is telling you, don't go out at night. Do not go out at night. You're gonna get killed. When actually, you're mostly okay, you know, if you play it a little bit safe, it's very sort of, there's a lot of smoke and mirrors in the game, which helped us sell the nighttime as being this huge, threatening thing, when actually at the start, there's only a few things out there that can really cause you trouble, and the primary one is your own driving at night. - We weren't trying to make a horror game. We were trying to make a spooky game. We were going for the vibe more than any kind of jump scares or any kind of thing like that. I think if you went into "Dredge" expecting a horror game, you'd probably be disappointed. But yeah, we definitely wanted a mystery, and we wanted kind of like that thriller atmosphere. I think everybody's really good at scaring themselves, and I think cosmic horror is more about just raising uncomfortable questions and then never answering them. - And just try to mix up the contrast, as well. So in the day, you can see miles and miles away. In the night, the fog, if you don't have any lights, you can't see anything in front of you. We also did it with the music, so during the day, music stingers will kind of flow in, and it's all quite relaxing and nice. And then at night, there's no music at all, but there's underlying sanity kind of drone. The less sane you are at night, the more this unsettling kind of static and noise kind of plays through to you as well. So we tried to make it subtle, but yeah, to be a lot of contrast between night and day. - The night and day is sort of, that's our bifurcation of the game, of two halves, really. It's cozy during the day, and then it's sort of an attempt at horror during the night. They elicit different responses from players if they suddenly, you know, put their head up from fishing for a few hours and they realize that it's pitch black and they can't see anything and they don't know where they are. Actually, one of the sort of interesting things we did at the start was, we didn't place the player on the map. So currently, you can open the map in the game, and it shows exactly where you are, because we wanted players to get lost. We wanted players to sort of have that experience of, oh god, I don't know where I am. We wanted them to navigate by sight and looking at islands and sort of comparing that to the map, and I think "Tchia" did something quite similar. And then we changed that based on a bit of playtesting feedback. We were also slightly conscious of... Alex and I love "Hollow Knight" but I know the map in "Hollow Knight" is a contentious issue. So then we sort of rounded players' position to the nearest grid square on the map, and then in the end, we just straight-up placed you on the map. It was disorienting enough at nighttime without it. - Yeah, turns out people still get lost. We had the inventory before we had the idea to put damage in the inventory. I don't know where the idea came from, but as we put... When we put the special inventory in and we realized that was going to be kind of like the main mechanic of the game, it just got you thinking, and we always want to try to integrate new things with existing mechanics instead of adding new things that are not related in any way. So I don't know where that idea came from, but when it came up, it seemed like such a great idea, and we still do kind of have that health bar, because we need to have some kind of threat, so you do have like a three hits and you're dead kind of thing. There's other things, like arranging your inventory and getting filled up, and then when you happen upon, like, a castaway, and then they're like, "Oh, can you take me back to the town?" And you realize they take up six spaces, and there's a little bit of humor in there as well, because you kind of pick them up and you have to put them in your thing. Some people rotate them upside-down or whatnot. - The idea to discard items or people that you are ferrying, as well, was something that we enjoyed doing quite a lot, and I think we spent the first week after launch watching streamers on Twitch play it, and I remember there was one guy, Tomato Gaming, who saw that there was a discard button on one of the characters and he thought, "This is surely a bug," and then he discarded him, and he realized that the quest had resolved and there was alternate dialogue based on you killing this person, and yeah, that was mission successful. - [Tomato] We know how they like anyways. Dunks old man in water. Pursuit resolved! (laughing) See you later, you old fuck! - The original design for the upgrades was, yeah, there was just a list of upgrades, and you would be like, "I want this one," and you would just get it, and it was like, plus 10% fishing speed, and that just kind of wasn't interesting. We couldn't really work out how to make the cost of those upgrades feel impactful, and there were just all kinds of issues, and then as soon as we had a spatial inventory, we realized we could attach things to that, as Alex said, just reusing existing things, and we realized that your inventory could be not just your inventory and a health bar, but also your loadout system where you could choose whether you wanted to be a speedy person that maybe can't catch quite as many fish, because you've got too many engines, or a slow boater who can fit more cod in. It just allowed us more avenues of player choice, because a whole bunch of different kinds of players play our game. There's people who do not care about nighttime, do not care about the panic system. They're just, you know, balls to the wall, I'm just going to catch fish. I don't care about any monsters. And then there are people who just sit there and grind and are trying to catch the largest fish every day, and are just rich. - The upgrade system, though, for placing the materials in those grids, actually came in quite a bit later. That was at the point that, you know, we really understood the inventory system. I think it was you, Joel. It was a kind of thing in the team at that point to be using the inventory system for as much as possible, so it became the quest grids, and yeah, I think the upgrade system used to just be like tooltips that kind of told you how much of each material you had. Yeah, I think it was you, Joel, that was like, we can actually place these. It also became a second storage, because storage became quite a problem when you try and make everything in the game an actual item. - We didn't have time to build a person walking around the town, walking in the door to the fishmonger, and also we didn't think there was much point in it. The point of the game is going out and exploring and finding cool stuff and getting scared at night. It's not actually walking around a town, and you know, I guess you can look at other games like "Darkest Dungeon 1", the village system in that is pretty similar. You know, you're just hitting buttons on a menu that is laid out like a town, and you're getting the things done really quickly, and then you're back out on the water. - You can't have a fishing game without fish, so let's talk about fish design. "Dredge" spreads out its cast of aquatic characters across various types of water, to say nothing of the sunken aberrations that can be found in the darker places. So how did they decide which fish went where? The answer is in the eyes. Take a look. Take a look. Let's talk about the fish. We've not talked about fish yet in this fishing video game. So who on the team is the fucking fish expert, if there is one? Do none of you know about fish? Are you all fisher-people? - Joel. - That's Joel. - That's Joel? You're the fish expert? - I'm the fish guy, yeah. - That's what we call him. - Gotta be careful when you're in, like, eldritch... Calling someone a fish guy, that might, you know, might be from fucking Innsmouth or something. Yeah, tell us, I guess, about creating even... One of my favorite parts in the game was, you know, this is just my OCD, I guess, but just having that encyclopedia of fish that you're sort of going in and trying to check off every one that's in the biomes. But how did you come up with the fish? And then also, I guess, how did you sort of mutate them or make them grotesque? What was the sort of box you guys were working in, in terms of the types of fish you were working on and how to make them all fucked up, as well? - How did we come up with the fish that go in the game? It is basically me just using Wikipedia and my existing knowledge of fish, of like, okay, we have a biome that is this. What kind of fish in the real world live in a place like this? And, you know, there's heaps. There's, you know, 50, 100 fish, that you could easily put in. But then we also had to consider things like, what rods are people going to have at this stage in the game? So we know that they're going to have coastal and shallow rods. What could be a shallow fish? A flounder feels like it's a shallow fish, because it's on the seabed. And so from understanding where players might be in the game, we decided on fish. Also having to consider, like, how big is their boat going to be, how many... At the start of the game, it's not all sharks, because you can't fit many sharks on your boat. So it's coming up with a list of candidate fish, and then I would sort of eyeball them and say, like, "Well, this could have this kind of shape in the inventory, and this could be an L shape, and this could be a square." And then I would turf all of that stuff over to Alex. - Yeah, I would just get a list of fish from Joel that need aberrations made. There's no strict process for messing these fish up. It's just kind of whatever comes to mind, and sometimes it starts from like, you know, you take the fish art I've already done, and I just do some Photoshop manipulation. I'm like, I'll copy this eye a couple times. I'm going to warp this fin and see where that goes. And then I'll repaint it when it's something new. A really good trick is always just giving any kind of fish human features, and then you're immediately grossed out by it. There's some weird stuff out there, like the barreleye fish, which looks like an aberration, but in its default state is like... It's got, like, a terrarium in its head, and that's like a real fish, so I'm competing with nature. - My favorite aberration-related story is when you were doing the viperfish aberration. You had been spending a few hours on that, and you came to me and you said, "I went sort of one direction and I didn't really like it, so I came up with something else, so here's that something else." And I said, "Well, what was your first direction?" And you said, "Oh, I just kind of exploded the thing," and he showed me the picture, and it was this viperfish that had basically, its head was just exploded into gore. And I was like, "I would entirely ship that." And so we did. We just put it in the game as well. - I was worried that it was a little bit too far. I mean, it's, like, inside-out. - When we were doing our ratings, it's like, is this gore? Is fish gore okay? - So I always felt pretty strongly that the fishing minigame, and it was only one fishing minigame for a long time, the fishing minigame should not be hard or frustrating. That's not the purpose of this game. I love "Stardew Valley", but man, that minigame, I'm not a fan of that. So it had to be simple, it had to be accessible, and for that reason, you can play the game, and you can just leave the fishing minigame alone. You don't have to interact with it, and you will still catch the fish. You're just not time optimal, because you're not accelerating the reel up by hitting the green notches. It's mainly sort of an accessibility thing because, you know, it's sort of a twitch mechanic game, and then yeah, quite close to launch, maybe like three months before launch, we were sort of getting playtest feedback coming through saying yeah, maybe the fishing minigame might be getting a little repetitive. Some players didn't seem to mind, some did, so we sort of ideated on some variations that were all roughly circular to fit the reel motif of that piece of UI, and then we thought we might add it as like a post-release update, and then we sort of ummed and ahhed on whether that was going to be like a bit of a rug pull to suddenly make things different on players, so we sort of crammed it in just before release, and I'm quite glad we did, I think it was a good idea. - It used to be, so basically, time went really slowly when you fished, but really fast when you moved on the water. And I remember Alex coming in one day and saying that we needed to flip it around, and sort of immediately... And I think we changed it so fishing took three times as much time up, and exploration was kind of slowed down. It immediately changed the feel of the game, because suddenly you could choose to spend your day either exploring and getting somewhere new, or you would spend your day fishing, where you're just kind of concentrated on picking up these fish, and then suddenly, without you kind of realizing it, the sun has set. You're in the middle of darkness. But yeah, it was always a thing from the start, but it was different at the start. - It was also way over-tuned. I think it was about eight times faster than what we shipped with. A day was like, I don't know, 20, 30 seconds. It was ridiculously fast. And then we changed it, and then halved it again, halved it again. But yeah, the sort of giving you time to explore was a thing that we suddenly realized we needed to do once we realized we had made an exploration game, and so, you know, players could spend their whole time fishing in our fishing game, but then they weren't exploring as well. So then we invented crab pots and trawl nets, so they're like more passive ways of still achieving your encyclopedia and your fishing and your money harvesting goals, but also, you're going out and seeing the world at the same time. - It's one of the things I love the most, where it's like, I'm a person... I know every gamer's different, but I'm a person who really, really, really values exploration, especially when going somewhere new feels like danger, and I felt that in "Dredge" so much, especially when you went to those new biomes. There was a sense of both excitement and threat. (laughs) You know, either way. How did you balance how many ports of call people had, right? Because once you know you're close to one of those, at least it feels like, okay, I can go there and I can rest, worst case scenario. Was that something that got changed quite a bit, or did you kind of always have the feel of how many, or how close you should always be to one of those? - They were mostly informed by the narrative. So when we started working on a biome, we would say, well, what's the main quest in this area going to be, and where are players going to go when they're doing that quest? And in fact, one of the early iterations of Gale Cliffs, I think we had one fewer dock. I think we maybe didn't have the southern dock, and there was kind of no reason for players to enter the cliffs, which also happened to be where we had hidden the main item. So players just didn't go in, because there was this big old monster there scaring them away, and there was no dock through the area, so from that point on, we sort of became more conscious of the path that players were going to follow, and then we would sort of position docks in relevant areas. - Was there any part of the game that you guys struggled with? Was there any aspect of production, either design or engineering or art or anything, that took a little while to figure out, or that you never resolved and didn't make it into the game? - The harpoon that we thought, for over a year, would eventually get into the game, and we kept kind of pushing it off, pushing it off, because, you know, we'd talk about it a bit, outline how you're going to aim the boat and line up various things, and then sort of by, I think, about Twisted Strand, when we were working on Twisted Strand is when we decided that we would never be doing the harpoon, because by then, we also had nice things in the game, like whales and dolphins. We could just see the videos of gamers chasing down a whale to try and harpoon it. - Yeah, that seems more of a horror game mechanic than a cosmic horror mechanic, as well. I mean, if we gave you the ability to fight back, it felt wrong at that point, where we knew what the game was, and that wasn't it. (cheerful music) (Danny giggling) - Funding games is fishy business. (giggles) While Nadia had money for three people for two years, it wouldn't be enough to finish the game. So how did they get the money to complete "Dredge", and what stipulations came from the publisher? The eyes are staring at me. The only way to escape them is in the deep. - We were in a really lucky position compared to a lot of indies. We always knew that we wanted to get a publisher onboard. We weren't, you know, necessarily confident we were going to get one. It's our first game. We're a no name studio. And so we always had plans to self-publish if we weren't able to get a publisher onboard. And, you know, that plan looked something like, okay, well, we'll release "Dredge" in a year, and then we'll have another year to make a second game, and maybe that sort of might get a publisher instead. Because we always knew we were going to get a publisher, the publisher demo was the first big milestone for the team, and so we spent the first few months building towards that. So that's what it looked like, that first biome. Then we just went cold calling. So we were sending out emails with pitch decks, trying to big up our kind of previous experience in games. No, trust us, really. I think we kind of sent out to about 40 publishers. 20 of them came back to us and, you know, sort of played our demo. - Good ratio. Must've been a good pitch deck. - Probably that it was just all there, all in one, and just like, here you go. And, you know, trying to do the carrot as well. And that kind of went down to seven. Team 17 had already seen us on Twitter, though, and so had actually already reached out to us before we kind of went out to publishers, and that was just from posting in Work In Progress Wednesday or Screenshot Saturday. It was actually great to have an offer from Team 17 and also from other publishers, so we were able to kind of weigh it up. - And are you guys in a position now where you will self-publish on the next stuff, or would you be sending around more... Suspect the pitch decks will be even more easier to get people to watch at this stage. - Yeah, you know, it's a lot easier to have people take your emails and calls once you've got "Dredge" under your belt. We're definitely in a position where we can self-publish, which is an amazing kind of feeling. You know, we weigh up constantly the fact that, you know, we are game makers. We're not necessarily marketers or community management and, you know, it is important for us to kind of keep everything in focus, you know, and if there is the right partners to kind of take that side of thing off us, then great. But at the end of the day, the big thing for us is our players and making sure that we're kind of creating the best experiences for our players' price, pricing that right. Being free to make those decisions yourself gives us a lot more control over what we release, as well. So those are the sorts of things that we weigh up when looking to the future. - The name is great. How did you end up on that name? - It never had a different name. I don't know. It just works, because it's like, it's describing the activity that you're doing, which is like a dual word, because it's like you're dredging up memories of the past, and you're also physically dredging up stuff. But I think I was probably, as we all are, inspired by Supergiant with their punchy one word titles, and they also have not great SEO, but they make a name for themselves. I was maybe aspirational towards that, and somehow, it worked out. (spooky music) - We launched with 250,000 wishlists, so we thought that that was kind of a good start. I think the Steam Next Fest was the kind of single most important event in the buildup. We featured quite highly on the Steam Next pages, and yeah, that's how we were able to kind of build up to a decent pre-launch amount. - Yeah, Alex and I, I think, would've been pretty happy with, I don't know, 10,000 sales or something, because it's our first game. Why would anybody care? I think Nadia was a little more optimistic than that. - Realistic, it turned out to be. Yeah, no, it was launch day for us. We smashed through our one year target on launch day. So we're like, okay! Maybe we can have a couple of drinks and enjoy this party before we're back to work on Monday. - I think it was maybe a week before, we had the review embargo dropped, so we had the reviews out early, and that, I was really nervous about that, because I felt like that would affect people's view going into it. I mean, it would. But those came out pretty positive, better than I had expected, and that was the first kind of relief for me. I figured at that point, we've done it as good as we can. We made a game that people can see is at least good. But then, so many people playing it was a completely different feeling. That was really surprising. Connecting with our little fishing game, our cosmic horror fishing game? - More the kind of relief, and that we had done it, we had set ourselves up for the next game, and yeah, basically making sure that we would have another shot. We can continue making games. I think that was just a massive relief on launch day. - Thank you so much for watching our documentary on "Dredge". A massive thanks to the folks at Black Salt Games, not just for doing the interview with us, but also for sending us, like, years' worth of development footage that they had saved. Hardly anyone ever does that. It makes a massive difference. It means we can really get into the meat and potatoes of game development and game design, so I really appreciate it. Thank you to all of our patrons, without whom I would not be able to dress up as an authentic fisherman. The eyebrows are natural, though, so we didn't spend any patron money on that. And last but not least, as our light turns out, it's perfect, right at the end of the day, before the fucking water comes in and consumes us, I think the high tide is coming in, massive thanks to my wife for creating our own little aberration here. She worked really hard on it, and it really did the job. So yeah, what a beautiful thing that I'm now going to mount somewhere in our house. Maybe the bathroom or somewhere, not quite sure. We could always use more patrons. I could always use more eyebrows. Patreon.com/Noclip if you'd like to support us, and we'll be back again with more indie game documentaries. Jeremy, you stay there, and I'm going to roll out of here. And thanks to Jeremy for filming, too. And Frank Howley for the gameplay. (waves crashing) (Danny giggling) Ah! (keyboard clacking)
