transcript: '{"content":"\n[0.0s] If you''re someone who struggles to be\n[2.6s] your best self in all situations, that\n[5.68s] you become this person over here and you\n[7.16s] become this person over here, why can''t\n[9.24s] I be confident at work the way I am with\n[11.64s] my gaming friends? You know, I''m a big\n[13.16s] believer of meeting people where they''re\n[14.6s] at. And I was working with a multiple\n[16.76s] e-sports players, and one pattern that\n[18.84s] I''ve noticed is that sometimes an\n[20.84s] e-sports player plays for fun. And so\n[23.24s] then it''s like when they''re playing in a\n[24.88s] pub, when they''re playing to have fun,\n[26.48s] they play like in a very like relaxed,\n[29.24s] risky, let''s have fun, let''s own these\n[31.64s] noobs kind of way. Then they start to\n[33.32s] panic, they try to win, and they no\n[35.08s] longer play with that attitude. So big\n[37.04s] part of what the work that I do is to\n[38.36s] try to cultivate an attitude of having\n[40.88s] fun, playing with your heart on your\n[43.16s] sleeve. Basically, what happens is this\n[45.48s] autobiographical continuity, when that\n[48.0s] gets to disabled, we have these alters\n[50.12s] that actually form. A certain\n[51.72s] circumstance, when I need to protect\n[54.2s] myself, I adopt the angry persona. I\n[57.2s] adopt the protective persona. When I am\n[59.28s] being loved, I adopt the vulnerable\n[61.56s] persona, the baby persona. And there''s a\n[63.48s] lack of continuity. So what''s really\n[65.28s] interesting is that in dissociative\n[67.24s] identity disorder, if you look at people\n[68.64s] with multiple personalities, why do they\n[70.88s] adopt a different personalities? They\n[72.88s] adopt different personalities to adapt\n[75.84s] to different situations. Cuz I can''t be\n[78.08s] playful and innocent when my parents are\n[80.4s] abusive and coming at me. So the goal in\n[82.76s] multiple personality disorder is to\n[84.64s] actually allow a wider range for each\n[88.8s] alter. The less we trigger the\n[90.68s] switching, the more emotional range we\n[93.8s] expand, the less switching needs to\n[96.4s] happen. And then eventually, we will get\n[98.28s] that autobiographical continuity. When\n[100.16s] we don''t switch between A to B, we stay\n[102.44s] half A and half B. That''s the goal. Then\n[104.84s] we become closer to being a regular,\n[107.56s] healthy human being."}'
