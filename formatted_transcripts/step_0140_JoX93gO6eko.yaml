transcript: I know that like Claude is like the big name right now and Claude code and whatever, but I think these things shift over time. But they're like, have you seen our front-end design skill? That's like an a word right now. If you're listening to this 2 hours from now, skill is probably won't even be a thing, but that's their thing. And if you ask it for a design, it'll be like, "Accessing our front-end design skill." Dude, I promise you what comes out of that, I could smell 100 miles away. It just has this particular style that it applies that I can just be like, "Yeah, Claude did that." Is it relatively nice? Sure, but it's like even more I can smell it faster than I used to be able to smell bootstrap. You cannot launch a big-time app right now and have it look exactly like that. It's not going to stand out. It's not going to say what it needs to say. It's going to say, "I had an LLM do this." I think you need skilled, talented people to make unique things. I mean, in a way, web design is art. LLMs ain't doing art.
