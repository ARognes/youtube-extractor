transcript: '{"content":"\n[0.08s] We live in an age of constant tailored\n[2.96s] sensory\n[4.12s] stimulation. Social media, clickbait,\n[8.12s] advertising, you name it. Screens are\n[11.639s] everywhere. We see videos, texts,\n[14.96s] emails. We can''t get away from it. Now,\n[18.08s] it''s true that sensory stimulation has\n[20.24s] been part of the human condition, indeed\n[22.24s] the sent the condition of sentience\n[25.24s] forever. So, that''s nothing new. But\n[27.92s] what is new is the fact that all of this\n[30.16s] is now tailored to grab and keep our\n[33.399s] attention. Over time, this stimulation\n[36.32s] serves to agitate, fragment, and exhaust\n[40.16s] the mind. Now, ancient though it is,\n[43.6s] early Buddhism has a technique or\n[46.48s] various techniques for dealing with this\n[48.48s] kind of situation. We''ll deal with one\n[51.12s] today, which is known as guarding the\n[53.199s] sense doors. I''ll be describing what\n[55.84s] that practice is like, how it works, as\n[58.64s] well as how it can inform our practice\n[61.039s] today. So to begin with, what is it to\n[63.84s] guard the sense doors? Well, here''s the\n[66.479s] situation that we are in nowadays. In\n[68.799s] fact, it''s the situation we''ve always\n[70.64s] been in, which is that we tend to divert\n[73.4s] ourselves with pleasant and unpleasant\n[76.96s] in uh information, data, sensations that\n[80.479s] come in through all of our senses, our\n[82.96s] eyes, ears, nose, tongue, body, and even\n[87.36s] our mind in in the sense of good\n[89.159s] thoughts. As the Buddha describes this,\n[91.92s] he says, \"When they see a sight with\n[94.56s] their eyes, if it''s pleasant, they\n[96.64s] desire it. But if it''s unpleasant, they\n[98.72s] dislike it. They live with mindfulness\n[101.2s] of the body unestablished and their\n[103.759s] heart restricted, that is, restricted to\n[106.159s] what they like. Being so full of\n[108.64s] favoring and opposing, when they\n[110.799s] experience any kind of feeling,\n[112.96s] pleasant, unpleasant or neutral, they\n[115.24s] approve, welcome, and keep clinging to\n[118.0s] it.\n[120.159s] This situation, the Buddha goes on to\n[122.0s] say, gives rise to enjoyment or delight,\n[125.759s] which is to say, we take delight in\n[127.92s] those things that that give us pleasure.\n[130.56s] And we also, it has to be said, take\n[133.28s] delight in our hatreds. We revel in\n[136.56s] things that we hate. We talk about them\n[138.72s] a lot. We talk to our friends about how\n[141.04s] much we hate soando. However, under\n[143.84s] conditions of change and\n[146.04s] uncertainty, all of this enjoyment tends\n[149.36s] to lead to confusion, to argument, to\n[152.64s] discussion, dis debate, dispute, and\n[156.319s] eventually to suffering, to this all of\n[158.959s] this mass of suffering. As the Buddha\n[160.8s] says, we obsess about these things and\n[163.84s] the the term is mentally proliferate\n[166.08s] around our concerns, our our our loves,\n[170.0s] our enjoyments, our hatreds. All of\n[172.64s] these things uh agitate and confuse the\n[175.959s] mind. And so the Buddha recommends a\n[178.8s] practice of, as he says, guarding the\n[181.08s] sensors, which is to guard each of the\n[183.519s] senses, eye, ear, nose, tongue, body,\n[186.64s] and mind. as he says. And how does\n[190.4s] someone guard the sensors? When a\n[192.8s] monastic sees a sight with the eyes or\n[195.12s] hears something with the ears and so on,\n[197.36s] they don''t get caught up in the features\n[199.2s] and details. If each of the sense\n[202.159s] faculties were left\n[203.8s] unrestrained, bad unskillful qualities\n[206.64s] of desire and aversion would become\n[209.2s] overwhelming.\n[210.72s] For this reason, they practice\n[212.36s] restraint, protecting each of the sense\n[214.879s] faculties and achieving its restraint.\n[217.84s] They don''t get caught up in the features\n[219.84s] and details. That''s how someone guards\n[222.72s] the sense\n[224.36s] doors. So the training here as we see is\n[227.12s] not to get caught up in the features and\n[229.959s] details of what we are experiencing. Now\n[233.84s] there are clearly many ways we can go\n[236.159s] about this. First of all, we can simply\n[239.04s] avoid things that we find disturbing.\n[241.76s] Also, we can become more mindfully aware\n[245.04s] of the causal chain that proceeds from\n[247.84s] unrestrained\n[249.239s] attention. How delight and attachment\n[252.08s] arise from this kind of sense contact.\n[255.28s] When we notice this syndrome, we\n[257.12s] practice stepping back a little bit. Now\n[260.239s] this practice plays a key role in an\n[264.479s] early uh map of the path known as the\n[267.84s] gradual\n[269.24s] training. In this training we begin with\n[272.72s] restraining ourselves\n[275.0s] ethically. So it begins with ethical\n[277.6s] restraint not with sense restraint. So\n[280.639s] we begin by restraining ourselves from\n[283.44s] doing unethical things such as killing\n[285.759s] or stealing or sexual misconduct or\n[288.24s] lying and so on. Typically then in the\n[291.12s] gradual training this practice of\n[293.759s] restraint would then continue with\n[296.44s] monastically related restraints. That is\n[299.12s] the person would join the monastery and\n[302.08s] begin restraining themselves\n[303.52s] monastically avoiding things like sex,\n[306.24s] music, shows, dancing, entertainment,\n[310.0s] money, and so on. Now, this kind of\n[313.28s] restraint of course is not going to be\n[315.28s] so important to those of us who remain\n[317.52s] within a lay lifestyle. However, we\n[320.16s] should at least keep in mind the general\n[321.84s] purpose of this kind of restraint, which\n[323.68s] is to live a more minimalist life. And\n[327.68s] then with the ethical restraint and\n[330.0s] monastic restraint\n[331.639s] underway, the practitioner undertakes\n[334.639s] sense restraint. And that is to say when\n[337.919s] the person notices that they are tending\n[340.32s] to relish or get involved in something\n[343.52s] because it''s it seems pleasant or\n[345.919s] because it seems unpleasant or\n[348.28s] repellent. Then they practice stepping\n[351.12s] back a little bit, not focusing on the\n[354.24s] features and details of things that that\n[356.639s] we find especially alluring or the\n[359.919s] features and details of things that we\n[361.68s] find hateful because as we all know we\n[365.12s] tend our mind tends to obsess around\n[367.68s] these two kinds of things. This kind of\n[370.56s] restraint, the Buddhist says, eventually\n[372.96s] leads to true mindfulness, to happiness,\n[376.72s] to clarity of\n[378.68s] comprehension. It leads to our ability\n[381.28s] to concentrate and to become calm and\n[384.479s] peaceful. Our mind is no longer being\n[387.28s] pulled this way and that by information\n[390.16s] coming through each of our\n[391.88s] senses. Now, as I say, this practice was\n[395.12s] generally recommended to monastics.\n[397.759s] However, in some places in the sutas, it\n[400.08s] was also recommended to lay people. In\n[403.039s] particular, in one early suta, uh the\n[406.319s] monk Bared Vaja is talking with King\n[408.759s] Udana. And King Udana is asking about\n[412.72s] practices he can use to give up his his\n[416.24s] his tendency towards sexual desire for\n[419.599s] certain women in his household. And the\n[422.24s] monk Baradvaja recommends a number of\n[425.039s] different practices.\n[427.039s] However, King Udana finds problems with\n[430.0s] them and he ends up or I should say\n[433.28s] Bared Vaja ends up recommending the\n[435.84s] practice of sense restraint and at this\n[438.72s] point King Udana says that he agrees\n[441.44s] that this in fact sense restraint is the\n[443.68s] only practice that really works for him\n[445.84s] in this situation. In modern life, where\n[449.36s] the things that we''re confronted with\n[450.88s] through our senses are specifically\n[452.72s] tailored to grab them and not let them\n[455.84s] go, these kinds of practices can be\n[458.72s] particularly relevant. Today''s features\n[461.919s] and details include things like seeing\n[464.96s] idealized lifestyles online, idealized\n[468.44s] people, or rage inducing headlines,\n[472.08s] triggering headlines for us. And these\n[475.319s] stimuli introduce into us reactions that\n[478.16s] become very hard to stop of desire, of\n[482.319s] hatred, and of restlessness. One key\n[485.44s] example of this that all of us will\n[487.28s] probably be familiar with is doom\n[489.72s] scrolling. Getting caught in a loop of\n[492.08s] endless scrolling through disturbing or\n[494.72s] triggering online posts.\n[497.52s] One neurological description of this\n[500.599s] process involves what''s known as the\n[503.12s] dopamine loop. Dopamine is key to our\n[506.96s] seeking and searching behavior. It\n[509.199s] conditions our wanting of external\n[511.64s] stimuli and is rewarded by the\n[514.959s] appearance of new information. So the\n[517.519s] modern phenomena of clickbait and\n[520.599s] doomcrolling are all conditioned on\n[523.44s] basically triggering this kind of\n[525.2s] dopamine loop. As the psychologist Susan\n[528.48s] Weinshank put it\n[530.04s] recently, the combination of dopamine\n[532.8s] release in the brain plus a conditioned\n[535.279s] response with motor movement, the swipe\n[537.839s] with finger or thumb, makes this\n[540.08s] dopamine loop hard to stop. One way you\n[543.519s] can get some control is to create a\n[545.839s] counter movement, a physical movement\n[547.92s] you do that becomes its own conditioned\n[550.16s] response. For example, my\n[552.959s] countermovement conditioned response is\n[555.36s] that when I realize I''m in a dopamine\n[557.76s] loop, I immediately press the home\n[559.839s] button and place the phone face side\n[563.56s] down. And of course, similar loops of\n[567.399s] compulsion occur in other kinds of\n[570.48s] online and offline behavior such as\n[572.959s] gaming, playing games or gambling which\n[575.68s] we can become addictive. So the question\n[578.56s] for us today is what we can practically\n[581.279s] do to try to escape these kinds of\n[584.16s] addictive loops. And I think Susan Weine\n[587.279s] Shank''s approach of this counter\n[589.76s] movement is pretty much exactly a\n[592.64s] practice of sense restraint of noticing\n[595.839s] the problem, quitting the program, and\n[598.24s] putting the phone down. This requires us\n[601.36s] of course to be mindfully aware of when\n[605.04s] these kind of loops start to propagate\n[608.08s] when they become problematic. So\n[611.04s] guarding the sense doors in this in this\n[613.12s] sense becomes a practice of mindful\n[616.16s] media\n[617.72s] hygiene. We notice when things become\n[621.279s] problematic and restrain the senses\n[623.76s] around those. We create intentional\n[626.88s] boundaries around our sense input. For\n[629.68s] example, we can put our phone down\n[632.399s] during meals. We can unsubscribe from\n[636.399s] sensationalist or triggering accounts.\n[639.519s] We can work to limit the time we spend\n[642.32s] doom scrolling. Perhaps we can even put\n[644.959s] our phone into grayscale mode or turn\n[647.68s] off the sound in order to limit our\n[650.12s] reactivity. We can practice mindfulness\n[652.88s] of reactivity.\n[654.8s] Notice when we''re stuck in these kinds\n[656.959s] of dopamine loops. Notice when our mind\n[660.079s] starts spinning out on the features and\n[662.88s] details of what surrounds us,\n[665.519s] particularly in our media landscape, and\n[668.72s] then practice stepping back a bit. We\n[671.92s] can also practice a kind of an internal\n[674.64s] strengthening, a strengthening of our\n[676.48s] own internal abilities to\n[679.56s] counterreact by forming other kinds of\n[683.64s] relationships by practicing things like\n[686.56s] kindness and compassion, generosity\n[689.12s] towards others, helping others, practice\n[692.48s] in world inworld relationships rather\n[696.24s] than making our lives more and more\n[698.8s] exclusively online. So clearly you do\n[702.16s] not need to live in a cave or be a\n[704.92s] monastic in order to practice sense\n[708.04s] restraint. We can start today simply by\n[711.36s] reflecting on how we feed our mind and\n[714.64s] whether we''re feeding it things that are\n[716.56s] really good for it and healthy or not.\n[719.279s] So this practice of guarding the sense\n[721.2s] doors isn''t so much about avoidance as\n[724.72s] it is about keeping our minds\n[727.56s] uncluttered, about wise attention to\n[730.16s] what pulls us into these reactive loops\n[734.24s] and that become eventually detrimental\n[736.56s] to our health and learning to soften\n[739.2s] around them or give them up. It''s about\n[742.399s] renouncing what''s unhealthy for us in\n[745.6s] order for ourselves to live more freely.\n[748.56s] It''s about protecting our inner silence\n[751.279s] to allow joy and peace and wisdom to\n[754.959s] arise in a noisy world that''s tailored\n[758.48s] to grab and keep our attention. This\n[761.68s] kind of practice may be the most radical\n[764.32s] of all. So let me know, have you\n[766.959s] practiced guarding your sense doors and\n[769.68s] how has it helped your practice and your\n[771.92s] life today? Let us know. And if you want\n[775.36s] to hear more about this gradual training\n[778.24s] that I mentioned a couple of times in\n[779.839s] this video, I have a whole video about\n[782.0s] that which I''ll leave up here on the\n[783.839s] screen so you can hear more. If you''re\n[786.8s] getting something out of these videos of\n[788.32s] mine, uh, consider taking a look at my\n[790.24s] Patreon page, which is linked up here on\n[792.88s] the screen and down below in the notes,\n[795.12s] and see if you want to help support the\n[797.04s] channel and the work that I''m doing.\n[799.2s] Thanks so much, and we''ll catch you on\n[800.639s] the next video. And meanwhile all of you\n[803.12s] be"}'
