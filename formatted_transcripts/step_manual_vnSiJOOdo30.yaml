transcript: '{"content":"\n[36.04s] What each of us looks for in our significant personal relationships will differ from person to person.\n[42.1s] If we value reflection, personal growth, and independent thought, we''ll want our relationships to support those things.\n[49.06s] Games and creative pursuits might be important features, giving us an outlet for the playful, inventive parts of our nature.\n[56.02s] Something we might consider a relationship essential is the ability to just relax and be our authentic selves.\n[63.04s] We might also expect a healthy sense of security, so there''s no fear that an innocent slip could land us in trouble,\n[69.5s] or that accidents and misunderstandings will get blown out of scale\n[73.929s] Whatever positive, affirming features you look for in a relationship,\n[77.71s] you can forget all about them when malignant narcissists manoeuvre themselves into your life.\n[83.56s] Personal growth, independent thought, creativity, and authenticity will all get shoved into storage,\n[90.08s] leaving you in a rigid, stagnant environment.\n[93.84s] Security will evaporate as you begin to realise one wrong step could do you serious damage.\n[100.119s] To malignant narcissists, your value begins and ends with your ability to serve them.\n[105.82s] Dismissing your needs is just the start: soon the mind games begin.\n[110.34s] Like stepping into an Escher print, you''ll find yourself completely disorientated by the impossible angles\n[115.94s] of the narcissist''s world, where the only predictable feature is unpredictability.\n[121.48s] Not only is there no telling where you''ll end up when you go through a door,\n[124.72s] there''s no telling what laws will apply when you get there.\n[127.72s] Down might now mean up or sideways.\n[131.76s] With each vertigo-inducing flip your brain tries to find some underlying order,\n[136.82s] and when you think you might have found it the ground falls from under you\n[141.7s] Narcissists use a range of mind games to knock targets off balance,\n[145.04s] including love-bombing, gaslighting, and various forms of emotional blackmail.\n[150.24s] I want to explore a particularly poisonous mind game called the double bind, which puts people in no-win situations.\n[158.18s] I''ll be looking at examples of it in action and some different ways of dealing with it.\n[168.09s] A no-win manipulation could be defined as the act of putting targets in situations where all actions lead to a negative outcome.\n[174.81s] An example would be what''s called a Kafka trap: in Kafka traps targets are accused typically of some psychological flaw.\n[183.0s] When they deny the accusation, their denial is taken as evidence that the accusation is true.\n[188.43s] The possibility that the accusation is false is invalidly excluded.\n[193.739s] Targets of Kafka traps are only presented with losing options by their accuser.\n[197.88s] In fact, in many cases, targets do have positive options; one is to simply ignore their accusers.\n[205.079s] Another is to expose and mock this fallacious manipulation.\n[209.46s] With double binds, these options aren''t available.\n[213.26s] A double bind is a very specific kind of no-win manipulation\n[216.96s] in which targets are presented with conflicting messages, each of which and negates the other.\n[221.84s] In effect, they''re told \"do X\" and \"don''t do X\".\n[225.86s] When targets are playful, they might be criticised for never taking anything seriously.\n[230.38s] Then, when they''re serious, they''re told to stop being a drag and lighten up.\n[234.86s] The double message is: \"be serious and don''t be serious\".\n[238.32s] Whatever the target chooses, the abuser responds with the other.\n[242.099s] Double binds occur in relationships where targets feel compelled to figure out what the manipulator wants and provide it.\n[248.849s] They feel unable to ignore the dilemma presented to them, which is what binds them in.\n[254.01s] They often feel unable to point out the injustice of the dilemma because criticism leads to more negative consequences.\n[261.299s] And, they''re unable to consult the manipulator to help find a way out.\n[265.26s] Double binds can be extremely destructive, psychologically.\n[269.12s] Targets of narcissists can tie themselves in knots trying to work out what the narcissist wants.\n[274.62s] But all the narcissist actually wants is to make the target fail.\n[278.46s] Through repeated experiences of failure, targets can end up in a state of learned helplessness\n[283.28s] where they feel unable to control or change a situation.\n[286.88s] Making decisions can become increasingly difficult as targets start habitually questioning their own judgment.\n[292.76s] As they become more passive and compliant, the narcissist takes control.\n[303.02s] I took a straw poll among my patrons, asking if they could identify any personal experiences of double binds in their lives.\n[309.72s] If so, in what areas?\n[312.36s] Respondents could tick multiple categories.\n[314.92s] 2/5 of all respondents reported experiencing this manipulation in personal, one-to-one relationships, respondents\n[321.28s] and half of all respondents encountered it in their family.\n[325.16s] A quarter of respondents identified double binds in a religious, political, or pseudoscientific ideological group,\n[331.12s] and a quarter experienced them in other environments, including social circles, personal therapy, and the workplace.\n[338.86s] In total, three-quarters of all respondents reported experiencing double binds,\n[343.22s] with the remaining respondents registering no awareness of having encountered them.\n[347.76s] Even acknowledging the limitations of straw polls, this is a very high figure.\n[352.36s] And it''s worth noting the significant prevalence in one-to-one relationships and in families,\n[357.68s] which we might hope would be win-win environments where people lift each other up.\n[362.52s] What binds us into double binds comes in many forms.\n[366.14s] The complex emotional ties found in one-to-one relationships and families can make very strong binding material,\n[372.86s] so strong that we sometimes snap before they do.\n[376.38s] So what do double binds look like? Here are some examples from literature, history, and my own personal life.\n[388.86s] Robert Graves''s novel, I Claudius, chronicles the rule of Rome''s ancient emperors.\n[394.06s] In his portrait of the delusional, murderous Caligula, he depicts a deadly double bind manipulation.\n[400.54s] When Caligula returns home triumphantly after an imaginary war with the god Neptune,\n[405.48s] he is furious to find there are no cheering crowds to greet him.\n[408.84s] No flowers on the streets, no fanfares.\n[411.87s] He threatens to kill the senators, who fail to organise any celebrations.\n[416.19s] The terrified senators point out that Caligula specifically ordered them not to arrange any celebrations.\n[422.25s] Caligula scolds them for taking him at his word. He wanted them to show their love for him by disobeying him.\n[428.84s] Graves''s Caligula delights in putting his subjects in impossible situations.\n[433.64s] He berates his senators for celebrating the Battle of Actium, in which his great grandfather Mark Antony was defeated,\n[440.18s] but he later jokes that he had the senators both ways because if they hadn''t celebrated the battle,\n[445.13s] they would have insulted his grandfather Augustus, who won the battle.\n[449.82s] Being born into a family headed by a narcissistic mother and a timid father who spent his life appeasing, excusing, and enabling her,\n[457.98s] double binds of various intensities were part of my early everyday life.\n[462.3s] One recurring double bind concerned my responses to her constant false accusations.\n[467.7s] Like many narcissists, she was acutely paranoid.\n[471.18s] She was convinced everyone, from family members to doctors to shop assistants, was out to undermine and belittle her,\n[478.06s] and she was always telling victory stories recounting her stinging revenge on some unsuspecting individual for an imagined insult.\n[486.44s] Because of her paranoia, my brother and I were repeatedly accused of saying doing or even just thinking\n[492.52s] outlandish things we''d never said, done, or thought.\n[496.38s] She would charge us to tell the truth in front of her Christian God.\n[500.3s] When we truthfully reported our innocence, she''d triumphantly call us liars.\n[505.26s] She''d often tell us we were physically turning green with guilt. She had unshakable conviction that she was right.\n[512.58s] Our no-win choice was to make a false confession and get punished for a non-existent offense,\n[517.9s] or tell the truth and suffer even more abuse for lying.\n[522.02s] The double message was: \"be truthful and don''t be truthful\".\n[526.16s] Without knowing it, she did teach me something valuable with this double bind.\n[530.42s] Displays of unshakable conviction don''t require the possession of truth.\n[534.44s] Another kind of double bind happened when she gave up things like chocolate or cigarettes,\n[538.7s] often as part of a religious observance called Lent, which requires Christians to abstain from some food or luxury for a few weeks.\n[547.0s] She''d rope us in to help her instructing us not to let her near those things.\n[551.81s] When she gave up cigarettes, I caught her lighting up and reminded her she said she wasn''t smoking anymore.\n[557.99s] She scolded me angrily for spoiling her fun, sending the message \"don''t intervene\".\n[563.96s] So the next time she lit up in front of me, I said nothing. She then scolded me for showing no support,\n[570.46s] sending the message \"intervene\".\n[572.9s] When she gave up chocolate for Lent I happened to eat a chocolate bar from the kitchen cupboard.\n[578.04s] Later that day, she asked where the chocolate was.\n[581.16s] When I said I''d eaten it, she flipped into a rage,\n[584.38s] slamming cupboard doors and drawers and shouting that she''d planned to eat it herself in secret.\n[589.62s] So much for Lent.\n[591.96s] As punishment for depriving her I was forbidden all food treats for several days.\n[597.14s] In our early teens, when my brother and I left our parents'' religion,\n[601.28s] the relentless abuse we endured for that finally pushed us to start forcefully standing our ground.\n[606.4s] We were fully prepared for an escalation, but she backed off and finally started exercising some self-control.\n[614.06s] But her apparent improvement was an illusion.\n[617.94s] Behind the scenes, she just got worse, which leads me to my last personal example:\n[623.6s] an especially venomous breed of double bind, a double bind by proxy, played out through someone else.\n[630.34s] A couple of years ago the doctors told my father his cancer had returned. This time, it was terminal.\n[636.62s] My brother lived nearby and nursed him morning and night.\n[640.38s] I lived far away but visited frequently.\n[643.96s] On what turned out to be my last visit, I stayed down for a couple of days lodging at a nearby hotel.\n[649.9s] It felt like we had a wonderful time, full of laughter.\n[653.94s] After saying goodbye, I lingered outside the front door chatting with my brother\n[658.78s] Suddenly, we heard her raging at full volume. It was shocking.\n[664.32s] I later learned this was a regular routine: during visits she''d store up a list of imagined insults, then explode when they were alone.\n[673.48s] The most nauseating part was hearing my terminally ill father''s exhausted voice trying to appease her anger.\n[681.64s] I suspended visits for a while and started writing him long weekly letters. They were painful to write, but I kept them upbeat.\n[690.28s] But after a few letters, he revealed in a phone call that every time my letters arrived, she flew into a jealous rage.\n[697.88s] She was resentful of the intimacy and affection in my words.\n[702.14s] In a unique moment of candour, he said, \"Your mother''s a very sick woman\".\n[707.56s] It was the only time I ever heard him acknowledge her disorder.\n[711.92s] So, instead of lifting his spirits, my letters had become a source of dread for him.\n[717.559s] I asked him if he wanted me to continue writing. The awkward silence that followed said everything.\n[723.829s] Her rages weren''t just antagonistic now:\n[726.679s] they were deadly, leaving him physically depleted when he needed every ounce of strength\n[733.399s] A few days later we had what would be our last phone call.\n[737.809s] We''d been chatting for a while when he paused and sheepishly asked if I wanted to send a message of love to her.\n[745.0s] When I reminded him of the bad blood he knew existed between us, he pretended not to know what I was talking about\n[750.82s] and gave a panicky speech about how everything was fine.\n[754.22s] I realised she was listening in and I knew what would follow when he ended the call.\n[760.309s] I now realised all contact with him risked exposing him to the lethal stress of her rages.\n[766.12s] I also know if I confronted her it would only rebound on him when they were alone.\n[771.9s] I suspended contact while I considered the situation.\n[775.42s] She then started telling people I was shunning my dying father.\n[779.839s] The double bind was complete: damned if I contacted him, damned if I didn''t.\n[786.15s] A few weeks later my father died in a nursing home, reportedly still appeasing her anger.\n[793.38s] Every few months she writes to me urging me to get back in contact,\n[797.6s] and blaming her dead husband for causing a rift between me and her.\n[804.2s] Double binds sometimes get played out on a larger scale by religious and political zealots\n[809.64s] In 17th century England, people accused of witchcraft were faced with a terrifying double bind where both options led to death:\n[817.0s] falsely confess to being a witch and die, or truthfully deny being a witch and die.\n[823.15s] Torture was illegal in England at the start of the witch hunts.\n[827.14s] Originally, the only method of physical coercion legally available to interrogators was sleep deprivation.\n[833.5s] This method was successful with the first person accused of witchcraft by professional witch-finder Matthew Hopkins.\n[840.55s] Elizabeth Clarke confessed after being kept awake for three days.\n[845.02s] But a later target of Hopkins, a priest called John Lowes tolerated sleep deprivation for many days.\n[851.38s] It was only at this point that torture was introduced illegally in a procedure called \"swimming the witch\"\n[856.98s] in which subjects would be repeatedly pushed to the edge of drowning based on the idea that water would repel witches.\n[863.26s] It was this torture that broke John Lowes, who confessed.\n[867.7s] With England in the middle of civil war, the increasing implementation of illegal torture went unchallenged,\n[874.08s] enabling one of the most notorious double binds in history.\n[878.02s] And, it highlights a crucial point: legal protections don''t just safeguard our well-being in the broad sense.\n[884.17s] They also work to prevent innocent citizens being trapped in state-approved double binds.\n[889.68s] As our protections are eroded, we all become increasingly vulnerable to these no-win nightmares.\n[895.78s] Another example of this was McCarthyism.\n[899.16s] Named after one of its main advocates, Senator Joseph McCarthy, this American political witch-hunt gained ground in the 1940s and 50s,\n[907.6s] seeking to expose and eradicate what it considered un-American elements.\n[912.98s] In 1947 a group of screenwriters and directors, who had come to be known as the Hollywood Ten,\n[918.64s] was subpoenaed to appear before the House Committee on Un-American Activities, chaired by congressman J Parnell Thomas.\n[926.28s] They were asked whether they were now or ever had been members of the American Communist Party, and whether they''d attended certain political meetings.\n[935.8s] If they refused to answer, they could be jailed for contempt.\n[939.64s] If they answered yes, they''d be commanded to name others; if they refused, they could be jailed for contempt.\n[946.3s] If they answered no, they could be vulnerable to charges of perjury.\n[949.82s] Being subpoenaed by the House Committee meant they''d already been identified as communists\n[954.44s] by other informants who were granted immunity and couldn''t be cross-examined.\n[959.44s] As one of the Hollywood 10, Lester Cole, remarked:\n[963.1s] \"Don''t you see, these investigations are actually traps. You''re damned if you do and you''re damned if you don''t. It''s a form of legal lynching.\"\n[971.78s] Like the English witch hunts, this political trap relied on the violation of legal protections,\n[977.88s] including constitutional rights to free speech, free association, and free conscience.\n[984.06s] Witnesses weren''t summoned because they''d committed any crimes.\n[986.88s] They were jailed, ostracised, and rendered unemployable purely for exercising their rights under questioning.\n[993.92s] It was the House Committee on Un-American Activities that was attacking American values,\n[999.0s] redefining un-American on its own terms so that the mere act of questioning the committee became un-American.\n[1006.17s] It''s worth mentioning that some months later Committee Chairman J. Parnell. Thomas was charged with fraud.\n[1012.74s] Having jailed witnesses for refusing to answer his questions, Thomas now exercised his own right not to answer questions.\n[1019.94s] He was jailed, in his case for actual crimes.\n[1023.9s] These examples illustrate some of the scope of double binds.\n[1027.589s] They also highlight some of the things to bear in mind when we''re dealing with this manipulation.\n[1039.15s] Obviously in many cases cutting narcissists out of your life can instantly terminate all the double bind abuse.\n[1045.36s] But going no-contact isn''t always an option; for example, for extremely isolated targets who have nowhere to go.\n[1052.32s] Even when it is an option, some targets might decide for various reasons to hold off from exercising it, at least for a time.\n[1059.49s] If you''re constantly subjected to double binds by your boss, quitting impulsively with no job to go to could create big problems.\n[1068.01s] Instead, you might choose to stay just long enough to secure a new job.\n[1072.66s] If you''re dealing with an extremely vindictive narcissist, suddenly going no-contact could spark a revenge campaign.\n[1079.54s] If you''d prefer to sidestep that, you might choose instead to gradually fade over a few months.\n[1086.68s] In some cases targets might choose to go low contact, putting strict limits on their interactions,\n[1092.769s] keeping visits or phone calls brief enough to avoid entanglement.\n[1097.09s] For whatever length of time you decide to tolerate your narcissist''s company, here are some thoughts on dealing with their double binds.\n[1104.85s] Sometimes the clues to dealing with manipulations lie in their definition.\n[1109.23s] If we look at the defining factors of double binds, we can identify some of the subtle traps embedded in them.\n[1115.89s] Double binds present us with two conflicting messages. The abuser relies on targets believing they have no alternative but to choose one.\n[1123.84s] After all if someone says \"do X\" or \"don''t do X\", how can you not choose one?\n[1129.34s] By not following one instruction you automatically fulfil the other.\n[1133.56s] Well, it turns out sometimes you can refuse both choices by shifting to a different level of communication.\n[1140.52s] In their article \"Towards a Theory of Schizophrenia\", Gregory Bateson and colleagues recount a Zen story illustrating a solution to a triple bind.\n[1149.24s] The Zen master holds out a stick and tells his students: if they say the stick is real, he''ll beat them with it.\n[1156.01s] He then tells them he''ll also beat them with it if they say the stick''s not real, or if they just say nothing at all.\n[1162.88s] In response, the student steps forward and breaks the stick. Now the master can''t be them with it.\n[1169.74s] This story perfectly captures the psychology of double binds.\n[1174.25s] Abusers present targets with a stick and ask them how they''d like to be beaten.\n[1179.14s] Instead of answering that sadistic question, targets need to learn to break sticks.\n[1184.88s] After being punished for helping my narcissistic parent give up chocolate and cigarettes, I steered clear of whatever food she said she was giving up,\n[1192.22s] and I kept myself to myself.\n[1194.76s] She went to embarrassing lengths to reel me in.\n[1198.0s] One year, when she gave up cakes, she staged a groan-worthy scene\n[1202.16s] where I was obviously meant to discover her in flagrante delicto with a donut.\n[1207.64s] Luckily, I saw it coming and walked into a different room.\n[1211.51s] Through a crack in the door, I watched her holding onto that donut for ages waiting to be found.\n[1218.35s] Instead of falling into her double bind of intervene or don''t intervene,\n[1223.02s] I sidestepped both options by sabotaging her plan to be discovered. I broke the stick.\n[1230.18s] One of the things that stops target''s identifying solutions to double binds is that they''re trained to anticipate what the narcissist wants,\n[1236.96s] in the perpetual false hope that by pleasing the narcissist, they can avoid a negative outcome.\n[1242.98s] So long as we hold on to that false hope, our narcissists can dangle us like puppets dancing to their tune.\n[1249.52s] We remain in a constant state of anxiety, reacting in reflex knee-jerk ways to the whims of our abusers.\n[1257.14s] But when we let go of that false hope and fully accept the reality that our abusers want to punish us whatever we do,\n[1263.36s] we can forget all about pleasing them and start thinking about what we want.\n[1268.38s] Thinking about what you want keeps you grounded in your own mind instead of getting lost in the abuser''s.\n[1274.47s] You can begin to build and maintain important psychological boundaries.\n[1278.85s] Instead of reacting mindlessly you can respond mindfully.\n[1283.67s] With a clearer head, targets start seeing solutions to double binds that used to drive them mad when they were chasing after the narcissist''s approval.\n[1292.47s] Sometimes the solution is simply about not responding.\n[1295.95s] Targets are trained to feel unable to ignore the dilemma presented to them, but lots of dilemmas can easily be ignored,\n[1302.64s] especially when the double bind depends completely on the target reacting.\n[1306.42s] One example is when the narcissist gives you conflicting feedback about your social behavior,\n[1311.62s] suggesting you should be serious and not serious, assertive and not assertive, attractive and not attractive, and so on, always putting you in the wrong.\n[1322.32s] The moment you engage with this kind of feedback you lose.\n[1327.05s] If you change the way you behave you lose.\n[1330.0s] You''ll start acting inauthentically and you''ll inevitably get criticised anyway.\n[1335.26s] If you try to explain or defend yourself, you lose.\n[1338.78s] The narcissist can then drag you into more draining pointless conflict.\n[1343.56s] The solution is to disengage. A polite smile will acknowledge you''ve heard them. You can even thank them for sharing their thoughts.\n[1351.45s] Then you can ignore everything they''ve said and continue being yourself.\n[1357.24s] Targets can sometimes ignore a double bind by interrupting it with a deflection.\n[1361.84s] They often learn to spot a double bind on the horizon. And sometimes they can avoid getting entangled by excusing themselves from the interaction.\n[1370.3s] George has a history of long draining phone calls with his narcissist friend Bonnie, who constantly finds fault with him.\n[1379.72s] When she becomes pregnant she criticises him for asking her about it. Can''t he think of something more original?\n[1385.98s] In their next phone call, he doesn''t mention her pregnancy. Now he''s accused of showing no interest.\n[1393.1s] Instead of getting stuck in these no-win exchanges ,George could choose to cut the call short, telling her something needs his urgent attention.\n[1401.75s] Preparing deflections to break the narcissist''s flow gives you an escape hatch which you can activate at any time.\n[1409.48s] Targets might be unable to point out the injustice of double binds to the abusers who instigated them,\n[1414.48s] but they can point out the injustice to other people, and this is where we can all play a part.\n[1420.48s] It''s in all of our interests to help each other when we become aware of abuse.\n[1424.9s] This point really comes through in the religious and political witch hunts: both were made possible because people stood by and declined to help.\n[1434.32s] Being part of a culture that listens helps to ensure that will be listened to if we should be targeted.\n[1441.06s] I''m not an advocate of automatically believing allegations of abuse.\n[1445.58s] After all, a typical form of narcissistic abuse is the smear campaign, spreading false allegations to stigmatise an individual.\n[1454.14s] Justice is about facts, not assumption. I''m an advocate of due process and responding to allegations with thorough investigation.\n[1462.82s] A family, a community, a nation that cares is one that investigates.\n[1470.34s] Targets of narcissists have become a fast-growing self-supporting community online, sharing experiences and ideas.\n[1477.56s] As awareness of narcissistic abuse increases, more people are beginning to recognise it and acknowledge the damage it does.\n[1486.38s] Lastly, although we''re unable to consult our abusers directly for answers, sometimes we can get insights from them indirectly.\n[1494.63s] By observing their behaviour, we can learn some of their weak spots.\n[1498.88s] Something I learned about my narcissist parent was that she was easily thrown by unexpected off-the-wall humour.\n[1505.72s] She never had a comeback and it left her flustered and disarmed. It was like throwing her a puzzle.\n[1512.16s] As a child, I used this strategy repeatedly to sidestep traps.\n[1516.64s] Targets do need to be subtle about exploiting weak spots: narcissists are liable to attack if they feel deliberately fooled or humiliated.\n[1524.92s] It''s not about prodding the narcissist, but about manoeuvring effectively around them,\n[1530.78s] Following on from that, it helps to learn our own weak spots.\n[1534.92s] What vulnerabilities might the narcissist be perceiving and exploiting in us? Do you notice any consistent patterns and themes?\n[1543.98s] Sometimes our weak spots are other people. When the abuser can''t get to us directly, they can sometimes get to us through the ones we love.\n[1552.34s] This happens repeatedly in high control groups, where members feel forced into compliance to protect loved ones.\n[1559.69s] My father was a huge weak spot.\n[1561.96s] I had a powerful urge to rescue him from her abuse, but he was deeply entrenched in a codependent relationship with her.\n[1570.78s] When loved ones choose to stay in abusive relationships or groups,\n[1574.45s] there''s often very little we can do except let them know that we love them and that we''re there if they want us.\n[1580.99s] Whatever they do has to be their own choice.\n[1584.049s] My father made his choice, and it was when I finally accepted his choice that I was able to let go.\n[1593.66s] If the worst comes to the worst and you find yourself in a double bind you can''t see any way out of, there are still some principles to bear in mind.\n[1602.14s] Don''t argue or show emotion.\n[1605.64s] Two things many targets learn early on: arguing just gets you more entangled in the situation,\n[1611.88s] and narcissists love seeing your distress.\n[1615.77s] Make the choice you feel you can live with.\n[1618.98s] Sometimes that might mean taking the harder option.\n[1622.88s] In regard to her false accusations, I made a conscious decision never to go along with her and admit to things I''d never said, done, or thought.\n[1632.02s] Even though I know it meant more punishment because I''d be accused of lying,\n[1635.76s] I''ve recognised that there was a bigger personal cost involved if I started bending to fit her distorted reality.\n[1643.8s] Don''t beat yourself up because you didn''t think of a way out.\n[1647.34s] Don''t collude with the abuser by bringing yourself down. Stay positive.\n[1652.26s] Try to think if there''s anything you might do differently next time, and use the negative experience\n[1657.52s] as motivation to plan a more permanent solution to your abuse in the future.\n[1663.05s] The no-win Kafka trap is named after dystopian author Franz Kafka.\n[1668.22s] In his parable \"Before the Law\", the law a man seeking the law is refused access to it by a gatekeeper.\n[1675.33s] The gatekeeper allows him to sit by the gate, letting him think he might be allowed in someday.\n[1680.46s] The man waits there for the rest of his life, but never gains access.\n[1685.97s] Kefka''s story expresses the futility of waiting for justice to come to you.\n[1691.219s] My father fell into a similar trap, waiting decades for a peace that never came.\n[1697.639s] If targets of narcissists want to end their abuse, they have to be the force for change.\n[1703.0s] The good news is that narcissistic no-win mind games aren''t necessarily the impossible situations they seem.\n[1710.78s] When we take a step back, we begin to find lots of solutions\n[1715.219s] Whether we''re the target or the person a target approaches for help,\n[1719.149s] we can all do something to combat the abuse of double binds."}'
