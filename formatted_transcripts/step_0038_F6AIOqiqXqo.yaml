transcript: '[music] [music] Hello everybody. This is MVP Kate here and I would like to welcome you all back into my channel. So today um we''ll be having a topic that''s a little different. It''s something that''s close to home and it''s something that like it''s the first time that I''ve opened about this. Um I learned about this a few months ago and like I guess I didn''t really fully understand it at the time, but I I''m getting the idea now. So this is about my whole life experience with a low average IQ. Now my IQ score, last time I got tested for IQ was when I was 17. I am now 24 years old and my score was an 86. I, as you all know, I have autism spectrum disorder and I was diagnosed when I was three. Okay. So, yeah, I had that test when I was 17. Um, I didn''t know that was my score cuz I didn''t really look at my papers back then, but I had a fair look. It''s a long story. So, I was wanting to like maybe get some support for it was a program I wanted to get in for people with disabilities. It''s to help like with independent living. And I didn''t get accepted into it because they said apparently my IQ was too high. And how I had to get my IQ um papers was it was from my old school board. So I had to ask them for my old IQ test cuz that was a requirement. Um the the requirement to get in the program is an IQ of 70 and under and I''m above that. However, my well, my IQ score is it''s technically an average IQ, but it''s below the mean. And that means like it''s it''s 14 points um less than 100. And that is supposed to be the main score. it''s like supposed to be like 100 and above or some people even say 90 up to like 109 or something. But then I also see studies where it says average IQ range from 85 to 115. So it''s kind of like in a mix. It''s kind of hard to explain though cuz it the whole thing is kind of confusing. Um moving forward. Yeah, that was how I learned about my IQ score. When I first learned about it, I was devastated because I always felt like I was higher than that. And although they say that IQ does not define intelligence, which is true, it''s very true that it doesn''t. It doesn''t describe all of your intelligence as a person because everybody has strengths and weaknesses. It doesn''t mean that life is easy because well, think about it. For those who went to school and didn''t struggle with certain things, many people with that IQ score struggle more with learning. I find like I have a learning disability. I don''t exactly know what kind of learning disability I have. Um, all I know is that it says I do I um do qualify for a learning disability. It''s and it''s like it''s a specific one. It''s like specific learning disorder or something like that. Um and it makes it challenging. So in that state because it is above 70 I don''t qualify for intellectual disability but in a way I also do consider myself to have an intellectual or an intellectual disability despite that I do consider myself to have one because I struggle with other things in my life. So like I struggle with adapted functioning as they call it and it is like I struggle in that like um because there''s certain things that makes it hard like when I said that I was trying to get into a program that could help me with independent living. Like there''s certain things that I do in my everyday life that makes it challenging. like I have trouble organiz organizational skills. Um I have a hard time doing really big task and it''s much easier for me to do small little task at a time. It''s hard for me to get motivated to do certain things and it''s little things like that. What else was I going to say? Okay, those are some things. Um, I also struggle with academics. That''s another thing about low or like those types of IQ scores that makes it challenging. Like, you know, when people tell you when you''re a child, you can do anything you set your mind into. Like, here''s a good here''s the thing. I know for a fact, for a fact, that I will never become a doctor. Why did I say that? Because, well, it''s a lot of work and it''s very hard to get into. you think about like it''s not impossible, but it''s way harder for the person with an IQ of 86 to be a doctor than someone with the IQ of 110 or 15 or even 20 or obviously 20. That''s super high. But yeah, um it''s even harder for me to do college courses. Even though I''ve done a I''ve done some college courses, like I did one generic English course and I did pass with a 16 out of 20, but I also had a lot of support because I need those adaptations. It''s because of my learning disability, because of my autism. I need more time. I need, I guess, a little more structure. Um, it''s just a harder part. Um, I struggle with abstract thinking. I don''t know if that is part of IQ. I don''t think so. Um, but I am more of a linear thinker than an abstract thinker. Now, do I have high functioning autism? I would say yes. I consider myself to be high functioning mainly because um there''s a lot of things that I can do like although it''s really challenging um well how can I say this? I do have a job and I drive and I can cook and I can do a lot of different things. I played piano. I know how to solve a Rubik''s cube even. So for people who really want to solve a Rubik''s cube that are around my score, don''t worry about that cuz it doesn''t, you know, that''s, you know, it''s one of the many things where they describe that IQ does not define intelligence because you can do these things and I know to play a decent game of chess. I''m not a pro though, like no way. But I can play chess. Um, so I have strengths that can be really good like playing the piano, but I struggle with other things like reading and like following rhythms. That''s also a challenge. Um, and English is more of my strength, but like I''m good at spelling and writing, typing. I can write pretty good, but I would say it''s harder for me. Sometimes it can be harder for me to speak. It depends on the situation. Um, I think that''s due to anxiety though. So, it depends on the scenario. [sighs and gasps] And I also have trouble. What''s the word? Okay. I''m good with writing. I struggle with comprehension. Um, I''ve always had it''s one of my weaknesses. I And when I was in or when I did math classes before in school, I struggled with word problems and that''s a lot to do with the fact that it''s not visual. Sorry, it''s the dogs in the background. It''s not as visual and like unlike the ones where you can actually see like if you''re doing like surface area or trigonometry, you can see the numbers and you can see the shape and stuff. So, and there might be formula sheets, so it''s easier. But when it''s word problems, you have to think a lot with your brain and that can be hard. And when there''s things that I do not know about, like some people may ask me certain questions and I get mental blocks. I''m not sure about you guys, but mental blocks are something that I tend to get. And for me to describe what a mental block is, it''s like, think about it. Think about words that you''re processing information from on a line. Here you are. You''re moving. You get all these words behind you. And then there''s your mental block right here. And then over that mental block, there''s your next set of words. And you''re trying to fit what supposed to go on that mental block. And you just can''t think of the word. And it takes you a long time before you can finally think of the word before you continue your sentences. That''s what it''s like having a mental block for me. It''s like you [snorts] get stuck in that one area before you can continue on. And that''s what I often get. I think it''s just part of neurodeiversity. Um probably a combination of things. So yeah. Um, the first IQ test I got scored on was a 76 and that was when I was 10 years old. Um, and that was 10 points below an 86. So, okay, I was 10 years old when I when I got to 76. And then 7 years later, it has inc or my IQ score has increased to an 86. So, seven years later now, I suspect that it''s probably a 96 since like in a way it would make sense because if it goes by 10 points or if my Q score has scored 10 points after seven years and it happened once, I suspect that it probably would happen again. But I honestly did not get an adult IQ test. And chances are it''s probably different than the ch like the childhood IQ test. Um not 100% sure on that though. Um I mean I''ve developed different skills a lot from back then. But I also heard that it could be like they often tend to stay stable for the rest of your life. But I don''t know. Uh, I''ve been hearing different theories and like a lot of people were like you just have to train your brain. So like to get a what you call higher score. Molly, that''s enough. That''s my dog in the background. Yeah. Yeah. Oh my gosh, she''s driving me crazy. I''ll be right back. So, yeah, there''s a lot of challenges like especially when it''s based on school or life skills. There are barriers that I personally experience. And I''m not saying this is like that for everyone, but this is my personal experience. So, I apologize if I do offend anyone, but I''m just saying what''s on my experience. Um, so please forgive me if or you don''t have to, but I do apologize if I offend anybody here. Um, but yeah, that''s one of many things. So, one of the strengths of having a or of having the IQ score that I have is that I man I need to get back to that one because that''s honestly a challenging one to say like see that that''s a mental block right there. Like what I had was already a mental block because I want to finish something but I get stuck and yeah it''s Yeah, that''s like the perfect example of a mental block. [laughter] Yeah. Um, there are strengths and weaknesses and you know PE even with people with lower IQ scores can accomplish so many amazing things. Like with Forest Gump for example, he''s one of my favorite characters and he has accomplished so much in his life. It''s amazing to see like even though it''s a film, it''s one of the many examples out there that you can accomplish so many things despite that score. And it''s okay to be different, I guess. Well, I will say for strengths and weaknesses. So, one of my strengths of having that score was when I was here''s a good example. When I was in school, like high school, I could do some of the regular classes, and I''m talking about academic courses cuz I was integrated, but one of um and with support, I do thrive. So, I had some special ed courses and without the support, well, I could I think I could do it, but it would be a lot more challenging and overwhelming. So, I So, I guess those are my strengths in the sense that I am capable of doing many of these courses and I thrive with the support. But my weaknesses is it''s really hard for me to do certain things on my own. Like I said before, when I was in the college course and I did my generic English course, this is English 160. I had a hard time like well I was doing fine for a bit and then I was significantly late and handing in my homework because I''m slower like I''m a slower learner. So yeah, that''s where my weaknesses are. These are certain things that makes learning a lot harder and I feel like limitations because of those um what''s the word now? because of those struggles because of my developmental delay and my learning disability and the IKEA score. So although it now having said that like I said before it does measure one area of intelligence and I want to say most of that is based on academics but it doesn''t describe your emotional intelligence. So that''s your EQ, emotional quotient. IQ means intellectual quotient. But there''s other sorts of intelligence like there''s some people who have lower scores who are phenomenal with art, music or cooking or all those things. But academics is something that for me personally not saying for everyone but for me I struggle more of that and that''s just one of the main experiences and also another weakness about that IQ is because or having that IQ score is especially if you''re neurode divergent there are many things like I said before about adaptive functioning. There are a lot of things that I actually struggle with on a daily basis, but they won''t but I won''t or I I''m unable to receive the support because of the level I''m in or the the support that I need because they claim that it''s too high. So, that''s where I''m at. They may support you especially in like grade school which is from elementary, middle, and high school. In college, well, it''s kind of a gray area because they might give you some support like writing support. Maybe they might give you computer support or whatever, math support, but at the same time, they may like you don''t get educational assistance in college. Um, well, unless you''re like maybe the special ed ones, there''s like some type of supervisor, but they don''t call them educational assistants, but they''re quite similar. It''s more like worker or something. But yeah, I''m talking about generic courses here. And you might be an amazing cook, but when you''re doing professional cook one, there''s also academics that are associated with it. And I''m not saying people can''t do them because they can. like if you''re really passionate about it, you just have to have the grit to learn it and the perseverance to um to um accomplish that. And I''m not saying I can''t go to college, but it''ll just be harder and I have to work harder. And same with many people that are also around my score. A lot of people have to work harder to accomplish what they want, especially when Anyways folks, I think that is it for now, but I want to thank you all for watching. And once again, I do apologize if this video does offend you um any of you, but this is just stuff that happened in my life and my experience. Anyways, um have a good day and peace.'
