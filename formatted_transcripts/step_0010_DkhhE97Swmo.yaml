transcript: There is a rat in your brain that craves only dopamine and thinks that 10 minutes is a long time. That rat may not like this video. This is because it is slightly more educational than usual. I would even recommend [music] taking notes. I tried to make it fun, but I'm not Mr. Beast and I don't really want to be. So, this is a video about boredom and difficulty and learning to code. [music] And if there's anything I really wanted to teach you, it's that it is possible and advisable to ignore that rat >> [music] >> as best you can. Last video, I talked about an experiment where novices were observed [music] as they completed a beginner programming task. Put simply, some of them were bad and some of them were good. The difference was mostly in how much they actually thought about it before trying to solve it. >> [music] >> Shocking. The thing is, if you look at what the students turned in, it's all pretty decent. Every single student found a solution within the 30 minutes given [music] to them thanks to their AI tutor. The thing about the study that made me a bit worried [music] is that the ones who had offloaded all problem-solving to AI were completely unaware of their [music] own incompetency. They thought that they had solved it mostly on their own. You've probably heard the term vibe coding to describe [music] this practice of using AI without fully understanding the code it produces. It's pretty great for doing and pretty terrible for learning. [music] The following video is about how to actually use and develop the most important tool in programming. Your brain. What do you do when you get stuck on a programming problem? Before AI tools, your options were look it up on Stack Overflow, [music] ask a friend if you have any. >> Hello darkness, my old friend. >> Or pause to think about it. Since the introduction of AI to answer every possible [music] question that we have, it's increasingly the thing that we turn to when we get stuck. Typing [music] out a prompt and reading something feels more productive than an empty pause. But, is it? In the experiment, [music] we see that subject seven read the question and started coding, but was distracted [music] and overwhelmed by an autocomplete suggestion. They abandoned their code, opened ChatGPT, and asked it what [music] to do. See what happened there? They interpreted this moment of confusion as a sign that they wouldn't be able to solve the problem on their own. So, within 10 seconds [music] of starting, they're already having the AI think for them. And again, if you're a professional developer and you're a little eepy, then sure, vibe code away. But if you're [music] a student in school, your whole purpose is to learn and develop your thinking. Give yourself that minute to think [music] and try to do it on your own. Otherwise, my friends, smooth brain is coming for us all. Pauses in learning aren't necessary, [music] even if they feel unproductive. Struggling, getting stuck, getting frustrated, these aren't signs that you're not going to be able to solve the problem. They are what solving a problem feels like most of the time. Speaking of what things feel like, [music] let's talk about psychology. Researchers use a lot of words that most people don't need [music] to know, but if there's one which I think should become common usage, it's the concept of metacognitive awareness. Granted, the reason that it hasn't is probably because [music] metacognitive awareness is not a very sexy term, but the idea is pretty simple. It's about your ability to [music] recognize common traps in your thinking and effectively problem-solve your way out of them. In the example I just mentioned, the subject had just begun problem-solving when they were distracted [music] by an AI autocomplete suggestion. This is named the interruption trap by the researchers in the paper, and it's a metacognitive difficulty that is specifically introduced by AI use. Real talk, when I first read this paper, I was kind of mad. [music] This list is a such a succinct description of everything you struggle with when you're first wrapping your head around learning to program. [music] If I'd known these from the beginning, I think I probably would have felt a lot less confused and frustrated [music] with myself. And I wouldn't be the only one. Research has shown that teaching beginners about common metacognitive difficulties, like the interruption trap, produces immediate and lasting changes to learners' [music] productivity, independence, and confidence. Given that, it might be good to take some time [music] to learn them. This is where I recommend you start taking notes. >> [laughter] >> The first five are forming, dislodging, [music] assumption, location, and achievement. Forming. Right question, wrong answer. You understand the problem, but you're using the wrong approach to solve it. In the experiment, [music] students were asked to write a program that reported whether a user input a sequence of majority positive or majority negative numbers. Participant one seemed to understand the problem in their verbal statements, but started writing code to sum the numbers, which was a flawed approach. [music] Right question, wrong answer. Dislodging, or stuck in a rut. Even when you realize your approach isn't working, you struggle to change it. After participant four coded a complete solution to determine whether numbers were even or odd, they tested and edited it repeatedly, still confused why it wasn't working. They failed to make the jump from knowing whether a number was even or odd to counting even and odd numbers in a [music] list. Assumption. Wrong question, right answer. You perfectly solve a problem, just not the one that you were supposed to. [music] Participant 21 confidently declared variables num1, num2, num3, and num4, and separate code blocks to handle exactly four numbers. The solution worked unless you wanted more than four numbers. Location. So close, but so far. >> [music] >> You skip important problem-solving steps in the beginning and think you're almost done, only to realize that you skipped something crucial, like a loop or a data structure. [music] Here, participant nine wrote a complete set of input and output statements >> [music] >> without including a loop. It took until testing for them to realize their omission, where they had to majorly rethink their program structure. >> [music] >> Achievement, a band-aid on a broken bone. You've written a lot of code and keep making small [music] fixes in hopes that it'll start working, but actually it needs a total overhaul. This sounds similar to location, but this doubling down on a bad strategy comes later in the problem-solving process. Participant one just kind of threw everything they knew as a problem without thinking through the logic. They had nested [music] for loops and conditionals and nested conditionals, and their code needed major structural changes. Even after the AI suggested an alternative way to solve the problem, they skimmed over that suggestion and [music] kept tinkering instead of recognizing that starting over was probably the best next step. >> Wow, turns out that when we start learning something new, we're usually bad at it. Shocking. >> [music] >> It's easy to see where these participants went wrong from an outside perspective, but much harder to notice them when you're in the middle of the problem. Remember, [music] the goal isn't to never encounter these difficulties, it's to become aware of them in yourself as quickly as possible. In an age [music] before LLMs, this video would be over. Those would have been the five metacognitive difficulties associated with learning to code. Unfortunately, researchers found that rather than helping with these challenges, AI tools actually introduced three new metacognitive difficulties [music] for beginners, namely progression, falling behind without noticing. You think you're keeping up with the course, but because AI assistants can generate working code that surpasses your current understanding, you're falling behind and you don't realize it. This happened to participant eight, who struggled to set up a simple while loop correctly [music] and needed the AI to tell them to initialize their variables, despite these being [music] concepts that they should have learned earlier in the course. In reality, this student was probably several weeks behind in the core material without realizing it. >> [music] >> In the post-test interview, they said that the LLM was helpful in validating their own ideas. In practice though, they didn't have any. They used the LLM to generate a possible solution, skipping the thinking part. Interruption, [music] distracting pop-ups. Every time you try to focus, an AI code completion tool throws a suggestion at [music] you, breaking your train of thought. This one's pretty obvious, but it can be a major problem for beginners. >> [music] >> Learners have to spend a lot of brain power to pause and think through a solution, and getting interrupted can really derail that mental process. [music] Not to mention the strain of reading unfamiliar code. It's worth noting that in the experiment, [music] non-struggling students mostly ignored the AI auto-complete suggestions. [music] If you've made it this far, congrats for taking the step to learn programming the right way. The final metacognitive difficulty introduced specifically by AI tools is mislead. Following bad advice. >> [music] >> You trust a suggestion from an AI, a tutorial, or even your own guess, that seems right, but actually takes you in the wrong direction. In the study, participant 11 accepted a suggestion from the [music] AI assistant, which pushed them in the direction of summing positive and negative numbers, rather than counting them. Thankfully, they were able to backtrack [music] and fix the mistake, but it cost them a lot of extra time and energy. At the moment, most AI coding tools are not built with these challenges in mind. Even if they were, you are the sole expert of your own mind, and there's only so much an external resource can do to see and protect you from the traps in your patterns of thought. By taking a bit of time to learn about these thinking traps, [music] you're already scientifically better off. But try not to let these lessons slip away. [music] Find your own way to remind yourself of them while you're coding. Write them on a post-it note. Point them out to someone else when you're pair coding, respectfully. And try to reflect on which ones you might be the most susceptible to. Most of all, I encourage you to remember to enjoy the process of learning [music] to program, even if it can be a bit annoying sometimes. I'll also remind you that we have free licenses for education and free programming courses you can complete right in your IDE at academy.jetbrains.com. Please subscribe if you enjoy these videos. They take a lot of work and I'd love [music] to be able to continue making them. That's all for this one and enjoy your learning.
