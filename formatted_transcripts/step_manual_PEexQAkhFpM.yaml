transcript: '{"content":"\n[2.724s] Съпротива срещу емоционално изнудване.\n[14.384s] Всеки от нас има право да остане в зоните си на комфорт.\n[17.865s] Но, нямаме право да очакваме останалата част от света да се присъедини към нас.\n[23.14s] Комфорт. Какво причинява тази дума в ума ви?\n[27.68s] На пръв поглед тази концепция може да бъде просто бяла и пухкава.\n[31.46s] Приятно усещане за релаксация.\n[34.08s] Състояние на лекота.\n[35.86s] Спокойствие на ума.\n[37.36s] Звучи доста приятно — но не точно от съществено значение за живота.\n[41.84s] Ако се разровим, ще открием по-мощни значения на думата.\n[46.5s] Свобода от болка или ограничения.\n[49.248s] Облекчаването или смекчаването на скръбта или страданието.\n[53.66s] Именно в тези определения се проявява истинската стойност на комфорта\n[58.48s] жизненоважната способност да се освободиш, дори и за миг, от мизерията.\n[64.08s] Дори и с хора, които бихме могли да презираме\n[66.24s] виждането на уязвим човек в страдание може да активира\n[69.36s] най-силните ни инстинкти за състрадание.\n[72.68s] Чувстваме се обезоръжени.\n[74.96s] Тези инстинкти представляват някои от човечните ни качества\n[78.83s] които понякога разтапят предишните различия, прекратяват враждебността,\n[83.65s] позволяват ни да се свързваме помежду си със силно оздравителни начини.\n[87.88s] Но същите тези инстинкти на състрадание също могат да имат вредни последици.\n[93.7s] В опитите си да утешим някои хора, понякога предаваме други хора.\n[99.36s] Например, когато казваме на нашия син атеист, че трябва да продължи да ходи на църква, за да може майка му да остане щастлива. [Аз съм атеист]  [Продължавай да ходиш на църква. Направи майка си щастлива]\n[106.42s] Когато дъщеря ни разкрива еднополовото си влечение, и ние й заповядваме никога да не казва на баща си, за да пощади чувствата му. [Аз харесвам жени]  [Не казвай на баща ти, това ще го убие!]\n[114.4s] Когато жертви решат да не контактуват със своите насилници, и ги призоваваме да не го правят, защото е толкова жестоко. [Прекъсвам контакта с него]    [Не прави така! Това е толкова жестоко!]\n[121.72s] За съжаление, много хора се подчиняват на тези жалби.\n[125.32s] За други, които отказват да пренебрегнат себе си, има много гласове, готови да ги затрупат с емоционално изнудване.\n[133.54s] За хора, които са били обучени да се грижат за благосъстоянието на всички останали\n[137.23s] понякога до пълното изключване на тяхното собствено\n[139.92s] подобно емоционално изнудване може да се почувства изключително тежко и невъзможно за справяне\n[145.6s] карайки жертвите да се чувстват виновни и безсърдечни, ако не се съобразят.\n[150.94s] Но нито един от тези уж състрадателни жалби не издържа на критика.\n[155.48s] И когато спрем за минута и ги разгледаме обстойно, тяхната манипулативна сила се изпарява.\n[162.14s] Независимо дали сме жертва, виновник или свидетел на емоционално изнудване,\n[168.129s] всички ние имаме способността да разсъждаваме върху избора си\n[171.46s] и да се дистанцираме от тази злоупотреба.\n[174.865s] Да се противопоставим на емоционалното изнудване означава да бъдем по-разумни в нашите реакции към страданието.\n[180.799s] И да се научим, че на някои жалби за личен комфорт, не трябва да се угажда.\n[186.1s] Контринтуитивно, това не означава да станете по-малко състрадателни, а по-състрадателни.\n[191.435s] И това означава да осъзнаете двойната природа на емоциите, които могат да бъдат ценен съюзник и ужасен враг.\n[201.023s] Емоцията — нож с две остриета.\n[207.86s] Емоциите играят важна роля в навигацията на живота.\n[211.64s] Част от тази роля, е осигуряването на ключови преки пътища\n[215.12s] в простите ежедневни дилеми, с които се сблъскваме.\n[218.34s] Хората, които са загубили емоционална реакция, могат да бъдат парализирани\n[222.609s] от кошмара за обработка на информация,\n[225.31s] генерирайки безкрайни рационални аргументи за различни варианти на действие.\n[230.54s] Едно просто избиране на риза, която да облекат, може да ги претовари.\n[234.6s] Емоцията прекратява това премисляне/руминация, и избираме това което се чувства правилно.\n[239.98s] Социалният психолог Робърт Зайонц\n[242.44s] оспори популярните предположения на своето време\n[244.769s] че емоциите се появяват само след рационална обработка на информацията.\n[250.3s] Той посочи изследвания върху предпочитанията, възгледите,\n[253.68s] формирането на впечатления и вземането на решения,\n[256.589s] които показват, че емоционалните преценки често се правят независимо от рационалното обмисляне,\n[262.8s] извършват с�� по-бързо от рационалното обмисляне и се извършват с по-голяма увереност.\n[268.76s] Други изследователи подкрепят тези наблюдения\n[271.82s] включително неврологът Антонио Дамазио\n[274.93s] които откриха, че нашите емоционални оценки\n[277.4s] на ситуациите и техните резултати\n[279.57s] играят централна роля при вземането на решения.\n[283.14s] За съжаление, същата опростена природа на емоционалната обработка,\n[287.6s] която ни позволява да не се мъчим за прости избори, често ни прави уязвими към манипулация чрез емоционални жалби,\n[295.06s] които ни подтикват да правим необмислени преценки по въпроси, които изискват по-сериозно проучване.\n[302.3s] В крайна сметка можем да купим неща, които не искаме; [Ох, защо купувам глупости]\n[305.16s] извършване на необосновани услуги за хората; [Закарай ме то летището, иначе ще си изпусна самолета! ]\n[307.98s] осъждане на невинни; [Виновен!]\n[310.28s] Да станем жертва на идеологически групи по време на нашата скръб; [Бог може да намали болката ти....]\n[316.22s] давайки \"последния шанс\" на насилниците — отново. [Дай ми един последен шанс!]\n[321.38s] Опростената емоционална обработка също ни води до затрупване с бреме другите хора.\n[328.26s] Когато казваме на сина си атеист да продължи да ходи на църква заради майка си.\n[333.14s] или заповядваме на дъщеря ни да се скрие еднополовото й привличане от баща ѝ\n[337.2s] или молим жертвите да не прекъсват контактите си с техните насилници,\n[341.03s] или се опитваме да заглушим случаите на религиозно насилие,\n[344.59s] можем искрено да вярваме, че правим нещо добро, и че дори служим за доброто на човечеството.\n[351.86s] Но това е просто избирателно състрадание,\n[354.74s] — фокусирано върху възможните страдания на едната страна и абсолютно пренебрегващо осмислянето на преживяванията на другата страна.\n[362.82s] Нека разширим погледа и да видим какво наистина искаме.\n[367.22s] Тук са представени хора, на които често се е налагало да се справят\n[370.5s] с дългосрочни манипулации, злоупотреби и догми,\n[373.96s] борейки се с изтощаващи нива на срам, безпокойство и невротичност.\n[379.22s] Мнозина се чувстват самозванци, неспособни напълно да получат любов от хората около тях,\n[385.05s] откъснати от живота си, като се преструват, че са това, което другите очакват от тях, само за да оцелеят.\n[392.04s] И сега, когато те започнаха да се движат към свобода, почтеност, истина и възстановяване на психологическото здраве,\n[400.49s] ние ги насърчаваме да продължат да жертват всичко това, само за да могат други хора да запазят някои утешителни илюзии.\n[408.8s] Колкото и жестоко да изглежда това обикновено осъждане на хора на такова потискане през целия живот, то не винаги е движено от съзнателна злонамереност.\n[417.68s] Често това е чист мързел.\n[420.32s] Това е спазването на \"закона\" за най-малко работа\n[423.165s] — при наличието на избор, ние избираме пътя на действие, който изисква най-малко усилия.\n[428.64s] И не само физически усилия.\n[430.74s] В проучване от 2010 г. на Kool и колеги\n[433.84s] участниците показаха значително пристрастие към начини на действие, които изискват по-малко мислене.\n[440.4s] Много подобни проучвания показват, че когато е възможно, хората често се опитват да избегнат трудоемката умствена активност.\n[448.964s] Избирателното състрадание е много опростена емоционална реакция на потенциален конфликт.\n[455.37s] То заобикаля сложността да трябва да мислим, обсъждаме, договаряме и решаваме и вместо това просто се преструваме, че всичко е наред.\n[465.8s] В действителност избирателното състрадание често работи срещу двете страни.\n[470.76s] За да видите защо, нека да разгледаме зоните за комфорт.\n[475.087s] Можем да визуализираме нашата зона на комфорт като кръг, съдържащ цялата дейност, чувства и идеи, с които ни е най-комфортно.\n[484.08s] Извън това, имаме кръг, който може да се нарече \"израстване\".\n[487.96s] Това е по-малко комфортна област, в която попадаме, когато се напрягаме от нова дейност, чувства и идеи.\n[495.0s] Научавайки нови умения, работейки по сложни, но постижими нови проблеми.\n[500.64s] Когато заменим малко от комфорта за \"израстване\" тогава нашата централна зона за комфорт се разширява.\n[506.9s] Извън това имаме друг кръг, който може да се нарече \"претоварване\".\n[512.159s] Тук нивото на предизвикателство започва да става непостижимо.\n[516.86s] Изтощаваме се и започваме да натрупваме щети.\n[521.88s] За да се развием и да разширим зоната си на комфорт, трябва да прекараме значително време в зоната на израстване.\n[529.44s] Също така трябва да ограничим времето, прекарано в претоварване.\n[534.14s] По време на скръб и страдание можем да преживеем дълги периоди на претоварване.\n[540.32s] И е важно да се презаредите в здравословни източници на комфорт.\n[545.54s] Когато се опитваме да направим сексуалността на дъщеря ни срамна тайна, скрита от баща й,\n[550.73s] ние я принуждаваме да прекарва значително време в претоварване,\n[554.86s] непрекъснато увеличавайки срама, безпокойството и страха, от които иска да се възстанови.\n[562.0s] Но също така не позволяваме на баща й да премине от комфорт към израстване.\n[567.36s] Милиони родители, които първоначално са враждебни, когато разберат, че потомството им не се подчинява\n[572.19s] на някакви надежди и очаквания, в крайна сметка се примиряват и страните се сближават, както никога досега.\n[579.71s] Близост, основана на истината, не илюзия за близост, основана на преструвки.\n[586.16s] Ако тези родители са държани в неведение, те никога няма да могат да го изпитат.\n[592.04s] Инстинктивното емоционално мислене е чудесно за бързи решения, но не и за дългосрочни решения.\n[599.04s] Опитите да се прилагат опростени емоционални кратки пътища към трудни ситуации могат да ни оставят заключени в болка и невежество.\n[608.22s] Понякога цяла група се разпада в процеса.\n[613.183s] Смазване на скърцащо колело.\n[619.78s] Всеки път, когато Мейв или Рени отпаднат от \"сценария\" на личните планове и предпочитания на майка си, Норма, тя побеснява.\n[629.06s] Техните прегрешения могат да варират от неявяване на някакво семейно събитие\n[633.52s] до признание, че не планират да имат деца;\n[636.6s] до късо подстригване на косите си.\n[639.16s] В добри дни Норма може да изпадне в проявление на отчаяние.\n[644.88s] В лоши дни тя прераства в неспираща ожесточена истерия.\n[650.64s] Всеки път съзависимият съпруг на Норма, Колин се опитва да я утеши.\n[655.96s] За Колин, който прекарва по-голямата част от домашния си живот, тихо сливайки се в обстановката\n[661.089s] тези инциденти са почти единственото време, когато той влиза в действие.\n[665.93s] Често, след като Норма в крайна сметка се успокоява\n[669.39s] Колин се кара на дъщерите си, че са я разстроили.\n[672.38s] Понякога той им казва: \"Ти унищожаваш майка си!\"\n[676.84s] Ако Колин беше излязъл от опростения режим на емоционален рефлекс\n[680.58s] и в усилено осъзнато мислене\n[683.58s] нещата можеха да се окажат съвсем различни.\n[686.44s] Осъзнавайки пред какви дългосрочни щети са изправени дъщерите му без неговата намеса,\n[691.13s] той би могъл да разработи стратегии, за да ги защити от малтретирането на Норма,\n[696.37s] намирайки начини да ги подкрепя, когато се застъпват за себе си.\n[700.386s] Той би могъл да изгради силна връзка с тях и да създаде солидарност, която да издигне цялото семейство.\n[708.5s] Независимо дали бракът му ще оцелее или не, все още ще има Мейв и Рени в живота му.\n[714.76s] Вместо това, разчитайки на постоянни емоционални бързи решения, той се фокусира единствено върху утешаването на Норма.\n[722.96s] Той отказва да защити дъщерите си и потиска опитите им за самозащита, които изглеждат за него просто като прояви на враждебност към Норма.\n[730.8s] Опита се да ги обучи да бъдат невидими като него\n[733.34s] с фалшива надежда за по-лесен живот.\n[736.14s] Всъщност нещата стават много по-лоши.\n[739.28s] Без да дава никаква съпротива, Колин засилва убеждението на Норма, че може да каквото си иска, без последствия.\n[748.08s] В крайна сметка Мейв и Рени прекъсват всички контакти с родителите си,\n[753.06s] оставяйки Колин да утеши чудовището, което той помогна да се създаде.\n[758.38s] Колин няма да разбере причината за заминаването им и ще ги обвини, че са разрушили семейството.\n[765.14s] Норма е скърцащо колело. Терминът идва от старата поговорка \"скърцащо колело получава масло\"\n[772.22s] или в САЩ \"смазка/грес\".\n[775.2s] Посланието е, че хората, които вдигат най-много шум\n[778.06s] често в крайна сметка получават това, което искат.\n[780.66s] Скърцащото колело може да е родител;\n[782.92s] дете, на което се угажда от родители и братя и сестри;\n[786.82s] служител на работното място;\n[789.24s] или идеологическа група.\n[791.523s] В опитите си да утеши Норма, Колин несъмнено се опитваше да облекчи страданието.\n[797.62s] Ключовият въпрос е: \"чие страдание?\"\n[800.9s] На пръв поглед изглежда, че става въпрос за Норма.\n[804.652s] Но всъщност става дума за Колин, който е коренът на целия този проблем.\n[811.22s] Факт е, че Колин изпитва дискомфорт от трудни чувства.\n[815.58s] Никога не се е научил да се справя с тях\n[818.08s] — да ги толерира, да ги усвоява, да обмисля за какво всъщност са трудните чувства.\n[823.06s] Поради това неговият емоционален рефлекс е да ги изключи.\n[829.17s] Този случай от реалния живот илюстрира разликата между състрадание и съучастие.\n[835.76s] Състраданието поддържа и подхранва здравословното израстване.\n[839.66s] То взема предвид по-широкия контекст на ситуацията\n[843.06s] и признава, че утешителните интервенции\n[846.43s] понякога имат негативни последици\n[849.22s] като възпрепятстване на израстването и намаляване на мотивацията за промяна.\n[854.14s] Когато осъзнаваме кога да се намесим и кога не, състраданието улеснява израстването.\n[861.56s] За разлика от това, съучастничеството оправдава и извинява лошото поведение.\n[867.9s] То се фокусира върху повърхностния дискомфорт на момента\n[871.4s] и игнорира вредните потенциални странични ефекти.\n[874.88s] В резултат на това съучастничеството допринася за разпадането.\n[879.6s] Помагайки на Норма, Колин увеличава зависимостта, деградацията и крехкостта си.\n[887.06s] Използването на емоционално изнудване също отличава състраданието от неговия корумпиран имитатор.\n[893.26s] Когато жертвите на злоупотреба не контактуват със зловредни насилници\n[897.39s] някои съучастници се опитват да ги засрамят\n[899.68s] твърдейки, че е все едно да прекъснеш контакт с някой болен от рак; да накажеш някого за това, че не се чувства добре.\n[906.22s] Тази аналогия е класическо емоционално изнудване.\n[909.65s] Напълно пренебрегва благосъстоянието на жертвите\n[913.48s] и изостря насилието над тях, като ги рисува като безсърдечни карикатури.\n[918.74s] Нека приведем аналогията в съответствие с реалността за насилствената ситуация.\n[924.68s] Представете си, че контактът с пациента причинява тежка алергична реакция на посетителя.\n[930.76s] Само дума или дори поглед\n[933.1s] може да доведе имунната система на посетителя до претоварване\n[936.62s] причинявайки редица различни симптоми.\n[939.76s] Това прави злоупотребата.\n[942.12s] В резултат на безкрайните атаки, на които са били подложени жертвите,\n[945.96s] тяхната психологическа имунна система\n[948.34s] става свръхчувствителна към насилника.\n[951.41s] Те са научили всички най-малки фрази и жестове, които означават предстоящата буря.\n[957.46s] В отговор на тези стимули защитните механизми на жертвите експлодират в свръхреакция.\n[963.62s] Освобождаване от тези дълбоко вкоренени реакции\n[966.88s] може да бъде труден и продължителен процес.\n[970.04s] Продължаващия контакт с насилници\n[972.14s] който непрекъснато активира тези реакции,\n[974.84s] може да саботира и разруши възстановяването на жертвите.\n[979.94s] Прекъсването на контакта не само отваря пътя към здравето за жертвите, но и за насилниците.\n[986.04s] За някои насилници, преживяването на истинско отхвърляне, което е резултат от тяхното безразсъдно поведение, ги мотивира да потърсят помощ.\n[994.32s] Като биват защитавани от отхвърляне тази мотивация изчезва.\n[998.926s] Състраданието позволява на двете страни да изберат здравето.\n[1002.88s] Ако насилниците се откажат от него, тогава жертвите им остават свободни да изберат здравето за себе си.\n[1008.82s] За разлика от това, подпомагането на лошо поведение блокира този избор и за двете страни.\n[1015.06s] Ако не искаме да превърнем себе си — или някой друг —\n[1018.76s] в човешки столове за угаждане на другите\n[1022.269s] трябва да включим мозъка си.\n[1024.859s] Трябва да се отдалечим от емоционалното бързо мислене\n[1028.099s] към замислено, трудоемко мислене.\n[1031.8s] Трябва да се чувстваме комфортно с някои трудни чувства.\n[1035.319s] По-специално, ние трябва да признаем, че трудните чувства\n[1038.94s] често могат да бъдат здравословна и жизненоважна част от израстването,\n[1042.76s] и това, че като се опитваме да ги изключим, може да саботираме това израстване.\n[1047.339s] Понякога този саботаж може да продължи поколения наред.\n[1052.612s] Справяне със механизмите за справяне на другите хора.\n[1059.4s] Животът — е усилие за всички видове на планетата.\n[1063.17s] Ние се намираме в ситуации на оцеляване, в които сме изправени пред опасност, несигурност и липса на контрол.\n[1071.42s] Хората използват огромна гама от механизми за справяне\n[1074.28s] за да преодолеят тези трудности.\n[1076.42s] Използваме вещества и дейности, променящи настроението, като разсейване\n[1081.44s] — храна, алкохол, наркотици, секс.\n[1085.82s] Потапяйки се във въображаемите светове на литературата, киното и телевизията.\n[1091.14s] Всичко това е нормално при малки дози.\n[1093.26s] Но не е нормално, когато това се превръща в зависимост или в начин за избягване на предстоящите кризи.\n[1098.92s] Друг механизъм за справяне е магическото мислене:\n[1102.0s] допускането на причинно-следствени връзки между събития, процеси и субекти, които нямат демонстрирана връзка.\n[1109.639s] Линдеман и Арнио описаха магическо мислене\n[1113.18s] като „онтологични обърквания“\n[1115.4s] между отделните процеси на физиката, биологията и психологията.\n[1120.68s] Може да вярваме, че неодушевените обе��ти имат намерения\n[1124.02s] или че нашите мисли имат силата да създадат катастрофа.\n[1127.727s] Изследванията потвърждават това, което бихме могли да очакваме.\n[1130.72s] Магическото мислене достига връх, когато преживяваме\n[1133.7s] опасност, несигурност и липса на контрол.\n[1136.44s] Когато антропологът Бронислав Малиновски\n[1139.26s] изучава жителите на островите Тробрианд\n[1141.8s] край източното крайбрежие на Нова Гвинея\n[1143.6s] той откри интересна разлика в техните риболовни практики.\n[1147.304s] Когато ловят риба в лагуната, те могат да използват прост, надежден метод на отравяне, който дава постоянно голям улов.\n[1155.4s] За разлика от това, риболовът в открито море беше опасен\n[1159.2s] и имаше огромни разлики в размера на техния улов.\n[1162.82s] Малиновски отбеляза, че с лагунен риболов\n[1165.4s] където рибарите биха могли да разчитат на знания и умения\n[1168.24s] не е имало прибягване до магия.\n[1170.33s] Но с риболов на открито\n[1172.35s] където имало опасност и несигурност\n[1174.46s] магическите ритуали били широко практикувани\n[1177.24s] за да се опитат да осигурят безопасност и резултати.\n[1180.82s] Когато почувстваме липса на личен контрол,\n[1183.64s] понякога компенсираме това, като се обръщаме към външни системи,\n[1186.67s] които изглежда символизират по-голям контрол.\n[1189.5s] В проучване от 2008 г. Кей и колеги поискаха участниците\n[1194.34s] да оценят вероятността за съществуването на някакъв Бог или нечовешко същество, което контролира събитията във Вселената.\n[1201.6s] Преди този въпрос\n[1203.17s] някои участници били помолени да си спомнят онези моменти в живота си, когато не чувствали абсолютно никакъв личен контрол.\n[1210.48s] Други участници били помолени да си припомнят събития, в които се чувствали с личен контрол.\n[1215.38s] Членове от групата без личен контрол\n[1218.09s] били много по-склонни да подкрепят съществуването на контролиращо същество.\n[1222.58s] Това се дължи на обширна област на изследване, показващо как променяме нашите магически идеи, за да отговорим на психологическите нужди в момента.\n[1231.24s] По време на огромно претоварване\n[1233.84s] магическото мислене служи на някои хора като утешително убежище.\n[1238.1s] В много случаи променящият настроението ефект\n[1240.9s] на фокусирането върху магическата идея\n[1243.13s] може да помогне на някои хора да продължат да функционират\n[1245.88s] в най-напрегнатите моменти на криза,\n[1248.92s] преди да слязат отново на земята\n[1251.2s] и да съберат сила за справяне с реалността с управляемо темпо.\n[1255.78s] Проблемът възниква, когато използването на магическо мислене отваря пътя за увреждане — на другите или на нас самите.\n[1264.2s] Подобно на алкохола и наркотиците (лекарствата), всичко зависи от вида, който използвате, и количеството, което приемате.\n[1271.28s] Носенето на това, което смятате за \"късметлийско бельо\" по време на изпита, може да ви помогне да вземете изпита.\n[1276.7s] Не защото бельото има магически свойства\n[1279.1s] а защото вашата вяра намалява вашата тревожност\n[1282.26s] повишава увереността ви и подобрява ефективността ви.\n[1286.18s] Но това вярване става вредно, ако разчитането на бельото ви кара да пренебрегвате ученето.\n[1292.36s] И проблемите се увеличават, когато започнете да се опитвате да ангажирате други хора.\n[1297.2s] Израснах с човек, който приписваше на безкраен списък от предмети магически значения.\n[1303.88s] Всички ние трябваше да изучаваме в детайли нейното безгранично магическо мислене и да го задоволяваме.\n[1310.96s] Ако не го направихме, започваха бомбардировките.\n[1314.08s] Един ден в ранните ми тийнейджърски години правех топли напитки в кухнята\n[1317.92s] Бях стреснат от смразяващ крещящ писък зад мен.\n[1321.77s] Беше забелязала няколко кръстосани ножа на кухненския плот\n[1325.39s] което магически означаваше спор.\n[1328.3s] По ирония на съдбата нейните избухвания на нерви\n[1331.22s] често провокираха същия резултат, който тя магически \"предвиждаше\".\n[1335.589s] Понякога нещата стават по-физически.\n[1338.4s] Преди много години, когато брат ми отвори чадъра си, за да изсъхне на закрито\n[1343.04s] един гост направи огромна сцена, опитвайки се да изтръгне чадъра от него и да го затвори\n[1347.76s] въз основа на магическото схващане, че отварянето на чадъра ще доведе до лош късмет.\n[1351.82s] Радвам се да съобщя, че този глупак бързо беше усмирен от брат ми.\n[1357.26s] Но тук започва проблемът:\n[1359.82s] когато комфортът на магически мислещия човек нахлува в комфорта на другите.\n[1364.84s] Тук стигаме до кръстопътя с пътища, които могат да доведат до враждебност или да я избегнат.\n[1372.6s] Много магически мислещи хора могат да я избегнат.\n[1375.68s] Някои избират да слушат валидните възражения на хората и да преосмислят идеите си.\n[1381.04s] Други избират да поддържат своите магически механизми за справяне\n[1384.58s] но ги държат ограничени за собствения си живот, без да ги налагат на другите.\n[1389.7s] И двата пътя предлагат възможност за мирно съвместно съществуване, в което комфорта на никого не засенчва чуждия.\n[1397.82s] Но те също така изискват известно усилие за размисъл.\n[1401.8s] И за съжаление, нашият мързелив мозък често ни тласка право напред към конфликт.\n[1408.74s] Както отбелязва Робърт Зайонц, емоционалните преценки често се правят с голяма увереност без рационална обработка.\n[1417.16s] Той също така отбеляза, че след като се вземат тези преценки, често ги защитаваме с рационализация.\n[1423.62s] Тя може да се почувства като рационална обработка, но целта е съвсем различна.\n[1428.38s] Рационалната обработка търси отговори. Рационализация търси обосновки/потвърждения.\n[1435.26s] Това е различен вид избирателно мислене.\n[1438.18s] Ние търсим правдоподобни аргументи\n[1441.02s] в полза на нашите емоционални преценки\n[1443.83s] и спираме, когато ги открием, блокирайки основателни/валидни аргументи против.\n[1449.0s] Когато се опитваме да принудим нашите магически механизми за справяне над другите\n[1452.38s] би било добре, ако отхвърлянето, което получаваме,\n[1454.66s] ни подтиква към някои размишления.\n[1457.62s] Вместо това често просто изграждаме стени от погрешни рационализации, за да оправдаем нашето налагане.\n[1465.04s] В опитите си да отблъснем критиците,\n[1467.38s] ние фалшиво им приписваме въображаеми злонамерени мотиви,\n[1471.26s] които ни позволяват да правим лични атаки срещу тях без угризения.\n[1475.22s] Можем дори да заявим, че техните възражения са знак, че те са под властта на магически същества, които ги лишават от независимост.\n[1482.462s] Убедени в истинността на нашия магически механизъм за справяне\n[1485.8s] ние рационализираме, че е добре да запушим устата на нашите критици\n[1489.143s] като превръщаме въпроса за нашето магическо мислене в социално табу.\n[1493.58s] Рационализираме злоупотребата с детската индоктринация\n[1496.559s] принуждавайки безсилни, нищо неподозиращи деца\n[1499.19s] да приемат нашите илюзии като неоспорима истина.\n[1503.64s] Тази злоупотреба се предава от поколение на поколение\n[1507.32s] Ние обосноваваме, че имаме основание да наказваме неверието\n[1510.68s] с набор от наказания до, включително държавно узаконеното убийство за неверие.\n[1515.14s] Така че деца, които никога не са имали избора да не се присъединят\n[1518.74s] никога няма да имат избора да напуснат.\n[1521.26s] Всяко поколение обвързва умовете на следващото\n[1524.72s] в неизбежното служене, на магическия механизъм за справяне, на отдавна починал предшественик.\n[1531.54s] Не се задоволяваме само със земните наказания, ние измисляме магически заплахи.\n[1536.12s] Измъчваме въображението си с нови наказания от немислим мащаб.\n[1541.916s] Светове на вечните изтезания, където телата се варят, изгарят и лишават от плът и след това се възстановяват,\n[1549.411s] само за да преживеят едно и също нещо отново и отново завинаги.\n[1554.44s] Ние рационализираме този психопатичен садизъм, като го наричаме справедливост.\n[1560.3s] Измисляйки тези светове, ние създаваме най-ужасните кошмари\n[1564.28s] които изискват огромни нива на комфорт.\n[1568.0s] Нека помислим за този нелеп капан, в който сами се вкарахме.\n[1573.365s] Сега трябва да се утешаваме за магическата опасност, която сме измислили, за да ни утешава от реалната опасност.\n[1581.24s] Дори ако истинската опасност изчезне, сега сме затънали в самопоглъщащ цикъл на опасност и утеха, които сами сме създали.\n[1590.22s] Дори повърхностно положителните елементи на магическия механизъм за справяне могат да предизвикат конфликт.\n[1596.16s] Обещанието за магически рай за задгробния живот \"само за членове\"\n[1599.96s] ни насърчава да наложим нашите вярвания на останалите,\n[1602.44s] особено на любимите хора\n[1604.24s] с вярата/убеждението, че ги спасяваме.\n[1606.88s] Когато нашите близки не се подчиняват, можем да ги обвиним за нашето страдание.\n[1611.5s] Ако се откажем от рационализациите си, можем да осъзнаем, че ние сме причината за страданието.\n[1618.08s] Това е еднопосочно движение —очакваме да бъдем чути, но отказваме да слушаме.\n[1624.4s] Очакваме нашите нужди да бъдат задоволени, без да мислим за нуждите на другите.\n[1629.76s] Тези еднопосочни системи са склонни да завършват по един и същи начин:\n[1633.52s] — в болка и невежество.\n[1636.4s] Нашата свобода да се адаптираме по свой начин към трудностите на живота завършва,\n[1640.671s] когато нашите механизми за адаптация станат допълнителна трудност, към която другите хора трябва да се адаптират.\n[1645.1s] На този етап\n[1646.06s] това вече не е просто източник на комфорт за индивида\n[1649.48s] а източник на потисничество за хората около него.\n[1653.06s] Тогава това е подходящ момент да се съпротивляваме.\n[1656.6s] Докато някоя група продължава да рационализира поведението\n[1659.669s] което възпрепятства и нарушава свободите и правата на другите,\n[1664.36s] конфликтът остава неизбежен.\n[1666.76s] И никакви мързеливи емоционални кратки пътища няма да се отърват магически от това.\n[1671.94s] Бивши вярващи, които се обявяват срещу религиозно насилие\n[1675.68s] често преминават през дълги периоди на изтощително претоварване,\n[1680.01s] за да се освободят най-накрая от индоктринирането си.\n[1683.5s] В насилствените религиозни групи разликата между комфорта и претоварването е слаба и изключително тънка.\n[1690.7s] Излезте извън рамките на предварително определената зона за комфорт и вие ставате враг.\n[1696.12s] Това може да е изтощителен процес на натискане през стената на рационализациите, зад която някои са родени,\n[1702.46s] и създаване на пространство между тези крайности, където израстването/растежът се чувства постижим.\n[1707.837s] И дори след това бившите вярващи от някои от най-екстремните групи\n[1712.92s] са изправени пред постоянно претоварване, когато споделят своите истории,\n[1716.52s] работейки, за да улеснят излизането на други, които все още са в капан вътре.[имаш право да напуснеш, ако искаш.]\n[1721.74s] За усилията си те са безмилостно преследвани, маргинализирани и цензурирани. В някои страни убивани.\n[1730.46s] Разликата между това автентично и рисковано състрадание\n[1734.92s] и неговата фалшива имитация, използвана в емоционалното изнудване, не може да бъде по-ясна.\n[1741.4s] Хората са намерили много начини да се адаптират към изпитанията на живота.\n[1745.36s] Последното, което си струва да се спомене, е, разбира се, рационално усилено мислене.\n[1750.6s] С тази стратегия можем директно да се справим с много трудности в живота, които преодоляваме с вещества, променящи настроението, и магическо мислене.\n[1760.24s] Можем да намалим несигурността чрез дисциплинирано разследване.\n[1764.9s] Можем да преодолеем сложните опасности, като методично анализираме тяхната природа и създаваме ефективни мерки за противодействие.\n[1773.08s] Внимателното размишление също може да ни помогне да се примирим с области, които не можем да контролираме\n[1778.32s] да преосмислим нашата фалшива надежда и да пренасочи вниманието си към по-продуктивни области.\n[1784.98s] Внимателното мислене ни помага да променим това, което можем да променим, и да приемем това, което не можем да променим.\n[1792.56s] Помислете какво би могло да се случи, ако го използвахме поне малко по-често.\n[1798.62s] Хората често разчитат на незабавни инстинктивни опростени емоционални преценки.\n[1804.44s] Това е добре, ако избирате риза.\n[1806.78s] Но не е нормално, ако се справяте със сложни ситуации със значителни последици.\n[1812.18s] Емоционалното изнудване ни насърчава да използваме умствени кратки пътища, които работят срещу нас.\n[1818.1s] Забележете, когато ви насърчават да гледате с емоционални очи само една част на нещата.\n[1824.29s] Направете навик това да разширявате прегледа си.\n[1827.52s] Не бързайте.\n[1829.44s] Отделете необходимото време за това.\n[1833.2s] Чувствайки се комфортно с трудни чувства\n[1835.8s] ни помага да се отдалечим от възможността за нездравословно поведение\n[1839.48s] и да преминем към състрадание, което насърчава здравето и растежа/израстването.\n[1843.94s] Ако някои хора изберат болест и застой\n[1846.96s] ние не сме длъжни да се присъединяваме към тях.\n[1849.8s] Състраданието означава да мислиш за другите, както и за себе си — а не вместо себе си.\n[1856.06s] Рационализациите могат да се чувстват като рационална обработка,\n[1859.24s] но тяхната едностранна цел е утвърждаване, а не разследване.\n[1865.26s] Някои емоционални изнудвачи са податливи на рационално размишление. [Съжалявам. Не разсъждавах правилно.]\n[1869.76s] Други, в хватката на мощни рационализации, могат да се окажат извън разумния обхват.\n[1876.22s] Всеки опит да се възстанови яснотата просто се замъглява.\n[1880.84s] Важно е да не се поддавате на безкраен непродуктивен обмен.\n[1886.28s] За щастие е необходима само една рационална страна, за да се сложи край на емоционалното изнудване.\n[1892.7s] Бих искал да завърша с някои хипотези.\n[1895.893s] Как бихте отговорили на следните ситуации?\n[1898.84s] Религиозният лидер оправдава индоктринацията на деца [Индоктринирането на деца е добро]\n[1902.545s] на основание, че неговата група има правото да гарантира оцеляването на техните вярвания/убеждения. [моята група заслужава оцеляването на нашите вя��вания]\n[1908.472s] Майка казва на потомството си\n[1911.12s] че трябва да бъдат снизходителни към баща си — той няма емоционален самоконтрол като тях. [Трябва да отстъпвате пред баща си. Той не е емоционално уравновесен като вас.]\n[1918.0s] Ако можете да идентифицирате проблемите тук, тогава вече сте способни да се справяте с емоционалното изнудване.\n[1926.197s] Този канал изследва проблемите около злоупотребите, манипулациите и догмите. Моите благодарности към всеки, който подкрепя тази работа."}'
