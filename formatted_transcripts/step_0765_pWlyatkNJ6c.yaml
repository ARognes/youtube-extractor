transcript: Will your game be eligible for Jeff's game of the year show? Uh maybe, but I don't I don't know that it's the type of game that gets game of the year in that kind of show. You know, even though I think it's game of the year, obviously, I just sort of feel like I did I just I don't aspire to that kind of thing. Let me put it that way. Because I'm indie and I do weird stuff. And so, when you're indie and you do weird stuff, it's just not the expectation that people think you're game of the year or whatever, right? I mean, you know, if people want to vote for us for game of the year or whatever, I don't know how that process works, but if they want to, that's great and I totally appreciate it. It's just you also just have to have realistic expectations as an indie developer. We are making a funky puzzle game that is not Call of Duty Black Ops 9, you know? And that's just part of the deal. It's part of the deal of what I do. I mean, 2026 is a rough year to try and win best indie game, right? There's a lot of very popular games that came out this year. It was If you like a lot of different kinds of indie games, it's been a much better year for that than many recent years, you know?
