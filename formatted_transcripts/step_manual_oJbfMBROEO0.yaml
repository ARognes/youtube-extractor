te code\n[91.2s] as a truly senior programmer is that it\n[93.52s] reduces the chance that somebody''s going\n[95.28s] to rewrite your code i think one of the\n[97.04s] most frustrating things as a developer\n[98.88s] is when you work really hard to\n[100.479s] implement a feature and at a very short\n[103.119s] period after that somebody comes along\n[105.28s] and they don''t like some aspect of it or\n[107.119s] they don''t understand it and they\n[108.64s] rewrite all of it so if you follow some\n[110.399s] of the things i''m going to share with\n[111.36s] you today i think it''s really going to\n[112.88s] increase the shelf life of your code and\n[114.96s] that''s actually going to be much more\n[116.479s] valuable to your company because i think\n[118.079s] one of the biggest wastes of time on\n[119.68s] many software projects is rewriting code\n[122.24s] that already works just to suit\n[124.079s] someone''s preferences when there''s not\n[125.84s] really a refactoring reason that''s\n[127.6s] actually adding value to the project so\n[130.16s] what are some habits you can put in\n[131.84s] place to write code like a truly senior\n[134.8s] programmer well i think the first habit\n[136.72s] you can put in place is completing your\n[139.04s] work before moving on there''s immense\n[141.52s] pressure on many projects especially if\n[143.44s] you''re doing scrum or something like\n[144.959s] that to say that you''re done with work\n[147.36s] and know that okay i''m 85 done but\n[150.16s] there''s a little bit of the code that''s\n[151.519s] left and i''ll just leave that to a\n[153.28s] future time i''ll come back and fix it\n[155.2s] but at least in my experience after many\n[157.599s] projects i''ve been on when i do that i''m\n[160.0s] basically building up technical debt for\n[162.16s] myself now nobody else may see it i may\n[164.4s] be the only person on the team that''s\n[166.08s] aware of it but it''s ultimately there\n[167.84s] and somebody else will becom