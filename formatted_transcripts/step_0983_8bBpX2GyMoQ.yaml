transcript: I just want you to notice that every person whom you're ever truly loved truly loved not for their money, not for how they look, not for what they can do for you or not for what they have done for themselves. That's not true love as you know. But everyone whom you truly loved, you loved them for things that cannot die. Notice that you loved them for their kindness, right? You love them for their honesty. You love them for their courage, for their fairness, for how they treat other people and how they treat themselves. So in other words, you love them not for who they were or what they believed in because what they believed in shaped every single thing they ever did. If they were fair people that that means they believed in justice and they were not justice. Justice did not die with them. They believed in it. They partook in it. Or they were very honest people. They always did the right thing and said the right thing, said truth. They didn't do that for themselves and they didn't invent that for themselves. It was not their creation. It was their belief and trust and devotion to truth that made them honest people. And again, everything that you loved about a truly lovable person was for things that they did not create, they did not invent, and that did not die with them. Notice that, right? And everyone whom you loved for false reasons. Well, those were false reasons anyway, right? So, that's not what we're talking about. We're talking about true love. Everything that you can love about something true, about someone truly lovable, you do not love them directly, but you love the things that they loved. Isn't that amazing? And when you love the things that they loved, they are still alive because they were kindness. They were honesty. They were justice. They were goodness, modesty, courage. And none of those things, none of those things even took a single scratch from the death of this person that you loved them for. And so honesty will never die. Justice will never die. Just because your honest just friend died does not mean those things died. And by loving not people but the things that they loved and which ruled and pervaded their entire lives. That's how we truly honor people. That's how we truly love people. And that's how truly we never lose anyone. We never lose anyone who was truly lovable and whom we truly loved. because of this fact in the universe. Because the very thing that made them lovable were things that were outside of themselves that they parttook in that you too can and do partake in. And so you're always connected forever. You were connected before you even knew them. And you are connected just as much now as when you were sitting in the same room next to each other. Not a single thing has changed. That same love, that same justice, fairness, beauty that they carried is still all around you. Not a lick of it has been lost. And so connect through the world, not through people. but through what they themselves connected themselves with to the world. And that way that way you can never lose anyone and they cannot lose you.
