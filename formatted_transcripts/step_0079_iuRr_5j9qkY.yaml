transcript: Hi friends. Over the past 5 years, my team and I have measured almost everything there is to measure. But my personal experiments have always had one major limitation. Me. [music] Everything we've done has come from a single male subject. Women experience dramatically different biological changes across every month, every life stage, and almost every system of the body. So this year, we're beginning our most ambitious experiment yet. Kate Tolo is about to become the most measured female in history.
