transcript: this is a 3D Shadow or at least something close to it you see in 4D golf surfaces that look flat like the ground are actually three-dimensional so besides walking left and right forward and back you can also move along a new dimension that's hard to visualize which is why I cast a 3D Shadow from the 4D scene into the 2D camera and that's what you're seeing here but I noticed that this Cube was a neat way to physically feel what it's like to use a camera in four dimensions and it was a nice coincidence that the little nub here looks just like the golf hole
