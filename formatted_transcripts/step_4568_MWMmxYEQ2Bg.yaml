transcript: This is a candle. For thousands of years, these have been used to make light [music] for people. But the unfortunate part is they're very inefficient at making light. Only around.1% of the chemical energy in the wax here actually gets [music] turned into light. The rest is just wasted as heat. But what if it didn't have to be that way? Today, I'm going to show you a way to use the fire from a simple candle to make a light brighter than a 100 candles [music] and even use the leftover energy to charge a cell phone. All by using a physics phenomenon discovered [music] over 200 years ago called the Cbeck effect. A few weeks ago, my water heater broke. Yeah, that's not supposed to happen. So, I had to replace the burner. When removing the control box, though, I found myself looking for the power cord to unplug it. But then I remembered there is no power cord or batteries for the control box. This controller tells the gas valve when to open and kick on the main burner. It clearly uses electricity to make this [music] light blink and has a simple logic board in there to tell the gas valve when to open and close and give out error messages and stuff. So then what's powering this? Well, if we look down in there, you can see a flame. That's called the pilot light. The pilot flame is always on being fed by a bit of gas through this tube here. And there's a thermal pile right near the flame. A thermal pile is basically a bunch of thermal couples connected together. So this probe not only tells the system that the flame is on, but it also provides power to this whole unit. So the power comes from the heat from the flame itself. Now let me explain why this works. I have a piece of bismouth here and a voltmeter. Right now the bismouth is at the same temperature everywhere. So when I touch the voltmeter to the chunk, I get essentially zero voltage. But something weird happens when I heat up one end of the chunk. Now I suddenly get a voltage. So I'm literally able to generate electrical energy simply by maintaining a temperature difference across the bismouth. [music] And this happens to some degree with basically any conducting material. I just chose bismouth here because it has a relatively large CBC coefficient compared to most common metals. This was discovered in 1821 by the physicist Thomas Cbeck. He noticed that when you have two different metals joined together at both ends and one side is hot and the other side is cold, there will be a measurable voltage in one of the wires. So in my experiment with the bismouth, what was my other metal? Well, it was the probes themselves. If I switch out the probe on the hot end for bismouth, then I don't measure any voltage. [music] And the reason is because now you can picture that I'm ultimately just measuring the voltage between two cold ends of bismouth [music] cuz that's where my probes are touching. So I have a thermmoelectric voltage change going from the cold to hot. But then I have the opposite voltage change going from hot back to cold around this loop. And so the net result is zero voltage measurement. [music] So, in order to measure the voltage change between the hot and cold ends, your probes need to be a different material, not part of the original material measuring the hot and cold ends. If not, then your hot and cold ends are no longer the hot and cold ends. [music] That's why thermal couples are made of two dissimilar metals with different CBC coefficients. This can be confusing when learning about this effect because sometimes it's taught as though the dissimilar [music] metals touching are what causes the voltage. But in reality, the thermmoelect electric response comes from the temperature gradient through the materials. And that's what's happening in my water heater to electrically power the controller. So this leads to the next question. Why would a temperature difference cause a voltage difference from one end to the other? But before we continue, I want to thank the sponsor for this video, outskill. AI tools are changing incredibly fast, and one that becomes especially useful is Claude. That's why Outskill is running a free 2-day live event called the Claude Mastery Sprint where they do a deep dive into Claude along with more than 10 other AI tools. It runs from 10:00 a.m. to 7:00 p.m. Eastern both days. And they made registration completely free for the first thousand people from my audience. They'll cover things like using Claude for deep research, creating artifacts and dashboards, building presentations, and setting up connectors and automations. They'll also get into clawed code and show you how you can build custom AI agents as well as use AI tools to generate images and videos. The sessions are taught by people with experience at companies like Microsoft, Google, Amazon, and Nvidia. And if you register and attend, they'll also include several bonus resources, including a Claude code collection, an AI prompt library, and a personalized AI toolkit builder. Altogether, they value the bonuses at over $5,100. So, if you've been interested in actually learning what you can do with Claude and other AI tools beyond [music] just basic prompting, you can grab a free seat through the link at the top of the description or the pinned comment. You can also scan the QR code on screen to join. And thanks to Outskll for sponsoring this video. Now, let's get back to our experiment. But why does this happen? Why does a temperature gradient in a piece of metal make a voltage? Well, remember that when you have a group of atoms at some temperature, the electrons in that lattice fill the available electron energy states statistically with almost all of the lower energy states being filled and some electrons occupying higher energy states. You can picture these electrons as moving from atom to atom essentially moving into available states of similar energies on neighboring atoms. So you can picture lower energy electrons moving through lower energy states and higher energy electrons moving through higher energy states. So when the material is all at the same temperature, this happens randomly in every direction. The electrons are constantly moving around and diffusing through the material. But overall, there's no bulk movement of electrons because everything balances out. But when you heat one end of the material, something interesting happens. You create more energetic electrons in that area that can fill the higher energy states. So now there's a higher concentration of these high energy electrons near the hot end than there is near the cold end. >> [music] >> This means those higher energy electrons tend to diffuse away from the hot area toward the regions where there are fewer of them. At the same time, heating those electrons leaves behind empty lower energy states which creates an opposing tendency for lower energy electrons to diffuse toward the hot region. So that means that if electrons at all these energies move throughout the material equally well, these two effects would cancel out. But the thing is they don't necessarily move equally well. Electrons at different energies move at different velocities and different scattering rates as they travel through the lattice. So they have different transport properties. Eventually the electric field becomes strong enough to exactly balance the thermal driven movement of charge leaving a voltage difference between the hot and cold ends. This is the seabbeck effect. Now for thermal couples and even this chunk of bismouth this effect is pretty small. So we're usually talking about millolts. But this is a material called bismouth teleride and it has a much larger cbeck effect. So instead of just millolts we can actually get multiple volts. These devices are called thermmoelect electric generators or teegs. They can take a temperature difference and turn it directly into electrical power with no moving parts. And vice versa. You can also apply a voltage to a thermmoelectric device and make one side cool down while the other side heats up. That's called the peltier effect. So, these have been used for a while and they're used in all sorts of applications, but I wanted to see if I could get one that actually works with the temperatures from a flame and produces enough voltage and power to charge a battery or phone or turn on an LED light bulb. [snorts] So, I found this small company online that sells these devices. They call it piggy power. [music] You can see that it's one of these thermmoelectric generators sandwiched between some metallic heat spreaders. So, this has no batteries in it whatsoever. So the goal of this device is to take a hot flame and heat one side of the device and then [music] keep the other side cool. The key to making this work is that the other side has to stay [music] cool so that we can maintain a large temperature difference across the thermmoelectric generator. [music] So how I'm going to do this is to pump water through the cold side. You can gravity feed the water through it and that works fine. Or even cooler, we can use this tiny little power pump. And once it's running, the pump itself can be powered by the flame. So, as long as your water source stays below about 46° C, we can maintain enough of a temperature difference to generate useful power from the flame. So, let's try this and see if it actually works. Okay, so I think we have it up to temperature now. Let's try to plug in some LED lights. Wo, it works. This is so crazy. I'm literally turning some of the heat from the candle into more light. So, I'm essentially making the candle like a 100 times brighter than it was before. This is just so cool to me. If I somehow traveled back in time, I'd definitely take this device with me. Imagine how much they'd want to burn me at the stake when they saw that I could make a candle 100 times brighter with this device. And not only that, I could keep my cell phone charged. Look at that. It can actually charge a phone. That's so cool that it can keep the current and voltage steady enough to charge a modern iPhone. All from the simple effect that I could show by heating a chunk of metal. I can think of so many scenarios where a device like this would be useful. So if you ever have something to burn and a way to maintain a temperature difference and you can generate electricity, this is so cool. So what are some ways that you can think of that you would use a device like this? Let me know in the comments section. And thanks for watching another episode of the Action Lab and we'll see you next time.
