transcript: '{"content":"\n[0.16s] In previous videos of mine, we explored\n[2.56s] two core ideas of early Buddhism. First,\n[6.799s] in the Kalama Suta, well, that gave us a\n[10.24s] toolkit for knowing, for teaching us to\n[13.44s] verify truth through through our own\n[16.08s] direct experience, not by authority nor\n[20.0s] reason alone. And I''ll leave links to\n[23.119s] videos about that below in the notes if\n[24.8s] you haven''t seen them.\n[26.88s] Second, we learned in a different video\n[28.88s] that in the early Buddhist sense, we are\n[32.079s] all to an extent fools. Fools until we\n[35.68s] become fully enlightened. And I''ll leave\n[38.079s] a link to that video as well if you\n[40.399s] haven''t seen it.\n[42.719s] In that video, we also learned that true\n[44.96s] wisdom begins with our understanding and\n[48.32s] admitting that we ourselves are\n[50.239s] basically fools.\n[52.559s] But when you combine these two powerful\n[54.719s] ideas, a subtle and dangerous trap\n[58.48s] emerges for the serious practitioner.\n[62.8s] If we use the Kalama''s method to\n[65.439s] discover profound truths,\n[68.479s] how do we as we might say fools, people\n[72.72s] who are not truly knowledgeable, hold to\n[75.84s] this knowledge without clinging to it\n[78.799s] egoistically?\n[80.799s] How do we approach this truth without\n[83.439s] turning it into dogma?\n[86.479s] How do we avoid becoming the intelligent\n[89.2s] fool who''s more trapped than ever? Uh\n[92.96s] perhaps we know people like this in our\n[95.6s] own lives. Maybe we know somebody like\n[98.72s] this when we look in the mirror.\n[101.92s] The Buddha''s answer to this conundrum is\n[105.119s] not about what we know but about how we\n[108.479s] carry what we know.\n[112.159s] We know that the biggest danger is the\n[115.6s] fool who thinks that they are wise.\n[118.96s] Given this the the advice to us becomes\n[122.159s] clear. That is, we should find teachers\n[125.759s] and friends who demonstrate genuine\n[128.64s] humility and yet are willing to kindly\n[131.599s] help us to be a better person.\n[135.04s] This is the ideal in Buddhism of the\n[137.84s] spiritual friend, what''s known as the\n[140.08s] kalyanita.\n[142.48s] It''s pretty much a given that all of\n[145.36s] them all of our spiritual friends indeed\n[148.16s] all of us including ourselves are going\n[151.599s] to be fools in this early Buddhist\n[153.68s] sense. That is folks people who are not\n[156.239s] very wise all the time. People who are\n[158.56s] making mistakes\n[160.64s] but that does not mean that we shouldn''t\n[162.959s] still choose wisely our fellow fools.\n[167.519s] We should put a priority on being with\n[171.68s] on surrounding ourselves with those who\n[173.84s] are self-aware who to an extent know\n[177.36s] their limits and their weaknesses and of\n[179.84s] course also strive to be kind.\n[183.2s] The key here is to try to avoid the\n[186.159s] influence of dogmatism and conceit. Now\n[190.64s] this first step of surrounding ourselves\n[193.44s] with the right people is extremely\n[195.92s] important. The Buddha began his famous\n[198.879s] poem on seeking good fortune which I did\n[202.08s] my book about\n[204.4s] if you haven''t seen it. He I mean he\n[206.959s] begins this poem with this very point.\n[210.4s] That is to say we should avoid fools. We\n[213.2s] should avoid the truly foolish\n[216.56s] if we want to live a good life. and\n[219.28s] indeed hope for a better life in the\n[221.28s] future. The key starting place is to\n[224.0s] surround ourselves with the right kind\n[226.0s] of people.\n[228.239s] But in in doing this, we still have not\n[230.879s] touched the deeper internal challenge.\n[234.879s] What do we do with our own minds?\n[239.76s] The Kalama Suta tells us how to acquire\n[243.28s] skillful knowledge which is in a\n[246.319s] nutshell through our own direct\n[248.72s] experience and the leadership of those\n[252.239s] around us who we deem to be wise.\n[256.079s] The next step in our epistemological\n[258.32s] journey or journey of knowledge is to\n[261.04s] learn what to do once we''ve gained this\n[263.68s] understanding.\n[265.6s] And for this the Buddha gave us one of\n[268.0s] his most vital analogies, the simile of\n[271.52s] the raft.\n[273.84s] All sentient beings are confronted with\n[276.8s] the basic fact of duka that life is\n[280.16s] stressful that life is filled with\n[282.639s] suffering. And although there''s always\n[285.44s] the potential in life for great joy and\n[288.4s] happiness,\n[289.919s] the great joy and happiness that arises\n[292.72s] is always going to be fleeting and\n[294.8s] uncertain.\n[297.04s] Our task therefore is to sort of find a\n[300.479s] way to cross over this what the Buddha\n[303.6s] describes as a rising flood of suffering\n[307.28s] and land on the farther shore which is a\n[310.24s] place of safety of wise understanding\n[313.28s] and contentment.\n[315.52s] So the Buddhist says we build ourselves\n[318.72s] a makeshift raft with the materials that\n[321.919s] we find around us on the ground.\n[325.28s] This raft is the dharma. It''s the\n[328.96s] teaching and the practice.\n[331.759s] If we''re successful at building this\n[334.0s] raft, then we try to navigate the rapids\n[337.68s] and land on the farther shore of\n[340.4s] enlightenment.\n[342.56s] However, the Buddha then asks us once\n[345.36s] we''ve reached that farther shore, should\n[347.919s] we then act to sort of hoist this raft\n[351.44s] onto our heads and carry us carry it\n[354.16s] around with us?\n[356.4s] Now, this raft we''ve talked about is\n[359.84s] indeed indispensable for our crossing.\n[363.36s] It''s indispensable for the journey that\n[365.199s] we took. It''s that knowledge that we\n[367.68s] verify for ourselves using the methods\n[371.039s] the Buddha outlined to the Kalamas.\n[374.56s] But the value of this raft of this\n[376.8s] knowledge is purely instrumental.\n[380.56s] That is it''s a tool not a treasure. The\n[384.56s] true treasure, the true goal is the\n[387.68s] farther shore itself. That is\n[389.44s] liberation, not the raft, which is\n[392.4s] simply knowledge of the dharma.\n[395.52s] clinging to these kinds of views of the\n[397.68s] dharma, even of the dharma, I should\n[399.68s] say, even uh things that are verified by\n[404.88s] our own direct experiences\n[407.68s] is for the Buddha a fundamental mistake.\n[411.28s] It mistakes the tool for the goal.\n[415.919s] Here the serious practitioner faces a\n[418.72s] dangerous trap. It''s all too easy to\n[422.24s] fall into becoming what we might term an\n[425.28s] intelligent fool.\n[427.52s] That is, it''s not that we simply cling\n[429.599s] to this raft,\n[431.599s] but instead we turn ourselves into raft\n[435.12s] connoisseurs.\n[437.039s] We''ve mastered the Kalama Suta. We\n[440.08s] consider ourselves experts in\n[442.16s] epistemology.\n[443.919s] We can analyze sutas and win debates\n[446.96s] over fine points of the dharma.\n[450.08s] Maybe we also embrace other forms of\n[453.199s] practice, other Buddhisms. Of course,\n[455.919s] there are many approaches to the\n[457.599s] Buddhist dharma. So, we perhaps try to\n[460.319s] understand all of them or many other\n[462.08s] ones. P perhaps we even un try to\n[465.199s] understand other religious or\n[467.199s] philosophical approaches in order to\n[469.68s] bring a big uh knowledge of other ways\n[472.639s] the people have approached these same\n[474.319s] questions.\n[475.84s] We spend time building for ourselves\n[478.72s] logically perfect rafts\n[481.52s] or maybe even just one especially\n[485.44s] wellconstructed logically perfect raft.\n[489.199s] But while we''re doing this, we''re\n[491.28s] remaining firmly on this near shore.\n[494.56s] What we''re doing in essentially is\n[496.72s] polishing up our collection, sure of our\n[499.68s] wisdom. And again, perhaps there are\n[502.56s] people you know like this. Perhaps when\n[505.12s] you look in the mirror, one of these\n[506.639s] kinds of people is staring back at you.\n[509.199s] I sometimes feel that way myself.\n[512.159s] But this is the intellectual process of\n[516.959s] using profound concepts like\n[519.599s] non-attachment or like emptiness to\n[523.12s] reinforce our own egoism rather than to\n[526.959s] dismantle it. In essence, this is a form\n[530.8s] of spiritual bypassing,\n[533.519s] substituting knowledge for wisdom.\n[538.32s] So the journey to wisdom has stages.\n[542.08s] First, we learn what a fool is. That is\n[545.519s] somebody who acts unwisely and brings\n[548.64s] suffering on themselves and others.\n[552.0s] Second, we learn how a wise person\n[555.04s] learns to know things. This we gain from\n[557.839s] the Kalama Suta and other places in the\n[560.64s] early sutras. The third and most crucial\n[563.92s] step is learning how to let go of\n[566.399s] clinging to what we know.\n[570.0s] The ultimate expression of wisdom is not\n[572.8s] in the quality of the raft that we\n[574.959s] construct but essentially in our\n[578.8s] willingness to leave that raft on the\n[581.279s] shore once it has served its purpose for\n[584.16s] us.\n[586.16s] Ask yourself which of my hard one\n[589.519s] beliefs have served their true purpose\n[592.24s] already. Am I using this raft to cross\n[596.24s] the flood to cross the river to the\n[598.32s] farther shore or am I simply sitting on\n[601.92s] this nearshore polishing up the\n[604.48s] collection that I have?\n[607.279s] This whole practice of letting go of\n[609.92s] views, of willingly leaving our precious\n[613.92s] raft behind us,\n[616.48s] is powered by one of the Buddha''s most\n[618.64s] liberating and radical insights, the\n[620.959s] teaching of nonself.\n[624.16s] After all, if there''s no permanent,\n[627.279s] unchanging self to own a view in the\n[631.519s] first place, then what is there to\n[634.16s] cling?\n[635.92s] To explore this profound question, I\n[638.56s] recommend my earlier video on the\n[640.56s] Buddha''s second sermon, which was all\n[643.44s] about nonself.\n[645.839s] If you''re getting something out of these\n[647.519s] videos of mine, consider taking a look\n[649.279s] at my Patreon page, which is linked up\n[651.6s] here on the screen and down below in the\n[653.12s] notes, and see if you want to help\n[654.88s] support the channel and the work that\n[656.8s] I''m doing here. I hope we''ll see you on\n[659.2s] that video about non-self or one of the\n[661.519s] other videos in my channel and or next\n[664.079s] week''s video. And meanwhile all of you\n[667.6s] please be"}'
