y joke you make people feel better that impresses me there are going to be two reactions to my income first there will be the people that make more than me or a question why I don't make more money given my role in level compensation at my current company is heavily stock base and largely depends on market conditions some years I do really well and outperform other companies other years it looks like I got a demotion if you make more money than me good for you truly happy for you if you still think that I could be doing better after watching this video let me know in the comments section below we can talk about it comparison is the thief of Joy it's all too easy to question Your Existence because of other successes but your net worth is not a stand-in for your personal worth not going to feel worse because others are doing better success isn't a zero-sum game the other reaction will be utter disbelief regarding how much money I make I'm not sharing to flex but to give you actual numbers and to give my mental model and how I think about my income this is useful if you want to have a similar courage trajectory as me a software engineer in the US but this income is not guaranteed the market could completely tank it could get laid off the world could change fundamentally when things change they change really fast that's why along with my numbers I'll also let you know how I'm thinking about writing out the choppiness that's the important bit of this video sorry to let you down ladies but I'm taken the tax return from earlier is a joint tax return so household income that's inclusive of my wife's and my own our income can be broken down into two broad categories wage income or W-2 income in the US and non-wage income or investment income then Uncle Sam takes his cut which leaves us with what we take home let's start with non-wage income we made 355 139 in 2021 in this category this is a slice of income where we don't directly trade our time for money I'd like this portion of income to grow over time but it doesn't need to happen immediately I'm willing to invest in it over the long term to see a big jump in the future case in point my YouTube channel took in 289.48 in 2021 on 101 900 views in 2022 as of today income is eight thousand five hundred and forty two dollars and eighty nine cents on one million nine hundred and eighty three thousand four hundred and thirteen views which represents a nearly 30 times growth in revenue and 20 times growth in views these are top-line Revenue numbers I still haven't made a profit on YouTube If you factor how much I've spent by a long shot in fact if you factor in the hundreds of hours of time YouTube has been a gigantic loss for me if you know my Channel at all I often say your undivided attention is the most precious currency in the universe and I'm plowing a lot of it into YouTube if you'd like to support the channel and help keep sponsors away from the content take a look at my patreon page I understand the Optics of asking for support while also disclosing a large income but if I could I would spend most of my time creating high value content and giving it away for free on the internet the more support I get the more content I can justify the creation of if you can't afford to support me that's totally fine my content will always be free for everybody there just might be less of it or you might see a sponsor placement here or there my strategy is to create as much informative and engaging content as I possibly can and what I do make from content creation I plow right back into making more and better content and the world becomes a better place for it I look at YouTube as a place where I can invest and that many people not just me can profit from so I can't quite quit my day job yet but if the channel 20x is again next year well then we'd be cooking taking a long-term view on all this and I'm committed to this investment and I'm committed to you my viewers outside of YouTube I made 354 850 