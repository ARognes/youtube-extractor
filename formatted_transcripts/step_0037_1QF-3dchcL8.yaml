ch brings my effective tax rate to around 36.1 percent Washington state has no state income tax so after taxes we netted seven hundred and seven thousand nine hundred and twenty seven dollars if we lived in Silicon Valley our W-2 income would be higher to account for a higher cost of living and state income taxes but then we'd have to live in Silicon Valley we were both raised in the Pacific Northwest and its home we thought about moving but we're not staying because we're trying to minimize our tax liability or anything it'd be really easy to start ranting about taxes since 320 000 buys a lot of nice things but if I live somewhere else I wouldn't have the opportunities that I have in the US so I'm not going to complain I don't waste effort on minimizing my taxes or messing around with geographical Arbitrage if we lived elsewhere I think my strategy would be to find a remote position that paid West Coast salaries but if I couldn't my strategy would be the same I'd maximize my earnings where I was save what I could invest in the long term and retire faster and that's how we got over a million in 2021 and we're weathering the storm for 2022. I wouldn't make the same exact choices as me if my advice makes sense to you then take it if it doesn't make sense to you don't my ideas are free for everybody applying it to you and your life is the hard part and I can't do that for you that was a lot but here are the takeaways one make money decisions based on the long term a year or two isn't long term 20 to 50 years is when the market is bad don't panic so when the market is hot don't get fomo and Panic by when you have a good year say for the bad years two don't inflate your lifestyle too quickly do it slowly you can get the nicer version of things for your hobbies but everything shouldn't be your hobby three you need to be aligned on financial values with your partner just like you need to be aligned with things like children and religion having a partner that compliments yo