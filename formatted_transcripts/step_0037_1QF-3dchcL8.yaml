han a million dollars by the time I retire it's okay to be a bit cash heavy now but don't liquidate everything especially if there's a penalty for doing so and three most importantly when you have a good year and receive a windfall you should not substantially increase your lifestyle if I bought a fancy boat last year this year's losses would really sting and I'd have a floating money hole more on lifestyle inflation in a bit let's talk about wage income along with my wife our W-2 income is 675 262 dollars let's start with my wife's contribution she made 139 728 dollars in 2021 she's a senior software engineer engineering manager she quit her job as a manager early in 2021 at a medium-sized company and joined a startup later in the year as a senior developer so this wage represents a partial year of work like all startups she took a pay cut when she joined in exchange for getting on the ground floor it won't go too much into detail file since this channel isn't about her but the takeaway is that your partner really matters it matters a lot Not only would we not have eclipsed a million in income without her but we are aligned on values financial and otherwise if you're single make sure to align on finances before committing to a long-term relationship like marriage it's just as important as considerations like faith and spirituality or having children finding an awesome partner that compliments you is worth more than money my wife is my partner in crime and my best friend and I love her dearly if you're not single and I probably don't need to tell you this but you have what you have in a partner barring a big change like divorce I don't have any advice for you there sorry my salary last year was 535 533 my base wage in 2021 was 160 000 and rsus or restricted stock units basically soccerens's salary was 375 533 my compensation is really tied to the performance of the stock price last year that wasn't so bad this year I'm on track to make about a hundred thousand dollars less this year on top of investment losses for 2022 we might make 25 or even 50 less than last year this smarts a bit but my world isn't crashing down first part of working at my company is stock based compensation every year can't be a windfall year the expectation is that some years aren't going to be as good as other years when my annual performance review occurs I will expect the company to make up the difference this sets me up for future good years because I'm looking at a longer time Horizon than a single year I know this will equalize over time because it's happened before to me I'll adjust the numbers in the following example to compensate for a recent 20 to 1 split on October of 2007 the stock price was 7.55 cents and by December of 2008 the price tumbled to two dollars and 10 cents my compensation was adjusted for the next year to account for the nearly 75 drop in value I didn't know it at the time but the RSU grants in 2008 set me up to have an unbelievable amount of income when the economy did make a recovery the stock price went up 500 percent in the next three years and five thousand percent in the next 10 years while I'm not expecting anywhere near the same amount of growth after this recession nobody knows what the future is my point is that if your time Horizon is longer than a year or two and you don't need the money immediately to survive long-term Focus Smooths out all the bumps in the road and sometimes like in my situation the Great Recession actually facilitated an enormous windfall in upcoming years there's some Whiplash for sure I sold some things at the absolute bottom because of course I did but the high highs only came because of the low lows second I'm really lucky to have a job where I'm well compensated even in down years and really really well in good years have a good work life balance despite what you hear from unhappy former employees and work around some of the smartest people I know a bird in the hand is worth two in the bush