transcript: I literally got [ __ ] by my previous business partner and I just lost our runway of 10 months, so about 500k. I went from being ghetto rich to ghetto broke in 1 second and I basically need to make 100k USD in 4 days, otherwise I won't be able to pay for payroll or ads for the rest of the month. How can I get all this money without destroying my reputation? >> Okay, if you need to make fast cash, in order, number one, hit up all your existing customers and try and get them to pay like buy X to get Y free. So basically do give them an offer to pre-pay future services so you can pull cash forward. That's number one. Number two, hit up all past customers, anyone you've ever worked with, and do a rollover offer. So what that is is you say, "Hey, Janet, you spent $700 with us, you know, 4 months ago. I want to give you that $700 of credit because I want to help you do XYZ." And so when they respond back to you and you can say I owe you money, it's a great subject headline for the email. Say I owe you $700, tends to get opens and responses. Get on the phone with them. The whole point is to get the conversation going and then you take that $700 credit towards a $3,000 thing. So you can basically say I did this one thing, let me do way more things, and I'll take this and I'll credit towards it. The third thing you can do is you hit up your existing list. So this is all past leads and current email list that you have and fundamentally you want to make that same kind of buy X get Y free offer and or a giveaway offer. And you shouldn't be afraid to, I'll just say, spam the list in that very truncated period. Some people will disagree with me, but I'm trying to keep you alive right now. We can worry about you retaining, you know, re-getting the health of your email list after the fact, but if you don't make the business work, then the there is no business, right? And so hit up your existing customers, hit up your past customers, hit up your list, make them offer so good they feel stupid saying no, try and get them to pre-pay for future services so you can get paid today and have cash. You can worry about goodwill tomorrow, today you need to survive.
