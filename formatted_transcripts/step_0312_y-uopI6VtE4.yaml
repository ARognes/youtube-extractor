transcript: Amazon sold one book a week, and now Amazon sells almost everything. Phones, furniture, gloves, entire businesses even. But, when it first started, it could barely sell anything. Back in 1995, Jeff Bezos started Amazon as an online bookstore. And the first week, they sold one book. That's it. So, literally a website so super simple, no Prime, nothing like that, that sold books. But then suddenly, orders started to come in. And from all over the world. And places that Jeff Bezos hadn't even considered. Because the internet removed one crucial thing, and that's location. Suddenly, a tiny bookstore went global. And that tiny signal became a trillion-dollar company today.
