transcript: '- Hey YouTube, Danny here with kind of a quick video and also a bit of a request because on September 12th, Noclip turns 10 years old. I know time makes fools of us all. Sorry for making you all feel as old as I look. The reason why I''m bringing this up though is because on August 12th, we''re gonna to start basically a month of sort of celebrating the past decade of stuff we did on Noclip. We''re going to have videos here on Noclip. We''re going to have some special stuff over on Noclip too. We''re of course going to have a bunch of Patreon stuff as well for all of our patrons. But I want to talk to you about a video that I want to do here, which is kind of like a decade long Q&A in the making. I think we did one around COVID time at one stage, but we tend not to do these. We do them on the Patreon all the time, so I don''t want to sort of overdo it. And I''m always answering questions on social media. But after 10 years of doing these documentaries, all the studios we''ve been to, all the people we''ve interviewed, I know there are probably loads of questions people would like to ask. So this is the opportunity. Please put any questions you have about any of the projects we worked on, the people we interviewed, the spicier the question, the better. It''s been 10 years. If we''re going to do like, you know, the reveal of all the secrets, it might as well be now. So yeah, if you have questions about even projects that didn''t happen or, you know, anything, just please put them in the comments. We''ll pull out the ones that seem like the most interesting or spiciest, and then we''ll put up a Q&A here some stage between August 12th and September 12th, answering as many of them as possible. Also just thank you for supporting us for 10 years. I''ll have a much more softy video about that in the future. And thanks to the 900,000 of you now who subscribed, we just crossed that more watermark pretty recently. So that was pretty deadly. So yeah, that''s it for now. Questions, stick them in the comments. I''ll answer as many as I can. And thank you so much and I hope you''re looking forward to our 10th birthday celebrations as much as I am. Talk soon. (upbeat music)'
