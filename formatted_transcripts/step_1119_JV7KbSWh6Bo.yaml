transcript: |-
  *Plants Can Dance — Live at Number 90, Hackney Wick — Bio-sonification Modular Set*

  Recorded live on 19 April 2026 at Number 90 in Hackney Wick, as part of Plants Can Dance, an event hosted by Auntie Flo and Lamine from Repot focused on music generated by plants. The format mixes performance, workshops, hands-on experimentation and talks, all built around bio-sonification and the instruments from Instruo.

  This patch explores how a plant can act as a generative input into a modular ambient piece, shaping a soundscape that slowly reveals the plant's activity over time. The modular synth holds the harmonic ground while a Nagra IV-S reel-to-reel, running a long tape loop with the erase head bypassed, captures and re-captures plant-driven melodies in a sound-on-sound build-up. A Marantz CP430 plays bird sounds from an old BBC field recordings cassette from the 90s, sitting quietly underneath everything.

  Patch Notes:

  1. Beads (Mutable Instruments) provides a low drone using one of the wavetables. I'm slowly scanning the time parameter to draw out different harmonics from the module.

  2. Rings (Mutable Instruments) is the bell voice. The structure parameter is pushed either very high or very low to get pure, crystalline bells, with the other parameters modulated for movement. Notes come from Marbles, quantised through Scales (Intellijel). The scale shifts progressively across the piece, major to minor and back to major, for a slow change of flavour.

  3. Ensemble (4ms) is the second voice. Roots is modulated and the oscillator count is kept low to keep things clean. It also takes notes from Marbles, and comes in and out via a random envelope from Xaoc through a VCA.

  4. The full mix passes through FX Aid, where a slow LFO opens and closes the high frequencies for some gentle movement.

  5. Then into Strymon Starlab for a long, deep reverb. I periodically engage the infinite mode so frequencies stack up on themselves, giving the feeling of being suspended in an endless space.

  6. Plant melody chain: an Instruo Pocket Scion converts plant activity into MIDI, played by the OP-XY (Teenage Engineering). The audio feeds the Nagra IV-S, running on a multi-metre tape loop that physically winds around the plants. With the erase head bypassed, every pass adds another layer onto what's already there.

  7. Underneath, a Marantz CP430 plays bird sounds from an old BBC field recordings tape from the 90s.

  The modular acts as the calm background while the Nagra slowly builds the plant-driven melody on top, layer by layer.

  The video also captures a bit of the day itself, the workshop section and the scenography of the room, with the plants from Repot we used to experiment with throughout the event.

  Big thanks to Auntie Flo, Lamine and the Repot team for putting this together, and to Instruo for the instruments.

