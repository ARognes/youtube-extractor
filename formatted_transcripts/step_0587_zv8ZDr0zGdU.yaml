transcript: Making sure your colors are perfectly accessible in CSS is not always easy, which is why I love the rendering tab in the dev tools. It allows you to do things such as swap between light and dark mode on your page to easily see how your colors look. You can also emulate a bunch of other CSS media things like prefers reduced contrast, prefers reduced motion, prefers reduced transparency to make sure everything is super accessible. And you can even emulate different vision deficiencies. For example, I can emulate what happens if there's blurry vision, reduced contrast, for example, no red, no green, no blue, and even fully grayscale to really see what my site looks like. And best of all, there's, if you go over to the elements tab and you inspect any element, you can actually visually check the accessibility of all the different colors. For example, this blue color, if I want to see if it's accessible, you can see this contrast ratio. And if I click this little arrow, you can see I have double A and AAA contrast set. And if I move around this color to be below these different bands, you'll notice as it gets lower and lower contrast, it'll no longer meet these different requirements. And for every color on your site, it should at the very least be double A compliant, if not AAA compliant, to make sure it's as easy as possible to see for everyone, no matter what their vision capabilities are. Now, obviously, going to every single element and checking this comparatability manually is not the best way to do it, which is why this CSS overview tab is amazing because it has an entire section specifically dedicated just to contrast issues. as you can see here. And if you want to learn more about this tab, as well as all the other amazing CSS dev tools, I'm going to link a video at the bottom of your screen that goes over everything you need to know about the dev tools specifically for CSS. S.
