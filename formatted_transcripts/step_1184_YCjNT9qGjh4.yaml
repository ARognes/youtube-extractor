is a whole thing that could work because the pilot could only run. - We don''t very often force the player into a very specific set of actions. That''s one of the few times that we had to learn to really corral the player, and I think we ended up being pretty successful. I think the consequences for sort of not following on the clear path were quick and efficient. (Sawyer chuckles) (chatter over radio) - Get in here quick! Keep moving! Head for the roof! - So when you build the world, I start with the infrastructure. What''s really interesting for me is what is not visible to the tourist, which is the courtyard, the backyard, the shafts and the smoke stacks and the wires. And every city has this whole existence, and people are usually blind to it and we tend to look at storefronts, right? - Yeah, I mean a lot of it came down to art direction. I mean, Viktor was very, very familiar with all that, the look and feel. There was certain patterns and certain iconic shapes that anybody who lived there could pick up on. They''re like, "Oh, yeah, my grandmother had that dresser." Or whatever. And my parents are from Argentina and so they have that kind of sensibility, but a lot of it came down to the reference gathering, which was from Bulgaria, from Paris. - We have these buildings that, again, have back courtyards. They have big staircases, they have cellars, attic spaces, cellar spaces, and the apartments have big windows and thick walls. So this was providing already a lot of context for people who can hide in these apartments. - Help me! Stop! We didn''t do anything! (loud thudding) (flatline beeping) They''ll be looking for you now. You''d better run. - I remember that we wanted to have the player see proof that the Combine were evil people, not that they were gray in any way, that they were objectively the bad guys. And then we had it to where you go upstairs, and then we really carefully and intentionally framed the reveal of the world to where you see the Citadel front and center, and it''s clearly in an alert state. - The four of us, the City 17 cabal, we''d done City 17, which is a bunch of hard problems, we''d done Ravenholm, which is a different set of hard problems. We were like, I don''t know, four months from trying to lock down the game or something. I mean, it was really late. I mean, we had the dates wrong, but it was really late. And there was a bunch of gameplay that that was in there that hadn''t really received a lot of development. - We were coming from working with pretty much every tool in the game in City 17 to going back to basically you have a pistol and Metro Cops. Not much really. So John and I, John Guthrie and I, absolutely love exploding barrels. So we just used them absolutely everywhere we could. We set them up. We loved ragdoll magnets and physics. It''s just one of my favorite tools. It''s basically you have a point in space that when a character dies, they turn into a ragdoll and then you have a ragdoll magnet that says, "Okay, if there is any ragdoll in this radius, pull it towards me." And then you can give it a strength. And so if somebody dies in an especially dramatic location, you can have an especially dramatic death. And we just use that absolutely everywhere. I mean, you can use it to just pull someone directly down. So in that bridge, the train bridge, I put magnets directly beneath their feet, so it looks like they just, like the planks beneath their feet broke and they just fell directly down. - That''s right. - I mean, they died from a broken plank, which doesn''t make any sense, but they looked pretty cool. It was so orchestrated, I guess, because we didn''t want it to, we didn''t really have a lot of time to have a lot of bugs come out of it. (loud gunshots) (metal clanging) - Our team was the one that did the Citadel. You know how I said that there was multiple passes on the product over the course of the thing? Well, Citadel had almost no pass. And we were thinking about street war and we were like, "Well, we just had this incredibly intense Strider fight. How are we gonna outdo that, especially when we only got a month to do this thing?" We then came up with the idea of like, "Well, what if we made this just be ''you''re god'', and this is the reward." "You''ve won the game. Enjoy. We''re gonna like break all the rules and let you let you be God for a little bit." - Picking up the enemies as ragdolls and throwing them around really came outta that development tool, because you could pick them up and move them around. And people were like, "I don''t know, that''s pretty fun. Why can''t we do that in the game?" - It was either a week or a day. It was incredibly quick. I had every single mechanic of the Citadel mocked up. The Combine ball was actually a very, very heavy watermelon that would bounce around and eventually break up. I had spikes in the wall that you could skewer them on, we had electric fields that you can throw them in, we had the zero-G fields that they would get stuck in. And we had ripping off the machines off the walls. All that stuff all came together within an incredibly short period of time. Just a day or a couple days. Very shortly after that people were like, "Eh, we''re having a real hard time with the AR2''s alt fire. So maybe we''ll just steal this ''cause it''s kind of cool and we''ll bring it earlier in the game." Game development never does this, it never just materializes out of nothing in that short of time and is just something that everybody''s excited and happy about, and it just felt really good to be a part of that. (curious music) (curious music continues) - I started working on trying to find another source of funding to keep Valve going. I started working on a deal with a big publisher that was for "Counter-Strike 2." So we''re right there, ready to sign, we''re really kind of running on fumes at that point. And then get a phone call and they''re like, "Yeah, we changed our mind. We''re not doing the deal." I remember one conversation with Gabe, which is he was like, "So how fucked are we?" And I was like, "Yeah, we''re kind of screwed. We could probably reformat everything that we''re doing, but it means we lay off people." And we still had the huge uncertainty of what is gonna happen in the lawsuit. Immediately started chasing another publisher and were able to get a deal done with another publisher for "Counter-Strike 2." When we got the deal done, Gabe at that point was super into knives and as the deal gift for the parties, he built a knife that was inscribed "Counter-Strike 2." And so the deal structure was, "After we ship ''Half-Life 2,'' if you decide that you don''t want to keep moving forward, then you can just decide to terminate the deal and we''ll pay the money back." That ended up happening. So maybe a good choice because it took us a long time to ship "Counter-Strike 2." So that we got done in probably May of 2003. And then through some more depositions, Vivendi figured out that we had gotten this new infusion of capital and kind of lost their mind trying to figure out how did that happen? Because clearly part of their strategy was running us outta money. - But what we decided was, "Hey, let''s focus on the real nub of this and the thing that''s going to lead to a resolution. Getting the judge to decide that we were right about the cyber cafe business, and also to decide that we were right that if you were distributing these properties without a license, that that''s copyright infringement." We had asked for the information about what they were doing in Asia, including Korea, and they, I think to try to make our lives more difficult, produced a big chunk of documents in Korean. They were in Korean. I mean, everything from email to contracts to you name it. - And one of the things they were doing is just dumping huge amounts of discovery on it to force us to go and just have somebody go and look through it. It''s like, "Oh, look, they ordered sandwiches again," right? It has nothing to do with the lawsuit, it''s just an attempt to overwhelm us with tens of millions of pages of documents on the assumption that there''s nothing in it that will be particularly problematic for their case, that we''ll eventually just either spend a bunch of money, which plays into their hands, or we''ll just eventually give up because it''s finding a needle in the haystack. And then we found the needle in the haystack, and that changed things quite dramatically. - [Karl] It just so happened that there was an intern, summer associate, who was a native Korean speaker, and I said, "Andrew, hey, can you look at this pile here and can you just tell me what''s in there?" - I would guess that that particular intern probably went through a couple thousand documents that day and only one was consequential. - And then they said, "Well, there''s these other emails between these vice presidents, where one says something like, ''Hey, we destroyed those Valve documents like you asked.''" And I said, "Are you sure it says that?" And he said, "Yeah, that''s what it says." And so of course that led to a conversation between me and the lawyer for the other side about, "Hey, it looks like your guys are destroying evidence. What''s up with that?" They wrote back and said, "You''re outta your mind. Whoever translated doesn''t know what they''re talking about." And I talked to Andrew again, I said, "Well, it looks like we''re gonna have kind of a fight about this. We''re gonna need an affidavit from you about your translation. Can you tell me a little bit about your Korean skills?" He goes, "Well, I''m a native speaker. At UCLA, I majored in Korean language studies." (producer laughing) And I said, "That''s good. That sounds like we''re in good shape." - The Assistant General Manager in Korea sending the letter to the General Manager of Korea saying, "I have destroyed those documents related to the Valve case, as directed," which I think is one of Karl''s happiest moments as a lawyer in his entire career. Just stuff like this never, ever happens. - I did a lot of lawsuits for a long time, I never saw anything like that. Never. Maybe there was document destruction that couldn''t be proved, but that was like, "We''re talking about it in writing." I''d never seen that before. - At that point, Judge Zilly said, "All matters of fact are now according to Valve. You don''t get to contest any of those. Now we''re just discussing the settle, how much you''re gonna have to pay and what the damages are." - And Gabe was still pretty mad. He was mad. He really didn''t want to settle. He was mad enough that he wanted to keep going. But I remember sitting down with Karl and having a conversation with Karl, and I was like, "So Karl, what do you think? Should we settle at this point? Is (static) the right number?" And he was like, "Well, there''s this old saying, ''There''s a difference between being a pig and a hog.''" (Scott Lynch laughs) - Karl was done with the deposition and that was the only question I asked him to ask that particular witness was, "Is ''Half-Life 2'' being replicated and shipped to retailers?" He said yes, and the relief was, "Hey, no matter what, at least the game''s gonna get out to people," which is kind of a... That''s a pretty unusual way to find out from your publisher that they''re shipping your game to retail. (gentle music) (gentle music continues) - I''ve kind of been thinking about this for the last few days, and if there was one thing that I can point to that made us successful over that development period, and I think that it was really this culture that Gabe created where we were hiring people that were senior enough to be managers, but also passionate enough to still be individual contributors. They were willing to stake their credibility and their name on these big features and sometimes spend years working on those features. - Yeah and it was six, seven days a week, 10 to 14 hours a day. - It wasn''t always, I would say a good 18 months at least. But a lot of good memories though. I mean, everyone in that room had such great sense of humor. We all, we knew each other''s sense of humor, we trusted each other, we respected each other enough that we could rib each other without stepping on each other''s toes and stuff, and it just worked pretty well. - It was just bigger, more pressure. And I think that seriousness in some ways, there was still humor, but that seriousness kind of infuses into the game. You feel it''s a heavier game. - It''s the most cohesive product feeling I can think of at scale that we''ve done as a company. The whole company was just aligned and got it done. - I think back on this experience, and it was a really hard time, but I feel super grateful because we were supported to make the very best game that we possibly could. And given the time to do it, we''re gonna ship it when it''s done, even when we made unreasonable promises about when that might be in advance. And it was also at a time before the game industry was quite as specialized as it is now, where people got to wear multiple hats and contribute in all these different ways. So it was a rare life experience and I''m really grateful to have been part of it. (gentle music fades) (eerie music) (eerie music continues) - Yeah, I mean part of the fallout of "Half-Life 2" shipping was the realization that we can''t do six-year long bet the whole company bets over and over again. And if we get it wrong one time, we''re a big crater in the ground, as Gabe would say. And so we started to think about episodic releases. - The first idea when they pitched it to us, like, "We''re gonna do this episodic content, we''ll do one every," how much, 12 months? - Yeah, we were gonna have alternating teams come out every year and a half, something like that. - [Douglas] So I was like, "Yeah, this is neat," but then it just got outta hand. - [David S] So when they decided to start playing with episodic content, the promise for me that I felt was, "We can build smaller pieces, denser pieces faster, and we know what we''re doing, we''re gonna be really good at this." - So a lot of it was like, "Do more with less, keep a bunch of the existing stuff and retweak it to make some new interesting scenario." Like probably the biggest real new thing for episode one as far as technology was just having Alyx with you throughout the entire thing and having her behave in a way that was believable and fun. She''s with you for a few distinct parts in "Half-Life 2," but they''re always pretty heavily scripted and not really in combat. Having her there and able to actually be a useful companion, so there''s a lot of little tricks that we did to try to make that as fun as possible for players. She doesn''t have supernatural knowledge, she''s not just finding things without you lighting them up, but if you throw a flare out or you look at ''em with a flashlight, it''s like, "Okay, she''s gonna go for that target because she can see it." - [Douglas] We were cranking on that, and it took forever. We were not just partying, hanging out. - No, I was pretty much crunched that whole project, I think. - Yeah, we were crunch mode. And then same thing with episode two. - We started at the same time as episode one, and so we ran for an extra year that way, which allowed us to stretch and push more. - So the Hunters were initially something that we wanted to have a more sort of frenetic pursuit built into the design of the character. So it was really focused on, at the time, creating a creature that could follow the player into more types of spaces. - One of the questions was, how do we keep Alyx outta your way during this really intense high action scene where the player has agency to make whatever decision they want about where they want to be inside the house and that sort of thing, and that''s when we got the idea to have her sort of camp out by a window and she would fire out the window and let you know if she saw any Hunters or soldiers out that window. And if the player started to spend time at that window, she would find another one to go be at. - I mean, so Dario Casali was trying to create this final fight in episode two. - The Striders always reminded me of AT-ATs in "Empire Strikes Back." And of course we wanted something fresh because just rocketing a ton of Striders was gonna be a repetitive after a while. So that''s when we started collaborating, talking about the Magnusson device and the Hunters and how would those all come together to make this sort of an overwhelming 25, 30 minute battle set piece. (loud shot) (sci-fi laser whirring) (loud laser shots) (loud explosion) - The citizens and the Hunters, and to a lesser extent the Strider, are all secretly in cahoots to create this tension. Because what we always wanted was, "Gotten the Magnusson device on the last guy, are you gonna be able to shoot it? Oh my God, the rocket''s gonna be destroyed." And then like, boom, you hit it so that when everyone comes out running, you really feel heroic. - [Dario] You have the car and you have a big space and you''re not guided anyway. You have to go and take care of this threat in a way that you think is best. I think it pays off, it makes the player feel like, "I did this myself. I wasn''t guided by level designer at all," because we give them so many options, right? You can kill the Hunters with driving the car into them, you can pick up the log and throw at them, you can pick up a Magnusson device and throw it too soon and they''ll shoot it down. You have to learn, "Oh, yeah, I have to kill the Hunters first." You can use rockets to kill the Hunters. You have options and you have time and you have space, but we dial the tension and the pacing up pretty slowly over time. (loud shot) (intense crashing) - [Jay] Yeah, it is pretty cool, all of of cinematic destruction stuff that happens in there. - It was so hideously faked because basically we would send a Strider who would do that sort of low scuttling run, and he would just sit there and wait, just staring at this building until the player could see the Strider plus the building. - Yeah, till it was framed up correctly. - He would literally sit there forever. (loud explosion) But we dial the tension and the pacing up pretty slowly over time. The play tests we like the most is when the Strider''s, he''s getting ready to shoot the rocket, and then the last Magnusson device goes off, and then he''s down. (sci-fi whirring) (loud explosion) (people celebrating) - Nice one, Freeman! - We did it! We held them off! - [Tom] People were failing left and right, and the team was calling for the map to be cut. - [Dario] Well, I took a lot of heat for that. Both of us did. - Yeah, we just had to see it through. - We were gonna do an arc of three, of course, because that''s just how you think of stories in those terms. And then you want the high point to come at the end of the second one, and Gabe at one point saying, "Who''s the important character you''re gonna kill?" I''m like, "Lamar is going down. This is gonna be it. I want episode two to end with Lamar floating into space and everyone cries." And Gabe''s like, "That''s not good enough." - No! No! - The episodes were, a lot of that was an experiment on what''s the right amount of episode. Episode two was longer than episode one and bigger, and people like that better, but- - It also took longer. - It took longer to make and people didn''t like it as much as they liked "Half-Life" or "Half-Life 2" kind of scope, right? - Yeah. - So by saying episode, are we solving a lot of problems here or are we just making a sideways trade off? I think that''s maybe the way I felt about it. - Even into episode three, I still don''t know what that would''ve been if we''d built it, because it hadn''t been built. That was the feeling of excitement of something I can''t even imagine is gonna happen with as a team. I was not imposing a top-down, "This is what we must do to tell our very important tale." It''s like, "Oh, we have new features? What kind of story can we do with these now?" - Well, I worked on episode three and I was working on this gun called the Ice Gun that basically let you create amorphous shapes out of ice, so you could raise a little ice wall in front of yourself. It would be attached to the floor, and then the Combine soldiers could shoot holes in it and it would shatter and break kinda like glass, I guess. So that was the primary mode, of you could build ledges for yourself to get down cliff faces. It another mode that was kind of like a Silver Surfer mode, where you would extrude the ice in front of yourself and then run along it and use it to cross gaps, go over chasms and things like that. What else do we have? It was set in the Arctic ''cause it was set around Borealis. - [Jay] I remember the little blobby, squishy. - [David S] Oh, yeah, yeah. Brian was working on the blobs. So we had the isosurfaces that we ended up using in "Portal" for the paint. So we had that as an enemy. It was a blob enemy, and it could change its shape and you could choreograph its shapes with some content tools. And then it could also split into little hoppy blobs that were almost like little Headcrab-y things, but they were little splats that would hop around. And we were doing all kinds of stuff with that. It could pass through grates. - [Jay] You could get more gameplay out of something where you had maybe a couple of creatures with simpler behaviors. - Oh, yeah, yeah. - And then you would spend time combining them and combining them with other game mechanics. - Story was never the boss of anything. It was always, we worked on a peer-to-peer thing. We were, "What can we do? What do you think would be cool?" - It was still a collection of playable levels in no particular order and a collection of story beats and story concepts. And we were still like, probably another six months we would''ve had a critical mass of mechanics and then start putting them in a timeline. I think probably a year and a half easily, depending on how ambitious we got. Could have been two and a half more years. - Yeah. It''s hard to be a lot less than two years. - Yeah, yeah. - Yeah. - Yeah, I think we were six months in on it when we moved to "Left 4 Dead." I don''t know, we were moving at a pretty brisk pace too. - I thought that we needed to go much bigger on episode three or do something else, because I don''t know if this is the right way to describe it, but element fatigue? I think we had really explored a lot of what made sense in the "Half-Life" universe and setting. - Arkane was building the "Ravenholm" game, and even they were having trouble doing cool new stuff with this tool set. And if those guys can''t figure out a bunch of cool stuff to do with this, I think we''re running out of fuel. - Episode three''s coming along, it''s like, "Well, what''s the no big thing here. It''s gotta be bigger than all the stuff we just did, even episode two." And it''s like, "Oh my God," you know? - It just becomes this- - Are we allowed to cry in this documentary? That''s what I wanna know. - "Left 4 Dead" needed kind of an all hands on sort of an effort to ship. And so we put down ep three to go help "Left 4 Dead," and it was a really tight shipping schedule and it required a lot of work from everybody to get out the door, and it was worth it. - Yeah, "Left 4 Dead" came out... - "Left 4 Dead" came out great, but it took long enough, and this is the tragic and almost comical thing about it, was it took long enough that then by the time we considered going back to episode three, the argument was made like, "Well, we missed it. It''s too late now." (both chuckling) And we really need to make a new engine to continue the "Half-Life" series and all that. And now that just seems, in hindsight, so wrong. We could have definitely gone back and spent two years to make episode three. - And you can''t get lazy and say, "Oh, we''re moving the story forward." That''s copping out of your obligation to gamers, right? Yes, of course they love the story. They love many, many aspects of it, but sort of saying that your reason to do it is because people wanna know what happens next. We could have shipped it. It wouldn''t have been that hard. The failure was... My personal failure was being stumped. I couldn''t figure out why doing episode three was pushing anything forward. - But yeah, I mean, some of those people made "Left 4 Dead 2" and then "Portal 2." - Yeah, we did other things instead. - It''s not like that choice would''ve been free. - Right. - In terms of the players, they may have gotten that and not- - And given up something else. - Not something else, yeah. So it''s hard to say. - [Kelly] But a lot of us have been doing "Half-Life" for eight plus years. - We saw a bunch of really compelling reasons to go explore more multiplayer based projects too, because not only just what customers were doing, but internally, we found ourselves wanting to play a lot of multiplayers. - It sounds silly to say it ''cause we''re a relatively big company that has a bunch of stuff, but we''re not that many people. There''s 300-something people here. And so we''re working on a bunch of different projects and it''s like, people are passionate about "Portal," people are passionate about "TF," people are passionate about "Left 4 Dead" and "Half-Life" and "CS" and "Dota, "Deadlock." I mean, there''s a lot of things there. And I also work on our hardware, so I''ve worked on Steam Deck and the original Steam controller and a tiny bit on VR. Unfortunately for any decision we make, somebody is gonna be unhappy, but hopefully we''re making a bunch of people happy with the choices we do make. - If it weren''t for the episodes, there''d be no such thing as "Dota," and I know that sounds really weird, but it was the things that we learned in developing the episodes that led to "Team Fortress" to more rapid updates. - I think everybody that worked on "Half-Life" misses the working on that thing, but it''s also hard not to be like, "Man, I''ve kind of seen every way that you can fight an Antlion," or whatever. And so you wanna get some space away from it until you can come back to it with fresh eyes. - It was easy to think about VR being a vehicle for "Half-Life" because that was a big technological innovation and kind of a core reason for that product''s existence. And I think like one of the things we have internally tended to attach to the "Half-Life" IP is innovation. Gameplay innovation is oftentimes enabled by a technological innovation. Clearly there was a ton in "Half-Life" 1 and 2, and so yeah, it''s an interesting challenge moving forward to think about what that means for future "Half-Life" stuff, for sure. - The ending of "Half-Life: Alyx" is somewhat a self-critical realization, so that was super satisfying and all credit to the people who were specifically involved in that decision and those sets of designs. I think that "Half-Life" represents a tool we have and promises made to customers to capitalize on innovation and opportunities to build game experiences that haven''t been involved previously, and I think that there are no shortage of those opportunities facing us as an industry right now. (gentle music) (music fading out) - [Kleiner] Oh, fiddlesticks. What now? (glitchy audio SFX)'
