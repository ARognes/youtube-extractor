ling on that sweater thread. - Gabe''s brother had a company called Tangis and they made wearable computer stuff. So he was kind of winding it down and he had one or two Unix servers that hosted the tangis.com domain name. Unfortunately they were put inside the firewall and didn''t have the latest Linux or whatever security updates on them, and so this kid from Germany was able to sort of exploit his way into that. He sat there for months, I think, he was able to sync the build, all the source code. - I was riffing ideas for, I think in particular "Counter-Strike." that information ended up on one of the internet chat rooms, and I only two people knew the contents of that email. Of course, Gabe and myself. And I went to ITG and said, "This could only have come from a leaked email. We gotta figure out how that got out there." - But I remember at some point Gabe walking around, like one of those moments, like, "Turn your computer off. Something just happened." - That''s right. - I remember being on my desk and he''s coming like, "Turn your computer off. I think we''re being hacked," and I was, "What?" I didn''t know what to do. I actually did not know what to do. - I remember coming in that morning and figuring it out and I just felt like someone had just punched me in the gut. - It''s like the bit in movies where after an explosion they''ll have a scene where someone''s staggering around the street and everyone''s like... What''s this mean? Can we still keep working on the game? Is someone just gonna release the whole game tomorrow? - And I don''t know if the guy who hacked it intended to. - Yeah. He showed it to friends. - I don''t think he intended the wide distribution. - He showed it to friends, and then one of his friends posted it somewhere. - Yeah. - Unfortunate. - Yeah. (eerie music) (eerie music fading) - And one of the things I think that''s pretty interesting is how much the leak of the game, the hack of our network and the leak of the game, how much that kind of shattered that confidence. - It was like having a movie that you''re working on be spoiled for the world. That''s how it felt because we knew it would be hard for people to know that that existed and not go look at it all. It looked all broken to us and it just felt really demoralizing. - Oh, man, I was seriously affected by that. Yeah, I was pretty angry. So I don''t know, it kind of affected me for a while. Having it be having it called the beta when it was not even close to being a beta. Work in progress, you know? Wasn''t really ready to be seen yet. - Normally the office is pretty vibrant and loud and people riding scooters in the hallway and doing all sorts of stuff, Gabe''s Tuvan throat singing; and it got very still and very quiet. I remember that. That was very eerie. That was the game that was gonna make or break the company. We didn''t know if we were gonna have to go find jobs. - Not only did it show everybody that we were not anywhere near where we said we would be, but all the work that we had in progress, all the plans that we were making were just laid out bare. And so a lot of us just thought, "Oh, we''re toast. We''ve worked so hard. Are we gonna go bankrupt?" And then all that while, Scott Lynch and Gabe were being sued by Sierra, their wives being delivered subpoenas. And so it was this super dark time. - So there were two interesting threads going on. One was traditional law enforcement intelligent agencies, and they were doing their thing and issuing subpoenas and seizing devices. And then we asked our community to help us out. And I think Axel Gembe started to realize that he was being tracked down by the community, right? Everything was being essentially, it was an open-sourced investigation, so he could see that they were getting closer, and that''s when he reached out to me. Of course I was insanely furious with him, but we ended up running this sort of scheme with him, where I was like, "Oh, wow, you must be really good at security