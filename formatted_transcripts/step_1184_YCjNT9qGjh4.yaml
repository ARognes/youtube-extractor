ust about mechanically getting past the enemies that we''d set. - Nova Prospekt was different than a lot of the maps that I worked on at least, is that in that we had some early art prototypes that were done. We have this whole concept of zoom maps we call ''em, which are basically little art test scenes, how they would fit together and some basic lighting. - But by the time our cabal got to Nova Prospekt, we knew we were coming in with Antlions and with Bugbait. And so we already knew that a bunch of stuff was gonna change because we had to support you and your army of Antlions fighting Combine soldiers. Antlions look great whenever they were being shot by anyone. Particle flecks flying off, and they always look great. And so setting them up against Combine soldiers looked great, setting rights against turrets looked great. - Those were super fun scenarios to work on though because having these Antlions that you could just use in any way you wanted was really fun. And coming from the coast, just the contrast of shrinking everything down and then just piling it full of stuff was a lot of fun. (loud gunfire) - The first time I saw one of those, I think it was Ted Backman''s concept. I just thought, "I can''t believe that I get to use a creature this cool in level design. These guys are really, really, really fun to use. - [Ted] I remember Kelly Bailey had created a short list. Things like he wanted Flocking Flyers and he wanted a moving guard tower, which was the first description of the Strider, was a mobile guard tower. So I saw that and immediately understood that, kind of orchestrating the enemies in that way, trying to get the most variety and the most breadth of shape and movement and experience was the correct way to move forward. - The design for that first strider map, it was something I came up with and I was really passionate about. It was all about running across and just getting one shot in your tush, right? Just as you made it through. - [Dario] Even just hearing the sound, the thump, thump, thump of them walking, you know, "Okay, there''s a boss nearby." You just see the legs walking by, but you can''t see the body. There are so many things you can do with these guys. - Honestly, there were still people on the team I think that were still thinking that we were gonna bomb, that was people are just gonna not be impressed. - When did you know it was gonna be good? - E3. - Yep. - E3. - I''d say the same thing. (loud rapid gunfire) (monster growling) (loud rapid gunfire) - Oh my god! (loud rapid gunfire) Help! Help! - Yeah, it seems like at some point there was an E3 demo that we got together that we didn''t end up showing, but at least at that point it just felt like, "Oh, wow, we actually have made something here." - We went through and made a bunch of demos for 2002 and everybody looked at ''em and was like, "Eh, we''re still not confident about this and we don''t think we''ve hit the bar, so we''re not gonna go at all." They had totally planned to go. And then when 2003 rolled around, I just remember everyone was still terrified. We were like, "Okay, how are we gonna craft everything we''ve had into a number of messages about what this product is?" And we came up with like the core theme of each one of these movies. - Oh, do be careful. - We didn''t really understand at the time, I think, the embarrassment of riches that we had. We looked at it from two angles. One was a set of technical features, a sort of conceptual listing of things that we thought were important, like physics and things like that, and then the other side was content based. What areas of the game were innovative, what areas of the story we thought were compelling, which characters we thought were worth people paying attention to. And so it was an interesting sort of marriage of which features and which content are the best showcase for all those things. A lot of what was in the demos was rendering technology, but I think the stuff that felt the