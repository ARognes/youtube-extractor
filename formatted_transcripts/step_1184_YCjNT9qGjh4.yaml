ll be able to distribute software over the internet." And have people just say, "No, it will never happen." I''m not talking about one or two people, I mean like 99% of the companies we talked to said, "It will never happen. Your retail sales force will never let it happen." But also people would say, "Users aren''t gonna want this," right? "People want physical copy." There were so many bad faith arguments that were being made. Retail sales is not the goal, right? It''s actually an impediment, it''s somebody who sits between you and the customer. - And we ended up going out, finding this company called Applied Microsystems. So we ended up hiring most of the original Steam team from that other company to build initially this sort of in game advertising streaming model, but then there was the epiphany that, "Hey, it''s just bits. Why don''t we just download whole games this way? You guys go off and do it." - The decision to not only use Steam to ship "Half-Life 2" but actually to require Steam, even in the versions that were purchased at retail in a box, was the most interesting decision of all those because it turned out to be an incredibly important decision for the future of the company. And a lot of us were nervous, and a lot of the people who had been at Valve for a long time since the very beginning were the most nervous about that decision. And so it was one of the rare exceptions to our decision making process usually, and Gabe had to really step in and say, "No, actually we''re doing it this way." (music fades out) - I remember coming to work in the morning, working on "Half-Life 2," which meant by the time you go home at night, me being a 24-year-old idiot, all I wanted to do was keep working on the game. And I started just making the game work on multiplayer, right? Mostly just working on prediction. Like, what would it feel like to have a gravity gun on a multiplayer setting, right? Getting physics objects to work. And it was just curious curiosity. Scott Dalton saw me working on it and he''s like, "I''ll make a map and then we play." Put the map up, we started playing in the office in between builds of "Half-Life 2," like play test. And I remember Gabe walking by my desk and I remember him going like, "What''s that?" And I said, "Oh, it''s ''Half-Life'' multiplayer." And he''s like, "Show it to me tomorrow." And he just walked away. - [Robin] I think that is one of the advantages of the general cost we always pay to keep our code in a single code base. So when we''re working on "TF 2" and "Half-Life 2" at the same time at that point, we''re paying this continuous cost in "Half-Life 2" for the fact that it''s built upon an engine that''s designed to do multiplayer. But it means that when you get to this later point where you start asking, "Well, can we build multiplayer death match outta this?" The code''s all sort of built upon a fundamentally client-server sort of foundation. (loud gunshots) - Definitely the most entertaining thing that you could throw at somebody that happened to be scattered around the world was picking up a toilet and hurling it at someone''s head, and then having that show up in the upper right corner of your screen with name, toilet, name was very satisfying. (automatic gunfire) - [Adrian] I was also selfishly trying to get the game ported to multiplayer so then we can release the tools, the SDK ready to go. Like it meant mod makers could just immediately start making multiplayer game mods rather than waiting for us to do it or someone else to pick it up. (loud automatic gunfire) (character yells in pain) - We were so heads down working on what we were working on we didn''t really get a chance to play the train station. - I remember that that was one of the lessons that came away from "Half-Life 1," is like, "We need to be building these games backwards in a sense." The first thing we''re gonna put in front of people is the thing we built when we''re as good as we can be at it. We know our tools and things like that, and a lot of the anxiety over, "Are we building a good game?" was behind us and I felt really confident. "Yeah, we''re building a really good game. (tense music) (aircraft whirring) (tense music continues) - We''re entering the Gare d''Austerlitz, and this train station is very important because it''s one of the main inspirations for the train station of City 17 where the player starts. The reason why I''m using a Parisian station produced by Eiffel, who did the Eiffel Tower, is that there''s an identical station in Budapest. - Train station''s the last bit we worked on, right? And we always want to build the start of the game as late as we can ''cause we understand our game at that point. - In general, the train station was a really interesting problem because it was basically one big choreo sequence intended to deliver atmosphere and story and background and sort of set your expectations for the world. - We let the level designers who were really good at this stuff figure out what was a good experience, and then we were kind of always there to provide dialogue, acting, stuff like this guy. - [Bill V] I think it was pretty clear too that we wanted to provide incentive to the player at this point about how people were being mistreated, about how bad the situation was here, and kind of start to trigger that righteous indignation early. - All this stuff is fun to look at, but you just assume it doesn''t move and you can''t interact with it, you can''t pick it up. Because all the stuff we''re gonna do later with the gravity gun and everything, first we gotta start just mundane stuff, like that little empty bit of food. - [Adrian] I mean, it happens the moment you leave the train, wind comes and blows all the trash away it. - Doing it everywhere. - [Adrian] Can see the Vortigaunt sweeping, the guy pushing on the cases. - [Robin] Yeah, and all those things fall off and you can pick those up. - We were like, "If it doesn''t have to be bolted down