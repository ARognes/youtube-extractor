rd and dedicated RAM, you're generally going to have a smaller amount of VRAM to work with because it's dedicated just to the graphics card, but it'll often be slightly faster. But for the most part, the most important thing is how much RAM you have because when you take a model and you try to load that model on your computer, what it does is it takes this entire model, all the parameters, everything and it tries to shove it directly into your graphics card on your computer inside of that RAM. So, let's say that you have a GPU that has 16 GB of RAM inside of it. That means that you can only fit a model that can fit within this 16 GB of RAM and then includes all the additional context and everything that model needs to run based on your code base or whatever else you're trying to do. Now, let's say for example that you have some model that you're loading and it actually is larger than 16 GB. It goes past your GPU's limit. What happens is it'll fill your GPU as much as possible, so it'll fill that 16 GB, and then it's going to go off to the rest of your computer where you have your normal default RAM, and it's going to fill in the overflow inside this section as well. So, it's going to take all that extra overflow and put it directly inside your RAM here. And this is why we have really expensive graphics cards and RAM right now because all the AI processes, they need graphics cards and they need RAM. So, essentially it's being raised up in price because all the AI model producers are trying to get as much graphics cards and RAM as they can to support their models. Cuz the bigger models need bigger graphics card RAM, and they need bigger computer RAM to be able to store all of that really complex information. So, really the key takeaway is when you're trying to look at what model is going to work for you, you need to take into account how much RAM your graphics card has, as well as how much RAM your computer overall has. These are the two different things that you really need to focus on. And again, if you're on a system with unified RAM like a Mac computer, that's going to be the same number. You're going to not have this computer RAM over here. Everything is going to be RAM that can be used for the graphics card, so it's most likely going to mean that you have more space on your graphics card, but it's shared between your computer. So, once you hit the limit, there's no overflow. That's just the maximum you can do. Now, if you're on a Windows machine and you're unsure how much RAM you have inside your graphics card, you can just pull up the task manager, go to this performance section, and where it says dedicated GPU memory, you can see mine has 16 GB memory. I have a quite new graphics card that's a little bit higher end. Yours would say whatever number it is. And then you have your actual memory here. This is your system computer where all that overflow space is going to go. And I have some pretty high-end specs cuz I use my computer for video editing, so it needs some higher-end specs. But I'll show you how this will work on lower-end specs as well. So, now let's figure out how do we get this set up now that we understand kind of how this model works on our computer. The best and easiest way to get started first, I recommend, is going to be LM Studio because it has a really good user interface that makes it really easy to understand all these more complex things about RAM and so on. Everything is explained really well inside of here. So, I would recommend downloading LM Studio. And once you have that downloaded, a really good place to find models is going to be Hugging Face. But, the nice thing about LM Studio is they have their own model browser inside of it. Now, when you first download LM Studio, it's probably going to look something like this on your screen, and you're not going to be able to do anything. When you try to click this up here to select a model, yours is going to be blank cuz you don't have any models at all