t go into this chat window here and you can see at the top it says select model to load. And from here I can choose any model I want. Now, I 100% recommend at the bottom here where it says manually choose model load parameters, toggle that on cuz that's going to allow you to fine-tune exactly the parameters of your model that you're choosing to be able to use. So, let's say that I wanted to use this model GPT-OSS-20B. This is a model that is quite large. It's got that 20 billion parameters. As you can see here, it's around 11 GB for the quantization that I have downloaded. And since I have 16 GB of RAM in my graphics card, I should be able to fit this entire model on my graphics card. So, when I click on this, you'll see I get a massive list of all these different options. This is what I talked about when I said that you wanted to have that enable advanced options. That's what gives you access to all these options. For the most part, I wouldn't worry about very many of them. Just make sure that this GPU offload, if you can fit the entire model on your graphics card, max this out to the very top. That just makes sure that the entire model loads on your graphics card and not on your CPU or system RAM. This is going to give you the most amount of speed possible. Next, you can modify your context length. And you'll notice as I increase this context length, this model up here for the total amount of space it takes up is going to increase as you can see. Now, this isn't 100% accurate. If I max out this context length, it's probably going to take up more space than I have on my graphics card. So, I'd recommend trying to set this in a good middle ground. Now, if you're just doing basic chat, you don't really need that big of a context, so we can just leave it down here somewhere like maybe 5 or 10,000. And then I can click that I want to load this model. So, just make sure that GPU offload is maxed out if you can fit it, and then set the context to somewhere that works for 