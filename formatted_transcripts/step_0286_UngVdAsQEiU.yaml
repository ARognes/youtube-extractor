rk so hard. So, that's everything related to setting up essentially the chat portion of our models and loading the models on our computer, which is going to be really useful for when we want to set up autocomplete and agentic workflows. These MoE models are the best possible models for trying to get the most amount of power out of the least amount of hardware, and you don't need super super powerful hardware to run all these models. The ones I've been showing you right now have been some of the Sultan larger models, but you can see like this model right here only takes up 1 GB of space for your VRAM, and any graphics card, even incredibly old ones, are going to be able to run a model like this one. So, if you have more limited hardware, you just have to scale down what particular models you choose, but if you have access to some of these MoE models at a high quantization, which again reduces the size while also slightly reducing the quality of the model, that means you can actually run some decently large models on even relatively blackluster hardware. Now, most often you're probably not going to be interacting in a chat-based way. If you are, everything works pretty easily, but what you want to do is you want to set up autocomplete, and you want to set up agentic coding. Those are the things that you care about the most. So, to do that, if you see this little developer button right here, this is where we can actually load up models to use directly inside of other programs on our computer. And if you don't see this developer tab, that means that you needed to make sure when you installed LM Studio, you clicked like the show developer settings. So, if you don't see this, just go down to your settings here, and where it says developer, just make sure to toggle that developer mode on, so you should be able to see all these different developer settings. Now, this is where we can actually load multiple models onto our computer. Right now, there are no models being loaded