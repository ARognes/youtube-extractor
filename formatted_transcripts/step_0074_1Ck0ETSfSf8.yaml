transcript: For any question, your answer will tell you what level the other person is. So, I'll give you an example. I have a story where I disagreed with the vice president. What level do you think I would be? >> Principal level? Yeah. >> [laughter] >> The level of the belligerents, if you will, the people that are involved in the story, it really matters. Like, if you disagreed with a principal engineer, that kind of makes me think like, "Oh, okay. Well, this guy can actually push back against a principal engineer." I think that's great. If you're like, "Oh, there was a mid-level engineer that didn't like an aspect of my design." I think you're playing at mid-level engineer stakes.
