transcript: When you play the demo the promise section ran way worse and was hard to play on your PC. Um is promise likely to keep running much worse? Okay, so here's what I would say. Firstly, um if you play the So, we already shipped a bunch of performance improvements for lower end GPUs. They're on a beta branch on Steam. Um you know, we tweeted how to get to that, but you can also, you know, it's just in the menus and if you can't find it, you can ask your favorite AI how to do that. Um but there's a a beta branch called public testing. So, if you try that out, you could let us know, you know, probably on the Discord channel um if that's working better for you. If it's not working better for you, we would like to hear it, right? Now, that said, um there's also there's just a variety of different GPUs. Um the promise section definitely has a different thing going on than a lot of levels. I mean, I suspect, especially when you try to go into the overhead map, it's probably slower, right? Cuz that's when we're drawing everything at once. And um you know, at some point at some point we've done everything we can do. But but we certainly hope that we've done enough for your particular GPU and you you could try it and let us know. Um Now, the the other thing I would say, okay, well, the the thing that's curious about what you're saying here is you're saying promise ran worse even than the overworld and I wouldn't expect that. I would expect the overworld to be the slowest place. So, actually, if promise still runs slower than the overworld, there might be a bug that's happening just on your class of GPUs that we could address. And so, let us know if that's still true. Um cuz certainly we would like to know that. It's, you know, releasing a game for PC is kind of nuts because just the amount of combinations of CPU and GPU and like monitor that people have out there in the world is truly insane and you know, when we make a game we just have to deal with all of that somehow and we do it, but you know, man, it's it's a lot to deal with, but um, you know, this is the plight of the PC game developer in 2026 and we're doing the everything we can to make the game good. Like I said, it's already it already runs, I mean, the demo ran great for most people, but uh because we hadn't done our lower-end GPU support yet uh by the demo release, um [snorts] some people uh with certain classes of GPUs just didn't get good frame rates. Um part of that was code optimization for those specific GPUs and part of that was having more options in the menu about uh lower quality settings for the game. And now that both of those have happened, so that should open up a lot for people.
