transcript: This is called a zombie attack script and it will absolutely bring your computer to its knees. So in this video I'm going to run this script. But first let's explain how it works. This is a bash script and this while true do line is an infinite loop. It will just keep running forever. Now this no hop yes line is actually really interesting. First the yes command. This command repeatedly prints y to the standard output in an infinite loop. Then we push that into dev null which will discard the output. Now two greater than n% one redirects the standard error to the same place which discards it and no hub makes this process immune to sig hub meaning it won't close when the terminal closes. And then finally the amperand at the very end will run this yes process in the background. So each time through the loop a new background process gets spawned running yes. This yes process is detached from the terminal spawning output into the void and the loop just runs through again. So why is this called the zombie attack? Well, it spawns infinite background processes like a zombie horde and each yes process will consume more and more CPU since it's constantly printing stuff. And since it runs in the background and doesn't wait, it can quickly overwhelm a system by maxing out the CPU cores, hitting process limits, consuming all the memory, yada yada yada. All right, that's enough talk. Let's actually run this thing and see what happens. Now, of course, while it's running, we don't see anything because all the output is pushed into dev null, which means it's just in the void. So, we have no idea what's happening. But if we open up a new tab in our terminal here and type something like btop and let's just see what we've got going on here. We can see that our CPU is now currently maxed out and all of our cores are maxed out. This thing is taking up all of our systems resources. So in order to kill it, we can actually control C out of it. And I want to type ps-af gp for yes. Well, actually nothing's working. So I'm going to turn off my computer and I'll see you later. Subscribe for more Linux tips and tricks.
