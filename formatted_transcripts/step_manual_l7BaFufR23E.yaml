d it''ll shut off\n[411.919s] your mind and you will stop thinking all\n[414.08s] things. So, literally, I want you all to\n[415.759s] think about 30 seconds ago, your mind\n[417.84s] was thinking about what I was saying,\n[419.84s] right? You had maybe all kinds of\n[421.759s] skepticism or this guy doesn''t know what\n[423.36s] he''s talking about or oh, maybe this\n[424.8s] will fix me, right? You have all kinds\n[426.08s] of thoughts happening. But when I tell\n[427.759s] you to shift your attention, you\n[429.759s] concentrate on the nose and all of those\n[432.0s] thoughts go away. So, the first key\n[433.919s] skill that athletes develop is the\n[436.479s] ability to shift their attention away\n[439.599s] from unproductive thoughts to other\n[441.759s] things. There''s a second thing that is\n[443.52s] very important for athletes to learn how\n[445.28s] to do, which is to regulate their\n[447.199s] emotions. Now, this is why this is so\n[449.12s] important because a lot of people don''t\n[450.4s] realize this. See, we tend to think that\n[452.72s] logic and emotions are like separate,\n[455.28s] right? So, like, oh, I''m not very\n[457.039s] emotional. Like, I''m a logical thinker.\n[459.039s] I''m a critical thinker. But if you''ve\n[460.8s] ever seen a debate about politics, both\n[464.0s] sides believe they''re perfectly logical\n[466.56s] even though for some reason they''re not\n[468.72s] able to see logic, right? You can look\n[470.96s] at problems like, you know, dating or\n[473.039s] the manosphere versus like the feminist\n[475.44s] circles or pink pill versus red pill or\n[477.599s] whatever. There''s just a lot of like\n[479.28s] people who think that they are\n[480.72s] completely logical, but they''re not. So,\n[483.039s] here''s the key thing to understand. Our\n[485.12s] thinking is controlled by our emotions.\n[488.479s] Like literally. Okay? So, if you look at\n[491.36s] the emotional circuits of our brain,\n[493.36s] they are so potent at sh