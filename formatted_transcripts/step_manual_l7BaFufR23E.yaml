e because of\n[161.84s] private equity. I''m I''m not going to\n[163.36s] think that way anymore. And if you try\n[166.08s] to do that, it simply doesn''t work. The\n[168.8s] cool thing is that there are a couple of\n[170.8s] things that you can do. And when I work\n[172.879s] with someone, my goal is to teach them\n[175.84s] the skills that high performers\n[178.56s] basically have internalized, what\n[180.4s] they''ve learned how to do, what they can\n[182.64s] control. So let''s start with this\n[184.08s] example from Lewis.\n[185.28s] >> Do we generate a thought or is a thought\n[187.36s] generated automatically?\n[190.239s] >> What are you thinking?\n[191.04s] >> I''m thinking you''re touching my leg.\n[192.64s] Yeah.\n[192.959s] >> Did you have control over that?\n[194.239s] >> I can think a different thought when it\n[196.4s] happens. I can shift the thinking.\n[198.08s] >> So this is a key thing to understand.\n[199.84s] You can''t control what pops into your\n[202.239s] head, right? So when when I''m touching\n[203.68s] Louiswis''s foot, like he can''t control\n[205.28s] like, \"Oh my god, this guy is touching\n[206.8s] my foot.\" And that''s like the problem in\n[208.64s] life, right? So you text a friend of\n[210.799s] yours and then they don''t text you back.\n[213.2s] And you can''t control the thought that\n[215.76s] pops into your head. But what you can do\n[218.56s] is shift your attention away from it.\n[221.68s] And this is one thing that is huge.\n[224.48s] Separates people who are like broke from\n[227.12s] people who are billionaires. the ability\n[229.36s] to shift their attention away from\n[231.599s] something. So, I''ll give you all kind of\n[233.28s] a simple example of this, right? So, I\n[235.36s] can''t control what is on the different\n[238.08s] channels on TV, right? There''s a news\n[240.239s] channel. They''re going to play this on a\n[241.84s] particular day. There''s a murder mystery\n[243.519s] channel. There''s the Discovery Chan