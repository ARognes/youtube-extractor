transcript: So, um, yeah, I got really, really lucky. Wound up, there's a government program to teach in Japan and headed out there and wound up in Kyoto and then Osaka, which um, I'm a big fan of Birmingham, the the UK city, and I always say Osaka's sort of the Birmingham of Japan. Just great, great places to be. But, wound up picking up a little bit of extra work after I finished the government contract. So, did some technical writing. And as part of that, I was like, "Oh, cool. Programmers over here seem to get paid, y'all get paid double what I do? That's nice. What do you do? You just It's just different words, huh? Y'all are just building stuff with different words." It seemed difficult, but maybe not impossible. And having that space and being further from a difficult situation meant that I had that space and time to, "Hey, maybe I want to try this." And it worked out pretty I feel pretty lucky with the way it turned out.
