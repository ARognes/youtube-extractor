transcript: This is Ahmed. He's an ex-AWS senior engineer with 12 years in the industry and he's trying to break into staff. Ahmed has the stories to get there. Four-week migration with 20 partner teams, a disagreement with a principal engineer, 2 years leading a project end-to-end. But, like a lot of smart engineers, he just doesn't know how to tell them in a way that sounds staff-level. I'm Steve Win. I spent close to 20 years at Amazon. I made it to principal engineer. And as a bar raiser, I personally conducted nearly a thousand interviews. The three things that I'll help Ahmed fix are making sure he actually answers the questions being asked, telling stories that indicate that he's at the staff level instead of senior, and communicating scope so his stories actually land with impact. If you're in the Seattle area and want to be featured in an episode, a link to the application is in the description. Let's get into it. Ahmed, thanks for coming in today. What's the thing that you're the most afraid about when it comes to interviewing? >> Basically, when it comes to behavioral interviews, the most thing that get me nervous and worried about is how can I get the right answer for exactly that what the interviewer is looking for. So, once the interviewer has a question in his mind, I have lots of situations that came to my mind from my past like 10 years. But, sometimes it feel like does that the really the things that the interviewer is looking for or actually I should think about something else. And sometimes I'm worried that I start to speak about the situation and I have like my train of thoughts going very smoothly. Then I figured out, "Oh, no. Does that really answer your question or not?" So, that's what's getting me nervous about the behavioral interview. >> Okay. Don't worry. There's uh you know, I can totally help with that. Let's pretend it's a real interview. And then um we'll go through a bunch of questions and then after that we'll debrief and then I can give you a plan for for helping out your with your problem. Sound good? >> Sounds good. >> All right. Let's do it. So, to start off, can you tell me about yourself, Ahmed? >> Sure. So, my name is Ahmed. I'm a senior software engineer. I have been in the industry for almost like 12 years right now. So, I started my career back in Egypt. I started like junior engineer working in a couple of local companies. Then I joined the AWS. That was back in 2016 in South Africa. I spent there about 3 years working in AWS. And then moved here to Seattle just before COVID like almost end of 2019. >> Yeah. >> And I was working as AWS health work. So, I got promoted there two times until I became like senior engineer and I just left Amazon couple of months ago. >> Okay. How long were you a senior engineer for? >> Almost 3 years. >> And then how long have you been in Seattle for? Sorry, was it 20 right before COVID you said? >> it's almost like 6 years now. >> Okay. All right. So, let's just jump into the behavioral interview. So, since you're interviewing for a staff position, something like that. Tell me about a time you had a conflict with a teammate or a manager. >> Are you looking for the result or the situation itself and how I dealt with it? >> Both. >> Both. Okay, sure. When you mentioned that I had like some stories that came to my mind and one of them I can't pick as I have been working on a design and I had a conflict with one of the engineers reviewing my design like a teammate basically and we like some discussion and argument and we went through this argument like by discussion with a senior engineer in the team. And this time I wasn't senior engineer. I was like SD2 level engineer in Amazon. And we worked through this discussion together. We had some discussion with other senior engineer and the team members as a manager in the team until we resolved the conflict. I can't go to some details but just want to make sure that that and that kind of situation that you're looking for how I dealt with that. >> Yeah, what was the conflict? >> The conflict basically I had that this I was working on a design and I came up with a solution that can it's a little bit complicated, but um not not complicated, but require more works and building more components because I saw some potential issues on the simple way that everyone thought about and after research and experiment I I figured out that that will be a potential issue in the future. So I wanted to basically protect us from that and came up with a little bit not complicated design, but more like require building more components and require more work to to get it. I wrote a design document and came up with evidence uh and some experiment from what I did and um came up with a different solutions. One of them is a simpler simple one, straightforward one, and the other one that require more work and um reviewed with a team, get some feedback, get basically some questions about okay, how did you experiment that? What was the issue that you expected from this solution? Um simple one basically and um what your call basically because I came up with a different solution and I have to came up with a like one pick one uh solution. We discussed that as a team. I managed to convince most of the team except one engineer who thought like, "Okay, no, I don't think that's right." >> That was the senior engineer? >> No, he wasn't senior engineer. >> Okay, so another mid-level engineer. >> Yeah, at this time, yeah. And uh like started to discuss that and he went to do some homework basically to prove that his point correct. I went to do my homework to prove that not to prove my but more research. Like, "Okay, maybe he's right. Maybe I was missing something. Will it be actually an issue or I'm just overcomplicating the solution just to make my design more fancy." So I was convinced, he was convinced, we had an argument about that. So we said it like, "Okay, let's go to the senior engineer and see what he thinks about that. We had discussion with the senior engineer. He was more aligned to my solution because he was convinced that this actually the simple one will be mainly like bite us in the future, basically. If we went with that, bite us in the future in terms of potential data loss, in terms of potential overhead and on-call and ops work. So, we had a discussion as a team with the senior engineer and the manager and we decided like okay, that's basically that out that we're going to take as the suggested solution. So, we went and implemented this way and it during the release we one of the steps is basically to make a load test and during the load test we figured out that okay, the other solution, simple one, would cause more problems if we went with that because the the system would not behave on the way that we want with this data load. So, as a result of that, we had like a real tangible example that this solution, the one that I came up and convinced the team was, is the one that we should go with to the production. We we did that and we deployed and it was sustainable on the in terms of like after we released it was reliable and sustainable as we expected. >> Okay. Here's where almost everyone loses the interviewer, the opening. Most people start a story with a ton of background about the company, the team, and the technology involved. It just takes way too long to get to what you did if you start this way. You want to flip that around. The first sentence out of your mouth should be the entire story compressed into one line if at all possible. In my book, I call this the headline and it's the most important sentence of your entire story. Your goal is to name the problem you faced, the action you took, and why it mattered. Something like, "Let me tell you about a time when I discovered our processing delays were caused by database locks, not the network issues everyone assumed. And I fixed it by redesigning our update logic, which sped the system up by 16 times. That one line confirms you understood the question and signposts exactly where you're taking them. The trick is that you want to reverse engineer the interviewer's notes. You hand them the sentence you want them writing down, then you pause and let them steer. I break the full structure down in the book. Back to it. >> So, for that example, how do you think you did? Was it a good example? >> I think, yeah. I think it's answering the >> staff-level example? >> Uh it's staff-level example. Um in terms of No, I No, I would say like some of type of behavioral questions, I think maybe they are kind of the same for some levels. In terms of like that's why I asked you the question is like what actually looking for from the conflict level. Like how How big is the conflict should be? Will it be like technical or will it be strategy conflict or will it be >> It can be any type of conflict. >> Okay. >> But I think for any question, your answer will tell you what level the other person is. So, if you told me like, "Hey, I don't know what level Ahmed is, but here's his answer to this question. Tell me what level he is." >> Mhm. >> What level do you think that Ahmed would be? >> I would say like senior. >> Senior even though the You basically said, "Hey, the answer to this question is we went to my senior engineer and he agreed." >> that's a good point because one of the things that I think it makes sense to discuss is like how far I should go with our examples. So, immediately I >> Yeah, no, we can we'll get there. I think the big thing here is I think that's a really solid mid-level answer. >> Mhm. >> I actually think that it's not a good senior-level answer and it's definitely not a staff-level answer. >> I did because I mentioned that we went to discuss with senior engineer. >> That's one of the reasons as well. >> Okay. >> This episode is brought to you by Linear. And they just published something that I think is worth talking about. They opened with the new manifesto, "Issue tracking is dead." And what that means is that the behaviors around it, like the manual logging of issues, the prioritization back and forth, the grooming sessions, where half the room is just trying to figure out what's even in the backlog, these things are a thing of the past with Linear. I lived this nightmare at Amazon. We had mechanisms for everything. And don't get me wrong, I'm a big believer in mechanisms, but more often than not, the process of tracking the work took as much energy as doing the work. You'd come out of a sprint planning meeting and think, "We just spent 2 hours so eight engineers could figure out what they already knew they needed to build." What Linear has done is rebuilt the platform so that the stuff happens automatically. Your code, your decisions, your customer feedback, all of that context all lives in one place, and Linear actually works from that. So, when something comes in, the system already understands what it is and where it fits. Nobody has to triage it manually. If you're an engineering leader and you want your team building instead of administrating the work, check out Linear. The link is in the description. So, I'll give you an example. If I were to answer that same question, I have a story where I disagreed with the vice president. So, if I just on the surface, if I told you about a time where I disagreed with the vice president, I didn't uh report into that person, but I disagreed with them, and I had to interact with him and all of this other stuff, what level do you think I would be? >> Principal level? >> Yeah. Right? And so, I do think that the level of the belligerence, if you will, the people that are involved in the story, it really matters. If you disagreed with a principal engineer, that kind of makes me think like, "Oh, okay. Well, this guy can actually push back against a principal engineer. I think that's great." >> Yeah. >> Right? If you're like, "Oh, there was a there was a mid-level engineer that didn't like an aspect of my design," I think you're playing at mid-level engineer stakes, just on the surface of it. >> Mhm. >> Right? So, that's one thing. I I think if I were you, I would I would think about like an example where there was a conflict or a disagreement for as high of a level as you can you can think about for your experience. Okay? But, let's just take this example and and flesh it out. So, that's the first thing. The second thing is in this example, you turned out to be right. I think what you want to do in in a lot of these situations is to talk about how the other person could have been right >> Mhm. >> as well. Stories where you're obviously right and they're obviously wrong, um they don't tend to be good stories because the reason people ask this question is they're going to go and hire a bunch of smart people. And they're going to put all of these smart people in the room, and then they're going to be Of course, there's going to be conflict there. We used to have like a weekly principal and senior principal meeting in my organization at at Amazon. We didn't agree on anything. Right? That's just the natural state of things. Is there's going to be a lot of disagreement, right? And so, the the question is like, can we make progress despite the fact that there are disagreements? Or is like everything a hill that you're going to die on? Right? And it shouldn't be. One thing about your story is I would have loved to understand the choices here. I think what you said is like one side is like, "Hey, it's a slightly more complicated solution that's more involved and it'll take longer." And the other person was pushing back and said, "Do we really need that? Can't we just do the simple straightforward way?" I would have loved a little bit more detail there, and I might have asked it in a follow-up, which is just like, "What was the consideration? What was the thing that they were really pushing back on?" Like, complicated versus not complicated isn't the right framing. You would said something around data loss. Like, maybe I would expand into that. What's one more layer down without going into crazy detail? What was the actual trade-off? What was the the basis for the disagreement? >> Basically, is one of the solutions that will require more storing the old data and compare against them rather than just go on the fly and rely on the basically that downstream that we're using that will sustain and load. >> You wanted to build like a version store at least like keep the old values. >> 100% yeah. >> And then he's basically like no, let's just update everything when we need to update it. >> Yeah, just trust the downstream and that they can scale and >> Was it like a control plane of some sort? >> Yeah. >> Okay. So the way that I would say it is I think you were you were you were trying to you wanted to say really really high level with the disagreement because you didn't want to get into all of the details, but I think that's a false dichotomy. You can just go one layer down in terms of the details so that we can frame the disagreement a little bit more without going into okay, he wanted to use consistent rights and you know, and I wanted to do like eventual consistency or whatever. Like we don't have to go at that layer. >> Yeah. >> But we can just go one layer down, right? So you could have said something like hey, we were working on a control plane system, clients call in and uh set their values. Uh I wanted a a more robust system where we kept like the old values in case they wanted to roll back, maybe a little bit more guardrails so they couldn't shoot themselves in the foot. >> Mhm. >> And my uh my colleague said like, why would we waste our time with that? We need to trust our clients more and they know what those values are. If we get pulled into every update, that's just going to overload our team. Why can't we just push something out that's a little uh more simple and then we can add more later on more complexity later if it's needed. I think that makes it sound like oh okay, well there's two rational people that have a real choice in front of them. Nobody's right. In a sense you like your colleague was also right. >> Yeah. >> Right? And so whenever we talk about conflict, we have to talk about we just had a difference of opinion. It wasn't like I was obviously right and he was obviously wrong or vice versa. You also talked about escalating it to like a senior engineer. That's the thing that was a yellow flag. It's just like why does everything need escalation? And so I think part of me would have been like, "Hey, we tried to work it out on our own. We weren't making any progress, and so I was like, hey, let's just how about we just go to our senior engineer? You know, we can both make our case and then they can choose which one is right." >> Yeah. >> Right? Instead, the way that you positioned it was like, "Oh, I went we went to the senior engineer, and obviously he was on my side >> Yeah. >> cuz we're thinking about the future, right? So that's that's kind of a little bit more like, "Yeah, I'm definitely right. This guy's not right." >> I think makes sense. To some extent, I was trying to avoid this route to saying like he was wrong because one of the things that I mentioned is I want to do my homework to make sure like I'm not missing anything and he could have been right. >> Mhm. >> So that's what I was trying to do. Maybe the words didn't serve me well here, but I was my intention was trying to avoid this route because I just hate to say like I'm I'm right and he's wrong. >> But the thing is, even if you went to go do your homework, it also sounded like you went to go do your homework so that you could argue that your side was right. Maybe you could have done some homework and then shared the result with the person that disagreed with you. Instead of just being like, "Hey, obviously this is correct, and then I escalated to my senior engineer, and he thought I was correct, and then I did the homework, and then um you know, I had results and data, right? You could have just been like, "Hey, I tried to make my case. I went and got some data. I presented that data to him. He still wasn't budging, and then only as a last resort did we escalate." I think it's a good example for an SD2. I don't think it's a good senior-level example, and I don't think it's a good staff-level example. But I think if you were trying to if you were going to keep this story, that's how I would position it. Do you have an idea for what you would an example that would be senior or staff? >> Yeah, I think I have much better examples. >> If you have an example where you push back, you have a disagreement with a principal engineer at Amazon, I would so much more prefer that than one where you were like wrestling with another mid-level engineer. >> first one that came in my mind, but >> Instead of you delivering that, um, let's workshop the story so we can start off on a good foot, right? So, can you give me the headline for this story with the principal engineer? >> So, basically, the summary for it is was I was working on a big project. I had an idea how we can came up with a solution that we can protect basically our downstreams from taking more ownership on how they manage the data on their side, so we can we can leverage our data that we consume from like our, uh, upstreams, so we can protect down downstreams because we already know how they, uh, suffering kind of from their service. Like, it was a legacy service and they were basically suffering from some data load on their side and how they keep it consistent. And this was like a we we were in the same org, so it was like a strategy level, uh, thing on the org to how we can, uh, protect this service from being overloaded with data. >> Yeah, I So, for this story, like, let's start with the conflict. >> Yeah. >> Right? >> Yeah. >> Again, we want to do just-in-time con- context. >> Yeah. >> I think I understand your side. Let me tell you about a time where I thought that my, you know, my team was in a spot where we could do more for our downstream clients so that they didn't have to worry about all the overhead of maintaining this data or whatever it was, but my principal engineer thought >> Let's don't do it. Basically. >> Yes. Because >> Because that's, um, that's kind of make our service a little bit complicated that we going to deal with we going to deal with some situations in the future in terms of how data is stored in our side of persistent that they are basically built for that. Their service built for that. They have the capability to do it. >> Okay. >> Like, although they are maybe suffering from it a little bit, but if they let's fix it from there instead of I don't know on our side. >> Yeah, so I would say something like, you know, let me tell you about a time when I disagreed with the principal engineer. I thought that my team could do more for downstream clients and that we could manage a lot of the data and the workloads for them and that would make them sort of happier with us. They would have to do less. But my principal engineer thought like, let them do that work. That's part of their responsibilities. You shouldn't actually be doing all of this stuff. I don't even need to know the underlying like data architecture. I don't need to understand what the the processing is. >> Mhm. The interesting part is this disagreement that you had to work out with the principal engineer. And you were a senior engineer at this time? >> Yeah. >> If that's the setup, if you could you know, tell the rest of the story, I'd be like, yeah, this guy's a staff level engineer, right? Depending on on what you did. >> Yeah. >> Okay, so let's continue with the story. >> So yeah, we we discussed about that and we came up with a strategy like, okay, let's let's not do it right now. So, I was convinced from that principal engineer that okay, maybe that's not the right thing to focus on right now. >> Mhm. >> Although like I've been think like it basically for me it was a disagreement on comment and commit. >> Okay, so you you disagreed >> with the sentiment that okay, let's let's not do it. Let's not fix it there. If they cannot do it, if they have to handle it, it's not our responsibility basically to do it. >> Mhm. >> And I disagreed on comment to that. So, I adjusted my design to basically have the idea there, but it's not something that we're going to implement right now. >> Mhm. >> We moved with our design. We implemented. We deployed production and maybe couple of months later, we figured out that they are suffering from it >> Okay. What was the why? >> Because they didn't have the capability to handle the load that we put on them. >> Okay, so part of this discussion is you were intercepting traffic from these downstreams. >> Yeah. >> And so you were like, we're in a better spot, we can aggregate all of the load. >> Exactly. >> We can handle it. And your principal engineer is like, no, just give them the traffic. They should be set up for it. You said your thing, and then and then you disagreed and you committed and you're like, fine, we won't do it. And then it turned out that you were correct. >> Yeah, it turned out that it's it was much easier for us to do it. Um less expensive and we can handle it much better because of our situation, not just because of how because basically the other service was legacy and they have to deal with other data storage issues. Uh on our side, it was much easier to do it. >> Okay. >> And um yeah, a couple of months later it ended up that we are actually implementing this solution. >> Okay. So then you went back and you did it the right way. >> Yeah. >> Okay. How satisfying of a story do you think that is, the one that you just told? >> In terms of what? Satisfying in terms of >> The interviewer, do you think that he would like that that story or not? >> If we break it down, um yeah, I think it was argument that I stood up to my idea >> Mhm. >> and I tried to showcase from what I think is right thing to do. After like discussion with the principal engineer, I had to disagree and commit. So I'm not really pushing Yeah. to my so not creating like bad environment. And I tried to push from So basically having if we think about that from Amazon principles, that's have a backbone and disagree and commit. >> Yes. >> And uh at the end be right a lot. So >> Well, it's more of a be right a lot for the principal engineer, not for you, right? Let's think about it this way. Um when you disagreed and committed and then did it the way that the principal engineer did, what would I think make this story really shine is that you turned it into a reversible decision. When you guys figured out that you needed to actually take the load and so you re-architected things to take the load from your downstreams. Was it relatively easy to do or did it take like was that a really big effort? >> It was another project um that me myself like they used my design but me myself didn't implement it. Uh so I wouldn't say like relatively easy but compared to the other effort yeah compared to the other effort that had to be done on the downstreams yeah to the other. >> So because it was easier what I would say is at the end of the day the principal engineer was the one that was going to make the call and so you know I had to disagree and commit after I said my piece but what I did was that when we were developing the solution we made it a little bit easier to reverse course if afterwards the traffic had to come to us. You probably did some things that you were just kind of like anticipating like hey maybe maybe if we need to reverse this decision we'll make it slightly easier. So when we implemented it we made it slightly easier for it to come back to us and so when it turned out that I was ultimately right two things here one is that you should make sure to not rub it in the principal engineer's face. I think it's a good idea to take it back to the principal engineer so maybe in the future if you have something similar just be like hey turns out when we made that call it wasn't the right one. Then you can just be like did we make the right choice or not? I think it's a really senior level thing to do to understand that we are all operating in this environment where there's some risks associated with our choices. We don't it's not a game of perfect information. We're not playing chess where everything is out on the board it's more like we're playing poker and there's some things that we see and some things that we don't see. So we shouldn't fall into this trap of looking only at the outcome but I do think that closing the loop with the principal engineer and saying something like hey there are some things that we saw and some things that we didn't see. Here's how it worked out. Did we make the right call knowing what we knew back then right and are there any lessons for us to it forward? I think if you were able to do that in your story, that really makes the story pop. Does that make sense? Was there a Was there a moment where you went back to the principal engineer and you were like, "What the heck?" >> No, actually it was the call from the principal engineer that he came back to me and said like, "Okay, I think we should have done it this way." >> Great. Okay, so that was left out of your story, right? >> I didn't mention that. >> Yeah, so again, I think the way that you positioned that is is really important, right? Just uh really punch up your story, we're going to say like, "Hey, during our implementation, we made it a little bit easier to reverse course, but I still committed and we did it the way that the principal engineer wanted." And then you can be like, "Hey, turns out I was right. It's okay I didn't rub it in his face. He came back to us. He came back to me." >> Yeah. >> And then we talked. What was that What was that conversation like? >> No, it was like smooth conversation. Like I had a very good relation with the principal engineer, so it was very smooth. Like, "Okay, it didn't doubt that we want to have this component on our side, so we would do it." >> Yeah. And because you had done a little bit of extra work during the implementation to make it reversible, it was totally fine. Yeah. If we can kind of like put those pieces together, I think those would be That's a senior to staff >> Mhm. >> like staff level example. You feel better about the the answer to that one? >> Yeah. >> Okay, good. >> Ahmed just told a much stronger conflict story. And the reason it's stronger is that he disagreed with someone above his level. But he left out the single best detail in the whole thing. After the disagreement, the principal came back to him and said, "Ahmed, you were right." And that they should have gone with his approach. That's the best detail and Ahmed almost completely dropped it. Here's why that's gold. There's a huge difference between you saying you were right and the other person coming back and telling you that you were right. If you say it, you kind of sound arrogant and the interviewer starts wondering whether you're the difficult one to work with. When the principal admits it on their own, it's exactly the kind of signal that levels you up because you showed the conviction to push back on someone above you, but still commit to the decision. The mistake Ahmed made is one I see constantly. People think that the disagreement itself is the story, so they stop that we ended up going with this plan or we agreed to disagree. But the outcome is the part the interviewer writes down. If your judgment got validated, especially from above, you have to put that in the story. Back to it. So, tell me about a time you delivered under really intense time constraints. >> Yeah. Remind me it was one of the biggest releases that I have done. So, we had a big project to deliver. And basically it was that the complexity of the