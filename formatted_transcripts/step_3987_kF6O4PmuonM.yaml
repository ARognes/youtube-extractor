transcript: "hiii !!!!! snail time :] \ni just love these guys. they're so pretty, cute, and interesting. and watching them move brings me peace.\n\nas some of you might know, snails are 'Gastropods,' which is a class within the phylum 'Mollusca.' classes and phyla are taxonomic groups, which are the different categories used to classify life forms (for example, when we say that bees are 'Insects' or that cats are 'Felines', we are talking about taxons).\nthere are many phyla in the animal kingdom, each very different from the others. for example, 'Arthropoda' is another phylum that i really love !\n\nanimals in the phylum 'Mollusca' are called molluscs. if that sounds familiar, it's because animals like octopuses, oysters, squids, and more are also molluscs. this means that snails are actually closer in terms of evolution and genetics to those animals than to insects like ants or crickets!\nstill, they are little friend shaped invertebrates on a tiny adventure, just like insects, isopods, and many more critters. \nthat's why many people, including myself, call them bugs. in spanish, we call them 'bichos' or 'bichitos' and i love that word. \naccording to Wikipedia: 'A colloquialism for any minibeast including arthropods, gastropods, and worms.' (i just learned the terms 'minibeast' and 'minifauna,' and i love them so much omg)\n\nnow, on to the music and drawings !\nsnails give me melancholic vibes. maybe it's because they appear on rainy days, maybe it's because they move slowly, or maybe it's because they just feel like very contemplative creatures. i'm not sure, but since they make me feel that way, the music ended up sounding a little melancholic toward the end, and i like how it turned out. :] \nalso, some of you might have noticed that the bass with the wobbly sound sounds like meowsynth.. and that's because it is! i love that synth, and i felt that given the shape and stickiness of snails it was appropriate to add a sound like that.\ni'm really enjoying the long track format, and i feel like this project benefits from it, like it adds to the 'little adventure' concept i'm aiming for.\n\nalso i hope u like the nature thingies that appear in the background !! there's more that i want to add in the rest of the bug tracksss.\n\nand i think that's all i wanted to say :D\nthank u so so so much to all my bug supporters on Patreon:\nLogan Miller\nAnnabelle Madison\nAubrey!!\nBeeble\nBen Connolly\nBrian Stauffer\nCapt. Saicin\nCarlos Araújo\nChocoboFluff\nCovinator\nDavid Lombardo\ngonzalo lerena\nKayleigh\nkit fox\nKlamny\nKrozee\nMario Robin\nMidnight Blurple\nNentessXZ\nnuclearwhale\nSelah Brooks-Powell \nThe Axolotl at Saturated Saturdays\nVikram Kohli\nwave_s\nand to all the level 1 bug supporters :DDDDD\n\nlove uuuu,, see ya soon\U0001F49A\U0001F30C"
