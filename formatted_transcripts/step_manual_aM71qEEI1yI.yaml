o it can help\n[327.199s] to elucidate that question by asking a\n[329.759s] counter question. Now this case is\n[332.0s] indeed somewhat similar indeed very\n[334.639s] similar to the previous case of the\n[337.039s] analytical\n[338.36s] breakdown. I I don''t know of anywhere in\n[340.88s] the sutas where the Buddha or somebody\n[342.96s] discusses the difference between these\n[344.639s] two ways of responding. But it seems to\n[346.96s] me that it probably depends on the the\n[349.12s] context and the people in the audience\n[351.199s] and so on whether one''s going to respond\n[353.84s] to a or whether one should respond to an\n[357.44s] ambiguous question with an a simple\n[360.16s] analysis, a breakdown, a a long\n[362.56s] discourse or whether one should respond\n[364.88s] with a kind of Socratic\n[366.759s] dialogue. If we think back to the the\n[369.759s] western tradition of of Socrates, he\n[372.639s] would respond in a dialogic fashion. In\n[375.039s] other words, responding with a counter\n[376.72s] question to try to elucidate what the\n[379.36s] person is really discussing, what\n[380.72s] they''re really after. And indeed, for\n[382.88s] Socrates, the the the general aim was to\n[385.199s] show that the person really didn''t know\n[386.479s] what they were talking about. They\n[387.759s] didn''t really know what they were after.\n[389.68s] For the Buddha, of course, that might be\n[391.36s] the case, but it might not. In any\n[393.12s] event, this is one way to respond to a\n[395.919s] question in an argument or a discussion.\n[398.16s] The fourth way that the Buddha had of\n[400.0s] responding to questions is a\n[402.8s] particularly prominent one for the\n[404.639s] Buddha. Indeed, the Buddha was really\n[406.72s] famous for this this method, which was\n[408.88s] the method of silence, of not\n[410.479s] responding, of not giving a direct\n[412.56s] answer.\n[414.0s] It seems that in the Buddha''s day there\n[415.84s] were a number of what we might call\n[417.84s] speculative or metaphysical questions\n[420.8s] that it seems as though holy people or\n[423.36s] philosophers we might say were expected\n[425.44s] to have opinions about such as is the\n[428.88s] universe finite or infinite and so on.\n[432.56s] The Buddha however did not respond to\n[435.44s] these questions. He did not give\n[437.319s] answers. Now we might ask why he didn''t\n[440.08s] give answers. Part of the reason for\n[442.319s] that, there''s many reasons and I''ve\n[443.84s] discussed them before on on several\n[445.44s] videos, but the general idea here is\n[447.84s] that these questions are not relevant.\n[450.639s] They''re not relevant to the achievement\n[452.8s] of Nirvana, of awakening, of\n[455.319s] enlightenment. They''re not relevant to\n[457.68s] the path. And so, they tend to be a\n[461.08s] distraction. Trying to answer such\n[463.199s] questions tends to lead to sterile\n[466.16s] debates that really bring us nowhere\n[468.96s] except frustration. And so the Buddha\n[472.24s] really in his comportment in the way he\n[476.0s] behaved during these kinds of\n[477.639s] discussions shows us that we it''s it''s\n[480.24s] critical to make the distinction between\n[482.72s] arguments or discussions that are\n[484.36s] productive and those that are not\n[486.68s] productive. And this leads directly into\n[489.52s] our next topic which is distinguishing\n[492.4s] between skillful and unskillful\n[495.36s] discussions or arguments. In b in\n[498.319s] Buddhism and early Buddhism in\n[499.96s] particular, discussions were intended to\n[503.12s] lead to wisdom and eventually to\n[506.0s] enlightenment or awakening. They''re not\n[508.56s] intended to be simply things that one\n[510.72s] won or lost. The winning or losing is\n[513.68s] not the point. The point is to gain\n[516.279s] insight. Indeed, the Buddha discussed\n[519.44s] one way that such discussions might go\n[523.039s] off the rails. As he says, \"Those who\n[526.48s] converse with hostility, too sure of\n[528.92s] themselves, arrogant, ignoble, attacking\n[532.44s] virtues, they look for flaws in each\n[534.959s] other. They rejoice together when their\n[537.279s] opponent speaks poorly and makes a\n[539.68s] mistake, becoming confused and defeated.\n[542.88s] But the noble ones don''t discuss like\n[545.8s] this. What''s an at issue here is one of\n[548.88s] egoistic conceit, feeling superior to\n[552.32s] other people, looking to dominate a\n[554.959s] discussion in order to feel as though\n[556.88s] one knows more than one''s opponent or is\n[559.36s] more skillful in debate than one''s\n[561.279s] opponent. But the true role of\n[563.32s] discussion is in the service of\n[565.76s] practice, of understanding, and of\n[568.48s] wisdom. The Buddha encouraged discussion\n[570.959s] as a means of dis discovering the\n[573.2s] difference between what''s true and\n[575.04s] what''s false. As a way of clearing up\n[577.92s] our doubts and our\n[580.36s] misunderstandings as a way to lead to\n[583.24s] insight in so far as this the discussion\n[586.24s] that we''re that we''re engaged in doesn''t\n[588.88s] lead to these kinds of ends, it''s better\n[591.6s] avoided. It''s basically a waste of our\n[593.76s] time and may indeed be\n[594.959s] counterproductive. Now earlier I\n[597.44s] discussed a number of indications of a\n[600.88s] discussion that''s gone off the rails.\n[603.04s] The Buddha goes on to discuss more such\n[606.68s] examples. For example, if people are not\n[610.24s] wishing to or not willing to remain\n[612.32s] consistent in a discussion, then the\n[614.8s] discussion is not of much value because\n[617.44s] we''re not getting anything out of it. If\n[618.959s] the person we''re discussing with is not\n[621.04s] speaking consistently or if the person\n[623.839s] we''re speaking with does not have good\n[626.16s] knowledge of what they''re talking about,\n[628.48s] if they''re simply, we might say,\n[631.16s] BSing uh claiming to have knowledge that\n[633.839s] they don''t actually have, then once\n[635.44s] again, it''s probably a waste of our time\n[637.68s] to engage in that kind of conversation.\n[640.24s] Other examples might be engaging in a\n[643.2s] conversation where the other person\n[644.72s] dodges the issue at hand, doesn''t really\n[646.959s] directly discusses it. discuss it or who\n[649.839s] responds with irrelevant arguments. One\n[653.04s] example of responding with\n[655.399s] irrelevancies is what we what we term\n[657.839s] nowadays the gish gallop. This is where\n[660.959s] one of the responders in an in an\n[662.959s] argument or discussion simply throws out\n[666.399s] a large number of irrelevant or poorly\n[669.92s] argued uh uh uh uh claims in order to\n[674.48s] overwhelm one''s opponent with a sheer\n[676.959s] number of things said rather than to try\n[680.079s] to elucidate the truth of the matter.\n[682.399s] Other signs of unskillful arguments are\n[685.279s] when the participants display anger,\n[688.56s] bitterness, or hatred towards one\n[690.56s] another. When they try to intimidate one\n[693.279s] another or mock them or uh call them out\n[696.64s] on on what are really trivial errors or\n[699.76s] mistakes that they might make. That is\n[701.2s] to say, they may trip themselves up on\n[703.36s] some small issue that has no bearing on\n[705.6s] the larger one. And if one focuses\n[707.76s] simply on those small slip-ups, one''s\n[710.48s] not engaging in good faith. Or if one of\n[714.0s] the responders is not actively listening\n[716.72s] to their opponent. if they''re not\n[719.44s] responding to their actual arguments.\n[722.0s] This is sometimes called straw manning\n[724.64s] where what one of the discuss the people\n[728.079s] in the discussion does is to argue not\n[731.279s] at what their opponent is actually\n[732.8s] saying but it''s some\n[734.839s] much weaker shall we say position that\n[738.639s] they they have no trouble in defeating\n[741.04s] even though it''s not actually the\n[742.56s] position that their opponent is bringing\n[744.24s] forward. These are all examples of\n[747.44s] arguing in bad faith. Now, on the other\n[750.16s] hand, signs of a skillful discussion are\n[753.279s] when these kinds of things don''t happen.\n[756.959s] When we find a true genuine desire among\n[761.36s] both participants to learn from the\n[763.92s] other, open-mindedness in this respect,\n[767.68s] a sense of an interest in clarity and\n[770.88s] insight in discussion rather than simply\n[774.2s] winning. Charitable listening, that is\n[777.279s] not assuming that your opponent is\n[779.519s] saying something false or interpreting\n[781.44s] them always as saying things that are\n[783.12s] false. That is to say, listening\n[785.959s] respectfully even if you disagree.\n[789.279s] Third, I want to touch on how we can\n[790.959s] apply these methods to our discussions\n[793.8s] today. And I think perhaps the most\n[796.639s] important lesson we can learn from the\n[799.04s] Buddha''s approach to argument and\n[802.32s] discussion and debate is that not all\n[805.2s] arguments are worth responding to. Not\n[807.519s] all debates are worth engaging in.\n[810.639s] Before we engage in a an argument or a\n[813.72s] discussion, we should ask ourselves if\n[816.88s] it is really worthwhile. Are the people\n[819.68s] we''re talking with engaging in good\n[822.36s] faith? Are we able to do so without\n[826.16s] ranker, without anger, without uh\n[829.2s] getting over excited and and uh upset?\n[833.68s] Avoid debates that are simply exercises\n[837.199s] in egoism or winning. That is to say\n[840.32s] that winning is the only thing that\n[842.04s] matters. And I would say overall the\n[845.68s] biggest uh point here is to not feed\n[850.44s] trolls. Trolls are people on line. I\n[853.44s] think many of us most of us perhaps will\n[855.44s] be familiar with this. Who do not engage\n[858.16s] in good faith\n[859.72s] discussion who join discussions simply\n[862.8s] to blow things up. Many online\n[865.279s] discussions are done in bad faith. So\n[868.16s] when you recognize this, it''s best to\n[870.88s] simply step aside. In all of this, we\n[873.44s] should keep in mind the background here,\n[875.6s] which is of right speech. When we engage\n[878.72s] in right speech, we ask, is what we''re\n[881.279s] going to say true? Is it beneficial? Is\n[884.8s] it timely? That is to say, are we saying\n[887.12s] it at the right time and place? And are\n[891.199s] we doing so all you know throughout with\n[894.56s] a mind of\n[896.12s] kindness? Even if what we''re going to\n[898.24s] say may not be pleasant to the other\n[901.12s] person, even if we''re going to speak\n[903.6s] hard truths, are we doing so with a mind\n[907.36s] of kindness or instead with a mind of\n[910.56s] anger and\n[912.12s] vindictiveness? If we''re speaking in the\n[914.399s] latter case with vindictiveness, it''s\n[916.8s] best simply to wait for another time.\n[919.76s] Fourth, in conclusion, how do we respond\n[923.04s] to discussions and arguments\n[925.56s] wisely? When the Buddha engaged in\n[928.12s] debate, he engaged in it in order to\n[931.36s] elucidate wisdom, in order to gain\n[933.76s] insight, not simply to win or to to be\n[937.279s] victorious. The Buddha, as we''ve seen,\n[939.76s] used four different response strategies\n[942.959s] depending on the kinds of questions that\n[944.72s] he was presented with, including, and I\n[947.36s] say in some ways the most important one,\n[949.6s] which is simply not to respond if the\n[952.56s] question was not relevant or he did not\n[954.959s] feel was going to lead to a good\n[957.36s] outcome. The best discussions lead to\n[960.32s] greater understanding and harmony with\n[962.88s] one another, not to division and ranker.\n[967.759s] So my question for you is, have you had\n[970.48s] difficult discussions that you were able\n[972.48s] to turn in