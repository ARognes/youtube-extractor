06.799s] categorical answer is is pretty\n[109.24s] straightforward. Assuming that the\n[111.119s] question is clear, is\n[113.88s] unambiguous and admits of a determinable\n[117.36s] answer, the Buddha would answer it\n[119.28s] indeed straightforwardly.\n[121.28s] One example of this uh the scholar Patan\n[124.479s] finds in the commentary to this suta\n[128.16s] which is a response that we find in the\n[131.68s] sec Buddha''s second sermon which is uh\n[133.76s] the discourse on nonself and in there we\n[137.08s] read what do you think mendicants is\n[139.92s] form permanent or impermanent\n[142.879s] impermanent sir and of course there are\n[145.92s] many such examples in the sutas where\n[148.56s] the Buddha gives a direct response\n[150.56s] response categorically to a relevant and\n[154.72s] well well-made question. The second way\n[157.76s] that the Buddha would respond to\n[159.44s] questions is with an analytical\n[161.72s] breakdown. This is where in the context\n[164.959s] of where the question is asked, it seems\n[167.76s] as though the question is unclear, that\n[169.84s] more might need to be said or that\n[172.0s] there''s some background assumption that\n[174.319s] may be getting in the way of\n[176.4s] understanding the right\n[178.36s] answer. Again in the commentary to this\n[181.239s] sissuta patan finds a discussion where\n[184.8s] the Buddha or somebody is asked is the\n[187.92s] eye\n[189.08s] impermanent and the response is not only\n[192.4s] is the eye impermanent but so too is the\n[195.2s] ear the nose and so on. That is to say,\n[198.72s] the person asking this question, is the\n[201.2s] eye\n[202.04s] impermanent? May really be intending to\n[204.56s] ask the question, is only the eye\n[207.159s] impermanent? And so therefore, if you\n[209.36s] gave the answer, yes, the eye is\n[211.239s] impermanent, they may not really fully\n[214.12s] understand the importance of that answer\n[217.04s] because they''ve got a different kind of\n[218.6