transcript: '{"content":"\n[0.0s] At first glance, this code may look like\n[1.84s] it''s perfectly fine, but there''s\n[3.2s] actually some subtle issues with it that\n[4.84s] we can fix with the TypeScript config.\n[6.96s] The very first one that I want to talk\n[8.16s] about is the no unchecked index access,\n[10.56s] cuz this is by far my favorite\n[11.96s] TypeScript config file. I always enable\n[14.04s] this. You can see down here we have\n[15.44s] array of names. We have Kyle, Sally, and\n[17.96s] so on, and I''m trying to access the\n[19.72s] third element from that array and\n[21.04s] convert it to uppercase. Obviously,\n[22.76s] there is no third element in this array,\n[24.56s] so it''s throwing me an error. That''s\n[26.08s] because I enabled this setting of no\n[28.16s] unchecked index access. Essentially,\n[30.08s] anytime you try to access an element in\n[31.84s] an array by index, it''ll always either\n[33.88s] be undefined or whatever the type of\n[36.08s] this thing is, so string in our case.\n[38.04s] And you need to make sure that you check\n[39.56s] to make sure it exists with some type of\n[41.08s] nullish coalescing or other null-based\n[42.96s] check before you access this element,\n[44.88s] and I think this should be enabled in\n[46.12s] every TypeScript project by default\n[47.68s] since it gives you extra type safety.\n[49.84s] Now, the next setting I want to talk\n[50.8s] about is a really simple one. It''s just\n[52.44s] no fall through in case switch. So,\n[54.88s] essentially, what this does is it makes\n[56.48s] it so that if you have a switch\n[57.56s] statement like this and you forget to\n[59.2s] add your break or your return, it''s\n[61.04s] going to give you essentially an error\n[62.24s] telling you, \"Hey, make sure you put in\n[64.0s] your break or your return inside of all\n[65.72s] of your different cases to work\n[66.92s] properly.\" You can still have fall\n[68.56s] through cases where there''s no code in\n[69.96s] it, but as soon as you put code in this\n[71.48s] section, it''ll throw an error if you\n[72.6s] don''t have a break or a return. Now,\n[74.6s] this final property is another really\n[76.16s] super straightforward one, and this is\n[77.56s] allow unreachable code. Essentially, all\n[79.92s] this does is it makes it so that you\n[81.52s] can''t have code in here that''s\n[83.0s] unaccessible. So, here this return\n[84.56s] statement is impossible to access, so\n[86.48s] it''s giving me a nice little warning\n[87.72s] letting me know, helping me catch\n[89.24s] potential typos in my code. Now, I would\n[91.6s] recommend enabling all of these in your\n[93.2s] project because they give you extra type\n[94.76s] safety and help you with catching bugs\n[96.36s] and typos in your code. Now, if this\n[98.08s] interests you, I highly recommend\n[99.32s] checking out the full video linked at\n[100.52s] the bottom of your screen where I cover\n[101.76s] 15 total TypeScript config options that\n[103.92s] you definitely want to have in every\n[105.24s] single project you work on."}'
