senting your portfolio is something that you would feel comfort that you would feel 100 proud of if you had to present it to like a ceo for example right it needs to be something that is uh it doesn't have to be 100 fully polished and deployed somewhere that people are downloading it's great if it is but it needs to be something that's polished um and relatable uh even to what the company does as well because it then puts the hiring manager in that mindset of okay they already don't work in this particular area so that learning curve would be super low so yeah let's bring them in so hopefully that tackles for the people who are super social and then people who are not as social and i think like you know you you bring up a lot of really really good points here so so one that i uh just to to repeat like networking is a long game it's it's not something that you're going to say oh i want a job next week let me start networking today yes yeah think of it more like building friendships right like you're trying to make connections to people not because you want stuff from them right because it's good to have friends and then yeah having more friends means later there's a decent chance you know somebody who knows somebody who can get you that intro and so it's not a transactional thing it's it's making your life better you're you're finding people who have similar interests that you like talking to um and uh so peanut butter in the chat has a great question [Applause] it's a great name uh but they ask how are you connecting with others online like especially now given that we're in covid times we're not getting the opportunities where we could show up at a conference or a meet-up and they're kind of the casual coffee chats so if you're shy if you're not super comfortable just like blasting into somebody's dms and being like hey i'm jason um where where would you recommend going like what are the strategies that you're using to to meet people yeah so um i will say i'm usually everywhere so i don't want to give like 100 that response but um i can give that after after i talk about for folks who aren't as social first so i will i will help those people out first there are significantly smaller communities that you can take part in whether it's on discord for example um there's slack and i will say most likely regardless of the area in tech that you work in or um pursue to work in there's some small community somewhere and one of these chatting platforms that isn't necessarily twitter that you can take part in and typically those are what i like to call safe spaces for um the area of tech where it's okay to ask questions it's okay to um to really bring that beginner mentality there and then you start to get more comfortable hopefully with people so if you're not into like the really big groups of um engagement folks there's that which i find to be um you know definitely helpful for for those who who don't want to be in that one-on-one conversation with someone it really becomes um you know like a group conversation at that point so it doesn't it doesn't feel as awkward sliding into someone dms and having this like one-to-one conversation yeah so there's that um for for those though who you know who do want to be everywhere i would say for me because i do work in the xr space alt space vr has been um a place where i've met folks i've i've gone to both large and small events in alt space and i would say usually when i've gone to set events it's probably because i did some talk of some sort so i end up chatting with people afterwards because they have questions so there's that but for the larger alt-space um you know hangouts where i didn't do any sort of presenting um you know people people literally they will come up and talk to you um as well and it's one of those things where you see a group of people talking just hover over there and see what's going on and you know say stuff so that's another way i've got to meet people um twitch has 