ust from life but even like dev2 for example with that platform um i'm a moderator on there and i've like seen different like moderator chats and like it's like a serious thing like you just can't come on there and harass people and you know be this big like bully like that's just not allowed so um i feel like it's it's definitely more comfortable for folks who are trying to find um you know that place where they can fit in and feel comfortable absolutely yeah i think that is that is absolutely fantastic and it kind of plays into you know there's a follow-up question from uh newcomb i hope i just said your name right i'm sorry if i didn't uh about um how to make a reputation for yourself and and so what we've talked about with networking there's a there seems to be a point in in my experience at least where somebody goes from being someone i've never heard of to being a name i've i've kind of heard suddenly to being someone that i recognize yeah you know and and i think that like there are some some really notable stories you mentioned chloe chloe is a great example of this where i feel like three years ago i i don't know that i'd ever met or heard of chloe and now yeah she's she's doing these amazing things she was just interviewing bill nye like i was there too oh my god what an amazing thing that was right like yeah and and it's um and and all of that kind of builds this reputation so what do you where do you think that line is and how do you move from from networking to to building a reputation so i will first start by saying be mindful that there's two type of reputations there's a good reputation and a bad reputation and it is very easy i will say to build a bad reputation depending on um just the way things play out in um i'll say like the online space for example but there's also the good reputation side of it as well um but to build i won't talk about how to build a bad reputation because i won't help anyone here but to build a good reputation um a lot of it comes down to uh what are you doing in the community you know what are you doing in the tech space and you know are you using your skills for for social good for example um are you are you able to or are you engaging in topics that impact us like when i say us i mean everyone who works in tech for example um are are you doing things with your skill sets that um are helping other people grow for example and then like once you make it in tech are you doing things to help you know uplift others and bring others along with you in that journey so it's not like you must do this only one thing and now you have reputation for yourself it's i think a really a combination of things but um if if you come to notice the people who have good reputations uh in this in this industry they're most likely folks who are doing things to help others realistically um i mean i could probably give you a laundry list of things that people are doing but it's really folks who are doing things to help others along either in their journey or as i hate to say this phrase but making the world a better place so i mean i i'm fully on board with you for that and i think like a way that it differentiates in my head is that you know networking is an active activity you are participating in networking i'm reaching out to you i'm talking in a community reputation is what happens when you're not there what do people say when your name comes up in conversation does your name come up in conversation um and and i think that that reputation gets built on how people feel when you are networking if i if i come into a conversation and and i can manage to do something that makes you feel better then later if my name comes up you're going to remember that our our interaction was good it was a positive outcome and then you're going to say oh i like them they they were helpful um and if our interaction wasn't good then the opposite happens yeah and we're never going to get all good or all bad like it's always going to be a blend but we can always try to make sure that we're trending toward better how can we think about the way that an interaction we're about to have is going to make the people on the other end of that conversation feel are we making people feel smart capable like they're going to get somewhere or are we trying to make ourselves feel smart and make them feel small those are all going to influence your reputation and you know people talk about that you if you are present in a community people will talk about you when you're not there and you want to make sure that that's positive that yeah and i would say even like especially within the tech area because it's just so many things happen um even folks who are um you know controversial and things that they share um you know being controversial honestly can have a negative or a positive connotation and um you know it could be statements expressed that are controversial to one audience um but they're things that they're statements that help people in the long run or it could be uh controversial things said that are super negative which i'm sure a lot of us see on twitter as well so um you know i i say that because it doesn't mean you have to be this bubbly um you know happy-go-lucky percy person 24 7 for example um i don't even think that's like a thing that is like realistic or authentic or human but uh you know you can you can speak up um as well uh on on on topics especially if you feel very strong about something but uh just also do keep in mind that how it's perceived by people it's going to vary um you'll have people who love that you said certain things and you'll have obsess a subset of people that's just like oh no i don't like that they said this blah blah blah blah so it really goes both ways um but that also feeds into reputation as well yeah absolutely i think that's that's an excellent point um so we're we're kind of drawn to a close here so um chat this is your last chance if you've got any questions