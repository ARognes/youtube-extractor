transcript: (Techno music) (Record scratch) - Subset Games are responsible for two of the most imaginative strategy games of recent memory, FTL and Into the Breach. The team, Justin and Matthew, have been working together for the best part of a decade, ever since meeting while working at 2K Games in Shanghai. Both games are expert spins on a pretty familiar genre and each of them in their own unique way. So while the boys were in town for GDC, we stuck them in our hot seat and asked them about designing games around crew management and time traveling chess. (Funky keyboard music) - My name is Justin Ma, I'm half of Subset Games. - And I'm Matthew Davis, the other half. - Yeah, we both ended up working in China. In part because it was easier to find jobs there than in the US; I probably couldn't have gotten in the games industry as easily as I did over there. - That was 100% what happened to me. I went to GDC when I was finishing uni and I went to the 2K booth and gave applications or resumes, which you were doing everywhere and mostly they're just taken and like, yeah sure. 2K said "If you're willing to move to China, "then you can have a job." - I just moved to China and then tried to look for a job there so I sorta it seemed hard so I was like I'm not even gonna try, let's just go to China. - But this was ten years ago so who knows how much worse or better it is now. - And yeah, we both were roughly done with our time in China, and so, Matt wanted to see if we wanted to make a few prototypes together so we sorta had some savings, enough to work for a year on a couple prototypes and the first thing we worked on became FTL. (video game noises) (video game noises) (Video game noises) - We managed to find the core game in six months. - We'd submitted to IGF in China, which we were finalists at, only six months after starting, - Which was bizarre. - which in hindsight is shocking. At the time, it's like ah that's how we make games I guess. This is about how this works, but in hindsight, it was, yeah, so fast and then, just a year after that, we were done. When we started, we didn't know what we were making and there was a lot of discussion in terms of what type of game is this gonna be, like we started with the crew management concept but we didn't really know, from there, what kinda game we build around that. - Is it just a survival, like you have morale and food and you're just trying to travel like it coulda been a number of different games. It ended up being combat focused - Yeah but when we were playing with crazy stuff like zooming out and having you fly the ship like a third person - a directional shields ya know like - And like zooming back in - Ya know like The big turning point was when you were inspired by Tetris or something where you're just like "What if we just put two ships on screen all the time?" And then you're like "Focus on the crew movement." - [Interviwer] So how do you come to that? How does that decision happen? Because, like you said, like you think of it as a space combat game, where the ships are in space is generally the sort of like the main focus - Well that's kinda how we approach a lot of things is that's generally how it's done so what if we didn't do that? - Right - And the let's just...the crew management isn't what most games focus on, so let's just cut all the stuff that wasn't that and see how we can make a game outta that. - And then usually that mean, that puts you in this weird nebulous state of like, I know what it isn't, but I dunno what it is and then so you just sorta follow from there what is interesting and then hopefully find something fun that you can focus on and then narrow it down. There are some big turning points like pushing for the IGF China build, like we basically turned it into a game. We turned a weird blob into a game. It was a bad game, but it was the first time it actually felt like a video game. And that was a big turning point. - [Interviewer] Was that because of the time constraint - Yeah - [Interviewer] Of having to get it in? - Yeah - Yeah exactly - Versus, compared to Into the Breach which didn't feel like a game until, like, two and a half years into development. - Yeah, maybe because we had no time constraints. - Yeah (Upbeat video game music) (Video game sound effects) (Video game sound effects) (Video game sound effects) - [Justin] When you have strong opinions about what we like and don't like about tactics and strategy games, so that influences how we approach the game as a whole. In terms of the broad concept of defensive rather than offensive, that was there from the beginning. Matt's first concept that he wanted to explore was what would it be like to feel like you're willing to put yourself in danger to protect the buildings. - [Matthew] We had that as that first concept for sure that we wanted collateral damage, but we didn't really intend to build the game around it. That came later when we were experimenting more with telegraphed attacks where you knew what the enemy could do and it made more sense for the buildings that couldn't run away to be the primary target. - [Justin] And I feel like that was the turning point with the combat, at least for me, because it's like a new constraint. You're basically saying what if the entire game had this different system for threat? and what would that mean for the rest of design? And so you sort of follow that down to pushing and manipulating enemies is a core element, like, killing enemies isn't fun, you're just removing the interesting thing, which was the threat, so if you wanna really make that an enjoyable experience, what does that mean? It changes the types of weapons you wanna make, it changes the types of, the way the layout works. And so, that was a big constraint on the combat design that happened relatively early and definitely shifted... - And you can see how that also leads to defensive stuff, - Yeah - Because, if killing them isn't fun, then it's more fun to play in the more defensive manor. - And, if you're doing that, and you're being more defensive, you don't want the victory condition to be kill all the enemies, which eventually led us to having the short battles and on a timer because you want to feel successful when you just delay them. Like we want to encourage that feeling of mitigation is just as good as killing them. - The combat probably didn't solidify for a good two and a half years, yeah. - Yeah - Until really where you play today. - Until we were like, at that point, we were like, okay, shift to content and releasing the game. - Which still took another year and a half on top of that. - [Interviewer] What's the most enjoyable part, the first two and a half, or the latter two and a half? - The first half of the first half and the second half of the second half. - [Interviewer] It's that big half in the middle. - Ooooo yeah, that one was painful. (Video game music) (Video game music) - [Interviewer] Both FTL and Into the Breach revel in flipping conventional design on it's head. The former is a space combat game where the danger is in the long journey, not in the immediate battle, and the latter, a tactics game about mitigating collateral damage, rather than inflicting it. In that respect, both of these games were incredibly challenging to design, as before they can teach players how to play, they first have to help them unlearn strategies that, by design, no longer apply. - [Justin] The big challenge for us in terms of seeing weather it's gonna work out, is weather or not we can get people to the point where we're at. Like, we know what we're doing right now is enjoyable, so most of the challenge with Into the Breach after the core game was decided, was how do we get people to that point? How do we get them to understand the systems? And so most of the challenge was like, conveying information in a understandable way, to get people to start discovering how things actually work. - [Matthew] Into the Breach was a constant usability teaching question for years, while FTL we didn't really-- - People just got it just because-- - Well, people got it like instinctually and what the game was; I'm a star ship captain. - [Justin] Schematically, done. - [Matthew} And that was-- - [Justin] Shoot, the engines are on fire, send in people to fix it. Done. You get it. - And then the complex mechanics from there, I think they're more, it was easier to get them interested in chasing them down because they're so immediately hooked on the core concept, while Into the Breach is a little bit more abstract and that core theme isn't quite as exciting. There's also that immediate narrative for the player to lock on to, and so, they weren't necessarily gonna chase down the core mechanics quite as quickly and so we needed it to guide the player more carefully to make sure they saw that the game had interesting elements and it just wasn't gonna grab you at the same speed that FTL was. - Every time that I discovered something new that was a good strategy like the first time that you attack your own unit to push it a little bit further to be able to do something like that's an a-ha moment then I'm like oh, this process is fun, this process of learning and discovering is fun and, normally with games, if you design everything out and you know every mechanic perfectly, and how they interact perfectly, that's not really possible as a developer, to get the discovery, and so, there's some things I can't get the discovery of, like with FTL, I do not know what it's like to get attached to your crew members, like, that's impossible-- - Would've never understood it. - But, or like, with Into the Breach, just the first a-ha moment of pushing an enemy out of the way and they now are attacking an empty space, like, that may be a breakthrough for people first approaching the game and like, so that I can't experience. I just have to, ya know, extrapolate that the higher level a-ha moments are fun, therefore, hopefully, the earlier ones are fun too. - And the higher level ones are the ones that, where a lot of the complexity comes from. - Yeah - And a lot of that maintaining of how do you get that system in your head and pay attention to it comes from seeing and finding those fringes constantly. - [Justin] Like, the whole point of the smoke squad, is to basically make you perceive the concept of smoke differently. And so even if the number of mechanics and the way they interact are relatively limited, by constantly forcing you to reassess what things are used for, it kinda keeps players on their toes and you see, you see opportunities everywhere, you don't just get complacent about like, this is what this does and that's it and you just force them to think now your unit is actually useful for chaining lightning through you, you can trade your health for more damage, ya know, like just the more opportunities to surprise people in that way, it just makes games really fun. - [Matthew] And the mech squads work very much in the sense of the're tutorials. They're designed to be tutorials; they're designed to introduce the new mechanics, the smoke, the fire in a way that forces the player to engage in that mechanic, 'cause it's quite easy for a player to play a game, get comfortable, with a certain way of playing a game, and then kind of get stuck and always play it that way. Well, if you force them to use a squad that relies on a very different approach, then they can do a lot better job exploring all the different systems and kinda finding all the boundaries that we've been very carefully putting in with the game, I would much rather they engage with. - Yeah, one thing that is troubling to me as a player is when, like in Dark Souls or something, I spend a lot of time figuring out how to win with a sword and shield and then I want to play in a different play style but I just, I feel almost dis incentivized because like, I already know how to do that and then I just always revert back to my default, so I want to try and make situations where you're not, that's not an option essentially. You don't have to feel guilty for wanting to learn a new mechanic. (Video game noises) - [Interviewer] Both FTL and Into the Breach do a good job of using clever touches to establish a fiction in the worlds they inhabit. For instance, the buildings in Into the Breach pop speech bubbles full of relief, fear, and support as battles begin and end. Each run in FTL was given a unique flavor thanks to cleverly written narrative book-ends penned by Tom Jubert. While for Into the Breach, the duo managed to get famed RPG writer Chris Avellone to help out. But they fully admit to not being the easiest designers to collaborate with. - [Matthew] We did end up using Chris Avellone for Into the Breach, partly because I grew up with Chris Avellone's games and it was so cool to work with Chris Avellone when the opportunity presented itself, it was something that we wouldn't wanna pass up, but Tom Jubert did a brilliant job on FTL, and it wasn't any indictment of Tom's work that we wanted to work with Chris, it was just to shake things up a bit. - [Justin] Sometimes I feel like we put our contractors in a not great position, where we're saying we want you to get emotionally invested enough to help us figure out what would be best for the game in the ways that you're more skilled than we are, at the same time that we're saying this is our baby and we have executive control over everything and it's been a learning process for us for how to collaborate in ways that are fulfilling for other people. The way that we work isn't really suited very well for having other people jump in, meaning like, we scrapped the majority of the game multiple times. This is not a good way to... have contractors be brought in midway through. - On a more micro level, like towards the end, - [Justin] Scrapping features-- - [Matthew] The pilot abilities, we were swapping them in and out because we weren't sure what pilot abilities for Into the Breach we wanted to balance against the game design. Meanwhile Chris is creating these really complex backstories and explanations and personalities that are inspired by the pilot abilities and then we say two weeks before launch, "Oh wait Chris, "I'm sorry, this character you built "around this ability, he doesn't have that ability anymore, he has a completely different ability" And, at the end of the day, all the contractor work, like all that stuff to us... the game design is always the pillar that everything else has to like, be constrained by and so we end up disappointing contractors if we have to make game design decisions that lock on to that. The only, the nice one that is music, 'cause I don't have an opinion on music, or as strong an opinion on music, so I feel like I'm a lot more able to say "Ben, go make amazing stuff." and then I'll put it in the game and I don't have to worry about it quite as much, versus like, the writing or the sound effects, you might get a little bit more micromanaging. - [Interviewer] It sounds like the two of you make games very much for like, yourselves, like you're making games that you're entertained by. Are you surprised when, ya know 'cause FTL like, I remember the thing that sounds good to me first is the Kickstarter, like, you asked for that much and you got that much, like, are you surprised by just how popular both these games have been? - Yes - Perpetually - Yeah, never stops being weird. - Especially, I think the biggest shock was FTL 'cause we thought we were making just something only we would like, initially and we're like, no way people would be masochistic enough to want to play this terrible, awful game about dying in space and then when people just responded really strongly to it, we were kinda shocked. - [Matthew] I think Into the Breach, we thought people wouldn't like it as much, mostly 'cause it was (mumbles) smaller experience, and coming off FTL they may have had expectations that Into the Breach didn't really satisfy the exact same type of game. - [Justin] It's also a tactics game so those don't sell that well. - [Matthew] We didn't expect it to be very big and we knew it would be smaller than FTL, it is smaller than FTL. Everything that we ever make will be smaller than FTL. But it still ended up finding an audience much larger than we expected; we didn't think we'd be winning best design at the Game Dev Choice Awards and stuff like that. It's still shocking. - Yeah, its pretty crazy. (upbeat music) (upbeat music) (upbeat music) (upbeat music) (upbeat music) (upbeat music) (upbeat music) (upbeat music) (upbeat music) (upbeat music) (upbeat music)
