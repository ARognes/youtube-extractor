in the description. Thanks again to Linear for sponsoring today's conversation. What was the the breaking point in terms of deciding to to leave this dream job at Google? >> To be honest, as I think many people do, every now and then I would think like, oh, you know, maybe I should search externally. Maybe I should, you know, like talk to this recruiter who reached out. I didn't do anything about it for four years, like more than four years. But there was this one incident where just by random a random bug, I lost corp access suddenly on a Tuesday for like 4 hours, none of my teammates had lost access. So when I could not log in, I freaked out and I was like, "Oh my god, what has happened? Am I getting laid off?" And I happened to be running a 5K that time, too. So, I actually ran the fastest 5K I've ever run in my life because I was so stressed. >> But when I was running it, I actually started feeling kind of a sense of a little bit of relief. And I realized that, oh, if this is a very possible scenario, if I could, you know, lose my job at any point, I probably should do some due diligence and kind of look around and see what's out there. So, I should be prepared in case this uh hypothetical situation that I thought I was in becomes reality. So that was what really pushed me to not just like occasionally mention maybe I should leave to actually like submitting my resume, talking to recruiters, going through the interview loops. It it took that like random random bug. >> A lot of people know they should be looking elsewhere. But when you're kind of in an uncomfortable spot, there's not really a catalyst to get you to do that. Usually what ends up happening is you get angry, something occurs at work, there's some sort of like thing that kind of mess, you know, pisses you off or your manager says something and you're you're kind of like, "Oh, I've had it." And then you like brush your resume up and and maybe you do some le code questions, but then things calm down at the office. And so then you're like, "Oh, okay. Well, still like a lot of work, but it sounded like, you know, you get one of these sort of kick in the pants moments like losing corp access, which by the way, when you get laid off, it's just like you can't log in, your email doesn't work anymore. You just feel really feel like you've been cast out and cast aside. >> Yeah. Yeah. I I think it's definitely a blessing and a curse to have like for example, for me, a team that I liked my teammates, I like my manager because it was it was it's it was a good experience and I think I would have been very happy had I stayed. But that kind of made me a bit more complacent when it comes to what I really wanted next in my career. So, it's definitely a double-edged sword if you think about it. >> You should just like somehow like automatically lock yourself out of the computer every time you have to do a 5K or or race or something like that. Like there's got to be some sort of alpha there. Okay. >> Need steroids when [laughter] I have anxiety. It's >> like computer steroids. All right. I was just looking at your career trajectory. you seem to thrive in terms of getting accepted at places where there's a ton of competition. So, you went to MIT. It's not easy to get into MIT. You did six internships uh while you're doing your undergrad. Got into Google. After this Google incident, you applied to something like 12 companies. Let's talk a little bit about this last round of trying to find a job. Any incidents sort of stick out to you? I hadn't interviewed at all throughout those four years until this last round. So, um I did not know what to expect and there were some pretty funny things that happened during the interview process. Like distinctly, I remember two. One of them was I was interviewing for one of the foundational model companies and during my uh initial round like technical screen, I was like doing you know this like pi I was implementing this Python thing. My interviewer all of a sudden goes like he was on call for his company. And he was like, "Oh, I think there's an incident. Give me a second." And like he just like muted himself and like did some stuff. And then I just like, you know, continued trying to implement my function. And then he came back. He was like, "Okay, it's a SE one. Our entire like model was down. No one can like no one can query it. I like to think of myself as a comedian." I was like, "Oh, at least you know, I'm not using your model to cheat on this interview." And he laughed a little bit too hard. And I think maybe that's what pushed him to give me like to give me the pass rating. I don't know. Um, but that I just found very funny. And the second one, um, I was interviewing for one of the fang companies and I was doing like a very typical lead coach style problem. In the middle of the interview, my interviewer just disappears. Actually, I wasn't looking at him. So, I was like talking to myself for two minutes and I was like, "Wait, he's like not responding." So, I click back into the video and it just no one's there. So, I was like, "Oh no, did I like do something really bad? he just eat it out of the interview. So, you know, I emailed the recruiter and everything. But turns out his entire office lost power and everyone apparently was kicked out of the conference calls and everything for I think a good 15 minutes because I did wait there for 20 minutes and he never showed back up. Eventually, I emailed my recruiter and she actually hopped on the call and told me that there was a technical issue. So, we had to reschedule that. But I think that was those two instances told me that you know you can be very prepared but sometimes things will happen and it's nothing that you can do to mitigate and as if you just have a good attitude things work out. >> Did he pass you? >> Yeah, he or so the first one passed. The second one unfortunately we had to just reschedule the whole interview. >> Okay. >> Um because there 