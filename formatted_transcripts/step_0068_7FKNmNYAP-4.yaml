bout them is like they give you, oh, this is passing for a mid-level candidate or for a senior candidate or for a staff candidate. So, you can customize your own experience that way. And I also really personally liked um I think it's called groing the system design interview that gives you pretty good fundamentals and also has some case studies where they also have examples of very classic system design problems. So I would say a mix of those uh resources are really what helped me get these offers. >> Awesome. So you were preparing for interviews and doing interviews while you were still employed. So like how did you manage your time? >> To be honest, it was very rough. I happened to interview primarily in Q4 of last year. So that's actually when things slowed down a bit because it's, you know, Thanksgiving and Christmas. So I was able to have just less end work naturally in at Google when I was interviewing to leave. Also really helped was time blocking. So I would put blocks on my calendar after work to be like, "Oh, I'm doing like these leak code questions. I am studying this part of uh like reading watching this hello interview video that helped keep myself accountable. I find that when you take like a gigantic task and break it down into smaller subcomponents, it makes it more realistic to actually accomplish those subtasks. Also, I would say um I happened to have some friends who were similarly interviewing. So, we kind of had like a support group, study sessions, however you want to classify it, where we would give each other mock interviews. And that really helped maintain accountability since like if I myself don't do a problem, I'll feel, you know, nothing. But if I said said to a friend, I'm going to solve this and we're going to talk about it and I don't solve it, then I feel bad. >> How did you manage your energy level, right? So it's like you have your full-time job and then you have to do this stuff on top of like living your life, like doing your laundry and feeding yourself. and maybe you didn't have to worry about that at Google, but um [laughter] but also like your relationships and then like you know running and and all of that stuff. >> First of all, I'm a sophomore. We don't have lives [laughter] >> to to be serious. Um I kind of just thought of it like oh this is temporary to be honest. Like either I'm going to get an offer that I like or you know I'm not and I'll stop and like you know try again in a couple of months probably. So having that mindset made it more bearable. I also have been told that I have naturally high energy. Um, [laughter] so I I think that helped as well. And to be honest, like having, like I mentioned, having friends to do it with just made it so much better since I think it would have been very lonely to do it myself. But just having some support network really helps. >> All right, so go find your co-workers that also want to get a new job. >> [laughter] >> I what I'll say is like I actually have a particular friend in a different company who told me that at some point his team was going through some turmoil and he scheduled a sync with his working group that ended up just being them studying system design together. And what's really funny is his manager actually was in the invite, the calendar invite, but just never showed up. So if he had showed up, he would have seen them opening up system design prep. Let's talk about imposter syndrome. Um, how do you define imposttor syndrome? >> I define imposter syndrome as the feeling you get when you think that you are where you are in your career or in your life just because like you faked your entire way to get there. You're not qualified compared to your co-workers, compared to your friends and that very soon or eventually someone is going to realize that you don't belong and like kick you out. That's like something that I've personally been struggling with my my entire life and have a lot of thoughts on it. >> Yeah. What are your thoughts? >> I feel like I've always been lucky enough to be in the presence of many many incredibly smart people. Like I, you know, I went to MIT where there's a lot of smart people, lots of internships, went to Google, um, and just as though that was what caused me to have these feelings my entire life. However, I think I've been better at addressing imposter syndrome throughout the years. And what's really helped me was uh basically when I was just starting off at Google, I just like kept on seeing like oh like you know all my friends like they've done all these cool things like they're on this project, they're ramping up so fast and like I'm you know not doing that. But after talking to my friends and after talking to uh my mentors at the company, I realized that it's very it's very human nature to only want to show your best qualities, right, to people to be like, "Oh, I did XYZ. I won this prize. Like, I got this promo." However, people in general don't like to broadcast their failures. So if you as a person only see other people's successes and you are very aware of your own failures but you don't see other people's failures that is an unfair disculation to be making and once I realized that I realized like no matter how successful this person in my company is or how successful this person is online they obviously have a lot of failures that just aren't being talked about and that's like totally fine and it is counterproductive to fixate on your own failures and compare them with other people's successes and instead what you should do is just be okay understand that you do have failures and have like a strong support network and talk to other people to understand like how they overcame their own failures so that you can also overcome your own failures. >> You just started a new job. Did you have imposter syndrome? >> Oh yes, for sure. Um cuz I again there's a lot of very smart, very talented people at my company. And I always think like as a new hire, you feel some sort of way. You feel like, oh, you know, if I'm not ramping you up fast enough, like my manager is going to think that I don't know how to code. Those are definitely thoughts that I had. But I will say I have a strong support network at my company and there's people who have really helped me ramp up. It's been a while. Like I I've been at this company for 10 months now. So point is like when I was starting there are people that are very supportive, very helpful and also there's just like statistically women suffer imposter syndrome more than men for for reasons. So there's like a good like women engineering group at my company and they do workshops on imposter syndrome sometimes and it's good to just hear other people's experiences and understand that you're not alone in feeling this sort of way since I will say when I started off in big tech in industry. It was also because of the pandemic I feel like I didn't have as good of a support system as good as like mentors. I just couldn't didn't really find anyone to talk to. Now I have like a lot of people that I can learn from and also like mentees of my own that I also try to help with their own imposter syndrome. So it's kind of comes full circle. >> Let's talk about performance and promotion. Anything happened within Google that you'd like to talk about? >> Yeah. Um so something that I was very grateful that happened was uh my first promo at Google. I actually went up for promo before I realized I was ready. And it was because my manager advocated for me. So, she a couple weeks before the promo cycle went up to me and was like, "Hey, have you thought about if you want to go for promotion and I actually literally said, "Oh, I mean, I did not consider this cycle. I was planning going next cycle." But then she told me, "Oh, I think your packet looks pretty strong. You should go this cycle and if you don't get it, that's fine. We'll just get it next cycle." So having someone like my manager who really believed in me more than I believed in myself kind of made me realize that I think some people like me might be a bit more harsh on ourselves compared to what the reality is. And hopefully next time that happens, I won't need like my my someone as great as my manager to realize that. I can internalize that I should put myself up for these opportunities even if I personally don't think I'm ready for them. >> Yeah. I mean, very happy for you that your manager would do that, but you can imagine a situation where you don't have that good of a manager and they don't say anything. And so, I guess is your advice to put yourself up before you feel like you're ready? How can you tell the difference between actually not being ready and being too early and maybe pushing for a promotion that you're not ready for versus not pushing but actually being in a spot where you should be promoted? At Google, the promotion packets are pretty extensive and involve like a bunch of different artifacts and a bunch of like your code samples and stuff. So, what I actually did was I did ask my fellow uh co-workers who had gotten promoted if they were willing to share their packets with me and like they said yes. So, that was kind of a sanity check. I was able to look at their packets and be like, "Okay, is mine kind of stacking up to that? Is there something that's like a gap somewhere? I think that would be a great way to realize if you're actually ready to go out for promo as opposed to just you thinking you're going out for promo. Um, at Google, we also have um like a gap analysis template that my manager also had me go through. So, basically there are several categories of qualities that you need to meet to get promos. So, for example, leadership, technical complexity, community contributions, and things like that. And this template basically has you write down what you think you've done that meets each of these categories. And then you go with your manager over the template and identify any gaps, any additional projects or any additional uh work that you would need to get to the next level. >> Okay. So your manager pushed you to do it because she sort of went through all of that on your behalf or did you she pushed you to do it and then you went through the gap analysis? Yeah, that time she kind of just realized that she thought I I would meet the uh different qualities. So then we actually did the gap analysis after she suggested. I actually hadn't even looked at the promo uh qualifications before then. >> Okay. Yeah. So yeah, I think that makes sense. And like the way that I think about it is like you should just be pushing and you should let the system push back on you. Sort of like when you're applying for jobs, right? >> Yeah. Like don't discount yourself. Like the system will tell you if >> Yeah. Like if the if the system says no, then cool, you have your answer, but you should just continue to walk down even if you're sort of unsure of yourself. There's basically going to be this bouncer guy at the end. It's just like, oh, oh, actually, this is a private party. Let the system do that, right? And and if you're basically like, oh, I don't deserve to be in that room. Likely that's a self-fulfilling prophecy. >> Yeah. Yeah, definitely. So, you graduated in 2019 going into 2020, so right before the pandemic, and I think you have just a spectacular resume, I think, from the outside. What advice do you have for somebody that comes from a non-traditional background, somebody that's self-taught? Is it still possible for them to land a job in big tech if that's where they want to go? >> Yeah, 100%. Most of my friends from Google did not go to like the quote unquote like good computer science schools. Like a lot of them went to like state schools. Some of them went to like community college and transferred. So definitely please do not discount yourself because you don't have like a particular school in your resume. Also, I will say as you progress forward in your career, your school matters less and less. It's kind of just there for getting your initial foot in the door. I would hope that after like 10 years like no one cares if you went to like Stanford or you went to like, you know, a UC or something. But I I will say like unfortunately, especially with this market, it does help in order to get your foot in the door to have that school. But what I'll say is like I feel as though everyone that I've met at Google, no matter what school, has been a great engineer and has deserved to be there. So don't let like your school discount you from wanting to get a job in big tech. Like some of the best engineers I know did not go to name brand school and they're doing like much better than me or other one of my friends. Let's talk a little bit about your content on Instagram. Why do you you I mean you have a you have a full-time job as a senior engineer in a at a tech company. Why make content at all? >> I primarily started making content because I realized that there was like a really cool community of people online and it was just purely honestly by accident. I got bored during the pandemic. I posted like one thing about working in big tech and then this uh Instagram account that spotlights uh specifically women in software engineering asked if they could repost me. And then after that like I got a lot of just like connections from other fellow software engineering women and I realized that oh like this is actually like a really wholesome community and people are like working really hard to build each other up and that I want to be a part of this community. So I just kind of kept on posting and like posted more and more. I used to post just memes uh because I I still find them very funny. I now post slightly more educational content and memes and very unhinged like stuff as well, but I have a lot of thoughts on, you know, I'm sure you've heard of the um you know, meta products are like not good for mental health and stuff. So, there's like definitely a lot of cons, but I also say a lot of pros. And for me, the pros have always outweigh the cons because, you know, for example, I wouldn't have met cool people like you if it wasn't for social media. I wouldn't have met my very best friend that I've been to more than 12 countries with if it wasn't for social media. So just having that venue to just meet people and learn from them and do this outside of a 9 to5 is what really keeps me going. And also memes are funny and if I have a reason to doom scroll and find memes that's I'll take it. >> How did you find your best friend? Did they slide into your DMs or did they make content too or? >> Yeah. Um, we actually used to both work at Google, but completely different countries, completely different teams. We never would have met from a business perspective, but we both posted content online and like one of us found the other and slid into the DMs. I think I may have slid into the DMs. That sounds like me. Um, yeah. And then we just like bonded and we had like weekly coffee chats for like two years and like eventually met in person and really clicked and yeah, we've traveled the world together. We have just like had so many good experiences. So yeah, definitely grateful for her. >> What's your plan with this content thing? Like do you want to make content and be a content creator or influencer or do you want to be a highle software engineer? Like >> I personally want to be a highle software engineer. Um I I love content as well, but I think my my priority first and foremost will always be software engineering. I think I am very riskaverse in general and I personally think that if I had to depend on an algorithm for money like just my entire income that would make it very stressful for me. So I I like having both and and doing both. >> Well like what if you could consistently make enough money more than your software engineering salary? Would you consider making a change? >> I personally still wouldn't. I also like to be honest like I I really like coding and I really like just being in a 9 to-5 personally. So just like for for fulfillment I think just doing both is what makes you really happy. >> I think that's great but you and I both know like creating content is more than a full-time job and so what you've decided to do is to have two jobs and so you must really like it. >> I think MIT kind of drilled into my mind that if I'm not like overcommitted I'm doing something wrong if that makes sense. Like I feel like I was just doing everyone was doing so much stuff that the moment I had free time the last time I took like a real vacation where I wasn't doing like any kind of productive stuff was like in college and it was a break between two of my internships and I went like absolutely stir crazy. I like did not know what to do with my life for like a week and a half. So >> I mean you could just be overcommitted at work like that's just one way to do it. >> But it's social media is also fun. I will say like I feel like over just being overcommitted to work leads to burnout for me. >> So what's something that people are talking about that you wish they would just shut up about? They can be in tech or AI or or social media. >> Oh people who talk about AI just for the sake of saying AI I think is is you know everyone is trying to do AI nowadays and like I think there's a lot of really cool applications but I think sometimes people try to shove AI in places where AI doesn't belong. So just like having that buzzword without knowing what the buzz word means or anything I I feel like could be yeah is is something I prefer to see less of. >> Okay. So it's basically like hey you just take it to be true that AI should be everywhere and now we've bolted it on to like some internet of things device or something like that like that's >> and I think like as AI models progress I also think like AI safety is a very important conversation as well. No, of course. But you know, I think Do you believe that software engineering will be fundamentally different in 5 years? >> Yes, 100%. I think that software engineering already has changed a lot between when I graduated and now. Um cuz I I graduated before Chad GPT and before a lot of stuff happened like I graduated right before the pandemic as Steve mentioned. I think that softes will still have jobs, but I I will say that it's probably going to be more about like it's more about prompting and about knowing how to use tools rather than just pure coding. >> If our industry is going to be fundamentally different in 5 years, like why shouldn't we be talking about AI everywhere? >> Oh, I meant more so like I don't think people should be shoving like just like hard shoving AI everywhere. I think like AI has a lot of applications and we're discovering new and new use cases. For example, like as a Californian, something I read recently was that people are using AI to help with earthquake detection. And I think that's like really really cool since as someone who's been told like there's going to be a big earthquake in California every year for like the past like 15 years now. Tangent wise, like I think there are a lot of really cool applications. I I just think like not not everything needs to be like all only AI is what I'm going to say. >> What's a conversation that you think everybody should be having, but nobody is. I think that people are having conversations about like guardrails and AI safety, but I don't think enough people are is is enough of a priority right now at least because there's like definitely like, you know, was it recently where I think Comet uh people were able to get other people's bank information just by like prompting um which is not not cool obviously. Um >> well, how did that work? >> They were able to just prompt like Comet to like give literally give other people's bank information to them just using just using the user interface. So point is like I think there's a there's a balance like of uh creating models that can do a lot of stuff versus like just putting guard rails on those said models. Again this is definitely obviously a conversation that all the companies are having. I just think people should be a bit more concerned about it than the general software engineering populace is. Yeah, I think everybody is just kind of like, look at all this cool stuff that we can do. And then on the application layer, there's all of these security vulnerabilities that are getting introduced by these models. And then on the ethical side of things and then on the like, hey, give me your bank account information stuff or they're also going to take over the world. Like where do you see like the biggest threat in terms of AI? I guess for me it's not so much AI can do a lot of things but actually it's harder and harder to distinguish reality from AI generated content now. So for example before like in 2022 it was so obvious when a video was AI generated and now like it's to me even when I'm trying to look it's almost impossible to tell and I think that's like really scary when it comes for example like if someone says a politician said XYZ you don't know if it was AI generated or you don't know if the politician actually said it. So just having that kind of confusion can I would say like can really affect like outcomes of elections and outcomes of like court cases and things like that. And also I I know there's like really good AI generated voices now that are being used like scam people because before it was more obvious if there's a scam because the person calling didn't sound like your granddaughter or your son or something. And now um people can clone your voice with just like a couple seconds of hearing your voice and that's really scary. So I think that's one of the biggest threats like I I do know for example like companies for example I know Sor is watermarking things and other foundational model companies are trying to put watermarks but I still think for a lot of use cases right now it's really difficult to tell in the wild what is AI and what is not. >> Yeah. I think, you know, I talk to my mom a lot and I'm basically like, "Mom, that's obviously fake." But now, you know, it's turning into like, "Is it? Is this real?" >> Yeah. Like, honestly, sometimes I really can't tell. And I I go to the comments and people can't tell either. So, it's not just me. >> Well, and it's, you know, this is like now represents the worst it will ever be for the rest of time, right? So, it's just getting better. What is your take on the role of government when it comes to uh AI in in these security concerns? >> I think there should be regulation. I personally am not sure what the best like general regulations. I also think that a lot of governmental agencies are more old school. I know for example when governments have tried to regulate things like crypto or like meta back when that case it was kind of obvious that the actual officials designated for writing those laws didn't super understand the use cases and the context. So I feel as though hopefully the government can like either hire more software engineers who understand the technology or or hire like contract more people to write laws that make sense. >> What content are you binging right now? >> Honestly mostly cat videos. [laughter] Okay, the internet was built to send cat videos. This is the core internet process. [laughter] But mostly cat videos, but also I will say like obviously I have a lot of friends who are software engineering content creators and I've watched a lot of your videos, a lot of uh I will say like Sundus' videos, like Tech Unicorn's videos, like a lot of really really great resources that my friends have created. Also, I think a lot of like tutorials like for example like oh like this is how to install MCP server and use this how to create your own. So, I actually do really really appreciate social media for that. It makes um a very boring tutorial appear very engaging for me and I have no attention span. So, >> yeah, [laughter] definitely >> because of the cat videos. >> Yeah, that's my bad. >> Well, actually, uh are there any AI workflows that have like helped out help your life out that other people should be doing? For the content thing, I personally do use uh things for example like Cloud Projects to help kind of structure my videos. Again, like I think uh Tachbt also has projects and so does probably Gemini, but I find sometimes if I just want to yap and just like put all my thoughts like you know into the AI and then just like structures it in a way that I would say that's been really really useful and before it was very tedious to do it manually. Yeah. Also for personal projects like I have been trying like cloud code and cursor and it's been really really cool to be able to just build things so fast and ideulate and focus more on the idea rather than on like the technical uh implementation. I'll say like I'm maybe not the best at prompting so like it hasn't worked as well for more complex projects but for little side projects it's been really really fast and really great. >> Yeah, I completely agree. I think, you know, using like the voice dictation mode and then just kind of just dumping your entire thought on one particular topic and then just having the LLM like organize your thoughts has been much more effective than just being like, "Hey, tell me, you know, write this thing on this particular topic." Like I think our minds are just really bad at uh turning our information into like a hashmap. >> Exactly. Yeah. >> Right. It's just kind of just floating around all there. Oh, that's great. >> Well, also tone for emails. I feel like I I've been told that I sound very apologetic when I email. So sometimes I give an email to an agent and ask it to make it sound more assertive. >> Oh, really? You're just like, "Hey, I want to be a boss bitch." Right. And then you just like send everything through. >> I think it's been helping. >> That's actually a really good idea. That's a good one. I think I need to get like one of the LLMs to tell me like what my default tone is and what's annoying about it and then like change it into something that's like the the best version of me. Yeah, I do I do think even though there have been some modifications, I feel like a lot of um models are still very synchopanic or however you pronounce that word. Like they're very agreeable. So they might not see anything annoying about you even if there is. But I don't think >> Oh, they're super synopantic and and obsequious to be quite honest with you. Yeah, I think and even if you tell it to be, can you be less synopantic? It's like, yeah, absolutely. You're right. It's just [laughter] like stop. >> If you weren't a software engineer, what would you have been? If I weren't a software engineer, I'd probably be a biologist. For context, when I was growing up, whenever people asked me what I wanted to be, it was either a scientist or a concert pianist. The concert pianist thing didn't pan out, obviously. Like, like I was I was I was good for a for a child, but I didn't really keep up with that. But I I've loved biology since I was a kid. I did a lot of competitions. When I was in high school, uh I spent most of my free time studying biology, specifically marine biology. Um, there's this competition called Ocean Science Bowl, which is like a Ocean Science Jeopardy competition where you you answer questions as fast as you can. So, my team actually won nationals for that my last year of high school. When I went to college, I was like, I really want to study biology. However, I didn't necessarily want to commit to grad school. And I think to get like a pretty good job in the biological fields, you kind of need like at least like a master's or PhD or to go to med school. So that didn't end up panning out. But I think in another life, like I definitely probably would be a biologist. >> Well, Maddie, thanks so much for having the conversation with us today. If they wanted to find more from you, where should they go? >> Yeah, thank you so much. This has been so fun. Um, you can find me either on YouTube as Mattie Zang or you can find me on Instagram at maline.mm.zang. Thank you for having me. >> Thanks so much.
