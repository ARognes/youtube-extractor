 >> I I actually made a recent video about this. I got rejected 47 times before I got my first internship in my my freshman year of college. So yeah, definitely. >> That's amazing. >> Yeah. >> Um what what was your first internship >> at a small startup? Um basically we were making um a platform where you could gamify donations. So companies would sponsor and then you could like make donations and you could get like little prizes and do stuff like that. >> Okay. So it's it's basically like the secret of your success is like just going allin, right? >> Yeah. Yeah. Yeah. And I guess like letting the company tell you you're not meant to be instead of you telling yourself that I shouldn't apply because I'm not qualified. >> So the the only way to lose is to quit. >> Yes. >> Great. Any other tips? Especially now, you know, I think when we're filming this, this is, you know, November of 2025. Lots of layoffs going on. everybody's sort of prospects are there's just a big cloud hanging over everybody with AI with all the layoffs um with the slowdowns that are occurring within tech. What can somebody do to increase their chances of getting an offer? >> I would say first and foremost like apply as soon as you see an opening since because there's so much competition. It's honestly a employer's market. So, if there's like a wreck of a job that you would want, if you wait like a day, probably there's going to be hundreds of applicants for it. And um you know, people say like the recruiter is supposed to look at all of the applications and it's not actually just like ATS system, but honestly, the recruiter will probably look at the first X number and like toss the rest. So, definitely apply even before you think your like resume is completely perfect. It's better to submit some application than to submit too late and not have it get looked at at all. I would also say something that I personally didn't do this round that you really should do is referrals. Like my friends who have 