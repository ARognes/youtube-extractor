transcript: Every time I look at Nex.js code, I see problems like this where database code and user permissions and everything is directly accessed in the pages or layouts that you're using them. This is a generally terrible practice since now all of your user management and database access is intertwined with all of your different other logic for your viewbased stuff in your layouts. Instead, you should be using a data access layer. A really basic version of a data access layer just gives you a simple function that when you call it is going to return to you the data and it's going to do all of your user checks and so on. If we take a look at this function, you can see in this get all to-dos function, we're checking our user information, doing all of our redirects and getting all of our database related information all inside of this function. But the problem is this is not very flexible because now every time I call this I'm getting redirected if I don't have a user which is not generally what I want. So instead we can use a much more advanced version of this that when we call this data access layer function instead of returning the data it actually returns us a success and an error and it also returns us the data if it has it. So now we can do things like checking if the user has access before rendering out the content. And if we take a look at the code here it's actually quite simple because we have these really nice helper functions that handle things like requiring authentication and doing all our database related operations. But the important thing here is it doesn't matter if you use a basic or advanced method is that you have some type of data access layer that handles all of your different database queries as well as your database mutations. Now, if you want to learn more about how you can set up this data access layer from beginner all the way to this advanced version right here, I'm going to link a full video at the bottom of your screen where I cover everything you need to know about a data access
