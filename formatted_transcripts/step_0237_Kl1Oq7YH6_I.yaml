transcript: |-
  How much does our entire hand-poured copper bar collection actually weigh?

  In this video, we gather and weigh every copper bar we’ve made at FJS Copper to reveal the final combined weight of our complete collection.

  Each piece began as ordinary scrap copper before being melted, poured and finished by hand. We don’t make perfectly smooth, factory-produced bars. Our goal is to create heavy, rough and completely unique pieces that look like forgotten pirate treasure recovered from the bottom of the sea.

  No two pours are ever exactly the same and those natural textures and imperfections are what make every bar special.

  Watch until the end to discover how much copper we’ve collected, and comment with your guess before the final reveal!

  Want your own piece of hand-poured copper treasure? Our copper bars are available through our Etsy shop. Find the link in our bio.

  Join us as we turn scrap copper into treasure and build a community of 50,000 people who still value handmade metal.

  #CopperBars #CopperMelting #HandPouredCopper
