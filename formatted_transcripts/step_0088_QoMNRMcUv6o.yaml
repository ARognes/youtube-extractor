transcript: Bah qu'est-ce qui t'arrive ? Ça fait 2 heures qu'on t'attend. Je sais maman, ce n'est pas de ma faute. Je suis désolée. Tu pouvais pas téléphoner ? Non. D'où j'étais, je ne pouvais pas. Où étais-tu ? Au commissariat. Au commissariat ? Mais qu'est-ce qui t' arrivé ? Rien de grave, j'espère. En fait, je n'étais plus au commissariat. J'étais à la fourrière pour récupérer la voiture. La fourrière ? Bravo ! Bon, allez, enlève ton manteau, assie-toi et raconte-nous.
