transcript: Quantum computing has been one of the most, if not the most, anticipated new technology on the horizon. But things haven't been going as many in the industry thought they would. Nevertheless, they're more optimistic today than ever. What explains this weird mismatch? Today, I have an explanation for this and also clarification on my opinion about quantum computing. Just last week, we saw another claim of quantum advantage, this time from IBM and researchers at the University of Chicago. Quantum advantage means that a quantum computer did a calculation that would have taken unfeasibly long on a conventional computer. It doesn't necessarily mean that the calculation had any particular use. Indeed, in this new example, as well as in many previous ones, the calculation is to produce a random distribution of values. It's got no known use. There have been other previous claims that quantum advantage has been achieved, but as the philosopher Aram Harrow just nicely summarized in a new paper, within 18 months of any of these demonstrations, they've all been reproduced on a conventional computer or at least been shown to be reproducible. The one exception he names was one of those random sampling cases. Harrow is blunt with his judgement. He writes, "A demonstration that a hardware can run a circuit and that the circuit produces an observable matching a known answer is a demonstration of competent diagnostic engineering. The press cycle of the past several years has conflated such results with computational advantage, and the conflation has been productive of funding without being productive of the matter fact under investigation." What Harrow is referring to is that 5 years ago, many thought that quantum computers would already have a commercial use even when they're small and noisy. This has been referred to as noisy intermediate scale quantum computing NISQ for short. For example, in 2017, researchers from Google claimed that we contend that short-term returns are possible with the small devices that will emerge within the next 5 years. Didn't happen. In 2018, researchers from IBM said that in the near term NISQ computers have the best potential to deliver business advantage. One of them also said that IBM sees the next few years as the dawn of the commercial quantum era. Didn't happen. The quantum computing firm IonQ said in its 2021 annual report, "During the NISQ computing era, we expect quantum machine learning to be the first solution to transition into broadly available applications." Didn't happen. Enrique Solana, one of the founders of the German startup Keepler Quantum, said that we work to reach a NISQ advantage for use cases within 18 to 36 months. That was on August 11th, 2023, almost exactly 36 months ago. Didn't happen. These claims from researchers then spilled over into marketing analysis. The Boston Consulting Group, for example, predicted in 2019 that we anticipate value for end users in these sectors to reach a relatively modest 2 to 5 billion by 2024. The value to end users turned out to be even more modest, namely nil. Today, the only profitable quantum application has been forecasting profitable quantum applications. In my mind, the idea that NISQ computers would have any commercial uses was obviously and I mean 11 out of 10 on the meter. If you need evidence of this other than my word, I'll pretend to be deeply insulted but refer you to John Preskill, one of the world's experts on quantum computing, who for all I know termed the phrase NISQ and who famously did not claim these devices would have any commercial use. Yes, sometimes the relevant bit is what they don't say. So, what I think happened is that academia leaked into industry and consulting firms and no one was there to clean up the mess. No one except possibly Scott Aaronson, who's been saying all along that quantum computers are super interesting from a research perspective, but commercial advantage, well, let's not talk about it. Let me be clear, I'm not saying that quantum computers will never have a commercial use. I just think it'll take a long time to get there, certainly not in this decade and the uses will be extremely niche and limited, not a billion-dollar market. I've noticed that people call me pessimistic when it comes to quantum computers. I think I'm not. It's just that even my most optimistic self thinks it's idiotic that quantum computers will bring a new industrial revolution as some headlines put it. At least confidence has reached fault tolerance. I also want to remind you that Demis Hassabis, who I've put down as one of the most intelligent people on the planet, has argued that whatever quantum processes happen in nature will likely have so many regularities you can model them with AI on a conventional computer. I think scientists aren't taking him seriously enough. If my day had any more hours, I'd try to formalize this into a formal conjecture, but the way things are going, AI will probably beat me to it. The last time I wrote code, it was Fortran. This is why I decided I need to urgently upgrade my coding skills. If you're in a similar situation, I have a recommendation for you. boot.dev, who've been sponsoring this video. boot.dev is focused on backend development, so Python, SQL, Go, the kind of stuff that actually runs the world behind the scenes. And you don't just watch lessons, you build real projects. You write code directly in the browser, you solve challenges, and you level up like it's a slightly nerdy role-playing game. They also have what they call the training grounds, that's basically infinite practice problem. I've been meaning for a while to set up a website for all my content, but I want to know what's going on with the data and what vulnerabilities to watch out for, and boot.dev has been really eye-opening. You can create an account for free, read and watch all the content, and try a demo of the interactive features. If you decide to go for the full experience, use my code Sabina to get 25% off your first year. So, go and check this out. Thanks for watching. See you tomorrow.
