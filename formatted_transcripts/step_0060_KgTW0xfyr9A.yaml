y can also embed other types and as for queries you can also have a type of query or you can have a type of mutation and that is all wrapped up in your overall schema that''s essentially the raw spec and there''s extensions that we can do to that spec but based on these type declarations we can start to generate tooling everyone who''s used graphql probably knows this but there''s a tool called graphical if you haven''t come across it definitely check it out because this is probably one of the most effective inspirational influential tools that i''ve ever come across it''s like a repo for your query so it actually runs against a real graphql endpoint you can do queries see those sample responses you can also check out inline documentation even if it''s deprecated we can note that it''s deprecated and we can tell people what else they should be using every single graphql request is validated before it runs so if you get a badly formed request it won''t even go through there''s a very standard error resolution process that happens when a bad request comes in so this is very similar to how typescript works for the front end but applies to the back end additionally if you use graphql right you can also get savings in data transfer that makes your app work faster and your bandwidth go down there''s a lot of pros and cons to this design and it''s hotly debated so i''m not going to cover it all but i just want to make sure that the point is made that because you have type save back-ends then very good tooling can be generated based on your type safe back-ends and because it''s an industry standard we share the cost of developing things like graphical and that makes graphql a lot easier to work with so from back end to front end we then need to hook it up and that''s the tricky part one of the cool projects that i like to see in this space is called graphql code generator it says what it does it takes graphql and it generates code in our case it generates typescript code and that''s exactly what we need to take types from backend to frontend this isn''t the only strategy in the space you can also go from typescript to graphql and that''s what these two popular projects do type graphql and graphql nexus they both have different ways one uses decorators the other uses standard typescript functions but both are ways of describing what your types are in a way that can also be parsed to generate graphql there''s also smaller solutions like type gql and deck api that are exploring different solutions in this problem space however i just want to step back a little bit and address the elephant in the room which is that we want to enable all of this in order to get better user experience by creating more reliable apps without tech debt but in order to get there we need to stitch together all of these tools and our developer experience goes down especially at the initial part when there''s a learning curve and we have to figure out how to make all these tools talk together because they weren''t designed with a single coherent mindset there''s a lot of complexity in order to get all your ducks in a row to get a full stack type safe experience you need to pick your backend resources and then you need to write graphql resolvers for them you need to generate typescript types and then you also need to have client graphql or typescript libraries and then for everything else that you might need like offline syncing or real-time websockets you have to write custom custom code and probably your the open source ecosystem is not well developed enough for you to do all of this out of the box so the end result of reaching this type safe full stack react goal is that we either glue together our own framework and have to maintain a lot of glue code or we use an integrated framework designed for this workflow and that''s something i''m interested in exploring at aws and working on so for each of these solutions we have aws absync that provides our backend resources like database but it also acts as a graphql gateway graphql transform which is an open source library that helps to write these graphql resolvers and typescript types and aws amplifier helps to do the code generation but it also provides the client libraries that you can use to access the resources that you''ve provided so let me show you what this looks like and the ultimate vision of how we can reduce all the boilerplate but actually still achieve this user experience of full stack type safe react so at aws we''ve actually extended graphql graphql is made to be extensible and one of those ways in which it does that is this cool idea called directives directives are anything with an at on top of them so for example if you write a type in standard schema definition language and you have this all these fields with standard graphql sdl we can actually just add an add model and that''s some that only means whatever we make it to mean graphql has no opinion on that so we can just throw it onto here and if we have an integrator toolkit we can actually spin up the resources that are required to make this into a crud enabled model so we can say all right we have a type post inside of our graphql let''s spin up the functionality to create posts read post update and delete posts and do that on the back end as well as the front end and that''s a fair amount of value add typically the hard part of implementing graphql back-ends is that you have to write a lot of boilerplate for spinning out all these things these are all generated for you just by writing at model just six characters and it saves you a lot of code now i want to stress that this isn''t the only solution that does this so hasura and fauna db both offer similar approaches where you can just specify the graphql schema and it spins up the required database resources they just have different underlying databases backing them so for sure this is not at all a unique insight but this is appsync and this is the aws solution if you want to use aws infrastructure so all right we have add model what other directives can we try we can also try adding off right because you know you want to have some authentication when you do crud the only trick is you do need some off service so of course if you have an integrated tool chain then you can add in something like amazon cognito which is aws''s standard off service in front of appsync the main trick that you have to figure out when implementing such a solution is you have to figure out how to let users specify rules for who can access what so for example you need ways to specify if the whole model is private or if anyone can read but only the owner of the model can write and you need to be able to do this at the model level as well as the field level how about search imagine adding search capability with one more directive and then auto generating search posts functionality with the exact same workflow as everything else that you use so these are all really interesting and there are other directives you can check out with the graphql transform library we''re not going to cover everything exactly but i just want to introduce you to this concept because you''ve done the sdl definition work whenever you use graphql but you might as well use that to spin up a back end and then you can flow the types to the front end with an auto generated toolchain so for the amount of work that you do just to do that it''s actually very powerful to express your full stack type save react that actually brings us to the demo that i''ve set up and i have just enough time to do it so let''s get started i have here a simple create react app it''s been set up with typescript and chakra ui for some nice styling it''s pretty much an extension of what i already showed you with reactant typescript here it''s running and i already have all the client side logic in place and i can submit and it''s going to load uh some values the only issue is that there''s no persistence so if i refresh this app it''s not going to remember anything so our task is to wire it up so it becomes full stack and type safe the first thing i''m going to do is i''m going to initialize my back back-end so i''m going to run amplify init and that actually asks me a few questions to get these process started i''m just going to enter the defaults for all of them but obviously you can customize it however you like and it''s going to auto detect my create reactive settings so i don''t have to modify any of these but i could if i wanted to all right the next process is to add our backend graphql api so i''m going to run amplify add api which is the standard workflow amplify add whatever category i''m trying to add i''m going to pick graphql and again i''m going to use choose the defaults for whatever they offer me by default they''re going to offer me a to-do model i should probably replace that with something that i''m expecting so it''s just going to slightly extend that into a simple blog post model and now i can run amplify push to provision those resources that i just established as part of the push process we also get to configure the code generation for front-end types so we get a full stack all the way from graphql all the way to our front end types so let''s say yes to generate code and we''re going to pick typescript because and we can just hit enter to select all the defaults for the rest so the push and code generation does a couple things and i''m going to talk you through them the first thing that you should check out is inside of your source folder you have an aws exports.js file and this contains all the configuration information that is automatically set up for you by the cli so all you really need to do is import it just importing it at the root of your app sets up your app to connect with the aws backend resources the other thing that''s changed is that we have a new graphql folder where all the typescript types have been generated by default based on our models so for queries we have get blog and list logs and the mutation with create and update and delete so everything as you might expect so inside of our app we can actually import whatever queries have been auto generated by our cli and then we can use them inside of our reactant typescript code as you can see here i make use of api.graphql and i need to import that from the client library which i also need to install so yarn add aws amplify that gives us the api.graphql function as well as its typings and we can also use this to do a create operation so you can import create blog and set the variables to the new values that we''ve set in our react app we should also make sure to import the create blog function from mutations all right let''s have a look at what happens when we run this app now i''m gonna let it take up the full screen and let''s just autofill some content autofill some more and now when i refresh all the data should continue to be there something else that i really appreciate about this workflow is that it decomposes nicely to the underlying aws services for more control if i need them so i can type amplify console here and it''s going to open up the raw services for example here we added the graphql api so i can actually view this in appsync and perform the exact same graphql queries that i was doing in my code uh inside of this little ui that we have over here so i can say list blogs and i can just say give me all of them body title image let''s go and this is exactly the query that i was performing and you can actually play with this but also you can see inside of our data sources i can see that it''s been provisioned by dynamodb i can use other data sources like aurora and inside of dynamodb i have access to all the other capabilities that regular dynodb has as well as the cost and scaling benefits so here i can access all the raw data and access without amplify and i have full ability to eject from whatever setup has been created so that''s a really nice fallback option if i need it now i realize that was a really quick demo and it has no time to cover all the really cool stuff like real-time subscriptions or offline caching but you can check that out on your own mostly i just want to introduce you to the overall concept of an integrated toolkit right amplify provides the cli that you saw the client libraries that you saw and the things that we didn''t see are ui components for you to get set up quickly so for example authentication you might want to have an authentication component in your favorite framework so using this unified workflow we can access all the other categories that are exposed to us via aws like analytics aiml predictions uh authentication data storage for with amazon s3 and uh amplified data store all of these are really really cool features and it just take 10 hours to go through all of them but i encourage you to check it out if you''re interested in this idea of a full stack integrated serverless approach that is typesafe amplify only started about two years ago and it''s getting a lot of traction it''s one of the fastest scoring services within aws and new categories are getting added all the time so in fact this year we actually added live streaming video just in time for the madness of 2020. it''s almost like we planned it but we did not anyway i want to bring it back to type safe full stack react and i want to acknowledge another react-a-thon speaker lauren tan who actually gave me this idea that she first wrote about the strongly typed graph and she says that the strongly type graph builds upon end-to-end type coverage and connects diverse domains into a single graph and that''s a little bit of what we saw today just get to give you a sample it gives teams near real-time visibility of how changes in a larger graph affect your entire organization and that''s the ultimate vision of how we can shift left our error discovery and resolution and improve our developer