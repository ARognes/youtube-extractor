ation is who are you authorization is now that i know who you are do you have access to a particular topic or a particular resource that''s that gets tricky and then when it comes to saving all of this stuff on the server it gets even trickier because well what if you''re what if your database gets licked leaked can people read your passwords or can they not read your passwords how is your hashing structure are you still using hashing from many many years ago or are you using a modern salt and encryption and whatever honestly it''s really hard to even keep up with what you should be doing how you should be doing it and then when it comes to saving the authentication state on the front end because the front end needs to be like hey i know you''re already logged in and i know who you are so i need to tell the server to check with the server whether this is still true do you save that in cookies do you save it in local storage there''s a lot of tricky little things that come with that one of the big ones is that once you split your app into multiple apps you''re going to want to have an authentication service or some sort of authentication provider that can work with multiple services like if i log in on ios do i want to still be logged in in the browser if i switch browsers do i still want to be logged in usually as a user i do but you as an app developer get into a tricky situation where you have to have api based authentication you can just be passing cookies around because you need to have you probably want to use the same authentication for multiple different clients whether they''re a server trying to do something in the name of your user whether it''s the web app trying to do something in the name of the web app all of that gets really tricky so people start building authentication services and they start trying to think about how to do tokens when you really get start reading about it it kind of blows your mind i honestly you just should never roll your own aut