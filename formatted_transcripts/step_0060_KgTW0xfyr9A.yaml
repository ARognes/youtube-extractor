brary and that i believe is what we''re going to be talking about today yeah you''re going to learn how to use uh async code in your react apps you''re going to learn how to use react testing library to test that uh this talk will show you how to test async code such as network calls timers and promises and react these are the things of nightmares for a lot of engineers especially when you go to try to test them so you''re going to learn how to put those nightmares out of your mind and sleep better at night hopefully uh so let''s get straight into this talk with alex kralik hello everybody and welcome to this talk about testing async components i''m alex scrollick i a good box and in my spare time i help out with react testing library before we get into timers promises and api calls i want to do a quick recap of component testing 101 so what that looks like is you''ll have a ui element and you''ll go through three phases to arrange act assert steps so in testing library terms that''s render the component then find elements and fire events on them and then use your expectations to do assertions about the final state so for this example we have a comment box and we''re going to pass in on submit prop that''s a just mock function um into its own submit handler then we''re going to find this uh element the text box element we''re going to enter a value into it then we''re going to click submit and then finally we are going to move into the assertion phase and we''re going to assure that our our click handler has been our submit handler has been called with the right data and that our text submitted has appeared in the document one thing you''ll note so we''re not using act here because react testing library wraps fire event with that automatically so any effects that are generated there and microtasks are cleaned up by react and rendered before we move on to the next of the test the difference between this component and components in a real app is that it''s fully synchronous so there''s no delays everything happens immediately whereas a real test is full of sources of asynchronicity from timers promises and networks you''re going to see animations browser apis are going to be using promises and everything is basically sync all the time so i''m going to walk through each of those three elements timers promises and network and talk about how you can deal with them so first timers i''m going to extend that previous example a little bit and say that we''ve debounced the change handler for the input box that''s inside of this comment modal form thing so what a debounce does is it makes sure that the function isn''t called until the user stops interacting with the thing so we''re now at a 200 millisecond delay to prevent that change handler from being called in every single key press that will affect our test because we can no longer immediately click that button after we stop typing because we''re waiting for that delay to kick in so what do we do about it strategy one we just get rid of the timer completely so we can find anywhere on our code that has a timeout and replace that constant with a zero and the other thing that we can do is mock out any functions that are creating timers i.e the low dash debounce function and replace it with a mock function that we can then assert about so since blue dash debounce is fairly well tested and we we kind of trust it to work this is a pretty good candidate for it because we can say was that function debounced was that callback debounced yes because of this this mock but we don''t care about the actual implementation of that code running so it doesn''t affect our test anymore it''s no longer asynchronous the other strategy that we can do is we can use fake timers meaning it''s like driving a stick shift you''re taking full control of the test and all the time inside of it so uh the way that just handles it and there''s an equivalent sign-on is that there''s an api called fake timers just use fake timer startsit and every time you want to advance time you have to call one of the apis it''s either run all timers which runs every timer that has been created or advanced timers by a time and that will allow it to move forward just only by that specific amount so in our test after our change after we''re triggering that text box is change event we would advance the time by our debounce amount 100 milliseconds and then after that we could finally click the putt the disadvantage of this is that if you have uh advanced timers by time a round timer is all over the place in your test it gets a little bit hard to manage because um now you have to know everywhere that a potential asynchronicity is happening and kind of manually work around it and it can you kind of end up with manual time and control all over the place if this is something you use wildly so the alternative and this is kind of the preferred testing library pattern and something that''s very much enabled by testing library apis is to make the whole test async and then if you want to do uh any optimizations around individual d-bounds or anything like that you can but anything small is going to be glossed over single ticks or 20 20 100 milliseconds that''ll that''ll go off without hiccup in the test so the big difference is in how you write a test that''s async versus synchronous are these so first you''ve got to rewrite your test to await syntax so by changing it to an async function you can then use a weight anywhere which kind of resembles a synchronous thing but it''s actually using promises under the hood and then the big difference is that anywhere where you think that you may have something that''s going to take a certain amount of time or certain amount of ticks you want to replace that manual weight like you know wait 200 milliseconds or advanced time or 20 milliseconds with an assertion about the the next step um and when it''s ready to proceed so in this case what we can say is that that button is disabled well the input box is empty once we type the value in there it will become enabled so what we can say is we can add this little assertion inside of the wait for callback that expects that button to not be disabled and then after that becomes true we''ll be able to move on to clicking it so that''s just a retrial assertion that signals to us when we can continue the test if the assertion that we''re talking about is that an element is appearing we have a shortcut which is that we can replace any get by queries with find by queries so we''re replacing our get by text with a find by text which is an awaitable assertion that will retry until that element is in the dom this pattern is basically what you''re going to use for promises as well as most timers it works pretty well in both scenarios so if you have promises the first thing you''re going to do rewrite async tests but the big difference between a timer test and something that''s dealing with promises the promises typically affect control flow so the code needs to be testing both the resolve path and the reject path so just mock functions can do that for you so if i have a mock function like the one we passed in on submit what we can do is we can say mock rejected value once that''ll say that when that function is called to return a rejected promise with this data which is a 500 status code a server side error and then we can have our async find by text query that''s looking for that server error to be shown to the user in the dom now moving on our final source of asynchronicity is the big one the actual network so in a test you really don''t want to be hitting real servers because for one they''re unreliable um you don''t want your front-end test code to be totally reliant on the entire backend system and for a vital reasons you might not actually be able to access it and then of course as we''ve just shown there''s a good chance that we''re also wanting wanting to be able to test you know error error paths or bad data being passed in finally of course it could be pretty slow so the way we can deal with network api calls in a unit test um first approach take whatever interface that we''re using to call the api and mock it usually they have a promise based interface so we just use the same patterns that we''ve been using um so if we''re using window fetch we replace that with a mock function and then we treat it like a regular promise anywhere that we want to call that api we replace the value with some data that we''ve mocked out and then we respond to the mock results normally if we want to pass in bad data we change it to a rejected downside of this approach if we change our mind about using window fetch we change it to axios or something um now we kind of have to rewrite all of our tests to conform to that new test uh a new data format so for example fetch you always have to call res json do you want to mock out you know the json methods on all this stuff not necessarily um so it might be kind of over constraining your test a little bit if you''re always using these interfaces but to get started if you just have a few calls that you need to mock out this is definitely what you can do it a bit more sophisticated approach is that we could actually mock out a fake server so there''s a few libraries that i am aware of so mock service worker and mirage js they both seem to work fairly similarly the idea is that you have a service worker that can intercept calls to certain routes and then replace them with fake responses so in this example which i pulled from the testing library docs um we set up a server that is responding to this greeting route and it''s sending back a bad bad status code to 500. so every time somebody calls slash greeting that''s what they''re going to get back and then in different tests you can change the response to something else um this works pretty well the only real downside here is that now we''re kind of couple to the network interface rather than the specific library so potentially if we''re thinking about refactoring big chunks of the app we may want to have some kind of abstraction between our actual network calls and what we''re doing in the app so here''s how you could do that so creating an api module is as simple as creating a file let''s call it api js and then you put all of your code design network in there so in this case we''ve got something called get user that''s an async function takes an id and then it does window fetch for a certain endpoint if we later replace that with a different library or we introduce something some response handling in there or even rewrite it to hit a graphql endpoint instead this will keep working because the app code is insulated from that at the same time the way that we use our tests uh we use this module in our test is we can generate create mock from module which will take all of these functions and replace them with mock functions and then we can say okay get user let''s change the value to return say on authenticated status code uh 401 or we could change it to return or actual user data um the downside with that again is that now we kind of have created this additional interface here so we do have to both unit test it and validate that it actually is correct um and then also if you''re working with state management code that is very intelligent that makes api calls on your behalf it''s not necessarily going to want to go through this intermediary module so um so for these like very intelligent new libraries that might not be the way to go so that said we''ve been talking about just we''ve been talking about unit tests i''m talking about the downfalls where interfaces can kind of not be quite right between what we thought we were testing and what actually happens when we build the app so sometimes testing in a real browser in an end-to-end testing scenario is the way to go cyprus is a pretty good library for that cool thing about cyprus is that all 