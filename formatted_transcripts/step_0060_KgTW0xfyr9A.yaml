sions work we''re going to look at in this talk is doing one particular dimensionality reduction algorithm that''s pretty newly developed this is pretty cutting edge and doing this in the browser so this algorithm is called umap and that''s an acronym for uniform manifold approximation and projection but we''re not really going to get into what that means because that''s not actually relevant here okay so let''s dive into umap and see it in action and we''ll start with something that should be pretty familiar to you as front-end engineers and that''s color spaces so the rgb color space has three dimensions red green and blue and so as i''m sure you probably know you define millions of colors by encoding three different numbers from zero to 255 for each of those channels those red green and blue channels so we can visualize this in the proper three dimensions for those three channels by uniformly sampling from the allowed values 0 to 255 for each and we get this uniform cube and then we can actually just apply umap to this telling it to map it onto two dimensions and it will get flattened out just like this and you can still sort of see some features of the original geometry here in in that you see these like corners it''s pretty interesting and you''ll get a different result if you do the same thing on the hsl color space visualized here in its three dimensions but it''s not a cube it''s a cylinder because the hue dimension in hsl is an angle from a circle the the hue circle so if we flatten this one out we get a very different result and again this is just applying umap from three dimensions to two and and again you kind of see some of those features of the original geometry you get these curves here with the hsl where you didn''t see those with the rgb so now that we''ve looked at something pretty familiar color spaces let''s look at something that''s more data science-y and that''s the mnist digits data set so this is a data set that has as we''ll see a hundred d