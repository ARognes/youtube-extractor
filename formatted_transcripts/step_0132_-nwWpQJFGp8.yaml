transcript: '(energetic music) - [Tim] I think the move definitely changed everything ''cause we felt a bit more professional, future leaning. We had an influx of kit, we had Red Bull just dropping off fridges full of drinks, and all these freebies, Sony throwing money at us, and the building was like super cool. We were all quite young and anybody you can think of, I mean, real sort of recluse type programmers who would just sit in the corner and just really enjoy, you know, what they were doing. And then, you had people that were going out clubbing and, you know, maybe investigating various chemical opportunities. (energetic music continues) (energetic music stops) (cassette tape clicking) (cassette tape screeching) (cassette tape clicks) (lively techno music) (lively techno music continues) - Okay, here''s a fact that''s bound to upset practically everyone who watches this video. Right now in 2024, we are closer to the year that the first WipEout game takes place than we are to the year it came out. WipEout was a launch title for the original PlayStation in Europe in 1995. Set in 2052, the game had you compete in an anti-gravity racing league in circuits all around the world. And while its gameplay was certainly enjoyable, the critical elements to WipEout''s success were two things: style and speed. Let''s start with the latter. Back in the mid ''90s, games didn''t look this fast, especially in 3D. When the original Sonic came out, it blew everyone away with its blast processing powered speed. But the days of 2D were ending, and even though Sonic was only released three years before the PlayStation came out, it was already considered to be from a bygone era. The first WipEout was a PlayStation 1 launch title and it cannot be underestimated just how much of a revolution in gaming that console was. Suddenly, most games were in 3D, and WipEout was the most 3D game you''d ever seen. It was the game that lucky PlayStation owners would show their friends to demonstrate how powerful this new console was. But speed can only get you so far, and it was WipEout''s style and aesthetic that made it a ''90s cultural icon. WipEout wasn''t Mario Kart. It wasn''t even F-Zero. Much like the PlayStation itself, WipEout was a product aimed at the jilted generation: young adults who had grown up from speedy hedgehogs and were embracing the wider culture. You can see it in the game''s advertising in the thoughtful art design created by British graphic design studio The Designers Republic. And critically, you could hear it in the game''s ambient sound effects, its slick engine sounds, and, most importantly, its outstanding soundtrack with music from some of the biggest dance acts of the generation. Alongside one talented in-house musician who''d go on to make some of the game''s most iconic tracks, despite the fact that when he started on the project, he couldn''t stand dance music. We''re here today to talk about the sound and music of WipEout, but really this is a story about so much more. It''s about the transition to 3D, the changing mood that mainstream culture was having about video games. It''s about the Liverpool-based studio Psygnosis, one of the most iconic British studios of all time. It''s about sound design, writing music, and the power of creative collaboration. It''s about one of the first ever implementations of licensed music in video games, something so commonplace today it''s hard to remember a time before it. But this story has to start somewhere, and seeing as this is a studio in Europe in the 1990s, it can be perhaps no surprise that our story starts in the Amiga demo scene. Teams of young programmers, artists, and musicians who would compete with each other to make the most interesting games, animations, and visual tricks they could, the proto indie developers all distributed on disks by hand. Also, Puggsy. This story starts with Puggsy. (laid-back music) - Working at Psygnosis, basically my involvement with the Amiga demo scene led me to be part of a couple of demo groups, but pointedly one called Dionysus: yeah, a couple of guys from Liverpool, Lee and Alan. Well, I was already in one, Jester Brothers International, with like brothers and a couple of friends. And one thing led to another, and we created the Puggsy demo, a little character designed and a narrative. So he''s this alien that''s coming to Earth, doesn''t really know what''s going on. He''s a bit haphazard and a bit clumsy. Gets used and abused, bitten by dogs. Goes into a strip club not knowing what it is, and gets thrown out with a pair of ladies knickers on his head. And then, he goes back to try and get away from it all in his spaceship, and it won''t start, he''s gotta fix it. And ultimately, he''s gonna destroy the Earth ''cause it''s like, "Screw you, guys, hate this planet." Bang. And we stopped the demo at that point and said, you know, "You could be responsible for what''s gonna happen in the future." And it was a kind of tongue in cheek if a software house wants to develop this guy into a game. So yeah, we went down to a computer show, bizarrely in suits, ''cause the idea was we''re taking this seriously. We had appointments with various software houses. They looked at the demo and went, "Yeah, we can see there''s some talent there, but it''s not our thing." We kind of disheartened it was the end of the day and we thought, "Let''s try Psygnosis, see if they''ve got any spare slots." And we waited outside and we handed them a disc, and we met Ian Hetherington, sadly, dearly departed, quite recently actually. Yeah, he just was effervescent. "I love this demo. It''s a new style. "It''s what we want. It''s great. What''s with the suits though?" (upbeat music) - Psygnosis was one of the most beloved developers and publishers of this era. In the early ''90s, they had released games like Second Samurai, Bob''s Bad Day, and even Lemmings. We covered that in our documentary on DMA design. Psygnosis crafted a stylish image around themselves, games with slick graphics and animations. Their logo became synonymous with a certain feel. They even hired acclaimed artist Roger Dean to make stylized box art for many of their games. In 1993, they were bought by Sony, and with that came a new office and business expansion. Psygnosis were always on the hunt for the next publishing hit. They liked Pugs In Space and signed the three boys to make a game called Puggsy. The lads were paid to work on the title for a few months, but progress was slow. To find a solution that worked for both Psygnosis and the young developers, Ian Hetherington asked if they could pass along this project to the developers at Traveller''s Tales. He bought the rights to Puggsy and offered the three of them jobs at Psygnosis. This is where Tim cut his teeth writing the music and designing the sounds for some of the Amiga''s most iconic games. And seeing as this was the era before optical media, not only did Tim have to make sure the games sounded good; he also had to make sure that they fit on the disk. - [Tim] I think my first job was the game "Awesome", did stuff for that. And then, I was offered "Shadow of the Beast II". And I think that came out first actually; "Shadow of the Beast II" came out first, then "Awesome." - [Danny] Had "Shadow of the Beast I" been like successful at that stage? I feel like that was one of Psygnosis''s biggest beats. - [Tim] I mean, their thing back then was, you know, "It''s gotta look amazing, animation''s gotta be great, "the sound''s gotta be, ''Wow, is that really coming from an Amiga,''" and that kind of vibe. That had already come out. It had been, I wouldn''t say massively well-received gameplay wise, but, you know, all the reviews said "In typical Psygnosis fashion, "it looks like a lovely cake and it tastes like a lovely cake." But that''s as far as it goes. Gameplay''s okay. - [Danny] Yeah, incredible box art. - [Tim] Exactly, yeah, Roger Dean, you know, did all the Yes albums and stuff. And yeah, he would be approached: "There''s a game, here it is. You''ve got four weeks." And how much RAM have I got for my samples? Oh, don''t know. Hang on a minute. Oh yeah, 10K or something. It''s like what? "Ah, yeah, maybe we can load some stuff later." It''s very much an afterthought with a lot of games. Not everybody. If you wanted to get on, you would provide the music, the sound effects, obviously, all of the sampling or anything to do with the audio side of things, and a play routine, and it would just go into the game. They would just call various callbacks and it would start the music and the music changed the tune that was playing: fade in, fade out, trigger this sound effect, trigger that sound effect. - [Danny] The move towards 3D created a huge shakeup across the UK game scene as many Amiga developers did not survive the transition. Industry leaders like Sensible Software, Krisalis, and the Bitmap Brothers would never make that leap. But Psygnosis did survive and in fact created some of their most popular games in 3D. They developed and published a murderer''s row of classics during the second half of the ''90s: games like "Destruction Derby", "Colony Wars", "G-Police", "Overboard", and "Rollcage". - [Tim] Of course it was, you know, it was a bit of a culture shock really, definitely for the programmers having to learn to code 3D. The hardware was different to the Amiga and some of the earliest 2D platforms, you know, Mega Drive and so on. There was no real concept of that per se. Yeah, and for the artists, they''ve gotta learn new things. They''ve gotta embrace a 3D package; "How do I design objects in 3D?" I mean, it really is a total culture shock. They can still use their 2D skills for producing UI and that kind of thing. But, you know, if you''ve gotta build a spaceship, or a racing car, or a vista that you fly over or drive through, yeah, massive learning curve. For the musicians and the sound effects guys, not so much. It''s more sort of like a breath of fresh air ''cause "Okay, wow, I was doing everything sequenced, "so everything''s being played real time. "And now, hopefully I can do CD audio, so I''m a proper musician now." Although that caused problems as well ''cause people who didn''t have the chops, you know, there''s other musicians out there, you know, the ones on top of the pops and chart hits and all those classical orchestras, you know, 45, 12-piece chamber, whatever; you''re now essentially competing with those people. You''re in-house and we go to you first, but don''t rely on it; so kind of nerve-wracking from that perspective. - Tim had just finished the soundtrack to "Krazy Ivan", a Nine Inch Nails inspired soundtrack when the prototype of WipEout was being worked on. A version of this prototype would later appear in the movie "Hackers", only adding to the lore of this series. As was so often the case at Psygnosis, by the time Tim came on the project, they already had a playable version of WipEout running; it just needed music. The only problem was Tim wasn''t exactly a great fit for the type of music the development team was thinking of. (machinery whirring) (ships whirring) - [Tim] Yeah, I was eventually made aware of the "Hackers" thing at the same time roughly that I was being engaged to create music and sound effects for it. The way I was told was that Nick Burgham had been playing Mario Kart, but instead of the classic Mario music, he was just listening to basically dance music, techno, all manner of tunes of that ilk. And he''d mentioned, I think to one of the other graphic artists, "Ah, there''s something in this." (energetic electronic music) "But wouldn''t it be better if it was, like, really super fast and really breakneck." So the wheels were ditched; it''s gotta be flying. But then it''s like, "Well, maybe it''s, you know, ships that hover around the track." And I think that''s kind of loosely how it came about, and that''s the point where I was brought on board. "Look, these are the tunes that we''re looking at." So I was given various sample bits of music: I think some Orbital stuff, maybe a bit of Leftfield, but then a whole host of other tunes. - [Danny] And would you have been into that scene before that? - No. - Were you producing music even in that ilk? - I hated it with a passion. I didn''t like ambience. I didn''t like that kind of techno trance, acid. I was a child of the kinda late ''70s, early ''80s, so there was a little bit of punk and ska and definitely New Romantic. And then, the synthesizer dudes like Human League, Depeche Mode, Tangerine Dream, Kraftwerk, Jean Michel Jarre, Vangelis. So that''s quite a smorgasbord of styles, but anything with a synthesizer and a good melody. And then, when I was asked to do WipEout, I had a couple of tracks that I hadn''t used in Krazy Ivan. So I lazily went, "What about this one?" And they went, "This sounds like Krazy Ivan". I said, "Oh yeah, okay, fair enough." "No, no, like this," and then they just handed me, you know, loads of CDs of where they wanted to go with it musically. So I listened to that and thought, "Oh no, not that," you know, whistle in your mouth, take a knee, kinda whee. Repetitive, just like (imitates drumbeat bouncing) where the baseline just goes (imitates bassline bumping). I didn''t get it. No, didn''t like it at all. I was terrified, to be honest, ''cause once that first track was turned down and then I was presented with this is what we want and it wasn''t me and I didn''t like it, I then thought, "Right, treat this professionally." It would''ve been something like future music. I would''ve gone through that and then picked out articles that would''ve been useful. And then, there was a company called Time and Space based in the UK that were producing sample CDs that a lot of the top producers were using to create this kind of music. A lot of the WipEout music lent on those CDs very heavily but put together in a way that I thought, like me doing techno, me doing trance. I had a rolling JD-800 and that was really good at doing squelchy sounds and some like really full on distorted kick sounds. There''s even a few Amiga sounds in there just for, you know, shits and giggles. I started doing that and was still like, "I don''t really know what I''m doing," and it''s gotta be breakneck speed so the BPMs were up really high. And then, one of the girl artists came up and she said, "Oh, have you finished the track yet?" And I said, "Yeah, pretty much." "Oh, can I have a listen?" "Yeah." So I played it to her, and she was like nodding her head and going, "Oh yeah, good, good, good," and I think it was about four minutes long. And she said, "Okay, so you''ve done "like sort of four or five, so how many are you doing?" And I said, "Sorry?" "Well, you know, you''ve played me four or five of your tracks there." And I said, "No, that''s just one." "What? "But it sort of does this and then it goes da da da da, "and then this new theme and da da da da, and this new theme." I said, "Yeah, that''s ''cause I''m shitting myself. I don''t know what I''m doing." I don''t personally like (imitates bassline bumping) for like five minutes. So I did it for like 30 seconds. I''m getting bored, so we''ll do a little transition and the new thing, and then we''ll come back, you know, we''ll come back to that first refrain maybe near the end. (energetic techno music) And so that ended up being kinda like the CoLD SToRAGE sound. But honestly, as I was doing it, I started to sort of enjoy myself. But the real thing was when they took me out to a nightclub. They said, "Look, you need to experience this. "I know you''re doing okay, but you don''t really get it, do you?" "No." So I went out and I thought, "Right, let''s get to the bar. Oh, we''re not drinking." Bottle of water, and they would drop in some, should we say little tablets, and I was like, "No, I''m not doing that." But after about an hour and I was covered in sweat and I was just drinking loads and loads of water because I was having a full workout, and I got it, I finally got it: that slow transition where the high hats are sort of coming in and then going away, and then the bass is just, the filter''s just getting tweaked slightly. It''s music to dance to. It''s not to be listened to. So then, when you come back from the nightclub and you''ve got your CD and you put it on, you''re not really listening to it as a piece of music per se necessarily. You''re remembering that great night you had at some nightclub somewhere, and it just gives you that buzz again. So that''s why in "WipEout 2097" it''s a bit more traditional in terms of it not being like seven themes glued together. The response from a lot of the record labels were, "We don''t wanna get involved in that nerdy, back bedroom gaming kinda scene." So then, WipEout was complete. We''d managed to convince these three bands to come on board; I think they kinda got that it was gonna be cool. And then, the advertising started: a young couple laying there with blood pouring out of their nose, you know, that kind of vibe. It was like really dirty and grimy and then it was aimed at all these people coming back from the club high or drunk or whatever, and this is the after party, you know, they''re playing with it. And it did really well, and the press loved it, and then announcement, "Yeah, we''re making a second one," and the phone was off the hook from all the record labels going, "We want a slice of this. How do we get in?" (catchy techno music) (catchy techno music continues) (catchy techno music ends) (ship explodes) (upbeat techno music) I remember talking to Nick. I don''t remember the exact conversation, but the gist of it was he was telling me, "This is great." "We haven''t got like the pick of the bunch or whatever, "but we''ve got so many options. It''s really great." And I said, "Yeah, okay, fair enough, but you''ll still need me for the sound effects, won''t you?" And he went, "Yeah, but you''re not gonna do music for this one." I said, "Right, okay. "If it''s a choice between that fellow called CoLD SToRAGE, who the hell''s he, and, you know, someone..." "No, no, no, this is the games company. You''re a games musician. You deserve a slot." I went on regardless. I thought, "Surely I''m gonna have at least one track here." And I''d always wanted to try and calm down and not be so nervous about these tracks have gotta be, (imitates bassline bumping) full on 140, 150 BPM. How slow can I make this song and it still be driving? And at this point I''d listened to a lot of Chemical Brothers and Fat Boy Slim and all the big beat guys, you know, where you''ve got that, (imitates bassline bumping) you know, that whole wha and that''s a real adrenaline pump when you hit that, and when you hear that bam, that big drop. "Okay, I''ll take a leaf out of that book," created a beat, and then I just dropped the BPM, dropped it, dropped it, and I had WipEout running on the screen. And I got to a point where I thought, "Okay, that''s getting a bit dicey now," and I started playing and I bump it up another BPM. Hmm, one more. "Okay, perfect, that''s as low as I''m gonna dare go." And then, I completed that, and then I went down to the programmers and I said, "Oh, I''ve got a track for the next WipEout. "Can you put it in ''cause I think it''s gonna work okay. But ''2097'' looks a bit different." "Yeah, sure." Put it in and then started playing it: "Yeah, that''s gonna work okay." And it was about 95% complete; you know, I''d mastered it a little bit. It wasn''t long after, maybe two or three days later, and one of the marketing girls, ladies, I should say, was down there. Anyway, she takes the headphones off and says to, I think it was Mark, one of the developers, "Yeah, it''s coming along great. "It''s so much easier to play than the first one, banging into the wall and slowing down," ''cause it had been made a little bit easier play wise. And she said, "Yeah, yeah, great." And then, she sort of turned to walk away and she goes, "Oh, by the way, you just put that music on, or is it one of the tracks?" "Oh yeah, it''s one of the tracks. It''s Tim." "Oh, that''s gotta stay in, love it," and walked off. And I thought, "Okay. So I thought, "I''ll write one more. I might get one more in there." So I went up, and I was messing around for a bit and then I found that sample body in motion. ♪ Body in motion, body in motion, body in motion ♪ - And I thought, well, I''m just gonna loop that through as kind of a statement, and then that one got in. Actually, I think that one was a bit dicey as to whether it would get in, not that people didn''t like it. But they had a roster, and someone dropped out or something, and I said, "Oh, I''ve got a backup." "Oh yeah, we''ll just throw that in." (catchy techno music) When the first WipEout was being developed, we''d only recently kinda moved to Wavertree Technology Park. We''d originally been down in the docks in some old warehouses. I mean, they were okay, but they weren''t ideally suited for game development. And they certainly weren''t suited for me because the room I was in had somewhat like a 35 foot high ceiling with tin sheeting, so if it rained, snowed, or there were high winds... Can you imagine trying to mix music in that sort of environment? And it was cold, hence CoLD SToRAGE; that''s where the name came from. In summer, it was a delight, but in winter it was... There was a radiator in there, but, I mean, all the heat was 35 up in the air. So I''d have to try and keep the door closed and hope it came down, and then people would come in, leave the door open. So I said to one of the programmers, "Oh, screw this, I''m going back to cold storage." And then, eventually I put cold storage on the door just as a kinda piss take. And then, when Nick said, "You don''t really wanna "be on WipEout as Tim Wright, do you? Why don''t you come up with some sort of name?" (energetic techno music) The shield, mines, and all that kind of thing. In the first one, it''s actually of a program on the Commodore Amiga, the speech synthesizer program. - [Automated] Oh, don''t I sound just like a lady? - [Tim] And you can sort of change the phonemes a little bit, so I just got it to say all the things it needed to: you know, electro bolt, and all that kind of thing. Sampled those, and then EQ''d them so that they''re a little bit base heavy, a little bit crispy, put it through a chorus, maybe a phaser and a few other effects. And then, compress it so it''s like, you know, so it''s like that, you know, really tighten and cuts through the sound effects and the music. (low compressed samples vocalizing) So the other thing in terms of sound effects, apart from the speech and collision sounds and that kind of thing, are the engine sounds. One thing that I learned pretty quickly was I thought, "Right, these kinda like big thrusting roaring engines, and they''re gonna sound amazing," and it quickly became apparent that''s the wrong approach. And actually, it was good. It taught me to think about that kind of thing in a different way with, you know, a lot of when you develop for motorcycle games or truck racing games or car racing games. So you get rid of all of that roar and all of the kind of meat of the engine, and it''s all just about the wind noise and a little bit of turbine whine and stuff like that. And the reason that that''s important is because you need the space for the voice saying, "Shields" and all that kind of thing and the collision sounds, but mainly the music. (groovy techno music) (voice samples vocalizing) - [Danny] Tim''s music stood shoulder to shoulder with tracks from some of the biggest artists in British dance music, a remarkable achievement considering he didn''t even like dance music until he started working on this project. I''m a huge fan of the music from that era. My brother was in college during the late ''90s and would frequently lend me CDs from artists like Leftfield and Orbital, so I had to nerd out with Tim about his interactions with British dance music royalty. - I got the opportunity to meet Leftfield, Orbital, and Chemical Brothers. I was on stage with Chemical Brothers at one of their gigs in Liverpool just as a hangar on, just sort of bang about on the end of the stage there; so they were cool. Orbital I really kinda clicked with. Paul and I sort of chatted for quite a while. I went to his house, went to the studio, played him and his brother my "Krazy Ivan" music. And they said, "Oh cool, when did you release that album?" I said, "No, no, it''s for the game Krazy Ivan." "But it''s out there, you''ve put it- "No." "Get it out, put it out on an album." I still haven''t, (chuckles) it''s still not out there, but I''m remedying this hopefully. And Leftfield, yeah, we didn''t really get to chat with ''em too much, but we were invited to a few gigs and we went backstage with them a couple of times. - [Danny] I remember at the time or years later wondering why Leftfield weren''t on the second one, but I guess I think "Rhythm and Stealth" didn''t come out for a number of years after; so they probably just didn''t have any music or something? - Oh my god, "Rhythm and Stealth". - Oh, god, yeah. - I love that album. I get shivers up my spine just thinking about it. - [Danny] It''s an all timer. I''m so glad he''s back making music as well. - Yeah. It came out right about the time I got a 24 Valve Fiat Coupey, bright yellow with black interior, and it was stupidly fast. (imitates bassline bumping) and I''d hit the accelerator. (calm music) - You cannot talk about the history of British game design without talking about Psygnosis. You can''t talk about the history of Amiga games or PlayStation games without bringing them up. And as much as I love so many of their games for so many different reasons, there is something special about WipEout that just can''t be reproduced. Even after Sony rebranded Psygnosis as Studio Liverpool and they released some terrific WipEout games of their own, it just wasn''t the same. Not because these games didn''t play well, but because there was no way of recapturing the moment in time in which WipEout was released. A planet full of gamers used to looking at 2D Sprites suddenly catapulted into a breakneck futuristic 3D world, but crucially a world which reflected the growth of games into the wider culture where for the first time the lines were blurred between the world on your TV and the world you experience with your friends on a Saturday night. The PlayStation WipEout games are irreplaceable and unrepeatable, and I think that''s what makes them so special. You just kind of had to be there. - In terms of how it''s propelled aspects of my work and life and career, I mean, it''s just precious. How lucky can you get? You happen to be working for the company in the UK that Sony wanna throw a load of money into to develop for PlayStation. I mean, that''s a manner from Heaven. And then, to slide through that and produce CD audio music for all of these games... You don''t know which one''s gonna do well. But, I mean, when I look back and I see, you know, the Shadow of the Beast, Lemmings, I mean, thank you, God, or whoever the entity was that gave me that one, and WipEout and Colony Wars, and some of the ones that I don''t really think about that much like "Formula 1" and "Adidas Power Soccer". On the whole, I was a jammy bastard basically; it fell nicely for me. So yeah, it means the world, Psygnosis: the people, the experiences, the projects. So it''s a delight to do these kinda things where you get to remember the good times and reminisce. (calm music ends) (bright music) (ships whirring) - [Automated] Three, two, one, go. (bright techno music) (bright techno music continues) (bright techno music continues) (bright techno music continues) (bright techno music continues) (bright techno music continues) (bright techno music continues) (