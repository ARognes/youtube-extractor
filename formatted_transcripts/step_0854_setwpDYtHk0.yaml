transcript: Over the last 40 [music] years, the United States has been exposed to something that our biology was never intended to handle. Energy dense, highly palatable, rapidly absorbable, ultra-processed foods. These products [music] can really trigger all the core signs of addiction. Loss of control, those intense cravings, [music] that continued use even though you know it may be killing or harming you. I discovered the food system is toxic and most people feel trapped. I think they know it's not healthy for them, but it's just beyond the person's capacity to stop themselves. There's so much information out how to get you addicted down to the molecule, down to like the moment of what you're looking at on your phone. It really is a war. People aren't consuming food, they are using it. These products are so bad that their own CEOs can't eat them. Here we go. First, holy cow. Mhm. That is so good. Who are we protecting when they are are protected from I'm not going to castigate the people that work in the food and beverage industry. What I >> You're not? No, what I want to >> job. If we can't trust that these companies can keep us healthy, we need to build one that does. And so, I realized the only choice I had was to do it myself. Whole Foods, here we come. Going to just shop up and down the aisles. When you walk into a grocery store, they are predator and you are prey. I'm trying to find a healthy cookie. This is not it. Yeah, unbleached enriched wheat. The companies knowingly use science to create the most addictive products possible. The perfect combination of fats, sugar, and salt to appeal to your worst instincts. It's kind of like walking into a casino where it's been engineered for you to buy, buy, buy. Oftentimes, many of these forces you're not even aware of. The colors you see, and the design on the packaging, the words they use, it's a challenge to think consciously and unconsciously. You either solve for food in your house or you don't. And if you have that one gaping hole of one meal a day, there's in a predicament. Like, you have to. It's such a gigantic problem to solve [music] for a meal. Blueprint is designed to solve a very practical problem I had, which is I discovered the food system is toxic. No company can be trusted because they don't test and or they say things that are not [music] true. And after going through this experience, I realized the only choice I had was to do it myself. Each of these brands have knocked off one or a small number of things, >> [music] >> but no one's gone after the entirety of your diet. What we did was for Bryan. It was not the intention to say that other people should or need to do this for themselves. What we tried to say was like, what happens when? [music] And he was willing to be rigorous with his own body and with his own lifestyle and schedule to test that and see what happens. What is your daily dietary strategy? [music] Where do you stand with your diet? >> I'm not carnivore, I'm not vegan, I'm not vegetarian, [music] I'm not paleo, I'm not keto. I don't care. I just want to look at the evidence and say, you take a given thing, you put it in the body, what [music] happens? We looked at the scientific evidence behind the best performing foods according to all the science that's been done [music] around nutrition, and we just said, "Okay, let's take the top performer and then number two, number three." And we just said, "What are those foods?" We had a master list. How can we now turn these ingredients into edible things? Sweet things here, savory things here, and that's how you get nutty pudding and super veggie. Super veggies take two, AB mark. [music] Both super veggie and nutty pudding are designed to have a combination of carbohydrates, fats, protein, dietary fiber, and a bunch of other nutrients that basically solve for the majority of a person's needs. >> [music] >> So, when I first started here, we started with only nutty pudding and super veggies. [music] And it's probably one of the most cost-efficient ways of eating because they're single whole ingredients that you're primarily using. [music] For the super veggies, we start with a black lentil base. [music] I mix it in with some chopped garlic and ginger, some apple cider vinegar, cumin, [music] shiitake mushrooms, broccoli, and cauliflower. That's the base of his super veggies. Take six, AB mark. As far as his nutty [music] pudding goes, we use macadamia nut milk or any type of nut milk, macadamia nuts, hemp seeds, [music] flax seeds, walnuts. There's nothing about this. >> [gasps] >> This is the easiest, most uncomplicated [music] way of eating. >> [music] >> Blue Apron Fresh is the meal delivery service. It comes straight to your door, and it's made by local restaurants in the area, and you get to choose the fresh food that you're able to get based upon your preferences for your diet. We did this because people would get half their calories from our extra virgin olive oil, proteins, collagen peptides, but then the other half their calories they had to go out in the world to the supermarket. And then in doing that, you're exposed to all the same problems. So, you're trying to find the highest purity, potency, and quality of the ingredient, and also be affordable. When we were getting this dish put together, they specifically wanted us to use the best almond milk that was possible in the market. As far as the protein powder, which is the cleanest out available, make everything from scratch, and it was a hit. We're also always looking into things we can improve. Like, for example, packaging. We did a deep dive to try to find the perfect packaging that had no toxins whatsoever. We couldn't find it. Like, there's nobody who manufactures the perfect product. But, I guess the important thing is we try very hard. We've gone to the ends of the earth to look at every possible option. And what you see is I think the best in the world. These are actually eco-friendly fiber paper trays specifically for Blueprint. >> [music] >> Yeah, but you're not going to make any money doing this. Uh that's true. That food is a very low margin business. I wouldn't do this if uh it was for the money. As an entrepreneur, there's a hundred other businesses I would build if I was interested in money alone. Much easier to make money off of addictions. Easy things that keep people hooked like candy bars. But, what does it mean to try to prioritize someone's well-being above >> [music] >> making money? And so, that's the infrastructure we're trying to build. And this is like crazy idea that we may or may not be able to do. And it's intensely complicated. And it's probably going to take us a lot of time and a lot of effort. And we may barely survive. But, that's what we're trying to do. I'm now on campus with my friends and I'm having burgers and fries. And here I am with my nutty pudding. Very healthy. Cheers. I've decided to cook the super veggie. We got the nutty pudding. All right. Family's in town. I made them try the nutty pudding here. What do you think? >> [music] >> Delicious. What's really impressive and what I'm proud about is that we've been alive for 2 years. And we have done a more comprehensive job of solving for the individual for a greater proportion [music] of a person's daily caloric intake than any company in the entire world. And we've tried our very best to bring the best of science and make it affordable for everybody. I'm a mom and a school counselor. And I wanted to make tweaks to be better about my health and be a better like steward over my own body. I think my family thinks I'm crazy. >> [gasps] >> And maybe I am a little crazy, but like I don't know. I just had to try it. I just had to give it a shot. It is an endeavor that is fueled by passion. And I think that I could imagine easily Blueprint becoming the infrastructure for health that in 100 years we'll look back and say how do we ever live without that knowledge? >> [music] >> If it's the case that people of the 25th century do point back and say we like those guys. They were a beacon of hope and a bright light in a dim world. We could be those people [music] and still going like a longevity ice cream store. That we had the insight and courage to do something well beyond our time and to see it. My son helped me mix the 90 pudding. Because ultimately [music] the thing we care about the most is to be alive. I want to have a very long life so I can take care of my donkeys into old age. Yes, these two dogs. Yes. I need to keep my body fit and I I want to enjoy my my life and not let my body become a prison. First time I prioritized my health [music] and sleep above work and I did have two consecutive days of 100% sleep score. Hey, what's up guys? >> [laughter] >> Going to continue to continue to take [music] our After eating the 90 pudding and taking the vitamins, I wasn't as hungry throughout the day. Today I'm feeling pretty good and hopefully in a week's time >> [music] >> I will be able to report progress and success. But I also have to remember that as long as I don't give up I am succeeding.
