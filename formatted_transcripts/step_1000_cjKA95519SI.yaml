iple tap on the side button. Next, have phone free places. >> So, put down that phone and listen up. >> First question is, have you fubbed your friends? Fubbing is when you phone snub somebody and you look at your screen instead of making eye contact. This makes everybody around you more stressed and erodess your relationships. A 2025 study showed that fubbing reduces relationship satisfaction by 9%. And it made conflict and jealousy much more likely. Be a good human and maintain eye contact. Put your phone away when somebody else is talking. You can also establish phoneree zones at the dinner table, in the bedroom, in the front seat of the car. One solution is to keep your phone charger outside your bedroom, which prevents you from doom scrolling all night long, wrecking your sleep. >> Put it down. It's not worth it. >> Next, you can schedule phoneree times. >> Say the mere presence of our phones can cause brain drain, whether they're on or even off. >> We all need long stretches of time without access to our phones. Do a small experiment. Lock it in a drawer for 60 minutes and just see how you feel. With that small success, you can then try a half day. A good sleep hygiene practice is 60 minutes before bed, shut that down. Next, let's do a screen time audit. Sometimes just seeing the horrifying information of how much you actually use your phone can actually lessen your usage. One way to approach this problem is to identify which apps you're spending the most time on. If Instagram is your weakness, try as the first step cutting that time in half. Once you've accomplished that and build this momentum, check in weekly to see if you're on point or if you can cut it further. Friends, real talk now is the acknowledgement that we are all compulsively addicted to our phones. Children, parents, everybody. It is incredibly hard to not do this because on our phones are things that we love and care about, our work, our friends, our family, entertainment. This creates a very 