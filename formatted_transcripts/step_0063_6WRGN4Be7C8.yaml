transcript: Why would a company ask you about a big mistake that you had made? >> They want to see did you respond to this mistake? >> Exactly. How did you respond to this mistake to become a better person by learning different lessons? [music] >> Yeah. >> The magnitude of the mistake almost tells you how high of a level you are. Cuz to truly screw up means that you have to have had the scope where the blast radius wasn't controlled. Also, they want to select for people that are reflective. So, I think that's that's really important. They do not ask that question because they want people who make a lot of mistakes. Right?
