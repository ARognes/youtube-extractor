transcript: '[gasps] >> In this Simpsons Halloween special mysterious visitors arrive at the door. Homer discovers a shocking secret about Homer discovers a shocking secret about Maggie. Marge then tells a supernatural story. So, who is Maggie''s real father? The way this video will work is simple. First, we''ll watch part of the clip with subtitles. Then, we''ll learn the most important vocabulary, expressions, pronunciation, and cultural context. And finally, we''ll watch the full clip without subtitles. You will understand almost 100% by the end of this video. >> [music] [gasps and sighs] [laughter] >> The phrase en fait means actually or in fact. It''s one of the most common French conversation fillers used to correct or clarify something someone just said. For example, you could say "En fait, je préfère le thé." Actually, I prefer tea. >> [music] >> The phrase "ma fille" means my daughter. But here''s the thing, "fille" on its own just means girl, and it''s only when you add a possessive like "ma" that it shifts to mean daughter. Context is everything with this word. For example, you could say "Ma fille a 3 ans." My daughter is 3 years old. >> [music] >> The word "appréhender" means dreaded or feared. In French, "appréhender" is a bit of a false friend. It doesn''t just mean to apprehend like catching someone. It''s most common everyday use is to dread or to feel anxious about something that hasn''t happened yet. For example, you could say "J''appréhende l''examen de demain." I''m dreading tomorrow''s exam. >> [groaning] [gasps] >> The expression "veut dire" literally translates to wants to say, but it''s the standard French way to say means. You''ll hear it all the time. It''s way more natural than using the verb "signifier" in everyday conversation. For example, you could say "Que veut dire ce ?" What does this word mean? >> [sighs and gasps] >> The phrase a parlé is the past tense of parlé, meaning to talk or to speak. What''s really interesting here is the little word en. It replaces about it or about that, so you don''t have to repeat the topic. The whole construction en parler à quelqu''un means to talk to someone about it. For example, you could say Did you talk to him about that? >> [sighs and gasps] >> The phrase est le père means is the father. In French, père is the word for father, and you''ll often see it in the expression père de, meaning father of. It''s also used in compounds like grand-père for grandfather or beau-père for father-in-law or stepfather. For example, you could say He is the father of three children. >> [laughter] [laughter] >> The phrase tu as pu is a casual contraction of tu as pu, meaning could you or were you able to? It uses the passé composé of pouvoir, the verb to be able to. In spoken French, tu as almost always gets shortened to ta. So, you''ll hear this constantly in everyday conversation. For example, you could say How could you do that? >> [laughter and crying] >> The word mieux means better. It''s the irregular comparative form of bien, meaning well. A common mistake is saying plus bien, but that''s incorrect. You always say mieux for better when talking about how something is done or experienced. For example, you could say I feel better today. >> Watch, understand, review, speak. While watching real-world videos, you can look up any words you don''t know. You can even use the FluentU Chrome extension while watching YouTube videos or Netflix shows, making language learning feel much more natural and enjoyable. You can check the definition, read example sentences written by native speakers, and watch video examples. Video examples are one of the most effective ways to learn a new word because you can see how the word is actually used in different situations. This helps you understand not just the meaning of a word, but how people actually use it in real life. Try it yourself. You''ll immediately see why it''s so effective. After watching the video, you can review difficult words with quizzes based on the same content you''ve just watched. Because the whole experience is connected, it''s much easier to remember what you''ve learned. Finally, you can practice with the AI tutor by using those new words in real conversations. This helps you turn new vocabulary into the skills that you can actually use. So, instead of just memorizing words, you''re learning them, reviewing them, and actually using them in conversation. Click the link in the description to check it out with a free trial. The word comes from the verb remonter, meaning to go back in time. When you''re talking about when something happened, you use remonter à. It''s the go-to expression for tracing something back to a point in time. For example, you could say This tradition goes back to the Middle Ages. The word agréable means pleasant or nice. It always goes after the noun, unlike some common French adjectives that go before. For example, you could say It was a pleasant evening. The word enlever comes from the verb enlever, which usually means to remove or to take off, like taking off a jacket. But when used with a person, it means to kidnap or to abduct. Notice the extra e at the end. That''s because Marge is a woman, so the past participle agrees with her. For example, you could say The president was kidnapped. >> Sans prévenir, des extraterrestres m''ont enlevé. >> Oh! >> Attention, préparez-vous à être enlevé. >> [music] >> Oh! >> Félicitations. On vous a choisi pour participer à notre programme de métissage. Pour vous mettre à l''aise, nous avons recréé les lieux que votre espèce affectionne >> pour participer à notre programme de métissage. >> On vous a choisi pour participer à notre programme de métissage. Pour vous mettre à l''aise, nous avons recréé les lieux que votre espèce affectionne pour se reproduire. >> mettre à l''aise, nous avons recréé les lieux. >> The expression à l''aise means at ease or comfortable. It''s super common in everyday French. You''ll hear mets-toi à l''aise, which is like saying "Make yourself comfortable." It works both for physical comfort and feeling relaxed in a situation. For example, you could say, >> Je me sens à l''aise ici. >> I feel comfortable here. >> Pour vous mettre à l''aise, nous avons recréé les lieux que votre espèce affectionne pour se reproduire. Vous pouvez choisir soit le siège arrière d''une Camaro, >> votre espèce affectionne pour se reproduire. >> The phrase se reproduire means to reproduce or to breed. It''s a reflexive verb. The se signals that the action is something the subject does to or for itself. You''ll often hear it in nature documentaries or biology contexts. For example, you could say, >> Les pandas ont du mal à se reproduire en captivité. >> Pandas have trouble reproducing in captivity. >> que votre espèce affectionne pour se reproduire. Vous pouvez choisir soit le siège arrière d''une Camaro, les toilettes d''un avion, les noces d''une amie ou une ruelle >> choisir soit le siège arrière d''une Camaro, les toilettes d''un avion, >> The phrase siège arrière means backseat. In French, siège on its own means seat, and adding arrière specifies it''s the rear one. You''ll hear this a lot when talking about cars. The front seat would be siège avant. For example, you could say The kids are in the backseat. The word ruelle means alley or narrow street. It''s the diminutive of rue, which means street, so think of it as a little street. You''ll often see it used for those narrow, sometimes sketchy back alleys. For example, you could say He lives in a quiet alley. The word choix means choice. It''s pronounced with a wa sound at the end. That X is silent. You''ll often hear it in the expression avoir le choix, meaning to have a choice, just like in this line. For example, you could say You have the choice between the two. The word ravissante means ravishing or stunning. It''s quite a formal, elegant compliment, the kind you''d use at a fancy dinner or gala. Notice it ends in e here because it''s describing a woman. For a man, you''d say ravissant without the e. For example, you could say She looks stunning in that dress. The word diminuer means to reduce or to decrease. It''s used for anything getting smaller, volume, weight, pain, you name it. You''ll often hear it paired with things like For example, you could say We need to turn down the volume. The phrase techniques sophistiquées means sophisticated techniques. In French, the adjective comes after the noun here, which is the default position for most adjectives. Notice how sophistiquée takes an extra e and s to agree with the feminine plural noun techniques. For example, you could say They use sophisticated techniques to sell. Oh, une péniche. The word péniche means a barge, specifically the flat-bottomed boats you see on rivers and canals. In France, péniches are super iconic, especially on the Seine in Paris, where people actually live on them. You might also hear péniche restaurant or péniche bar. For example, you could say Ils habitent sur une péniche à Paris. They live on a barge in Paris. Sans blague, c''était affreusement rapide. The word affreusement means terribly or dreadfully. It''s an adverb that literally comes from affreux, meaning awful, but it''s often used as an intensifier, kind of like saying insanely or ridiculously in English. You''ll hear it paired with adjectives to exaggerate how extreme something is. For example, you could say C''est affreusement cher. It''s terribly expensive. Comment ? The expression comment ça means how so or what do you mean? It''s a super common way to ask someone to explain what they just said. You''ll hear it all the time in casual conversation. It''s basically the French equivalent of a surprised what do you mean? For example, you could say Tu ne viens ? Comment ? You''re not coming? How so? J''ai rien dit. J''ai rien dit. The phrase rien dit means said nothing. In casual spoken French, the ne from ne rien is almost always dropped. So, instead of je n''ai rien dit, you''ll hear j''ai rien dit. And that''s totally normal in everyday conversation. For example, you could say Elle a rien dit de la soirée. She said nothing all evening. The phrase le temps passe means time passes or time goes by. It''s a super common expression in French, and you''ll often hear it in phrases like le temps passe vite. Time flies. Notice that temps has a silent final s. For example, you could say Time goes by so fast. The word rendez-vous means appointment or date. In French, it''s used way more broadly than in English. It covers doctor''s appointments, business meetings, and romantic dates. You''ll often see it with avoir rendez-vous, meaning to have an appointment. For example, you could say I have an appointment at the doctor''s. >> [screaming] >> The word t''appellerai means I''ll call you. It''s the future tense of appeler combined with the pronoun te. The phrase je t''appellerai is a classic, slightly noncommittal way to say you''ll be in touch, kind of like I''ll call you sometime in English, which often means you won''t. For example, you could say I''ll call you tomorrow evening. >> [screaming] >> The expression donner naissance means to give birth. It''s the standard, slightly formal way to say it in French. In everyday conversation, you''ll more often hear accoucher, which is more casual and direct. For example, you could say She gave birth to twins. >> [music] [music] [laughter] [crying] [music] >> So, Marge got abducted by aliens, wooed in a back alley behind adult cinema, and Homer just found out Kang is Maggie''s father. Talk about a rough evening. Rewatch the clip to lock in all those juicy French expressions you picked up. Keep learning French the fun way with FluentU.'
