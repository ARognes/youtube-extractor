transcript: Instagram was built because check-ins failed. Instagram was almost never a photo app that we have today. At first, it was something completely different. It was a complicated app called Bourbon built by Kevin Systrom. It had check-ins, plans, locations, basically way too much stuff. Now, originally almost no one used it, but the ones that did used the one feature, which was the photo app. Yes, that was the only thing that most people cared about. So, Kevin basically deleted everything else except for that one feature. Then he added filters, made posting ridiculously fast, and tada! Suddenly Instagram exploded, and of course evolved into the app that we use today. So, what did we learn? We learned that sometimes growth isn't adding new features, it's deleting the ones that are essentially wrong.
