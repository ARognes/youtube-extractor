transcript: Picture this. You're in an empty grocery store aisle reaching for a can of clam chowder with a digital price label that says $2.50. Your phone buzzes and you glance at it. When you glance back at the chowder, its price is now $3. Wait, isn't that 50 cents more than it was a second ago? Are you losing your mind? You may not have had this exact experience with dynamic pricing, aka algorithmic pricing. But, if the corpo elite have their way, it may only be a matter of time. Before that happens, let's talk about how these systems work and how they're quietly reshaping what people pay for travel, entertainment, and yes, even chowder. Algorithmic pricing refers to the use of algorithms to constantly update prices in real time based on external variables like time, demand, weather, and much more. Airlines have done this for years. Buy your ticket at the right time and it's cheap. Miss your window and you pay more. Companies love this and call it things like smarter demand forecasting because it helps reduce waste and smooth demand spikes to maximize revenue. But, this system can also benefit the savvy customer who could save a few bucks on their Hawaiian getaway by booking it at the height of hurricane season. Everybody wins. Now, there's another form of algorithmic pricing called surveillance pricing, which focuses less on factors like demand or weather and more on the you factor. >> Surveillance pricing generally describes when companies use a vast amount of data about their consumers, be it demographic or behavioral or other types of inferences about people to set individual prices. And what this can do is create profiles about people >> That's Stephanie Nguyen, former chief technologist at the FTC, senior fellow at Columbia Law School, and writer of the Division of Field Notes Substack, which investigates technology's effects on consumers. She helped us understand how, instead of everyone seeing the same price changes, surveillance pricing means different people may see different offers for the same product based on what an algorithm predicts about them. In one example of surveillance pricing, the Target app reportedly displayed a TV for $100 more when shoppers were located in a Target parking lot, suggesting the app may have inferred that customers closer to the store were willing to pay more, which makes sense. They're already there anyway. What are you going to do? Go home without a TV? And there's even more controversial real-world applications of these pricing systems. Hey, I got an idea. Let's talk about those after we talk about our sponsor. Micro Center, their back-to-school deals are happening right now. You can get an LG 27-in monitor for 120 bucks or save $205 on a 1 TB MSI Spatium SSD. You can fit so many homeworks in that bad boy. Do kids still do homework, right? Austin, Texas is also getting their Micro Center and Columbus is remodeling theirs. You can sign up for a free 128 gig flash drive to redeem at either location. What? Use our links below to save big on accessories and stay up-to-date with Micro Center news. Dynamic pricing is everywhere these days. Ticketmaster's pricing system adjusts in real time based on demand, which can cause sudden price spikes when concerts get popular or even just when ticket sales open. Supermarkets are rolling out electronic shelf labels that can update prices instantly and even fast-food chains like Wendy's have explored AI-driven menus that adjust prices on the fly. Looking to order from the dollar value menu during rush hour? Introducing the dollar fifty value menu for a limited time only. Meanwhile, surveillance pricing can show up more stealthily in everyday life through loyalty programs and shopping apps. When you scan a rewards card or use an app, companies collect detailed data about what you buy and how often you shop. >> I mean, the top level here is that loyalty programs function as data harvesting machines. They track our demographics and behaviors. They can build hyper-detailed profiles about us and change the price that I pay versus a different person. >> That data can power targeted discounts, but it can also be used to segment customers, some of whom may consistently see different prices or offers than others based on their behavior. Dynamic and surveillance pricing don't just coexist. Their effects can be compounded to the detriment of a segment of customers. In a particularly dystopian situation Stephanie described, a ride-sharing app might hike fares during a snowstorm, then use personal data to decide who could pay even more. A rider traveling with several children, for example, might be charged more because the platform assumes they're more desperate to get home than someone without any hyperthermia-prone dependents. But hey, is algorithmic pricing really that bad? Supporters say it keeps businesses competitive and responsive. Critics argue it makes pricing less transparent and harder to trust with prices increasingly shaped by what algorithms predict each customer is willing to pay. Either way, dynamic and surveillance pricing are becoming more common, more automated, and harder to notice, quietly changing how more and more products are priced. As these systems become more widespread, businesses, regulators, and consumers like you will have to decide what safeguards are needed to ensure pricing remains fair and transparent. >> When companies are left to self-regulate, profit incentives really outweigh consumer protection. Prices are higher, um commercial surveillance becomes rampant, and so I think we need to radically rethink terms that we once understood. The term discount or a deal, terms that once signaled, you know, straightforward savings have become nearly impossible to trust and verify. And regulators have tools and existing authorities today to more aggressively address pricing harms. >> Now, the good news is that once you know how these pricing tactics work, they're easier to spot. And to learn more about how you can push back against these practices, check out this video over on LTT.
