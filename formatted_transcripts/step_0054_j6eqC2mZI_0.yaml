transcript: We need to be careful about depth-first details. If you go depth-first, you might end up in a spot that you didn't even know where you started. Think about like a Wikipedia page. If you clicked on the first link of every Wikipedia page, you might start off with like Linux and then end on like neoclassical Greek sculpture. There's a part of my book where we talk about telling a story like a pyramid. So, at the very beginning, you have the headline. Basically, what it is is like a one-or-two-sentence thing that describes your entire story. And then, you want to only provide enough details they can understand how you got to that ending. And then, what you want to do at the end is you want to pause, and you want to be like, "I can provide more details there." Like, there's going to be some amount of follow-up questions. If they want more details, they'll ask for it. The reason that's better, like this progressive detail is better, is because there's going to be a whole bunch of details that turns out like didn't make any difference to the story at all. Or, the interviewer wanted to take the question one way, but then you gave a bunch of details they wanted to go a different way. So, instead of like guessing, what you want to do is you want to start at the high level and then progressively go down in terms of detail, and then only if they ask for a specific detail, you can just go random access and give them to them.
