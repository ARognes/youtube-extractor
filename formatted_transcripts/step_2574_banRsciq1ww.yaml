act expressionism. This is what abstract expressionism could look like. It was all about expressing the intangible because there were rarely concrete objects being drawn, but it was more so about portraying emotion through brush strokes and shapes. It was very spontaneous and very colorful. Now, minimalism, on the other hand, is a highly purified form of art. It's about breaking things down to their fundamental elements and stripping away everything else so that the only thing you're left with is the core truth. If we look at our little white guys and we see them the same way, it's kind of beautiful. They are a simple minimalistic truth that exists within a much broader and more emotional world. And that's what minimalism is all about. Especially because of the emphasis that that kind of art has on shape. Minimalist art uses a lot of basic geometric shapes. And even when it is more complex, it still has that emphasis on the form of a figure. It's about how much object that shape exists. What am I saying? It's about how much shape the shape goes into a shape press that is then pressed into a press shape. The shape of the protagonist in these games is the most defining feature that you have. It's what makes these otherwise mostly white blobs genuinely iconic and memorable. Aie has a soft and rounded silhouette that feels very fast and nimble, which fits with the platforming in the game. The slug cat kind of has a lack of a shape, but you know, you do got some motion in that ocean. Omorei or Sunny's shape is pretty basic and unexaggerated for a human, which makes sense because the whole story is like he's just a person and the story is grounded in the weight of being human and everything that that means emotionally. Those shapes plus everything external to the character that we talked about earlier are what makes these little white guys, sorry, it's kind of funny when I say this, that's what makes these white guys special. And it it makes them a really cool study of de