 clothes that he's wearing, the marks that are on him. You can look at the sounds he makes and the things he literally directly says. There is so much you know about this person just by witnessing them in the very first scene of the game. But even when you look at the first opening cutscene of Hollow Knight, for example, you don't get that at all. Instead of giving you the protagonist, showing you who they are exactly and then revealing and building the world around them. It's the other way around with these little white guys. You are a blank slate, but you find your identity through the world and how you move through it and how you interact with it. That's what tells you who you are. Let me let me give you an example. So, think of the way that the slug cat from Rainw World moves. You are not told that the slug cat is vulnerable or scared, but because of the way that it flops around the world, and because you're hiding from enemies instead of chasing them or fighting them, you can infer that. Same kind of thing with the vessel in Hollow Knight. The little bounces when this guy walks, the way that you can look up and down at the environment, the way that other characters respond to him and treat him, that is what makes this character feel alive. It's literally the whole idea of showing instead of telling, but taking it to a whole new level. It's kind of like negative space in design, right? You are intentionally removing things or removing detail in order to tell a story more effectively. Whereas in a game like God of War, which is what I showed you earlier, it's much more about the visual intricacies of the design. Now, something like Hollite is obviously a bit more restrictive because of the art style, but even in something that is a cut scene where you have the most opportunity to show detail and show emotion, it still doesn't because it is still at its core just a little white guy. Do you guys get why I like video games so much? Isn't this stuff so cool? But you 