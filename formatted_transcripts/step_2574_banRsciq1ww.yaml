 human beings, we are hardwired to look to other people to know how to feel in a situation if we don't know. If you have a baby, this is really weird without having something here. If you have a baby and that baby gets hurt, it's going to look to the parent to know how to respond. It's like a known parenting thing that like if you react negatively and go like, "Oh, are you okay?" then the baby's going to start crying. But if the parent is more nonchalant, then the baby is way less likely to actually react. Humans are highly empathetic creatures in that way. And in games that do have expressive characters, we will look to them to know how to feel in a situation. Are they anxious? Are they in pain? Well, that visual representation is going to make you as a player also feel more anxious. So, when you have a little white guy and there's none of that to read, you are forced to rely on your own feelings and your own readings of the situation, which makes it an even more personal experience that connects you as a person to this little white guy as a character way more than you ever would be otherwise. Okay. Now, your visibly angry, hyperrealistic protagonist, who is also designed to portray a very specific identity with how they dress and act doesn't really give you that same freedom to explore the characterization yourself. This character is reacting to the game world themselves independent of you. Oh. Oh. >> And then you feel something from watching them. But these little white guys don't let you do that. And now the burden of emotion is placed upon you. You have to decide what is scary and what is sad and what matters. Does that system make the narratives in these little white guy games hit harder? I don't know. I think it depends. For some people, yes, absolutely. But for other people, they might connect more when they can empathize and see the visible emotion of a character instead of project their own onto it. I think that there's maybe two types of players, and maybe that has to do with what stories resonate most with different people. And I don't think that either one is necessarily better or worse. You could definitely say that AAA games or more realistic games rely more on empathy for storytelling, whereas indie titles appeal to more relatability, and that's why they typically have simpler character designs. But obviously, there's a budget difference that goes into that, and indie is a pretty big umbrella. And no matter what, it feels like realism is always the goal in games. And I don't I don't really get that. I think a big point I want to make with this video is that there is so much beauty in the absence of things in games or in the simplicity of design. In the absence of color and expression and visual detail, there is still so much room to tell a story and to feel as a player. All the super realistic, true-to-life intricacies that make a game like GTA great are great, but so is the minimalism that trusts you to interpret all the unknowns about a character. If it isn't clear enough, I really like indie games cuz I find that they demonstrate that the most or at least they draw the most attention to it. But who knows? Maybe we'll start getting some some little white guys and AAA games. Or maybe I'm just not thinking about Little White Guys in AAA. But either way, that's that's everything I have to say about Little White Guys. You should tell me in the comments who who is your favorite white guy. Thank you so much for watching and I will see you in the next one. Bye-bye. [Music]
