transcript: Hey gamers, we're Sock Pop. We've been very busy making a lot of games and we're very excited to showcase some of them today in the sock direct. Let's have a look. [Music] >> So Ruben, uh let's have a look at the first game of the So Pop Direct, a game by you. Um can you tell them a bit more about it? Yeah. So, my new game is called Soccer with Double K, which is like a pun soccer and it's a soccer game. Uh, I started working on it in the train back from Berlin where we had this game show where we were showing a lot of games and one of the games we were showing was Capy Hockey. Uh, and people were really enjoying capy hockey like this sports game with these capy virus playing ice hockey which is very hard to control. So, everyone's about as good at it. Um there was even a world tournament of a copy hook. >> Yep. >> Uh which was really cool to see and I really got really inspired by that like pairing people together and I thought you know I can probably make another sports game like that uh and make it really fun. So yeah that's what I did. Uh and I'm really excited to show everyone. Um so let's have a look at the trailer. Soccer is a local multiplayer soccer game where you kick the ball by flicking the control stick. The harder you flick, the harder you kick. You can also lop the ball up high by holding the right trigger. If you kick the ball coming down, you will perform a powerful shot. Play against your friends in versus mode or test your skill in the World Cup. [Music] The game has eight characters to unlock, each with their own special abilities. All right, now let's watch some soccer. Hey, hey, hey. [Music] Thanks for watching. A free demo of the game is available now on Steam. >> Wow, that soccer game looked really cool. Uh, Tom, you're also making a soccer game, right? >> That's true. I bring good news. I'm also making a soccer game. I've always been a big fan of soccer. I also played it a lot when I was younger. So, when Reuben told me about his idea for a soccer game, I also got inspired to make my own. And Reuben and I decided to release the games alongside each other. My soccer game is called Gnomeball because you're a small gnome that's playing soccer in a garden. It's very chaotic, which you can see in the trailer I made. Let's have a look. >> Gnomeball is a chaotic soccer game where you become a small gnome. Step onto the pitch and try to master simple soccer mechanics in quick matches with up to four friends. There are many ways to bend the game to your will. You can kick the ball low or high and head it while it's up in the air or take a more technical approach like timing your dribbles to outplay defenders. There's also a second pitch with special conditions that change how the game is played. What will your play style be? [Music] >> No. >> A free demo is out now on Steam. So, Tim, you're also making a soccer game, right? Let's have a look. No, no, no, no, no, no, no. Stop, stop, stop. Not another soccer game, please. It's too much. >> Uh, okay. Show me. What are you working on then? >> Um, I'm making a puzzle game. Actually, I think it might be my first real puzzle game. It's something I started making for my partner because we were playing this card game together. And she she was like, "Maybe I can play it just by myself. Like, how much time would it cost for you to to digitalize the game so I could just play it?" And I said, "Well, probably not that long." So, I started making it. Um, and it grew a little bit bigger than that. So, let's go take a look at the trader. In Brain School, you have to find the code. depicted by a few cards. Let's try ace two, three, and four. Well, guess that wasn't right. Let's ask some questions to find out the code. [Music] Oh, wait. I think this must be a seven. >> Nice. Let's see if we can get some help. Like this fine liner. There's always going to be at least one ace. >> Yes. >> Now, if we ask where is the card with the lowest value, this must be an ace. Wait, who is this guy? Uh uh 147, play the demo now on Steam. So Aaron, I'm sure everybody is dying to know what are you making? >> Yeah, so I've been working on a new game also. It is an online uh asynchronous multiplayer game where one person plays as a chef that has a restaurant and his restaurant is overrun by rats. All the other players are the rats and they are trying to wreak havoc in the restaurant while the chef is trying to catch them. So, it's not that far yet, but we can have a look at the trailer. >> Yeah, let's take a look. Okay, another computer. Oh, okay. Whoa, I can't wait to be a rat or a chef. Thanks. We've also been busy making bigger projects, but these aren't as far along yet. We do have some sneak previews that we'd like to show you, though. Let's have a look. [Music] Mhm. [Music] [Music] Matthew. [Music] [Music] Grill is a deck builder where the cards are played automatically. You only worry about making a strong deck. There are many ways to do this. First off, you pick a character. Each one will have their own set of cards and play style. Then you come across many events such as card shops where you buy and remove cards and different events where you can do things such as increase your max health, increase the damage on certain cards, give a card extra abilities or put a sticker on them that will change how they are played. In between tinkering on your deck, you battle against the decks of enemies, which can give you their cards or abilities. But you will also have to battle the decks of other players. And this is where it counts as defeating enough players will win you the run. [Music] The game is in early development still, but a playable alpha build will be available for our gold tier patrons on Patreon. These sneak previews aren't playable just yet, but the final game you saw the car pedler. There will be a playable alpha version for the patrons. Well, that was already the end of the sock direct. Thanks a lot for watching. Make sure to check out the demos for the various games. Make sure to watch the trailer again in case you missed anything and check out the links in the description to wish list the games. It really helps a lot. We hope you enjoyed it. Do you guys have anything to add? All right, then. See you next time. Bye-bye. [Music] Hey. [Music]
