transcript: Hello. I want to talk about how to build expertise in this video. It takes a very long time to become an expert at something, and almost everyone who starts at something never becomes an expert. I want to cut through some of the noise here. There are countless online resources telling you to do this and that. There are salesmen and CEOs trying to tell you that you don't need to try anymore because AI is here, and everyone is trying to sell you a solution to give you a nice neat shortcut to success. And the real secret here is that there isn't a secret. I'm making this video because I get variants of this question, "How do I learn C++ and Vulcan when I'm streaming?" This is a completely valid question, and I do answer it. And I do have a roadmap for the people who are interested in the description of this video. But, I don't think that's what people are asking, honestly. What I think people are asking, most of the time when they ask me how to learn C++ and Vulcan, is how do I get really good at this? How do I get really skilled, and how do I become an expert? This is a total different question, and something I wish to tackle. This video is generally for newer programmers who aren't already very good at something. I'll try to explain my system and what I use personally to show how I'm trying to become an expert. I should be completely straight with you, though. I honestly don't feel like I'm an expert. Even in my own system, I'm nowhere near done, and I'm always trying to get better. I honestly don't really feel that qualified to make this video, but I don't see anyone else making this in the programming space. So, I hope it helps out people in my community at the very least. So, I need to start with AI. Some of you may be thinking, "Why can't I just use AI to become an expert?" It comes down to this. When you're starting out, you need to be a beginner, and AI is taking that away from you. You need to fail and struggle. You need to learn the basics and grow. Learning the basics deeply, which is all about learning how and why things work, is important for mastery. If you don't understand why something works, you haven't learned anything. Please let yourself be a beginner. If you start yourself at the middle, you're going to be no use to anyone. Now, AI unfortunately works. Which is why people use it, especially for coding. It adds a ceiling and a floor to your coding ability. Most beginners, when they're starting out, realize if they ask the AI questions about programming, they can get the answer and solve the problem that they're working on very easily. Right now, it can actually do some interesting things. But I talk about this in my community, this is a trap, especially if you're a beginner. The reason being, it adds a hard ceiling to your skill. Which is the reason why I don't use it. So, why don't I use AI? From what I understood from this study, there are two bad things that happen when you're using AI, even if you're already skilled. LLMs reduce cognitive function when you're engaging with a task. In this study, researchers asked people to write essays. There were three groups, one that could use ChatGPT, one that couldn't use anything, and one that could use internet search. When the ChatGPT group switched with the group that couldn't use anything, the ChatGPT group couldn't quote back anything they'd written in their essay, even though they were no longer using ChatGPT. This is because of cognitive offloading. AI allows you to stop thinking effectively. This study also showed that the ChatGPT group used more homogeneous and less varied language than the other group that didn't use ChatGPT. So, what does that mean for programmers? Well, the study suggests that for programmers, the first thing is that all your solutions will start to become more homogeneous. And it's very possible that you'll start to forget code more easily when relying heavily on AI. Just like the ChatGPT group when it came to their essays. This is a classic example, but when I ask ChatGPT to write quick sort, which is a solved problem in programming, and it's something that anyone can memorize to using their own code, ChatGPT gives the worst version of quick sort by selecting the highest array value as a pivot point, rather than a random value or the median between three points. It suggests that you can do this at the bottom of the prompt, but this isn't good enough. Now, you could say that this quick sort implementation is fine. It works. It does its job and does what it needs to do. But when it comes to game engine development or graphics programming, it's good enough doesn't cut it. Because your code needs to be extremely fast. And studies like the one I mentioned earlier shows that the chances of the programmer actually knowing how to fix this go down. With heavy reliance on AI, it's less likely that the person is actually going to remember what they even wrote. This, of course, is a solved problem like I mentioned earlier. This is only going to get worse with more novel problems. I really hope you haven't missed the point here by thinking that I should have used a better AI or some kind of AI agent. Because this thing is always going to happen. No matter the tools that you use, and I assume that people who are interested in programming Vulcan or C++, or some kind of game engine and graphics want to write their code themselves. Now, wouldn't it be nice if you could sit there and write the code without any assistance with AI? That's the benefit of building expertise. You can only do this if you let yourself be a beginner. Leave AI alone, despite what other people tell you to do, and you'll be able to build that expertise in the long run, becoming a better programmer. Why did I bring up AI? Well, like I said, I always get this question about how to learn C++ or Vulcan. I think what people are really asking is how do I become a great programmer to either make a game or make money. So, because I keep getting this type of question, I asked my friend who I've worked with for a number of years professionally. He's an extremely good programmer, in my He's very fast at writing high-quality code. And so, I asked him the basic question of how do you learn C++? This is what he said. I find this question really hard. C++ apparently is one of the hardest languages to learn. But, when I learned it in 1997, I'd learned BBC Basic, 32-bit ARM assembly, and C before that. I essentially learned C++ from the Visual C++ 5 manual, mostly to learn the differences between C and C++, and using library books. There was plenty I got wrong. The C++ compilers weren't very standard compliant back in those days, so there were other hurdles to get over. So, I learned C++ from the bits and the bytes upwards, and I think having that low-level view has paid off. If you want to learn to write C++ well, I'd guess I'd say take your time. Learn C first, with a half eye on low-level stuff, like memory, addresses, bits, bytes, IO. Then, I'd look into the shiny and helpful things that C++ builds on top of that. If you wanted to learn C++ quickly, I'd say don't bother. You could perhaps learn C# or Java quickly, and move down a level to C++ after that. But, I don't know how that would work. I'd suggest watching some of the Crash Course videos on computer science, parts 3 to 14, as a grounding. I'll provide that and his GitHub below. If you're interested in emulators, he has a great project working on an Acorn Archimedes RISC PC emulator, and a hobby operating system. To reflect back on what my friend said, if you want to learn C++ quickly, I'd perhaps say don't bother. This is what this video is about. You're not going to master these concepts quickly, and to circle this back to AI usage, you are being told all the time, you don't have to take a long time to learn these difficult things. There's always a quick solution, a hack, a cheat that you could use. If you want to learn it quickly, don't bother. This also applies to some online resources and books, too. This idea is everywhere. There's this fantastic article that also reiterates this point. Teach yourself programming in 10 years. This was written as a reaction to books that were coming out at the time that were titled something like teach yourself this language in 24 hours. It talks about how true expertise takes 10 years to develop by citing some studies. So, what's the rush? Let yourself be a beginner. You're going to have to build experience, no matter what you do, if you want to learn to code well. To reflect a little bit on my own learning experience, I have bought all these books to study. I've some that yet to finish, and I have read some of them completely. I go over these again and again and again in my notes to try and get better as a programmer. This is all very important to keep in mind when you're writing a game from scratch using 3D graphics that have some kind of interesting gameplay to go with it, because it's extremely difficult. This is about as difficult as writing an operating system. Doing this badly is easy. Doing this well is extremely difficult. I have written five renderers and game engines. I have written a couple more games like the Minecraft clone and a few little SDL games, and I have a lot of unfinished projects that I won't show. I'm actively trying to improve daily. To help with this, I came up with a system to gamify programming and studying. My hope with sharing my system is that you'll be inspired to do something on your own. Keep yourself accountable and be honest with what you're actually doing. Just be warned, this will not be for everyone, and that's completely fine. I love Rocket League. It's my favorite competitive video game. Admittedly, I haven't been able to play it in a while because I've been focusing on programming. I like it because it's not like any other competitive video game. You can have the best aim in the world, but when you start playing Rocket League, because it's so different, you're just going to be in the beginner ranks like everyone else. No one has a huge advantage starting out because it's so different. So I use this game's ranking system to gamify programming. I used to really like looking into the metrics of how to improve efficiently at Rocket League. And I found this video by Waitin Pilkin, "How long does it take to reach each rank in Rocket League?" In this video, he broke down the differences between ranks using statistics, which he was able to gather from his community when they filled out questionnaires based on their rank. And importantly, he found on average how long it takes to reach each rank in the game. And the highest rank, Supersonic Legend, takes 4,450 hours to reach. Using the exponential growth curve that Waitin provided in his video, I estimated that it would take 8,274 hours on average to be able to compete in the RLCS major tournaments. So I decided on November the 11th, 2024, to count how many hours I code to see if I could reach 8,274 hours before I die starting from zero. My goal with reaching 8,274 hours is that I'll hopefully be able to look back and see that I've actually become an expert in this field. I'm aware though that when I reach 8,274 hours, I'll still have more room to grow to get better and better. I like this because it gives me milestones to reach using the same number of hours used in Rocket League, but with programming. I added some lower-level ranks because it would take 73 hours of programming to get bronze one, which is the lowest rank in Rocket League, and I felt that would take too long. The highest ranks I calculated come from six mans, which is where semi-professional Rocket League players go to take the game more seriously. If you have reached the highest rank in Rocket League, you're likely already rank C in six mans. So I decided to add B, B+, A, X, and S. S rank is only achieved by Rocket League players that in this season are playing in majors. Which is the highest league of play outside of the championship itself. I'm aware that the rank names are a little silly, but it's what works for me. I should also note that I'd been working as a professional C++ developer for years when I decided to do this. But I felt I wasn't very good at programming at the time. And that's why I began on this quest. And for those who are interested, I had been dabbling in C++ since 2011. I really started to take it more seriously in 2017. And then really seriously in 2024. Why did I decide to do this and count hours? Well, there's no way of measuring skill between programmers like in competitive games like Rocket League or chess. There's also no way of knowing if what I'm actually doing is improving my ability or not. So, I decided to focus on the thing that I have control over. How much time I spend deliberately trying. That being said, you could theoretically cheat at this. I could say that I'm working 16 hours a day every day and reach 8,274 hours relatively quickly. This would be in my opinion very stupid. Because I made up the system. This would be like cheating on an exam I made myself take. So, I made some rules to follow. I only count times when I'm either deliberately studying programming or actually programming. Just having the IDE open doesn't count. Turning on my PC doesn't count. Talking about programming that doesn't directly solve the problem doesn't count. Going to the toilet doesn't count. Randomly thinking about programming while I'm doing my chores doesn't count. Any meeting that doesn't deliberately involve solving the problem doesn't count. Waiting for long compilation times to finish doesn't count. Making this video doesn't count. If I'm not deliberately trying to improve at programming or actually doing it, it doesn't count. There are a few exceptions, though. I can watch or listen to some educational entertainment for 30 minutes about programming. Audiobooks about programming I've already read are good if I've already studied them and I have actively been doing something for about 4 hours the day before. Minor distractions are allowed because it would take too long to stop and start the timer than just getting back to work. And it goes without saying using AI to help with code doesn't count at all. To track all this I use a timer called ToggleTrack. It's a website that allows you to track how long you've been doing something for. It also has a free phone app that can sync with your account online. So it syncs between my phone and my browser very easily making it very easy to stop and start this timer. There is a paid for version but this is for tracking invoices which I don't actually need. So to keep track of things over a longer period of time I take the total times of work that I've done each day and put them in a Google Excel spreadsheet. And I add them all up together. If you want to use exactly what I've been using to track something that you're trying to learn I've left a template for you guys to have in the description of this video. The ranks are again based on Rocket League but feel free to change the ranks yourself. As you can see I'm only Champion 3 Division 2. So I'm not even halfway to reaching my goal. And it honestly feels like that. This is generally because as you get better at something you realize there are more things you don't know. So actually can make you less confident overall as you improve. So how do I go about practice? Well I have two general goals. One, to become a better programmer and two, make a game in my game engine for people to play. These two goals help me decide what I should be doing throughout the day. In the morning I usually get up and do some revision. This is especially important if I've studied something the day before. I use this note-taking app called Obsidian and I keep it synced between devices using Git by my GitHub. I use the setup described by Odysseus in this video called Obsidian the king of learning tools full guide and setup. So to do revision I either go to index pages just something I have in mind I need to revise, or just click through this node network, which comes with Obsidian. After some revision, I either stream for 6 plus hours uh where I code or study or do something else. It depends on the day. If I'm studying, I'm either reading a book, article, or watching videos. And when I do this, I'm taking notes in Obsidian so I can revise them for tomorrow. When I'm taking these notes, I try my best to rephrase them in my own words. That's how the learning process happens. The friction and thinking in trying to translate the words into something I understand. So, using AI to take notes would be a complete waste of time because I'm not thinking. Taking notes like this is slower, and I don't get through resources as fast as someone else. The goal of this is so I never have to go back to that resource again, which means it's faster in the long run. Outside of that, I write code or debug, which is pretty straightforward. I've been averaging 4 hours and 25 minutes of deliberate practice every day under my system. It doesn't matter if I miss a day here or there, as long as I eventually hit 8,274 hours. But I really try to avoid missing days, and this year I haven't missed a single day. I've at least done something, even if it's just been for a couple of minutes. So, hopefully now you have an idea of what's required of you to become an expert at programming. It's all just practice, and that's all it is, and it's all it will ever be. Like I said earlier, I provided a very basic road map in the description of this video and in my Discord. I'm learning Vulcan, C++, and graphics programming, and other game development-related stuff. Now, watching this video, I hope you guys don't feel down at all. If you need someone to say it, I really do believe in you. Anyone can actually become an expert, truly. It's just lack of effort why people don't get there. So, you can do this. Well, that's all I have for this video. Good luck out there. You're going to need it. All right. See you in the next one. Bye.
