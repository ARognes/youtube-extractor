transcript: Improving your site performance is not just about making it load faster, but also making it seem like it loads faster. One of the best things you can do with images to make them actually load faster, first of all, is adding on the loading attribute of lazy. By doing this, we're essentially telling the browser that we want to lazy load images. So, if the image is not on the screen yet when it reaches that lazy tag, it's essentially not going to download the image until you scroll down to view it. That will make your page seem and actually be faster. One way to make your page seem faster, though, is you'll notice when we refresh our page, first we see essentially a white blank page, and then our image slowly streams in. We want to be able to make it so that we essentially have an image show up really quickly, that's like a blurry version, and then it streams in the real image. Well, I have a simple class that I created that allows me to do exactly that. If we just add blur onto this, and now I actually refresh my page, you'll notice instead of getting a giant white box, we get a nice blurry version of our image before the actual real image comes in. And to do this effect is actually very simple. Inside of our CSS, this blur class, all it does is it sets a background image of a very small version of our image. We set the background repeat to none, and the background size to cover. So, essentially it takes a very small image and scales it up to be very large. In our case, our image is only 20 pixels wide. So, we take a 20 pixel wide image, scale it up to be a thousand pixels wide, and by doing that, we essentially get a default blurry behavior from the browser itself. So, this gives us a nice blurry version of the image before it actually loads in the real image. We can even add on additional features to make this better using things like JavaScript, and I can show you some handy features to create this small little image. All of those are going to be in a video, which is going to be linked at the bottom of your screen.
