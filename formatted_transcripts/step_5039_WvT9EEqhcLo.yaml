transcript: On July 3rd, 2015, a popular web comic XKCD published a Matrix joke about simulating the Matrix by keeping a network of Tamagotchis alive. It was a referential Matrix joke worth a quick chuckle. But when developer Drowan Donberg seen this, he thought, "Wait, but what if I actually built this for real?" And after a few weeks, he launched Tomahive, which featured 10 network Tomagotis that are taken care of by an AI 24/7. And 10 years later, it's still live to this day. Um, now this is a cool project and shout out to dronein for real for real for building. But this project has a huge problem. This is the Matrix and this well to put it politely as a huge Matrix fan. This falls incredibly short of the Matrix promise. I mean, come on. I can't even make out the blondes from the brunettes. But here's the thing. It's now 2025 and we have these things called large language models or LLMs for short. And you can use them to create any reality that you want. For example, chat GBT. You're on a date with your fianceé when out of nowhere, a Super Saiyan cockroach wearing a speedo and a cowboy hat pulls up on a Vespa and kidnaps your fianceé. What's your one-s sentence plan to get her back? Okay, here's the plan. I'll challenge the Super Saiyan cockroach to a karaoke showdown dressed as a giant fly swatter and win back my fiance with the power of my offkey singing. A little cringe, but you get the point. You can make any reality that you want. So, follow me here. What's stopping us from taking this concept and creating something much closer to the actual matrix by replacing the network Tomagotis with a network of autonomous LLMs. But I can't just go straight for that boss battle just yet. I need to learn more about the limitations of trying to use LLMs to power a matrix simulation. Because no matter how you slice it, costwise, development timewise, compute-wise, running an ongoing Matrix is going to be very expensive. And so I need like a Matrix hello world, if you will. And what better way to test this than with an escape room puzzle. This is a simple Tower of Hanoi. You know that thing your parents plop down in front of you as a child to distract you while they watch Steve Harvey where you must stack all the disc from heaviest to lightest to win. Well, this puzzle is inspired by that. And why I think it's the perfect Matrika world is because this has three cognitive tests in it. Test one, the weight of each disc isn't immediately revealed to you. So, you must go around weighing each disc to reveal and remember their weights. This is a memory test. Test two, you must navigate an avatar through an environment. Because if we eventually want to use a shared world, we need this environmental awareness test to see if the LLM can effectively interface with the world. In test three, firsttime users don't get any of this information. The only information they are given is this is an escape room puzzle and when you solve it, you will see a you win celebration. If you don't see the celebration, the puzzle hasn't been solved yet. This is all the information that you get. This lack of information on how to solve the puzzle is the reasoning test. Oh, and I did a call out on my Discord to give this puzzle a shot. But they have no idea that they're my human benchmarks. So, shout outs to them. But let's see how they did. Okay, I can move. Okay, so I can go up and go left, right? I can move right out the gate. Placed into a new and unknown environment, my test subjects immediately start to explore how the world works. I can pick it up. I can drop it. And I can set up Okay. Oh, wait. Yes, this is eight. Okay. They quickly discovered all the things they can do in this world. And pretty quickly following that, they started to hypothesize on how they might be able to solve the puzzle. Way disc set to six. Okay. So, is it biggest to smallest? Let's see. I'm guessing I need to get these things on here in an order. I'm assuming we have to weigh these. I'd imagine you'd want the heaviest first. You wouldn't want want the heaviest at the top or else it would topple over. Oh, you know, I don't think there's a game like this before. Maybe it's like stacking up and down. Yeah. Okay. So, our biggest was light blue over here. Add you to the spire. And once they've reasoned theirel to this point, they virtually solve the puzzle and nothing really exciting happens beyond this point. They all stack the discs in the correct order on the spire and win. This is great. But I'd be lying if I were to say that this isn't expected. But now that we have our human benchmark, it's time to see how the LLMs will do on this puzzle. And so let's get to work. I got started by testing the LLMs on a simple form of the Hanoi puzzle. Only difference being the weight of the disc is just displayed on the disc. Essentially removing the memory test, making the puzzle a little easier so that I can test a bunch of LLMs faster and separate the strong from the weak. But before I forget, how exactly does the LLM play the puzzle? Well, the game first generates a file that has the state data on it, as well as the available actions that a player can take given the state. We give that to an LLM and it does its own AI brain evaluation on what action to select and then it returns a chosen action along with some commentary, but this is mostly for me to use for debugging later. But at last, we just continue this loop until it wins. But uh after running a bunch of tests, I'm pretty disappointed with the results. I tested over 20 different models and permutations, five of which were locally ran models, which means I wouldn't have to pay a single dollar in API cost if it worked. But all of them failed miserably and only two of them did well enough to complete the puzzle. Both of which were sadly API called models which is going to cost me some money moving forward. Listen guys, I really tried my hardest to give local models a W here. It just didn't work out that way. I'm sorry. But that's not the end of the story because that was all without any processing on the LLM output. All I was giving it was here is a thread containing all the history of the game state and your chosen actions. Good luck parsing that, but what action do you want to take next? which leaves a lot of room for improvement. We need to figure out some way to get the LLMs to solve the full puzzle with all three tests. Because if the agents don't have good memory, that ain't no matrix that's going to keep me bricked. All right, so let's try and beef up the competent LLM so they can pass the full Hanoi puzzle. Okay, so I've ran a few tests trying to get the LLM to complete the full puzzle, but I'm sad to report that none of them were able to do it. I first tried just running them straight without any beefing up on the full test and they didn't even get close. I then played around with some features regarding how I give them the history of game state. I had like a inner thoughts feature that they could play around with, but none of it worked. And this is very frustrating to say the least. And I've already told my therapist to be on standby cuz it's feeling like it's one of those projects. Nothing is working and I have no idea what to do next. But if there is one thing that I do know is that I got to do whatever I got to do to get an LLM to complete this puzzle. I ain't no quitter and I'm not giving up on my Matrix dreams. But when I do get it working, you'll know what the first thing I'm going to do is add Code Rabbit to its repo. That's right. This video is brought to you by Code Rabbit. Have you ever wanted help editing, documenting, or hell, maybe even writing full blocks of your code for you? Then Code Rabbit is the next tool that you need to try. Code Rabbit is an AI powered code review tool that can do all of this and more for you automatically. Regardless if you're a solo dev or a dev team, it can help you ship cleaner code faster and right from inside yo