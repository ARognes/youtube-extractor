mple, you can see in this finish run that it's a little inefficient. It's weighing the disc multiple times, even though it has the data already. It's picking up and dropping it on repeat for some reason. And curiously, I investigated the LLM's thoughts just to see what's going on there. And what I found was is that it was confusing an action called drop with what it needs to do to be able to drop a disc onto the spire. Furthermore, it doesn't help that in their memory, they've registered that this is how the drop action works. All completely incorrect. And so, out of curiosity, I just renamed the drop action to be called place on floor and reran the sim again. And to my surprise, the LLM's performance improved dramatically, which is amazing. It's such a simple tweak, but it's also kind of an obvious lesson in retrospect, right? because the LM in LLM stands for language model. So, duh, the language that it's interfacing with needs to be concise and coherent. But now, let's talk about the handicap. The LLMs were clearly struggling, so I gave them a progress bar. And I also injected some pretty explicit hints into their memory. Does this make the LLM's accomplishment now unimpressive? I don't know. But what this does prove is that the LLMs are capable of solving this puzzle so long as they discover this knowledge. But the real question is what design will enable them to bridge the knowledge starting from this oblivious point to discovering this key knowledge for solving the puzzle. But ultimately, I want you to be the judge in the comments. Let me know if you want to see me continue following the white rabbit in a part two. But lastly, what design did I end up with? You're wondering. Well, it looks a little something like this. The LLM is comprised of three components. There is the decision maker, the critiqueer, and the memories are. The game first generates a state with available actions given that state. And first up is the critiqueer. The critique reviews the history of thoughts from the decider and then provides a critique as well as a suggestion. Next up, the memories are reviews the game state as well as the history of questions and answers in memory. And then it returns what it believes is the 10 most relevant questions and answers for the decider to consider. And then finally, these are given to the decider along with the current game state for them to make a decision on what action to choose next. But of course, more research is needed. I have probably near infinite different design ideas that I would like to try. But I really have to figure out how to get this working using local models because API costs are going to become a real issue here shortly. But that's where I'm going to leave it for this [Music] video. Yo, my friends, I have a last minute update to share with you. So, I was foolishly neglecting using the Claude API, and I was strictly focusing on the open AI model. Not going to lie, I'm a little lazy. I didn't feel like setting up the whole Claude API thing, even though it was the only other model that passed the preliminary test. But, I just ran a quick Claude test on the Matrix Hello World test with less hints than even Open AI had. And yo, I can't stress how better Claude is than GPT when it comes to making progress on this test. Unfortunately, it is a little more expensive and it has a very low rate limit. In fact, it seems I can only process like 50 frames a day or something. So, it's really hard to get a read on just how good plot is on this, which is very frustrating and all the more reason why I have to figure out this local model thing. But that's all. I just want to share this discovery really quick because it's really exciting and promising.
