rks now this differs a lot from a tiling Window Manager let's check out a tiling Window Manager I have hyperland right here which by the way this is the exact setup I'm going to show you how to build in this little miniseries on hyperland so stick around because we're going to build this exact thing but in hyperland what we do is when we open a window let's say we open our terminal it takes up the whole entire screen you can see right here our terminal took up the whole screen so now let me launch my I don't know my web browser if I open my web browser it takes up half the screen and we can see that there's no overlapping between these two windows this is how a tiling Window Manager works now if I want to open up another terminal I can open up there and then I'll open another one up there and this is just a layout that the tiling Window Manager gives me but the greatest thing about this is I can flip through all my windows super easily just using my Vim key bindings if I hold down alt or rather my super key and I go through my windows it's amazing it's so quick it makes me feel like a hacker like it's unbelievable I can open a new workspace open my terminal go back to my previous workspace it's so fast it's so effortless and it's amazing I really love it now tying window manager just unlocks a whole new level of productivity for me as a programmer but as a content creator I'm always looking for ways to be more productive which brings me to our video sponsor skillshare skillshare is the largest online community for creatives with thousands of classes led by industry experts across film illustration design freelance productivity and more skillshare can help you take your career skills Hobbies passions or side hustles to the next level now at typecraft I use notion to write all of my scripts and my content and to just organize all of my stuff so on skillshare here I'm actually going to be taking this class by Ali abdall called notion Master Class maximize your producti