till, I find it a little bit frustrating that I cannot do uh I don't know, theorem proving on a GPU. Uh I have absolutely no idea how to go about that. Uh and in part by by by lack of uh an appropriate language, okay? Uh uh So, I'm I'm not ready to program the GPU pipelines at the very low level myself, so So, and and I think it's more general. I think we're we're not using uh all these GPU and other highly parallel hardware as much as we could. Yeah, so verifying applications that have been learned or generated or generated by AI also and it's still a pretty hot issue. Back in 2018 I was more thinking of of verifying simple neural networks like those used for I don't know computer vision or self-driving cars or or or some numerical computations like you know weather prediction and so on. So so specialized LLMs but you still want some guarantees about what they produce that they cannot produce completely inconsistent outputs for instance. There were some some attempts in in in the last years at using static analysis tools and basically program verification tools applied to LLMs but well it it it doesn't scale. LLMs are big. Sorry. Neural networks are big. And for LLMs there's also a distinct lack of specification. Okay. You don't really know what's a good answer from an LLM. Well you know it when you see it but you cannot write a mathematical specification of it. So so that part is probably over. What I would say are the big problems for today yeah probably maintaining software quality despite AI's love despite a lot of pressure to throw away traditional software development techniques using LLMs as an AI as much as we can to do mechanized proofs so proofs that can be checked by machines. Maybe this will be the the decade of formal verification of software. We've been waiting for that for 50 years so maybe it will it will finally take off. >> What's your top book recommendation for software engineers and why? >> Well this this is an old one, the Programming Pearls by Jon I think I read it when I was a PhD student, but I think it's it's nice as showing how very talented programmers work, [snorts] how they think about their programs. So, it's it's it's it's a combination of choosing the right algorithms, expressing them clearly, uh knowing when to stop, when when to use a simple algorithm, where where when a more complicated one is not needed, uh having a sense of elegance in in the code you write, um uh having a feeling for where the problem is when when the the code misbehave. So, all all that kind of things that are hard to communicate, and I think those those pearls that are very easy to read, uh and and and don't use any complicated data structures, don't use any complicated language. I mean, it it's it's kind of timeless, you know. Um I think those pearls are are good illustration of that. Uh so, if you haven't read it, it's it's a classic, but I think it's a nice reading. Nice read. Uh the second one is a little more controversial, I guess. So, in the How to Design Program, which is a fairly ambitious title as well. And this comes from the Scheme community, okay, Abelson and Findler, Flatt, and Krishnamurthi. Um and and those people have developed uh well, the Scheme community is famous for having developed uh pedagogical resources that are I mean, ways to teach programming uh that that go beyond teaching functional programming, basically. And so, so there was the the MIT [clears throat] Course Structure and Interpretation of Computer Programs, which was quite famous, and this is kind of a more modern twist on on on similar ideas. And and and I find this book interesting because well, it it it really teaches you the way of functional programming a way to functional programming. It can be very irritating sometimes, very opinionated, very um almost mystical sometimes, but but it's also another great attempt at at trying to communicate how experienced programmers go about uh designing a program uh even before writing the first line. Okay. And and then how given a language like Scheme, which is pretty flexible, how the code kind of follows uh naturally. >> You know, knowing what you know now, if you could go back to when you just started your career and give yourself some advice, what would you say? >> Sometimes I got that uh maybe I specialized a little too early in in in um in programming language research. Uh maybe well, there there are some topics that are I didn't learn because I didn't feel like it. And and that I had to relearn later or I still have to learn now that I'm almost 60 and maybe not not as um uh not as quick uh as I was back in the day. So, yeah, maybe I I did specialize a little too early. And so, I would encourage everyone to get a everyone who's serious about working in computing uh to get a fairly diverse computer science background. Even even for topics that look super theoretical and are not very uh relevant to uh to everyday uh jobs. Uh well, we mentioned the computability for instance things like the halting problem and so on. You're not going to run into that very often, but it still gives interesting perspectives, I think. And then it also helps understanding new problems. Like with quantum computing. What can you do with a quantum computer that you cannot do with a normal computer? And and and it's it's time to to revisit all of the classic complexity theory I learned earlier and when when I was young. And and so yeah, I think I think it's good to have those this kind of background even if it's not obvious you will be using it everyday. And and sometimes I wish I had taken time to accumulate a little more of this background before specializing in in programming languages. >> Awesome. Well, thank you so much for your time Professor Liwei. I appreciate it. >> Thank you Aaron. That was nice. >> Hey, thank you for watching this podcast. If you liked it and you want to see the show grow, please support with a comment or a like. Also, if you have any recommendations for people you want me to bring on, please drop a comment. Guests like Barbara Liskov, Mike Stonebraker, Mark Brooker, these were all people that I brought on because someone left a comment. On another note, aside from the podcast, I'm working on building the ergonomic keyboard that I wish existed. Here's a glance at the prototype. It's a split keyboard, so there's two sides. Um this is in the case. But yeah, we launched on Kickstarter and we hit our goal within 8 hours of launching. I really appreciate it if you were one of the people who grabbed one of the early units. Um we're now working on the long journey of building the tooling now. And so if you still want to pick one up, I've left the late pledges open on Kickstarter, so you can grab one there. I'll put a link in the description. Thank you again for watching the podcast and I'll see you in the next episode.
