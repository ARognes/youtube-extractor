transcript: Hey, NoClip subscriber. Today is NoClip's 9th birthday. And to celebrate, we've launched a brand new channel called NoClip 2. While NoClip's mission has been to document the history of games, NoClip 2's mission is to inspire a positive future for this industry by highlighting artistic new games that don't get enough coverage, crafting thoughtful previews of upcoming games, filming features about areas of game culture that we don't talk about enough, and reporting on the issues in games that matter to you the most. If you're interested in that and more, head over to youtube.com/noclip2 to check out our launch trailer. Or just hit the subscribe button and never actually check it out. That would be helpful, too. Thanks for supporting NoClip for the past 9 years. Here's to an exciting end to our first decade. [Music]
