transcript: '{"content":"\n[29.92s] In my therapy work with abused individuals\n[32.8s] there was always huge variation\n[34.72s] in the emotions experienced by different clients.\n[38.32s] Some felt explosive rage.\n[40.8s] For others, anger was nonexistent.\n[44.24s] Some clients looked back on their abusive \nrelationships with overwhelming grief.\n[49.84s] Others viewed them with cold detachment.\n[52.96s] But one emotion was present in \nsome form in virtually every case.\n[57.44s] Common as it was, the nature of the emotion itself\n[60.72s] made it one of the most difficult to discuss.\n[63.36s] And some individuals worked \nhard to avoid the subject.\n[67.2s] Shame.\n[68.72s] I want to explore some questions \nabout this potent emotion.\n[72.72s] What are the effects of shame?\n[74.64s] What kinds of environments encourage shame?\n[77.84s] Is the practice of shaming \nindividuals a force for social good?\n[82.08s] How do shame-bound individuals — who’ve \nbecome immersed in malignant shame —\n[86.32s] overcome their self-loathing?\n[89.68s] Shame is broadly defined \nas an uncomfortable feeling\n[93.04s] caused by an awareness of \nsome personal shortcoming.\n[96.8s] On the surface, it would seem \nlike a useful, healthy emotion\n[100.4s] conducive to positive social interactions.\n[103.6s] After all, feeling some discomfort \nabout our transgressions\n[107.04s] can motivate us to do better.\n[109.6s] So what’s the problem?\n[111.92s] To understand the special impact of shame\n[114.48s] it can be instructive to look \nat a closely related emotion.\n[118.72s] June Tangney and Jessica Tracy \nexplored the relationship\n[122.16s] between shame and guilt\n[124.56s] two members of a group of self-conscious emotions\n[127.44s] that also includes pride and embarrassment.\n[130.96s] They note that shame and guilt \nare frequently mentioned together\n[135.04s] and characterised as moral \nemotions that inhibit behaviour\n[138.88s] considered to be antisocial \nor morally objectionable.\n[143.12s] In reality, things aren’t so straightforward.\n[146.64s] Shame and guilt have some fundamental differences\n[150.16s] that generate very different motivations.\n[153.2s] For Tangney and Tracy, it was psychologist\n[155.6s] Helen Block Lewis who captured the distinction.\n[158.96s] According to Lewis, guilt \ninvolves a negative evaluation\n[162.24s] of a specific act or behaviour\n[164.64s] whereas shame goes deeper, involving \na negative evaluation of the self.\n[169.92s] The person is seen as having a defective, \ninadequate, even corrupt nature.\n[176.0s] This difference in focus has \na big impact on our responses.\n[180.8s] Tangney and colleagues present \na wealth of empirical research\n[184.48s] showing how targeting the \nperson rather than the act\n[187.52s] is associated with a range of destructive \nbehaviours and mental health issues.\n[193.28s] Susceptibility to shame is strongly \nrelated to defensive anger and aggression.\n[199.36s] The aggression could be physical or verbal.\n[202.48s] It might be displaced — \ndirected towards individuals\n[205.84s] unrelated to the source of the shame.\n[208.72s] Anger is also often directed inward on the self\n[212.48s] further compounding the problem.\n[214.96s] In contrast, susceptibility to guilt \nappears to be unrelated to anger.\n[220.32s] Where guilt-prone individuals do feel anger\n[222.88s] they’ve been found more likely \nto handle it constructively\n[226.0s] with non-hostile discussion and corrective action.\n[230.24s] Shame-prone individuals are more likely\n[232.32s] to try and deny or evade the situation\n[235.28s] whereas guilt-prone individuals are more likely\n[237.84s] to engage in restorative behaviour\n[240.08s] including confessions, apologies and reparations.\n[244.64s] Jeff Joireman found that shame was \nassociated with unproductive self-rumination.\n[250.56s] Shame-prone individuals can become absorbed\n[253.52s] in unfocussed self-critical thoughts, \nresulting in more psychological distress\n[258.96s] and less headspace for empathic reflection.\n[262.88s] Joireman suggested that shame and rumination\n[266.08s] feed on each other, creating \na self-reinforcing cycle.\n[271.52s] Given all the distortions associated with shame\n[274.48s] it’ll come as no surprise that \nsusceptibility to shame is strongly linked\n[278.8s] to a range of psychological symptoms and disorders\n[282.4s] including depression, anxiety, \nPTSD, eating disorders,\n[287.6s] substance abuse, self-harming \nand suicidal behaviour.\n[292.96s] The evidence is clear.\n[295.2s] With its focus on a specific act\n[297.6s] guilt serves various \npsychologically adaptive functions\n[301.36s] helping to facilitate positive resolution.\n[304.72s] Meanwhile, with its focus \nwidened to the whole person\n[308.32s] shame serves various maladaptive functions\n[311.28s] sparking aggressive defences \nthat block positive resolution\n[315.12s] and lead to destruction and disorder.\n[318.88s] Targets of abuse often have \na susceptibility to shame\n[322.64s] actively instilled into \nthem in their earliest years\n[326.0s] through constant subjection to shaming.\n[328.96s] This can develop into toxic or malignant shame\n[332.32s] where the shame becomes a \nmore or less perpetual state\n[335.68s] permeating the target’s thoughts, \nactions and experiences.\n[339.92s] For the shame-bound individual\n[341.84s] the process of overcoming abuse \ncan feel like an assault course\n[345.92s] because even the steps they take \ntowards health can inspire shame.\n[359.44s] Of the many kinds of manipulations \nabusers use on their targets\n[363.2s] — from gaslighting to \ninfantilising to double binds —\n[367.76s] shaming is one of the most pernicious.\n[370.56s] Different abusers will inject different \nstrains of shame into their targets\n[374.56s] based on their own hang-ups.\n[376.56s] Some abusers are obsessed with \ngerms and dirt, neatness and order.\n[381.68s] Some are preoccupied with body image, \nsexuality, gender roles, social status.\n[388.24s] But in all cases the \nunderlying message is the same:\n[392.0s] there’s something fundamentally wrong with you.\n[395.12s] Some abusers convey this message directly\n[397.84s] openly telling targets they’re \nworthless, rotten, degraded.\n[402.88s] Many abusive religious \ngroups plump for this option\n[405.76s] teaching targets to grovel to gods and ghosts\n[408.64s] to forgive them for their wretchedness.\n[411.84s] A more indirect method is to \nset impossibly high standards.\n[416.24s] Targets are often expected to \nexhibit superhuman qualities\n[419.76s] like infallibility, omniscience, telepathy.\n[424.08s] They’re expected to know exactly what \nto do and say at any given moment\n[429.36s] and punished when they inevitably fall short.\n[433.12s] In healthy environments, it’s understood\n[435.44s] that each of us is born fumbling and unprepared\n[438.4s] into a strange and bewildering world.\n[441.28s] Mistakes are expected as a natural part\n[444.16s] of learning to navigate that world\n[446.16s] and seen as a source of growth.\n[448.56s] Malignant shaming environments make \nfew allowances for inexperience.\n[453.92s] Mistakes are taken as proof of innate stupidity,\n[457.44s] thoughtlessness, or deliberate troublemaking.\n[461.52s] Instead of growing, the target’s world shrinks.\n[464.88s] Over time, the abuser’s message is internalised\n[468.4s] changing from ‘there’s something \nfundamentally wrong with you’\n[472.08s] into ‘there’s something \nfundamentally wrong with me’.\n[475.68s] This is where shaming surpasses manipulations \nlike gaslighting and double binds.\n[481.44s] Shaming is an abuse we’re \ntaught to inflict on ourselves.\n[485.12s] Targets absorb the hypercritical \nvoices of their abusers\n[488.88s] so that eventually the abusers \ndon’t have to say a word.\n[492.88s] The shame-bound individual is like a fox\n[495.68s] that’s been trained to hunt itself to exhaustion\n[498.96s] while the hounds sit back and enjoy the show.\n[502.48s] What’s more, the fox often \ncontinues to hunt itself\n[506.16s] long after the hounds have gone.\n[508.48s] Unlike gaslighting and double binds which stop\n[511.68s] the moment we cut our abusers out of our lives\n[514.64s] shame can persist long after \nwe’ve ditched our abusers.\n[518.08s] Even after their death.\n[520.4s] I want to look at five persistent sources of shame\n[523.28s] commonly reported by targets of abuse.\n[526.8s] Many targets feel deeply ashamed \nfor allowing the abuse to happen.\n[530.88s] Even in cases where they were only children\n[533.52s] facing adult abusers with \nunfathomable power and resources.\n[537.76s] Even in cases where they acknowledge\n[539.52s] that resistance might well’ve \nled to more intense abuse.\n[542.88s] They still blame themselves for not resisting.\n[546.0s] In a similar vein, some targets feel ashamed\n[549.12s] for having being part of a malignant group\n[551.36s] — a family, a workplace, a religious sect —\n[551.6s] in which they repeatedly witnessed the \nabuse of others and took no action.\n[557.52s] Targets sometimes feel ashamed of times\n[559.44s] when they’ve hidden from their abusers.\n[561.84s] Someone I’ll call Simon told me he would \nsecretly disconnect his family’s telephone\n[566.88s] on certain nights of the week to avoid \nphone calls from an abusive friend.\n[571.84s] He said he was afraid his cowardice \nwould be discovered by his family.\n[577.44s] Many targets feel ashamed of some \nof the maladaptive coping techniques\n[581.04s] they’ve used to try and temporarily \nanaesthetise their self-loathing.\n[585.44s] Like bingeing on drugs, food \nor alcohol; self-harming;\n[590.48s] participating in risky sexual encounters\n[593.28s] which sometimes go much further than planned.\n[596.8s] Because the coping technique \nis in itself a source of shame\n[601.04s] it can lead to a self-reinforcing cycle.\n[604.08s] Shame provokes the coping technique\n[606.32s] which in turn provokes more shame.\n[609.28s] I want to mention one more common source of shame.\n[612.96s] Some years ago when I was \nworking in a counselling charity\n[616.24s] I saw a client I’ll call Troy who’d \nwritten on his application form\n[620.24s] that he’d recently been ambushed \nat knife point by two muggers.\n[625.04s] On reading those details, I assumed \nhe’d come to deal with trauma.\n[629.92s] In fact he came to deal with shame.\n[633.12s] When the muggers jumped him from \nbehind, flashing a knife in his face\n[637.36s] instinctively Troy found himself fighting back\n[640.4s] — as he put it — like a cat on drugs.\n[644.56s] Within the space of a few seconds\n[646.72s] one of his attackers was \nimmobilised with a broken leg\n[650.24s] and the other was concussed into unconsciousness.\n[653.52s] The emergency services were called\n[655.44s] and Troy’s attackers were \nlater arrested and charged.\n[659.76s] Despite assurances from ambulance and police staff\n[662.8s] that he had no reason to reproach \nhimself for fending off his attackers\n[667.04s] Troy became consumed with shame at \nthe injuries he inflicted on them.\n[671.76s] He replayed the event endlessly\n[674.08s] beating himself up for not \nexercising more self-control.\n[678.8s] One of the most twisted kinds of \nshame instilled in targets of abuse\n[683.28s] is the shame of sticking up for yourself.\n[686.88s] For some targets, overcoming \nthese five sources of shame\n[690.48s] begins by acknowledging them for \nwhat they are: survival behaviours.\n[696.0s] All of them are classic instinctive \nresponses to persistent threat.\n[701.12s] We shut down. We hide. We \nnumb ourselves. We lash out.\n[706.96s] How perverse is it that our \nabusers throw us into survival mode\n[711.36s] and we despise ourselves for trying to survive?\n[715.52s] In one of my first counselling \nqualification courses\n[718.4s] one of the course leaders, a woman called Celia\n[721.28s] conducted a counselling \nsession in front of the class\n[723.92s] with a volunteer student I’ll call Harriot.\n[727.6s] Harriot spoke openly about her shame in tolerating\n[730.96s] violent abuse from her family \nthroughout her childhood.\n[734.8s] She said she hated how weak she’d been.\n[737.76s] Celia commented, ‘I think that \nlittle girl was incredibly strong.’\n[742.4s] Harriot protested, ‘How can you say that?’\n[745.68s] Celia said, ‘Because she made \nit here to tell the tale.’\n[750.8s] In the tears that followed, a \ngreat deal of shame was released.\n[756.08s] People who make it out of abusive environments\n[758.88s] sometimes kick themselves \nfor having tolerated things\n[761.76s] they wouldn’t dream of tolerating now.\n[764.88s] But we can’t blame ourselves\n[766.56s] for knowledge and skills we didn’t have back then.\n[770.08s] That’s the mindset of abusive shamers\n[772.48s] who expect us to know exactly what \nto do and say at any given moment.\n[777.92s] Overcoming shame means letting go \nof those impossible expectations.\n[783.52s] I’m pleased to report that both the individuals\n[786.08s] in the real-life cases I’ve \nmentioned overcame their shame.\n[790.56s] Troy was able to lay the ultimate responsibility\n[793.92s] for his attackers’ injuries \nwhere it belonged — on them.\n[798.4s] They chose to jump a stranger in the street\n[801.68s] and put him in fear for his life.\n[804.48s] By creating that volatile situation, they \nput not only Troy but themselves at risk.\n[811.2s] Unfortunately for them, in \ntheir case that risk backfired.\n[816.24s] Simon’s case in particular \nillustrates an important point.\n[820.4s] Eventually Simon ended the friendship.\n[823.28s] Sometime later he spoke to \nhis family about the abuse.\n[826.88s] When he confessed to \ndisconnecting the family phone\n[830.24s] far from judging him to be a coward\n[832.24s] his family just wished he’d told them sooner\n[834.8s] so he wouldn’t’ve had to \nstruggle with it by himself.\n[838.16s] This highlights the \nself-defeating nature of shame.\n[842.0s] Our fear of disapproval inhibits us from testing\n[845.2s] whether our fear of disapproval is well-founded.\n[848.8s] Sometimes keeping shameful secrets \njust insulates us from support.\n[855.76s] When we’ve been taught to \nfeel persistent private shame\n[858.64s] — to see ourselves as defective, worthless —\n[862.56s] overcoming that mindset \nmeans retraining our brains\n[866.32s] unpicking the malignant \nthinking habits we’ve acquired.\n[869.6s] Part of that retraining process is learning\n[871.84s] to recognise the alien saboteur —\n[874.24s] the voice of our abusers that we’ve internalised\n[877.04s] that masquerades as our own.\n[879.68s] Instead of giving that voice \nour mindless reflex agreement\n[883.2s] we can learn to view it with \nmindful critical distance\n[887.04s] and reject any bogus sentiments;\n[889.92s] divorce ourselves from its alien \npreoccupations and hang-ups.\n[894.8s] An idea internalised by many \ntargets to varying degrees\n[898.8s] is that they bear responsibility \nfor everything bad that happens.\n[903.2s] Pawel had a particularly \npowerful strain of this one.\n[907.36s] It was his girlfriend who \nsuggested he tried therapy.\n[910.4s] She said he was always so hard on himself\n[912.64s] and she wondered if he was depressed.\n[915.28s] Pawel presented as a cheerful upbeat individual.\n[918.72s] He joked that it was probably his girlfriend \nwho needed therapy for putting up with him.\n[923.68s] I asked why his girlfriend might \nthink he was hard on himself.\n[927.44s] He said she hated how he beat \nhimself up when things went wrong.\n[931.44s] She was always trying to convince \nhim things weren’t his fault.\n[934.72s] But Pawel said he was ‘bad luck’.\n[937.36s] He joked that he had the ‘sadim’ touch\n[939.92s] which my confused face prompted him to \nexplain was the Midas touch in reverse.\n[945.12s] In our sessions it became clear this self-image\n[948.72s] had been drilled into him by his parents.\n[951.6s] From his earliest years, he \nwas subjected to complaints\n[954.64s] about how much better their \nlives would’ve been without him.\n[957.84s] He was blamed for their financial struggles,\n[960.56s] their feuds with relatives, \neven their physical illnesses.\n[965.04s] Pawel internalised the idea \nhe was the source of all bad\n[969.12s] and applied it to his relationships with \nother people, including his girlfriend.\n[974.16s] He was an affliction, a Jonah.\n[977.04s] For all his joking, it was a crushing burden.\n[981.04s] But what was weighing Pawel down\n[983.12s] had absolutely nothing to do with responsibility.\n[987.44s] Pawel and I spent some time reflecting \non the concept of responsibility\n[991.44s] and how it applied in different situations.\n[994.48s] We started out with examples from his own life.\n[997.6s] But he found it difficult to be objective.\n[1000.24s] His mind was powerfully geared to \nhunt for reasons to blame himself\n[1004.32s] and disregard arguments in his defence.\n[1007.68s] So we looked at various hypothetical \nsituations involving other people.\n[1012.64s] For example, a random stranger with no training\n[1015.92s] is put in sole charge of a nuclear powerstation.\n[1019.6s] If the plant goes into meltdown, \nshould she be held responsible?\n[1024.64s] A museum curator is ordered at \ngunpoint to open the museum vault\n[1029.6s] and hand over a valuable painting.\n[1032.48s] Should he be held responsible for the theft?\n[1036.72s] In the process of articulating his responses\n[1039.2s] to these and other imaginary examples\n[1041.92s] Pawel began to dig deep into \nthe concept of responsibility.\n[1046.88s] Over time, he identified a range \nof factors that would affect\n[1051.04s] how an individual’s responsibility was assessed.\n[1054.56s] Factors like knowledge, skill, \nautonomy, intention, power.\n[1061.44s] He recognised that where these \ncapacities were absent or diminished\n[1065.36s] responsibility could be reduced or nullified.\n[1069.76s] When the time felt right, I put \nthe following situation to him:\n[1074.88s] A couple decide to have a child.\n[1077.12s] They experience financial struggles, feuds \nwith relatives and physical illnesses.\n[1083.76s] How responsible is the child?\n[1087.04s] Long pause. Then a laugh.\n[1089.92s] Then a quiet declaration: ‘I wasn’t responsible.’\n[1095.52s] In subsequent sessions, Pawel \ndissected many instances\n[1099.28s] of false blame heaped on him by his parents.\n[1102.96s] He began to see the sheer \nperversity of their behaviour.\n[1106.72s] He recalled an old forgotten memory of a time\n[1109.76s] when his father was driving and took a wrong turn.\n[1113.52s] When Pawel pointed out the mistake\n[1115.68s] he was scolded and dismissed.\n[1118.48s] Later, when his father had to \nconcede he was lost, he blamed Pawel.\n[1124.24s] If the boy had made himself useful \nnavigating the journey by map\n[1127.92s] instead of just sitting there staring \nout the window they’d never’ve got lost.\n[1133.36s] This is how it went.\n[1135.36s] His parents would shut down his contributions\n[1138.32s] then blame him for not contributing.\n[1141.36s] With little power comes little responsibility.\n[1145.68s] Pavel’s case illustrates some useful points\n[1148.32s] about overcoming misguided private shame.\n[1152.16s] As I’ve noted, the stimulus \nthat sparks private shame\n[1155.52s] will vary from person to person.\n[1158.56s] In Pawel’s case, random \nmisfortunes triggered the feeling.\n[1162.4s] But it could be anything from \nexperiencing sexual desire\n[1166.08s] to having critical thoughts about \na religious or political ideology\n[1170.24s] to feeling some forbidden emotion \n— maybe anger or distress.\n[1175.92s] These shame responses are \nunexamined, automatic, thoughtless.\n[1182.24s] A powerful antidote to an \nunthinking response is thinking.\n[1187.2s] The more conscious critical thought we apply\n[1189.68s] the less misguided shame we’re likely to feel.\n[1193.84s] And Pawel’s case highlights the \nimportance of thinking for yourself.\n[1198.08s] My role in his sessions was not \nto do all the thinking for him\n[1202.4s] but to provide a socratic dialogue —\n[1205.04s] to offer questions to assist him in his thinking.\n[1209.2s] In the building of his \nthoughts about responsibility\n[1212.32s] Pawel did his own heavy lifting.\n[1215.68s] Many shame-bound individuals struggle to \njudge for themselves what’s reasonable.\n[1221.12s] Is it okay to think this?\n[1223.6s] Is it okay to feel that?\n[1226.08s] In this state of doubt, there’s often a temptation\n[1228.72s] to defer to the judgements of others\n[1231.12s] to let others do the thinking for them.\n[1234.0s] The most face-smacking problem with this\n[1236.4s] is that deferring to the judgement of others\n[1238.64s] is often precisely what leads \nindividuals to become shame-bound.\n[1243.44s] They’ve deferred to bogus misguided judgements.\n[1247.6s] If we’re struggling to judge for ourselves\n[1250.08s] whether a thought, a feeling, \nan action is acceptable\n[1254.48s] deferring to what other people find acceptable\n[1256.88s] will do nothing to enhance our judgement.\n[1260.16s] To do that, we have to develop our own thinking\n[1263.36s] to become our own Socratic questioner\n[1266.48s] interrogating our principles, \nexposing our assumptions\n[1270.72s] attacking our ideas from all \nangles to see if they hold up.\n[1275.6s] Then we can make our own confident \nrational judgements about what’s acceptable\n[1280.56s] and let go of our private shame.\n[1284.24s] And something else will happen.\n[1286.4s] We’ll be equipped to stand \nour ground against the group\n[1289.84s] — to resist public shaming.\n[1300.56s] Our experiences of public \nshame are intimately bound up\n[1304.24s] with some of our most primitive \ninstincts around social membership.\n[1309.04s] When people are found to have gone \nagainst the rules of their group\n[1312.24s] remarkably similar responses are seen\n[1314.96s] across human cultures around the world.\n[1318.08s] Individuals withdraw and \nattempt to appease the group.\n[1322.16s] They communicate their \nacceptance that their welfare\n[1324.72s] is now regarded by others as less important\n[1327.92s] and perform various nonverbal \ndisplays of subordination\n[1331.36s] which resemble appeasement \ngestures found in other primates.\n[1335.2s] They also show higher levels of cooperation.\n[1338.88s] The cross-cultural — and in some \ncases cross-species — nature\n[1342.72s] of these responses points to a \ndeeply hardwired social mechanism.\n[1347.92s] Whatever kind of group we find ourselves born into\n[1351.04s] whether it’s an enlightened free society\n[1353.68s] or a dogmatic ideological backwater\n[1356.8s] we absorb its values and fear being \ndiscovered transgressing them.\n[1362.24s] This is how the phenomenon of shame \nfeeds into the tyranny of the majority.\n[1367.76s] In families, ideological communities, nations\n[1372.16s] individuals are trained to feel defective\n[1374.88s] based not on rightness or \nrationality but merely on numbers\n[1378.88s] — on what the majority happens \nto consider acceptable.\n[1384.24s] The prospect of public shaming \nfor perceived transgressions\n[1387.44s] is what confronts people who ‘come out’\n[1389.44s] — people who reveal an aspect of themselves\n[1392.56s] that’s been unjustly \nstigmatised within their group.\n[1396.24s] Often these individuals have resolved \ntheir feelings of private shame\n[1400.4s] acknowledging within themselves that \nthey have no reason to feel defective.\n[1404.4s] And in the process of coming \nout, they deal confidently\n[1407.52s] with attempts to humble them with public shame.\n[1411.28s] But it’s worth mentioning that for some \nindividuals things don’t go to plan.\n[1416.4s] In the midst of their declaration, they \nfind their previous confidence collapses.\n[1421.44s] They watch themselves apologising, appeasing,\n[1424.72s] compromising and accepting inferior status.\n[1429.84s] Later, they wonder what happened.\n[1432.08s] It felt like they were taken over.\n[1434.72s] And it’s possible they were —\n[1436.64s] by the aforementioned human instinct\n[1438.88s] to submit in the face of group disapproval.\n[1442.88s] These hardwired social instincts \ncan have a powerful grip on us.\n[1447.6s] But if we’re consciously prepared for them\n[1449.84s] we can often keep them under control.\n[1453.04s] It’s especially easy for instinct to \ntake over when things get aggressive.\n[1457.92s] And in some cases that instinct is a good thing.\n[1461.76s] In recent years, some people who’ve \nshared their coming out experiences\n[1465.76s] reported being physically attacked and \nhaving dangerous objects thrown at them.\n[1470.64s] By who? Their parents.\n[1474.24s] Some tried to appease them.\n[1476.24s] Some ran out of the house.\n[1478.8s] Later on, some of them were \nannoyed that they backed down.\n[1482.96s] My response is I’m glad they \nmade it out in one piece.\n[1486.08s] For me the pressing issue would be:\n[1488.32s] do people who provoke raw survival \ninstincts deserve any place in your life?\n[1495.12s] Sometimes public shaming can \ntake individuals by surprise.\n[1498.96s] But even though they’re unprepared for it\n[1501.28s] it can really serve to clarify things for them.\n[1504.72s] Some real-life cases.\n[1508.08s] Ruth was born into a religious community \nin which the women only wore dresses.\n[1514.0s] In her twenties, tired of \nthis sartorial restriction\n[1517.6s] she started wearing trousers.\n[1519.76s] She knew plenty of women outside of her community\n[1521.92s] who wore them and in her mind, \nit hadn’t seemed a big deal.\n[1526.64s] She was shocked to find herself \ninsulted and pathologised\n[1531.6s] by several members of her \nfamily and the wider community.\n[1536.88s] Throughout his childhood, \nVirgil was violently molested.\n[1542.16s] His abuser was an older cousin\n[1544.64s] who had an illness that \nshortened his life expectancy.\n[1548.24s] To the rest of the family, Virgil’s \nabuser was an innocent tragic figure.\n[1553.52s] And after his death in his early twenties\n[1556.56s] the family began to picture him as \na guardian angel watching over them.\n[1561.2s] They would call out for his help\n[1563.04s] and thank him when good things happened.\n[1567.12s] Eventually Virgil told his family \nwhat their guardian angel did to him.\n[1572.56s] His revelation was met with a \nsilence that persisted for days.\n[1578.08s] When he pushed for some response\n[1580.48s] his mother said he’d ruined everything \nand he should’ve kept it to himself.\n[1586.48s] Some weeks later, some relatives suggested \nthe abuse was just innocent play.\n[1592.56s] Some suggested Virgil initiated it.\n[1596.88s] He realised they were slowly bringing \ntheir guardian angel back to life.\n[1602.96s] In her thirties, Jacqueline cut all contact \nwith her abusive parents and siblings\n[1608.08s] keeping in touch only with \nmembers of the wider family.\n[1612.0s] When a much-loved uncle died, \nJacqueline attended the funeral\n[1616.08s] taking a friend for moral support.\n[1618.8s] Both of them experienced a barrage of insults \nfrom Jacqueline’s parents and siblings\n[1623.76s] who told her she should be \nashamed to show her face.\n[1627.44s] After the funeral, they continued their abuse\n[1630.4s] following Jacqueline and her \nfriend back to their hotel.\n[1634.48s] Some months later, her mother died.\n[1638.24s] Jacqueline didn’t attend the funeral.\n[1641.2s] Through the wider family grapevine \nshe heard that her father complained\n[1645.04s] how shameful it was that \nJacqueline didn’t show her face.\n[1649.44s] But, without Jacqueline’s presence\n[1651.76s] he seemed to lose steam and soon fizzled out.\n[1656.56s] For Ruth, her community’s attempts to shame her\n[1659.68s] opened her eyes to how they \nfalsely moralised non-moral issues.\n[1664.8s] She had always seen the practice \nof wearing dresses as a tradition.\n[1668.8s] But they elevated it to a moral law\n[1671.12s] which they tried to justify to her\n[1673.12s] with fallacious nonsense about gender and virtue.\n[1676.72s] As Ruth noted, it’s the role of traditions \nto serve the people who perform them\n[1681.68s] — not the role of people to serve traditions.\n[1684.72s] And wearing dresses wasn’t serving her.\n[1688.08s] The incident brought out a side \nof her family and community\n[1691.44s] she hadn’t seen before and \nbegan an unravelling process\n[1695.04s] that eventually led to her departure.\n[1698.08s] Virgil came to realise his \nfamily was more invested\n[1700.96s] in preserving illusions than in his welfare.\n[1704.8s] For all their lip service \nabout the importance of family\n[1707.68s] — about its ‘unbreakable bonds’ —\n[1710.32s] not a single individual had shown any empathy\n[1713.76s] for the pain and shame he’d \ncarried for so many years.\n[1718.24s] Instead they focused on \nresuscitating their fantasy image\n[1721.84s] of his abuser as an innocent angel.\n[1725.76s] In contrast to his family, Virgil \ndidn’t try to preserve his illusions.\n[1730.64s] He realised how brittle his family was.\n[1733.28s] They couldn’t deal with reality\n[1735.52s] and the emotional mess it sometimes brought.\n[1738.72s] He recognised these weren’t people \nhe could look to for support.\n[1742.48s] And he drifted into appropriately distant contact.\n[1747.04s] For Jacqueline, it was no surprise \nthat her family criticised her\n[1751.04s] for showing her face then \nfor not showing her face.\n[1754.72s] It was a perfect example of the no-win \ndouble-bind abuse she endured growing up\n[1760.4s] where the rules could be reversed \nat any time to put her in the wrong.\n[1765.84s] But being attacked at her uncle’s funeral\n[1768.8s] what struck her for the first time was \nhow desperate for drama her family was.\n[1774.8s] Before she’d cut them out of her life\n[1776.8s] they’d always been so careful \nto abuse her in private\n[1780.32s] and maintain a happy family \nimage to the outside world.\n[1784.8s] But the funeral was like a feeding frenzy.\n[1787.84s] They were so hungry for blood they \nforgot all about their public image.\n[1792.88s] It was eye-opening.\n[1794.56s] She realised how dependent they’d \nbeen on her as a source of drama.\n[1799.44s] It was eye-opening for many \nmembers of the wider family too.\n[1803.36s] Some of them reached out to Jacqueline\n[1805.36s] and her relationships with \nthem took on a whole new life.\n[1809.76s] In families, in communities, in nations\n[1813.92s] it often takes incidents like these\n[1816.48s] — savage public displays of abusive shaming —\n[1819.52s] to wake people up to what’s going on.\n[1823.84s] When we’re confronted with \npublic shaming from a group\n[1827.04s] it’s easy for us to merge \neveryone together in our minds\n[1830.08s] — to see them as a faceless mob.\n[1834.16s] I’ve been subjected to abusive \npublic shaming twice in my life\n[1837.92s] — both in my teenage years.\n[1840.48s] The first time, like Ruth, Virgil and \nJacqueline, it took me by surprise.\n[1845.44s] It was such a surreal, twilight zone experience\n[1848.64s] my overriding feeling was morbid fascination.\n[1852.0s] The second time I was prepared.\n[1855.12s] Both times, I found myself \nquietly observing these people.\n[1859.6s] I took a long cold hard look at each of them.\n[1863.6s] While the behaviour of individuals who submit\n[1865.84s] to public shaming from their \ngroup is extremely similar\n[1869.68s] behaviour from the actual group itself\n[1872.0s] often shows significant variation.\n[1875.28s] Within my community, some individuals \nattacked me with genuine rage;\n[1880.24s] others attacked me with sadistic pleasure\n[1883.04s] clearly taking amusement in my abuse.\n[1886.64s] Some people ignored me with an \nattitude of obvious contempt;\n[1890.96s] others ignored me with an \nattitude of apologetic awkwardness\n[1894.64s] as if they just didn’t know what to say.\n[1897.52s] Some individuals would appeal to me to repent;\n[1900.56s] others would quiz me for hours, trying to find out\n[1903.44s] what had happened to me to steer me off course\n[1906.56s] — and failing to listen to a single word I said.\n[1910.48s] And in some cases, individuals would hop around\n[1913.44s] between different approaches\n[1914.8s] — threatening then guilt-tripping then pleading.\n[1919.84s] The phrase ‘can’t see the forest for the trees’\n[1922.56s] refers to situations where people \nare so focused on minor details\n[1926.48s] that they fail to see the bigger picture.\n[1929.68s] But sometimes it helps to \nstay focused on the trees\n[1933.92s] — to see the individuals instead of the group.\n[1937.44s] There’s no wisdom of crowds \nin abusive public shaming.\n[1941.04s] Just a collection of confused, misguided\n[1944.24s] and, in some cases, sadistic individuals.\n[1952.16s] When we’ve been trained to feel malignant shame\n[1954.8s] retraining our brains can take time.\n[1957.28s] And it can help to find \ngood supportive communities\n[1960.16s] who reinforce healthy critical thinking habits.\n[1964.4s] But it’s worth noting that sometimes\n[1966.72s] when we think we’ve overcome our shame\n[1968.96s] and feel able to stand our ground\n[1971.04s] it can start creeping back \nin subtle insidious ways.\n[1976.08s] Some people who’ve been historically shamed\n[1978.32s] by their family come to an uneasy truce.\n[1981.92s] Not wanting to lose the person\n[1983.76s] family members makes a \nsuperficial show of acceptance\n[1987.52s] — but continue to communicate their discomfort\n[1990.4s] and disapproval in indirect ways.\n[1993.76s] The unspoken bargain is:\n[1996.08s] ‘We’ll tolerate you if you don’t \ntalk about that part of you....’\n[2000.72s] It’s a kind of shaming by stealth.\n[2003.92s] For people who’ve struggled with shame\n[2006.08s] it‘s wise to think about \nlimiting the time you spend\n[2008.88s] around people who constantly \nwork to re-energise the idea\n[2012.48s] that there’s something \nfundamentally wrong with you.\n[2016.72s] Wherever you are in your journey\n[2019.2s] — taking your first steps or \na fair way along the road —\n[2022.96s] I wish you success in overcoming malignant shame."}'
