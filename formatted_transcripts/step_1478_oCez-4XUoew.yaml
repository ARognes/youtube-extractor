transcript: For the past few years, RAM has been stuck between a rock and a hard place. If you wanted it to be super fast, it needed to be soldered down. If you wanted to be replaceable, you needed to use dims that couldn't hit those same max speeds, and it took up a lot of room. Thankfully, the CAM 2 standard and its laptop version, LP Cam 2, deliver ultra fast speeds on a small module you can unscrew and replace. While it sounds like the perfect solution, it did take a while to develop and it has some nuances that you should be aware of. back actually in 2019 was the first look at uh the DDR5 sodom and our response was same size it's big when you put two of them in there everything else in the system is shrinking but you know so DMs are not shrinking in size so that was really the awakening for myself and and a co-inventor Joe Mallerie uh the two of us said let's just start with a clean sheet of papers okay what do we need to do to make memories smaller and you know we'll lift the performance ceiling. >> Meet Tom Schnel, senior distinguished engineer at Dell. Sweet title. And his clean sheet became the compression attached memory module or CAM. Instead of standing up in a slot like a traditional DIM, the module lies flat and clamps onto a grid of gold contacts. Think of this like how you would install a CPU into an LGA socket. To move the industry forward, Dell handed the design to JDC, the group that sets memory standards. And in December 2023, it became official as CAM 2. As we mentioned earlier, this RAM format comes in a few overarching designs. The smaller LP CAM 2, which will likely replace SOMs and soldered RAM, and standard CAM 2, which aims to replace traditional DIMs. There's also a server cousin called SOCAM 2, designed for AI data centers, but sounds to me like a PlayStation thirdperson shooter. The one we're most excited about is LP Cam 2, the little one. This module is pretty small and dual channel by nature. So, one of them does the work of two sodium sticks. Stacked up against the pair it replaces, it's around 64% smaller and thanks to its low power memory chips, uses roughly 61% less power. Plus, it has the speeds of soldered memory while still being upgradeable. And the improvements don't stop there. modules ship at 8,533 mega transfers per second today, well past the 6,400 mega transfers current top-end sodiums manage without overclocking. Manufacturer spec sheets for LP Cam 2 already go up to 9,600. It's over 9,000. We've heard the joke. The first laptop with this tech was Lenovo's ThinkPad P1 back in 2024. By today in 2026, it's in some mainstream Lenovo laptops and the new Framework 13 Pro. We even went hands-on with some of the first desktop boards at Computex last year. So, expect these to start showing up on store shelves soon. So, the RAM stick, as we know, it should be toast, right? Kaput. Well, there are two little nuances that you should probably know before you go out to buy your first cam RAM. Oh man, it rhymes. The first one comes straight from the inventor's mouth, but we'll talk about both right after we thank our sponsor, MicroEnter. It's back to school time, baby. And you know what that means? You got your pencils, your papers, your $300 off one TBTE flash drives at MicroEnter. Your $399 LG Ultra Gear monitors at MicroEnter. Your free flash drives at MicroEnter. That's right, their Austin store is having a grand opening this year. And Columbus, Ohio is getting remodeled. And you can sign up for a free 128 gig flash drive to redeem when those stores open. As always, stay in the know with all things tech and MicroEnter with MicroEnter News or check out our link below. >> Catch number one. Cam 2 and LP Cam 2 are not interchangeable. >> No, they're not. They're not interchangeable on the same board. Uh the DDR5 cam is a different pin out even though they share the same connector. And so we've put in provisions uh in the design with a orientation of the mounting hole so that you cannot, you know, screw down an LPAN onto uh motherboard intended for for DDR5. >> So you literally cannot screw this up. But it does mean your computer is built for one and not the other from day one. No, your old sticks can't tag along either. The second catch is the price. In 2026, the AI boom has made RAM expensive and the cutting edge stuff more expensive. Modules are so scarce that one of the only places you can buy one is Framework. And this month, they raised their 32 GB module price from $439 to $800 because their supplier more than doubled its prices overnight. Which brings us to the big question. How much time do these old sticks have left? Not much. And the man who'd know has already written its ending. >> Can a SODM connector work? Can a UDM connector work? If you look at, you know, how many pins are in there now, how many more pins you would need, you would see that the those kinds of connectors are just uh are not scalable to where we need to go where a CAM approach is an array of contacts which can scale [music] in rows and columns to, you know, add more pins as we need it and provides that higher speed uh contact performance. It's the It's the really only viable way forward. >> As Tom said, the old connectors just can't scale. There's no room for the pins future memory will need. So, the only path forward is CAM. So, if you're looking to buy a new laptop today and want it to last a good long time, maybe make sure to look for LP Cam 2 listed somewhere on the spec sheet. And that AI boom hoarding the memory, it doesn't even use sticks or modules. It uses HBM, memory chips stacked on top of each other right beside the processor. And we have a video all about that. If you want to check it out, click somewhere near me.
