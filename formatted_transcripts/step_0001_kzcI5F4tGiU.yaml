transcript: 'How could we use AI to learn better? I mean, there''s got to be some way to optimize learning with AI. I think it''s the perfect tool for it. Uh it is not entirely clear yet how. So, yeah. Uh this video will be me sharing my own current approach to this. First, uh I''ll go through the reasoning behind the approach and the design, and then we''ll do a live demo. All right. So, this is the standard way of learning that we''re used to. Each outlet uh so, a teacher, a book, a course, whatever, uh they all are designed to teach many students. And also, each students learns from many outlets. So, there''s a many-to-many relation between the learners and the outlets, and both directions of it produce their own kind of inefficiency. First, one outlet teaches many. An outlet that''s designed for many people cannot be optimal for any one of them. That''s because optimal, quote-unquote optimal, teaching uh that would clearly depend entirely on the learner''s current understanding. And this includes both the whole teaching arc from their current understanding to their goal understanding, as well as each explanation along the way. An optimal teaching path, then, uh would be one that minimizes teaching stuff that the learner already holds, and also stuff that they can''t yet understand. So, it would work exactly at the edge of their understanding. So, ideally, a teacher would have exactly one student. All right. So, second direction, uh one student learns from many outlets. This means many teaching styles to get used to, many notations, many levels of reliability, many interfaces, and the switching between them uh costs mental effort that''s not gone into learning the material. But, I think there''s a much deeper cost in this, which is trust. With an unfamiliar outlet, the brain I I think the brain kind of hedges. So, it won''t fully commit to accepting a fact until the outlet has proven itself and is familiar enough. I think a good way to illustrate this with is with the following example. Let''s say we want to understand the hairy ball theorem, and we have two identical explanations. But, the other one is in a 3Blue1Brown video, and the other is on X posted by some random guy. Now, even though the explanations are identical, I think it is clear that we''re going to learn a better from the familiar source. The brain is going to have a much easier time internalizing the information when it trusts the outlet, even though the explanation is identical. All right? So, ideally, a student would have exactly one teacher. Now, we''ve established that the ideal scenario is one-to-one in both directions, but there''s an obvious objection to this, which is that having only one teacher means getting only one perspective. But, I think that the objection conflates a source with an interface. So, a teacher doesn''t reduce the number of sources, perspectives. Uh instead, it aggregates all of them and delivers them through one interface. So, we don''t lose many perspectives. Now, with AI being the teacher, trust isn''t really built over time. Rather, it''s engineered into the system. The reason we have to have reliable verification and fact-checking is one, correct information. Obviously, we absolutely don''t want the AI to hallucinate false information. But also, two, cuz it makes learning easier when we know that the system is reliable. So, one interface fitted to one mind over all sources. Now, the two inefficiencies that we went over, they give us the two principles that the system runs on. First, optimized teaching, the answer to the first inefficiency. And two, optimized allocation of mental resources, answer to the second one. And this does not mean removing difficulty. Instead, it''s about concentrating all cognitive work into the material itself. We want to maximize struggle. We want to learn difficult things, so struggling is very important, but it has to be in the material itself and not in logistics, planning, finding resources, verifying facts, figuring out what to learn and in what order. All of that is for the system to absorb. Next, the actual process, how this is implemented. First, optimized teaching, to teach optimally, whatever this might be very different from person to person, but in order to do that, the system obviously needs to know the person''s exact current understanding. So, it has to measure, and it does this with a quiz tool, which lets it ask graded multiple-choice questions. It starts off with very broad of and then basically binary search is the edge on every possible strand that the lesson will depend on. So, it''s going to get a very detailed map of the learner''s understanding. So, that''s phase one, probe. Second, phase two is plan. Basically just reasons everything out. How do I teach this mind this specific thing? And here''s also where it fires off its first verification and fact-checking sub-agents. And then presents the plan as a mermaid graph and diagram. And okay, basically two reasons for why why it has to show a graph. One, it gives the learner a better sense of what''s to come. And also two, the actual reason I implemented it is to actually force the AI to reason everything out. That''s the real reason. So, it cannot just cheat and wing it. And then finally, the teaching itself. And this phase is is going to be very different cuz it''s going to depend on it entirely how you want to learn. You want to install the system with your own learning philosophy and how you learn best. But one detail that I think is going to be important regardless of the exact way of learning is feedback. So, the AI is going to quiz you periodically to check whether you actually understood the thing. And this is important for three reasons. One, it''s very easy to sort of gaslight yourself into thinking that you understood something, especially when learning with AI. So, actually testing your understanding is important feedback for yourself. Two, the system needs continuous feedback 