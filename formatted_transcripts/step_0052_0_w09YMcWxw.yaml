transcript: Most software developers react negatively to the word politics, and I get that. And I would like to soften that for them and say, "Hey, politics doesn't have to be nasty or dirty. It's just a word for human interaction." When I think of politics, I think of that as how do businesses and people within businesses reconcile different goals and limited resources. So, I have a goal to get my product out, you have a goal to get your product out, but we have dependencies together or we step on each other, and you want to do yours first and be on your schedule, and I want to do mine first and be on my schedule. Well, how are we going to resolve all of that? That process, which can get nasty, but doesn't have to, is the expression of politics. So, for politics, the first thing is be aware relationship matters.
