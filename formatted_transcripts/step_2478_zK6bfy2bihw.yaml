transcript: "Pour cette nouvelle saison, nous vous avons préparé un petit cadeau : « Nos 19 secrets du français parlé ». Un guide gratuit avec 19 conseils simples et concrets pour vous aider à mieux comprendre et parler le français du quotidien. À télécharger gratuitement : https://frenchwithpanache.com/guide-spoken-french/\n\nJoin our Patreon to get access to interactive transcripts for every episode, bonus conversations, activities, and many other exclusive resources:\n→ https://www.patreon.com/FrenchWithPanache\n\nFOLLOW US :\n\U0001F3A7 Spotify, Apple Podcasts, etc. → https://smartlink.ausha.co/french-with-panache\n\U0001F4FA YouTube → youtube.com/c/frenchwithpanache\n\U0001F4F8 Instagram → https://www.instagram.com/frenchwithpanache/\n\U0001F5E3️ Coaching privé : https://frenchwithpanache.com/our-offers/private-coaching/\n\U0001F9E1 Soutiens-nous : ⁠⁠⁠⁠⁠ ⁠⁠⁠⁠https://www.paypal.com/donate/?hosted_button_id=WTYFE2AY2YVX4  ⁠⁠⁠⁠⁠ \n\n-----------------------------------------------------------\n(FR) Après un été entre l’Espagne, le Maroc et les Alpes françaises… Nous sommes de retour pour la saison 4 (!!) du podcast. \n\nDans cet épisode, on vous raconte tout ce que nos vacances nous ont enseigné sur l’apprentissage d’une langue étrangère. Après deux ans sans pratiquer notre espagnol, on a redécouvert le plaisir de parler, d’observer et surtout d’imiter les locuteurs natifs. Pourquoi il faut arrêter de traduire mot à mot ? Pourquoi notre personnalité peut changer quand on parle une autre langue ? Et pourquoi il ne faut pas toujours écouter son/sa professeur(e) ? Nous répondons à toutes ces questions pendant une conversation fluide et sans filtre.\n\nNous parlons aussi de nos cours de surf et de ce que cette pratique nous a appris : l’importance de garder l’esprit d’un débutant, de faire des erreurs et de se relever, toujours. On vous invite aussi à lâcher prise et surtout, à vous faire confiance. \n\nLa transcription interactive, la liste de vocabulaire et les exercices sont disponibles sur notre Patreon. Bonne écoute, et belle rentrée à toutes et à tous. \U0001F499\n\n(EN) After a summer between Spain, Morocco and the French Alps… we're back for Season 4 (!!) of the podcast.\n\nIn this episode, we tell you everything our holidays taught us about learning a foreign language. After two years without practising our Spanish, we rediscovered the joy of speaking, observing and — above all — imitating native speakers. Why should you stop translating word for word? Why can our personality change when we speak another language? And why shouldn't you always listen to your teacher? We answer all these questions in a smooth, unfiltered conversation.\n\nWe also talk about our surf lessons and what this practice taught us: the importance of keeping a beginner's mindset, of making mistakes and getting back up, always. We also invite you to let go and, above all, to trust yourself.\n\nThe interactive transcript, the vocabulary list and the exercises are available on our Patreon.\n\nHappy listening, and a wonderful back-to-school season to you all. \U0001F499\n\n-----------------------------------------------------------\n\nCONTACT : \nFor business inquiries, please use this email: contact@frenchwithpanache.com."
