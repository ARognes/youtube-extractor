  This piece leans into a more performative approach, built entirely from a compact mini case. By limiting the system to essentials, the sound becomes pared back and intentional, while still allowing space for generative variation and a slowly evolving reverb field to shape the atmosphere.

  Patch Notes
   1. NOH Pianist by NOH Modular generates shifting chord progressions, providing a harmonic framework that moves beyond a static drone. The output is routed into Chord v2 by Qu-Bit Electronix, where different minor chord qualities and subtle voicings are introduced. This keeps the harmony fluid and slightly unpredictable, while still grounded.
   2. Pam’s Pro Workout by ALM Busy Circuits sequences Pico Voice by Erica Synths with a tightly quantized loop. The pattern begins with a single sustained note, gradually expanding to two, then four, then longer phrases. This becomes the central ping voice, minimal at first, then gently unfolding into a more intricate rhythmic presence.
   3. Both voices are shaped through the low pass filter section of Ghost by Endorphin.es. High frequencies are softened to round out the texture, with an LFO providing subtle movement. The internal delay adds the repeating ping effect, introducing space and rhythmic diffusion without overwhelming the core tones.
   4. The full signal is sent into Starlab by Strymon, mounted on a small 3D printed mini rack that I designed and built specifically for this setup. It is set to an infinite reverb configuration, creating a wide stereo image and a sense of distance, allowing the chords and pings to dissolve into a continuous ambient wash.
   5. The final mix is recorded live onto the TP-7 by Teenage Engineering, capturing the performance in one pass and preserving small dynamic shifts and imperfections.

  The modular layers are paired with a field recording captured at night on a quiet street running parallel to Oxford Street. Occasional cyclists pass, and distant conversations drift in and out. The combination of Generative Modular sequencing, evolving Drone Music textures, and subtle Nature Sounds results in a spacious, slightly melancholic atmosphere. The reverb swells suggest distance and isolation, while the environmental sounds anchor it in a real place. It works well for deep listening, focused work, or slow evenings, sitting somewhere between Ambient Music, Lofi Ambient, and Tape Loop Music aesthetics, while retaining the tactile feel of a live Modular Synth performance and intimate Tape Recording workflow.

  Listen & Follow
