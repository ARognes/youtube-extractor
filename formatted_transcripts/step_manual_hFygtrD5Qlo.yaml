our\n[117.439s] deep-seated aversion to sense pains.\n[123.04s] Second, there is bavasa, the defilement\n[126.399s] of existence.\n[128.72s] This is our deep-seated thirst for\n[131.2s] continued existence. We might say, for\n[134.239s] eternal life. In traditional Buddhist\n[137.12s] belief, it''s it''s what keeps us attached\n[139.36s] to samsara and to this beginningless\n[142.16s] round of rebirths.\n[145.28s] We could also perhaps understand this as\n[148.56s] our deep-seated aversion or antipathy\n[151.28s] towards dying.\n[155.04s] The third of these is avas or the\n[158.56s] defilement of ignorance. And this third\n[162.4s] one is perhaps the most fundamental.\n[165.599s] It''s that of it''s the defilement of not\n[167.68s] really understanding the way things are.\n[171.28s] For example, uh not seeing the truth of\n[173.92s] the four noble truths or the truths of\n[177.36s] impermanence of nonself of duka.\n[182.08s] Later Buddhist theorists added a fourth\n[184.8s] asa that of views that is our attachment\n[188.64s] to views and opinions is itself a kind\n[191.519s] of defilement.\n[194.48s] Now with all this understood, we can\n[196.8s] turn to the seven methods that the\n[198.72s] Buddha recommends for abandoning these\n[202.319s] defilements.\n[206.159s] The tool we have to use for this method\n[208.56s] of seeing properly is right view. That\n[213.04s] is the kind of knowledge and\n[214.48s] understanding typically had by the\n[217.68s] relatively advanced disciple known as a\n[220.4s] stream enterer. If you''re not familiar\n[223.28s] with that phrase, I''ll leave a video\n[224.879s] down below in the notes that gives an\n[227.519s] introduction to what a stream enterer\n[229.36s] is.\n[231.84s] The problem that this tool can help\n[234.239s] overcome is what we might call unwise\n[237.92s] attention.\n[239.599s] For example, getting lost in\n[241.519s] speculations about the nature of the\n[243.84s] self.\n[245.439s] The Buddha gives some examples.\n[248.319s] Did I exist in the past? Did I not exist\n[251.28s] in the past? What was I in the past? How\n[255.12s] was I in the past? After being what?\n[258.56s] What did I become in the past? Will I\n[261.84s] exist in the future? Will I not exist in\n[264.4s] the future? What will I be in the\n[266.88s] future? How will I be in the future?\n[270.4s] After being what, what will I become in\n[273.12s] the future?\n[275.04s] Or such people who think this way are\n[277.199s] undecided about the present. Thus am I?\n[281.04s] Am I not? What am I? How am I? This\n[285.36s] sentient being, where did it come from?\n[287.36s] And where will it go?\n[291.12s] These are all forms of unwise attention.\n[294.56s] And what happens when we give unwise\n[297.199s] attention to these kinds of questions.\n[299.36s] Well, we end up in what the Buddha calls\n[301.6s] a thicket of views about the self. this\n[305.52s] bunch of views that keeps us attra\n[307.52s] attached to existence\n[310.56s] through our ignorance of what''s really\n[312.88s] going on with us.\n[315.68s] The solution that the Buddha proposes is\n[317.919s] that of seeing that is wise attention.\n[322.88s] The poly for this phrase is yon\n[325.039s] manosikara. You may have heard it\n[326.72s] sometimes.\n[328.96s] For example, instead of attending to\n[331.36s] these speculations about the self, what\n[334.639s] am I? And so on, we attend to the four\n[338.16s] noble truths to suffering. What is\n[341.199s] suffering? To what the origin of\n[343.199s] suffering is, to what the sessation of\n[346.24s] suffering might be, and to what the path\n[349.039s] that leads to that sessation might\n[351.6s] involve.\n[353.28s] And if we can manage that sort of\n[355.12s] seeing, we''re going to become a stream\n[357.44s] enterer, which admittedly is a tall\n[359.84s] order.\n[362.96s] With this method, our tool is what''s\n[364.88s] known as sense restraint. It''s a great\n[368.16s] tool for mitigating the effects of sense\n[