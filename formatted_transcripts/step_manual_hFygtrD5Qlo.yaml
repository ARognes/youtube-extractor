, with clothing, we should\n[501.759s] use clothing only to ward off cold and\n[505.12s] heat, not for style or vanity.\n[509.68s] With food, we should use it only to\n[512.159s] support the body and our practice, not\n[515.2s] for fun or entertainment.\n[518.719s] With shelter, we should use it for our\n[522.0s] safety and solitude, not for our luxury.\n[526.64s] And with medicines, we should use them\n[529.2s] only to ward off illness or treat\n[532.399s] illness and not otherwise.\n[535.68s] Now much of this these pieces of advice\n[538.959s] apply more to monastics than to lay\n[542.24s] people. For example, for example, the\n[545.279s] the Buddha encourages lay people to to\n[547.839s] make themselves happy with their wealth.\n[551.279s] Nevertheless, even so,\n[553.92s] lay people can take some insight from\n[556.16s] these practices.\n[559.279s] That is, we should still consider the\n[561.76s] quality of our consumption and not for\n[565.92s] example engage in piling stuff up\n[568.56s] without true purpose.\n[571.6s] This kind of attitude can help blunt our\n[574.08s] ordinary tendency towards greed and\n[576.64s] sense desire.\n[580.32s] In this case, our tool is a simple one,\n[583.68s] patience.\n[585.36s] There are some things that we just have\n[588.08s] to wait out and there''s no point\n[590.24s] flailing about them endlessly.\n[594.56s] The Buddha mentioned such things as\n[597.12s] heat, cold, hunger, and insects.\n[600.88s] In his day, of course, there wasn''t was\n[603.36s] not a whole lot that we could do about\n[605.839s] things like these.\n[608.24s] uh nowadays there''s going to be quite a\n[610.16s] bit more but still even today there''s\n[612.88s] going to be a limit to how much we can\n[614.48s] do.\n[616.0s] The Buddha also mentions illspoken words\n[619.279s] from other people around us that is\n[623.04s] ill-spoken criticism or abuse that we\n[626.16s] can receive.\n[628.399s] The point here is that often it''s better\n[630.48s] simply to endure the abuse patiently\n[634.0s] than to amplify it by responding in\n[637.12s] kind.\n[638.8s] Now, we''ll come to another way to\n[640.72s] respond to such abuse in a moment.\n[644.72s] Finally, the Buddha mentions severe\n[646.959s] pains and once again there is indeed\n[650.8s] quite a bit that we can do about pain\n[652.56s] nowadays. But even so, many of us suffer\n[655.92s] from chronic pains. And then learning\n[659.839s] practices of patience endurance through\n[662.88s] practices like mindfulness-based stress\n[665.44s] reduction or MBSR can be extremely\n[669.2s] helpful.\n[670.959s] The insight here is that our suffering\n[673.92s] comes from resisting unavoidable pains.\n[678.16s] If we can learn to endure such\n[680.72s] sensations patiently, we''re not going to\n[683.6s] be adding to them those second arrows of\n[687.12s] mental reactivity.\n[691.68s] In this case, our tool is one of we\n[694.079s] might say prudence or common sense.\n[697.519s] If there are dangerous situations that\n[699.92s] jeopardi jeopardize our health, our\n[702.56s] practice, our life, then clearly we\n[706.56s] should practice avoiding them.\n[709.76s] This includes physical dangers like wild\n[712.88s] animals or cliffs so on. It also\n[716.24s] includes social dangers like abusive\n[719.44s] people, bad friends, bad social\n[722.56s] situations and so on.\n[725.519s] The lesson in this case is that not\n[728.0s] every battle needs to be fought. It''s\n[731.04s] often truly the wisest thing to walk\n[733.44s] away from situations that are dangerous\n[736.399s] or may condition overwhelming\n[739.279s] defilements in us.\n[743.839s] Here our tool is one key aspect of right\n[747.36s] effort. That is the effort we''re\n[749.76s] supposed to make to abandon\n[752.959s] arisen unh wholesome states. That is, if\n[756.399s] we notice that we''re being beset by\n[758.8s] greedy thoughts of some kind, by\n[761.36s] thoughts of anger, for example, thoughts\n[763.76s] of hatred or cruelty,\n[766.48s] we do what we can to let them go.\n[770.8s] We can try to move our mind onto other\n[773.839s] thoughts. We can try to switch the\n[776.959s] channel that we''re watching.\n[779.279s] We can take time to consider the\n[784.16s] bad consequences of following through\n[786.639s] with any actions we might take under the\n[789.76s] conditioning of these kinds of thoughts.\n[792.48s] Or we might consider spending time\n[795.04s] cultivating a state like kindness or\n[797.519s] meta compassion and so on. And indeed\n[801.12s] that in itself is a large and fruit\n[803.839s] fruitful place of practice.\n[809.519s] This final method unlike the others\n[812.32s] except arguably perhaps the first one is\n[816.0s] intended to get us all the way to\n[818.16s] enlightenment.\n[819.92s] Our tools here are the seven\n[822.48s] enlightenment factors.\n[825.04s] So here again, we''re talking about a\n[827.04s] deep and broad realm of practice,\n[829.76s] something that I''m only just going to\n[831.519s] scratch the surface on here.\n[834.24s] Now, while these previous methods that\n[836.48s] we discussed were mostly intended to be\n[839.12s] kind of defensive stop gaps involving\n[842.24s] such things as restraining ourselves or\n[845.279s] removing unhelpful states.\n[848.16s] Here, we''re going to go on the\n[849.6s] offensive.\n[851.44s] We''re aiming to grow what is beneficial\n[853.519s] in us. Now, these seven factors of\n[856.959s] enlightenment are mindfulness,\n[859.519s] investigation of states, energy, joy,\n[863.839s] tranquility, concentration, and\n[867.12s] equinimity.\n[869.6s] Developing them fully leads nirvana and\n[872.72s] enlightenment.\n[877.12s] In these practices, the Buddha has\n[878.88s] provided us with a complete spectrum\n[882.32s] encompassing the cognitive that is\n[884.88s] seeing, the behavioral that is\n[887.839s] restraining and avoiding,\n[890.32s] the attitudinal that that is to reflect\n[893.68s] upon things and endure them if\n[895.92s] necessary,\n[897.44s] and the meditative that is to cultivate\n[900.0s] or to remove certain things.\n[903.12s] By putting these kinds of things into\n[905.92s] practice, we can begin the process of a\n[908.399s] wearing of wearing away our defilements,\n[912.56s] reducing our craving and our duka and\n[916.16s] moving farther along that path.\n[919.76s] Now, if you want to learn more about the\n[921.6s] last of these practices, that about the\n[924.32s] factors of enlightenment or awakening,\n[927.04s] I''m going to put a video about up about\n[929.04s] here uh in the mo in a moment. There are\n[932.079s] at least a couple of ways of\n[933.519s] understanding how to practice these\n[936.079s] seven factors.\n[938.56s] Meanwhile, let me know which of these\n[940.079s] practices of abandoning have you found\n[942.399s] most useful to yourself recently? Let us\n[945.839s] know in the comments.\n[947.76s] Thanks so much for your continued\n[949.279s] practice and please all of you be"}'
