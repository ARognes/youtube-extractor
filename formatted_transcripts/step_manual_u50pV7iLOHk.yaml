transcript: '{"content":"\n[0.16s] I''ll start by reading a comment from one\n[2.08s] of my supporters on Patreon that I 100%\n[4.72s] agree with. He writes, \"What tools have\n[7.839s] helped me stay grounded and manage my\n[10.4s] emotions?\"\n[12.0s] Something has helped me more than any\n[13.84s] rule or meditative practice, and it''s\n[16.64s] not written in any scripture or featured\n[18.72s] in your videos. Physical exercise.\n[22.64s] I reach my calmst, most compassionate,\n[25.279s] equinimous, and focused states after\n[27.92s] completing intense exercise. I would say\n[30.88s] this functions nearly 80% of the time\n[33.04s] for me, and I''m nearly guaranteed such a\n[35.92s] mental state of peace after intense\n[38.16s] exercise that I seek it almost daily.\n[42.239s] Now, this is a great point, and I''d\n[44.0s] expect many of us feel the same way. Why\n[47.36s] is it that a good cardio session or a\n[50.0s] hard workout with weights sometimes\n[52.64s] feels more like beneficial practice than\n[55.84s] a session seated on the cushion? Is this\n[59.28s] simply some modern life hack? Or is it\n[62.48s] an unrealized part of practice?\n[65.6s] And why don''t the sutas contain a\n[68.159s] chapter on the Buddha''s fitness plan?\n[71.52s] Today, we''re going to explore why\n[72.96s] physical exercise isn''t a distraction\n[75.92s] from dharma practice, but can be a vital\n[79.28s] and perhaps overlooked foundation for\n[81.84s] it.\n[83.6s] We often fall into a trap of thinking\n[85.84s] that Buddhism is just mind training. We\n[89.84s] treat the body like an inconvenient\n[92.0s] additional thing that we have to drag\n[94.4s] onto the meditation cushion.\n[97.04s] But this isn''t really true to the\n[98.64s] Buddhist understanding of mind and body.\n[102.64s] One concept central to an early Buddhist\n[105.759s] understanding is that which is called\n[108.0s] namarupa.\n[109.52s] It''s often translated as name and form\n[112.24s] or mind and body.\n[114.799s] While the exact interpretation of\n[117.52s] namarupa is somewhat obscure and\n[120.24s] contested, what is clear is that these\n[123.84s] two aspects of our person come together\n[126.64s] as a codependent package.\n[130.08s] It''s exponentially more difficult to\n[132.64s] maintain a clear mind in a neglected,\n[136.16s] sick or agitated body.\n[139.04s] Therefore, any practice that brings the\n[141.52s] body, otherwise known in Buddhism as\n[144.64s] rupa or form into a state of balance,\n[148.56s] health, and calm is directly beneficial\n[151.76s] to our mental cultivation as well.\n[155.12s] This isn''t a kind of cheat. Instead,\n[157.84s] it''s skillfully caring for the physical\n[160.48s] basis upon which the mind depends.\n[165.599s] This being the case, why didn''t the\n[167.68s] Buddha prescribe exercise, for example,\n[170.319s] as a ninth aspect of the eight-fold\n[173.2s] path?\n[174.72s] Well, I mean, it''s impossible to say for\n[176.56s] sure, but one thing we should keep in\n[179.04s] mind is that exercise was built into the\n[181.44s] daily lives of the monastics during the\n[184.159s] Buddha''s day.\n[186.239s] That is, the Buddha and his monastics\n[188.56s] were far from sedentary.\n[191.519s] Our modern screenbased lives are the\n[194.64s] historical anomaly.\n[197.12s] In fact, the Buddha required monastics\n[200.0s] to walk often for many, many miles every\n[204.159s] single day in order to go on alms round\n[207.84s] to gain their daily sustenance.\n[211.12s] This was essentially non-negotiable\n[215.28s] moderate intensity cardio built right\n[218.08s] into the monastic code. Well, uh, to be\n[221.2s] clear, it was non-negotiable so long as\n[223.519s] we were well enough. Otherwise, our\n[226.0s] fellow monastics would bring back food\n[228.64s] and share it with us.\n[231.36s] The Zen saying, \"Before Enlightenment,\n[234.319s] chop wood and carry water, after\n[237.04s] enlightenment, chop wood and carry\n[239.2s] water,\" contains a very similar message.\n[243.2s] Traditional monastics in many traditions\n[246.4s] carry out a good deal of manual labor as\n[249.68s] a regular part of their daily routine.\n[253.12s] This is just how people lived back in\n[255.04s] the day. Daily life was physical. It\n[258.639s] provided a natural healthy baseline of\n[261.199s] exertion that we today have largely lost\n[264.88s] touch with.\n[267.04s] Whether or not we are advanced\n[269.12s] practitioners, whether or not we\n[271.68s] ourselves are enlightened, we need to\n[274.72s] chop that wood and carry that water\n[277.04s] every day.\n[279.04s] The Buddha didn''t need to prescribe\n[281.28s] exercise because inactivity was not a\n[284.96s] mass-cale problem back in his day.\n[288.8s] But we need to prescribe exercise today\n[292.16s] precisely because so many of us have\n[295.04s] engineered it out of our lives. Now to\n[298.56s] be clear, if you have not and if your\n[300.8s] job or lifestyle requires physical\n[303.44s] labor, then I''m not talking about you.\n[305.919s] You''re going to know you''re already\n[307.44s] getting what you need. Uh, one example\n[310.639s] is that I see arborists around where I\n[313.919s] live every day climbing trees and\n[316.96s] wrestling with huge branches. And they,\n[320.24s] let me tell you, they''re definitely good\n[321.919s] to go.\n[324.08s] Right effort in Buddhist practice\n[325.68s] involves four separate exertions. I have\n[328.96s] a video on this which I''ll leave down\n[330.8s] below in the notes.\n[332.72s] Among these exertions are the effort to\n[335.44s] abandon unh wholesome states that have\n[338.24s] already arisen in us.\n[341.52s] So for example, when our minds are\n[344.0s] raging storms of anxiety or anger or one\n[347.84s] of the other hindrances to beneficial\n[350.96s] meditation, it often may seem to us that\n[354.0s] sitting quietly is like trying to put\n[356.56s] out a forest fire with a cup of water.\n[360.32s] Now, my supporter mentions intense\n[363.039s] exercise, and that can be the sort of\n[366.16s] effort crucial to overcoming some of\n[368.4s] these hindrances.\n[370.479s] Intense exercise is a gross physical\n[373.36s] tool that can indeed help calm a gross\n[377.84s] mental state.\n[380.319s] It can help us to burn off the excess of\n[383.36s] adrenaline and cortisol that our body\n[385.759s] produces in response to stress, for\n[388.08s] example. Personally,\n[390.4s] I find no exercise is more beneficial\n[393.039s] for this than doing hard cardio or\n[396.08s] squats and deadlifts.\n[398.639s] But literally any exercise can help\n[401.68s] physically metabolize our agitation,\n[404.88s] bringing our body back to a state of\n[406.88s] calm and thus helping our mind to do the\n[409.68s] same.\n[411.44s] This is not like some cheat for\n[413.759s] meditation. Instead, it''s helping us to\n[416.72s] create the most beneficial conditions\n[419.599s] for meditation.\n[422.8s] Indeed, my own earliest experience with\n[425.919s] formalized meditation was back in high\n[428.319s] school where I signed up for an elective\n[430.639s] sports program called Zen Fitness.\n[434.4s] It involved us doing a kind of walking\n[436.88s] meditation, following our steps or our\n[440.16s] breathing, except that instead of\n[442.4s] walking, we would jog around an indoor\n[444.96s] track.\n[446.8s] This showed me how exercise did not\n[450.0s] simply have to be preparation for\n[452.16s] meditation. It could be meditative\n[454.56s] itself.\n[456.4s] We can think of the foundations of\n[458.4s] mindfulness as they relate to such\n[461.12s] exercise.\n[463.199s] Taking a few key examples, we can begin\n[465.599s] with mindfulness of the body. This is\n[468.72s] the most obvious one.\n[471.599s] We feel our feet on the ground as we\n[473.919s] walk, jog, or lift weights. We feel the\n[477.52s] stretch of our muscles, the rhythm of\n[479.599s] our breath. This is pure mindfulness of\n[482.879s] the body.\n[484.8s] When it comes to mindfulness of\n[486.56s] feelings, that is to say, pleasant,\n[489.44s] unpleasant, and neutral feelings, it\n[492.16s] becomes a little maybe a little bit more\n[494.08s] of an advanced practice. Now, we come to\n[496.96s] the point where our lungs are burning\n[498.96s] and our legs are aching. Our mind\n[501.84s] screams to us to stop, but we know that\n[504.16s] we''re not in danger of any injury.\n[507.36s] This is an example of a powerful\n[509.44s] unpleasant feeling.\n[511.84s] The question for us is can we observe\n[514.24s] that feeling and the mind''s arising\n[517.039s] aversion to it without identification.\n[521.12s] Now admittedly this is a as I say a\n[523.2s] higher level insight type practice.\n[527.279s] When it comes to mindfulness of mind we\n[530.399s] can watch our mind states as we exercise\n[534.0s] or even as we contemplate exercising.\n[537.92s] Is our mind telling us I can''t do this\n[540.48s] or I''m not strong enough? Is the ego\n[544.08s] mind, the comparing mind telling us that\n[547.2s] we''re stronger and faster or on the\n[550.16s] other hand weaker and slower than that\n[552.959s] other person exercising over there.\n[557.04s] Just notice that kind of mind state when\n[558.959s] it arises.\n[562.24s] So yes, I think my supporter is 100%\n[564.959s] right. His experience isn''t just valid.\n[568.64s] It''s a profound insight into the\n[570.56s] embodied nature of the path.\n[573.76s] The Buddha often asked us to go to the\n[576.08s] foot of a tree to meditate.\n[579.36s] But in a sense, the tree under which we\n[581.76s] meditate isn''t simply the trunk, roots,\n[585.04s] and leaves. It''s this very body.\n[588.959s] tending to the body through exercise,\n[591.92s] through sleep, through good food,\n[595.279s] through medicine when we need them. And\n[597.839s] vaccines are not simply distractions\n[600.72s] from the path. They constitute the\n[603.519s] foundational, compassionate, and wise\n[606.72s] work of tending to our tree itself so\n[610.8s] that the mind can find a stable home\n[613.519s] beneath it.\n[615.68s] Indeed, in at least one early suta, the\n[618.48s] Buddha lauded the follower who not only\n[621.36s] developed their ethics, their mind, and\n[623.76s] their wisdom, but also developed their\n[626.48s] body.\n[628.16s] This practice of right effort, knowing,\n[631.2s] for example, when to sit and when to get\n[633.839s] up and move around is key to the path.\n[637.92s] If you''d like a deeper dive into how\n[640.48s] effort, energy, and mindfulness work\n[643.04s] together, I''ll link my playlist on the\n[645.839s] four foundations of mindfulness up here\n[647.92s] on the screen in a moment. But for now,\n[650.959s] I''m truly curious what''s what''s your\n[653.2s] relationship to physical exercise and\n[655.92s] how does it interact with your practice?\n[658.8s] Do you find exercise essential? Does it\n[661.92s] sometimes even seem to work better than\n[664.32s] meditation at keeping you grounded and\n[667.2s] managing your emotions like my supporter\n[669.519s] said? Let us know in the comments. And\n[672.8s] if this discussion has helped you to\n[675.04s] reframe your workout as part of your\n[677.92s] practice, a like and subscribe are\n[680.399s] always appreciated.\n[682.56s] Thank you for all you do. And for all of\n[685.12s] you, please be"}'
