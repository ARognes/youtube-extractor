transcript: hi everyone thanks for watching Lori wired and in this video this contains a copy of the talk that I gave at the blue hat 2023 security conference this covers all different aspects of Android malware obfuscation including offensive and defensive obfuscation techniques as well as static and dynamic obfuscation techniques so I hope you enjoy the talk uh I'm Lori Kirk I'm a reverse engineer at Microsoft and I'm going to be talking to you a little about the techniques used if Android obfuscation mainly used in malware so first of all let's go into a little bit of background about what obfuscation is and how it's used in Android malware obfuscation is the technique that's based on the code or anything that the application is doing to try and obscure the underlying functionality from within the application so this is used in many different platforms for example Windows executables Linux Elf binaries or Mac binaries but this is particularly important in Android applications APK files so the reason for this is when developers are creating Android applications they're developing this in very pretty source code that's in Java or kotlin languages so when a reverse engineer is looking at an Android application then you can decompile the code to get almost the original Java source code which is very easy to use so the developers will use obfuscation techniques to try and hide their actual functionality so we talked a little bit about what the background of obfuscation actually is but let's go into some of the techniques used for obfuscation first we have two reasons for obfuscation the first would be defensive techniques this is going to be very legitimate techniques that developers will use to try and protect their source code from reverse Engineers who are trying to examine the code or trying to find any of the underlying sensitive data or they might use this for application optimizations or even performance enhancements so for example if they're taking the variable method or class names in an application they might try to reduce the size of those because if you decompile an application you're actually getting the original developer variable names so by reducing those sizes you're actually reducing the overall size of the entire application final reasons would be uh tamper defense or vulnerability hardening so they're trying to obfuscate the underlying functionality so that if a reverse engineer is taking a look at the code they won't be able to understand the actual code and how it works so therefore they won't be able to develop custom exploits to tamper with the application or exploit it the next motivation for obfuscation is going to be offensive obfuscation and this is going to be the primary focus of the talk today so the goal behind this is for malware developers to try and prevent reverse Engineers from being able to actually examine their application and understand that it's malicious so they are trying to avoid antivirus detection as well for example they might use a technique called packing which I will talk about in a couple slides in order to try and encrypt and compress malicious code so that you're not able to see this code on disk so that if an antivirus isn't emulating or dynamically running the file they will falsely classify this as a clean file because they can't actually locate the malicious code so that ties into the third point of the malware author's goal is to just conceal their malicious code finally they might try to mask the actual origin of the application a good example of this is they could actually name their package name within their application to match a legitimate Library so that a reverse engineer looking at the code might write this off as oh this is legitimate Library code that I shouldn't take a closer look at so now we talked that there are offensive and defensive reasons for Android obfuscation let's go into the actual techniques employed to perform this obfuscation first of all we have some basic static techniques that you'll be able to see on disk if you're decompiling the application the one that I talked about previously was renaming identifiers but instead of just doing this for optimization purposes they might do this to actually try and rename these two misleading variable names or even create junk variable names to try and obscure when a reverse engineer is trying to examine the application they might also do junk code insertions so if they're putting in a lot of additional code then the reverse engineer might not be able to locate what is the actual code that's going to be running and due to the asynchronous asynchronous nature of Android applications this is particularly effective finally they might perform string or class encryption so that any this any of the sensitive data or any of the malicious code is actually encrypted on disk and forces the reverse engineer to use Dynamic analysis techniques so we talked a little bit about the static techniques look let's look at a couple examples here if you look on the top right hand side this is an example of a malware author who created a banking Android application this is a trojanized application that uses identifier renaming you see here they took all of their variable names and they renamed them to a meaningless string of characters followed by a meaningless string of numbers so that when you're taking a look at this it's very frustrating you have to go into every single respective method and rename those identifiers yourself if you can identify the underlying functionality they also used value encryption here so they believe it or not all of these are actually string values but you cannot tell if you're looking at this on disk um they performed a lot of addition subtraction multiplication between the strings to hide those when you're reverse engineering this on disk so those were some simple static obfuscation techniques so let's start looking at some Dynamic ones first of all packing this is used among many different applications and across many different platforms as well not just Android but basically this is taking all of the code of the application and compressing and usually encrypting this on disk and then dynamically loading that code and decrypting it while the application is running or at runtime and loading that into the runtime state uh it's very common for Android malware authors to abuse the application subclasses for this technique uh for some background the application subclass is part of the Android framework so developers can inherit their classes from the application Class part of the Android framework and the reason they'll do this is that this code in this class is actually instantiated first so this is going to be the first thing that runs when you have an application beginning so it is commonly used to decrypt additional classes and Methods at runtime so I talked a little bit about what packing is but there's a lot of confusion related to packing in Android so I wanted to provide three techniques that I like to use for identifying packing in an Android application firstly there will be a discrepancy between the Android manifest which is basically a file that defines all of the permissions components and classes that can run inside of an Android application and there will be a discrepancy between those definitions and the actual classes that you see defined on disk so if you notice that and you can't find the actual definitions of the code it's a very good indicator that this application is actually packed second you'll see the use of a class loader very common ones are Dex class loader path class loader and in memory Dex class loader which are actually dynamically loading additional dolvik executable or Android executable files while the application is running followed finally by a call to a reflective method so right here it would be taking that executable loading it in and finally using a reflective call to actually be able to call those methods in the application runtime so here's an example of an application using packing here this is a bit of the Android manifest remember that defines the permissions and components in an application you can see on the top right hand side we have a class defined here you see that limit system gesture part of the package name and if you look on the left hand side highlighted you'll see a package beginning with the word limit so we can see there's going to be the definition of that code so we can find that on disk now if you look at the bottom right hand side this is defining another class or activity in the Android application beginning with the words carry umbrella Frost however if you look at the package Explorer on the left hand side you don't see anything beginning with the word carry so that means you can't find the definition for this so I would guess here that that application subclass at the top highlighted is going to be decrypting this code and here's an example of the code loading process after it has been defined in the Manifest you can see they're using a generic call to Dex class loader which is actually loading a dynamic APK or Android application Android package into the runtime and then they're following that with the reflective call get method to be able to load a particular method from that dynamically loaded file now we talked a little bit about packing let's look at some native code so when developers are writing Android applications they're going to be developing in Java or kotlin but it is actually possible to write in C or C plus as well in Android we do this by being able to communicate back and forth from java and C plus plus via the Java native interface which you can include into your application code to allow you to go back and forth between managed and native code managed code here would be Java or kotlin languages and then the native code would be C or C plus plus code now this native code is actually compiled to run on a particular processor architecture which means it's going to limit the actual kinds of devices that this code will be able to run on why is this important in malware analysis for Android well if a malware author wants to limit reverse Engineers ability to run the application they might remove support for x86 based architectures since most emulators are going to be running a variant of an x86 architecture and most real Android devices are actually going to be running arm so all they need to do is remove that support and it greatly limits greatly limits our Dynamic analysis process this is also effective for anti-analysis and anti-reverse Engineering since native code is particularly challenging to read since it's actually assembly and not Java [Music] this is an example of a malware author using native code so you can see on the right hand side they're actually declaring a separate method and this will be defined in that dot so file shared object binary on the left hand side so it's defined in a completely separate file it's not defined in the Dex dolphic executable file so if the malware author wanted to limit their platforms all they would need to do is remove those two folders on the left that are supporting x86 and x8664 and they would effectively limit this application to only be running on arm-based architectures here we have a 64-bit and a 32-bit version of arm and this is an example of some actual native C plus code that's going to be compiled to run on a particular processor architecture you can see we have that generic call again to Dex class loader which was loading an additional dolvik or Android executable file and this is taking up multiple lines as you can see and it's actually requiring the arguments and the signature of every single method it needs to call so the signature requires the encoded parameters and return value of the method it's trying to Target which is just a lot harder to read and to take another glance you can see that the Java code we looked at before was a nice pretty one-liner to call this method whereas just calling the Constructor to instantiate this is three lines right here and now finally let's look at our last Dynamic obfuscation technique this is runtime based obfuscation so this actually allows an application to modify its current runtime State while the application is in the process of executing to make different methods execute while it is in its execution process so what an author can do here is they can insert additional malicious code if you're looking at this on disk it appears like those methods are junk and never called that's because the application is actually modifying itself while it's in the process of executing so there are two methods for completing this the first would be to subvert the code loading process so that process the dolvik executable or that Android executable file is going to be mapped into memory and then that memory mapped Dex file is going to be loaded into multiple different runtime objects that basically just store the different code and data related to a particular method in Android or you could alternatively do this postcode loading and actually take those runtime objects and modify their pointers or instructions to run completely separate instructions to look a little closer at these two techniques the first one was happening during the code loading process so taking that memory mapped Dex file and loading those into different runtime objects you could have two techniques for performing this the first would be to find the pointer to the memory map text file and then load an entirely separate Dex file into memory as well and swap those two pointers so you're actually running an entirely separate executable file the other option alternatively would be to edit the code item instructions array if you follow down the class definition object for those you can get a pointer to the instructions and actually modify those instructions in place or copy over separate instructions and finally you can look at the next technique which is going to be taking those already loaded and complete runtime objects and you can find the art method object Android runtime method object so that's one of the methods that's going to be holding all of the methods for a particular Android class find the V table which basically is a giant data structure pointing to all the different methods associated with the class and you could swap the pointers of thatv table or alternatively you could take that object follow all the pointers down to find the instructions array and replace that like we did in the first option if you look on the right hand side there that is an example of the Android kernel source code and that is returning a pointer to that b table or a specific method in that b table that you could then work with to modify so you might be thinking well this sounds like a great technique why doesn't everybody do it primary reasons it creates really brittle brittle breakable complex code so if you know anything about Android Android has a lot of different API versions that are available so basically you have to perform pointer math to find the entry points or the offsets to different objects for every single different API version so you'll have a giant if or switch statement inside of your code that just says is this API version 28 27 and then you'll calculate those pointers accordingly so this is an example of somebody hooking the art method object and trying to do that entry point cooking that we talked about but this is very complicated to read and even more complicated to write so that was our last technique for dynamic obfuscation in conclusion just to remind you obfuscation is the process that a developer either legitimate or malicious might be trying to conceal their code and try and hide their underlying sensitive data from reverse Engineers the static techniques for identifier renaming so naming all your variables methods or classes separate names or inserting junk code that isn't actually called and finally string or class encryption to hide that sensitive data on disk so that it's only revealed during the execution of the application and the dynamic techniques were reflection and packing so that was decrypting and decompressing Dynamic code and loading it into the runtime we also had native code which was writing part or all of your application in C or C plus plus code and then calling that and then finally runtime based obfuscation where an application modifies its own runtime State while it's in the process of executing so thanks so much and I hope you all learned a little bit more about obfuscation [Applause] [Music] [Applause]
