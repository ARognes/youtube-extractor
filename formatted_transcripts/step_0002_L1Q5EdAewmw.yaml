transcript: "Most engineers think their pay reflects their performance. Colin Lernell watched the worst performer on his team earn $120K more than the best, and that one observation changed everything.\n\nNow one of the world's foremost experts in tech salary negotiation, he sits down with Steve Huynh to break down the secret menu that most candidates don't even know exists, why you don't need a competing offer to negotiate, and how to get one of those $2M to $7M AI compensation packages even if you're not an AI expert.\n\n\U0001F4D8 Everything I know about behavioral interviews from conducting nearly 1,000 of them as a Bar Raiser, now in one book: https://geni.us/BehavioralInterview-yt\n\n\nGuest Links: \nhttps://www.toptechnewsletter.com/about\n  / colinlernell  \n\n\nCHAPTERS:\n00:00:00 - Your Pay Has Nothing to Do With Performance\n00:01:34 - The $120K Gap That Started It All\n00:08:05 - There's a Whole Game You Don't Know About\n00:10:19 - How Much Should You Actually Ask For?\n00:28:31 - Knowing When to Stay or Go\n00:36:15 - You Don't Need a Competing Offer\n00:37:09 - How to Generate Leverage Overnight\n00:51:28 - Silver Medal Syndrome\n00:59:53 - Negotiating Beyond the Salary\n01:01:49 - The Startup Equity Trap\n01:18:36 - How to Land a $5M AI Offer Without Being an AI Expert\n01:31:58 - Don't Take Yourself Out of the Running"
