transcript: '{"content":"\n[0.0s] I did an interview with a news outlet.\n[2.2s] And I was telling them how I used to buy\n[4.04s] fried rice by the pound. I would order 2\n[6.96s] lb of fried rice at a time. And then I\n[9.84s] would just eat it like for over a 36 to\n[13.12s] 48-hour period. And so why do I remember\n[16.12s] that? It''s a part of who I am. That\n[18.24s] experience is like part of my identity\n[20.76s] because it''s emotional. I remember like\n[22.88s] what it was like to think to myself,\n[24.8s] \"Okay, well like if I order it now, I''m\n[27.08s] broke. So I can order it in bulk. It''s\n[29.64s] cheap.\" It was $5.95\n[32.24s] for 1 lb. And there was a delivery fee,\n[35.2s] which was waived if I ordered 2 lb and a\n[38.12s] drink. Well, I would spend $14 on a 2-L\n[40.92s] bottle of soda and 2 lb of fried rice.\n[43.84s] And then I remember like realizing how\n[45.92s] terrible that was. I remember the way\n[47.92s] that I felt when I would be eating my\n[49.96s] third serving of fried rice in 24 hours\n[52.76s] and being like, \"Oh god, I feel so\n[54.2s] terrible.\" You know? So that was an\n[55.96s] emotionally relevant experience. So the\n[58.4s] key thing though is that we have these\n[60.28s] experiences and they develop over time.\n[62.8s] So when I''m 3 years old, I have some\n[64.6s] primitive experience, 5 years old, 10\n[66.72s] years old, 12 years old, 15 years old.\n[69.32s] And then through this, I develop a sense\n[71.48s] of identity."}'
