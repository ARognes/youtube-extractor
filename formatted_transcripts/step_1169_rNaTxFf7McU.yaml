er of figuring it out, waiting on it a bit and seeing what we really need from it. - Yeah, last we spoke we had just launched our first major update and here we are about 24 hours away from the launch of our second major update. This one is more like the real thing in a way because now that we''ve done the full cycle once before and having done it a second time I think we''re more finding our groove but there are certainly many aspects of doing it the second time that were different from the first and I wouldn''t be surprised if we like continue to evolve aspects of this process like every single time we do it even though the general gist of it might be similar from one update to the next. - We learned a lot actually from the Chaos update. Like, I think we were pretty happy with just how much stuff we got into the update but we were not necessarily super thrilled with how much it took out of the team to do. In some ways it was like as hard if not harder than just launching the game into Early Access ''cause it was our first time processing thousands of loose notes of feedback. - We made some key changes since our first update, basically like reducing the amount of time for raw new feature work so that there''s more time to polish and iterate on the new features that are there. We release a big update and there''s hopefully a lot of excitement for a couple of weeks and then it''ll kinda simmer down a little bit. Hopefully with these big updates we do get people to come back reengage with the game because we, it''s really important to us ''cause that means we get the feedback that we want so that we can make the next one a good one and around around we go. - So all that''s a work in progress but I think we''re feeling pretty good about where we''re at right now and certainly I think as a team I think there''s like sort of less exhaustion than there was coming out of the Chaos update but, you know, I haven''t talked to everybody (laughs) so we''ll see. (calm music) Yeah so I mean, one of the experimental things we did was obviously come out on a brand new store that launched the very same night that our game launched. - Bringing games to new platforms, certainly for our team, is a significant undertaking, something that we wanna really get right. ♪ At home on Olympus ♪ ♪ Never presuming ♪ - The Underworld is sealed off, what you are attempting is impossible. You''ve seen what happens when you go too far. What are you doing, Zagreus. The Underworld is sealed off, what you are attempting is impossible. You''ve seen what happens when you go too far. (keyboard clicks)'
