transcript: '{"content":"\n[0.4s] I started this channel back in early\n[2.639s] 2017.\n[4.4s] I did it because I looked around at the\n[6.64s] time and saw a country being consumed by\n[9.76s] the three fires of greed, hatred, and\n[12.639s] delusion.\n[14.559s] I wanted to lend some support to help us\n[17.279s] to turn away from that.\n[20.32s] Well, here it is in 2026 and we''re back\n[22.88s] in the fire. In fact, it''s hotter than\n[24.96s] ever.\n[26.48s] I have to be honest with you. When I\n[28.4s] traveled overseas last year, I felt a\n[31.84s] deep sense of shame for our country. I''m\n[35.04s] going to be traveling again this year,\n[36.64s] and I expect to feel it again the same\n[39.36s] way. We''ve let the world down. We''ve let\n[43.28s] ourselves down. We''ve let the most\n[46.16s] vulnerable down.\n[48.719s] But shame is not a strategy. We need to\n[50.96s] do something. We need a practice.\n[54.719s] Recently, John Aaron and I had Ben\n[56.96s] Connelly of the Minnesota Zen Meditation\n[59.6s] Center on our podcast called Digging the\n[62.559s] Dharma. I''ll leave a link to that down\n[64.96s] below. And he uh Ben talked eloquently\n[68.08s] about direct engagement and compassion.\n[71.2s] So, let''s try to go there.\n[76.24s] In Buddhism, all suffering can be felt\n[78.479s] as arising from three fires. Those are\n[81.84s] the fires of greed, hatred, and\n[84.24s] delusion.\n[86.159s] Here''s the hard truth. Right now, our\n[89.439s] leadership is not just subject to these\n[92.0s] fires. It embodies them. We see a\n[96.159s] government supported by the extreme,\n[98.72s] insatiable greed of a wealthy few,\n[102.159s] seeking immunity from taxes and\n[104.079s] regulations at the expense of the rest\n[105.92s] of us.\n[107.759s] We see a leader, a convicted felon and\n[110.88s] adjudicated sex offender who treats\n[113.36s] truth as the enemy. The constant lying\n[117.04s] isn''t accidental. It''s the manufacturing\n[119.84s] of delusion.\n[121.6s] And it''s supported by a vast propaganda\n[124.32s] apparatus owned by those wealthy few.\n[129.119s] To keep this engine running, this\n[131.92s] propaganda machine stokes hatred. It\n[135.52s] tells us that our problems are all\n[137.52s] caused by the weakest among us.\n[140.4s] Immigrants, the poor, the most\n[142.4s] marginalized in our society.\n[145.92s] The poet Robert Frost famously wrote\n[148.319s] that the world could end in two ways, in\n[151.44s] fire or in ice.\n[154.4s] He associated fire with desire and ice\n[158.56s] with hatred. And that''s another way of\n[161.76s] picturing what we''re seeing just now.\n[165.68s] We''re seeing the fire of greed,\n[168.4s] insatiable wealthy interests burning up\n[170.879s] our country for profit.\n[173.519s] We''re also seeing the ice of hatred, the\n[177.68s] cold, calculated machinery of\n[180.08s] deportation, division, and murder\n[183.12s] freezing out the vulnerable.\n[186.159s] This is the environment we live in now.\n[189.599s] So the question then becomes, how do we\n[192.319s] engage with this reality without being\n[195.04s] destroyed ourselves?\n[198.64s] To begin with, we have an obligation. We\n[201.12s] can''t just check out in a democracy,\n[204.56s] however nominal it may feel to us right\n[207.44s] now, all of us, but in particular the\n[210.319s] most privileged among us, have an\n[212.959s] obligation to be informed and to bear\n[215.92s] witness.\n[217.68s] Ignorance of the world is not a Buddhist\n[220.239s] virtue.\n[221.84s] But there is a danger. There''s a fine\n[224.959s] line between being informed and being\n[228.72s] incinerated.\n[231.12s] If we consume more mere propaganda, we\n[234.319s] become deluded ourselves.\n[238.0s] If we obsess over the outrage, we can\n[241.04s] become hatefilled.\n[243.92s] We can also become greedy for easy\n[247.12s] solutions.\n[249.519s] So what we need is a middle path of news\n[252.56s] consumption. And I''m going to suggest\n[255.439s] four practices to help us keep our wits\n[258.639s] about us.\n[261.759s] The first practice is mindfulness of\n[263.919s] exposure.\n[266.08s] In so many parts of life, mindfulness is\n[269.199s] the key. It''s the first step.\n[272.32s] We pause and allow ourselves to become\n[274.24s] aware of the texture of our mind while\n[277.12s] we''re watching the news.\n[280.0s] We notice when information shifts into\n[284.16s] indignation.\n[286.56s] Now, anger is a normal human reaction to\n[289.84s] injustice.\n[291.68s] But when that anger is allowed to curdle\n[294.4s] into obsessive repetitive rumination,\n[298.639s] it''s ceased to be useful fuel to us and\n[301.68s] has started to become sort of more like\n[303.6s] toxic smoke.\n[306.8s] Our second practice is to identify those\n[309.44s] intoxicants.\n[311.759s] The fifth precept of Buddhism is all\n[313.919s] about avoiding those intoxicants that\n[317.039s] cause heedlessness.\n[320.88s] Usually in this regard, we think of\n[322.639s] drunkenness or of drug addiction.\n[325.84s] But let''s be serious. 247 propaganda is\n[329.44s] an extremely powerful and dangerous\n[331.919s] intoxicant.\n[334.0s] In this instance, it''s designed to\n[336.16s] delude us into fear and outrage against\n[339.039s] some other.\n[342.08s] When we''re drunk, where we do things we\n[344.56s] would never do when we''re sober.\n[347.6s] When a nation is drunk on this kind of\n[349.84s] propaganda, it permits things that it\n[353.199s] would never permit if it were seeing\n[355.12s] clearly.\n[358.639s] So ask yourself, is this feed that I''m\n[361.759s] watching making me drunk on rage? Is it\n[365.199s] clouding my ability to see or think\n[367.44s] clearly? If so, try to put that bottle\n[371.039s] down.\n[374.24s] The third practice is the practice of\n[376.479s] guarding the sense doors.\n[378.96s] In early Buddhism, guarding the sense\n[381.36s] doors meant filtering what we allow in\n[383.68s] through our senses.\n[386.4s] This is one antidote to doomcrolling.\n[390.4s] When we have the facts, stop. We don''t\n[394.0s] need to read the 50th hot take on the\n[396.96s] same disaster.\n[399.44s] Physically switch our inputs. turn off\n[402.639s] our screens, go outside, look at a tree,\n[406.56s] remind yourself that the political\n[408.4s] reality isn''t the only reality. So, we\n[411.84s] can spend time settling and recharging.\n[417.199s] And our fourth practice is going to be\n[419.52s] right action.\n[421.84s] This is the most important. Don''t remain\n[425.44s] passive.\n[427.36s] Passive consumption leads to anxiety, to\n[430.88s] loneliness, and to depression.\n[433.599s] Active engagement, on the other hand,\n[435.52s] leads to empowerment.\n[438.16s] Right action, that is nonviolent action\n[441.84s] rooted in peace and compassion, is the\n[445.039s] antidote to despair.\n[448.72s] It''s also the antidote to the politics\n[450.72s] of hatred, that macropolitics that\n[453.84s] infects our nation right now.\n[456.96s] In opposition\n[458.8s] stands the micropolitics of community as\n[462.4s] we''ve seen in Minneapolis recently.\n[465.68s] Do you know your neighbors? Can you help\n[468.72s] out those who are suffering or in need?\n[471.44s] Is there somewhere that you can\n[472.88s] volunteer?\n[474.879s] The propaganda network wants you to feel\n[477.44s] isolated and afraid of the people around\n[479.759s] you, particularly those that might look\n[482.4s] different.\n[484.24s] Defy those networks by connecting.\n[488.08s] Here''s the point. Don''t just volunteer\n[490.24s] in the abstract. Go to a town meeting.\n[493.84s] Find a way to sit in a room with actual\n[495.84s] humans doing something together.\n[499.68s] The internet separates us. Physical\n[503.12s] closeness can connect us.\n[506.639s] And focus on what you can control. We\n[510.08s] can''t control the White House.\n[512.88s] We can help out in our neighborhoods. We\n[516.399s] can promote kindness, compassion, and\n[519.039s] generosity around us. This is the\n[522.88s] message that Ben Connelly had for us\n[525.6s] from Minnesota.\n[529.279s] Yes, this is hard. We We feel anxious.\n[533.04s] We feel afraid. We feel angry. That''s\n[535.12s] that''s the whole point. That''s what all\n[537.36s] this is about.\n[539.279s] But these fires of greed, hatred, and\n[542.08s] delusion do require fuel.\n[546.399s] Though they burn hot, they''ll eventually\n[549.04s] burn out if we don''t keep feeding them.\n[552.64s] It''ll be hard work to rebuild. There''s\n[555.12s] no question about that. But we can start\n[557.839s] by keeping our own minds unclouded,\n[561.12s] our hearts guarded against hatred, and\n[564.64s] our hands busy with helping in so far as\n[567.2s] we can.\n[569.68s] All things change. The spring will come\n[573.279s] again. The president, this\n[575.76s] administration are also all just, as\n[579.6s] they call in Buddhism, formations,\n[581.92s] sankaras.\n[583.76s] Like all such formations, they''re\n[585.839s] unstable and subject to sessation.\n[589.2s] They may feel to us eternal right now,\n[592.0s] but they''re not. So stay strong. Stay\n[595.92s] together with your communities. And all\n[598.32s] of you please be"}'
