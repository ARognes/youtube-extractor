transcript: '{"content":"\n[0.32s] In a live stream a while back on\n[2.48s] Patreon, I discussed a chapter from a\n[5.2s] book of the great Thai meditation master\n[7.919s] Ajan Cha talks.\n[10.88s] In it, he makes a pretty jarring claim.\n[14.24s] He says to state it directly, the Buddha\n[17.68s] said that we should not be born because\n[20.16s] that is suffering.\n[22.72s] Now, this sounds shocking I think to\n[24.96s] many of us. As one of my supporters\n[27.599s] noted during that live stream, this\n[31.279s] claim of Cha John Cha sounds very\n[34.079s] similar to a controversial modern\n[36.96s] philosophy called anti-natalism\n[40.16s] that''s championed by philosopher David\n[42.879s] Benitar.\n[44.64s] Now, Benitar''s argument for this end is\n[47.84s] simple. Coming into existence is always\n[51.2s] a harm because life guarantees pain and\n[55.52s] having no pain is always better than\n[57.84s] having some pain in a way that having no\n[61.52s] pleasure is not always worse than having\n[64.64s] some pleasure.\n[66.56s] Now, I know that that very quick rundown\n[69.92s] of Benitar''s argument may be too quick\n[72.56s] for for many of you, but if you want to\n[75.119s] read more about what he has to say, I''m\n[77.2s] going to leave a link to a paper of his\n[79.6s] down in the notes. Unfortunately, I\n[81.28s] think it''s paywalled, but uh anyway, if\n[83.6s] you do search for him, you can find his\n[86.0s] argument in many places.\n[89.52s] In anyway, from all of this, what it\n[91.92s] follows is that it''s from his argument\n[94.64s] is that it''s always wrong to have\n[96.64s] children. That''s what his belief is.\n[100.0s] The question, therefore, is whether the\n[102.56s] Buddha was an anti-natalist\n[106.0s] in a similar way to Benitar.\n[109.28s] Is the goal of Buddhism simply to wipe\n[112.0s] out life or wipe ourselves out because\n[114.24s] life is not worth it? or is there a\n[117.439s] missing link to the chain or missing\n[119.84s] piece to the puzzle?\n[122.0s] In the next two sections, I''m going to\n[124.0s] elaborate on what another one of my\n[126.24s] Patreon supporters pointed out when we\n[128.64s] were having this discussion.\n[132.4s] Now, if we look only at the first noble\n[134.879s] truth, that is the truth of duka or of\n[138.319s] suffering,\n[139.84s] the Buddha and Benitar seem to be more\n[142.48s] or less on the same page.\n[145.36s] That is the Buddha specifically defined\n[148.879s] birth as suffering.\n[151.52s] He pointed to old age, illness and death\n[154.48s] as unavoidable features of having a\n[157.2s] body.\n[158.879s] Indeed he said that all five aggregates\n[161.84s] subject to clinging that is the parts\n[164.239s] that make us up are themselves\n[167.28s] suffering.\n[169.599s] Similarly, David Benitar argues that\n[172.48s] even the happiest of lives has some\n[175.44s] pain. Since non-existence has zero pain,\n[180.72s] non-existence is therefore technically\n[183.28s] better than existence for Benitar.\n[187.44s] Basically, he says that pleasures do not\n[190.08s] compensate us for pains.\n[193.519s] If that''s what Buddhism is also saying,\n[196.319s] then it looks like a kind of cosmic\n[198.64s] pessimism, even maybe nihilism.\n[203.519s] But here''s the crucial difference.\n[205.92s] Benitar''s argument has similarities with\n[208.64s] the first noble truth, but the Buddha\n[211.92s] went on to discuss three more noble\n[214.4s] truths, and these are the truths that\n[217.28s] lead to liberation.\n[220.159s] Essentially in Buddhist terms, Benitar\n[222.64s] is assuming in his argument that any\n[225.84s] pain is equal to suffering or dooka.\n[230.56s] But as we discussed in a recent video on\n[233.2s] chronic or unavoidable pain, the Buddha\n[236.239s] distinguished between the physical\n[238.56s] sensation of pain and true suffering.\n[243.84s] The latter of which involves a kind of\n[246.08s] mental resistance.\n[249.04s] The third noble truth claims that it''s\n[251.2s] possible to be alive, to experience that\n[255.04s] first arrow of physical pain, and yet\n[258.32s] not to suffer.\n[260.479s] An enlightened being is said to\n[262.16s] experience back pains and perhaps\n[265.12s] toothaches, but they don''t experience\n[267.44s] mental anguish over them. Now, this at\n[271.199s] least potentially breaks Benitar''s\n[274.16s] calculus.\n[275.68s] If existence can be free of suffering\n[279.199s] through the destruction of craving and\n[281.44s] ignorance, then existence isn''t\n[284.32s] inherently a net negative. It''s simply a\n[287.68s] kind of problem that has a solution.\n[293.68s] This brings us to a common\n[295.199s] misunderstanding of the Buddhist dharma.\n[298.32s] People often think that the goal of\n[300.24s] Buddhism is to annihilate the self or to\n[304.0s] cease to exist.\n[306.24s] Indeed, some folks even made that same\n[308.56s] mistake in the Buddha''s own day.\n[311.68s] But the Buddha rejected such a view as\n[313.919s] what he called annihilationism.\n[317.6s] The goal of Buddhist practice is not to\n[320.56s] destroy some kind of solid, enduring,\n[323.759s] unchanging self.\n[326.08s] Such a self isn''t there to begin with.\n[328.72s] So there''s nothing to destroy and\n[330.8s] nothing to be destroyed.\n[333.199s] Instead, the goal is, if we like, to\n[335.919s] destroy craving, to destroy ignorance,\n[339.68s] to destroy greed and hatred.\n[343.199s] We aren''t practicing to end life because\n[345.759s] life is bad. We''re practicing to end the\n[349.039s] craving that, at least in a traditional\n[351.6s] Buddhist understanding, fuels the\n[354.16s] beginningless rounds of rebirth.\n[357.199s] We''re trying to wake up from the dream,\n[359.44s] not to kill the dreamer.\n[364.56s] It''s because we have the capacity to\n[366.72s] understand the dharma, to practice well,\n[369.68s] and to overcome craving that the Buddha\n[372.96s] considered human birth so important.\n[376.8s] It was also precious because because the\n[379.44s] Buddha considered it so vanishingly\n[381.919s] unlikely\n[383.68s] as he said\n[385.759s] mendicants suppose the earth was\n[387.84s] entirely covered with water and a person\n[391.199s] threw a yoke with a single hole in into\n[393.919s] it and there was a oneeyed turtle who\n[396.72s] popped up once every hundred years.\n[400.639s] What do you think mendicants? Would that\n[402.72s] oneeyed turtle popping up once every\n[405.36s] hundred years still poke its neck\n[408.0s] through the hole in the yolk?\n[410.479s] It''s unlikely, sir. That''s how unlikely\n[413.759s] it is to get reborn as a human being.\n[418.24s] Now, ideally, we would not be reborn\n[420.72s] again somewhere afterwards since that\n[423.599s] would mean we hadn''t really reached the\n[425.36s] goal of our practice.\n[427.68s] But now that we are born, this life is\n[430.4s] not a mistake. Indeed, instead it''s a\n[432.72s] unique opportunity that we should make\n[435.28s] use of. Now, to be clear, traditionally,\n[438.96s] the Buddha''s view involves literal\n[441.52s] rebirth, which Benitar''s view doesn''t.\n[445.28s] So, we''re we are indeed kind of\n[447.44s] comparing apples to oranges here.\n[450.319s] Nevertheless, the central point I''m\n[452.0s] trying to make stands.\n[454.08s] If physical pain which is unavoidable\n[456.96s] is distinct from true suffering which is\n[460.0s] avoidable\n[461.759s] and that is to say if we can reduce or\n[464.08s] even potentially eliminate suffering\n[466.4s] entirely from human life then our\n[469.68s] message is a positive one not nihilistic\n[472.72s] at all but it does involve practice.\n[478.08s] So in conclusion to return to the quote\n[481.44s] we began with a John Cha was right.\n[485.12s] Birth is suffering in the sense that\n[487.84s] we''re born with the minds of craving and\n[490.08s] ignorance that recoil from our ordinary\n[493.52s] conditions of change and decay.\n[497.599s] But Benitar is wrong to think that\n[500.0s] therefore human life is a net loss.\n[503.599s] We aren''t so much victims of a cruel\n[505.919s] universe as beings with the capacity to\n[509.199s] truly understand and thereby transform\n[512.479s] our relationship to that universe.\n[516.479s] Now, understanding the mechanism of this\n[518.64s] whole process involves understanding the\n[521.279s] link between what the Buddha calls\n[523.36s] craving and birth.\n[526.88s] And that is the topic of an earlier\n[528.88s] video of mine on what I called the\n[531.04s] dissatisfaction engine which I''m going\n[533.279s] to put here up here on the screen in a\n[535.2s] moment.\n[536.8s] Meanwhile, what are your thoughts on a\n[539.6s] John Cha''s surprising claim and on David\n[543.12s] Benitar''s idea that we should not bring\n[546.16s] new beings into life in a universe that\n[549.68s] involves pain? I''d be interested to\n[552.24s] know. Thanks so much for your continued\n[555.12s] practice and please all of you be"}'
