transcript: '{"content":"\n[0.0s] So, if you''ve ever been a part of a\n[1.04s] friend group, where two people start\n[2.64s] dating, a key element to them starting\n[5.44s] to date is peeling off from the group,\n[7.84s] right? So, I had a friend that I used to\n[9.32s] play video games with, still play some\n[10.72s] video games with. It was clear to us\n[13.04s] that he was into this girl. And so, one\n[14.96s] of the things that started to happen is\n[16.24s] when she was not playing with us, he\n[18.0s] would drop us and go play something else\n[20.56s] with her. There was a dyadic separation.\n[22.68s] And then sometimes we''d all queue\n[23.76s] together. So, they peel off and they go\n[26.28s] on their own and they spend some quality\n[28.04s] time together. When I was dating my my\n[30.08s] wife, we would also peel off. And\n[32.08s] someone took a picture of us at summer\n[34.12s] camp and then put it on the main screen\n[35.92s] when we walked in after sitting at a\n[37.8s] picnic table just talking to each other.\n[39.24s] We walk in and everyone goes, \"Ooh.\"\n[41.56s] I thought we were friends. I still think\n[43.92s] we were just friends at that point. But,\n[45.36s] there is a dyadic separation. So, if\n[47.24s] you''re interested in transitioning, one\n[48.96s] of the key things to do is to try to\n[50.36s] peel this person off and do some quality\n[52.72s] one-on-one time. So, invite the person\n[54.72s] out. Hey, do you want to like after\n[56.08s] we''re done with the party, do you want\n[57.32s] to go grab a nightcap? Hey, we''re all\n[59.48s] meeting for lunch, do you want to go for\n[60.92s] a jog before? So, intentionally create\n[63.64s] some one-on-one time for you to foster a\n[66.16s] relationship."}'
