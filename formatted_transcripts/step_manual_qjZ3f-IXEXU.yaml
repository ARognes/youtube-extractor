transcript: '{"content":"\n[6.66s] Покланяне на нарцисисти.\nqualiasoup & theramintrees\n[13.176s] \"Абсурдно е да се вярва, че Божество притежава човешки страсти\n[16.929s] и една от най-низшите човешки страсти която притежава\n[19.951s] е неуморната жажда за похвала.\n[22.067s] Непоследователността е в това да се вярва\n[24.463s] че след като Божеството притежава тази човешка страст\n[26.929s] то не може да притежава и друга като:\n[29.066s] презрение към мненията от същества, толкова по-нисши.\"\n  —Дейвид Хюм\n[33.554s] [— Туморът, който отстранихме, се оказа злокачествен. Трябва незабавно да започнете лечението.]\n[37.35s] [— Аз съм просто шокиран ... Не разбирам защо? Защо аз?!]\n[40.137s] [— Лили. Не се отчайвай. Все пак това е моят рак.]\n[44.3s] Израствайки, в ранните ни години\n[46.34s] срещнахме две удивително сходни авторитетни фигури.\n[49.55s] И двете фигури бяха представени като „любещи“.\n[52.343s] Но това беше странен вид любов—\n[54.26s] ревнива, противоречива, властна, отмъстителна, разделяща.\n[60.524s] И двете поставиха капани,\n[62.1s] за да тестват хората, които уж обичат\n[64.2s] представяйки техните жертви с невъзможните\n[66.54s] —губиш ако го направиш— и —губиш ако не го направиш— избори.\n[69.76s] Тази любов може незабавно да се изпари\n[72.0s] в отговор на най-малката проява на независимост.\n[75.54s] И двете фигури бяха представени като „непорочни“.\n[78.52s] Те имаха перфектен морал, праведност и бяха недостъпни за критика.\n[83.04s] Ако действията им причиняваха унищожение, вреда, дори смърт,\n[87.08s] вината се приписваше на другите.\n[89.74s] Ако поведението им изглежда противоречиво, лицемерно или просто жестоко\n[95.44s] това беше, защото бяхме твърде млади и неопитни\n[98.42s] за да разберем превъзходния им морал.\n[101.52s] И двете фигури бяха представени като „всезнаещи“.\n[104.66s] Постоянно ни казваха, че познават ума ни по-добре от нас самите\n[109.34s] което предизвика дълбоко объркване, защото те толкова често грешиха.\n[113.16s] Бяхме обвинени в престъпления, които никога не сме извършили.;\n[116.28s] мисли, които никога не бихме си помисляли\n[118.38s] личностни качества, които нямаме.\n[121.28s] Кои бяха тези две фигури?\n[123.56s] Едната беше Родител. Втората беше Бог.\n[126.94s] И двете са нарцисисти.\n[129.82s] Това е разстройство, което се наблюдава в различни ситуации\n[132.52s] от насилствените отношения между двама души,\n[134.77s] до изкривяващи-реалността политически, религиозни и социални групи.\n[138.94s] Твърде често това разстройство остава незабелязано.\n[142.12s] Понякога се подценява като безобидна индивидуална характеристика.\n[146.52s] Понякога нарцисистът има защитена авторитетна позиция,\n[150.227s] която му позволява да избегне наказание за нанасяне на вреда, което обикновено не бихме толерирали.\n[154.66s] Понякога имаме работа с така наречения нарцисист на общността,\n[157.95s] който се преструва, че е голям хуманист в Общността,\n[162.02s] но зад затворени врати създава насилие.\n[165.16s] Нарцисизмът е важен фактор в религиозното и домашното насилие,\n[169.38s] и осъзнаването на неговите отличителни симптоми нараства.\n[173.9s] Терминът „нарцисист“ произхожда от историята за Нарцис\n[178.06s] който е представен в \"Метаморфозите\" на Овидий\n[180.34s] като той бил широко желан заради красотата си.\n[183.12s] Млада нимфа, наречена Ехо, се влюбила в него\n[186.54s] но той я отхвърлил и тя избледняла\n[189.27s] докато от нея остана само гласът й,\n[191.56s] който глас можел само да повтаря това, което и другите хора казвали.\n[195.08s] Немезида, богинята на справедливостта и отмъщението\n[198.28s] прокълнала Нарцис, с непостижима любов.\n[201.56s] Той се влюбил в собственото си отражение в езеро\n[204.9s] и, обсебен от този образ, бавно избледнял\n[208.88s] и бил заменен с цвете.\n[211.3s] Терапевтът Джоан Лачкар описва нарцисистите като\n[215.28s] \"хора, които се нуждаят от перфектно отражение\"\n[218.02s] „перфектно одобрение, перфектни отговори“;\n[221.009s] които \"имат идеализирани фантазии и фантазии за всемогъщество\"\n[224.36s] И \"търсят от други хора потвърждение и подкрепа на техните фантазии за техните преувеличени права и че светът трябва да им бъде дълбоко благодарен.\"\n[233.7s] Въпреки че Нарцис бил запленен от физическото си отражение\n[237.34s] нарцисистите като цяло избягват личният критичен самоанализ.\n[241.28s] Критичният самоанализ влиза в конфликт с грандиозната им представа за себе си\n[245.68s] и поемане на отговорност за техните грешки\n[248.08s] и прегрешения са непоносими за тях\n[250.56s] което води до странно прехвърляне на вината върху другите.\n[254.38s] Заради техния комплекс за превъзходство\n[256.62s] те лесно се обиждат от получените критики\n[259.279s] и се вбесяват, когато не получат\n[261.459s] прекомерното уважение или обожание, за което копнеят.\n[264.949s] Те са контролиращи и гневно ревниви\n[267.91s] когато другите получат вниманието, което те търсят за себе си.\n[270.78s] Те очакват другите да се грижат само и единствено за тях\n[273.96s] и пренебрегват нуждите на хората.\n[276.66s] Нуждите на нарцисиста засенчват всичко и всички останали.\n[281.04s] Други хора са просто пешки в грандиозния план на нарцисиста.\n[285.74s] Комбинацията от нестабилна самонадеяност\n[288.639s] липсата на съпричастност и страшната решимост да получат това, което искат\n[292.68s] води до непредсказуемо, капризно поведение.\n[295.98s] Злокачествените нарцисисти ще нанесат безпричинно страдание\n[299.36s] върху други за собственото им удовлетворение.\n[302.42s] Ще разгледаме тази патология(болест).\n[304.96s] Неизбежно ли са Боговете нарцистични?\n[308.04s] Как жертвите биват манипулирани?\n[311.02s] Докъде се разпространява отровата на нарцисиста?\n[314.72s] И как да се измъкнем от това?\n[319.882s] Ще умра, преди да ти дам, власт над мен!\n[323.071s] Давам ти власт над мен.\n[327.62s] Дори ако Еврейският Танах, Християнската Библия\n[330.749s] и Ислямският Коран не бяха запълнени\n[333.52s] с илюстрации на всички нарцистични черти\n[336.42s] нарцисизмът е в основата на всички тези\n[339.58s] Божи понятия по две причини—\n[342.68s] първо, тяхната монотеистична природа\n[345.74s] второ, прекомерната ревност на техните човешки създатели за справедливост.\n[350.92s] Философът Лудвиг Фойербах през 1800-те години\n[354.5s] изтъкнал, че монотеизмът(един-бог) създава особен проблем.\n[357.92s] Докато политеизмът(много-богове) дава място за добри и зли богове\n[361.49s] монотеизмът е принуден да комбинира доброто и злото в едно същество\n[365.409s] създавайки Бог с противоречиви атрибути.\n[369.32s] Фойербах отбелязва, че хората, които са убедени,\n[371.539s] че всичко трябва да им служи само за добро\n[374.199s] и че не трябва и не може да бъде зло,\n[376.327s] попадат във вселена, която не отговаря на тези егоистични вярвания и им носи всякакви страдания.\n[383.14s] Това е класическият проблем на злото.\n[385.82s] Пишейки през 1700-те, философът Дейвид Хюм\n[389.24s] обобщил проблема:\n[390.84s] \"Монотеистичният Бог иска да предотврати злото, но не може?\"\n[394.86s] \"Тогава не е всемогъщ.\"\n[396.42s] \"Може, но не иска?\"\n[398.66s] \"Тогава е зъл.\"\n[400.6s] \"Дали е способен и склонен?\"\n[402.88s] \"Тогава откъде идва злото?\"\n[405.2s] Всички тези твърдения предполагат че въпросния\n[406.9s] Бог е наясно със страданието ни.\n[409.5s] Неосъзнат Бог може да се счита за невинен.\n[412.461s] Но тези, които приемат, че Бог се намесва, са наясно с човешкото страдание и не могат да претендират за свято невежество.\n[419.22s] Така че отново се връщаме към безсилие, злонамереност или бездушие.\n[424.3s] Фейербах пише, че за да запази добрия и светъл образ на своя Бог, някои теисти(вярващи) обявяват човешкото страдание за наказания за прегрешения.\n[433.34s] Разрушителни аспекти на естествената вселена\n[435.86s] са обявяват като изрази на божествен праведен гняв.\n[440.32s] Справедливостта неправилно се приписва на вселена, която няма вродена справедливост.\n[446.22s] Това дълбоко изкривяване на реалността създава\n[449.58s] основна характеристика на нарцисизма — капризност.\n[453.722s] В статията си \"Божественият нарцисизъм и възпитателният стил на Яхве\",\n[458.243s] Стюарт Ласин отбелязва, че насилниците използват капризност\n[461.48s] като инструмент за налагане на господство.\n[463.98s] Като не следват поставените правила\n[466.16s] хората нарцисисти поставят жертвите си във вечно объркано състояние\n[470.489s] и оставят жертвите да се чудят какво следва.\n[472.58s] По същия начин, божествен нарцисист, който причинява безразборно страдание\n[476.58s] поставя хората в непрекъснато объркване.\n[479.1s] Той също води до спекулации за мотивите на наказанията, когато хората твърдят защо добрите хора страдат.\n[486.497s] Една спекулация за мотивите на наказанията се нарича \"страдание за няколко\".\n[490.66s] В тази игра, вселената наказва добри хора\n[493.52s] за неуспех да осъдят лоши хора.\n[495.814s] Например, природните бедствия са обяснени че са се случили\n[498.893s] заради приемането на гей хората.\n[501.08s] Тези спекулации обезчовечават отделните групи\n[504.06s] превръщайки ги в изкупителни жертви.\n[506.34s] В друга спекулация, наречена „Роден погрешно“\n[509.64s] Вселената наказва добри хора\n[511.83s] защото всъщност не са добри.\n[514.849s] Твърди се, че всички сме родени порочни\n[517.76s] и трябва да превъзмогнем нашата развалена природа.\n[521.559s] Тук, всеки е обезчовечен и отворен за наказание\n[525.96s] понякога самонаказание.\n[528.6s] Колкото и да е странно, неспособността на монотеизма да обясни защо безброй добри хора страдат, довежда до още повече страдания за добрите хора.\n[537.797s] Не само, че не решава проблема със злото,\n[540.249s] тези спекулации за мотивите за наказание само добавят повече зло,\n[544.067s] връщайки ни при божество, което е неспособно или не желае да предотврати това зло.\n[549.396s] За да избегнат проблема със злото\n[551.36s] някои Монотеисти дори са се опитвали да внедрят Политеистични концепции.\n[555.7s] В Християнството, Сатаната е въведен като Бог на сянката\n[560.12s] поемайки разрушителния аспект на Вселената\n[562.63s] за да се установи главният Бог Яхве като \"доброто ченге\".\n[566.321s] Свидетелите на Йехова дори гледат на Сатаната\n[568.86s] като владетел на този свят.\n[571.1s] Но това само измества проблема с злото назад\n[574.66s] давайки ни божество, което е наясно със злото на Сатаната\n[577.68s] но или неспособно или не желаещо да го предотврати.\n[581.664s] Когато хората проектират, своето желание за справедливост\n[584.66s] върху несправедлива вселена чрез измислянето на\n[587.42s] един, всезнаещ, всемогъщ, намесващ се Бог\n[592.38s] пътеките отново и отново водят обратно към територията на нарцисиста\n[596.604s] и към разделението и страданието.\n[599.696s] Създаване на условия за драма.\n[602.55s] Имаш възможности, за които никога не съм мечтал!\n[605.602s] Няма да ти позволя да ги похабиш!\n[609.6s] Романът на Лев Толстой „Ана Каренина“ започва със реда:\n[613.02s] Щастливите семейства си приличат\n[615.04s] но всяко нещастно семейство е нещастно по свой си начин.\n[618.62s] Но нещастието, което заобикаля нарцисистите\n[621.06s] следва много отличителен модел.\n[623.22s] При сравняване на техния опит с нарцисистите, много хора отбелязват, че е като че ли всички техни насилници четат една и съща инструкция.\n[630.16s] Това е така, защото имаме работа с подобен начин на мислене\n[633.04s] мисленето на маниакално дете, решено да получи това, което иска\n[637.12s] с всички примитивни детски тактики.\n[639.708s] Подобно на деца, хора и божествени нарцисисти показват\n[643.24s] силно черно-бяло мислене.\n[645.64s] Хората са идеализирани или демонизирани.\n[648.56s] В семействата потомството обикновено се разделя\n[651.22s] в предпочитаното \"златно дете\"\n[653.46s] и презряната \"изкупителна жертва\", която получава цялата вина\n[656.66s] предизвиквайки дълбоки разделения.\n[659.04s] В Библията божественият нарцисист Яхве\n[662.02s] има много златни деца и изкупителни жертви.\n[664.58s] Той предоставя на Гедеон изключително привилегировано отношение\n[667.68s] избирайки го да води Израелската армия и да победи Мидианите\n[671.24s] въпреки че Гедеон многократно нарушава божествените правила (Второзаконие 6:16),\n[674.069s] молейки се на Яхве, да предостави чудотворни доказателства.\n[677.08s] Бащата на Гедеон се покланя на Ваал\n[679.9s] — което е грях срещу ревнивия Яхве —\n[682.04s] и ни се казва, че децата ще бъдат наказани за богохулството на родителите си (Изход 20:5).\n[686.0s] Но Гедеон не само избягва всяко наказание\n[688.56s] той е избран за любимец на Яхве.\n[691.649s] Златните деца не са имунизирани срещу злоупотреби.\n[694.34s] Първоначално Йов е благословен за това, че е верен слуга на Яхве.\n[698.62s] Но тогава Яхве се съгласява да остави Сатаната безмилостно да атакува Йов\n[702.82s] унищожавайки всичко, което цени, убивайки десетте си деца\n[706.56s] само за да видя дали това ще провокира Йов да прокълне Яхве.\n[710.06s] В края на историята ни се казва, че Яхве възстановява богатствата на Йов\n[714.0s] давайки му още десет деца, които да заменят убитите.\n[717.42s] Това е смразяващ, психопатичен възглед за възстановяване.\n[721.2s] Хората не са заменяеми обекти.\n[723.079s] Но точно така ни вижда злокачествен нарцисист с черно-бяло мислене,\n[727.6s] което може бързо да превърне златните деца в изкупителни жертви и обратно.\n[732.64s] Черно-бялото мислене е в основата на двоичната система на Ада и Рая.\n[737.022s] Представете си човешка правна система, където всичко\n[739.54s] от геноцид до кражба на плодове е наказвано с доживотна присъда.\n[744.72s] Кой не би могъл да види абсурда на такава система?\n[747.92s] Но милиони хора защитават още по-абсурдната система\n[751.0s] която не само удължава доживотната присъда до вечността\n[754.88s] но добавя мислепрестъплението, придавайки на мисълта същата тежест като извършването на нещо лошо.\n[760.28s] Някои застъпници за Яхве заявяват\n[762.089s] че тъй като той се разглежда като безкрайно същество\n[764.3s] тогава и прегрешенията срещу него стават безкрайни прегрешения,\n[767.632s] заслужаващи безкрайно наказание.\n[769.88s] Това разсъждение отива в напълно погрешна посока.\n[773.42s] Кражбата на ябълка от човек, който е имал само 1 ябълка, има много по-силно въздействие, отколкото кражбата на ябълка от човек, който има 50 овошки.\n[781.44s] Ако при присъдата вземем предвид вредите, нанесени на засегнатата страна, тогава виждаме обратната зависимост.\n[788.229s] Колкото по-голяма е пострадалата страна, толкова по-малко е въздействието по-малка е и присъдата.\n[793.6s] Когато пострадалата страна стига до безкрайност\n[795.96s] присъдата не стига до безкрайност\n[798.02s] —а се доближава до нула.\n[800.36s] Маниакалното дете се занимава само с това да получи това, което иска.\n[804.68s] Да играе честно, за него няма смисъл.\n[806.76s] Нарцисистът играе мръсно, играейки на психологически игри\n[810.79s] като поеме драматичните роли на преследвач или жертва\n[814.709s] за да приведе жертвите си в подчинение.\n[817.94s] И двете роли са злонамерени и използват емоционално изнудване\n[821.387s] за да предизвикат страх, задължение, вина и съчувствие.\n[825.02s] Тези стратегии са ясно приложени в Християнската Библия.\n[828.78s] В Стария Завет Яхве(Господ) е в режим на пълен преследвач\n[832.68s] осъждайки цялото човечество за кражба на парче плод\n[835.839s] извършвайки геноцид след геноцид\n[838.06s] и многократно заявява желанието си да се страхуват от него.\n[841.76s] В Новия Завет Яхве преминава в режим на жертва\n[845.39s] изигравайки пресилено театрално представление\n[847.75s] в което той жертва себе си на себе си.\n[851.76s] Но каква беше истинската причина за тази така наречена жертва?\n[855.509s] Яхве измислил магическа система\n[857.64s] която изисква кръв, за да изкупва греховете.\n[860.26s] За да се почете неговата кръвна магия\n[862.231s] Яхве заповяда на хората да извършват жертвоприношения на животни.\n[866.12s] След това той решил да прекрати тази практика.\n[868.52s] Но според измислените от него правила все още трябваше да се пролее кръв.\n[872.42s] Яхве можел просто да избере да промени тези правила.\n[875.78s] Той променил всякакви видове правила, за да угоди на себе си.\n[878.821s] Но той свободно избирал акт на самозапалване\n[882.8s] и той го прави по най-манипулативния, мелодраматичен начин:\n[886.36s] накарвайки хората да го убият.\n[888.329s] Ако той настоя да пролее собствената си кръв\n[891.05s] той би могъл да го направи насаме без никакви аплодисменти.\n[894.35s] Или вместо да бъде жертван в човешка форма\n[897.24s] можеше да се роди като жертвен козел или прасе\n[899.961s] —достойна жертва, като се имат предвид всички животни\n[903.16s] които са били излишно избити в негово име.\n[905.34s] Но тогава нямаше да има драма\n[907.4s] — и драмата е кислород за нарцисиста.\n[911.16s] Това не беше истинска саможертва.\n[913.565s] Просто егоистична театралност, създадена да внушава фалшиво чувство за вина на хората, за да отклони вниманието от грешките на Яхве.\n[921.38s] За съжаление жертвите на нарцисисти често свършват\n[924.3s] с чувството, че те са онези които са виновни.\n[927.14s] В историята на Йов, кой се извини?\n[930.38s] Беше ли Яхве, който имаше пръст в мъките на Йов\n[933.706s] само за да задоволи собствената си суета?\n[935.98s] Или Йов, който страдаше от мъчението?\n[939.18s] Нарцисистите рядко се извиняват.\n[941.4s] Ако бъдат притиснати, те могат да дадат уклончиви извинения\n[945.009s] — или „fauxpologies(фалшиви извинения)“ — да използват дистанциращ или условен език\n[949.28s] или да твърдят, че и двете страни са еднакво виновни.\n[953.06s] Различните ситуации изискват различни лични граници.\n[956.1s] След увреждане на една връзка, е нормално да има\n[958.98s] период на отдалеченост за размисъл върху случилото се.\n[961.893s] Но когато нарцисистите извършват извинение\n[964.68s] очакват незабавна прошка и ако не им се даде\n[967.899s] злоупотребата скоро може да започне отново\n[969.949s] показвайки колко безсмислено е било извинението.\n[972.96s] Границите са толкова чужди на нарцистичните богове\n[976.14s] те дават божествена прошка от името на всички останали.\n[979.699s] Когато посещавахме църква като деца\n[981.74s] забелязахме как свещениците рутинно предаваха божествената прошка\n[985.62s] на хора, които никога не са я търсили от хората с които са злоупотребявали.\n[989.286s] Никой не може да ни освободи от нашите престъпления спрямо други хора.\n[993.66s] Прошката идва — или не идва — от пострадалата страна.\n[998.12s] Границите ясно показват какво ще приемем и какво не\n[1001.66s] и те са решаващи във всяка връзка.\n[1004.64s] Нарцисистите мразят границите.\n[1007.64s] жертвите се разглеждат като притежания без собствена идентичност.\n[1011.503s] Нарцистичните любовници очакват партньорите да приемат техните предпочитания.\n[1015.56s] Нарцистичните родители се чувстват в правото си да избират, партньорите и кариерата на техните потомци.\n[1020.94s] Нарцистичните богове дори нарушават ��ичния живот на нашия ум\n[1024.72s] наблюдавайки и наказвайки мислите ни.\n[1027.52s] Когато жертвите започват да установяват основни граници\n[1030.74s] нарцисистът реагира с ярост и наказание.\n[1034.04s] Когато невярващите установят разумната граница\n[1036.756s] на независима мисъл, те са отлъчвани, осъждани\n[1039.689s] и заплашвани с вечни мъчения.\n[1042.339s] Но когато жертвата определя крайната граница\n[1045.5s] и изчезва завинаги, тогава драмата може да ескалира\n[1048.78s] и даже да стане смъртоносна.\n[1050.74s] За нарцисистите тоталното отхвърляне е най-лошото престъпление от всички\n[1055.34s] Виждаме го при човешки нарцисисти, които безмилостно преследват бивши любовници.\n[1060.08s] И го виждаме при божествените нарцисисти.\n[1062.46s] Специална неприязън е запазена за вероотстъпници\n[1065.14s] като бивши Мюсюлмани и бивши Католици\n[1067.54s] които са обявени за \"престъпно невежи\".\n[1070.002s] Невярващи, които никога не са чували посланието\n[1072.231s] се считат за непорочни и потенциално спасяеми.\n[1075.4s] Но бившите Мюсюлмани и бивши Католици чули предполагаемото истинско послание на техните религии и упорито го отхвърлили и вече не могат да бъдат спасени.\n[1084.424s] Бившите Мюсюлмани продължават да бъдат отлъчвани, тормозени\n[1087.8s] затваряни и убивани за отхвърляне на нарцистичния Бог на Исляма.\n[1093.17s] Във всички сфери на живота има нарцисисти.\n[1095.84s] Но най-трудно е да се справиш с тях, когато заемат защитено социално положение.\n[1100.12s] Магическото мислене не се отнася само за свръхестествените същества.\n[1103.56s] Темата за семействата провокира всякакви магически идеи\n[1106.8s] за морален дълг, присъща стойност и незаменяемост\n[1110.68s] които служат за защита на нарцисистите в семейството\n[1113.31s] които играят със дълбоките социални табута, свързани със семейния конфликт\n[1117.2s] за да задържат злоупотребите, скрити от чужди очи.\n[1119.58s] Насилствените семейства могат да действат като култове —\n[1122.58s] затворени системи без външно обжалване.\n[1125.78s] Казват, че кръвта е по-плътна от водата.\n[1128.68s] И за много семейно ориентирани хора\n[1130.77s] които са се радвали на истински здрави, поддържащи отношения\n[1134.22s] може да е тревожно да чуят, когато някой поставя тези ценности под въпрос.\n[1138.16s] Но за много семейства, където има нарцистична злоупотреба\n[1141.18s] кръвта е просто по-мръсна от водата.\n[1143.816s] Магическото мислене се простира и върху други фигури\n[1146.58s] които безгрижно се третират като сурогатни родители.\n[1149.92s] Терапевти. Равини, Свещеници и Имами.\n[1153.52s] Президенти и Премиери. Кралски особи.\n[1156.96s] Предполагаме, че се грижат за нашите интереси.\n[1159.618s] Когато се оказва, че те просто се грижат за собствените си интереси\n[1162.82s] за наша сметка, магическото ни мислене може да ни постави в състояние на отричане на реалността.\n[1167.9s] Боговете са най-висшите родителски фигури.\n[1170.38s] А теистичните религии привличат много човешки нарцисисти\n[1173.52s] които не изпитват срам да твърдят, че говорят от името на своя Бог.\n[1177.54s] Мощното магическо мислене, което заобикаля боговете\n[1180.76s] защитава тези религиозни нарцисисти\n[1182.97s] които използват защитеното си положение, за да станат център на поклонение самите те.\n[1187.82s] По темата за поклонението\n[1189.76s] Древногръцкият философ Ксенофан славно критикува\n[1193.42s] човешката склонност за приписване на боговете с човешки черти и желания\n[1197.64s] особено човешки недостатъци.\n[1199.64s] Необходимостта да се почитат е един такъв човешки недостатък.\n[1202.46s] И това е самоубиващ се недостатък.\n[1204.78s] Самият акт на изискване на поклонение разкрива дълбока неадекватност\n[1209.64s] потвърждавайки не-достойността на индивида.\n[1213.08s] Важно е да разпознаете поклонението за това, което е:\n[1216.42s] то е отговор на заплаха.\n[1218.06s] Пред опасност инстинктивно реагираме по един от няколко начина.\n[1222.18s] Ние се борим; бягаме; замръзваме.\n[1225.94s] Друга стратегия е да се подмазваме —\n[1228.32s] да се подчиняваме, да молим, да хвалим, да се покланяме.\n[1233.34s] Някои твърдят, че поклонението е свободен израз на обожанието.\n[1236.609s] Но трябва само да гледате заплахите и атаките\n[1239.29s] насочени към онези от нас, които отказват да се покланят на всякакви богове\n[1241.88s] за да разпознаете скритата принуда.\n[1244.66s] Ако това беше свободно изразяване, никой нямаше да ни притеснява.\n[1249.08s] Нещата стават от лоши към странни, когато се спрем\n[1251.864s] на нарцисистката тактика на \"газова светлина\".\n[1254.54s] Концепцията за „газова светлина“ произхожда от пиеса от 1938 година\n[1257.94s] от Патрик Хамилтън, адаптиран към блестящия филм от 1940 г. „Газова светлина“\n[1262.74s] в който съпруг се опитва да убеди ��ена си, че полудява.\n[1266.1s] Това, което тя не знае, е, че съпругът й е убиец\n[1269.26s] който всяка вечер тайно търси бижута\n[1271.64s] които според него са скрити над апартамента.\n[1274.1s] Винаги, когато запали газовата светлина над апартамента\n[1276.613s] за да търси бижутата, газовата светлина се отразява в стаите по-долу.\n[1280.28s] Когато съпругата му споменава тази светлина\n[1282.74s] той й казва, че си го представя.\n[1284.92s] Подобно на тираничния съпруг в \"Газова светлина\"\n[1287.22s] нарцисистите често ще се опитват да „затъмнят“ жертвите си\n[1291.0s] — използват лъжи, отричане и психологически трикове\n[1294.356s] за да накарат жертвите си да не се доверяват на собствената си памет\n[1297.35s] възприятия и поведение — дори собствения си здрав разум.\n[1301.23s] Авраамските религии превърнаха \"газовото осветление\" в истинско изкуство\n[1305.18s] предлагайки несвързани ценности и правила\n[1307.76s] които е невъзможно да се спазват последователно.\n[1310.661s] Поставянето на последователи в невъзможни двойни връзки\n[1313.32s] чрез опрощаването и осъждането на едно и също поведение.\n[1316.28s] Обявявайки действия, които не причиняват никаква вреда, като заслужаващи изтезания и смърт.\n[1322.095s] Провъзгласявайки ни за виновни за събития преди нашето раждане.\n[1325.56s] Тези маневри разрушават нашето чувство за преценка\n[1328.56s] което ни прави по-податливи на религиозен контрол.\n[1332.2s] Насочени сме да развиваме връзка с божествено същество\n[1335.92s] който ни казаха, не доказва нищо за себе си поради странната причина\n[1339.58s] че иска да имаме възможността да не вярваме, че съществува.\n[1343.44s] Ако човешките родители умишлено задържат всички доказателства\n[1346.28s] от тяхното съществуване от дете, като същевременно твърдят\n[1348.5s] че искат връзка с детето\n[1350.42s] веднага щяхме да видим лудостта на този сценарий.\n[1353.96s] Заменете „човешки родител“ с „божествено същество“\n[1356.833s] и получаваме точно същата лудост.\n[1359.66s] Нашите добре обосновани въпроси и критики\n[1362.4s] са посрещнати с постоянно променящи се цели\n[1365.15s] и претенцията, че противоречието всъщност е дълбока мистерия.\n[1369.96s] Изрично ни е инструктирано да не вярваме на собствената си преценка.\n[1374.171s] Всичко това се прави, за да принудят жертвите да приемат\n[1376.64s] фалшивата реалност на нарцисиста.\n[1379.3s] Установяването на фалшива реалност не е тривиален проблем за нарцисиста.\n[1383.4s] Това е въпрос на оцеляване.\n[1385.445s] Това означава, че не им се налага да се сблъскват с истината за себе си.\n[1388.945s] Разпространение на отрова.\n[1390.975s] [—Не можеш ли да видиш нищо друго, освен това как засяга теб?]\n[1395.337s] — Не! — Не мога! И ти не можеш, и никой друг не може!\n[1402.6s] В разказа на Лиман Франк Баум за Магьосника от Оз\n[1405.641s] крилатите маймуни бяха изпратени да направят наддаването\n[1408.2s] за Злата Вещица от Запада.\n[1409.98s] Терминът „летящи маймуни“ сега се използва често\n[1413.64s] отнасяйки се до индивиди, които действат като посредници на нарцисиста.\n[1417.88s] Понякога тези посредници заговорничат съзнателно и злонамерено.\n[1421.82s] Но те често са били манипулирани несъзнателно\n[1424.48s] да вярват в пропагандата на нарцисиста.\n[1427.6s] Това са хората, които нарцисистът използва, за да разпространява лъжи\n[1431.6s] за да събират информация и провеждат клеветнически кампании към техните жертви.\n[1436.06s] Ако изкупителна жертва прекъсне всички контакти със своя насилник\n[1439.34s] летящите маймуни ще бъдат изпратени да използват емоционален шантаж\n[1442.66s] от името на нарцисиста за да примамят жертвата да \"влезе в правия път\".\n[1446.24s] Изкупителните жертви, могат да бъдат презрени от нарцисиста\n[1449.06s] но те осигуряват голямо количество драма, която нарцисистът жадува.\n[1453.92s] Нарцисистите могат да избират летящи маймуни от собствения си социален кръг\n[1457.78s] или дори социалния кръг на изкупителната жертва\n[1460.44s] ако нарцисът може да ги манипулира, да преминат на негова страна.\n[1463.996s] Но те често ходят през минно поле\n[1466.48s] и могат сами да станат изкупителни жертви, ако развалят плановете на нарцисиста.\n[1472.04s] Що се отнася до религията, летящите маймуни могат да съставят цели общности\n[1476.26s] действащи като посредници на същество, чието съществуване не е установено.\n[1480.86s] Много самоназначени религиозни летящи маймуни\n[1483.65s] се насочват към невярващите като изкупителни жертви\n[1486.27s] провеждайки клеветнически кампании\n[1488.13s] опетнявайки техния характер и морал\n[1491.08s] отлъчвайки ги, и прилагайки емоционално изнудване\n[1495.01s] за да ги притискат да приемат техния нарцистичен Бог.\n[1498.907s] Докато ролята на „летящата маймуна“ е фокусирана\n[1501.36s] за манипулиране на жертвите на нарцисиста\n[1504.12s] ролята на „съучастник“ е фокусирана върху защитата и спасяването на нарцисиста.\n[1508.56s] Съучастниците предоставят извинения или прикритие за насилственото поведение на нарцисиста.\n[1514.56s] Няма конфликт между това да действаш като участник\n[1517.48s] и летяща маймуна и много хора играят и двете роли.\n[1521.683s] Участниците минимизират или отричат агресивността на нарцисиста.\n[1526.28s] Те помагат да се прикрие злоупотребата от външни проверки\n[1529.36s] подражават на възгледите на нарцисиста\n[1531.61s] и подкрепят фалшивата реалност на нарцисиста\n[1534.58s] опитвайки се да представят поведението на нарцисиста като нормално.\n[1538.447s] Съучастничеството се формализира в религиозната апология(защитност)\n[1542.52s] — практиката на защита на библейските свидетелства и доктрини\n[1545.66s] от критика, като гореспоменатата история на Йов.\n[1549.16s] Всички човешки родители които се съгласяват да оставят другите да измъчват децата им\n[1553.18s] само за да тестват лоялността си, с право биха се разглеждали като извратени чудовища.\n[1558.18s] Но когато Яхве направил това на Йов\n[1560.6s] това действие е защитавано като „съвършен морал“ от религиозните Участници.\n[1566.132s] Справяне с нарцисисти, човешки и божествени.\n[1568.918s] [— Баща ми обичаше да гледа борбата. Майка ми обичаше да се бори.]\n[1574.556s] Когато стана дума за справяне с нашия нарцистичен родител\n[1577.45s] и двамата осъзнахме в много млада възраст\n[1579.65s] че нещо сериозно не беше наред\n[1581.58s] въпреки че не сме имали дума за това дълги години.\n[1584.25s] Инстинктивно започнахме да намаляване контакта с нея(Майка ми)\n[1587.04s] и ограничавахме личната информация.\n[1589.06s] Не споделяхме лична информация и не питахме за съвет.\n[1592.451s] Не го знаехме, но нашата инстинктивна откъснатост\n[1595.26s] беше препоръчителна стратегия за справяне с нарцисисти.\n[1598.32s] Нарича се „сив камък“, защото точно това имитирате.\n[1601.62s] Сивият камък е незабележим, не провокира нищо.\n[1605.08s] Съобщението, което изпращате до нарцисиста\n[1606.8s] е, че тук няма нищо интересно за тях.\n[1609.08s] Няма източник на драма.\n[1610.701s] Когато разкрихме за Атеизма си пред семейството ни в ранните си тийнейджърски години\n[1614.7s] един от нас имаше представа за всеобщата война, която щяхме да преживеем.\n[1618.78s] Другият беше блажено нищо неподозиращ.\n[1621.38s] Но никой от нас никога не съжаляваше за този ход.\n[1623.86s] Понякога в живота трябва да избирате между две отрови.\n[1627.115s] Отровата да бъдете наранявани заради отстояване на вашите права\n[1630.54s] и отровата да предадеш правата си, за да избегнеш злоупотреба.\n[1633.88s] Винаги зависи от човек да прецени\n[1635.984s] коя отрова представлява по-големия риск.\n[1638.7s] Когато се изнесохме, драмата продължи\n[1641.07s] и постепенно намалихме контакта.\n[1643.47s] След много години изглеждаше, че манипулативното поведение се облекчава.\n[1647.34s] Известно време смятахме, че е настъпила истинска промяна.\n[1650.66s] Грешихме.\n[1652.9s] Когато нарцисистите чувстват, че губят жертвите си\n[1656.001s] те могат да се държат добре за известно време.\n[1658.31s] Но основната патология(болест) остава и често се задълбочава.\n[1662.52s] След време игрите на ума се завръщат.\n[1665.0s] Те се завърнаха в нашия случай — с разрушително отмъщение.\n[1668.72s] Разбрахме, че това е краят.\n[1671.14s] Всеки от нас трябваше да реши с какво сме готови да се примирим\n[1674.225s] — и това, с което не сме.\n[1675.94s] И някои от нас в крайна сметка решават да прекъснат всякакъв контакт.\n[1679.94s] В краен случай, ограничителни заповеди понякога са необходими\n[1683.52s] за да се гарантира край на връзката.\n[1685.492s] Има голяма разлика между здравословното и наивно състрадание.\n[1689.24s] Здравословното състрадание отчита нуждите на всеки човек\n[1691.99s] замесен в дадена ситуация и прави ясни преценки\n[1695.08s] за това какво е полезно и вредно.\n[1697.38s] С наивно състрадание съчувствието се предлага погрешно\n[1700.5s] на индивиди, които използват съчувствие за егоистични мотиви.\n[1704.18s] Поради това, наивното състрадание може да свърши\n[1707.18s] позволявайки и увеличавайки страданието.\n[1709.96s] Можем да имаме състрадание към разрушителните хора\n[1712.54s] но не е нужно да допускаме тяхната разрушителност в живота ни.\n[1716.12s] Справянето с божествени нарцисисти е едновременно\n[1718.92s] по-опростено и по-сложно.\n[1721.4s] Въпреки всички заплахи, никой Бог нарцисист не идва след нас, за да търси отмъщение.\n[1726.14s] В религията ние никога не преживяваме, основния нарцисист.\n[1729.58s] Без божествени манипулации или наказания.\n[1732.3s] Без пряко божествено насилие. Просто библейски истории за това.\n[1736.84s] Злоупотребата се генерира и извършва само и единствено\n[1740.42s] от човешки религиозни летящи маймуни, за да служат на своите въображаеми господари.\n[1745.08s] Въпросът с избора на отрови става смъртоносно сериозен\n[1748.28s] в религии като Исляма, където \"летящи маймуни\"\n[1750.54s] издават смъртни наказания за отхвърляне на нарцисиста.\n[1753.59s] Тук останалите от нас можем да помогнем, като подкрепим тези жертви.\n[1757.44s] Да бъдеш жертва на нарцисист може да бъде\n[1759.76s] объркващо, неприятно, понякога опасно.\n[1763.1s] Но това също може да ви разтърси и да ви събуди.\n[1765.88s] Изживяването на фалшивата реалност на човешките и божествените нарцисисти\n[1769.34s] може да ви мотивира да мислите как ефективно да отсеете истината от лъжите.\n[1773.801s] Това може да ви вдъхнови да поставите под въпрос илюзиите, които държите\n[1777.033s] и да ги замените с все по-точни модели на реалността.\n[1781.14s] Отчаянието се определя като пълна загуба или отсъствие на надежда.\n[1785.36s] Това е дума, свързана с мъчение и унижение.\n[1788.333s] Но загубата на надежда може да бъде освобождаваща\n[1790.8s] и да сигнализира за завръщане на здравето.\n[1793.22s] Когато спрем да се надяваме на невъзможното\n[1795.62s] — надявайки се за справедлива вселена\n[1798.15s] надявайки се на живот след смъртта\n[1800.9s] надявайки се че разрушителна паразитна личност\n[1803.92s] може да се превърне в прилично човешко същество —\n[1807.02s] Можем да започнем да се свързваме отново с реалността\n[1810.311s] и да спрем да се покланяме на нарцисистите.\n[1814.405s] Много благодаря на всички абонати, които поддържат канала на сайта Patreon.com/TheraminTrees"}'
