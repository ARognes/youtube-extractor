transcript: You know, I'm really not trying to build an anti-AI reputation, but they're just giving me so much material these days. And keep in mind, I've been called both an AI bro and an AI hater. So, either I'm doing everything wrong or something right. I think I'm noticing a trend of slop. And before you say I'm cherry-picking one thing, I'm actually going to be talking about three things, including Shopify, or should we say Slopify, as well as OpenClaw, maybe not a surprise, but also Codex, maybe also not a surprise. But, I'm not hating, I'm not attacking anybody, I'm just going to be making some observations. But, one of the things is this piece that Spotify did with Boris, the creator of Claude Code. And at first glance, it seems pretty impressive. They mention that Spotify runs agents across their 20 million lines of code, which is notable because one of the limitations that people always talk about is that AI isn't as good on medium and large-size projects. So, they seem to be having some success, and one of the claims that was made in this, and a lot of people are pushing back, and I guess clowning on them on Twitter, especially, that with the help of AI now, they are doing 4,500 deployments. Well, first of all, how much of an improvement is that uh in terms of like before AI? How much of the benefits are coming from AI? And even more importantly, the question a lot of people are asking now, is it actually making applications and software better? And how come nobody's talking about that? How come we're measuring the number of pull requests and lines of code and deployments, but not the actual impact that it's having on users and what users are saying? I feel like Hashimoto always has pretty balanced takes. He mentions that among him and his friends, Spotify is the lowest-quality consumer app that they pay for, and it's gotten noticed and it hasn't gotten noticeably better in the last couple years, arguably worse. So, this is not the positive look that Anthropic and Spotify are spinning here. This is the problem with a lot of AI reporting. It reports meaningless metrics like deploys or lines of code. Why don't we start reporting consumer satisfaction reports, actually end state research results? And just so you don't think he's an AI hater, he also mentions that the no nuance AI people always come out that this is anti-AI. Again, I think AI is great and Claude is great, but this is bad marketing and makes both look like clowns. Now, Hashimoto isn't the only one saying it. I think he's just uh generally well-respected, so sometimes he can say things and not just be dismissed as a hater. One more tweet I wanted to show because this is actually a point I've made a couple times on this channel, which is that this is a lot of what's happening right now is cultural. It's people are figuring out what the best thing to do is, and there's not always a correct answer like there is in algorithms. That's actually why I prefer, as much as people hate algorithms and data structures, at least there is, you know, on the spectrum of things are correct and don't really need to be argued for, and the other side where like the correctness isn't the end result. It's about convincing people that your way is better. I find that the parts of programming that turn me off are those like cultural things, and it's not only specific to AI. People have certain ways of building. To paraphrase from somebody smarter, more accomplished than me, he's asking, "Remember the microservices hype 12 years ago? Everybody was hyping it up even though most of you most of them couldn't even tell you what a microservice was, like a bunch of blind men describing an elephant." And I've I've personally had this experience myself. When you come in and you ask a question, "Okay, well, why are we doing it this way?" A lot of the times the answer is, "Well, well, just how we're doing it." People most of the time don't actually know. And how did that turn out? Well, the comeback of modular monolith as half the crowd quietly admitted they never needed the network calls in the first place. Second, the microservices heroes mostly ended up with distributed monoliths. And to cope with the insane web of dependencies running across their poorly drawn out service boundaries, they came up with a solution, the mono repo. Nowadays, the cool kids discovered the new holy grail, the AI. I don't know if it's a joke like it's is a combination of slop and loop, but uh the new protagonist, same plot, a crowd chasing something most of them can't quite define. And I I kind of made that point before, too, where I feel like I don't fully understand what everybody is talking about, and nobody is really giving clear definitions, either. 10 years ago, it was about thousands of services. Today, it's thousands of deploys per day. Let's see what we reach for to cope with the next hangover this time. But moving on, I also want to >> talk and bring back our friend Peter, >> whom I do not have anything against. He's back again crying foul. Why is everybody being so mean to them? They're just working on open source. But kind of there is a reason, I feel at least, though I would never, of course, encourage anybody to be mean online. And I also want to take a closer, and it's not even that much of a closer look at one of the points that Andrew, I think he's the lead on the codex app, is making. And he's >> a smart guy, so I I see like on Twitter and just in general, people will just look at these like smart authority figures and just sort of blindly accept what they're saying, kind of like what what we were talking about like with the microservices thing. Well, Andrew's a smart guy, so smart that he's smart enough to lie right to your face, I think, at least. But before that, I'm going to take a break, so I have a second to calm down. Authentication is probably not the thing that you want to vibe code, but that doesn't mean it has to be expensive to implement both in terms of time or cost. Today's sponsor, WorkOS, is free for your first 1 million users. So, it's not only a great choice for your small projects, but an even better one for large projects. There's a reason it's being used by companies like OpenAI, Anthropic, and Cursor. These companies with some of the smartest engineers have decided that it's not worth it to implement and maintain these systems yourself. And part of the reason for that is developer velocity. Not only do they provide pre-built components that you've certainly used on sites like ChatGPT, but sometimes your customers are companies, and they might ask, "Can our employees log in with Azure Active Directory or Google Workspace?" And if you have a contract to close, you want to be quick to implement that. Well, WorkOS supports all of those things and a lot more, and it's basically trivial to get set up. You can try them out for free at neatcode.fyi/workos. Okay, so what is Peter so upset about? He says, "I was thinking if I should highlight this tweet or not, but it's a masterclass in the amount of vitriol people face when working on open source. Is the app great yet? No, it's a start. It was built by the community. Getting the iOS and Android apps working with secure pairing and push notifications, and getting both through app review took a surprising amount of work. Open Claw wasn't acquired by OpenAI and isn't an OpenAI product. It's an open independent project under the Open Claw Foundation. OpenAI sponsors the project's token usage. I work there. Your tweet was one of the 30 I woke up to today. I genuinely love your help making it great. Attention is the scarcest resource. I'd rather spend mine encouraging people who build." Well, what is he responding to? You would think that like based on the way he's acting, somebody must have said something really awful, but all they say is imagine getting acquired by OpenAI, get unlimited AI tokens, and still drop this slop abomination. You know, I'm not encouraging people to be mean, but I guess this person could have been a bit more constructive in their criticism, but what they're pointing out is a fair point in saying that this entire app looks like it was just vibe coded, like there there wasn't thought put into it. They kind of just went with their first draft, which, you know, you can be the final judge of that, but based on Peter's admission, I think he kind of knows it's true. And I just think it's a little bit funny because look at what Peter tweeted literally less than 24 hours but like a go, which which was like what, 12 hours before that other tweet. This would have been amazing a few years ago, but in the age of AI, what's the point? First of all, I feel like this is much more of an offensive tweet than calling something that's obviously slop, just calling it slop because that's a correct statement. I mean, you could say, "Well, you could be nicer. Like why not be constructive? Why not help us? We're just doing open source, guys." Okay, fair, but what he said is "Apple acquires play, design mode, and Xcode incoming." So, basically what Peter is saying that, well, design is useless. Why would you need a design system when you have loops now, guys? Stop prompting. Stop designing. I'm giving you advice because look how great my applications are. You know, basically implying that like designers shouldn't even be They don't even need a job. Like you don't need designers. We have AI, guys. What? Come on. And of course, of course, you know, there were the replies. Somebody replying, "LOL, this is the point." And this is, you know, I I know I'm burning bridges by saying this. There's There're going to be some people who are not willing to be friends with me now, but I really don't care because this is ridiculous. And I don't know why why more people don't think so. Now, you might think of Peter as like the crazy open claw guy, but now we have Andrew who's actually working on the Codex app, and it's a great app. It is pretty good. And that's why it's having a lot of success lately. I use it a ton. But, let's just take a slightly closer look. What's a little funny about the GPT weak on front end discourse is that everything we ship in the Codex app gets adopted by the entire industry within days or weeks pixel for pixel. Now, technically, he's not literally lying. It is true everybody's copying the Codex app. But, the implication is GPT weak on front end, right? If you don't know, generally for front end stuff, people prefer the Anthropic models. I certainly do as well. I think for UI stuff, they are just better. But, he's implying that that's not the case. The GPT is not much worse on front end because look at how great the Codex app is. And of course, everybody's just doing that with GPT with loops, presumably. And there's just one reply that I was thinking as well. You have good designers. I could never get GPT to generate a UI that looks anything near Codex from scratch. And well, like this is what I mean. Like, these are smart people. But, you see what they're doing, right? It's not honest what they're doing. And from what I know, from what I've heard, the way these companies operate, they're kind of like a cult, and I use that word kind of loosely. Anthropic, from what I know, is more much more of a cult like culturally, like you kind of everybody thinks kind of the same way about like their opinions on AI and stuff, but even at OpenAI, from what I've heard, everybody is really like on board with the mission. There aren't many people like taking like news stories and saying, "Hey, like maybe maybe they have a point. Like maybe we don't know everything that there is to know. Like maybe we could be wrong about some things." Those types of discussions aren't really happening. And it's just funny because they're using something by saying that, "Okay, well, nobody is writing code anymore. Everything is going through AI now." And then they say, "Well, now now they're we're not even prompting. Now everything is actually loops." And that's just not the case. I've spoken to people, not a single one of them says that their jobs could be done if they didn't already know how to code and they already didn't have a lot of technical knowledge, and that they are certainly reading the code that they are writing. But that's not going to build the hype. What's going to build the hype is meaningless metrics that sound good on paper, but when you actually just take a slightly closer look, things just don't add up. It's a ridiculous thing to imply that Codex could be created with just GPT. And it's especially funny because you always see people like Andrew and Tibo on Twitter always asking for feedback. So, you know they're smart enough to actually listen to their users and not vibe code stuff, but when they're building the hype, they will leave that part out conveniently.
