transcript: '{"content":"\n[1.63s] [Music]\n[42.96s] How do we formulate our moral values? Do\n[45.92s] we just copy those around us? Do we\n[48.239s] judge our actions to be okay if we see\n[50.32s] other people doing them? Do we continue\n[52.96s] to behave exactly how we were trained to\n[54.879s] behave as children?\n[57.039s] Do we allow our values to be decided for\n[59.199s] us by an external authority? Parents,\n[62.16s] peer groups, professors, politicians,\n[65.199s] priests, prophets.\n[68.08s] Do we question the values we encounter\n[70.4s] and construct our own values based on\n[72.24s] critical assessments?\n[74.32s] Many members of religious ideologies\n[76.56s] give credit to their religion for their\n[78.479s] moral values, but some go further and\n[81.36s] take credit on behalf of their religion\n[83.36s] for the moral values of non-members.\n[85.92s] It''s been claimed time and time again,\n[88.08s] and it''s still being claimed that people\n[90.08s] who live their lives without any belief\n[91.92s] in gods, religion, or the supernatural\n[94.799s] have nonetheless had their morals shaped\n[96.96s] by the dominant religions of their\n[98.64s] geographical region. It''s a predictable\n[101.36s] claim. Many religious individuals regard\n[104.0s] their religion as the fundamental or\n[106.32s] even exclusive source of human morality.\n[109.92s] For them, if non-believers appear to\n[112.24s] lead decent moral lives, it must be down\n[114.72s] to the pervasive influence of their\n[116.64s] religion. In the West, it''s claimed that\n[119.2s] secular morals have been shaped by\n[121.04s] something referred to as the\n[122.56s] Judeo-Christian tradition, a hybrid of\n[125.36s] Judaism and Christianity.\n[127.84s] So should we allow the credit for our\n[130.0s] core moral values to be appropriated in\n[132.64s] this way?\n[134.19s] [Music]\n[140.959s] When people claim that secular values\n[143.04s] borrow from the Judeo-Christian\n[144.64s] tradition, what''s striking is their\n[146.72s] decision to ignore all history before\n[149.2s] the emergence of Judaism and\n[150.959s] Christianity.\n[152.56s] Modern human beings had been in\n[154.239s] existence for over a 100,000 years by\n[157.44s] the time Judaism, a much older religion\n[159.92s] than Christianity, was in its infancy.\n[162.959s] Uh we expected to accept that until the\n[165.68s] advent of Judaism, human beings had\n[167.76s] developed no sense of how to treat each\n[169.519s] other to exist as social creatures. But\n[172.0s] did the values of these religions\n[173.519s] somehow spring readymade from a moral\n[176.319s] vacuum with no reference to the values\n[178.56s] of the local cultures of the time? Of\n[181.04s] course, they didn''t. Both religions\n[182.959s] borrowed from pre-existing social\n[184.879s] conventions and principles. It''s\n[187.44s] understandable that those who argue for\n[189.28s] the primacy of Judeo-Christian values\n[191.44s] would want to stop the historical search\n[193.36s] for moral values at their own religion,\n[195.84s] but there''s no valid justification for\n[198.08s] doing so. Certain principles of moral\n[200.56s] conduct tend to emerge naturally in\n[202.72s] social groups purely because they help\n[204.56s] to preserve the group. For example, the\n[206.959s] basic principle don''t kill. A culture\n[209.599s] that adopts the principle, kill as many\n[211.84s] people as you can indiscriminately,\n[213.92s] isn''t going to survive long. When a\n[216.159s] religion comes along and lays down laws\n[218.4s] reflecting social conventions and\n[220.0s] principles already in existence across\n[222.319s] humanity, like not stealing and not\n[224.56s] murdering, that religion doesn''t\n[226.4s] suddenly own the intellectual rights to\n[228.319s] those principles. Religion is not the\n[230.879s] innovator here, just an imitator.\n[234.08s] Animal studies show that non-human\n[236.08s] social species demonstrate empathy,\n[238.799s] compassion, and an awareness of\n[240.799s] fairness, which are significant\n[242.879s] ingredients in morality.\n[245.2s] Pimeatlogist France Dval and his\n[247.36s] colleagues found that when given the\n[249.04s] choice to swap different kinds of token\n[250.799s] for different food rewards, chimpanzees\n[253.28s] and capacins frequently swapped\n[255.36s] pro-social tokens which rewarded both\n[257.6s] themselves and a partner of their own\n[259.359s] species rather than selfish tokens which\n[262.32s] rewarded them alone. Capuccines have\n[264.96s] been observed to reward partners for\n[266.639s] cooperation in a task to gain food even\n[269.759s] when they have the choice to keep it all\n[271.28s] for themselves. They''ve also been\n[273.44s] observed to protest aggressively when\n[275.6s] they see a fellow cappuccin receiving a\n[277.84s] better reward for performing the same\n[279.6s] task. After fights, chimpanzees display\n[283.12s] distinctive reconciliation behavior,\n[285.28s] stretching out a hand to an enemy,\n[287.52s] kissing, embracing, and grooming.\n[291.04s] Basic equitable behavior demonstrating a\n[293.52s] keen sense of fairness has been observed\n[295.84s] in a range of social species. To suggest\n[299.28s] religion is the source of this equitable\n[301.199s] behavior is plainly absurd.\n[304.24s] And it''s no less absurd to suggest it''s\n[306.56s] the source of human equitable behavior.\n[316.4s] What exactly is the Judeo-Christian\n[318.479s] tradition supposed to mean? Judaism and\n[321.52s] Christianity show significant overlap in\n[323.759s] their construction holding many of the\n[325.68s] same ancient texts as sacred. The Jewish\n[328.72s] Tanakh contains 24 books that appear in\n[331.52s] the Christian Old Testament. But even\n[333.68s] though these two branches of religion\n[335.36s] share many ancient texts, there are\n[337.52s] significant differences in their\n[339.199s] translations, interpretations,\n[341.6s] perspectives, and foundational values.\n[344.72s] Many Jews and Christians strongly object\n[347.199s] to being lumped together. Writing in the\n[349.44s] 1970s, Rabbi Allesia Burkovitz\n[352.32s] commented, \"As to dialogue, in a purely\n[354.639s] theological sense, nothing could be more\n[356.56s] fruitless or pointless. Judaism is\n[359.199s] Judaism because it rejects Christianity,\n[362.16s] and Christianity is Christianity because\n[364.24s] it rejects Judaism. What is usually\n[366.8s] referred to as the Judeo-Christian\n[368.479s] tradition exists only in Christian or\n[371.039s] secularist fantasy. The Tanakh contains\n[374.479s] instructions that are explicitly\n[376.16s] rejected by the figure of Jesus, the\n[378.319s] Christian Messiah. And Christianity is\n[380.88s] repeatedly presented as a reformation of\n[383.6s] older Jewish ideas. For example, in the\n[386.56s] Jewish Torah, the book of Vikra 24 19\n[390.319s] to20 states, \"And a man who inflicts an\n[393.28s] injury upon his fellow man, just as he\n[395.759s] did, so shall be done to him, fracture\n[398.24s] for fracture, eye for eye, tooth for\n[400.8s] tooth.\" The Christian equivalent in the\n[403.199s] Old Testament book of Leviticus\n[405.039s] reiterates this. This is an explicit\n[407.919s] instruction to reciprocate injury. And\n[411.12s] yet in Matthew 5:43,\n[414.479s] Jesus explicitly contradicts this law,\n[417.36s] saying, \"You''ve heard that it was said\n[419.599s] eye for eye and tooth for tooth. But I\n[422.56s] tell you, if anyone slaps you on the\n[424.96s] right cheek, turn to them the other\n[426.8s] cheek.\"\n[428.4s] This verse from the Christian New\n[430.24s] Testament contradicts the Jewish Torah\n[432.639s] and its own Old Testament.\n[435.68s] In the New Testament, Jesus defends and\n[438.4s] forgives those identified as adulterers\n[440.72s] and prostitutes and admonishes those who\n[443.599s] judge them. In the Tanakh and the Old\n[446.16s] Testament, adulterers and prostitutes\n[448.96s] are condemned to death by fire. Time\n[452.319s] after time, fundamentally incompatible\n[454.639s] principles are promoted. So from the\n[456.72s] outset, any attempt to package Judaism\n[458.8s] and Christianity as some coalition of\n[461.199s] faith creates an unworkable hybrid full\n[464.319s] of moral contradictions.\n[466.72s] But it''s worse than that. As well as\n[468.88s] basic conflicts of value between Jewish\n[470.88s] and Christian scripture, substantially\n[473.12s] conflicting values are found in\n[474.639s] countless areas between the\n[476.0s] subdenominations of each religion. Some\n[479.199s] Christians believe that accepting the\n[480.8s] biblical figure of Jesus as their savior\n[483.039s] will allow them to enter a post-death\n[484.879s] paradise called heaven. Other Christians\n[487.68s] believe that who will and won''t enter\n[489.599s] heaven has been decided before birth and\n[492.319s] that nothing a person does during their\n[494.08s] life can change that. Some Christians\n[496.319s] are strongly separatist, distancing\n[498.56s] themselves from those outside their\n[500.16s] group who they label with words like\n[502.8s] worldly. Other Christians promote\n[505.36s] inclusivity and interfaith dialogue.\n[508.8s] Some Jews insist the Torah is the word\n[511.039s] of their deity. Other Jews see the Torah\n[513.599s] as a collection of fallible human\n[515.279s] writings, which changes their\n[517.2s] relationship to its instructions. There\n[519.599s] are also conflicts about rituals. Some\n[522.0s] Jews believe women and men should be\n[524.32s] able to publicly recite a morning prayer\n[526.959s] called the Kardesh. Others believe it\n[529.36s] should be reserved for men. These\n[532.0s] individual denominations promote\n[533.92s] incompatible principles. So to claim\n[536.48s] they represent a unified moral tradition\n[538.88s] is untenable.\n[541.12s] Even if we ignore the conflicting values\n[543.04s] of Judaism and Christianity and focus on\n[545.519s] their common ground, we find problems.\n[548.56s] When we look at the texts both religions\n[550.56s] regard as sacred, they contain\n[552.24s] instructions to put a long list of\n[554.16s] people to death. Of course, even the\n[556.8s] denominations that insist their\n[558.399s] scripture embodies eternal, unchanging\n[560.72s] moral values don''t carry out these\n[563.04s] instructions, which shows a clear\n[565.6s] disconnect between the moral values in\n[567.76s] the text and what Jews and Christians\n[570.0s] actually do. Of course, when a holy book\n[573.44s] tells us to kill blasphemers, unruly\n[576.16s] children, non-believers, adulterers, and\n[579.279s] same-sex lovers, better to be a\n[582.0s] hypocrite and not carry out these\n[583.76s] barbaric instructions than commit these\n[586.399s] killings just to be morally consistent\n[588.56s] with an immoral book. But isn''t it best\n[592.16s] when your own moral sense tells you an\n[594.48s] instruction is wrong to reject the\n[596.64s] authority of the instruction?\n[599.2s] When a supposedly holy book tells you to\n[601.839s] carry out executions you know to be\n[603.68s] immoral isn''t the clearest solution to\n[606.08s] recognize that the book isn''t holy at\n[608.16s] all and that its values have no place in\n[610.72s] any civilized morality.\n[613.2s] There''s a fundamental split between\n[615.12s] scriptural values and modern moral\n[617.44s] values regarding the importance of\n[619.2s] deeds. with few notable exceptions, for\n[622.399s] example, where illness or coercion is\n[624.48s] involved. We judge people as accountable\n[626.8s] for their actions and expect them to\n[629.2s] accept personal responsibility.\n[631.92s] Christianity, in contrast, discards this\n[634.64s] core value, substituting the acceptance\n[637.2s] of Jesus as the sole consideration.\n[640.8s] On the surface, the Bible contains lots\n[642.959s] of instructions about how to behave. But\n[645.44s] ultimately, deeds don''t count in\n[647.68s] Christianity. A lifetime of bad deeds is\n[650.64s] obliterated by accepting Jesus. A\n[653.36s] lifetime of good deeds is obliterated by\n[655.519s] failure to accept him.\n[658.0s] Another fundamental split is seen in the\n[660.079s] contrast between commandment-based\n[661.76s] religious moral instruction, which\n[663.44s] provides no rationale other than divine\n[665.44s] authority and commonly forbids challenge\n[667.76s] and criticism, and secular morality\n[670.64s] constructed through a process of\n[672.0s] independent reasoning involving ongoing\n[674.48s] critical discussion and education.\n[677.36s] These differences aren''t trivial. They\n[679.92s] have profound consequences for our whole\n[682.399s] relationship with morality. If we''re\n[684.959s] asked why a specific behavior is morally\n[687.279s] wrong, and all we can say is because a\n[689.76s] god said so, or because my holy book\n[692.959s] said so, or because that''s what I''ve\n[695.519s] been brought up to believe, we haven''t\n[698.079s] provided a moral answer at all. We''ve\n[700.88s] just accepted what we''ve been told to\n[702.56s] think by others. If we''re doing as we''re\n[705.04s] told with no intervening reflection,\n[707.92s] copying the crowd, or simply acting out\n[710.8s] of fear of punishment or hope of reward,\n[713.76s] we''re not exercising our individual\n[716.0s] moral agency.\n[718.24s] Alan claims behavior X is morally wrong,\n[721.279s] but argues from religious authority or\n[723.76s] tradition to justify his position. Ben\n[726.639s] claims behavior X is morally wrong, but\n[729.04s] justifies his position with valid\n[730.88s] reasoning. They might share the same\n[732.8s] view about the behavior, but Ben''s moral\n[735.279s] outlook owes no debt of recognition to\n[737.6s] Allen''s religion. The fact that\n[739.92s] religions promote values doesn''t mean\n[742.079s] those values are supported by valid\n[743.92s] reasoning. In fact, it''s through the\n[746.56s] careful application of valid reasoning\n[748.399s] that we continue to expose many\n[750.32s] historically celebrated religious values\n[752.8s] as immoral. Among a wealth of\n[756.32s] reprehensible stories in the Jewish and\n[758.32s] Christian scriptures are its depictions\n[760.56s] of atrocities towards children. In the\n[764.0s] Old Testament''s book of numbers and is\n[766.48s] equivalent in the Tanakh Bidbar, we find\n[769.44s] the prophet Moses giving instructions to\n[771.76s] kill every male child of the Midionites\n[774.079s] and preserve any virgin female children\n[776.72s] as sexual stock. This from the prophet\n[779.92s] famed for delivering the decalogue. 10\n[782.399s] purportedly divine commandments\n[784.639s] governing conduct, thought, and worship.\n[788.56s] Lyrics to the melodian song Rivers of\n[790.48s] Babylon, later popularized by Bonm, were\n[793.68s] lifted from Psalm 137 of the Bible. The\n[797.279s] song focuses on the parts of the psalm\n[799.2s] that express feelings of victimhood,\n[801.519s] recounting how the Jews were carried\n[803.12s] away in captivity by the Babylonians and\n[805.36s] told to sing songs. Rivers of Babylon\n[808.16s] might not have been such a hit if it had\n[810.399s] included verse 9 of the psalm which\n[812.639s] delights in a peculiar form of revenge\n[814.959s] against the Babylonians.\n[816.959s] It states, \"Happy is the one who seizes\n[819.68s] your infants and dashes them against the\n[822.079s] rocks.\"\n[823.6s] Some apologists have claimed that the\n[825.2s] word infants doesn''t refer to literal\n[827.519s] infants. It''s just being used like the\n[829.92s] phrase children of Israel to refer to\n[832.16s] the people of Babylon. But Isaiah 13:16\n[836.079s] echoes the passage in Psalms and clearly\n[838.48s] refers literally to children. Writing in\n[841.44s] the 1700s in his exposition of the\n[844.0s] entire Bible, Baptist John Gil commented\n[846.8s] that though it may seem a piece of\n[848.56s] cruelty, it was but a just retaliation.\n[852.079s] He claimed it was not desired from a\n[853.839s] spirit of revenge, but for the glory of\n[856.24s] divine justice.\n[858.399s] The glorification of infanticide is not\n[860.8s] a value that shapes our morals today.\n[864.24s] Jewish and Christian Bibles contain a\n[867.04s] vast range of messages from stories of\n[869.519s] great compassion and tenderness to\n[871.76s] salivating accounts of the most debased\n[873.92s] brutality. We have the fluff and we have\n[877.04s] the snuff. But even some of the fluffy\n[879.6s] stuff isn''t quite so fluffy on closer\n[881.92s] inspection. As a former Christian, I was\n[884.639s] taught to see Jesus as the embodiment of\n[886.8s] love. But the fact is Jesus was no\n[889.44s] respector of loving relationships that\n[891.36s] didn''t include him. Jealously declaring,\n[893.839s] \"Anyone who loves their father or mother\n[896.24s] more than me is not worthy of me. Anyone\n[899.04s] who loves their son or daughter more\n[900.959s] than me is not worthy of me.\" This love\n[904.24s] ondemand approach also featured in\n[906.48s] Jesus''s command to love our enemies, as\n[909.04s] well as countless commands to love\n[910.639s] Yahweh, employing inducements and\n[912.959s] threats to achieve compliance. The\n[915.68s] notion of ordering people to love denies\n[918.32s] the autonomous nature of love. Who today\n[921.12s] would accept being told who they should\n[923.12s] love. Talking of relationships, the term\n[926.639s] codependency refers to relationships in\n[929.279s] which one partner depends on the other\n[931.12s] as an external source of self-worth,\n[933.6s] approval, and identity instead of being\n[935.92s] able to nurture those qualities within\n[937.68s] themselves. Codependency is recognized\n[940.399s] as a highly dysfunctional relationship\n[942.56s] model, but it''s the ultimate\n[945.04s] relationship model in Jewish and\n[946.88s] Christian scripture where it becomes\n[949.199s] theodependency.\n[951.44s] Here again, instead of being inwardly\n[953.68s] cultivated, self-worth, approval, and\n[956.48s] identity are sought from an external\n[959.12s] source, this time a god, leaving many\n[962.32s] followers vulnerable to all kinds of\n[964.399s] abuse and manipulation.\n[966.72s] The doctrine of eternal punishment\n[968.399s] promoted by Christianity is deeply\n[970.639s] immoral, representing the most extreme\n[973.199s] possible disproportion between\n[975.12s] transgression and penalty. By ruling out\n[977.759s] redemption or rehabilitation, it\n[980.16s] constitutes nothing more than\n[981.44s] everlasting gratuitous sadism. The\n[984.72s] foundational Christian doctrine of\n[986.399s] vicarious redemption proposes that the\n[988.72s] sacrifice of a supposedly innocent\n[990.56s] individual can atone for the sins of\n[993.04s] others. Secular thinkers have denounced\n[995.68s] this concept as a striking perversion of\n[998.639s] moral responsibility.\n[1001.12s] Born in the 1700s, Thomas Payne, one of\n[1004.399s] the founding fathers of the United\n[1006.16s] States, commented, \"If I owe a person\n[1008.8s] money and cannot pay him, and he\n[1010.88s] threatens to put me in prison, another\n[1012.639s] person can take the debt upon himself\n[1014.48s] and pay it for me. But if I have\n[1016.639s] committed a crime, every circumstance of\n[1018.959s] the case is changed. Moral justice\n[1022.0s] cannot take the innocent for the guilty,\n[1024.559s] even if the innocent would offer itself.\n[1027.039s] To suppose justice to do this is to\n[1029.52s] destroy the principle of its existence,\n[1031.919s] which is the thing itself. It is then no\n[1035.36s] longer justice. It is indiscriminate\n[1038.0s] revenge.\n[1045.919s] In his book, God Created Humanism: The\n[1048.88s] Christian Basis of Secular Values, Theo\n[1051.76s] Hobson seeks to give Christianity credit\n[1054.32s] for modern moral thinking. He argues\n[1057.52s] secular humanism very gradually emerged\n[1060.4s] within Christian culture, which means\n[1062.64s] that the modern humanist principles of\n[1064.88s] liberty and equality are rooted in\n[1067.679s] Christianity.\n[1069.2s] If selfworth very gradually emerges from\n[1072.4s] within an abusive family, is that\n[1074.96s] selfworth rooted in abuse?\n[1078.559s] If science very gradually emerges within\n[1081.2s] a culture that rejects science for\n[1082.96s] superstition, is science rooted in\n[1085.84s] superstition?\n[1088.48s] Sometimes values emerge as an attempt to\n[1091.679s] shake humans free from the surrounding\n[1093.919s] cultures retrograde influence. and they\n[1096.559s] emerged despite the best efforts of the\n[1098.799s] surrounding culture to stifle and\n[1100.96s] suppress them. Hubson states in the\n[1104.16s] midentth century the ideal of universal\n[1106.96s] human rights was launched by mostly\n[1109.36s] Christian thinkers and statesmen. A\n[1111.6s] chain of coffee shops could be launched\n[1113.2s] by mostly Christian thinkers. Doesn''t\n[1115.679s] mean the coffee has Christian roots.\n[1117.84s] Christians do all kinds of things, good,\n[1120.4s] bad, and indifferent, that have nothing\n[1122.559s] to do with their religion. It''s not\n[1125.2s] enough to say that something was done by\n[1127.28s] Christians. In order to give\n[1129.28s] Christianity the credit, you have to\n[1131.2s] demonstrate a sound ideological pathway\n[1133.679s] to Christianity itself.\n[1136.16s] And when we look for that pathway, we\n[1138.4s] find the problem mentioned before. The\n[1140.96s] pathway repeatedly splits into\n[1142.88s] conflicting directions. This helps to\n[1145.6s] explain why historically we''ve often\n[1147.84s] seen Christians on both sides of a\n[1149.679s] dispute. In the mid 19th century on the\n[1153.039s] issue of slavery in the United States,\n[1155.28s] there were Christian abolitionists and\n[1157.44s] Christian advocates. A religion\n[1159.84s] proclaimed as the source of universal\n[1161.679s] human rights should unambiguously\n[1164.08s] condemn the owning of people as\n[1166.0s] property. But it doesn''t. Instead,\n[1169.919s] Christian and Jewish scripture\n[1172.16s] explicitly endorses it and even proposes\n[1175.36s] a set of laws to regulate it. A religion\n[1178.88s] that stands for everything stands for\n[1181.12s] nothing.\n[1182.88s] Hobson writes, \"Christianity gave rise\n[1185.44s] to a moral universalism that is in a\n[1187.76s] sense more advanced than it. For secular\n[1190.559s] moral universalism is capable of being\n[1193.12s] more universalist in that it overlooks\n[1195.84s] religious difference in asserting\n[1198.08s] fundamental human unity. Hobson tries to\n[1201.679s] give credit for the emergence of secular\n[1203.52s] morality to Christianity while admitting\n[1206.08s] that secular morality in overlooking\n[1208.559s] religious differences demonstrates a\n[1210.88s] more advanced moral perspective than\n[1212.88s] Christianity whose doctrines repeatedly\n[1215.52s] exclude and condemn those who sincerely\n[1219.12s] see no valid reason or evidence for\n[1222.08s] supernatural belief. Credit for secular\n[1225.28s] moral advances goes to secular thinkers,\n[1228.72s] not to Christianity.\n[1230.72s] The word secular is often mistakenly\n[1233.44s] defined as atheistic, but secular\n[1236.08s] thinkers can be non-religious or\n[1238.24s] religious. Secular thinking just means\n[1240.96s] the person isn''t bringing religious\n[1242.64s] faith into the matter. Which is why in\n[1245.28s] those cases, credit goes to the thinker\n[1248.0s] and not to any faith. He goes on to say\n[1251.679s] Christianity should affirm secular\n[1253.76s] humanism as a public ideology but also\n[1257.12s] say that it is inadequate. It is limited\n[1260.799s] to the practical public sphere, the\n[1263.2s] surface of life. It has no strong\n[1265.6s] account of life''s meaning and purpose\n[1267.919s] but gravitates to an evasive shrug.\n[1271.84s] Secular humanism doesn''t have to account\n[1274.0s] for life''s meaning or purpose. Many\n[1277.039s] secular thinkers don''t agree that life\n[1278.799s] has any intrinsic meaning or purpose. So\n[1281.919s] not providing an account of these\n[1283.84s] doesn''t represent a deficiency or an\n[1286.64s] evasion but a disagreement.\n[1289.84s] If Hobson wishes to make the claim that\n[1291.84s] life has meaning or purpose, it''s his\n[1294.72s] burden to provide valid support for his\n[1297.039s] claim. If he can''t shoulder that burden,\n[1299.919s] then it''s his position that amounts to\n[1302.08s] an evasive shrug. Hubson states,\n[1304.96s] \"Humanitarian ideals are not natural,\n[1307.84s] nor are they rationally deducible. They\n[1310.48s] are complex cultural traditions brewed\n[1313.28s] over centuries.\" And the main ingredient\n[1315.52s] in this brewing was the story of God\n[1318.32s] taking the side, even the form of the\n[1321.12s] powerless victim. Humanitarianism is\n[1324.24s] about the promotion of human welfare.\n[1326.72s] And humanitarian ideals can be a mix of\n[1330.32s] tutored and natural.\n[1333.44s] As previously noted, we can see the\n[1335.679s] basic elements of empathy and equity in\n[1338.48s] the pro-social behavior of animals, and\n[1340.96s] we have no reason to believe that humans\n[1342.96s] alone require these same elements to be\n[1345.679s] inserted magically into them by\n[1348.159s] supernatural means. Of course, ideals do\n[1352.24s] sometimes require some teaching, often\n[1354.799s] to overcome cultural traditions brewed\n[1357.2s] over centuries. traditions that have\n[1359.679s] condemned, subjugated, and executed\n[1362.72s] unfathomable numbers of people based on\n[1365.52s] ignorance, superstition, and the bogus\n[1368.559s] moral pronouncements of religious\n[1370.32s] scripture, like the Jewish and Christian\n[1372.48s] Bibles, which set death penalties for a\n[1375.36s] huge range of harmless activities,\n[1377.76s] including picking up sticks on the wrong\n[1379.84s] day of the week.\n[1381.679s] Part of the reason many harmless\n[1383.2s] activities were able to be condemned was\n[1385.44s] because of the dubious religious term\n[1387.6s] sin, which has no accurate secular\n[1390.08s] equivalent. With sin, we see the\n[1392.88s] invention of a nebulous category that\n[1395.44s] can encompass any behavior or thought on\n[1398.24s] the grounds that it represents a\n[1399.679s] transgression against some god or gods\n[1402.32s] without having to offer any evidence of\n[1404.64s] harm. It''s when we apply rational\n[1407.6s] deduction rather than dogmatic moral\n[1410.0s] pronouncements that we''re able to bypass\n[1412.4s] all this superstitious savagery and see\n[1414.799s] these harmless activities for what they\n[1416.72s] are. As a former Christian for years, I\n[1420.88s] mistook Jesus for a victim. I became\n[1423.679s] lost in the drama and emotion of the\n[1426.24s] crucifixion story and overwhelmed by the\n[1429.52s] painful sense of guilt that was handed\n[1431.6s] to me by my indoctrinators who told me\n[1434.559s] Jesus was crucified for me. When I later\n[1438.32s] tunnneled my way out of my\n[1439.919s] indoctrination, I realized the character\n[1442.559s] of Jesus wasn''t a victim at all. If\n[1445.76s] Jesus was Yahweh in human form, then\n[1448.64s] Yahweh freely chose to undergo\n[1450.799s] crucifixion according to his own\n[1452.799s] premeditated plan. He had the power to\n[1456.08s] do whatever he wanted. There was no\n[1458.32s] coercion or necessity.\n[1461.12s] In contrast, genuine victims don''t have\n[1463.919s] choice or power over their situations.\n[1467.279s] Being an entirely voluntary exercise,\n[1470.0s] the crucifixion story amounts to nothing\n[1472.48s] more than a divine flirtation with sedo\n[1475.52s] masochism. To characterize Jesus as a\n[1478.24s] victim is a gross insult to genuine\n[1480.96s] victims.\n[1483.039s] The claim that people who live their\n[1484.88s] lives without any belief in gods,\n[1486.96s] religion, or the supernatural have had\n[1489.44s] their morals shaped by Judeo-Christian\n[1491.84s] traditions or values can be dismantled\n[1494.4s] on many grounds. The very notion of\n[1497.52s] Judeo-Christian traditions and values is\n[1500.08s] beset with problems. Not only do many\n[1503.2s] Jews and Christians strongly reject the\n[1505.36s] awkward merging of their ideologies,\n[1507.76s] their values and the values of the\n[1509.679s] individual denominations of their\n[1511.12s] religions show significant conflict and\n[1514.48s] incompatibility.\n[1516.159s] Individual cases of resemblance to\n[1518.08s] secular values don''t imply that secular\n[1520.559s] values have borrowed from religious\n[1522.24s] ones. Secular values can be derived\n[1524.96s] independently without reference to any\n[1527.44s] religious scripture. Animal studies\n[1530.4s] demonstrating basic empathy, fairness,\n[1533.12s] compassion, and reconciliation also\n[1536.08s] negate the idea that religions are a\n[1538.08s] source of our values. As does the\n[1540.08s] existence of similar equitable\n[1541.6s] principles in independent human cultures\n[1544.4s] around the globe. Secular moral values\n[1547.36s] can develop through critical discussion,\n[1549.919s] allowing course correction when mistakes\n[1552.08s] are discovered. Moral judgment relies on\n[1554.799s] an accurate assessment of relevant\n[1556.96s] information. So the very principle of\n[1559.6s] adapting in the light of new information\n[1562.08s] rather than sticking dogmatically to\n[1563.84s] misguided ideas is an important value in\n[1566.799s] itself. In contrast, religious values\n[1570.159s] presented as eternal, unchanging,\n[1573.44s] perfect can admit no mistakes, forcing\n[1576.799s] adherence to invent contorted\n[1578.799s] apologetics to try and excuse the\n[1581.679s] inexcusable.\n[1583.84s] Historically, Judaism and Christianity\n[1586.88s] have both promoted and implemented\n[1589.52s] scriptural values most of us find\n[1591.6s] abhorrent today.\n[1593.52s] Secular thinking has provided moral\n[1595.76s] insights and exposed the harm in the\n[1598.159s] values of those religions, prompting\n[1600.159s] followers to re-evaluate their moral\n[1602.0s] stances on a range of issues and opening\n[1604.64s] the way for all of us to advance beyond\n[1607.679s] exclusive religious moral systems and\n[1610.32s] continue to develop inclusive human\n[1612.799s] values that are relevant and coherent.\n[1616.88s] Secular thinkers have not borrowed moral\n[1619.76s] capital from the incoherent hybrid that\n[1622.559s] is Judeo-Christianity.\n[1624.799s] We don''t owe Judeo-Christianity a moral\n[1627.679s] debt and we shouldn''t put up with any\n[1630.24s] attempts on its behalf at appropriating\n[1632.88s] morality.\n[1649.02s] [Music]"}'
