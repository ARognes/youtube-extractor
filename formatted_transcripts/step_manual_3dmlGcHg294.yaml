transcript: '{"content":"\n[0.0s] In therapy, a big part of what we want\n[1.64s] to do is when someone is open-minded,\n[4.12s] you have a chance to plant a seed. See,\n[5.96s] the nature of depression is that even if\n[8.12s] you''re getting better, you won''t notice\n[9.72s] it. I had a patient who came into my\n[11.52s] office once, couple years in, and he\n[13.24s] said, \"Dr. K, I''m just as bad as when I\n[15.32s] showed up.\" And then I asked him, I\n[16.52s] said, \"Well, how''s your work going?\"\n[18.0s] because they had struggled trouble with\n[19.28s] work, and they said, \"Work''s fine now.\n[20.68s] I''m not getting in trouble anymore.\"\n[21.8s] They started taking their cholesterol\n[23.0s] medication. There were many things in\n[24.24s] their life that had improved, but they\n[26.44s] didn''t feel like it had improved. And\n[28.04s] then I I told him that day, I said, \"I\n[29.76s] think you''re not depressed. I think\n[31.08s] you''re unhappy.\" And there''s a big\n[32.599s] difference between those two things.\n[33.88s] >> So, now I I put the seed to him, which\n[36.36s] is, \"Hey, there''s a difference between\n[38.04s] depression and unhappiness.\" And now\n[40.2s] we''re still doing well, because then he\n[41.76s] responds with, \"Doesn''t one lead to the\n[43.8s] other?\" And I want you all to think\n[45.12s] about the attitude there, right? Like,\n[46.76s] pay attention to him over the last\n[48.12s] couple of minutes. I''m not providing\n[49.52s] answers, but he''s asking a lot of\n[51.92s] questions. That''s where the progress is\n[54.16s] made."}'
