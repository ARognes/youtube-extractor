e company included Terraform, Consul, No, it included everything but Vault. Uh Vault came a little bit later. And we looked at that and said, "If we bootstrap this, even if we hit it out of the park, this is going to take us like a decade just to like build the software and that's in the best case scenario. This is just going to be slow and and the problem with slow is that things have a window and and cloud is growing so fast that if we were that slow, someone else was going to do it their own way. I mean, that was I guess that was the primary issue. We really just wanted to go fast. >> You knew you knew you needed to. >> Yeah, I needed to we needed to hire many engineers right away and start building right away and so VC was the route we chose. >> Can you talk us through the the first several products and and what they do? You know, we we know Vagrant but just for those who are less aware of of what what became the HashiCorp stack later, right? >> Yeah, let me see if I can still get these in order. I'm pretty sure I can. Um so there's Vagrant was pre-dated it. The first product that came out of HashiCorp itself was a product called Packer. Um kind of understated publicly but kind of underpins a lot of things in the industry to this day. That's an image building uh tool. So building Amazon images, VMware images uh etc. Um I'm not even sure how much like publicly came out but there are whole cloud like multi billion dollar cloud platforms that all of their official images are like the service images are built with Packer. Everyone is trying to utilize this horizontal scaling auto scaling nature of AWS. That was the dream. And if you were it's kind of like the uh what do they call it? Cold start problem with serverless today. If you were waiting tens of minutes for your server to be ready, you couldn't react. Um and so my idea was do that snapshot the image and then next time just spin up that image. Um and so that was Packer. >> That was Packer. >> So Vagrant, Packer. Um the next one that came out was Consul. Um Consul was uh solving the networking problem and not networking, it was more solving the service discovery problem which was you have all these machines coming and going. Before, again, like to contextualize this, before you would have a static set of machines that had IPs and you would probably use DNS or something but the IPs didn't change that much. So, you could be like, "Oh, my database is here and it's not moving." But, if you're in this world where web servers and load balancers and databases are just breathing, they you know, they're That's how I always describe it, breathing. They're they're creation, destruction, creation, destruction, like constantly, then things are happening at a scale where the service discovery needs to be much faster. Um and not just uh faster, but you want to be have better guarantees that when you get a response that oh, it's at this IP address, that IP address is like ready. It's not just Yeah, I think this is also kind of more mainstream with like Kubernetes readiness checks and health checks and things like that. It was It was bringing that to more like physical server or cloud servers, virtual machines, and things like that. And so, that was Consul. Then after that, I think we did Terraform. Um Terraform uh spins up infrastructure code, describe your infrastructure. In in AWS parlance, it was things like all the attachments, you know, your EBS volumes, gateways, VPCs, subnets, and like connecting them all together. Like, the idea was I wanted to have an empty AWS account or any cloud account, and I wanted to have this text, and I wanted to say make this text reality, and that's what Terraform is. And and you would wait whatever amount of time it took AWS, and you would blink, and you would have thousands of resources. And then, you with one command again, you could just tear it down to zero. That was Terraform. So, that came out like 2014. Um so, that was the next thing. Uh and th