ld accept and it's clean and it works great. So you should accept it. But you really don't have to. Like you absolutely don't have to. And then I've seen this time and time again where you have a high quality PR, like perfect PR, but you say no. And there's anger in the community. But the thing is I I've said this since 10 years ago in the hot code days, hitting the merge button is the easiest step. Getting getting to and hitting the merge button is the easiest step. Like undergraduates should be able to do that. It's after that it's the years of maintaining whatever you just merged within the context of your your road map, um the bugs, um customer needs, all that stuff. Like that's the hard part. Like you're signing up to keeping this forever. It's very hard to remove features. So anything remove anything. So the core privilege you get with open source, like OSI open source, is forking. And you should take that's that's the right you got. You should fork it and maintain your own software. >> Yeah. One interesting impact of AI as someone tweeted about how there's a rumor that big tech is looking into re-architecting your mono repos because of agentic tooling AI tooling just a lot more code being turned out. What's actually What's actually happening? What What's the problem with Git? >> The problem with Git I mean there I think there's a lot problems with Git, but uh the mono repo problem with Git is that Git is is relatively bad at very large repositories because you you pretty much have to clone the entire repository. There's there's some extensions to like fix that, but like official mainline Git can't really do that, right? And so, for very large uh changes the very large repositories, um it's sort of annoying to maintain. And then, if you have a lot of churn in it, it's very hard to get changes into whatever your trunk is, your main, your master branch, right? You constantly rebase. Merge queues solves that to a certain extent. I think merge queues works for humans at a certain scale, but they merge queues could get quite deep. But then, if you sort of 10x that, like conservatively, I think 10x that. And then, if you buy into like hype cycles and you 100 or 1,000x that, I think it gets completely untenable in terms of how are you ever getting any semblance of cohesiveness onto the main branch um quickly. And and so, yeah, I I think there's a confluence of problems there, which is which is the merge queue problem, the disk space problem, the like branching review type problem. Oh, I I also treated the other uh another time where like Git has this you branch and you push up your branches, but the branches are only the positive. Like, when you when you close a PR and you you don't accept it, like you pretty much have the branch. In GitHub, you could reaccess closed PRs, but you a lot of people don't even get to the PR stage. They experiment, they're like, "Oh, this isn't the right way." And then, they never push the branch. And and that's like relatively important information, relatively important. It's not as important as the positive, but there like I I think there should be a lot more branches in Git, a lot more information that we just never throw away. Like, we're at to me, we're sort of at the like Gmail moment for email for version control, where like you used to really have to like curate, delete all this email. And then, Gmail came out, gave a gig away for free to everybody. >> Who never has to think about it. >> Their tagline or something was like never deleted email. I remember seeing that in some sort of marketing. It's like archive it, right? Never delete it. And that's where I feel like we should be at with code, which is like just just huge repos, a lot of context. We need better tooling in order to find relevant context in that Git repo or version controlled repo. I would say that the real you asked for like real examples. I do advise um a company that's currently stealth but working in this space. And there's