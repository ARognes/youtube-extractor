e project." and I would try to educate them, be like, "Okay, we should do this better." and and give these careful reviews. But if it's bad code that there was low effort, I'm not going to give a careful review. So again, like I wanted to know these things and and the disclosure worked decently well. The issue wasn't the disclosure. The issue was that the quantity of low-quality AI PRs that we were getting reached a a a point where it was too high. Like >> Do you know why that might have happened? More people instructed agents to contribute a PR to fix an issue that had like do you have theories or actually like like seen evidence of why this happened? >> I have theories and I've seen some evidence, but yeah, I mean I think obviously there's the rise of just AI usage in general, but the real trend that a step change that I saw at a certain point and I don't know when it happened cuz I don't use agents in this way. But at a certain point, they started opening PRs. You know, before it was like you generate code and maybe they commit and stuff, but you would still like push it to a branch and then open the pull request. At a certain point, they started opening PRs. And there was a dead giveaway at AI because at least to this day to the point where we're recording this, the way Claude opens a PR is it opens a draft with nobody and then it edits a body later and then reopens it for review. >> Which is not how human would do it. >> Oh, like one human a year would do that. And now it's happening three times a day. And so even if they're not disclosing AI or they're hiding it, it's like, oh, and it happened at a speed that's unrealistic. It opened, the body came in less than a minute later and it opened less than a minute later. Like >> Yeah. >> pure AI. I I just tweeted about this a couple days ago, which is just like I I wish that these agentic tools would put a pause in opening PRs for a second um because I think that's the point where it's really like causing a lot of friction. >> How did you change the policy? Are are you considering closing down PRs? You mentioned that recently that you you the the the thought crossed your mind. >> I would say I was crashing out in that moment. >> [laughter] >> Uh but I but kind of. Um so we shipped this policy update where PRs written by AI are no longer allowed anymore unless they're associated with an accepted feature request. So you can't just drive by and be like, I did this thing that I've never talked to you about. Here you go. It we and we we get about two or three of those a day. And so we just close those things. I don't even I literally don't even read the content. I could see it's AI. Uh I could see there's no fixes issue number. I just close it. No idea if the code is good. Don't care. It's just policy. Don't have time for that. That's pretty much where we landed on currently. And uh we're recording this in the middle of another transition, which I already have the PR open. Um where we're going to switch to a explicit vouching system for the community. So, you're no longer able to open a PR at all, AI or not, don't care anymore, which is I think the people who criticize where it came from doesn't matter. It doesn't matter anymore. Now, all that matters is that another community member has vouched for you. Um and if they vouched for you, you're added to a list where forever or indefinitely you could open a PR. If you behave badly, then you, the person who invited you, and the entire tree of people they ever invited are blocked forever from the repo. >> This reminds you a little bit of Do you know the social lobsters? >> Lobsters, yes. That's what it's based off of. So, the idea is that you're putting your own reputation on the line by vouching for somebody else. I'm a reasonable person. If If this happens, then I or one of our maintainers of community made a mistake. If you just like hop in a Discord or email and and seem like a reasonable apologetic person, like I'm not going to spend a lot of time like there's not going to be like a I don't know, a mock like court type session. I'm just going to be like, "Okay, I'll give you another chance." So, yeah, we're we're sort of moving to that system. I think one thing that's a little bit different is um I should say that this is one inspired by lobsters, but specifically in the AI space is inspired by this project called Pi. Um they do this. Uh well, they do they >> The code quality is built on Pi. It's a self-improving >> self like uh build your own agent toolkit. Um so, you know, kind of ironically, it's it's an AI tool, but they care a lot about code quality and anti-slop and things like that. So, they have a similar mechanism, a little bit less of the tree and some other but a similar you can't open a PR unless you're vouched for. And the other difference here that we're going with is in addition to vouching where you could positively mark someone, you could actually denounce users. So, if there's a bad actor, you could actually ban them. Not Not just like you can't even attempt to contribute again. And um that's just a yeah, we had one yesterday where someone opened PR, we closed it because it violated it had no associated issue and it was AI. And then they just reopened it. Like not the same one, they resubmitted a new branch and reopened it like last 10 10 minutes later. I was like, oh my gosh. So stuff like that is just it's the problem is it's just wasting time. >> It feels like most of open source will have to change because of AI, right? Like it's You you probably know more maintainers, but I hear this your story is not the only one you know, like the project closes down PRs. GitHub is I think just shipping a feature that projects can automatically close or reject PRs. >> Yeah, I think open source will have to change in a lot of ways. I mean, I think I forgot who wrote this, but you know, one of the logical extremes is if agents are so good, you don't need open source anymore cuz you can 