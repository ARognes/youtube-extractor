e that at the time we were starting this, which was like 2011, 2012. Which is that AWS was huge. Azure didn't really exist and Google Cloud didn't really exist. >> Google App Engine, right? It wasn't even cloud. >> Correct. Correct. >> I used to use that when it was App Engine, yeah. >> Yeah, yeah. And so in that context, as we were pitching these cloud-agnostic tools, I mean, we got a lot of raised eyebrows being like this is a waste of time because AWS is the only player in town. And our conviction was at that point cloud is going to be huge and anything that's economically huge other people want a piece of that pie. And so, you're not going to just have AWS. It'll be huge, but you're going to have these others pop up and Microsoft is not going to sleep on it and Google's not going to sleep on it and who knows who else and who knows. And that was our conviction. That was our bet. And it mostly played out that way. >> So, when you decided to start HashiCorp, you had Vagrant. Like, was the idea to like, you know, like invest in commercialize Vagrant? And did you go out to raise money or did you start doing it with, you know, bootstrap? How How did that go? >> It wasn't to commercialize Vagrant. So, what we had done is Armon and I both worked at this mobile ads company startup. There's like less than 30 people and we had built like with Python and C, like these really um rough prototypes of these ideas that I had in this notebook of like service discovery and um like an early version of Terraform, we called Launchy. We had DNS-based service discovery service discovery by connecting an off-the-shelf DNS server with Postgres and we did all these like hacky things, but they felt good. Uh and again, we get like get back to this like how things feel to me to motivate me. Like, it felt right, directionally right. I graduated the the the environment in Seattle was not very startup heavy at the time. It was basically everyone was like, "Are you going to work for Amazon or ar