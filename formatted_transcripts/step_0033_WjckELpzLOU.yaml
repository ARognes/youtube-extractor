en I wake up and before I stop working and before I leave the house something, I spend 30 minutes stop working. What can my agent will next? That's that's slow. What's a slow thing my agent could do for the next time. And I know it's going to drive here for an hour. It finished far faster than an hour, but you know, it's just like, oh, I need to do some library research. Um okay, find all the libraries that have these properties that are licensed in this way. And I was looking up some like HTTP3 stuff quick stuff. And so, find build that ecosystem graph for me. Um right before I left, I was working on something to do with this vouching system. And I didn't quite understand the edge cases of what I was doing. And I will think about that manually, but why not just start just start an agent to like look at this repo. And I use amps like consult the oracle, like think deeply about um what the edge cases might be. What am I missing? If I had another 2 hours to work, I wouldn't need the agent to do that. I would have done it myself, but I don't. So, why not have it do it? So, it's just part of my goal to always have one going. And I unfortunately don't have one going cuz I finished it all right now. >> [laughter] >> In in in interesting. And so, this agent running there is kind of do I feel correctly that it's now so natural that it doesn't get in the way of your own thinking? Like you do your own thinking and you do your work, but every now and then you glance and you you ping it or you start it or it's it's now it's so it's not distracting, right? Cuz I think that's >> Yes, I actually turn off all the agentic tools do this and I turn off the desktop notifications. Yeah. Um I I think the desktop notifications are for the most part a mistake. Um so, yeah, I turn those off. I choose when I interrupt the agent, not it doesn't get to interrupt me. Um so, for sure. And and there's another aspect where I think my engineering has changed where I try to identify the tasks that don't require thinking and the tasks that do require thinking. And and just delegate. Like delegate the work to an agent. Like sometimes it just feels productive to do the the non-thinking tasks and you're like, yeah, I did a lot today. You know, I got I got this. But but a lot of times I just try to just delegate get out. There's a lot of people that that, you know, say like you think less. And I think if you use the tools wrong, you do think less because you just like launch an agent and I don't know, go watch YouTube or scroll social media or something, but if you instead view it as a way to choose what you think about, then I think that you don't need to sacrifice that thinking. But I think the the problem is uh the majority of population probably won't do that. >> Yeah, but it's still I think it's good food for thought and it's good to hear from you on how you're using it and it's working for you. W- What What What did you start to to have this second agent running? What made the switch? Was it the models getting better or >> Yeah, I don't remember which model it was, but there was a certain I tried Claude Code right when it came out. It was just like March or May last year. >> Yeah, it was March, the beta, yeah, and the May public release. >> Okay, I I don't think I used the beta, so it was probably May. Um wasn't a huge wasn't super impressed, honestly. Um and then, I mean, really quickly by like the summer, at some point during the summer Oh, I remember. I remember. Um I saw so many positive remarks about it that then I started to get scared that I would be behind on how to use the tool. And so, I actually started forcing myself to I still didn't believe in it, so I would do everything manually, but I was forcing myself to figure out how to prompt the agent to produce the same quality result. I was working much slower because I was doubling the work and it was more than double because it was they're slow and it's we're going back and forth and I already had the work done and all the stuff, but I was forcing myself to do it. And you find stuff that I couldn't figure out. I couldn't like it just wasn't there yet, but then I found other stuff where it's like, "Oh, I naturally got to the same point that thousands of other people got to." Which is like, "Oh, if I do a separate planning step, it does so much better." And everyone got there. And then I figured out, "Oh, if I have a better test harness for it to execute, it does a lot better." And then, you know, I I think everyone starts with like no agents that I'm doing Claude that I'm doing anything. And Same thing I realized, oh if it makes a mistake and I add that just to agents.md, it never makes that mistake again. Like, oh. And like these these are just like incremental things that I recognize when I see people that are new or I've watched a couple live streams, I've lurked on live streams where where like kind of anti-AI people like try AI and it's one of those things where I'm like they're just swinging the hammer way way off, right? Like it's because you haven't It's the the thing is like it's as if it's it's as if someone tried to like adopt a git and they used it for an hour and decided they weren't more productive with it. Like it takes much longer than an hour to get proficient with git, but you put in the effort and then you reap the rewards later. And it's sort of the same thing to me with AI tools. What what would your first advice be for someone who is like not My first advice would be reproducing your work with an agent. And if you really really don't want an agent to code, reproduce the research part of your work with an agent. Um like there there's a lot of people where it's like I don't want it to write code for me for whatever reasons. Like but yeah, just kind of delegate some of the other research part. There's so many places it could be helpful. So it it doesn't need to take, you know, you don't need to pick up on the it must replace you as a person kind of propaganda. You could just find the the corners of where you work and and replace those parts. >> One thing that you give people is you give advice on for potential founders because you're a successful founder. You you've had an exit, you built up this awesome company. You get a bunch of emails from people asking, "Hey, I want to be a founder. What what's your advice?" And you you wrote about this, you you shared the email. But what can you tell us like what advice you typically give people and how is it received? >> Uh well, I usually have to say more specific uh because yeah, if if someone's like what could I do to be successful? One, I also always explain that you're consulting someone with survivorship bias. So you You to take that into account. Um but I'm willing to share my experience as a survivor, but just understand that there's survivorship bias. Um, but usually I ask for like what's what's something more specific? Like what are you trying to do? Um, and so we usually get to like should I open source a project or not? Or should I be remote or not? Or should I do enterprise versus and and I don't know. Um, but my my the most general advice I usually give people is startups are much longer than you think. Um, you're going to probably work on it for I I say imagine 10 years. A lot of people say 5 years, but I say imagine 10 years. Like is this really something you want to work on for 10 years? And is it something that like you need to have a certain amount of hubris in order to say I'm going to work on this for 10 years and I truly believe I'm going to do it better than anyone else. There's nothing behind that, no substance behind that other than hubris. So you need to have a certain amount of of ego and hubris in your head to make that, but not too much where you'll be blind to change coming in. So that's usually like the first advice I give. Cuz a lot of people have cool ideas, but they're going to burn out you know, relatively quickly. So uh, that's where I start. >> So currently you're advising some companies. What are you seeing with them? Like what what are startups doing these days? What are they doing differently than, you know, like earlier? How's that landscape? >> Uh, again, it's really contextual in terms of like if you're an AI startup, it's very very different. >> How are How are AI startups working differently? >> They are There's a lot of pressure to go faster than I've ever seen any startup. Um, I I think the industry is moving so fast that I don't advise any AI startups, but I've talked to some of them and it it's even as an advisor I feel like it's too much pressure because they are just being pushed to prove themselves quickly. Whether it's through traction or revenue or something, it's sort of like there's this mentality within that ecosystem where AI should allow you to go crazy fast. And in addition to that, there are a lot of companies moving crazy fast. um the change is happening. I think that's the one thing. Outside of that, I mean, like I said, it's it's just it's just a ton of opportunity in every space. Otherwise, it's a lot of the same stuff. I mean, it's the remote versus non-remote, open source versus non-open source. >> Do you see the role of software engineers changing now, especially at the AI-native companies where engineers like like yourself, they're actually being way more productive? They they can produce a lot more code, a lot more output. Are they being pushed into being like, you know, like wearing more hats, talking to the business, or being a bit more like a mini founder, if you will? >> I hesitate to say more productive. I I I view that there's an expectation that they could do more. I don't think that's necessarily more productive, but it's more like you should be able to, for example, build a full demo, design, everything for your You don't need a team to do that anymore, right? Like, you should be able to do that, at least from a demo perspective. There's no reason not to, because again, you could ship slop for that. That's fine. I mean, this is all same, but you should be able to research effectively, and and in a sense, handle more vague tasks. I'm seeing that a lot more, which is like just the capacity to experiment is so much higher, I would say. But then, when it turns into productionizing something, uh it feels similar to what it's always been. I I think that there's a lot of companies that are eating the yeah, the dog food of of of the AI companies of shipping whatever, and I think that's a little scary. >> Yeah, they look at Anthropic, and they're like, "Oh, they built Claude co-work in 10 days, and they'll be a billion-dollar company." They're freaking out of why they're not doing that. >> There I think a big change is from like a pre-seed perspective, or yeah, pre-seed perspective, where you would be like, "I need to raise a seed in order to build a prototype." That's like like, show me the prototype, because yeah, you should be able to build that really quickly for most things. There's still hard tech out there that you can't do that. >> So, you do a bunch of coding, you do a bunch of thinking about coding, as well, even as you're trying to fall asleep. What refills your bucket outside outside of coding outside of tech? >> Obviously like the the stereotypical things like just taking breaks and being with my family and things like that. But I mean I think the biggest thing is, you know, I am introverted. So just quiet solo time refills the most energy for me. Yeah, I live pretty close to the beach and just if I'm in a bad mentality, things aren't working, I'm feeling unproductive or something something's going on, like just closing my laptop and taking a walk outside. It like stuff like that helps a lot. I have a lot of hobbies and stuff, but it's it I think like just as a general recharge, it's it's that more than anything. I know there's a lot of people that's like going out with friends or something like that, then I like that, but that's not the full recharge for me. >> And what's a book that would you recommend and why? >> Um so I only I I pretty much only read fiction outside of news. >> Great. >> Great. Okay. Uh the most recent book of fiction I read is an older book and it it is an easy read. So I hope people are like not like oh he he's an idiot for reading this, but um it was What's it called? The The something life of Addie LaRue. It's just like kind of a romantic type of fiction novel, but yeah, it's just about it it's about I think it's like 10 years old. It's older now. But uh it's just about a woman who kind of sells her soul to live forever, but the cost was no one remembers her once they walk out the room. And yeah, it's just going through her whole life of losing all human connection, but she gets to live forever. Um what that is like and you know, I like reading fiction, so >> I like reading fiction at night. It I don't know. I don't know if it's escapism or just like you just like, you know, you get to live in different worlds. It's so so different to the coding or anything. It may maybe just helps me turns off the thing. I I personally I probably read way more fiction than I do professional non-fiction, honestly. >> Yeah, yeah, I'm I'm the same way. It's my version of TV, too. TV to me is more of a social activity. Like if if my wife wants to watch something together, like we'll watch a show. But if I'm alone, I'm not going to watch a show. I'm going to read, probably. >> Awesome. Well, thanks so much for going through all all of these details. It was just not great to hear from how you're working, the history of HashiCorp. This was all just really really interesting and motivating. >> Yeah, thank you. >> Thank you. I hope you enjoyed this [music] long and interesting conversation with Mitchell. One thing that really stuck with me from this conversation is Mitchell's [music] own rule for himself. Always have an agent that does something. Not necessarily coding, just doing something. For example, while he was driving to this podcast recording, he had deep research running. Before he leaves the house, he asks [music] himself, "What's a slow task that my agent could do while I'm gone?" An important part to all of this, he turns off all notifications. The agent does not get to interrupt him. He interrupts the agent when he's ready. Mitchell is in charge, and he has a buddy who does the work that he has delegated while he focuses on problem that he is solving. This is a nice challenge for anyone listening. Next time you step away from your desk, before you close the laptop, ask yourself, "What slow task could an agent be doing while you're gone?" If you enjoyed this episode, share it with a colleague who's thinking about where software engineering could be heading. And if you've not subscribed yet, now's a good time. We have more conversations like this one coming. Thanks, and see you in the next one.
