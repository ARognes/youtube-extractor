transcript: "\U0001F4D8 Everything I know about behavioral interviews from conducting nearly 1,000 of them as a Bar Raiser, now in one book: https://geni.us/BehavioralInterview-yt\n\nFrom building at Amazon in the early 2000s to selling a company to Google, Anish Acharya has spent his career chasing the edge of where the most ambitious people are working. He breaks down why enterprise software is oversold, how AI coding agents are unlocking a generation of builders, and what it takes to show up with a founder mindset no matter where you sit.\n\nGuest Links:\nhttps://a16z.com/author/anish-acharya/\n  / anishacharya  \n\n00:00 - The Advice Early Career Engineers Need to Hear\n01:30 - Always Be at the Edge\n05:14 - How an SVP Pushed Anish to Quit\n08:35 - Be the Founder in the Room\n09:55 - The Harsh Reality of Starting a Company in 2008\n23:46 - Coding Agents Are a Slot Machine\n29:21 - Why Managers Will Go Back to Being Hands-On\n30:23 - There Is No Ceiling on Ambition\n34:57 - Why Enterprise Software Is Oversold\n36:21 - Switching Costs Are About to Collapse\n47:28 - Apps Still Win Over Raw Models\n51:00 - Bearish or Bullish: Rapid Fire Round\n53:27 - Should You Still Get a CS Degree?\n55:11 - Will AI Token Prices Go to Zero?"
