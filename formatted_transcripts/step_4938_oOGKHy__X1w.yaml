transcript: Even though your products might look similar and look competitive, your positioning might have zero overlap. Like you'll see this from big companies even small companies acting like even though we're competitors like we can all win. They kind of paint this like rosy picture of like it's all of us doing stuff together. That's not true. You and another company are competing for alternate visions of the world. Just like sports like there two teams want to compete. They're going to like want to kill the other team. On some level they kind of respect each other cuz they're both at the top of their game doing something and it might not be something where like one side entirely wins with other side entirely wins, but there is real competition there. There are winners and losers and you do want to crush your opponents. People like to deny it cuz the public wants to believe this like kind of everything is like nice and positive type of thing. I don't think competition is negative. I am competitive and I do think about things in that way.
