transcript: "\U0001F4D8 I wrote the book on technical behavioral interviews, nearly 1,000 interviews worth of lessons in one guide. Grab it here: https://geni.us/BehavioralInterview-yt\n\nIf you want to be in the hot-seat for the next video like this, apply here: https://forms.gle/121P4FhVhxkBaPiq5\n\nAhmed is an AWS senior engineer with 12 years in the industry trying to break into staff — and he has the stories to get there. A four week migration with 20 partner teams, a disagreement with a principal engineer, two years leading a project end to end.\n\nWhat he's missing is knowing which ones to tell and how to tell them at the right level. Steve Huynh coaches him live on the three biggest things holding him back.\n\nCHAPTERS:\n00:00:00 - You Have Stories But Can't Tell Them\n00:01:51 - From Egypt to AWS Seattle\n00:02:57 - The Question That Separates Staff From Senior\n00:09:51 - You Didn't Answer the Question\n00:12:16 - Stop Saying We\n00:13:35 - Lead With Actions Not Background\n00:19:25 - Workshopping the Story Live\n00:22:36 - The Conflict Question Nobody Prepares For\n00:34:45 - The Principal Engineer Disagreement\n00:36:58 - Disagree and Commit\n00:41:39 - How to Handle Being Right\n00:48:26 - 20 Teams, 4 Weeks.\n00:54:46 - Scope Is Not the Same as Impact\n00:59:50 - Fixing the Headline\n01:15:47 - Steve's Final Debrief\n01:16:11 - The 3 Pillars"
