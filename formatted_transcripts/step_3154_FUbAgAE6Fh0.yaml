transcript: In almost every language, you have a switch for an enum, and you handle cases, and then you might have a default [music] or everything else, and sometimes you forget one of them. In Rust, you cannot do that either, right? >> That's right. So, in Rust, it's not called switch, it's called match, but it's the same idea. You can match on your enum, and then you can have a branch for each possibility it might be, and if you are missing one, that's a compiler error. And I think this kind of leads [music] to another way that Rust really helps with reliability, which is that if you're refactoring, I think Rust is really good at telling you all the places you need to update. And then, I just fix the compiler errors until the compiler stops shouting, and then, once I've done that, I've updated every place I need to update.
