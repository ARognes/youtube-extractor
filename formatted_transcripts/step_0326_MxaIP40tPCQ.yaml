transcript: Almost every org you work at, you're going to have to build trust because you you won't be able to do the technical piece without without the people there. So, it's not cuz cuz you won't have the permissions to the systems that you need to access. You don't know how the system works cuz you're you're you're day one. So, if if you can't build trust, they're not going to tell you or make your life easier to figure out how to help them, which which seems counterintuitive cuz it's like they hired you to be there and now they're not going to help you solve the problem. They're going to waste 10 to 50,000 dollars to sabotage your I mean, they will. They may. Like if you're a jerk and you you show up and you're like, I know everything. I build every system. I work for Google. I don't know like they won't want to they won't want to work with you. So, you got to be a person you want to work with.
