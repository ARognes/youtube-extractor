r and right here in the top left you can click on the script library and in the script Library you can just simply scroll down to the construct selected elements into a new drawing you can click on that and you can install this script it's that easy but right now um I already have the script here the way you can add it to the right hand side panel right here is by long clicking on the icon so now I'm going to Long click that's going to remove the icon from here so you can see it was now removed and I also get the message here at the bottom and then if I again along click on this then the icon is added to my site panel for easy access and this is a tool I use regularly so I think it is really good to place it on the right panel at least for me so what I want to show you is now I'm going to select this text and I'm going to click the deconstruct selected elements into a new drawing button and when I do this the script asks for a name for the new drawing so I'm going to call it construction of oppositions this is going to be the name of my new drawing and I'm just going to click ok so what happens you can see on the right hand side this new drawing was created and on the left hand side this is no longer separate elements but it's this image right here I can also prove it to you if you would not believe me so if I put this circle here then if I click back it will refresh and the circle will appear so with this I created a separate note that only includes this but in the original drawing I still have the image in there and now if I go back to my note with Wiki I can just simply click here on the visual Moc note and what I can do is simply press command p and I'm going to type insert image or Excalibur drawing from your Vault I click on this and I'm going to type can destruction of opposition so here's my drawing and when I click ok then voila I have the drawing right here and of course I can zoom in and now I can delete this text I no longer need this I'm just going to place this right here and now I have reference not only to Albert rothenberg's quote but also to the double bubble map which is an excellent way to compare oppositions that is a subject for another video I'm going to include a link to my discussion about the eight thinking maps and the double bubble map if you want to explore that further but what I want to show you now is going back to my main Vault here you can see that this is my note about Vicky's presentation I have this quote from Albert Rothenberg here and if I look now at my map then I'm going to find here the actual drawing so construction over positions is the most Etc if I click on it that will bring up this note and here I already see that this image this Atomic visual idea is used in two different places it's used in my Book on a page for how to take smart notes so right here the one that you also saw earlier and you can see my note right there as well as you can see it in Vicky's note so if I come back here to Vicky's note you can see the item here as well this is a pattern that I regularly do with all my notes whenever I'm thinking about something in a visual way I think about references that I have in my notes and I use the the construct selected elements script to carve out parts of the note that I want to reuse and with this I'm able to create links between my notes that makes my Obsidian World my visual thinking notes super connected and super engaging because through the ReUse of images or parts of images I am able to create Connections in my thinking so I hope you found this quick summary helpful if you want to learn more I want to remind you that the registrations for cohort for of the visual thinking Workshop are open the cohort will start at the end of May and will extend until the very beginning of July and we're going to be exploring deconstructing Greatness by Ron Friedman so this time around I'm announcing the book that we are going to be processing and it's going to be six intensive weeks