transcript: My name is Bob Raybold and I've written two books describing a tool that helps us change our mindset. Sitting next to me is my grandson Sam Froer. I've watched him use this same tool and overcome significant challenges in his life. Personal challenges that almost took him down. Struggles in business where he got to the bitter edge. And then the tool allowed him to complete the thing that he was trying to work on. Being stuck doing something he didn't really like and using the tool to start it. Give me a couple of examples of those. Yeah. Using the tool changed my life. I went from being stuck in a job where I wasn't feeling fulfilled and wondering what did life have in store for me and and what was my place in it to beginning to use the tool and not worrying about how I was going to get there, just starting to enjoy and happily know here's where I want to be. Here's where I can start envisioning that I already am and that allowed me to go from being an employee in someone else's company to running and managing over a hundred million dollar real estate portfolio in less than five years and that kind of growth and getting to enjoy it while you're growing like that does not happen often. It was because of something special. It was because of this tool that I used that I was able to not only have historic success, but I was able to enjoy that journey while I was doing it as well. It That changed my life. And the interesting thing is he was doubling his year income every year Mhm. and that wasn't enough. He had to be his own boss and triple and quadruple his income. But he did it because he changed his mindset using the tool. He got alignment between his subconscious and conscious mind using the tool. And that allowed him to change his mindset. And once we have the right mindset, then our mind is helping us and our higher power is helping us, and we can achieve almost anything that's worthy of us. Good luck. You'll enjoy using the tool. I've written two books. They're almost identical. The first is Success by Emotions. The second is Believing by Emotions. The only difference is that this is politically correct, so we can sell it to schools, businesses, the military, where talking about a higher power isn't appropriate. And this is the same book discussing that the real power behind this tool comes from a higher power, whether you believe in a higher power or not. Thanks for being with us. Good luck.
