transcript: Linus Torvalds is very well known for crashing out in the Linux kernel, swearing at developers, swearing in the comments, just in general chewing people out over stupid things being done. Usually he's right. There are occasions where maybe he went a little bit too far on people that frankly didn't deserve it. And considering all the new attention that Linux is getting from all these distros that people are talking about, from hardware like the Steam machine, the Steam Deck a couple of years ago, and in general, Linux just becoming more and more of a thing that people talk about, plus it just passing the 35th anniversary of the Linux kernel project, I thought it might be fun to go back and look at some of those crash outs. Now, there is one specific one that I'm not going to be including here because you've all seen it already, and that's the NVIDIA one. And rather than just rehashing one everyone has seen, I want you to learn something new. Let us start off relatively calmly with something which is not really a crash out per se, but does preempt a lot of the other stuff we're going to be talking about. From 1996, in reply to someone saying, I gave up using curse words to impress somebody 30 years ago. Profanity and comments are not about impressing people. This is about communication. Profanities communicate something, be it good or bad, and they certainly tell you something about the mindset of the person who wrote the code. Nobody has been advocating adding profanities to the code, and in fact, almost everybody seems to agree that at least part of the swear words should go. However, and this is the big thing about this, a wholesale removal of profanities is just stupid and small-minded. Removing profanities without regard to the context or the author who wrote them is a lot worse than the ugly comments there in the first place. If this discussion had started with a simple comment like, um, maybe we shouldn't be nasty in printed messages, and maybe we should comment out the fucking sun blows me message, then I'd have been more than happy to comply with that. However, it is not okay to just act like a mindless robot and just remove every profanity in sight. That way lies book burning and forbidden thoughts, sugarcoating it with moral reasons, thinking you have the moral right to suppress others is the ultimate immorality. Thus endeth lessons in morality 101. I started with this one because, well, for a long time, and even to this day, there's still plenty of profanity in the kernel. So let us get right to that. Let's jump up to 2017 with a reply to a patch from Keyes Cook. Keyes, stop this idiocy already. These have been false positives. They haven't actually been bugs in the code. They have been bugs in the checking code. In two years, when this code is actually trusted, that would be one thing. But right now, it's a fucking disgrace. And you are in denial about the fact that it's checking that is broken, not the code, and are making excuses for shit. That bug is broken. Claiming there was no same way continue is complete and utter bullshit. Seriously, this is the kind of utter garbage that drives me bonkers. Introducing new code that kills the machine, and then not owning the fact that it was your code that was broken, and instead saying, but we had to kill the machine. So get rid of the bug, and get rid of the excuses. We know this code is likely to find these kinds are not really a bug, but the checker code does something we didn't use to do situations. So instead of killing the machine, the code should damn well warn. That way, we're going to actually get reports that can improve the code, instead of having people with dead machines with no idea why, and nervous about enabling the bug code that can make things so much worse. Comprende? None of this. There is no way to continue bullshit, because it is pure and utter shit. Next up to 2007, we have a question about Odirect. Odirect is a kernel feature to bypass the operating system's cache. Now, most of this is just generally answering a question about what Odirect does, so we're going to skip over the beginning part. As a very concrete example, people think they can just bypass the OS IO layers and just do the right directly. It sounds like something simple and obvious. It sounds like a total no-brainer, which is exactly what it is. If by no-brainer you mean only a person without a brain will do it, because bypassing the OS has all the subtle effects on both security, and on fundamental correctness. The whole point of an OS is to be a resource manager, to make sure that people cannot walk all over each other, and to be the central point to make sure that different people doing allocations and deallocations don't get confused. In the specific case of a file system, it's trivial things like serializing IO, allocating new blocks on the disk, and making sure that nobody will see the halfway state when the dirty blocks haven't been written out yet. In short, the whole let's bypass the OS notion is just fundamentally broken. It sounds simple, but it sounds simple only to an idiot who writes databases and doesn't even understand what an OS is meant to do. For some reason, DBP will think they don't need one, and don't ever seem to really understand the concept of security and correctness. They understand it sometimes within their own databases, but seem to have a really hard time seeing past their own sandbox. On the topic of security, let's talk about Linus Torvald's security issues and responsible disclosure. By the way, you may not like this since you're so focused on security. One reason I refuse to bother with the whole security circus is that I think it glorifies and thus encourages the wrong behavior. In this context, he was talking about like ranking the vulnerabilities, like giving them a score, all of this good stuff. It makes heroes out of security people as if the people who don't just fix normal bugs aren't as important. In fact, all the boring normal bugs are way more important just because there's a lot more of them. I don't think some spectacular security hole should be glorified or cared about as being any more special than a random spectacular crash due to bad locking. Security people are often the black and white kind of people that I can't stand. I think the OpenBSD crowd is a bunch of masturbating monkeys in that they make such a big deal about concentrating on security to the point where they pretty much admit that nothing else matters to them. To me, security is important, but it's no less important than everything else that is also important. There is a reason I ease you in here. And it, um, it only gets better. But first, let's just bring the heat back down just a tiny little bit. In reply to Richard J. Moore back in 2002, are you sure? Isn't what Linus is saying is that he understands that some problems can be solved using dumps, some from the oops message, and some by source code introspection, and some by other means. But he's not interested in a timely resolution. Now, a lot is said here, and a lot of it is frankly not super important, so we'll jump around a bit. Since I'm not personally convinced, it's not going into my tree. It's as simple as that. I take stuff that I feel is good, often that feeling of goodness comes from trusting the person who sends it to me, simply by past performance. At other times, it is because I think the feature is cool, or well done, or whatever. Hint, if you want stuff in my tree, make me trust you, or work on things that I feel are innately interesting, don't bother drag me into your flame wars, and trying to convince me that I must apply your patches. If it doesn't go into my tree, is that bad? No. Open source is all about other people being able to make their changes. It's by no means means that those changes have to be accepted back. The license basically boils only down to that I must be able to accept them back. But the really important thing, the thing that really makes a difference is that you, your dog, and your company can make your own changes. If it doesn't have to happen in my tree, then whose tree does it have to happen in? Doesn't much matter actually. You can keep it in your tree for all I care. OSDL has already picked it up and apparently maintains it in their tree. The only thing that matters is whether it gets used or not, and whether it proves itself. OSDL is the open source development labs, one of the two organizations that merge together to create the Linux Foundation. Never whine about a patch. I know whining works for a lot of people. Oh, for Christ's sake, I'll just do it to get them off my back. But it works remarkably badly with me. Trust me on this. Was this clear enough? Any confusion on any particular issue? In short, convince somebody else. So far, the only thing the discussion has convinced me of is that people somehow seem to think they are entitled to being merged into my tree. Tough. It ain't so. That tree is called Linus Tree for a reason. The only thing you're entitled to is to have your own tree. This entire discussion was about someone being really annoyed that their patches weren't being merged into the kernel. And Linus just saying, well, I, I, I run things here. I am the owner. It's my name. Go away if you don't like it. Let's jump up to the modern era with patches from 2025, patches for RISC-V in the 6.17 merge window. These patches were sent a little bit late and they were outside the time that Linus was going to accept them. No. This is garbage and it came in too late. I asked for early pull requests because I'm traveling and if you can't follow that rule, at least make the pull requests good. This adds various garbage that isn't RISC-V specific to generic header files. And by garbage, I really mean it. This is stuff that nobody should ever send me, never mind late in a merge window. Like this crazy and pointless make U32 from two U16 helper. That thing makes the world actively a worse place to live. It's useless garbage that makes any user incomprehensible and actively worse than not using that stupid helper. If you write the code out as A, bit shift 16 plus B, you know what it does and which is the high word. But you need to put a cast to make sure that B doesn't have the high bits that pollutes the end result so maybe it's not going to be exactly pretty but it's not going to be wrong and incomprehensible either. In contrast, if you write make U32 from two U16, you have not a fucking clue what the word order is. In other words, you just made things worse and added that helper to a generic non-RISC-V file where people are apparently supposed to use it to make other code worse. So no, things like this need to get bent. It does not go into generic header files and it damn well does not happen late in the merge window. You're on notice. No more late pull requests and no more garbage outside the RISC-V tree. Now, I would hope there is no garbage inside the RISC-V part but that's your choice. But things in generic headers do not get polluted by crazy stuff and sending a big pull request the day before the merge window closes in hope that I'm too busy to care is not a winning strategy. So you get to try again in 6.18 early in that merge window and without the garbage. As for another modern one, let's talk about useless links in the commit messages. I've pulled this but the commentary is strange and the patch makes no sense to me so I un-pulled it again. And damn it, this commit has that promising link argument that I always hoped would explain why this pointless commit exists. But as always, that link only wasted my time by pointing to the same damn information that was already there. I was hoping that it would point to some oops report or something to explain why my initial reaction was wrong. Stop this garbage already. Stop adding pointless link arguments that waste people's time. Add the link if it has additional information. Basically, this just linked back to itself as a way to explain itself which is not an explanation. Damn it. I really hate those pointless links. I love seeing useful links but 99% of the links I actually see just point to stupid useless garbage that I only waste my time again. So I have not pulled this. I'm annoyed by having to even look at this and if you actually expect me to pull this, I want a real explanation and not a useless link. Yes, I'm grumpy. I feel like my main job, really my only job, is to try to make sense of pull requests and that's why I absolutely detest these things that are automatically added and only make my job harder. I'm CCing Constantine again because this is a prime example of why that automation hurts and he was arguing in favour of that shit just last week. Can we please stop this automated idiocy? Let's go to 2015 with Linus Torvald's take on D-Bus. And this is the one that made me want to make this video because I feel like a lot of people do not know about this one. I am still expecting to merge it mainly for a rather simple reason. I trust my sub-maintainers and Greg in particular. So when a major sub-maintainer wants to merge something, that pulls a lot of weight with me. That said, I have to admit to being particularly disappointed with the performance argument for merging it. Having looked at the D-Bus performance and come to the conclusion the reason D-Bus performs abysmally badly is just pure shit user space code, I am not at all impressed by the performance argument. We don't merge kernel code just because user space was written. This is a phenomenal line. This is an absolutely phenomenal line. Every time I see it, every time I see it, I lose it. The kernel code has higher standards and yes, that also means that it tends to perform better, but no, user space code is shit is not a valid reason for pushing things into the kernel. So frankly, the better performance argument is bogus in my opinion. That still leaves other arguments, but it does weaken the case for K-D-Bus quite a bit because go out and read pretty much any argument for K-D-Bus and the first argument is always performance. The articles never say because the user space D-Bus code is crap though. Here we have a patch set about dealing with signing keys. David here says, Can you pull this patch set please? Not without a lot of discussion first. Quite frankly, this is fucking moronic. The whole thing seems to be designed around stupid interfaces for completely moronic reasons. Why should we do this? I already dislike our existing X509 parser and this makes the idiotic complicated interfaces go up to 11. In reply to Matthew saying, There's only one signing authority and they only sign PE binaries. Guys, this is not a dick sucking contest. If you want to parse PE binaries, go ahead. If Red Hat wants to deepthroat Microsoft, that's your issue. That has nothing whatsoever to do with the kernel I maintain. It's trivial for you guys to have a signing machine that parses the PE binaries, verifies the signatures, and signs the resulting keys with your own key. You already wrote the code for Christ's sake. It's in that fucking pull request. Why should I care? Why should the kernel care about some idiotic we only signed PE binary stupidity? We support X509, which is the standard for signing. Do this in userland on a trusted machine. There is zero excuse for doing it in the kernel. Whilst I said I wasn't doing the Nvidia one, there is a famous one I think we have to talk about, and I think you're going to notice it as we go through it. This is about some audio problems that were breaking pulse audio. Mauro, shut the fuck up. It's a bugle right in the kernel. How long have you been a maintainer, and you still haven't learnt the first rule of kernel maintenance? If a change results in user programs breaking, it's a bug in the kernel. We never, ever blame the user programs. How hard can this be to understand? To make matters worse, the commit is clearly total and utter crap, even if it didn't break applications. Noent is not a valid error return from an IOCTL. Never has been, and never will be. Noent means no such file and directory, and is for path operations. IOCTLs are done on files that have already been opened. There's no way in hell that noent would ever be valid. Shut up, Mauro, and I don't ever want to hear that kind of obvious garbage and idiocy from a kernel maintainer again. Seriously. We do not break user space. Seriously. How hard is this rule to understand? We particularly don't break user space with total crap. I'm angry because your whole email was so horribly wrong, and the patch that broke things was so obviously crap, the whole patch is incredibly broken shit. It adds an insane error code, noent, and then because it's so insane, it adds a few places to fix it up. The fact that you can even try to make excuses for breaking user space code and blaming some external program that used to work is just shameful. It's not how we work. Fix your fucking compliance tool because it's obviously broken, and fix your approach to kernel programming. Let us leave the LKML briefly and go over to GitHub. Now, I do have to use an archive for this one because they have closed the PRs, and because the PRs are closed, they're no longer available on the website. Torvalds doesn't typically use GitHub, but this is one of the rare occasions he did. I don't do GitHub pull requests. GitHub throws away all the relevant information, like having even a valid email address for the person asking me to pull. The diff stat is also deficient and useless. Git comes with a nice pull request generation module, but GitHub instead decided to replace with their own totally inferior version. As a result, I consider GitHub useless for these kinds of thing. It's fine for hosting, but the pull requests and online commit editing are just pure garbage. I've told GitHub people about my concerns, and they didn't think 