d don't all like each other. There are certain people I refuse to work with, for example, they may be good engineers, but they just aren't people I can work with. And hey, I don't actually think we've personally had any problems, and I realize you may react very strongly and get nervous about us having problems, but realistically, do you actually expect to like all the other kernel engineers? And equally importantly, not everybody has to like you or necessarily think they have to be liked by you, okay? Because if you want me to act professional, I can tell you that I'm not interested. I'm sitting in my home office wearing a bathrobe the same way I'm not going to start wearing ties. I'm also not going to buy into fake politeness, the lying, the office politics, and backstabbing, the passive aggressiveness, and the buzzwords, because that is what acting professionally results in. People resort to all kinds of nasty things because they are forced to act out of their normal urges in unnatural ways. Why did I spend so much time on this one? Well, this interaction and then the discussions that stemmed from it, these are often cited as the reason why Linus Torvalds briefly stepped down from the Linux kernel project and also they first introduced their code of conduct. This interaction changed both the Linux kernel and Linux as a community forever. You know what? I actually lied. There is one more and that is Linus Torvalds' stance on the GPLv3. I'm not saying there's anything wrong with having two positions. In many ways, I'm saying the opposite. I'm saying that we should expect people to have different opinions, everybody has their own opinion anyway, and expecting people not to have different opinions, especially programs who are rather opinionated a lot in the first place, is just not realistic. There's absolutely nothing wrong with having a very wide consensus among very varied developer base. In fact, I think that's great. And the reason I'm speaking out against the GPLv3 is it is trying to sort the chaff from the wheat. The FSF is apparently not happy with a wide community appeal. They want their standpoint to be the one that matters. I have all through this discussion tried to explain the great thing about the GPLv2 is that it allows all these people with totally different ideals to come together. It doesn't have to be perfect for any particular group. Its very perfection comes not from its language, but from the very fact that it's acceptable to a very wide group. When the FSF tries to narrow it down, they kill the whole point of it. The license suddenly is not a thing to get around and enjoy. It's become a weapon to be used to attack the enemy. He in the US, the only watchable TV news program is The Daily Show with Jon Stewart. One of his fairly recurring themes is about how US politics is destroyed by all these passionate and vocal extremists. And he asks whether there can ever be a really passionate moderate. Can you be passionate about the middle road? Damn it. I want to be a passionate moderate. I'm passionate about just people being able to work together on the same license without this extremism. And that right there is a good place to end it. This video end up being considerably longer than I thought it was going to be. I'm just looking at my clips over here. I don't know how long it is. Um, apologies. But, you learned something hopefully about Torvald's ranting and, um, if you have any ones that maybe I missed out, any additional ones you'd like to see, let me know in the comment section down below. So, if you liked the video, go like the video, go subscribe as well. If you're on mobile, go and hype the video. And if you really like the video and you want to become one of these amazing people over here, check out the Patreon, SubscribeStar, Liberapay, linked in the description down below. That's going to be it for me and... he's plenty more years left to say something crazy.
