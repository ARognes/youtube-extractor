olute crap you mark for stable. Of course, I suspect I see why this happens. Greg doesn't shout as much as me, and he has been taking any random patch into stable, so the end result is that people think it's easier to mark things for stable than it is to show that it's actually stable, and they are trying to use stable as a way to get any random late fixes in. Do you really not see this? Greg, the reason you get a lot of stable patches seems to be that you make it easy to act as a doormat. Clearly, at least some people say, I know this patch isn't important enough to send to Linus, but I know Greg will silently accept it after the fact, so we just wait and mark it for stable. You may need to learn to shout at people. And that seemed, from Linus, like a relatively normal reply, and it was, and the thread continued on relatively normally, but a different thread was made. This was started by Sarah Sharp. Seriously, guys, is this what we need in order to get improved stable? Linus Torvalds is advocating for physical intimidation and violence. Ingo Molnar and Linus are advocating for verbal abuse. Not fucking cool. Violence, whether it be physical intimidation, verbal threat, or verbal abuse, is not acceptable. Keep it professional on the mailing list. Let's discuss this at Colonel Summit where we can at least yell at each other in person. Yeah. Just try yelling at me about this. I'll roar back louder for all the people who lose their voice when they get yelled at by top maintainers. I won't be the nice girl anymore. And Torvalds reasonably matched the energy here. That's the spirit. Greg has taught you well. You have controlled your fear. Now release your anger. Only your hatred can destroy me. Come to the dark side, Sarah. We have cookies. After what seemed like a bit of friendly back and forth, we had this one from Sarah. However, I am serious about this. Linus, you're one of the worst offenders when it comes to verbally abusing people and publicly tearing their emotions apart. I'm not going to put up with that shit anymore. And that's when Linus realized this wasn't a joke. This wasn't like a bit of banter. This was going to become a flame war. Yes, and I do it partially, mostly because it's who I am and partially because I honestly despise being subtle or nice. The fact is, people need to know what my position on things are. And I can't just say, please don't do that because people won't listen. I say on the internet, nobody can hear you being subtle and I mean it. And I definitely am not willing to string people along either. I've had that happen too. Not telling people clearly enough that I don't like their approach. They go on to re-architect something and get really upset when I'm not willing to take their work. Sarah. First off, I don't have that many tools at hand. Secondly, I simply don't believe in being polite or politically correct. And you can point at all those cultural factors where some cultures are not happy with confrontation and feel free to make it about gender too. I think that's almost entirely cultural too. And please bring up cultural sensitivity while you're at it and I'll give you back that same cultural sensitivity. Please be sensitive to my culture too. Google management by Percoleli. Do you really want to oppress a minority because Finns are a minority compared to almost any other country? If you want to talk cultural sensitivity, I'll join you, but my culture includes cursing. And some of the above is written tongue-in-cheek, but all of it is also serious. I really fundamentally believe that being honest and open about your emotions and core process is good. And because it's damn hard to read people over email, I think you need to be more honest and more open over email. I'm generally nicer in person. Not always. And yes, I'll happily be part of that discussion at the Colonel Summit, but I think you also need to be aware that your high horse isn't necessarily all that high. This thread went on for a