transcript: '{"content":"\n[0.0s] Hey, I''ve been wanting to talk to you\n[1.28s] for a while about something that I think\n[2.88s] software developers and people on\n[4.84s] software projects don''t talk about\n[7.04s] enough, which is how we deal with\n[9.44s] mistakes. I''ve made a lot of mistakes in\n[12.12s] my career, and so the last thing for me\n[14.52s] to do would be to try to convince you\n[16.28s] that if you have the right skills,\n[17.88s] you''re not going to make mistakes\n[19.08s] because you just are. But I want to talk\n[20.72s] to you a little bit about why I think we\n[22.96s] make so many mistakes on software\n[24.84s] projects and how you can use that to\n[26.56s] your advantage. Most people kind of base\n[29.16s] their value of each other on a software\n[31.16s] project just purely based on their\n[32.92s] ability to perform, to get stuff done,\n[35.4s] to please people. And the thing I think\n[38.2s] we often forget on software projects is\n[40.6s] we''re not working on software to please\n[43.08s] everybody at the company. We''re working\n[45.08s] on software to provide a service to our\n[47.52s] customer. And so, if the company is set\n[50.32s] up in such a way that you just feel like\n[52.76s] you''re constantly having to worry about\n[54.44s] how other people look at your work so\n[56.4s] that they''ll either blame you or not\n[58.24s] blame you. That doesn''t actually create\n[59.84s] an environment where people have the\n[61.84s] safety to be able to experiment and come\n[64.6s] up with really great solutions for\n[66.24s] customers in the market. In general, I\n[68.28s] think most software companies and most\n[70.6s] products in the majority of their life\n[72.44s] cycle, they''re not suffering from a\n[74.2s] problem of needing to get stuff out\n[76.12s] quicker. They''re suffering from a\n[77.52s] problem of needing to get the right\n[79.32s] stuff out that actually is going to make\n[81.72s] money for the company. And it''s easy for\n[84.12s] everybody to just get completely lost in\n[86.56s] that fact when they''re so concerned\n[88.44s] about getting a raise and making sure\n[90.64s] they''re not seen as doing anything\n[92.04s] wrong. So, I wanted to make this video\n[93.72s] today to help you understand some of the\n[96.04s] things that I think I learned the hard\n[97.88s] way, that if you get good at these\n[99.44s] things, you''ll be able to deal with\n[101.12s] mistakes on software projects and not\n[103.52s] look at it as something that''s really\n[104.92s] threatening you at all. And instead to\n[106.72s] just look at it as something that''s\n[108.08s] natural that happens on every software\n[110.24s] project, and it''s just a skill you can\n[111.96s] learn to develop, and it''ll really help\n[113.96s] you stand out from a a of other more\n[115.92s] junior developers that haven''t quite\n[117.92s] learned this yet. So, first let me give\n[119.84s] you like three examples of mistakes that\n[122.56s] you probably see happen on software\n[124.4s] projects. And all three of these,\n[126.0s] they''re unavoidable. They''re not\n[127.68s] mistakes that could have been avoided if\n[129.64s] you had the perfect software development\n[131.76s] process in place. I firmly don''t believe\n[134.56s] that there''s ever going to be a perfect\n[137.0s] software project or a perfect software\n[139.12s] process. There''s always going to be\n[140.959s] things that are either flawed or can''t\n[143.12s] quite be the way we''d like them to be\n[144.72s] just because of the way the business is\n[146.32s] set up. Now, that doesn''t mean you\n[147.88s] should just give up on improving things,\n[150.08s] but it also means sometimes we have to\n[152.0s] decide between trying to change\n[153.8s] something and trying to accept something\n[156.2s] that just we can''t change and be okay\n[158.48s] with it and do the best we can within\n[160.4s] it. The first mistake I see all the\n[162.2s] time, I know you''ve run into this, is in\n[164.44s] requirements or user stories, whatever\n[166.68s] you want to call them. And this how this\n[168.44s] usually happens to me is a team will be\n[170.72s] working with a product owner or UX\n[173.04s] department or somebody like that. be\n[175.32s] looked at as the people have to decide\n[177.28s] what is the product going to actually\n[179.4s] do. And the developers might have some\n[181.48s] input to it, but ultimately, there''s\n[183.44s] people at the company that are sort of\n[185.2s] looked at as they''re responsible for. In\n[187.84s] other words, if there''s something wrong\n[189.16s] with them, it''s their problem, the\n[190.64s] requirements. And in my experience, and\n[192.959s] I''m sure you''ve experienced this, too,\n[195.28s] on most software projects, the person\n[197.56s] who''s the product owner, no matter how\n[199.44s] much they know their customer and how\n[200.84s] much they know technology, they don''t\n[202.72s] know every little detail of what it''s\n[205.0s] going to take to make that work as well\n[206.88s] as a developer will. So, it''s natural\n[209.04s] that when you take a product owner and\n[210.56s] he or she has a conversation with a\n[212.6s] developer, that''s going to bring out all\n[214.72s] kinds of new questions that the product\n[217.16s] owner originally wasn''t faced with and\n[218.959s] the developer didn''t even know that they\n[220.64s] had to deal with. And I think it can be\n[222.56s] looked at as somebody''s making a mistake\n[225.12s] if we forget something. And what often\n[227.04s] happens to me is there''ll be something\n[229.04s] really important to the product owner,\n[230.84s] and they just won''t communicate that to\n[232.68s] me. And I''ll go off and start developing\n[234.96s] it, and I''ll get halfway through\n[236.32s] developing it, and all of a sudden\n[237.84s] they''ll come to me like in the middle of\n[239.44s] a sprint or if I''m doing Kanban, you\n[241.44s] know, in the middle of that task and be\n[242.96s] like, \"Hey, I just remembered there''s\n[244.88s] this really important thing for our\n[246.56s] customer. Can you make this quick\n[248.08s] change?\" And it can be easy for me. I\n[250.52s] usually get really frustrated and just\n[253.04s] be like, \"Oh God, I was just halfway\n[255.44s] through coding this. It took me a lot of\n[257.359s] work just to get here. Now you want to\n[259.16s] change this thing? to have to go through\n[261.16s] and recode everything.\" And I used to\n[263.28s] always look at that like that person\n[265.28s] made a mistake. Like it''s something\n[267.4s] wrong with the product owner or the\n[269.04s] wrong with the product manager that they\n[270.88s] couldn''t think of that ahead of time.\n[272.56s] And the longer I''ve been developing\n[274.2s] software, you know, over two decades\n[276.0s] now, I''ve just realized it doesn''t\n[277.6s] matter what you''re building. People have\n[279.64s] to communicate and they have to try to\n[281.56s] figure out what they think they need and\n[283.56s] then give that as input to developers\n[285.72s] when we write code. And because of\n[287.32s] there''s humans involved, there''s not\n[289.12s] algorithm at least we''ve come up with\n[290.68s] yet that can just decide what people\n[292.52s] want and then program it. We''re going to\n[294.68s] say what we think the product needs to\n[296.36s] do, and we''re going to forget things.\n[298.28s] And so releasing your product owner or\n[300.6s] other people from the obligation to feel\n[302.919s] like they have to be perfect, I think is\n[304.84s] something that''ll really help you as a\n[306.4s] developer. When you get on a project, if\n[308.52s] you can kind of have the mindset, I''m\n[310.32s] going to do the best job I can to try to\n[312.16s] understand what the product owner and\n[314.2s] you know, whoever else on the team is\n[315.76s] involved with deciding where the product\n[317.32s] goes, wants. But ultimately, I''m going\n[320.0s] to prepare myself mentally that, \"You\n[322.2s] know what? I''m probably going to get\n[323.36s] interrupted a couple if not many times\n[325.72s] in the middle of the project with things\n[327.4s] that the product owner realizes that\n[329.32s] they wanted that they didn''t communicate\n[331.12s] to me at the beginning.\" And stop\n[332.64s] looking that that as the product owner''s\n[334.76s] doing a bad job and just realize he or\n[337.12s] she is human and they''re going to forget\n[339.919s] things, period. And just let go of that\n[342.48s] expectation that they''re going to be\n[343.84s] perfect. The second big area that lots\n[346.32s] of teams make mistakes, and I certainly\n[348.56s] have is I think as software developers\n[350.68s] we tend to underestimate all the work\n[353.8s] that''s involved in getting something\n[355.16s] done that we''ve been asked to build and\n[356.6s] I think some of it is just because it''s\n[358.44s] a lot of work mentally to think through,\n[361.56s] you know, what are all the components\n[363.2s] and how many, you know, databases do I\n[364.96s] need to connect to and how much do I\n[366.44s] need to change the configuration, right?\n[368.0s] I mean it depends what you''re building,\n[369.88s] but thinking through, you know,\n[372.04s] everything that''s got to be constructed\n[373.76s] and then deciding what tasks that\n[375.4s] involves to try to get some idea of how\n[377.68s] much the work is going to take to do\n[379.36s] which is incredibly difficult, right, in\n[381.68s] software development. I think we make\n[384.08s] mistakes there naturally. You know, I as\n[386.52s] a developer, gosh, I still do this to\n[389.04s] this day. I do the best job I can trying\n[391.24s] to understand what''s supposed to be\n[392.6s] built and I come up with acceptance\n[394.16s] criteria and I describe it and I, you\n[396.16s] know, I think I got a handle on\n[397.56s] everything that needs to be built and\n[398.84s] changed and I go in there and there''s\n[400.72s] always stuff that I find that there''s\n[402.6s] just no way I could have predicted. And\n[405.2s] then it gets down to now I got to\n[407.08s] actually go admit that I made a mistake,\n[409.48s] which is what I''m going to talk to you\n[410.68s] about in this video, but it''s just\n[412.52s] natural. It''s not because I''m a sloppy\n[414.52s] developer or you''re a sloppy developer.\n[416.48s] It''s just because in this industry\n[418.36s] software development is so complex and\n[420.68s] there''s so many moving parts and there''s\n[422.64s] so much information that the product\n[425.08s] owner or managers or other people in\n[426.96s] your company have to communicate to you\n[428.88s] as a developer that can get lost in\n[430.8s] translation. It''s just the opportunity\n[433.08s] for developers to overlook work because\n[435.48s] of how much pressure they''re under and\n[437.16s] how much they''re trying to understand up\n[439.08s] front, I think it''s natural that\n[440.96s] developers are going to make mistakes.\n[442.48s] And so if you''re a product owner or a\n[444.08s] manager, I think the more you can do to\n[446.48s] really release developers of the\n[448.32s] obligation, look, I''m going to expect\n[450.2s] you to never forget tasks or never\n[452.68s] realize things are more complex than\n[454.64s] they are because I think that''s just a\n[456.36s] an illusory ridiculous organization\n[458.919s] that''s not really operating within the\n[460.64s] confines of reality. I mean, humans are\n[463.16s] involved here. In the third area I think\n[464.96s] we make huge mistakes on software\n[466.88s] projects is the theories of value for\n[469.2s] our customers. When the product owner or\n[471.36s] the UX team or the CEO or the developers\n[474.04s] or whoever your team comes up with what\n[475.96s] is the software going to do, they''re\n[477.84s] doing it with a theory that that''s what\n[479.84s] customers want. Sometimes customers will\n[482.2s] say this is what we want and they do and\n[484.6s] sometimes customers will say this is\n[486.4s] what we want and they don''t really\n[487.72s] understand what they want. And sometimes\n[489.28s] you have to give them something\n[490.16s] different and this is what''s hard about\n[491.96s] software development. It''s not a cut and\n[493.6s] dry science. But every time the team\n[496.08s] puts new functionality in front of the\n[498.12s] customer and they''ve taken the time to\n[499.919s] build it, they''re taking a risk and\n[501.68s] sometimes those risks turn out wrong.\n[504.56s] And teams that are truly agile that\n[506.4s] actually release very regularly like,\n[509.16s] you know, at least once a week or more\n[510.88s] frequently with their customer, they\n[512.52s] have more opportunities to find out\n[515.2s] they''re wrong. And so dealing with\n[517.84s] finding out you''re wrong and not looking\n[520.08s] at it as a mistake and finding a way to\n[522.08s] learn from it is the only way that a\n[524.28s] software company or a software team is\n[526.56s] going to really truly be agile and not\n[529.2s] have things happen that are outside of\n[530.88s] their control and just freak out about\n[532.92s] it and have everybody start blaming each\n[534.96s] other. So now that you kind of know my\n[536.4s] stance on mistakes in software\n[538.32s] development that ultimately they''re\n[539.839s] natural. I gave you just a few examples\n[542.16s] but everybody''s going to make mistakes.\n[544.12s] We need to just prepare for it and stop\n[546.08s] beating each other over the head. I\n[547.48s] mean, don''t get me wrong. I''m not trying\n[549.28s] to say people shouldn''t be held\n[550.92s] accountable for significant mistakes.\n[553.72s] But ultimately there are certain things\n[555.6s] in the software development process that\n[557.28s] are not significant mistakes because\n[559.16s] people did stuff wrong. It''s just\n[560.839s] because it''s the nature of the work.\n[562.56s] It''s complex and there''s humans\n[564.839s] involved. So I want to give you just\n[566.12s] five things really quick that I think\n[567.72s] will help you so when you''re on your\n[569.08s] software project and things start to go\n[571.2s] wrong and you either need to forgive\n[572.76s] someone else and figure out how to get\n[574.4s] through it or maybe they need to forgive\n[576.16s] you and figure out how to get through\n[577.6s] it. How that can help you and not just\n[579.6s] cause you to blame the other person or\n[581.4s] yourself and not actually grow from it.\n[583.48s] The first thing we''ve all got to do, and\n[585.16s] this is really hard for me, is just to\n[586.96s] practice forgiveness. I mean, depending\n[589.12s] on how you were brought up in your\n[590.08s] family, some people in my family forgave\n[593.24s] people pretty easily. And I had other\n[595.6s] people in my family that would not\n[597.92s] forgive other people. And when you''re\n[599.32s] forgiving someone, you''re basically\n[600.8s] releasing them of the obligation to do\n[603.36s] something for you because of the\n[605.08s] mistake. And I think a lot of people we\n[606.68s] run into in our families or in our lives\n[608.76s] or through school or on the job, some of\n[611.08s] them are in that same place. There''s\n[612.68s] areas in their life they just don''t want\n[614.04s] to forgive people. And so, you''re going\n[616.12s] to have to practice that more yourself.\n[618.12s] I sure do, and it''s really hard, you\n[620.64s] know. Sometimes you have to figure out,\n[622.16s] why am I not able to forgive this\n[624.04s] person? But I think if if you can start\n[626.36s] to get better yourself at learning to\n[629.0s] actually just release people of the\n[630.96s] obligation to do something about a\n[632.96s] mistake they''ve made and just show them\n[635.2s] that you value them as a person and you\n[637.16s] realize they''re human and you realize\n[639.32s] they''re going to make mistakes. They''re\n[640.52s] going to show you the same thing and\n[642.44s] you''re going to need that so that you\n[643.8s] can have the safety that you need to\n[645.56s] actually grow in your career and not\n[647.24s] just be scared you''re going to make a\n[648.64s] mistake constantly, which is what some\n[650.88s] companies that don''t allow people to\n[653.0s] make mistakes or blame people heavily\n[655.32s] for mistakes, they create a culture that\n[657.36s] actually encourages that and locks\n[659.32s] people down. The second thing I think\n[661.2s] mistakes cause us to do that''ll actually\n[663.4s] help us grow projects is when we make a\n[666.44s] mistake, we have to find a way to admit\n[669.04s] it. We have to bring it to light and\n[670.92s] actually find our boss or our co-workers\n[673.36s] or our customer and tell them, look,\n[675.44s] here''s something I realized I didn''t do\n[677.24s] right. And I think why this is so\n[679.08s] valuable is the only way that we ever\n[681.8s] learn is if we make a mistake and people\n[684.64s] encourage us, hey, you made this\n[686.28s] mistake, but this doesn''t define you.\n[688.24s] Now you can learn the right way to do\n[690.08s] it. And I think when people are looked\n[691.48s] at like, you made a mistake, there''s\n[693.12s] something wrong with you, and that''s the\n[694.68s] way they''re looked at, and that''s how\n[695.96s] it''s focused on them, all it does is it\n[698.68s] creates shame for the other person,\n[700.64s] where it makes them feel like they''re\n[701.84s] worth less, and they''re not. They''re\n[703.72s] human. They just made a mistake. So,\n[706.04s] each of us having the courage to just\n[707.72s] say, you know what? I checked in the\n[709.64s] wrong branch, or I refactored the code\n[712.96s] wrong, or you know what? I completely\n[714.68s] forgot about this task that I should\n[716.32s] have included in my estimate, or you\n[718.28s] know what? I did overlook a huge\n[720.16s] requirement that the customer needed\n[721.88s] that''s going to cause you to rewrite all\n[723.28s] your code. I''m sorry. Being able to\n[725.4s] admit those things to other people and\n[727.8s] not get defensive and not look at it\n[730.0s] like, oh my god, if I do something\n[731.68s] wrong, uh I''m screwed. You know, I found\n[734.52s] even when I go into a company where\n[736.16s] there''s a lot of fear and there''s a lot\n[738.36s] of people who don''t want to admit making\n[740.2s] mistakes. If you actually show the\n[742.28s] courage that you can admit mistakes in\n[744.4s] front of other people, other people will\n[746.52s] see that, and they will start to get the\n[748.44s] courage themselves to also admit\n[750.48s] mistakes, and it''s really something that\n[752.08s] can grow, even if you don''t have like a\n[754.12s] blessing on high from the rest of the\n[755.96s] company. So, I think it''s just really\n[757.16s] good to have the courage to just admit\n[759.16s] when you''re wrong, because it''s going to\n[760.839s] set a great example for everybody, and\n[762.839s] it''s going to allow you to constantly\n[764.32s] grow. The third way I think mistakes\n[766.2s] have really helped me in my career, and\n[768.24s] they can help you to grow, is if we''re\n[770.56s] more humble about our abilities and\n[772.48s] we''re more realistic thinking, you know\n[774.48s] what? Even if I''ve been developing\n[776.28s] software for 5, 10, 20 plus years, I''m\n[780.0s] human and I''m going to make mistakes. I\n[782.04s] think it causes us to talk with other\n[784.12s] people in a way that we kind of set the\n[786.12s] expectation with them. Hey, I''m going to\n[788.12s] do a good job at this, but I''m going to\n[789.839s] do the best I can. Instead of this kind\n[791.92s] of fake mask that a lot of people have\n[794.04s] to put on in interviews and people carry\n[796.16s] throughout their career in corporate\n[797.68s] America of like, I''m infallible, I''ll\n[799.839s] never make a mistake, you can all count\n[802.0s] on me, I''ve got everything together. I\n[804.16s] mean, I think, you know, that makes\n[805.76s] great for movies and a job interview,\n[808.32s] but at the end of the day that''s BS.\n[810.84s] We''re We''re all going to make mistakes,\n[812.64s] no matter how far along we are in our\n[814.48s] career. And I know when I remember that,\n[816.56s] it really helps me to just go into a\n[818.68s] project and relate to everybody on a\n[820.76s] level where there''s less of this whole\n[822.64s] like image management of, you know,\n[824.48s] who''s smarter than everybody else. And\n[826.52s] just be prepared that I''m going to make\n[828.24s] mistakes and so is everybody else around\n[830.52s] me, and that''s fine because every time\n[832.24s] we make one, we can grow and learn why\n[835.2s] we made it together. The fourth thing\n[837.32s] causing mistakes can really help you\n[839.4s] with actually in your career is I think\n[841.32s] it forces us sometimes when we are\n[844.2s] either wrong about something or we don''t\n[846.2s] know something or we forget something,\n[848.44s] and maybe somebody else knew it or or we\n[850.88s] are looked at like we maybe should have\n[852.64s] known about it beforehand. It causes us\n[854.8s] to confront our limiting beliefs or the\n[856.68s] things that we kind of hold dear that we\n[859.0s] believe about ourselves, and sometimes\n[860.96s] these are true and sometimes they''re not\n[863.2s] true. I mean, if you had, let''s say,\n[864.76s] like an abusive parent or something like\n[866.6s] that, and they were constantly yelling\n[868.32s] at you as a kid and telling you you\n[870.16s] can''t do this one thing or you''re not\n[872.12s] worth very much, you might go around\n[874.12s] through life carrying that around\n[875.56s] inside, and we have the same things\n[877.28s] happen on software projects. We might\n[879.36s] have someon