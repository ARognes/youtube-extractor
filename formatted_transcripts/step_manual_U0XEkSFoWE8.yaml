transcript: '{"content":"\n[0.24s] We''re often instructed that the thinking\n[2.48s] mind is the villain. That to be\n[5.279s] spiritual means to be silent.\n[8.48s] In a past video several years ago now, I\n[11.28s] discussed how the aim of meditation\n[13.36s] practice is not to stop ourselves from\n[16.08s] thinking and simply have a blank mind\n[18.0s] all the time. Today, let''s go a little\n[20.96s] deeper with that same topic. It''s not\n[23.84s] simply that meditation involves\n[25.68s] thinking, but that practice along the\n[28.48s] path requires us to actively use our\n[31.84s] thinking in order to move forward.\n[35.2s] After all, the path itself begins with\n[38.16s] right view. And to have a view of any\n[41.2s] kind, we''ve got to be thinking,\n[43.12s] conceptualizing the world in a certain\n[45.2s] way.\n[47.2s] But more directly the second path factor\n[50.8s] after right view is expressed with the\n[54.0s] polyphrase sama\n[57.28s] and that''s variously translated as right\n[60.16s] intention or right thought or right\n[62.32s] resolve\n[63.84s] so on. The term salapa implies some\n[68.32s] cognitive activity\n[70.479s] thinking or intending or conceptualizing\n[73.439s] or resolving.\n[75.92s] The upshot here is that that second path\n[78.4s] factor illustrates how practice is not\n[81.68s] about stopping our thoughts altogether.\n[85.119s] Instead, it''s all about thinking\n[87.52s] rightly.\n[90.88s] In one of his most famous early sutas,\n[93.36s] the Buddha discusses his practice before\n[96.0s] he became enlightened.\n[98.24s] He realized that whatever a mendicant\n[100.96s] frequently thinks about and considers\n[103.119s] becomes their heart''s inclination.\n[106.399s] And he further realized that he could\n[108.32s] divide his thoughts into two basic\n[110.96s] kinds.\n[113.119s] The first kind were thoughts connected\n[115.36s] with sense desires, with ill will, and\n[118.24s] with cruelty.\n[119.92s] The second kind were thoughts connected\n[122.399s] with renunciation, with goodwill, and\n[124.88s] with harmlessness.\n[127.759s] Now thoughts of this second kind are\n[130.8s] precisely the thoughts or intentions\n[133.52s] that constitute sama kapa right thought\n[137.599s] or right intention.\n[140.64s] The Buddha understood that the first\n[142.879s] kind led to harm and affliction for\n[146.0s] himself and for others, while the second\n[149.599s] did not lead to harm, but rather to\n[152.16s] wisdom, to freedom from distress and the\n[155.36s] extinguishing of suffering.\n[158.48s] So he says that he practiced such that\n[161.04s] when an unskillful thought arose,\n[164.16s] he would reflect upon the kinds of bad\n[166.879s] ends that it led to. And when he did\n[170.16s] this, that cruel or malicious thought\n[173.28s] would go away.\n[176.0s] In its place, he cultivated thoughts of\n[178.56s] renunciation, goodwill, and harmlessness\n[181.36s] or right thoughts or right intentions.\n[186.239s] This is part of our practice, our active\n[189.2s] meditation process.\n[192.0s] I mean, sure, we may begin simply by\n[195.36s] watching traffic as it passes in the\n[197.92s] mind.\n[199.28s] But if we don''t intervene and direct\n[202.0s] that traffic, sometimes we''re going to\n[204.239s] end up acting out in unskillful ways.\n[208.239s] Unskillfulness will then become our\n[210.56s] heart''s inclination in the Buddha''s\n[212.4s] words.\n[214.159s] So meditation mindfulness involves wise\n[218.56s] reflection or in pi called it''s called\n[221.76s] yonis manosikara\n[224.239s] whereby we are doing active cognitive\n[227.04s] sorting of the kinds of thoughts that\n[229.84s] arise in our minds.\n[233.28s] Now it''s true that as we go farther in\n[235.92s] this suta, the Buddha Tabi discusses how\n[239.519s] his reflections upon such right thoughts\n[242.879s] led him to realize that even that amount\n[246.159s] of reflection led to a moderate level of\n[250.08s] stress that could be alleviated by going\n[253.2s] into deeper states of meditative\n[255.84s] absorption.\n[258.239s] However, this is an advanced practice\n[261.199s] that not many of us are going to have\n[263.04s] the time or inclination to reach.\n[267.04s] But even in these higher states of\n[269.6s] absorption or deeper states, the mind is\n[272.88s] not literally blank. Instead, it''s\n[276.0s] filled with profound experiences,\n[278.96s] let''s say, of happiness, of pleasure, or\n[281.68s] of equinimity.\n[284.479s] And of course, we can''t simply persist\n[286.96s] in these states forever. Eventually,\n[290.16s] we''re going to have to come back to our\n[292.32s] lived reality with all of its cognitive\n[294.88s] complexities.\n[298.479s] Okay? So, the Buddhist says he began by\n[300.479s] sorting his thoughts into basically the\n[302.639s] skillful and the unskillful.\n[304.88s] Then he worked on boosting the skillful\n[307.28s] while diminishing the unskillful.\n[311.36s] But what if the unskillful thoughts come\n[314.08s] back? And what am I talking about? Of\n[316.479s] course, they''re going to come back.\n[317.759s] That''s the monkey mind at work. So, what\n[320.4s] do we do then?\n[322.639s] Well, if if you happen to be reading\n[324.479s] through those sutas, the very next one\n[327.199s] discusses that problem.\n[329.68s] It''s titled the suta on the stealing of\n[332.639s] thought. But really, it isn''t about\n[335.36s] stealing all thoughts so much as it is\n[338.56s] about stealing unskillful thoughts.\n[342.56s] In that suta, the Buddha discusses five\n[345.36s] techniques for dealing with unwanted,\n[348.96s] unskillful thoughts that just ordinarily\n[352.0s] arise in us.\n[354.08s] Now, important to keep in mind that\n[356.16s] these techniques the the Buddha\n[358.0s] discusses are intended to be relatively\n[360.56s] advanced ones and and they should all be\n[362.8s] used carefully. I did a video on on them\n[365.68s] and I''ll leave a link down below.\n[369.199s] If they''re wrongly used, they can lead\n[372.0s] to what''s known as spiritual bypassing.\n[375.52s] That is believing that we''ve dealt with\n[377.759s] something when we''ve merely bypassed it\n[381.039s] or left it to one side.\n[384.319s] In any event, the first of these\n[386.16s] techniques is to substitute.\n[389.52s] That is, we substitute a good thought\n[392.16s] for a bad one. The Buddhist says this is\n[395.759s] like a carpenter who hammers out an old\n[398.8s] rotten peg using a new fresh peg.\n[404.479s] Secondly, we can examine the thought. In\n[407.52s] particular, we can examine its danger.\n[411.44s] The Buddha says this is like someone who\n[413.919s] considers themselves fashionable might\n[418.16s] consider keep in mind what it might be\n[420.8s] like to have a dead snake hung around\n[423.919s] their shoulders. That is that should\n[427.44s] lead them to be repelled with disgust at\n[429.84s] that at that possibility.\n[433.28s] Thirdly, we can try to ignore these\n[435.919s] thoughts by looking away from them and\n[438.24s] not giving them our attention.\n[441.199s] We might for example take a walk or do\n[444.08s] the laundry rather than persisting with\n[446.16s] our doom scrolling for example.\n[450.16s] Fourthly, we can try to calm them\n[452.88s] gradually by looking at our thought\n[456.08s] processes as a whole and seeing if we\n[459.12s] can slow things down a bit.\n[462.479s] The Buddha says this is like somebody\n[464.16s] who''s walking too fast and asks himself,\n[467.68s] why am I doing that? And so he walks a\n[470.96s] little more slowly.\n[473.28s] So we might consider what''s agitating\n[475.919s] our mind and why is it doing so and try\n[479.919s] to let it go. Or we might spend some\n[482.879s] time simply watching the thoughts arise\n[485.84s] and pass and so in that doing allow them\n[489.68s] to become more stilled on their own.\n[493.84s] These are skillful uses of mindfulness\n[496.8s] techniques.\n[498.8s] Finally, if none of those works, the\n[501.12s] Buddha says we can act to crush mind\n[503.68s] with mind.\n[505.68s] Just hold unskillful thoughts back the\n[508.879s] way that a stronger man might hold back\n[511.36s] a weaker man.\n[513.68s] Now, obviously, this is not going to be\n[515.839s] our best option. And we might\n[519.36s] legitimately argue over whether it could\n[521.519s] work at all. But at least it''s one thing\n[525.04s] that we might consider in the case of\n[528.24s] acting out on a harmful thought.\n[532.399s] A person who can perfect such practices,\n[535.2s] the Buddhist says, will become one who\n[538.0s] is a master of the ways of thought. They\n[541.2s] will think what they want to think, and\n[543.76s] they won''t think what they don''t want to\n[546.32s] think.\n[548.32s] That is, these practices aren''t simply\n[551.04s] practices of non-thinking.\n[554.08s] Instead, they more resemble high-level\n[556.56s] mental martial arts, teaching us how to\n[559.36s] use thoughts properly.\n[564.16s] So, as I said before, sama sananka or\n[567.36s] right thought, right intention is\n[570.0s] defined in Buddhism as the thought or\n[573.12s] intention of renunciation to begin with.\n[576.16s] that is letting things go, living more\n[579.12s] simply and thereby more freely.\n[582.24s] It''s the thought of goodwill, that is\n[584.72s] kindness or wishing the best for others.\n[587.839s] It''s the thought of harmlessness,\n[590.64s] that is compassion for others suffering\n[592.959s] and the wish to help rather than to harm\n[595.92s] them.\n[597.68s] We might think of right view in this\n[601.12s] picture as kind of like the map that\n[603.68s] helps us get to our destination.\n[607.04s] If we think of it that way, then right\n[609.44s] mindfulness is like the view out the\n[611.839s] windshield that lets us see what''s\n[614.24s] happening in front of us. And right\n[617.36s] thought or right intention is kind of\n[619.279s] like the steering wheel that keeps our\n[621.76s] car aimed in the right direction down\n[623.76s] the road.\n[628.16s] So the proper goal of Buddhism within\n[630.64s] this lifetime is not to live blankly\n[634.0s] completely detached from reality like\n[637.04s] somebody in a coma or something.\n[639.68s] Instead, it''s to live with a mind that\n[641.44s] overflows with certain cultivated and\n[644.24s] skillful qualities like wisdom,\n[646.8s] kindness, compassion, and so on.\n[649.92s] Now indeed it is true that silence will\n[652.72s] come with practice.\n[655.04s] It can be cultivated through deep though\n[657.68s] temporary states of absorption for\n[660.0s] example.\n[662.24s] But if we''re lucky enough to get to such\n[664.399s] states, we''ll do so by active cognition\n[669.2s] at first by thinking through our\n[672.48s] problems to their end skillfully with\n[675.68s] wise reflection rather than by pushing\n[678.8s] our problems away or hiding from them in\n[681.44s] the m mistaken belief that we have to\n[683.839s] zero out all of our thoughts.\n[686.959s] If you''re anything like me, you''re\n[688.56s] you''re dealing with that monkey mind\n[690.399s] that we discussed before. But where does\n[693.36s] that metaphor come from? What was the\n[696.0s] Buddha trying to highlight with it? I\n[698.88s] actually have an earlier video on that\n[701.36s] topic that I''ll leave here on the screen\n[703.36s] in a moment. Meanwhile, I''d be\n[705.68s] interested to know which of these\n[707.6s] techniques for dealing with unskillful\n[710.56s] thoughts you''d find most useful in your\n[713.36s] practice.\n[715.2s] And if you have any other suggestions,\n[718.399s] I''m sure that we''re all ears. Let us\n[720.399s] know down in the comments. Thanks so\n[723.04s] much to all of you for your continued\n[724.72s] practice. And please all of you be"}'
