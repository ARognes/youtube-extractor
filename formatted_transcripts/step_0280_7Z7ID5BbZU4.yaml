transcript: We've all heard the horror stories of AI deleting entire databases or wiping people's entire computers, which is why most people when they run AI make it ask for permission to run anything that could be dangerous to your computer. The problem with this though is that it's very slow, constantly interrupt you, and absolutely kills your productivity, which is why some people just swap over to letting the AI do anything with no permission boundaries at all, which is where we run into these potential problems. On top of that, npm seems to have a new security vulnerability every single week with horrible malicious software that'll steal your API keys and destroy your computer. And it doesn't matter if you're using AI or not. It's super easy to fall for these npm packages. Now, this is why I use sandboxes for every single thing that I do. And this is super important, especially for AI development, because it makes sure that you can let the AI run with no permission checks at all, but with the peace of mind that it's impossible for it to do anything bad to your computer or delete any databases or anything like that. Also, it fully insulates you from any type of npm security vulnerabilities because this sandbox is isolated from your entire system. In this video, I'm going to show you how you can set up these sandboxes, how you can customize them, and how you can use them for agentic coding and non-agentic coding tasks. Welcome back to WebDev Simplified. My name is Kyle and my job is to simplify the web for you. And for this tutorial, we're going to be using Docker Sandboxes. Now, this is a tool that I've been using way back when it was in early access, and now it's fully released, which is great because it's much more stable. And I absolutely love this tool so much, I actually reached out to Docker to see if they would sponsor this video, and they were kind enough to sponsor this video, even though, to be completely honest, I was going to make this video either way because I love the tool that much. The main reason I like this tool so much is because it works the exact same. Whether you're on Mac, Windows, or Linux, it all works exactly the same, which makes it super consistent and easy to work with across your entire team. And it's by far, in my opinion, the easiest sandbox to get set up with and work exactly like you want it to. Now, to get started with this, it's super simple. Just go to the getting started page, choose your operating system, and make sure if you go down to the install section, you just run whatever the install command is, that'll download this Xpx tool. And then we can use this to log in and actually get started. So, let's go ahead and do that. I just have a really simple project here. It's essentially entirely blank for the most part. It just has an index html file and it's got a script file. And we can just run that xpx login command. And that's going to go through. It's going to essentially open up Docker. You're going to need to sign into Docker and create an account if you don't already have one. But once you do, you can just click confirm. And you don't have to worry. All of this is entirely 100% free. I wouldn't be recommending it to you if it wasn't. I like it so much cuz it's super easy to use and entirely free. Once you're done with that, you can now go back and you can see we are now authenticated with that account that we created. From here, we can actually go ahead and create sandboxes however we want. Now, before we do that, I want to first make sure we understand the difference between something like a sandbox, a container, and maybe a full-fledged virtual machine. Here we have an example showcasing kind of how the Docker sandbox works. You can see inside here we have the actual code we're running. Often times, if you're doing agentic coding, you're going to have some agent running inside of this. That's going to be running inside of a Docker container. And the nice thing about that is it