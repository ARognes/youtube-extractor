est. Just like that. And as you can see, this is going to start it up. And the very first time you run anything inside of Docker, it's essentially going to ask you here whether or not you want to have different network policies. And this allows you to make sure that when you are calling out to the web, it's going to restrict what domains you have access to. So what we want to do is set what we want in this. So we have open, balanced, and locked down. Open essentially allows all network traffic. There's no restrictions at all. I'd recommend not doing this. Balanced is a great middle ground. defaults to denying any request that you send, but a lot of common sites like npm and so on that you're going to use to download packages are going to be allowed by default. And then lock down just essentially blocks everything unless you explicitly allow it. I generally think balanced is a good approach because it gives you all of those different dev dependencies like npm that you're used to, but it blocks other things so that you can't go out and accidentally download malicious code from the AI. It's going to completely block that. Or if it tries to access your database and drop it, it can't do that because it doesn't have access to that web layer to do everything. Now, the very first time you run this, it's going to take a while because it has to download literally everything for your entire sandbox. But from then on, once you run this, it's going to be much quicker because it already has everything downloaded. It just has to spin it up and spin it down. So, it looks like it just finished running. And we should hopefully see here that we have that Copilot prompt set up. And now we're essentially directly inside of Copilot. Now, it recommends running this login command to sign into Copilot. But actually that's not what I want to do because that's going to essentially put my credentials inside this sandbox which means any code running in here has access to those credentials. That