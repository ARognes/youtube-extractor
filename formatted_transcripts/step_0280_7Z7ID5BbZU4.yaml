gain. And of course, since we've already actually created this, I just need to run it by passing the name. So, I can just say run and then whatever the name of the sandbox is we created. And that's going to open up my sandbox. And you can see how quick it is the second time you open it. Now, the problem is though, since we just created a brand new environment variable, it doesn't have access to that environment variable because we created the sandbox before that environment variable existed. So, you can see I still don't have access to any of my models and it's asking me to log in. We can get around this by just essentially deleting the sandbox and recreating it. And now it's going to pull in those environment variables. And the nice thing is is once you set your environment variable once, it'll have access to it forever. So, you don't have to worry about doing this normally. So, what we can do is we can say spxrm. That's going to remove the sandbox. and we give it the name of copilot test cuz that's what we called this. And then it's going to essentially say, do you want to delete that? Yes, we want to delete that. And it's going to go through and it's going to delete everything related to that sandbox. This now means that we essentially need to recreate that sandbox. So we can just come in here, use that same run command to create a brand new sandbox. It's again going to take a little bit of time to start up your sandbox, but as you can see, it's relatively quick. And the nice thing is it actually has that credential injected inside of it. So now I can do whatever I want. For example, I can say say hi. And it's going to actually prompt the AI and I get back the response of hi. And the nice thing is is if I try to access that GitHub off token, I can't. For example, if I just do echo dollar sign GitHub token, that is the GitHub token. And when I hit enter, you can see this is not the actual token. You can see spx proxy managed blah blah blah blah blah. That's essentially saying that the container has no idea what the actual token is. The token is stored outside of this sandbox. And whenever a request is being made from the sandbox, what happens is the request is made. the request goes outside of the sandbox and then outside the sandbox this credential is injected in and replaced with the correct credential before it gets to GitHub. So essentially there's a middleman that intercepts my request from the sandbox, adds that credential in and then lets it go across to the GitHub servers. This means it's impossible for any malicious script or anything that goes on in your code to access your credentials when you don't want them to. This is one of the big benefits of using this whether you're doing agentic coding or not. It keeps your credentials entirely safe on your system since there's no access available inside the sandbox. So, if I downloaded a malicious package on this exact sandbox, it doesn't matter because it can't access my credentials or do anything to my system because it's entirely locked down. Speaking of, if I were to come in here and I just try to access various different files, for example, let's just try I cd into the root directory and then I want to run here ls. You'll notice that it only has access to like a few different folders and files and all of this is inside of its own container. You can see the path here, g webbimplified current project. This is just essentially a copy of what is in my folder right here. So these files are being copied over. That's why you can see them here. But everything else on my system is entirely locked down and inaccessible from this workspace because it's all just these specific files and nothing else. To show you what I'm talking about, we could really simply just say delete script.js. And this will actually go through. It'll delete that script.js JS file because it has access to that particular file. And if we were to come over to here, you can see that file has been removed just like we would expect it to. But if I have a file somewhere else on my computer, it is entirely impossible for it to access that. So let's just go ahead. We're going to exit out of here and I'm going to create a brand new folder. We'll just call this test. And inside of here, I'm going to move that index html. And outside, I'm going to create a script.js. So you can see I have this test folder with index html inside of it and the script folder on the outside of it. Now, what I'm going to do is I'm going to CD into that test folder just like that. And I want to start my workspace here. So, I want to create a brand new sandbox. We're going to call this C-pilot nested just like that. That's going to start up a brand new co-pilot sandbox inside this test folder, which means it only has access to the code inside this test folder and nothing else at all. So, if we just come in here and I were to run that ls command, you can see all we have is index.html that's in that test folder. And if I were to try to cd up a level for example, and then I wanted to run my ls command, you'll notice it doesn't have access to anything else, you can see there's this agent MD file that's automatically added by Docker, essentially telling our agent that it's inside of a sandbox. But you can see this script file doesn't exist at all. And if I try to delete this, I can just say delete. And let's just copy the full path to this file and see if it'll delete it. We'll say copy path. Paste that in. And when I hit enter, it's not going to be able to find or delete this at all because it doesn't have access to this file on my system anywhere. And no matter what it tries to do, you'll notice that this file is always going to be here no matter how many times I refresh. You can see it says it deleted it cuz it tried to run the command to delete it. But it doesn't have access to that file. So the file is still 100% here, not deleted at all. Now, this alone is already enough reason to use sandboxes in my opinion cuz it gives me that peace of mind. I can run my AI without any safety checks and I can know that it won't mess up anything on my system at all. But obviously sometimes I want to take this a step further because right now it can still delete files inside this folder. It can add things into those files. It can inject code into like GitHub hooks and things like that. So it can still technically cause me problems by adding files into this folder. And then if I run code, I could maybe run malicious code from these files. So there's one step of problem there. So if I wanted to be able to prevent that problem, what I can use is essentially something similar to GitHub work trees by cloning this entire thing instead of having it essentially linked to this. Because right now the way it works is every time I make a change inside of my sandbox, it duplicates that change outside my sandbox right here only for the files that it has access to. This is great because it's super easy to work with, like I said. But again, you could run into potential security problems. If you have malicious code that adds like a GitHub pre-commit hook that does something malicious, that pre-commit hook will get added to your code and then if you try to commit something in GitHub, it'll run that. So if you run that code on your normal machine instead of in the sandbox, you could run into potential problems. So, let's go ahead and look at the alternative we can use, which is going to be using a clone to clone this entire repository instead. Now, I'm just going to CD back to that main root level. Just like that. So, now we're at that root level we were at before. And what I want to do is I want to essentially run a brand new sandbox, but this one I'm going to be using that clone mode instead. So, I can just say d- clone just like this. That's going to allow me to run this as a clone. And then I can specify that I want this to be copilot. And I can specify the name. We're just going to say copilot clone just like that. And we are immediately getting a warning saying that you must have a git repository to do this because it works off of git work trees. So we're just going to say get init to create a repository. There we go. And now we can run that clone command instead. And the big difference between the clone command and the original command is that instead of just having essentially these files be modified directly between the two. What happens is it actually duplicates all these files into its own work tree that's entirely separate. And then if I were to make changes, for example, I can just say add a styles.css CSS file with nothing in it. There we go. So, it's just going to create a blank styles.css file for me. And you'll notice it doesn't actually show up over here at all. You can see no matter how many times I refresh, this file does not show up over here. While if I actually check inside of here, you can see there's that styles.css file right there. Also, you notice none of the rest of these files are showing up. And that's because I need to make sure I add those files into my repository for them to show up. Because when you do a clone, it only clones whatever the current branch is at. So, I need to have those committed into my branch. And since there was nothing committed to my branch, nothing is going to show up. So let's go ahead and actually fix that by just saying get add. And we'll just commit these files. There we go. So now we have those created. And to get this working properly, what I want to do is I want to remove that copilot clone sandbox that we created. And this one, you'll notice we get a much longer warning message. The reason for that is because when you delete a cloned sandbox, all your files that are changed inside of there, unless you pull those down to your main repository, they will be deleted as all. So that's why it gives you a longer warning message. But now let's go ahead and we want to create this again. So let's just find that create command right here. That's going to clone everything. And now since we have these committed to our actual repository, they will show up inside of our list. So if we just give that a second and I run that ls command, we should see all those different files just like we expect. And now I can say create a blank styles.css file. There we go. It's going to go through. It's going to create that file. And again, that file won't show up over here because it's only inside of this specific git work tree. If I want to access that, I essentially need to pull that code down just like I was pulling down a pull request from GitHub. So, let's open up a brand new terminal. This terminal is inside my actual non- sandbox environment. And now what I can do is I can actually pull those different things down. So, I can say get checkout. And if I just do a quick search here, and actually let's do get fetch. And you'll see right here, sandbox copilot clone. The name of this is always set to sandbox- whatever the name of the sandbox is. That's going to allow me to pull down the code that comes from that specific sandbox. Now that I've pulled down that sandbox code, I can come here with a get checkout. And if I look at my options, you'll notice I have the options for the code from that clone. So, let's just copy down that clone just like that. And now that's pulling down the code from that section. Now, the problem is is that I didn't actually commit the changes over here. So, I should just say commit and add those changes. There we go. That way, it's going to make sure all those changes exist inside the repository. So, when I pull it down, they will be accessible. So, now it committed all those different changes. So, now if I were to just do a quick fetch here to fetch all that down, and I were to check out that branch, you can see that blank styles.css is right there like I expect it to be. So, this essentially allows me to work in a way that I know that all of the code that is inside this section, if I'm pulling it down, I know that it could have potential problems inside of it. I should review it as if it was a pull request coming from somewhere else. Now, this again doesn't protect you if you were to have malicious code inside of here and you run it. Obviously, that's your own problem that you ran into yourself. But this gives you that extra level of security cuz these files will never be modified unless you manually pull down the code. Now, the downside of this is it's much more cumbersome to work with. So, for the most part, I just work inside of noncloned environments because it's easier to work with. But if I had some more security concerns or maybe things like pre-commit hooks and so on that were running often, I would maybe think about doing this in a slightly different way. Now, the next thing I want to talk about is going to be security policies that we can specifically use. So, let's go into our copilot. I just want to clear this out. We'll just restart this from scratch again. So, let's just get that running just like that. That's going to be that cloned version. And what I want to do is I want to show you how it doesn't have access to like the web by default. It has access to some sites but not very many. For example, I can say, what is the latest ESLint version according to the docs? And I'm just going to paste in a URL to those docs. And when I run this, it's not going to be able to access these docs. It's going to get an error. As you can see, fetch failed. And that's because by default, it's locking down all of those different external API routes. And it's not letting it access the internet except for on very specific pages where I told it it has that access. If we want to be able to modify this, for example, I want to be able to access that ESLint website, we can modify the policies that we have. So, if we say SBX policy and I type in network, that's going to give me all of my different network policies. And specifically, we want to list them. So, let's do policy ls and then we'll type in network. And this is going to show all of the different things that are currently being allowed inside the network. So, you can see all of these are things being allowed by that kind of basic profile we set up that allows it to access lots of different things that you would normally need to access. for example like Debian and so on to download various different things. You can see like forcel and Google inside of here for common development related things Figma and so on. If we want to be able to add to this, it's actually quite simple. I can just type in SBX policy allow. This is going to be a network policy and I'm going to make it global which means any sandbox has access to this. But if you want to restrict it to a specific sandbox, you could type in a specific sandbox name. And then we just need to put whatever that domain name is. Now in our case we want this to be eslint.org. So we can just paste in eslint.org and that means any request to eslint.org is going to be acceptable. So now we can click enter on that. That rule has now been added as a local rule on my particular computer. And now if we were to come into here, let's just close out of this and restart it just to make sure that it gets that brand new network policy. And if we were to run that exact same command, we should hopefully see that it is able to correctly fetch this documentation. You can see it fetched it. It was able to successfully fetch. There are no errors and it's given me the exact latest version. So that's how you can modify your different policies for what you can allow and deny access to. And if you wanted to, for example, deny access to something, you could just say deny in here, and that's going to explicitly add this as a denial rule. But oftent times, if let's say I want to remove this eslint.org that I added. All we do is just do a list command. You can see right here, this is what I typed in as the thing