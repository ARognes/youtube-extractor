transcript: |-
  A patch built around a compact Eurorack mini case, a four-track tape loop, and deep reverb. The chord progressions move slowly through minor harmonies while tape-recorded OP-1 sounds drift in and out, adding warmth and a slight grit to the edges. Heavy reverb throughout gives the piece a lot of space.

  Patch Notes

  1. NOH Pianist (NOH Modular) drives the chord progressions from the mini case, moving slowly through minor voicings. The harmonic framework shifts over time, keeping the texture in a state of gradual drift.

  2. Ghost (Endorphin.es) processes the modular signal with modulated effects, shaping the tone before it moves further down the chain.

  3. The signal is routed into Starlab (Strymon), housed in a 3D-printed case alongside the rest of the setup. Reverb is pushed heavily here for a wide, diffuse, and deeply spatial sound.

  4. Four separate OP-1 sounds were recorded onto a Fostex X-12 four-track cassette. These are brought in and out manually using the level controls, adding tape saturation, subtle distortion, and occasional textural contrast to the synthetic layers.

  5. The TX-6 (Teenage Engineering) receives both the clean signal and the full reverb send from the Fostex independently, allowing both to be balanced and shaped in the final mix.

  6. The final recording is recorded on the TP-7 (Teenage Engineering).

  The modular layers are paired with a TP-7 field recording captured along the canal in Hackney Wick on a cold evening, using a Shure MV 88+ for stereo capture. Birds, cyclists, runners, and general outdoor ambience sit underneath the synth textures and keep the piece grounded in a real place.

  Listen & Follow
  If you enjoy these textures, feel free to leave a comment or explore more modular works here: https://spotify.link/zegyM6IaJDb

  It's a blend of modular ambient, tape textures, and natural field recordings (great for focus, slow mornings, or letting your mind wander).

