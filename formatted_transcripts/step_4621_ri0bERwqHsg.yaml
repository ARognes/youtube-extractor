transcript: People always say a college is meant to teach you how to learn, but since you didn't attend, how do you sort of learn things? >> So, I try to get things going and working as quickly as possible. And then when problems occur, I try to figure them out as they appear. So, I suppose you could just name that really neatly as trial and error, which I think has its place, but it definitely can only take you so far. You can try to be completely practical and hands-on, but you'll bump into problems where you can't even see the problem because you don't have words to describe the problem or the solution that you're trying to come to. And different fields have this. So, if you went into like a legal field, there's all these legal terms that they use to describe specific things. I've very heavily lent into the organic approach of just producing something working and then naively solving stuff along the way. But nowadays, I might go to Wikipedia or ask an LLM. And this is one of the areas that LLMs have been actually quite useful.
