transcript: Apple has never done this before, they’re  sending hundreds of millions of notifications, warning of cyber attacks. All because  a set of advanced iOS exploits, that were previously only being used by government  hackers, is now available, to anyone, for free. Ever since the iPhone dropped in  2007, normies, that’s you and me, we’ve realistically never had to worry about  being hacked. The only people with access to advanced iOS exploits were intelligence agencies,  and they just don’t care about us. They were busy unleashing their hacks in highly targeted  operations, breaking into the phones of nosy journalists and their families, before doing  the most evil things you could possibly imagine. But there’s a worrying new trend, the same  advanced exploits being used by governments have been finding their way onto a secondary market,  being bought by lower tier hackers, who really aren’t quite as skilled. These guys haven’t been  running highly targeted operations, they’ve been spraying and praying, which has led to these  tools being leaked online for anyone to use. The researchers who discovered DarkSword, found  that it was being used by three different hacking groups. But we’ll be focusing on the Russians,  not because I’m picking on them but because they were so incredibly lazy and sloppy with their  implementation, that they accidentally leaked a lot of juicy details. The other two were a little  more professional and didn’t really expose much. Darksword is an exploit chain made  up of 6 different vulnerabilities, all of them working together,  resulting in total device compromise. But it all begins when a victim loads an infected  website, some of the hackers would set up their own websites, but in the case of the Russians  they hacked several Ukrainian news and government websites, injected their malicious javascript  and then just waited for people to visit. It’s called a watering hole attack,  by poisoning something that already has an audience you don’t have to worry  about spreading the malware yourself, you just sit back and wait for  people to fall into your trap. If you just so happened to be running  a vulnerable version of iOS and visited the infected website it was all over,  instantly. You didn’t have to click any popups or download anything. Once the site  had fully loaded, it was already too late. Depending on your exact iOS version, a set of  different vulnerabilities would allow the hackers to inject malicious code into Safari itself.  Then two more vulnerabilities allowed them to escape Apple’s tightly controlled sandboxed  environments, before a final vulnerability gave the hackers root access to your iPhone. At  which point, the final payload could be injected. Messages, call history, WiFi credentials…  Ghostblade extracted the lot, anything and everything that might potentially be of some  value. But surprisingly Ghostblade also goes after cryptocurrency wallets, which is unusual  for government hackers, well… unless you’re North Korean and half of your government budget comes  from cyber crime, but usually governments are less bothered about your crypto stash, and more  interested in compromising national security. So, researchers think that these guys  are a private group of hackers for hire, who work for the Russian government  but also do cybercrime on the side. The hacker equivalent of working on your  side hustle in the office on company time. Once the loot had been stolen,  it was exfiltrated through a hacked domain belonging to a Ukrainian  company that makes hats, unexpected. After exfiltrating the loot, it was time  for Ghostblade to scoot. Within minutes, Ghostblade would totally delete itself from the  victim’s device. Trying to make it look like it was never even there in the first place, by  deleting the various breadcrumbs it left behind, but it wasn’t very good at that, missing  certain crash logs and it didn’t bother to even delete browsing history. Which  leads us to the most amusing part of all. But before we get to that, bit of an announcement,  I’m actually working on a new side project, which I can’t really say much about at the moment, but  think along the lines of something hacker related that would be super cool to have on your desk.  If you’d like to hear more about it closer to the time, head to seytonic.com, linked down below  and sign up to my mailing list. Back to the video! Researchers at Lookout were in the midst of  investigating a totally different iOS hacking campaign, which Google published an investigation  on earlier this month. In this campaign, certain Russian hackers that we’ve become  familiar with were hosting their malware on a particular domain. Lookout, did some  digging, and discovered a different domain registered on the exact same day which kinda  looked similar, suspiciously similar. Upon closer inspection it had a LOT in common, some  of its subdomains even pointed to the exact same IP addresses! Without this one clue,  darksword might never have been uncovered. This new domain was hosting files that  had some very suspect names. Now usually hackers go to at least some lengths to cover  their tracks, like obfuscating their code, making it difficult to read, but not here,  the researchers found clean, commented code, making it painfully obvious this was clearly some  kind of ios exploit kit. And the use of occasional emojis suggests the hackers might’ve been leaning  on AI to help with their development, and even the name DarkSword, which is revealed multiple times  directly in the code itself, sounds very AI-ish. Researchers think that this  Russian group are kind of noobish, they bought a sophisticated exploit kit,  but didn’t really know how to implement it, relying on AI to add functionality. Their  implementation was so bad that when the researchers tried to infect their test  phones, the phones just kept crashing. Forcing the researchers to deploy the  code locally and fix the bugs themselves. The two other groups using DarkSword  were relatively more professional and knew what they were doing, but because of  the sloppyness on the part of the Russians, DarkSword isn’t much of a secret anymore. The researchers are refusing to  release the full code for DarkSword, because they say it would have way  too much of a widespread impact, and because it’s really easy to use. 3  days later someone published the full code to github. With researchers on Twitter  confirming that this is in fact the real deal. The latest version of iOS, the liquid glass update  is totally patched. Only iOS 18 is vulnerable, that’s the one just before iOS 26. If  you’re wondering why 26 comes after 18, it’s not the apple can’t count, they  recently changed their naming scheme to match the year of release, confusing, yes,  but anyway, the exploit only work on iOS 18. But surely Apple has gone out of their way to  release patches for anyone still on that version, right? Yes, well, kind of. Apple has  released security updates for iOS 18, but only for devices that don’t support iOS  26. Things like the XS and XR. If you’re on a newer iPhone that does support iOS 26, but  you’ve been holding out on updating because you’re not a fan of Apple’s funky new UI,  then you’re one of the 20% of people still vulnerable! Pick your poison, script kiddies  who now have access to advanced iOS exploits, or putting up Apple’s windows  vista looking user interface. And by the way, that figure of 20% of people  still being on iOS 18 comes from Apple themselves, and this only counts iPhones  introduced in the last 4 years, phones which do definitely support iOS 26  so aren’t eligible for that iOS18 security update. Granted though these numbers are a month  out of date so the true number is likely lower. But probably not by much, it’s not like iOS26  was just released, it came out last June. And the researchers think that hundreds of  millions of iPhones remain vulnerable. The only alternative to updating  is to enable Lockdown mode which will stop DarkSword even if you’re on  a vulnerable iOS. But if you do that, be prepared for Apps to break, websites to  stop loading properly and fonts not to render. In the last couple days Apple has begun spamming  out millions of notifications warning people that the version of iOS they’re on is under active  exploitation. We’re all familiar with the typical update notification, as far as I’m aware this is  the first time Apple has sent out this kind of urgent security warning. And it’s easy  to see why, now every script kiddie has access to exploits which just a few months ago  would’ve cost hundreds of thousands of dollars. Quick reminder to sign up to  my mailing list linked below, YouTube’s notifications are a bit sketchy so  this makes sure you’ll actually hear about my new project when it goes live. If you found  this video useful, do make sure to drop a like and as always thanks for watching and I shall  see you in the next video have a good one.
