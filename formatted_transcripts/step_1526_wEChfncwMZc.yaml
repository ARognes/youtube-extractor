r product or service okay i want to know a little bit about how you're going to get the word across now these days the first thing i hear is where we're going to use social media all right you're using social media but social media is passive you put stuff on there but people have to look to find you what are you if you if you're going to rely on social media or if you're going to create an amazon or a shopify storefront for retail surprise i'm okay with that but i want to know how are you going to drive traffic to your storefront just having it up there is not going to drive traffic you need to i need to know how are you going to get the word out to people you know what are you going to do to drive traffic you know are you going to are you going to create an affiliate program what are you going to do there's ways you can do this to generate online traffic i want to know what you're doing if you are a social enterprise a very brief statement of your positive impact on society uh i mean people do care about this uh i mean more and more people are concerned about esg uh businesses impact on the environment social and how you're governed this is important but it shouldn't drive your business plan don't spend more than a few seconds talking about it point it out because people care about it being there but focus your business plan on how you're going to make money because if you don't make money you're not going to be able to have any sort of an impact on society at all that is a lesson that a lot of entrepreneurs learn too late sometimes uh even non-profits now i deal a lot with non-profit organizations i coach a lot of non-profit organizations but here's the thing even a non-profit has to make a profit if a non-profit is not making money it will have no money left over it will pay its expenses but it will have no money left over to achieve its charitable mission the first goal of any non-profit or socially driven organization is to make money and that's what the judge