ally a negative it means that you're not focused uh on what on what you're talking about you're not focused on your business that's a real negative signal that you're sending so those are the six things that have to be in your elevator pitch and your business plan pitch now if you have time now in 30 seconds obviously you're not gonna have time for any of this but if you have a five to ten minute slot for your presentation um you know um try to see if you can squeeze in some of these things as well a one sentence summary of your cash flow projections now when you do a business plan you agonize a lot over the cash flow projection section you know what your costs are going to be and your revenue forecasts it's very difficult to present that information concisely in a five to ten minute business plan competition it's really meant for the meeting with the investors afterwards where you can pour over it with them together you know for several hours and figure out where all the holes are in it you can't really do this in a business plan competition but there are four things that that investors especially want to hear they want to know how long is it going to take you to break even what's your gross margin going to be what are your sales forecasts uh for the next x you know y z months and what is your retail price how much are you are you offering this to your customers for uh or you know if it's a b2b product what's your wholesale price the the way to do that in a single sentence is what i've just given you right here we expect to break even in six months with a 25 gross margin assuming a quarter of a million dollars in sale and a retail price of a hundred dollars per unit put that in your powerpoint slide that gives the the judge all the information that they need in a single sentence you don't have to show no whenever someone's doing a business plan with a powerpoint and they put up the whole cash flow projection and tiny tiny type that nobody can read that's an instant