rmal former google engineers now if you're doing a tech business that's incredible credibility if you're starting up a smoothie business how much do google engineers know more about smoothies than anybody any of the rest of us do i don't know um you know again make sure that it's relevant to the pitch and make sure that they fairly represent your customer base one of the most dramatic moments that we ever had on money hunt was um this was the 90s now when the internet first came along everybody was trying to develop portals the idea was that the internet people were going to create these grandiose websites that would own a certain piece of information that that you could only get that piece of information from this particular website we called it a portal uh we just we later discovered by the way that that wasn't at all what worked on the internet what worked on the internet was the search engine that was google's great insight that made them a gazillion dollar company uh but back in the early 90s everybody was saying let's build a portal let's create a portal for these people for doctors for lawyers you know and we will own that space we will own that marketplace because we're the only website on the web that deals with it that was the the thinking back then and this this but this entrepreneurial team had come up with the idea of setting up an internet portal for homemakers for stay-at-home moms where they could you know talk to each other share recipes you know share their stories about how wicked their husbands are and all this kind of stuff you know and back in the early 90s there was still a very sizable market especially in the heartland and in the south of of you know of people who were um who people who were you know were staying at home raising kids and doing stuff like that and going crazy okay so on the surface it sounded like a great idea but i saw something in their business plan i didn't like so when we got to the management section i asked this person