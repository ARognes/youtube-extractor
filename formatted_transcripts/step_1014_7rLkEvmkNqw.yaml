transcript: They told me that these are in the car of between Cornelia Sila and Julius Caesar. It's really amazing. And so, I was really >> [laughter] >> I didn't expect this, for sure. Like this? Is okay? Okay. Uh my name is Giacomo De Mola. My passion and I do from all my life is spearfishing and free diving. Actually, for a competition, a spearfishing competition, we were together with my assistant Igor Bisulli. We were in our boat searching for rocks under on the bottom actually to find some some fishes. It was a very good day, very good condition, the sea was calm, and it was a sunny day. And at some point we saw on the monitor one structure that was on the bottom of the sea. And this structure was a little bit strange. Was not like a rock that we found before in the areas, but was something else. When I was reaching, let's say, around 30, 32 m, it started to be darker and darker. And I could see, let's [music] say, 4 or 5 m maximum. But then I was closer and closer and started to see these uh like geometrical uh things. And I say, "No, man, this is definitely not a rock." At the beginning I realized it was something special, but uh not so much. Uh I I went to surface. I say I I said to my to to my assistant Igor, "Here, there is something special. You cannot believe what is down there." And and they characterized this uh between the first and the second century before Christ. So, [music] we speak about 2,200 uh years ago. And [laughter] so, I was really I didn't expect this, for sure. And there was a a big trade in all the Mediterranean with these ships. And for sure the Sicily channel was one of the main route of these ships.
