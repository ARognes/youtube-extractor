transcript: The psychology of people who believe they already have what they want begins with an act most people would call irrational. They act, feel, and decide as if the result existed [music] before there is any evidence. Most wait for confirmation before changing their identity. Those who believe they already possess what they want take that authority away from circumstances and refuse to let every delay, rejection, or difficulty decide who they are again. Neville Goddard called this >> [music] >> the creative power of imagination. In 1986, Hazel Markus and Paula Nurius offered a psychological parallel through the concept of possible selves. This video explains how believing you already have what you want reorganizes attention, behavior, and persistence. Why your feared self uses the same force against you and how to change strategies without abandoning the identity you chose. If your identity waits for reality, it has already handed reality the command. >> [music] [music] >> You already make decisions on behalf of a person who does not yet exist in the eyes of other people. >> [music] >> You can see it in the opportunity you avoid because you imagine you are not ready. In the conversation [music] where you lower your voice before anyone disagrees. And in the responsibility you accept before anyone recognizes you. The future [music] may look distant on a calendar, but it enters your conduct whenever a possible version of you is given authority over a present choice. That authority works [music] in both directions. You can prepare for a position you do not yet hold treating competence and responsibility [music] as qualities of the person you have decided to become. You can also retreat from a rejection [music] that has not happened allowing a humiliated version of you to control the conversation before the other person responds. [music] In both cases, an anticipated identity is already organizing real behavior. [music] Psychologists Hazel Markus and Paula Nurius called these versions possible selves. >> [music] >> They include who you might become, who you want to become, and who you fear becoming. A possible self is more than a goal. A goal describes something to reach, while an identity describes the person who will be present when that result arrives. It turns a general desire into a recognizable way of interpreting, >> [music] >> choosing, and responding. Consider the difference between wanting [music] respect and seeing yourself as someone worthy of respect. The desire can remain perfectly intact [music] while you accept constant interruption, present your ideas as apologies, and agree to conditions you believe are unfair. [music] Identity begins to change what you tolerate before recognition appears. The world has not confirmed the change, yet it is already meeting behavior the old definition could not produce. This inner reference creates the confidence some people display before evidence. They were not secretly guaranteed that everything would work. They built a definition capable of guiding the present without asking circumstances for continuous permission. [music] The job does not exist yet, but a professional identity already [music] shapes their preparation. The relationship does not exist yet, but an emotionally mature identity already changes their boundaries. The financial result does not exist yet, but a responsible identity already decides what to do with the resources available now. Circumstances keep their reality, but they lose the power to function as a complete definition. Being unemployed still means there is no job at this moment. [music] It does not mean competence disappeared along with the position. Loneliness remains a concrete condition, but it does not exhaust your capacity [music] to create intimacy. The balance in your account still requires honest decisions, yet it describes your current resources instead of decreeing [music] every future possibility. When these distinctions remain blurred, >> [music] >> every external fact enters identity directly. A negative response tells you that an attempt failed, but you convert it into a declaration of personal failure. A delay might reveal something about timing, >> [music] >> preparation, or strategy. The old definition turns it into proof that nothing will work. You assign the event a function it does not possess, defining the person who will face the next situation. [music] When I encountered the idea of possible selves, I had to revisit decisions I had called prudent and admit that many of them were obeying a failure I had only imagined. I had decided on that failure in advance and then confirmed it through my own immobility. The feared future did not need to happen in order to exercise power. It was already participating in choices that could either prevent it or help produce it. Because fear already makes the future act on the present, you cannot honestly say you will live from a future identity only after receiving proof. The mind anticipates shame, abandonment, or defeat and rehearses their consequences before any of them occurs. It brings a possible version into the present and begins arranging attention, posture, and behavior around it. The difference between those who believe they already possess the result and those who remain subordinate [music] to lack does not begin with the intensity of desire. It begins with the version of self authorized to interpret the day. A person can desire change for years while surrendering every decision to an identity [music] built by current circumstances. Another person can still face the same limitations but begin consulting a definition that did not come from them. This also explains why a new identity feels unfamiliar. The old one owns memories, habits, and accumulated consequences. It feels true because decisions made in its name have been confirming it for years. The new identity arrives without that archive and must operate before it feels natural. Its first sign [music] of presence will not be a dramatic result. It will be a small choice the previous version would have refused, >> [music] >> postponed, or left for someone else to decide. Those choices do not pretend the result already exists in the physical world. They recognize that every form of conduct [music] begins from a definition including definitions you never chose consciously. If the feared version is still consulted [music] first, it rules as an invisible authority. >> [music] >> When the desired identity begins answering, the future gains a present function. It provides [music] direction. The next rejection will arrive with concrete facts. It may be a message, a [music] decision, perhaps a closed door. What it will not carry inside itself is the final meaning of those facts. The identity used to interpret them will decide what you do afterward. [music] A negative answer can fit into a single line. They chose someone else, declined the proposal, >> [music] >> decided not to continue. That line tells you what happened in one attempt, but you usually add a second message [music] that no one sent. Someone else being selected becomes proof that you have no value. A rejected proposal confirms that your ideas do not matter. A conversation ending seems to reveal that no one will stay beside [music] you. The first message came from the event. The second was produced by the identity used [music] to interpret it. When the two are blended, the personal conclusion takes on the [music] appearance of fact, and you begin defending it with the same seriousness you use [music] to acknowledge the rejection. The world delivered a limited decision. [music] You expanded it until it could define decisions that have not even been made. This expansion happens quickly [music] because the old identity does not need to analyze every situation from the beginning. It already has an answer prepared for any fact that resembles its previous archive. A delay means disinterest, [music] criticism means inadequacy, and difficulty means incapacity. [music] Every event receives a familiar meaning before you examine what it can actually justify. Maxwell Maltz used the term self-image [music] for the inner conception of the kind of person someone believes himself or herself to be. This definition influences action, feeling, [music] and ability because conduct seeks coherence with it. Someone who sees himself as destined to fail does not need to decide consciously that he will fail. He only needs to interpret every difficulty as confirmation, then choose behavior that matches the reading. Self-image [music] operates less like a description you say aloud, and more like a system of permissions. It decides whether you are allowed to persist without shame, learn without treating ignorance as humiliation, >> [music] >> and occupy space without waiting for a personal invitation. It also defines what seems forbidden. Asking for another opportunity, presenting an idea again, charging firmly, or remaining in a conversation after a cold response. The external result has not changed, [music] but the choices you consider available have already narrowed. This is why a circumstance does not have to block a life [music] directly. Often, it only activates a definition that completes the rest of the work. After a rejection, another attempt is still available, but the identity that equates rejection with incapacity begins avoiding it. >> [music] >> Even during a delay, the goal could remain active. The conclusion of impossibility reduces [music] preparation, persistence, and attention until behavior no longer supports [music] it. An anticipated identity changes this process without inventing a different fact. Faced with the same rejection, it preserves the distinction between result and person. Perhaps the proposal was weak, the preparation was insufficient, or the opportunity did not match what you offered. Each possibility demands a different response, and none of them can be examined while every criticism is being received as a threat to identity. There is maturity in this position because it allows a fact to be unfavorable. Unconditional faith does not force you to call defeat a victory, and it does not turn every closed [music] path into a secret message of protection. An attempt may have been poorly handled. A skill may be below the necessary standard. A relationship may have ended partly because of something you [music] did. Preserving identity means being able to bear that information [music] without turning it into a total and permanent definition. A person who considers herself capable of learning can admit a lack of preparation more honestly than someone who needs every attempt to prove her value. For the first person, recognizing failure gives direction. For the second, >> [music] >> the same failure threatens to dismantle everything she would like to believe about herself. Defense then appears before learning. >> [music] >> She blames someone else, abandons the field, or pretends she no longer wants what exposed her. This movement shows that confidence and responsibility can grow together. Once the result stops judging your entire identity, you no longer need to distort the result in order to protect [music] yourself. You can receive the whole message, including the uncomfortable part, [music] and still choose the person who will respond to it. Anticipated identity does not weaken contact with reality. >> [music] >> It gives you enough stability to keep that contact from turning into personal collapse. Favorable facts also [music] need to be interpreted within their limits. Praise can tell you something worked without becoming the only source of value. An achievement can confirm preparation [music] without forcing you to defend it as proof of superiority. When identity and circumstance [music] remain distinct, criticism offers correction. Recognition [music] confirms a demonstrated capacity, and neither receives absolute authority. This measure changes what [music] happens after each event. Instead of asking what a rejection revealed about your worth, you ask what it revealed about that attempt [music] and what decision the chosen identity makes with that information. The question does not soften the event. It prevents a local answer from being applied to areas [music] of your life that were never evaluated. The old identity resists [music] this separation because it depends on predictable meanings in order to continue feeling true. [music] It needs delay to mean abandonment, difficulty to mean incapacity, and silence to [music] mean disapproval. Without those automatic translations, much of the evidence used to [music] support it loses force. Facts that require a response remain, but the verdict that used to arrive with them disappears. [music] There is, however, an identity that does not wait for any fact to begin this work. It anticipates rejection, prepares the body for defense, and reduces your choices before the world has decided [music] anything. When the event finally arrives, it seems to confirm a sentence that had already been directing your behavior from the beginning. [music] The identity that anticipates rejection [music] does not begin working after the answer. It enters the conversation before you, lowers your voice, adds explanations no one requested, [music] and prepares an exit in case the other person shows disinterest. By the time the answer arrives, it meets behavior already organized by the feared possibility. This reaction [music] reveals an ability that often goes unnoticed. You may find it difficult to act from a result that is still [music] invisible, yet you perform that operation whenever you treat possible failure as a psychological presence. The loss has not occurred, The humiliation has not [music] happened, and the abandonment has not been decided. Even so, you adjust your conduct like someone who must survive all [music] three. Hazel Markus and Paula Nurius included both desired and feared versions among possible selves. A future identity does not need to be attractive [music] in order to guide behavior. Someone can organize years of choices [music] around avoiding poverty, irrelevance, dependence, or loneliness. The feared future provides [music] direction with the same force as a goal, although the direction is built around [music] escape. Escape defines movement without having to name a destination. Someone afraid of appearing incompetent avoids questions that would reveal what still needs to be learned. Someone afraid of rejection searches for relationships where [music] true need never has to be shown. Someone afraid of losing money rejects decisions that require risk assessment, even when standing still carries the greater cost. The person feels protected while the possibilities available to life grow narrower. That protection becomes persuasive because it produces immediate relief. You do not send the proposal, and for a few hours you are free from the possibility of hearing no. You avoid the conversation and escape the discomfort of holding a boundary. You refuse responsibility and remove the risk of failing in front of other people. Fear receives a quick reward for every decision that keeps it in command, while the loss caused by that decision usually appears much [music] later. This relief allows the feared version to gather evidence. It predicts that you will be rejected, >> [music] >> directs defensive behavior, and finds confirmation in the other person's distant reaction. >> [music] >> It predicts incapacity, prevents the practice that would build competence, >> [music] >> and uses the lack of preparation preserved by avoidance as proof. The feared future participates [music] in producing the facts that later seem to justify it. Expectation and outcome do not have a mechanical relationship. Other people retain choices of their own, opportunities genuinely close, and difficulties can arise without your participation. The feared identity works within the part that belongs to you. >> [music] >> What you notice, communicate, attempt, avoid, >> [music] >> and sustain. That part alone is enough to alter many results before you recognize its presence. [music] A person ruled by fear also exercises faith before evidence. She grants authority to something that [music] has not been confirmed, treats the possibility of failure as reliable guidance, adapts the body to the prediction, [music] and calls the whole process prudence. Her loyalty can run deep because every safe choice [music] protects the feared version from a test that might disprove it. Recognizing risk leads to proportionate preparation. Obeying an identity of failure turns possibility into a personal definition [music] and demands retreat. An interview may end in rejection, so you prepare for it. When rejection already means inevitable humiliation, preparation gives way to defense, and you enter the room trying to leave intact [music] instead of showing what you can do. Feared identities record losses you want to avoid [music] and can reveal what you value. The distortion begins when they receive exclusive authority to interpret every situation. Concern about financial stability can produce responsible attention. Turned into an identity of scarcity, [music] it blocks any decision that cannot offer total certainty, a condition almost no meaningful change can satisfy. [music] While the desired version remains described only by results, the feared version often possesses [music] far more concrete instructions. You may say you want success, but you know exactly how to avoid exposure. You say you want intimacy, [music] but you know every way of depending on no one. You say you want freedom, while you can quickly list everything that could go wrong if you released your present control. That difference in precision determines which identity is able to act. The desired version offers a distant image. The feared version already decides how to respond to real situations. When a choice appears, >> [music] >> fear does not need to improvise because it has spent years defining what to avoid. Hope remains remote until it becomes a criterion capable of guiding behavior. You discover which future governs your life by watching decisions made without immediate reward. If a choice exists mainly to prevent shame, rejection, or loss of control, the feared version is using [music] the present to preserve its own continuity. Recognizing that reveals the problem, but leaves one demand unanswered. The desired identity must produce a concrete response before [music] the next decision arrives. A desired identity remains abstract [music] while it only describes the final result. You say that you are confident, >> [music] >> prosperous, or respected. Those words do not yet tell you how to answer a difficult email, what boundary to hold in a conversation, [music] or what to do with the first hour of an ordinary morning. Until identity reaches that level, the chosen future inspires you for a few minutes, and then hands your decisions back to the old self. The next decision turns declaration [music] into direction. Its purpose is to show that the new identity has begun participating in your conduct [music] before the result exists in the world. Someone who has decided to become a reference in his field [music] can study the problem everyone else avoids. Someone who has assumed an identity [music] of financial stability can look directly at numbers she once ignored. Someone who chooses more honest relationships can say what he wants without attempting to [music] control the answer in advance. None of these actions guarantees the complete outcome. They serve another function. They take identity out of isolated imagination and give it an observable form. Until then, you had [music] an intention. After the decision, you have a precedent. The next choice no longer begins from exactly the same place [music] because a previous action now demonstrates that this way of living can exist in [music] your behavior. Maxwell Maltz drew attention to the role of self-image in psychocybernetics. [music] A person tends to act within the limits of the image >> [music] >> accepted about the self, even when consciously wanting a greater result. This helps explain why a grand affirmation loses force in front [music] of a small choice. The statement describes an ideal version, while the decision reveals the range of action the person actually permits. Expanding that range requires a form of coherence that is possible under present conditions. [music] A person who believes he already possesses authority over his own life takes responsibility for what he still needs to learn, asks for the necessary information, and stops using beginner status as a permanent definition. His identity appears in the way he responds to [music] a current limitation without requiring a performance of perfection. The same applies to money. [music] Acting as someone financially stable can begin with organizing commitments, [music] negotiating terms, refusing an impulsive purchase, or searching for another source of income. Spending money to create an appearance of abundance [music] would only serve the performance. The result is still under construction, but the decision already obeys the person who knows how to manage what is available. This criterion prevents faith from becoming [music] an escape from circumstances. You look at the present fact accurately and ask which response belongs [music] to the identity you chose. A debt remains a debt, a missing skill still requires practice, and a difficult conversation [music] keeps its discomfort. Psychological anticipation changes who encounters [music] those facts and therefore changes the responses available. >> [music] >> A coherent decision must also be specific enough to happen. Become more disciplined [music] leaves change inside the territory of intention. Opening the document at the [music] scheduled time, finishing the agreed task, or removing a distraction from the environment creates an act you can sustain. [music] The grandeur of a promise offers little to identity. Its strength grows in real situations where it begins directing you. This is why quiet decisions can matter more than dramatic gestures. [music] A dramatic gesture often depends on the emotion of the moment and lets you feel transformed before you [music] face repetition. The quiet choice returns when no one is watching, when enthusiasm declines, and when the circumstance still looks unchanged. In that setting, [music] inner fidelity stops being a speech. Every coherent decision reduces the distance between [music] declared identity and practiced identity. That reduction creates a form of confidence different from excitement. The ability to respond in accordance with the desire begins supporting confidence that once depended on emotional intensity. The future stops being only something you hope to receive and becomes a reference that organizes present behavior. [music] This organization reaches the meaning you give discomfort. The old identity treats [music] difficulty as a sign that you have left the place where you belong. Chosen identity can treat the same difficulty as part of the learning required to occupy a new position. Discomfort remains, but it loses the right to decide the meaning of the experience by itself. When a choice seems too small to matter, notice what it allows the old identity to preserve. Postponing a call can keep [music] intact the version that avoids negotiation. Hiding your work can protect the version that associates [music] exposure with danger. Ignoring an expense can preserve the version that prefers surprise to responsibility. The external size of an act reveals little about the structure [music] it supports. Faced with a specific situation, ask which response would be coherent with the person you decided to be. That question brings identity close to the choice available now. Fear, discomfort, and uncertainty may remain present during the action. [music] The decisive point is to remove their power to choose in your place. After that choice, the result may take time, the attempt may fail, and the circumstance may require correction. At this point, a dangerous confusion appears. The belief that remaining faithful to identity means insisting on the same strategy. The decision gave the new version of you a body. Now, you must keep that fidelity from becoming rigidity. A failed attempt can disturb more than the plan. When you attach one strategy to a new identity, the failure of that strategy [music] seems to prove the transformation itself was false. A rejected proposal stopped being information about price, timing, or communication, and becomes evidence that you were never capable. The event reopens an inner decision that should already have been settled. The fidelity required at this moment belongs to identity, not to the method used in the first attempt. You can remain someone committed to building a solid business, and admit that the offer did not work. You can sustain the identity of a person capable of a healthy relationship, and recognize that a particular relationship must end. You can believe in your professional value, while [music] accepting that you still lack a specific skill. These corrections preserve contact with reality. [music] The chosen identity gives you a psychological position from which to examine the result. It does not grant immunity from mistakes. If a conversation produced resistance, [music] you investigate what you communicated. If a routine failed for weeks, you study the [music] structure that made repetition unworkable. If the market responded differently than expected, [music] you revise the hypothesis behind your decision. Rigidity repeats the same behavior to protect the belief that admitting error would destroy identity. Someone insists [music] on a product no one understands, maintains a partnership that consumes every resource, [music] or continues using a method that produces exhaustion. He calls this persistence [music] faith because he fears any change will be interpreted as doubt. When you defend a strategy as proof of identity, you still give circumstances the power to define who you are. The method has to work because [music] without that result, identity would lose its support. >> [music] >> The appearance of certainty hides complete dependence on external confirmation. The greater the insecurity, >> [music] >> the stronger the need may become to defend every choice as inseparable from the desired future. Infidelity [music] allows a more sober relationship with facts. You do not need to turn every delay into a favorable sign, >> [music] >> or every rejection into persecution. A result can indicate insufficient preparation, a poor choice, or a condition outside your control. Receiving that information does not require you to return to the old identity. It helps improve [music] the next response of the identity you chose to sustain. A person who considers herself [music] capable of learning can examine her own error without converting it into humiliation. She asks what must be understood, which resource needs development, and what part of the strategy should be abandoned. >> [music] >> The error defines the work that remains without becoming a sentence [music] about her worth. Her willingness to correct expresses a confidence that is able to see. The capacity to correct also protects you [music] from insisting on goals that have lost their meaning. Identity and result are not the same thing. You may have [music] associated freedom with one particular company, recognition with one position, or love with one person. By sustaining the inequality you were seeking, [music] you may discover that the form you chose was too narrow to express it. In some cases, >> [music] >> changing the goal itself becomes the first decision genuinely coherent with identity. The person who chose freedom may close a project that has recreated dependence. Someone committed to reciprocity may stop negotiating a loan for a relationship to continue. [music] Someone who respects her own work may refuse a promotion that requires the destruction of every boundary. The criterion lies in the origin of the change. If you change direction to escape the discomfort that accompanies any growth, the old identity may be taking command again. If you change because you learned something that made the previous strategy inadequate, the correction expresses [music] maturity. The two situations can look identical from the outside. Only an honest reading of the decision [music] reveals which version of you is being preserved. That honesty keeps faith from becoming an obligation to remain optimistic. Frustration, [music] exhaustion, and doubt can appear without receiving authority to redefine [music] identity. You can acknowledge that a stage was painful, that you lost resources, or that you expected another result. Fidelity appears when those experiences inform your response without determining the limit of what [music] you consider possible. Delay also changes function. For the old identity, waiting confirms that nothing is happening >> [music] >> and provides a reason to quit. For the chosen identity, the interval can reveal what needs adjustment, [music] practice, or time. This interpretation does not promise that every desire will be fulfilled. >> [music] >> It keeps the temporary absence of confirmation from deciding the meaning of the entire journey. Persistence means continuing to produce coherent responses while incorporating what reality [music] teaches. The psychological destination remains stable, and the paths can be corrected as many times as necessary. You preserve the decision about who you are becoming while keeping open the investigation into how that person acts under real conditions. When this flexibility is repeated, something begins changing before the final achievement. People around you encounter steadier conduct, [music] less defensive decisions, and a presence that no longer demands recognition [music] at every step. The result may still be distant, but the new identity [music] has already entered the relationships that will help build it. People rarely have direct access to the future you chose. They encounter present signals, the clarity with which you present an idea, the boundary you hold, the responsibility you accept, and the way you react when an answer takes time. Long before they know the final result, they respond to the identity that has started appearing through those [music] behaviors. A person who considers himself incapable often enters a negotiation trying not to bother anyone. He reduces his own request, offers concessions before hearing an objection, and accepts conditions that confirm his lower position. The other party may know nothing about the inner history involved, but receives the message transmitted by that behavior and adjust the response accordingly. When identity changes, the interaction receives different information. You present value with greater precision, tolerate the silence another [music] person needs to consider it, and hear a refusal without turning the conversation >> [music] >> into a defense of your worth. The final decision still belongs to someone else. While these changes reshape the experience that person has when meeting [music] you. The same process appears in close relationships. Someone who fears abandonment may demand reassurance in ways that create pressure, >> [music] >> interpret tiredness as withdrawal, and use every interval as a test of the bond. By sustaining an identity worthy of reciprocity, that person can express [music] need clearly, observe the real response, and recognize when the relationship offers less [music] than she has decided to accept. The social world responds to patterns that become visible over time. You demonstrate reliability by doing what you agreed to do, authority by taking a position, >> [music] >> and self-respect through the agreements you accept and refuse. These qualities reach other people through repeated choices organized by the new identity. No announcement about your transformation is required. This repetition also changes the opportunities [music] you can perceive and sustain. Someone who recognizes his ability to contribute [music] enters conversations he once avoided, presents work he once hid, and stays long enough in environments where he still feels like a beginner. The opportunity can look purely external when it finally appears, although part of the path was opened by behaviors that made it possible. Psychological anticipation finds its most concrete effect here. The person acts as if the result already [music] exists because she has stopped using its absence as a definition of self. Copying the external signs of achievement or persuading others that a non-existent condition is real would only create an appearance. Her conduct comes from an inner authority to participate in creating the result. Neville Goddard presented imagination as a creative power and defended the inner experience of a fulfilled desire. Psychologically, this proposal can be understood as the early adoption of an identity that reorganizes perception and action. The desired future begins exerting influence now before it takes visible form in circumstances. That influence begins with the meaning assigned to events. A delay can be read as personal condemnation or incomplete information. A rejection can reactivate the old [music] identity or help correct a strategy. An opportunity can be ignored because it looks too large or examined by someone who already permits herself to learn what she does not yet know. The fact enters the experience and identity guides the response that continues it. Believing you already possess what you desire preserves 