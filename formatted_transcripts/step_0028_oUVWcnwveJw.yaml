ou end up appealing to no one. But if you make yourself resonate with one specific group, that group will ride for you and treat you like one of their own, right? And it's so Addison Rae is such a fascinating example of this because she was like more popular and getting more views doing those stupid Tik Tok dances, right? But it was understanding that views and exposure does not equal artistry. And in order to be perceived as an artist, she needed to create a world. And creating a world means doing something different from everybody else. So that had to stop her doing the thing that she was known for and sacrificing those views and that attention to make something that was worth paying attention to. Again, stop trying to make people pay attention and start making something that is worth paying attention to. This is how Addison Rae completely flipped this public perception of her, right? She used to do anything she could to get attention, appearing on the Kardashians, making Tik Toks with them, doing random Netflix teeny bopper movies, calling the paparazzi on herself, doing Entertainment Tonight interviews, but that was not worth paying attention to. Now she has started to create something worth paying attention to. She has created this world. There is a clear visual to it. There is a clear aesthetic to it. You can easily identify who lives in it, who wants to be a part of it. And by not trying to appeal to everyone, she ended up appealing to more people because it was specific and the depth of connection matters. I think this is again when I talk about like why I think numbers and quantitative data has really destroyed like music and marketing in so many ways is because people think that all connections are created equal and that cannot be further from the truth. Like even as a creator myself, right? Like I can tell you that 100,000 views on a Tik Tok versus 100,000 views on a YouTube video of mine are not even remotely comparable, right? Because my YouTube videos are 45 minutes long. So if 100,000 people watch me for 45 minutes, that is the same as that one person on Tik Tok watching 45 of my Tik Toks, which would be like a month and a half worth of content, right? These are not the same thing and that is true for music and all forms of art as well. Like not all connections are created equal and the music industry really fumbled the bag post pandemic because they thought that just these people with big audiences would be like, okay, great. Well, if they have like a 1% conversion rate and if they have you know, 80 million subs, then we can assume that's 800,000 streams in the first week or whatever, blah blah blah. And that ended up not being true for on multiple people in multiple genres of all things. Like not all communities are created equal and the depth of the connection matters and it is better to have a small group of people that love you and resonate with you and connect with you than it is to have a lot of many quantity that just kind of know you exist and don't really care about you. Like quality over quantity is so real in all aspects of things and data and numbers are incapable of reflecting that. So what does Addison Rae do next? I think the number one thing she needs to do is continue building this world. Like it's really working for her. Diet Pepsi has like taken off in a way that I think she didn't even imagine. And she needs to define it as to how it is uniquely Addison, right? She's really benefited off of this borrowed credibility so far from Charli XCX, you know, kind of being this like it girl, party girl. And also Lana being this very like romanticized Americana, vintagey, 2014 aesthetic, but she has yet to define how Addison's version of those two things are different from their version of those two things. And I think if she really wants to be able to identify with this long-term, she needs to find a way that makes it a bit more unique to her specifically. And I also think she's really in this make or break moment where everything she does needs to be in line with building and defining this world. Like I would not take a brand deal from Zara right now if I was her. But I would take a brand deal from like Ford trucks. You know what I mean? Like even if those things seem like counterintuitive to her audience because if she wants people to perceive her as an artist, she has to do something that the artist would do. And if she does something that an influencer will do, that is how people will think of her. And then I think she really needs to keep this momentum. Like one more single within the next two to four months and then 2025 is absolutely the year for her to release an album. Every major pop artist has or is releasing an album this year, which means they will all be on tour next year, which means that we will be in this like massive deficit of like new pop music. Everything I think we're going to be listening to in 2025 is going to be things that were released this year, but maybe just like didn't get as much attention until they like went viral as a performance or went viral on tour. So I do think that there will be this really big hungering for new music and I think she has an opportunity to really step in there. And then she also needs to define a signature sound or style that is unique to her. the visuals and the branding is incredible. Like it's already there almost, but I don't think I could listen to a song by another artist and be like, oh that's so Addison Rae. And I think she needs to do that with these next like singles or album. Um but in conclusion, I think that this is like one of the most interesting rebrands in history, truly. Like it is so fascinating to me how many people with hundreds of millions of followers. I think of Dixie D'Amelio, Charli D'Amelio, Bella Poarch, Lil Huddy, JoJo Siwa have been trying for years to do this and not a single one of them really achieved it. And that is because they did not focus on building a world. They did not focus on being an artist. And I think what Addison understands is how to be an artist. Even if she doesn't fully understand how to make music yet, she understands how to be an artist. And she understands that if you want people to pay attention, you have to make things that are worth paying attention to. So that is the rebrand of Addison Rae. Please subscribe to the channel. Follow us on Spotify. Please, we're so close to top 25 ranking. So guys, please, please, please. We can do it by the end of the year. Top 10 by the end of this year is our goal. We're so close to 20K. What's up? I love you and I'll see you next week. Bye.
