transcript: "\U0001F4D8 My book Technical Behavioral Interview hit #1 on Amazon. If you're interviewing soon, this is the playbook: https://geni.us/BehavioralInterview-yt\n\nKun Chen reached E7 at Meta and Partner level at Microsoft faster than almost anyone his peers knew — and then walked away from management to go back to writing code. Now a solo builder, he breaks down the monthly growth test that told him when to quit, why learning to lose control as a manager made him a better AI orchestrator, and why true vibe coders will always hit a ceiling without real engineering experience underneath them.\n\nGuest Links:\nhttps://linktr.ee/kunchenguid\nhttps://kunchenguid.substack.com\nhttps://x.com/kunchenguid\n\n00:00:00 - What Tells You When to Quit\n00:03:13 - Learning to Code With Pen and Paper\n00:06:06 - Building Cheats for MMOs\n00:08:07 - The Internship That Changed Everything\n00:32:37 - Why I Left Management\n00:34:19 - The VP Who Knew I Was Lying\n00:36:37 - The Micromanagement Trap\n00:41:35 - From Senior to Staff at Meta\n01:14:09 - Are Junior Engineers Actually Dead?\n01:16:51 - True Vibe Coders Will Always Hit a Ceiling\n01:23:16 - Don't Carry the Burden Manually\n01:25:49 - The Human Role Will Keep Shifting\n01:40:47 - The Night Shift Workflow\n01:44:19 - Why Open Source Licensing Is Dead\n02:05:31 - Taste as the Last Defensible Human Skill\n02:09:10 - What's Next"
