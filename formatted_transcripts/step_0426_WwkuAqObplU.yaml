t so what we're going to do is instead of having these if statements inside a loop over all of our enemies we're just gonna split our enemies into three different arrays we've got an array of normal enemies an array of frenzy enemies an array of dead enemies and we can now process them all separately we can have a process normal enemies function that we hand an array of normal enemies that has no if statements in it at all right because it doesn't need to check that they're dead it doesn't need to check that they're in frenzy because it knows based on you know the fact that that's what the function is expecting to do to do when it gets passed an array of enemies it's like okay I know that I'm expecting to get an array of enemies that all adhere to these particular requirements same with the frenzy same with the with the dead enemies right and if you're really astute here you will have noticed right that when I said infer one of the interesting things about that is we actually don't need our enemy State enum at all anymore right because by just passing the array of normal enemies to a function that deals with normal enemies we have implicitly stored the fact that they are normal in the uh array membership right we've hidden the information in there so an enemy's dead just by virtue of it being in the dead enemies array we don't even need to store that data and this wonderful technique is called taking information out of band I first heard it from Andrew Kelly um the zig Creator in his talk I think it's practical DOD practical data oriented design wonderful talk you should definitely check it out but this technique is super valuable splitting things into arrays you can eliminate booleans you can eliminate enums and just imply that information based on the array membership and making these changes of course means that now we just have that single unsigned integer uh as our enemy we could even just get rid of the struct if we wanted to and just have an array of integer 