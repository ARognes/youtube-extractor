ed of course that Andrew Kelly talk practical DOD is very good the foundational talk in this topic of of course is data oriented design in C plus by Mike Acton cppcon I think in 2014 maybe if I remember correctly the red the iconic red Hawaiian shirt absolutely strongly recommend watching that and of course there are some fantastic Modern Performance oriented educational material from Casey muratori as well which is highly recommended hope you enjoyed the talk if you ever want to chat to me about programming or Game Dev or just you know performance optimization in general I'm on a bunch of social media at Nick Barker again and I'm always happy for a chat thanks
