tructs we're still wasting 58 of that cash line on pointless data right so in this case we're going to make the the tiniest little chains the only thing that we're going to do is we're going to swap the Declaration order of that string ID and the the dead Boolean and because you know how alignment works now you can tell obviously what's going to happen the 8 byte string ID can go and fit into the first container now and the dead and frenzy booleans can just fit one after another into the second container so our struct size has come down from 24 to 16 and now we only have six bytes of waste and the only thing that we had to do was change the order of the variables declared inside the struct which is pretty crazy when you think about it but when you understand how it actually works on the hardware it makes perfect sense right so as soon as we do that because the strikes are all smaller we're now 10 faster down to 190. Um this can be even more of a difference depending on the situation how the prefetch is working that kind of thing but in a general sense again just smaller more tightly packed data with less waste is what we want to be going for I know you're probably Galaxy braining on like thinking about the alignment of all of your structs now but don't think too hard it's very easy to do it all you have to do is order it from the largest to the smallest and you're guaranteed to have the Pack most packed uh outcome so in this case we put the eight by one first and then two one by ones after so the next thing we're going to do is we're going to look at those two booleans because to me when I see multiple booleans I start to get suspicious because something that we don't often think about with booleans in computer science in general is that they are combinatorial in terms of the number of states that they can encode and what that means is if I have one Boolean I have two possible States right if I have two booleans I have four possible States three booleans is eight states Etc the number increases very rapidly right and often a lot of those States actually don't make sense so in this case we're looking at the dead and the frenzy booleans it's like okay if an enemy is alive and it's in frenzy mode that makes perfect sense if an enemy is alive and it's not in frenzy mode also okay if an enemy is dead and in frenzy mode if it's dead and not in frenzy mode like what does that distinction mean like to me that sounds like a classic example of like a bug that comes up later when QA is like oh yeah when you get to the shaman boss um he resurrects goblins and sometimes they just come back to life in frenzy mode and you're like oh yeah the frenzy Boolean I forgot to set it to false when the enemy dies like that type of thing so this is the code cleanliness issue not not just a um a performance problem this can also help uh just allow you to capture a better representation of all of the valid states of your program so what we're going to do is we're going to replace those two booleans with an enum that just encodes all of the valid States so instead of having a dad and a frenzy ball we have three states in an enum a live normal a live frenzy and dead so those that dead normal and dead frenzy state is not encoded anymore and predictably when we make this change the code doesn't get any faster and you know why because we looked at the alignment from before so you know that you know that first container is still eight bytes of the ID and the second container the enum is just fitting into the second container where the two balls were fitting before so the struct's the same size as a result the code doesn't get any faster here's the interesting thing though that enum is four bytes right four bytes is an enormous amount of range it gives you four and a bit billion values you know the the maximum amount of memory that you could have on a 32-bit operating system right it's a huge number we only need three values right we don't need four billion values so a very small change that we can do this works in both C sharp and uh most C plus plus compilers is you can just slap colon byte on the end of that enemy State enum and that just tells the compiler hey I want this enum to be encapsulated in one byte instead of four which is the default there's very little downside to doing this the compiler will actually complain if you overflow the size of the enum that you're using so you don't have to worry about that and you know predictably when we downsize to a byte the code doesn't get any faster again because we're in exactly the situ the same situation alignment wise the enum state is just one byte now instead of four in that second container um so it might seem that this is pointless from a performance perspective but you've got to remember that if you're using the xenom somewhere else like packing it into an array you can now fit four times more of those enums in an array than you could before when they were four bytes in size and indeed if you Benchmark this it does make a significant difference to the speed so it's worth thinking about that as well um the next thing that we're going to do as you can probably predict seeing that eight byte container and the one byte State afterwards just we're gonna get rid of that string just just don't use strings please please don't use strings um they're is this classic uh depressing example of um in Grand Theft Auto online someone noticed that the it was taking a very long time to load into the world and you know seven or eight minutes something verging on intolerable and they actually went and profiled the application and found that it was spending 70 percent of that loading time just with a single core pegged at 100 struggling to process a 10 megabyte Json string right and people look at this thing and say like oh well Rockstar they're just bad developers or something they're absolutely not right no way and I can tell you that what most likely happened is when the game shipped the config file the Json config file was quite small and there was no noticeable performance impact at all right and then as you push out patches and that config file grows slowly the performance just craters exponentially because strings are just full of landmines that don't necessarily show up until the scale starts to increase a little bit more general rule if I'm here if a human isn't going to read it don't use a string use something else and indeed what we're going to do here is we're going to replace that string ID with an unsigned integer again like I said before a four byte integer will give you four billion values in range so if you're planning to spawn more than 4 billion enemies in your game come chat to me I'm I'm very interested in in what you're doing right if this container is too small um but because the ID was the biggest thing and still is the biggest uh member in the struct the container size that we talked about before comes down from eight bytes to four bytes instead so now we have that four byte ID our one byte State enum is in the second container so the structures come down from 16 to just eight bytes in size and as a result we get a 20 performance increase by getting rid of that string and now we're down to 153 which is about double the speed of our original for Loop just through this Progressive little series of tweaks and so we're gonna keep going so now what I'm going to do is I'm going to reveal some performance issues that are lurking under the surface in the same way that they were with that string that I showed you before so I'm going to increase the number of enemies by 10 times and the number of deaths and as a result deletions from the list by a hundred times per frame and the performance just degrades exponentially when we do this right and the main reason for it is that enemies dot remove at function call so when you use a list wrapper in something like c-sharp or C plus even the way that they work is they provide you two guarantees right the first one is that the elements in the list will always remain in order and the second one is that there are no holes and so as a result if you delete the first element in the list it actually has to shuffle every single subsequent element in the list backwards by one to fill the hole and maintain the ordering and as a result you know every deletion is incurring this you know big cost on moving things around in memory in the list so the first thing that we're going to do is just move that deletion call to a bulk delete at the end of the loop instead of in every iteration and it's immediately just three times faster right this isn't even implemented amazingly well you know when we call remove all it still has to iterate the entire array of enemies again and run a delegate on every single one of them to check if they're dead but removal internally at least Waits until you've done all the deletions before it does that compaction operation rather than compacting every single time after every delete right and that makes such a significant difference and the interesting thing about this is we can actually go further right because do we actually care about the things staying in order or there being no holes right those are the important questions to ask so in this case it's really important to understand like maintaining a stable position in memory is a cost that you have to pay and so in our case we actually don't care about the enemy the enemies being in the same order right they have an idea already for us to identify them and we just want to iterate through all of them we don't really care about what order we're running through them in so what we're going to do is we're going to replace that list with a very simple data structure called swap back array and the way that swap back arrays work is that if I request to delete the element at position six what we do instead of shuffling uh positions 7 to 12 backwards by one instead we're going to copy element 