on there's a bunch of if statements that say like if the enemy is dead call the on death callback otherwise if the enemy is in frenzy either because of a global override or because it's locally in frenzy we handle the frenzy mode otherwise we just do the standard enemy Behavior so the very first big sweeping optimization that we're gonna make here is we are going to get rid of that update function right we're going to split this into two things a data class that just has those three member variables the Dead the ID and the frenzy and we're going to convert that update into a bulk processing function that takes a list of enemies and processes a whole bunch of enemies at a time there are so many reasons why this makes things a lot faster in fact Unity actually officially recommends that you do this they call their pattern an update manager or something because of course you know Unity loves inventing new words for things that already exist um there are so many reasons why this is so much faster to do it this way but a picture is really worth a thousand words so here is a wonderful visualization from Takashi kejiro who actually works at unity and it shows the difference between sort of Random Access of a bunch of different pieces of data that are all different sizes and fragmented in memory versus just like burning through a linear array of packed data of the same type so it gives you an idea of why one of these is much faster than the other so that's the first change that we're going to make the next thing that we're going to do is get rid of that callback function get rid of that on death uh delegate or function pointer this is another optimization that is very hard to quantify because the impact on performance is functionally unlimited right one of the most important things that you'll understand now because I've explained how the case line works right is that when we access something like the enemy the enemy when we Define that enemy variable we want to make sure that what we get in the cache line afterwards is packed data that we're actually going to use right but when we call this on death function we call this Co this code is we can refer to it as unmanaged because Anything could happen right we have completely lost control of the performance characteristics of this Loop because calling this on death function could do anything it could make calls to the network it could write things to the disk it could call a whole bunch of unity apis you know it could evict the entire L1 cache right we've lost control of the performance characteristics of this function so instead what I'm going to do in this case is I'm just going to inline what was inside that function anyway which is just removing the enemy from the list you might not be able to do this in practice I'll give you some techniques to manage that but yeah just for illustrative purposes we're just inlining the functionality that was inside that callback this is something sometimes referred to as the Observer pattern and in a general sense it's just performance poisoned you know it can get out of control very quickly so now that we've got the two sort of large high-level optimizations out of the way we'll start looking at stuff that we can actually measure so the very first thing we're going to do next is called hoisting invariants now I know this sounds you know like complicated technical jargon but it's actually very simple right invariant is just not varying non-changing right hoisting is just lifting up so it just means lifting things that don't change out of flips so in this case because you now understand that just accessing a variable can be very expensive if variable accesses are always going to result in the same thing coming back so right we we can expect that inside our Loop the global frenzy on the global config is always going to return the same value right so we can just lift it out of the loop and cache it locally so we don't have to make that load out of memory every single time and as soon as we do this it's just 10 faster right so we've started from a baseline of 309 and we've come down to 284. so hoisting invariance is a great technique to learn next thing we're going to do is we're just going to go ahead and convert that class to a struct and as soon as we do that it's 30 faster right just a big win immediately all we're doing is changing the keyword and the reason that this happens in this case is because of the way that classes and structs are stored in arrays so structs when we store them in arrays are packed right next to each other because they're a value type right they're all stored in one long linear stripe in memory same as integers or floats would be inside an array compared to classes which instead you know are actually not stored in line in an array an array of classes is actually just an array of pointers right and the pointers each point to different locations on the managed Heap now if we're lucky those classes might be nearby on the managed here but in the worst case right um every single one of them could be stored in a very different location and so you can understand now from what we've learned about cache lines right when we access a struct in that array the only thing we're going to get back in our cache line is more struct because the structs are all packed next to each other if we access a class in our array the only thing we're going to get back in our cache line is lots of pointers right packed into the cache line and then we need to make additional individual requests to memory out to the Heap to get the actual class that the point is pointing to right and in the very worst case all of those accesses could be L2 cache misses right which are very slow um and you know obviously it makes it even worse that we have a string ID on there so it's you know it's another uh indirect request to memory and now you can start to see how nested class structures with lots of nested pointers um tend to add 