hen it comes to CPU performance if you have a good foundational intuition for what makes the computer go fast and what makes it go slow you can get 80 of the way towards a really well performing game with not all that much effort as long as you start from the beginning like this and so whenever I'm trying to develop a fundamental intuition for anything in engineering I start with the foundational engineering question which is what's the problem that we're actually trying to solve as game developers writing code for games and my assertion is that games are a real-time system and as a result the problems that we're trying to solve are the problems that are shared amongst all real-time systems right so real-time systems are very simple all they do is they take some input and they deliver an output within a deadline within some amount of time so in this case for games we're taking the buttons that the user is pressing the current state of the game the amount of time that's passed since the last frame and we're delivering an image to be displayed on the screen within a deadline of about 16 milliseconds if we want to hit 60 frames a second right it's reasonably simple and so what I'm going to do is I'm going to make an analogy to a different real-time system and we're going to use that to try and understand some things more deeply about the way that the computer works and the other real-time system that I'm choosing is a kitchen in a restaurant so if you've played a lot of overcooked now it's your time to shine and so we're going to do a series of exercises where I'm basically going to say well the existence of X in the restaurant kind of implies the existence of why in the computer I know it sounds really strange but I promise you the analogy holds so let's get started so when I think about work getting done in a restaurant the first thing I think of is a chef right chefs can perform a series of tasks one after another if you have multiple chefs they can do multiple streams of work in parallel the existence of the chef in the restaurant implies the existence of the CPU core in the computer you can see where I'm going with this but of course if you just Chuck a bunch of chefs in an empty room they're not going to be able to produce any food right the first thing that they need is tools knives dropping boards frying pans that kind of thing on the seat on the computer the tools that the CPU core uses are called instructions but of course chefs can't produce food with just only tools we have one key missing piece of the puzzle and that is ingredients chefs use tools on ingredients to produce their output in the same way that the CPU core uses instructions on data to produce its output so you're kind of getting a feel for how this analogy works so now we'll start to probe with some performance oriented questions you know if we were looking at the performance in our restaurant and we were thinking okay well we have to chop like a thousand onions over a shift well how fast can a chef chop one onion right it's a reasonable question to ask there are obviously very fast and efficient ways of chopping onions just as they're very slow oh and stupid ways of chopping onions right and the equivalent question that we can ask of the computer is what is the Big O notation of this algorithm of this piece of code how fast will it run but the really interesting thing is here is that we have jumped quite a few steps along the line and skipped over some fundamental assumptions when we're asking how fast can a chef chop an onion right because before a chef can even start chopping an onion we have to think about stuff like well where's The Chopping board right where are the onions where are the knife where are the knives yes where is the knife even what we're essentially asking in this case is you know these things the tools and ingredients where where are they stored where are they coming from how do they get moved around and this is a really important thing to understand be going rotation only captures the speed of actually doing the work right but getting the tools and ingredients into the right place for the work to happen right is actually very important and can be extremely expensive even occupy the Lion's Share of the amount of time that you're spending in some cases if you've ever cooked like a really complicated recipe that you've never made at home you'll know that immediately all your bench space just fills up with random ingredients you run out of space you're constantly moving things around and losing track a bit you know moving tools and materials out of storage into the workspace and back and forth is very expensive and so before we think about the speed of doing the work we're going to look at storage space you know how do things get stored and how do they get moved around so in a restaurant in terms of a chef there's really only one place that a chef can actually do work right and that's right in front of them right if they want to do something with an onion it's going to be on the chopping board in front of them for them to chop it in the frying pan right right in front of them and on the computer that is called a register registers are the only place on a computer where work can actually happen if you want to add two numbers together you have to load them from somewhere else and put them into registers and then you can add them so it's the only place where we can actually do work now if you're in a restaurant and the onion you want to chop is not right on The Chopping board in front of you where's the next closest place it could be well it could kind of be in a box say right next to the shopping board on the bench right in some area within your immediate reach you still have to reach over and grab the onion out of the box and put it on the chopping board it's not free but it's pretty fast right and on the computer that's called the L1 cache you can't do work in the L1 case you still need to move data out of L1 into a register in order to work on it but it's pretty small and nearby so we're happy if the data that we're looking for is in the L1 cache uh next up if the onion that you're looking for is not in your immediate vicinity well kitchens usually have some storage they have shelves they have cupboards that kind of thing you might have to walk over take the box of onions off the shelf walk back over to the bench put it down open the box take the onion out put it on the chopping board you know it's a little bit slower a little bit further away and on the computer that's called the L2 cache right takes a little bit longer to move something from L2 into a register than it does from L1 and now some kitchens are some restaurant kitchens are big enough that they have like a storage area out the back right significantly further away and this is the equivalent of the L3 on computers right some computers have l3s some don't the main thing is it's just larger storage that's further away you probably have to tell your co-workers hey I'm going out the back to get something you know you take whatever you're cooking off the heat so it doesn't burn that type of thing significantly less convenient than grabbing it just out of a box right next to the chopping board now if a customer orders say the salmon for your restaurant and you realize that you don't have any salmon anywhere not in the bench not in the shelves not in the storage out the back right you're probably thinking at this point whoa I hope the supermarket is still open right you're driving out somewhere to get those ingredients and on the computer that is the equivalent of going out to main memory and just to complete the metaphor where does the supermarket get its food from well it gets it delivered async from the farm right you don't go to the supermarket and then ask them for something that's going to come synchronously from the farm it gets delivered async in the background and that is the equivalent of loading something from the disk it really is far enough away that you're basically getting the data from the farm and an interesting thing to notice here is this General trend of as we've gone down the list the storage just gets larger and further away and so a reasonable next question to ask is well how much larger how much further away so we're going to look at each type of storage how big it is and the latency as in how long it takes to take data from that type of storage and bring it into a register to be worked on and I'm going to give that number in CPU Cycles you can think of a CPU cycle is just like the base unit of operation that a CB you can do say adding two numbers together is like one cycle it's not quite like that but it's easy enough for the illustrative purposes of this example so first up we have the registers they are very very small um eight bytes usually for the general purpose registers on a 64-bit chip there are larger registers for doing Vector operations and that kind of thing but you don't really need to worry about them here obviously the latency is zero Cycles because the value is already in the register we don't need to move it anywhere next up we have the L1 cache a little bit larger a little bit further away we're up to 64 kilobytes of size now which is still not much you know a 64 kilobyte image is not great quality and now it's costing us about three Cycles to move the value from L1 into a register so it's not free but it's pretty cheap move up to L2 again larger now two megabytes significantly slower 20 Cycles now to get some data from L2 and move it into a register to be worked on if we go up to L3 again significantly larger significantly further away we're looking at 32 megabytes of storage in L3 and now it's costing us about a hundred Cycles to get data from there and move it into a register and just like with the ingredient that I mentioned before if we can't find our data in any levels of the cache we call that a cache Miss and that means that we're going all the way out to main memory to try and get our data so as I mentioned going out to main memories like driving to the supermarket and I was not kidding right going out to dram to main memory to get data is going to run you about two to three hundred Cycles right two orders of magnitude more than L1 it really is very very slow and again just to complete the metaphor uh if if you want to make a random read um going out to disk to a modern SSD it's going to run you about 300 000 Cycles so very very slow not synchronous at all you can't really depend on that data coming back this Frame and so that brings me to a couple of kind of foundational ideas about how to optimize for real-time systems in general you can see that because there's this escalating cost of accessing storage that gets further away some we can draw some pretty reasonable assumptions from that right the first one is that if you're gonna do something you should do it as many times as you can if you're going to pay to set up to do a task you should amortize that cost over doing the task in bulk as many times as you can and a very similar idea is that if you're going to bother to move from one place to another you may as well take as many things with you as you can right don't just move one thing move a whole bunch of things and this image in the bottom right corner here will give you a little clue for where I'm going with this next right because if you want to get something from the supermarket and bring it back to your restaurant you have to take some kind of vehicle right you're driving a truck or you're driving a van out there and the interesting thing here is trucks and vans have a limited capacity right you can't just go and buy the entire supermarket and drive it back to the restaurant in one trip in exactly the same way the thing that goes out to main memory and gets data for you and comes back is called the cache line and it has a capacity of a whopping 64 bytes that's bytes with a B right it is very very small just to reiterate you're paying two to three hundred cycles for 64 bytes of data it is extravagantly expensive and just to really Hammer home the points probably the most famous performance optimization of all time in game development is John carmack's fast inverse square root from Quake 3 and the way that this works is they needed to calculate the reciprocal of a square root of a floating Point number and square roots of floating points were quite expensive right and they had to do this thousands or tens of thousands of times a frame so it really added up and so they developed an approximation that was much faster than having to actually run the square root calculation instruction it involves some absolutely Unholy floating Point bit manipulation you want to know how to know how much time this actually saves how expensive a floating Point square root was on a Pentium 3 in 1999 about 30 Cycles the most famous Game Dev performance optimization of all time was to save 30 cycles and you're paying two to three hundred just for 64 bytes of data back from Main memory I cannot overstate the impact of the interaction with the case and with memory that it has on the performance of your code and it's not captured by things like Big O notation at all right it's really important to understand this and so given that Coach lines are so expensive and so small it's very reasonable to ask like well what's in the cache line right we should try and get the best value for what we're paying you know if it is so expensive and the way that the case line works is that when you access a variable in code say we're accessing an integer on some object we generate a load instruction the cache line goes out to main memory to the address that we asked for it gets us our integer and we'll load 64 bytes in a straight line from the address that we asked for so in this case we'll get our four bytes of integer and then we get 60 bytes immediately following that