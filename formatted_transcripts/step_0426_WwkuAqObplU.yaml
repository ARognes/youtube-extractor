er a function should ever take one of something or whether you can convert it to take an array of things instead third rule of thumb do as much ahead of time as you possibly can if you don't need to do it at real time don't right in the same way that we prepare ingredients before the dinner shift starts we pre-compute as many things before we ship our game or on Startup before we enter into our frame Loop that kind of thing as we can why do you think it's called baking you know lighting needs to be rebaked it's because when you open your bakery at 7am you don't open with nothing and then have a customer come in and be like I'd like a loaf of sourdough bread please and you're like cool thanks for the money that'll be 36 hours you know you you prepare that stuff before the real-time constraints start so you can actually adhere to your input output latency requirements and the fourth uh rule of thumb which has a big asterisk on it because I'm not gonna go into it in much detail is parallelism right it's a whole Beast of a topic so I won't talk that much about it but General High Level rule of thumb if you have multiple chefs you should be using them right your restaurant's not going to do well if you have one Chef in the kitchen you know like sweating and cranking out meals for all the customers and the other seven chefs are in the back Lane smoking and watching Tick Tock it sounds ridiculous but that's literally what's happening when you have one CPU core pegged at 100 percent and a general like rule of thumb for riding multi-threaded code is that you want your cause to be doing two different streams of work that don't require any synchronization and then having a cheap combined operation at the end rather than having the two tasks try and synchronize between them you know in the same way that chefs produce kind of half the ingredients for a dish each and then they all just get quickly plated together into the one dish at the end um it's also worth mentioning just as 