transcript: '{"content":"\n[0.32s] A viewer of mine recently asked a great\n[3.04s] question. What does Buddhism have to say\n[5.839s] about living sustainably?\n[8.4s] Now, the honest answer, at least early\n[11.28s] Buddhism, which is generally what I''m\n[12.96s] talking about here, is has technically I\n[15.599s] would say nothing to say very much about\n[18.0s] living sustainably because the Buddha\n[20.48s] lived 2500 years ago in a world of\n[23.519s] abundant nature and biodegradable\n[25.76s] materials. He didn''t teach\n[28.16s] environmentalism because\n[29.84s] environmentalism\n[31.439s] wasn''t a thing back then. However, the\n[34.559s] Buddha taught a lot about consumption,\n[37.28s] greed, and harm.\n[40.32s] And if we apply those ancient principles\n[42.559s] to our modern crises, we find a\n[45.44s] surprisingly sophisticated guide for how\n[48.399s] to live lightly on the Earth. Not just\n[51.92s] to save the planet, but to save our own\n[54.64s] minds.\n[58.64s] One place we can take inspiration from\n[60.8s] is a verse from the Dhamapada which is\n[63.199s] perhaps the most famous compendium of\n[65.84s] early Buddhist dharma. It says, \"A bee\n[70.0s] takes the nectar and moves on doing no\n[72.96s] damage to the flower''s beauty and\n[74.799s] fragrance.\" And that''s how a sage should\n[78.24s] walk in the village.\n[81.28s] Now, in context, this verse was most\n[83.759s] likely saying that the wise monastic\n[87.52s] should walk lightly among villagers and\n[90.159s] not overstay their welcome. They''re in\n[92.96s] the village for alms round and perhaps\n[95.6s] to teach a little bit of dharma and\n[97.52s] nothing else.\n[99.84s] But nowadays, when we hear that kind of\n[102.72s] stanza, it may remind us of the US\n[105.2s] National Park Service slogan, take\n[107.6s] nothing but pictures, leave nothing but\n[110.0s] footprints.\n[111.68s] Now, our bee is in fact taking\n[114.159s] something. It''s taking nectar. It\n[117.2s] consumes resources from the flower, but\n[120.64s] it does so in a way that leaves the\n[122.96s] source intact and healthy.\n[126.24s] And of course, the bee is also doing a\n[128.72s] service to the flower by pollinating it.\n[132.48s] So, what can we gain from this early\n[134.959s] Buddhist metaphor?\n[137.28s] Sustainable living is not about starving\n[139.92s] ourselves. It''s not about not taking\n[142.48s] nectar, nor about avoiding the village\n[145.2s] at all.\n[147.44s] Instead, it''s about taking only what we\n[150.319s] need. Leaving the flower, the village,\n[153.36s] the parks undamaged as we leave.\n[159.44s] But let''s go a little bit deeper here.\n[161.599s] Why do we over consume in the first\n[163.68s] place? It''s all about that second noble\n[167.28s] truth, thirst, craving, or in Pali\n[171.44s] what''s called tanha.\n[174.56s] We drink endlessly from this fountain of\n[177.12s] consumption to fill our thirsty void.\n[181.04s] But as we know, this void can never\n[183.76s] really be filled by material things.\n[185.92s] It''s always on to the next. This is our\n[188.959s] dissatisfaction engine at work.\n[192.64s] Let''s take an example. Buying something\n[195.519s] that we don''t really need in order to\n[198.319s] impress other people that we don''t\n[200.319s] really like.\n[202.239s] In this case, we''re creating suffering\n[204.319s] twice or at least twice. On the one\n[208.08s] hand, we''re creating internal suffering\n[210.159s] for ourselves by reinforcing our own\n[213.76s] greed and restlessness.\n[216.56s] On the other hand, we''re also creating\n[219.76s] external suffering by extracting\n[222.319s] resources and creating waste need\n[225.44s] needless waste that may harm other\n[227.76s] beings.\n[230.239s] When we contemplate this syndrome, an\n[233.2s] insight may arise in us. That is, the\n[236.48s] most sustainable thing that we can do is\n[239.12s] to work on the cravings inside our own\n[242.64s] mind.\n[244.56s] When we''re content with our lives, we\n[247.36s] naturally consume less. And what we do\n[251.04s] consume is perhaps more thoughtfully\n[253.92s] curated.\n[257.84s] There''s no question that nowadays the\n[260.079s] most important decisions about\n[262.16s] sustainability\n[263.68s] must be made on a global scale. They\n[266.96s] must be made by governments through\n[268.88s] enforcable regulations.\n[271.44s] Carrots to incentivize sustainability\n[274.4s] and sticks to dissuade repacity.\n[278.479s] Much as the Buddha praised wise\n[280.72s] governance, these are subjects basically\n[283.919s] outside the scope of an early Buddhist\n[286.4s] mindset.\n[288.08s] However, what''s central to the early\n[290.24s] Buddhist mindset is doing our best to\n[293.44s] live a life of nonharming.\n[296.479s] Right speech, right action, right\n[299.36s] livelihood.\n[301.199s] When it comes to right action, we might\n[303.919s] extend this to actions that consume. We\n[306.96s] might say right consumption is part of\n[309.28s] right action.\n[311.12s] Can we find ways to consume more wisely?\n[315.44s] Now, this isn''t about guilt tripping\n[317.84s] ourselves for every plastic bag that we\n[320.56s] pick up. It''s about our intentions.\n[324.4s] Can we bring mindfulness to our\n[326.72s] purchases?\n[328.24s] Is this purchase of ours really\n[330.32s] necessary? Is it really going to be to\n[332.8s] our benefit? Does it cause unnecessary\n[336.32s] harm or for livelihood? Can I find ways\n[340.32s] to make my livelihood more sustainable\n[342.88s] and less harmful?\n[345.759s] While we pursue these intentions, it''s\n[347.84s] often helpful to keep in mind the\n[350.72s] stanzas of the next stanza, I should\n[352.8s] say, of the damapada after the one about\n[355.68s] the bee.\n[357.759s] It goes on to say, \"Don''t find fault\n[360.96s] with others with what they''ve done or\n[363.12s] left undone. You should only watch\n[366.24s] yourself and what you''ve done or left\n[369.52s] undone.\"\n[372.8s] The Buddha''s main focus was internal.\n[376.16s] How we manifest greed, hatred, and\n[379.44s] delusion.\n[381.12s] practice for yourself and trust that\n[383.68s] your example is going to become a\n[385.52s] guiding light for others.\n[390.88s] Sustainability is often misunderstood as\n[394.24s] deprivation.\n[396.0s] Do with less, turn down the heat, stop\n[399.44s] traveling.\n[401.28s] However, what the Buddha taught was that\n[403.6s] simplicity, that is having few desires,\n[407.28s] is the path to freedom. It''s not a kind\n[409.6s] of punishment.\n[411.759s] For example, take the Buddha''s\n[413.199s] monastics.\n[415.039s] They own nothing or next to nothing.\n[418.479s] Just robes in a bowl. Are they\n[421.599s] miserable? No. Often they''re some of the\n[424.319s] happiest people around. Why is that?\n[428.16s] Because they''re not burdened by the\n[430.0s] maintenance of so much stuff.\n[433.039s] This is something my wife and I realized\n[435.28s] after our house fire. Sure, there were\n[438.4s] some things that were we were sad to\n[440.72s] lose, but on the whole, it was freeing\n[444.319s] not to have to deal with all of our\n[446.16s] clutter that we used to have.\n[449.28s] The takeaway from all this is that\n[451.28s] living sustainably is not just good for\n[454.319s] the planet. Done properly, it can also\n[458.16s] unbburden us.\n[462.72s] So to return to our opening, the Buddha\n[465.759s] wasn''t really an environmentalist. That\n[468.319s] would be anacronistic.\n[470.72s] But his teaching of the middle way can\n[473.039s] be seen as a great guide to\n[474.639s] sustainability.\n[476.479s] It avoids the extreme of indulgence,\n[479.199s] that is mindless consumption, while also\n[482.639s] avoiding the extreme of\n[484.4s] self-mortification, that is wallowing in\n[487.36s] guilt and deprivation.\n[490.16s] The upshot, therefore, is to live more\n[492.24s] like the bee. Take the nectar you need\n[494.8s] to live well, but aim to tread lightly\n[497.599s] so that the flower remains for others in\n[500.4s] the future to enjoy.\n[503.36s] In fact, contentment is one true key to\n[506.96s] happiness.\n[508.56s] If you want to explore how to be happier\n[510.72s] with what you have right now, check out\n[513.519s] an earlier video of mine on that\n[515.36s] subject. I''m going to put it up on up on\n[517.279s] the screen in a moment.\n[519.599s] Meanwhile, I''m curious. What''s one small\n[523.279s] way that you try to be like the bee in\n[526.0s] your own life? What would you recommend?\n[528.72s] Let us know in the comments. I''m sure\n[530.24s] we''d all love to learn something from\n[532.08s] each other. Thanks to all of you for\n[534.64s] your continued practice and please be"}'
