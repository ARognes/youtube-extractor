transcript: '- [Danny] Hi, everyone. Danny from Noclip here, and I''m delighted to announce that our documentary series, "Hades: Developing Hell" is now available for you to buy on Blu-ray. Our friends over at Supergiant Games have produced this physical edition of the series and have teamed up with Fangamer to offer all six episodes, covering over three years of development, from the game''s early access launch at the Game Awards, to its various content updates, how art, music and voiceover were created, how the studio reacted to the COVID-19 pandemic, all the way to its remarkable 1.0 launch. The Blu-ray contains a booklet featuring letters from both myself and Supergiant creative director Greg Kasavin. There''s a reversible front jacket featuring early concept art by Jen Z. The episodes have been edited to include some nice director''s cut flourishes. It''s got full closed captions in English, it''s region unlocked, and is all on a single disc. Oh, and Fangamer are also throwing in this sweet little Zachary as the cameraman sticker. This is also the first time Noclip has ever had a physical edition of any of our documentaries. So if you''ve enjoyed this series or like the work that we do to preserve the story of video games, this is a great opportunity to pick up a unique piece of history. Stock is limited with this, so make sure you grab yours early. That''s "Hades: Developing Hell" the complete series available now on Blu-ray on fangamer.com. Visit the link at the description or head to supergiant.games/developinghell. (dramatic music)'
