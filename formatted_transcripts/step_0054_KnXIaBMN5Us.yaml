transcript: '[music] >> So, in this video, I''m going to share exactly what changed [music] and what I did on a daily basis to learn French. So, when I was restarting learning French, initially I did sign up for classes at the Alliance Française. At that stage, classroom learning had been all that I''d known. I was put into an A2 beginner class. The teachers would all speak in English and it was a lot of textbook reading. But, even though the classes itself didn''t really help me that that much, one tiny little moment from one of the classes completely changed my French journey. So, since leaving school, something that I''d always really struggled with was listening to French. There''s a lot of letters that are not pronounced and there''s also the liaison where you carry over the sound of the consonant to the next word if it starts with a vowel. That made for me understanding a full sentence basically impossible because I could not figure out what the different words were. And this biggest turning point for my French journey was that one of the teachers at the end of the lesson played an Easy French YouTube video. And Easy French put dual subtitles on all their videos, so they''ve got French, they''ve got English. They often do a lot of really interesting street interviews where they talk to other native speakers in normal-paced French. And from there, I just started watching a ton of French YouTube videos. And as I was watching more and more easy French videos, I was finding French easier to understand. Reading the French subtitles was helping me to hear the words that I was reading. And then YouTube started recommending to me other YouTube channels by French creators who would speak very slowly but clearly and still in French. I was watching a lot of French Mornings with Elisa and Français avec Nelly. I shortly discovered the Chrome extension called Language Reactor. And this would give me dual subtitles similar to easy French videos, but on literally any video on the platform. I got the pro version so I''d started to click on the words that I didn''t know and save entire sentences. I would go back and replay sections. There''s these different keyboard shortcuts that allow you to replay and go back to previous subtitles. I would also hide the translations a lot of the time and just glance up at them or show them when I needed to to validate my understanding. If the video was too fast, I would slow it down. When I would do this on my phone, I would turn on the transcript and also activate the subtitles at the same time and I would translate the subtitles into English. So that way I would still have the dual subtitles. And also sometimes I would shadow the speaker. They would say something and then I would either pause the video and replay it or reading the subtitles along with them. Another thing that I would do with the Language Reactor Chrome extension was that I would activate it on Netflix movies and TV shows. [music] And I''d turn on the French dubbing. They have something called ASR subtitles which is basically just going to use speech recognition to transcribe the subtitles rather than using Netflix ones. I''d pick movies and TV shows that I really wanted to watch or that I had enjoyed in the past. Like I spent a number of time watching The Vampire Diaries in French because I watched that when [music] I was a teenager and because I was also quite familiar with the plot and the different characters, it made picking up new words and understanding the French language easier as well. And at first, I used the subtitles a lot, but over time, I turned off the subtitles when I gained some confidence and would just test my listening alone. >> [music] >> So, I was trying to fill my ears with listening to French as much as possible. And when I would be driving to work or getting ready in the morning or cleaning, I would either listen to YouTube videos or podcasts in French. They started coming out with this auto-generated transcript [music] feature. So, I''d sometimes go through the podcast later on as well [music] and I''d read it through on my phone and I could highlight the words and translate them. There were a number of podcasts that I found really helpful when I was still at that beginner stage, like [music] the A2 stage. And then there were a number of podcasts that I found helpful for B1 sort of intermediate learners. And then again, I started listening to podcasts made for native speakers [music] as well. And if someone was speaking too fast, well, again, within the podcast app, you can go ahead and slow down the speech. [music] I would similarly do this exercise with listening to music as well. I''d listen to a lot of French music and sometimes I would go through the lyrics. I signed [music] up to the platform iTalki and I found myself a native speaker to just have French conversations [music] with. The tutor would give me corrections. And so, sometimes I would put these new words or these new expressions [music] into an Anki deck and I would review them as flashcards, which would help them [music] to stick into my brain. Something these sessions also helped me with was my pronunciation. I used to always say "vu" instead of "vou". And I just wasn''t aware of it. But as soon as it was pointed out to [music] me, I could hear the difference between the two sounds. But the other really helpful thing about doing these conversations [music] was that it highlighted to me where my gaps and my weaknesses still were. To work on these weaknesses, I took some online classes on the platform Linguee. And I signed up for the Sprint Challenge where to take 30 group classes in 2 months, but they do offer some less intense, more flexible plans. I found the classes really well structured and they crafted in a very helpful way. Plus, they do different classes across loads of different, actually interesting topics and you have to engage. And I found them very effective. I resumed my iTalki conversations with my tutor. She remarked that she barely had to correct me anymore. To hear a native speaker say that about my French who had quite clearly seen the before and after felt amazing. So to expose my brain to some different sentence structures, I started reading in French. And I used this one app quite regularly called Linguee. Now one feature that Linguee have, which is really cool, is they have these mini stories which are really beginner friendly. They use a lot of common vocabulary. But the other thing I love about this app is that they have this ability for you to tap on different words that you don''t know and it''ll just give you an instant translation. Plus, you can track all the words that you already know. They also have a whole database filled with books and short stories in the app. And so I read Le Petit Prince, L''Étranger, Le Linguiste. And I also purchased some ebooks and I imported them into the app. There was one in particular which was a translation of a book that I really enjoyed in English, which I highly recommend doing because [music] you''re already familiar with a lot of the plot and the story and the words as well. I also bought the books short stories for beginners in French and short stories for intermediate learners in French, and I listened to the audiobooks of these. And I absolutely love these books. There''s another thing I did, which is maybe a little bit of a weird one because I''m not religious, but I would read the Bible in French just on my phone because there''s like a free app and there''s also an audiobook as well. To get even more reading practice, a really cool thing that I did as well was subscribe [music] to French email newsletters, and I''d read through them on my phone, plus I could highlight over any words and entire sentences that I didn''t know, just translate them straight away. At more of an A2 and B1 level, I found a lot of the teachers'' newsletters very helpful. And then at more of an intermediate level, I started subscribing to email newsletters made for native speakers. Hugo Decrypts does a French [music] daily news email newsletter, and then there''s like Julien Song who creates a weekly chess newsletter. I still wanted a way to practice my speaking on my own. I have a few ways. One was to use voice chat with AI bots and ChatGPT, and I would just chat freely back and forth. For example, when cooking or driving, it''s a [music] really good way to do this. But I also used the dictate feature with ChatGPT, and I use this a lot even today. And so, I basically pick a topic, and then I just talk about it as much [music] as possible. I can talk for minutes, however long I want. If I don''t know a particular word, then I''ll just say it in English, and then just keep going. So, once I''ve finished with my little dictation spiel, I''ll basically ask it to correct my work and to provide me with some new suggestions in a way that will say things that are more natural sounding. And then I''ll go through everything in my own time. I can ask for further grammar breakdowns [music] if there''s something that I don''t understand. Something I also do is record myself running through the revised version of it, and I''ll put it in a voice memo on my phone, and then I can even listen to it that back later on. I also sometimes would journal like this out loud or journal in my grid diary app and then copy and paste all my words into chat GPT, ask it to correct it. Honestly, chat GPT can do so many things and is such a powerhouse for language learning now that I created its own separate video about 15 different ways in which you can use chat GPT to learn a language. I would have done a lot more of those methods if I were relearning French now. Alors, voilà. Merci beaucoup d''avoir regardé cette vidéo. J''espère que cette vidéo vous a plu. Je vous souhaite bonne chance, bonne continuation, bon courage. Je sais que parfois c''est difficile d''apprendre le français, mais vous pouvez le faire.'
