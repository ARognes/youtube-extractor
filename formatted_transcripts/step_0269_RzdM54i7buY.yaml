transcript: So, HTTP in C++, how hard could it be? Turns out not very hard with CPP HTTP lib. So, this is a C++ 11 single file header only crossplatform HTTP/HTTPS library. We've done heaps of networking related stuff on this channel with C++, but we haven't actually looked at HTTP. For those of you who don't know what that is and how that's different to the networking we've been doing, this might not be the video for you. I don't know. Should I explain all the different networking things? No, probably not. Anyway, what you're looking at here is HTTP. The way that we requested this website from some kind of server somewhere on the internet, it got delivered here. We can render it and display it. That happens using something called HTTP. It's just a protocol that we use to transfer data over a network. It's different than what we've been doing so far, which is a little bit more raw with TCP and UDP. This is a lot higher level in that it lets us create an actual server and then serve some kind of content. And then on the client side, we would create a client with some sort of HTTP address like this and then use different methods such as get or post to actually request data. Which means that if you're not making some sort of multiplayer game or you're not streaming data constantly, you just want to be able to, I don't know, have a database on a server and then read that from C++ for whatever reason, you would most likely use something like HTTP. You would request something from the server. The server would do all the processing and then it would serve you something. Now, this library over here, CPP HTTP lib, is the simplest thing I've used in my experience. I mean, it's a C++ 11 compatible single file header only cross-platform library. Literally, all you have to do is grab this http.h file and just include it. Include it in a CBP file and you're ready to go. So today we're going to take a look at how to use this and we're going to look at the full picture including how to actually surf some data from our server so that we can then request and use it in C++. And to make things a little bit easier and to have an actual UI instead of just a command line tool, we're going to be using Walnut. I'll have a link in description below to both Walnut and HTTP lib. Okay, so over here in Walnut, we have a really really simple example. Most of this is actually just the example code that comes from the dev branch of walnut in the example app. I have literally set up like the most simple HTTP example I could think of. First and foremost, we have to include this HTTP lib file. So, here it is. This is this is the file. All I did was just grab like this raw file and just save it. And then I'm just including it. That's it. That's how easy it is to use this library. And then what I'm doing is in the constructor of this example layer, I'm actually creating a client with an IP address. This is the IP address of a hosting a server that I set up for this. We'll have a look at that in a minute. And then what I'm doing is requesting this API page that gives me some kind of result. This is the status of the result. So usually you'd expect it to be 200. These are just HTTP status codes. I'm just printing that so that we have some kind of idea as to what's going on. And then the body of the result is going to be a string which I'm storing inside this data string and then later rendering. Again, really really simple example. We're going through the constructor first. We're grabbing the data and then we're reading from it. So there's really no need for threads or asynchronous programming in this case. Doing this on the main thread like this will probably increase your startup time slightly, but it's okay. We'll have a look at a more complicated example later in this video. So if we give this a run, once it opens, we have our data window with secret information. So this is the string that we're actually retrieving from the server. So what exactly is a server do