m Cherno. So yes, as I mentioned, really, really simple example. However, if you're just getting started with this kind of stuff and you don't know how it works and you just don't need all that extra complexity, this is the simple case. This is just what we're doing. And with HTTP lib, you can see it's really easy to just grab some data from a server. Now, from here, the possibilities are endless. You could have like some PHP code. Hopefully not. You could have some code running here like server side even. You could be using JavaScript. It might be requesting some information from an actual database, building up like a whole like JSON kind of response for you with all the information you need. You can really do anything you want with this. Now you've made that connection between server and client. Now let's take a look at a slightly more complicated example. We're going to have a look at the weather. So I did a little bit of googling and I found this free weather API openmeo.com. You can see it's got an example over here as to how we can request some data from the API. And then the response is just in JSON. Now I have adapted this to show the weather of Melbourne. That's where I live. I just typed in Melbourne latl long. Here it is. I put that over here into the HTTP get request. And that's it. It just gives us the current temperature over here. 19.7° C. Getting this into our C++ application is no different than what we just did with the exception of probably wanting to pass this JSON. For the JSON paring, I'm using this library over here. I'll have it linked in the description below as well. But then weather is also something that we probably want to keep updating. So if the app is running, I don't really want to just fetch the weather, the temperature once at the beginning and then just that's it. I want to keep requesting it because I want that information to be up to date. So that's also something that this slightly more complicated example shows as well. So if we just hit F5 and take a look then you can see that we have ta the weather over here it's 19.7° awesome. However the difference is that every minute this will actually update. So how does that work? If we have a look at how it's actually using that HTTP lib is basically the same thing. We just have our client that we set up with this website over here and then we request something using get. As you can see it's just this URL. Of course, once again, we're printing the status, but then we're using that JSON library to actually pass it. And then we're grabbing the current temperature because that is what we need to do to get this double here. So, this is actually a double. All the extra complexity, all the extra code around this is just to make this operation asynchronous. The thing is, we're running our UI rendering every frame and we don't want any kind of network activity to interfere with that because requesting something like this from a server takes time. You can also see that this literally has to wait. It's a blocking operation to wait until we actually get that data back. It's not like we're setting up a call back and it will notify us later when it's available. No, like we just call get and that's it. Here's the result over here. So, it has to happen synchronously, which is fine as long as we have a separate thread that we set up over here. So, we're creating a new thread. It's this request thread over here that runs this function. And then it will just execute this code over and over again, he says as he forgot the while loop. So, this is what I meant to write. That's funny. Now realistically you want this to terminate if the application like is requested to be closed and all of that but this is just a simple example. Let's just ignore that. So we have this loop that will run this code over and over again. However, you can see that it will sleep for 1 minute. So it will run it like every minute but again on a separate thread. So this is kind of running concurrently just sleeping mostly while we are continually updating our UI every frame. But then how do we get the data? How do we get the actual temperature from this thread to this thread? So many ways, so many different ways to do that. This is probably my favorite way in this case for this scenario to do that. The simplest way would probably be to just create like a mutex around the string that is like the weather info in this case. That's what we're displaying in the UI. That's what the temperature is. You could lock the mutex, set the temperature from this thread, then unlock the mutex, and then on the UI thread, lock the mutex, render, unlock the mutex, or at least lock the mutex, copy the data to a local string, unlock the mutex, and then later render with that local string. However, that requires locking a mutx every single frame, even though like we barely update this data like once per minute. You know how many frames we render in a minute? If this is running at VSync on my monitor, which is 144 hertz, that's a lot of frames. That's a lot of needless locking unlocking mutexes. It just it doesn't feel very good. So instead, we double buffer this. We have two different strings and then an index into which one of the two strings we're basically working with. This index is also atomic to make sure that we're not reading and writing to it at the same time. So then all we have to do is in the common case when we're just trying to render it, we just grab like whatever the current index is and we use that to actually access this weather info array. But then when it's time to update the data, we grab that current index and we increment it. We write into the other index. So we could be reading at the same time, but we're reading from a different index because we haven't atomically written it yet. We're writing to one index, for example, index number one. We're reading from index number zero. And then finally, when that write has completed, we're going to store the new index, which means that next time we load this, it'll be our new index, and we are reading and rendering the new updated data. Anyway, this is just a brief look into this kind of stuff. I didn't really plan this to be like a multi-threading tutorial or, you know, too much kind of multi-threading related. It's mostly about the HTTP of course, but this is just the kind of stuff you need to do when you are dealing with networking. You need to make sure that a lot of your stuff is running asynchronously if it is repeatedly requested like this. I mean, honestly, even in the other example, I would also make that asynchronous. It's just I was trying to be really simple and not involve threads at all. If you guys are interested in seeing more networking or multi-threaded related content, let me know in the comment section below. Currently in the first example we looked at in this video we were just using engine X as our HTTP server. However, HTTP lib can also create servers. So that would be something that I would love to explore in a future video. And also SSL we have not touched anything to do with HTTPS because that involves roping in more libraries. Again trying to keep things simple but that is probably something that I would take a more serious look at in a more serious context. Hope you guys enjoyed this video. If you did, please don't forget to hit the like button. Definitely check out hosting.com/churn. They have some amazing Black Friday deals on at the moment. It's honestly the best time of year to pick up a server. Thank you all for watching. I'll see you next time. Goodbye.
