fore an LLM processes anything you type, it first breaks your text into these tokens. This process is called tokenization. Understanding tokens matter because they affect almost everything. How much a request costs, how much text you can send and receive, and why an LLM sometimes splits a word in a strange place. When you''re building AI agents, tokens are the currency you''re spending with every single interaction. So, here''s a concrete example. Take the sentence, the tokenization process is fascinating. When tokenized, it breaks it into six tokens. The tokenization process is fascinating. Most of those words stayed whole. They''re common enough to be their own token. But tokenization got split into two, token and isization. So why did tokenization get split? Because the tokenizer learned that token and isization are common building blocks. By breaking words into reusable pieces, the LLM can handle words it''s never seen before. So if it knows token and isization separately, it can also understand globalization, visualization, civilization, any word with that ending. The rarer the word, the more pieces it gets broken into. A word like anthropomorphisation, I hope I got that right because becomes five separate tokens. Not every word is one token. Common short words like the, is, and are each one token. They''re extremely frequent in training data. Common longer words like computer and language also get their own single token because they appear often enough. Uncommon words like tokenization get split into two or three tokens broken into known subpieces. Numbers vary by tokenizer and might be one or two tokens. code tends to use more tokens because punctuation and keywords get split up and non-English text typically uses more tokens per word because it uh was less represented in the training data. The pattern here is frequency. The more often a word or phrase appeared in the training data, the more likely it gets its own single token. rare words, technical jargon, and non-English text get broken into smaller pieces, which means they cost more tokens and take slightly more effort for the model to process. Now, a rough rule of thumb, one token is roughly four characters of English text, or about 34 of a word. So, a 1,00word essay is roughly 1,300 to 1,500 tokens. Tokens aren''t just a technical detail. They directly affect three things you''ll care about when working with LLMs. cost, speed, and the context window. Starting with cost, LLM providers like OpenAI, Anthropic, and Google charge per token, both for what you send in and what you get back. More token means more money. To give you a real example, GBD40 charges around $2.50 per million input tokens, and $10 per million output tokens. A 500word prompt costs fractions of a cent. But here''s the thing. Output tokens are four times more expensive than input tokens. That''s because input tokens are processed all at once in parallel, while output tokens are generated one at a time, each requiring a full pass through the model. That sequential generation is much more computensive. Now, this seems cheap for a single request, but an AI agent that makes hundreds of LLM calls per task can add up fast. Speed is the second factor. LLMs generate one token at a time. It''s the next word prediction we covered earlier. Now, more tokens in the response means a longer wait. A 100 token response comes back much faster than a 2,00 token response. And third, the context window. Every LLM has a maximum number of tokens it can handle at once. That''s the context window. It includes both your input and the model''s output. To give you a sense of how fast this has grown, GPD 3.5 in 2022 had a context window of about 4,000 tokens. GPD40 in 2024 jumped to 128,000. And now in 2026, models like Cloud Opus 4.6, GBD 5.5, and Gemini 2.5 all support up to a million tokens. That''s roughly 750,000 words. Lama for Scout goes even further at 10 million tokens. So if your input and output together exceed the context window, the model can''t process it. It''s a hard limit, not a suggestion. We''ll cover context windows in more depth in the upcoming lessons. One more thing worth knowing, different LLMs use different tokenizers. The same sentence might be GBD4 and 18 tokens in Lama 3. Each company trains their own tokenizer on their own data, so the exact splits vary. This means token counts are always approximate when comparing across models. Now, if you want to see this in action, OpenAI provides a free tool called the tokenizer at platform.openai.com/tokenizer. You can paste any text and see exactly how it gets split into tokens. Try pasting a paragraph and notice which words stay whole and which get broken up. You''ve asked Chat GPT the same question twice and gotten different answers. Why LLMs don''t just pick the single most likely response every time. They calculate a probability for every possible completion, then sample from that distribution. Take a prompt like write a one-s sentence story about a robot. The model might give a lonely robot discovered a forgotten garden a 30% chance. In a world where emotions were outlawed gets 15% and thousands of other stories get smaller slices. The model rolls the dice. Responses with higher probability are more likely to win, but they don''t always win. So now we know LLMs are choosing from a list of possibilities. But here''s the natural question. How risky are those choices? Does the model always play it safe and pick the top response? Or does it sometimes go out on a limb? That''s exactly what temperature controls. Temperature is a number between 0 and two that you set when you call the model. Think of it like a dial that goes from strictly by the book to wildly creative. At temperature zero, the model always picks the most likely response. No randomness at all. Uh, same input, same output every time. At 0.5 [snorts] to 0.7, it mostly picks likely responses, but occasionally surprises you. Crank it up past 1.0, and the model starts spreading its bets more evenly across all options, which gets creative and sometimes nonsensical. Here''s a simple way to see this in action. Take our robot prompt and call the model 10 times at temperature zero, then 10 times at temperature 1.5. On the left, temperature zero. You get the same story every single run. A lonely robot discovered a forgotten garden again and again. On the right, temperature 1.5. Every run is different. A robot building friends from junkyard parts. A robot learning to dream. A robot discovering emotions. Same prompt, completely different behavior, controlled by a single number. So when should you use each temperature? For data extraction and classification, use zero. You want the same answer every time. For code generation, 0 to 0.2. Code needs to be correct, not creative. General conversation, 0.5 to 0.7. Natural but reliable. Creative writing, 0.8 to 1.2. You want variety and surprise. For AI agents, lower is generally better. You want reliable decisions, not creative ones. Temperature is set per API call. You control it, not the model. The context window is the LLM''s working memory. It''s the total amount of text the model can see at any given moment. Your input, the conversation history, and the model''s own output, all combined. Here''s what it looks like in practice. Everything gets packed into one window. the system instructions, the conversation so far, your latest message, and whatever the model has generated. In a typical interaction, you might have 200 tokens of system instructions, 3,000 tokens of conversation history, 150 tokens for your latest message, and 500 tokens for the model''s response so far. That''s about 3,50 tokens total. If your model has a 128,000 token context window, you still have plenty of room, but everything inside the window, the model can see. Everything outside it doesn''t exist to the model. This is a hard limit, not a suggestion. Different models have very different window sizes. GPT3.5 had