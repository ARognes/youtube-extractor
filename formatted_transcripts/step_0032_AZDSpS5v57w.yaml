transcript: 'Welcome to this beginnerfriendly hands-on course designed to make building real AI agents easy and fun. Led by Mumshed, founder of CodeCloud, you''ll journey from the absolute fundamentals of large language models to constructing specialized multi-agent systems without any infrastructure or API setup hassles. The course ends in an in-depth case study of OpenClaw, giving you the practical skills and confidence needed to design, test, and deploy production inspired AI agents. AI is overwhelming and this course is our humble effort to make it a little less intimidating and maybe have a little fun while we''re at it. My name is Bumshad Manhatt instructor for this course. We start from the absolute basics of AI and work our way up to understanding what AI agents are. Along the way, we''ll dissect OpenClaw, a popular open-source AI agent that has gained a lot of interest recently to see exactly what made it tick. But this isn''t just another theory only course. You''ll get hands-on access to our lab environments where you practice building agents yourself stress-free without worrying about unexpected charges. We provide everything you need from API keys to sandbox cloud environments so you can focus purely on learning. Throughout this course, you will build four AI agents. I call them Zippy, Savvy, Meshy, and Cody. Pardon the choice of names. I thought they''d go well with the with the vibe. You''ll see Zippy''s journey from being a solo generic agent to becoming an orchestrator that manages a multi- aent setup of Savvi, a research agent, Meshi, a memory agent, and Kodi, a coding agent. Here''s how the course is structured. We start with fundamentals, the building blocks of AI. You''ll learn what chat GBP actually is, how large language models work, what tokens and tokenization mean, how temperature and sampling shape responses, and how to write effective prompts. From there, we move into architecture, how AI systems are assembled from pods. You''ll learn what tools are and how to integrate them, building AI workflows, and understand the key distinction that most people miss. What separates a workflow from an agent. Then comes implementation where you build real agents. You''ll learn what an agent actually is, how agent memory works, planning and reasoning strategies, multi- aent systems, and error handling patterns. You''ll also explore coding agents and the design patterns that Anthropic and Google use in production. We close with the open claw case study where we dissect a real open source AI agent. You''ll walk through open clause architecture and tools, its agent loop, memory system, testing strategies, monitoring and security. What''s everyone''s concern regarding OpenClaus security challenges? Is it real? What caused it? etc. By the end, you''ll know how to build, test, and deploy effective AI agents from scratch. AI has been overwhelming for a lot of people, and this course is our humble effort to make it a little less. We start from the absolute basics of AI and work our way up to understanding what AI agents are. Along the way, we''ll dissect OpenClaw, a popular open-source AI agent, to see exactly what makes it tick. This isn''t a theory only course. You''ll get hands-on labs where you practice building agents yourself stress-free with no worrying about API keys leaking or unexpected charges. We provide everything you need so you can focus on learning. By the end, you''ll know how to build effective AI agents from scratch. Let''s get started. Let''s start with something you already know. Chat GPT. The name chat GPT is actually two parts. Chat stands for the chat application and GPT is the AI technology that powers it. It''s called generative pre-trained transformer. Don''t worry about generative pre-trained transformer. Right now, um, we''ll break that down in the next lesson. For now, just know that GPT is the brain and chat is the interface, the way you interact with it. Let''s start with something you already know. Chad GPT. The name Chad GBT is actually two parts. Chat stands for the chat application and GPT is the AI technology that powers it. GPT is the brain and chat is the interface, the way you interact with the brain. GPT stands for generative pre-trained transformer. Let''s take it apart one word at a time in reverse order because it''s easier to understand that way. A transformer is a specific design for how an AI system processes language. It was invented in 2017 by researchers at Google. AI existed long before 2017. Many of us had already used some form of it, chat bots, spam filters, autocorrect, but it never felt truly intelligent. So what changed? At its core, AI works by predicting what comes next. Given some input, it makes its best guess about what follows. That basic idea hadn''t changed. What changed was how well AI could do it, especially with language. In 2017, a team of researchers at Google published a paper called attention is all you need. It introduced a new architecture called the transformer and it quietly changed everything. You don''t need to understand the technical details right now. What matters is this. Before that, computers were bad at understanding language. After that, they got dramatically better. The key superpower of transformers is attention. The ability to look at is attention. The ability to look at all the words in a sentence at once and understand how they relate to each other. For example, consider this sentence. The dog chased its tail because it was bored. What does it refer to here? The dog or the tail? You instantly know it''s the dog. Earlier AI systems struggled with this. Transformers handle it easily because they can pay attention to the relationships between all the words simultaneously. So that''s what transformers are. Now let''s look at the second word. The pre-trained part means GPT learned an enormous amount before it ever talked to a single user. Here''s how that works. First, OpenAI or the company training the model collects billions of pages of text from books, website, articles, code, and more. Imagine a library bigger than any library that has ever existed. That''s roughly the scale of GPT''s training data. GPT then read all of this text and learned patterns, not facts, not opinions. Patterns. For example, after the capital of France is, the word Paris usually comes next. After once upon a time, a story usually follows. Technical questions tend to get structured answers, and casual greetings get casual responses. And the core of how GPT actually learns is by predicting the next word. During training, GPT was given billions of sentences with the last word hidden, and it had to guess what came next. Given the cat sat on the the correct answer is Matt. Given to be or not to it''s B. Given water boils at 100 degree it''s Celsius. It got it wrong a lot at first but after seeing billions of examples it got incredibly good at predicting what comes next. Not just simple sentences but entire paragraphs across every topic imaginable. This is also why hallucinations happen. GPT isn''t looking up facts. It''s generating text that sounds like it should be correct based on patterns. And sometimes those patterns lead to astray. And finally, the generative part is the most straightforward. It means GPT creates new text rather than copying text from somewhere else. When you ask GPT a question, it doesn''t search a database for a pre-written answer. It generates a brand new response word by word based on the patterns it learned during pre-training. GPT is a family of models that have gotten more capable over time. GPT1 came out in 2018 and proved that the concept works. GPT2 followed in 2019 and was good enough that OpenAI initially worried about misuse and GPD3 launched in 2020 and was a real breakthrough. It could write essays, code, and more. GPD 3.5 arrived in 2022 and powered the original Chad GPT launch. GPD4 came in 2023 and was much more capable with the ability to understand images too. And GPT40 launched in 2024, faster and with better voice and vision capabilities. Each version was bigger, more training data, more computing power, and better at predicting the next word. And GPT is just one family of LLMs. Other companies have built their own. Claude from Anthropic, Gemini from Google, and Llama from Meta, which is open source, meaning anyone can use it. They all share the same basic idea. Transformer architecture pre-trained on text generating responses word by word. Now, it''s important to note that the transformer architecture is used beyond language. Sora, which generates video, and various audio models also use transformers, but they''re not LLMs because they don''t work with language. The L in LLM specifically means language. Now, models like GPT40 and Gemini blur this line. They handle texts and images and audio. So, their core is still language model, but they''ve been expanded to understand other types of input. People still call them LLMs by convention. Now, let''s dig into what makes LLMs large and why that matters. An LLM is what you get when you take the transformer architecture, scale it up with billions of parameters and train it on massive text. Large refers to two things. Large training data and a large number of parameters. To put this in perspective, all of English Wikipedia, every article ever written is about 4 billion words. DPD3 was trained on roughly 125 times that amount. Modern LLMs have gone further, still consuming text from books, websites, code repositories, scientific papers, and more. Now, if you read one book per week, it would take you 180,000 years to read what GPT3 was trained on. Parameters are internal settings the model tunes during training to get better at predicting the next word. More parameters means more subtle control and better performance. But what does that actually mean? Think of it like learning to throw a basketball. Nobody consciously calculates the exact angle and force for every muscle in their arm. You throw, you miss, you adjust, you throw again. Eventually, your body just knows the right settings. Parameters work the same way, except with numbers instead of muscle memory. Each parameter is just a number 87 orgative.23. These numbers sit at the connections between neurons in the network and control how information flows through it. When the model is first created, all of these numbers are random. The model is essentially useless. It might predict that the cat sat on the ends with refrigerator. So how does it learn? The model is shown real text from books, websites, and articles and asked to predict the next word. It guesses. Then it compares its guess to what actually came next in the text. If it was wrong, an algorithm nudges every parameter slightly in the direction that would have made the answer more correct. Then it does this again and again and again billions of times. No human is writing these numbers or grading the answers. The training data itself is the teacher. It already contains correct natural language. The model just learns to mimic those patterns through repetition. And after billions of rounds, those random numbers have been shaped into an incredibly precise configuration that understands language. Again, you don''t need to understand training in detail to build AI agents. That''s the job of machine learning engineers who create these models. But knowing how it works helps you understand why LLMs behave the way they do and why they sometimes get things wrong. Now to give you a sense of scale, look at how quickly these models grew. So GPD2 had 1.5 billion parameters. GPD3 jumped to 175 billion parameters. The jump from GPD2 to GPD3 was roughly 100 times more parameters. That''s the difference between a model that could write passible text and one that could write convincing essays, translate languages, and write code. Now, bigger isn''t always better, though. More parameters means more computing power, more cost, and slower responses. And sometimes a smaller, well-trained model is the better choice for a specific task. Now, LLMs are remarkably good at working with language. They can generate fluent human sounding text, summarize long documents, translate between languages, write code, follow instructions given in plain English, and and shift their tone to match whatever you need, formal, casual, technical, playful, but they have real blind spots. So, you ask an LLM to do math, and it might get it wrong because it''s predicting words, not calculating numbers. You ask about something that happened last week, and it won''t know. its knowledge ends uh at whatever date it was last trained. If you ask it something uh that it doesn''t know the answer to h instead of saying I''m not sure, it often makes up a confident sounding answer. And this is called hallucination and it''s one of the biggest challenges LLMs. The biggest limitation though is the one that matters most for this course. On their own, LLMs can only produce text. They can''t look up a database, send an email, book a meeting, or take any action in the real world. And LLM by itself is just a very impressive text generator. When we build Zippy later, we''ll give him tools to overcome the limitations of a raw LLM. So, give it tools, the ability to search, calculate, and take actions, and LLM''s start to become an AI agent. Let us now see how developers use LLMs. When you use chat GBT, you type in a text box and get a response back in the chat. When a developer builds uh with an LLM, they use an API, an application programming interface, a way for one program to talk to another. And here''s what that looks like. Your application sends a request to the LLM provider, something like summarize this text. The provider processes it through the model and sends a response back. It''s a simple back and forth request in request out. Every ARI agent is built using an API. The agent sends messages to the LLM, gets responses back, and decides