, is like a notebook you can refer back to anytime. LLMs don''t have this natively. Some products like Chad GPT''s memory feature simulate long-term memory by storing key facts separately and injecting them into the context window on each request, but the underlying model still only sees what''s in the window. For a simple chatbot, running out of context window just means the model forgets earlier conversation. Annoying, but not critical. For an AI agent, it''s a much bigger deal. An agent might need to hold all of this in context at once. system instructions for how to behave, tool definitions for what tools are available, conversation history from the user, results returned from tool calls, and the agent''s own intermediate reasoning. Here''s a rough breakdown of how those tokens get used in a single turn. The system prompt takes about 2,000 tokens. Tool definitions for 10 tools eat up another 3,000. Add [snorts] in conversation history, tool results, the agents own reasoning, and space for generating a response. and you''re already at around 23,000 tokens for just one turn. Each turn of the agent loop consumes context. A complex task with many tool calls can eat through the window fast. This is why context window management is a real engineering challenge when building agents and why models with larger windows are so valuable. And bigger context windows aren''t free. Remember, you pay per token. If you stuff a 100,000 tokens into the context window, you''re paying for all of those tokens on every single API call. An agent that makes 10 API calls with 50,000 tokens of context each time is paying for 500,000 input tokens, even if most of that context is the same conversation history repeated. This creates a direct tension. More context means better results, but higher cost. Managing this trade-off is one of the key skills in building production AI agents. You''ve learned that the context window is the model''s working memory, everything it can see at once. Now, the question is, what do you actually put in that window? Because what you give the model completely determines what you get back. Most people assume prompting is just about being specific. Give clear instructions, add some context, and you''re done. That''s what I thought, too. But there''s something strange going on under the hood. Here''s an example that surprised me. These two instructions mean exactly the same thing. Don''t use bullet points. Write in paragraphs only. Same meaning, but the second one works better, measurably, consistently better. Why? When the model reads, "Don''t use bullet points," it first activates the bullet point pattern because that''s the strongest signal word in the sentence and then tries to suppress it. The suppression doesn''t always win. You told it not to, but you also put the idea there. Prompting isn''t just writing instructions. It''s shaping which patterns in the model get activated. And once you understand that, the whole thing gets a lot more interesting. When you use the API, messages aren''t just plain text. Every message has a role attached to it. There are three roles. The system role is for the developer. It sets the behavior rules and personality of the model. The user role is the actual question or request from the person using the app. And the assistant role is the model''s response. Look at this messages array. The first item has role system. That''s the developer talking. The content says you are a personal assistant that helps manage schedules and tasks. That''s the instruction that shapes every single reply. The second item has role user. That''s the person asking what''s on my calendar today. The system message is invisible to the user, but it''s always there, always in context. In chat GPT, OpenAI writes it for you. When you build your own app, you write it yourself. That''s a big part of what makes the API more powerful than chatting. Let''s make this concrete. The same question with three different prompts, produces three completely different results. If you say, "Help me with my schedule," you get vague, generic advice about time management. Not very useful. If you say, "Listen for today in bullet points with times." Now, the model knows the format you want and the information to include. Short, structured, useful. Go further. You are a personal assistant. The user has a busy day. Summarize their calendar. flag any conflicts and suggest which meeting to reschedule if they''re double booked. And now you get something specific, practical, and actionable. More context, more constraints, more useful output. Instead of summarize this, say summarize this in three bullet points for a technical audience. Every word you add to a prompt is a constraint and constraints produce better output. This one is powerful. You can show the model exactly what you want by including an example in the prompt. This is called fshot prompting. And the difference it makes is dramatic. Here''s the same task, same question with two different prompts without an example. Zero shot. There are two messages. The system message says, "Classify the sentiment as positive, negative, or neutral." The user message is, "It took 2 hours to get our order." That''s it. No example of what the answer should look like. And here''s what the model produces. The sentiment of this review is negative. The customer experienced a long wait time which suggests frustration and dissatisfaction with the service. You asked for a classification. You got an essay. The model had no idea you wanted one word. So it gave you what it thought was a thorough answer. Now with an example, fshot. This time there are four messages. Same system message, but then before the real question, you insert two extra messages. a user message that says the food was amazing and an assistant message that says positive. You wrote that assistant message yourself. It''s not a real reply from the model. It''s an example of what you want the reply to look like. 