transcript: today we're diving into a topic that's crucial for many of you watching how to become a senior engineer let's be real many of you have been on a rocket ship in your careers up until this point you've crushed it as Junior devs you've excelled as a mid-level engineer but now you've hit a wall that next step to senior engineer it feels like you're stuck in Quick's hand you're not alone I've seen countless talented Engineers struggle with this exact problem your technical skills are sharp you're delivering projects you're teaching Juniors how to be solid but that promotion to senior it's frustratingly Out Of Reach here's the thing there are likely just one of three specific roadblocks holding you back and today I'm going to show you exactly what they are and how to overcome them by the end of this video you'll have a clear sense of how to get unstuck and finally make some progress on that leap to senior engineer I've been where you are I got promoted to senior engineer at Amazon in just 3 years without a degree in computer science since then I've personally helped hundreds of Engineers level up their career and I've trained thousands of people internally at Amazon on how to grow their careers conduct interviews and assess Talent during my 18 years there over the last year with my speedrun to promotion program I've helped even more Engineers across the industry FastTrack their way to senior roles and above few people in the world have helped more people get promoted in Tech than I have before I get to my first point let's talk about delegation you might have heard the advice that to scale yourself you have to learn how to delegate tasks to other people and there's some truth to that but there are also a number of anti-patterns that will hold your promotion back let's take a look at two ways to delegate to others that won't help you get promoted and the way that you should be doing it that will help you here's the first suppose you're running point on a big project senior typical stuff some tasks pop up and let's say there's some configuration changes that are annoying and timec consuming but are pretty simple in nature so you just assign these tasks to other people to take care of it I call this first approach to delegation the load balancer tasks come in and you spread them out to others on your team here's the second way to delegate suppose you discover that you missed a really ambiguous requirement H I know never happens right so you go to the stakeholder to figure out what the heck they mean and you schedule a meeting to get to the bottom of it turns out it will lead to a ton of extra Dev work so you Scope the work and break it up into bite-sized chunks you give those chunks to the people on your team I called this approach the decomposer you take in and big US problems and then break them up into smaller pieces that other people can handle the final way to delegate goes something like this suppose on this project you've discovered a showstopping issue some wires got crossed and you realize that a team that you depend on isn't going to have the functionality that's critical to the project in time this is one of several issues that you need to bottom out to keep the project on track and so you find a highflying high potential Junior engineer on the team and delegate the problem to them but they're scared they understand the technical issues but they've never engaged with folks outside of the team before and so you do two things you coach them up and you tell them how you would handle that particular situation and you tell them that you're around to help out if the situation gets out of hand then you let them handle the problem on their own and move on to other pressing issues I call this approach to delegation the capability multiplier of the three techniques the load balancer the decomposer or the capability multiplier which do you think is going to increase the chances of getting promoted the most and that's my first point the best way to show that you're operating at the senior level is to demonstrate that you're a force multiplier simple load balancing of work just spreads the work out across the team there's no reduction in the total amount of work delegation through decomposition is the same thing you're taking the ambiguous parts and then turning them into unambiguous chunks of work that's just part for the course but the capability multiplier is amazing because you can demonstrate that you're upleveling the people around you a phrase like Steve is creating copies of himself is a strong one in a promotion packet for this approach to work though requires that you do the following important things first you need to know what the capabilities of the people on your team are so you can assign them things that are slightly outside of their comfort zone if you're just giving them things that they can handle you're just being a load balancer second this version of Delegation is an investment of time to start off usually when we think about delegation we think of freeing up our capacity it will but not at the start this approach front-loads some of the amount of work as you spend the time to coach up the people that you assign work to it's an investment that takes more of your capacity the payoff and Time Savings is backloaded and much larger than the initial investment the third thing and this is the most important is that after you've delegated the scope to someone you have to go away and let them handle it on their own this is really difficult for people because if you're eyeing a senior promotion you are probably very capable you know how to do things the right way but for this to work you have to give others space this is probably the hardest part of this approach to let others take over and potentially fail when you know the right way to do things but this is crucial if you assign someone new scope and Coach them up and then stick around to make sure that things are done the right way then you've basically doubled the amount of effort required and you haven't given the other person the space to grow give them ownership of the problem coach them up let them know that you're there to support them and then leave that's the best way to delegate develop those around you and become a Force multiplier by scaling through others before we dive deeper I want to offer you something special if you're serious about accelerating your path to senior engineer I've put together a bundle of free resources for you it's called the five essential Frameworks for promotion and it includes five of the best videos from my speedrun to promotion program I cover a systematic way to earn the trust of your manager where I go over exactly what to say to them and when to say it I also cover how I deal with ambiguity how to leave evidence of Next Level performance so that people can't ignore it and what to do when you don't know what to do next these videos cover in depth the points that I cover in this video but more importantly they give you actual tools and techniques that you can apply today to FastTrack your promotion to get access to these videos click the link in the description below these strategies have helped hundreds of Engineers just like you make the leap to senior roles and Beyond before we get into the second point it's important to understand some things about tech promotions I call it the Paradox of promotion in today's climate it seems like companies are only hiring senior people it's really difficult to get that first job as a junior but there are still tons of openings for senior roles despite the job market there's still a ton of Demand on top of this all things being equal a senior engineer promoted internally is preferred over an externally hired person they have a track record of high performance within the company they know how things work and they don't need to be ramped up externally hired people are an unknown quantity and are riskier for companies and finally managers are considered high performers if they're able to promote people to the next level and they get brownie points if the promotions are for high levels like senior and above so the Paradox of promotion is why given the demand for seniors the fact that internally promoted people are preferred and there's an incentive for managers to promote people for their own performance why is it that we don't see more promotions why are they so rare the answer is because the positive case for promotion is really positive but the negative case is especially bad a promotion involves new responsibilities at a broader scope if a company promote somebody too early and that person fails to meet expectations at the next level what you've done is taken a high performer and turn them into a low performer that low performer may need to be managed out a backfill now needs to be hired and now there's egg on the face of the manager that promoted that person too soon and that's my second Point your relationship with your manager is the most critical one to your promotion prospects If your manager isn't on board your promotion is simply not going to go through companies are very conservative with promotions because they don't want to make a mess out of something that's already working it's better for them to get senior engineer performance out of a mid-level engineer rather than promote someone too soon and take the chance that they won't do well at the next level your manager is the biggest roadblock to getting promoted to senior that I've seen among all the people that I've worked with because they have to stick their neck out for you they only do that for people that they trust if your relationship with your manager is good and they're supportive that's great you're well on your way if your relationship is tepid or they don't even know that you want to be promoted oted you need to work on strengthening this relationship if your relationship with your manager is bad then you need to work on repairing it or maybe it's time to look for a different team or to get promoted by finding a role at a new company to illustrate my third Point let me tell you a story from a speedrunner that I'm currently helping to get promoted they've asked me not to use their name or company so let's say that this person's name is David David is a senior trying to get to staff engineer but the story is still a good one for those trying to get to senior David is technically deep he owns the team's entire Tech stack he pumps out a prolific amount of code he mentors Juniors and mid-level engineers and even some seniors he can hang in conversations with staff senior staff and even principal Engineers he's led many cross functional projects and always delivers on time even when given ambiguous or missing requirements David is on the Forefront of technology and teaches others about new developments in the space by giving talks nobody even asked him to do this in terms of promotion he's checked off all of the boxes but there are problems David noticed that daily and monthly active users for the product are still significantly lower than Target he noticed the number of defects was increasing across the various teams he noticed that attrition was also increasing and that was likely due to operational load and so he took these problems to a skip level manager the person he would report to if he were to get that promotion that he was so close to and he asked the skip what he was going to do about these problems now his skip acknowledged that these were problems and he also disclosed some further context to David that was outside of his current visibility this confirmation of issues led him to press his skip manager even more so what are you going to do about it the skip gave a response that didn't really satisfy David afterwards when David put his promo packet in it was rejected with the reason that David needed to show more influence and so he came to me with this vague feedback and asked me what he should do next do you see what the problem was with David's Behavior if you don't don't worry I'll tell you getting to senior engineer is the first role where you're considered a leader in this case generally a senior is a team level leader and a staff engineer is a leader across at least two Dev teams there are many definitions of what a leader is but the one that's useful in this situation is that they own problems and that's my point to get promoted to senior you have to demonstrate leadership and own the problems on your team what should David have done well he should have brought the problems to a skip level boss and solutions since his skip level would be his direct manager were he to be promoted he should have acted as the technical adviser to a skip preemptively adoption is flagging for the product maybe we should re prioritize and Target a set of features to bring those numbers up is the defect rate high maybe we should see if the defects are all coming from the same place if so it may just be a matter of surfacing it to those teams and individuals otherwise maybe maybe a set of organization wide training could be set up to increase engineering Excellence is attrition increasing because of operational load maybe an operational task force could be created to analyze the pain points and make recommendations highlevel Tech IC are leaders that don't have direct reports leaders take ownership of problems and do something about them they don't simply complain and raise issues that's what low-level ic's do now if you found this content helpful then you need all of the help that you can get take a look at this video made on how to get promoted fast if you've seen it already take a look at the original version of this video I made 3 years ago when I was still working at Amazon
