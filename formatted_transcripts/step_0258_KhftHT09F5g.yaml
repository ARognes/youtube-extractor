ably shouldn't allow this very data to change. And there are clues here just by looking at this out of context as to something looking not quite right. And that is that we can see that we're dealing with unique pointers. That's what's going on over here. So presumably this is also a unique pointer and we're matching that to this. So just from the keywords this unique pointer layer reassignment, you can kind of tell that something is not quite right because this implies that we are inside a layer. Even though of course this can just be a function that's called externally. There's nothing obviously to stop this from being called internally and that's when we wind up deleting ourselves. I hope you guys enjoyed this video. If you did, please don't forget to hit the like button. Has this ever happened to you? It's definitely happened to me before. Not in this exact way, but accidentally deleting an object that you are currently inside does happen [music] from time to time. If you guys have thoughts or ideas as to how to mitigate this and make sure that it doesn't happen, let me know in the comments section below. What other bugs have you encountered in C++? Let me know and it might be a future episode on this series. Thank you all for watching. I'll see you next time. Goodbye.
