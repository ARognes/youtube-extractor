transcript: Welcome back to the bugs of C++ series. The series in which we take a look at various bugs in C++ and how you can avoid them. I often say that memory is the most important thing in programming particularly when it comes to low-level languages like C and C++. Intrinsic to memory management is lifetime. You need to be aware of the lifetime of any memory that you allocate. Now the concept of memory might be a little bit too raw too lowle. So you can always picture this as [music] objects. What is the lifetime of a given object that you create in C++? Fundamentally, that translates directly into memory. However, it's a bit of a higher level concept that may make more sense. This whole memory management, lifetime management situation is such a big deal that it's one of the biggest selling points of higher level languages. A language like C or Java with a garbage collector and stronger memory management models is something called a managed language. C++ is an unmanaged language. It's up to you to manage everything. And that's a lot of power. That's a lot of power, but it's also a lot of responsibility. And very often, it's very easy to forget about this responsibility and neglect it. But what about things like smart pointers? What about all of these constructs that we [music] can build into the language ourselves to make things happen more automatically than they otherwise would? Can't I just use them and then everything will be sweet? Well, yeah, they help, but they don't often solve the problem entirely, especially if you're not just picking the nuclear option of just do everything for me. I mean, you can write systems in C++ that make it like a managed language and then I guess a lot of these things would go away. But the reason we're using an unmanaged language here is because we want that control and we're trying to minimize overhead. So, it's a bit of a balancing act and problems can still happen even if you do use Smart Pointers. And that's ultimately what we're going to be taking a look at today. What happens if we relax a little bit and we let something slip through the cracks? Let's take a look at an example. What I have over here is some code from my application architecture series. We have some really simple code here that will be called every frame inside an on update function. And what it does is transition to a different layer from the current layer if a given key is pressed. Layers are a way to implement custom behavior in an application. If you're not sure what they are, check out the video I made on layers up there. The transition to function inside the base layer class allows us to transition the current layer into a new layer. Pardon IntelliSense not working as always. So in this case it lets us by pressing the one key transition to another layer which in this case is just a red clear color and we can go back and forth between them and that's also how this switch button over here via an overlay layer works as well. Software engineering can get pretty overwhelming and usually the complexity just grows and grows. You try and keep things simple, but as time goes on, it's really hard to track everything in all of the different tools that you use and make sure that what you're doing actually aligns [music] with everything else. Miro, the sponsor of this video, is a unified visual workspace for mapping ideas, designing systems, and collaborating in real time or asynchronously. It's a great place to model architecture, break down complex problems, plan and track work, and communicate technical decisions clearly across the [music] whole team. With the addition of Miro AI, this potentially tedious task of translating the design and architecture in your head to an actual visual diagram that communicates that well becomes much easier. I don't know about you, but I'm not the biggest fan of making diagrams. I'd rather write some code. With Miro, I can just tell the sidekick roughly what I want and it produces really great diagrams in seconds. Removing that friction of getting a diagram going really helps with team communication. Instead of having a meeting, for example, to discuss design, [music] which first of all is already a bit of a challenge if you have a global team across many time zones, instead of that meeting, Miro can help me effectively communicate my ideas and design and make sure my team is on the same page. I find that I'm much more likely to do that because Miro AI lets me do this quickly without me feeling like I'm just dragging these shapes and arrows around instead of actually working. Of course, I'm still working when I'm dragging shapes around. It's obviously important to design things, but you know what I mean. For example, if I want a quick UML diagram describing the design of my C++ application architecture series, I can just type something like this and I've already got most of the work done. You can see it's generated what I've asked along with some placeholder example content that I can easily modify to suit my needs. From there, I can refine it again using AI or just start doing things manually my way. I find this really helps to unblock you from how do I start this and actually get the ball rolling, which honestly is invaluable. Miro has like 300 plus templates for you to start with. Over 2 and a half thousand diagramming shapes as well as direct integration with so many things, Jira, Trello, Microsoft Teams, and Google Meet. The list goes on. You can embed diagrams into tools like Notion and Confluence, which really helps as well. Seriously, give Miro a try today. Check out my link in the description below and play around with it on your next project. Huge thank you to Miro for sponsoring this video. Cool. So, we have a way to transition from one layer to another. This app layer over here is what you see rendering the flame, and it transitions to a void layer, which is simply that red clear color that you saw. And crucially, what happens when we