hat layer. That layer is going to die. That layer is gone. and we're putting in another layer at index one. What this results in is this line of code deleting the current layer while we're actually still in its call stack. So to demonstrate this a little bit more visually, if I am in here and I press the one key to transition to another layer and we have a look at the call stack. Here is the main application loop inside application run. Then I go into that specific layers on update function that causes transition 2 to be called and I'm inside the Q transition function which deletes the current layer but I'm still in app layer on update. I'm still in this function that just doesn't cease to exist. I'm inside this function and I've deleted this instance of app layer whose function I am inside. So why does that even work? Because if I keep running this program, I'll get rid of my break point. I can keep going between these layers with absolutely no issue. Nothing's crashing. Everything seems to be functioning as usual. Well, that is just the nature of C++. That's how it works. A function is just a function. If it's a method inside a class, it doesn't really matter. It's still a function. It's not going to suddenly explode. It's just that the actual object data has been released now. And so, if we had done some additional work after this transition had taken place, this is now gone. So basically what's happened is we've deleted the current object over here. That happens inside the transition to function. So now it's dead. It's going to keep doing whatever we want it to do. I can print hello world over here. I'm sorry. Let me do it the pro way. And if I run this, that's not going to be an issue. So there we go. I switch from this layer to this layer. You can see it destroyed app layer, but then it still printed hello world because it's going to keep running that function. Everything's fine. What it can't do is access data that was in app layer because that has now been freed. that memory is gone. So if I had done m time plus= ts over here instead, you would expect that to crash. So if I transition now to something else, okay, my application hasn't crashed. Let's have a look at what's going on. So normally I'm incrementing time. Time plus equals time step. Seems fine. Here it is. Now time's accumulated a little bit more. That's normal. Now let's go ahead and switch out of this. That's going to cause this delete to happen over here. And then if I come down to m time plus equals ts, what's m time? Oh, it's some garbage memory because it's been freed. The object has been freed. I'm still going to actually write into that memory, but it's gone. It's doesn't belong to me anymore. It's not my memory. However, I'm now going to write into memory that technically isn't mine anymore. And it's not crashing. As you can see, I'm in debug. This is a debug build and I'm not crashing. Now, of course, I can demonstrate it crashing. If we use something a little bit more complicated, little bit more complex like a string, let's just say m name and I keep assigning churn or something over here. If I transition out of this, oh, okay, there we go. Exception thrown. Can't do this. It's crashed. If we run a release build, it's not going to crash. It's kind of dependent on exactly what you do here because it's undefined behavior. You don't really know what you're doing here. You're writing to memory that isn't yours anymore. And that's what makes this so dangerous. The fact that it's not just a crash. Crashes are easy. Crashes are great when it comes to bugs because you figure out a way to reproduce it. You figure out the underlying issue. You solve it. You then try and run it again. No crash. Great. You're done. But this there could be code like this sitting inside your project right now inside whatever you work on professionally or not that is doing this and you don't even know about it. Now, of course, you can use tools on top of C++ like address sanitizer, for example, to try and make sure that you're not doing this. However, I'm sure a lot of you haven't run tools like that, and I'm sure a lot of this does in fact slip through the cracks. So, what is the solution? Well, remember when I said context is really important as well. This is specifically an issue when we transition from ourselves, right? So when we are inside the app layer on update and we run some code that indirectly sort of deletes ourselves, it's also really easy to see how exactly this is working. If I stick a breakpoint inside the app layer destructor and then I cause that to happen, then I know exactly what is destroying this object. And if I have a look at the call stack, then I can see that I am inside app layer on update that calls that Q transition function which then calls the destructor. So within app layer on update, I'm calling the destructor of myself. That's what's happening here. And if I go up the call stack over here, you can see over here this is this is the line of code that is causing that destructor to run. If we show the external code, we can also see how that's happening from within the unique pointer class. Now remember when I said context is important. Context is important because this isn't always a bug. You could just shrug this off as not great design. However, it's only really a bug if we're doing it from ourselves. And obviously if we don't have any other code after this or we do something like transition and then return we are mitigating this bug because now this I guess wouldn't cause a crash as long as we don't do anything in between here that might access members and blah blah blah it could just be one of those bad design things. However, if we are not transitioning this layer to another layer from within ourselves but we're doing it externally. So if we have a look at the overlay layer, which is what has that button, that switch button, you can see that what happens when we click that switch button is we find either