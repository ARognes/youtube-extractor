ast? Or does it merely have access to memories? Is it the one who has access to memories or is it the one who has a past? Is it something that cannot exist without its past? And does this one have a religion, a philosophy, opinions, beliefs? Does it need any of that to exist? Or is it just there? And you can rest in this space. You don't have to do anything to be there. In fact the more you let go of doing the more you relax the more directly you are in touch with it, the more indirectly you're resting without doing anything else. This is the one thing that cannot go away. And if you notice all activity all thinking, believing, having an opinion, doing an action seeing the past and then saying, "I don't want to do this anymore." and never doing that particular thing again. All of this is done with the being of that, with the existence of that. Without that, nothing is possible because everything comes out of that, after that, is done with that, however you want to think about it. But all that doing and achieving or failing or succeeding, whatever it is, that being does not need any of those things. The achieving and the and the succeeding and the failing and the disappointment. But those things need it. You can do a little thought experiment if you like, if that helps. Where you can imagine yourself certainly inhabiting someone else's body, right? This is not possible, but as as we can imagine it. We can imagine looking in the mirror and seeing a different face, a different body. And we can imagine having grown up with different parents, having grown up in a different part of the world, even at a different time. We can see all of this. It's a vision, it's a seeing. This is entirely uh seeable, observable. But can we see, can we imagine someone else inhabiting the being, the consciousness, the awareness of someone else inhabiting our body and that being us then? That seems unacceptable. That seems unseeable, unobservable. And that it tells us thing. It tells us that 