transcript: happy pi day hyperbolica is now live on steam prepare to rocket ski through the snow jump on trampolines solve puzzles clean windows and more in mind-bending non-euclidean space so spread the word and let everyone know about hyperbolica it's currently available for windows linux and steam vr with mac support coming soon i'll also be hosting it on itch sometime next week and that's not all i now have an official code parade merch store with original designs for hyperbolica check it out i want to thank everyone for all your patience and support through this crazy development the community enthusiasm and excitement around a hyperbolic game has been really surprising and humbling the devlog videos are a great time capsule to see how much the game's style and graphics have improved and it'll really make you appreciate how far it's come you can also join the code for a discord community to chat about hyperbolica post fan art report bugs and enter contests thanks again everyone and i hope your pi day got a little bit sweeter
