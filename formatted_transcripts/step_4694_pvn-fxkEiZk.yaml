transcript: did you know those old rabbit ears on your grandma's TV still work on your new flat screen they're really just pieces of metal designed to catch whatever's being broadcast on TV frequencies the only difference is that today's TV signals are digital meaning that the TV you plug into the antenna needs a way to decode that signal all modern TVs can do this out of the box but even a decades-old TV can still receive local channels if you get a digital converter box this is exactly why they still sell those rabbit air antennas with a loop today although they're marketed as HD they're basically the same Tech everyone used to use during the Disco suit era you dig
