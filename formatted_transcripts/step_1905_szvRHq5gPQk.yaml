transcript: 'Como Bluff, Colorado, 150 million years BCE. On the banks of a late Jurassic creek, two hungry allosaurs square off over a freshly expired 20-ton apatosaurus. Now, there''s enough here to feed both animals for weeks, but neither of these two-ton predators feel inclined to share. However, their beef is promptly squashed by nature itself as a freak mudslide buries both predators and prey in thick sandy silt. Now, usually that would be the end of the story, but as chance would have it, the circumstances here have lined up to allow something remarkable. Over time, mineral-rich water seeps into the skeletons, leaving behind perfect stone casts, fossils, which will endure long after the bones decay. And when I say long, I mean long. While these three hapless dinosaurs lie in the ground, the Milky Way galaxy completes half of a full rotation. Miles of sediment pile up on top of them, burying them deep underground. And then, as tectonic plates collide, the formation of the Rocky Mountains brings them slowly back towards the surface. Finally, after 150 million years underground, erosion begins to reveal their edges. And in what really should be another stroke of good fortune, they catch the eye of a school teacher turned fossil hunter by the name of Arthur Lakes. His employer will pay handsomely for such a find. But winter is coming on, and new excavations won''t be possible until spring. Plus, if he waits, he might get beaten to it by men working for the other guy. Okay, Arthur understands the assignment. If his bosses can''t have the fossils, no one will. And so, rather than reaching for his hammer and chisel, he shrugs and opens a crate of dynamite. Too bad, science. >> [music] [music] >> Today''s explosive episode is brought to you by NordVPN, who helped make this historical retelling happen. In the history of paleontology, two figures stand head and shoulders above the crowd, both for the sheer volume of their contribution to the field and for the damage they did to it in the process. Othniel Charles Marsh and Edward Drinker Cope were, between them, responsible for the discovery of well over a thousand prehistoric vertebrates, including 136 dinosaur species. Many of these, such as Triceratops and my personal favorite Stegosaurus, remain household names today. So, there''s no doubt that both men were passionate, driven, and prolific scholars. But, they were also men of notably, let''s just say, disagreeable temperament. And while their careers might have begun with earnest intentions, they would end bound together in a bitter rivalry, where science increasingly took a distant backseat to spite. The conflict would reach its climax in the 1870s in a debacle the headlines of the time would come to call the Bone Wars. Like all of the best and most bitter rivalries, Marsh and Cope''s started cordially enough with a chance meeting in Berlin late in 1863. Cope, the younger of the two at 24, was the eldest son of a wealthy and influential Quaker family in Philadelphia. Something of a prodigy, the hot-tempered young man had published his first paper at 19 and rejected a life as a gentleman farmer in order to pursue his obsession for zoology. By 1863, after he had published a further 36 papers, Cope''s father had conceded the boy had found his path. So, he sent him on a tour of Europe''s great museums and institutions, thus feeding his son''s appetite for learning while also helping him dodge the Civil War draft. Meanwhile, Marsh, 32 when he met Cope, was an introspective and meticulous man. He had been born to a family in New York state in comparative poverty. And despite a lifelong passion for fossil hunting, had come to academia later in life than Cope. Because Marsh you see, he eventually discovered something of a personal infinite money glitch. AKA the brother of his deceased mother, banker and philanthropist George Peabody. From the age of 20, Marsh''s education had been bankrolled by his uncle. And he had spent 12 years studying voraciously by the time Cope encountered him at the University of Berlin. They were very different men. While Marsh had a far greater level of formal education than Cope, Cope was way more experienced in the actual work of scientific paleontology. While Marsh was withdrawn, calculating and a stickler for details, Cope was sanguine, reactive and more of a believer in quantity over quality when it came to publication. And while Marsh had only indirect access to enormous wealth, Cope had grown up wielding it. Nevertheless, their shared passion for prehistoria clearly gave them enough common ground for spirited conversation, perhaps even real friendship. Marsh and Cope spent several days in Berlin deep in discussion and remained close correspondents after. They would go on to name newly unearthed species after each other and once returned to America, would even go on fossil hunting excursions together. And it was on such a trip in 1868 where it became clear the honeymoon was over. See, Cope had invited Marsh to tour one of his favorite hunting grounds, New Jersey''s marl pit quarries, and Marsh had been impressed. So much so in fact, that he privately approached the quarries operators and bribed them to send any further discoveries his way rather than Cope''s. This, understandably, changed the tone. As the years progressed, the men began sniping at each other through the medium of academic publications and inevitably things became just too personal. After Cope published a description of the marine reptile Elasmosaurus, Marsh pointed out he had reconstructed the animal with its head on the end of its tail. Worse, he had the error confirmed by Cope''s mentor Joseph Leidy. Naturally, humiliation ensued. Cope attempted to buy up and destroy every copy of his incorrect paper, but the wound to his pride could not be undone. Then, perhaps in revenge for Marsh''s New Jersey shenanigans, Cope began digging in Marsh''s own based snipping continued with increasing vigor. But it would be in the early 1870s, when word reached the East Coast of new massive fossil formations in the western territories, that this rivalry truly got into gear. These dinosaur beds of the American West were and remain some of the richest and most extensive on Earth. They represented far greater pickings than anything the Eastern states could offer. And thanks to the extensive geological surveys during the gold rush years, plus the advent of rail and telegram links to the East, a dizzying number of potential dig sites were opening up all at once. Meaning, clearly, there were enough fossils in them there hills to keep both Marsh and Cope busy for the rest of their lives. But as far as the two rivals were concerned, yeah, there was to be no Marsh and Cope in the annals of American paleontology. It was to be one man or the other. Begun the Bone Wars had. Marsh and Cope amassed their war chests and set their sights on the West. In addition to his personal fortune, Cope had the benefit of government logistical support via a position in the US Geological Survey and later with the Army Corps of Engineers. Although these institutional ties did limit his choice of dig sites, he would compensate by spending excessive amounts of time in the field himself. Meanwhile, Marsh, as well as initial backing from Yale University, now had much deeper pockets of his own thanks to his inheritance upon Peabody''s death in 1869. Unlike Cope, however, he would prefer to stay home in the East after 1873 using his money to exert his efforts at a distance via local collectors. But despite their differences in strategy, both Marsh and Cope shared two equal objectives: put their name to as many new species as possible and stop their rival from doing the same. Colorado, Nebraska, Wyoming, and the Dakota Territory would be the main arenas for their rivalry. And in particular, the massive Late Jurassic dinosaur bed known as the Morrison Formation. Both Marsh and Cope began sending expeditions westward in 1872, but it would be in 1877 in the region of Como Bluff, Colorado that the Bone Wars would reach their full intensity. See, Marsh had been clued in to the bonanza of fossils in the area by Arthur Lakes, a local school teacher who he bribed $100 to keep the site a secret. Alas, the cat was already out of the bag, for Lakes had already sent bone samples to Cope in order to hedge his bets. But the money was good, so from then on he would be Marsh''s man. Before long, both rivals had active quarries in the region and became locked in battle to pour as much manpower into their digging operations as possible. Sometimes this was through fresh recruitment and other times it was buying the loyalty of men already employed. These were, and I will definitely relish saying this out loud and I think I''m even going to give it some macho man spin because it''s just so metal, THE BONE WARRIORS. OH, YEAH. NOW, SUPPOSEDLY, these men were employed to prospect for fossils, extract them, and ship them east. But as competition between Marsh''s and Cope''s sites deepened, the bone Warriors'' job descriptions would get a lot more colorful. Misinformation, intimidation, espionage, bribery, theft of specimens, little was off the table when it came to satisfying these two enemies'' appetites for inconveniencing one another. And while the Bone Wars never claimed a life, at least as far as we know, accounts describe regular armed standoffs and even volleys of stone throwing between rival teams. But most shockingly, and as indicated by the story at the top of the episode, the Bone Warriors were open to outright destroying fossils if it meant keeping them out of the other guys'' clutches. Marsh himself is said to have marked unexcavated fossils for destruction on a visit to one of his quarries in 1879. While Arthur Lakes did indeed claim to have used dynamite on a site to keep specimens out of Cope''s hands. Some historians suggest that Lakes was bluffing, using the rumor to deter Cope''s men from prospecting a supposedly blasted site, but even if that were the case, just the idea of such a bluff being rational in the first place gives a clear indicator of the situation''s moral landscape. After raging throughout the 1880s, the Bone Wars finally petered out around the turn of the decade. Marsh''s attention was divided following his appointment as head of the US Geological Survey, while the financial war of attrition in the West had left Cope financially ruined. Though the enmity between the rivals was as fierce as ever. Just from 1892 on, their battle would become entirely reputational, with each man using both scientific and news press to attack the others'' good name and body of work to an ever diminishing public interest. Though Cope can be credited with the Bone Wars'' parting shot. Okay, get a load of this. In 1897, approaching death, he donated his head to science in order to have his brain measured and challenged Marsh to do the same. See, at the time, intellect was thought to relate directly to brain volume and a bitter Cope wanted nothing more than to be proved Marsh''s superior, even if he wouldn''t live to see it. Alas, when Marsh died 2 years later, he did no such thing, leaving his nemesis'' challenge unfulfilled. So then, in the absence of a conclusive brain-off, who won the Bone Wars? Well, Marsh certainly had the upper hand on Cope logistically and ground the younger man down in the long run. Thanks in part to his ability to out-hire and out-spend Cope in the West and in part his dogged criticisms of Cope''s findings in the East, Marsh ended up winning at dinosaurs. He described at least 80 new species to Cope''s 56. But on the other hand, Marsh had always been more exclusively focused on dinosaur specimens than Cope. Factoring in non-dinosaur vertebrates, Cope actually led the race with more than a thousand species named, at least twice Marsh''s total. In hindsight though, it does feel less pertinent to focus on everything these two cantankerous scientists discovered, what we really should be focusing on is everything that they didn''t. Even discounting what potential discoveries might have been deliberately destroyed, like the theoretical fossils from our introduction, the Bone Wars did almost as much to set back the progress of paleontology as they did to advance it. From fossils lost to hasty extraction, poor preservation, and bad packing, to those that were mislabeled or packed in boxes still awaiting proper study today, the material cost was huge. But that''s nothing compared to the cost in knowledge. So many errors were made by both scientists in their haste to out-publish each other that paleontologists have spent a good deal of the last 150 years still trying to untangle the mess that they left. For instance, 90s kids remember Brontosaurus and then how it got renamed to the much less cool Apatosaurus? Yeah, that one? Marsh''s fault. He named the same animal twice, once in 1877 and once in 1879, and it took scientists more than a century to work out what had happened and unpick his mistake. Even then, the Brontosaurus Apatosaurus debate remains ongoing as recently as 2015. So, rather than try to discern an arbitrary winner here, maybe it''s simpler to say that both Othniel Marsh and Edward Cope managed to lose the Bone Wars. After all, both men''s goal was to go down in history as the big name in American paleontology while their enemy would languish in obscurity. But for all their individual striving, the one thing Marsh and Cope ensured by their feuding was this. Like Laurel and Hardy or Bonnie and Clyde, history would remember their names as a pair. And while these two boneheads wanted nothing more than notoriety in their field, I am guessing if they ever had gotten to use the internet, they would have wanted the exact opposite. Which luckily, anonymity on the internet is something that NordVPN really digs. See what I did there? I tied it. I tied it to get No one''s No one''s i