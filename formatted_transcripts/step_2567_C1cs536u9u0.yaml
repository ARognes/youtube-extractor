transcript: doie let's do this thing hello everyone how's it going my name is mayuko and wow it's been a while as a lot of you know from my last video I went back to work as a software engineer about 2 years ago and I've been really loving it so that means I haven't really been making any content publicly anywhere during that time but I have been working on a book and it's finally coming out I started working on this book in late 20120 when a publisher reached out to me and it's maybe one of my favorite things that I've ever made so first some backstory my parents taught me Japanese growing up and so I've been trying to always weave that into everything that I do it's a part of my cultural identity so when the major Japanese publisher kadokawa reached out to me they proposed that I write a book for Japanese speakers who want to maybe come and work in the US by teaching them English phrases that are commonly used in Tech now English education is really common in Japan but you don't really see that many Japanese people in the states and even less so in tech industry through my research for this book I found that the is twofold one because English education in Japan is really focused on being highly accurate with the usage of the language that makes Japanese speakers reluctant to Converse in English because they're constantly worried that they're going to use the wrong grammatical structure or use like the wrong level of formality and we know that while it's important to communicate clearly and effectively we also know that these days it's okay to speak casually even in workplace setting so long as you're getting your meaning across even if there's a couple of grammar mistakes and the second reason is that there just aren't that many books that teach how to use English in the workplace for phrases such as time boxing work or talking about screen real estate with a designer or maybe nitpicking on a poll request and so being a native speaker of both Japanese and English I thought that I might be kind of uniquely equipped to explain the differences teach these phrases and then also explain the nuances that get lost easily and I think it's especially important because you know in Tech we kind of like have our own language so to speak so I spent the last four years writing this book with the help of the editors at kadokawa and I'm honestly really really proud of how it turned out it has chapters on stuff like par programming effectively front-end and backend development how to get a job in the states and then also how to do an effective code review and my hope with this book was that it serves as a bridge between the Japanese and English-speaking Tech communities and honestly it'd be kind of nice if there were more Japanese people in the tuch industry too so if you're interested in buying the book or you know someone else who might be then you can pre-order it using the Link in the description box down below today it was a true labor of love writing this book it felt like a true coming together of many things that were important to me so thank you to kadokawa and also to you the viewer sitting right there for giving me opportunities like this I know uploads on this channel have been really really irregular so I don't know when the next video will be but I hope to see you in the next one bye
