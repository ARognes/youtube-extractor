transcript: In this application, we're fetching some users from an API and then rendering them out on the screen. You'll notice down here we actually have no users being rendered. This is because our API on the back end is out of sync from our front end. Essentially, we're testing a new feature for this users API, but our back end team hasn't implemented this yet. It's a very common problem you're going to run into and essentially when you check your log, you'll see we get a 404 error whenever we try to access this users endpoint. The easiest way to fix this would just be to set the users manually here to some hard coded array of data and ignore the fetch completely. But the problem is now we no longer have fetching interaction and loading states and error states and so on. Now, an alternative we can do is inside of our network tab, in that request, we can right click on it and click on override content. That'll prompt us to select a folder up here. All we're going to do is just select a folder anywhere inside of our application and when we do that, it allows us to edit files inside there and actually make our own overrides for those different requests. So, for that users, we can change this to essentially output all the information that we need for the users name, age and so on. So, now if I just give that a save with that particular file, you can put whatever you want inside this file. You know, I just copied this data over, but now we go back to our application and we refresh our page, you'll notice it prints out the users name and their age. So, this feature allows you to essentially test these different network requests even before they actually exist and then as soon as you're finally done with this and that network request has been created by the back end team, team, you can just come in here and delete this particular request, right click delete and click okay and now you no longer have that override.
