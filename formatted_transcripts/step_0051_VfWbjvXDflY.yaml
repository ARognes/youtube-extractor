transcript: There is a particular dynamic that I hear quite a bit around expectations around work increasing specially because of AI. We have all of this AI it writes code for us. Here's some more stuff on your plate. By the way, you should be 10x more efficient because the AI is doing all of the stuff. >> There is an art as well again as a science to talking to your manager and the essence of that is I'm doing a lot of things for you. You seem to appreciate it. When I say for you, for the team, for our shared goals. I'm being very productive, but there's a priority and a value to the things I do. I may bring you a proposal, but can we talk about moving some of the lower priority things I'm doing off my plate so that I have more room for the higher value. And that can mean not doing them. It can mean investing in automating them. It can mean giving them to someone more junior. The way you make that win-win with the manager is simple math, I think. You're getting benefit. You like what I do. I like what I do for you, with you. But I'm now at what capacity. Here are my ideas on how to free my capacity. What can we do together?
