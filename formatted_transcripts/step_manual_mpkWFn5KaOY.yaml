transcript: '{"content":"\n[0.24s] Why do we feel like we are our thoughts?\n[3.36s] Why does it seem like our mind is the\n[5.68s] core of who we are, our real being, even\n[9.2s] though it is so often out of control?\n[12.08s] The Buddha gave us a striking simile for\n[14.4s] this condition. He said that the mind is\n[16.8s] like a monkey swinging through the\n[18.64s] forest. He also had something else to\n[21.039s] say in that suta which is even more\n[22.72s] surprising. We''ll get to that at the\n[24.48s] end. In this video, I''ll explore this\n[26.96s] simile of the monkey mind. some other as\n[30.08s] I say surprising things the Buddha had\n[31.76s] to say about the nature of the mind and\n[34.559s] how we can work with this monkey mind in\n[37.92s] our daily practice. First let''s turn to\n[40.559s] this monkey mind and the idea of\n[43.04s] misplaced identity. How is it that the\n[46.719s] ordinary person relates to the body and\n[49.36s] the mind? The Buddha has this to say in\n[51.76s] one early suta. Mendicants when it comes\n[54.8s] to this body made up of the four\n[56.399s] elements an unlearned ordinary person\n[59.199s] might become disillusioned dispassionate\n[62.239s] and freed why is that this body is made\n[66.0s] up of the four elements is seen to\n[68.64s] accumulate and disperse to be taken up\n[71.52s] and laid to rest that''s why when it\n[74.24s] comes to this body an unlearned ordinary\n[76.799s] person might become disillusioned\n[79.28s] dispassionate and freed\n[81.92s] when it comes to that which is called\n[83.6s] mind and also sentience and also\n[86.32s] consciousness. An unlearned ordinary\n[89.119s] person is unable to become\n[91.2s] disillusioned, dispassionate or freed.\n[94.159s] Why is that? Because for a long time\n[96.88s] they''ve been attached to it, thought of\n[98.96s] it as their own and mistaken it. This is\n[101.36s] mine. I am this. This is myself.\n[106.64s] That is many of us ordinary people\n[108.96s] understand that the body grows and\n[112.32s] shrinks as we age. We grow up. We start\n[115.92s] life as a little baby and grow up and\n[118.64s] become an adult and then go into old age\n[121.36s] that the body changes shape. It changes\n[124.64s] form. We get wrinkles. We get different\n[127.52s] sorts of age spots and so on. And\n[130.0s] eventually the body dies and decays. And\n[132.959s] so therefore, it is naive and unskillful\n[137.599s] to take the body as who we really are\n[141.04s] because it''s always in a state of\n[142.879s] change. Most of us do understand that\n[145.599s] the body therefore isn''t permanent.\n[148.48s] However, the mind or at least some\n[150.959s] conception that we have of the mind such\n[153.519s] as sentience or thought or\n[155.92s] consciousness, we don''t think of in that\n[158.319s] way. And so even relatively\n[160.239s] sophisticated and ordinary people may\n[162.239s] take the mind or some conception of the\n[165.12s] mind as who we really are. Having made\n[168.72s] this claim that that most ordinary folks\n[172.0s] are attached to the mind as who we\n[174.8s] really are, the Buddha then goes on to\n[177.04s] make his famous simile. He says, \"But\n[180.56s] that which is called mind and also\n[182.56s] sentience and also consciousness is like\n[185.12s] a monkey moving through the forest. It\n[187.519s] grabs hold of one branch, lets it go and\n[190.0s] grabs another.\n[192.0s] Then it lets that go and grabs yet\n[194.159s] another. In the same way, that which is\n[197.2s] called mind and also sentience and also\n[199.68s] consciousness arises as one thing and\n[202.4s] ceases as another all day and all night.\n[207.36s] Now, this simile of the Buddhas has a\n[209.44s] number of key connotations.\n[212.239s] Perhaps the most important of these is\n[214.56s] that the mind or consciousness or\n[217.44s] wherever we''re going to understand it\n[220.0s] arises and ceases depending on a\n[222.64s] particular object. This is a point that\n[225.12s] the Buddha makes in many different\n[226.64s] places in the sutas. So we could perhaps\n[229.599s] come up with an example. Let''s say we''re\n[232.159s] out late at night on the street and we\n[234.56s] see some guy being manhandled in a\n[237.04s] doorway\n[238.56s] and then later on someone tells us that\n[242.239s] this man we have seen being manhandled\n[245.36s] was a violent drunk who had started a\n[247.519s] fight in the bar nearby.\n[249.84s] So what has happened in our mind during\n[251.599s] this whole process? Well, to begin with,\n[254.159s] we have eye consciousness. We see a\n[256.72s] certain thing based on a particular\n[259.44s] visual object in front of us. It''s a a\n[262.32s] man being manhandled. This causes to\n[265.12s] arise in us certain kinds of mental\n[267.44s] states. Say anger, a wish to intercede,\n[271.6s] maybe thoughts of call the police or\n[274.24s] something. This this person''s being\n[275.52s] manhandled. What are they doing to him?\n[278.0s] And then later on that eye consciousness\n[280.56s] is replaced by ear consciousness when\n[283.36s] somebody talks to us about what''s been\n[285.28s] going on.\n[286.96s] And then our mind changes instead of\n[289.68s] instead of feeling anger about what''s\n[292.4s] going on. We our anger dissipates and\n[295.04s] and disappears completely. We it''s\n[296.8s] replaced perhaps by a feeling of relief\n[298.96s] that something''s been done. This person\n[301.199s] perhaps has been stopped from creating\n[303.759s] more harm in the world. The point here\n[306.24s] is that as the Buddha says, that which\n[309.36s] is called mind arises as one thing and\n[312.0s] ceases as another all day and all night.\n[316.16s] The mind is always in a process of\n[319.12s] change, often radical change. And so\n[322.4s] therefore, it''s not a stable source for\n[325.52s] a sense of permanent self.\n[328.479s] The Buddha also had something else uh in\n[330.88s] a sense even more surprising to say in\n[333.12s] the the remainder of this suta which\n[334.8s] I''ll get to in a moment. Second, I want\n[337.28s] to turn to this idea of the wandering\n[339.36s] mind. Another connotation of this simile\n[343.44s] that the Buddha gives us of the monkey\n[345.199s] mind isn''t explicitly made in this suta\n[348.639s] I think but is nevertheless understood\n[351.039s] by much of the tradition which is that\n[354.16s] the mind in being like a monkey is in a\n[358.32s] sense random. It moves randomly from\n[360.4s] place to place uh unguidedly from place\n[363.759s] to place. And this is a very good simile\n[367.44s] for the the fe the the experience we all\n[370.96s] have of restlessness. In particular,\n[373.44s] restlessness when we''re in meditation.\n[376.4s] Restlessness is one of the most common\n[378.96s] perhaps deepest of the hindrances to\n[381.84s] meditation.\n[383.44s] That is this monkey mind that we''re\n[385.28s] talking about. It isn''t mean or evil in\n[388.639s] any way. It''s just directionless and out\n[391.44s] of control. It''s confused. So, it''s\n[394.56s] pulled this way and that by certain\n[397.039s] kinds of things that it desires or that\n[399.12s] it wants to be away from, sense desires\n[401.52s] and other kinds of sense objects that\n[403.68s] pull it one way or another. Recognizing\n[406.8s] this restlessness and that the\n[408.88s] restlessness is caused by our cravings\n[411.12s] and aversions is the first step towards\n[414.24s] taming this monkey mind. Third, I want\n[417.12s] to get to how we tame this monkey mind.\n[421.36s] In the sutas, the Buddha gives a number\n[423.68s] of different techniques we can use for\n[426.8s] stabilizing and calming the monkey mind.\n[430.56s] Now, we can''t get into them all here,\n[432.8s] but I can touch on at least a few of\n[434.88s] them. First of all, we can use what''s\n[437.039s] known as sense restraint,\n[439.36s] which is to be aware of the way that our\n[442.88s] senses are interacting in the world and\n[445.759s] what sorts of media, let''s say, we''re\n[447.52s] consuming\n[449.039s] and to try to understand whether that\n[451.28s] media, whether those sense objects that\n[453.759s] we''re consuming, that we''re getting\n[455.36s] involved with, are beneficial or not for\n[458.56s] us, for our minds. Do they help to\n[460.96s] stabilize and calm the mind? Do they\n[463.36s] help to put us in a good frame of mind?\n[465.52s] Or instead, do they tend to condition\n[469.12s] more monkey-mindedness?\n[471.44s] If we feel we''re being overwhelmed by a\n[473.919s] particular kind of sense object, by a\n[476.479s] particular sort of media, then perhaps\n[478.96s] we practice sense restraint with regard\n[481.12s] to that. We stop consuming it quite so\n[483.919s] much. Second, we can practice\n[486.16s] concentration meditation. Here is where\n[489.44s] in formal meditation we sit down and do\n[493.44s] a practice of focusing our attention on\n[495.919s] one particular object such as let''s say\n[498.8s] the breath or perhaps a mantra or many\n[501.68s] other different things. We focus on it\n[504.24s] in order to again calm and stabilize the\n[507.68s] mind onto one particular object. And\n[510.879s] perhaps over time through this kind of\n[513.68s] process of stabilization, we can reach\n[516.0s] deeper states of meditative absorption.\n[518.88s] Third, we can use a practice of\n[521.12s] mindfulness where we turn our attention\n[523.839s] to present moment experience instead of\n[527.44s] allowing the mind to wander willy-nilly\n[530.399s] to the past and the future and to other\n[532.32s] places and times. and mindfulness\n[535.04s] meditation. In the Buddha''s description\n[537.519s] of the practice of mindfulness\n[539.68s] meditation in the sutas and in\n[541.76s] particular in his four foundations of\n[543.92s] mindfulness, he begins this practice\n[546.399s] with a focus on mindfulness of the body.\n[550.56s] Now why does he begin with mindfulness\n[553.44s] of the body and then only later turn to\n[556.48s] mindfulness of various kinds of mental\n[558.56s] states? This is because among other\n[561.44s] things it''s easiest to continue focus on\n[565.44s] bodily sensations. It''s easier to\n[567.76s] continue a focus or to begin a focus\n[570.24s] there rather than to begin a focus on\n[572.959s] mental thing, mental objects or mental\n[575.12s] processes. Why is this so? Fourth, I\n[579.279s] want to turn now to this other\n[581.44s] surprising claim that the Buddha makes\n[583.12s] in this suta, which is in fact related\n[585.92s] to this point of why it is that we begin\n[588.88s] with the body when we''re doing\n[590.399s] mindfulness meditation.\n[592.64s] In the suta, the Buddha goes on to say,\n[595.04s] \"An unlearned ordinary person would be\n[597.76s] better off taking this body made up of\n[600.08s] the four elements to be their self\n[602.24s] rather than the mind.\" Why is that? This\n[606.0s] body made up of the four elements is\n[607.92s] seen to last for a year or for 2 3 4 5\n[612.32s] 10 20 30 40 50 or 100 years or even\n[616.56s] longer.\n[618.72s] So what the Buddha is saying here and I\n[620.56s] think it''s comes as some something of a\n[622.399s] surprise perhaps for many of us is that\n[625.2s] if we were going to identify ourselves\n[627.519s] with something it would make more sense\n[630.0s] to identify ourselves with our body\n[632.48s] rather than with our mind. Why is that?\n[635.68s] Because the body seems to be relatively\n[638.399s] stable over a period of months, years,\n[641.6s] even decades. While the mind, as the\n[644.0s] Buddha says, changes from morning to\n[646.56s] night all the time, every moment, we\n[648.48s] might say. Now, I don''t want to make too\n[650.72s] much of the Buddha''s claim here. He he''s\n[652.959s] clearly not saying that the body\n[654.8s] literally is our self. After all, the\n[657.6s] body is always changing subtly as well,\n[660.64s] and we''ve discussed that already. But\n[663.519s] nevertheless, he''s saying that the body\n[665.6s] changes in a sense less often than the\n[667.92s] mind. The body appears as more permanent\n[671.519s] than the mind if we really investigate\n[673.76s] it. And this highlights the reason why\n[676.959s] mindfulness meditation begins with\n[679.279s] mindfulness of the body and then only\n[682.16s] later turns to mindfulness of the mind\n[684.399s] and mental things. Why is that? It''s\n[687.68s] because it''s easier to stabilize our\n[690.079s] attention on the body, on the breathing,\n[694.0s] on let''s say walking, meditation, on the\n[696.56s] postures rather than on mental processes\n[700.8s] because the body is relatively stable or\n[704.24s] involves regular kinds of change over\n[707.76s] time such as breathing in and out or\n[711.519s] walking one foot and then the other,\n[713.6s] left then right. There''s a kind of\n[715.6s] irregularity to the change that can\n[717.519s] persist over quite a period of time. The\n[720.48s] mind, on the other hand, changes with\n[722.56s] extreme rapidity and often in seemingly\n[725.76s] random and uncontrollable ways. Again,\n[728.639s] like a monkey in the forest, grasping\n[731.36s] one branch and leaving another. Fifth,\n[733.6s] and in conclusion, the the Buddha was\n[735.44s] after a better way to hold and\n[737.6s] understand the mind. What the Buddha was\n[740.24s] not trying to do, he was not trying to\n[742.32s] get us to completely stop all mental\n[744.8s] activity. Nor was he trying to shame us\n[749.12s] because of our ordinary mental\n[751.2s] wanderings.\n[752.959s] Instead, he was pointing at the\n[755.12s] absurdity of taking something as chaotic\n[758.959s] and random and out of control as the\n[761.68s] monkey mind as somehow who we really\n[764.639s] are. Through practices, devoted\n[767.92s] practices such as sense restraint and\n[770.399s] concentration and mindfulness.\n[773.36s] We can try to tame this monkey mind over\n[776.16s] a period of time. What we''ll end up with\n[779.279s] is a mind that is somewhat less\n[782.48s] restless, that is still active, but\n[785.839s] nevertheless more focused and more wise\n[788.959s] in what it actually attends to. So what\n[792.24s] do you do when your your mind will not\n[794.8s] quiet down? The standard understanding\n[798.24s] of this in Buddhism has to do with what\n[800.079s] are known as the five hindrances. And I\n[802.56s] have a video on those hindrances I did a\n[804.56s] while back. I''ll leave a link to it up\n[805.92s] here on the screen if you''re not\n[807.44s] familiar with them or would like a\n[809.2s] refresher. Thanks so much and we''ll\n[811.279s] catch you on the next video. And\n[812.959s] meanwhile all of you be"}'
