gs of the\n[114.96s] early Buddhist teachings.\n[117.84s] And I wanted to find a way to integrate\n[120.0s] these two interests of mine.\n[123.52s] As my channel matured, I tended to lean\n[126.44s] into the second of these aims.\n[129.28s] Some of you will know that I took the\n[131.52s] word secular out of my channel name. It\n[133.8s] used to be called Doug''s Secular Dharma,\n[137.2s] because I noticed that that word was\n[140.04s] being commonly misunderstood and getting\n[142.52s] things off track.\n[145.08s] In any event, I pivoted more towards\n[147.36s] early Buddhism.\n[148.96s] And I feel like I''ve covered a lot of\n[150.96s] that ground, not not all of it by any\n[153.32s] means. There''s There''s always going to\n[155.08s] be more to say, but the core of what I\n[157.76s] wanted to say is is largely out there.\n[161.52s] What''s been energizing me more recently\n[163.88s] is something a little different. That is\n[166.48s] the places where early Buddhist ideas\n[169.4s] connect to some live contemporary\n[171.68s] questions.\n[173.64s] My academic background, some of you may\n[175.76s] know, is in philosophy of mind.\n[178.56s] Concepts like anatta, that is the\n[180.76s] Buddha''s teaching on non-self,\n[183.2s] turn out to speak directly to live\n[185.28s] debates in philosophy, in consciousness\n[188.76s] studies,\n[190.08s] and in questions raised by developments\n[193.16s] in artificial intelligence.\n[196.0s] This is not meant to be a departure from\n[198.08s] the Dharma.\n[199.4s] It''s more like following the inquiry\n[201.96s] where it naturally leads, down some\n[204.28s] enticing rabbit holes.\n[206.72s] The Buddha''s insights about the nature\n[208.64s] of mind did not stop being relevant.\n[211.64s] If anything, they''re more relevant now\n[213.96s] than ever.\n[217.0s] There are also some loose threads around\n[219.4s] the edges of Buddhist Dharma.\n[221.8s] Questions that I''ve bumped up against\n[224.4s] over the years that don''t fit neatly\n[226.92s] into the introductory material, but also\n[229.52s] deserve attention.\n[232.04s] And there are still live questions about\n[235.48s] constructing a contemporary belief and\n[238.0s] practice.\n[240.32s] Just to make things clear, I have no\n[242.08s] intention of leaving early Buddhism\n[244.72s] behind, not at all.\n[247.36s] Instead, I want to expand outward from\n[250.4s] early Buddhist ideas into territory\n[253.2s] where things get a little weird or even\n[255.76s] unsettling,\n[257.28s] and where they have something genuinely\n[259.0s] important to contribute to modern\n[261.76s] conversations.\n[264.68s] So, the upshot is that the foundation\n[266.92s] will stay largely the same, but the\n[269.52s] exploration is going to grow outwards a\n[271.72s] bit.\n[274.64s] Now, in practice, this shift is going to\n[276.8s] start happening in June.\n[278.92s] In fact, in many ways, it''s already\n[281.32s] started happening a bit.\n[283.68s] But, what does it actually look like for\n[285.4s] the channel?\n[287.04s] Well, the honest answer is that I don''t\n[289.6s] really know. It''s going to be a work in\n[291.64s] progress. So, we''re going to have to\n[293.64s] find out together.\n[295.48s] I have some ideas, some loose threads,\n[299.24s] and we''re going to see where they go.\n[302.56s] You''ll still see videos grounded in\n[304.88s] early Buddhist teachings. That is, as I\n[307.4s] say, the foundation of the channel, and\n[309.12s] it''s not going to go away.\n[312.04s] But, you''ll also see more explorations\n[315.04s] into how those teaching teachings\n[317.12s] intersect with modern questions about\n[319.96s] the mind, philosophy, and science, maybe\n[322.08s] some other topics as well.\n[324.88s] Some of you will have already seen me\n[326.64s] dipping into this territory.\n[329.6s] And if you have ideas about new videos,\n[332.08s] new content, new directions that you\n[334.16s] might find interesting, as always,\n[336.36s] please let me know in the comments, and\n[338.44s] I''m all ears.\n[340.64s] As regards the cadence, that is, my\n[343.28s] video release schedule, I expect to step\n[346.32s] back somewhat from the weekly drop that\n[348.72s] I''ve maintained for years.\n[351.76s] I don''t have a fixed schedule to\n[353.84s] announce, honestly. As with all these\n[356.56s] channel topics, I need to feel my way\n[359.04s] into what the right rhythm looks like\n[361.32s] given the changes that are coming in my\n[363.24s] life.\n[365.24s] What I can tell you is that when videos\n[368.04s] do come out, they''re going to reflect\n[370.08s] genuine engagement and curiosity on my\n[372.64s] part, rather than some abstract\n[375.72s] obligation to hit a weekly schedule or\n[378.56s] deadline.\n[380.64s] The point here is that going forward,\n[383.12s] I''d rather make fewer videos that I''m\n[385.44s] fully invested in,\n[387.56s] than keep producing on a schedule for\n[389.68s] its own sake. That way leads to low\n[392.6s] energy.\n[394.16s] I think you deserve higher energy, and\n[396.44s] and frankly, I do, too.\n[401.2s] For all my lovely and stalwart\n[403.44s] supporters on Patreon, thank you\n[405.56s] sincerely. I couldn''t have done this\n[407.84s] without you.\n[409.4s] As I look forward, I notice some things\n[411.56s] that are working really well over there,\n[414.36s] and others that could stand to change.\n[417.56s] So, I''ll be looking to simplify things a\n[419.96s] bit, and we''re going to keep chugging\n[422.0s] forward on Patreon. I plan to share more\n[424.8s] details on the Patreon page when my\n[427.68s] thoughts about this all come together.\n[430.44s] If you''re interested in hearing more\n[431.96s] about that, you can keep your eyes out\n[434.0s] over on Patreon. If not, no worries.\n[440.16s] As I''ve said a couple of times here\n[441.84s] already, I honestly don''t know exactly\n[444.56s] where all this goes longer term.\n[447.36s] Maybe this new direction sustains itself\n[450.2s] for years.\n[451.64s] Maybe my interests shift somewhere\n[454.24s] again.\n[456.04s] I''ve always been someone whose curiosity\n[459.2s] tends to go very deep, but in cycles.\n[463.44s] So, rather than fighting that, I''m going\n[465.88s] to design around it, which means being\n[467.92s] honest with you.\n[469.44s] What I can promise are the same things\n[471.96s] this channel has always been about.\n[475.28s] Genuine inquiry,\n[477.24s] curiosity with the world and with our\n[479.28s] place in it,\n[481.0s] an honest engagement with the material,\n[483.84s] and respect for your time and your\n[486.04s] intelligence.\n[488.0s] And to continue along this aim of\n[490.92s] helping us all to make our lives wiser,\n[493.68s] kinder, and calmer.\n[496.56s] If you look closely at all of this,\n[498.92s] you''re going to see how it all continues\n[501.16s] to fit right into the Dharma.\n[504.16s] Change is constant, so we should embrace\n[507.8s] it.\n[509.0s] Clinging to a fixed identity is exactly\n[512.08s] the kind of attachment that the teachers\n[514.719s] that the teachings of the Buddha\n[516.96s] point us away from.\n[518.919s] And that means me, too. That It applies\n[521.479s] to me as much as to anybody.\n[523.719s] So, rather than hammering on the same\n[526.0s] points over and over in my videos, I''m\n[528.48s] going to take this positive life change\n[530.88s] to move forward, to change a little bit,\n[534.4s] and to trust the pathway.\n[537.28s] I hope that in all of this, you''re going\n[539.44s] to stay along with me.\n[541.72s] Thanks, as always, for watching and\n[544.311s] [snorts] for your dedicated ongoing\n[546.28s] practice. I''ll see you in the next\n[548.36s] video, and meanwhile, all of you, please\n[551.12s] be well."}'
