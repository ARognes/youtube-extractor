transcript: '{"content":"\n[0.4s] What is reality? What really exists?\n[3.52s] These are some of the oldest\n[4.88s] philosophical questions and some of the\n[6.799s] most relevant even today. Many religious\n[10.16s] and philosophical schools offer dogmatic\n[13.2s] answers to these kinds of questions,\n[15.2s] including some within Buddhism itself.\n[18.56s] However, in today''s video, we''re going\n[20.56s] to look at early Buddhism''s take on\n[22.8s] these kinds of questions, which, as\n[24.88s] we''ll see, is more pragmatic. In this\n[27.599s] video, we''ll take a look at what the\n[28.96s] Buddha had to say about the nature of\n[30.72s] reality and what it might mean to us\n[33.16s] today. As we''ll see, the Buddha''s v view\n[36.16s] of reality was of a piece with his\n[38.559s] general approach which is known as the\n[41.04s] middle way. I''ve done a video on that,\n[43.76s] several videos. I''ll leave a link to one\n[45.2s] of them down below in the notes if you\n[46.96s] want to hear more about that. But\n[49.039s] perhaps the most famous place he talks\n[51.12s] about this is in what is known as the\n[53.36s] Kachana Goa Suta. In that suta, the\n[56.399s] Buddha says, \"This world mostly relies\n[59.6s] on the dual notions of existence and\n[64.199s] non-existence.\" And these are the two\n[66.32s] extremes that the Buddha\n[68.36s] rejects. Both of these extremes depend\n[71.04s] upon not understanding the true origin\n[74.24s] and sessation of things. Now the idea of\n[77.84s] existence at least in the Buddha''s words\n[80.32s] is this idea that things exist somehow\n[83.64s] permanently\n[85.479s] unchangingly and this kind of view of\n[87.759s] reality depends upon not understanding\n[90.56s] sessation properly. On the other hand\n[93.439s] the view of\n[94.68s] non-existence this is the view that\n[96.96s] essentially nothing exists at all. And\n[100.32s] this this view in the Buddha''s\n[102.079s] understanding relies upon not\n[104.24s] understanding the true origin of things.\n[107.52s] What you''re left with in that case is a\n[109.52s] middle way. What what the Buddha calls a\n[112.079s] middle way between these two extremes.\n[115.36s] Now this middle way shouldn''t be thought\n[117.28s] of as a kind of a compromise between\n[119.92s] existence and non-existence. That that\n[122.079s] doesn''t really make a whole lot of\n[123.2s] sense, but rather a whole a wholly\n[125.92s] different way of framing the issue. an\n[128.879s] issue that the Buddha frames in more\n[131.039s] causal terms along the lines of what''s\n[133.68s] known as the laws of dependent\n[135.64s] origination. For the Buddha, reality is\n[139.04s] not constituted by permanently existing\n[142.72s] things or\n[143.959s] substances. Instead, reality is a kind\n[146.56s] of a web of interconnected events,\n[149.28s] interconnected causes and effects. This\n[152.08s] dynamic of things constantly arising and\n[154.959s] passing away, arising and ceasing is\n[158.0s] known as the teaching of dependent\n[160.12s] origination. And this arising and\n[162.56s] passing of events is essentially all\n[164.56s] there is. There''s no need to posit\n[167.68s] hidden permanent substances that exist\n[170.959s] behind what we actually see occurring in\n[173.84s] front of us. events arise and pass\n[176.56s] depending upon other events and cease\n[179.599s] when other events come to pass. For\n[182.319s] example, we can think of these of this\n[185.04s] chain of dependent origination that I''ve\n[186.879s] been mentioning in there. There''s a\n[189.2s] number of different links but some of\n[191.76s] them can can be pretty easily\n[193.68s] understood. For example, with contact\n[196.56s] with the arising of contact, you have\n[200.56s] feeling. In other words, you make your\n[203.519s] senses make contact with things in the\n[205.68s] world and that makes a pleasant or an\n[208.0s] unpleasant feeling arise in you. And\n[210.72s] with the arising of that feeling, there\n[213.04s] will be a potential arising of craving.\n[215.84s] So if you have a pleasant feeling,\n[217.28s] craving will arise conditioned by that\n[219.84s] pleasant feeling. The pleasant feeling\n[221.84s] itself having been conditioned by the\n[223.68s] contact. And from a longer viewpoint,\n[227.44s] the arising of birth conditions the\n[230.64s] arising the later arising of death of of\n[234.4s] the end of that cycle. And in the longer\n[237.68s] the longest possible view at least in\n[240.239s] the Buddha''s understanding of dependent\n[241.92s] origination, ignorance being the first\n[244.959s] cause is the\n[247.319s] eventual leads to the eventual result of\n[250.239s] duka of this entire mass of suffering.\n[253.68s] This way of understanding reality\n[256.32s] encourage us to let go of our craving to\n[260.079s] pin things down as this or that for all\n[263.68s] time, but understand that things are\n[265.84s] always in a process of change and\n[268.56s] evolution. Now, when we''re asking about\n[271.199s] the nature of reality, it''s also\n[273.84s] important to take account of the fact\n[276.24s] that the Buddha rejected a lot of\n[279.199s] speculation around certain kinds of\n[282.199s] cosmological ideas. For example, whether\n[285.44s] the universe is infinite or not, whether\n[288.8s] the mind and the body are the same or\n[291.0s] different, whether uh that enlightened\n[293.84s] being exists or doesn''t exist after they\n[296.8s] pass away.\n[298.72s] Now, the question as to why the Buddha\n[301.44s] rejected answers for these questions,\n[303.44s] refused to answer these kinds of\n[305.12s] questions, has led to a lot of\n[307.52s] additional speculation down the\n[309.52s] centuries of people wondering why it was\n[311.52s] that the Buddha decided not to answer\n[313.759s] these kinds of questions. But in fact,\n[316.32s] within the sutras, the Buddha tells us\n[319.199s] why he doesn''t answer these questions.\n[321.6s] He doesn''t answer them because he\n[323.039s] doesn''t think that they''re conducive to\n[325.479s] liberation. As the Buddha says, why have\n[329.039s] haven''t I declared these things? Because\n[331.68s] they aren''t beneficial or relevant to\n[334.32s] the fundamentals of the spiritual life.\n[336.88s] They don''t lead to disillusionment,\n[339.199s] dispassion, sessation, peace, insight,\n[342.32s] awakening, and extinguishment.\n[345.36s] Further looking for an answer to these\n[347.52s] kinds of speculative questions in the\n[350.24s] face of all the suffering that we''re\n[351.96s] undergoing is the Buddha says akin to\n[355.199s] being shot with a poison tipped arrow\n[358.639s] but refusing to allow anyone to actually\n[362.4s] uh you know for refusing to allow a\n[364.56s] doctor to treat you until you know all\n[367.759s] about the person who shot the arrow, the\n[370.96s] the composition of the bow, the\n[373.36s] composition of the shaft, the kind of\n[376.8s] arrow head that was used, and so on and\n[378.8s] so on. What the Buddha says is if that''s\n[382.16s] the ca, if you want to know these kinds\n[383.759s] of things, you''re going to be dead long\n[385.52s] before you actually know them. And in\n[388.72s] the same way, if you want to know the\n[390.88s] answers to these kinds of speculative\n[392.84s] questions, you''re going to be dead long\n[395.12s] before you know the answers to them. And\n[398.0s] that goes against the real thrust and\n[401.28s] aim of the dharma. The aim of the dharma\n[403.68s] is to alleviate suffering, not to sort\n[406.56s] of let yourself know the answers to\n[408.8s] every speculative question you might\n[410.479s] have. The point therefore in these\n[413.28s] unanswered questions of the Buddha isn''t\n[416.08s] to somehow ignore reality or pretend it\n[419.12s] doesn''t exist, but rather uh to to deal\n[423.44s] with reality where it really counts.\n[426.479s] That is in suffering and in the\n[429.12s] sessation of suffering. Now when it came\n[431.44s] to the nature of reality as well as\n[433.919s] everything else really, the Buddha never\n[436.4s] relied or never asked for any kind of\n[438.639s] blind faith from his\n[440.599s] followers. Instead, what he expected\n[443.12s] from them was curiosity, a willingness\n[446.4s] to investigate reality, mindful\n[449.28s] investigation along those lines. He\n[451.84s] asked for us to count on our own direct\n[453.84s] experience.\n[455.44s] This is perhaps most famously expressed\n[458.4s] in the Kalama Suta, which is a suta that\n[462.88s] probably encapsulates in the best way\n[467.68s] early Buddhism''s approach to\n[470.08s] epistemology or the theory of knowledge,\n[472.4s] how we know what we know. In that suta,\n[475.759s] the Buddha is talking to a group of\n[478.319s] interested lay people who are not\n[480.4s] themselves followers of the Buddha and\n[482.56s] who are in fact very confused by all the\n[485.199s] different people who''ve come and given\n[486.879s] them talks about the nature of\n[489.16s] reality. And what the Buddha advises\n[492.08s] them is not to go on\n[495.0s] tradition, nor to go on hearsay just\n[498.08s] because somebody says something, and nor\n[500.8s] to go on armchair speculation, just\n[503.84s] making things up, but instead to rely\n[507.599s] upon their own experience over time as\n[512.08s] to what counts as truly skillful and\n[516.0s] helpful and healthy and what does not.\n[519.12s] In this sense, for the\n[520.76s] Buddha, reality, the way things are, is\n[524.32s] not so much to be understood as a kind\n[526.24s] of an abstract theory that we can\n[528.8s] believe in or not believe in, but rather\n[532.24s] a state of affairs, a way things are\n[534.16s] that we experience directly and see for\n[537.16s] ourselves. In conclusion, the Buddha''s\n[539.68s] ideas encourage us to let go of many\n[542.56s] what we might consider speculative\n[544.48s] cosmological ideas.\n[547.0s] Instead, we''re to look deeply into our\n[549.519s] own experience and see the way things\n[552.24s] are interrelated, causally interrelated\n[554.959s] and impermanent. The way they rise and\n[557.36s] fall and are replaced by other things\n[560.32s] that rise and fall. And crucially, this\n[563.12s] state of affairs of impermanence and\n[565.959s] interconnectedness includes our very\n[568.32s] selves. We ourselves are no different.\n[571.519s] We are ourselves impermanent and\n[574.08s] causally interact with the world around\n[576.16s] us. Although over the centuries and the\n[579.32s] millennia, the Buddha''s system has\n[581.519s] become deeply intellectualized in many\n[584.56s] different schools of\n[586.04s] Buddhism. I think we should see early\n[588.399s] Buddhism and the Buddha''s message is not\n[590.56s] fundamentally an intellectual message.\n[594.0s] Instead, it''s a message of seeing\n[596.399s] directly the way things are.\n[598.399s] Understanding reality in this way as a\n[600.72s] kind of a process of interconnected\n[603.76s] events that come and go without any\n[607.24s] underlying fixed permanent elements\n[610.56s] without anything that we can really\n[612.88s] point to as a permanent or essential\n[615.44s] self or things that are\n[617.56s] mine. This kind of picture of reality I\n[620.48s] think frees us up to live more\n[622.92s] compassionate, more free and more wise\n[626.8s] lives. My question to you, therefore, is\n[630.16s] what views have you had about the na\n[632.16s] nature of reality? How have you your\n[634.72s] views changed over time? Have they been\n[637.6s] helpful to you in some way or other? Or\n[640.32s] instead, have they gotten in the way of\n[641.76s] things? I''d be interested to know. If\n[644.0s] you want to know more about the early\n[647.839s] Buddhism''s philosophy generally, I have\n[650.079s] a playlist on early Buddhist philosophy,\n[652.48s] and I''ll leave a link to that up here on\n[654.0s] the screen if you want to hear more\n[656.079s] about that. And if you''re getting\n[658.0s] something out of these videos of mine,\n[659.92s] consider taking a look at my Patreon\n[661.6s] page, which is linked up here on the\n[663.68s] screen and down below in the notes, and\n[665.76s] see if you want to help support the\n[667.12s] channel and the work that I''m doing\n[668.8s] here. Thanks so much, and we''ll catch\n[670.48s] you on the next video. And meanwhile all\n[672.64s] of you be"}'
