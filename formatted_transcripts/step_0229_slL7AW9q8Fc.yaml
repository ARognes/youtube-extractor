transcript: so this is the story about how i quit netflix about three years into working at netflix i was kind of excelling i took on some projects that a lot of people kind of said no to it turns out that we had groovy on the back end yes groovy baby was on the back end it's a terrible jvm language it absolutely is dog water but i just happen to take a little bit of time look up a few things out you know a few ways to do stuff in groovy and of course i just excelled beyond everybody else because everybody else is just like i just want to get the stuff done i don't want to look at it i don't want to be a part of it so i got good enough that i could actually build a bunch of different back ends so i got selected to kind of do this kind of large improvement that would make it so that we could have extra metadata about every single video in the television catalog and of course from there they put me onto an open source project that was related it was called falcor no not the luck dragon okay though named after the luck dragon not a luck dragon effectively what falcore was is you can kind of think of it like a graphql you provide an array of kind of strings or numbers and it would go off onto the back end and grab all that data like a super simplified squeal-like language yes i just said squeal hey i'd also be squealing if you hit that sub button thanks baby anywho so this was like my dream job i got to go to conferences i got to speak both in the uk i got to speak uh multiple times in amsterdam got to do a bunch of different places throughout the united states it was awesome open source circuit the dream life right it was fantastic actually it wasn't that fantastic now i think in today's day and age that that really is the dream life that is what a lot of people kind of aspire to be working full-time while getting paid while working on open source but let me tell you i i would i really had a hard time and this is the reason why we are a small team about four of us devs all working on a couple different products for the ui kind of team we were called a ui platform at the time and during this one of the roles was kind of like a non-coding architect really deciding how things should work and of course this role kind of appears from various companies and people really have strong feelings about these kind of roles me personally i greatly dislike non-coding architects reason why is i feel like they get so abstracted from reality that they start building things that though they look great on a whiteboard we're talking lab coats mwah clipboards those little goggles to protect your eyes things are looking great but when you actually implement it it's nothing but a dumpster fire of logical inconsistencies and all those other things i just i just can't stand it so of course this was going on and for about a year i just like i was programming like 60 hours a week i was putting in so much effort and it was just starting to feel more and more soul-crushing and i can still remember it must have been december 28th 29th 27th shortly after christmas walking into my backyard at like seven at night having a long conversation i did not want to have discussing some of the internal details about falcore oh we want to make this pivot oh this is actually going to be the greatest most ergonomic most developer experience change in the universe and i remember that was kind of like the moment i snapped right like i could not handle this project anymore i became pretty dang infuriated with it but at the same time something else happened i had another co-worker who was working beside me also feeling a lot of the same weight and he really kind of reached out and kind of started pouring out his so you know his heart in you know the best way that he could and of course i was much younger and much dumber at that point and i didn't catch it at all right in a sense that i was just like yeah i'm kind of upset too but that's about it right i didn't hear him and i really look back at that as one of my bigger failures in that moment and really of just of my lifetime in the professional sense you know having someone come to you and tell you these things and not really try to be there for them try to help lift them up or even approach your boss you know with their permission of course and really try to create a better team conversation i really wish i would have taken the control of the situation that i would do today if it was today i would have been much more forward much more open about everything long before i got to the point but ultimately what ended up happening was that i became so sick and so kind of toxified from my job that i started looking elsewhere and ultimately i did find a different job uh at coursera yeah coursera online education i had a good friend there tom willow where we were who was the uh i forget chief product officer something like that vice president of products i can't remember what his role was but he got me the interview i got accepted i was actually going to make the jump and i sat down with my boss and said hey i'm not going to work at netflix anymore and ultimately it was all because of those previous interactions and i think there's a lot of things that i did that i failed there i really do wish i would have taken more time and understood how i felt and kind of really you know judged myself in a more sober tone and ultimately i really wish i would have been there more for my co-worker i really wish i could have turned around the team and helped because in the end a couple people you know within this area actually a few people within the area got fired which is sad i was about to change jobs until of course papa j wagner came over and called me back in made a nice offer no monetary by the way no monetary change just made an offer for me to come work with him on his team and ultimately i did and it was fantastic i took down production a few times and it was a lot of fun but in the end i quit netflix and it's because i didn't have communication and the talks that i should have had i wasn't understanding myself as well as i should have and so if you find yourself in those situations you've got to speak up you've got to approach your boss and if your boss and your co-workers aren't good enough to listen like i wasn't good enough to listen right you know i i i failed my co-worker but ultimately my boss should have also been there listening and making the situation better which didn't happen and it led to a lot of uh you know probably a lot of heartache if you work at a company that doesn't support you in that kind of sense that doesn't understand that things are kind of going wrong that it's only causing more and more tension you probably need to start thinking about a how can you improve the situation or b is it time to leave the situation and i just chose b without considering a big mistake make sure you consider a because often you know bosses are motivated to make you you know happy they're there to make a team successful and so there's a lot of change that you can enact by simply speaking up and being confident and pushing forward what you think is best so that's the time that i quit netflix but hey i still work at netflix i still really enjoy it that was about five years ago and look at me now i work on dumb things and write c plus from time to time thank you for watching hey subscribe to the channel already give this video like maybe make a little comment have you ever had a situation in which you affected change wish you would have looking back or have you ever been on the other side of it the firing side the side in which you wish some other co-worker would have stepped up like i should have done for mine my name's the premision thank you
