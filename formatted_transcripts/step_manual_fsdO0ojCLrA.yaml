transcript: '{"content":"\n[0.16s] Many of us struggle with questions of\n[2.32s] identity. Who am I? What is my real\n[5.48s] self? The Buddha identified three deeply\n[9.12s] ingrained ways that we cling to our\n[11.599s] identity. He termed these this is mine,\n[14.88s] this I am, and this is myself. But what\n[18.96s] do these mean and how do they function\n[21.039s] psychologically?\n[22.8s] In this video, we''ll look at each of\n[24.64s] these in turn with help from an old\n[27.599s] commentary that links each of them to a\n[30.08s] different kind of mental defilement.\n[32.96s] We''ll explore what they mean and how we\n[35.6s] can begin to practice letting them go.\n[38.559s] First, let''s turn to these three clings.\n[42.079s] In an a recent essay on one early suta,\n[45.68s] the scholar Patan notes that when\n[49.52s] talking about these three forms of\n[51.36s] clinging, this is mine, this I am, this\n[54.0s] is myself, that he turns to a an early\n[58.199s] commentary. And I''ll leave a link to\n[60.64s] Potan''s essay down below in the notes if\n[62.48s] you want to read what he has to say. But\n[65.0s] basically this commentarial uh uh\n[68.76s] interpretation takes each of these three\n[72.119s] clings as representative of one of the\n[75.6s] mental defilements or another. We can\n[78.24s] begin with the first one. This is mine.\n[81.6s] This the commentary says is linked to\n[84.24s] the defilement of craving of always\n[87.28s] wanting and needing more. Here we take\n[90.64s] possessions of things, of our\n[93.24s] relationships, of objects around us, of\n[96.4s] our\n[97.32s] experiences, of our feelings, of our\n[100.799s] thoughts, and we consider them all to be\n[103.84s] ours, to be our possessions. And even\n[106.64s] more subtly, we can think of our pains,\n[110.399s] our sufferings, our traumas as being\n[113.68s] ours, as things that we cling to and\n[115.759s] hold on to, as making up who we really\n[118.479s] are. My reputation, my political\n[121.2s] opinion, all of these kinds of things\n[123.68s] that we feel we have ownership over.\n[126.24s] This is the language of ownership, as I\n[128.479s] say. That is we either try to possess\n[131.36s] and control what we want or we believe\n[133.84s] we already possess and control these\n[136.44s] things. The problem here is when we lose\n[140.4s] control over them when we lose\n[143.44s] possession of them. When things don''t go\n[145.92s] the way we want with respect to these\n[147.76s] things that we believe we own then we\n[150.879s] suffer. The second one of these clings\n[153.599s] is related to the notion this I am. And\n[157.44s] this is related to the defilement of\n[160.48s] conceit that is this comparing mind. Now\n[163.599s] we can understand this in many ways but\n[166.08s] one way to understand it is it relates\n[168.959s] this eye to a kind of a performance or\n[171.68s] image that we have of ourselves of our\n[174.72s] role in a social context of being\n[177.44s] someone as compared to those around us.\n[181.68s] I''m better than I''m worse than. I''m the\n[184.879s] same as these kinds of thoughts, these\n[188.319s] kinds of clings help to keep this sense\n[190.879s] of self intact. For example, we may\n[194.159s] think I''m a success or I''m a failure. Or\n[197.92s] we might think I''m a doctor. I''m a\n[200.84s] parent. I''m a successful tennis player.\n[204.879s] I''m the sort of person who xyz. I''m not\n[207.68s] the sort of person who xyz. The problem\n[211.04s] is that all of these performative\n[213.519s] feelings of being someone are unstable.\n[217.599s] They invite constant stress as we\n[220.799s] measure ourselves all the time against\n[223.04s] other people to figure out where we are\n[225.44s] in this social context being above,\n[228.159s] being below, being the same. Things\n[230.48s] change over time. For example, we may\n[233.84s] think of ourselves as as a champion at\n[236.319s] some particular sport, but then we get\n[238.56s] injured and we''re no longer able to\n[240.4s] perform at the same level. Then we\n[242.959s] suffer not simply because of the pain of\n[245.28s] the injury, but because of the pain of\n[247.76s] the loss of this sense of self, this\n[250.72s] eye, this role that we''re undertaking.\n[253.2s] The third of these clings is the\n[254.879s] clinging to this is myself. And the\n[258.56s] commentary says that this form of\n[260.799s] clinging is related to the defilement of\n[264.0s] what are known as views. That is the\n[266.72s] intellectual construction of a sort of\n[269.88s] idea concept of who we really are. So we\n[275.199s] might say I feel that I really am a an\n[278.8s] eternal soul trapped in a body. We might\n[282.56s] say I I have this theory that what I am\n[285.919s] is just my physical body and nothing\n[288.08s] else. We may have a theory of\n[290.479s] psychological identity where we say my\n[293.44s] theory is that myself is my mind or my\n[296.639s] consciousness or my experiences or my\n[299.6s] thought processes. Now the problem with\n[302.4s] clinging to these kinds of views is that\n[305.52s] they condition disagreement and\n[308.12s] argument, dispute and hence suffering.\n[312.32s] Now why is that? It''s because we may\n[315.12s] cling to our own view but whenever we\n[316.96s] get into conversation with somebody\n[319.039s] we''ll find out that they have a\n[320.56s] different view and then we have we feel\n[323.199s] we have to support our view against\n[325.52s] theirs and talk about why their view is\n[327.919s] incorrect and why our view is correct.\n[330.479s] That is we formulate a view of self.\n[333.52s] This is myself and then we hold it as a\n[336.72s] truth for everybody and not everybody\n[339.52s] will agree. Second, why did the Buddha\n[342.08s] teach about these three kinds of\n[344.759s] clinging? Well, he didn''t teach about\n[347.759s] these three kinds of clinging to\n[349.52s] concepts of self in order to get us to\n[352.479s] find a better conception of self to\n[354.479s] cling to. That that would not be his his\n[357.08s] goal. Rather, his goal was for us to see\n[360.8s] through all of these kinds of\n[362.8s] constructions of a self as essentially\n[366.56s] exercises in various kinds of cognitive\n[370.0s] construction in in in creating\n[372.759s] conventions. Each of the three clings is\n[375.28s] is related to a different mental habit\n[377.6s] that we have. The first one is related\n[380.72s] to this habit of clinging that is the\n[383.759s] need to possess things. The second one\n[387.039s] to conceit that is this need to compare\n[390.319s] ourselves to other people other beings\n[392.88s] around us. And the third views is\n[395.6s] related to the mental need to explain\n[398.639s] things. So we have to come up with a\n[401.12s] cognitive explanation. Now by\n[403.44s] understanding how these three kinds of\n[405.44s] clinging to a self operate, we can help\n[409.039s] to loosen their grip upon us and see\n[413.12s] through them. Third, I want to turn to\n[415.12s] some practical approaches of letting go\n[417.919s] of these clings, these three clings. So,\n[421.599s] we''ll take each in turn. The first of\n[423.44s] these clings, this craving of this is\n[427.8s] mine, we can help give that up through a\n[430.96s] practice of renunciation and\n[433.8s] generosity. That is, instead of clinging\n[436.479s] to things around us, we undertake a\n[438.88s] process of being generous, of giving\n[440.8s] these things away. We can be mindful of\n[443.759s] when attachments arise and ask\n[446.639s] ourselves, interrogate ourselves about\n[448.479s] whether this thing that we''re becoming\n[451.039s] attached to, do we really need it or can\n[453.599s] we get along better without it? We can\n[455.919s] also reflect about the interreationship\n[458.56s] of all things, about the fact that we\n[461.199s] and all things around us are all\n[463.919s] conditioned by causes and effects, and\n[466.56s] that therefore nothing is really\n[468.72s] entirely ever under our control. What I\n[471.52s] think of as mine is simply another thing\n[475.919s] under its own causal influences and\n[478.639s] under constant change and decay. When it\n[482.0s] comes to conceit or the comparing mind,\n[485.84s] this this I\n[487.639s] am, we should try to cultivate a sense\n[491.039s] of mindfulness of when that comparison\n[493.68s] or comparing mind arises, when we start\n[496.72s] to compare ourselves to others and think\n[498.96s] of ourselves as better or worse or the\n[501.319s] same. We can try to overcome such\n[505.199s] tendencies, such\n[506.759s] roleplaying with a a sense of humor\n[509.52s] about them, with a sense of humility\n[511.84s] about these kinds of roles, not taking\n[514.64s] them too seriously, understanding that\n[517.039s] all of the roles that we play in\n[519.08s] society are in constant change\n[522.12s] themselves, reflecting that this someone\n[524.88s] that that we were always trying to be is\n[527.6s] a different person from day to day, week\n[529.76s] to week, and year to year. And third,\n[532.24s] when it comes to views, the notion that\n[535.12s] this is myself, we can practice trying\n[538.56s] to hold our beliefs more lightly, even\n[542.24s] Buddhist beliefs, even some of our\n[544.72s] deepest held beliefs. We can practice\n[548.56s] open inquiry with respect to our\n[551.64s] beliefs. That is, is holding to this\n[554.959s] belief really good for me? Is it really\n[558.32s] healthy? Is it really skillful for me to\n[560.24s] cling to this belief or instead is my\n[563.519s] clinging in this situation to this\n[565.44s] belief only causing more suffering to\n[568.08s] myself and\n[570.36s] others? Third, we can strive to\n[573.04s] emphasize experience over\n[575.72s] ideology. Experience is something that\n[578.399s] at least is open to potential change and\n[581.36s] and and variation and learning. whereas\n[584.399s] ideology tends to be fixed, rigid, and\n[588.279s] unchanging. Fourth, releasing these\n[590.8s] three clings. While these three forms of\n[593.76s] clinging to a sense of self in one way\n[596.24s] or another are indeed deeply rooted,\n[599.519s] they''re not completely unshakable. As we\n[602.399s] begin to see them and understand them as\n[605.68s] rooted essentially in our defilements of\n[608.92s] craving of conceit and of views, we can\n[613.12s] begin to see through them and understand\n[615.279s] where they arise from. The goal here is\n[618.16s] not to replace one conception of a self\n[621.68s] with another, but rather to relax around\n[624.72s] the entire con idea of self at all.\n[628.24s] relax around the idea that there is a\n[630.399s] permanent unchanging self that persists\n[634.079s] throughout our entire lives, but instead\n[637.2s] begin to see the way that the self is\n[639.68s] formed all the time. This is the path to\n[643.839s] freedom that the Buddha offered. Now, if\n[646.56s] you want to hear more about the Buddha''s\n[648.88s] ideas of self, I have a whole playlist\n[651.92s] on this notion of the Buddha''s self and\n[654.72s] non-self. And I''ll leave a link to that\n[656.8s] playlist up here on the screen so you\n[658.72s] can see more. If you''re getting\n[660.88s] something out of these videos of mine,\n[662.64s] consider taking a look at my Patreon\n[664.32s] page, which is linked up here on the\n[666.32s] screen and down below in the notes, and\n[668.32s] see if you want to help support the\n[669.68s] channel and the work that I''m doing\n[670.959s] here. Thanks so much, and we''ll catch\n[673.04s] you on the next video. And meanwhile all\n[675.279s] of you be"}'
