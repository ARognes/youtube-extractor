transcript: '{"content":"\n[0.0s] Authentication and authorization often\n[2.48s] get lumped together as just off, but in\n[4.76s] reality they''re two very different\n[6.44s] things. Authentication is step one, and\n[9.2s] that''s all about determining who are\n[11.08s] you. This is something like a login,\n[12.92s] two-factor authentication, even\n[14.6s] something like an API key is part of\n[16.44s] authentication cuz it verifies who you\n[18.68s] are. Even a guest account technically\n[20.76s] counts as authentication cuz you''re\n[22.36s] authenticating that you are a guest. And\n[24.4s] anytime that you''re unable to\n[25.72s] authenticate a user, you should throw a\n[27.72s] 401 HTTP status code that essentially\n[30.68s] says, \"Hey, I am unable to authenticate\n[33.16s] who this is.\" On the other side of the\n[35.12s] coin, we have authorization.\n[37.16s] Authorization essentially figures out\n[38.8s] what can you do. So, once you''ve done\n[40.84s] authentication and you know who you are,\n[42.8s] the next step is figuring out, \"Okay,\n[44.4s] what can I do?\" And this is your\n[46.0s] permission system. Things like\n[47.52s] role-based access control,\n[48.84s] attribute-based access control, or even\n[50.72s] just an admin account are all different\n[52.32s] ways that you can determine what someone\n[53.84s] can do. And if for some reason someone\n[55.6s] tries to do something that they''re\n[56.76s] unable to do, you should always throw a\n[58.6s] 403 status code with HTTP. That is the\n[61.6s] forbidden status code, essentially\n[63.04s] telling someone that they do not have\n[64.32s] permission to do what they''re trying to\n[65.64s] do. And this is always a two-step\n[67.24s] process. First, you authenticate who the\n[69.44s] user is, even if they''re just a guest\n[71.2s] account, you''re authenticating who they\n[72.68s] are. And now that you know who they are,\n[74.56s] you then determine what they can do by\n[76.2s] using authorization. Understanding these\n[78.56s] differences is incredibly important\n[80.12s] because it makes talking about these\n[81.28s] different concepts much easier. Now, if\n[83.4s] you want to dive deeper into\n[84.76s] authorization specifically, I''m going to\n[86.32s] link a video at the bottom of your\n[87.28s] screen that goes into role-based access\n[89.16s] control, attribute access control, and\n[90.84s] all the other things related to\n[92.04s] authorization that you need to handle\n[93.44s] from scratch."}'
