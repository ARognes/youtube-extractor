transcript: I'm kind of curious about the level of energy you're supposed to have in an interview. You know, I guess it just seems kind of fake like when you're doing it. Is it like you're kind of acting like you're super excited? >> The way that I think about it is two things. One, just like YouTube videos or podcasts, if your energy level is on a scale of one to 10, the camera saps three points from it. >> Mm, okay. >> So, if you think that you came in with an energy of seven, they pick up a four. And so, you need to compensate for that. Think about the interview environment. You might have flown out, but you're in person, and then people are asking you a bunch of difficult technical questions, and you need to perform. There's somebody there that's judging you. What you want to do is you want to compensate for your nervousness, you want to compensate for the camera basically sucking away those energy points away from you. And so, you kind of need to overdo it so that you land exactly where you're at. So, it's not you being fake, it's just like how can we within the context of this interview be the most genuine person that we can be?
