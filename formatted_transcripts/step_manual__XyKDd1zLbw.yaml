transcript: '{"content":"\n[0.16s] There''s a famous moment where the\n[2.0s] Buddha''s close attendant Ananda comes to\n[4.72s] him and says, \"It''s incredible, sir.\n[8.24s] It''s amazing in that this dependent\n[10.88s] origination is deep and appears deep.\n[14.08s] Yet to me, it seems as plain as can be.\"\n[17.92s] The Buddha immediately replies, shutting\n[20.56s] him down. \"Don''t say that, Ananda. Don''t\n[24.16s] say that. This dependent origination is\n[26.88s] deep and appears deep.\n[29.76s] It''s because of not understanding and\n[31.76s] not penetrating this teaching that this\n[34.399s] population has become tangled like\n[36.96s] string, knotted like a ball of thread,\n[40.48s] and matted like rushes and reeds.\n[45.44s] If Ananda, perhaps the Buddha''s closest\n[48.32s] disciple,\n[49.84s] thought that this teaching was plain as\n[51.84s] day and got scolded for it, what hope do\n[55.6s] we have at understanding it?\n[58.399s] Usually, we''re presented with a\n[61.12s] complicated chart of 12 links in this\n[64.159s] chain that begins with ignorance that\n[67.439s] involves two rebirths and at least in\n[71.119s] the typical interpretation,\n[73.6s] consciousness descending into the womb.\n[77.2s] Now, this is historically fascinating\n[79.439s] and of course, it''s of deep meaning to\n[81.439s] many traditional practitioners,\n[84.0s] but for many of the rest of us, it can\n[86.0s] seem dense. speculative and indeed\n[89.2s] confusing.\n[91.28s] However, buried inside this complicated\n[94.799s] 12link formula is a shorter\n[98.159s] psychologically based chain that\n[100.159s] explains exactly why we are unhappy\n[103.36s] right here and right now.\n[106.64s] Today, with an eye to the Buddha''s claim\n[109.2s] that the doctrine of dependent\n[110.799s] origination is indeed deep and therefore\n[113.6s] tangles us up, we''re going to try to cut\n[116.72s] through the tangle with a bit of\n[118.56s] creative surgery.\n[120.88s] This snipping is going to help us to\n[122.799s] reveal the practical core of the\n[125.759s] Buddha''s teaching that can help change\n[128.399s] our lives.\n[130.319s] And the best part is that this core is\n[132.879s] going to be there whether or not we\n[135.36s] decide to do the surgery\n[138.56s] so that whenever we feel lost in this\n[141.2s] tangle of dependent origination, we can\n[144.4s] always come back to the core.\n[148.56s] Traditionally, the teaching of dependent\n[150.64s] origination is understood as explaining\n[153.44s] the cycle of rebirth over three\n[156.4s] lifetimes.\n[158.0s] This is the long chain. 12 links.\n[162.879s] Ignorance in a past life leads to\n[166.16s] consciousness that conditions a new life\n[169.36s] in the next body which leads once again\n[172.8s] to clinging to birth again and to death\n[176.959s] again.\n[178.48s] Now, as I say, historically, this is of\n[181.599s] great interest and it grounds much of\n[184.8s] the traditional Buddhist understanding\n[187.44s] of the rebirth causation,\n[190.72s] but it''s a bit confusing and hard to\n[193.12s] make use of in our everyday lives.\n[197.12s] However, scholars like Fravalner\n[200.8s] or Gomer and Bronhorst suggest that the\n[205.04s] earliest versions of the teaching were\n[207.2s] most likely shorter.\n[210.4s] For example, we we see teachings of a\n[214.4s] shorter chain of dependent origination\n[217.92s] in sutas like the Kalahavada\n[220.959s] or the Madu Pinda.\n[224.0s] In these early sutas, the chain does not\n[227.12s] express ideas of cosmic rebirth.\n[230.879s] Instead, it focuses on the psychological\n[233.2s] mechanisms of suffering in the present\n[236.48s] moment.\n[238.159s] Now, we can call this the short chain\n[241.76s] and it reveals the engine of our\n[244.319s] dissatisfaction.\n[246.239s] So, let''s try to trace it.\n[251.2s] Let''s walk through the mechanism with an\n[253.68s] example. Okay, let''s say that it''s not\n[256.56s] Ananda who''s there talking to the\n[258.88s] Buddha, it''s us. We''re sitting there\n[262.4s] thinking, \"Wow, you know, this dharma is\n[264.479s] really really pretty simple to figure\n[265.919s] out. I''ve I''ve I''ve really got it now.\"\n[268.639s] So, we go to the Buddha and we open up\n[271.12s] our big mouth. And the Buddha rebukes us\n[274.8s] for how foolish we are. Now the first\n[278.479s] link in this shorter chain\n[281.44s] is our body mind complex.\n[285.84s] In the kalahavvada suta it''s glossed as\n[288.96s] namarupa or name and form. In the\n[292.96s] maduindica suta it''s glossed as the\n[296.16s] sense organ and sense objects.\n[299.52s] That is to say we we exist in an\n[301.84s] embodied state within this reality of\n[305.04s] samsara. This is the baseline. This is\n[307.44s] where we''re starting from.\n[309.84s] This first link is therefore name and\n[312.0s] form.\n[314.4s] So in this example, we''ve got ears to\n[317.039s] hear. And when the Buddha speaks,\n[320.72s] this interaction of sound, of our ear,\n[324.08s] and of our ear consciousness is known in\n[327.039s] Buddhism as contact.\n[330.479s] Contact, therefore, is the second link\n[333.6s] in the chain.\n[335.36s] It''s unavoidable.\n[337.36s] So long as we''ve got ears, we''re going\n[339.199s] to hear the Buddha''s rebuke of us.\n[342.639s] Now, with with contact, there\n[344.56s] immediately arises feeling.\n[348.0s] This is the pleasant or unpleasant or\n[350.88s] neutral tone that arises from whatever\n[354.16s] contact we''ve just made with the world.\n[358.639s] So, feeling is going to be our third\n[360.639s] link in the chain. Now in our case, this\n[363.919s] feeling is unpleasant.\n[367.199s] This should be understood as a preverbal\n[370.24s] raw feeling, raw data. It''s not really\n[373.759s] suffering yet. It''s it''s simply\n[375.68s] unpleasantness. It''s pain.\n[379.199s] The fourth link in the chain is is the\n[381.52s] pivot point. It''s the it''s the point\n[384.639s] it''s the link of craving.\n[387.6s] That is the mind reacts. it wants this\n[391.28s] unpleasant feeling to go away. That is,\n[394.639s] it''s got a kind of aversion to it. Or on\n[397.759s] the other hand, in different situations,\n[399.52s] it''s going to want a pleasant feeling to\n[401.52s] to stay.\n[403.84s] In our case, of course, we want this\n[405.84s] unpleasant feeling to go away. We don''t\n[407.52s] like being rebuked. And here''s where the\n[410.24s] whole perceptual and interpretive\n[412.96s] mechanism of the mind kicks in. What can\n[416.4s] we do to make this feeling go away?\n[419.919s] or if we''re in a different situation,\n[421.84s] what what can we do to make the pleasant\n[423.36s] feeling stay?\n[425.599s] Now, we''re at the fifth link in the\n[427.68s] chain, which is clinging.\n[429.919s] That is, we we we get sticky. We we grab\n[432.56s] on to our views and opinions, to our\n[434.96s] ideas of who we really are. And and this\n[438.72s] can happen in any number of ways. Of\n[441.039s] course, it depends on the case.\n[444.08s] Uh perhaps we grab on to our view as\n[446.96s] correct.\n[448.479s] We think to ourselves that the Buddha is\n[450.4s] just he''s just complicating things\n[452.16s] unnecessarily.\n[454.0s] We cling to an idea an an idea of\n[456.4s] ourselves as as smart and incisive.\n[460.88s] Or on the other hand, perhaps we grab\n[463.759s] onto our view of the Buddha as the\n[465.919s] ultimate teacher.\n[468.0s] Then we think that the Buddha''s got to\n[470.0s] be right. We cling to an idea of\n[472.72s] ourselves as as being ignorant and being\n[475.039s] foolish.\n[477.039s] Either way, we''re deep into constructing\n[480.56s] a self who is either smart and being\n[484.24s] mistreated or or is as a foolish person\n[487.039s] who''s being chastised correctly.\n[490.56s] From that arises the mass of duka or\n[493.52s] suffering that we undergo.\n[496.72s] Again, there are various ways that this\n[498.96s] suffering might progress or might be\n[501.759s] described.\n[503.599s] In the Kalahavivada Suta is it''s\n[506.08s] expressed as arguments and disputes.\n[510.08s] Well, perhaps we start to argue with the\n[512.479s] Buddha. We say, \"Oh, it''s it''s really\n[514.64s] not so hard. It''s not as hard as you''re\n[516.08s] making out to be.\" Or alternately, we\n[518.959s] may spend time arguing with ourselves\n[521.279s] afterwards. Why did I say such a stupid\n[524.24s] thing?\n[526.56s] In the Madu Pindiga Suta, it''s expressed\n[529.519s] as the arising of mental proliferation,\n[532.56s] a kind of internal argument if you like.\n[535.44s] Perhaps we get lost in a fog of internal\n[538.8s] self-justification\n[540.64s] or on the other hand of internal self\n[543.2s] flagagillation.\n[545.12s] We spend the rest of the day torturing\n[547.44s] ourselves over what we''ve just said to\n[549.76s] the Buddha. Maybe we have trouble\n[552.399s] sleeping that night because of these\n[554.56s] arguments going on in our head.\n[557.68s] This last link in the chain is therefore\n[561.12s] expressed in various ways. But we can\n[564.0s] understand it as rumination and\n[566.48s] suffering or dooka.\n[569.44s] So the result of this chain is the whole\n[572.24s] world of conflict, of argument, of\n[575.279s] stress and of anxiety.\n[578.24s] We trap ourselves in our own dramas, our\n[581.68s] own ideas.\n[585.36s] So the question then is before us. Can\n[588.399s] the chain be cut? And if so, where?\n[592.48s] Well, there are various places where we\n[595.2s] cannot cut the chain.\n[597.76s] We can''t cut the chain at contact unless\n[600.8s] we intend to remain forever in some coma\n[603.68s] or a deep state of meditative\n[605.68s] absorption.\n[607.2s] the world is going to happen whether we\n[609.2s] like it or not.\n[611.76s] We''re not going to be able to cut the\n[613.2s] the chain at feeling because painful\n[616.24s] things are going to be painful again\n[618.56s] whether we like it or not. Even the\n[620.959s] Buddha felt pain. I have a video on that\n[622.959s] that I''ll leave down below in the notes.\n[626.32s] But there is a weak link, a small gap\n[630.079s] between feeling and craving.\n[633.279s] Here is an image of the chain and that\n[635.76s] weak link in the short chain.\n[639.279s] Maybe we can learn to feel pain without\n[642.079s] craving pleasure.\n[644.48s] Or maybe we can learn to feel pleasure\n[647.12s] without craving for it to continue.\n[650.8s] Now what''s the practice behind levering\n[654.0s] this link open?\n[656.24s] This is where mindfulness lives.\n[660.16s] Mindfulness is the lever that allows us\n[662.399s] to expand this small gap over time.\n[668.0s] It allows us to practice feeling the\n[670.8s] pleasant or unpleasant feeling without\n[674.079s] automatically tipping over into craving\n[676.8s] or aversion.\n[679.04s] we can manage to sit with that feeling\n[681.519s] and practice saying to ourselves an\n[684.8s] unpleasant feeling is arising\n[687.92s] without adding on to it the I hate it or\n[692.079s] I need to fix it right now conversation\n[696.72s] in the longer term to the extent that we\n[699.44s] can cut craving we cut clinging and this\n[704.0s] whole mass of suffering will fall way.\n[709.36s] In practice, however, we may find that\n[712.16s] we''re able to just loosen the links up a\n[714.64s] bit and the suffering may feel less\n[717.2s] heavy around our necks, even if it may\n[719.519s] not go away completely.\n[724.079s] The Buddha''s doctrine of dependent\n[725.839s] origination is undoubtedly one of his\n[728.8s] most brilliant and important teachings.\n[732.0s] But it can be helpful to our practice\n[734.8s] not to get too carried away by its many\n[738.399s] complexities.\n[740.16s] By focusing on the core sequence of six\n[743.36s] links, we can shift our focus away from\n[746.48s] the doctrine''s more speculative\n[749.279s] cosmological claims that tie us all up\n[752.48s] in knots to what may have been indeed\n[755.36s] its earliest form. That is a form that\n[759.519s] illustrates the a path to psychological\n[762.079s] liberation right here and now.\n[766.399s] The Buddha famously said, \"One who sees\n[769.519s] dependent origination sees the dharma.\n[772.8s] One who sees the dharma sees dependent\n[775.68s] origination.\"\n[777.76s] By this, he didn''t mean we should\n[780.0s] memorize some chart or other. Instead,\n[783.04s] he meant that we should we should strive\n[785.6s] to see this mechanism at work in our own\n[788.88s] lives before us and within us.\n[793.6s] Now, the key to this whole chain is what\n[797.44s] we''re calling craving or thirst.\n[801.12s] If you want to understand more about why\n[803.519s] we crave and how to manage it, you can\n[806.959s] check out my earlier video on the\n[808.88s] dissatisfaction engine, which is going\n[811.36s] to be up here on the screen in a moment.\n[815.279s] Meanwhile, here''s a recommendation for\n[817.44s] practice this week. Can you catch the\n[820.48s] key link in the chain? Can you try to\n[823.839s] spot that moment when a feeling turns\n[827.2s] into a story? Let us know what you find\n[830.32s] in the comments below.\n[832.639s] Thanks to all of you for your continued\n[834.72s] practice and please all of you be"}'
