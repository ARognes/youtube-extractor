transcript: no it's not time the fourth dimension is another Direction perpendicular to the other three and I know there's like a hundred videos that try to explain four spatial Dimensions the same way where they talk about flat land and then try to build up from there if you don't know what I'm talking about I'll link some videos to watch first because I'm completely skipping over that having spent so much time working on my 4D game I want to share a list of interesting things and misconceptions to help build a sense of what it actually feels like living in four dimensions so now it's time to open your third eye just like how 2D things are flat in 3D it shouldn't come as a surprise that 3D things are flat to a 40 person and this is the most important concept to grasp in my opinion but like what does that really mean well the ground I'm walking on right now looks flat but topologically it's a 3D Volume that I'm sort of walking inside of to make that more obvious we can swap the up Axis with the hidden axis which I call volume mode as long as we add a big asterisk that the scene has no height changes like in this example it looks like we're floating around in space but that's because the direction that had gravity is now the hidden one if I switch the views you can see that every point on the field is equivalent to a point in the volume and things like sliding against walls or hitting balls into them makes a lot more sense you can also see how the hole looks like a sphere in this View okay but then there's not really a difference with a regular 3D game it's just like a different view but remember that big asterisk where assuming no change in height some earlier levels are flat but once you start getting to the slopes and other terrain that model breaks down which is good I want that 4D experience regardless it's still a really useful view of the space especially when designing levels one of my goals for 4D golf is that I don't want the navigation and movement to be the challenge of the game that should be as easy as possible which is the reason I have so many different Visual and control options the 40 stuff is there to give new golfing challenges that are fun to play [Music] foreign [Music] x-ray vision in four dimensions well that's a statement I've seen a lot about 4D that you can see inside of 3D objects like the organs in your body or something but semantically that's really misleading just like how we can't have infinitely thin paper in our universe there is no such thing as a physical 3D object in 4D everything needs some kind of thickness and if you have paper you don't see or draw things inside we draw on top of the paper in that way the word inside means something completely different to a four-dimensional being 3D things are flat so they'd see the top of this flat person that means all 3D things have a 4D top and bottom and that brings me to my next point would you be able to tell your left hand from your right chirality or the ability to tell left from right doesn't exist for 3D objects anymore even if they have a thickness like normally if you have have a paper cut out you can't make a mirror image by just rotating the paper in its plane you'd have to turn it over in the third dimension it's the same for flat objects in 40. here it looks like the hole is on the left but maybe it's actually on the right side unlike the paper you can rotate your view to see a mirror image pretty cool for something to be identified as left or right handed now it needs differences in all four dimensions I can't pass up an opportunity to talk about Klein bottles are you familiar with the Mobius strip you start by cutting out a rectangular piece of paper add a Twist and then tape the ends together the total area of the paper didn't change but it went from having two sides to one side and a boundary of two edges to one Edge if you were to send a right hand down the strip it would come back to the other side as a left hand if you could see through it so how do we bring the Mobius strip a dimension higher it's a Klein bottle right actually no the Klein bottle is just another two-dimensional manifold like any of these other surfaces in fact no matter how complicated they are all 2D surfaces can be embedded in 4D without intersection no what we have is something called a solid Klein bottle this is not an object that exists in 3D but let's try to understand it using everything I've talked about so far first let's Replay that again and I'll describe it in a 4D context this time we start with a flat cylinder remember 3D things are flat and they have a 40 top and bottom then we give it a Twist in the fourth dimension and tape the surfaces together the volume didn't change but now it only has one side in 4D if you send a 3D right hand down the strip it'll come back as a left hand and the boundary of the solidcline bottle is the familiar 2D one now you're thinking in four dimensions with me so far kind of well this is the part where it's going to get a little trickier so far everything I've talked about has had dimensional analogies where you can think about something in two or three dimensions and kind of naturally extend it to 40 but some things are entirely new and double rotations are the best example so in 2D and 3D we usually think of rotations as rotating around an axis by some angle technically it should be rotating in a plane by an angle but it's the same thing however in four dimensions something new happens we can now have two planes that are perpendicular and rotate entirely independently which is called a double rotation in 3D no matter how much or what direction you rotate something you can always get it back to the start with some rotation on a plane but that doesn't extend to 4D and it's easy to prove if we could we'd need to pick a plane which has three degrees of freedom and an angle which has one that's less than the six degrees of freedom we'd need to represent all 40 rotations this actually extends to higher Dimensions too every even Dimension you can add another plane of rotation here's an example of a double rotation in 4D but it's really hard to understand what's going on since there's really nothing like it in 3D [Music] congratulations if you made it this far it's obviously a really difficult topic but I feel like there's barely anything on YouTube beyond the Flatland explanations so I want to try to fill that niche in the next devlog I'll be talking about the more technical aspects of creating and rendering 40 meshes don't forget to wish list 40 golf on Steam and thanks for watching thank you [Music]
