transcript: What are some ways that you've introduced project-oriented teaching into your teaching over the years? >> Um I'm not dynamic enough to I think really get the students to want to learn just from hearing me. So uh I pretty much center all of my courses around a group of projects and of course there is content that that I have to present, but it's I almost always uh let the students know the goal first, right? We're building X, Y, or Z. Okay, so how do we go about doing that? Well, we have to do this and we have to do that. So what what do we have to know in order to do those things? That I think for sure is uh that's definitely my preferred way of teaching.
