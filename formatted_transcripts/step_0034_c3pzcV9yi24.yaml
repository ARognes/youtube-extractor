transcript: do you feel like you don't ever have time to get everything done are you a productivity junkie like me and hop from trend to trends looking for a secret method that will unlock all of your potential i'm an l7 principal engineer at amazon which many people consider to be one of the highest stressed and demanding companies in the world i'm also married i have a toddler two dogs and a youtube channel where i post regularly i also like to play video games spend quality time with my family and do my hobbies in this short video i'll tell you exactly how i manage my time and how you can do the same welcome to a life engineered my name is steve wynn uncle steve s dog meta but for you watching it's mr hwyn please on this channel we take an engineering approach to your software engineering career so here's my mental model if you suddenly got transported back to high school time management would not be an issue why because you know what's important and you know what to do and what not to do if i got demoted to l4 junior software engineer it would be like going on vacation i'm pretty sure i could work like 10 hours a week and get promoted in the next cycle not because i'm a super good coder i am but because i know what's important and what's not important and the things that aren't important i just wouldn't do with that in mind here's my simple three-step approach to managing time like a boss step one focus completely for two to four hours every day on your highest priority thing and you'll always be a high performer the key to head-turning amounts of achievement is by chipping away at big things that take focus over long periods of time you want your work to be a slow burn not a heavy lift a little every day will get you so far if you think about things as a heavy lift then you're going to be staying up all night to pound things out right before deadlines it's not healthy you'll burn yourself out and feel mentally and physically drained the things that make you stand out can't all be done in one go the way i did it was by getting up early which if you're an sde is not early at all if you start the day at 8 00 am you have a guaranteed two hours of free time probably three put your phone in another room install programs to block reddit twitter instagram whatever for this period of time in the morning doesn't have to be the morning but you just need to focus during this time you can take a break go get a snack go get coffee the important part is avoiding a contact switch context switches will kill your focus because you need like 15 to 30 minutes just to get back to where you work i'll define a context switch if it has the potential to affect your emotions email reddit instagram these things might take you out of the zone during your two to four hours of work procrastination is totally a thing you might not want to do the thing that you need to do this is where this method shines though there was an experiment where people were locked in a room with nothing but a buzzer that would shock them a lot of people shocked themselves and most people seriously thought about shocking themselves if they didn't rather than being bored so being bored during these times of deep work is normal you want to be bored but you have to stay in the room because if the only choice is between being bored and doing the thing you don't want to do you'll just do the important thing step two do one thing at a time priorities mean two things can't be equally as important your job is to every day do one thing really well fields medalist jun hu says he can only do one thing a day that may be to invent some new mathematics or it could be scheduling an activity for his children he just does one thing no matter what if you don't know the fields medal is like the nobel prize for mathematics but it's only given out once every four years but steve uh mr quinn that's all well and good for others but i have 10 things i need to do all at once my job is different if the expectation is that you have 10 things you need to do that are strictly required why stop there don't you really have 10 more things to do after you're done with the current stuff you probably have a thousand things to do there's no possible way to do that many things so you need to be okay with the fact that you can't do everything and also and here's the big point if you have 10 things that are your highest priority you're going to do those 10 things really shitty you can juggle one ball really well you might even do two or three balls easily for a sustained amount of time but nobody can juggle 10 balls just do one thing really well and knock it out of the park or for my brothers and sisters that are into cricket focus on this over on this ball and hit a six don't think about what you're gonna have for lunch you're gonna lose a wicket if you have competing priorities and you simply can't focus on one thing you can break it up by day of the week you don't need a fancy scheduling system for this one day i'm finishing off a new api and sending it out for code review tuesday i'm going to incorporate the feedback wednesday i'm going to do some research for an upcoming document but if on monday you send out an incomplete cr to get initial feedback and put off completing implementation and then start some research in between meetings you'll be doing the same thing on friday because you didn't focus on the one thing which leads to number three declutter your schedule and when you free up time don't pack more things in you may have meetings and other obligations that you can't get out of that's fine that stuff doesn't count as your one thing you do every day but what happens is that outlook starts to get cluttered with an accumulation of meetings you might feel like you have to attend everything that you've accepted but here's the thing when you go on vacation the team does fine without you i went on paternity leave last year and it was the first time in my career i've taken six weeks off contiguously the team was fine if your calendar is completely filled with recurring meetings and you have no time to code and you're an ste that's bad so if you're in this situation here's a trick that i learned that changed my life for one week don't go to any meetings i mean you can go to the meeting if you really want to or if it's your meeting but the default for this week is that you don't go now if someone says hey where were you we really needed you then tell them sorry my uncle steve had an emergency i'll be there next time if nobody says anything then next week don't go again this has saved me so much time and also trains people to bring things to you if they really need your attention you're not fishing for important things by going to hours and hours of meetings just because you might be needed for a three-minute conversation when you've cleared up some time for yourself and another new meeting pops up don't think to yourself that since you have more free time you can now take this on that's the same behavior that got you into being oversubscribed in the first place you have to learn how to say no not because you don't want to but because if you say yes you're saying no to the things that are really important suppose you've concluded that you want to get good at designing systems so you're going to take the lead on writing an important system design document and you want some senior engineers and principals to review it if you spend two to four hours a day on it by doing research on related systems and concepts finding examples of well-written documents by others to use as an example get drafts reviewed by people on your team and incorporate their feedback you're gonna have a banger document after about two or three weeks but if you finally cleared your schedule you're never going to get there if you keep saying yes and further cluttering things so a promotion isn't a reward for doing a really good job a promotion is recognition that you can handle more scope if you've been promoted thinking back on a prior roll it probably feels like it would be a vacation if you went back so just pretend like you just got promoted and let the unimportant stuff slide i believe you already know what isn't important today just trust yourself do a really good job on the things that will make an impact and be okay with not doing the other stuff i guarantee if you focus a little every day do one thing at a time and resist the urge to pack more into your schedule you will achieve head-turning amounts of productivity and people will wonder how the heck you do it all if you like this video please do consider subscribing if you'd like to ask a question leave it in the comments below and i'll answer it in my office hours if you like this video you'll love my video on the biggest mistakes i made in my career and how to easily avoid them i hope you're having a wonderful day and we will see you next time
