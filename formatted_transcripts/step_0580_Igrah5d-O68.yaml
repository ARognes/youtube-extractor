transcript: Hey guys, so today you and I are going to talk about Typescript. So let's get into it. So the questioning question was, "Hi Frederick, I remember you said that the TypeScript ecosystem is the best today, but if that is the case, why isn't it more popular in the corporate world?" Well, I would say that whether or not you think that it's more common or not, I that depends a little bit on perspective. I would say because I would argue that at least for front-end development, it is pretty common. I would go as far to say that if companies and in this case corporations are not leveraging Typescript, it has probably more to do with the fact that their developers haven't adopted that specific workflow. Because from a corporation's perspective, TypeScript would probably be a more a better choice than just plain old JavaScript for the same sort of reasons that you can imagine. Most of us like TypeScript. Type systems. Type systems are nice if you well I like TypeScript systems at the very least. Quite a lot of people feel the same way and some feel differently of course but at the very least it's pretty nice I think to be able to have a addition to the JavaScript language that allows us to refactor more freely without a lot of the anxieties has come with it because I know I have still I mean guys I have basic I can't even remember how many times I've been in in a situation back before TypeScript where I needed to refactor some property or something in a full-blown like gigantic JavaScript code base and then it's just you know you you you you pray to whatever is willing to listen and hope that you didn't break anything and that is the thing that Typescript has sort of brought to the table. There's a lot more to Typescript and I absolutely love the language. I would even go as far as to say that these days I think my my primary stack if I do have one is going to be TypeScript and then C for backend development. So I'm all Microsoft at these days at the very least. But the thing that I have said which is a slightly different thing than what you're claiming here is that I think that the TypeScript ecosystem as in terms of doing full stack development is the best. Now the reason why I claim that is because if you want to have asurances that you can hire basically any anyone like you you will have the biggest pool there is of available software developers if you stick to JavaScript and TypeScript and so forth and so forth. You will have one language for back end and one language for front end which means that on top you know you don't have to have this classic problem which backend are you using okay find those people and then you need to find the front end developers or you know other people are going to do the UI work and so forth and so forth and I'm not saying that they are equal because I know a lot of front-end developers who don't really know anything about say node or ban or demo or whatever we're using these days, right? But at the very least, you will have a very high likelihood due to the fact that JavaScript is a pretty common common knowledge for a lot of developers, even backend. I mean, I know back-end developers, guys, who know enough JavaScript and TypeScript to sort of get a you know, to make do so to speak. I'm not saying that is ideal or anything like that, but considering the size of the community, considering the enormous amount of libraries, learning resources, higher ability and so forth and so forth, I do believe that the days of where PHP used to be the best choice quote unquote for doing web development, and I'm not sure anybody's going to agree with that in these days, but we have to admit that there was a time where PHP was more or less the defa default choice for web and for some people that might still be the case. But today I see no reason to not have a NodeJS TypeScript setup and so forth and so forth to be the default choice because it is in my opinion I I can't really think of a reason why you would not have it. Well, I will tell you why and that is the primary reason usually why you wouldn't do it. Because the problem with the TypeScript ecosystem is the same problem we have in front end and the same thing we have with JavaScript and so forth and so forth. The fundamental problem is that the developers who work in NodeJS and TypeScript and so forth and so forth, most of them lack basic object-oriented principles. They don't have any knowledge whatsoever. I'm not saying that you have to do op in order to be a serious software developer. I'm saying that most of the people who are working in Java, C and so forth and so forth. They have a background in computer science at least like knowing data structures and understanding things like polymorphism, inheritance and so forth and so forth. Of course, we have functional people who may say the same thing, but for all for better or for worse, most of the industry is running an object-oriented codebase in some fashion. And most of them that do serious back-end developers have slightly more understanding of how to do data creating data structures and working with you know more logic heavy applications and so forth. Whereas if you go to JavaScript land and TypeScript and front end and these sort of things, there's less of a community around that, it is there. It is there, but I mean a Java developer or a C# developer basically gets that with their mother's milk. like you you immediately get sort of because in the those communities it's a lot lot lot lot bigger to make sure that like it's it's a priority to make sure that everybody who learns the stack knows how to use these sort of principles and understanding the difference of data structure in different data structures and things like that right not so much in Typescript not so much in NodeJS not so much in anything related to front end or so forth and so forth it's more about tooling which stack you're on and so forth and so forth now. You can still learn all of these things of course but that's where we are right and then there is another nuance to it which is that why is it not more popular in the corporate world because you have an army of people who have worked in C and Java and so forth and so forth and if you haven't noticed Typescript hasn't been around as long as some of the major corporations and That brings us back to the real reason most corporations don't usually switch to other things or like get experimental and so forth and so forth. They might have pockets in a company here and there but for the most part they stick with a stack that they settled on quite a long time ago unless you have I mean that is a very broad statement of course because a lot of companies have like a range of different stacks and so forth. But the fundamental thing that you have to remember guys is that programming languages is a means to an end for most corporations. And most corporations will settle on whatever their architects or current most important software developers so forth and so forth are pitching within their organization. And that comes down to personal preferences. And one thing that is really important to remember is that unless there's a really really really strong incentive to switch from one stack to another and you can motivate that in some type of businesses business sense. Most product owners or stakeholders and so forth and so forth will question a software developer who says hey we should just rewrite everything in Rust or rewrite it in Go or whatever so forth and so forth. It's not something that is as clear-cut as say for example we should be using React, we should be using Angular, so forth and so forth if we were on like say jQuery or so forth and so forth because the experience that you can give with those sorts of tools has a very very obvious value to the end customers and it's apprec it's easy for a stakeholder with no tech skills to appreciate the value of doing so. You could argue the same sort of thing. If let's say web assembly or similar experiences on the web became more of a requirement than it is today from the customer's perspective, then you would be able to make that sale. And this is why I tell people that no video is not going to take over and view is not going to take over or like it doesn't matter which tool you're like everybody's always talking about something taking over because fundamentally the thing that has to happen in my opinion at the very least for something to truly take over is that it has to provide something very tangible that makes a really big difference in the end product that you are shipping and your ability to you know monetize whatever you're building. If that's not happening, it's very tricky to make people switch from something that is as established as we have today. So, what I want you to take away from this is that I personally think due to the fact that I've taken the time to learn, I'd like to think at the very least TypeScript and Node.js and so forth and so forth. consider it to be one of my stronger languages to the point where I know that well it's almost a little bit boring I like to say because if I'm doing anything that literally anything that isn't you know very specialized in something where I need a specific language or something like that Typescript will will have my back every single time I can build basically anything with it especially in web and so forth and I have the most amount of libraries the most amount of learning resources I know that I can give it the codebase to basically any developer in the whole world who's like a serious offer to them even if it's not their primary language. it's going to be something digestible to them usually at the very least and that is a pretty pretty good selling point if you ask me but as I said that in of itself is not enough because there's plenty of C java you know whatever like doesn't matter which one you're picking right and most of the bigger companies guys they have systems that have already been ba built in these sort of languages right so they're not going to switch just because you know typescript comes along, they're not going to switch us because goal line comes along because there has to be some very strong business value usually or some type of incentive to make the switch and that switch can't really be motivated by the fact that oh you have all these benefits and so forth and so forth unless they have a very opinionated architect somewhere so forth and so forth which I have seen I've seen companies where they just said we're going to be all about JavaScript and that became their standard more because they have a person who's pushing it in the organization But to do it at like you know global scale it it requires more. It has to be something as disruptive as SBAs became for example or containerization or things like that. It's something that has to be so profoundly it's so profound has such a profound impact on the industry that if you're not using that specific tool or language, you're probably going to have a harder time shipping code or making money or something like that. That's the sort of thing that has to happen in my opinion at the very least for companies to just say actually you know what it's worth paying all these people to migrate us over to this stack so that we can reap these benefits. Have a great day.
