came up with this design, and then I came back down and put it on the table. All I had to do was put the belt in, put the belt in, close the lid, and now the belt feeds perfectly through the system and the top casing is locked in place. Now I just had to build a frame to make everything aligned, and since this thing was about 1.3 yours truly's long, I opted to go with this strong pipe. Actually, that pipe looks better if I could only just grab it. >> Oh, no! >> Exploding soda aside, even though this 3/4 inch steel square tube is pretty mild, it can easily hold my weight without bending and should be more than strong enough to make the cannon frame out of. But steel is kind of hard to cut, so I just bought a pre-cut frame kit off eBay that even came with the free starter spud, and that made it super easy to use this adult hot glue gun to put the frame together. With the frame welded, I put the barrel mounts on and then checked the alignment with the chamber, but it wasn't lining up at all and I couldn't understand why until I looked at the weld of instant despair. >> No, it's cuz I welded that. Oh, I knew I was going to freak. How did I do that? Mother of freaking pearl! >> I welded this long piece on top of the short piece when the model clearly showed that I needed to weld it to the side. So I joyfully ground down the weld, broke the rear end off, and then re-welded it all. I then mounted everything to the frame, and now the belt seemed to line up with the barrel and the chamber and it was starting to look pretty cool. >> [laughter] >> Right now I had to lovingly hand-feed the belt to the cannon. So to make it automatically feed, I bought this stepper motor just to show off how big this one is. And this one loves it when you call it big steppa since it can be used with this closed-loop controller, which utilizes the notorious PID. This motor will drive the indexer, and by counting the steps I can have it line up the belt perfectly on every rotation. But I couldn't just mount it to the indexer since this shaft was in the way. So I just got these flashy gears that hypnotize me. After gravity mounting the motor, I realized that the shaft couldn't drive the indexer since it just spun around it. So to fix that, I very sneakily broke into some random person's backyard that just so happened to have a mill I could use. I used the mill to cut this keyway into the shaft, being careful to break the end mill, and then I needed a key, but this one wasn't the right brand, so I had to make my own out of this aluminum stock. And once that was done, my belt feeder and pulley were now in sync. I then tethered the motor to the indexer, did some of this garbage, and then I tested to see if it would feed the belt. Oh, yeah. >> [snorts] >> Oh, that's nice. Oh, that is lovely. With the belt feed working, the next problem to fix were these gaps that were big enough to get me tipsy. If I tried firing it like this, air would just escape around the gaps instead of pushing on the potato. So, my plan was to have these sliding covers that would keep everything sealed. This meant the belt would move into position, the covers would close, the tater meets its maker at Mach 5, the covers would open, and then repeat. To move these covers, I bought these pistons, and with a little bit of air and a dozen volts, the pistons seemed to have more than enough power to slide the cover. >> [laughter] >> I then had to install all of this nonsense and deal with this. But now everything was mounted, wired, and hosed, which meant it was time to see if this sliding cover thing would even work. >> 3 2 1 >> [laughter] >> Okay. Okay. >> [laughter] >> The sliding action worked perfectly, but the real question was, did it line up with the belt? >> Okay. Let's see if we can get >> The first couple didn't quite line up on the barrel side, but after that, everything seemed to be working as intended. So, I did a full-speed system test. >> Full-speed feeding test, 3 2 1. >> That's [snorts] pretty good, I think. >> It seemed to work perfectly, and the last thing I had to do before sending potatoes down range was swivel it at somehow. So, I bought this turntable, which actually does that quite well, and then I attached it to the base of the cannon. Now, I had a wide range application from anti-air to anti-small child. And to finish it off, I made the world's worst tripod, considering it didn't even have the correct number of legs. All right, it was finally time to see what this bad boy can do. And with some taters loaded in the chambers, I slapped in the belt, pressurized my chamber, and immediately had a negligent discharge. >> Firing and >> Now, I guess. Minus the discharge part. I was running my chamber pressure way too low, and consequently encountered my first jam when a potato got stuck in the barrel. After clearing the jam and reloading, I brought the pressure up to 60 psi, and if this didn't fire a potato, this cannon was entirely useless. >> Oh. Oh. >> My belt-fed fully automatic potato cannon worked, kind of. Here we go again. The chamber couldn't pressurize fast enough before the next potato was rotated into position. So, I bought a bigger air supply hose and tried again. And this time it was a faster fire rate at about one potato every 6 seconds. >> Wait. Fire. >> The sliding clamp system did seem to be working pretty well, but was certainly losing pressure because the potatoes weren't going nearly as fast as before. But, I figured I'd still be able to do some damage to these sodas, so I loaded four taters for four targets and went to work. >> [music] >> All right, this thing technically works and is incredibly cool-looking, but it isn't quite what I wanted, so I'll be redesigning everything in the next video. I also have a Patreon if you want to directly fund the channel and see more expensive projects like this one. And while you wait for the next cannon iteration, I think you'll enjoy watching me remote control a nail gun in this video. So, go watch that if you're as cool as they say you are.
