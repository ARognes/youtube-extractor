transcript: The fully automatic potato cannon is the holy grail of potato cannons. And what if I told you I made one? It's belt-fed, and it works. Technically speaking, we'll get to that technically part later. But for now, I'll be strictly following this common four-step plan for creating full auto potato cannons, starting with building the tuber shooter. I already had this old air cannon lying around, which was originally designed for preparing salads and then repurposed to prepare death by way of plastic. And to [snorts] see if it still worked, I gently loaded a small potato in the barrel and ran a few tests. I then accidentally left the ramrod in the chamber when I was loading the potato, which is honestly such a silly mistake. But now I knew not to get hit by a high-speed wooden dowel lest I increase my holes by 50%, and thankfully it just barely missed this beautifully foot-crafted table. As a reward for old reliable working flawlessly, I immediately decommissioned it so that I could add this new chamber, which looked much more cannon-like and that I could [music] mount on my shoulder, so when it explodes, it kills me instantly. And even though it may look like a downgrade in size, the pipe's girth is always more important than length, and some math proves that it actually is smaller. Thankfully, these larger potatoes are not bound by mathematics and were even more destructive. The slow-mo revealed that it made a big hole in my target, which I was able to confirm in normal mode. But that was only 60 psi, so I put up a thicker barrier, pressurized to 80 psi, and was reminded that I forgot to employ Christie's services on my barrel. Even with the barrel stealing some of the pressure, this new cannon was powerful enough to change the weather. And the aroma of freshly atomized potato in the air was making me hungry, and I was just about to gnaw on Ireland's mortal enemy when something scrumptious was delivered to my front door. Factor delivers chef-crafted, ready-