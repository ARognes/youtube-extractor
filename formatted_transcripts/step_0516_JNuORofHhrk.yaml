o nothing at all. >> Woo! >> Woah, woah, woah. Let me stop you there. That''s for sure >> Sure, not any of us. >> Both >> come with a price. [music] If you want the body that will carry you forward over the next several decades, you need the right information. Science-backed, data-driven, and simple enough to actually follow. Friends, these are the five >> to? >> God damn it. >> Shh. >> Friends, these are the five pillars of exercise for longevity. Now, roll the tape. Pillar one, strength training. Here are some of the [music] false narratives. Lifting weights is only for bodybuilders. It will kill my endurance. It''s dangerous and causes injury. [music] I''m too old or weak to start. It makes you less flexible. [music] Lift heavy only, no pain, no gain. Truth is, muscle health is one of the strongest predictors of longevity. >> Once you''re stronger, everything becomes easy. >> A massive Swedish study of more than 1 million young men found that those in the weakest third had a 20 to 35% higher risk of premature death compared to the strongest. Muscle isn''t just cosmetic. It''s metabolic armor. It stabilizes joints, improves insulin sensitivity, supports bone density, and protects your body as you age. >> Muscle isn''t just about looking fit or being strong. It literally determines whether you can live independently in old age. >> You want to be the oldest person in the gym, not the youngest person in the nursing home. >> A simple guide. Aim for at least three strength-building sessions per week. Focus on compound movements that train the entire body. Push. Pull. Squat. Progressively overload the weight you use and/or the reps you do week over week. >> Progressive overload. >> Progressive overload. >> Progressive overload. >> Progressively overload. >> Progressive [music] overload. >> You know you need progressive overload to keep driving progress. >> Adding just a little bit of weight to the bar every single week or adding a repetition, maybe two. >> There are apps available that will help you track [music] progressive overload. Find one that works for you. There are many ways to structure a routine, but the most important thing is build and maintain functional strength. Because strength today is independence tomorrow. [music] >> I suggest 1 hour a day of strenuous exercise. >> Guard your health. It [music] is a precious gift. >> Lot of stretching, lot of kicking. >> To walk, [music] walk, walk. >> Exercise for life. >> Pillar two, low intensity cardio. >> Zone two cardio is absolutely critical to our health. >> Zone two is valuable. >> Zone two training has become incredibly popular. [music] >> It is phenomenal for your heart health. >> Here are some of the false narratives. Cardio kills your muscle gains. It''s the only way to burn fat. The more you do, the better. It needs to [music] be exhausting. Walking doesn''t count. You know, truth is, low intensity cardio, and specifically zone two, is one of the best ways to extend lifespan. This is exercise at a pace where you can still hold a conversation. >> to start using the talk test while you''re doing your zone two runs, because if you can''t hold a conversation while you''re running, you''re not in zone two. >> Zone two improves mitochondrial function, the tiny power plants inside your cells. It trains your body to produce energy efficiently, burn fat effectively, and maintain metabolic health. A simple guide. Start today, then build tomorrow, and the next day, and so on. >> Cardiovascular activity done appropriately is good for you, good for your health. >> Do it for your overall health and well-being. >> I personally aim for 150 minutes of zone two cardio per week. Walking, jogging, cycling, swimming. And one of the easiest habits you can build, take a 10-minute walk after meals. It will improve blood sugar control, digestion, and keep your body moving throughout the day. >> Use your muscles for 10 minutes. Your muscles are going to be using some of the glucose from the meal you just ate. >> 10-minute walk around the block can drastically reduce your glucose response. >> Pillar three, high intensity cardio, specifically zones four and five, is an extremely important part of [music] your cardiovascular health, a pillar for longevity. If low intensity cardio builds the engine, high intensity expands and tests the limits of that engine. Short bursts of high intensity exercise dramatically improves VO2 max. VO2 max measures how efficiently [music] your body uses oxygen during exercise. >> It turns out VO2 max is one of the strongest predictors of longevity. >> Improve your VO2 max, which is correlated with all sorts of important metrics related to health span, performance, and lifespan. [music] >> For each unit that you improve it, is that is associated with a 45-day extension of life expectancy. >> High VO2 max is consistently associated with lower risk of cardiovascular disease and death. Conversely, lower VO2 max is a powerful mortality predictor. In a large exercise treadmill cohort, adults in the lowest 25th percentile had about a five times higher risk of all-cause mortality compared with those in the top 2%. >> So, if your VO2 max is 60, walking 3 mph is no problem for you. If your VO2 max is 20, that''s going to be feel pretty difficult. >> your VO2 max goes, the [music] more it seems to preserve all-cause mortality. >> I aim for 75 minutes of high intensity cardio each week. Yes, that''s a lot, but remember, start where you can and build over time. When training in zone four and zone five, your heart rate should reach about 80 to 90% of its maximum. The exact number will vary from person to person, but simple online calculators can help you find your personal training [music] zones. Exercises might include sprinting, cycling, battle ropes, one of my personal favorites, the Norwegian 4x4. >> 4x4 interval training protocol. >> Norwegian 4x4 is gold standard at the moment for improving VO2. >> Region 4x4 interval training is one of the most effective ways to boost endurance, [music] heart health, and VO2 max. >> This is 4 minutes of high-intensity zone five exercise. Followed by 3 minutes of zone two. Do four sets of these. The key indicator, you shouldn''t be able to speak comfortably. Your heart and lungs should be working hard. As with all things blueprint, measurement and data is everything. So, for optimal results, >> [music] >> wear a good heart rate monitoring device to ensure you''re working within the correct zones. Pillar four, mobility and flexibility. >> What is mobility? It''s the most important aspect of a functional human being. >> Mobility is one of the keys to longevity in training. >> Most people are lacking sufficient mobility in key areas. >> Here''s the false narrative. Stretching is optional. >> Stretching [music] is a waste of time. >> But stretching''s popularity is mostly undeserved. >> stretching''s a big waste of time. >> The truth is, mobility determines how long your body stays functional. As we age, joints stiffen, connective tissue tightens, posture deteriorates, and simple movements become more difficult. Falls are one of the leading causes of injury and death in older adults. Mobility training protects your ability to move freely. >> Being able to move freely will allow you to maximize your progress [music] in anything you do. >> You need both aspects of mobility and flexibility to create a good, well-rounded, flexible body. >> A simple guide. Incorporate stretching and mobility work daily. Focus on [music] the hips, spine, ankles, hamstrings, shoulders. It doesn''t have to be complicated. 5 to 10 minutes a day can make a profound [music] difference over time. Pillar five, balance. Balance, you say? Balance is for babies, skateboarders, [snorts] gymnasts. Why is this on the list? Well, my friend, because balance is possibly the most overlooked pillar of longevity fitness. >> Metaphorically, >> [music] >> balance is one of the keys to a happy life, yet it gets massively overlooked [music] in most of our training programs. >> Everybody loses their balance from time to time. I mean, how many times have you slipped or tripped, you know, just not paying attention and you >> [music] >> stumbled and tripped over yourself? >> Balance is a powerful indicator of neurological health and aging. Research shows that people who cannot balance on one leg for 10 seconds have a significantly higher risk of mortality. One study showed an 84% higher all-cause mortality risk among middle-aged adults. Balance reflects [music] coordination, neuromuscular control, and brain health. >> If your body doesn''t know how to switch your core on and make your muscles work in the right order, you will fall over a lot. >> A simple guide. Practice balance exercises daily. Stability drills. >> Nice. >> Slow, controlled movements. And my personal favorite, single-leg stands. Try doing them with your eyes closed for as long as possible. >> And remember, small efforts today create stability decades from now. >> Friends, you don''t need the perfect workout routine. You just need to start. Choose [snorts] one pillar and begin integrating it into your daily routine. In my personal protocol, I train for 6 to 8 hours per week. Each day I do 30 minutes of strength training, 30 minutes of cardio with mobility, flexibility, and balance work layered in throughout the day. The most important principle [music] isn''t perfection or intensity, it''s consistency. Exercise should become a habit because movement isn''t just about looking younger, [music] it''s about building a body to carry you forward for decades to come. Peace out, [music] immortals. So, we all matter. Correct. Even that guy? Especially so. We all want to be hot and jacked. That''s a great benefit of exercise, but that''s not the end goal. The goal is to build a body that carries you forward, staying strong, resilient, and injury-free, becoming the best version of yourself now, at 60, 80, and 100. Yeah.