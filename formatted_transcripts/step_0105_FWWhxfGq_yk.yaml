transcript: '(tranquil enchanting music) (keyboard clacking) - Dust2 is more than just a map in a video game. Given the countless collective human hours spent inside of it, it feels closer to something like a real place, a place that I could probably draw a map of with a higher degree of accuracy than my childhood home. But what is it about this map that still resonates with people almost 25 years later? De_dust and Dust2 are not only great maps, they''re relics of a renaissance in community contribution to video games. A time when the original Counter-Strike, Team Fortress, and Dota were all released within a few years of each other. It was a time of unbridled creativity among map makers and modders. When classics like cs_tires stood toe to toe with bizarre maps like de_rats or the Simpsons House. When a teenager could cobble together a map like de_cbble and it would instantly be canonized into Counter_Strike''s map rotation. (gunshots blasting) Among the countless maps that emerged out of this period, the one that looms largest over the history of Counter-Strike is almost certainly Dust2, which is why it''s humble origin story is so fascinating. So to tell that story in his own words, we tracked down the original designer, a man who hasn''t worked in the games industry in over a decade. It''s easy to assume that a map this legendary was designed by a seasoned veteran, but the story of Dust2 begins before there was a de_dust, before there was a Counter-Strike, before there was even a Half-Life. It begins with a kid named Dave Johnston making Wolfenstein 3D maps in his bedroom after school. (tranquil enchanting music) - So I grew up in the 80s. My dad worked at British Telecom, a communications firm in UK, very big, and he was a software engineer. In the 80s and late 90s, he had tendency to bring home computers, all kind of little 8-bit microprocessors, you know, the simplest things, but I got into computers very, very early, and especially the Atari ST, which is where I learned most of my computer skills when I was about seven, eight, nine, 10. Through that, I got into BBSs, and I discovered Wolfenstein amongst other games on BBSs I played. So that was my first-ish 3D game I played and I think I was hooked instantly. And these BBSs, they also included map testing tools. So I started my first map editing journey making Wolfenstein 3D maps, which was basically just playing Minesweeper, I just kind of click squares on screen to create walls, or give it walls or create doors. And it wasn''t until I was about 12 or 13 that I discovered Doom for real. I managed to get a copy, totally legitimately, from a school friend. And again, I was obsessed with all the WADs I could download from BBSs, racking up the most enormous phone bill for my parents, who thankfully were very forgiving. And yeah, before knew it, I was making Doom maps. And I think, yeah, I released my first Doom map on the internet in what month, ''97 or so. And at that time, Quake and Quake 2 had just, you know, just come out, one after the other. And so I was starting to move from Doom, which was 2D, much like making vector graphics, which I''d done on the Atari, to doing the full 3D work. I remember my first attempt to do a a 3D map in Quake was just impossible, I just couldn''t do it. I thought, "Okay, just give up mapping now." Thankfully, I revisited a few weeks or a month later and tried again. I started to get hang of it, started to make a few Quake maps, just myself, never finished a single one. I just make one or two rooms here and there. At the same time, I got hooked onto Team Fortress, the original QuakeWorld Team Fortress, and then Quake 2 CTF. And I was completely into the kind of playing mods and tried to make maps for them. (dramatic string music) (soft tense music) (bottom graphic trills) When Quake and Quake 2 came out, Ben Morris had designed another tool called WorldCraft. That was a paid-for thing. I couldn''t afford it. I was just a 16-year-old. So I had to use other tools. So for Quake, initially I used Qoole, and also the official Quake Ed. Actually, Qoole was great. It worked very well, but it had a limit of 300 brushes. I think Dust ultimately had about 700, 800 brushes. So I couldn''t have created a Dust star map with Qoole. And then when Half-Life came around, it included WorldCraft for free because they''d basically hired the modders to work editing tools for them. And yeah, I mean, at the time, editing was all about creating brushes, which is just these big solid blocks in the world, trying to join them together to make sure players couldn''t escape, texturing them appropriately. It wasn''t a huge deal. Textures were flat, there''s just diffuse textures. There''s no like specular or shininess, or even sound in some cases, there''s just these big sort of things. The sky was just a sky box. It was just a simple six pictures floating in the sky. And compiling on my Exceleron 300 or something at the time, or even before that, a Pentium 233, compiling a map the size of Dust took maybe an hour, two hours. So the iteration process was slow. But yeah, at the end you got this beautifully lit map. I mean, by today''s standards so primitive. But back then, it was the most incredible thing, especially for someone who''s come from Doom, which already seemed amazing at the time, and from Wolfenstein. Like, again, each step seems so, such an impressive improvement on the previous one. And then, of course, in 1998, was it, Half-Life came and that kind of just changed everything. It came with a free mapping tool, WorldCraft, which I already knew. There was new textures, there were always new functionality, and before I knew it, I was hooked on making Half-Life maps. And then, what, a year later after that, Counter-Strike came out. (subdued dramatic music) And yeah, that came with textures, and I was hooked on the game and started making my very first CS map, which was the War Torn Retirement Home for Beta 3. And thankfully, it was deemed good enough to be accepted. And that led on to the whole Dust and Dust 2, and that entire journey. (gunshots blasting) At the time I was, I was playing with the Half-Life textures, and I''d see one of the Counter-Strike maps, most of them, were very Half-Lifeish. They''d all these kind of... Half-Life textures, to me, it felt odd to be a terrorist or counter-terrorist in Half-Life, that didn''t fit right. So when I saw that C-Strike.wad in the Beta 2, I was like, ooh, there new stuff I can build. I can build buildings and things that are more familiar to me rather than this science fiction Half-Life universe. I was instantly transfixed with that red brick texture that was all over the Retirement Home map. That texture package was just filled with urban textures that I felt I could use and be a bit more creative with. I wasn''t so constrained by what I''d seen in Half-Life. When I was making Half-Life maps, I was trying to stick to the thing they''d established, but with C-Strike.wad, I had my freedom to do anything I wanted really. There was no prior art, and that was really freeing. (gunshots blasting) I didn''t know where I was going when I started them. I had to make like a wall, then another wall, then a floor, a door maybe, and finally I''d an entire map in front of me. This one just happened to look like a big old, like, kind of say beat up building with a big courtyard, and yeah, just had the kind of oldish look to it that was very different to Half-Life. (footsteps pattering) (automatic gunfire blasting) - [Jeremy] So cs_tire ended up being incorporated into the third beta of Counter-Strike. - [David] Yeah. - Yeah, ''cause you were really young at the time, so I''m very curious what that was like for you. - Yeah, I must have been 15. I must''ve been 16 by then. And so I''d finished all my exams from that summer. I was just, had the summer waiting to start next, to start sixth form in the UK. So I just had time to play and do what I wanted. I didn''t know Jess or Gooseman at the time. I was just a member of the CS mapping forum. I thought, "I don''t know, but I think this map might be good enough. I''m gonna upload it and see what people think. Worst case, you know, I get some, you know, critical comments and I improve it. Best case, maybe they''ll think about including in the game." And I think by the next point I''d had, I''ve had a reply from Jess saying, they wanted to include in Beta 3, and they did some testing. I moved a long route from the CT spawn away to T spawn. And yeah, I think, I don''t feel like at the time I quite appreciated what just happened. There''s this slightly weird map I''ve made, totally different to all other amounts in the game that they somehow deemed acceptable to put in this little mod. I thought, "Okay, I''ll take it." And then, before I knew it, that map was being played. I was playing it online with other people, just amazing feeling. That''s when Jess came back to me and says, "Hey Dave, do you want to maybe make another map? We got a text artist you can work with," which was Chris "MacMan" Ashton. And then that led onto the whole Dust thing, which some people may, may know about. - [CT Voice] Okay, let''s go. (footsteps pattering) (dramatic music) - When we talk about a map as iconic as Dust, it''s easy to imagine that it''s the product of some mythical mapmaker toiling away on their masterpiece. But the truth behind the map is far stranger and more interesting than that, it''s the product of an impatient kid seeing early screenshots of Team Fortress 2. (dramatic music) - I was a massive fan of the original QuakeWorld Team Fortress. And so when I found out the Valve had bought the Team Fortress team, I was, yeah, excited. And so when I got Retirement Home in Into Counter-Strike, that was around the same sort of time that I think Valve released another traunch of screenshots of Team Fortress 2 at the time. And those were the ones that included this golden kind of beautiful lit world, sort of sandy with a tank and some military marching through this environment. I thought, "Wow, that that''s... Okay, now you''ve got my attention." I was so excited to play Team Fortress at that point It suddenly solidified in my mind that was the next game I had to play. But of course, it was being delayed, and the release date was far, far out. So when Jess said, you know, "I''ve got Chris Ashton, got MacMan, he''s gonna make some textures for you for another map." I was like, "Oh, okay. This is a perfect opportunity for at least try to replicate what I''ve seen in these Team Fortress 2 screenshots. And it was super cheeky of me. That was like such a... (laughs) looking back, that''s quite a horrible thing for me to have done. To try to replicate these screenshots and steal what, you know, the masters at Valve had been working on. All these... map makers and texture artists that could''ve been, put so much time into those screenshots, to make them perfect for release onto the web. And there''s me, this, the old teenage guy from UK who''s gonna kind of come in and sweep in on their glory and try to make it myself. I circled in the screenshots the textures I wanted. He came back a few days later and said, "Here you are," And I started recreating those screenshots for myself, which is a useful area that represented the Counter-Strike spawn in de_dust. That was all I had to work from, was that area. But yeah, it was amazing to be able to get that area created and be able to walk around it and experience it and think, "I''m in TF2, I''m actually, you know, playing a game that hasn''t been released yet." And it just felt, you know, so yeah, so fun. (gentle ethereal music) In the past when I was making Doom maps, I''d really making maps of my school or my home and just having that kind of freedom to explore an environment which I normally didn''t have freedom to explore was exhilarating. This was similar. I was able to explore the environment I''d seen in a screenshot that I won''t be able to experience myself for a long time. I could do it today, I could now run around and yeah, see where it went. And then of course that point I ran out screenshots ''cause it, it only had like five screenshots of one area. So I had to work out, "Okay, I''ve now got a start for the map, Jess and MacMan are now expecting me to make a map out of this. Where do I go from here?" (ethereal introspective music) I knew Goose and Jess were trying to make a new game mode for Counter-Strike called diffusion, where we had to plant a bomb in one or two spots and the other team doesn''t have to diffuse it. To me, I played a lot of CTF, so I thought these two were quite similar. So I thought, I know, I can make a CTS-style map with these textures. I can do that I started to extrapolate that initial CT spawn area out. I didn''t know it as CT spawn at that point. I just knew it as an area. I started working "where can this go? and I then developed that area into a underground pit and there''s a little road that came out the front of CT spawn and went left and down where the de_dust underpass is now. That went down further into underground. Yeah, underground pit is a little bit dark. I think I had a tomb or something down there, a few windows. I didn''t know what I was doing, I think at this point I was really exploring the exploring texture set I''d had, trying to look at what would work, what didn''t work, and trying to establish a theme and a style for the map. When I did the underground bit and decided is that this map had to be above ground, had to be bright and colorful. I know I spent a lot of time with the underpass ''cause that was a sort of design that I thought we would be fun. I''d played other CS maps. I played yes, Siege a lot and Assault a lot. And I think I, I was picking up little bits from those and trying to put them in here. I loved being a sniper Counter-Strike. So I thought this underpass would be a fun place to snipe. And then, well, I thought, okay, I''ve got a sniper section and what about people who don''t like to snipe or maybe people who love shotguns, which is me, the other 80% percent of the time And so I created this sort of tight bit in the middle, all these little corridors. And then the other side of the map, the T spawn, again, I just, I thought, okay, I need to tie this together somehow. And I just kind of tried to copy the style I got from the CT spawn, which I still didn''t know as CT swan. It was just the area that became the CT spawn I just copied that style, wrapped it around, and once the entire map was sealed and you couldn''t fall out, couldn''t escape, I then started to think about where these things could go. I think I already knew that the underpass would be a flag or bomb in the CT parlance and the other bit around the other, on the other side with kind of bomb spot. And then with the other team, the other side. That seemed to make sense, and that was the map I presented to Jess who then said, "Great, awesome, thank you." Put it to testing. And then they came back and said, "Actually, could you move that bomb spot from the underpass to where the CT spawn?" I thought, okay, sure, sure. That to me seemed really weird. But again, just judgment, and that was like, that was the version that shipped in at Beta 4. Yeah, and before I knew it, I was waking up, that must have been Saturday, Sunday morning downloading Beta 4 for very first time and finding tons and tons of server playing de_dust, and thinking, "Oh God, it''s like, it''s actually happened. People playing my map for real. Some are still playing Retirement Home, but most were playing Dust. And yeah, that''s when, you know, things took off. (dramatic music) (gunshots blasting) The very first time I thought maybe I''d hit upon something good was when I saw a screenshot. I can''t remember if it was an IRC or ICQ, or even on the Counter-Strike website, there''s a screenshot of them playing all the new maps that released, and there''s at the bottom there''s someone in chat saying, could we pay the dust map again? And people say, yes, please, I love that one. I was like, okay, people actually like this. And yeah, that''s about the first kind of feedback I''ve seen from people playing, playing these maps is yeah, is amazing, and jumping into servers and no one knowing that I was the creator and just playing with ''em, and be able to recreate these scenarios that has played in my head when designing the underpass or designing the CT spawn a little bit or thinking about all the crate placement I''d done to stop lines of sight being too long or interfering with each other and just seeing those working practice I think was, yeah, it was mind blowing is like so satisfying and so unreal and weird that this thing was happening, but at the same time, I remember playing this first, you know, first few hours of Dust and thinking, oh yeah, this timing is not right, or I''m getting to the CT I''m getting to the middle bit too fast as a counter-terrorist or too slow as a terrorist or this thing, I''m getting caught from this and I''m getting caught on that, you know, immediately I was already trying to find the flaws and see how it can be improved. And so that''s why the subsequent Betas 5.6 and 6.5. They''re always little changes to that, like breaking walls, moving crates, making things brighter & darker and moving in sunlight round. Just trying to adjust these little circumstances that I''d either spotted or got caught in myself that are not fun to be in. For the first Dust, the main choke point was in those corridor in the middle. So I would literally spawn from the front most spawn point for each team and run that the shortest path I possibly could. And see I my watch re timing it and just seeing at what points, how how far could get before I could possibly see the emergent point of the other team. And so I think for dust, that was around 11 seconds in most cases. And I did push those spawns back and forth every subsequent releases to get their balance just right. - [Jeremy] Once this map is out there and it''s popular and you''re seeing screenshots of it and people talking about it, you''re the person who made it, but in a sense now it belongs to the Counter-Strike community or something. - [David] Yeah. - It must have felt very different to be working on the maps once they were out there. - Oh yeah, absolutely, I knew, I knew every small change would make would be breaking someone''s strat next game or could be introducing an issue. So now it was, yeah, I do have a sense of, it was ownership also responsibility. It''s like I was like, somehow, I was given these people experience that they were enjoying and that was, yeah, way my small 16-year-old head that was mind blowing. I was like, hedge was slow like this. And it is just incredible responsibility. But at the same time I knew I had to make it better. I had to prove I knew what I was doing. I still felt like a bit of, I don''t even belong. I was just, you know, this boy had made a map and also even not professional at all. I was completely amateur, but I knew that, you know, I had to do things right now. I was do things properly, do things as professionally as I could and try to adhere to the standards I''d seen other mappers at the time exstole. At the same time. I was like so excited and so happy that this map has been received so well, I had no idea what would happen next. I didn''t know if it''s just a flash in the pan. If it''s gonna last more than a few days, weeks, months, years. I think I was just trying to enjoy it the best I could at the time and playing, playing that version of the game and that version of the map as much as possible. It''s just really experience it and, you know, get that, get the enjoyment I was trying to put into it, out again. - [Jeremy] You alluded to this a little bit, but Dust was one of the, like first maybe the first major diffusal map. It''s hard for people I imagine now who got into Counter-Strike later, especially to decouple Counter-Strike from diffusing a bomb. It''s such an iconic part of playing Counter-Strike now. Could you talk about like, I''m not sure what the right question is here. Just like, what, did you imagine that would be a big deal? Did it feel like that was an intriguing game mode to you? Did you feel like it would blow up? No, that''s not a pun. - (laughs) So I mean, the original game type of Counter-Strike was Hostage Rescue and at the time that felt, It felt so revolutionary because all the other mods for Quake and Quake 2 even Half-Life with like science and industry, they''re all kind of CTF or variations of CTF often with extra functionality like grappling hooks or super-weapons and things. So Counter-Strike seemed fresh. I know the other, other models like Action Quake and Action Quake 2, Action Half-Life even. But you also had to be more creativity to them. But I think it''s more interesting, you, you''re having actual scientists at time chasing you, running, coming after you to find freedom. So that was new, that was different, that was very unique to what we had from other games. So when diffusion came along again that''s, that was a bit like CTF, you had two teams with the distinct objectives that felt a little bit, like, a little bit bit of a backward step, but at the same time it played more strongly into the Counter-Strike theme of terrorists, Of course, they''re more likely to blow up things than steal a scientist here and there. So that, that made more sense. (gunshots blasting) (explosion booming) By the time Counter-Strike had reached retail, We all knew it was happening. So it wasn''t such breaking news to me. I can''t even remember if I even went into store and bought it, or if I just bought it online. (laughs) I dunno what I did. I''m pretty sure that Valve sent me at least one copy of it in the post. So I already had a copy. For it to each retail, I had to hand over the rights to the map to Valve, which was unique in itself to be paid money for this thing I''d spend time on that was possibly the more exciting and interesting and most unexpected thing about the whole affair. The thing appearing on shelves that was just logical consequence about being paid and the thing being successful. So I don''t think I really, appreciated at the time quite had monumental that was, I think, I do wish I spent more time at the time not just appreciating this, this game worked on is a cardboard box on a CD, you know, in GAME or whatever. Yeah, the shop was that time. Yeah, I don''t think it really sunk in back then. (dramatic ethereal music) - [Jeremy] If you didn''t know the whole story of David''s mapmaking journey, the unprecedented success of de_dust might seem like the obvious high point, but while he was struggling to come to terms with the fact that lightning never strikes twice, those of us with 25 years of hindsight know that his biggest success was right around the corner. (dramatic ethereal music) - So at this point I''d made Dust and I''d made Cobble, both of which were in Counter-Strike in rotation, so I''ve established myself, I was pretty happy, but I think I was also pretty sure that I''m not gonna get a third map into the game, that''s ludicrous Excluding War Torn Retirement Home - a fourth map into the game. That would be ludicrous. So I started to toy around with making another Dust map, and I''m pretty sure between Dust and Dust2, I had tried making new dust-ish maps and texture-set, they just haven''t gone anywhere. I''d make a few walls make, make a doorway, and you just lose interest, move on to the next thing. For whatever reason, with the next Dust map, I found a scrap of paper, doodled a design, which I never did with any other map. All my previous maps, I just kind of winged it. I just made up as I went along. For Dust2, I just, just started designing from paper. Thankfully that design is one I found the courage maybe is the right word to actually get into the computer and get it from start to finish, and it was a design that more or less roughly reflected what was on paper. There''s some significant changes especially to the CT spawn, I think, but the overall layout was more or less there. So okay, this design is completely different to Dust. It''s completely different to Cobble. This is far too tight, It''s a bit ugly in places. It''s a bit too angular. It''s got like sharp edge and sharp corners. It''s got a spiral, it''s got rocky bits. This is just, this is just silly. This is not a map that everyone''s gonna play who loves Dust or Cobble. And so I thought, okay, well I I''ve made it now and around that sort of time. I had an email from Joe Markert from gamehelper.com and he said he wanted me to make a map for them. I thought, well I''ve got this dust-ish map. Yeah, he said, okay. And I think that was probably music to his ears, possibly the best thing he could have heard from me, "I''ve got this Dust style map" I did sort of tell Jess about it and it again Jess, it says, sent me copy. I sent him de_dust3 Before its release, I called it Dust3. And he said, this is great. And suggested a bunch of changes to the bomb spots again, just like, dust1. - Do you remember where those original bomb spots were before the sites were A and B where they are now? - Yeah, so there''s a tunnel called "suicide", I think now in Dust2, at the end of the tunnel from the terrorist spawn, you jump down, down off the road, go through suicide. On the left there''s a doorway. In that doorway used to be a room, much like - so very dark room. It''s kind of similar to the Underpass in Dust1 and in there was bomb spot, the other bomp spot was possibly on the right in the little dip along "Long A" that weird dip that happens at the end of Long A for no reason I think it may been there, I''m pretty sure I moved it around a few times, trying to find out the right location. (explosions booms) I do remember at the time, yeah, I had learned from Dust. I was trying to incorporate some Dust-ish elements and that B hallway was very similar to the hallway in Dust1. So I was trying to incorporate some of that into Dust2 without it being a direct copy and that that was always the hallway that I was going down with the shotgun or SMG, that was just appealed to me. I think at this point I had had develop a sense that they had different play styles. People like to play with different guns, different weapons. Long A is the part that, that did not match my paper design because by the time I got to adding that bit in WorldCraft, I''d run outta room. I was like no space at all to create what I wanted to create. So I was squashed up against the very edge of the universe in, in Half-Life terms and that area just became long as a result. So I think I was trying to make sure that I''d no ridiculous lines of sight. There''s no positions where a player could get in where they were drawing too much of that because that would slow down their experience that drop their FPS. So I was more concerned about the FPS performance than the actual gameplay. But that''s also why it''s quite tight because I had to go around and dogleg it a little bit. Again, that area was, I would''ve preferred to push out a bit more like the terrorist spawn in Dust1 with those kind of balcony bits and kind of more stairs and things. But yeah, I was just squeezed. But I think this is one of those times where having a restriction actually forced you to be a bit more creative and find ways to work within those restrictions. And again, somehow I squeezed in a little passage around from the what would become the CT spawn through to the T spawn, I did have there, there was a pool... Or like a pond in Dust2 at one point on the, just outside the CT spawn that was creating bad sight lines and things. So I turn into a solid wall instead. Yeah, there''s always, always little things that just, again, just have, have this sense and sort of feel that these aren''t quite right or aren''t necessary to pair them back or get rid of them because dust isn''t a detailed map. That texture-set doesn''t lend itself to high detail. It''s you more, more blocky. And so it''s trying to stick to that. So I always, the most valuable part to me when making that was the first time I get run around it in 3D and jump. Run around, jump around crouch, you know, do all the kind of maneuvers that I expect players to do. And that is the point where I''d always find sight lines that are incorrect or scary or weird or overpowered or opportunities to add different defenses or offensive positions to give opportunities like breaking the wall for the B bomb spot. Those will all me trying to think, okay, I''m in this position, what can I do from here and what do I need to look for? How am I safe? How am I unsafe? And trying to make, make sure that every part of the map had some advantage. We also get some disadvantage, and tried to balance those as best I could. It mostly based on feel, again, as I''d run around and when you have that kind of spider-sense that this feels a bit wrong, okay, why is, why is that, what am I missing here? What needs to be changed, added, or removed to balance that discomfort in my head out. Just like when you''re playing Counter-Strike for real, you''re always kind of aware of you where that enemies could come from and what we can do from your position. Where you can hide, what opportunities you have. Again, that bit I think it was just me wanting, to find a way to hide as a sniper and just duck in and try to, you know, pop out at people planting bombs and things. I think I was basically trying to play the map in my head at the same time as creating it and trying to cover all these bases. Yeah that''s the best way that I can describe it. (gunshots blasting) - [Jeremy] I feel like if you were trying to design the most optimized, competitive play esports map, "Mid doors" would be the first cut ''cause it''s like, you can get your head blown off just like setting up at the beginning of the match. Did you have a sense that mid doors was gonna be like this lightning rod of controversy or like- - Oh, absolutely not. I had no idea whatsoever. I didn''t even even consider the fact that from the terrorist spawn, you could see right down there that. That''s the sort thing that normally I think I''d like to think I''d have spotted in my finished map. In that case, that one I did not spot. And so - had I spotted it that maybe those mid doors would''ve been different. Maybe I''d have shifted them across or lowered them or done something more creative there. But I knew that Dust map, it needed some double doors somewhere, so it had some there and some for the bomb spots. I did not ever anticipate that the ones, in the very center of the map where everyone''s gonna go to all time would cause such controversy and pain and suffering and delight in some cases, but mostly pain and suffering. And those doors were, yeah, principally they''re just to stop people seeing too much. Yeah, I''m kinda glad they caused such controversy and fun and interesting skirmishes over the years. Again, I was never good enough at Counter-Strike to really appreciate all strats and things that arise outta just small things in the map like that or where the doors are this way, that way, or where a single crate can be. I was never that good or that aware. Comparing the Counter-Strike I started designing for in the late nineties to the Counter-Strike of today in 2024, I think 25 years between those and the strategies and approaches and the level that that professional players, have to think of now is like so many layers above what I was familiar with at the time. I was just thinking, can I make a shot? Can I jump from here to there without killing myself? Can I throw a grenade? Yeah, okay, that''s fine. I was never, you know, I never thought all, all the other things that could emerge out of these simple maps I was making, (dramatic ethereal music) - Despite his initial concerns, Dave''s follow up to Dust went on to become the iconic Counter-Strike map, and by all accounts, one of the most famous video game maps in history. And nobody was more surprised by this fact than David Johnston himself. It''s hard to overstate the reach of Dust. I mean like Dust2 has been recreated in every FPS imaginable that has map tools. It''s been, there''s like Minecraft mods that are Dust2, it must be surreal for you. Like, what does that feel like? Do you feel, I feel like it would make me like dissociate. What does it feel like to watch this thing that you, it must be like having a child go off on its own, like what is that like? - Yep. Absolutely. I mean, I mean I, I see dust in CS:GO, CS2 these days actually. I think, oh, that''s actually a cool map that''s good. I glad that''s so successful. But I remind myself, oh that''s my fault. I did that. I created that. I planted that seed that''s become this enormous thing that now hundreds of other professionals have poured thousands of hours and possibly millions of dollars into renovating over the years for different versions of the engine and versions of the game. To think that that was all because of me sat in my parents'' house on a crappy old Pentium 233 trying to, you know, do something in my spare time. And yeah, Dust, Dust2 and Cobble aren''t way maps anymore. They''re owned by the community and people who keep playing and keep them alive and yeah, enjoy them and play them professionally. Yeah, I''m not responsible for them anymore. That''s also quite a relief I don''t need to worry about them. They''re just taking care of themselves. It''s nice. And I do wonder, you know, how long they''ll keep on going for, would they still be played in like 10 years time, 50 years time? - Will they be on like a golden record shot into space someday? You know? Like Elvis Presley songs, Dust2, you know, all the high points of human culture. - Yeah, possibly. Or maybe we would be like, oh we''re fed-up of these things just banish them, banned, nobody likes Dust2 anymore. Everyone''s stuck with Mansion. That''s the map we''re gonna focus on. (dramatic music) - But the story of Dust2 begins before there was a de_dust before there was a counter... fuck, hold on Danny: Counter Fuck? Before there was a counter-fuck, my favorite mod. It''s a not-safe-for-work mod. But the story of dust tube. Okay, I got this. But the story of Dust2 begins before there was a de_dust, before there was a Counter-Strike, before there was even a Half-Life. It begins with a kid named Jave Donston. (group laughing) God fucking dammit. Danny: Jave Donston purveyor of Counter-Fuck. - He''s the mod of Counter-Fuck, Jesus Christ. All right, hold on... God dammit.'
