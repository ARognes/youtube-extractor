transcript: Handling global event listeners in React is a little bit of a pain because you first of all need to extract out your event listeners so that way you can remove them down here and you need to make sure you remove them every time your function cleans up. So, the more event listeners you have, the more complicated your return statement down here comes. This can be drastically cleaned up though by using the abort controller. In this new set of code, you can see that our return statement all it's doing is aborting our abort controller and what we're doing is we're passing along the signal portion of our abort controller as an option to our add event listener. This allows us to pass other things on along here such as capture once and so on. But, if all we care about is the signal, we can just pass the controller along directly. What this does is every time we call controller abort, it will remove these event listeners for us automatically, which means no matter how many event listeners we add, all we have to do is call controller abort once. We could even add these particular functions in line if we wanted and it's going to work perfectly fine and removes all the code up here. Now, if you want to learn more about this abort controller, I have a full video covering how you can use it with event listeners as well as all the other amazing features of it. It'll be linked at the bottom of the screen.
