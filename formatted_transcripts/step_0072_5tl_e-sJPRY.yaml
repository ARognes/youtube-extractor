transcript: You know, when you talk about layoffs, like those are actual people, 30,000 or or whatever that number is, it's like that's how many people are affected. That's how many families are affected. And so, super terrible situation. >> Today, we have the absolute pleasure of chatting with Steve Quinn, who is an ex Amazon [music] principal software engineer. This is a level that only 1.5% of engineers ever get to. Steve spent 18 years at Amazon, led some of their major engineering initiatives, and gave over 850 interviews. Why did you decide to stay at specifically Amazon for 18 [music] years? >> Uh, I just really like paid. >> Hi friends. Today we have the absolute pleasure of chatting with Steve Huin who is an ex Amazon principal software engineer. This is a level that only 1.5% of engineers ever get to. Steve spent 18 years at Amazon, led some of their major engineering initiatives, and gave over 850 interviews. Today we're going to be talking about how to get to Steve's level as a principal software engineer and how to perform well and exceeds expectations as a software engineer. So, let's get into it. Thank you so much for being on my channel, Steve. It's a pleasure to talk to you. Can you tell me a bit about how you ended up at Amazon and what your career progression has been at at Amazon? >> Sure. Yeah. I really wanted to be a writer and that didn't work out because I wanted to make money and so you know I had done some computer science I did the computer science AP tests back when it was in Pascal and and C++ and so I knew a little bit about data structures and algorithms. I took a couple courses when I was in college, but you know, when I got out of school, I realized I didn't there wasn't that big of a delta between like me getting a job in big tech, you know, on my engineering merits, then I think just a random person. And so I was able to use some of my connections to get a job as a support engineer. And then from there, I was able to get into software development. >> Oh, very cool. How did you transition from being a support engineer to becoming a software engineer? Yeah. So, it turns out when you get your foot into a in the door at a company, you get access to all of this information. So, most companies you can check you can check code out, you know, you can there's a big internal wiki system and you can just talk to a bunch of co-workers. So, if you just like make friends with people, you know, they'll tell you what they ask during interviews and they'll give you mock interviews. And so, I was just this really big sponge of information. The way I put it is basically I just let my curiosity lead the way. And so it turns out like if you want to know how recommendation systems work at Amazon or if you want to know how their product search works or or whatever it is, you can just go and look that up and just by default there's a there's an open culture within the company. I don't think that's true of every company, but I I will say that once you get into a particular company, there's quite a bit that you can learn if you just roll your sleeves up. >> That's Yeah. Is there I I'm curious cuz I know for Google where I used to work, similarly, there's like a very open culture and you can look at most code, but there are some place that are siloed. Did you see that at Amazon as well? >> Yeah, there's there's certainly places where there's some secret sauce and they just don't let anybody in, but I think just by default everything's open. >> Cool. And you mentioned that you were at Amazon for 18 years, right? I know that a lot of my my friends and a lot of other people in the industry do jump from company to company. Why did you decide to stay at specifically Amazon for 18 years? And if you had to do all over, would you choose to do so again? >> Yeah. Uh I just really like pain. What's up? >> You know, I think obviously, you know, you get you're not always 100% happy with where you work, but the thing about me is I think I'm pretty happy as long as I'm growing and I'm getting pushed and and I'm learning and I'm working around really awesome people. And so, you know, say what you will about Amazon, but they employ some of the smartest people that I've ever met. And so, whenever there was a a period in time where I didn't like the team, I could just move, right? So, I've I've worked in many many different teams within the company. >> What are some of the products that you've worked on? >> Yeah, I worked on Search Inside the Book. I worked on Kindle. I worked on Prime Video. I worked for Amazon tickets, which was our sort of like ticket master thing. I worked along I worked for a long time in payments. So, I've just been all over the the retail side of the company. I didn't even go to to AWS, but the company is just so large that there's a ton of different places that you can work. >> When did you know that it was time to switch teams when you were switching from like for example when you're going into payments? >> Yeah, I think it depends on the particular circumstance, but you know, when when you feel like you're not learning anything, it's really easy to go. Um I'm just I just had this fear of stagnating. there's the technology just changes so quickly and there's just so many different things that you can learn and so if you're just doing the same thing over and over again you know I was just you know if you're in Java it's just like you're you're transforming one POJO into another POJO and then you're like then you're you know it's from the like the API object to the middle object to the database object and then back and then you're doing that in a couple layers you're just like what am I doing like I was not put on this earth to like transform POJO from one form to another then you're like oh well we can just generalize this but then they're like no don't do real you know don't do introspection to do that just like just do it by hand and so I don't know I just there's there's like you'll just know when you're not growing anymore and so if you can't grow on say like the tech side you should just move to a different team where there's something that's a little nicer there's just so much internally but also you know you can grow in other dimensions as well. So I I like to say that software is a team sport >> and you know you can be the Michael Jordan of software but you can only produce as much code as one person can produce and so that just fundamentally limits what you can do. Now, you can be really really good and produce a lot of code, but I just found it interesting to see like how big and complex and awesome of a thing that you could do with many people if you were able to sort of understand like what other people's motivations were and then cross reference that with the technology stack that you're in. >> You you mentioned producing code. Can you tell me a bit about how leveling at Amazon works? What exactly does it mean to be a principal software engineer at Amazon? Yeah. So, Amazon has the least or most granular depend sorry the least granular system for software developers I think in the industry essentially it's you know junior mid senior and then principal and they essentially skip the staff level and I think the historical reason was that they thought that having having like really high standards was a good thing and so basically the jump from senior to principal is two levels of a jump it's a completely different job than if you were to be a senior engineer. And I think this choice like fundamentally at Amazon, I know a ton of people, they're super good and are now, you know, staff, senior staff, principal, senior principal, distinguished engineers at other companies that just couldn't make that jump from senior engineer to principal at Amazon. Um, and so I think it's it was a terrible decision and it continues to be one where there's a lot of like really really good senior engineers at Amazon that after a couple of years are basically like I'm done. I can just go and get compensated and have the scope that I'd like and and be a staff engineer at pretty much any other company within tech. >> How did you specifically make that big jump between senior and principal? what was the like your pinnacle project or how did your manager sell you as a principal software engineer? >> So, I've talked a lot about this, but essentially it only took me four years to go from support engineer to senior engineer within the company and it took me another eight years to get promoted to principal. And so the way I did it was through a lot of turmoil and and stress and scratching and clawing and they changed the process two or three times while I was doing it. I did not get more technical. I thought that I was actually pretty good circa 2016 when I thought I was ready to go. That was about 4 years into being a senior. I thought I was ready to go to principal. So it took another four years after that. And >> did you get promoted during the pandemic or right before? Oh >> yeah. So Q1 of 2020 was when I got promoted to principal engineer. So that was that was interesting. And then you know you get all the congratulations emails and we're just like sitting at home wondering whether we were going to like live or die. Mhm. >> And you know, I'm still a little bitter about it because they used to do this like principal engineer offsite every year where they would just, you know, they would fly everybody from the world like to Seattle area and then we'd go to Sanadia, which is like, you know, an hour and a half away, go into the middle of the woods and do a bunch of like principal engineer stuff. >> What is principal engineer stuff? I don't know because I never went and so like they tried to do this stupid like RPG thing where it was like everybody's like online if you're close to the other character then you can like talk to them or whatever. It was so lame. >> Oh, >> and then when the pandemic was over and people were back in the office and stuff they were like, "Oh no, the the site's only for senior principal and above." Like this is so this is so ridiculous. Anyways, the the project that got me there was, you know, it was a pretty big catalog migration for Prime Video. So, basically, Prime Video catalog, which describes movies and TV shows, it was sort of like unsuitable for the things that we wanted to do like live sports and, you know, live broadcasts and and all this other stuff. And so, I led an initiative to generalize it so we can do essentially any type of of streaming. Doesn't have to be a TV show or movie. It sounds kind of like a a trivial throwaway project but then you realize like we are launched in 200 countries and there's so much localization that goes on and you know we work in a sort of like microservices architecture. So basically there are thousands or tens of thousands of services within within prime video that have taken a dependency on this old representation of that we're trying to get away from. And so sort of like managing that project while there were there was like a crazy deadline. We were trying to launch like a live sports initiative. That was my that was my sort of senior project. H sorry that was my principal project. >> That's cool. I also want to go back to what you're saying. You got from support engineer to senior engineer in just four years, right? How did you get promoted so quickly and and let transfer and do that within four years? Since I I feel like a lot of people just going from regular software engineer like new grad to senior takes more than four years. >> I think you know what ends up happening is you just go as far as like when you're growing you just grow really really quickly and then and you you just you get to this place where you're stuck and when you're stuck all of the growth stops. So it's basically so you might see like hockey stick growth and then you hit the ceiling and then there's some reason that you're stuck and and it's it's just really really difficult to get unstuck. So I don't think there was a secret for me in terms of my growth. >> I think that was just like my natural growth curve. >> For some people I think it it takes a little bit longer but for me I was just you know I was grinding away. I was I was super curious about everything. I was writing a ton of code, was staying nights and weekends, probably sacrificing, you know, relationships a little more than I should have. But I think right when I turned senior and a little bit after that, I realized I could just let my foot off the accelerator a little bit and still get high performance reviews. I don't think it was the taking my foot off the accelerator. I don't think it was taking the foot off the accelerator that was the approximate reason for the 8 years. I think it was a combination of just like a changing of policy >> and a series of unfortunate events in terms of like my manager and you know all the stuff that was going on all the internal politics. >> Do you have any advice for engineers who want to follow your trajectory and also hopefully eventually get principal or staff? Like what what are some of the tips and tricks you would give? >> Yeah, absolutely. I think what it comes down to is that if you're really introspective about your areas for growth that would unlock that that potential, if you're really interested in in growing yourself, I think it's not a big deal. So, for instance, if you don't learn if you if you think you don't learn as fast as you think you you should be, that that was common for me, like for for some reason, I just felt like I just learned really slow. And so I just decided that I was going to do a bunch of research into metalarning. So like learning how to learn. And so it turns out there's like a there's like a rich like research like body of research around the science of learning. And if you just like go and read up on that literature and you you actually just follow those steps, you just learn amazingly fast. And so I think that's the that's the number one skill. It's like just go and learn how to learn as quickly as possible. You'll learn, you'll run into things like, you know, space repetition, active recall. You'll learn about Ebingous's life forgetting curve. It's actually I think more people should just be talking about this. And so I was just counting the other day. I was like, how many languages and big frameworks have I learned over the course of my career? I think in terms of languages, it's like depending on how you count it, like well over 20. And however many frameworks both internal and external within Amazon. And so you just like I think it's it's actually much more important to like figure out what you target much more than like you know the actual act of learning a thing. And so what I like to say is like you can learn anything in this world. If you wanted to be a a doctor or biologist or you know a lawyer you could have right it's just you decided to to put your your target into computer science. And so I think everything is figure outable. And so once you realize that you and you can trust yourself to learn as long as you've identified the right target, that goes really really far. I think where it runs out is when you because of your blind spots, by definition, you can't see things that are in your blind spot, you're blind to them. And so when the things that are in your blind spots are the bottleneck for your growth, I think that's where it becomes really challenging to grow. Do you think you ever encountered any blind spots when you were, you know, progressing up the corporate ladder? >> Yeah, absolutely. You know, I've I've done a a ton of interviewing. And when you want to become a bar raiser at Amazon, you you know, people are watching you interview. You're walk you're shadowing other people and they're interviewing. So, it's this kind of weird spot where you actually get feedback in a situation where there's nobody to give you feedback. And so I got the feedback when I was becoming a bar razer which was basically like hey you're super clinical dude like why don't you like lighten up I'd be like what's the big O of that algorithm and they'd be like and log N and I'll be like interesting you know it's like putting a white >> have used it in a doctor. Yeah, I I can't handle like blood and stuff, so definitely not a >> I love blood instead of >> Oh, dear. Yeah. No, so I I you know, I got a lot of feedback or just around communication styles. I I learned that, you know, you don't have to be a jerk when you disagree. That took a long time. You can just like disagree with somebody and still like go out and have a beer with them, you right? Like everything for me was just like when you were disagreeing with somebody, it's like I just felt like I was going to like flip a table or something like that. And yeah, so that was, you know, that was one of, you know, a long laundry list of things where I I didn't see it. But I think ultimately, you know, as long as you have people around you that are comfortable enough to give you critical feedback and, you know, you're receptive to that feedback, which is really difficult because people are super defensive, including myself. If you are, if you just sort of use that feedback as a gift rather than as an attack, I think you can get pretty far. But you have to know that that's a thing that's holding you back from the people that you're working with. >> So being like more self-aware that >> Yeah. If you ever get that question like, "Hey, what's your biggest weakness?" Right? Uh during like an interview, stupid question. It's it's it's there to sort of like knock you off your your you know, your game. The the question is really like, "Hey, have you like solicited or received critical feedback about your performance and what are you doing about it?" That's what that question is. And so like if you are if you are not self-aware and know that you're not like a perfect human being like and you know you're trying to get better and like understand your tendencies more that's the whole basis of that >> that question right and so I think you know if you want to get really good you just need to really be honest with yourself about the areas in which you need to grow. >> It's a great point. So you mentioned that you were a bar raiser for Amazon. So, you must have done, you know, more than 850 interviews, right? What are the most common mistakes that people make when trying to get a job at Amazon? And what's something that will make it much more likely for someone to get hired? >> I think what people need to understand is by the time you get to the on-site interview or the the final interview round, you are probably 85 to 95% qualified for the job. And so yes, you need to code and you know they're going to give you some problems that you've prepared for and some that you haven't prepared for whether that's coding or system design. But I think that most people are treating the interview like a test. And I think it's much more like a date because the company is looking for somebody because they have a specific set of problems, right? And you're looking for a company because you want to be gainfully employed for a couple years. And so like like what if dating was like a test be like Maddie how many how much do you make per year you know it's like what are your hobbies? Hm. Okay interesting cool. It's not a test like you to get there you needed to like pass the technical screen. You needed to talk to a recruiter whose job it is to like filter out people and filter in a bunch of people like they saw your resume from a sea of rums or applications or maybe it came in from a referral. And so by the time you've gotten to an on-site interview, like you're pretty much there. It's just like this last little bit. And so, yes, there's the test portion, which is like the coding and stuff like that, but the all the other questions they're really asking themselves like, do I want to work with Maddie? Like, is like is she somebody that I, you know, I could see like sitting next to me? And if you if you come in it with that frame, I think you'll do much better than, you know, just being like, "Man, I I hope I've memorized all of the questions, you know, that they could possibly ask me." >> So, we all know that getting the job is only the first step. You also have to do well at the job like you did and flourish. How did you survive Amazon's pip culture? >> Well, I think, you know, I'll say this just to be brutally honest, like if you're a top performer, you do not have to worry about getting pipped. and so just become a top performer. >> Sometimes people say maybe politics could play some. Did you Did you ever see any really good engineers just get pushed out because of their manager didn't like them or >> Yeah. Yeah. Absolutely. So, you know, I think a couple of things here. Whenever you hear the word politics, just replace it with power, power dynamic. So, politics and power exist in in any company that you work for. Now, I'm not going to speak to every team at Amazon, but the reality is, you know, if you're a top performer, you can just choose which team you want to work at, and you can just go to a team that's not dysfunctional. And so, if you get put on a PIP, you have no freedom of movement. You actually have to stay on that team until you get out of the PIP. >> How do you tell if a team will be dysfunctional from the outside? Like, what are some tips? You can't know for like six months because like the way that it works when you first join a job a team whether that's internal or external hire. You have no idea like how the team is dysfunctional, what's good, what's bad. You don't know if a problem's like really going to annoy you. Like you know none of these things. So it takes about four to six months for you to just be like, "Oh, that's the BS that I need to deal with, right?" And so, you know, you can also move before that 6 months is over, right? if you figure out that there's something that's really bad. >> Are there some any are there any early red flags that you would >> Yeah. So the the biggest thing is your manager. >> Now if your manager is awesome, then it turns into a virtuous cycle where they're supportive of you and that makes you want to do good work and then you do good work and then you're rewarded for that and then your manager pats you on the back and then you're like, "Wow, this manager is really great." So, it's this virtuous cycle. When your manager sucks, it's they're micromanaging you and they're kind of riding your ass and you kind of hate doing the work. So, you put it off until like the very last second and then you do poor work and then now your manager is like definitely going to be like on top of you and it spirals out into this vicious cycle. And so the biggest thing is really like what is is your manager good and do you like vibe with your manager? If you have a really awesome manager that's awesome. You should do that. And so there's not a lot of research literature on the science of like good organizations and good bosses and managers. But there what there what little there is is really clear. So basically people that stay on the same team for many years tend to be better managers and managers that either like move you know within an organization or move like many times externally. So like they only stay at a place like one or two years and there's just like their whole resume is like that. Those tend to be really bad managers. And so if and when you get an offer what you should do is you should ask two things. One, how long have you been on the team? Now if they were reorged in there and it wasn't you know any fault of their own that's totally fine but you want people generally with longer tenures. The second part that the research literature says is basically good managers keep their best people because it also like the best people they have choices and so you know you can basically use higher level engineers as a proxy. So how long do people stay with a particular manager? If that's really long, if the senior engineers tend to stay with these people for long periods of time, that's a really good signal. And so if you're moving teams internally, Amazon has this wonderful tech survey that they run every year. And it's they ask the same set of questions and they've asked those questions for like 15 years. And so you can like chart a manager's performance year-over-year. They can aggre they aggregate up into like senior managers, directors, and VPs. And so you can just take a look at like the general culture, but ultimately, you know, you don't know whether the team is going to be good or bad for about that 6-month period, but at most companies, you can just move teams if that 6-month period is terrible, and they can't put you on a pip like that early. >> So, speaking of long tenure, you were at Amazon for 18 years. What finally prompted you to leave Amazon? Well, I started making YouTube content in 2021 because the part of Amazon that I worked at, which was like live sports, we stopped doing live sports. And so I was like, what do I do with my hands, you know? And so I had all this camera equipment. I like to take pictures. I like to do photography. And so I was like, what? Might as well just try to do this YouTube thing. And so, you know, the the channel did really well in the first two years. And you know that third year I was basically like you know I was making some income and I was like I am going to go to my deathbed and if I stay at Amazon for the rest of my career I'm really going to regret it. And so I was like I'm going to I'm going to particularly regret like not taking a chance on myself and and taking a big swing. And so I just reasoned with myself like I can just go back it to like worst case scenario is I go back to Amazon and a bunch of people talk about me online. The second worst case scenario is like I go get a better job [laughter] than Amazon at that level. And so I'm like I'm okay with those outcomes, but like everything else is like, you know, I I'm just going to it's going to be a really interesting story, right? So I've been out of I've been out of Amazon for like 18 months now, something like that. And it's been great. I haven't replaced my income yet. I'm getting pretty close. But um you know, in terms of quality of life, I just get to do what I want to. So >> that's pretty awesome. >> That's awesome. Is there something that you did not anticipate after leaving that you now deal with? >> Yeah, that's a good question. I um you know, I was out having beers at the neighborhood bar and like a bunch of software developers from Amazon sat behind me and they were just kind of using like Amazon language. So I just >> was kind of like looking over to see if they like recognized me and kind of like leaning backwards to like hear what their conversation was. And I don't know, I just miss like being around software developers and writing code and >> and shipping stuff. >> Do do people recognize you since I like we are in Seattle and there's a lot of Amazon and a lot of big tech engineers and you have a really big channel. >> Yeah, I mean it's not that big, but yeah, I I get recognized every once in a while, you know, and I think about like Mr. Beast. He's like a thousand times bigger than me or 10,000 times bigger than me. So, like, you know, I have a nice amount of of sort of like random conversations with people that recognize me. Like, you know, it's November 2nd today. I took my took my daughter trick-or-treating. There was somebody that recognized me was like walking around. So, but yeah. No, it's Yeah, I'm I'm like a DLE celebrity when it comes to YouTube, so not that much. >> I mean, I I feel like in software engineering I feel like you're like one of the most recognizable people on YouTube, but yeah. Anyway, yeah, you mentioned that you've been out of Amazon for a while, but recently Amazon announced that they're laying off 30,000 employees. Why do you think that was the case? Was it because of AI or overhiring or any other reason? >> I I don't know. But what I would say is probably due to overhiring, you know? You know, when you talk about layoffs, like those are actual people, 30,000 or 16,000 or whatever that number is, it's like that's how many people are affected. That's how many families are affected. And so super terrible situation, but I think ultimately there were like a 100,000 corporate employees at the company when I left. If you really like squinted at it, like were those 100,000 people like strictly necessary? You know, Amazon has a a like a history of taking big bets, right? So the idea, at least in Jeff Bezos's time, was we would take a bunch of big bets. the ones that did really well, we would double down on and then the ones that didn't do well, you know, we we should have the like the courage to cut those and then to move those resources into the bets that are doing well. I think with the with the layoffs, it's basically they didn't want to redistribute those resources into the to the other bets. So, I don't know. I it doesn't seem very Amazonian to me. I think we should have a ton of ideas, especially in this AI age. we should, you know, Amazon should be starting a ton of different businesses. And so, you know, I think I think fine if you want to, if you want to cleaver a bunch of features or a bunch of products that weren't working well, I think that's totally an Amazonian thing to do. The real Amazonian thing to do though would be to take all of those folks and then redistribute them >> and then to just really double down on the stuff that is working because there's a ton of stuff that is working really well at the company. >> Last question I have for you. Do you have any regrets or mistakes in your career? >> Yeah, absolutely. I mean, I've made a ton of mistakes. A couple of the big ones though, one period of time, I I didn't really understand that I had a choice when I had a bad manager, right? So, you know, I think I was really naive when I was coming up and I was like, "Oh, managers, they they're they're like our parents. Like, they must know like right from wrong and they all must be like really good and coordinate with each other and talk." No, dude. when you get promoted to a manager, like they probably don't even like have extra training for you, right? Like they just kind of get thrown into this managerial role. And so, you know, it's sink or swim and everybody's got a different style and it's just not like code. Code you can just like run unit tests. You can compile it. It'll give you errors. Like for a manager, you know, there's no guide book. I mean there are a couple of them but you know you can actually get three books on management and they'd be completely contradictory to each other. And so the other insight is like you know there are high performing managers and there are low performing managers just like there are high performing IC's and low performing IC's. And so if you get stuck with a manager that moves around and they're you know the good people you know end up leaving. I had a bunch of signals that the manager that I was currently with was terrible and I just it didn't occur to me that I could just move. >> You know, I don't know. For some reason, it was just like, oh, like this is what the universe had assigned to me. And so, I felt like I just had to deal with it. And so, I got reorged anyways and and that person left. But I think every highle software engineer has a story about sticking it out on a team longer than they should have. Yeah, I think inertia is really hard to overcome and yeah, I I definitely have stayed at teams longer than I probably should have. Not necessarily because of the manager, but because of the organizational hierarchy. Like I I knew that it was going to implode and it it did just I didn't want to be there. >> A lot of the times on the ground floor like you know that it's going to implode. You should trust your instincts, right? And so if you don't want to like start preparing for interviews, that's fine. But make sure your resume is good. Make sure you have like a six-month like emergency fund. Make sure that you know you know which expenses you will cut like immediately and which ones you would cut after an extended period of time and which ones are not negotiable. I think that people should have a sort of like layoff emergency kit. >> Yeah, so true. Especially in 2025 with the market. Thank you so much for chatting with us. This was such an insightful conversation. I learned so much. Where can people find you online? >> Yeah, let's see. I have my YouTube channel. So at a lifeeng engineered substack by the same name and then I have a a program where I work with people personally to get higher performance reviews and and promotions as quickly as possible. So yeah, I'll I'll give you the link to that if your viewers are interested. Okay, >> cool. Cool. Thank you so much. Shall see you next one.
