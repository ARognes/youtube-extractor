transcript: "\U0001F4D8 My book Technical Behavioral Interview hit #1 on Amazon. If you're interviewing soon, this is the playbook: https://geni.us/BehavioralInterview-yt\n\nWhat separates a high-level CTO from a Senior Engineer? And what is the one mistake that can stall your trajectory for nearly a decade?\n\nCo-founder and CTO of Linear Tuomas Artman has navigated the highest levels of technical leadership and knows exactly what it takes to scale both systems and careers. We discuss the $1.25 billion journey, the hard lessons of leadership, and how to avoid the plateaus that trap most software engineers.\n\nGuest Links:\n  / tuomasartman  \nhttps://linear.app/about\n\n00:00:00 - The $1.25 Billion Career Path \n00:05:10 - The Foundation of a Technical Leader \n00:10:30 - Navigating Hyper-Growth at Uber \n00:15:45 - Identifying the 9 Year Mistake \n00:21:00 - Why Most Engineers Stall at the Senior Level \n00:26:20 - Shifting from Tactical Coding to Strategic Impact\n00:37:00 - Co-founding Linear\n00:42:15 - Scaling Systems vs. Scaling People \n00:47:30 - How to Recover from a Career Plateau \n00:52:45 - The Future of Engineering Leadership \n00:58:00 - Building Longevity in a Big Tech Career \n01:02:00 - Advice for the Next Generation of Leaders"
