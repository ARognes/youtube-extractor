transcript: How many copies of the game do you need to sell to consider it a success? How many do we need to sell? I I don't actually know. I mean, there are many different um conceptions of success, right? Uh I'm not a very business oriented guy. Um but I of course would like to have enough money to continue making games with the small studio that we have. How much is that? I'm not exactly sure, right? Um uh I also, you know, we signed with a publisher for this and so I want them to be happy that they signed us and so I want them to feel good about how well the game does. But what does that mean in terms of concrete numbers? I'm not exactly sure. I will say um things are looking good, right? Like we have a bunch of wish lists. People have played the demo. Uh people enjoy the demo. The ratings are good for the demo. And you know, we've had very few even the people who make grumpy sour puss comments on Twitter about the demo still like the game. It's just they're being grumpy sour puss about specific things in the game. So, those are all good signs, but you never know, you know, and the thing is the game is, you know, we're not going to radically change the game. We're not going to put in like stealing cars into it or something like that. So, um, you know, or we're not going to add stat slop or friend slop into the game. So, it is what it is and we're just doing our best to make it the best version of what it is. And part of that is using our design skill to help show people how cool is this kind of game. Um, which I think is a thing that a lot of puzzle games don't do that good of a job at, right? So, we're doing that and we're just going to hope for the best launch possible. All of you can, of course, help just by telling your friends about the game. Like one of the things about indie games in the world is that almost nobody knows about any particular game, right? There's obviously a couple of uh exceptions, but for the most part, almost nobody knows about any given game. And so a game will just do a lot better if people know about it, right? And so you can just help us by just legitimately if you enjoy the game, let your friends know about it, right? um just go on go on Discord and say, "Hey man, try this game or whatever." And that's the thing that helps us the most really. So, thank you. And uh thanks to everybody for such a positive reception to the game so far. Like, so we've worked on this for 10 years and it's just really nice to have a positive reception after all that as opposed to like, you know, oh, people don't understand that this is a good game, but we're gonna like that would feel there would be more dread there. But because the reception's been so good, it's feels nice. We just we have to get it finished. We have less than two months to finish the game. There's a lot of work to do in less than two months, but we'll get it done. So, yeah, that's where we're at.
