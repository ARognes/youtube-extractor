ork 80 hours a week for some release.\n[225.959s] Maybe they asked you to stay really\n[227.76s] late, you know, when you already had\n[229.64s] plans and and that was unacceptable to\n[232.24s] you. Maybe they asked you to take a\n[234.48s] promotion when you said you didn''t\n[236.56s] actually want the promotion, you wanted\n[238.44s] to continue to be, let''s say, an\n[239.68s] individual contributor. You''re happy\n[241.04s] with where you are. Whatever it is and\n[243.04s] and there''s an endless number of these,\n[244.52s] so I''m not trying to kind of constrain\n[246.12s] your list by what I''m talking about\n[248.32s] here, but\n[249.72s] first of all, you just have to determine\n[251.08s] like what are some boundaries to set?\n[253.28s] What are some things that that they\n[254.72s] could overstep in the first place before\n[257.32s] you can set those with your manager.\n[260.0s] Next, you need to assign consequences.\n[263.44s] What''s going to happen if your\n[265.48s] boundaries are overstepped?\n[267.96s] I think a lot of people who are newer to\n[270.44s] setting boundaries in relationships,\n[272.4s] whether it''s your manager or your spouse\n[274.4s] or your children, whoever,\n[277.12s] they kind of look at boundaries as, \"Oh,\n[279.32s] it''s this rule that I''m setting for\n[280.96s] myself and if I get pissed off enough,\n[283.52s] then I''m going to yell at the other\n[284.76s] person that, ''Hey, you overstepped my\n[287.08s] boundaries.''\" Well, you need to let them\n[290.0s] know what they are and I''m going to talk\n[291.36s] about that in the next point, but the\n[293.48s] bigger thing is you need to actually\n[295.2s] know, \"What am I going to do if my\n[298.4s] boundaries are overstepped?\n[300.84s] If I''m asked to work 80 hours a week and\n[303.84s] I say, ''Hey, we had an agreement before,\n[306.76s] that''s unacceptable to me'' and you''re\n[308.96s] pushed your you''re attempted to be\n[311.48s] pushed into that, you know, you need to\n[313.24s] determine what are the consequences to\n[315.56s] your manager. Does that mean you''re\n[316.919s] going to quit the first time that you\n[319.24s] get your expectations pushed to violate\n[323.04s] a boundary that you''ve set is the time\n[325.8s] to enforce that boundary with the person\n[328.6s] that you''ve set that expectation with.\n[330.68s] And if you don''t do it the first time,\n[332.76s] then they will just look at it like,\n[334.28s] \"Well, hey, last time, you know, you\n[336.24s] said you had this boundary and and I you\n[338.08s] know, you you went over it, so why\n[339.8s] should you this time? It doesn''t seem\n[341.52s] like it''s that important.\" But you''ll\n[343.4s] have to brainstorm a little bit. You can\n[345.48s] get creative about it, but you need to\n[347.08s] think, if I''m asked to take a promotion\n[349.52s] that I don''t want to and I''m pushed into\n[351.48s] it, what is that going to mean? Am I\n[353.32s] going to have a talk with my boss''s\n[354.88s] boss? Am I going to request to get\n[356.68s] transferred to a different department?\n[358.44s] Am I going to take this other job offer\n[360.68s] that I''ve been considering? It could be\n[362.04s] any number of things, but you got to\n[363.52s] figure out not only what are the\n[366.12s] boundaries you''re setting, what''s the\n[367.88s] unacceptable behavior that somebody\n[369.96s] might expect of you or ask you to do,\n[372.32s] what are the consequences? And this is\n[375.16s] often the hardest part of this, but\n[377.72s] the fourth step here is you need to\n[379.52s] actually communicate your boundaries.\n[382.32s] Now, I would say in a professional\n[384.56s] setting, this is just my opinion,\n[386.76s] using the word boundaries is probably\n[389.44s] not smart or just not the best idea.\n[392.04s] When you say boundaries to your manager,\n[394.56s] it''s going to come off a little bit\n[396.36s] confrontational.\n[398.6s] But what you do want to do is you wa