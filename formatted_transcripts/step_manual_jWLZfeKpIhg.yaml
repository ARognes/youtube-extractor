transcript: '{"content":"\n[27.48s] In this two-part series\n[29.16s] I wanted to perform a relationship autopsy\n[31.88s] looking at how I became indifferent \nto an abusive narcissistic parent\n[36.52s] and at some valuable lessons I learned on the way.\n[40.0s] Recounting every gruesome incident\n[41.84s] would make The Lord of the \nRings look like a haiku.\n[45.32s] So I’ve kept to some of the most pivotal moments\n[48.04s] tracing a line from the \nchaos of my early childhood\n[51.0s] to the pushback of my youth\n[52.8s] to the eventual evaporation \nof feeling in my adulthood.\n[57.48s] In part one, I noted how, for \nthose of us who experience\n[61.0s] these kinds of malignant environments\n[63.12s] between the time we enter them\n[64.56s] and the time we leave them behind\n[66.28s] there’s a common sequence of \nprocesses we move through.\n[70.32s] Beginning with the first process of damage\n[72.6s] I laid out some of the symptoms I acquired\n[74.76s] growing up on a minefield of physical \nand psychological bombardment\n[79.92s] from perpetual anxiety to imposter \nsyndrome to questioning my sanity.\n[86.6s] Turning to the second process of discovery\n[89.08s] I outlined my creeping realisation that the person\n[91.84s] I’d taken to be a loving parent was anything but.\n[95.88s] I recalled how I began putting \nthe pieces of the puzzle together\n[99.04s] to build the murky picture \nof a destructive anti-parent\n[102.68s] an imposter, who was working \nto erase her own family.\n[107.48s] I’d continue to discover more facets of her poison\n[110.44s] as I entered the third process: defence.\n[121.16s] In the defence process, we begin \nto take conscious purposeful steps\n[125.2s] to limit the malignant party’s destructive impact.\n[128.8s] My defence process got off to a shaky start.\n[131.96s] My ambition exceeded my grasp.\n[134.72s] I wanted to achieve complete invulnerability —\n[137.64s] the kind you only saw with people who \nwore their underwear on the outside.\n[142.04s] And I was immediately confronted with roadblocks.\n[146.04s] One of them was the imposter’s unpredictability.\n[149.32s] Explosions could come at any time for any reason.\n[154.36s] Like many children of anti-parents\n[156.4s] I’d had to become a seasoned bomb detector\n[158.96s] and often managed to avoid some of the blast.\n[162.36s] But the sheer number of bombs \nguaranteed some full body hits.\n[167.48s] Another obstacle was her inconsistency.\n[170.76s] Her ever-shifting goalposts made \nit impossible to know how to react.\n[175.36s] For example, when she made an accusation\n[177.96s] if I didn’t look her in the \neye, that was proof of my guilt.\n[182.24s] But if I did look her in the \neye, I was being insolent.\n[186.72s] In countless everyday conflicts like these\n[189.24s] I’d always believed there \nmust be a correct response\n[192.0s] and that my failure to see \nit reflected a defect in me.\n[196.28s] Now I knew they were just mind games.\n[199.44s] Unable to see consistent \nsolutions to these problems\n[202.52s] for a time I fell into despair.\n[205.28s] I became over-focused on the things I couldn’t do.\n[209.16s] Sitting with that despair, as bleak as it felt\n[212.24s] was an important experience.\n[214.88s] I realised there were things \nI might just have to endure\n[218.08s] at least for a while.\n[220.44s] When I accepted that fact, my focus moved\n[223.0s] from what I couldn’t do to what I could.\n[225.84s] And there was a surprising amount of that.\n[228.96s] I saw how the imposter exploited \npersonal information about people\n[232.6s] to mock and humiliate; to \nstir up division and conflict.\n[237.36s] So I started actively \nwithholding information from her\n[240.64s] about myself and everyone else.\n[244.16s] The fact she was devoid of personal \nboundaries made this hard at times.\n[248.52s] She’d routinely barge into our rooms \nand rifle through our possessions.\n[253.4s] She said everything we thought \nwas ours was actually hers\n[256.84s] and she could throw it all \naway whenever she liked.\n[260.8s] Occasionally, during private chats with my brother\n[263.48s] we’d become aware that she was \nhiding nearby, listening in.\n[268.049s] Sometimes she’d approach me alone \nto gather intel on other people.\n[272.48s] I learned to give her swathes of \nuseless detail and deflections.\n[276.84s] But no juice.\n[279.0s] And no emotion.\n[281.16s] The classic series of Star \nTrek sometimes featured stories\n[284.2s] about parasitic alien entities \nthat fed off people’s feelings.\n[288.96s] Watching them, I’d sometimes think of her\n[291.72s] the way she seemed to feast \non the reactions she provoked.\n[295.56s] Like the crew of the USS Enterprise\n[297.8s] I started to withhold the \nemotional responses she wanted.\n[301.56s] And just like the alien entities\n[303.4s] she’d often lose energy and interest.\n[307.2s] The most transformative defence \nwas withdrawing contact.\n[311.44s] Over time, this defence would \nrevive significant parts of me\n[315.08s] that had been blocked, twisted \nand hydraulically crushed.\n[320.44s] School kept me out of the house for \nthe best part of almost every day.\n[324.76s] After classes, I’d linger behind with \nclassmates, chatting and playing.\n[329.88s] On school evenings and weekends\n[332.16s] my brother and I spent hours out of the house\n[334.68s] meeting up with friends or hanging \nout with the children next door\n[338.12s] who shared our love of comics.\n[340.84s] At the house, I mostly kept to separate rooms\n[343.88s] drawing, reading, playing with puzzles.\n[347.96s] These social and creative activities \nhelped to instil a realistic self-image\n[352.76s] by providing consistent, reliable feedback.\n[356.28s] I gained a strong sense of \nwho I was and who I wasn’t.\n[360.84s] My imposter syndrome didn’t vanish overnight.\n[364.08s] It was a mental habit deeply \nestablished in my formative years.\n[368.28s] But, like an unexercised muscle\n[370.56s] it wasted away to rare fleeting spasms.\n[374.52s] The persistent anxiety I’d always felt\n[376.84s] in the imposter’s company also began to recede.\n[380.04s] She wasn’t living in my head like before.\n[382.84s] I wasn’t constantly anticipating her next move.\n[385.96s] My mind was on other things.\n[388.8s] I didn’t register the day it happened\n[390.88s] but the nighttime soundtrack of my racing pulse\n[393.68s] drumming in my ears gave way to silence.\n[398.28s] The more time I spent with regular people\n[400.44s] the more absurd the imposter seemed.\n[403.36s] Watching her going purple in the \nface over some imagined insult\n[407.36s] I’d think to myself, ‘You’re barking mad.’\n[411.28s] Her attacks began to lose \nsome of their old menace.\n[415.04s] Instead of always putting me \nin dizzy, dissociative states\n[418.76s] they started to provoke surprising new responses.\n[421.76s] Like irritation.\n[424.08s] Withdrawing contact had allowed some \nstrictly forbidden emotions to emerge.\n[429.44s] Targets of malignant individuals\n[431.0s] — from anti-parents to \nanti-partners to anti-communities —\n[435.92s] often experience a very limited range \nof key emotions around their abusers.\n[441.16s] Like shame, guilt, fear, anxiety, confusion.\n[447.12s] I call them the one-down emotions\n[449.24s] because they keep targets in a \nstate of defensive disorientation.\n[454.04s] In my therapy work, it was \noften a sign of budding recovery\n[457.48s] when clients began to exhibit certain \nother emotions toward their abusers\n[461.64s] like amusement, disgust, anger, even boredom.\n[467.8s] I call them the dethroning emotions\n[470.2s] because they diminish the \nabusers’ inflated status.\n[474.6s] For many targets, these kinds of \nfeelings get deeply suppressed early on\n[478.96s] because expressing them led to punishment\n[481.28s] even though they were \nentirely appropriate responses\n[484.12s] to their abusers’ outlandish behaviour.\n[487.28s] So when these feelings start to resurface\n[489.52s] it can indicate some important internal shifts.\n[493.12s] These dethroning emotions \nbegan to bubble up in me.\n[497.56s] Instinctively, I knew not to express them.\n[500.68s] But sometimes they just leaked out.\n[503.76s] One time the imposter was on the phone\n[505.4s] with my aunt Kath, the wife of her brother Ken.\n[509.04s] As I walked by, I was alarmed to hear \nKath repeatedly screaming in panic\n[513.6s] that she didn’t know what to do.\n[515.8s] The imposter poured out a \nstream of consoling words\n[519.0s] and eventually Kath calmed down.\n[521.92s] When the call ended, I asked \nthe imposter what was wrong.\n[525.48s] She said Ken was abusing her again.\n[527.84s] She made it sound like a regular thing.\n[530.84s] It was an alarming revelation.\n[534.0s] As I started to say, ‘Poor Kath!’\n[536.44s] the imposter exploded, ‘Who does she \nthink she is?? Raising her voice to me!!’\n[542.64s] I was appalled at her self-absorption.\n[544.76s] That’s what she took from that \ncall? That Kath raised her voice?\n[550.88s] The imposter noticed me absently \nshaking my head at her in disgust.\n[556.04s] But she assumed my reaction must be aimed at Kath.\n   ‘I know!!’ she yelled, ‘Unbelievable isn’t she??’\n[564.2s] I could now see the mask she used \nto hide her true nature from people.\n[569.0s] A large part of that mask was \nabout playing a doting mother.\n[573.64s] To the outside world, she’d act like \nwe were the centre of her existence.\n[578.12s] She’d speak about her profound, \nalmost psychic, connection to us.\n[582.72s] How she felt all our highs and lows;\n[585.36s] laid awake worrying about us;\n[587.44s] did all she could to shield us from hardship.\n[591.24s] Sometimes, out of nowhere, she’d blurt \nsome melodramatic conversation stopper\n[595.84s] like ‘I just want them to be safe!!’\n[599.0s] or ‘I’d throw myself into traffic for them!!’\n[602.96s] Holding a trembling hand to her mouth\n[605.16s] she’d wait to be praised for her devotion.\n[608.4s] And it worked.\n[610.08s] People told her she loved us \ntoo much and she spoiled us.\n[614.92s] In reality, aside from the times \nshe was attacking or exploiting us\n[618.72s] she barely registered our existence.\n[621.56s] There was no affection, no \nbonding, no connection of any kind.\n[627.32s] But, in public, I went along with \nthe show and played happy families.\n[632.44s] Like many targets of mask-wearing \nabusers, I had taken on two roles\n[636.72s] acting as the imposter’s private punchbag\n[639.64s] and her public protector, helping to \nmaintain her angelic public facade.\n[645.36s] But as my dethroning emotions continued to build\n[648.52s] I’d begin to step out of both those roles.\n[659.56s] In the fourth and most \nvolatile process — defiance —\n[663.6s] targets begin to display open resistance.\n[666.72s] Acts of defiance destabilise the \npower balance, blurring the lines\n[671.2s] and abusers will often test \ntargets, subtly and/or aggressively\n[675.72s] to gauge how serious they are \nand try and reclaim control.\n[680.76s] With violent abusers, it may be \nwiser to keep any defiant urges\n[684.6s] under tight control and \ninstead plan an effective exit.\n[689.72s] Of course sometimes defiant urges defy control.\n[694.84s] I was around ten when the children next door\n[697.28s] announced their Labrador was having puppies.\n[700.24s] My father, Walter, agreed to take one.\n[703.32s] We called her Rags.\n[705.28s] I’d often take her for lengthy visits to the park.\n[708.32s] She was a bundle of energy and \nconstantly strained at the lead.\n[713.32s] The imposter would complain to \nWalter that Rags never came to her.\n[717.28s] So he suggested she took Rags \nfor walks like the rest of us.\n[721.52s] Watching her being repeatedly dragged \nup the street by Rags was hilarious.\n[726.6s] She took herself extremely seriously \nand hated any humour at her expense.\n[731.96s] Which of course made it even funnier.\n[734.32s] And adding insult to indignity\n[736.24s] she still somehow failed to win Rags’s affection.\n[739.92s] One Friday, while my brother \nand I were playing catch\n[742.92s] with some classmates after school\n[744.88s] the imposter took Rags for a walk.\n[747.64s] Halfway along the street, \nshe let Rags off the lead.\n[750.92s] Rags dashed into the road and was killed by a car.\n[755.52s] A small crowd gathered and everyone was shaken.\n[759.32s] The driver was a wreck.\n[761.72s] The imposter got someone to run to the school\n[764.08s] and call us to the horrific scene.\n[766.84s] When she saw us, she screamed, ‘Where were you??’\n[770.4s] She told us she’d decided to \ncome and meet us at school\n[772.86s] — something she hadn’t done in years —\n[775.28s] and thought she’d bring Rags along.\n[777.64s] She barked that it was all our fault.\n[780.28s] If we’d come straight home after \nschool, this would never have happened.\n[784.24s] In the shock and wild pain of the situation\n[788.0s] my brother and I were unprepared \nfor her blame-shifting ambush.\n[792.08s] We reeled under a crushing weight of guilt.\n[795.6s] The truth emerged later when, having heard\n[798.36s] the imposter’s trembling account \nof the accident we’d caused\n[801.56s] and how traumatised she was by it\n[803.8s] Walter noticed Rags’s lead on the hall table.\n[807.08s] The trembling stopped.\n[808.8s] She said she’d decided to let Rags walk free\n[811.2s] as a reward because she’d \nhadn’t pulled at her lead.\n[814.68s] The story was obviously bogus.\n[817.32s] Even if Rags had somehow magically transformed\n[819.76s] from the impulsive scatterbrained \npuppy she was that morning\n[822.76s] into a model of discipline that afternoon\n[825.44s] the imposter knew full well\n[827.16s] that you never let dogs off leads on busy roads.\n[831.04s] I looked at Walter.\n[832.92s] Were things extreme enough \nfor him to say something?\n[835.96s] But nothing. Just a blank stare.\n[838.88s] And not a word of apology from her\n[841.16s] for getting Rags killed or for trying to blame us.\n[845.8s] On top of the feelings already overloading me\n[848.32s] there was now rage.\n[850.44s] My ten-year-old self’s ability \nto contain all that emotion\n[853.64s] speaks to the upside-down \nnature of malignant households\n[857.44s] where children have to show \nadult-level self-control\n[860.48s] while anti-parents are catered to like babies\n[863.72s] unable to regulate their responses.\n[867.32s] The next morning, the imposter seemed rattled\n[869.84s] by the sombre atmosphere in the house.\n[872.36s] Why did we look so glum?\n[874.56s] Her lack of empathy was striking.\n[877.48s] In his trademark placating tone\n[880.0s] Walter explained, ‘They’re grieving.’\n[884.0s] She scowled.\n[885.68s] She was already impatient to take back \ncontrol over the mood of the house.\n[890.68s] She expected us all to be \nin sync with her feelings\n[893.6s] and resented having to accommodate ours.\n[896.2s] And a few days later, she made \na move to reassert herself.\n[900.36s] Finding me drawing a superhero \nfrom my Marvel comics\n[903.36s] she angrily accused me of \ndeliberately emphasising the genitals.\n[907.88s] Like many zealous prudes, \nshe seemed totally unaware\n[911.0s] that she was the one obsessed with sex.\n[913.92s] I denied the charge and carried on drawing.\n[917.2s] She then told me to swear my innocence to her god.\n[920.72s] As I’ve previously recounted\n[922.48s] this was the set-up for the \n‘You’re going green’ game.\n[925.88s] She’d make some false \nallegation and when I denied it\n[929.32s] she’d tell me to swear my innocence.\n[932.04s] When I swore, she’d tell me \nI was going green with guilt\n[935.44s] and punish me extra hard for not confessing.\n[938.88s] I’d realised some months before \nthat this was just a mind game.\n[943.0s] But I’d been unable to think of a way out of it.\n[946.04s] It seemed like anything I said or \ndid would ultimately go against me.\n[950.44s] So I had just carried on swearing my innocence\n[953.12s] and taking the punishments.\n[955.44s] But after Rags’s death, I couldn’t \nbring myself to care about her games.\n[960.08s] Instead of swearing my innocence, \nI just told her she was wrong.\n[964.36s] Long pause.\n[965.88s] That wasn’t in the script.\n[967.72s] When eventually she told me I was going green\n[970.44s] I heard myself openly scoffing, ‘No I’m not.’\n[974.44s] I’m not sure who was more baffled.\n[976.88s] My words seemed to have come out of nowhere.\n[979.72s] For a while, we stared at each other.\n[982.2s] Then slowly she backed out of the room.\n[985.64s] And that was the end of the \n‘You’re going green’ game.\n[989.56s] For a few weeks she backed off completely.\n[992.44s] In my innocence I thought she \nwouldn’t bother me any more now.\n[996.8s] But then the complaints and \ninsults started up again.\n[1000.6s] Each time, I’d wait for a defiant response\n[1003.08s] to spring from my mouth like before.\n[1005.88s] But nothing came.\n[1007.72s] For weeks, I watched myself silently \ntaking it like I always had.\n[1014.12s] Until....\n[1015.96s] At the end of a school parents’ evening\n[1018.08s] I left the imposter talking with \nsome other children’s parents\n[1021.4s] and went for a chat with my \nfriend David in the cloakroom.\n[1025.48s] When the imposter came to find me\n[1027.24s] David was telling me a joke about \nJesus trying to hold a marble.\n[1032.0s] When I laughed, she delivered a \nbackhander that sent me flying.\n[1036.32s] That was for mocking her lord.\n[1038.96s] The imposter was usually extremely careful\n[1041.52s] to hide her violence from the outside world.\n[1044.12s] And in private I was so used to \nit I mostly took it in my stride.\n[1048.92s] But being abused in front \nof my friend was different.\n[1052.28s] I felt humiliated. Then furious.\n[1056.4s] On the way out, I walked ahead of the imposter\n[1059.16s] who was now boasting to some parents\n[1061.28s] that my brother and I were top of our classes\n[1063.8s] and insinuating it was all down to her.\n[1067.44s] Some heavy double swing doors leading \nto the exit had been fixed open.\n[1071.84s] As she wandered obliviously towards them\n[1074.32s] bathing in her audience’s \nattention, I unfastened them.\n[1079.12s] My plan was just for her to walk into the doors.\n[1081.92s] But they carried on swinging\n[1083.8s] and somehow she ended up \ngetting slammed between them.\n[1088.04s] She staggered backwards with her \nglasses all wonky and everyone watching.\n[1093.64s] She was mortified.\n[1095.44s] Being a public spectacle was her worst nightmare.\n[1099.32s] It was poetic.\n[1101.0s] Chasing attention, she didn’t \npay attention and got attention.\n[1106.96s] Again, she backed off for a time.\n[1109.24s] Then slowly, testingly, returned to her old ways.\n[1114.0s] Again, I saw myself slide \nback from defiance to defence.\n[1119.52s] In the realms of sci-fi and fantasy\n[1121.76s] a common archetype is the \ncharacter who develops superpowers\n[1125.28s] but doesn’t know how to control them.\n[1127.72s] Their powers might arise only in response\n[1129.76s] to some heightened emotion \ngenerated by the situation.\n[1133.64s] Without that emotion, they fall flat.\n[1136.6s] On similar lines, it seemed to me \nthat it took some unusual provocation\n[1141.36s] to bring out a burst of defiance in me\n[1144.64s] which would then fade as the provocation passed.\n[1148.44s] There was some truth to my idea.\n[1150.8s] Tyrannical anti-parents, \nanti-partners, anti-communities\n[1154.52s] impose extreme limits on their targets’ behaviour.\n[1159.16s] Staying within those limits \nbecomes a matter of survival.\n[1163.28s] Like trying to step off a cliff, \ntrying to step outside them\n[1166.68s] can activate powerful self-preservation reflexes\n[1169.68s] that push us back, shut us down\n[1172.8s] preventing us from acting in ways \nthat might endanger our safety.\n[1177.52s] Overcoming those deeply ingrained reflexes\n[1180.24s] takes a very powerful liberating force.\n[1183.72s] In my case, emotions like grief and anger\n[1187.12s] provided that liberating force for a time.\n[1190.44s] But as those emotions slackened\n[1192.32s] my old reflexes would take \nover again and hold me back.\n[1196.96s] These sporadic flashes of defiance \ncontinued for the next three years.\n[1201.88s] Although the imposter always \nregained the upper hand\n[1204.56s] there were shifts in behaviour on both sides.\n[1208.2s] For me, the survival reflexes that \nrestrained me grew weaker over time\n[1213.08s] and it took gradually less \nprovocation to break through them.\n[1217.08s] For her, there were modifications in her tactics.\n[1220.68s] Realising I was wise to her gaslighting games\n[1223.36s] she no longer tried to convince me\n[1225.04s] I was guilty of things I hadn’t done.\n[1227.76s] And, after her clinch with the swing doors\n[1230.32s] while her threats of violence continued\n[1232.52s] she never touched me again.\n[1234.92s] Sometimes I’d spot new tactics \nI hadn’t experienced before\n[1237.8s] like ingratiation.\n[1240.24s] Occasionally she’d cosy up to \nme like we were best buddies\n[1243.48s] and tell me she’d always \nhad a ‘special bond’ with me\n[1246.24s] that she didn’t feel with her other children.\n[1249.16s] The statement made me nauseous.\n[1252.0s] When I told my brother, he gave a dry smile.\n[1255.16s] She’d said the same to him.\n[1257.72s] She spent a lot of time trying to \ndivide and conquer me and my brother.\n[1262.4s] In a conspiratorial whisper, \nshe’d tell me he frightened her\n[1265.92s] and suggest he had mental problems.\n[1268.96s] We continued to distance ourselves from her.\n[1272.0s] The only regular times we \nwere stuck in her company\n[1274.6s] were mealtimes and church.\n[1277.16s] From age 13, we cooked for ourselves.\n[1280.0s] Having always ranted about \nslaving over a hot stove\n[1282.96s] she now ranted about us rejecting her cooking.\n[1286.72s] She resented our dependence and our independence.\n[1290.92s] My involvement in some religious \ncommunities also added some distance.\n[1295.48s] As well as the people at \nchurch who I’d grown up with\n[1297.88s] there was a group I’d joined at my \nnew school called Christian Union\n[1301.52s] made up of students and teachers \nfrom various denominations.\n[1305.52s] Collectively, I saw them as my adopted family\n[1308.56s] and I’d attend special religious \nservices, meetings and film screenings.\n[1313.72s] Even thought of training to become a priest.\n[1316.6s] This delighted the imposter.\n[1318.6s] She was raised Irish Catholic and, \nto her, priests held huge status.\n[1324.2s] But her approval was short-lived.\n[1327.0s] In the process of trying to gather \nsound justifications for my faith\n[1330.64s] I opened the door to a religious crisis.\n[1333.72s] All the justifications my adopted family\n[1336.0s] and I came up with were plainly fallacious.\n[1339.52s] The deeper I dug, the more \nfoundational problems I unearthed.\n[1344.08s] Eventually, unable to find support for my beliefs\n[1347.04s] I tumbled into agnostic atheism.\n[1350.28s] I was consoled to discover my \nbrother had arrived there before me.\n[1354.6s] On sharing my honest thoughts \nwith my adopted family\n[1357.68s] I was accused of arrogance, \ningratitude, corruption;\n[1361.96s] subjected to mockery, guilt \ntrips and fear-mongering.\n[1366.44s] I couldn’t believe the people I’d \nregarded as family were acting this way.\n[1370.88s] As hostile exchanges dried up into silence\n[1374.16s] I found myself universally shunned.\n[1377.88s] At the house, news of my and my brother’s unbelief\n[1381.2s] was met with a nuclear mushroom cloud\n[1383.56s] that just carried on growing.\n[1385.88s] Day in, day out, the imposter \ncommanded us to explain ourselves.\n[1390.52s] Which we were happy to do.\n[1392.76s] But whenever we spoke, she’d \ncut through us with insults.\n[1396.76s] If we didn’t speak, she’d \nthreaten us with punishment.\n[1400.6s] She didn’t want us to explain.\n[1402.299s] She wanted to grind us down into total surrender.\n[1406.576s] Sometimes she’d clutch her chest\n[1408.56s] sway like she was about to faint and \nbreathlessly declare, ‘I can’t take it!’\n[1414.72s] It was an alarming display.\n[1416.92s] And with anyone else, I’d’ve \nbeen deeply concerned.\n[1420.44s] But I noticed she only had these theatrical \ndizzy spells when Walter was around.\n[1425.576s] They were aimed at him —\n[1427.32s] designed to put him in emergency rescue mode.\n[1430.343s] He’d rush to pacify her \nlike she was a heart patient\n[1433.96s] and lay into me and my brother \nlike we’d endangered her life.\n[1438.532s] I felt a degree of compassion for her.\n[1441.52s] Losing my faith had been shattering to me.\n[1443.96s] And, I thought maybe, \nunderneath all her performances\n[1447.0s] she was genuinely struggling to reconcile\n[1449.36s] my disbelief with her own faith.\n[1452.4s] But after weeks of attacks from \nall sides, I reached my limit.\n[1457.32s] One weekend, as she embarked on another rant\n[1460.16s] I cut through her and told her\n[1461.92s] until she was ready for a reasonable conversation\n[1464.52s] I was done talking to her.\n[1466.92s] For a second she seemed thrown.\n[1469.52s] Then she bellowed, ‘We’ll talk whenever I want!’\n[1473.52s] But, true to my word, I refused to speak.\n[1477.24s] I was ready for screams, \nthreats, whatever she had.\n[1480.826s] Didn’t care.\n[1482.506s] But with nothing from me to bounce off\n[1484.84s] she didn’t seem to know how to continue the scene.\n[1488.04s] Suddenly she turned her back and left.\n[1491.64s] After that exchange, something \nclicked about her nature.\n[1495.88s] Some years later, I’d find a word for it.\n[1498.48s] She was uncontained.\n[1500.84s] I thought to myself she was like \nwater without a vessel to hold it\n[1504.72s] gushing into any available space.\n[1507.88s] Like water, she was constantly pushing \nout against the objects around her\n[1511.98s] — which happened to be us —\n[1513.92s] finding cracks in them, testing their resilience.\n[1517.92s] And I thought to myself that \nWalter was like a sponge\n[1521.12s] passively absorbing her, letting her \nwash through him without resistance.\n[1526.52s] If he’d been any kind of a father\n[1528.68s] he would’ve acted as her container\n[1530.92s] shielding his children from \nher destructive torrents.\n[1534.8s] But I was ready to do that for myself now.\n[1538.28s] I knew that the occasional \nburst of defiance was useless.\n[1542.0s] She’d just keep surging back.\n[1544.72s] If she was water, I’d have to give a dam.\n[1548.04s] A solid wall of pushback.\n[1550.68s] And I found my brother was on \nthe same water-resistant page.\n[1555.12s] We began standing our ground\n[1556.96s] shutting down her attacks\n[1558.866s] calmly pulling apart her contradictions\n[1561.383s] and enforcing appropriate boundaries.\n[1564.56s] Our days as her casual punchbags were done.\n[1568.44s] Tackling her head on, I realised \nshe was actually quite powerless.\n[1572.68s] She’d always relied heavily \non threats and intimidation.\n[1577.12s] When they failed to deter \nus, she really had nothing.\n[1580.743s] Often, when she saw she was losing an argument\n[1583.36s] she’d suddenly blurt, ‘You \nthink too much!’ and storm off.\n[1587.743s] Sometimes we’d hear the distant \nslamming of cupboards and drawers.\n[1591.96s] But slowly something remarkable happened.\n[1594.88s] The uncontained water began to contain itself.\n[1599.28s] After 14 years of chaos, order began to emerge.\n[1610.6s] The final process targets have to move through\n[1612.76s] to leave abusers behind is detachment.\n[1616.68s] Here we separate ourselves from \nthem psychologically and physically.\n[1621.28s] Our interactions come to an end\n[1623.2s] and our thoughts about them \nlose all heat and colour.\n[1627.12s] The abuser fades into insignificance.\n[1631.12s] With the imposter now behaving \nbetter towards me and my brother\n[1634.24s] for a time I thought we might \nhave some kind of relationship.\n[1637.6s] But her continuing abuse of other people\n[1639.76s] showed she still had the \nsame destructive impulses.\n[1643.68s] It was especially depressing to \nsee Walter still taking her abuse.\n[1647.84s] I had hoped he’d stand with us.\n[1650.52s] Around age 16, I saw a \nglimmer of rebellion in him.\n[1654.44s] A door-to-door financial salesman \nhad filled the imposter’s head\n[1658.2s] with dreams of the life she could enjoy\n[1660.48s] if Walter invested in the stock market.\n[1663.4s] She became fixated on the \nidea of a big new luxury house\n[1667.12s] and told Walter to hand over his savings.\n[1670.68s] In an unprecedented moment \nof defiance, he refused.\n[1675.2s] She subjected him to weeks of harassment.\n[1677.72s] And he stood his ground.\n[1679.44s] For a time.\n[1681.08s] But finally caved.\n[1683.76s] Overnight, he lost everything.\n[1687.08s] She then complained that he \nshouldn’t’ve listened to her.\n[1690.6s] It was painful to watch.\n[1693.28s] One of the imposter’s most repulsive stunts\n[1695.68s] involved Walter’s mother, Dorothy.\n[1699.2s] It happened a few days after \nthe death of her husband, Ian.\n[1703.32s] Ian and Dorothy had been married for over 60 years\n[1706.4s] and we didn’t know how she’d cope without him.\n[1709.52s] Mealtimes were especially hard for her.\n[1711.64s] They’d always cooked and eaten together.\n[1714.76s] So Walter would drive over \nafter work to eat with her\n[1718.64s] and, every Sunday, bring her to \nthe house to have lunch with us.\n[1722.36s] And every time she left there’d \nbe the same thunderous cry:\n[1727.16s] ‘Who does she think she is?!’\n[1729.76s] The imposter would slam cupboards and drawers\n[1732.32s] and act out a series of grotesque impersonations\n[1735.2s] casting Dorothy as a pompous, ungrateful snob.\n[1739.48s] What unspeakable offence prompted these fireworks?\n[1743.2s] Dorothy sprinkled salt on her food.\n[1747.24s] In the imposter’s mind, \nthis was a deliberate insult\n[1750.52s] intended to imply she was an incompetent cook.\n[1754.2s] For years, I’d thought her persecution fantasies\n[1756.52s] were just random ideas that popped into her head.\n[1760.16s] But I could see a pattern now.\n[1762.32s] All the things she imagined \npeople were doing to her\n[1764.52s] — sneering at her, plotting against her —\n[1767.56s] were the things she was doing to them.\n[1770.28s] She was projecting her own \ntraits onto other people.\n[1774.88s] In reality, she was the one who \nlooked down on Dorothy’s cooking.\n[1778.84s] She thought it was bland and basic.\n[1781.76s] The disdain she perceived in Dorothy\n[1783.8s] was her own reflected back at her.\n[1787.84s] Each week, her tantrums escalated until, \none Sunday, she surpassed herself.\n[1794.0s] Before bringing in Dorothy’s lunch\n[1796.0s] she mixed in a massive dose of extra salt.\n[1799.8s] Within minutes, Dorothy was \nstifling a persistent cough.\n[1803.96s] Her food must’ve tasted foul.\n[1806.36s] But she spluttered on to \nthe end without complaining.\n[1810.2s] She was in extremely poor health\n[1812.36s] and the overdose could’ve had dire consequences.\n[1815.68s] Fortunately for both women, the \neffects eventually subsided.\n[1820.4s] When Walter took Dorothy home\n[1822.28s] there were shrieks of laughter\n[1824.16s] and jubilant cries of ‘I showed her!’\n[1828.36s] The imposter danced round the house\n[1830.52s] giggling like a five-year-old.\n[1833.16s] Then she looked for me and my brother\n[1834.8s] and gleefully revealed how she’d \npunished a frail old grieving widow\n[1838.68s] for liking a bit of salt.\n[1841.2s] She didn’t register our blank faces.\n[1845.76s] Clearly, the pushback from me \nand my brother against our abuse\n[1849.44s] hadn’t inspired any deep \nreflection in the imposter.\n[1853.04s] She’d only stopped attacking \nus because we fought back\n[1856.16s] not because of any moral breakthrough.\n[1859.64s] What was really sickening\n[1860.96s] was the way she came to us \nto celebrate her misdeeds.\n[1865.08s] She thought we were like her\n[1866.56s] and took the same pleasure in people’s suffering.\n[1869.88s] We were keen to disabuse her of that fantasy\n[1872.48s] and began vigorously defending \nthe people she vilified\n[1875.68s] and refuting her paranoid grievances.\n[1879.4s] There were no more conspiracies of silence\n[1882.16s] in private or in public.\n[1885.08s] If I heard her lying, about \nother people or herself\n[1889.08s] I openly corrected her.\n[1891.64s] One time she was bragging to some neighbours\n[1893.92s] that she’d once saved my life as a toddler\n[1896.36s] by catching me when I fell off a large slide.\n[1900.36s] I loudly reminded her that she’d told me\n[1902.92s] my saviour that day was a \nfamily friend called Amy.\n[1906.84s] It was an awkward but minor slip of the mask.\n[1910.0s] She made out she’d got confused \nand quickly composed herself.\n[1914.36s] But she got the message.\n[1916.48s] We were no longer her public protectors.\n[1920.56s] In my remaining years at the house\n[1922.48s] she sometimes appeared to show real progress.\n[1925.52s] We had fleeting periods of apparent friendliness.\n[1929.12s] But every now and then, her \ntrue colours spilled out.\n[1932.96s] And a couple of times when I was \nstruggling in my personal life\n[1936.16s] she didn’t hesitate to try and \nexploit my perceived weakness\n[1939.72s] to regain dominance over me.\n[1942.24s] She didn’t succeed.\n[1943.96s] But her grabs for power killed \nany illusion of improvement.\n[1948.492s] I realised she was an impulsive opportunist\n[1951.2s] ready to take ruthless \nadvantage of any vulnerability.\n[1955.04s] And I drifted into total estrangement.\n[1959.28s] When my brother and I got ourselves jobs\n[1961.48s] we bought a house and moved out.\n[1963.88s] For the first few weeks, I \nhad no interactions with her.\n[1967.32s] Not because of any conscious \ndecision to go no contact.\n[1970.68s] I just had no interest.\n[1972.88s] She left phone messages that I didn’t return.\n[1976.04s] She got my half-sister Calla \nto convey messages for her\n[1979.76s] flip-flopping between condemnation and martyrdom.\n[1983.6s] Again, ignored.\n[1986.04s] Having worked through damage, \ndiscovery, defence and defiance\n[1991.68s] I was on the verge of complete detachment.\n[1995.296s] And then I went and spoiled it all...\n[2006.56s] Zen Buddhist philosopher Alan \nWatts spoke about the difficulty\n[2010.52s] of getting people who are \nentrenched in false ideas\n[2013.4s] to see their error.\n[2015.76s] Telling them their error often does nothing.\n[2018.48s] So what do you do?\n[2020.44s] Watts imagined someone who was \nstubbornly convinced the earth was flat.\n[2024.76s] He said you have to play a game.\n[2026.68s] Tell the person, ‘Great. The earth is \nflat. Let’s go and look over the edge.’\n[2032.24s] You then suggest travelling together\n[2034.24s] consistently westward, to find the edge.\n[2037.32s] When you instead arrive back where you started\n[2040.08s] your companion will’ve been convinced\n[2041.72s] that the earth is at least cylindrical.\n[2044.52s] Watts proposed that to show people their errors\n[2046.92s] you must make them persist in their folly.\n[2050.0s] Like Watt’s flat-earther\n[2051.906s] I was about to begin my own \nlong journey into folly.\n[2055.746s] In my case, an unsuspecting descent into denial.\n[2060.0s] Over the following years, I’d \nforget some valuable lessons\n[2063.8s] learned from exhausting experience.\n[2067.0s] Having not spoken to the imposter since moving out\n[2069.52s] I got back in touch.\n[2071.2s] I figured if I was going to \nparticipate in the family\n[2074.08s] some contact was inevitable.\n[2076.6s] Things got off to a rocky start.\n[2079.04s] She’d dominate conversations, \nhabitually interrupt people\n[2082.52s] and show no interest in anyone else.\n[2085.28s] So my brother and I made a \npoint of including other people.\n[2089.16s] When anyone else was speaking\n[2090.8s] she’d fidget, make impatient \nnoises, even get up and leave.\n[2095.92s] We paid no attention.\n[2097.84s] She knew how to behave.\n[2099.64s] She managed fine with outsiders.\n[2102.36s] She’d just never had to make that effort with us.\n[2106.16s] Watching her act out, an idea took hold of me\n[2109.24s] that would slowly reel me back into the wasteland:\n[2112.64s] I’d make it my business to civilise her.\n[2115.783s] My view of the problem was very simplistic.\n[2118.663s] To me, she just seemed spoiled, overindulged.\n[2122.383s] So I’d take appropriate countermeasures:\n[2124.903s] build firm boundaries\n[2126.92s] break any negative patterns \nand reward positive ones.\n[2131.48s] I’d make sure to be consistent.\n[2133.88s] Mixed messages could create big setbacks.\n[2137.44s] One major negative pattern was her endless flow\n[2140.4s] of hypercritical, controlling \nremarks on everything\n[2143.32s] from our relationships and careers\n[2145.24s] to our haircuts and taste in furniture.\n[2148.76s] For a while, I ignored them.\n[2151.04s] Then I thought I’d try reasoning with her\n[2153.08s] maybe prompt some empathy.\n[2155.48s] During one visit, I asked her how she’d feel\n[2158.0s] if the people she invited into her home\n[2160.0s] spent all their time criticising it.\n[2162.84s] She just looked baffled and said \nthey couldn’t criticise it —\n[2166.2s] her home was perfect.\n[2168.56s] So I just started bluntly telling \nher when her input wasn’t welcome.\n[2173.32s] She complained she was entitled \nto express her opinions.\n[2176.84s] I said she was free to say what she liked\n[2179.24s] and I was free to choose who I spent my time with.\n[2183.08s] These warning shots across the bow\n[2184.96s] were a way of keeping the lines defined\n[2187.08s] without escalating to ultimatums or showdowns.\n[2191.32s] Often they were enough to do the job.\n[2193.76s] But she did love to push it.\n[2196.36s] She was constantly playing games\n[2198.48s] trying to force me into some emotional corner.\n[2201.92s] Her first games were pure trolling\n[2204.12s] openly aimed to irritate.\n[2206.76s] In one game called ‘Oops’\n[2208.44s] she’d restate some comment \nshe’d been told wasn’t welcome\n[2211.64s] then clap a hand to her mouth and laugh:\n[2213.84s] ‘Oops, I’m not supposed to say that, am I?’\n[2217.0s] She’d repeat this routine ad nauseam.\n[2220.28s] When her irritation games failed, \nshe took a turn towards victimhood.\n[2224.76s] In one of many pity games, called ‘Dying wish’\n[2228.0s] she’d make herself very small\n[2229.92s] and with the quivering drama of a death-bed plea\n[2232.52s] express some extravagant hope.\n[2235.56s] One of her favourites was that \nwe’d come back to the church.\n[2239.44s] My brother and I would address \nthese wishes rationally\n[2242.08s] ignoring the theatrics.\n[2244.08s] And she’d swiftly drop the act and storm off.\n[2248.08s] Occasionally she’d try a dominance game.\n[2250.88s] Out of nowhere, she’d make \nan aggressive complaint.\n[2254.6s] When I pushed back, she’d claim \nI’d taken it the wrong way\n[2258.2s] and protest that she was ‘the most \nmisunderstood woman in history’.\n[2262.52s] The last time she played this game \nled to an unexpected confession.\n[2266.28s] She’d asked about my plans for Christmas.\n[2268.8s] I said I just planned to relax.\n[2271.28s] Out of nowhere, she yelled, ‘If you \ndon’t want to visit us, just be honest!’\n[2276.72s] When I questioned her outburst, \nshe instantly back-pedalled.\n[2280.92s] In a sing-song voice, she claimed she just meant\n[2283.6s] that if I didn’t feel like visiting, it was okay —\n[2286.6s] I could be honest.\n[2288.6s] I said we both knew that’s not what she meant.\n[2291.499s] We both knew she meant to put me on the defensive\n[2294.6s] and get me to say, ‘Of \ncourse I want to visit you!’\n[2297.699s] After some attempts to play \nthe ‘misunderstood’ card\n[2300.64s] she finally giggled that I never let \nher get away with her little tricks.\n[2305.882s] Eventually, after years of sidestepping her games\n[2309.36s] she appeared to run out of steam.\n[2311.56s] Whole visits would pass without any antagonism.\n[2315.04s] We started to get along.\n[2317.2s] Sometimes had a real laugh.\n[2319.28s] And she began to open up about her past.\n[2322.68s] She spoke about growing up \nwith a tyrannical father\n[2325.623s] and shared a number of lurid stories.\n[2328.699s] One time he brought a rabbit home.\n[2330.983s] She called it Mopsy and he put \nher in charge of looking after it.\n[2335.56s] One lunchtime, she asked what was in \nthe delicious pie they were eating.\n[2339.76s] He said, ‘Mopsy.’\n[2342.24s] She said her tears annoyed him.\n[2344.6s] He mocked her attachment to \nthe animal and her distress.\n[2348.72s] Hearing this story, Rags’s death leapt to mind.\n   But I stayed silent.\n[2354.703s] She spoke about her brutal religious upbringing\n[2357.663s] which included being sent to \na school run by sadistic nuns\n[2360.863s] who invented cruel and humiliating punishments\n[2364.019s] and who were constantly hunting \nfor evidence of sexual impropriety.\n[2368.707s] I didn’t mention her countless sexual allegations\n[2371.263s] against me and my brother during our childhood.\n[2374.703s] She spoke about her previous marriage\n[2376.92s] to the father of my half-sisters, Calla and Joan.\n[2380.903s] She said he was an alcohol \ngambler who’d take all their money\n[2384.48s] and vanish for days, sometimes weeks\n[2387.32s] leaving her to raise Calla and Joan by herself.\n[2391.36s] She said to make up for his absences\n[2393.24s] she gave them twice as much love.\n[2396.4s] Eventually, she asked her priest for \nan annulment to end the marriage.\n[2400.6s] But he refused.\n[2402.72s] When she went ahead with a secular divorce\n[2404.96s] she was excommunicated.\n[2407.28s] She said I had no idea how it felt\n[2409.32s] to be shunned by your community.\n[2412.136s] Again I held my tongue.\n[2414.463s] These conversations were about her.\n[2417.0s] I didn’t want to make them about me.\n[2419.063s] And I wasn’t sure she even had the capacity\n[2421.6s] to acknowledge what I went through.\n[2424.303s] But hearing about her ordeals explained a lot.\n[2427.865s] They didn’t excuse her past behaviour.\n[2430.64s] But it no longer seemed to come out of nowhere.\n[2433.76s] It was like she’d become so \nalert to possible attacks\n[2436.88s] that she saw them where they didn’t exist.\n[2440.219s] Now, it seemed she’d got \na grip on her imagination.\n[2444.463s] When I went on to train as a therapist\n[2446.96s] I learned about cluster B disorders\n[2449.063s] and how they existed on a spectrum\n[2451.44s] from mild and potentially treatable\n[2453.76s] to malignant and potentially irretrievable.\n[2456.809s] I remember thinking that the imposter\n[2459.2s] used to exhibit some of the listed traits\n[2462.0s] but if she had been cluster \nB, it must’ve been mild\n[2465.4s] because she was over it now.\n[2467.96s] I wiped her slate forensically clean\n[2470.8s] and resolved to put the \nbad old days far behind us.\n[2474.96s] When I spoke about my abusive past\n[2477.0s] my language became evasive and euphemistic.\n[2480.84s] Often, I’d recount what was done to me\n[2483.0s] without identifying who did it.\n[2485.4s] I didn’t want to betray our progress.\n[2488.223s] I didn’t yet realise we’d made no progress.\n[2499.419s] As the name suggests\n[2501.28s] in the deja vu process\n[2502.92s] we get the sense we’ve been here before.\n[2505.92s] Old behaviours bring the past and all its lessons\n[2509.24s] flooding back into awareness\n[2511.32s] and we wonder how we forgot them.\n[2514.08s] My deja vu got jump-started \nwhen I agreed to come down\n[2517.12s] to the imposter’s house to \ncook a big family lunch.\n[2520.84s] I brought the ingredients with me, got cooking\n[2523.76s] put the food out in large serving bowls\n[2526.12s] and told people to help themselves\n[2528.16s] while I cleaned up the kitchen.\n[2530.92s] After lunch, when everyone else had left\n[2533.32s] I went for a walk.\n[2534.96s] On my return, instead of \nringing the front doorbell\n[2537.64s] I went round the back and \ncame in through the kitchen.\n[2541.32s] I froze when I heard the \nimposter wailing on the phone\n[2544.72s] tearing me to shreds.\n   I hadn’t heard that voice in years.\n[2549.96s] Wondering what on earth was going on\n[2551.88s] I listened in.\n[2553.76s] It turned out the imposter \nand her golden child Joan\n[2557.2s] were furious that they’d had to \nhelp themselves to their food.\n[2561.52s] Helping yourself had been the custom\n[2563.44s] at every big family meal for years.\n[2565.819s] But apparently they’d expected to be waited on.\n[2568.619s] Like royalty.\n[2570.623s] Having learned my crime, I \nstepped out of the kitchen.\n[2574.8s] Seeing me, the blood drained from her face.\n[2578.337s] After hurriedly ending her call\n[2580.32s] she said she was just telling someone\n[2581.8s] what an amazing lunch I’d made.\n[2584.24s] I’d had a few jarring incidents \nwith her in recent years\n[2587.56s] and ultimately dismissed them as innocent slips.\n[2591.379s] This was harder to shrug off.\n[2593.72s] It was exactly how she treated \nvisitors in the bad old days:\n[2597.36s] smiled to their faces then \ncursed them when they left.\n[2600.84s] Shortly after that encounter\n[2602.4s] a phone call with Calla added to my unease.\n[2605.44s] She’d been talking about her complex \nrelationship with her father.\n[2609.056s] I said the imposter told me how she’d given her\n[2611.139s] twice the love to try to \ncompensate for his absence.\n[2615.12s] After a pregnant silence, she \nsaid, ‘That’s not how it was.’\n[2619.76s] She said the imposter was at \nher most violent back then.\n[2623.68s] And she described nauseating acts I won’t repeat.\n[2628.08s] She also spoke about how, \nwhen Walter first came along\n[2631.24s] she watched the imposter and Joan work together\n[2634.04s] to break him down with savage attacks.\n[2637.4s] Seeming to sense a new distance between us\n[2639.96s] the imposter began an aggressive bonding campaign\n[2642.88s] endlessly recounting the same small handful\n[2645.4s] of positive memories from my childhood.\n[2648.24s] Only each memory had a backstory\n[2650.36s] that just underscored what a bleak time it was.\n[2653.84s] She’d tell me, ‘You were such happy children!’\n[2656.64s] ‘I could always hear you laughing.’\n[2659.16s] Of course she only heard us.\n[2660.6s] We were always in another room.\n[2663.12s] Our laughter annoyed her and it \nwas repeatedly, violently punished.\n[2668.44s] She’d say, ‘Remember your \nfirst day at primary school?’\n[2671.6s] ‘….how you begged me not to go?’\n[2674.2s] I did remember.\n[2675.68s] I also remembered our first day at \nnursery school two years earlier\n[2679.376s] when, as the other children cried\n[2681.503s] and screamed for their parents to stay\n[2684.0s] my brother and I ran into the playground\n[2686.16s] without a backward glance.\n[2688.68s] When the imposter collected us\n[2690.28s] we got the silent treatment for hours\n[2692.36s] for showing no distress at her departure.\n[2695.6s] Which was why, on my first day at primary school\n[2698.12s] I pretended to want her to stay.\n[2701.32s] When she first started regurgitating \nthese rose-tinted episodes\n[2704.92s] I just changed the subject.\n[2707.16s] As she continued to repeat them\n[2708.88s] I became more direct, telling her countless times:\n[2712.08s] ‘Let’s forget the past and focus on the present.’\n[2715.92s] Even then, I hadn’t given up all hope.\n[2718.96s] I was still persisting in my folly.\n[2722.28s] Things came to a head when my brother\n[2724.32s] who’d been subjected to the same propaganda\n[2726.48s] shared some childhood \nrecollections of his own with her.\n[2729.84s] The imposter reported the \nexchange during my next visit.\n[2733.32s] She suggested someone had planted \nfalse memories in his head\n[2736.52s] and hinted at having him hospitalised.\n[2739.6s] I recalled how she used to suggest \nhe had mental problems as a boy.\n[2743.72s] I glanced at Walter, looking \nsheepish on the sidelines.\n[2747.6s] And I was all out of patience.\n[2750.4s] I said we all knew they weren’t false memories.\n[2752.96s] We all knew everything my brother said was true.\n[2756.56s] I told her she’d been a vicious, \nviolent woman during our childhood\n[2760.64s] and we’d had to work hard to \ndeal with the damage done to us.\n[2764.88s] I said we’d both been willing \nto put the past behind us\n[2768.24s] but if she was now going to try and reinvent it\n[2770.84s] she should expect a dose of reality.\n[2773.8s] In a timid act of solidarity\n[2776.04s] making sure she couldn’t see him\n[2777.72s] Walter nodded his agreement.\n[2780.36s] The imposter said she couldn’t \nrecall the events we’d referred to\n[2783.88s] but, if they happened, she \nhoped we’d make allowances.\n[2788.68s] No trace of an apology.\n[2790.96s] And, as always, she was the one\n[2792.88s] in need of compassion and understanding.\n[2796.08s] For years, denial had \ndisconnected me from the past.\n[2800.68s] Going against all my experience \nof her deceptive nature\n[2804.44s] I’d let myself imagine I could rehabilitate her.\n[2808.08s] Having persisted in that folly\n[2809.68s] I’d finally come full circle and reconnected\n[2812.96s] with the past and its neglected lessons.\n[2816.96s] I saw the pathology I’d come to \nknow in such detail growing up.\n[2821.6s] And I recognised the final \npiece of the imposter’s puzzle:\n[2825.64s] she was unreachable.\n[2828.12s] I could see now how my own \ndelusion had reeled me back in.\n[2832.88s] When she seemed to improve\n[2834.56s] it was seductive to imagine\n[2836.12s] my efforts with her had paid off.\n[2838.8s] In reality, she’d just \nretreated behind a new mask:\n[2842.52s] the mask of the reformed character.\n[2845.68s] Cards on the table.\n[2847.24s] Even though I’d developed what had felt like\n[2848.96s] a comfortable friendship with her\n[2850.72s] it wasn’t like she’d become a big part of my life.\n[2853.8s] Not by any stretch.\n[2856.08s] She phoned me every week which felt a bit much.\n[2859.44s] And I saw her socially maybe \nthree or four times a year.\n[2863.4s] There’d never been any great bond.\n[2865.84s] That ship had sailed and sunk in my childhood.\n[2869.099s] So realising it was all a lie \nwasn’t exactly world-ending.\n[2874.059s] And as I thought about it\n[2875.583s] the fact she’d put on that mask \nin my company for so many years\n[2879.209s] had meant that for that time at least\n[2881.503s] I hadn’t had to deal with her games.\n[2884.263s] It was the future that was troubling me now.\n[2887.059s] I thought, ‘This isn’t going to end well’.\n[2890.659s] In the following months, Walter succumbed\n[2893.2s] to what would turn out to be terminal cancer.\n[2896.063s] And chaos reemerged.\n[2899.12s] The imposter was in charge \nof his medication at first\n[2902.08s] but gave the wrong doses so many times\n[2904.64s] that — to Walter’s great \nrelief — my brother took over.\n[2908.4s] She’d also cancel crucial doctor’s appointments\n[2911.28s] and home visits from nurses.\n[2913.96s] Her growing envy of the attention \nreceived by her dying husband\n[2918.16s] led to increasingly obstructive behaviour.\n[2921.031s] Sometimes when we were talking to him\n[2923.48s] she’d seat herself intrusively between him and us.\n[2927.496s] During some visits\n[2929.08s] we could hear her talking \nto Walter in another room\n[2931.92s] trying to twist innocent things we’d said or done\n[2934.8s] into something malicious.\n[2937.049s] And when we departed, we could hear her\n[2939.84s] through the brick walls openly ranting about us.\n[2944.24s] For a time, I wrote Walter weekly letters.\n[2948.383s] Then in a phone call, he told me\n[2950.263s] every time they arrived she’d \nfly into a jealous rage.\n[2954.88s] She was furious with me\n[2956.76s] and was apparently giving me the silent treatment.\n[2959.76s] I hadn’t noticed\n[2961.4s] but now I realised she \nhadn’t called for some weeks.\n[2965.36s] I told Walter my frank opinion of her\n[2967.8s] citing various obscene incidents.\n[2971.08s] When I finished, I was staggered to hear him admit\n[2974.12s] she was a very sick woman.\n[2976.92s] I wondered if we might finally \nhave a real conversation\n[2980.16s] about addressing her behaviour.\n[2983.4s] Then he suggested maybe I could write \nher some messages to appease her.\n[2988.92s] I told him I wouldn’t reward \nher abuse with attention.\n[2993.12s] He said he understood.\n[2995.92s] I asked if he wanted me to carry on writing.\n[2999.16s] An awkward silence gave me my answer.\n[3003.2s] He said maybe he could phone me when she was out.\n[3006.56s] So I left it in his hands.\n[3009.8s] Over the next couple of weeks he phoned twice.\n[3013.103s] Both times he sounded odd.\n[3015.44s] Out of it.\n[3016.6s] Like an actor forgetting his script.\n[3019.379s] The second time, he repeatedly pressed me\n[3022.04s] to send my love to the imposter.\n[3024.779s] When I said I had told him how I felt\n[3027.24s] he pretended not to know what I was talking about.\n[3030.376s] I realised she was listening \nin, feeding him lines.\n[3035.216s] That was the last time we spoke.\n[3038.216s] A few days later, after months \nof silence, the imposter phoned.\n[3043.336s] I answered, not knowing who was calling.\n[3046.379s] She gave a theatrical sigh of relief\n[3048.936s] and said she’d been calling for weeks for a chat\n[3051.68s] but the line was always busy.\n[3054.259s] It was fitting that the last words \nshe’d ever speak to me were a lie.\n[3059.263s] Tired of the subterfuge, I pressed ‘end call’\n[3062.56s] and went no contact.\n[3065.64s] In the weeks before Walter died\n[3067.8s] I engaged a great therapist called John\n[3070.76s] to help me sift through the mess and let it go.\n[3074.92s] I spoke about my conflicted \nfeelings for him over the decades.\n[3078.8s] From contempt and betrayal \nto pity and frustration.\n[3083.44s] He knew how destructive she \nwas and did nothing about it.\n[3087.24s] Not for himself or his children.\n[3090.44s] John commented that it seemed \nlike Walter became stuck\n[3093.24s] in the notion that things would \nbe okay if he kept her sweet.\n[3097.696s] Echoing Alan Watts, he reflected\n[3100.28s] that we can’t always make people see their error.\n[3103.485s] Sometimes it becomes a fixed idea.\n[3106.139s] We just need to make sure we don’t allow ourselves\n[3109.2s] to be dragged into their error with them.\n[3112.296s] In one of my sessions with John\n[3114.383s] I spoke about the sociopathic \nself-image instilled in me as a boy.\n[3119.739s] I said it was like having a \nmonster mask superglued to my face.\n[3124.503s] I was a compulsive liar, \nendlessly scheming against people\n[3128.463s] performing acts of deliberate sabotage\n[3131.16s] stirring up conflict, faking \nvulnerability for attention.\n[3136.68s] I tailed off as I heard what I was saying.\n[3140.76s] It was her.\n[3142.903s] I’d recognised decades ago that she projected\n[3145.8s] her negative traits onto other people.\n[3148.0s] But I’d never quite made the connection\n[3150.12s] with my old sociopathic self-image.\n[3152.936s] Even though I’d long discarded my monster mask\n[3156.24s] there was something powerfully liberating \nin fully realising its origins.\n[3161.459s] I realised, throughout my \ndecades of interactions with her\n[3165.08s] she was never talking to me.\n[3167.32s] She was talking to a fantasy she’d concocted.\n[3171.099s] Just as she was never talking to me\n[3173.383s] I was never talking to her.\n[3175.56s] I was never talking to a real person.\n[3177.939s] Just a performance of a person.\n[3180.863s] In recognising that total disconnect\n[3183.343s] my detachment was complete.\n[3186.576s] It takes an effort to tell this story now\n[3189.419s] because it’s all been processed.\n[3192.343s] It''s like trying to write a novel twice.\nThe second time is just mechanical.\n[3197.503s] You know all the detail.\n[3199.52s] But there’s no feeling.\n[3201.48s] You are truly indifferent.\n[3203.983s] Which is how I can say that \nmy cluster B parent died.\n[3207.943s] And I felt....nothing much."}'
