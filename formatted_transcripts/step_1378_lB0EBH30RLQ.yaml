ou probably know already but you may not and at the final third of the video I'm going to actually give you some really practical tips that I hope will really help you if you are dealing with overwhelm make some actual changes in your life and in your career and actually get back to Growing again in your career so why is the tech industry so overwhelming well the first reason is just the Relentless pace of progress if you're on a scrum project or something like that every 2 weeks there's a new release delivered but there's no break in between the end of that Sprint and the next one you just roll right into it and keep marching ahead and it's actually worse on kbon projects because there is no rhythm to know there's an end to anything there's really just the end of the project and there's an ongoing set of tickets also many companies have an unlimited vacation policy and on the surface this sounds like a really good thing oh I could take vacation whenever I want but if you talk to most people I think you may have even experienced this yourself who work at one of these companies people actually end up taking less vacation because they don't feel enough pressure to make sure that they use it the second way that the tech industry overwhelms us or may get you to a point where you're feeling overwhelmed is the pressure we have to continuously learn when you're on the job especially if you're developer just part of getting your daily work done is often searching all over the Internet or using chat GPT or whatever kind of research tools you use to find the answers to your questions and even if you're not a developer let's say you're a product manager you're looking at you know your competitors you're looking at other products and Solutions in the market that are similar to yours you're looking for new opportunities you're talking to your engineering team so there's all these new things we're acquiring just on the job but worse than in that is if you go out on social media or you go out on learning sites or you just talk to your friends or your colleagues there seems to be this internal pressure that if you're not learning new skills and you're not you know growing that you're going to fail in your career and while certainly you can't just ride out a c current set of skills probably for 20 years I think often when we get to a point of overwhelm in Tech it's just because we have this unrealistic pressure to keep learning and nobody can keep up with that the third way that we often get overwhelmed in the tech industry and I think a big reason why it's such a problem is we glorify hustle culture look there's a lot of very well-known social media influencers that like to pump you up with a bunch of motivation about how you know get out there and keep working and you know work 80 hours a week to achieve your dreams and I think you know that sounds good on the surface when some of those people want to encourage you to basically burn your entire life out to achieve some super high goal but you know life is not a Sprint it's a marathon and if you go about your career that way where basically you leave yourself no time for rest you're going to get to a period of burnout or overwhelm probably quicker than you expect and I actually have a career guide that you can download from my website where I talk a little bit about looking at your career over time and sort of the stages that you go through that's a much more I think realistic way to think about achieving you know outcomes in your career maybe starting a company and things like that that doesn't really require you to basically sacrifice your health and sacrifice your work life balance and just burn yourself out so how do you know that you're actually becoming overwhelmed what happens well I think one of the first things then and this is probably one of the more obvious ones but a little bit further I'm going to get into some of the ones that are a little harder to tell is you constantly just feel kind of fatigued like you don't have any energy just doing anything your your tasks at work things at home feel a lot more exhausting than normal and also you can just feel really depressed you know I've heard the the explanation that depression is when you're focused on the past and anxiety is when you're focused on the future I think that's pretty true you know when when you're depressed often you're looking back at something in your life or in work that ultimately you can't change it's really not very helpful but you know the other day I actually had something happen to me where I've had three really difficult things happen in my personal life this year two of them were with family uh one of them is with sort of extended family and you know those three things on their own I can handle a certain level of stress on top of my job and you know having a relationship with my wife and my kids right there there's almost like if you think of it like you have a reservoir that holds water in your body and that can hold an amount of stress or amount of things that you can deal with everyone has a threshold or a limit where if you go above that you start to feel overwhelmed and you get angry you get depressed you know you start to feel fatigued basically that this bullet that I'm talking about this point I'm making with you well the other day I was just feeling kind of angry and I was feeling unsettled and I couldn't figure out why and you know I was talking about my wife about it at night and I'm going through all the things that I've been you know dealing with and I realized something had just happened recently that I won't get into it but it wasn't a huge stress but it was still a stress but that thing on top of all the other things I was dealing with this year was that was all that was needed to kind of fill up my reservoir so to speak of of stress and of overwhelm and really caused me to experience a lot of anxiety and feel really angry and stressed out so if if you're not sure why you're feeling overwhelmed uh a sign can be that you can't really figure out why and it might not be a bad idea to look back over you know the recent let's say year or couple years you might have a few things going on whether it's work or personal that seem unrelated and they seem like they're somewhat resolved in in my case I felt like these were things that oh I'm not really stressed out about them anymore but just because they're not currently stressing you out if they're still somewhat stressful you know the cumulative amount of all those things together can really bring you to a place of overwhelm the second sign that you're probably overwhelmed or you may be is you've heard the term brain fog or basically having a hard time making decisions uh I've shared with you earlier on the channel that you know I've had a lot of problems with insomnia over the years I've had you know serious burnout I shared that in a in a whole episode with you a few weeks back but but when I am not rested well enough or when I'm overwhelmed I'll find that just trivial decisions you know which task I should work on first which direction to go with the code you know what things I should do or not do in my personal life all of the sudden become way harder than they really should be and my ability to just kind of think clearly through a sequence of processes where normally you know I just kind of make the decisions and things would move forward suddenly I'll get to this place where I just foggy I feel like I I'm confused I don't really know where to go so if you're starting to feel like that you know take that seriously that's a real sign that you might be experiencing overwhelm another reason you might be feeling overwhelmed or a sign of it rather is if you basically feel inadequate at at your job but it's kind of contrary to your achievements meaning you're actually getting a lot done and you might even have co-workers telling you hey we really love the job you're working we really appreciate you know this task you did or how hard you worked on this one thing or how you helped us you know solve this design issue but you still are critical of yourself and you still seem to tell yourself man I'm just not getting enough done and I'm not really doing really great at this job that you know people will attribute that to impostor syndrome and sometimes it can be but sometimes actually if you look into the science behind it there's a that's a sign of being over whelmed if you've got too many things you're responsible for you can suddenly become really self-critical the fourth sign that you might be overwhelmed is you get angry whenever people ask for your help you've probably seen this if you've been on a project let's say you're a senior developer or a junior developer and your Tech lead or your lead you know technical lead on your software project anytime you ask them for help they kind of bark at you or they basically make it your fault or tell you well you didn't write the pr correctly or you know I don't have time you should know better they basically give you these disclaimer statements that somehow it's your problem and sure there's processes we should follow and we don't always do them perfectly and sometimes you know asking for help is an opportunity when someone can show us hey I need you to go back and do something different but the attitude that people use when they tell you that if they kind of again are short with you angry with you bark at you that's a really good sign that the person working with is probably overwhelmed and they haven't learned how to set boundaries with their employer they're getting too much piled on them and and they haven't figured out a way to stop that so if you personally start to not want to help people especially if you see this too in your personal life let's say your wife and kids want to do something with you or your friends want to do something with you or there's a concert coming up or some sporting event or you know whatever it is that you like to do in your life for fun you find reasons not to do it you you almost get angry at the person for asking you or at yourself for not being able to do it that's a really good sign that you're starting to experience or probably are right in the middle of some serious overwhelm in your life and the last sign that you're probably overwhelmed is the excuse that you're too busy for social activities whether it's somebody asking you to go out to dinner with them or just go for a walk or just trivial things that involve you know building relationships with people spending time together I'll often hear people say I'm too busy I'm too busy I'm too busy and hey if it's somebody who you know let's say it's somebody on linked out re linked out LinkedIn reaching out to me for you know help with something I literally am too busy often to just build random new relationships with people if they're asking me to hop on a call which I get all the time or you know promote their product I'm literally too busy but the people who are close to you in your life and the people who you've already kind of committed to have a relationship with if you're always telling them I'm just too busy I'm just too busy that's a big sign that you're overwhelmed and you need to do something about it so how can you reduce overwhelm if you find yourself in the middle of it well the first thing that can really help is to take a look at everything that you're responsible for your tasks both in your personal life and at work and prioritize them this is the same thing that we ask product managers to do for example with you know work they give a scrum team or tickets they give a you know conon team but it it it surprises me that as developers we often think just getting handed tickets is enough prioritization in our life and usually we've got things we're responsible for at work other than just user stories or tickets we've got people that we need to be mentoring people we need to help we may have some administrative task like filing an expense report or something we have to do we may have some things at home that we're responsible for a whole bunch of I've got all kinds of stuff around here projects that I'm responsible for and some of those things are high priority and some of them are not and some of them seem urgent but they're not uh you may have heard of the book SE The Seven Habits of Highly Effective People by Steven covy it's a really famous book it I it's it was written a long time ago now but that has a really great framework for thinking through all the tasks in your life and and in work and trying to figure out you know how should you prioritize them based on a a few pretty simple factors but you know one of the things I would often do in my life and I've been honest with you about this on the channel is when I didn't want to prioritize my work I would do drugs I would smoke weed basically because I was just so overwhelmed I didn't even feel like I knew where to start to prioritize and so rather than doing almost anything I would do sort of like the bare minimum in my personal life and I would throw so much into work I've talked with you about this before you know instead of learning how to prioritize I would just get high and then just kind of you know Escape play a video game play some music hang out with my wife or my kids and just completely you know basically ignore and and blow off stuff that I was responsible for so you know if you are feeling overwhelmed I just really want to encourage you find a way that works for you there's tons of different ways to prioritize tasks but again the book I just mentioned is really helpful and don't you know Escape you know if you're drinking if you're smoking if you're doing anything else like that that's that's really an escape that's allowing you to put off what you need to do you're going to continue to feel overwhelmed until you start chipping away at it and getting some of those things out of the way the second way you can reduce overwhelm is to learn to say no this is a really hard one for me I've shared this with you many times on the channel but you know when you come from a family let's say where you have really high expectations on you as a kid growing up it can be really hard to learn you know as an adult in your personal life and in your professional life to really just say no to people when it's a reasonable time to do it and so you know if you're struggling with saying no and people ask a lot of you and you tend to just agree to stuff even though you don't really probably have the time or energy or you don't really want to do it um there's a book now this is probably only going to be helpful if you believe in God but uh if you don't don't read it or read a different book but the one that really helped me was uh there's a book called when people are big and God is small and this book really helped me kind of put in perspective how much I was moving forward in my life basing a lot of my own personal value of myself and and how successful I thought I was and sort of what I thought I should be doing as a person on you know what other people expected of me when realistically on most jobs uh we have to say no you know companies aren't going to say well we better not give you know jimie too much work they're going to say let's keep giving Jamie work and he's a professional he's an adult he'll tell us when it's too much work so you know basically if anything you can do to try to help your ability to set boundaries with people and I'm going to make specific videos in the next year about setting boundaries will really help you not feel overwhelmed the third thing you can do to help just reduce or eliminate your feeling of just being overwhelmed in your life or on your projects is to PR practice mindfulness or prayer you know in today's modern age often we get up in the morning we get on our cell phone right away we get on slack we get into a meeting we work all day we're focused on the computer then we come home maybe we play a video game we watch TV we watch a YouTube video like this you know we're constantly taking an information and looking at screens and accomplishing things and it gives us no time at all to let let our thoughts actually sort of be processed and settle and you know when I had a lot of problems with sleep my insomnia which I still do struggle with on and off for sure you know one of the things that helped me was I I came up with a period of worry time now this isn't something I came up with personally I'll I'll do a whole episode on sleep this year by the way and share some of the things I've learned about it but you know I if you if you don't give yourself some time to really process everything that's going on your day where you're not taking on new information it's just going to continue to overwhelm you so I'd really encourage you there's some there's some mindfulness apps out there that'll help you with you know if you if you want to do meditation also just you know if you don't want to look at it as sort of a new age type of thing and just look at it as an ability for you to be able to give your mind rest and not be thinking about anything uh you know and I'll warn you if you haven't done this in a number of years you got to be patient with yourself it's extremely hard you might be able to only sit with your own thoughts for like 2 minutes seriously when you first start doing this you know me being uh of of religious Faith you know I I follow Christ um prayer is is what I almost always go to when I'm stressed out and I need to let my thoughts relax um I bring my stresses to the Lord and and I ask for help with him and sometimes I just sit there in you know the piece of that he's in control and try to just let go of like you know I I can't get this all done I'm feeling overwhelmed but I'm not the one in control and that often really helps me out the fourth thing you can do to really help yourself recover from overwhelm or or deal with it better is to exercise and get more sleep you know when you're not sleeping well it's incredibly hard to exercise I've been struggling for the last 6 years I used to be significantly uh lighter than I am right now um and I used to work out you know 7 days a week and lately ever since I had my kind of nervous breakdown chronic insomnia this you know I talked about this in my burnout video but this was about 6 years ago you know I I go through periods where I start riding my bike a lot where I start lifting weights again and then I have stuff happen in my life sometimes I I just can't cope with the stress well enough and I start to sleep poorly and then it's really hard to exercise and it's kind of this vicious cycle that you get into and it's been improving but for me it's kind of like I improve a little and I fall back a little and I improve a little and I fall back a little and it's just a process you know and I'm getting older too and it's a lot harder to stay healthy the older you get but if you're feeling overwhelmed like there's just you can't take on all the stresses of the world one way to increase that Reservoir I talked about that sort of like if you think of it again as something that holds your ability to sort of like buffer or handle stress before it overwhelms you is exercise you know I like to ride road bikes there's a little Trail called the the valway here in Austin very close to my house uh I also don't mind just even going for a walk is is excellent ability to get some exercise you don't have to power walk it just any kind of walking but really anything you could do lifting weights is great as you get older just really all the time but you know what I found is that that Reservoir that ability to take on stress you probably experienced this too increases if you're exercising regularly meaning you can have stressful events happen in your life or happen at work and they won't kind of blow you out into anxiety or depression or despair as quickly because you have sort of a buffer of you know your body feels really good from the workout you have you know a lot of uh things going through your body hormones and things that are keeping sort of your stress at a more balanced level so that when you do hit those stress periods you don't just instantly flip out and the last thing I'd really recommend you consider if you want to reduce overwhelm in your life and this is something something that is super hard for most people but I've done it several times over the last 6 years and it's been really lifechanging is to take what's called a social media fast it's basically a break explicit break from all social media for a period of time now I should clarify here I don't personally look at listening to podcasts or watching YouTube videos necessarily is social media I more think of you know Instagram Tik Tok Twitter you know WhatsApp all that kind of stuff is Facebook right as as social media but the the the main thing here is you know the the more you're on social media or really you're just consuming content you're seeing all these other people in life doing things and if you've got goals in your life whether it's just your work you know for another company or you're trying to start a company like I am you know when I go on LinkedIn let's say and I scroll two or three times you know I start thinking should I have sold three companies by the time I was 23 you know or whatever you know achievement signaling people are sharing and and then all of the sudden rather than me being excited about my life and wanting to move forward and just proud of my own achievements I'm getting wrapped up in everybody else's and then the other thing is you know learning you've you've heard me talk about this I think a couple years ago but learning can be a form of procrastination I learned this the hard way which is you know you can you can be basically on YouTube watching videos about some programming thing or about you know starting a business or health but if you're not actually starting a business and taking actions in it or you're not actually using the program programming language or you're not actually starting to exercise you're not really doing anything different in your life but you're getting kind of that same endorphin hit in your body you know that you that you or dopamine sorry hit that you think that you know you're basically creating a reward for yourself that you're accomplishing something and you're not you're deceiving yourself so you know I would recommend you can do it for a week you can do it for a month my wife did it for almost a whole year uh but you know just uninstall the social media apps off of your phone take a freaking break you know just focus on the stuff right in front of you and then come back to it if you're feeling less overwhelmed and you know I hope that just if you try at least one or hopefully a lot of these five tips I gave you today if you're starting to feel really overwhelmed and some of the signs that I've given you are helping you see that you are overwhelmed uh you can pull yourself out of it and just enjoy your career this year so are you struggling with being overwhelmed what are you going through what are you doing to get help leave me some comments until next time thanks
