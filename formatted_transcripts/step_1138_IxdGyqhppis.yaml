pter 4 of The Nature of Code. And you can go back and watch the particle system videos where I look at inheritance and something called polymorphism in more detail. But for right now, all you need to know is that if I use the keyword extends and say that my particle extends VerletParticle2D, then suddenly, it's as if I copy pasted everything that's part of VerletParticle2D into my particle class. Only I don't have to copy paste it. It's invisible. It's inherited all of it. And in fact, this is all the code I need except for one more change. It's not up to me to initialize the x and y properties of that particle. I want toxiclibs to do that for me. So I can reference the parent class VerletParticle2D with the keyword super. The parent-child relationship is often called the superclass to subclass relationship. So now, I have my own particle class, which is exactly a VerletParticle2D, but I've added a radius and a show function. And I can go back into sketch and replace all these. Code still works. Now, look at this. Every particle I'm making, I'm adding to the physics world. And that's really going to be the case 99 times out of 100. If I'm making particles, I want them to experience the physics. I'm not making them just to leave them out. So a nice feature that I could add to my particle class is for it to be responsible for adding the particles to the physics world. So when I create a particle, the constructor is called. And right there in the constructor, I can say physics.addParticle. Now what is it that I'm adding? I'm not adding a specific particle. I'm adding this particle. Inside the class, the way you reference any generic particle is with the keyword this. This particle's x. This particle is y. This particle. Now I could also replace the calls to circle in draw with the show function. [MUSIC PLAYING] Great, we're still cooking here. Let's give the springs the same treatment I gave to the particles. [MUSIC PLAYING] Here's the spring class, which extends Verle