transcript: Hey, everybody. So I haven't been making a lot of videos recently. I've been deep into the throes of writing the new version of The Nature of Code book. And I'm pleased to report that I am making progress at the end of this video. Maybe I'll circle back to that and let more about what you can find. But this wonderful thing happened. I was busy rewriting chapter 6, a chapter about rigid body and soft body physics with different kinds of libraries, matter.js and toxiclibs.js. And I saw this tweet. It was a month ago from Juhani Halkomäki this incredible, beautiful world of blobs all colliding with each other. And I just thought to myself, this reminds me of a project that really got me inspired to write the original Nature of Code back in 2008 called Nokia Friends. This was a project by Karsten Schmidt with a bunch of cute, cuddly, little squishy characters that bounced around. Now, that project was built with a library called toxiclibs. Toxiclibs started, I think, around 2005, a sweeping and pioneering open source library for computational design. It wasn't just one little library. It had multiple packages, geometry, 3D, 2D, audio, color utilities, physics, so many more things. And it was available for processing, which was the environment I was learning and using the most at the time. Now, that library is no longer maintained. And you should really check out what Karsten Schmidt is currently working on at thi.ng, thi.ng, I'll put links all over the screen and in the video description. But I just can't stop using toxiclibs. It has a special place in my heart. It's critical to the history of computational design and generative art. And there is a wonderful port of it from Kyle Phillips, Haptic Data Online, into JavaScript. So toxiclibs dot JavaScript is still on the internet today. It works. It's supported. I am excited to use it. So I want to make my own squishy, cute, soft-bodied character as a coding challenge in this video using toxiclibs.js. Before I dig into the code, let me tell you about some really important references that you might want to dig into if you want to know all there is to know about soft body physics. So the seminal paper, in my mind, is called "Advanced Character Physics." It was published in 2001 by Thomas Jakobsen as part of the Game Developers Conference. And Jakobsen was working for IO Interactive, a game design company and developed these algorithms and this methodology for the game Hitman Codename 47. And the implementation of what's called verlet physics in the toxiclibs library would match exactly what's in this paper. You might have also heard of a game called JellyCar. And there's a recent wonderful YouTube explainer that goes through everything about how the soft body physics in that game was implemented and how it all works. Now, in this video, I'm going to be using toxiclibs as the physics library. But there are plenty of other physics libraries that you could consider doing something similar with. Two that I would mention that I've made videos about before, quite old videos, Box2d and maybe a little bit more recently, matter.js. So I will include links to all of that material in this video's description as well. All physics libraries tend to come with some number of elements that define the world and the things in that world. In toxiclibs, in the toxiclibs of verlet physics, there are three, four, or maybe five things that I want to talk about. [MUSIC PLAYING] The first element that's critical for the physics simulation is the world itself. And you can think of the world as the P5 Canvas. Then, there is the concept of a particle, a single point in that world. Now, I'll probably choose to draw the particle as a circle. But in the actual physics itself, it is considered to be a single point mass. It does not have any geometry. This is a pure soft body world that we can build geometry in out of particles. But if you're interested in rigid body physics, that's where you want to go back and look at some of these other examples of physics libraries. If you have two particles, particle 1 and particle 2, they can be connected with a spring. Other terms for this might be joint or constraint. The idea is that there is some relationship between these two particles governed by a force that obeys Hooke's law, springs. And if you want to learn more about how to implement your own spring force, hey, guess what? I have a coding challenge video all about that for you to watch. A behavior is the idea of a force that can be added to either the world or to an individual particle. So there's such thing as a gravity behavior. If I put that in the world, then all the particles experience gravity. There's an attraction behavior that I could add to an individual particle. And then all the other particles are attracted to it. Make it negative, it's a repulsion force, lots of possibilities there. We'll get into that as I start coding. I should also mention that there are classes in toxiclibs for geometry. So I'm not going to be using P5 vector, which is what I typically use in most of my examples because toxiclibs has its own Vec2D object. And there are other objects for other kinds of geometry. And I'll get into them as I need to use them. All right, let's dive in and see if we can create a sketch that has a physics world, two particles, and one spring that connects them, and maybe a gravity behavior. That I think we could do pretty quickly and easily. And then we'll move on to seeing if we can build an entire character out of particles and springs. I'll be demonstrating this with the P5 Web Editor. If you want to follow along, I'll link a sketch that is blank but has the toxiclibs library imported as well as the p5.js library. And then of course, I'll have a link to the end result of whatever I code in this particular video. All right, first up, I want to make a physics world. So I'm going to create a variable called physics. The full name for a physics world with toxiclibs is VerletPhysics2D. I imported the library and yet it says VerletPhysics2D is not defined. The toxiclibs.js website has a Getting Started section, which will walk you through how to get going with the toxiclibs library. The original documentation for the Java version is no longer online. But I see it as a personal mission to keep these things alive. So I have actually hosted that library, revived it at a GitHub repository that I've set up that I'll link to in the description. And what you'll see here is that the VerletPhysics2D class is part of the package toxi.physics2d. toxiclibs, if you remember, is a suite of many, many, many different libraries all bundled together. If I want to create a verlet physics world, I've got to reference the full path. But this is fairly inconvenient to have to do all throughout the code. So I'm going to use something called object destructuring to pull out the classes that I intend to use from the toxiclibs packages. [MUSIC PLAYING] I should really make a short little quick video on object destructuring. If you want to see that, let me know in the comments. But what I'm doing is toxi.physics2d is an object with properties. And I'm pulling those properties, destructuring the object out into individual variables with the same name through this syntax. And even though I like to just use let everywhere to make things friendly and less confusing, this is probably a case where I really should declare these variables with const because they're never going to change. Now, in addition to pulling out the VerletPhysics2D class, I also have access to the VerletParticle2D. And I have made a verlet particle at x 320 y 100. Let's draw that particle. And there it is. But it's not experiencing any physics yet. How about we add a gravity behavior to the world? Oh, I didn't import the gravity behavior. There we go. Now I have access to gravity behavior. Now, to make a gravity behavior I need a vector to say what direction is the gravity pointing in and how strong is it? This would be a vector pointing down. Oh, but I've got to import that vector class. The vector class is actually part of toxi.geometry rather than physics. Now, I'm not seeing the gravity yet. This is a really critical thing about toxiclibs and most physics engines. Just because you create a particle, a behavior, a spring, it doesn't automatically activate within the world unless you explicitly add it to the world. So I need to say physics.addBehavior gravity. What did I miss here? OK, so I'm getting a weird error here, it's undefined. I made this vector. But I forgot to create the gravity with that vector. So that should go there. And there we go. Still no gravity. Now, I like to write things out in many separate steps because it makes it a bit easier to follow, especially if you're new to this. But I do want to point out that I don't have to make a separate variable for v and a separate variable for the gravity. Just to prove that point, I could create the new vector right here when I make the gravity behavior. And I could do the same thing with the gravity behavior in the add behavior function. But I'll leave that to you. Still, though, no physics happening. Guess what I'm missing? I made the gravity and added it. I made the particle. But I didn't add it. Everything that I make, I have to add explicitly to the physics world. But I still see no physics. I've forgotten a critical step. And in fact, that word step is maybe a clue. If you are used to P5, you're probably used to the idea of time moving forward by the draw function looping over and over again. You've always controlled your animation and behaviors through that fact, through the fact that you have a variable that you change and you draw something one way, then draw loops. And you draw something another way, and so on, and so forth. The draw loop is continuing to loop. But the physics world is not moving forward in time. It's up to us to specifically tie those two concepts together. The physics world takes a step forward in time when you call physics.update. The easiest way to have this all work then is to just have physics update happen every time through draw. There are all sorts of ways we could get more sophisticated about that. But this is going to do the job for us. And as you see, now, gravity is in play. Let's add a boundary to the world. I need that rectangle object from toxi.geometry. [MUSIC PLAYING] There we go, I can create a rectangle that is exactly the dimensions of the canvas. And I can make that the world bounds of the physics world. And sure enough, the particle stops when it gets to the bottom. Let's add a second particle. [MUSIC PLAYING] So now, I created two verlet particles, added them both to the world. And I'm drawing both of them. It's time to return to this diagram and look at how I would add a spring to connect these two particles. Now, when I created a particle, I only needed two arguments, an x and a y for the coordinate of the particle on the canvas. A spring needs four arguments, the two particles that are going to be connected, let's call them a and b, then the rest length of that spring, what is the length that it wants to be, we'll call that length, and then the strength of that spring. This is a number between 0 and 1, where 1 would be very rigid. As if there's a metal rod between those two particles. And all the way down to 0, very elastic as if it's just going-- the particles are going to melt away and not be able to hold together. I'll make a new variable called spring. Then spring is a new VerletSpring2D that connects particle a and particle b, maybe a rest length of 100 pixels. And let's try a strength of 0.5. What did I forget? I also have to add the spring to the physics world. And there we go. Did you see that lovely little bounce? Boing. It's kind of amazing that it just stays perfectly upright. I assume if I move, maybe, the particle over a little bit, yeah, it's going to fall over. Now remember, there's no geometry here. The spring is just a force that's acting between those two particles. But I could draw a line to help me visualize what's going on. Let's add a third particle. [MUSIC PLAYING] And let's connect particle b to particle c. [MUSIC PLAYING] Whoa, what just happened there? It's really hard to understand what's going on without all of the elements being drawn, which is something you could use to your advantage, depending on what application you want to make. But let's draw that other line. [MUSIC PLAYING] Aha! OK, next, I want to show you how I can make this interactive. So something that you can do with a particle is you can lock it into place. For example, if I were to say particle a lock, now everything is going to swing from particle a. And in fact, I have a nice little double pendulum simulation already going. But once I've locked a particle, I can also manipulate its xy position without it participating in the physics. [MUSIC PLAYING] And then unlock it. So now, as I move the mouse around, I can kind of swing this lovely little double pendulum all over the place. Let's have that only happen if I'm holding down the mouse. The logical next step would be I've got a connected to b, b connected to c. Let's connect a to c. [MUSIC PLAYING] And there we go. I've got a nice, little squishy triangle now that I can toss around and enjoy. Now, if you look at this code, it's a lot of repetitive stuff. I mean, I'm numbering things abc, 123. I could definitely use an array. I've got to say add particle for everything. I've got to draw all the circles and line separately. There has got to be a better way. So what I want to do is completely reorganize this code in a way that will allow me to expand it to create much more sophisticated soft body shapes. Let's take a minute to think about what it is that I want to do here. I currently have a shape that has three points, all connected with springs. But maybe what I really want is to make some kind of blobby