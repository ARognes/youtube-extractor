transcript: How do you get like what what advice would you have to somebody get getting enough interested in a topic to have so much to say about that topic? >> Wow, I like how you framed that. Gives learning this secondary angle, right? You learn so that you can become more interested. Like if you have a passing interest in something and then you learn more about it, it almost makes you more interested in learning even more about it. Or you'll learn that you're not that interested or something, but it gives you this this secondary thing. Like the more I learn about CSS, the more I want to know, you know? Or just web technology in general. Makes me more curious about like how does this interact with that? What's the security model here? How is this implemented? What's performant and what's not performant? Like deeper subjects than just like the surface level how does this thing work? But I would never be asking those deeper questions if I didn't understand how the surface worked uh to begin with. So, I like that. And and writing might be your way in there.
