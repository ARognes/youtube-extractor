transcript: again we find ourselves kind of in another problem with the kind of the whole rust project leadership uh again this time not about trademarks this time about kind of an incident that that went on with someone being invited to give a keynote gave all their presentation materials everything was approved and then at the last moment got downgraded and effectively have walked away from the rust conference a lot of time and effort spent in crafting and creating a good presentation completely thrown away if you haven't checked out this article I'll link in the description go read it uh there's some Twitter uh notes on this and all that feel genuinely bad uh about this whole situation honestly sounds terrible seems terrible I just wanted to give some thoughts though just what I've been thinking about rust so if you don't know me I've Loved using rust I've done obviously a lot of work on it I've done a lot of streaming about it a lot of educational material built a course on it it's on front end Masters huge fan of the language I love the type system I love how traits work plenty of things to sing its praise about absolutely a joy to work in and for me when I when I see these things happen with the rust Foundation they're handling of the trademark stuff now the rust project and how they're handling this conference talk and how they're communicating and all that kind of stuff uh it just makes me sad you know it makes me sad because I feel like it's a really amazing piece of technology but the leadership just seems to constantly be running into problems and you know when this all started uh the the trademark stuff someone made a fork of the rust language called crablang I never really participated in any of it because I was like you know I don't think this is the right move I don't think it's really healthy to do this but honestly more and more I look at that actually as something that is healthy that this Fork is actually going to be something that is beneficial because it really is stating hey we are kind of tired of whatever is happening this lack of transparency these weird opaque decisions that are made people getting hurt and all that we want to see something better and I am sorry to anyone that's been hurt I'm sorry to anyone that's gotten any sort of flack I'm sorry for anyone that's just gotten mean comments even though they've done nothing in their part to say the rest leadership because I'm sure there's plenty of good rust leadership people out there but in the end we the people who help make Russ successful we the people that are making courses you know talking about it making memes about it doing good work we all feel really unsure about its future and we would love to see Russ project the Russ leadership just be more transparent and maybe a changeup is needed you know I know there's a whole RFC about the change up they're going through a change up right now I'd love to see it I'd also love to see just better moderation I don't know if you saw this right here but this this whole like uh I'm no longer speaking was all linked on Reddit and then someone just came in the mod just came in said here here's what the article is about and guess what no one gets to talk and it's just like again it just it's just this constant feeling like no one knows what's happening and everyone always feels odd about what decisions are made we always feel like we're under some sort of just weird authoritarian structure with him I'd love to just see something different um obviously Big Time supporter really do love rust love to see become successful even more successful than it is now but whatever's happening now just doesn't feel good and I really do hope that the people that are making the influential decisions of rust can turn the ship around and kind of restore the confidence to everybody the name is the prime machine
