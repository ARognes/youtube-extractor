rking on bugs and not working on product anymore. Um but it made perfect sense and every every company should have a zero policy like the the reasoning that we had and it's a simple sort of not even mathematical formula but it's a formula. It's like you have bugs, bugs will always be introduced into your product when people work on new functionality. You will be introducing bugs at a constant rate. So then the question is like when do you fix them? Like you have to at some point fix them because otherwise you have a defect product and you will just accumulate the bugs. So what people sort of tend up nowadays doing is like at some point they they start to ease the curve so that you know the the bugs remain super high but at constant level. So they they keep on fixing bugs as quickly as as new new bugs are sorry introduced. what you end up with is a product that has a lot of bugs uh but you still have to use the same amount of work in order to fix bugs if that makes sense. So our thinking was isn't it better to pay a bit up front and the cost isn't really that high to just decrease that bug count to zero and after that work there's no extra work in the zero bug policy. You you still working as much as any company in fixing fixing your bugs. What your users get out of it is first they get a bug free product which in itself is great. Secondly, I think the change engineers in in some way where they know that they have to fix a bug immediately when it comes in. That's the highest priority. So, it might be that you you won't be creating that bug in the first place or you test your your functionality a bit better before shipping it. And thirdly, and this is maybe the the biggest thing is like your customers will be in awe like when they report a bug and you know 12 hours later that bug is fixed and they get an email saying, "Oh yeah, refresh and and you're good to go." They will just be delighted by by your product. And that again is is quality of of your product. >> What's