lds true as well. If you don't do anything, if you don't innovate, if you don't build, you know, more functionality, you end up sort of getting displaced by something. It might be that it's AI, it might be that it's a competitor of yours. I I think we know what we want to build that will make linear better with AI and that will help us actually you know become even you know even a greater um application you know as as AI becomes you know more and more performance and um and and better at coding things up or making decisions and um you know we we're having the effectively the entire team execute on on on that mission and time will tell you know how how how that will work out. I think we're living in a super interesting time where anything can change at any given point in time and uh people will come up with new use cases and AI will will will make some you know some use cases that were otherwise really really hard to implement trivial in in in in the future but I'm I'm excited you know about that future like regardless of whether we win or or not I think the feature is is great. uh you guys introduced uh agents for linear and so if I understand that correctly, you're treating an agent as another team member and so there's no reason that they couldn't pick up a bug and then sort of fix it on its own and make sure that the state of the issue is is tracked correctly and and get it all the way out to production. Is maybe that an approach to going to zero bug after? >> Yeah, certainly we use that internally already. So our flow um that we have enabled for us and anybody can do that in the in the linear application is um to hook up for example custom requests or you know your support channels be it intercom or you know buck reports from your own own you know people um or then just like literal bucks that happen you know through sentry or or other buck tracking software and have that be piped into what we call triage. Triage is sort of an inbox for all the inbound issues where somebody should have a look at you know what these are and then figure out whether anything needs to be done about them and then assign them to to people. You can automate triage in a way where an agent will have a first look. They will first you know try to figure out who should be responsible for this thing. Um has has there any anybody been working on these kinds of features? Is it a bug? Is it a performance regression? What is it? And it will auto label um the issue and assign it to somebody somebody else. You can also add a coding agent to that triage. So, every single issue that comes into your triage inbox can be looked at and then you can have an agent trying to solve that problem. Currently, I I think the success rate is maybe at the 30%. Um, like it's it's not that easy to to fix some of these, you know, larger problems, but at least you will have, you know, a PR waiting for you when you get, you know, that issue assigned. Somebody has looked at it and tried to figure out what needs to be done here, pointing to the right files, giving a detailed description of like, oh, maybe where the where the problem might be. Um, so even if it's not fully successful, it will still help you figure out the problem. And I do think that that success rate will will just increase um as agents get better. I'm sure with you know, Opus 4.5 or uh codeex, you know, fear 5.3. Like I haven't looked at the percentages yet, but I'm sure it will sort of be in the realm of 50%, 60% maybe the success rate. >> Where is linear in 3 years? >> Linear in three years. It's hard to say where we will be. I I wouldn't know. Uh I think we will be in a like again this would be my guess like cuz I I don't know where where the AI industry is heading. Um it might be that all of coding happens with agents or it might be that you know we're in a world similar to ours today where like you just can't make much more progress on on on the quality of coding agents or might be somewhere somewhere in between there. But [snorts] what I think will happen with linear is that you know the focus will go more from the actual issue tracking that we started with to sort of the man project management aspect of things. If you have agents capable of doing large swaths of of of coding work and you know even creating or building out features and you know long running features having sessions of like a few days of working out and and shipping an actual feature then I think the the aspects of like what a project management system you know goes more into the direction of like helping you figure out what needs to be built instead of like focusing on the actual building of it. And we to today have this duality like if you're a PM you really don't care about issues anymore like you work on the project level and the initiative level uh in linear and you you look at inbound customer request and trying to sort of get a sense of what is it that the the product that you're building you know should be um and if you're an IC you you work on on sort of you know the the downstream of this which is like you look at your issues look at your projects that you're assigned to and trying to figure those out um that definitely will change you will be using more agents um and you do more delegation And um Liner will probably help you in in some way sort of manage you know your or orchestrate your your agent layer and your your coding agents and then review their work. Um so that is something that we're building out today hopefully you know shipping them shipping that soon um and then you know improving on that. So for IC's we should make your life easier um of orchestrating agents and for PMs we we hopefully will make your life easier on getting all that sort of inbound streams from all your your peers and your customers and providing a context um for you to work on and you know obviously provide agents as well to go through that context and help you make good decisions. >> So bullish or bearish on so