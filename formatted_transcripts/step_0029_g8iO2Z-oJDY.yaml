cture. Um and now your job as an infrastructure engineer or you know backend engineer becomes fighting the fires and and and turning it off. Um so for the next two years while you're scaling crazy um you're just fighting fires and after those two years your whole team you've hired first of all like thousands of engineers to to to to keep the flames off and um what you end up being is like you know you've got all these teams that are burned out pile of ashes and um then you need to start everything again like you need to start building the the actual infrastructure while your application is still running and that will be a four-year effort and I don't want I didn't want to go through that. I I wanted to see if we could um you know again be maybe a bit optimistic about this thing like we we started in an industry where we knew that um it had existed already for 25 years like Atlassian had been around for for ages and everybody in the industry was using project management software so it wasn't a question of you know whether this will stick um the question was like you know whether we will just you know build a good enough product for everybody to come over and at least get the IC's and maybe from there we can go into you know the product managers and CEOs and CIOS We took the time to sort of lay the groundwork perfectly like from day one we went into GCP and put up a cured cluster which you wouldn't do if you were a startup trying to find product market fit and built you know half a year of synchronization engine engine work and the whole infrastructure team has always been you know working like that like we we we know what the bottlenecks are and we know them maybe a year or two years in advance like we know when things will going to will will we break so we have plenty of time to figure these things out and implement you know changes without ever having to fight fires. >> If you started linear in 2026 instead of 2019, what would you do differently? >> Maybe I would d