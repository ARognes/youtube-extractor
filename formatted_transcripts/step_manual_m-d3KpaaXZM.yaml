transcript: '{"content":"\n[0.0s] I recently saw a comment online to the\n[2.52s] effect that I''d lost somebody''s interest\n[4.76s] because I seem to be making a judgement\n[6.84s] about what true Buddhism consists in\n[10.04s] based on a curated set of texts and\n[13.04s] interpretations that I personally\n[15.24s] resonate with.\n[17.08s] This is a criticism that I get every\n[19.2s] once in a while and it''s it''s worth my\n[21.12s] taking seriously.\n[23.36s] There is something right in it\n[25.76s] and also something that''s very\n[27.4s] importantly wrong.\n[29.56s] Well, what''s right about it? Yes, I do\n[32.04s] tend to focus on a particular slice of\n[34.76s] the Buddhist tradition.\n[36.56s] I make judgements about what I find\n[38.68s] compelling, no question.\n[41.76s] But what''s wrong about the critique?\n[44.32s] The inference that this means that I''m\n[46.56s] claiming that the slice of the tradition\n[49.12s] that interests me is the true or\n[52.36s] authentic Buddhism.\n[54.72s] That is not at all my intention.\n[57.36s] So, I want to spend this video\n[58.64s] explaining why those two things, that is\n[62.24s] my personal focus and the claim that\n[65.199s] my personal focus is the real Buddhism,\n[68.0s] aren''t at all the same move.\n[70.48s] Now, I believe that what I''m studying it\n[72.88s] or and discussing is a true Buddhism,\n[77.52s] but that''s a very different claim.\n[79.91s] >> [clears throat]\n[81.0s] >> Some years ago I did a video on what is\n[83.92s] authentic Buddhism.\n[85.92s] That video took up a related question\n[88.4s] from inside the tradition. That is, what\n[91.64s] do the early suttas themselves say about\n[95.04s] authenticity?\n[97.36s] This video is going to be different, a\n[98.84s] kind of companion video to that one.\n[101.76s] It''ll be about the meta-level question.\n[104.28s] That is, what does it mean to study\n[106.68s] early Buddhism at all?\n[109.4s] Is the category itself claimed\n[112.36s] authenticity?\n[116.04s] >> Early Buddhism is a category from\n[118.52s] historical critical scholarship. It''s\n[120.88s] not normative.\n[123.04s] It refers to what scholars can\n[124.6s] reconstruct about the teachings closest\n[127.56s] in time to the Buddha himself.\n[130.24s] Sometimes called pre-sectarian Buddhism.\n[134.08s] That is primarily from the early strata\n[137.12s] of the Pali Nikayas and their parallels\n[140.64s] in the Chinese Agamas, Gandhari\n[143.0s] fragments, and other early collections.\n[147.8s] This is the same kind of work that gets\n[150.12s] done on any ancient tradition through\n[152.4s] its texts.\n[153.92s] The ancient Greek thinkers, the various\n[156.76s] strata of the Bible, of Beowulf, and so\n[160.12s] on.\n[161.68s] The key point here is that when scholars\n[163.52s] use the word early,\n[165.44s] they mean chronologically early. They\n[168.2s] don''t mean most authoritative, or most\n[171.52s] authentic, or closest to the truth.\n[174.8s] Those claims are different entirely.\n[179.64s] This is the basic point I want to get\n[181.4s] across.\n[182.8s] Historical priority is a factual claim\n[186.28s] about what teachings came first in time.\n[190.6s] The early Buddhist texts are, by\n[192.92s] generally accepted scholarly consensus,\n[195.44s] the earliest layer of Buddhist\n[197.68s] literature that we can access.\n[200.44s] Normative priority is a claim about\n[202.84s] what''s better, what''s more true, what''s\n[205.8s] more authoritative, or more authentic.\n[208.84s] Now, whether earlier teachings are\n[210.88s] better than later ones is a completely\n[213.64s] separate question that requires its own\n[216.2s] arguments.\n[217.76s] The mistake is when we run these two\n[220.04s] together.\n[221.32s] Earlier [snorts] itself doesn''t mean\n[223.04s] better.\n[224.16s] Now, it also doesn''t mean worse. It''s\n[226.28s] just a claim about chronology and the\n[228.56s] historical development of ideas.\n[232.04s] Let''s take an analogy.\n[234.52s] Some scholars specialize in pre-Socratic\n[237.8s] Greek philosophy.\n[239.84s] That is philosophy from thinkers who\n[241.92s] lived before Socrates.\n[245.36s] Scholars of these pre-Socratics don''t\n[247.959s] typically claim that let''s say for\n[249.88s] example example Heraclitus'' views\n[253.56s] Heraclitus if you want to say his views\n[255.64s] were truer than Plato''s or Aristotle''s.\n[259.04s] They study the earlier period because\n[260.6s] they find it intellectually interesting\n[263.28s] and historically important.\n[267.0s] The conflation of historical and\n[269.04s] normative priority is often what people\n[271.68s] are actually objecting to when they\n[273.6s] object to early Buddhism talk.\n[277.919s] And it is a worry worth taking seriously\n[280.56s] because the conflation does happen.\n[283.68s] Sometimes from writers and teachers\n[285.84s] focused on the early material.\n[290.68s] Now I did a video about Protestant\n[292.64s] Buddhism a while back which I''ll leave a\n[294.88s] link to down below in the notes.\n[297.28s] The idea of Protestant Buddhism stems\n[299.96s] from work by Richard Gombrich and\n[302.6s] Gananath Obeyesekere in the late 1980s.\n[306.56s] And it''s an also there''s an ongoing\n[308.919s] critique by scholars contemporary\n[311.04s] scholars like Gregory Schopen and Donald\n[313.76s] Lopez and others that that Western\n[315.84s] engagement with Buddhism has been shaped\n[318.48s] by a what they call Protestant model of\n[320.96s] religion.\n[323.56s] That is it''s one that''s\n[325.8s] in ways similar to Christian\n[327.76s] Protestantism\n[329.44s] privileges scripture over practice\n[333.08s] privileges the original founder over the\n[335.32s] later tradition\n[337.12s] and privileges our own individual access\n[339.84s] over communal authority.\n[343.24s] On this model\n[345.44s] early text is taken to mean most\n[348.76s] authentic texts.\n[351.0s] And it''s also taken to mean what''s\n[352.72s] really the most true about the\n[354.52s] tradition.\n[356.48s] After all, that''s the move that the\n[358.08s] Protestants made in the Christian\n[360.16s] Reformation.\n[361.92s] Their claim for what''s called Sola\n[363.92s] Scriptura, or only scripture. That is,\n[367.16s] it''s only scripture that matters as to\n[369.88s] what is really\n[371.44s] most important in the tradition.\n[373.72s] As as versus, for example,\n[376.76s] traditional Catholic authority over\n[379.16s] interpretation of the scripture.\n[383.8s] Now, this kind of move is a legitimate\n[386.48s] concern in Buddhist studies, and I I do\n[388.72s] take it seriously. It''s It''s why I''m\n[390.36s] careful about how I frame my own work.\n[394.56s] But the response to it is not to abandon\n[397.16s] a historical critical study of the early\n[399.32s] texts.\n[401.24s] That would be like saying that\n[402.6s] historians should stop studying early\n[405.0s] Christianity because it might encourage\n[407.52s] Protestantism.\n[410.8s] The response instead is to remain clear\n[413.24s] about what we''re doing and what we''re\n[414.56s] not doing.\n[416.64s] Studying early texts is one legitimate\n[419.32s] angle on Buddhism\n[421.2s] based on personal preference.\n[423.72s] It''s not a verdict on the tradition as a\n[425.72s] whole.\n[429.44s] Yes, I admit to finding the early the\n[431.6s] early material the most compelling.\n[434.96s] Not because I think it''s the most\n[436.44s] authentic sort of Buddhism,\n[438.88s] but because of features that are\n[440.24s] specific to it that I resonate with and\n[442.84s] can articulate.\n[444.76s] Such as,\n[446.6s] first, it''s philosophical directness and\n[449.12s] clarity.\n[450.76s] The early texts present a teachings in a\n[453.52s] form that engages directly with\n[455.4s] questions that I find pressing.\n[458.48s] The nature of the person and of mind,\n[461.2s] the structure of suffering,\n[463.4s] and of how to ameliorate ameliorate\n[465.52s] suffering\n[466.72s] without yet being heavily overlain by\n[469.76s] sophisticated metaphysical systems.\n[474.68s] Second, the the figure of the Buddha as\n[476.76s] a human teacher.\n[479.24s] In the early texts, the Buddha is\n[481.2s] largely, though not entirely, largely\n[484.24s] presented as a real human being with\n[487.08s] pains and foibles,\n[489.4s] who figured something out for himself\n[491.52s] and taught it to others.\n[493.68s] That''s a figure that I can engage with\n[496.08s] on a human level.\n[499.28s] Third, the humanism of the Buddha''s\n[501.52s] approach.\n[503.64s] In the sense that the Buddha spoke of\n[505.84s] human lives and interests, rather than\n[509.12s] the goals and interests of deities or\n[511.68s] other exalted beings.\n[515.64s] Fourth,\n[517.08s] conversation with Western philosophy.\n[520.28s] The early material has a clarity, as\n[523.159s] well as a kind of analytical,\n[525.48s] argument-driven quality that connects\n[528.36s] naturally to the tradition that I was\n[530.28s] trained in, which is Western analytical\n[532.56s] philosophy.\n[534.8s] This is one of the things that I find\n[536.2s] most interesting about it.\n[539.48s] And fifth,\n[541.48s] it involves a practice that doesn''t\n[543.44s] require me to believe things that I find\n[546.16s] implausible.\n[548.32s] Now, I''m going to admit this is more\n[549.88s] controversial, for sure.\n[552.4s] But my reading of the early teachings is\n[555.0s] that while they absolutely do include\n[558.08s] claims about things like rebirth,\n[562.44s] the Buddha''s approach in suttas like the\n[564.44s] one to the Kalamas provides a way to\n[567.44s] accept the heart of what the Buddha\n[569.08s] taught us regarding the path\n[571.92s] without necessarily accepting everything\n[574.36s] that he said.\n[576.76s] So, these are some of my reasons.\n[579.24s] They''re not arguments that everyone''s\n[580.76s] going to find compelling and and I\n[582.12s] wouldn''t expect them to.\n[584.64s] If you find a Zen or Pure Land or\n[587.72s] Vajrayana literature and practice more\n[590.12s] compelling,\n[591.68s] or for that matter Christianity or Islam\n[594.48s] or your own personal take on life,\n[597.92s] then you''re finding something real and\n[599.68s] valuable that you''re going to have your\n[601.4s] own reasons for doing.\n[606.52s] Now, in staking out my own viewpoint as\n[609.08s] as well as in pushing back on this true\n[612.08s] Buddhism framing,\n[614.04s] I''m not saying that the Buddha didn''t\n[615.72s] care about getting his teachings right,\n[617.48s] not at all.\n[619.28s] He clearly did care. He He argued with\n[621.72s] his contemporaries.\n[623.52s] He chastised monks who misrepresented\n[626.36s] his views such as Arittha and Sāti in\n[628.92s] different suttas.\n[631.52s] He also gave what amounted to functional\n[634.24s] criteria for what his\n[636.16s] what counted as his teaching.\n[639.52s] That is,\n[641.52s] his teaching\n[643.44s] his teaching involved things that led to\n[645.48s] dispassion rather than passion.\n[648.839s] To fewer desires rather than more.\n[652.44s] To seclusion rather than crowds and so\n[655.28s] on.\n[656.6s] Now, these are not textual criteria.\n[660.12s] He''s not saying that only the early\n[661.76s] words are the good words.\n[664.8s] They''re criteria about how instructions\n[666.88s] might function in our practice, what\n[669.16s] they might get us to do.\n[672.12s] So, there''s an important difference\n[673.56s] between saying on the one hand that some\n[676.839s] readings of the Dharma are more accurate\n[678.92s] than others and and we can give you\n[680.4s] reasons why, which I do believe is the\n[682.88s] case,\n[684.2s] and early Buddhism is the only true\n[686.4s] Buddhism, which I don''t believe is the\n[688.16s] case.\n[690.36s] The first of these is just being\n[692.4s] intellectually honest, frankly. For\n[694.52s] example, in saying that the Buddha\n[695.72s] taught rebirth. That''s an accurate\n[698.04s] understanding of the early texts. And\n[700.56s] I''ll say that even though I leave that\n[702.8s] approach aside in my own personal\n[704.68s] practice.\n[707.24s] The second of these approaches that\n[708.96s] early Buddhism is the only true Buddhism\n[711.32s] or is the truest form of Buddhism\n[714.0s] is unjustified sectarianism\n[716.76s] or a kind of superiority conceit and\n[719.72s] bigoted to Analayo''s description in a\n[721.88s] book of that title. I''ll leave a link to\n[723.16s] the book down below.\n[727.28s] Okay, the name of my channel is not\n[729.4s] accidental.\n[730.96s] I call it Doug''s Dharma because what I''m\n[733.56s] offering here is one person''s engagement\n[736.8s] with the tradition.\n[738.84s] One person''s path. One person''s reading.\n[742.4s] One person''s understanding.\n[745.2s] One person''s particular set of\n[747.04s] idiosyncratic\n[748.72s] interests and curations.\n[753.0s] Now, I don''t say this to hedge. It''s the\n[755.28s] straightforward reason.\n[757.4s] And let''s be clear. Every reading of\n[759.96s] Buddhism is curated by somebody.\n[763.44s] Every teacher selects some things from\n[766.72s] this vast corpus of Buddhist materials\n[770.6s] and doesn''t select others.\n[774.08s] Every teacher emphasizes certain aspects\n[777.56s] over other aspects.\n[779.64s] And is going to interpret in certain\n[781.36s] ways and not other ways.\n[784.72s] So, the question in front of us is not\n[787.04s] whether to curate\n[788.92s] since there''s no other option than to do\n[791.24s] so.\n[792.76s] The question is whether to be\n[794.2s] transparent about the principles for\n[797.36s] guiding our curation.\n[800.4s] Now, I''ve tried to be\n[802.64s] upfront about my principles, but here\n[804.88s] they are roughly.\n[806.92s] First, that historical critical\n[809.08s] scholarship is a starting methodology\n[811.36s] for getting to know this material up\n[813.68s] close as it might have been intended to\n[816.52s] its early audiences.\n[819.72s] Second, that engagement with other\n[821.68s] traditions, particularly the philosophy\n[824.4s] of mind and of Western philosophy\n[826.48s] because it''s it''s what I know that\n[828.08s] that''s possible and important.\n[832.32s] And third, a belief that the early texts\n[834.76s] can inform questions of contemporary\n[837.6s] life\n[839.08s] including some of the most pressing and\n[841.12s] cutting-edge questions.\n[844.16s] Now, other people are going to have\n[845.72s] their own principles, of course.\n[848.48s] Whether it''s Zen or Tibetan or Pure\n[851.36s] Land, Theravada,\n[853.36s] whatever, each person is doing something\n[856.6s] legitimate and is going to have their\n[858.04s] own set of principles for managing their\n[860.48s] own curation of the tradition.\n[863.88s] None of us I mean I should I should get\n[865.68s] this clear. None of us is doing Buddhism\n[868.12s] in general\n[869.4s] because Buddhism in general is not a\n[871.24s] thing.\n[872.6s] Buddhism''s plural exist and each of them\n[875.32s] is the curation of of somebody or of\n[877.56s] some group of people.\n[882.12s] So, the commenter that I started with\n[884.2s] said that they lost interest because I\n[886.32s] seem to be making a judgment about the\n[888.92s] what the one true Buddhism really is\n[892.16s] based on a particular selection of\n[894.76s] texts.\n[896.92s] Now, I have not used that kind of\n[898.76s] framing in my videos.\n[901.04s] Indeed, I try to actively push back on\n[903.2s] it when I encounter it.\n[905.56s] All I would say is that early Buddhism\n[908.08s] is one kind of true Buddhism among many\n[911.48s] others.\n[913.4s] Early Buddhism, the way I use the\n[915.28s] phrase, is a scholarly category.\n[918.839s] It''s historical critical work on the\n[921.04s] earliest reconstructible layer of this\n[923.72s] vast Buddhist tradition.\n[927.28s] It''s the slice of Buddhism that I tend\n[929.32s] to find the most compelling, though to\n[931.68s] be fair, not always and not exclusively.\n[935.68s] But it''s not a claim that other forms of\n[937.68s] Buddhism are somehow inauthentic.\n[941.24s] Nor is it a claim to have access to the\n[944.04s] real Dharma that other traditions have\n[946.28s] missed.\n[948.32s] And it''s certainly not a verdict on what\n[950.16s] anyone else should find valuable or\n[952.32s] useful.\n[954.4s] If those distinctions land with you,\n[956.88s] then the rest of my work here is going\n[958.36s] to make a lot more sense.\n[961.36s] If you want an\n[962.76s] a more sort of early Buddhist take on\n[965.0s] what authenticity in the Dharma consists\n[967.76s] in,\n[969.0s] take a look at my earlier video on the\n[970.64s] subject, which is going to be up here on\n[972.56s] the screen in a moment.\n[975.04s] Meanwhile, I''d be interested, what are\n[976.84s] your thoughts on authenticity?\n[979.76s] Let us know down in the comments.\n[982.12s] As always, there are no wrong answers\n[983.96s] here. We''re just trying to get some\n[985.24s] material out there and discuss.\n[988.08s] Thanks so much for your continued\n[989.44s] practice, and please, all of you, be\n[992.44s] well."}'
