transcript: One question you have to ask yourself is like, can I can I help these people, you know? And sometimes the answer is no, but sometimes the answer the no is not obvious. Like sometimes it's like I I technically don't have the a technical capability to help them, and that I would say is very rare. Like it's very it's very rare. Like and I'm not saying it's rare for me. I I think a lot of people would be surprised at how little you have to not little, but like people think you have to know so much to be able to help a company. Uh you know, [clears throat] you just have to know a little bit more about the problem or and a lot of it's pattern recognition. Like I've been in two companies, I know what problems they have there, I know how we solved them. I'll just apply the same thing. Like you're not recreating the wheel a lot of times. So, can I help them? So, the technical thing, yeah, I can help them technically. Can I help them board-wise? Like will they allow me to come in and teach them and to help them and support them to solve the problem that I know how to solve. That's a different question.
