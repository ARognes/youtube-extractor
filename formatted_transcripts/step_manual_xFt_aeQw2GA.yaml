transcript: '{"content":"\n[1.904s] Прикриването на злоупотреби.\n[14.731s] За Чарлз и Тери.\n[19.472s] Виждал съм хора, изпълнени с морални добродетели, да вършат лоши неща, и всеки ден се убеждавам, че благоприличието не се нуждае от правила. — Албер Камю, \"Митът за Сизиф\"\n[35.163s] Зловредните индивиди и групи използват различни методи\n[38.59s] за да принудят своите цели да бъдат подчинени.\n[41.26s] Всеки метод има за цел да стимулира специфични психологически механизми.\n[45.94s] Някои са насочени към предизвикване на срам.\n[48.0s] Други се опитват да внушат чувство за безпомощност и зависимост.\n[51.8s] Други са насочени към създаване на силно объркване.\n[55.02s] Но целта винаги е една и съща:\n[57.486s] тренирайте жертвите да се съмняват в собствените си преценки и да спрат тяхното самостоятелно мислене.\n[62.94s] След това манипулаторите могат постепенно да наложат своите правила —\n[66.18s] правила, които могат да променят по всяко време по желание, и жертвите ще трябва да приемат това без съмнение.\n[71.796s] Манипулаторите също могат да изолират жертвата\n[74.44s] далеч от хората, които биха могли да й помогнат да избяга.\n[77.18s] Жертвите се научават да презират или дори да се страхуват от тези потенциални източници на подкрепа,\n[82.495s] което ги оставя наистина отрязани.\n[84.84s] В здрави семейства, докато растат,\n[87.373s] децата се научават да предприемат прогресивно все по-големи стъпки.\n[90.78s] Те рискуват по-дълги непридружени проучвания на техния свят\n[94.52s] където се сблъскват както с добри неща,\n[96.58s] така и с не толкова добри неща.\n[98.76s] Подкрепени от знанието, че могат да се върнат в безопасност, ако се чувстват претоварени,\n[103.08s] те се научават да се справят с лошото\n[104.98s] и да се наслаждават на доброто.\n[106.6s] Тяхната самостоятелност се увеличава и техният свят се разширява.\n[111.04s] За жертвите на манипулативните групи този процес на развитие върви в обратна посока.\n[116.114s] Те се научават да правят по-малки стъпки.\n[118.38s] Те са обезкуражени от взаимодействията с външния свят, който е изобразен като враждебен и опасен.\n[124.56s] Те са научени, че доброто съществува само в групата.\n[128.12s] Тяхната самостоятелност намалява и светът им се свива.\n[133.04s] Парче по парче, те предават своята независимост\n[136.58s] и се поддават на нарастващ контрол, над тях.\n[139.32s] Когато са изправени пред дилеми, те се научават да не се доверяват на собствените си разсъждения\n[143.42s] а да търсят съвет, насока и одобрение от групата.\n[147.92s] Ще им бъде казано да правят неща, които причиняват огромно безпокойство и страдание, дори скръб,\n[153.704s] като да демонизират добри хора\n[155.653s] и отчуждават хора от семейството, които не са съгласни с групата.\n[158.94s] Ще им се каже, че трябва да бъдат \"смели\"\n[161.329s] и да не се поддават на тези погрешни емоции.\n[164.4s] \"Групата е тяхното истинско семейство.\"\n[166.5s] Но техните емоции не са погрешни.\n[168.92s] Болката, която изпитват, е доказателство за тяхната човечност\n[172.177s] — тяхното постоянно чувство за честност, състрадание и справедливост.\n[176.28s] Но тези качества са вредни за групите\n[179.37s] които търсят едно нещо от жертвите си: подчинение.\n[183.38s] И жертвите ще бъдат многократно принуждавани да избират\n[186.05s] между това, да са лоялни към групата или да са верни на своята човечност.\n[190.56s] Този избор може би никога не е по-важен\n[193.5s] особено когато дадена жертва стане наясно, че дете от групата\n[196.94s] е отправило обвинение за сексуално насилие срещу друг член.\n[201.16s] Дали първата мисъл на жертвата е за благосъстоянието на детето или репутацията на групата?\n[206.64s] Техният отговор ще даде представа за тяхната човечност.\n[210.6s] Искам да разгледам исторически случай и текущ продължаващ случай\n[214.42s] за манипулативни групи, които се опитват да прикрият насилието.\n[218.18s] И искам да благодаря на истински смелите личности\n[221.86s] които са работили, за да ги разкрият.\n[230.521s] Дръжте всичко в \"семейството\".\nТова беше систематичен тормоз — и част от доктрината.\n Джим Ла Маттер, член на \"Божиите деца\"  в продължение на 5 години.\n[237.94s] През 1968 г. в Калифорния Християнският свещеник Дейвид Бърг\n[242.23s] основал групата „Тийнейджъри за Христос“. По-късно станала известна като:\n[246.31s] „Божиите деца“, „Семейството“, „Семейството на любовта“\n[250.66s] и накрая сегашното му име: „Международно Семейство“.\n[254.68s] Представил се като бащин пророк Бърг предсказал, че светът ще свърши през 1993 година\n[260.592s] и накарал последователите непрекъснато да проповядват Евангелието, за да съберат колкото се може повече души.\n[266.0s] Децата често са изпращани в ресторанти и фирми\n[269.18s] да пеят песни и да споделят своята вяра.\n[271.86s] Последователите са живели в групи, наречени колонии\n[274.72s] и животът в групата бил строго регулиран\n[277.06s] с правила за всичко — от прическите до консумацията на напитки до тоалетната хартия.\n[281.76s] Всеки, който поставил под въпрос идеите на Бърг, бил строго порицан.\n[285.54s] Бърг, който наричал себе си „Мо“ — съкратено за Мойсей — бил самотна фигура.\n[291.12s] Подпомаган от съпругата му Карън Церби\n[293.72s] която се обявила за кралица и се преименувала на „Мама Мария“\n[298.05s] Бърг предавал идеите си, заповедите си\n[300.66s] мечтите и откровенията си пред групата\n[303.74s] чрез сензационно озаглавени писма, наречени \"писма на МО\".\n[307.34s] Те включват чести тиради срещу хора от външния свят, означени като „Системити“.\n[312.84s] Най-удивителното, е че \"писмата на Мо\" били наситени\n[316.11s] с описания и илюстрации на секс\n[319.22s] включително изображения на Бърг, прелъстен от деца.\n[323.12s] Историята показва, че самозваните божествени пророци създават богове по свои собствени образи.\n[328.42s] Доктрините на Дейвид Бърг отразявали собствените му сексуални желания.\n[333.22s] Той свел Християнското писание до едно правило, наречено \"Закон на любовта\".\n[338.22s] Докато това се правело с любов, Бърг твърдял, че спазвало закона за любовта на техния Бог.\n[343.26s] Бърг използвал тази доктрина, за да се одобрява секса с почти всеки\n[346.92s] стига да бил направен с любов\n[348.68s] включително между деца и роднини.\n[351.08s] Той нарекъл това „споделяне“ и само мъжките еднополови връзки били забранени.\n[355.818s] Бърг насърчава последователите си да му изпращат сексуално откровени домашни видеа.\n[360.58s] Той особено се радвал на видеоклипове на еротични танци.\n[363.868s] В един филм от членове на семейство от Гърция\n[366.5s] 20 възрастни и деца изпълнили стриптийзи\n[369.86s] по музиката на Ричард Клейдерман и Мантовани.\n[373.16s] Бърг също използвал видеоклиповете, за да подбере невръстни булки.\n[377.1s] Ейми Брил, която избягала от групата след самоубийството на баща си\n[380.82s] каза, че е била транспортирана до тайната резиденция на Бърг и се е омъжила за него на 13 години\n[385.62s] след представянето й във стриптийз видеоклип.\n[388.5s] В началото на 70-те Бърг въвел религиозната проституция\n[392.74s] причудливо преименувана „ Flirty Fishing (Флиртуващ Риболов)“ — или „FFing“.\n[397.6s] Той попитал жени членове дали са готови да бъдат заковани\n[401.26s] като библейския Исус бил прикован към кръст\n[404.669s] и да ги изпрати да прелъстят непознати.\n[407.16s] В писмо от Мо, наречено „7-те F на FFing“\n[409.703s] той очертал различните начини, по които тези непознати — наричани „Риби“, могат да обслужват групата.\n[415.06s] Някои просто биха финансирали групата чрез плащания за секс.\n[418.08s] Някои биха станали членове.\n[419.86s] Някои от позиции на власт дори биха могли да осигурят политическа подкрепа.\n[424.94s] През 1975 г., след \"Флиртуващ Риболов\", със хотелски работник в Тенерифе\n[429.88s] Съпругата на Бърг, Карън Церби родила Дейвид Моисей Церби, по прякор Давидито\n[436.06s] който Бърг третирал като свой собствен син и наследник.\n[439.147s] Двойката документирала всеки аспект от живота на момчето\n[442.24s] в книга, наречена „Историята на Давидито“\n[444.64s] която Бърг представил като ръководство за отглеждане на деца.\n[448.0s] Тази книга станала дневник за сексуалното насилие над Давидидо.\n[451.52s] Снимки на него през първите му три години били надписани със сексуални намеци\n[456.32s] подсказвайки, че е имал поглед \"ела ми тука\" и се е наслаждавал на тройка(секс между 3-ма души).\n[460.946s] Глава, наречена „Моята Малка Рибка“ го показва\n[463.589s] в множество сексуални актове с една от бавачките му.\n[466.7s] Следвайки доктрините на Бърг и личния пример\n[469.618s] злоупотребата била широко разпространена в групата.\n[472.61s] Верти Картър, която избягала от групата на 15, я определила като „ад на земята“.\n[478.02s] Тя съобщила, че е била малтретирана от четиригодишна възраст от различни членове, включително баща й, който бил осъден.\n[484.98s] Авторката Наташа Тормей, която избягала на 18 години\n[488.14s] също съобщава, че е била насилвана от четиригодишна възраст\n[490.92s] от мъж, наречен „Чичо Клей“\n[492.88s] който упорствал дори когато тя била болна от грип.\n[496.034s] Питър Фруман съобщил, че е бил малтретиран на 11 години от жена на 28 години\n[500.14s] пред одобрителна публика, която включвала майка му.\n[503.7s] Защото сексът между възрастни и непълнолетни е бил нормализиран\n[507.12s] не изглеждало като злоупотреба.\n[509.32s] Силвия Падила о��гледала седем деца в групата.\n[512.22s] Освен да бъдат подложени на натиск за секс с други членове и в проституция\n[516.682s] Силвия в крайна сметка разкрила за малтретирането от което децата й страдали.\n[520.52s] От първите си четири деца, двете най-малки, Виктория и Мириам\n[524.556s] съобщили, че са би подтиквани да изпълняват стриптийзи в ранните си години.\n[528.71s] Втората най-голяма сестра, Деби, е била насилвана на възраст между 9 и 12 години\n[533.18s] от член, на групата живеещ в дома им.\n[535.0s] Разкривайки злоупотребата, Силвия го изхвърлила.\n[538.04s] Но когато Деби била на 15, лидерите на групите започнали да я малтретират.\n[542.18s] Деби била готова да се бори с обикновените членове на групата\n[545.34s] но тя казала, че да отхвърли лидери и се струвало невъзможно.\n[549.04s] Най-голямото дете на Силвия — Шули, не успяла да излезе от групата жива.\n[553.3s] На 15 тя се заразила с лупус\n[555.98s] автоимунно заболяване, което обръща тялото срещу себе си (антителата атакуват здрави клетки).\n[560.02s] Членовете били насърчавани да отбягват модерната медицина\n[562.99s] но за известно време Шули приела лечение с лекарства.\n[566.12s] За да се разсее от болката, тя обичала да чете книги.\n[569.952s] Но книгите били забранени в групата.\n[572.3s] Шули решила да пише на самия Бърг, за да попита дали не би било добре тя да чете.\n[577.54s] В публичния си отговор Бърг намекнал, че лупусът е нейното наказание задето е чела.\n[583.94s] В крайна сметка, чувствайки се виновна и неадекватна, Шули прекратила лекарствата си.\n[590.02s] Тя починала на 17 години.\n[592.5s] По-късно Бърг публикувал свой сън, в който срещнал Шули в рая\n[596.18s] и бил съблазнен от нея.\n[598.42s] Последвало графично описание на сексуалната им среща.\n[601.96s] Скърбящите братя и сестри на Шули се разгневили.\n[605.775s] От самото начало Дейвид Бърг се представил като революционер\n[610.34s] тук, за да обърне света с главата надолу, копирайки Исус.\n[614.66s] От тази побъркваща самооценка\n[617.26s] би трябвало да очакваме този човек, смело да се отстоява на публичната сцена\n[622.14s] безстрашно да проповядва посланието си на масите хора\n[624.98s] открито предизвиквайки авторитетите на своето време с непоколебима убеденост.\n[630.92s] Но Бърг бил менте революционер.\n[633.84s] Той пазел своите доктрини в тайна вътре в безопасните граници на своята предана група\n[638.68s] полагайки големи усилия, за да ги скрие от външни хора.\n[642.2s] Това включвало множество „чистки“\n[644.64s] в които на групата е казано да редактира или унищожава\n[647.28s] сексуално явни публикации, като книгата на Давидидо.\n[650.997s] Членовете били заплашени от отлъчване поради неспазване на нарежданията му.\n[655.24s] Някои писма били обозначени „BAR Pub“\n[658.4s] което означавало изгорете след прочитане на публикацията.\n[661.771s] Членовете на групата отрекли всички обвинения за злоупотреба.\n[665.466s] На въпрос за обвиненията на семейство Падила\n[668.12s] говорител на групата, наречен „Соломон“, ги отхвърлил направо с четири ключови отрицания.\n[673.7s] Отрицание номер едно: той казал, че никой не е казвал на членовете да се \"споделят\" сексуално.\n[678.62s] Но в \"писмо от Мо\", наречено „Една съпруга“, двойки, които не споделят\n[682.539s] били обвинени, че не успяват да поставят на първо място по-голямото им семейство.\n[686.153s] Бърг предупредил, че техният Бог ще вземе само желаещите и ще изостави останалите.\n[690.82s] На въздържащите се членове било казано, че трябва да имат демон в себе си\n[694.012s] или че не обичали достатъчно Бога си.\n[696.34s] Избягалите съобщили, че им било нареждано да спазват графици за споделяне на секс\n[699.82s] създадени от лидери, за да гарантират, че всички споделят с всички останали.\n[704.261s] Факт е, че на членовете е било рутинно казвано да правят секс с други членове и\n[708.44s] били принуждавани, ако се съпротивляват.\n[710.809s] Отрицание номер две: „Соломон“ твърдял, че „Флиртуващ Риболов“ никога не е бил синоним на секс.\n[715.84s] Той казал, че това можело да означава просто отиване в бар или на парк\n[718.94s] за да говориш с някого за Исус.\n[721.44s] Всъщност \"Флиртуващ Рибовол\" бил синоним на проституция\n[725.64s] както е илюстрирано от синонимите на Бърг за Флиртуващ Риболов:\n[729.5s] „Божии курви“ и „Проститутки за Исус“.\n[733.093s] Отрицание номер три: „Соломон“ казал, че групата не е произвеждала порнография\n[737.54s] и твърдял, че няма знания за видеоклипове, посветени на Бърг.\n[741.24s] В съдебно заседание от 1995 г. групата направила същото отрицание под божествена клетва.\n[746.868s] След като видео-касетите били произведени в доказателства, те променили историята си\n[751.58s] твърдейки, че видеата са били просто предназначени да внушат положителен образ в своите членове.\n[757.3s] Но намерението безспорно, било, порнографско.\n[761.16s] Порнографията се определя като форма на медия, предназначена да предизвика сексуално възбуждане.\n[767.08s] В \"писмо от Мо\", наречено \"Прославяне на Бога с Танц\"\n[770.24s] Бърг открито заявил, че използвал видеоклиповете като \"оживен съпровод\" на секса.\n[775.64s] В над 30 силно повтарящи се страници той дал подробни инструкции\n[780.2s] по отношение на това, което го възбуждало\n[782.2s] заявявайки отново, че танцьорите трябва да са голи\n[785.4s] с изключение на шал или воал\n[787.76s] и трябва да танцуват по провокативно закачлив дразнещ начин\n[791.774s] тъй като надничането и многозначителните погледи били по-възбуждащи.\n[796.0s] И накрая, имаме отрицание номер четири:\n[798.96s] \"Соломон\" казал, че групата не вярвала в секса между непълнолетни и възрастни.\n[803.68s] През 1989 г. Бърг пуснал официално публично издание в което отричал този факт\n[808.18s] твърдейки, че сексът с непълнолетни винаги е бил абсолютно забранен.\n[811.72s] В основата на неговото изявление\n[813.429s] Бърг цитирал много критикуваната глава „Моята малка Рибка“ в книгата „Давидидо“\n[818.14s] която показвала, че бавачката на момчето го насилвала.\n[820.86s] Бърг се опитал да я превърне в изкупителна жертва, заявявайки, че\nглавата отразявала\n[824.48s] нейните, личен опит и мнения\n[826.94s] и че такива интимни отношения между непълнолетни и възрастни\n[830.22s] никога не са били окуражавани или толерирани в групата.\n[833.42s] Но официалното насърчаване от страна на Бърг, неговото съучастничество, било изобилно и неоспоримо\n[841.22s] както се вижда от неговите многократни оправдания в групови публикации\n[844.64s] към децата булки, които той изнасилвал\n[846.98s] включително собствената си внучка Мери Бърг\n[849.98s] Мери, един смел и вдъхновяващ индивид, който търпял немислима злоупотреба\n[854.54s] и станала откровен критик, и противник на групата.\n[857.48s] Друг отдел на малтретиране на деца в групата\n[859.932s] бил разкрит от Анеке и Рон Шиберл\n[862.38s] които са помогнали на над 50 индивида да избягат\n[864.94s] и да се приспособят към външния свят.\n[867.403s] Те съобщили, че напускат групата, когато лидерите казвали на Рон\n[870.54s] че искали той да прави секс с 12-годишна, за да успокои нейното високомерие.\n[875.58s] Рон отказал и заплашил с действия срещу всеки друг, който се съобразил.\n[880.32s] След публичното отрицание на Бърг за детски секс\n[883.34s] зад завесата, одобрението продължило.\n[885.867s] Тайно писмо до групата което Карън Церби написала, показвало тяхната предизвикателна позиция.\n[890.62s] В него тя заявила, че ласкаенето на децата не е съгрешение и не представлява злоупотреба.\n[896.54s] И тя предвиждала време, когато групата ще заеме позиция\n[899.93s] и ще бъдат истински по темата.\n[902.48s] Няколко години по-късно тя ще види сина си\n[905.4s] момчето наречено Давидидо\n[907.06s] да заеме собствена позиция.\n[908.74s] Вече познат с новото си име Рики Родригес\n[911.22s] той проследил и убил един от насилниците си\n[914.14s] бавачка, наречена Анджела Смит\n[916.32s] след това се самоубил.\n[919.54s] На Дейвид Бърг и неговите представители лъжите течеха свободно\n[923.9s] дори под божествена клетва.\n[925.671s] Много авторитарни идеологически групи учат своите членове,\n[929.22s] че е напълно нормално да прилагат измама при определени обстоятелства.\n[933.28s] Измамата дори може да се превърне в официална политика със свое специално име.\n[937.88s] В групата на Бърг тя се наричала „измамна, но все пак вярна“.\n[941.58s] Били установени правила за това какви видове измама са приемливи.\n[945.335s] Измамването на други членове на семейството било строго забранено\n[948.56s] както била измама за егоистични мотиви като отчуждаване на наказание за неправомерни действия.\n[953.8s] Но нечленуващи, за които се смятало, че служат на Дявола\n[957.34s] се казвало, че нямат право на истината.\n[959.609s] Както многократно се наблюдава при групи с висок контрол\n[962.884s] ръководството не успяло да спазва собствените си правила.\n[965.84s] Бърг нямал проблем да излъже, за да избегне наказанието\n[968.72s] и с удоволствие хвърлял други членове на групата под автобуса\n[971.64s] за да избегне наказателното преследване от властите.\n[974.66s] И в книгата й  \"родени в Божиите деца\"\n[978.22s] Наташа Тормей разкрила изкривен начин, по който децата се обучавали\n[982.11s] да нарушават правилото винаги да казваш истината на членовете на семейството.\n[985.86s] Когато била на 4 години, някои възрастни членове дошли да интервюират децата отделно\n[990.46s] питайки дали някой не ги е докосвал по лош начин.\n[993.4s] Въпреки че Наташа е била малтретирана от мъж, наречен „Клеи“\n[996.68s] инстинктите й я подтикнали да ��злъже и да каже НЕ.\n[1000.511s] На следващата сутрин било разкрито, че интервютата са били тест\n[1004.1s] за лоялността на децата към групата.\n[1006.64s] Момиче на име Саманта, което съобщило, че е било малтретирано\n[1010.31s] след това е била принудена публично да яде сапун, а след това да носи картонен знак с надпис:\n[1015.29s] \"Аз съм в мълчание защото изричам лъжи. Моля ви, не ми говорете.\"\n[1021.8s] Посланието до децата било ясно: Не казвайте на никого, че сте били малтретирани.\n[1027.445s] Най-ефективният начин да се прикрие насилието над деца е да се гарантира, че децата никога няма да отправят обвинения\n[1034.04s] — дори и на онези, на които са научени да се доверяват.\n[1037.24s] Когато е направено обвинение, са необходими други методи за прикриване.\n[1043.653s] Подвеждащи методи.\n[1051.6s] Прикриването може да използва огромен набор от стратегии, често в комбинация.\n[1056.783s] Понякога обвиненията могат да бъдат потулени, преди да станат публични.\n[1060.7s] Обвинителите могат да бъдат подкупени и/или заплашени\n[1063.86s] — метод, използван от Католическата църква за прикриване на насилие над деца от нейното духовенство.\n[1069.04s] Понякога изобличаващи доказателства могат да бъдат променени или унищожени\n[1072.92s] както се опитала да направи групата на Бърг.\n[1074.922s] След като едно твърдението е оповестено публично, други стратегии влизат в игра\n[1079.2s] включително различни форми на отричане.\n[1081.94s] Обвиняемият може просто да излъже и да отрече обвинението.\n[1086.252s] Те могат да отрекат знанието или спомените за престъплението.\n[1089.54s] Те могат да отрекат, че престъплението попада в сферата им на отговорност.\n[1093.74s] Или че престъплението е било толкова тежко или мащабно, колкото твърдят обвинителите им.\n[1100.14s] Друга стратегия е укриването.\n[1102.9s] Обвиняемият може да се опита да избегне разпита\n[1106.02s] — изплъзвайки се от присъствието в съда, като претендира за болест или тежка лична загуба\n[1110.34s] или дори да станат бегълци, както Бърг направил, за да се изплъзне от властите.\n[1114.991s] Те могат да претендират за невярно задължение за поверителност\n[1117.87s] което им пречи да споделят изобличаващи материали.\n[1120.88s] В някои групи новите членове получават различни имена.\n[1124.24s] Това се случило с насилника на Наташа Тормей „Глината(Клеи)“\n[1127.438s] който е бил пре-покръстен, за да отразява идеята на Бърг\n[1130.58s] че членовете трябва да се трансформират като глина върху грънчарското колело.\n[1134.94s] Неясната идентичност може да помогне на насилниците да избегнат правосъдието.\n[1139.0s] Някои подсъдими избират да защитават с контра-обвинения.\n[1142.9s] Атакувайки характера и мотивите на обвинителя им.\n[1146.0s] Претендиращи че правата им са нарушени.\n[1148.28s] Претендиращи нелоялни предразсъдъци или преследване.\n[1152.92s] Може би най-хлъзгавите стратегии са тези, които включват разсейване\n[1157.54s] — иначе известни като прах в очите —\n[1159.861s] които насочват вниманието ни към грешното място\n[1162.58s] с подвеждаща и ненужна информация.\n[1166.043s] Ангъс питал Джефри: \"Вашата църква приема ли телесни наказания за деца?\"\n[1171.8s] Джефри отговорил: „Църквата ни очаква родителите да дисциплинират и отглеждат децата си“.\n[1177.7s] Това е прах в очите, напълно заобикаляйки главния въпрос който е за телесното наказание.\n[1183.26s] Да дава отговор на незададени въпроси е била тактиката на Джефри.\n[1188.305s] Могат да се използват безсмислени фрази\n[1190.47s] да дават имитация на отговор, докато в същото време не казват нищо.\n[1193.4s] Зара пита Джаг: „Има ли група от жени лидери?“\n[1198.04s] Истината е, че неговата група не приема жени лидери.\n[1201.66s] За да се опита да прикрие тази истина, той отговаря: „Жените са от решаващо значение“.\n[1206.24s] Това твърдение е безсмислено. Не се уточнява как жените са от решаващо значение.\n[1210.76s] Но той се надява това отклонение да звучи достатъчно убедително\n[1214.04s] за да спрат неудобните въпроси.\n[1216.2s] По-късно, ако истината излезе наяве, той може истински да каже, че не е лъгал.\n[1221.46s] Това, което не може да каже без да излъже е, че не е имал намерение да заблуждава.\n[1226.68s] Подсъдимите могат да насочат погрешно, като използват подвеждащи, нехарактерни примери.\n[1232.312s] Говорителя на \"Децата на Бога\"  \"Соломон“ направил това\n[1235.0s] когато той омаловажил \"Флиртуващия Риболов\" като разговор за Исус в парк.\n[1240.2s] И както Бърг направил с бавачката на Давидидо\n[1243.23s] изкупителни жертви могат да се предлагат, за да се отклони вниманието от виновниците.\n[1248.052s] Дори ако набедената страна е принудена да признае за някакви неправомерни действия\n[1251.98s] прикриването може да продължи.\n[1253.823s] За да се отърват от властите\n[1255.92s] насилствените групи понякога фалшифицират интерес към реформацията.\n[1259.78s] Те ще обещаят да \"вземат предвид препоръките\" на официалните съдебни състави\n[1265.12s] и се ангажират да въведат нови предпазни мерки.\n[1268.54s] Но това са само празни приказки.\n[1270.46s] Няма намерение за промяна — и злоупотребата ще продължи.\n[1274.857s] Редица от тези тактики са многократно използвани\n[1277.607s] от висши Свидетели на Йехова, за да се опитат да прикрият\n[1280.38s] стотици случаи на малтретиране на деца в рамките на тяхната организация\n[1285.225s] и доктрините, които са помогнали за продължаването на злоупотребата.\n[1294.802s] Лъжесвидетелстване.\n\"Те поставят вече известни насилници на позиции в продължение на 60 години.\"— Барбара Андерсън, свидетел на Йехова повече от 43 години.\n[1306.428s] Отричането не е нищо ново за лидерите на Сепаратистката Християнска група\n[1310.542s] Свидетели на Йехова, чийто религиозен символ е наблюдателна кула.\n[1314.87s] Всяка религиозна група която има навика да предсказва края на света\n[1318.12s] неизбежно се обучава в техники за прикриване,\n[1321.34s] когато пророчествата им се провалят — както неизбежно се случва.\n[1325.1s] За „Божите деца” се предвиждало, че Армагедон(край на света) ще пристигне през 1993 г.\n[1330.087s] За Свидетелите на Йехова многобройни дати за Армагедон\n[1333.16s] обхващащи повече от век са идвали и си отивали\n[1335.91s] — включително 1975 година.\n[1338.94s] Подобно на Дейвид Бърг, ръководството на Свидетеля на Йехова\n[1341.86s] — известно като Управляващ орган —\n[1343.58s] създава редица публикации, за да прекара своите идеи\n[1346.96s] включително техните списания „Събуди се!“ и „Кулата за наблюдение“.\n[1350.76s] Тези публикации силно гласяха прогнозата за края на света през 1975 г.\n[1355.211s] Годината е изведена с помощта на библейската хронология\n[1358.049s] за изчисляване на датата на предполагаемия първи човек\n[1360.872s] Адам на 4026 г. пр.н.е.\n[1364.22s] след това се добавят 6000 години — определеното време за съществуването на човечеството.\n[1369.04s] Според Управителния орган по време на Армагедона\n[1371.62s] само членове на организацията на Йехова биха се класирали за вечен живот.\n[1375.96s] Останалите ще бъдат унищожени.\n[1378.8s] През 1969 г. Събуди се! Списанието разказа на младите хора\n[1382.742s] че те трябвало да се изправят пред факта, че никога няма да остареят в сегашната система\n[1387.26s] и никога няма да изпълняват кариера, която светът може да предложи.\n[1390.86s] През предходната година изданието на Кралското министерство призовало членовете\n[1394.63s] да влезнат в пионерно министерство за организацията\n[1397.78s] казвайки им, че са останали само около 90 месеца\n[1400.46s] преди човешкото съществуване да бъде завършено.\n[1403.32s] През 1974 г. тогава изданието аплодирало членовете\n[1407.1s] които са продали домовете си, за да се посветят на пионерството\n[1410.8s] отбелязвайки, че това е чудесен начин да прекарате оставащото кратко време\n[1414.46s] преди края на нечестивия свят.\n[1416.5s] Прогнозата на Армагедон променила много животи.\n[1419.48s] Свидетелите се отказали от възможностите в образованието и бизнеса.\n[1423.3s] Застрахователните полици били анулирани.\n[1425.84s] Някои отлагали да имат деца.\n[1428.18s] Какво правело ръководството?\n[1430.52s] Закупуване на нови имоти.\n[1432.82s] В началото на 1975 г., последната година на човечеството\n[1437.18s] организацията купила петнадесет етажния хотел Кулите в Бруклин.\n[1441.86s] Докато окуражавали и възхвалявали огромните саможертви сред стадото си\n[1446.14s] те разширявали недвижимите си имоти.\n[1449.041s] Когато 1975 г. преминала без инциденти, Управителният орган преминал в отричане.\n[1454.84s] През юли 1976 г. те казали че Свидетели, които са отлагали или пренебрегвали нещата\n[1459.56s] за които иначе биха се погрижили, са разбрали всичко погрешно.\n[1463.18s] Било си е тяхна вина че си мислят че хронологията от Библията разкрива някаква специфична дата.\n[1468.16s] По този начин, за да оправдае собствените си грешки, Управителният съвет превърна в \"изкупителни жертви\" всички свидетели, които се ръководеха от тези грешки.\n[1476.15s] променили също и доказателствата.\n[1478.08s] В изданието си от 1968 г. „Истината, която води към вечния живот“\n[1483.095s] организацията цитира прогноза, направена през 1960г\n[1485.74s] от бившия държавен секретар на САЩ Дийн Ачесън\n[1488.98s] че след петнадесет години — тоест 1975 г. —\n[1493.06s] светът би бил твърде опасен за живеене.\n[1495.78s] Но в ревизираното издание от 1981 г. конкретният период от петнайсе години\n[1500.86s] бил забележимо заменен с думата „скоро“.\n[1505.66s] През последните години Управителният орган се подлага на разследване за още едно прикриване\n[1509.64s] този път по отношение на сексуалното насилие над деца.\n[1512.12s] Лицемерието и безсрамността на това прикриване не могат да бъдат преувеличени.\n[1516.48s] В стена от статии в списанието Събудете се!\n[1519.54s] Управителният орган многократно сочи набожен пръст към католическата църква\n[1524.14s] за нейното институционално прикриване на насилието над деца от нейните свещеници\n[1528.44s] отбелязвайки дългосрочните, често трайни, вреди, нанесени на детето.\n[1532.86s] Тези статии определят Управителния орган като закрилник на децата.\n[1537.169s] Статия от 2011 г. правилно съобщава, че малтретирането от свещеници е игнорирано\n[1542.12s] заради лоялността към абсолютния авторитет на католическата църква.\n[1545.994s] Пропуснато е било да се спомене за тази лоялност към Управителното тяло на Свидетелите на Йехова\n[1550.429s] който упражнява значително по-голям контрол над стадото си\n[1553.69s] и има същия ефект на заглушаване.\n[1556.28s] Статия от 1993 г. обвинила католическата църква\n[1558.881s] във комбиниране на първоначалното сексуално насилие с второ по-болезнено психологическо насилие\n[1564.36s] — злоупотребата свързана с неспособността да изслушва или приема обвиненията сериозно,\n[1568.48s] и за това че само защитава насилниците.\n[1571.64s] Статия от 1990 г. обвинила католическата църква в приглушаване на дела\n[1575.62s] и не предприемане на значителни дисциплинарни мерки.\n[1578.92s] Но хората в стъклените кули не трябва да хвърлят камъни.\n[1583.16s] Както ще покажа, организацията на Свидетелите на Йехова също е виновна във всяко отношение.\n[1588.555s] Насилието към децата е проблем за много групи.\n[1591.74s] Но може да се вкоренява дълбоко в онези групи, които поставят пречки пред правосъдието.\n[1596.18s] Едно препятствие, което Свидетелите на Йехова споделят с Католическата църква,\n[1600.049s] е тяхната загриженост за репутацията им.\n[1603.056s] Когато общественото мнение става по-важно за тях от доброто на своите членове,\n[1606.18s] прави така че двете организации да съсредоточат енергията си\n[1609.12s] да скрият срамните си деяния, вместо да се борят със злоупотребите.\n[1612.96s] Но ръководството на Свидетеля на Йехова е издигнало други специални пречки.\n[1617.1s] Чрез комбинация от недобросъвестни доктрини,\n[1619.59s] тя създава организация, която помага на насилниците и ги прави жертви на мошеници.\n[1625.181s] Една доктрина, която защитава насилниците, е нещо, наречено правило за „двама свидетели“.\n[1629.66s] Въз основа на пасажи от Второзаконие и 1 Тимотей\n[1632.58s] правилото за двама свидетели изисква лидерите на папствата наричани ​​„старейшини“\n[1636.906s] да чуят показанията на поне двама свидетели, за да могат да осъдят изнасилвач.\n[1641.397s] Очевидно е че скритият характер на сексуалното насилие над деца\n[1644.82s] прави това състояние изключително малко вероятно.\n[1648.18s] При липса на двама свидетели се изисква самопризнание от насилника.\n[1652.84s] Ако не се направи признание, въпросът се счита че е в ръцете на Йехова.\n[1658.34s] Затова това което всички насилници трябва да направят, за да се радват на живот на безгрижно насилие над деца\n[1663.4s] е, да се уверят, че не са видени и да откажат да се изповядват.\n[1667.88s] Това зашеметяващо съучастие в полза на насилника\n[1671.24s] не винаги присъства при други престъпления.\n[1673.78s] \"Пасете стадото Божие\" — съдебен справочник за старейшините —\n[1677.503s] дава хипотетичен случай, при който женен мъж\n[1680.0s] се наблюдава как пренощува в къщата на своя секретар\n[1683.44s] но отрича да е извършил изневяра.\n[1685.84s] Въпреки факта, че няма свидетели на изневяра\n[1688.36s] и не е получено признание\n[1690.38s] твърди се, че има достатъчно силни косвени доказателства\n[1693.06s] на сексуална непристойност, за да се обосноват съдебни действия\n[1696.44s] и дори да се позволи на съпругата да се разведе и да се омъжи повторно\n[1699.74s] което е рядка привилегия сред Свидетелите на Йехова\n[1702.52s] които по принцип приравняват повторния брак с изневярата\n[1705.41s] въз основа на Матей 19, стих 9.\n[1708.9s] Така че, за възрастни, които просто виждат някой да влиза и излиза от къща\n[1712.68s] е доказателство за установяване на изневяра.\n[1714.78s] Междувременно малтретираните деца се нуждаят от множество свидетели или признание.\n[1719.52s] В противен случай случаят е затворен.\n[1721.891s] Управляващият орган обича да проектира абсолютно безупречен образ на своята организация.\n[1726.78s] За да се поддържа тази илюзия, се дава инструкции на събранията\n[1730.079s] да се отчуждават хора, считани за проблемни,\n[1732.88s] включително близки роднини.\n[1735.02s] Това се основава на ред от 1 Коринтяни (5:9-13):\n[1737.66s] „премахнете нечестивия човек измежду себе си“.\n[1740.417s] Тази докт��ина може да изглежда идеална за освобождаване от организацията от насилниците.\n[1745.06s] Вместо това многократно работи, за да прогонва жертвите.\n[1748.957s] Има два основни пътя за отстраняване от групата.\n[1751.68s] Доброволният път е раздружаване.\n[1754.18s] Тук човекът напуска организацията, като прави официална декларация за напускане.\n[1759.14s] След това ще бъде третиран така, сякаш вече не съществува.\n[1762.82s] Неволевият път е —лишаване от комуникация—.\n[1765.48s] Тук организацията изгонва и отбягва индивиди\n[1768.88s] които се считат за неразкаяни виновни за \"злите дела\".\n[1772.86s] Те включват престъпления като кражба и нападение, но се отнасят и до следното:\n[1778.32s] изкуствено осеменяване от донор(даряване на сперма), което се приравнява с изневяра;\n[1782.24s] честване на Коледа или участие в между религиозни дейности;\n[1786.38s] пушене или продажба на тютюн; професионален бокс;\n[1789.94s] неуспех да се въздържат от кръвопреливане;\n[1792.74s] и общуване с хора, —лишени от комуникация—.\n[1796.356s] Друго престъпление е предизвикването на разделение — което може да се приложи\n[1800.14s] към всеки, който оспорва или критикува Управляващия орган.\n[1804.36s] Дисоциацията и —лишаването от комуникация— идват в полза на насилника.\n[1808.56s] Когато вината на техните насилници е оставена в ръцете на Йехова\n[1811.9s] децата са изправени пред перспективата да рискуват повторно травматизиране\n[1815.62s] като остават в папства, които защитават техните насилници.\n[1819.52s] Неизбежно някои деца ще искат да се разделят.\n[1823.62s] За насилника няма стимул да се разделя.\n[1827.14s] Така че разединяването работи в полза на насилника.\n[1831.2s] Заплахата от —лишаване от комуникация— е многократно използвана за заглушаване на обвиненията.\n[1836.28s] Жителката на Вашингтон Ерика Гарза първоначално се доверила на баща си за сексуалното си насилие\n[1841.88s] извършено от най-добрия му приятел.\n[1844.12s] Като старейшина той бил инструктиран никога да не се обажда в полицията.\n[1847.96s] Но когато организацията не предприела никакви действия\n[1850.41s] Ерика казала, че сама ще отиде в полицията.\n[1853.28s] Нейните старейшини й казали, че ако го направи, ще бъде —лишена от комуникация—.\n[1856.52s] и осъдена от Йехова.\n[1858.82s] Въпреки това тя продължила напред и насилникът й бил обвинен и осъден по четири обвинения.\n[1865.08s] Ерика и нейното подкрепящо семейство бяха отчуждени.\n[1869.62s] Защитниците на детската безопасност също получават —лишаване— за изказвания в съда.\n[1873.66s] Барбара Андерсън била Свидетел на Йехова 43 години.\n[1877.289s] През 90-те работейки като изследовател в централата на Наблюдателната кула в Ню Йорк\n[1882.32s] тя намерила файлове, съдържащи стотици обвинения срещу мъже и жени\n[1887.61s] заедно с доказателства, че организацията уреждала насаме\n[1890.62s] множество скъпи съдебни дела за злоупотреби.\n[1893.42s] След обсъждането на тези факти в новинарското предаване на NBC „Dateline“ от 2002 г.\n[1898.18s] тя била —лишена— .\n[1899.86s] Тя каза, че по-късно й е било казано, че хиляди членове са напуснали религията след доклада\n[1904.54s] и че тя е обвинена в унищожението им в идващия Армагедон.\n[1909.66s] Докато малтретираните деца и техните защитници са заплашени от —лишаване—\n[1913.92s] само за търсенето на справедливост която тяхната организация не предоставя\n[1917.96s] за хитрия насилник заплахата от —лишаване— не съществува.\n[1922.32s] През 2002 г. Панорама(предаване) на BBC съобщило за случая с Иън Козин\n[1927.521s] който признал пред старейшините, че е насилил една от дъщерите си.\n[1931.38s] Отговорът им?\n[1932.78s] Той бил инструктиран да се извини, изпратен вкъщи с дъщерята, която насилил\n[1937.56s] и папството беше информирано, че е бил упрекван за неуточнено нарушение.\n[1943.32s] Невероятно, но това е всичко.\n[1945.74s] Това е организацията, която обвини Католическата църква\n[1948.56s] че не предприема значителни дисциплинарни действия.\n[1951.86s] Неучудващо, без последствия да го ограничат\n[1955.3s] Козин продължил да малтретира дъщеря си.\n[1958.18s] Когато тя се изнесла, за да избяга от злоупотребата, той се обърнал към другата си дъщеря Алисън.\n[1963.38s] Подобно на сестра си, Алисън казала, че е информирала старейшина за насилието\n[1967.56s] но била обвинена в лъжа\n[1969.32s] въпреки че те са имали достъп до предишното му самопризнание за злоупотреба.\n[1973.0s] В крайна сметка тя казала на старейшините, ако не направят нещо, тя ще се обади в полицията.\n[1977.64s] В последващото полицейско разследване\n[1979.75s] Алисън научила за злоупотребата срещу сестра си и признанието на баща си.\n[1984.0s] Докладът на „Панорама“ отбелязал:\n[1986.08s] „Когато той призна пред старейшините на папството, Козин получил лек укор.“\n[1990.58s] „Когато той признал пред съда, той получил пет години затвор“.\n[1994.5s] През 2015 г. друг малтретиран индивид обяснил\n[1997.98s] как организацията нормализира отхвърлянето на светските власти в случаи на злоупотреби.\n[2003.57s] Свидетелствайки анонимно\n[2005.14s] до Австралийската Кралска комисия за Институционални Отговори за Сексуалното насилие над деца\n[2010.36s] тя разказа, че е била заплашена с —лишаване— , ако се обадила в полицията\n[2014.08s] от старейшина, който цитирал 1 Коринтяни 6: стихове 1-8\n[2018.34s] което забранява вземането на братя пред съда.\n[2021.01s] Комисията чула доказателства, че организацията е водила записи на 1006 предполагаеми насилници\n[2027.669s] в Австралия от 1950 г. — никой от тях не съобщил на полицията.\n[2032.42s] Ще разкажа за разследването на Кралската Комисия в бъдещо видео.\n[2037.52s] Очевидно това библейско оправдание не се разпростира върху всички престъпления.\n[2041.62s] През 2016 г. писмо до старейшините относно техните „Кралски зали“\n[2046.78s] — техните места за поклонение —\n[2048.58s] заявило, че кражбите и вандализмът трябва незабавно да бъдат докладвани на местните власти.\n[2053.6s] В него се обяснява:\"когато настъпи повреда на имота бързото действие може да помогне в предотвратяване на по-нататъшни щети\".\n[2061.3s] Дали тази позиция е по-малко вярна по отношение на щетите за децата?\n[2065.239s] Децата не са ли по важни от имуществото?\n[2069.139s] С действията си организацията разкрива истинските си ценности.\n[2073.837s] Литературата на Свидетелите на Йехова непрекъснато играе в образа на \"вълци и овце\",\n[2078.44s] сравняване на не-свидетели и бивши свидетели с потискащи нечестиви вълци\n[2083.58s] с намерение да атакуват чистото и уязвимо стадо.\n[2087.644s] В действителност доктрините на ръководството на Свидетеля на Йехова\n[2092.04s] систематично защитават вълците вътре в организацията\n[2095.82s] докато изгонват овцете от стадото.\n[2099.66s] Възможно ли е доброжелателно свръх интелигентно божествено същество\n[2104.22s] да е създало такава страхотно опорочена система?\n[2108.16s] Или може би този ад е покрит с човешки пръстови отпечатъци?\n[2115.443s] Води до объркване, когато децата, които са оцелели от насилие\n[2118.98s] се —прогонват— от организация, която твърди че защитава децата.\n[2122.74s] Но това е само част от цялото.\n[2124.902s] Когато представителите на организацията отказват да признаят, че се практикува отчуждаване.\n[2129.98s] Независимо дали е в новинарски интервюта, в проповядванията от врата на врата\n[2133.65s] или в съдебни заседания под божествена клетва\n[2136.98s] когато се появи темата за отчуждаването\n[2138.9s] Свидетелите многократно преминават в режим на прикриване.\n[2142.0s] Изведнъж тази строго наложена доктрина\n[2144.72s] е погрешно представяна като въпрос на личен избор.\n[2147.977s] Някои свидетели дори изиграват картата на предразсъдъците\n[2150.78s] оплаквайки се, че терминът \"отчуждаване\" предизвиква нежелани стереотипи.\n[2155.58s] Изворът на организацията по отношение на отчуждаването се простира до нейния уебсайт — jw.org.\n[2161.78s] В статията си за Често Задавани Въпроси „отчуждават ли Свидетелите на Йехова бившите членове на тяхната религия?“\n[2167.38s] дори избягва собствения си въпрос.\n[2170.136s] В статията се казва, че кръстени Свидетели, които са се отдалечили\n[2173.089s] или вече не проповядват, не се отчуждават.\n[2176.24s] Това е подвеждащ пример.\n[2178.96s] Организацията не класифицира тези лица като бивши членове.\n[2182.64s] Те се наричат ​​„неактивни“ членове — или „избледняващи“.\n[2185.84s] За да станат бивши членове, те трябва да се разделят или да бъдат —лишени—.\n[2191.04s] Тогава щяха да бъдат отчуждавани.\n[2193.24s] В статията се твърди, че ако мъж бъде —лишен—\n[2195.869s] а жена му и децата му са Свидетели на Йехова\n[2198.64s] нормалните семейни привързаности и отношения продължават.\n[2201.72s] Това е друг подвеждащ пример.\n[2204.54s] Роднините, живеещи в едно и също домакинство, се считат за особен случай\n[2208.28s] тъй като организацията позволява степен на асоциация.\n[2211.92s] Какво пренебрегва статията\n[2213.935s] е, че ако членовете на семейството, —които са лишени—, някога се изнесат от къщата\n[2217.937s] то могат да бъдат избягвани като всеки непознат.\n[2223.04s] Докато организацията коментира с очевидна наслада:\n[2226.378s] ако човекът, —който е бил лишен—\n[2228.96s] е роднина, живееща извън близкия семеен кръг и дом\n[2232.6s] възможно е да няма почти никакъв контакт с роднината.\n[2237.78s] Истината е, че на Свидетелите е казано да отчуждават всички нормални контакти с —лишени— роднини\n[2243.7s] — включително текстови съобщения и имейли —\n[2246.24s] и да не търсят извинения, за да се свържат с тях.\n[2249.84s] Свидетели, които поддържат ненужна връзка\n[2252.789s] с роднини, които са —лишени—, могат те самите да бъдат —лишени—.\n[2257.28s] Как организация, която твърди, че представлява „Истината“\n[2260.9s] обосновава умишленото си използване на измама, за да прикрие сексуалното насилие над деца\n[2266.58s] и доктрината за отчуждаване, на която след това са подложени много от малтретираните деца?\n[2271.641s] В литературата на Свидетеля на Йехова се твърди, че \"всички лъжи са лоши\"\n[2275.28s] и цитира библейски пасажи, които обричат ​​лъжата като унищожителна за Йехова.\n[2280.18s] Но като Дейвид Бърг, организацията си дава лиценз за измама.\n[2285.242s] Точно както Бърг имал своето учение „измамна, но все пак вярна“\n[2288.86s] Управителното тяло на Свидетелите на Йехова има своя версия\n[2291.94s] наричана „теократична стратегия за война“ или „теократична война“.\n[2296.44s] Подобно на доктрината на Бърг, тя строго забранява лъжата между членове.\n[2301.08s] Подобно на доктрината на Бърг, тя осъжда лъжата заради егоистични мотиви.\n[2305.82s] И подобно на доктрината на Бърг, тя твърди, че нечленуващите нямат право на истината.\n[2311.64s] Поставянето на тези две групи един до друг подчертава перверзността на тези учения.\n[2316.66s] Тук имаме две групи, всяка от които би обвинила другата в лъже учение, но не би смятала, че има право да знае истината.\n[2324.012s] И двете групи заявяват, че техният собствен стил на измама е нормален, а другият — порочен.\n[2329.58s] Те са огледални изображения\n[2331.54s] всеки обвинява другия, освобождавайки себе си от отговорност.\n[2335.9s] Това е абсурдът, който произтича от лицемерните системи на върховнически групи\n[2342.18s] които съдят другите по стандартите, които самите те отказват да следват.\n[2346.26s] Управителното тяло на Свидетелите на Йехова\n[2348.27s] твърди, че измамата се използва само за предотвратяване на вреда или преследване.\n[2352.76s] Но дали прикриването на сексуално насилие над деца се квалифицира като предотвратяване на вреда или преследване?\n[2358.48s] Проблемът става ясен, когато споменем Католическата църква.\n[2362.205s] Ако Управителният орган иска да защити прикритието си въз основа на предотвратяване на вреда или преследване\n[2367.6s] той трябва да приеме същата защита от Католическата църква при нейното прикриване.\n[2371.76s] Още повече, ако отхвърли тази защита от Католическата църква\n[2375.94s] то той самия няма извинения.\n[2378.881s] Поредното лицемерие по отношение на Католиците\n[2381.749s] касае съпровождащата вина, която старейшините на Свидетеля на Йехова многократно използват\n[2385.769s] за да спрат децата да съобщават злоупотребите си пред властите.\n[2389.36s] На децата се казва, че ще внесат позор в името на Йехова.\n[2392.951s] Но в много критични материали за Католическия детски тормоз, дали\n[2396.68s] Управляващото тяло упрекваше техния бог?\n[2399.52s] Не. Укоряваше църквата, папата, духовенството — хората, които го позволили.\n[2406.46s] По същия начин, когато се появят случаи на насилие над деца от Свидетелите на Йехова\n[2410.72s] никой не упреква Йехова.\n[2412.64s] Те упрекват организацията, управителния орган, старейшините — хората, които го позволяват.\n[2420.52s] Казвайки на децата, те ще донесат позор на Йехова\n[2423.2s] не е само емоционално насилващо.\n[2426.08s] Лъжа е.\n[2427.464s] Прикриването на отчуждителните практики също не може да се квалифицира като предотвратяване на вреда или преследване.\n[2433.76s] Тя наистина излага организацията в грозна светлина.\n[2437.42s] Но тази светлина осветява истината.\n[2439.778s] Насилствената природа на \"отчуждаването\"\n[2441.809s] е нещо, което самата организация неволно признала\n[2445.42s] в 2013 г. Събуди се! статия за мълчаливото лечение.\n[2449.72s] Отбелязвайки с неодобрение как някои хора използват безмълвното лечение\n[2453.76s] да наказват или да манипулират другите в отстъпчивост.\n[2457.58s] Дори попили читателите дали това наистина е как трябва да се отнасят с хората, които обичат.\n[2462.1s] Този въпрос може да бъде зададен обратно в Управителния орган по отношение на отчуждаването.\n[2467.22s] Организацията на Свидетелите на Йехова е група, бореща се с огромни вътрешни противоречия\n[2473.64s] иска да проектира чист, морално чист образ към външен свят, който презира\n[2480.229s] и в процеса, пренебрегва и злоупотребява със собствените си членове\n[2484.864s] по най-безчувствените, безсърдечни начини.\n[2491.709s] \" По плодовете им ще ги познаете.\"\n(По делата им ще ги познаете)\n[2499.078s] Библейският пасаж Матей 7:16 казва: „По плодовете им ще ги познаете“.\n[2506.063s] Ръководството на Свидетеля на Йехова твърди\n[2508.2s] че автентичността на организация може да бъде разпозната по нейните плодове.\n[2514.18s] Той твърди, че всяка религия която не е в състояние да обедини своите последователи\n[2518.78s] не може да има ключа за обединяване на човечеството.\n[2521.84s] И твърди, че плодовете на мира и хармонията\n[2525.04s] открити в рамките на тяхната организация\n[2527.72s] са доказателство, че те имат този ключ.\n[2529.92s] Всяка група, която рутинно изгонва индивиди, които я критикуват или предизвикват\n[2534.26s] в крайна сметка ще бъде оставена с набор от безкритични и съгласни последователи.\n[2539.2s] Това не е същото като „обединяване на вашите последователи“.\n[2542.54s] Да се ​​обединим означава да бъдем заедно\n— да изкореним разделенията.\n[2547.66s] Изтриване на хората, както прави организацията на Свидетелите на Йехова\n[2552.34s] само доказва своята неспособност да ги обедини.\n[2555.6s] Мълчанието не предполага мир и хармония.\n[2558.76s] Мълчанието може да създаде страдание.\n[2561.54s] За деца, чиито отчаяни сигнали за злоупотреба многократно се отхвърлят като лъжи\n[2566.9s] и които са заплашени от —лишаване—\n[2569.292s] за греха на замърсяване на фалшивия образ на безупречността на тяхната религия,\n[2573.62s] няма мир и хармония.\n[2575.895s] Дейвид Бърг и Свидетелското ръководство на Йехова\n[2578.8s] имали противоположни възгледи за секс с деца.\n[2581.6s] Но и двете групи се превърнали в убежище за изнасилвачи.\n[2584.9s] В случая на Бърг неговите доктрини активно толерирали злоупотреби.\n[2588.66s] В случая на Свидетелското ръководство на Йехова, въпреки че осъжда злоупотребите\n[2593.0s] нейните погрешни доктрини работят за разцвета им.\n[2596.719s] Чрез заглушаване на малтретирани лица и техните защитници\n[2600.54s] и обучаването на подли насилници, които просто като изказват извинение\n[2604.76s] могат да избегнат всички последици и да продължат с насилието.\n[2608.32s] Във всяка здрава група опасно дефектните процедури се признават и спешно се коригират.\n[2614.42s] Но в групи, които претендират за вечна божествена власт, несъвършенствата се консервират във формалдехида на вярата.\n[2621.9s] Много хора който са били малтретирани в догматичните групи\n[2624.509s] като семейството на Бърг и организацията на свидетелите на Йехова\n[2628.56s] са били изумени от топлината, грижите и подкрепата, които са получили от външния свят\n[2633.54s] — свят, чиито жители са били научени да демонизират.\n[2636.76s] Това е огромната разлика отваряща очите за студеното, дефинитивно, често обвинително отношение\n[2641.209s] което те са получавали в бившата си група.\n[2643.92s] По техните плодове разпознаваме истинските природи на групите.\n[2648.28s] Истински добронамерените групи не могат да прикриват злоупотреби.\n[2654.598s] Разбираме, че нещо не е наред, когато група, която заявява божественост, не може да демонстрира човечност.\n[2669.885s] Много благодаря на всеки, който поддържа канала във patreon.com/theramintrees"}'
