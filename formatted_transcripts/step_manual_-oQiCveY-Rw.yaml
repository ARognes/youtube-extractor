g killed. It''s incredible, Nanda''s\n[462.319s] mother. It''s amazing that you purify\n[464.639s] even the arising of a\n[467.319s] thought. And then she goes on to say\n[469.68s] that she doesn''t recall being upset.\n[472.24s] Similarly, when her husband, her beloved\n[474.639s] husband who had passed away, reappeared\n[477.039s] to her after his death. Then what her\n[481.039s] final incredible and amazing quality is\n[484.0s] that she realizes she''s given up the\n[486.08s] five lower fetterss. Now I did a video\n[488.16s] on that. I''ll leave a link to it down\n[489.68s] below if you don''t know what that is.\n[491.52s] But basically what that means is that\n[493.28s] she is what''s known in the early\n[494.879s] tradition as a non- returnturner which\n[497.44s] is one step from being fully\n[500.12s] enlightened. And this story I think\n[502.639s] highlights a key tension in the early\n[505.28s] texts between on the one hand the\n[508.16s] wholesomeness of love and on the other\n[511.199s] hand its subtle tension with duka its\n[516.64s] tendency to make us suffer in the light\n[519.279s] of impermanence. The question is whether\n[522.08s] we really can love one another without\n[524.959s] clinging in the way that I kaki\n[528.24s] exemplifies.\n[530.0s] On that note, I want to turn to how we\n[532.56s] might go about cultivating healthier\n[535.279s] relationships with one another. While I\n[538.08s] think for most of us, perhaps for all of\n[540.8s] us, this imperturbability that\n[543.76s] Nandanda''s mother exemplified is not\n[545.92s] going to be the sort of thing we''re\n[547.04s] actually going to be able to attain.\n[549.2s] Nevertheless, there are practices we can\n[551.76s] do that might aid us in our slow steps\n[556.399s] along the road towards her kind of\n[558.48s] destination.\n[560.08s] First of all, we can practice meta. As\n[562.88s] we''ve mentioned before, meta is a good\n[565.839s] way to practice a kind of love, a kind\n[568.32s] of\n[569.16s] kindness that is without this clinging.\n[572.32s] And so, in so far as we can practice\n[574.399s] this kind of of loving kindness, we can\n[577.839s] perhaps see a way to release some of\n[580.0s] that attachment that surrounds the love\n[582.88s] that we normally have for one another.\n[585.2s] Second, we can practice seeing our loved\n[587.519s] ones as impermanent. That is to say that\n[590.64s] our loved ones can pass away at any time\n[593.76s] and indeed will certainly pass away at\n[596.64s] some time or other. Now, this is not a a\n[601.04s] practice in order to become morbid. It''s\n[603.92s] simply a way of releasing our clinging,\n[606.72s] of becoming aware of impermanence, and\n[609.519s] so being truly present with them with\n[612.88s] gratitude while they''re here. Third, we\n[615.839s] can practice to let go of control. We\n[619.76s] cannot control or change another person\n[623.04s] unless they''re actively engaged with\n[625.12s] that change. In so far as we try to fix\n[628.48s] quote unquote fix somebody else in the\n[631.2s] face of this kind of repeated\n[633.24s] disappointment, we''re only going to be\n[635.44s] creating harm for ourselves and\n[637.839s] disappointment for other people. So if\n[640.8s] we can learn to let go of that, of our\n[643.12s] tendency to try to control things that\n[645.04s] are out of our control, we''ll be making\n[647.279s] our lives easier. Fourth, we can use\n[651.079s] conflict as a practice.\n[654.44s] Disagreements in the longer term reveal\n[657.68s] our attachments, our clinging in various\n[660.279s] ways. So, can we come to our\n[662.8s] disagreements with our significant\n[665.0s] others with more of a sense of\n[667.519s] mindfulness and openness to change? Can\n[670.64s] we respond with\n[672.279s] patience and spend less time in on\n[675.68s] grudges and anger towards one another?\n[678.56s] Fifth, we can focus on giving, not\n[681.0s] getting. In its in the final analysis,\n[683.6s] love is an example of generosity, not in\n[686.88s] a financial or material sense, but in an\n[689.68s] emotional sense. In so far as we think\n[692.72s] of love as a kind of a bargain we strike\n[695.839s] with somebody else, in so far as we see\n[698.32s] it in this kind of material bargaining\n[700.8s] sorts of terms, we''re liable to be\n[703.04s] setting ourselves up for disappointment\n[704.8s] in the longer term. Fifth, in\n[707.64s] conclusion, love is indeed a part of the\n[710.76s] path. As we''ve seen, the the Buddha did\n[713.68s] not reject romantic love or minimize it\n[716.88s] or pretend that it didn''t exist.\n[719.12s] Instead, he pointed out ways that we\n[720.88s] should be mindful of it and investigate\n[722.8s] it. In particular, this kind of love\n[725.92s] that we have towards one another can be\n[728.399s] beneficial to the extent that we can try\n[730.48s] to minimize the clinging and the jealous\n[734.079s] attachment that we have with it. In\n[736.32s] love''s purest form, which we might term\n[738.959s] meta or loving kindness, it is a\n[742.079s] universal attitude of goodwill towards\n[744.8s] all beings, no matter where they may\n[747.12s] reside. However, where there is clinging\n[749.44s] and attachment, even the deepest sort of\n[752.32s] love can result in fear, jealousy, and\n[756.24s] disappointment in suffering. But if we\n[758.72s] can hold our love for those dear to us\n[761.68s] with mutual respect and care, it can\n[765.36s] nevertheless be of benefit to us all in\n[768.959s] the medium and longer term. So my\n[771.92s] question to you is, how do you deal with\n[774.399s] these kinds of subtle or strong\n[776.72s] attachments in your own personal life? I\n[779.36s] think they''re difficult for all of us.\n[782.079s] Now, I did a prior video on how or if\n[786.72s] meta or this attitude of universal love\n[789.68s] can actually lead directly to\n[792.12s] enlightenment. That is the controversial\n[794.56s] opinion of one recent sc