transcript: 'Your top-of-the-line gaming GPU has tens of billions of transistors and enough horsepower to make Minecraft look like real life. But, ask it to run a serious AI model, and it taps out almost immediately. Not because the GPU forgot how to calculate things, the problem is memory bandwidth. AI accelerators are basically giant factories full of workers, and if memory can''t deliver data quickly enough, [music] those expensive compute cores sit around waiting. The solution that the entire AI industry has bet the farm on looks less like a computer chip [music] and more like a tiny skyscraper. So, how does it work? The memory in your gaming GPU, like GDDR7, lives flat on a 2D plane. If you want more speed, you have to make the data bus wider, [music] like adding lanes to a highway. But, circuit boards have limited room, and wider lanes are harder to run efficiently. Enter HBM, or high-bandwidth memory, >> [music] >> which stops the sprawl by going vertical. Instead of widening the highway across the [music] board, it stacks memory dies beside the processor. It''s a beautiful solution, but it doesn''t come without some engineering challenges. An HBM stack starts with a base die that handles logic. On top, layers of DRAM are stacked one above another. To get them communicating, engineers drill microscopic vertical channels through the silicon, called through-silicon vias, or TSVs. Think of these as express elevator shafts for data. [music] Between the layers are microbumps, which are tiny solder connections that bond each die to the next. They work kind of like LEGO studs, except they''re microscopic, and there are thousands of them. And if the alignment is off by even a few microns, the stack can fail. And all of that is just so the memory can talk to itself. Next, it needs to talk to the processor. And since the connections are too dense, you can''t simply attach it to a typical motherboard. Instead, engineers use a silicon interposer, which is basically a tiny motherboard made of silicon located underneath the processor and HBM [music] stacks. It allows them to sit close together with ultra-high density connections between [music] them. That is called 2.5D packaging, and it''s the standard for high-end AI hardware. It''s how today''s memory stacks can push over 1.2 terabytes per second to the processor. But lining those connections up perfectly and keeping them alive in a data center for years is a manufacturing challenge most chip companies would not attempt. [music] We asked Micron, who makes some of the most advanced HBM in the industry, to put this into perspective. >> One of the big challenges when you''re manufacturing HBM is that the stack height needs to match the GPUs height precisely. Any mismatch and the heatsink that''s eventually placed on top of these uh chips >> [music] >> don''t align and you don''t have proper cooling. This becomes trickier as as you go to higher stack heights because [music] the overall stack height remain has to be the same. So, when you go from 8 to 12 to 16, the individual DRAM wafers have to be thinned down [music] more so to make sure they fit within the same form factor. It poses an incredible manufacturing challenge as we as we keep increasing the stack heights. >> So, the layers have to be thinner, alignment has to be more precise, and the stack has to sit at exactly the right height beside the hottest component in the system. Now, you may be wondering, if HBM is this fast, why is it not in my gaming PC? Well, there''s three reasons: [music] cost, heat, and design. First, the silicon interposer and precise manufacturing means that HBM is too expensive to make sense for gaming GPUs. Second, [music] that dense brick of memory sits beside an already hot processor, so cooling gets harder, noisier, and more expensive again. Third, you You just swap out GDDR for HBM. The chip, package, and memory controller have to be designed around it. But, those tradeoffs make sense for AI accelerators, where every tiny bit of bandwidth is crucial to avoid having your expensive processor get bottlenecked. For gaming, GDDR is still the better balance of cost, performance, and manufacturability. >> So, while both HBM and traditional graphics memory are built for the same thing, speed and bandwidth, that''s where the similarities really end. Graphics [music] memory is really suited for workloads like gaming, video editing, graphics design. But, HBM memory is custom built for AI workloads. [music] The integration technology is also different, where graphics memory is integrated using a motherboard and PCBs, and HBM is integrated using the interposer. [music] It provides the highest bandwidth interface to the GPU at the lowest energy footprint that we can provide that''s vastly different from how GDDR is used or how graphics memory is used. [music] >> Today, HBM3E is powering top-end AI accelerators. HBM4 is already in production, and HBM4E is on the horizon with wider interfaces and tighter packaging. And speaking of memory, if you want to understand the DRAM that everything else, including HBM, is built on, our video on the subject should get you up to speed.'
