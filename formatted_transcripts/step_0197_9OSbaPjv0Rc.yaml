re. And that's actually harder than like doing a acrobatic backflip that it's practiced like a millions of times. So um with that said uh my answer to your question is that the road map is all about both achieving better generalization and uh kind of that second order effect of having a mechanism to get more generalization as you generalize. So one of the steps on that road map is to have a very concrete demonstration of a robotic system that gets better with autonomous experience that is collected in in a setting that it wasn't originally trained for. So I I do whatever I do on on on the back end, you know, in the lab in and whatever. I get my model, I get my uh adaptation algorithm, I put it in a new setting. Maybe it's a home, maybe it's a factor, whatever it is, something where it's doing something real. uh and it does okay, but then over time it gets better and better and it gets better and better to the point where it reaches sort of practically relevant levels of robustness without sort of capping out at like 50%. Like that I think would be a major milestone. Uh because now that that says okay if this is truly an automated process, it's improving, it's getting better even as it's collecting useful experience. Now I can take it and I can put it in lots of different domains, collect useful experience, do something that people actually want and it'll improve the model. So that I think is a really major step uh on that road. I think another really major step is to demonstrate a very concrete and practically useful way to transfer knowledge to transfer common sense to achieve robustness. So that's like the u kind of the the other scenario where you don't get to practice. If you're driving your car on the road and you see a fire truck and you see like a bunch of traffic cones, even if you've never been in that situation before, like your common sense tells you like, "Hey, I should like slow down." like what what maybe I don't know how to react optimally, but I shouldn't just like barrel on through the cones and like you know uh upset the firefighters and so on. Like so that's common sense. And if you can apply that common sense to effectively recover from unexpected situations like when the robot put the spatula in the oven like you know it should probably open it up, take it out like it knows that this is not the thing you do semantically. That I think is like another important step because that tells us that we can use common sense to fix mistakes. I could imagine um a more narrowly scoped robot. Let's say it's a humanoid robot. That's one step in assembly line in manufacturing. In my understanding, you're less interested in that because that's not really a step towards that general intelligence. What I would say, it's not that I'm less interested in it. It's that um I think that the real world has these leaky abstractions that make that kind of stuff a lot more complex than it seems. Um let me try to explain this with an analogy. So in the in the '9s um when people were like really started working uh kind of full steam on autonomous driving, there was this idea that we could avoid a lot of the hard problems by kind of instrumenting the environment a little bit. like we'll have like magnetic sensors along the highway and so on. And cars will have like a little uh you know uh sensor on them and a little um transmitter so they can tell where each of the cars are. Kind of like the way you do it with aircraft basically. Uh and then people thought well we don't really need like fancy AI. We'll just like have these sensors and and it'll just work. And that just basically didn't go anywhere because the real world has so many messy exceptions and special cases that even if 99% of the time like the magnetic sensors and all that stuff just allow the car to drive, the 1% when like someone steps in the middle of the road or there's like a piece of trash or whatever, it just messes everything up. So the thing that actually worked was when said like, "Hey, we're going to not try to avoid the hard problem. we're going to actually try to deploy our cars not in like middle of nowhere but in San Francisco like very messy and let's just let's just deal with it head-on and that allowed the that community to make progress and I think robotic manipulation is going to be the same way that that um past the fully structured world of the factory if you want to go even a little bit outside of that even if 99% of the time it's all like pretty straightforward that 1% when something weird happens means that you really need to the full scope of the problem basically to be addressed. This kind of reminds me I remember Figure had this demo where they live streamed the robot kind of sorting packages when you watched that demo. Is that a did is does it demonstrate generalization in your opinion? >> Yeah. Yeah, I think it does. And by the way, this is something that I find very encouraging is that like I mentioned that it's hard to show generalization in a video. And it's clear that lots of people are thinking about that and that are thinking about how do you like how do you present something that that somebody can watch and take in kind of at a glance what generalization is. I think you can see a lot of creative steps towards that. Live demos, these kind of like really long time lapses. I think it's a great idea and I think that's a like a a really nice way to move towards elevating the importance of generalization in people's kind of conscious consciousness. Um you know we um when we were working on the um the PI star 6 project the RL project that we did uh late last year we um wanted to do some longer uh horizon experiments. In some case it's obvious like we had our robot assembling boxes at at Dandelion Chocolate Factory. So they're like, you know, it's an actual chocolate factory, so they need the boxes. So we run it for several days. Uh but we had this coffee task which was uh the robot was using an espresso machine to make espresso. So what we did is we ran it for 13 hours making espresso drinks. Uh and we are, you know, we tried to be like very uh I guess um environmentally conscious about this. So we didn't want to like throw out the coffee. So after 13 hours, everyone in the office was like a little wiry cuz someone has to like drink the coffee. But it like it ran for 13 hours and it was pretty cool. But it it screwed up a few times. Like it'll um spill all the the coffee grounds and then it needs to go and get like a cloth and wipe it down. But like it does it and it's you know nothing exploded 13 hours went by. Probably the most negative consequence was like loss of sleep from too much caffeination. >> But when it spills the coffee grounds and cleans it up is that's it did that by itself. >> Well, so the way the way that that experiment was done is that there is a high level prompting. So like roughly the prompt is updated maybe every like uh 5 minutes or so like in between semantically coherent tasks. So you tell it like make espresso, clean up the machine etc. So those steps the actual like clean up the the machine was commanded by a person. Um in principle we could automate that. In fact one of the things we're spending a lot of effort now is improving our high level policy that does those commands. But for that experiment yeah like every 5 minutes somebody basically updates what is being asked to do. Like the way we intended it was like the commands would be like if you go to to an actual coffee shop, you say like, "Oh, I want a latte. I want an espresso." Like that was supposed to be the prompt. Except then you also have to tell it, "I want you to clean it up before you do the next one." [laughter] >> That makes sense. Open AAI, Enthropic, Cursor, and Versel all use this product to make their lives better. And the problem it solves is when you're building SAS or an AI product and you want to sell to other companies, there's all these requirements you need to meet.