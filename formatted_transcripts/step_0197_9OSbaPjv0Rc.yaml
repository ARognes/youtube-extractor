you know that all the symbols on the screen you can sort of connect them to things that you've experienced in your life and you can make an analogy there. So, a lot of that, like even though it kind of seems like these simulated environments reflect aspects of the real world, to us, they make a lot of sense because we kind of bring to bear a lot of our own prior experience and we fill in the blanks that that the that the that the simulation has. Um, and also if you if you want to use uh data uh you yourself as a person of somebody else doing something, if you you watch someone uh let's say cooking a meal, right? Um, even though you don't experience every movement they're experiencing, you have a lot of that knowledge that you bring to bear and you're like, "Okay, I see they're picking up the salt shaker. Like, I've put salt on things before, so I kind of roughly know what's going on there." And I can file it away at this level abstraction of like add salt without having to like figure out all their muscle movements. So my point with this is that once you have that understanding of how you do things physically with your own body and how you experience the physical world, now all these other sources of knowledge can be connected up to it because that foundation you get from your experience helps you ground everything. So where I'm going with this is that if we have a robotic foundation model that is trained on lots of real embodied data that provides that grounding, it might actually be much better able to absorb other sources of knowledge. And this is actually like a little bit upside down relative to how some people think about it because it's very tempting looking at the success of like internet data for LLMs to say well maybe we should do the opposite. Maybe we should like start with like YouTube videos and then put robot data on top of that. But I think it's actually the other way around. And I actually I even have like a little bit of evidence for this. So my um my colleague uh sir Saraj together with um uh Simar from Georgia Tech they had a project together uh a while back where they took our robot foundation model and they added human video data but they they didn't start with human video data. They actually started with a model train on robot data and then added video data on top of it. And what they did is they looked at the representations inside the model. Uh basically how does the model represent human experience versus robot experience? And they found that if you use a small model with a small amount of robot data, predictably the human experience and the robot experience are fully separated. Meaning that the feature representations are different. But if you train on lots of robot data from lots of different robots, then the features are grouped much more by what task is being done rather than by whether it's a human or a robot. And like when we looked at the feature plots, it was just like mindboggling because we literally when you when you crank up the amount of robot data to 100%, they just line up perfectly. like you you see the you know you do this TC embedding you see the shapes of the embeddings and it's just all task identity and like minimal sensitivity to embodiment and to me that's kind of mind-blowing because like this the base model wasn't trained on any human data at all but once you start adding human data it represents it exactly the same way and I think that's really exciting and I think that that to me is like one one of the strongest indicators that if you have that good foundation of robot experience you can put everything else on top of it and it's actually better at absorbing that >> is it important that that base model has data that was collected using that specific set of motors, specific set of joints. So far, we've uh obviously put a lot of effort into cross embodyment models that can handle many different robot types, but generally you do need data of the robot you're going to be deploying on to get good performance. Uh so kind of the metric of uh of generalization there is not can you zero shot a new robot but it's mostly can you get away with less experience from the new robot and transfer skills from other robots. Okay so that's the current state of things. Now there is a little bit of a kind of surprisingly positive read on that which is even though you need data from these robots um the amount of special stuff that the model is doing is uh kind of minimal. Like when we started doing all of this, I had like a big long list of all the cool research I wanted to do to better accommodate different morphologies like can you like factoriize the model's representation in some way so that there's like a you know a six degree of freedom arm head and a seven degree head and a gripper head etc. We didn't do any of that like we the model just outputs like a big vector of numbers. Uh if the robot has less degrees of freedom than the number it outputs it just zero pads it. There's just like nothing fancy. Uh and that's it. and then it just train on all the robots and outputs the correct actions based on what is seeing through the camera essentially. But now to to your point about whether you can uh handle new robots. Um so so far the thing that we focused on and I think this is showing some promise is to be able to transfer skills between robots and this is actually where the um particular choices in how the model works uh seem to matter. Um for example uh you can have a model that does some intermediate thinking and that thinking can be done in different modalities. So you can think in text and thinking in text is really good for transferring um highle behavioral structure. So that's basically how you understand that hey if I want to like clean the kitchen and put away like the silverware first open the drawer like that's kind of a semantic inference and you can transfer that uh very well because obviously that's like largely agnostic to any embodiment or anything like that. But even lower level things can be transferred if you use the right representation. So one experiment we did is we had a a thinking stage that is expressed in images where you basically like dream up an image of the next milestone in the task. And with that, we could actually get um a robot, the UR5 robot to fold a t-shirt, even though we didn't have any t-shirt folding data on the UR5 because while getting the the the arm motions correct is very hard because the robot basically requires very different joint angles to do the task, uh cooking up an image of what it looks like for it to fold a shirt is not that hard because like you've seen the robot arm in all sorts of different poses. You've seen the shirt in all different stages of being folded and unfolded. You know roughly where it should hold it. So getting a good generative model to cook up that image is pretty straightforward. And once you have the image then from that backing out the correct actions is easy too because you can just look at the synthesized arm angle and just like back out what the angle should be. So it it's it's not changing the problem but it's just introducing this intermediate step that makes it easier to solve. Just like if you're solving a math problem if you figure out like the right intermediate step kind of the answer is obvious from that intermediate step. And I think that's really exciting because now now that shows that this level of generalization across robots and I'm sure other generalization too can be facilitated with thinking just like an LLMs but with a twist. You have to think in the right modality. >> Interesting. So it it outputs a I guess that image is what its video sensor is seeing and it's like the next step. >> Yeah. You can almost think of it like image editing. You can do the same thing with video. You can do it with video prediction. But the key is to like imagine what it would look like to progress on this task. Like that seems like a very human thing to do, right? You know, some things you can you you plan semantically and some things you plan spatially. Like if you're doing rock climbing, you're probably not thinking like, hey, left arm to rock 37 cm to the left. You're probably more like imagining your arm reaching for the rock. Earlier in the conversation, you mentioned that Whimo was very inspiring and um you know their kind of path to productionization is proof that you can do real world generalized robotics. And if I recall correctly when I was, you know, a lot younger, it was kind of this early promise of this is going to happen and then in reality it took a lot longer. And so I guess my question is in the case of humanoid robotics, what would make you say singledigit years it's coming versus a long tail and you know policy challenges as well. I could imagine. >> I think one big difference between how robotic foundation models address the problem and how more traditional engineered systems address the problem is that the stack is really thin. So it's not easy to train a foundation model. You need to uh obviously you need to get the right data. There's a lot of work that goes into curating, labeling, all that other kind of stuff. But the actual software that runs on the robot is very very simple. Uh so uh you know you might have some kind of thinking or reasoning stage. You might have uh you might have the model produce actions. It needs to be fast enough. But the like just if you think about in terms of raw lines of code, it's much much lower than a more traditional AV stack. Uh and you know, partly that's because modern autonomous vehicles, the work on that started a lot earlier with very different technologies and evolved over time. Partly it's also because the problem is more safety critical. Like yes, you don't want uh a robotic manipulator to like drop a fragile object, but at the end of the day, that's a lot less bad than having a car hit somebody. So that is not to say that the safety challenges with robots are uh are not real. They're very real and it's very important to tackle them. In fact, it's probably one of the harder ends of the problem. But they are not as much of a hard stop to practical deployments because you can come up with tasks and environments and domains and also physical hardware where those problems are a lot less uh severe. So uh I think that that that combination radically simpler software stack plus uh less uh drastic software challenges I think actually make it a lot easier and because you know to your earlier point uh that there is this kind of flywheel effect that there's a positive feedback loop that uh you know starting to get things out in the world even under some constraints will actually facilitate getting them out more and more. I think a lot of people are familiar with this idea of a post-mortem, you know, looking back on why something failed. But in this case, I'm curious, what would you say to a a premortem? And in the sense of if humanoid robotics did not succeed in single-digit years, what do you think would be the most likely reason why humanoid robotics failed? Ultimately, for these things to to be truly useful, they do need to reach a level of reliability and robustness and generalization that is higher than what we typically expect from LLMs for example uh or uh you know generative AI for like images and video because typically like these tools they are very much human interactive tools like you you get an LLM to do something and it doesn't do quite what you want so you sort of revise your prompt and you you basically like you iterate with it and and that's why like even the earlier um LM tools like the first version of Chad GPT, even though they were much more primitive than what we have now, they were still already useful because somebody could just like keep hammering out until it it basically solves their problem. You know, just like if if you're using a search engine, like you type something into the search engine, you don't get quite what you want. You revise your query and then you get what you want. Whereas with a robot, like the the full value of it is unlocked when it's actually doing the thing autonomously. So it's it's having to have somebody like constantly iterate for every single task is almost like antithetical to the benefit that you're getting. So I think a lot of the risk has to do with how easy is it to get that level of reliability and robustness. And that's again where some of the demos might be like a little bit misleading because if someone shows a demo of the robot doing something cool I mean you know obviously if if everything is presented in a forthright way that's that could still be very good indicator of progress but it doesn't make it obvious how far or how close it is to reaching that practically relevant level of robustness. So, I'm personally a big believer in uh using uh techniques like reinforcement learning that can actually benefit from autonomous experience to kind of fine-tune that last few percentage points to make it go from like 95 to actually 100%. But that's really important and it's not yet a solved problem. >> If it did take longer than expected, it's because the bar is higher. because the bar is higher and in particular like those last few uh the kind of the last inch so to speak is something that requires not just really good models but also new innovations in technology. I mean I don't think that you know I'm not the kind of person that would say like oh we should like throw out everything that we know about foundation models and start over. I don't think it's that at all. I think that roughly the puzzle pieces that we have are actually very good puzzle pieces. But still we should acknowledge that right now the methods and the models need more work to cross that level of robustness. >> In LLMs it feels like everyone is doing kind of the same thing but different flavors in the robotics industry. Is it is everyone doing kind of the same thing? Are there any hottake architectures that are different direction? I actually think that there's a lot more heterogeneity than it might seem. Um, one big dividing line that I think is maybe not as obvious uh from just kind of looking at the results is the distinction between kind of fully embracing the foundation model ethos so to speak versus uh focusing on spec specific like kind of vertical areas. And I think this is like kind of hard to tease out sometimes because obviously like you know everyone's going to say like oh I'm doing the thing that LM did like because like that's the cool thing but you know the foundational model ethos fundamentally is something like this that if you have a particular problem you want to solve it is better to train a more general model that can use data from a breadth of problems and if you do it right it'll actually be better at the specialized problem you want to solve than a narrow specialist. So you know to again to come back to the LM analogy if you want to do machine translation don't build a machine translation system build a language model that understands all language tasks and then throw it at machine translation and in robotics I think that is like actually very deeply uncomfortable to people because if someone is actually like working on an application like they're doing like warehouse automation it is very awkward to then to to like think like oh if I want to do warehouse automation let me like collect data of like putting away silverware in kitchens. It just it just sounds bizarre. But that is the foundation model lesson that if you have enough breadth, if you collect data from a wide range of different tasks, then you will acquire those generalizable skills and if your model is is is built correctly, it will repurpose those skills for whatever situation it encounters. So I think it is actually true that if even if you want to build a warehousing robot, you're better off collecting a breath of data and will be better at handling all the weird edge cases you might encounter even in that warehouse domain. But this is not something that's easy for people to accept because it's just so like antithetical to the uh principle of building kind of a a traditional vertically integrated robotic system. >> I noticed this this uh new interesting phenomenon with these AI companies which is if they are wildly successful it creates this um I guess worry or new set of things. So for instance when enthropic became had a very powerful model then the government comes in and there's these you know worries about safety and and risk and all that and I'm I'm curious how you think about that like if if physical intelligence this year had a phenomenal incredibly capable generalized model how do you think about those kinds of topics that might come up >> working on AI safety is not a new uh my my colleague at UC Berkeley Stuart Russell was talking about this stuff like over a decade ago and lots of people spent a lot of time working on it. It's just that the trouble is when the technology moves so fast the important problems are not just a function of like you know the core principles it's also a function of how society reacts to it what kind of tools are adopted and so on um and I think that's very very hard to anticipate so um I don't have like a very satisfying answer here in terms of how we are approaching it our philosophy around all this stuff is basically one of empirical experimentation like let's get stuff out there. Let's see what happens in the real world. Let's see what goes right and what goes wrong so that we have as much of a preview for you know what the technology can do, what are its weaknesses, what are its strengths uh and and so on. But you know at the end of the day you kind of have to just like keep your eyes open, see what happens and adjust as you go. It's it's very hard to anticipate. And you know, I think your question though is very spoton even though I don't have a great answer for you because like yeah, if we're having like this much um concern and and uh issues with AI systems that are basically limited to using computers, we're presumably going to have strictly more concerns and issues with AI systems that can do everything in the physical world that we can do, right? So the issues are real. It's just, you know, you kind of have to like see what happens and then adjust. And that's kind of in the the scary path. But in the in the happy path, if everything goes well and we have incredibly capable models and uh robots in 10 years, is the north star that that's the end of human labor. I believe it's a mistake to think of robots as mechanical people, right? like um you know computers at some level are kind of like mechanical brains but when personal computers like really took off in the '9s early 2000s etc. It's not like the first thing that happened is that you know people replaced their brains with computers rather what we saw is actually a proliferation of very different kinds of computers. We saw kind of like uh ubiquitous computing. So you would have a computer on your desk but you might also have one in your pocket. You might have one in your refrigerator and in your car like because computing became so accessible, you could have a little bit of computing in everything. And you know, I don't think that that's what like the the people that first started thinking about this stuff in the 40s and 50s would have imagined. They would have imagined like, you know, roomsiz computers that whose job it is to like control the the the you know, the policy of an entire country or something rather than like a little bit of computer in everybody's refrigerator. So I think it's it's you know by analogy of that we might imagine there might be like a little bit of physical actuation in everything and it might just be like lots of everyday things that you have to do yourself now you get like a little bit of help with it. I think the other example that's worth thinking about is um modern coding agents, right? So I I think that you know this is something where of course the jury is still out as to what the endgame of coding agents is, but certainly uh from the experience of uh software engineers today. Like it kind of seems like probably fair to say that most would consider coding agents to be more empowering them rather than like uh you know uh somehow causing them to have a panic. I mean, obviously some people might might have a panic, but in general, at least from the software engineers that that I've talked to and from my own experience, it's more empowering to have to kind of be able to amplify how much work you can do uh with AI tools. So, I think from that and and that maybe is like a pretty direct analogy because that is straight up an example of an actual real job where AI has entered into it and has actually provided more leverage to people doing that job. So I think that's another example that we can look to but you know the truth is that I think it remains to be seen. >> So in in LLM's there's a few seinal papers that if you read those papers you kind of get a sense of the lineage of the breakthroughs that mattered and understanding where we are today in the robotics industry. Are there a set of top papers that you really think kind of show the breakthroughs that people should know about if they're curious about the state-of-the-art in terms of uh humanoid robotics? One thing I would point out um uh and this is like partly a shameless plug because I am a co-author on that paper though candidly like uh like 99.9% of the work on this was done by by um Tony who was lead author is the uh the original ACT paper the Aloha paper. It's kind it's an interesting example because in some ways the ideas weren't really that new but they were illustrated in a really nice way and the idea was that hey um if you set up the right kind of lowcost robot setup in in his case it was based on um these robot arms from Trusson Robotics that they're like $7,000 hobbyist arms. He set them up in a banual setup with a leader follower to the operation device. And he showed that actually if you do it right without really any particularly fancy tricks, you could easily collect the operation data of extremely dextrous tasks that people had previously thought would require like very sophisticated hardware and all sorts of like really expensive stuff and then set up like a fairly straightforward transformer-based model and it could actually do a lot of those tasks. And it's kind of like an interesting thing because usually in academic research we put a big premium on like you know do you have some like sophisticated new mathematical thing or some sophisticated like uh technical insight and in that paper which I think at this point has been hugely influential. The insight is really just like yeah just put together the right pieces and have a little bit more faith in what a simple robot could do so to speak equipped with a good intent learning system. and he showed like things like um uh replacing batteries in a remote control. Uh he even had he even got like a little like a mannequin foot and he showed that you could put a shoe on it like for like an assistive task sort of like you know some some people need help getting their shoes on so that's good. Um but like what what people find found I think so interesting about that paper is just how far you could get with like relatively simple building blocks. And at this point the the a like he he open sourced the code for it and the act code has been used by like lots of people sort of like if someone wants a very basic starter kit for like robotic learning that's usually what they grab and I think that it's worth for somebody who wants to get into the field to go through that paper and really understand what's going on there because even though in some ways it's not that sophisticated I think it provides like a bit of calibration on what matters right like you know the details matter But the details don't have to be complicated. >> Before all this uh large model robotics kind of uh wave prior to that um Boston Dynamics had these really impressive demonstrations and tons of um mind share. I guess I wasn't even in the field by saying wow they're really doing incredible robotics. And then in the last I don't know how many years I don't really hear about them much anymore. Um is there some shift in the industry that made that so or you know is that something you could explain? >> So the way I would explain it is this that um there are you know robotics at at some level is about building complex systems. So um even though it kind of it's very tempting to say like oh there's different areas of AI there's like LLMs and vision and robotics one of those is not like the others because for robots you actually need like all the parts everything from like how you you know uh how you wire up the robot what the power source is what does the actuator look like all the way to how does it do like high level planning to determine like what task to do next and even though it's kind even though we could look at these things and say like oh all of these different videos and different companies and different demos. They're all robotics. They're really kind of a different parts of the stack. Um, a lot of what the classic Boston Dynamics results show is um, very sophisticated hardware, very carefully designed hardware with a uh, traditional control approach with very smart controls engineers setting everything up, but with comparatively less emphasis on the kind of decision-m aspect and I think that there, you know, at a particular point in time that actually made a lot of sense because we can't build the physical body like it doesn't matter what kind of decision making system is running on it. Um but uh to our earlier discussion about generalization, you know, at this point we're at a stage in the development of these things that even though we can do more on hardware, in many ways it's good enough. And the big challenge is how to have the decision-making loop that actually works and that reacts intelligently to everything in the environment. And the way and the place where I would draw the the dividing line between those is it's like decision-m loop doesn't mean symbolic decisions. It could mean low-level decisions. The question is do you need to take the rest of the environment into account or are you just dealing with the robot? So if you want to do a backflip on flat ground, you most have to deal with the robot. But if you want to pick up a coffee cup off of a table, even though that's maybe in some ways simpler than doing a backflip, you really have to understand what's going on in the rest of the world rather than just your own body. And that dividing line, I think the way the technology has panned out, I think it's fair to say that that is the dividing line between AI and controls. Like controls is when you have to control the robot body. AI is when you have to take into account what goes on outside of the robot. and and and I think that that's why you see this divide because I think a lot of the demos where you mostly needed to deal with the robot itself and not the rest of the world really good controls could allow you to could admit a very good solution there a and you know another thing I would say here is like okay if there's a lot of controls work that goes into doing some particular skill well there is actually something to learn from that because if you can handdesign a controller that performs a sophisticated behavior very likely you can also learn that controller. So like just that proof of existence that the thing is possible and not only possible but also simple enough that a person could build it because remember people are you know at the end of the day even even with code these days the kind of complexity that people can handle is not as high as the kind of complexity the AI can handle. So if a person can handdesign something uh to do a backflip or do some acrobatics that's a really great proof of existence that there exists some relatively parsimmonious control law for doing that skill and parsimonious does mean generalizable. So if it's simple enough for a person to design, probably there's something fairly general in there and if you can learn it uh and automate it without having to have the human controls engineers in the loop, that's that's good news. >> And then last question for you is you if you could go back to when you just entered the industry and give yourself some advice knowing everything you know now, what would you say? One thing that I've learned uh over the last uh few years um which I think is a little different than kind of my original mindset is I think that addressing robotics effectively requires using um very broad prior knowledge. And I think that there there's this idea that a lot of people in robotic learning have which I think I I shared initially that you know since people learn things kind of from scratch maybe robots should learn things from scratch too. Um so uh like for example uh in um some of our early work on large scale robotic learning at Google we uh we had this uh what we call the the arm farm project like we set up a bunch of robot arms in a in a conference room actually because we didn't have a proper lab but it was a conference room and we had them all like grasping objects and the idea was well if they grasp like millions of objects they'll learn very general like grasping strategies and it basically worked like they could learn to grasp objects but it was very hard to like take get further from that to the next level. So, okay, now I can pick up anything, but like so what? Uh can like it it didn't serve as a very good stepping stone for more complex skills. And I think part of that was that we were approaching this like very blank slate like let's start from zero and see if knowing nothing in advance the robot could start picking up behaviors. But I think that it's much much more practical to get all this to work if you can combine robot experience with knowledge that you can pull in from other sources. Like for example, I was very skeptical initially about the utility of language and I think scientifically this is defensible which is that like hey um you know like animals can do some pretty impressive things like monkeys can do really cool stuff but monkeys as far as I know can't speak at least not very eloquently um so maybe our robots should also be able to do stuff and they don't necessarily need to understand language but I think the subtlety there is what's important is not language it's it's prior knowledge that you can put in as a scaffold on your learning process. And you can pull in that knowledge in all sorts of ways. Like, you know, humans don't necessarily pull that in entirely through language. Humans all and monkeys certainly don't. Uh they do it from observation, from observing other people, other creatures and so on. So, there's lots of sources of prior knowledge. But the point is that you got to get that prior knowledge in there. Otherwise, you're actually faced with a harder problem than what humans and animals have to solve. Because like, you know, if a person had to figure out how to like assemble IKEA furniture, but they've never actually encountered any article of furniture in their entire life, like [laughter] okay, that would be like pretty difficult because they don't even know what like what the point of this is or what the the endgame looks like. Uh so yeah, prior knowledge is important. And while I'm still a big fan of learning things through experience, I think that, you know, my advice to myself would have been take prior knowledge more seriously. >> Awesome. Well, thank you so much for your time, Sergey. I really appreciate it. >> Yeah, thank you for your questions. Hey, thank you for watching this podcast. If you liked it and you want to see the show grow, please support with a comment or a like. Also, if you have any recommendations for people you want me to bring on, please drop a comment. Guests like Barbara Liskov, Mike Stonereaker, Mark Brooker, these were all people that I brought on because someone left a comment. On another note, aside from the podcast, I'm working on building the ergonomic keyboard that I wish existed. Here's a glance at the prototype. It's a split keyboard, so there's two sides. This is in the case, but yeah, we launched on Kickstarter and we hit our goal within eight hours of launching. I really appreciate it if you were one of the people who grabbed one of the early units. Um, we're now working on the long journey of building the tooling now. And so, if you still want to pick one up, I've left the late pledges open on Kickstarter, so you can grab one there. I'll put a link in the description. Thank you again for watching the podcast and I'll see you in the next
