he mistakes, they're almost like what you would associate with like a child trying to do the task. So now now now it just needs to grow up. >> You mentioned uh the advancements. They're kind of happening all over the industry. And I I know there's a lot of people building humanoid robots. There's Figure, there's there's Tesla and there's many other competitors and you have the expertise of what is hard and what isn't. When you look at the competitors, has there been any advancement or achievement where you think, "Oh, that's really admirable and that's impressive." actually think that one of the most inspiring things to me in the industry is to see the um the kind of takeoff that autonomous driving systems have had because you know like one of the criticisms that is sometimes leveled against robotics researchers is uh you know it's it's like uh you know same as like nuclear fusion like it's it's the technology of the future but it's always in the future but that's what people said about autonomous driving too and now like you know we're in San Francisco you can go outside you can take a Whimo and it will actually like take you to your destination and there's no driver sitting there So I like you know without getting too much into the technical details I think what's really inspiring about that is just like this case and point that yes you can actually have one of these technologies of the future and it actually does land and I think it's not an accident that it's landing now in the mid 2020s because a lot of the puzzle pieces for largecale ML are getting to the level where we can put them together with like actual physical systems and there's a lot of differences between driving and robotic manipulation of course but I think the illustration that like yeah we can actually land uh learning based technologies in the real physical world I think that's really inspiring >> if openthropic started investing you know more heavily into robotics how do you think that would impact the industry do you think competitors would be you know worried about that robotics is um is an area where maybe to be fair like the ecosystem hasn't been as healthy as it has in other areas of machine learning And what I mean by that is that um like computer vision and NLP are things that sort of lend themselves naturally to a machine learning based ecosystem because there's freely available data. Uh people kind of have a a general acceptance that they're going to be using learning. You know, there aren't concerns as severe concerns about like safety, at least physical safety, right? You know, people rightfully are concerned about AI safety, but it's not the same as like a physical device uh causing some physical harm. um and uh because of that I think it's a bit easier to spin up a very serious large scale ML effort in those areas. Robotics is not like that. Robotics traditionally is not a discipline that um you know really embraces sharing of data for example. So I think that the more activity there is around learning in robotics, the more I think it'll shift people's thinking towards this kind of future where we accept that robots will be controlled by learned models, not by handdesigned controllers, that there will be data that data will need to be shared because there's no way that somebody can uh build out a true foundation model in a single vertical uh and basically kind of like shift the entire thinking around robotics to look more like how we think about vision and NLP as opposed to traditional factory automation. So I think in that sense like you know much as I'm like proud of the work that we're doing in physical intelligence I think it'll take more than one company to kind of like shift every everyone's thinking in that direction. As a bystander I see on Twitter these really impressive demonstrations of Chinese robotics. It it almost feels like they're ahead in some sense but I don't have that uh deep domain expertise. And so I was curious your thoughts on, you know, what do you think of China's robotics and, you know, are are they further along? >> I think that one thing that um is very useful and constructive for for us to do uh those of us that uh work on these things in the United States and in Europe, uh is to ask what is the lesson to learn? And to me one lesson is that it's important to have a healthy ecosystem and ecosystem means that there should be um you know obviously good researchers, good engineers working on these things. there should be like healthy open source but it also means that the different industries that contribute to robotics need to individually be very healthy and those industries are not just the um you know computer science ML and and model building stuff it's also uh supply chains manufacturing hardware R&D like these are all very important things and aspects of those things are things that uh the United States does quite Other aspects of them are things where the United States has sort of uh you know let things go a little bit. Uh and I think that what we should do is we should look at what's going on in the world look at the uh some of the uh excellent results uh that uh Chinese labs are doing that labs in other countries are doing and we should take away that lesson that we should strive to build a healthier ecosystem and that means investing in all the different facets uh that contribute to this. So you know I'm not like I'm not much of a business person. I'm not much of a investment person. So I don't I can't claim to know how to do this, but I think that it's important to sort of fully embrace that this is like a holistic thing and not something where we can do just like one piece of it and like outsource everything else basically >> of all that the pieces of the ecosystem are there parts of it as a robotics researcher in the US if it was better that would have the biggest impact on the advancement of robotics? Yeah, I I think certainly um availability of reliable lowcost 