transcript: '{"content":"\n[3.352s] Ничий последовател.\n[13.465s] За Иън и Гела\n[18.645s] Хората, които ни подчиняват/поробват, не винаги са видимо зловредни.\n[22.447s] Някои идват под формата на герой, защитник, спасител.\n[26.634s] Ние открито ги приветстваме, без да осъзнаваме, че пускаме троянски кон.\n[33.641s] В есето си \"за свободата\"\n[35.949s] философът Джон Стюарт Мил обсъжда значението на индивидуалността.\n[40.677s] Мил вижда свободното развитие на индивидуалността\n[43.609s] като един от най-важните елементи на човешкото благосъстояние.\n[47.477s] Когато пасивно позволим на света да управлява живота ни, ние ставаме безмозъчни машини.\n[52.971s] Нашите човешки способности избледняват и се изчерпват.\n[56.66s] Като не следваме природата си, в крайна сметка губим природата си(себе си).\n[61.533s] За разлика от това, когато управляваме собствения си живот, ние прилагаме и развиваме всичките си способности,\n[67.72s] включително нашето мислене, нашата преценка, нашия самоконтрол.\n[71.69s] За Мил, индивидуалността води хората най-близо до идеала за това, което могат да бъдат.\n[76.812s] Той посочва, че идеята за съвършенство, на никого не е просто да копира другите,\n[81.415s] и че оригиналните прозрения, които произтичат от индивидуалността\n[85.28s] са движеща сила в човешките иновации.\n[88.813s] Мил казва, че би било абсурдно да живеем така, сякаш нищо не е научено за света, преди да се появим в него.\n[94.361s] Но трябва да се чувстваме свободни да оценяваме критично, традициите и обичаите, в които сме родени.\n[100.34s] Не сме длъжни да следваме празни и остарели правилници, които не предвиждат нашето съвременно разбиране.\n[107.494s] Напълно неразумно е да се продължат практиките поради факта, че те \"винаги са били така\".\n[113.351s] Тяхната обосновка, изисква доказателства за постоянна значимост.\n[117.489s] Поради тези и други причини, Мил осъзнал че\n[120.61s] винаги е имало нужда хората да откриват нови истини\n[123.791s] и да ни информират, когато старите истини вече са загубили \"истинността си\".\n[128.102s] И тази нужда се основава на запазването на индивидуалността.\n[132.224s] За Мил всичко, което потиска индивидуалността, се квалифицира като тирания\n[137.276s] независимо дали става дума за служене на хора или за предполагаеми свръхестествени същества.\n[143.041s] Тиранията често се разглежда като открито приложение на брутална, неразумна и корумпирана власт и контрол.\n[151.773s] Представяме си как тираните открито използват заплахи и сплашване,\n[156.314s] за да ни вкарат в орбита около тях;\n[158.615s] принуждавайки ни да се подчиним на техните идеи.\n[162.037s] Но хората, които ни подчиняват/поробват, не винаги са видимо насилствени.\n[166.682s] Някои вдъхновяват нашата искрена лоялност. Дори любов.\n[172.308s] Някои идват под формата на герой, защитник, спасител;\n[177.604s] някой, който ще ни спаси, ще ни излекува, ще ни просвети, ще ни утвърди.\n[183.914s] Приветстваме ги открито, без да подозираме, че пускаме троянски кон.\n[189.617s] Както при тиранина, ние попадаме в орбита около тях\n[193.193s] подчинявайки се на техните идеи.\n[195.563s] Както при тиранина, това подчинение носи същата вреда:\n[200.229s] потиска нашата индивидуалност,\n[202.321s] забавя нашето развитие;\n[204.157s] потиска нашите човешки способности —\n[206.436s] нашето мислене, преценката ни, самоконтролът ни;\n[210.451s] и на по-широко ниво\n[212.235s] саботира човешките иновации и напредък.\n[216.047s] Тази способност да вдъхновява искрена вярност, прави подчинението ни на героите най-трудно да се преодолее.\n[224.04s] Вярвайки, че са истински добри\n[226.335s] ние се превръщаме в техните верни защитници, техните поклонници, техни ученици.\n[231.724s] Ние сме водени от тях. Оформени от тях.\n[234.5s] Често искаме да привлечем другите в това подчинение заедно с нас.\n[238.088s] И ние сме подозрителни и враждебни към онези хора, които отказват.\n[242.42s] Очевидно, да се каже, че всички герои са зловредни по природа, би било глупаво.\n[248.257s] В книгата си \"Ефектът на Луцифер: защо добрите хора се превръщат в злодеи\"\n[253.371s] психологът Филип Зимбардо дава редица примери за истински полезни герои,\n[259.74s] от разобличители, до укриватели на преследвани групи;\n[263.863s] от лица, \"които организират живота си около хуманитарна кауза\";\n[267.877s] до ежедневните герои, които предприемат решителни действия, когато ситуацията го налага.\n[273.468s] Ясно е, че героите съществуват в диапазона от полезни до вредни.\n[278.559s] И естеството на героя е сериозен фактор за това дали ще се окажем подчинени.\n[283.83s] Но може би най-важният фак��ор е начинът, по който самите ние, си представяме героите.\n[289.611s] Когато разглеждаме героите реалистично като податливи на грешки хора, с налични качества, идеи и умения,\n[297.51s] можем да ги оценим достойно и да се учим от тях, без да се подценяваме.\n[302.627s] Докато поддържаме този практически възглед,\n[305.703s] всеки зловреден герой, който търси покорни последователи, за да ги доминира, ще бъде разочарован.\n[311.931s] Проблемът започва, когато гледаме на героите като на нещо по-голямо;\n[315.601s] когато ги издигнем над себе си\n[317.459s] като нещо превъзходно, непогрешимо, магическо;\n[321.637s] когато ги идеализираме\n[323.31s] като нещо абстрактно, символично, псевдо-родителско.\n[327.922s] Тогава ги превръщаме във фантазии, които вече не са обект на рационална оценка.\n[332.994s] Ние запълваме идеите им с фалшива власт.\n[336.314s] Ние запълваме техните действия с фалшива праведност.\n[339.589s] И те се сдобиват с нов последовател.\n[342.653s] Ние сме особено податливи на фантазии за магически герои, когато се чувстваме безсилни.\n[347.96s] Когато сме подложени на тирания, можем да мечтаем за защитник, който се присъединява и ни спасява, задвижван от чист алтруизъм.\n[356.676s] Ако някой изглежда отговаря на това описание, не винаги сме готови да попитаме от какво трябва да се откажем, когато приемаме услугите му.\n[366.051s] С отслабена защита и бдителност, не забелязваме, че сменяме един вид подчинение с друг.\n[373.049s] Можем да видим, насилствени взаимоотношения с героите от религията, политиката, бизнеса, терапията, в семейството.\n[381.946s] Искам да разгледам някои сделки с дявола, които приемаме, когато сме подведени.\n[389.176s] Религиозен последовател.\n[397.4s] В своята статия \"Промяна на света и промяна на себе си\"\n[401.257s] Ротбаум и колегите му\n[402.707s] казват че, подчиняването на силни лидери, групи или богове ни позволява да почувстваме, че се присъединяваме към тяхната сила.\n[409.629s] По-специално те вземат за пример непрекия контрол, наблюдаван при религиозните явления.\n[414.775s] Например, когато говорим че \"Бог ни дава сили\".\n[418.55s] Разбира се, тази непряка сила е само отразена сила.\n[422.901s] Луната няма собствена светлина.\n[425.47s] Тя просто отразява слънчевата светлина.\n[428.004s] Без слънцето луната щеше да изчезне.\n[431.496s] Пасивното къпане в чужда светлина, не е начин да се сдобием ние със такава.\n[436.99s] Но някои хора, които се къпят в светлината на магически герои, започват да я бъркат със собствена светлина.\n[442.901s] Александър Поуп в есето \"опит за критика\"\n[445.985s] ни предупреждава да не се поддаваме на надцененото чувство за нашите способности:\n[451.049s] Непознаването е опасно нещо, това е сигурно;\n[453.837s] Пийте много или не опитвайте Пиерският извор;\n[457.63s] — метафоричен източник на знания —\n[460.616s] Че там малките глътки опияняват мозъка;\n[463.733s] И пиенето по много, ни отрезвява отново.;\n[467.236s] Ако разгледаме увереността на хората по отношение на тяхното знание,\n[470.436s] понякога откриваме преждевременен връх на преувеличеното самочувствие в самото начало.\n[475.854s] С малко научени знания, надценяваме нашата компетентност.\n[480.732s] Когато безкритично се подчиняваме на магически герои, особено на предполагаемите непогрешими божества,\n[487.667s] нашата убеденост може да се развие до абсолютна сигурност.\n[491.75s] Нашият магически герой се превръща в наш стандарт за истината.\n[495.527s] Всяка истина, която противоречи на нашия герой,\n се превръща в лъжа.\n[499.362s] Ние показваме непоклатима вяра в това, което ни казват нашите герои.\n[503.361s] И малко разбиране за казаното.\n[506.189s] Магическите герои могат да ни накарат да останем в арогантно невежество в продължение на десетилетия.\n[512.563s] Много от нас, които стават техни наивни последователи, остават на този връх до края на живота си.\n[519.7s] Тези от нас, които започват да осъзнават, че нещо не е наред, са изправени пред смирено потапяне в съмнение и отчаяние.\n[527.391s] Това потапяне ще бъде познато на много хора, които са успели да се освободят от магическите герои.\n[533.5s] И аз го преживях като тийнейджър,\n[536.6s] когато бидейки индоктриниран в Християнството\n[539.74s] осъзнах, че вече не съм убеден в твърденията му.\n[543.484s] Живял от години високо в облаците\n[546.42s] един ден, се заех да намеря солидни и честни обосновки за моята отдаденост.\n[551.37s] Аргументи, които биха могли да издържат на всякакъв строг анализ.\n[555.019s] Вместо това открих, че съм бил част от гигантска система за емоционално изнудване.\n[560.515s] Много магически герои се занимават с такова изнудване,\n[563.438s] обещавайки да защитят хората от някаква вреда.\n[566.709s] Тази защита често се оказва несъществуваща.\n[571.072s] Магиче��ките герои на Християнските писания\n[573.635s] — Божият герой и човекът, за който се твърди, че е негов син —\n[577.119s] се казва, че предлагат два вида защита.\n[580.248s] Първият вид, е защитата от свят на вечните мъчения.\n[584.231s] Свят отвъд смъртта, който не може да бъде потвърден.\n[588.957s] Вторият вид, е защитата от опасности в този земен живот\n[592.875s] — болести, бедствия, лишения.\n[596.298s] За да получат този втори вид защита,\n[598.786s] последователите трябва да поискат помощта на магическия герой чрез молитва.\n[603.311s] Този втори вид, би могъл да бъде проверен\n[607.5s] ако не беше факта, че резултатът е напълно сведен до случайността.\n[612.321s] На последователите се казва, че техните молитви могат или не могат да бъдат чути.\n[616.857s] Можем да избягаме или да не избягаме от нашия жесток партньор.\n[620.734s] Детето ни може да умре, а може и да не умре от рак.\n[624.932s] Комикът Джордж Карлин каза, че е спрял да се моли на Бог\n[628.66s] и започнал да се моли на актьора Джо Пеши.\n[631.314s] Той отбелязва, че молитвите за към Бога и тези към Джо Пеши\n[635.727s] били чути с приблизително еднаквия шанс от 50% процента.\n[639.721s] Шансът на божествената намеса не може да се различи от реалния шанс.\n[645.804s] Непроверимия свят на изтезанията не може да се различи от страшна приказка.\n[652.06s] И изнудването за защита, което не може да покаже никаква защитна функция, не се различава от обикновеното изнудване.\n[661.514s] Когато нашите магически герои станат определящ стандарт на истината и морала, тогава всички понятия се изкривяват.\n[669.258s] На пръв поглед, някои от тези изкривявания може да изглеждат положителни.\n[673.505s] Но последствията са пагубни.\n[676.234s] Моите бивши магически Християнски герои твърдят, че имат решаващата власт да прощават всички наши прегрешения срещу всички.\n[685.188s] Но прошката трябва да дойде от хората, които сме наранили.\n[689.127s] Никой друг не може да ни прости вместо тях.\n[692.176s] Майка може да прости на убиеца на сина й за собствената си болка и загуба.\n[696.29s] Но тя не може да предложи заместителна прошка от името на сина й.\n[700.972s] Идеята за божествена заместителна прошка\n[704.379s] унищожава концепцията за морална свободна воля и отговорност, на която се основава прошката.\n[710.572s] Това означава, че вече не отговаряме пред хората, които сме наранили.\n[714.628s] Основанията им, да имат претенции към нас могат да бъдат изтрити от трета страна.\n[719.794s] И изкривяването става по-дълбоко.\n[722.12s] За да получим тази безполезна заместителна прошка, ни се казва, че трябва да простим на другите.\n[727.989s] Трябва да забравим за извинения от тях.\n[730.649s] Ако не им простим, нашите магически герои няма да ни простят.\n[735.297s] В тази атмосфера на незаслужена прошка много последователи предсказуемо започват да го приемат за даденост.\n[742.029s] През 2017 г. Амбър ДеБоно и колегите й видяха това в три експеримента,\n[748.418s] където участниците бяха убедени, че не са наблюдавани.\n[751.944s] Християните, на които е казано да четат и пишат за Опрощаващия Бог, са откраднали повече пари и са преписвали повече на тест по математика,\n[759.584s] отколкото Християните, които чели и пишели за наказващия Бог, прощаващия човек, наказващия човек или неутралната история.\n[767.339s] ДеБоно и колеги й отбелязаха:\n[769.564s] \"Изглежда че чувството, че Бог е простил нашите престъпления, може просто да ни остави да се чувстваме свободни отново да извършим нарушение.\"\n[777.508s] Да се каже, че всички Християни ще лъжат и крадат по същия начин, е абсурдно.\n[782.619s] Честните Християни не биха си помислили за това.\n[785.411s] Но това изследване отрязва много Християни и бивши Християни, които многократно са били малтретирани\n[791.643s] от други последователи, които никога не са се извинили и не са коригирали нищо.\n[796.273s] Защото всяка седмица в църквата има принудителна амнистия,\n[800.509s] където всеки трябва да прости на всички останали.\n[803.543s] Или да си понесе последствията.\n[805.977s] Автоматичното опрощение не е свързано с любовта, както изглежда от пръв поглед.\n[812.196s] То блокира нашето морално и социално развитие.\n[815.881s] За зловредните последователи, то отнема стимула за размишляване върху поведението си, за поемане на отговорност и за промяна към по-добро.\n[825.107s] За жертвите сред последователите, това поражда недоволство\n[828.524s] което се очаква от тях просто да продължат да преглъщат до последно.\n[832.628s] Прошката, получена чрез посредник или чрез принуда, е безполезна емоционална фалшификация.\n[839.278s] Когато използваме тези магически божествени герои като модели за подражание,\n[843.077s] приемаме всичко, което казват и правят за правилно,\n[846.111s] ние възпроизвеждаме техния хаос —\n[848.591s] техните добродетели, техните недостатъци\n[851.301s] тяхната мъдрост, тяхната глупост\n[854.195s] тяхната благотворителност, тяхното малтретиране.\n[857.761s] Ние имитираме доброто и лошото, без да осъзнаваме разликата.\n[862.819s] Можем също така да започнем да имитираме поведение, което няма морален компонент.\n[867.589s] В рамките на мистичния клон на Исляма, известен като Суфизъм\n[871.322s] има история за последовател на име Баязид Бистами\n[874.8s] който отказал да яде диня\n[876.809s] защото не знаел как автора на Исляма\n[879.138s] магическият герой Мохамед\n[880.913s] нарязвал и ял дини\n[882.761s] и той не искал да го направи по грешния начин.\n[885.451s] Има подобни истории в Исляма, за последовател, който е направил 360-градусов завой на камилата си след, оседлаване.\n[892.768s] И такъв, който целувал камъни, без никаква друга причина, освен че наблюдавал как неговият магически герой прави същото.\n[899.601s] Повторението на произволни действия е основата на суеверията.\n[905.504s] С напредването на човечеството в неизследвани области,\n[909.083s] пропастта между нашите отдавна мъртви магически герои и нашия съвременен живот става все по-голяма.\n[915.409s] Напредък в технологиите и медицината\n[918.143s] — от Инвитро оплождане до междупланетна колонизация —\n[922.289s] повдигат нови видове морални въпроси\n[924.978s] за които старите прашни писания на нашите магически герои не предлагат конкретни ръководства.\n[930.179s] Дали колонизирането на друга планета би било престъпление в очите на героя, авраамския Бог?\n[935.329s] Може би това е присвояване на нещо, което е било предназначено за други форми на живот?\n[939.269s] Без свещени указания, имаме ограничени възможности.\n[943.715s] Можем да подходим към тези проблеми, както Бистами походил към динята, и да не участваме в никакви неупоменати действия.\n[951.535s] Или можем да намерим нещо близко в писанията и да правим предположения.\n[956.81s] \"Управителният съвет\" на Свидетелите на Йехова\n[959.35s] забранява кръвопреливането въз основа на библейските пасажи\n[962.949s] които забраняват яденето на кръв\n[965.032s] което няма нищо общо с кръвопреливането.\n[968.131s] Или можем да приложим подхода \"да опитаме и да видим какво ще се случи\",\n[971.519s] приложен от същия \"Управителен съвет\"\n[974.383s] по отношение на генетично модифицираната храна.\n[977.84s] В статия от април 2000 г. в тяхното списание \"Събуди се!\",\n[981.979s] те не могат да решат, дали тази биотехнология е равна на това  \"да се правиш на Бог\".\n[988.879s] Статията заключава, че ако е \"да се правиш на Бог\"\n[991.929s] магическият божествен герой би могъл да се намеси и да спре тази тенденция.\n[997.149s] Ами ако не се намеси?\n[999.41s] Означава ли това, че той одобрява?\n[1001.922s] Ами ако той просто мълчаливо наблюдава\n[1005.009s] и осъжда, всички замесени\n[1007.449s] с генетично модифицирана храна, за това \"че са се правили на Бог\"?\n[1012.364s] Тези парализиращи въпроси разкриват основния проблем на последователя:\n[1018.008s] Не можем да преминем отвъд нашите магически герои.\n[1021.379s] Ние сме притиснати от тяхната ограниченост.\n[1024.849s] За да продължим напред, трябва да ги свалим от власт и тяхната безполезна литература.\n[1030.787s] Вземете всяка история от рафта и има шанс да намерите някаква мъдрост, някакво прозрение.\n[1037.34s] Дори готварските книги често се отклоняват от рецепти в някаква полу-лична философия от автора.\n[1044.59s] Всъщност би било трудно да се напише книга\n[1047.02s] напълно лишена от прозрения, дори ако съзнателно се опитахме.\n[1050.649s] Но само защото една книга има някои добри идеи\n[1053.682s] ние не спираме да я проверяваме и не започваме да следваме безумно всяка дума.\n[1058.338s] Дори когато книгите се продават като ръководство за живота, ние все пак решаваме кои части смятаме за полезни. Ако изобщо има такива.\n[1065.861s] Но това не е така, когато приписваме магически статус на автора.\n[1070.136s] Част от развитието на живота, е разделянето на нещата, които погрешно сме се смесили заедно.\n[1075.896s] Като голота и секс.\n[1078.345s] Кръвна връзка и чувство за дълг.\n[1081.865s] Често замъгляваме идеите и хората.\n[1086.461s] Трябва да ги разделим.\n[1088.654s] Добрите идеи могат да дойдат от всеки източник.\n[1091.442s] Дори тирани от време на време изразяват полезни мисли\n[1094.87s] Често започвам видеоклиповете си с цитат.\n[1098.031s] През годините хората критикуваха някои от авторите на тези цитати\n[1101.8s] цитирайки някакво минало прегрешение, незначително или голямо.\n[1105.657s] Те ме критикуваха, че се обръщам към съмнителни авторитети.\n[1109.175s] Но аз не се позовавам на авторитети.\n[1112.012s] Основното нещо в тези цитати е идеята, а не авторът. Авторът е инцидентен.\n[1117.737s] Често много хора се съгласява�� с една мисъл.\n[1121.423s] Понякога до голяма степен не съм съгласен с автора.\n[1125.21s] Източникът не потвърждава, но и не отменя идеята.\n[1129.088s] Идеята трябва да издържи или да падне въз основа на собствените си качества.\n[1133.251s] Ако авторите не са успели да поддържат собствените си заявени ценности\n[1136.87s] получаваме забавен привкус на ирония.\n[1140.312s] Освобождаването от нашите магически герои, божествени или човешки\n[1144.362s] често е просто отделяне на идеите от хората.\n[1148.166s] Удивително е как светът се променя, когато се извърши това просто действие.\n[1154.174s] Слизайки от сигурността на божественото служение\n[1157.615s] може да се почувствате като в криза, след продължителна зависимост от еуфористичен наркотик\n[1162.179s] такъв, който често ни се инжектира от ранна детска възраст.\n[1165.824s] След рязкото спиране на наркотика не винаги сме готови веднага да видим положителната страна,\n[1170.55s] която е че, освобождаването от магическия герой разчиства пътя към знанието.\n[1176.003s] С малко строгост и проникновение\n[1178.78s] можем да изградим здрави основи\n[1181.376s] наслаждавайки се на по-разумна увереност и генерирайки собствена светлина\n[1186.205s] вместо да се къпем във фалшивата светлина на магическите герои.\n[1192.072s] Светски последовател.\n[1198.154s] Магически герои има не само в религията.\n[1201.42s] Можем да ги наблюдаваме в семейството, приятелите, учителите, партньорите, знаменитостите, политиците.\n[1209.235s] Ако имаме късмет, хората, които се опитваме да определим като наши магически герои, ще се откажат от тази роля.\n[1215.251s] Те ще отхвърлят нашите нереални очаквания и ще надживеят нашето разочарование.\n[1220.989s] Всяко отхвърляне на нашите магически фантазии\n[1223.82s] е възможност да се откажем от пасивната си омаловажена позиция,\n[1227.766s] и изцяло да възприемем активно независимо развитие.\n[1231.735s] Ако нямаме късмет, хората, на които дадем магическия статус, ще приемат този статут.\n[1237.937s] Когато двете страни започват да се подхранват взаимно, в взаимно удовлетворяваща йерархична фантазия,\n[1244.193s] тогава тази връзка е трудно  да се прекъсне.\n[1246.495s] Рационалните призиви често са безполезни.\n[1249.084s] Ако нашето уважение и любопитство към истината са достатъчно мощни\n[1253.203s] тогава може би ще искаме да се вслушаме в разума.\n[1255.8s] Но ако комфортът е по-важен от истината\n[1258.916s] — нещо, което изненадващо много хора с радост признават —\n[1262.62s] ще отхвърлим най-разумните гласове\n[1265.4s] като заблудени или дори злонамерени.\n[1268.88s] Като правило освобождаване от фантазия за магическия герой означава избягване на затвора, организирано отвътре.\n[1275.664s] Външна помощ може да бъде предложена. Но ние трябва да искаме да избягаме от нашите фалшиви герои сами.\n[1282.756s] \"радикализирания\"\n[1284.522s] Брус се е чувствал потиснат през целия си живот.\n[1288.13s] Започнало с побой в дома му. По-късно е бил тормозен в училище.\n[1293.728s] В тийнейджърските си години той се сприятелява с мъж в бар.\n[1297.876s] Те говорят за живота и размишляват върху проблемите си.\n[1302.19s] Мъжът разказва на Брус за неговата двоична философия\n[1305.946s] — в живота си или хищник, или плячка.\n[1309.35s] Трябва да избереш кой си.\n[1312.254s] Брус продължава да се среща с новия си приятел\n[1315.01s] който го запознава с група съмишленици,\n[1318.146s] предлагайки му заместващо семейство\n[1320.6s] и чувство за принадлежност, което никога не е изпитвал.\n[1324.34s] С течение на времето му се показват книги и видеоклипове,\n[1327.805s] където определена социална група се обявява за \"врагове\"\n[1331.327s] — причината, поради която в света има проблеми.\n[1333.868s] Гневът на Брус постоянно се разпалва.\n[1336.51s] Той е насърчаван да мисли постоянно за времето, когато е бил потиснат и мотивиран да направи нещо по въпроса.\n[1343.397s] Като снаряд\n[1344.98s] той е напълнен с идеологическо гориво и е пуснат в обществото.\n[1349.75s] Силата, която изпитва, потъпквайки другите, е опияняваща.\n[1355.079s] Брус е хищникът сега.\n[1357.49s] И на праведна мисия.\n[1360.0s] Неговата жестокост се увеличава с постигането на по-голямо удоволствие от насилието\n[1365.982s] и по-голямо признание от новото му семейство.\n[1370.43s] В крайна сметка Брус започва да набира нови членове.\n[1374.427s] Точно като този който го вербувал, той не се интересува какво ще се случи с тези хора\n[1379.09s] Дори е спрял да се интересува, дали ще оцелее той самия.\n[1382.474s] Унищожаването на врага е всичко, което има значение.\n[1386.03s] \"Семейния герой\"\n[1387.354s] Бедилия е боксовата круша\n[1389.77s] в нейното насилствено семейство.\n[1391.905s] Единственият човек, който се отнасял с нея като с човек, бил чичо й Тим.\n[1396.06s] На семейни събития той винаги се отнасял добр�� с нея, когато други близки я унижавали и отхвърляли.\n[1402.428s] В тийнейджърските й години,  когато претърпяла инцидент, Тим бил единственият член на семейството, който я посетил.\n[1408.504s] Само кратко посещение, само за минута.\n[1411.73s] Но за Бедилия това го издигна до статута на магически герой.\n[1417.22s] През 30-те си години Бедилия най-накрая признала на Тим\n[1420.97s] за малтретирането й от семейството.\n[1423.513s] Шокиран е, но не заради тях.\n[1427.04s] Той отхвърля Бедилия като егоистично дете и казва, че напълно е променил мнението си за нея.\n[1433.5s] Предавайки доверието й, той разказва на семейството на Бедилия за нейните обвинения,\n[1438.106s] и е съпричастен с тяхното привидно недоумение и мъка.\n[1442.53s] В продължение на дни Бедилия е погълната от съмнение и самообвинение\n[1448.298s] чудейки се как да изкупи вината си в очите на Тим.\n[1452.852s] За гладуващия човек, трохите са празник.\n[1457.241s] За човек, подложен на насилие, мигът на внимание може да се почувства като приливна вълна от любов.\n[1463.191s] В това изкривено състояние на ума е лесно да се създадат герои от най-тънкия материал.\n[1469.528s] За Брус произволно чувство за принадлежност\n[1472.86s] беше достатъчно, за да засенчи факта, че новото му заместващо семейство доброволно ще го унищожи за каузата си.\n[1479.176s] За Бедилия, Тим изглеждаше като блестяща звезда\n[1483.19s] но само спрямо огромната тъмнина\n[1485.871s] на останалата част от нейното семейство.\n[1487.934s] В действителност той всъщност й обърнал много малко внимание.\n[1491.709s] Нямаше специална връзка.\n[1494.0s] Тим не беше герой.\n[1496.653s] В тези случаи от реалния живот Брус и Бедилия осъзнаха, че търсят семейство на погрешни места.\n[1504.872s] За щастие и двамата намериха други хора, които отговарят на понятието \"семейство\",\n[1510.132s] които показват загриженост за тяхното благополучие\n[1512.501s] и желание да вървят близо до тях,\n[1515.067s] дори и в най-трудните моменти.\n[1518.166s] Възстановяването не беше лесно.\n[1520.513s] Брус беше изправен пред смазващи изблици на вина за насилието, което е причинил,\n[1525.19s] и премина през силни самоубийствени подбуди.\n[1528.893s] Бедилия беше избягвана от цялото си семейство, включително Тим.\n[1533.8s] Но появата на истинска любов в живота им им показа колко лишени са били преди,\n[1540.784s] и това прогони всякакви фантазии да се върнат назад.\n[1545.125s] Жертвите на злоупотреба често гладуват за примери за здрави поддържащи хора.\n[1551.45s] Но гладуващите хора все пак трябва да се научат да избягват отровната храна.\n[1558.133s] \"герой по неволя\"\n[1560.125s] Индиго ангажира Пол като неин терапевт.\n[1563.238s] Тя вижда Пол като човек, който е разбрал живота.\n[1566.671s] Нейната цел е да научи магическите му прозрения\n[1569.88s] и да ги прилага към собствения си живот.\n[1572.256s] Въпреки че Пол първоначално й казва, че не е тук, за да дава съвети, Индиго продължава да пита за такива.\n[1578.882s] И въпреки намеренията си, Пол в крайна сметка й дава съвети.\n[1583.62s] Техните взаимодействия бързо стигат до модела на поведение:\n[1586.959s] Индиго описва някакъв проблем\n[1589.176s] и настоява, че няма идея какво да прави.\n[1592.373s] Пол се опитва да я размисли с някои предложения.\n[1596.842s] Вместо да мисли, Индиго се отнася до идеите на Пол като мъдри инструкции, които в крайна сметка изпълнява.\n[1604.885s] Седмици по-късно Пол се оказва силно изтощен след сесиите си, изпълнявайки цялото мислене.\n[1612.684s] Междувременно Индиго, без да се замисля\n[1615.99s] се почувства напълно зависима от Пол.\n[1619.197s] Пол е герой по принуда.\n[1621.8s] Първоначално той щеше да изгради силно терапевтично сътрудничество с Индиго,\n[1626.463s] като работят съвместно за решаване на проблемите й.\n[1629.392s] Но той не можеше да предвиди силните й очаквания от него.\n[1633.256s] Той я прие за по-независима и самостоятелна, отколкото всъщност е.\n[1637.28s] Докато той не се справи с очакванията й\n[1639.769s] и не й позволи да изпита здравословно разочарование към него\n[1643.002s] той ще остане залепен за трон, който никога не е искал.\n[1646.673s] Този случай от реалния живот илюстрира как можем да бъдем несъзнателно въвлечени от други хора във фантазията на героя.\n[1654.542s] \"въртяща се врата\"\n[1655.948s] Ливия се записва на курс, провеждан от само провъзгласил се гуру за самоусъвършенстване,\n[1661.31s] който обещава на участниците просветление, реализация и щастие.\n[1667.037s] Три седмици тя посещава изтощителни десет часови тренировки,\n[1670.98s] които, както я убедиха, ще й дадат ценно самоусъвършенстване.\n[1675.129s] Казано й е да не критикува гуруто\n[1677.918s] и да не разкрива съдържанието на курса на непознати,\n[1681.134s] и тя получава псевдо философски обосновки за двете правила.\n[1685.69s] Тя непрекъснато се храни с твърдения\nза огромните ползи от курса,\n[1689.332s] и многократно я убеждават да се запише за допълнителни курсове и да убеди приятели и роднини да направят същото.\n[1695.808s] Сесиите са поръсени с псевдо съдържание\n[1699.54s] — смесица от \"мъдрости от фейсбук статуси\" и неразбираема езотерика.\n[1704.921s] Ливия завършва тези три седмици, без да стане по-умна, а с хиляди долари по-бедна.\n[1710.69s] По-нататъшните курсове повтарят този модел, като хранят участниците с безкрайни ритуали, жаргон и самореклама.\n[1719.413s] Докато Ливия потъва в сериозни дългове\n[1722.254s] единственият урок, който е научила, е:\n[1724.74s] \"купувай повече курсове\".\n[1727.059s] Когато инвестираме в самоусъвършенстване, като терапия или формално обучение,\n[1732.36s] понякога очакваме мисленето да бъде направено вместо нас.\n[1735.796s] Приемаме мисленето на клиента:\n[1737.88s] платихме пари, така че очакваме да получим продукта.\n[1741.73s] Всъщност нашето собствено мислене е продукт.\n[1745.183s] Терапевти, учители, треньори — са там само за да насърчат нашето мислене.\n[1751.34s] И за да постигнем ефективен резултат, трябва да си представим какво искаме да постигнем.\n[1756.087s] Какви конкретни области искаме да разгледаме.\n[1758.773s] Какви конкретни промени се надяваме да видим.\n[1761.487s] Проблемите се случват, когато заемем пасивна позиция;\n[1764.671s] когато не формираме цели или когато целите са твърде неясни за конкретна проверка.\n[1769.597s] Това е като да кажеш на таксиметров шофьор: \"О, просто ме закарай някъде.\"\n[1774.174s] Нашите цели дори могат да бъдат магически.\n[1776.52s] Например постоянно щастие, свобода от съмнение в себе си.\n[1780.357s] Това е като да кажеш на шофьора: \"заведете ме в рая.\"\n[1784.844s] Добросъвестните шофьори ще откажат да ни возят.\n[1787.627s] Магически шофьори-герои с удоволствие ще ни отведат\n[1792.153s] \"отражение\"\n[1793.836s] Лина няма нищо общо с огромното мнозинство от политиците.\n[1797.785s] Техният произход, социални кръгове, начин на живот.\n[1801.687s] Тя отдавна иска да види някой като нея на власт.\n[1804.667s] Индивидуалист. Бунтар.\n[1807.083s] На изборите тя гласува за Бена\n[1809.89s] която се позиционира като жена от народа.\n[1812.91s] Бена няма политически опит\n[1815.607s] и няма специално образование и обучение в определена област.\n[1820.164s] Но тя казва това, което мисли, и не се покланя на никого.\n[1823.501s] Тя няма да позволи да й казват какво да прави.\n[1826.365s] За радост на Лина, Бена печели изборите.\n[1829.687s] Веднъж встъпила в длъжност, Бена започва да разпуска институциите, които я ограничават.\n[1834.637s] Тя прекратява дългогодишни договори с други държави.\n[1837.872s] Тя отменя правата на социалните групи, които не харесва.\n[1842.342s] Тя разпуска комитетите за надзор и отделите за борба с корупцията.\n[1847.018s] Нарушавайки длъжностните принципи, тя експлоатира позицията си\n[1850.87s] за лична изгода чрез частни бизнеси.\n[1854.01s] В допълнително нарушение тя инициира военна сила\n[1857.802s] да неутрализира мирните протестиращи.\n[1860.241s] Служителите, които оспорват лудите й действия, са уволнени.\n[1864.977s] Тя няма да позволи да й казват какво да прави.\n[1867.864s] Когато приятелите на Лина осъждат\n[1870.01s] безпрецедентната злоупотреба с власт на Бена\n[1872.736s] Лина е истински объркана.\n[1875.121s] За нея Бена е магически герой, който променя света.\n[1879.608s] Индивидуалист. Бунтар. Точно като Лина.\n[1883.661s] Трябва да е добра.\n[1885.803s] Понякога виждаме някакво отражение на себе си в магическия герой.\n[1890.856s] Понякога това е само единствената черта, с която силно се идентифицираме.\n[1895.97s] Тогава става по-лесно да проектираме всички останали наши качества върху тях.\n[1900.142s] Ние създаваме заместваща фантазия, от която е трудно да се отделим.\n[1904.69s] Техният успех се превръща в наш успех.\n[1907.225s] И ние правим същите оправдания и рационализации\n[1910.771s] за техните неуспехи и злоупотреби, които бихме направили самите ние.\n[1915.358s] За Джон Стюарт Мил имаше много малко възможни основания\n[1919.907s] за съществуването на управляваща власт.\n[1922.905s] Едно от тях е да се защитят свободите на хората, управлявани от тази власт.\n[1927.574s] Не свободата на някои, а свободата на всички.\n[1931.381s] Правителството беше форма на практическо служение.\n[1933.985s] И правата, които притежава, трябва да осигурят най-високата степен на отговорност за предотвратяване на корупция.\n[1941.738s] Но когато виждаме нашите лидери като магически герои,\n[1945.195s] често ги държим на най-ниските стандарти за отчетност/отговорност\n[1948.532s] защото ние изградихме мечтите си върху тях.\n[1951.068s] Ние пренебрегваме тяхната корупция или я оправдаваме като необходимо зло,\n[1955.914s] за разлика от ненужното зло на чуждите лидери.\n[1961.424s] М��гическите герои се идват в много форми —\n[1964.45s] семейство, учители, лидери, богове.\n[1969.383s] Когато спрем да ги виждаме като изпълнители на нашите мечти за нас, и поемаме активна роля, за да ги постигнем самостоятелно,\n[1976.141s] тогава желанието да се защити тяхната корупция/порочност изчезва.\n[1979.63s] И можем да разпознаем измамата, некомпетентността и пренебрегването, където и да ги забележим.\n[1987.652s] Изкуствен последовател.\n[1994.888s] Заслужава да се спомене последният тип последователи, които много от нас са станали.\n[2000.0s] Този, в който няма осезаем герой.\n[2002.48s] А система от награди, която ни увлича\n[2005.793s] нарушава нашето мислене, задушава развитието ни\n[2009.089s] и поглъща значителни количества време от живота ни.\n[2013.108s] Още през 1950 г. математикът Норберт Винер\n[2016.919s] размишляваше върху идеята за машини\n[2019.663s] които биха могли да събират информация за хората\n[2022.402s] за да се определи най-вероятното развитие на дадена ситуация.\n[2026.65s] Той отбеляза как подобни машини могат да се използват от други хора,\n[2030.735s] за да увеличат контрола си над човешката раса.\n[2033.992s] Но той заключи, че тази технология е малко вероятно да бъде реализирана\n[2038.792s] защото хората са толкова сложни\n[2041.621s] че обемът на необходимите данни ще бъде невъзможно голям.\n[2046.823s] Пренасяйки се в 2017 г., където в интервю с Майк Алън от \"Axios\"\n[2053.109s] Шон Паркър, бивш президент на \"Фейсбук\",\n[2056.279s] размишлява върху задачата, която той и колегите му лидери на \"Фейсбук\" веднъж са поставили за себе си:\n[2061.467s] как биха могли да консумират толкова много от нашето време и съзнателно внимание, колкото е възможно?\n[2066.53s] Те решили, че могат периодично да дават на потребителите малко допаминово подсилване, защото някой харесва или коментира публикация.\n[2074.029s] Те са проектирали обратна връзка за социално валидиране,\n[2077.529s] където потребителите отговарят на тези, които са им отговорили и така нататък, и т.н и т.н ...\n[2082.829s] Паркър каза, че точно това би направил хакер като него,\n[2087.228s] защото използва уязвимост в човешката психология.\n[2091.275s] Той каза, че изобретателите и създателите съзнателно разбират какво правят и все пак го правят.\n[2098.59s] Постоянното прекъсване на вниманието ни не е добро нещо.\n[2102.073s] Освен фрагментирането на нашето мислене,\n[2104.7s] периодичната природа на тези положителни допаминови изблици може да ги направи изключително пристрастяващи.\n[2110.406s] Потребителят е в състояние на нестабилно очакване, докато чака известие, който може да дойде или да не дойде.\n[2117.118s] Някои потребители се притесняват за това, какъв вид съдържание ще получи по-голям отговор.\n[2122.606s] Компаниите за социални мрежи им предлагат безкрайни съвети\n[2125.73s] за да увеличите максимално ангажираността на аудиторията си.\n[2128.534s] Следвайки тези формулирани съвети\n[2130.674s] създателите бавно губят собствения си глас\n[2133.755s] и стават общи фотокопия.\n[2136.557s] Но това са само началните методи за оформянето ни.\n[2140.1s] По-голямата заплаха за индивидуалността\n[2142.622s] идва от по-коварната област за събиране на данни.\n[2146.464s] Всеки път, когато отговаряме на известие\n[2149.297s] се събира информация за материалите, които ни ангажират.\n[2154.393s] Софтуерът на тази платформа проектира все по-сложна картина на нас.\n[2158.511s] И се опитва да получи повече внимание от нас.\n[2163.638s] Нашата зависимост непрекъснато се стимулира от наркотик, който непрекъснато се учи как да засили нашата зависимост.\n[2171.9s] Ставаме роби на алгоритъма.\n[2175.526s] Компютърният програмист Джарон Лание предупреждава потребителите на социалните мрежи\n[2179.974s] за непреклонната, роботизирана и в крайна сметка безсмислена\n[2183.34s] промяна на поведението, на която са подложени,\n[2186.175s] обслужвайки безразлични алгоритми —\n[2189.097s] алгоритми програмирани да ни затрупват\n[2191.532s] не със добра или надеждна информация\n[2194.022s] а просто със това, което ни пристрастява най-надеждно.\n[2198.577s] За съжаление, сензационната дезинформация често е много по-успешна в това.\n[2205.97s] Нашите онлайн новини и препоръки\n[2208.71s] могат бързо да ни поставят в социални ехо камери\n[2211.579s] в които неквалифицираните мнения се превъзнасят над фактите,\n[2215.343s] когато се ограничава контактът с други гледни точки.\n[2218.633s] Подобно на случая с Брус, много хора са говорили за това\n[2222.13s] как или те, или техните приятели или семейство\n[2224.797s] се радикализира в някаква идеология\n[2227.386s] чрез попадането в заешката дупка на препоръките.\n[2231.145s] Когато това се случи в глобален мащаб\n[2233.735s] може да доведе до безпрецедентни нива на трибализъм/племенност.\n[2237.346s] Когато се сблъскаме с несъгласие, мислим: Как могат да бъдат толкова не информирани?\n[2242.639s] И те мислят абсолютно същото за нас.\n[2246.609s] Можем да избегнем превръщането в роботи в ехо камери, като се разкрием пред голямо разнообразие от източници,\n[2253.337s] включително тези източници, които са в конфликт с нашите.\n[2256.72s] С информация от първа ръка ние можем да формираме собствена преценка,\n[2260.986s] вместо да разчитаме само на мнения от втора ръка.\n[2265.145s] Можем да изключваме известията, избирателно или изцяло.\n[2270.573s] Вместо да се вписваме в хаотичния им график, можем да ги накараме да се поберат в нашия,\n[2275.643s] и да изпитаме прекрасната свобода и яснота на продължителните/непрекъсваните мисли.\n[2281.998s] Идиомът: \"Огънят е добър слуга, но лош господар\"\n[2286.211s] важи за много неща в живота\n[2288.545s] включително социалните мрежи.\n[2291.143s] Като са на мястото си, те могат да обучават, да разрушават препятствията и да обединяват хората.\n[2297.214s] Но когато им е позволено да вилнеят\n[2299.64s] те могат да внушават лъжи, да изграждат препятствия и да разделят хората.\n[2304.576s] Да ги задържим на мястото им е предизвикателство. За всеки един от нас.\n[2310.0s] Често се подчиняваме на фалшиви герои в най-отчаяните времена,\n[2313.869s] защото се предполага, че предлагат някакъв изход/бягство.\n[2317.311s] Ето защо в такива времена\n[2319.808s] трябва да бъдем най-бдителни\n[2321.74s] когато се появят героични фигури, предлагащи спасение.\n[2325.071s] Преди да приемем услугите им,\n[2327.422s] трябва добре да помислим внимателно от какво ще се наложи, да се откажем в замяна.\n[2331.697s] Ако конят, който ни предлагат, е троянски, ще се радваме да погледнем в зъбите му.\n[2337.339s] Подчиняването на магически герои понякога може да ни издигне емоционално, но ни задушава по отношение на развитието.\n[2345.392s] Както посочват Ротбаум и колеги\n[2347.74s] това може да доведе до самоподдържащ се цикъл от по-голяма зависимост\n[2352.006s] повишен страх от безпомощност, увеличаване на конформизма/съглашателство,\n[2356.018s] след това още по-голяма зависимост и така нататък...\n[2359.733s] Подчиняването на тирани или герои може да има еднакво вредни последици.\n[2365.212s] За да постигнем индивидуална свобода, ние не можем да бъдем ничий роб.\n[2369.85s] И ничий последовател.\n[2372.609s] \"Трагично е колко малко хора \"притежават душата си\", преди да умрат.\"\n[2377.122s] „Повечето хора са други хора. Мислите им са нечии мнения, животът им е имитация, страстите им са просто цитати“. — Оскар Уайлд\n[2385.134s] Този канал изследва проблемите около догмата, манипулацията и злоупотребата. Благодаря на всеки човек, който подкрепя тази работа."}'
