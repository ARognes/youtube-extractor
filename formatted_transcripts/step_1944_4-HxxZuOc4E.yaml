transcript: January 12th, 1500, Ravaldino, the Citadel of Forli, Italy. The Citadel has fallen and its heart, known as Paradiso or Paradise, is now overrun with enemies. No one is certain how, but after weeks of bombardment, the enemy are suddenly over the ruined walls and in the midst of the defenders. Some cry treachery, but regardless, chaos now reigns. There is no quarter as enemies hack and stab, but as a last-ditch effort, the defenders wait until the tower used to store the garrison's gunpowder is packed with these invaders before setting it off, blasting and burning dozens to death. Amidst this carnage, the Tigress of Forli, Caterina Sforza, herself fights tooth and nail. She is now cornered, but not cowed, and as the remaining men-at-arms rally to her, she shows no sign of surrender. Such is her reputation that, even though it is clear that they have lost the Citadel, the leader of her enemies, Cesare Borgia, refuses to enter until he has absolute confirmation that Caterina has been killed or captured. And thus, as the bloodshed continues, the sun sets. And as one chronicler of this event will later write, it was the devil's turn to reign in paradise. >> [music] >> But before we can conclude Caterina's tale, I just want to take a second to thank all of our subscribers, patrons, and YouTube members for continuing to help us make history. By the end of the 15th century, the now 36-year-old Caterina Sforza had governed the territories of Imola and Forli for over a decade, outlived three husbands, and survived riots, assassinations, wars, and the machinations of enemies both without and within. Mind you, all while protecting and raising no less than eight children. But, as a new century dawned, the tigress would be called to face even greater challenges. In 1499, a French host, commanded by King Louis XII, invaded the Italian states, intent on claiming both Naples and Milan. Venice, [clears throat] Savoy, and Pope Alexander VI supported Louis in this pursuit, for the pontiff had skin in the game. He was a Borgia, no friend of the Sforza family. For the fact that the Sforzas, namely Ludovico, Caterina's uncle, still ruled Milan, meant a French invasion of the city was actually good news as far as Alexander was concerned. Plus, his bastard son, Cesare Borgia, had been promised lands that included Caterina's. Now, this was a potential disaster for Caterina, since the Pope had been her feudal lord right back to the days when her first husband, Girolamo Riario, had been granted Imola and Forlì by Pope Sixtus IV. In other words, what we're trying to say is what the old Pope had given, the new Pope could take away. And he did. On March 9th, 1499, Alexander issued a papal bull, formally ending Caterina's rulership over the territories she dedicated most of her life to governing and defending. Caterina, for her part, refused to recognize this declaration. The only option was to fight, and that was something the tigress never shied away from. Sending her children to safety in Florence, she set about preparing for the greatest invasion her lands had yet faced. For Louis had brought a powerful army to Italy, and there was little initial resistance to his campaigns. By mid-October, he had claimed his first prize by occupying Milan, causing Uncle Ludovico to flee to his allies in the Holy Roman Empire, which made Caterina the next target. Assisted by the French and bearing the papal blessing, Cesare Borgia made his move on Imola and Forlì. The former fell almost as easily as Milan had. The inhabitants, not wishing to risk the sack of the town, opened its gates to the invaders. The citadel faithfully held out for almost a month, but it was eventually forced to capitulate. Meanwhile, Caterina had appealed to Florence for aid, but that city-state was France's next target, meaning they didn't have troops to spare. So, the Tigress of Forlì was therefore left alone to face the Borgias. Cornered in her citadel overlooking the town. Mindful of the capitulation of Imola, Caterina demanded to know whether Forlì's inhabitants also wished to surrender without a fight. The reply of the town's council was, you know, less than enthusiastic about fighting Cesare Borgia, which then led Caterina to call them rabbits, declaring she would, quote, "Prove to the Borgia that even a woman IS CAPABLE OF FIRING A CANNON." UNQUOTE. The town did indeed capitulate to Cesare's approach, leaving Caterina sealed in Forlì's citadel. Then, on the 19th of December, the siege began. Of course, Caterina was well prepared for the conflict. Her garrison, though heavily outnumbered, was strong, the artillery well sited, and provisions plentiful. And as both sides began to bombard one another, Caterina donned her armor and oversaw the defense in person. In the weeks that followed, she used a number of ruses to keep the Borgia off balance. For instance, on Christmas Day, she hoisted a Bolognese standard above the citadel. Its crest, a golden lion on a red field, was similar to that of Venice, who were allied with the French and Borgia. Then, a rumor went around that the Venetians had abandoned the alliance and were now on Caterina's side. A claim a Venetian ambassador had to disprove. Caterina also attempted to convince the commanders of the French contingent to secretly delay operations, but that scheme came to nothing. On multiple occasions, Cesare Borgia attempted to parlay with Caterina and convince her to surrender in exchange for fair treatment and the possibility of being granted other territories by the Pope. She rebuffed all entreaties, reportedly declaring, "Quote, fortune helps the intrepid and abandons cowards. I am the daughter of a man who did not know fear. Whatever may come, I am resolved to follow the course until death." Eventually, Borgia placed a price of 100,000 ducats on her head, while the Pope demanded that if captured, she should be immediately executed. By early January, over 400 cannon shots had been fired by the French gunners against the walls, with the defenders laboring to make repairs during the hours of darkness. Meanwhile, Caterina had mocking inscriptions carved into the stone of her own cannonballs before sending them crashing into enemy positions. Part of the town was wrecked and the occupiers, particularly the French, lived in constant fear that the townspeople might rise up in support of their countess and murder them in their beds. By the siege's third week, Caterina's renown had only increased. She alone was resisting the invasion of the northern city-states and according to Machiavelli, epigrams and songs about the tigress of Forlì had become popular throughout Italy, even among the common soldiers of her enemies. By January 12th, much of the citadel's curtain wall was in ruins, with rubble almost filling the moat and spilling into the courtyard beyond. Frustrated by Caterina's stalwart resistance and against the advice of his allies, finally, Borgia ordered an assault. Despite having erected earthworks and a battery of artillery in the courtyard beyond the breach, the defenders were taken by surprise. Some accounts blame one of Caterina's subordinates and supposed lovers for the oversight, accusing him of treachery, though he strenuously denied that. But, regardless of how it came to pass, the enemy breached the walls with little resistance. Then, Caterina ordered her one last act of defiance, torching the garrison's gunpowder stores and burning many of the invaders in the tower where it was kept, like we mentioned at the top of this episode. Then, finally, the tigress and her surviving followers made one last stand, resisting until sunset. One chronicler wrote that Caterina, quote, "Armed from head to foot, was ever in front of the battle, inspiring her men with courage by word and deed." Despite said tenacity, the outcome was not in doubt. After one last attempt at a breakout failed, the Borgia troops brutally sacked the citadel, killing through the night and into the following day. In the midst of the carnage, French soldiers, commanded by one of Borgia's allies, seized Caterina. Though one historian claims she deliberately surrendered to them, since French laws supposedly prohibited the taking of women as captives. Through one last stratagem, she attempted to avoid falling directly into the hands of Cesare Borgia, and claimed the protection of the King of France. The French then agreed to ransom the tigress to Borgia, though only if he swore not to mistreat her or hold her prisoner. She was to be conducted to Rome, where it was intended she submit to Pope Alexander VI, who, let's not forget, was Cesare Borgia's father. So, on the 23rd of January, 1500, Caterina left Forli, and she would never return. Borgia delivered Caterina to the Vatican, and one account, likely exaggerated, claimed she was taken into Rome bound in golden chains. She was housed initially in the Belvedere until a plot to free her was discovered. She was then transferred to the dungeons in the very place where her legend had first started, the Castel Sant'Angelo. In an effort to justify such harsh treatment, Pope Alexander the VI called her a daughter of perdition and claimed that she had attempted to murder him by leaving a poisonous substance on letters she had written to him. Whether this was true or not remains open to debate. Certainly, Caterina had a great knowledge of botany, medicines, and horticulture and was no stranger to poisons. But, I digress. Regardless, Caterina remained imprisoned for over a year, refusing to submit and sign the documents that would formally surrender her family's claims to Imola and Forlì. She remained steadfast even when her beloved youngest son, Giovanni, was taken into custody by one of his Medici relatives. The Pope also attempted to try her over that whole poison thing, but the proceedings fell through. And eventually, it would be another of her old enemies, the French, who interceded on Caterina's behalf. Louis the XII's army reached Rome on its way to conquer Naples, and his subordinates applied enough pressure to see Caterina released. However, the Pope claimed she had forfeited her lands, and Cesare Borgia took legal control of Caterina's territories. But then, just over 2 years later, Alexander the VI was dead, struck down by a fever that almost killed Cesare as well. Caterina was uninvolved, honest. The defeated tigress of Forlì withdrew to her sole remaining allies, the Florentines, and lived in the Medici villas that had belonged to her last late husband. She gathered her children around her, all except her youngest, Giovanni. Actually, one member of the Medici family, Lorenzo, attempted to have Caterina declared unfit to be Giovanni's mother, which would have given Lorenzo control over the child's estate. Eventually, Caterina won the legal battle and received her youngest child back into her care. Now, the death of Alexander the VI in 1503 once more shuffled the deck of alliances in Italy, but this time Caterina was unable to capitalize. First time for everything. Though the new Pope was inclined to return Imola and Forlì to her, the people themselves, or at least the nobles and gentry who claimed to speak for them, rejected the idea. And the Pope did not force the issue. While Cesare Borgia lost control over Forlì, another family hostile to Caterina became the town's overlords. While Caterina never gave up her attempts to regain her home, much of the next five years were spent overseeing the activities of her children and pursuing her interests in science and medicine. Her book, Experimenti, part 15th century textbook and part magical grimoire, contained 454 separate recipes, most of which related to practical medicinal matters, though there were also treatises on cosmetics and alchemy, often melding all three. Her workings illuminated how to make skin paler and hair more blonde or ginger, proposed an opium anesthetic, cures for impotency, and included discourses on childbirth and the menstruation cycle. She described ways of killing lice, how to distill perfumes and poisons, and even ruminated on the mythical philosopher's stone and the creation of the elixir of life, which Caterina claimed could restore youth and resurrect the dead. Some of her work was even written in invisible ink, while other parts put down in a Latin cipher, practices that would make any Dungeon Master proud. Now, Caterina had kept a well-stocked garden at Forlì during her time there that had provided for all of her experiments where she gained a lot of this knowledge, meaning her understanding was built on her own experiences as well as knowledge exchange networks with other writers, thinkers, and experimenters throughout Italy and beyond. She maintained good relations with organizations like the nuns of the convent of Murate in Florence, who had their own knowledge of medicine as well. The Experimenti was passed on to Caterina's youngest and favored child, Giovanni, and proved to be a font of knowledge for the Medici family right through to the 17th century, helping further widen scientific and medical advances of the period. She was in every way a Renaissance woman. Then, in late 1508, Caterina caught pneumonia. Though it appeared for a while that she would make a recovery, her situation began to worsen. So, she made her will and received the last rites. Caterina Sforza died on May 28th, 1509, aged 46. Her funeral was conducted without any great pomp or ceremony, and her body was interred at the convent of Murate. Her remains were lost, however, sometime after the building ceased to be used by the nuns of Florence. Fierce warrior, cunning diplomat, ruthless ruler, passionate lover, leading experimenter in science and medicine, and devoted mother. The Tigress of Forlì was all of these things and more. A legend in her own lifetime, who reminds us that history is full of larger-than-life figures who make the inventions of literature seem small-time by comparison. Her enemies hated and feared her, not least because, according to one quote attributed to her, she would "Bend the knee to no man unless I choose to." Though that she defied the confines of gender during the period is only one of her many remarkable achievements. Heck, it takes a particular kind of person to receive paragraphs of grudging praise from the likes of Machiavelli, after all. The Tigress, who defied the odds of survival and thrived amidst a world of threat and danger, is not only worthy of all of us talking about, but an incredibly interesting moment in history. As she said herself, quote, "If I were to write the story of my life, I would shock the world." Thank you so much for coming along on Caterina's journey with me, extra historians. Remember, Rob's extra context video for this series will be airing June 24th, followed by our new patron and YouTube member chosen series on presidential corruption, talking all about Ulysses S. Grant. >> [laughter] >> Oh boy, it gets wild and echoes a lot of actually like things going on today. It's crazy. But, suggesting and voting on extra history topics are not the only perks one gets from supporting us on Patreon or as a YouTube member. You can also view our videos early, join our Discord, get discounts in our store, and even get your name in the credits depending on your membership level. So, to join our community of extra historians who help make the shows like the one you just watched possible, you can check out the YouTube memberships by clicking the join button below or use the link in the description or this QR code right here to head to patreon.com and do all the Patreon things. [music] And whether or not you've just joined or have been a patron for ages, just seriously, thank you. Uh we say it a lot, but it never rings any less true. Your monthly support is really the most reliable source of income for everyone at our small studio and it's what allows us to keep telling important historica