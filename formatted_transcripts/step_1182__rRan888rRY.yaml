transcript: 'ZAGREUS: Previously on  Hades Developing Hell. - So the game comes out  on Steam and has a really good day one. The part that was like truly and utterly shocking was the 98% overwhelmingly positive review score, higher than any of our previous games. - It was shocking. I was shocked, and I continue to be somewhat shocked by it. - I think having people know what we''re working on really changes the vibe. - It felt like we blinked and all of 2019 had flown by. [MUSIC PLAYING] [MUSIC STUTTERING] [MUSIC STOPS] [EERIE MUSIC PLAYING] - Basically on Thursday, March 5th, as a company, we read that there was community transmission of COVID-19 in San Francisco. And so we made the decision that day that it would be the last day in the office and we would be working from home. So that was before San Francisco issued a lockdown. I think that came the following week. We were working from home one day a week anyway as a company, or most of us were. And so a lot of people already kind of had a home setup, and we just ended up putting ourselves into a situation where we just sent everybody home to start working. And I think at the time we had no idea how long that was going to be, and still don''t. Yeah. - I think there was a specific day when they officially declared it a pandemic. And that was also the day that the National Basketball Association, the NBA, they''re like no more NBA season. And I think that one, two punch of like, it''s official, it''s a pandemic, and no more basketball. That was like a switch flipped for many people if they weren''t already kind of paying attention. - I''m like a 15 minute bike ride from the office. So I''d hop on my bike, head down Market Street, for those familiar with San Francisco, and then just end up at the office. And it''s pretty quiet. There''s definitely cars out, like a good amount of, decent amount of cars out as much as normal, but the streets are pretty empty. There''s not a lot of people on the streets. It''s pretty quiet. It''s eerie. You know, I try to like, nod at people when I pass them, but most people don''t make any eye contact or anything. Pulling up to the office and just like ghost town. You can imagine like a tumbleweed crossing the road, that kind of vibe. It''s, nice to get out. You know, it''s not stressful because there''s nobody else really going to the office. I wear my gloves when I get in there, wear my mask and I''m only in there for like 30 minutes at most. But it''s sad. You know, there''s just like nobody in there. AMIR: Can you hear me? Hey. I''m just trying to move this weird 150 year old rocking chair out of the shot. So give me another few seconds to move it. Where we are in Hades production, we are basically taking a longer milestone. We were doing that anyway. This milestone was going to be three months long. And the reason it was going to be three months  long is ''cause we were doing this huge effort to focus on our technology and engine to make sure that Hades could be multi-platform, so that at the 1.0 launch, it would be more than PC, basically. And that was all supposed to come together at a precise moment when the pandemic hit.  So the engineers were already kind of expecting like a pretty big workload. And then they''re integrating all of this while also juggling all the things going on in the, in the greater world. So they were all already kind of scheduled for things to be a little bit more intense. And I think they''re a lot more intense. - Adding to the list of things I feel fortunate about from a, from a work standpoint, it just so happens that this is our longest update period that we had planned. That is just dumb luck that we happened to say, hey, our next update is in June. And for the first time ever, we don''t have a specific release date. We made all those decisions definitely before any of this. And we''re trying to do a lot of things at the same time, both this huge, like technical undertaking of like, you know, moving our code base to native code, which is just a huge technical challenge that that should yield like improved game performance and allow us to bring the game to different platforms and stuff like that. So it''s really important, both for Hades and just like anything we do in the future, really. But on top of that, we have so much content work that we''re still working on. ''Cause we''re trying to, we''re essentially trying to finish the game, and we''re getting closer to that version 1.0 that we have planned for later this year. We''re adding like lots of content in different areas. And we''re also doing the whole end game, which is a really big piece of the puzzle for us and something that we have deliberately held back and intend to keep holding back from, from early access. So it''s all this work that players actually won''t see until, until the game is done. - We still do our weekly review every Monday, which is where the whole team is involved, come together, talk about what we''re working on that week. And then sort of the various meetings of the week branch out from there and pop up, and those are more smaller groupings and everything like that. We''ve been using Zoom just like you and I are using now, and like 97% of the world is using to communicate, I guess. - So the first week we launched an update. We got on Zoom, and we did all the things we normally do. We were able to do most of what we do for an update, you know, push videos, live and, and fix bugs and, and plan the next one. - And we''re going to double check to make sure that the blog post URL is good before I send it though. - Okay. - The first thing we''re waiting for though is just for confirmation that the build is up, yeah? - Yeah. So this one, we increased the file size by like four gigs. We have, we pushed the save. We pushed only one change between last night and this morning, which was like, add better logging for corrupt save games. And if you are a developer, it made it look like all your save games disappeared, but if you''re a normal consumer, it doesn''t. So it was like really terrifying. Like the last 15 minutes wondering what happened to all the save games, but apparently it won''t happen to normal people. It only happened to us. So it''s good to know. - It''s not an update day unless something gets your heart rate above so many beats per minute. - Yeah. - Good first YouTube comment. "Can we romance Skelly already?" - Man, people wasted no time. - You got me, you got me. - In the previous updates you could give him ambrosia. - You know, Skelly basically has  the same name as the term people would use to be attracted to  skeletons, if we''re going historically based off of other categories that  people use to describe attraction. - Yeah. That''s an interesting point. - So I mean, listen. I''m a Skelly. Maybe it starts as a working relationship, but maybe it blooms into more. - This is the content Danny  needs right here. - I don''t think Danny''s  going to make it this far. - So that first week was really similar  to things we''ve done before. I think it was the following weeks where things started to change a lot because with a mounting sense of the seriousness of the problem and within lack of certainty around how long we were going to end up working like this, we actually opted to sort of settle in. So we just assumed it was going to be a really long time. Our initial efforts are trying to make sure that everybody was taken care of and comfortable. And then I had, you know, one on ones with everybody on the team just to check in with everyone and see how they''re going. I need to take a break from this answer real quick. Sorry, one second. My, yeah, kid. - I don''t know that there has to be anything wrong with the existing key art to want new key art here. - As long as the new art, the new key art should be like significantly better though. ''Cause we shouldn''t, like us, us being bored of it is, like... - I don''t think that''s part of it. I think part of it is like, again, like one of the things is signaling that something with the game has changed really meaningfully, and it''s that it''s 1.0, right? Like it doesn''t have to just like, it''s not a shouting match with the original art necessarily. It''s just like, hey, this is done. And also it should present like a complete picture of what the game is or how we want to advertise it. So in that sense, it could be really close in some, in some, with some of the elements that are included in it. Right? but in this case, I think like showing, you know, a monster is cool. I don''t, I don''t think there''s anything inherently wrong with that. And if we had led with key art where it''s a hydra behind Zagreus doing whatever, I don''t think that would have been a mistake either. - Yeah. I mean, I think the inclusion of the hydra is like, it''s like the upgrade to me, there is. It''s a better background element tied to the marketing campaign for the game, which will hopefully be how a lot of people discover the game. - The people that I talk to on a regular basis about more than just work and just checking in with them on how they''re doing it and everything. You know, we definitely have our struggles, but we''re able to communicate it in like the professional way that we can, you know, without getting too, too personal and all that stuff and are able to sort of support each other through the work that we have now, thankfully, which is awesome. It''s really a privilege to be able to have at least this work at Supergiant as a sort of foundation for five days out of my week. That''s been really, really amazing. So super grateful and thankful for that. And I think a lot of us are. We''ve been operating into this since like the beginning of April. But no, no updates on that, but I mean, there''s no antibody test, or there''s no, updates that it''s  declining or anything. I could see us extending it or pushing it again. But thanks for letting me think about that. - Hello, I''m