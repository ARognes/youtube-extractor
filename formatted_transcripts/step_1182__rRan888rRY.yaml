, and follow the instructions to reset. Thank you for choosing ADT as your security provider. - Okay. This is  my first  time back to the office since the pandemic began. I''ve been outside of it to check on it. I haven''t been indoors. Tt''s my first time seeing anybody also ''cause JP is around here somewhere.  We''re here to shoot a thing for Nintendo to announce that Hades is coming to the Switch, but it''s surreal being here post burglary, where we had a bunch of stuff taken, like all this stuff off the walls, a lot of the instruments we use to make the soundtracks for some of our games, and a bunch of other stuff was taken too. But that''s sort of maybe, maybe small potatoes compared to all the things that are happening right now. We are all working from home and you know, making it work after the break in, cause the door was totally broken. Gavin created this Mad Max barricade  which we''ve been using to try to hold the line against any further, further issues. There''ve been a few more attempts. Someone broke the mail slot with her fist and stuff like that, but it''s basically held up, while we''re all, while we''re all safe at home. So yeah, it''s weird. I haven''t seen anybody. I''ve been sitting in a chair in my house for most of the last several months. So it''s weird to be back here where we all once worked together, and I don''t know how long it will be until that happens again. We, you know, California''s going back into shutdown mode, I guess. So it''s going to be a long time, I think. Yeah, we will see. - Yo y''all, hope everyone had a good weekend. Yeah. So we kicked off Update 12 last week with the  ending content and everything else. So undeleted the thousand plus files that,  that we actually successfully deleted to avoid any leaks. Hopefully  that''ll stay true for this update. So the big, it''s essentially it can be treated like another update, as Amir said, with just lots of big new features. The big one of course is the ending. So it''s another action packed one. Should have some good surprises for everyone, I think. - Yeah. There''s a kind of other work too with the platforms, so, achievements. - Oh yeah, the whole, yeah, the whole  Switch version of the game actually is bigger than any of the other stuff I said. [LAUGHING] That''s the biggest of all.  That''s like, not, not strictly a, like a game. If you''re playing, if you''re playing the Steam version, that''s less relevant to you. But  as an effort, this milestone, is definitely the single biggest thing. - But it''s semi relevant because you''re, going to be able to cross save if we get that. - Yeah. - We''ve got to get it working ''cause we''re announcing it, so, you know. - Right. - So yeah. [MUSIC PLAYING] DANNY: Thanks for inviting us to your house, Greg. - Of course. Glad you''re here. DANNY: How are you doing? - Definitely keeping busy. I was telling  you before, I feel grateful for a lot of things, but being  very busy  is one of them. We''re right just kind of weeks  away from finishing development after working on this game  for three years, so. And a lot of just that sense of like now or never. Yeah, we''ve been working from home this whole time. I mean, I work, I''ve been working from my space up there ever since the Bastion days, like quite a bit. So that part is totally fine. I should probably get a better chair. I should probably get a better desk, but those are things I''ve been telling myself,  you know, before all this started, The part I do worry gets lost over the long term is like the kind of ad hoc conversation that can happen. Still kind of happens on Slack and sometimes turns into calls and stuff. But that part isn''t exactly the same  as just being in the same office. We don''t, we don''t do a lot of stuff outside of work, just trying to balance work with everything else. But in, in my past experience, you know, stuff outside of work is really important to kind of, you know, talk over a drink or something like that. So if, if you''re just kinda like in the, in the work mindset the whole time, you''re not really, you''re pretty kind of boxed into that. And bigger ideas may have more trouble breaking through. I can''t say I miss commuting to San Francisco. I''ve spent so much of my life commuting. Like I, if I had like a slash played command for my commute, it would be just days and days and days of my life just sitting in a car. The commute to San Francisco isn''t that long for me. It actually got quite a bit better when we moved to a different spot in San Francisco. It got better by like 10 minutes, but it''s a really vital 10 minutes of otherwise just kind of sitting at traffic lights. DANNY: Can''t wait to see what the weather is like in the sunset. It''s probably got the clarity of fog. - Yeah. JEREMY: I know. - That''s the safe bet. JEREMY: Always bet on the fog. DANNY: Thank you for inviting  us to your house. - Yeah. Thank you for coming. DANNY: How''s the weather been? - It''s been like this for the whole time.  I live in a foggy part of the city. So yeah. [CHAINSAW] DANNY: Every time we''ve done an interview with you guys there''s always been construction. - Yes. DANNY: In the studio. - Yes. DANNY: Is it fitting perhaps that we turn up here and they''re taking a tree down? - Yeah, I think so. I mean, it''s an early access game, right? DANNY: Can you tell us about the call you got for the break in? - People have tried to break in to the office before. There''s a magnetic lock  and all sorts of precautions. A lot of the businesses on our block had boarded up, and so we did the same thing kind of a week before. And we took a video of all the stuff we owned also just in case. And then, I think around 1:30 in the morning we got a call saying that there was an attempt. I think that went to voicemail for me, but Gavin and JP woke up and got. We texted back and forth, and we thought, well, it''s probably fine ''cause they didn''t get in. Ad then I think around 3:30 in the morning, things started happening again. - There was a lot of like legitimate protesting happening in downtown San Francisco. Our space is quite close to city hall. And there were protests happening, but protests can be used as a screen for other types of things such as break-ins. It''s not like some random thing that happened. They had to cut through like industrial strength kind of locks and stuff like that. So it was like a very deliberate, it wasn''t just like someone smashed a window and got in. But I don''t know what they were expecting to find. I don''t think they made off with too much. And most of our desks, they just kinda, you know, looked at superficial, saw if there were any superficial valuables. Most of our desks were left untouched as far as we knew. And they were, you know, for a bunch of thieves, they were relatively polite in that like they didn''t just ransack, trash the place or whatever. I think it just kinda like goes  with the territory in the part of San Francisco that we''re in, that from time to time, things like that can just happen. It''s a city that has like poverty right next to wealth. If you''re desperate and impoverished, you frankly have incentives to try to get out of that. I don''t like, excuse the theft or whatever, but as ever, I at least try to understand why, what would  compel someone to do that? And I don''t, I honestly don''t think  it''s that hard to understand, things being what they are right now. [MUSIC PLAYING] DANNY: Tell us about the engine swap. That was one of the biggest things you''ve done. AMIR: Yeah, so we, you know, the original engine for Bastion was in C# and used the XNA framework, which was this framework released by free from Microsoft. So you could, make Xbox Live arcade games yourself. That DNA has been there since the start. We''ve just been using the same engine, updating it. You know, we took it out of the XNA framework, but it was still in C# for a long time. Because we have our own engine, it means that, you know, it''s hard for us to go cross-platform without an, a tremendous investment of work. We finally decided for Hades we wanted to, uh, basically convert our engine to Native C and to make it higher performance and a little bit easier to, to get onto more platforms. - I just want to check your, the  lighting on, on everything too. - Okay. On behalf of our small team at Supergiant Games, I am really excited to announce that Hades is coming to the Nintendo Switch. I''m not supposed to say the Nintendo Switch. And each time you die-- - Trying to escape hell.  Alright. One more time. - You play as the immortal prince of the underworld. If you''ve already done so on PC, you''ll be able to transfer your progress to the Nintendo Switch version with cross saves. We had on one hand, this really well-liked game where nobody wants anything to get  worse or change about it. And then we had to replace all the technology that powered it without breaking anything for them. It''s this really unglamorous work where the end result is that it''s exactly the same as it was before. There was a lot of sort of visual issues, a lot of small, subtle issues like, oh, this fade doesn''t feel right. Or this animation doesn''t look quite right. You know, you scrutinize the old engine, you scrutinize the new engine and you compare them side by side and you become sort of like a detective trying to figure out, well, what is actually different about this? We were tracking all these elusive crashes and suddenly like people who have really bad technical problems become like really important to us because they could represent 600 other people with like a crappy Toshiba laptop that can''t run the game as well as they used to. We have an engineer we started working with in Serbia. He had to use essentially Serbian eBay to track down one of these laptops. Engineers from all over the world were remoting into his machine to try and examine exotic crashes and texture corruption. On behalf of our small team at Supergiant Games, I''m really excited. Okay. [CLEARS THROAT] Woo! [SWORD CLANKS] [RATTLING] [GRUNTING] - No, Zeus. - Of course. - We''ve felt for a long time that Hades is like a really good match for the Switch because of the type of game  it is and what it might be like to be able to go do a run on  the go, or on your TV, or any of those types of things. We kind of have to focus on one thing at a time. So it''s still hard for us to do everything all at once. You know, like we look at, we used to work at companies  like EA that were able to do that. And when you look at the size of the teams involved to get a game across everything all at once, it''s like quite impressive and still not something that we can do. And so Hades will be making it''s console debut on the Switch. [MUSIC PLAYING] - So we had our final major update in early access ''cause the next one is our 1.0 launch. Really, really busy because we had like basically every actor who plays a role in the game back, you know, sometimes having to accommodate new, like we''re mailing them microphones and stuff like that, right. Having to accommodate new recording arrangements so we could do it at all, and recording all the final dialogue for the game. There was a ton of new stuff just in the last update, but we were also doing a ton of the writing and recording for this update, like for the ending of the game, tons and tons of work on the story for me, principally. But then there''s tons and tons of other content work as well. I get wrapped up into providing feedback or putting all the other words into the game, like descriptions of all the new abilities and new items and all that kind of stuff. And then right now my main focus is on all the ending content. - What''s left to do. Okay. So we need to get the game running at high performance on the Switch. We need to get saves to work. We need to get cross saves to work. We need to get all the words translated. Then Greg needs to finish the ending. Then we need to get all those words translated. We need to get the final environment art in. We developed two new systems for the late game that are almost impossible to player test because they require hundreds of hours of playtime. We need to get those in. We need to do three functional QA passes with our external group. We need to do, we need to try and do like a trial lotcheck if we can, to make sure that everything comes together the way we want it. And then we need to play the game ourselves and make sure we''re happy with it. - So something we have been  giving a lot of thought and talking a lot about is--  and getting a lot of questions about is what happens to Hades after version 1.0,  because again, we''re, there''s both some of the genre expectations you''ve referred to of like, you know, these games can just kind of go on forever, keep getting updated forever. Our general mindset is to go all in on this version 1.0, with, with the conclusion of the, what we''re calling the true ending and just, we''ve always valued a sense of completeness in our games. And even though we built up Hades piece by piece, we want it very much to feel like a complete experience at version 1.0. That''s our goal. If we were holding stuff back, we by definition, wouldn''t be doing that. We''re still at that 98% on Steam. I don''t know how. I swear to God, I don''t know how. I swore to the gods above and below. I don''t know how. I was shocked at that 98%. I thought there was no way that would stick for more than a day, more than two days, more than three days, past our first update, past our second update, past our third update. It''s still there. I can''t explain it. Like I''m not, I''m not being, I''m not, it''s not false modesty. That''s just like, you can like breathe wrong and dunk your score on Steam. Right? So it''s, it''s mind boggling. So I''m like, we cherish that. It means a lot to us. We want to protect it. We want to live up to it  with the true ending version 1.0, but it''s hard to stick the landing on the ending, even when you''ve got something good going. So I feel quite a bit of that pressure, but I, it''s pressure that I enjoy. Especially things being as they are in general, the fall is gonna be, the fall is going to be an, an unusual time. The launch of the game, I guess, will probably be the least weird thing. [MUSIC PLAYING] DANNY: We talked a bunch on the Zoom  chats about the sort of like awareness of the mental health of the team  as we were entering this phase. - Yeah. DANNY: How do you think the team''s been doing? I know you can only speak for yourself really, but like, what sort of-- - Yeah, so, so I think the team is  performing really well together. I think we''re being really effective together still. I worry about everyone though. I worry about all of them. And everyone''s circumstances are unique. You know, the people around them are all affected in different ways. And even if they feel like they can work and work might be a kind of outlet for them sometimes, that doesn''t erase all the things going on around them. I don''t know that I can say, oh, everyone''s doing great. You know? ''Cause I don''t, I actually honestly don''t know the answer to that, even when we talk. Right? Because there''s a component of our conversations now that''s not there anymore ''cause we''re  not physically in the same place. It was like quite emotional for me actually, when we were filming with Jeremy to like, see JP. Like I hadn''t seen JP in so long. Yeah, I miss, I miss them a lot. Yeah. I miss everybody. I''m pretty sure  someday we''ll all hopefully see each other again and be able to actually talk about this thing that we did together and how we made it and  how it felt to make it. DANNY:  Best of luck with the final sprint. - Thank you. Yeah, we need it. But also we''re practiced at it, but no one has practice doing it like this in this kind of circumstance. So I guess we''ll see how it goes. I''m about to start watching this Indie World, this Nintendo Indie World. So far from the chat, everybody''s hoping it''s Hollow Knight. They all want Silk Song. Me too. Okay. This thing is starting. I''m pretty nervous even though it''s all prerecorded. Oh God. [CHIMES] [MUSIC PLAYING] [SWORD CLANKS] Oh, people know it''s Hades. Ahh! [LAUGHING] They know. [GRUNT] [ZAP] [ZAP] [GROAN] [SPLAT] [SPLASH] - Again. Got you that time. - On behalf of our small team at Supergiant Games, I am really excited to announce our roguelike  dungeon crawler Hades is coming to Nintendo Switch. You play as the immortal  prince of the underworld, trying to escape hell. And each time you die, it''s like coming home. You advance the story, get stronger, and gear up for your next escape attempt. So if you like the fast paced action, rich atmosphere, and character driven storytelling of our past titles like Bastion and Transistor, we think you''ll find something to love in Hades. [MUSIC PLAYING] - Hey, it''s John-Paul. I''m going to give you a pretty brief overview of my work from home setup, but here it is. Some construction noise in the background. Sorry about that. But a chair. It''s pretty basic. Straightforward keyboard, mouse. I got my headphones. - Hey, so I just wanted to share  my work from home setup. So we have a standing desk provided to me by Supergiant. It''s a pretty  simple setup, but, it''s everything I need and lets me work from home for the past five months. - Oh, we started a in house, a book club  at Supergiant with a few of us, and this is like our third or fourth book. That''s been really enjoyable. We got this file cabinet once COVID hit  ''cause we sent a lot of mail and invoices and whatnot to my address so we could be quick on those things. So that''s been helpful. You might also hear people say you need like a healthy distance between work and, and personal life. I found about like four inches or so has been working out just fine for me.'
