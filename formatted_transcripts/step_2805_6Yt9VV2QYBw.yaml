transcript: your phone doesn't have a CPU at least not in the usual sense instead it has something called a system on a chip or SOC which is just what it sounds like a boatload of components built onto just one chip there's the CPU and GPU as you might expect but a typical modern SOC will also contain a modem for communicating with your cell network Wi-Fi and Bluetooth transponders NFC for making mobile payments GPS Ram audio processing image processing for the cameras security features and even a dedicated AI engine putting everything on just one chip not only saves space inside the phone but results in much lower energy consumption and heat output than breaking out all those components separately because time is money I don't think that phrase applies here but
