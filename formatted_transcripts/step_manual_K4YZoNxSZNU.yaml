transcript: '{"content":"\n[5.927s] Живот с насилници.\n[10.081s] За О.\n[12.675s] \"— Вървя по позната улица. На тротоара има дълбока яма.Виждам, че е там. И въпреки това падам ... това е навик...\" — Порша Нелсън, Автобиография в пет кратки глави.\n[22.553s] Много от нас са живели или живеят с хора, които никога не сме избрали за съквартиранти.\n[27.04s] — Хора, които смятаме за хронично разрушителни, конфликтни, дребнави, нетактични.\n[33.2s] Ние търпяхме много, — от нахлуване в личното пространство, до шумотевици, до непоискани съвети за живота.\n[41.13s] Колкото и досадно да е това поведение, то не е непременно мотивирано от зли намерения.\n[46.82s] Това може да бъде егоцентризъм, или лоши разбиране за лични граници.\n[51.3s] Но ситуацията се превръща в насилие, когато поведението става всеобхватно контролиращо и принудително.\n[58.147s] Контролът може да означава:\n[59.735s] проследяване на движението на хората; принуждаване да посещават събития;\n[63.92s] наблюдение на техните телефонни обаждания, съобщения, имейли;\n[67.76s] регулиране на техните финансови транзакции;\n[70.509s] определят техния външен вид,\n[72.47s] включително облекло, прически, форма на тялото;\n[76.429s] решават с кого могат и не могат да видят, включително като им наложат нежелана връзка;\n[82.009s] и саботират тяхната независимост.\n[84.94s] Насилственото поведение може да включва заплахи — реални или скрити\n[89.009s] засрамване и унижаване\n[91.11s] агресия\n[92.11s] физическо насилие\n[93.509s] и унищожаване на собственост.\n[96.26s] Поради вредното въздействие\n на този вид поведение\n[99.119s] на жертвите често се препоръчва да се сведе до минимум или да прекратят контакта\n[103.509s] с контролиращи, принуждаващи индивиди.\n[106.7s] Формулата е проста.\n[108.36s] По-малко контакти означава по-малко възможности за злоупотреби.\n[112.62s] Но намаляването или липсата на контакт не винаги изглежда възможно.\n[117.46s] Много жертви се оказват изолирани в ситуации, в които не могат да видят изход.\n[122.76s] Въпросът дали действително съществуват възможни изходи, не е важно\n[127.3s] ако човек не е способен да ги види.\n[130.728s] За да има успех, те трябва да бъдат възприети.\n[134.573s] Дори когато се появи изход,\n[137.09s] жертвата понякога открива, че тя внезапно е блокирана от фактори, намиращи се извън нейния контрол.\n[142.31s] Получавал съм съобщения от хора, заключени в фундаменталистки семейства и живеещи в страх\n[150.0s] или са загрижени за други роднини в подобна ситуация.\n[153.96s] Други са претърпели яростна агресия\n[157.16s] от родители и партньори с разстройства на личността.\n[160.66s] Искам да разкажа за опита си от живота с насилници. И да предложа някои мисли за противодействие на тяхната отрова.\n[167.68s] По-конкретно, ще разгледам някои от основните лоши навици, от които трябва да се отървете\n[172.209s] и някои добри навици, които трябва да се развият.\n[175.63s] Oценка на риска\n[179.4s] Много е важно да дава реалистична оценка на насилниците.\n[183.42s] Какво зловредно поведение си забелязал при тях? Не само към теб, но и към другите?\n[188.16s] Има ли такова, което ти би определил като опасно?\n[191.22s] Как контролират импулсите си? Демонстрират ли способността да се успокоят?\n[196.4s] Или изливат гнева си върху всичко и всички?\n[200.36s] Когато има реална физическа заплаха, жертвите трябва сериозно да обмислят предприемането на решителни действия.\n[207.56s] Жертви, които не се чувстват готови да се обърнат директно към правоприлагащите органи\n[211.22s] могат да получат подкрепа и практически съвети от други поверителни услуги.\n[216.849s] Всяка държава има свои собствени такива.\n[219.0s] В Великобритания това са:\n[221.26s] Убежище, Помощ за жени, Подкрепа на жертвите,\n[225.16s] Инициатива за Човечеството и Линията за мъжки съвети.\n[230.08s] Понякога жертвите се колебаят за действие, страхувайки се от отмъщение.\n[234.4s] Но и действието и бездействието имат значителни рискове.\n[238.285s] И в много случаи рисковете от правене на нищо,\n[241.158s] значително надвишават рисковете от действие, тъй като насилника става по-хаотичен и смъртоносен през годините.\n[248.44s] Когато са въвлечени деца, рисковете се увеличават още повече.\n[252.58s] Заплахата от физическо насилие не винаги е налице, понякога насилието е психологическо.\n[259.68s] Каквато и да е форма на злоупотреба, важно е да се разруши стената на мълчанието.\n[264.28s] За жертвите, които са се научили да крият насилието над тях от външния свят,\n[267.8s] мълчанието се превръща в условен рефлекс, и лош навик.\n[272.7s] Освен че възпрепятства получаването на подкре��а за жертвите, мълчанието има и по-коварен психологически ефект.\n[279.4s] Когато нещо е обявено за немислимо, то може да стане обременено с чувство на срам.\n[284.74s] Това е едно от извращенията на насилствените ситуации\n[287.86s] че жертвите поемат тежестта на срама, която принадлежи на техните насилници.\n[293.58s] Самото изявление за немислимото, може да противодейства на този срам.\n[298.56s] Поради тази причина всяко външно (чуждо) признаване на злоупотреба\n[302.09s] колкото и да е малко признанието, то има стойност\n[304.74s] — дори и записването на признанието в личен дневник.\n[308.66s] Някои от жертвите имат роднини, на които се доверяват.\n[313.06s] За други, които не са сигурни на кого могат да се доверят\n[316.03s] анонимни телефони на доверието дават възможност да бъдат изслушани поверително.\n[320.06s] Анонимни интернет форуми могат да работят по същия начин.\n[324.06s] Важно е да се каже, че насилниците понякога са привлечени към тези форуми.\n[328.24s] Но също така е важно да се отбележи, че последните проучвания\n[331.46s] подкрепят това, за което мнозина отдавна подозират\n[334.18s] — че хората, които правят кибер (онлайн) тормоз\n[336.92s] обикновено имат значително ниско самочувствие.\n[340.4s] Контактът с външна подкрепа може да бъде рискован.\n[343.78s] Анонимен събеседник, който ми каза, че е говорил откровено за насилието над него, със симпатичен приятел,\n[349.06s] каза, че наскоро е открил, че неговият насилник е подслушвал един от техните телефонни разговори.\n[354.12s] Някои насилници стигат дотам, да използват шпионски софтуер.\n[357.521s] Поддържането на неприкосновеността на личния живот сред хора, които постоянно я нарушават, изисква да бъдете креативни и внимателни в действията си.\n[364.514s] Насилниците често предизвикват силна емоционална реакция в жертвите\n[368.66s] — вина, гняв, страх, срам, презрение;\n[373.22s] и объркващи комбинации от изброените.\n[376.248s] Това работи в полза на насилника по три начина.\n[379.92s] Първо, емоционални реакции на жертвите служат като постоянна демонстрация\n[384.789s] че техният насилник има способността да ги влияе\n[387.65s] да си играе с тях, държейки вниманието им върху насилника.\n[392.454s] Второ, силните емоции изваждат жертвите от равновесие,\n[397.12s] което им пречи да мислят трезво и да реагират рационално.\n[401.816s] Много от насилниците държат жертвите си във емоционална въртележка\n[405.3s] редуващи се със, злоумишлени атаки и преувеличени демонстрации на любов.\n[409.84s] Трето, реагирайки емоционално, жертвите остават въвлечени в конфликта,\n[415.21s] и могат да дадат на насилниците повече материал, който може да се използва срещу тях.\n[419.2s] Насилниците могат да изглеждат много по-големи, ако се гледат през очилата на емоциите.\n[424.347s] Сякаш хвърлят заплашителна сянка\n[426.36s] и се намесват във всички сфери от живота на жертвата.\n[429.639s] Поради тези причини \"клиничното откъсване\" е важен навик, който трябва да се развие\n[434.629s] — способността да се отдръпнат и да разгледат ситуацията с трезвен рационален поглед.\n[440.86s] Изследването на насилниците с \"клинично откъсване\" помага да се намали техният възприет размер,\n[445.49s] тъй като жертвите започват да ги виждат като обикновени хора, със специфични разпознаваеми недостатъци.\n[451.993s] Това също помага да се подчертае фактът, че насилниците принадлежат към диапазон от много различни категории с напълно различни мотивации.\n[461.34s] Някои сами предизвикват насилие.\n[465.02s] Някои го инициират под ръководството на други\n[468.2s] — зловредни културни, политически и религиозни фигури,\n[471.9s] зловредни свещени книги, и зловредни роднини.\n[476.02s] Насилниците също се намират в диапазона който преминава от порядък до хаос.\n[481.28s] Въпреки че насилниците в порядъчния край, могат да покажат различни черти, свързани с разстройство на личността\n[487.18s] — като чувство на привилегированост и черно-бяло мислене —\n[490.61s] тяхната злоупотреба често се дължи на догматични фиксирани идеи,\n[494.48s] а не на психологическо разстройство.\n[497.38s] Авторитарните насилници изискват стриктно спазване на правилата за сметка на личните свободи.\n[503.84s] Правилата са жестоки и унизителни.\n[506.74s] Всичко е правила, липсват всякакви чувства.\n[510.2s] Опитите за оспорване на правилата водят до по-строг контрол.\n[514.64s] Някои от тях погрешно вярват, че техният насилник изпълнява някаква благородна социална функция;\n[520.059s] че това внушава морална дисциплина над техните жертви;\n[523.52s] че премахва нежелани качества;\n[526.28s] и, в крайна сметка, изгражда по-добро общество.\n[530.3s] Те гледат на своите любими теории и лични предпочитания като обективни принципи.\n[535.68s] Ако те подозират че някаква дейност\n[537.876s] — като творческа или интелектуална дейност —\n[540.6s] води до това, което те смятат за морална дегенерация,\n[543.589s] и тогава тази дейност е забранена и е наказуема.\n[546.76s] Погрешно предчувствие се превръща в закон.\n[550.06s] Поради това те налагат всякакви абсурдни правила, без обосновка и обяснение.\n[558.02s] Въпреки че техните идеи изглеждат произволни, те не водят до хаоса,\n[562.127s] който може да бъде открит при някои злокачествени разстройства на личността.\n[565.95s] Много насилници с разстройства живеят в свят на вътрешни противоречия и парадокси.\n[571.78s] Те презират жертвите, но се нуждаят от тяхното признание.\n[576.251s] Те копнеят за похвала, но поставят под въпрос искреността на похвалата, когато я получат.\n[580.88s] Те не понасят самотата, но не понасят компанията на автентични хора.\n[586.62s] С други думи, те искат да бъдат заобиколени от хора, които са лишени от собствени нужди.\n[592.96s] Когато става въпрос за категоризиране на насилници, нещата не винаги са такива, каквито изглеждат.\n[597.92s] Може да изглежда, че насилника се подчинява на указанията на друго същество\n[602.36s] — например, да следват указанията на някой тираничен Бог от Писанията —\n[607.079s] когато в действителност той просто използва това същество като прикритие за собствената си жестокост.\n[612.57s] Жертвите може да искат да вярват, че всичко ще бъде наред,\n[615.691s] ако просто могат да отделят насилника далеч от вредното влияние.\n[619.63s] Но насилника — е самото вредно влияние.\n[623.384s] За жертвите, които подозират, че техният насилник има разстройство на личността,\n[627.43s] изследването на признаците и симптомите на антисоциални, истерични, гранични и нарцистични разстройства\n[634.009s] може да даде известно разбиране на техните преживявания.\n[637.0s] Но има капани, които е важно да запомните.\n[639.756s] Разграничаването между разстройствата не винаги е лесно. И е лесно да започнеш да вярваш в фалшива диагноза.\n[647.36s] Ако това се случи, жертвите започват да проектират качества върху своите насилници, които качества не съществуват.\n[653.32s] И да не забележат онези, които съществуват.\n[655.72s] Насилниците също могат да покажат \"коморбидност\", т.е. те имат комбинация от разстройства.\n[662.44s] Поради всички тези причини е разумно да не се претоварва вниманието с диагностични термини,\n[667.607s] а да се запази строг фокус върху реалното поведение на насилника.\n[671.72s] А \"поведение\" — е ключовата дума.\n[674.67s] При насилниците думите и действията често си противоречат.\n[679.439s] Именно действията разкриват самоличността.\n[682.66s] Развиването на умения за \"клинично откъсване\" не само помага да се определи характера на насилника\n[687.43s] но също така помага на жертвите да изяснят собственото си мислене.\n[690.8s] Много жертви са податливи на всякакви видове \"пожелателно мислене\" и \"склонност за потвърждаване\".\n[696.35s] Това е разбираемо — особено когато насилниците са хората, които те обичат. И се надяват, че са обичани в замяна.\n[703.18s] Може да има сериозно изкушение да се отрече или да се омаловажи проблемът\n[707.04s] или да фантазират, че насилникът им ще разбере грешките си\n[711.269s] и ще се превърне в един достоен човек.\n[714.573s] Всички тези фантазии, надежди и на отричане на реалността са ефективен начин да останат жертвите заклещени в злоупотребата.\n[720.4s] Само когато ние работим с добра информация можем да разчитаме на ефективно реагиране на ситуацията.\n[726.68s] Отказването от илюзиите, помага за установяване на психологическо разделение.\n[731.96s] Жертви, които преди това са се виждали в капан в нефункциониращия свят на насилника,\n[737.91s] започват да осъзнават, че живеят близо до някой, който е в капан в собствения си нефункционален свят.\n[744.036s] Дори когато жертвите започнат да виждат насилниците си такива, каквито са в действителност,\n[748.32s] може да отнеме известно време, докато собствените им лоши навици изчезнат.\n[753.46s] Но с течение на времето абсурдността на тези навици става все по-очевидна.\n[759.065s] Маневри за дистанциране.\n[766.18s] Ако жертвите можеха да видят, че думите им се изкривяват в пълна заблуда чрез избирателното слушане на техните насилници, [Oчаквам с нетърпение нашата почивка.]\n[773.423s] изкривени така, че да отговарят на всяка фантазия, която в този момент е проникнала в главата на насилника,  [Ти искаш, да си починеш от мен нали??]\n[778.266s] скоро те ще спрат да полагат някакви усилия.\n[780.94s] Те биха престанали да се опитват да вразумят неразумните хора.; [2+2 = на каквото аз кажа!]\n[784.76s] да изискват справедливост от човек, за когото справедливост означава лично неудобство; [справедливост = моето неудобство]\n[790.02s] да искат да бъдат разбрани от хората, които упражняват своя контрол, като изопачават истината; [погрешно разбиране = контрол]\n[795.78s] да бъдат открити и искрени с изкусни манипулатори, който използват личната искрена информация като: оръжие. [Лична информация = оръжие/боеприпаси]\n[804.32s] Тези навици могат да се нарекат  \"говорене на мъртъв език\".\n[808.5s] За насилници всички тези езици\n[810.82s] — разум, справедливост, разбиране и честност —\n[816.42s] подкопават тяхното положение на власт, осигурявайки път към истината и отговорността.\n[822.74s] Те намират убежище, в други езици\n[825.7s] — безотговорност, дървения език, безсмислици и безсрамни лъжи —\n[833.56s] за да запазят поквареното си чувство за власт.\n[837.04s] Анонимната кореспондентка ми обясни как нейният насилник е склонен да прави неразбираеми намеци и предложения. [Открити намеци, които сочат към една посока]\n[845.44s] Когато е директно оспорен, насилникът се преструва, че е невинен и заявява че е недоразбран. [връща си казаното обратно]\n[852.384s] Тези разговори са описвани като плашещи и изтощителни.\n[857.5s] Много жертви незабавно разпознават тази тактика\n[860.76s] която е особено популярна сред по-уязвимите насилници,\n[864.12s] които предпочитат скрити, индиректни форми на нападение.\n[867.8s] Тази тактика е толкова разпространена, че дори има име: DARVO.  [Акроним от Английския език]\n[872.512s] Това съкращение отразява последователността от събития, която се случва, когато насилниците инициират атаки\n[878.102s] и се сблъскват с противопоставянето на жертвите.\n[881.3s] Отначало отричат агресията си, понякога измислят жалки истории за прикритие.\n[886.94s] След това самите те преминават в атака, играейки засегнатата страна, обръщайки ролите на жертвата и насилника.\n[894.7s] Този елемент на смяна на ролите — понякога се нарича \"кръстосан\" —\n[898.26s] е характерен компонент на психологическите игри. Той обърква жертвите.\n[904.3s] Игрите с промяна на ролите идват в различни форми.\n[907.5s] Някои игри започват, когато насилниците се опитват да поставят жертвата си в ролята на \"спасител\".\n[912.0s] Те могат да се омаловажат. Или да се оплакват, че други хора ги тормозят. [Никой не ме обича. Чувствам се толкова самотна]\n[917.1s] От марионетката се очаква да се втурне в помощ.\n[920.46s] Но всички опити се подкрепят насилника никога не са достатъчно добри. [Аз те обичам. Какво да направя за да помогна?]\n[924.76s] В резултат на това насилника преминава от състояние на \"жертва\" в състояние на \"преследвач\",\n[929.14s] сега атакува марионетката си — която преминава от \"спасител\" към \"жертва\".\n[933.74s] Насилниците, са като таралежите, окачени с куки.\n[937.96s] А жертвите многократно се появяват в ризница\n[941.22s] — костюм от метални пръстени, които лесно се закачат.\n[945.58s] Тази аналогия показва как жертвите често приемат неадекватни стратегии към насилниците, които само ги заплитат още повече.\n[953.34s] Всеки пръстен в ризницата може да се разглежда като рефлексна реакция, която може да бъде експлоатирана от насилника.\n[960.84s] Например, рефлексна реплика на обида;\n[964.82s] протест срещу фалшиви обвинения;\n[967.74s] изискване за заслуги, когато такива се отказват.\n[971.08s] Проблемът с рефлексните реакции е, че те са фиксирани и безсмислени.\n[976.48s] Те не се приспособяват към различни условия.\n[979.865s] В една справедлива и рационална компания тези рефлексни реакции могат да работят много ефективно,\n[985.176s] за да предотвратят изостряне на конфликти.\n[989.866s] В изкривения свят на насилниците тези рефлекси водят до обратния резултат, като довеждат жертвите до изостряне на конфликта.\n[998.385s] Откачването ни от тези конфликти изисква стъпка назад и изследване на нашите собствени реакции.\n[1005.9s] Когато осъзнаем нашите фиксирани безразсъдни рефлекси, можем да започнем да ги заместваме с гъвкави и внимателни реакции.\n[1014.62s] Можем да контролираме реакциите си, вместо те да ни контролират.\n[1019.7s] Вместо да реагираме безсмислено на обиди от насилници, можем съзнателно да признаем, че те просто искат да се хранят от нашата реакция, [Ти си такова разочарование!]\n[1027.97s] и можем да изберем да се отдръпнем.\n[1031.185s] Ако насилниците се опитват да ни въвлекат в ненужна конкуренция,\n[1034.52s] негативно сравнявайки нашите качества и постижения със собствените си или с тези на други хора, [Защо не си успешен като сестра ти?]\n[1039.839s] можем да изберем да се абстрахираме от тези сравнения.\n[1043.78s] Ако насилниците се опитват да ни оклеветят пред разумни справедливи хора, [Аз го помолих за подкрепа. Той ми каза да се разкарам]\n[1048.33s] можем да изберем да потвърдим невинността си пред тези разумни хора, [Имам свидетел, той може да потвърди че тя лъже]\n[1052.66s] и съзнателно да решим да не се забъркваме с насилника.\n[1056.9s] Когато започнем да разпознаваме куките на насилника, можем дори да им дадем имена.\n[1062.01s] Вътре, ние си казваме: \"А, това е куката на конкуренцията.\"\n[1068.03s] \"А, ето я куката за фалшиви обвинения!\"\n[1072.005s] Парче по парче, пръстенът на безсмислените рефлекси, който ни тежеше преди,\n[1077.669s] сега изчезва, давайки свободата да се измъкнем от игричките.\n[1083.33s] Избягвайки една кука, е лесно да хванеш направо в друга.\n[1087.94s] Да се откажеш от игричките означава да не се бориш да надделееш.\n[1092.2s] Но това също означава, че не правите всичко това само, за да покажете на насилника, че не се борите да надделеете\n[1098.02s] което, да бъдем честни, е просто друг начин да се борим за да надделеем.\n[1103.68s] Целта е да се даде възможно най-малко;\n[1107.04s] не показвайте никакви емоции; не предлагайте никакви мнения.\n[1111.0s] Просто дайте банални, неясни отговори.\n[1114.48s] Този начин на лечение от куки се нарича \"сив камък\"\n[1117.62s] защото това означава да се направите толкова безинтересни и скучни, колкото сивия камък.\n[1123.18s] Но има някои неща, които е важно да разберете, когато го използвате.\n[1126.66s] Може да бъде изкушаващо да дадете на насилниците да разберат, че умишлено ставате сив камък; [Аз ставам сив камък]\n[1131.6s] за да им го натриете в лицето.\n[1134.07s] Освен че това премахва ефекта от метода, това може да доведе до по-точни злоупотреби. [Насилника:Това ще е забавно...]\n[1140.22s] Високото ниво на контакт с насилниците може да означава честото прилагане на метода на сивия камък.\n[1145.92s] В резултат на това някои жертви могат периодично да се чувстват малко емоционално изключени.\n[1151.96s] За да се включат отново, за жертвите е полезно да разберат кои неща ги зареждат.\n[1156.8s] Това може да е музиката, природата, физическа активност — всичко, което ги връща към жив живот.\n[1165.02s] Да бъдеш сив камък понякога може да означава прагматични отстъпки.\n[1169.28s] Например, ако насилникът несправедливо сравнява вас с други хора [Ева е в много по добра форма от теб.]\n[1173.79s] тогава може да има момент, в който вместо неутрална реакция може да решите да се съгласите.\n[1179.32s] Това съгласие не означава задоволяване на насилника или унижаване на себе си. Означава да се освободиш.  [Да така е.]\n[1186.935s] Позволявайки си да дадете искрено мнение, може да бъде от голяма полза при премахването на рефлексните защитни реакции.\n[1194.9s] Ако реакцията на сивия камък е твърде остра, тя може да привлече вниманието, вместо да го намалява.\n[1201.3s] Понякога е полезно да използвате друга опция, която наричам Бежов камък.\n[1205.7s] Тук реакциите на жертвите имат малко повече цвят, за да ги направят по-малко тежки.\n[1210.75s] Това означава да използвате по-пълни изречения, вместо вдигане на рамене.\n[1215.084s] И да си позволите малко по-дълги взаимодействия, вместо да искате да се скриете.\n[1220.98s] Когато започнем да се движим по-ефективно в живота с насилниците, можем да започнем да чувстваме вълна от състрадание към тях.\n[1227.58s] Когато хватката им върху нас отслабва, ние ставаме щедри, милосърдни,\n[1232.3s] особено ако установим, че нашите насилници са били подложени на насилие в миналото,\n[1236.71s] или ако изразяват някаква степен на самоосъзнаване и разкаяние.\n[1241.16s] Внимание: ние не сме терапевти на нашите насилници.\n[1246.6s] Опитите да се поеме някаква отговорност за тяхната рехабилитация могат да бъдат началото на нови насилнически игри.\n[1254.48s] Някои насилници искат от жертвите си да им кажат, когато се държат неразумно. [Просто ми кажи ако съм неразумен]\n[1259.48s] Това може да изглежда като положителна молба.\n[1262.301s] Но когато жертвата по-късно посочи някакво неразумно поведение, тогава играта започва — [Продължаваш да ми викаш...]\n[1268.62s] насилникът използва критиката, за да започне атаката. [Ако ми позволиш да ти кажа нещо, няма да се налага!]\n[1273.02s] Когато злоупотребяващите твърдят, че са наясно с грешките си\n[1276.12s] и изразят желание за промяна\n[1278.49s] за много жертви това е точно това, което искат да чуят.\n[1281.975s] И има голямо изкушение да разхлабят бдителността си,\n[1285.188s] да говорят открито за чувствата си и да говорят за това как могат заедно да \"започнат всичко отначало\". [обещавам че нещата ще се оправят]\n[1291.42s] Уви, много жертви осъзнават твърде късно, че всичко това е просто трик на насилника, за да разбере какво всъщност мислят.\n[1300.331s] Когато насилниците твърдят, че са имали някакво лично просветление,\n[1303.606s] жертвите е по-добре да запазят бдителността си, а може би и да я увеличат.\n[1308.52s] Това не е жестоко или грубо, не се доверявайте на хора, които многократно са унищожили доверието ви.\n[1314.14s] Това е рационално и здравословно поведение.\n[1317.145s] Насилниците, които твърдят, че искат да се променят,\n[1319.878s] могат да покажат своята искреност, като поемат пълната отговорност за тази промяна.\n[1325.18s] Жертвите се насърчават да стоят настрана и да се съсредоточат върху собственото си развитие.\n[1331.4s] Дори и в случай на истинска промяна, почвата може да бъде прекалено изгорена, за да може доверието да се порасне отново. [Има твърде много щети]\n[1339.14s] В тези случаи насилниците ще трябва да живеят с недоверието, което са създали. [Добре]\n[1345.839s] Противодействие на отровата.\n[1352.26s] \"Най-болезнено не беше самото Насилие. А факта, че когато най-накрая започнеш да говориш за това, никой не иска да слуша.\"\n[1360.38s] По време на моята терапевтична работа и разговори с обекти на насилие тази мисъл бе повтаряна много пъти.\n[1367.92s] Някои живеят живота си с вярата, че ако някога съобщят за насилието над тях, тогава техните близки [ще ме подкрепят ако споделя]\n[1373.107s] — приятели, роднини или партньори — ще ги подкрепят незабавно.\n[1378.18s] За щастие, много хора никога не трябва да подлагат тази вяра на изпитание.\n[1382.66s] Уви, много други ще открият, че тези емоционални мрежи за сигурност за които смятат, че могат да разчитат,\n[1387.767s] не съществуват.\n[1389.83s] Когато най-накрая споделят историята си, реакцията на любимите им хора е да се отдръпнат. [жертва съм на насилие]\n[1395.26s] Макар че това може да започне да се чувства като съзнателен заговор, обикновено се свежда до набор от известни човешки недостатъци.\n[1403.43s] Апатия — някои хора просто искат спокоен живот без усложнения. [искам просто спокоен живот]\n[1408.6s] Гордост — някои от тях са дългогодишни поддръжници на насилника [Няма да ме излъжеш че си жертва]\n[1413.32s] и отказват да повярват че са били измамени.\n[1416.398s] Страх — някои усещат характера на насилника и не искат те самите да станат негова жертва. [Не искам и с мен да се занимава]\n[1422.64s] Невежеството — някои нямат опит или въображение, за да осмислят това, което им се казва. [Хората не са такива]\n[1429.38s] Резултатът за жертвите е изключително ясен:\n[1433.1s] да се оправят сами.\n[1435.06s] Това само по себе си поставя необичайна тежест върху жертвата.\n[1439.36s] Като социални същества ние сме приспособени да взаимодействаме положително с нашите ближни.\n[1444.4s] Чрез реакциите, които получаваме от другите, имаме постоянна обратна връзка за това как ни възприемат,\n[1450.56s] което от своя страна формира нашето възприятие за себе си.\n[1454.34s] Ние сме \"огледала на реалността\" един към друг.\n[1458.22s] В здравословни ситуации, където изпитваме достатъчно качествена обективна обратна връзка,\n[1464.08s] ние придобиваме и поддържаме силно чувство за самоосъзнаване.\n[1468.14s] В насилствени ситуации, където обратната връзка е силно изкривена или отказана,\n[1473.86s] жертвите могат да развият силно изкривени представи за себе си.\n[1478.847s] За да се постигне нещо, което се доближава до здравословно чувство за самоосъзнаване,\n[1482.26s] жертвите трябва да предприемат допълнителни мерки, за да коригират постоянната фалшива обратна връзка, която получават.\n[1489.02s] Аналогията, която често използвам, е, че жертвите пият от отровния кладенец на насилника през цялото време.\n[1496.136s] За да се разреди отровата, жертвите трябва да създадат свои собствени чисти и здрави кладенци.\n[1501.8s] И колкото повече кладенци — толкова по-добре.\n[1504.2s] Всеки кладенец представлява източник на здравословно отражение на реалността,\n[1508.005s] чрез който жертвите могат да придобият ясно и трайно самосъзнание.\n[1512.68s] Някои от най-добрите източници на здравословни отражения могат да бъдат други хора.\n[1517.02s] Дори един човек в личния ви живот, който вижда нещата трезво, може да играе ключова роля в противодействието на отровата.\n[1524.58s] Друг вид човешки кладенец може да бъде онлайн общност, споделяща подобни преживявания.\n[1530.22s] За много жертви, слушането на историите на други хора може да доведе до мощна \"детоксикация\".\n[1535.34s] И не е необичайно жертвите да се потопят в голям брой видеоклипове, посветени на злоупотреби.\n[1541.42s] Това не е депресиращо.\n[1544.08s] Става въпрос за проникване в реалността.\n[1547.94s] И накрая, те виждат как се отразява техният собствен по-рано отричан опит и преживявания.\n[1553.84s] Те не са луди. Те не са невидими.\n[1557.34s] Оказва се, че има хора, които знаят какво се случва зад затворени врати и не искат да го изкривят или да го заглушат.\n[1564.64s] Запис на нашия живот в дневник или видеодневник създава друг вид кладенци, напомняйки ни, че миналото наистина се е случило.\n[1572.74s] Личните интереси създават красиви кладенци: физическа активност, образование, творчество.\n[1580.54s] Тези неща допринасят за нашето чувство, че сме отделна личност със собствени предпочитания.\n[1586.08s] Разбира се, индивидуалността не е нещо, което насилниците са склонни да насърчават.\n[1590.86s] И е разумно да се предвиди някакъв саботаж.\n[1594.947s] Когато бях дете, обичах да рисувам комикси за супергерои.\n[1598.92s] Когато бях на 7, реших да създам цял комикс.\n[1603.42s] В продължение на седмици се придържах към целта си да рисувам една страница всяка вечер и една нощ комиксът беше готов.\n[1610.64s] Когато гордо реших да го покажа на родителите си, моята нарцистична майка бързо го прелисти, след което го разкъса.\n[1618.82s] Това не отговаряше на нейните лични виждания.\n[1622.12s] Насилниците често се опитват да потиснат, нарушат или унищожат всичко, към което жертвата проявява интерес.\n[1628.62s] Някои жертви разбират — както аз разбрах — че е по-добре да се занимават с това, което им е интересно, скришно.\n[1634.1s] И тези, които упорстват и развиват таланти понякога изпитват още едно изкривяване по-късно в живота,\n[1640.049s] когато насилникът им се опитва да пренапише историята\n[1643.2s] и да се преструва, че е насърчавал развитието на тези таланти.\n[1647.94s] За съжаление, в лицето на агресивна опозиция, много жертви просто изоставят напълно интересите си,\n[1655.22s] което допълнително ги лишава от индивидуалност.\n[1658.91s] Извличането на метафорична чиста вода може да бъде трудоемко, както и извличането на истинска вода.\n[1665.66s] Намирането и поддържането на добри надеждни източници може да се почувства много трудно отначало, но става по-лесно с времето и практиката.\n[1674.28s] Колкото повече интереси развиваме, толкова повече аспекти на нашата личност възстановяваме и откриваме.\n[1680.4s] За брат ми и мен, отровният кладенец, до който израснахме, беше дълбок и широк.\n[1685.5s] Безкрайни психологически капани, невъобразими обвинения, постоянни изблици на ярост.\n[1692.0s] Поглеждаме назад и си спомняме всичко това много ясно.\n[1695.6s] Но това не определи детството ни.\n[1699.14s] Това, което определи нашето детство\n[1701.12s] — и това, което постоянно си спомняме заедно, с радост и любов  —\n[1705.549s] бяха много здрави кладенци, които сме създали за себе си, които са изтласкали отровата на заден план.\n[1713.396s] Когато ние заменяме старите навици нови\n[1716.48s] понякога чувстваме вътрешен конфликт,\n[1718.49s] дори ако се опитваме да подобрим нашето положение.\n[1721.68s] Всяка промяна— положителна или отрицателна —\n[1724.66s] може да предизвика смесени чувства или неочаквана съпротива вътре в нас.\n[1729.98s] Стихотворение на Порша Нелсън \"Автобиография в пет кратки глави\"\n[1734.6s] идеално пресъздава този процес на объркване.\n[1738.9s] В първата глава се разхождаш по улицата\n[1742.3s] и падаш в ямата на тротоара.\n[1745.56s] Имаш нужда от много време, за да се измъкнеш от нея.\n[1749.22s] Във втората глава вървиш по същата улица.\n[1753.04s] Преструваш се, че не забелязваш ямата.\n[1757.02s] — и ти отново падаш в нея.\n[1759.24s] Ти не знаеш защо.\n[1761.54s] Отново, за да се измъкнеш, трябва много време.\n[1765.7s] В третата глава ще минеш по същата улица.\n[1768.78s] Сега вече не се преструваш. Виждаш дупката.\n[1773.1s] И все пак падаш в нея.\n[1776.04s] Но сега ти виждаш, че вината е твоя —\n[1779.06s] нещо, което правиш със себе си, по навик.\n[1782.58s] Ти бързо излизаш.\n[1785.38s] В четвъртата глава минаваш по същата улица.\n[1789.7s] Най-накрая заобикаляш около дупката.\n[1793.559s] Най-накрая си научил урока си.\n[1798.134s] В пета глава вървиш по друга улица.\n[1803.62s] Някои от нас рано или късно ще напуснат насилствената среда.\n[1807.38s] Ще започнем нов живот, като внимаваме.\n[1812.02s] Но независимо дали стигаме до това или не, няма нужда да отлагаме живота си, когато се окаже, че споделяме ежедневието си с насилници.\n[1822.535s] Този канал изследва проблемите около манипулацията, злоупотребата и догмата. Огромна благодарност към всеки, който подкрепя тази работа."}'
