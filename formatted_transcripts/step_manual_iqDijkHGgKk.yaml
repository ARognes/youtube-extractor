transcript: '{"content":"\n[0.0s] So, if you have low self-esteem, and you\n[2.44s] think to yourself, \"Oh my god, I''m a\n[4.16s] terrible human being. I suck. I''m a\n[5.96s] loser.\" Let''s think about what was the\n[8.32s] state of your mind when you learned\n[10.48s] that. So, for me, when I was getting my\n[12.56s] ass bullied on the playground at school,\n[14.84s] my mind was not distracted. I remember\n[17.04s] the feeling of like I would go out onto\n[19.2s] the playground, and I''d like play around\n[20.96s] the edges. I''d stay away from the\n[22.88s] high-value\n[24.52s] playground objects. There was like trees\n[26.28s] around, so I''d just like walk around the\n[27.68s] trees in the back until my bullies were\n[29.92s] occupied. And once they were occupied,\n[31.72s] if the seesaw or the swings or whatever\n[33.48s] were open, like I would go over there\n[35.04s] and play. And then if they caught me,\n[36.64s] they would form a ring. And when they\n[38.24s] form a ring around me, I''m not\n[40.0s] distracted. Do you guys get that? My\n[41.92s] mind is laser-focused on the bullies.\n[44.68s] And then whatever they say sinks in.\n[47.4s] Like the mechanism of trauma is the mind\n[51.0s] becomes laser-focused, and then you\n[52.68s] absorb whatever is happening to you. But\n[55.16s] it''s not just trauma, right? Good things\n[57.4s] can happen that way as well. Like you\n[59.48s] can be crying and thinking like, \"Oh my\n[61.64s] god, I''m such a loser.\" And your crush\n[63.6s] walks up to you. And then you''re\n[65.0s] laser-focused, and your crush says, \"It\n[67.12s] breaks my heart to see you suffering.\n[68.84s] What can I do to help?\" And it''s like,\n[70.6s] \"Oh my god.\" Like that sinks in. Like,\n[73.0s] \"Oh, feels so good. I feel amazing. Like\n[75.6s] everything is possible in life. Let''s\n[77.32s] go.\" Right? So, this is important to\n[79.04s] understand. You can control what goes\n[81.8s] into your mind. And the simplest way to\n[83.8s] control it is by altering your focus.\n[86.32s] The more distracted you are, the less\n[88.0s] things sink in. The more focused you\n[89.76s] are, the more things sink in."}'
