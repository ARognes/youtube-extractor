transcript: Shad CN has the ability to create custom component registries and I've gone ahead and done just that. I created my very own webdev simplified shad CN registry and I've added in some common components I use in pretty much any project and I can easily install these components and you can also easily install these into your own library. So if you wanted to go ahead and use my loading swap component which just swaps out an icon with that loading spinner. You can go ahead and you can use this install command right here which directly hooks in with the shad CN CLI. You can see it's adding that directly from my website. And then you can have this component directly inside of your project. And if you want to go ahead and you want to contribute by adding more components to this library and so on, I have a full GitHub repository with everything you need inside of it to add your own component. Just go ahead, you can create an issue for different things or you can create a discussion for different component requests that you have. So, if you want to learn more about how this entire documentation site works, as well as how you can create your own registry or contribute to this particular registry, I'll have a full video linked at the bottom of the screen that goes over all of
