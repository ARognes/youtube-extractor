transcript: '{"content":"\n[0.399s] In 1888, a few months before the end of his most prolific and final period of writing, Frederick Nietzsche wrote in ''Ecce Homo''\n[9.34s] \"That a psychologist without equal speaks from my writings--this is perhaps the first insight gained by a good reader.\"\n[17.47s] Nietzsche viewed himself as the first psychologist amongst the great philosophers writing, \"Who among the philosophers before me was in any way a\n[25.779s] psychologist? Before me there simply was no psychology.\"\n[30.13s] Given that Sigmund Freud, Carl Jung, and Alfred Adler--three giants of twentieth-century\n[35.8s] psychology--were all heavily influenced by Nietzsche''s\n[39.219s] psychological insights, his grandiose self-assessment seems to have contained at least a kernel of truth.\n[46.6s] Nietzsche''s psychological investigations were not conducted for the sake of disinterested theoretical speculation; as in his eyes,\n[54.73s] knowledge should always be sought first and foremost for the purpose of energizing life. In\n[60.039s] his essay ''On the Use and Abuse of History for Life'',\n[62.91s] he quoted Goethe: \"I hate everything that merely instructs me without augmenting or directly invigorating my activities.\"\n[71.71s] Nietzsche undertook his psychological ventures for the sake of discovering how to fulfill the maxim which formed the subtitle of his autobiography\n[80.35s] Ecce Homo -- \"How One Becomes What One Is\". In ''The Gay Science'', Nietzsche echoed this idea:\n[87.52s] \"What does your conscience say? -- ''You shall become the person you are''.\"\n[92.53s] In this video we will shed light on what it means to \"become who you are\" and in the process explore some of Nietzsche''s\n[100.119s] fascinating psychological insights.\n[102.939s] Countless philosophers have attempted to understand the human mind, discern its tendencies, biases, potentials, nature, and origin.\n[110.95s] But Nietzsche claimed that all those before him were blinded in their psychological ventures by not only an\n[117.549s] unquestioned acceptance of the socially prevailing beliefs and moral standards,\n[121.869s] but more significantly, by a fear of exploring the depths within themselves.\n[127.66s] In ''Beyond Good and Evil'' Nietzsche explained:\n[130.75s] \n[131.86s] \"All psychology so far has got hung up on moral prejudices and fears: it has not dared to descend into the depths.\"\n[140.57s] Nietzsche conceived the psyche as\n[143.06s] constituted by\n[144.2s] multi-dimensional layers and possessing a complexity which renders total and complete knowledge of it an impossibility.\n[151.55s] Heraclitus, the Presocratic Greek philosopher whose\n[155.3s] aphorisms exerted a heavy influence on the development of Nietzsche''s ideas,\n[160.25s] captured the complex quality of the psyche: \"If you went in search of it,\n[165.05s] you would not find the boundaries of the soul [psyche], though you traveled every road--so deep is its measure [logos].\"\n[172.16s] \"How can the human being know itself?, asked Nietzsche,\n[175.64s] \"It is a thing dark and veiled; and if the hare has seven skins, the human can slough off  seventy times seven\n[183.41s] and still not be able to say, ''Now that is what you really are, that is no longer outer shell.\"\n[190.28s] Most individuals, fearing the complex depths within, remain at the superficial and surface layer of their psyche,\n[198.38s] \"industriously mindful of their common comedy and not at all of themselves.\"\n[203.06s] Not one to follow the crowd, Nietzsche took an opposing approach:\n[207.709s] \"I undertook something that not everyone may undertake\", he wrote in the preface to the ''Dawn of Morning'',\n[213.14s] \"I descended into the depths, I bored into the foundations.\"\n[217.25s] A fear of descending into the depths of one''s psyche is not unfounded, which is why it is \"something that not everyone may undertake.\"\n[225.44s] For those who lack sufficient courage and are ungifted in psychological investigations, a\n[231.68s] voluntary descent into the inner foundations of one''s mind could engender temporary, or in rare cases, permanent madness.\n[239.9s] Writing of the dangers which confront the \"adventurer and circumnavigator of that inner world called ''human being''\", Nietzsche wrote:\n[247.91s] \"He enters a labyrinth, and multiplies a thousandfold the dangers that life in itself brings with it--\n[254.66s] of which not the least is that nobody can see how and where he loses his way,\n[259.34s] becomes solitary, and is torn to pieces by some cave-minotaur of conscience.\"\n[265.07s] While exploring the depths within may be a foolish danger for the many, it is a necessary endeavor for the few.\n[272.0s] The psyche of a small minority of individuals,\n[275.75s] in comparison with that of the overwhelming mass,\n[279.35s] is constituted by both greater depths and a higher degree of turmoil. To ensure they are not torn asunder by the\n[285.98s] contradictions, conflicts, and abysses within, such individuals are driven inward to explore and impose order on their psyche--\n[294.26s] fashioning and sculpting themselves into a \"harmonious totality\".\n[298.46s] Nietzsche presented Goethe as the exemplary individual who was able to impose form on his inner chaos.\n[305.24s] \"What he wanted was totality...\", Nietzsche wrote, describing Goethe. \"... he disciplined himself to wholeness, he created himself.\"\n[313.1s] To create oneself does not mean to form oneself out of nothing. As humans,\n[318.01s] we cannot, as some falsely claim, be fashioned in any way we please.\n[322.91s] Each of us, according to Nietzsche,\n[324.77s] has a deep and abiding nature which places definite set limits on who and what we can become.\n[331.94s] \"At the bottom of us, really \"deep down\", there is, of course, something unteachable, some granite of spiritual fatum [personal fate or destiny],\n[339.71s] of predetermined decision and answer to predetermined selected questions.\n[344.45s] Whenever a cardinal problem is at stake, there speaks an unchangeable \"this is I\".\"\n[351.41s] Our nature is sculpted\n[352.54s] not only by early personal life experiences and the traits and dispositions inherited from our ancestors,\n[359.06s] but also, according to Nietzsche, by historical forces.\n[362.99s] The traditions and \"experiments\" of past cultures continue to live on within us,\n[368.51s] influencing our life and experience from the deeper layers of our psyche.\n[373.04s] \"The past of every form and way of life, of cultures that formerly lay right next to or on top of each other,\n[380.45s] now... flows into us \"modern souls\"; our drives now run back everywhere; we ourselves are a kind of chaos.\"\n[388.61s] Given that the \"past of every form and way of life\" continues to live on in us, Nietzsche proposed\n[394.6s] we need to engage in an active exploration of history, if we are to attain self-knowledge.\n[401.16s] \"Direct self-observation\", he wrote, \"is not nearly sufficient for us to know ourselves:\n[406.3s] we need history, for the past flows on within us in a hundred waves.\"\n[411.97s] Just as the past continues to live on in modern cultures, embodied in myths, traditions, and institutions,\n[418.66s] so too our psyche has been shaped and sculpted by past ages. The tendency of the modern individual to feel he has been\n[426.49s] arbitrarily thrown and abandoned into an absurd world is the direct result of lacking what Nietzsche called a \"historical sense\"--\n[434.95s] of having no conscious connection to the past, and therefore failing to dig one''s roots through the strata of history.\n[442.72s] In an early essay titled ''On the Use and Abuse of History for Life'', Nietzsche\n[447.82s] contrasted \"the condition of a people which has lost faith in its ancient\n[451.96s] history and has fallen into a restless... and a constant search for novelty after novelty\",\n[457.81s] with the individual who has cultivated a \"historical sense\", and attained \"the sense of well-being of a tree for its roots,\n[466.06s] the happiness to know oneself in a manner not entirely arbitrary and accidental,\n[471.16s] but as someone who has grown out of a past, as an heir, flower, and fruit.\"\n[476.5s] But it is not only the cultures of past\n[478.78s] millennia which continue to live on within us. For in the deeper layers of our psyche exist\n[484.39s] prehistorical drives and impulses.\n[487.09s] Just as our body contains relics of earlier developmental stages,\n[491.47s] stretching back even to the reptilian age, so too our psyche contains within its depths primitive drives\n[498.27s] which stretch back into the prehistory of humanity and animality.\n[502.99s] Every human being, no matter how civilized and developed on the surface, is still an animal\n[509.44s] and archaic man within the depths of his being. \"I have discovered for myself that ancient humanity and animality\", wrote Nietzsche.\n[517.84s] \"indeed the entire primal age and past of all sentient being\n[522.07s] continues in me to create, to love, to hate, to infer.\" In these uncivilized layers reside\n[528.45s] what Zarathustra called \"the beast within\"--\n[531.49s] potentially destructive inclinations which can overtake and possess the human being,\n[536.329s] such as the drive to aggression and unbridled sexual lust.\n[540.769s] Instead of advocating for the repression of the beast within, Nietzsche recommended we explore and become familiar with these potentially destructive\n[549.05s] vestiges of the ancient past.\n[551.3s] Just as a raging river can be harnessed for its energy, so too the uncivilized layers of the psyche, if channeled and handled properly,\n[559.699s] can vitalize life. \"[The] most shortsighted and pernicious way of thinking wants to make the great sources of energy,\n[567.079s] those wild torrents of the soul that often stream forth so dangerously and overwhelmingly, dry up altogether,\n[574.339s] instead of taking their power into service and economizing it.\"\n[579.139s] But it is not only destructive drives and impulses which reside in the prehistoric layers of our psyche;\n[585.62s] there also exists what Nietzsche called the \"divine animal\"-- ancient instincts, \"regulating unconscious and infallible drives\"\n[593.72s] which enabled our ancestors to survive and even flourish in harsh and\n[598.85s] uncertain environments prior to the emergence of the modern form of consciousness.\n[604.279s] The modern individual has all but lost touch with these ancient instincts.\n[609.35s] Relying solely on his consciousness, his \"weakest and most fallible organ\",\n[613.97s] he stumbles blindly through life, oblivious that in the recesses of his mind are archaic helpers,\n[620.23s] which, if he knew how to harness them, could assist him in the many situations in life where consciousness fails.\n[627.86s] Speaking of the modern individual, Nietzsche wrote:\n[630.92s] \"He has lost and destroyed his instinct, and can no longer trust the \"divine animal\" and\n[636.41s] let go the reins when his understanding falters and his way leads through deserts.\"\n[642.199s] The presence of historical,\n[644.48s] prehistorical, and animal drives has contributed to the existence of an \"abundance of contrary drives and impulses\" within us--\n[651.92s] \"we ourselves are a kind of chaos\", as Nietzsche put it.\n[656.3s] In contrast to other philosophers who have posited the human mind to be above all something unitary,\n[662.269s] Nietzsche radically proclaimed it to be a multiplicity,\n[665.87s] an aggregation of intertwined psychological entities.\n[669.6s] \"The most general picture of our essence\",\n[672.14s] he wrote, \"is an association of drives, with constant rivalry and particular alliances with each other.\"\n[679.62s] Conceptualizing the human psyche as a \"social structure of the drives and affects\"-- as a sort of city, in which numerous\n[687.0s] conflicting sub-personalities\n[689.04s] simultaneously live--the task Nietzsche set for himself, and his readers,\n[693.75s] was to harmonize the \"abundance of contrary drives and impulses\", and\n[698.4s] provide coordination to the plethora of competing forces within.\n[703.08s] He proposed that such coordination can be attained via the agency of an \"organizing idea\" or \"ruling passion\"-- a\n[711.27s] dominant \"master\" drive that forms the \"living center\" of the psyche, and\n[715.65s] co-opts all the other drives to act in subordination to its end.\n[720.39s] The organizing idea is not found through an act of will, but, possessing a type of intelligence of its own,\n[727.74s] reveals itself throughout the course of one''s life.\n[730.89s] One merely has to remain on the lookout for such a master drive, and not hinder its growth and activity.\n[738.3s] \"The organizing idea that is destined to rule keeps growing deep down--it begins to command; slowly\n[744.32s] it leads us back from side roads and wrong roads;\n[748.26s] it prepares single qualities and fitnesses that will one day prove to be\n[752.91s] indispensable as means toward a whole--one by one, it trains all subservient capacities\n[759.45s] before giving any hint of the dominant task, \"goal,\" \"aim,\" or \"meaning\".\"\n[764.64s] The organizing idea, in other words,\n[767.46s] arranges the plethora of competing forces in one''s psyche in a manner that allows one to strive with single-minded devotion\n[774.9s] towards a heroic goal which gives meaning to life.\n[778.77s] Nietzsche summarized the importance of the organizing idea in giving form to one psyche in the following\n[785.67s] unpublished note: \"It is a myth to believe that we will find our\n[789.69s] authentic self after we have left behind or forgotten one thing or another...\n[794.31s] To make ourselves, to shape a form from various elements--that is the task! The task of a sculptor!\n[801.74s] Of a productive human being!\"\n[804.54s] \n[805.68s] Nietzsche''s psychological insights are wide, varied, and always penetrating--\n[809.79s] a result of his ardent conviction that the psyche of modern man was in dire need of being dissected.\n[816.27s] But despite his piercing observations, there are critics who claim his insights into the nature of the human mind are\n[823.62s] irrelevant because of the fact that at the young age of 44 he fell victim to a mental illness which remained with him\n[831.06s] until the end of his relatively short life.\n[833.7s] Ignoring the fact that his illness may have been of an organic origin. there are some who may ask:\n[840.15s] Why should anyone pay attention to ideas on how to \"become who you are\" from a man who went mad?\n[846.21s] To respond to this question we''ll conclude with an eerie passage from Nietzsche''s\n[850.68s] unpublished notes, in which he seems to foreshadow the fate which would befall him later in life.\n[856.92s] \"There is a false saying\", he wrote, \"How can someone who can''t save himself save others?\n[863.28s] Supposing I have the key to your chains, why should your lock and my lock be the same?\n[876.24s] "}'
