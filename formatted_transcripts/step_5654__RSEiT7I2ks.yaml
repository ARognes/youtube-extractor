transcript: this is actually going to be kind of a quick one for you guys today because I'm actually in the middle of final exams at Uni but I'm going to do a much more detailed systems design and architecture video coming up soon where it's not just me yapping while playing a video game okay we're going to bust out the diagrams we're going to do all sorts of fun stuff so stick around if you're interested for that but today I just wanted to briefly talk about a topic that I think is really important in system design and that's the idea of a problem space you can actually take this outside of just system design and apply it to pretty much all parts of engineering but today I'm just going to focus on its application in software hardware and computer systems so what is a problem space and why would you even care I'm going to start us off with a question so the question is when you're designing a system why are you designing that system right like what's the point in designing that system it doesn't matter what the system is it could be a web system like a web app or something like that it could be a server it could be an embedded system it could be a hardware circuit it could be any kind of any kind of thing the the point is is why are you designing that system and the vast majority of the time the system is going to be designed in order to solve a particular problem right or meet a particular purpose or do something in particular so why the system is being designed usually it's to do something or to solve a problem and so the problem space when you talk about systems design is all of the context that's required to make up the problem so what I mean by that is if I've got a problem what are the components that make up that problem and how do I design the components of my solution to meet the needs of those problems it's a bit of abstract so I'm going to start us off with an example on a pretty low level of abstraction and I want to get into abstraction uh layers a little bit because I think that's really important for mindset so let's just say I'm a software engineer and I've been tasked to work on a pre-existing software component and I'm fixing a very simple bug something like this we'll start off with this so essentially what we're on now is a pretty low level of abstraction so I'm at the code level of the system so my problem space is essentially what are the components that go into making up this bug right so what's the symptom of the bug like what does the bug actually do where in the software system does this occur what leads to it occurring like what are the preconditions for this to actually happen and so I have to load all of that cont text into my head in order to figure out exactly where the bug is and go into the system and fix it let's say I'm building out a feature in the same program my problem space is now what are the requirements of the assigner right so I've been given a feature that I'm supposed to implement what are the requirements so what is this feature actually supposed to do what are the performance requirements that they want um then I'm thinking on the code level what are the data structures I'm going to use to implement this you know what are the libraries I'm going to use maybe how do I build out my functions correctly how do I split up my code so we're thinking on a pretty low level of abstraction I want to swap gears for a minute and say let's go and design a web app so immediately if I'm saying I want to design a web app by expanding the scope like that we actually have to change the level of abstraction that we're thinking about when we're designing this particular thing so now instead of thinking about the code that goes into the web app I'm directly immediately thinking okay web app the components that make that up are a database uh a web server you know we're going to have an API we might have a front end that we need to build out that grabs information from the back end and things like that what you'll notice is that even though we've gone up to a higher level of abstraction eventually we will still have to Encompass the low level of abstraction as well so as I'm designing and building this web app I'm still going to have features I need to implement I'm still going to have bugs I need to fix so I still have to care about the low level of abstraction and if I'm going into a software system we'll go back to the first example where I'm on the code level here when I'm writing my code I have to think about how that fits into the overall system as well on a much higher level because if I'm writing a whole bunch of code that doesn't integrate well or kind of does its own thing or maybe red does something that's already done that's not necessarily great practice so the point is in my opinion for systems design what's really helped me and I'm still pretty uh early on in my career so I'm interested to to see how my mindset changes when I get more experience but what's really helped me is the ability to think on multiple levels of abstraction as I'm working on something so for example if I'm working on um like designing the web app I can think I can start thinking so I've got my you know I've got the database that I want to use I've got the sort of API that I want to use um what backend framework do I want to use Jango well if I'm using Jango then I'm going to be using Python and I know that there's a great rest API library for that so I could use rest apis right and then if I'm actually writing out the code I have to think about how that fits in with my system overall I'll give you another example so I mentioned in a previous video that I'm involved with an embedded systems course at my University and one of the biggest fundamental reoccurring issues I see students have is failure to grasp the problem space and essentially what I mean by that is they a lot of the time and I don't blame them for this because I don't think that un assignments that they've done up to this course really prepare them for this kind of problem solving um but the the issue is tunnel vision so they'll pick one component of the embedded system we'll give them a whole bunch of requirements um and we'll say you've got to do this and you've got to do this and you've got to do this and an embedded system is made up of a lot of different components there's like Hardware components there's software components and then within those components there's components um so you really have to be thinking about your system design as you go and Implement each component because especially on embedded systems every component has to tightly interact because a lot of the time your MCU is not all that powerful so I had an example where I saw some students who for example were using an LCD right and so one person nominated themselves and said okay I'm going to work on the LCD display which is fine because you want to split up the workload up like that but then they got tunnel vision so a lot of the time they used SPI as their communication method with the LCD so if I'm thinking on multiple levels of abstraction when I'm designing my uh system and when I'm implementing the code for this LCD I'm thinking to myself okay so I'm going to need to use the SPI bus are there any other components that work together to solve the overall problem of we need to build this project that I need to think about when I'm using the SPI bus cuz if there are other components I don't necessarily want to hog the SPI bus all the time because even though my component might work really really well I'm still not actually solving the overall issue because I've only met one component in the problem space right like I've just got the LCD I don't have the other components of the project working so if I was thinking on the higher level of abstraction exactly I'm thinking okay I've got this LCD on SPI what other components are on SPI that I need to worry about and so that's kind of what I wanted to talk about today uh is this idea of the problems space you want to be able to load the context into your head for the problem that you're trying to solve and then for each component of that problem how are you going to design a solution and for each part of that solution you want to be able to think about the layers of your design so when you're coding you want to think about how this is going to fit into the overall design of the code or or the system as a whole um if you're designing you know like you're doing the high Lev design you want to think okay would this actually be feasible to implement in code like how difficult is this going to be because I can come up with a fantastic architecture that's super crazy and it would be awesome and so great but when it actually comes to coding it out and doing the implementation it's an absolute nightmare because it's so complicated so it's important that no matter what level of abstraction you're thinking on when you're designing the system you've got to consider everything else as well and sort of find that middle ground so for me at least like I mentioned I find working on the um you know being able to swap between those layers of abstraction really helpful but yeah I'm I'm really curious to see how my mindset on this changes as I get more experience so if you've got any comments about this topic I'd really love to hear about them cheers
