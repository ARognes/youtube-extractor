ther dimensions as well. So, I think what you want to do typically is you want to score what level each one of those dimensions are, and then the mean or the median of that is what the level of that story would be for the interviewer, okay? So, let's just go through it. What is the scope of your project here? Do you think it's a senior level scoped project or a mid or what? >> Yeah, I would say it was a senior level scoped project. It was uh a key part of our product, and there was a lot of reworking that needed to be done, and needed a a high-level view of all the work that had been done previously. >> Were you uh working within the team context on this project? >> Yes, this questionnaire was part of the product suite that my team was working on. >> So, if it was owned by your team, could other people on the team also use this as a story for their own behavioral interview? >> Right, okay. I would say that the the higher-level work of the the architecture and the working with the back end would have been the things that I had owned. The implementation was the the team's. So, I was part of working with the product manager and breaking down the stories, being able to make sure that all the work was covered in the sprints that we had. Yeah, then the implementation was the the team's. >> Okay, so that sounds like a senior-level scoped project. >> Okay. >> In terms of the contribution, I think you need to be a little bit more clear. I think you did a good job of it, actually, of talking about how you designed and architected the system, and that you did some of the implementation, but that some of the other implementation was done by other folks on the team. So, if you were able to clearly delineate that, they'll be like, "Oh, okay, cool. This wasn't a one-person job. This was a five-person job with uh Kennan at the top." >> Right, okay. That's actually something I did want to get some help about was trying to avoid the we, but not overblowing your side of the story and 