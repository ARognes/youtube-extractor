d be comfortable with saying something like, "Hey, I designed and architected the solution." You don't need to be like, "Well, actually I was responsible for like 84% of the design and architecture. There was another mid-level engineer whose job was to come in and build the small subsystem." >> Yeah. >> But it turns out that that small subsystem like didn't matter at all in like the broader implementation. You can just say confidently I designed and implemented it. >> Okay. >> Right? >> Yeah. >> You can't go to the earth-level granularity and be like, "I designed Microsoft Azure and implemented it and all of that other stuff." Right? You were part of that contribution. What you want to do is you just want to chunk up what your level of contribution is so that you can say it simply to the interviewer. Does that make sense? >> Yeah. No, that's very helpful. It's a very helpful mental model for sort of breaking that breaking that up. >> In terms of the impact, I think that was it was unclear to me. Now we have this like configurable questionnaire that's much more resilient and doesn't have very many errors and handles them gracefully, but I did not get a sense of like what the impact of that was. >> Yeah, so the impact was that we were able to release a much better version of the questionnaire in a shorter amount of time than it would have been to do the fully fledged one that product was aiming for. It was also something that was a lot better tested and would have allowed for building up for any changes going forward. It would have made it a lot easier and more robust to to do it. The struggle is that there aren't any particular metrics that I I have and I don't know what to Yeah, I'm I'm just trying to think I I'm you know, I'm not going to try and fabricate metrics. Um but it's to know Yeah, what to do when the story doesn't have a particular metric and is just trying to work out how you can still show impact. >> The thing here is impact I define as a measurable change and symmetric. Optimally, it would be a quantitative metric with a number that you could easily chart up or down. In the absence of that, I think providing a qualitative metric is okay. I think in this situation, you know, I asked about impact and you were basic you basically told me about a trade-off between like getting something out versus like all the bells and whistles that product wanted. And so, that's not exactly the type of impact >> Yeah. >> that we want to talk about. Now, you did say that time to creating like another questionnaire was shortened, but that doesn't give me a sense of the impact to the business. But, you would actually teed it up at the beginning of the story, which was like there are angry coaches on the other side. >> Yeah. >> So, that's a qualitative metric. >> Yeah. >> But, I think it's what you have, so you need to use it. >> Yes. Okay. >> It's going to be difficult with this type of work to draw a number back to say like a financial number, but you can increase the stakes if you know what the stakes are to your particular client. So, how much are these coaching programs? >> This initial session is the kind of a free coaching session that they then will pay few hundred pounds to to be able to join. >> But, it's part it's part of a broader package. >> Yes. >> So, what's the what's the high ticket number? I know there's a range, but >> Yeah, we'd be taking a a percentage of their savings when they choose to invest in with our platform. >> Got it. >> This is the entry way to that. And so, we'd be taking a percent of the savings. >> No, I mean it's so the percentage is the thing that reduces the much bigger number, right? So, is this for people with millions of pounds in their retirement savings, or is it for people that are really rich, or is it for like what's the >> It's Yeah, so there is actually it would be a for the a range of people from It's trying to get people who don't usually invest investing. That's a big market share. And so, that's where they're trying to get people >> No, see I mean again like just numbers like >> Okay, it'd be for people with 50,000 to a 200,000 pounds wanting to invest with us. >> Got it. Okay. So So this is maybe what I would say. For this particular product the goal was to get people with, you know, 50,000, 100,000 pounds, millions of pounds who didn't usually invest investing with the guidance of these coaches. Now, it's very difficult to find and market to these people and so it's really important that we get a really detailed questionnaire so that we can give it to the coaches so the coaches can actually sell the product. If they don't have that information, they're not going to be able to make an effective pitch and then the company will lose a ton of money. Now, we were also white labeling these these questionnaires and so that means that other people from like other coaching practices would like use this product as well. So it's really important that it would be flexible. But first and foremost, for the business to make money, this questionnaire really needed to be rock solid. >> That's good. Yeah, yeah. >> So I think the the problem is that a lot of tech people, they kind of reduce their contribution. They don't really know how their work fits into the broader business that's there. Now, I'm in the coaching game so I understand that like onboarding is really really important. Either they're about to or they have just spent a a sizable investment or a percentage of the the funds that they're going to invest in like globally and they have the option to back out. Like there's a refund or a grace period. And so if that onboarding call is a really poor quality, that's literally going to lose a ton of money for the company that's there. So that So this is a way to like increase the stakes in the results cuz you don't actually have You're not privy to the to the actual profit and loss statement of this particular company. But you do know that it's important to