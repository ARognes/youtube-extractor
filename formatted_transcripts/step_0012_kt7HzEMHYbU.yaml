transcript: This is Kennan. He's a senior front-end engineer with 6 years of experience, and he's trying to land his next senior role. Kennan has the stories to get there. He re-architected a broken questionnaire that was costing his business real money. He chased down a bug that was super difficult to reproduce in production. And he introduced end-to-end testing to a team that fought back hard on the idea. But, like a lot of smart engineers, he just doesn't know how to tell his stories in a way that makes him sound senior instead of mid-level. I'm Steve Nguyen. I spent close to 20 years at Amazon, where I made it to principal engineer. And as a bar raiser, I personally conducted nearly a thousand interviews. In this video, the three things I'll help Kennan fix are front-loading his actions so his impact lands in the first 30 seconds, cutting keywords from his answers so his own contribution is unmistakable, and tying every story to a business impact so they aren't mistaken as mid-level. If you're in the Seattle area and preparing for interviews, apply to be a guest for an episode. The application is in the description. I'd love to help you land your dream job. Let's get to it. >> Kennan, thanks for coming by today. >> Sure. >> Let's start with your best behavioral story. >> Sure. So, the question that I think is best is tell me about a project that you architected and some trade-offs that you made. >> Okay. >> The background is that we had a onboarding questionnaire that all our customers who were going through financial coaching would have to do. Our company was moving towards a white labeling solution for our product. So, product wanted to revamp this questionnaire, and they wanted it to be fully customizable by our tenants so they could change all the questions. It was decided beforehand that that was too big a scope change. We just didn't have the back-end resources. So, when I came to take on the project, my role was to redesign the API and to re-architect the front end. So, there were two big issues technically that we had with the questionnaire. So, one of them was that the 17-page form all existed on a single URL path. So, whenever any bugs were reported, it was really hard to get the application into the same state that it was in. And secondly, we didn't have proper error handling. Customers were completing the questionnaire API endpoints were failing. It was only until they got to the coaching session that they found out that their answers hadn't been saved. So, there was the two kind of big issues to to solve. So, the first thing I did was I created a sequence diagram of our current flow, um all the calls that we needed to make from front end to back end, and proposed a solution to the back end. Now, my idea was to take off some of the logic from the front end and give it to uh the back end, um which would mean that we had less control. It would also mean that the API requests would be slightly slower, but it just meant it would make it easier for us to error handle any issues that came from the from the back end. Secondly, to solve that issue of being on a single URL path, broke it down into smaller page paths. Each page then had its own state management context, and then each reusable kind of functions. So, there were more functions, and there was kind of a wider space, but then that made it easier to test and to reason about going forward. With all that in place, uh the team and I were able to create the on this new flow, which was extensible and ready for any future upgrades for when the SAS partners wanted to configure it, but it was also a lot more reliable and fully tested compared to our what we had before. >> Got it. How long did this all take you? >> Yes, so this was a about a 2-month project. >> All right. How do you think that story landed? >> I think it's it gives a sort of baseline of what kind of what happened with the bits that I had to play. It maybe misses a bit of a a punch of the the impact that it had. Yeah, I think that's the parts that I kind of struggle with is trying to take my story and calibrate it for kind of a senior-level role. >> I think it's a good story. The all the ingredients are there. I think the problem is I gave maybe a little bit too much context to start off. >> Okay. >> I think that those details were necessary, but they were necessary for different parts of the story. So, I'm a big fan of leading with your actions and your behavior and providing just enough context to make sure that that those actions make sense. Does that make sense? >> Yes. Okay. >> So, I think you did a great job of like framing the project, but the thing is I'm not going to go and work on that thing. You don't need to tell me that your you know, your company white-labeled the the quiz. Um you know, you don't need to tell me how many questions there are on it. You know, and so I would have said something like, I I re-architected the questionnaire? >> Yes, a questionnaire. Onboarding questionnaire. >> yeah, I took an onboarding questionnaire that was pretty complicated, um but it was like fundamentally misdesigned. Because people would just get on a coaching call and realize that their answers hadn't been saved, but they had spent all of this money to get onto this coaching call. And so, I needed to to fix it. And we had some decisions about whether we wanted to fix it for the short term or the long-term and how extensible we wanted to be. >> Okay. >> Right? >> Yep. >> If I had just said that, it was a kind of a longer sentence. I might break it up into to two or three sentences or something like that. Anybody that has written software ever would just say, "Okay, I know exactly what he did." Right? I understand what the stakes are. I understand the problem space. Does that make sense? >> Yes, so that's the opening line, or is that kind of I give that and then I wait? Oh. >> Yeah, so I suggest people use like a think about it in terms of like a pyramid. So, at the very top is the entire story. So, if you look at behavioral interviews, like most of the guidance is to use like the STAR format, right? So, situation, task, action, and result. Or maybe even CAR or CAR, so context, action, result, optionally learning. The problem is that you end up telling a very chronological story. I'm not writing a a report on that. I I actually I don't care about the like the the story as it as it's being told from the company's perspective. What I really care about is like what did you do? Because based off of what you did, I'm going to map that to the context that I have for the company that's hiring you, and I'll be like, "Okay, Kennan was able to do it to solve a big problem over there that was kind of big and hairy, and he did it in a short amount of time. He could do that over here." We want to make sure that we we get to the action as quickly as possible. So, think about it in terms of a pyramid with three layers, right? So, the very first is like the headline. "Hey, tell me about the project that you're in the most proud of." Okay. You tell them about the the fact that you made an extensible questionnaire in a short amount of time. Errors never popped up again. Uh clients were super happy. Then, I think you want to tell like the 2-minute version of that story. You add a little bit more context. You talk about how you broke some things down. There might have been some gotchas. Uh there might have been some challenges and obstacles. And then, the base layer of your pyramid is like follow-up questions that the that the interviewer wants to have. So, maybe the interviewer cares about the specific technologies that you used. Did you use React, or did you use another library on top of it, or did you roll your own? What were some of the error cases that were there that were like particularly difficult? Maybe they want to go into the business side, and so they care about, you know, the coaching product and the offering, and like where you fit into the situation. You can't know what the interviewer is going to want to know more about, but you could at any given point talk about those things if they ask you those follow-up questions. But I think it's a mistake to try to anticipate what follow-up questions will be because that just blows your context up, and because you put at the beginning of your story, you are both going to probably choose incorrectly. It would be like winning the lottery if you were to choose the context that would magically fit the glove of the interviewer, but also it's just going to lead to this situation where you're going to provide context that you don't end up following up on. Does that make sense? This episode is brought to you by Linear. They just published something that I think is worth talking about. They opened with a new manifesto, "Issue tracking is dead." And what that means is that the behaviors around it, like the manual logging of issues, the prioritization back and forth, the grooming sessions where half the room is just trying to figure out what's even in the backlog, these things are a thing of the past with Linear. I lived this nightmare at Amazon. We had mechanisms for everything. And don't get me wrong, I'm a big believer in mechanisms, but more often than not, the process of tracking the work took as much energy as doing the work. You come out of a sprint planning meeting and think, "We just spent 2 hours so eight engineers could figure out what they already knew they needed to build." What Linear has done is rebuilt the platform so that the stuff happens automatically. Your code, your decisions, your customer feedback, all of that context all lives in one place, and Linear actually works from that. So when something comes in, the system already understands what it is and where it fits. Nobody has to triage it manually. If you're an engineering leader and you want your team building instead of administrating the work, check out Linear. The link is in the description. >> Yes. So, give the opener kind of short condensed version and then give out the details and then do you just kind of stop and wait? Do you invite any more? Do you say, "Is there any particular bit that you'd like to hear more on?" >> Yeah, exactly. >> Okay. Yeah. >> Yeah. And so, by prompting the interviewer to if there's any further follow-ups, you do a couple of things. One, it stops rambling because you could just be like, "To know about this particular detail, he needs context on this." You can get stuck in this infinite loop of just like trauma dumping on the interviewer. By stopping, you are inviting a conversation. You don't want it to be a monologue. You want it to be, you know, a conversation about stuff. This gives them an opportunity to lead you in the direction that they want to go in. Now, it could also be that you've answered the question to their satisfaction. In which case, you know, I used to train a a ton of interviewers. I told the interviewers, like, "If you got the data point that you needed, there's no need to follow up to take the story to its logical conclusion." >> Yeah. >> Right. So, sometimes you might be in an interview and they ask you a question and then you give an answer and they're like, "Great." And then they like move on and you might think to yourself like, "Oh, I must have answered that incorrectly." The way that you should actually interpret that is like they got what they needed. >> Yeah. >> It's just like much more efficient to move on. Right. So, you're giving them the opportunity to move on if they got what they needed. >> Yeah. So, I guess it's the idea the interviewer wants you. They want to get the idea. They want to get the data point from you. >> Yes. >> So, and they're trying to just get that as quickly as possible. >> They should if they're a good interviewer. >> Yeah. I guess it's that key thing. What is it that they're asking? >> Yes. >> On top of That's That needs to be in that opening top of the pyramid answer. >> And that 2-minute what I call it the behavioral core, in that two-minute core, what you want to do is you want to tease a particular line of conversation. And so, if they are interested in that, then when you ask them for the follow-up, they will be like, "Hey, can you flesh this particular aspect out?" And then you'd be like, "Of course." But if you do the upside down pyramid, where you give them everything, breadth and depth, that's when you're going to catch yourself rambling, that's when you're actually adding a lot of cognitive load to the interviewer. Cuz they're trying to filter the story in real time. One mental model I think is really helpful is like, think about the fact that you're the interviewer is writing notes down. In a perfectly efficient communication model, you would give them the line that they write down. And so, that's what you should strive for with these these summaries of the stories. Candidate works at a company where they had a inflexible and long questionnaire. There was no error handling, and uh oftentimes answers would be blank. This was a onboarding questionnaire for very expensive like coaching product. And so, customers were very unhappy um when this occurred. Candidate was able to build a uh flexible and comprehensive solution that eliminated all of the blank answers, allowed for variations in uh tests, and could guarantee correctness and like uptime of the questionnaire. >> Yeah. >> Right? >> Yeah. >> And so, then if you're going to interview with uh maybe a technically minded person, they would be like, "Okay, uh you say that it's flexible, what exactly does that mean? Okay, what what are the dimensions that were you were able to configure the different questions on? What was the backing data store?" Any number of different questions there. Could you group questions into like subgroups or something like that? You know, and then you'd be like, "Oh, glad you asked." And you can like go into it. You said you made it like really testable. What was your testing strategy? And so, I'm just assuming since, you know, you're the expert on this and you lived that experience, that yeah, of course, you could just go into any number of those different lines of questioning. >> Just like Kenan, I see smart people really struggle to know how much depth to give in their interview responses. If you're taking notes now, no need. I outlined it all here in my book, The Technical Behavioral Interview, an Insider's Guide. I go over a brain-dead story structure with 72 example stories across all levels from junior to staff and principal. They cover more than 130 interview questions, more than you'll ever need. The link is in the description. >> Sure. Yeah, so when preparing or practicing like the story, cuz I guess the story could be used for other questions as well. >> Mhm. >> But how do you suggest to prepare for that kind of top pyramid? Is there a length of time or is it just trying to match it perfectly? >> You have to do some pattern matching and decoding of the question. Let's talk through it, right? So, what type of questions you think that this the story would be good for? >> Like the proudest project. The one that you that you led. There's a bit of where you've worked cross-functionally, maybe with working with a back-end engineers and design. >> So, cross-functional is kind of I think maybe too generic. I think if there was a disagreement there, that might be interesting. Um if there was a lack of requirements or guidance, that may be good. If there was a tight deadline, I think that would be good. Um if there were like stakeholders that were being unreasonable, that might be good as well. >> Yeah, I could say with there was the the deadline. It was our our team's quarterly goal. Um trying to think how to how to frame it in that the challenges that came up in trying to meet that that goal. >> So, this is your your proudest moment, and you talked about the fact that there was some cross-functional 