transcript: Every time your phone pops up that little dialog box asking you to share your location, you're not just sharing it with that app. You could be sharing it with dozens of companies you've never heard of. Companies that know where you sleep, where you work, and where you go on a Friday night. Assuming you're one of those weirdos who actually leaves the house, here's what those permissions actually mean. Who's buying that data and why even tapping don't allow might not be enough to keep you off the map. Let's talk about how phones know your location. Both on iOS and Android, location sharing comes at two levels of granularity, approximate and precise. Approximate is the coarse one. On iOS, that's a circular region with a radius anywhere between 2 and 10 km. For Android, it hovers at about 3 sq km. Sorry for mixing units, I don't make the rules. Approximate is accurate enough for a weather app, nowhere near accurate enough to figure out which house on your block you live in. Precise, by contrast, narrows you down to a few meters, your actual spot on the map. Your phone can be that accurate because it's blending up to four location tracking methods at once, GPS satellites, Wi-Fi scanning, cell towers, and Bluetooth beacons. Now that we know how your phone tracks you, how do we determine which apps are tracking you? Well, in most cases, they ask. When an app asks for your location for the first time, both iOS and Android show essentially the same prompt, which has three options for when that app can use your location. The three options are allow once, allow while using the app, and don't allow. Allow once gives the app a single one-time permission. While using the app lets it see your location whenever that app is open on your screen, and don't allow never shares your location. What's missing from that initial prompt, though, is the option to let an app track you 24/7 in the background. On iOS, an app can request this with a second prompt that shows two choices, Keep only while using or change to always allow. On Android since version 11, the only way to enable allow all the time is to dig into settings yourself. So, if you've granted an app precise always-on access, live tracking apps like ride-share or family locators can ping your location every few seconds, grabbing not just coordinates, but altitude, speed, and heading. Now that you know how your phone tracks you and how the app companies get that tracking, you probably want to know how this data ends up with dozens of companies you've never heard of. We'll tell you right after this word from one of the company you may have heard of, our sponsor, Micro Center. I hope you enjoyed those April showers cuz it's time for June savings. In this time of year, the apples are flourishing. What the hell is going on? Micro Center have great deals on Apple products like the MacBook Air for under a thousand bucks. Didn't get any April showers? Well, maybe that's because you live in Austin, Texas, and instead you're getting a Micro Center. Sign up online for the grand opening and you'll get a free 128 gig flash drive. Or get yours at the Columbus grand reopening if that's closer. Finally, with the world of tech changing so fast, make sure to stay up-to-date with all things Micro Center and tech over at Micro Center news or with our link below. So, how does your data end up moving from the app on your phone into the hands of a shady company you've never heard of? Well, your location data is worth real money. Knowing where millions of people sleep, work, shop, and drive is valuable intel for advertisers, retail analysts, and hedge funds. And that's the engine driving the whole industry of data brokers. Companies like InMarket, Foursquare, Placed, and Outlogic have paid app developers to bake their tracking codes into ordinary apps. So, that when you tap allow on a weather app, a flashlight app, or a game, the broker gets your location, too. To understand more about this world of buying and selling data, we talked to Serge Engelman, who runs Berkeley's usable security group. He told us where the money comes from. >> Developers have also though that there are are also ways of of making money from just monetizing the data that they collect without having to show ads. There are a couple firms that were trafficking in this data and one of their biggest customers is actually the financial sector. Private equity or hedge funds that want to know about say retail traffic ahead of earnings reports. So one way of getting that is maybe buying location data to see you know, how is you know, foot traffic into the you know, this local Best Buy you know, month over month and what you know, what might that mean about consumer spending habits. >> And once a broker has your location, they don't just sit on it. They package your movements into profiles showing where you live, work, shop, worship, and seek medical care. Then sell that profile to advertisers, insurance companies, and government agencies. In fact, the FTC once obtained a free data sample from a broker called Kochava and tracked a woman from a sensitive doctor's appointment back to her home address. What kind of free sample is this? And if you're hoping Apple, Google, or the FTC will police all of this for you, don't. >> Everyone assumes someone else is protecting them and that's usually not the case. The government won't let this happen or surely Google won't let this happen or surely Apple won't let this happen and often have developers say well I you know, I uploaded the app to the App Store and you know, Apple or Google reviewed it and allowed people to download it and therefore they audited it they must have audited it and know that it's perfectly safe. And that's not at all how any of that works. Like no one's actually auditing the app. [laughter] >> All this seems dire, but there steps you can take to protect yourself. If you want to limit your exposure, audit your location permissions right now. On iPhone, go to settings, privacy and security, location services. On Android, settings, location, application permissions. Switch anything that doesn't need ongoing access to the no access option. That's never for iOS and don't allow for Android. It's the single most effective thing an average person can do. And while the FTC has been cracking down on data brokers, the data that's already out there has, unfortunately, already been bought and sold. So, audit what you can and accept that the rest is out of your hands. Unless you want to go full sicko mode on privacy and install GrapheneOS. They're not a sponsor, but if you want to see what using Graphene actually looks like, check out the Linus Tech Tips video on the subject.
