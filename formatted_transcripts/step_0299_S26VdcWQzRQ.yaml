transcript: If you've ever used a website that has really great hot key integration, you know how nice it makes the user experience, but implementing that all yourself is kind of annoying, which is where the TanStack hot key library comes in, cuz this makes implementing custom hot keys into your site incredibly easy. In this video, I have five different examples of various complexity showing you everything you can do with this library all the way from a very basic hook up to a super advanced hot key where you can record different hot keys and save them for user preferences. This is going to cover everything hot key related you need, and once you see how this library works, I guarantee you're probably going to put it in every single project you have. >> [music] >> Welcome back to WebDevSimplified. My name is Kyle and my job is to simplify the web for you so you can start building your dream project sooner. And before we actually start diving into the code, I just want to show you what this very basic example does. If I highlight on this screen here and I click anywhere, if I use the control S key, you're going to see it prints out the exact timestamp for when I click on that key, and then it also says saved cuz I used the control S hot key. If I use control Z, you can see we get undo with the timestamp, and control shift Z gives me redo as well as the timestamp. If I were to, for example, hold down one of these keys, you can see it just constantly upticks this timestamp because it's just repeating that keystroke over and over again from me holding it down. So, you can see I can press three different keys and it does three different things. Now, if we take a look at the actual code for how this works, we're installing that @tanstack/react-hotkeys library that gives us this use hot key hook, which is how we essentially handle everything on our project. And this is a really simple hook to use. The first thing we do is we pass it a string for the hot key we want to use. Now, we could pass this as an object and lay out everything like this, but I find it's much easier just to pass it a string, and we even get full autocomplete and intellisense and type safety for this. So, if I want to do control C, for example, I could say control plus C, and that is now going to represent that hot key of control C. So, if I just type over here, control Z is undo, and if I hit control C, that gives me that saved thing. In our case, we would want this to to S cuz we're doing a saved type thing. The problem though is if I'm on a Mac computer, now I need to press control and really most of the time when you want to have a shortcut on Windows, it's control plus whatever, and on a Mac computer, it's going to be command plus whatever. This is where the idea of this mod right here stands for modifier, and essentially on Windows and Linux, that is going to represent the control key, while on a Mac machine, it's going to represent the command key. So, if I use mod plus S on a Windows machine, which is what I have, that's going to be control. So, you can see here, if I hit control S, it's giving me that saved right there. While on a Windows or on a Mac machine, again, that's going to be the command symbol instead. So, this is a great way for us to modify our keyboard shortcuts. You can see we can put them however we want, and if for some reason I had like a typo inside of here, I'm going to get a warning telling me, "Hey, that's not a valid shortcut." Or if I like maybe spelled the shift wrong, again, it's going to give me perfect IntelliSense warnings inside of here. The next thing we pass to this is just a function that represents what we want to do. Our function is just calling set log, which is just a string we're storing inside of state, and then later we're rendering out what that string is down here, and all it's doing is appending on that timestamp, and then it's going to say saved, undo, or redo, depending on what hot key that I press. Obviously, in your actual application, you would make these hot keys do something, and that's what this function right here is for. Another thing that's really useful about this library is we have a format for display, which will allow us to format these exact shortcuts how they would be on the user system. So, on a Mac system, for example, here you can see it uses the Mac related symbols, and on Windows, it's using the words, which is standard for Windows and Linux. So, you can see here, I type in mod plus S, and it's showing up as control plus S on my screen cuz I'm running on a Windows machine. Again, if I had an Apple computer, this would show up with command S with all of the Mac specific symbols showing up there. Now, you may think that it's a lot of TypeScript wizardry for them to be able to get these different strings to show up the way they are. For example, here to get all this auto complete, and to be able to get warnings anytime, for example, you type something in incorrectly, but it's actually very easy to implement this type of TypeScript safety into your application. And if you want, I can show you real quick how to do it. This is going to be a little bit of a tangent, but for example, I can come in here and I can just get a type that's going to be for our key. And let's say that our keys are going to be A and B. Those are the only different keys that we have. And then we can have a type here, for example, a modifier. Let's say our modifier is going to be either control or it's going to be shift. We're just going to make it super simple. These are the only modifiers and the only keys we have. Now, if we want to create the combinations for those, that's going to be called a combo. All we need to do is combine these together. And the really nice thing about TypeScript is we can use string interpolation to do this for us. So, we can just come in here with that string template literal syntax, and we can add in what we want. For example, we want to have a key, and we want to have a modifier. Just like that. And they're separated by this plus symbol. So, now I've essentially created a very simple version of this type right here. For example, if I were to create a variable A of that type of combo, you can see I get that all complete. Control A, Control B, Shift A, or Shift A. It's got to be one of those different combos. Also, I probably want just my keys on their own, so I'm going to put or key. So, now I can do A, B, or the control or shift combinations. And I can even take this further by making it so I can bind together multiple different modifiers if I wanted to as well. But that's a little bit beyond the scope of this cuz I just want to show you how easy it is to do these various different things inside of TypeScript. And if you want to build a master TypeScript like this, I highly recommend checking out my full TypeScript utilities cheat sheet. It's right here. I have a light mode and a dark mode version. It'll be linked in the description. It's entirely free. It goes over every TypeScript utility that would be incredibly useful for you to learn. It just makes writing professional TypeScript code so much easier. Again, I'm going to link that down in the description for you. It's entirely free for you to check out. Now that we're done with that little tangent just to show you how easy some of this is to actually write in TypeScript, I want to talk about some of the more advanced stuff you can do because right now these are just very basic hot keys, which for 90% of sites is all you need, but there's a little bit of additional stuff we can do. I'm going to move on to this next demo to talk about some of the different things related to options you can pass along. Cuz I showed you you can pass along a hot key and a function, but you can actually pass along three parameters. Here we have our hot key, which is the escape key. Here we have our function, which is the thing that runs when we press that hot key. And then finally, we have options we can pass along. And these options can actually be a lot of different things as you can see. But the main one that I want to focus on in this particular section is the target, cuz this allows us to determine which target it needs to be selected for this hot key to work. For example, you can see I have a hot key for escape, I have a hot key for enter, and I have a hot key for control S. So if I click control S, you can see it's a global hot key and it says save. That's just cuz it's logging out right here how many times all these hot keys have been pressed. So you can see as I save more and more, this number just keeps going up. Now if I were to press escape, which I'm pressing right now, or I press enter, I press that a bunch of times, you'll notice nothing happens. That's because again, they are scoped specifically to their targets. So what we can do, if we go over this escape button, this one only works when I click escape. So as I click escape, you'll notice it's now logging that out down here. And if I click enter, nothing's happening at all. And if I hit control S, it's working just fine cuz control S is a global hot key. Now this enter one is scoped specifically to the enter key. So when I click enter, it works fine, but when I click escape, nothing happens. And again, of course, my global hot key works. This is a great way to scope hot keys to specific elements on your page when you need that type of situation to come up. But I want to talk about a few of the other options as well. For example here, we can enable or disable by just passing true or false to this. This is a really easy way to just toggle these things on and off. So now you can see I'm clicking escape and nothing's happening cuz it's set to enabled of false. Now this conflict behavior option is a little bit interesting. It either is allow, error, replace, or warn. Essentially, this determines what happens if you try to set up two of the exact same hot key in your application, whether or not it's going to give you a console warning, which is warn, whether it throws an error, whether it completely replaces that hot key, or it just allows both the hot keys to work at the exact same time. Generally, you're probably not going to have multiple hot keys with the same exact key though to worry about. We also have event type. This is essentially key down, which is the default, or key up. So it's based on if you press the key or release it. So, if you want to be able to change that around, we also have the ability for ignore inputs. This one is really interesting. It's a true false value for this. And by default, it's actually kind of its own special hybrid where it's going to essentially only work in certain scenarios. So, ignore inputs just means if I have like an input field, a text field on my page, and I click a hot key, it's going to ignore some of those hot keys, but it's going to work with some of them as well. So, for example, if I have a hot key for enter, for example, it's going to ignore that if I'm inside of an input because enter already does something on its own. Or maybe if I have a hot key for just pressing A, and I'm in an input, it should actually type the letter A instead of using my hot key. So, it'll automatically force itself to use the correct behavior. But if you want to just always override that so your hot key works no matter what, you can paste in true here, and that's going to make it work no matter what. We also have this platform section. This just allows me to override what my platform is. So, if I say Mac, it's now going to give me Mac-specific keyboard shortcuts. This is really useful for testing so you can see how things work if you don't have, for example, an Apple computer to work with. Also, we have in here which is defaulting to true, and we have stop propagation. This is just essentially calling e.prevent default on the event and e.stop propagation. This is really useful because, for example, if you normally hit control S on a web page, it tries to save your page and pop up a save window for you. But in our case, by default, the prevent default is already de- prevented. So, when we click control S, it's not actually doing the default behavior, it's doing our hot key instead. But if you wanted to do the default behavior as well, you would just need to make sure prevent default was set to false. Finally, the last thing that we have on here is the require reset. This is actually something that by default is false, and this is just do you need to re-press the key for it to work again? For example, here, if I just hold down the escape key, you'll notice that it constantly fires my event over and over again. If I change require reset to true, it'll now only fire this one time. If I hold down escape, you can see it fires one time, and now I need to let go and then re-press the key for it to fire again. This is really useful if you want to make sure your hot key doesn't fire over and over and over again. I would recommend requiring reset to be true on almost every single hotkey. Now, that covers everything for this use hotkey hook, but there's actually multiple hooks inside this library. And the next demo that I want to talk about is going to be all about a new hook, if we take a look, which is the use held keys and use key hold hook. And this is just helping you determine which keys are currently being held down, if you need to do different things on your site based on that fact. So, use held keys just gives you an array of all the different keys that are currently being held down. In our case, we're only tracking control, shift, and alt for the most part. So, if I hold down control, you can see control is highlighted here, and it says control down here. If I hold down shift, you can see both of those are highlighted. If I hold down alt, you can see all three of them are highlighted. And as I let go of and add down keys, you can see it's prop- properly highlighting and unhighlighting these things. Also, if I hold down other keys, for example, a, s, h, whatever it is, those are showing up in the held key section, cuz like I said, use held keys shows you every single key being currently held down, no matter what. Use key hold is just a way of getting a true false variable on if a key is being held down or not. So, if I hold down the shift key, this is shift held right here is going to return true, because that key is being held down. And all I'm doing for my UI is I'm just mapping through those, and if they're being held down, I show them with that highlighted state, otherwise I don't. So, you can see these hooks can be really useful for specific niche scenarios. Now, the next demo I want to talk about is going to be yet again another hook, and this is for keys that are based on sequences. So, in our case, we have normal hotkeys, which is where you press one set of key combinations, but sometimes you want to have a hotkey that requires you to press multiple keys back-to-back. This is very common in something like Vim, or even in VS Code, there's lots of multi-step key combinations. So, for example, if I type g, and then followed by another g, I can make that do something. In our case, I'm just triggering something, essentially highlighting it. So, when I click gg, you can see it shows this was triggered for us, which is great. Now, if I click d twice, we get this second hotkey being triggered for us, and we can even make this combination as long as we want. For example, down here we're passing a super long combination of things, and if I were to type in all those different combinations, you can see this one has been triggered as well. And to do this hotkey for a sequence, all you need to do is just pass it an array of all the different hotkeys that you need to press in the order you want to press them. And if those hotkeys are pressed in the correct order, in the correct period of time, it's going to run the function inside of here. And you can even pass along some additional options, and there's a few additional things on here, such as the timeout that allows you to actually modify how long you have to press this key combination in a sequence to make sure it properly triggers. And the really great thing is we can actually combine all of this together into our very own custom section for recording our very own hotkeys. So, let me just enable that section, and we'll go over to here. And now if we take a look at our code, I have four different hotkeys set up for saving, searching, toggling, and formatting code. They don't actually do anything, but when I click the hotkey, it's going to highlight and say that I triggered that specific hotkey. But the nice thing about this is I can click on any of these hotkeys and change what the key is. So, for example, search, I'm going to change this to control F instead. So, now you can see that it's changed to control F. I type control F, and it fires that particular hotkey. This is again all built directly into the library, and this is using the use hotkey recorder hook. This one is a much more complicated hook, so I'm going to kind of just give you a high-level overview of exactly what's happening, but essentially it has an on record function, and this happens whenever you start the recording process for your hotkey. And then all you need to do is get the hotkey that's being saved for that. So, if we scroll all the way down to where we have our buttons being rendered out, you can see each one of our buttons, when we click on it, all we do is we call not recording anything, we start the recording. So, for example, I click here, I just called recorder.startRecording. So, what this is going to do is it's going to listen to my keys until I press something, and once I press something, it's going to save that as my keyboard shortcut. So, let's say that I just press the F key, and I actually do this in the right location. So, I come over here, I press F. Now that it's saved that as my hotkey. And when I press that F key, what's going to happen is it's going to call the code inside on record and pass it along that hotkey that I have. Now, in our case, we're just saving this inside of state. So, if you look up here, we just have a state variable that's holding all of our different keyboard shortcuts. So, all we're doing is just saving that directly inside of state and nothing else is happening. Now, we're using that information down here. Each one of our hotkeys coming from that state variable are being set up with this use hotkey hook. And since everything's configured behind the scenes for you automatically, it's really nice because if these hotkeys change, it'll make sure to rehook up all of your event listeners for us so that all the code inside here properly runs just like we expect it to. So, the important thing about this recorder is we essentially have this on record, which is whenever we record a keyboard interaction after we click that record button to start it, it's going to run this function for us. And whenever we cancel out of whatever we're doing, it's going to run this particular function right here. So, we have the ability to start and cancel recordings. And it can a recording automatically ends as soon as we hit any combination of keys to make it work. So, again, I click on here. If I click the Y key, it now saves that to Y. And anytime I click Y in the future, going to save the document or do whatever else you want. This is a perfect way to create configurable hotkeys inside your application. And the amount of code to do this is a minute, just a couple hundred lines of code. And most of it is just styling and react related code. The actual specific code itself is really just these like 10 or so lines right here. I really love this library and everything that it can do. And if you're interested in how they do some of the really cool TypeScript wizardry, I highly recommend checking out my completely free TypeScript utility types cheat sheet. It again goes over 18 different utility types that really make it so you can master TypeScript. It'll be linked down in the description below. It's entirely free for you to download. With that said, thank you very much for watching and have a good day.
