transcript: Number one reason people don't get a promotion, whatever your great at, your superpower is, is not valued by that team and that project and that manager at that time. Sometimes you just have to understand, you can fight as hard as you can, but they're just not going to value your skill set, and either you have to wait for that hiring manager to switch over, or you need to go to a project or a team where you're going to be more valued. The second thing is, you need to have a check-in with yourself, probably every 6 months at a company, especially when you're feeling worn out. Should I stay or should I go? That means, am I growing enough in this company at the same rate that I feel I should be growing in my career? And that could be promotion, that could be raises, that could be scope of work, things that are building your resume, whatever it is. But you need to make that check-in every 6 months or so.
