transcript: '{"content":"\n[6.899s] Разкриване на злоупотреба.\n[15.805s] Част Първа.\nЗа BCB\n[20.046s] Злоупотребява процъфтява в тишината. Тя процъфтява в тишината на общностите, които си казват \"това не е наша работа\". Тя процъфтява в тишината на организации, за които публичният образ е по-важен от вътрешната реалност.\n[32.304s] Процъфтява, когато жертвата на злоупотреба мълчи, осъзнавайки, че никой не иска да слуша. Когато ушите ви свикнат с тишината, можете да чуете, самодоволното потъркване на ръце.\n[40.252s] През ноември 2012 г. бившият министър-председател на Австралия Джулия Гилард обяви създаването на Кралската комисия\n[47.356s] да проучи институционалните отговори на сексуалното насилие над деца.\n[51.447s] Обект на проверки бяха редица организации, включително училища, църкви и спортни клубове,\n[56.03s] в общо 57 публични изслушвания\n[58.46s] Около 7000 души, подложени на злоупотреба, дали показания, около 64% от които били мъже,\n[65.539s] и 10% от тях казали, че това е първият път, когато са разказвали на някого за малтретирането им.\n[70.815s] Били изслушани истории от хора като Хю, който бил подложен на злоупотреба на 10-годишна възраст от скаутски лидер\n[76.551s] който след като спечелил доверието на родителите му, го канил на партита\n[80.78s] където момчетата получавали марихуана и алкохол, след което ги изнасилили.\n[85.32s] И като Маргарет, която била на 11 години, когато била малтретирана в сиропиталището на Армията на спасението\n[91.7s] от църковен капитан,\nкойто не само малтретирал деца\n[94.6s] но нагласявал злоупотребата им\nедин към друг.\n[97.311s] За провеждането на разследването,\nбил назначен състав от шест комисари\n[102.06s] водени от съдия Питър МакКлелан\n[104.16s] бивш главен съдия във\nВърховния съд на Нов Южен Уелс\n[108.16s] и помощник комисар на\nНезависимата комисия срещу Корупцията.\n[112.683s] През май 2015 г. Комисията започнала\n публично изслушване по \"дело 29\"\n[119.04s] което се отнася до мерките за реагиране срещу сексуално насилие на деца в организацията на Свидетелите на Йехова.\n[124.16s] Юрисконсулт за Комисията\nбил зашеметяващият Ангъс Стюарт.\n[129.291s] Във видеото \"прикриване на злоупотреби\"\n[131.683s] Разгледах как реагира организацията на Свидетелите на Йехова на обвиненията в сексуално насилие над деца срещу нейните членове и как нейната политика защитава насилниците.\n[141.88s] Например, дори ако те напълно вярват в обвиненията срещу своите членове\n[146.64s] правните и духовните водачи на конгрегацията\n — известни като \"старейшини\" —\n[151.14s] няма да предприемат действия, освен ако няма поне двама свидетели на злоупотребата\n[155.81s] което е малко вероятно с оглед на скритият характер на сексуалното насилие\n[158.9s] или когато насилникът си признава доброволно — което отново е малко вероятно.\n[164.12s] Дори когато тези изисквания са изпълнени, справедливостта далеч не е гарантирана.\n[169.0s] Докато организацията притежава съдебната власт\n[171.87s] за изхвърляне на насилниците от конгрегациите\n[174.415s] многократно не успява да я използва.\n[176.747s] Във форма на отлъчване, известна като\n —лишаване от комуникация—\n[180.14s] хората, признати за безнадеждни грешници, са подложени на пълно отчуждение от всички членове, включително роднини.\n[187.311s] Но хората, признати за виновни за злоупотреба, могат да избегнат това само чрез едно извинение.\n[193.419s] Ако те изразяват разкаяние пред старейшините на своята конгрегация, те могат просто да \"получат порицание\".\n[199.934s] Всичко, което ще последва, е съобщение пред конгрегацията, че са били порицани за неопределено престъпление.\n[207.94s] Това е всичко.\n[209.62s] Те ще бъдат оставени в конгрегацията, създавайки риск от по-нататъшни злоупотреби\n[213.77s] и постоянната ретравматизация на лицата, с които са злоупотребявали\n[217.892s] които често са принудени да напуснат конгрегацията си.\n[221.633s] Такава лоша политика служи за защита на насилниците и наказване на техните жертви.\n[227.933s] Чрез задълбоченото разследване на отделни случаи\n[231.29s] Австралийската Кралска комисия разкри сложен лабиринт от немислими допълнителни препятствия,\n[237.1s] изправени пред, случаи на сексуално малтретирани деца, отгледани в организацията на Свидетелите на Йехова.\n[242.653s] Комисията се фокусирала върху опита на двама души, които са били подложени на злоупотреба от членовете на тази организация.\n[248.54s] За анонимност те получиха кодови инициали BCB и BCG.\n[257.948s] BCB свидетелства първа. Тя свидетелства за следните събития:\n[264.116s] Тя е родена през 1967г.\n[266.88s] Когато била на 10 години, майка й станала Свидетелка на Йехова\n[270.52s] и започнала да води нея и брат си на срещи.\n[273.921s] BCB се отчуждила от баща си, който не присъствал.\n[278.291s] На 12 години се запознала с Бронвин и Бил Нийл\n[282.13s] и се сприятелила с дъщеря им.\n[284.17s] Тя посещаваше събранията в дома им и оставала през нощта.\n[287.363s] Г-н Нийл убеждавал двете момичета да не се сприятеляват с не-свидетели в училище\n[291.509s] въз основа на идеята, че \"лошата асоциация разваля полезните навици\"\n[295.54s] идея, идваща от библейския пасаж от 1 Коринтяни 15: 33\n[301.76s] Сексуалните шеги, които Г-н Нийл започнал да прави в нейно присъствие, били знак за предстоящото настъпване и разрастването на злоупотреба.\n[309.663s] На 14 години, когато останала при семейството на Нийл\n[313.05s] той започнал да вкарва езика си в устата й, докато я целувал за лека нощ.\n[316.915s] Тя търпяла тези неподходящи целувки през следващите четири години.\n[321.14s] Чувствала се засрамена и уплашена и се притеснявала да не разстрой г-жа Нийл.\n[326.12s] Но господин Нийл бил старейшина и тя се подчинила на властта му.\n[331.46s] Когато била на 17 години, той влезнал в банята докато тя била там, като по някакъв начин отворил заключената врата.\n[337.8s] Той излезнал, когато тя извикала \"Махай се\"\n[340.36s] но по-късно той я биел жестоко с колана си, защото вдигала много шум в спалнята.\n[346.16s] На 18 години тя била подложена\n на по-открито сексуално поведение.\n[350.941s] Той я наричал нимфоманка и проститутка.\n[354.362s] Веднъж г-жа Нийл го хванала да целува с език BCB и го спряла.\n[358.789s] Но нищо друго не беше казано или направено \n— и неговата упоритост се увеличи,\n[363.24s] завършвайки с случка, \nпри която той заключил BCB в банята\n[367.259s] и я е насилвал с ръце и орално.\n[370.593s] На следващия ден той влезнал в стаята й, и предложил да се насладят на пълен сексуален контакт.\n[Показвайки чатала си, той ми каза: \n\"това вътре ще бъде още по-приятно.\"]\n[376.267s] Тя го помолила да напусне, след това си събрала багажа и се върнала във фермата при родителите си.\n[381.999s] На следващата година, когато Нийл научил чрез дъщеря си, че BCB се среща с няколко момчета\n[387.11s] той се възползвал от ролята си на старейшина, за да я призове да говори за момчетата.\n[392.12s] Тя чувствала, че няма избор.\n[394.36s] Той използвал възможността да я инспектира физически и да я накърнява с думи.\n[400.18s] Две години по-късно, през 1989 г. когато се омъжва, тя признала на съпруга си и приятеля си за злоупотребата от страна на Нийл.\n[408.979s] След това приятелят й\n разкрил тази информация на някой друг.\n[412.089s] Седмица по-късно млад старейшина на име Макс Хорли се обърнал към нея, за да организира посещение.\n[418.06s] По време на посещението той разкрил, че е дошъл да говори за Нийл.\n[421.642s] BCB дала някои подробности, но била твърде засрамена, за да разкаже за инцидента в банята.\n[426.64s] Хорли поканил Нийл в къщата на BCB, за да разговаря с нея и съпруга й.\n[431.76s] Въпреки дискомфорта й да отвори собствения си дом за насилника й\n[435.72s] тя направила така, както й било казано, защото мислела, че Хорли познавал процедурите.\n[440.52s] Не помнеше да са й обяснявали целта на тази среща.\n[443.439s] И тя се чувствала прекалено депресирана, за да разкаже всички подробности в присъствието на Нийл\n[447.749s] или да го оспори, когато той внушавал, че поведението му е било замислено като шега.\n[452.319s] След това BCB се обърнала към Хорли и дала повече подробности.\n[456.568s] Това довело до втора среща, с присъствието на Дъг Джаксън\n[460.849s] \"Окръжен надзирател\" \n— някой, който контролира множество конгрегации.\n[465.815s] Неговото присъствие и целта на срещата не били обяснени\n[469.56s] това просто било представено като\n \"заседание на Комисията\".\n[472.492s] Нийл се опитал да обвини BCB, \nче е носила разкриващи се дрехи\n[476.4s] но Джаксън казал, че църквата не приема такова извинение.\n[480.06s] Отново присъствието на Нийл я потискало, както и това да бъде в стая, пълна с мъже.\n[485.832s] Тя каза, че ако жената от конгрегацията, на която вярва, също е там, тогава може да е по-лесно за нея.\n[491.76s] В края на срещата, Нийл бил помолен да се извини, което той направил.\n[496.825s] BCB не получила никакво обяснение за резултата от срещата или какво ще се случи по-нататък.\n[503.086s] Джаксън й дал статия, за сексуалното насилие над деца\n[506.529s] публикувана в едно от списанията на организацията, наречено \"Стражевата кула\".\n[510.719s] Малко след това, г-жа Нийл се обадила на BCB и й казала: \"Бил не те е изнасилил.\"\n[516.64s] BCB съобщила за това на Хорли, който казал, той ще се оправи с тази ситуация.\n[520.679s] По-късно същия ден той се обадил и казал:\n[523.1s] \"— Семейство Нийл са поискали да не разказваш \nповече на хората за Бил\n[526.54s] от уважение към семейството.\"\n[529.17s] Уплашена, дезориентирана и лишена от подкрепа, тя направила това, което й било казано.\n[534.6s] Едва години по-късно\n тя осъзна цялата перверзност\n[537.94s] на искането да уважава човека, \nкойто я е малтретирал,\n[540.88s] без никой да й предложи подкрепата\n и уважението, които заслужава.\n[545.5s] Седмици по-късно било обявено, че Нийл се е оттеглил като старейшина, без да е посочена причина.\n[551.12s] Никой не е говорил с BCB за злоупотребата над нея\n[554.009s] и от нея все още се очаквало да присъства на учебни срещи в дома на Нийл.\n[558.258s] Тя помолила да не ходи там \n— но й било казано, че трябва.\n[562.889s] Г-жа Нийл я игнорирала.\n[565.464s] Накрая през 1994 г. тя се премества от този район в друг район със конгрегация.\n[571.5s] През 2012 г. тя дала писмено изявление на двама старейшини\n[575.769s] включително едно на някой си Джо Бело, обобщаващо нейните преживявания\n[579.52s] в опит да подкрепи каузата на всеки друг човек, с когото Нийл може да е злоупотребил.\n[583.66s] Осемнадесет месеца по-късно Бело я посетил по друг въпрос\n[587.67s] и BCB му казала, че обмисля да докладва злоупотребата си на Кралската комисия.\n[592.685s] Тя каза, че по-късно Бело \nговорил с мъжа й и казал:\n[595.4s] \"Трябва да попиташ [BCB] дали тя наистина иска да залее името на Йехова с мръсотия.\"\n[600.36s] BCB била шокирана, като разбрала, че тежестта от срамните действия на Нийл\n[604.52s] се стоварва върху раменете й.\n[607.375s] Въпреки че в крайна сметка тя съобщава\n историята си на Кралската комисия,\n[611.06s] тя страда от огромно фалшиво чувство за вина, защото \"предаде\" тази организация,\n[615.949s] чувство за вина, което се проявява дори при физиологични симптоми като тежест в гърдите, сърцебиене и затруднено дишане.\n[623.75s] Тя съобщила, че злоупотребата с нея унищожила нейната увереност и самочувствие\n[628.16s] и вдъхнало в нея чувство за жертвеност и постоянна параноя, че хората я съдят.\n[633.601s] Тя стигнала до мисли за самоубийство \nи до нервен срив.\n[639.639s] Казала, че позицията на Нийл като старейшина му давала власт над нея\n[643.339s] и отбелязала, че ако й било позволено да говори с други деца извън конгрегацията\n[647.769s] те може би щяха да докладват за нейното малтретиране на съответните органи.\n[651.738s] Тя предложила редица промени\n[653.87s] за начина, по който организацията се отнасяла към сексуалното насилие над деца.\n[657.372s] Тя казала, че трябва да приемат обвиненията по-сериозно и да ги докладват на полицията\n[662.079s] да дават истинска подкрепа и защита на децата\n[665.25s] и да не изискват от жени или момичета жертви на злоупотреба от мъже\n[667.915s] да говорят пред стая, пълна с мъже, включително техния предполагаем насилник.\n[673.183s] Тя също отбелязала,\n че не й се предложило обезщетение.\n[677.055s] Комисията се опита да реши всички тези проблеми.\n[683.22s] Макс Хорли бил следващият свидетел и положил клетва.\n[688.7s] Скоро, когато свидетелства, юрисконсулт Стюарт отбеляза, че Хорли се колебае в спомените си,\n[694.769s] и попитал дали това е заради времето което е минало от тогава — което Хорли потвърдил.\n[700.1s] Съдия МакКлелан попитал Хорли дали си е правил записки.\n[703.37s] Той казал, че може да е имал бележки навремето — но те щели да бъдат унищожени.\n[707.61s] На въпроса защо, той отговори, че старейшините не искали жените им да\n[710.92s] знаят с какви неща се занимават\n[713.389s] и че това е било и за защита на засегнатото лице, и на останалата част от конгрегацията\n[718.04s] за да не се налага\n да научават за тези неща.\n[720.78s] Това не само било дълбоко арогантно обяснение, но и опасно\n[725.24s] оставяйки конгрегациите да не подозират за насилниците сред тях\n[729.18s] което е точно това,\n което изнасилвачите искат.\n[732.24s] Хорли потвърдил, че унищожаването на бележките остава действаща практика.\n[737.24s] На въпроса дали е наясно \nсъс задълженията си\n[739.569s] да съобщи на властите за сериозни обвинения \nза сексуално посегателство\n[743.319s] Хорли даде да се разбере, \nче не го разбира\n[745.17s] и казал, че ще се обърне към неговия \"управленски център\" за съвет как трябва да се действа.\n[749.4s] Безсмислените препратки към \"управленския център\" се превърнаха в стандартен отговор\n[753.72s] от старейшините, призовани да свидетелстват пред Комисията.\n[757.48s] Хорли изразил недоумение за това, което се смята за престъпно посегателство,\n[761.64s] а по-късно признал, че изобщо не е обмислял възможността да съобщи за това на полицията.\n[766.5s] Това беше човекът, натоварен със задачата да осигурява сигурност и защита\n[770.079s] на безусловно доверяващата \nму се конгрегация.\n[773.17s] Овчар, натоварен със задачата\n да пази стадото.\n[776.42s] Но в метафората с овчаря, Хорли беше по-скоро овчарско куче,\n[780.25s] безмилостно подчиняващо се на командите на невидимия овчар,\n[783.56s] който също толкова лесно би му заповядал да нарани овцете, колкото и да ги защити.\n[788.22s] Библейският пасаж Матей 18: 15 е посочен от организацията като причина\n[794.23s] да изискват от малтретирани лица да се изправят срещу насилниците си с техните твърдения.\n[799.229s] МакКлелан попитал Хорли дали осъзнава колко неприемлив е този процес на конфронтация?\n[805.02s] Хорли казал, че сега разбира ситуацията, но тогава не е разсъждавал върху нея\n[809.24s] защото той просто следвал установената процедурата.\n[812.04s] Той се съгласил, че може да бъде много трудно за хората, претърпели насилие\n[815.84s] да разкажат всичко, което е направено с тях, в присъствието на насилника им.\n[819.179s] Той казал, че организацията би искала да запази злоупотребите на Нийл възможно най-тихи\n[823.84s] не за да се опитат да ги прикрият, а просто да се спре разговора за тях.\n[828.26s] Но почти веднага той взе да си противоречи\n[831.36s] казвайки, че те щели да се опитат да запазят случая в тайна\n[835.069s] с други думи да го прикрият.\n[837.7s] Стюарт казал на Хорли, че насочвайки BCB\n[841.01s] да не говори с никого от конгрегацията\n[843.839s] той я оставил сам самичка и без подкрепа.\n[846.66s] Хорли загатнал, че тъй като BCB все още работила в общността на Йехова\n[850.5s] можела да говори с хора извън организацията.\n[853.764s] Но Стюарт посочил, че членовете се съветват да нямат\n[856.834s] близки приятелства \nили асоциации с нечленуващи.\n[860.629s] Хорли потвърдил, че това е вярно\n[862.82s] но казал, че дали членовете приемат този съвет или не, изцяло зависело от тях самите.\n[867.64s] Много от нас, които са живели в насилствена среда\n[870.43s] са запознати с тази маневра \nза избягване на отговорност\n[873.939s] в която на хората се дават ясни инструкции какво да правят или какво да не правят\n[879.23s] тогава когато те страдат като пряка последица от следването на тези инструкции\n[883.62s] им казват, че изобщо не са били \nзадължени да ги следват.\n[886.56s] И са обвинени \nза собствените си страдания.\n[889.43s] Факт е, че Свидетелите на Йехова са предупреждавани по най-строгия начин\n[893.529s] срещу това, което се нарича \"лоши асоциации\" с нечленуващи\n[897.209s] като им казват че ще бъде пагубно за тях \nако имат такива.\n[900.84s] Хорли предлагайки на BCB че е трябвало да гледа над това\n[904.47s] само като съвет, който тя била свободна да приеме или игнорира\n[907.8s] е лицемерие от крайна степен.\n[910.8s] Стюарт казал на Хорли, \nче казва две противоположни неща.\n[914.015s] Първо казва, че BCB не може да говори с хората, а след това, че може.\n[919.49s] Хорли после твърдял, че не искал да откъсне BCB \nот никаква подкрепа\n[923.29s] но признал, че не можел да си спомни да е уредил някой да й помага през онзи период.\n[927.857s] Стюарт изготвил писмо от Хорли\n[929.68s] и областния надзорник Дъг Джаксън \nдо техния офис.\n[933.922s] В писмото се казва: \"Изглежда, че някои братя знаят за случая\n[937.899s] и за съжаление, може да има \n\"светски\" хора, които също знаят.\"\n[942.31s] „Светски“ е позорният, унижаващ термин, който Свидетелите на Йехова използват за нечленуващи.\n[947.45s] Стюарт попитал защо има значение, ако светските хора знаят?\n[950.889s] Хорли казал, че организацията не иска нищо, което да накърни тяхната \"чиста\" репутация.\n[956.32s] Всъщност организацията инвестира силно в репутацията си сред хората извън нея.\n[961.94s] Изглежда странно, че са толкова загрижени за това, какво мислят светските хора\n[966.048s] считайки, че презира светските хора наричайки ги покварени и развратни\n[969.76s] обвинявайки ни в унищожаване на семейства, извънбрачно раждане и полово предавани болести\n[976.58s] и безброй други емоционални, и физически неволи\n[979.46s] и ни сравняват с това, което наричат \"смъртоносен\" замърсен въздух.\n[983.68s] Но разбира се,\n проектиране на \"чист\" образ\n[986.319s] е това, на което организацията разчита, за да привлече нови членове.\n[989.556s] И тя няма абсолютно никакво разкаяние, когато използва измама\n[993.769s] за да поддържа този\n очевидно фалшив образ.\n[996.82s] Тя дори има формална политика, така наречената \"стратегия за теократична война\"\n[1000.46s] която дава на членовете открито разрешение за измама на светските хора\n[1004.22s] на основание, \nче те нямат право на истината.\n[1007.24s] Изследвах перверзността на тази политика във видеото си за \"прикриване на злоупотреба\" (concealing abuse).\n[1012.22s] Но този видеоклип не споменава специално изключение за тази политика, което е от особено значение за Кралската комисия.\n[1019.951s] На Свидетел��те се казва, че когато се закълнат да кажат истината или свидетелстват, те са длъжни да кажат истината, ако изобщо говорят.\n[1030.27s] При тези обстоятелства, единствената им възможност да не казват истината е да мълчат.\n[1036.14s] Очевидно дори това правило е нарушено от Свидетелите на Йехова по време на изслушването на Комисията.\n[1042.18s] Също така стана все по-ясно колко далеч в списъка на приоритетите им е благосъстоянието на децата, които трябваше да защитят.\n[1051.116s] Писмото на Хорли и Джаксън за Бил Нийл до местния офис на мениджърския център гласи:\n[1055.23s] \"Препоръчахме му да се оттегли като старейшина\" и \"Той се съгласил\".\n[1060.294s] Стюарт казал на Хорли, че изглежда са предложили на Нийл\n[1063.371s] шанс да се оттегли доброволно, вместо да бъдете насилствено отстранен.\n[1068.15s] Хорли отрекъл това, твърдейки, че това са просто лошо подбрани думи.\n[1072.9s] Но тези лошо подбрани думи били в съответствие с предишните показания на BCB\n[1077.88s] че Нийл просто бил слязъл от поста.\n[1080.63s] В същото писмо Хорли и Джаксън добавили\n[1083.07s] че смятат, че няма нужда да се прилагат по-нататъшни действия или забрани.\n[1087.084s] Това означава, че на Нийл му е позволено да участва във същите църковни и библейски учебни срещи, както преди,\n[1092.62s] включително срещи в дома му, на които се очаквало да присъства BCB.\n[1098.08s] По-нататък писмото съдържало причудливата преждевременна препоръка\n[1102.28s] че когато този проблем утихне, Нийл трябва отново да бъде препоръчан\n[1105.27s] като старейшина отново, за да може да помага на конгрегацията, както бил правил в миналото.\n[1110.14s] Стюарт попитал Хорли дали от израза \"утихнат\"\n[1113.627s] имал предвид, когато конфликтът бъде разрешен.\n[1116.62s] Хорли твърдял, че терминът \"утихнат\" е друг случай на лошо подбрани думи.\n[1121.84s] Когато Стюарт след това предположи, че основната загриженост на Хорли е за репутацията на Нийл, той първо отхвърли идеята.\n[1128.245s] Но Стюарт продължил по тази линия на разследване\n[1130.49s] предполагайки, че загрижеността на Хорли е свързана с функционирането на неговата организация\n[1134.41s] а не за защитата на децата в конгрегацията.\n[1138.04s] Хорли се съгласил.\n[1139.78s] Когато Стюарт му обяснил, че опасенията му не са за подкрепата, която би могъл да предложи на BCB.\n[1144.66s] Хорли призна, че макар и да имаше \"някакво значение\" за него, той беше по-загрижен за образователната квалификация на Нийл.\n[1151.921s] Това беше зашеметяващо признание.\n[1155.228s] Към края на показанията му, на Хорли бе предоставен подробен доклад за злоупотребите над BCB.\n[1161.479s] Той не знаел за нищо от това\n и казал, че това е шок за него.\n[1165.16s] Той беше попитан дали вярва, че фактът, че всичко това се разкрива едва сега,\n[1168.57s] имал нещо общо с процеса, в който се включил, когато BCB направила първоначалното оплакване\n[1173.76s] процес, в който тя трябвало да отправя своите обвинения към своя насилник\n[1177.12s] и един старейшина, когото знаела, че е приятел с нейния насилник.\n[1180.97s] Той казал, че разбира\n какво имат предвид.\n[1183.458s] Когато било предложено, че BCB се нуждае от по-грижовна и подкрепяща среда\n[1187.56s] за да направи пълно разкритие, той се съгласил.\n[1190.26s] Но когато го попитаха дали има някакви идеи за това, което организацията трябва да направи с това,\n[1194.415s] той отново влезе в послушен режим, заявявайки, че не може да коментира това и просто следваше процедурите.\n[1205.02s] Това, което станало ясно за множеството старейшини, призовани да свидетелстват пред Комисията\n[1208.76s] било, че те били толкова потопени в \"следване процедурата\"\n[1211.33s] че не успели да вземат по внимание, преживяванията на обвинителя.\n[1214.405s] Отговорите на Дъг Джаксън ясно илюстрират тази липса на съпричастност.\n[1218.83s] Когато било казано на Джаксън, \nче BCB не знаела\n[1221.456s] каква е целта на срещите, \nна които присъства\n[1223.485s] първоначално\n той отхвърлил идеята.\n[1225.891s] Но Стюарт отдели време да му напомни, че като старейшина той имаше знания, които не бяха дадени на конгрегацията,\n[1232.414s] познаване на правните процедури, стандартите за доказателства и наказателните мерки.\n[1237.86s] След това Стюарт попита Джаксън дали потвърждава, че BCB не е знаела за тези неща?\n[1242.58s] Джаксън променил \"не\" на \"може би\".\n[1245.551s] Стюарт попитал дали Джаксън може да види как тази липса на прозрачност\n[1249.3s] би оставила BCB в положение\n на уязвимост и объркване.\n[1253.527s] Джаксън казал,\n че сега вече разбира.\n[1255.957s] Стюарт повторил на Джаксън частта от изявлението на BCB\n[1259.667s] в която тя е била попитана\n в едно от правните заседания\n[1262.52s] дали има какво повече да каже\n[1264.5s] и тя лъжливо отговорила\n \"Не\" поради различни забраняващи фактори.\n[1269.54s] Тези фактори включваха \nразговори пред стая, пълна с мъже\n[1272.426s] да говори пред насилника си и страх от последствията от съобщаването на истината.\n[1278.173s] Джаксън се съгласи, че говоренето пред стая, пълна с мъже, трябва да е било много трудно за BCB, както и да говори пред насилника си.\n[1287.34s] Но когато му било казано, че BCB не би се чувствала, че се намира в безопасна среда\n[1291.16s] той казал, че не знае защо\n тя би се почувствала така\n[1293.629s] защото те са се опитали\n да я утешават.\n[1295.848s] Той изглеждал неспособен да разбере, че предполагаемите му усилия да утеши BCB\n[1299.96s] не били достатъчни, за да преодолеят магически всички застрашаващи фактори, които тя описва.\n[1304.773s] Вместо да признае, че не е успял да я утеши\n[1307.614s] инстинктът му беше вместо това \nда загатне, че провалът си е неин\n[1311.96s] защото не успява\n да се утеши с неговите утешения.\n[1315.16s] Подобен начин на мислене е често срещан в авторитарни групи, които отричат индивидуалността.\n[1320.923s] Членовете са разпределени във фиксирани процедури и се очаква да дадат фиксирани реакции.\n[1326.74s] Ако не могат, вината е в тях\n — не в процедурата.\n[1330.78s] МакКлелан казал на Джаксън, че процесът на разследване на организацията\n[1335.0s] е причинил нова травма на BCB.\n[1338.323s] Джаксън отговорил, че сега го разбира\n — но не го осъзнавал в онзи момент.\n[1342.87s] Много е полезно да се мисли за рефлекторното пренебрежение на старейшините, които свидетелстват за Комисията,\n[1348.735s] проявено във всички случаи, когато е отбелязано, че лицата, подложени на злоупотреба, се чувстват несигурни или лишени от подкрепа.\n[1355.204s] Съдия МакКлелан и юрисконсулт Стюарт бяха висококвалифицирани комуникатори.\n[1361.06s] Те също притежаваха силата на правната система.\n[1363.943s] Но дори и те са били принудени многократно да прекарват досадни периоди от време, прекарвайки старейшините по техните собствени процедури,\n[1371.69s] опитвайки се да ги накарат да са съпричастни с преживяванията на тези малтретирани хора.\n[1376.32s] Ако с тяхната значителна сила и умения,\n[1379.09s] те трябваше да работят толкова усилено, за да преодолеят пренебрежението на старейшините,\n[1382.94s] какъв шанс имал неквалифициран\n безсилен член\n[1385.675s] да бъде чут от старейшините\n на Свидетелите на Йехова?\n[1393.04s] Друг старейшина, загрижен за репутацията, бил Джо Бело\n[1396.586s] един от старейшините на които \nBCB писала години след злоупотребата\n[1399.99s] в опит да защити други деца\n от Бил Нийл.\n[1402.984s] На въпроса дали някога е възнамерявал да съобщи за проблема на полицията\n[1406.39s] Бело се е отклонил от стандартната мантра \nза старейшините:\n[1410.65s] той щеше да се свърже\n с мениджърския център.\n[1412.8s] Бело потвърди показанията на BCB за случая, в който съпругът й спомена, че обмислят да отидат в Кралската комисия,\n[1418.538s] и когато Бело попита какво ще се постигне с това действие, освен да се омърси името на Йехова с помия.\n[1423.647s] На Бело било обяснено как това може да се приеме като разубеждение, да не ходи мъжа на BCB в Комисията.\n[1428.9s] Бело казал, че не е имал това предвид\n— а че просто е мислил на глас.\n[1432.898s] Въпреки че първоначално изглеждаше, че Бело съжалява за думите си\n[1436.18s] и се изказал, \nче не трябвало да ги казва\n[1438.25s] по-късно потвърдил, че това наистина е разубеждение.\n[1441.675s] Стюарт го попитал дали във неговата вяра Йехова се смята за любящ бог.\n[1447.149s] Когато Бело потвърдил това, Стюарт попитал дали Йехова също нямало да е\n[1451.157s] по-загрижен за жертвата, отколкото за собственото си име.\n[1455.18s] Бело отговорил:\n \"Йехова щеше да бъде загрижен за жертвата\n[1460.36s] но Йехова също е загрижен\n за собственото си име.\"\n[1463.9s] Съдия МакКлелан попитал Бело дали следи работата на Кралската комисия.\n[1468.13s] Бело отговорил че не е запознат, въпреки че знаел няколко месеца преди това\n[1471.324s] че ще трябва да даде показания пред нея.\n[1473.381s] Той каза, че изглежда е гледал заглавията на \"съботния вестник\", но не е гледал новините и не е слушал радиото.\n[1479.48s] Абсолютната му липса на интерес към работата на Комисията беше пределно ясна,\n[1484.14s] и напълно съответстваше с безразличието, демонстрирано от повечето свидетели, които свидетелстваха от тази организация.\n[1494.46s] Д-р Моника Апълуаит била избрана от организацията\n[1497.897s] да бъде експертен свидетел в тяхна защита.\n[1500.412s] Апълуаит се представила като независим консултант в областта на сексуалното насилие над деца\n[1505.45s] поканена в организацията за да направи оценка на риска\n[1508.37s] и разработване на програми за обучение и стратегии.\n[1511.573s] Това включваше оценка на начина, по който предотвратяваха злоупотребите;\n[1514.735s] как реагираха на предупредителните знаци;\n[1516.849s] как реагираха на разкрития за злоупотреби;\n[1519.567s] и как коригираха ситуацията.\n[1521.893s] Апълуаит била необичаен избор за отстояване на позицията на Свидетелите на Йехова\n[1525.767s] защото тя е била активен член на Католическата църква\n[1528.62s] което тази организация е многократно отхвърляла като фалшива религия\n[1532.56s] характеризира като враг на истинското богослужение\n[1535.4s] критикувана за намеса в политиката и порицана за методите й за справяне със сексуалния проблем на децата.\n[1541.38s] Оставяйки настрана странността на този съюз\n[1544.2s] показанията на Апълуаит били пълна бъркотия.\n[1546.834s] Стюарт и МакКлелан отбелязват, че множеството мнения, предоставени в нейния доклад, нямат позоваване на източници.\n[1552.4s] Апълуаит заявила, че вече е била твърде заета\n[1554.78s] когато тя започнала \nработа по доклада\n[1556.566s] така че може да не е напълно добросъвестна със своите цитати.\n[1559.9s] Всъщност резултатът от доклада и показанията на Апълуайт е, че нейното така наречено експертно свидетелство\n[1566.07s] представлявало гледане онлайн на материали от собствения сайт на тази организация\n[1570.36s] и разговори с персонала на нейния правен отдел.\n[1573.543s] Тя каза, че не е разгледала конкретни случаи\n[1576.185s] и не може да даде мнение дали прилагането на политиката на тази организация\n[1581.24s] води до законни мерки за реакция, до подходящи практики за защита на децата и до добросъвестна грижа.\n[1587.98s] Както отбелязва Стюарт, всичко, което всъщност е направила, е документален преглед.\n[1592.9s] Апълуаит показала, ясна липса на разбиране за неравноправните отношения между старейшините и членовете на конгрегацията\n[1598.579s] погрешно заявявайки, че старейшините са били третирани от конгрегацията като просто \"колеги\".\n[1604.022s] Както посочил Стюарт, старейшините били много ясно характеризирани\n[1607.44s] от организацията \nкато овчари над стадото.\n[1610.48s] Техните привилегии и престиж са съчетани с вярата\n[1613.56s] че старейшините са били пряко \nназначени от Светия Дух\n[1616.84s] друг факт, за който тя не знаела.\n[1619.5s] Апълуаит заявила, \nче няма изискване\n[1621.58s] за старейшини или \"помощниците\" да бъдат сами с деца.\n[1625.5s] Но Стюарт предостави документ от мениджърския център на старейшините, който гласи:\n[1630.417s] че старейшините и помощниците са поставени в положение на доверие, което пряко включва по-свободното оставяне на децата под техен надзор.\n[1639.34s] Апълуаит също не била наясно с факта, че децата\n[1642.434s] били предупреждавани да не разкриват факти за конгрегацията в груповата терапия.\n[1646.68s] Единственото условие, което била чула по отношение на терапията\n[1649.78s] било, че организацията препоръча \nда се избере някой\n[1652.44s] които уважавал техните религиозни вярвания.\n[1654.892s] Тъй като изясниха фактите за реалните преживявания на малтретирани хора\n[1658.98s] Апълуайт започна да се отказва от недобре обмислената си подкрепа за тази организация.\n[1664.1s] Тя обявила,\n че ако се окаже, че хората\n[1666.28s] трябвало да се изправят срещу насилниците си и трябвало да седят в стаята без никаква подкрепа\n[1670.694s] това не би отговаряло\n на стандартите за грижи.\n[1673.654s] Тя признала, че не е разбрала, че това е същината на процесът.\n[1677.54s] Апълуаит заявила, че когато някой злоупотребява\n[1680.26s] и вътрешните им механизми за контрол са им позволили да преминат веднъж тази линия\n[1684.88s] тогава тя не може да бъде сигурна в надеждността на тези вътрешни механизми за контрол в бъдеще.\n[1689.72s] Тогава тя предположила, че рискът от повторно нарушение е голям\n[1693.82s] и се съгласила, че трябва да се предприемат конструктивни стъпки\n[1696.92s] за да се гарантира, че такъв човек няма да има достъп и възможност за повторно извършване на злоупотреба.\n[1702.226s] Тя каза, че трябва да има силна връзка за сътрудничество с органите за закрила на детето,\n[1707.39s] но нямала осъзнаването \nза трудната връзка която\n[1709.88s] организацията на Свидетелите на Йехова имала със светските власти.\n[1714.04s] Комисията не счела, че докладът на Апълуаит е подпомогнал разследването им\n[1718.63s] и отхвърлила мненията й\nпо няколко причини\n[1721.34s] включително липса на\n доказателства и източници\n[1724.41s] но най-удивителното е, че тя не е изследвала примери за нито един човек, оцелял от детския сексуален тормоз,\n[1731.66s] с чиито оплаквания се е занимавала Организацията на Свидетелите на Йехова.\n[1735.849s] До края на този първи случай\n[1737.95s] Кралската комисия вече била събрала потвърждения за невъобразимо пренебрежение\n[1742.29s] дълбоко неподходящи и травматизиращи процедури\n[1745.35s] и манталитет за прикриване, който възхвалява репутацията далеч над защитата на децата\n[1750.75s] и довежда до използването на тактики на срам срещу малтретирани лица, за да се опитат и да ги заглушат.\n[1756.405s] С това нечовешко начало нещата само ще се влошат.\n[1760.46s] Както ще ви покажа, във втората част, нови шокиращи нива на измама и разлагане в рамките на тази организация\n[1767.428s] включително доказателства, че някои старейшини са нарушавали собствените си правила\n[1771.802s] за да се избегне излизането на злоупотреби на бял свят.\n[1782.436s] Огромна благодарност към всеки, който подкрепи канала тази година."}'
