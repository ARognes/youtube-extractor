transcript: In this video, we're going to build a transistor powered heating plate for soldering. An Arduino will continuously monitor the transistors temperature by measuring its base- emitter junction voltage, and automatically adjust the heating power to keep the temperature stable. Let's push the transistor to 250°C and see how it performs. I'd also like to give credit to the YouTube channel xubor007. I used the schematic and the Arduino code developed by the channel. Many thanks to the author for designing the circuit and writing the software that made this project possible. If you liked the video, don't forget to like and subscribe to the channel. It really helps the project. Alright, the assembly is finally complete. Now it's time to see if it actually works. I'm powering it on for the first time. The Arduino is already monitoring the transistor’s temperature and adjusting the power in real time. To start, i'll set the transistors target temperature to 190°C. In the small video in the bottom left corner, we'll be monitoring the device's current consumption throughout the test. As you can see, the temperature is rising quickly. The controller keeps increasing the output until it reaches the target temperature. From this point on, the Arduino will automatically regulate the heating power to keep the temperature as stable as possible. For the first test I'll use an LED backlight strip from a monitor. I'll de solder the LEDs first, then solder the very same ones back in place. Let's see how easy this is, and more importantly, whether the LEDs can survive the soldering process without overheating. Everything looks good. I've applied power to the LED strip, and all the LEDs are still lighting up perfectly. Next, I'm going to desolder a Micro-USB connector from a small circuit board and then solder it back into place. I'll increase the temperature to 200°C. Here's what the back of the board looks like. A little solder has stuck to the surface, but it'll clean off without any problem. Now I'll solder the same connector back onto the board. The connector is now soldered back in place. It turned out pretty well. Next up is the circuit board. Let's see if we can disorder the IC. The board needs a little time to heat up properly. As you can see, the IC is removed from the board with ease. Now let's lower the transistors target temperature to 150°C. Now let's check the transistors temperature with a thermal camera and compare it to the reading on the display. They match pretty well. The display now reads 140°C and the solder is no longer melting. For the final experiment, I'll set the transistor to its maximum temperature of 250°C and see if it can handle it. Throughout the entire test, the power supply current never exceeded four amps at five volts, meaning the heating element was operating at no more than 20W of power. After nearly half an hour of soldering at different temperatures, followed by about 15 minutes at the maximum temperature of 250°C, the transistor was still working perfectly. I'd say this test was a success. It also turned into a really interesting experiment, showing that a power transistor can be used in a very unconventional way as a temperature controlled heating element.
