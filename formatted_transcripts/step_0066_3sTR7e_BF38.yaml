transcript: Tell me about a time you had a conflict with a teammate or manager. The reason people ask this question is they're going to go and hire a bunch of smart people and they're going to put all of these smart people in the room. Of course, there's going to be conflict there. We used to have like a weekly principal and senior principal meeting in my organization at Amazon. We didn't agree on anything. >> [laughter] >> Right? That's just the natural state of things. Is there's going to be a lot of disagreement. The question is like, can we make progress despite the fact that there are disagreements? I think what you want to do in in a lot of these situations is to talk [music] about how the other person could have been right as well. Whenever we talk about conflict, we have to talk about like we just had a difference of opinion. Stories where you're obviously right and they're obviously wrong, they don't tend to be good stories.
