transcript: As I was asking people a lot of questions, I was doing this on Dear Layla, talking to people about balance and priorities and stuff and I just realized like most people never decide. They just kind of like drift in some kind of direction that I don't know, they think they're supposed to go in or it's the easiest to go in, whatever it might be. And I think what then tends to happen is the work that you have in your life expands [music] to fill the time that you have. I think even worse is like I I talked about this in my last podcast, guilt starts to kind decide what you do. Like whatever you feel most bad about, it's like I feel really bad that I'm a bad friend, I'm a bad wife, I'm a bad mom. And you start using the feel bads as how you set an agenda for your life and what you do and the priorities that you have rather [music] than sitting down and actually saying out of everything that matters to me this matters the most right now in this moment.
