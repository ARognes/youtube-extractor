transcript: '{"content":"\n[7.055s] Разкриване на злоупотреба.\n[16.06s] Част Втора.\nЗа BCG\n[20.925s] Това е втората част от поредицата\n[22.83s] проучваща констатациите на Австралийската Кралска Комисия\n[26.01s] за проучване на реакцията на социалните институции на сексуалния тормоз над децата.\n[30.26s] В първа част разгледах първия от двата случая на злоупотреба\n[33.56s] разследвани в рамките на организацията на Свидетелите на Йехова\n[36.77s] случаят на жена с кодови инициали BCB\n[39.52s] която е била подложена на злоупотреба от старейшина — духовен водач на нейното събрание.\n[45.547s] Председател на Комисията бил съдия Питър МакКлеллан.\n[49.04s] Юрисконсулт на Комисията бил Ангъс Стюарт.\n[53.691s] Както показа този случай, различните политики на Свидетелите на Йехова\n[57.369s] се комбинират много ефективно, за да защитят насилниците на децата и да заглушат жертвите им.\n[63.34s] Тази организация изисква да има двама или повече свидетели на насилие, или насилникът да признае\n[70.5s] — и двата варианта са изключително малко вероятни.\n[73.28s] Тези, които бъдат признати за виновни, могат да бъдат \"лишени от комуникация\"\n[76.2s] — форма на отлъчване от църквата, при която хората са отчуждени от цялата тази организация.\n[81.96s] Но това също е много малко вероятно, защото на насилниците се казва че\n[85.56s] ако изразят покаяние\n[87.44s] те просто ще бъдат порицавани:\n[89.48s] конгрегацията се уведомява, че са били порицани\n[92.789s] за неуточнено прегрешение.\n[95.7s] Това, което е много вероятно, е че малтретираните деца които\n[99.14s] не получават справедливост и остават в постоянна уязвимост пред насилника си\n[103.35s] ще бъдат мотивирани да напуснат тази организация.\n[106.192s] За съжаление, в резултат на това самите те могат да бъдат отчуждени.\n[110.02s] Не са предвидени мерки за тези, които просто искат\n[112.82s] вече да не са \"Свидетел на Йехова\"\n[114.69s] но желаят да поддържат лични отношения с други членове.\n[118.16s] Не им се дава такъв избор.\n[120.18s] Те трябва да останат под контрола на организацията\n[123.11s] или да извършат \"изключване\" и да бъдат подложени на пълно отчуждение.\n[127.14s] Дори и да решат да останат\n[128.97s] малтретирани лица, които развиват проблеми с алкохола, наркотиците или други подобни\n[133.31s] могат да се окажат \"лишени от комуникация\" \nпо тази причина.\n[136.78s] Всички обстоятелства са срещу малтретираните деца.\n[140.96s] Но второто разследване на Комисията за организацията Йехова — случаят с BCG\n[145.979s] ще разкрие доказателства за неочаквани нови дълбочини на корупция.\n[154.08s] Давайки свидетелски показания, BCG разказа за следните събития.\n[158.922s] Тя е родена в Бризбейн през 1971 г., втората по възраст от седем деца, с една по-голяма сестра и две по-малки сестри.\n[167.6s] Баща й се присъединил към организацията, когато била много малка\n[170.85s] последван от майка й, и станал \"помощник\"\n[174.64s] подпомагайки старейшините на тяхната конгрегация.\n[177.531s] Той упражнявал диктаторски контрол\n[180.02s] забранил на семейството си да чете литература, която не е одобрена от Свидетелите на Йехова\n[183.36s] или асоциирането с не членуващи.\n[186.22s] BCG е кръстена на 16.\n[188.88s] Била сигурна, че конгрегацията знае за агресивността на баща й.\n[192.67s] Често я биел с кожен колан\n[195.46s] и понякога посещавала събранията, с все още кървящи рани.\n[199.1s] Имала неясни чувства, че той я е насилвал сексуално около петгодишна възраст\n[203.09s] и ясен спомен за неподходящо целуване\n[205.86s] и сексуални комплименти от него в ранните й тийнейджърски години.\n[209.92s] На 17 години злоупотребата ескалирала, когато майка й братята и сестрите й\n[214.038s] напуснали за една седмица Бризбейн.\n[216.8s] Оставена сама, тя многократно е била нападната от баща си.\n[220.901s] Въпреки че баща й заплашвал, че ще я бие и ще я изрита от къщата\n[224.06s] ако тя говори с някого, без той да присъства\n[227.25s] тя все пак се обърнала към съпругата на старейшината, Кевин Боудич\n[232.15s] но й било казано, че не може да говори с нея без присъствието на баща си.\n[235.81s] На два пъти тя се обръщала към друг старейшина Дино Илай\n[239.586s] който бил добър приятел на баща й.\n[242.108s] Въпреки очевидното й страдание, отново й казали, че баща й трябва да присъства.\n[248.08s] В крайна сметка BCG разказала всичко на мъжа, който по-късно стана неин съпруг.\n[252.04s] Той убедил Илай да се срещне с него и с BCG.\n[255.56s] Тя каза, че Илай изглеждал ядосан на нея и той я предупредил, че прави много сериозно обвинение.\n[261.44s] Тя казала, че знае за това.\n[263.36s] Били уговорени редица срещи между BCG, Илай, Боудич\n[268.37s] и друг старейшина Рон де-Рой.\n[271.54s] Не са й казали \nза целта на тези срещи.\n[274.0s] Отново тя била приета с гняв и й били зададени изключително неприемливи въпроси, като например \"хареса ли ти това?\".\n[281.1s] Тъй като всички старейшини били мъже, както и приятели на баща й\n[285.02s] за нея било трудно да им даде подробности и тя отговаряла само на директни въпроси.\n[290.1s] Инструктирали я да каже на майка си за злоупотребата.\n[293.36s] Когато й е казала, майка й е казала, че баща й е извършил тормоз над по-голямата й сестра.\n[298.32s] BCG попитала как е могла да я остави насаме с него.\n[301.76s] Майка й казала, че не мислила, че ще го направи отново\n[304.42s] защото той бил Свидетел на Йехова.\n[306.92s] След това BCG и майка й говорили\n[309.02s] на двете най-малки дъщери, които били на пет и седем години.\n[312.98s] И двете разказали за изнасилвания от баща им.\n[316.64s] BCG и майка й разказали на старейшините.\n[318.85s] Но Рон де-Рой им казал:\n[320.44s] \"— Не искаме да говорим с сестрите ти\n[322.2s] защото са твърде млади, за да знаят за какво говорят “.\n[325.491s] Старейшините казали, че BCG трябва да повдигне обвинения на баща си.\n[329.66s] Уплашена, тя го направила заради по-малките си сестри.\n[333.972s] По време на срещата, баща й заплашил да я набие, да я пребие и да я убие.\n[339.24s] Старейшините се намесили едва когато той станал и се хукнал към нея.\n[343.32s] В крайна сметка той бил \"лишен от комуникация\"\n[345.44s] Но де-Рой й казал, че не е заради злоупотребата с нея\n[347.98s] а за някакво друго престъпление.\n[350.263s] На въпроса защо, той отговорил, че имат нужда от двама или повече свидетели.\n[354.472s] Когато споменала сестрите си, той отговорил, че това трябва да е едно и също събитие.\n[358.94s] Нейният баща обжалвал \"лишаването от комуникация\"\n[361.28s] и BCG била призована да се яви пред \"съдебен състав\"\n[364.292s] от трима старейшини, от други конгрегации.\n[367.644s] Тя трябвало да преразказва преживяванията си от самото начало.\n[370.5s] Но в крайна сметка баща й признал, че е \"излязъл извън границите на позволеното\".\n[375.4s] Жалбата му била отхвърлена. В крайна сметка той се преместил на друго място.\n[381.54s] BCG заяви, че много членове на конгрегацията я обвинявали в лъжа.\n[385.36s] Въпреки че се оженила по-късно същата година, тя се чувствала безполезна и самотна и направила опит за самоубийство чрез свръхдоза\n[393.219s] за този опит тя по-късно е наказана от де-Рой\n[396.54s] защото се смята за сериозно престъпление срещу Йехова.\n[400.925s] Няколко години по-късно де-Рой я информирал че баща й е възстановен, защото \"прави добри дела\".\n[409.0s] На въпроса какви са тези добри дела\n[411.18s] той казал, че баща й е посещавал събрания.\n[414.16s] Тя му напомнила, че баща й присъствал на срещи\n[416.66s] и когато той изнасилил нея и нейните сестри.\n[419.66s] BCG каза на де-Рой, че конгрегацията не е безопасна\n[422.939s] и тя щяла да занесе\n случая в полицията.\n[425.665s] В отговор тя каза, че той цитирал библейски пасаж\n[428.8s] който забранява да се водят братя в съда. Коринтяни 6: 1-8\n[431.36s] И той я предупредил, че тя може да бъде \"лишена от комуникация\"\n[433.8s] за това, че опетнява Йехова.\n[436.95s] Тя е писала на високопоставени служители в тази организация, но не са последвали никакви действия.\n[442.184s] Вместо това те изпратили писмо, в което я съветвали да запази сълзите си в \"кожено шишенце\".\n[448.259s] Това била препратка към Псалм 56, стих 8\n[451.24s] който изобразявал библейския бог, събиращ сълзи в кожено шишенце\n[454.92s] и ги записвал в книга.\n[457.54s] След като родила третият й син, тя се разделила със съпруга си\n[461.139s] и напуснала организацията, разочарована от нейното лицемерие\n[465.43s] и вече не вярвала, че нейното ръководство е назначено по божествен начин.\n[470.129s] След като напуснала организацията, тя докладвала за злоупотребата в полицията.\n[473.798s] За разлика от Организацията на Свидетелите на Йехова, светските съдилища имат правила, които я защитават от неподходящо разпитване.\n[481.46s] Баща й бил осъден и получил 3-годишна присъда.\n[485.804s] Говорейки за полицията и служителите на Кралската комисия\n[489.319s] тя казала, че получила повече подкрепа, признание и приемане\n[493.05s] от пълни непознати, отколкото някога е имала от конгрегацията си.\n[497.18s] И тя се надявала че организацията на Свидетелите на Йехова\n[500.874s] ще бъде подведена под наказателна и финансова отговорност\n[503.82s] за неспособността на организацията да защити децата.\n[510.52s] Дино Илай, старейшина от 20 години, бил първият\n[514.815s] да бъде разпитан по случая BCG .\n[517.78s] Попитали го защо първоначално е отхвърлил молбата й да говори с него.\n[521.87s] Илай започнал дълга защита\n[524.44s] която била противоречива до степен на пълна несвързаност.\n[528.0s] Той твърдял че няма абсолютно никакъв спомен от разговора;\n[531.764s] след това заявил, че никога не би й казал да говори първо с баща си;\n[535.34s] след това каза, че нямал достатъчно информация\n[537.52s] да коментира дали той би казал това;\n[539.76s] след това той казал, че не отрича това, което е казала.\n[543.588s] И накрая, опитвайки се да се измъкне, той казал:\n[547.08s] \"Не казвам, че отричам, че това е нещо, което може да предположи, че съм казал или че е казала.\"\n[553.5s] Вместо да се откаже след тези продължителни отклонения\n[557.02s] съдия МакКлеллан продължил да търси ясен отговор.\n[560.56s] Той посочил, че организацията изисква от членовете си първо да отидат при някого, с когото са имали несъгласие.\n[567.5s] След това той съобщил, че показанията на BCG, че Илай й е казал първо да говори с баща си, са в съответствие с това учение.\n[576.297s] И накрая, след нови отклонения, Илай признал тази последователност.\n[581.86s] Отнело дългите единадесет и половина минути\n[585.22s] за да преодолее изкривяванията и странностите на Илай\n[588.3s] и да получи това просто признание.\n[590.62s] И това беше във връзка с инцидент, за който той дори предполагаемо не си спомнял.\n[594.36s] Илай твърдял, че той и другите старейшини вярвали на твърденията на BCG\n[599.265s] но казали, че не могат да действат на основата на тази вяра\n[601.149s] без потвърждението от друг човек.\n[604.109s] В съответствие с политиката на организацията, той казал, че се нуждаят или от двама свидетели на злоупотребата\n[609.02s] или от признанието на извършителя.\n[612.7s] Но както Комисията продължи да показва\n[615.2s] и двете изисквания бяха изпълнени.\n[618.18s] Първоначално Илай твърдял, че не си спомнял за твърденията от младите сестри на BCG.\n[623.31s] Но след това Стюарт предоставил документ, наречен \"бележки на Комитета за разследване\".\n[629.12s] Той е бил извлечен от полицията, която го е използвала в обвинението си срещу бащата на BCG.\n[634.82s] Бил написан от Илай на ръка\n[637.02s] и датирал по време на първоначалните срещи с BCG.\n[641.22s] В него Илай отбелязал, че бащата на BCG вероятно е злоупотребявал\n[644.94s] над двете по-малки дъщери, както и над по-голямата сестра с две години.\n[649.5s] Освен това Илай отбелязал, че бащата на BCG си признал\n[653.44s] че всички твърдения за насилие са верни.\n[656.56s] Така че старейшините имали множество свидетели и самопризнание.\n[660.84s] И въпреки това не направили нищо.\n[663.725s] Съдия МакКлеллан посочил че Илай преди това му е казал, че не е получил признание от баща й.\n[668.566s] След известно колебание Илай заявил, че трябва да се уверят, че признанието е вярно.\n[674.0s] Това бяха пълни глупости.\n[676.8s] Още преди това Илай беше заявил, че всички старейшини вярвали в историята на BCG.\n[681.08s] Но след като получили изповед, \nкоято потвърдила историята, те вече вярвали\n[685.72s] и те съвсем внезапно решиха че не искат да приемат признанието за вярно?\n[690.02s] Твърдението на Илай, че признанието трябва да бъде подкрепено, е доказано невярно.\n[696.02s] Когато бащата на BCG признал в жалбата си\n[698.92s] пред трима старейшини от други конгрегации жалбата му била приета.\n[703.84s] Изискването на Илай за допълнително обосноваване\n[706.86s] било ненужно, жестоко и безсърдечно\n[711.0s] за малтретираното лице, което е минало през целия този ад, да го накарат да минава отново\n[715.69s] и пак да отговаря на всички \"правни изисквания\" на тази организация.\n[721.475s] Както много старейшини призовавани да говорят пред Комисията\n[724.42s] Кевин Баудич не проявил голяма загриженост\n[726.95s] за последиците от неспособността да се справят с насилниците.\n[730.44s] На въпрос за потенциалната опасност\n[732.66s] идваща от вече известен насилник на деца за обществото като цяло, включително деца извън организацията\n[738.56s] — той машинално отговорил:\n[740.036s] \"Какви способности имаме та да защитаваме всяко дете в Австралия?\"\n[744.302s] Когато Стюарт дал очевидния отговор\n[746.38s] че могат да докладват на органите за закрила на детето\n[749.13s] Боудич казал, че това е било правено в някои случаи.\n[752.1s] Но Стюарт му казал, че това не е доброволна практика\n[756.08s] — това не е направено, освен ако няма законово изискване за това.\n[760.36s] Боудич потвърдил, че това е така.\n[763.18s] Както и на практика всички старейшини, призовани да свидетелстват\n[766.3s] — включително Илай —\n[767.54s] Боудич отказал да гледа показанията на BCG или да прочете изявлението й.\n[772.82s] Стюарт попитал защо отказва. Боудич твърдял, че е така защото\n[776.76s] той предпочитал да бъде честен и да говори от собствената си гледна точка.\n[780.88s] Когато Стюарт попитал Боудич защо малтретираните хора\n[783.693s] са длъжни да се изправят срещу своите насилници\n[785.689s] Боудич заявил, че това може да стартира процеса на \"изцеление\".\n[789.03s] Той каза, че това е направено, за да могат хората като BCG да могат да си го изкарат\n[792.58s] говорейки на човека, който е извършил това ужасно деяние.\n[796.145s] Но в собствената си реч Боудич си спомни как бащата на BCG е бил вербално агресивен\n[801.574s] и физически заплашителен към дъщеря си, която е била уплашена.\n[806.2s] В тази атмосфера на сплашване нямаше нищо \"изцеляващо\".\n[810.617s] И Боудич се съгласил, че това не е благоприятен начин\n[815.2s] за да се достигане до истината.\n[817.5s] Дори в литературата на\n Свидетеля на Йехова\n[819.62s] има признание, че конфронтацията не само пречи на \"изцелението\", но може да причини повече щети\n[825.49s] отключващи отказ и повече злоупотреба.\n[828.467s] Литературата на тази организация дори признава, че прошката не винаги е приемлива.\n[834.52s] Важно е да се разбере, че Всезнаещият бог би знаел колко вредни могат да бъдат тези конфронтации за жертвите на злоупотреба.\n[842.62s] И така, кой решил, че тези конфронтации трябва да бъдат правна процедура?\n[848.22s] Беше ли безсърдечен \nнекомпетентен Бог\n[851.0s] или бездушни некомпетентни хора, които фалшиво твърдят, че говорят от името на Бог?\n[859.3s] Подобно на всички свои колеги, Рон де-Рой — старейшина с 29 години опит —\n[864.16s] отказал да види показанията на BCG.\n[867.223s] На въпроса защо, той отговорил, че не иска да го слуша\n[870.23s] за да може да бъде обективен.\n[872.33s] Той казал, че иска да бъде честен във всички въпроси, които му се задават.\n[876.52s] По-късно обаче се оказало, че е гледал показанията на Дино Илай\n[880.92s] Стюарт попита дали не се притеснява, че това би застрашило неговата обективност.\n[885.88s] де-Рой отговорил, е иска да бъде честен.\n[889.6s] И така — той избягвал показанията на BCG, защото иска да бъде честен\n[894.02s] но гледал показанията на Илай, защото иска да бъде честен.\n[899.1s] Това не се връзва.\n[901.48s] Не останало незабелязано, че всички старейшини са избягвали показанията на BCG\n[906.18s] повтаряйки ежедневното отчуждение на бившите членове, практикувано от тази организация.\n[911.14s] Един човек, който не следвал тази тенденция\n[913.3s] бил бивш Свидетел на Йехова, на име Монти Бейкър\n[917.046s] — бивш старейшина в конгрегацията, в което бащата на BCG се преместил.\n[921.582s] За разлика от де-Рой и другите старейшини\n[924.36s] Бейкър следял внимателно процедурите, включително показанията на BCG.\n[929.224s] В резултат на това множество стари спомени се върнали към него, подтиквайки го да допълни първоначалните си показания.\n[936.24s] Той казал, че е уверен в значението на това събитие\n[938.799s] което би мотивирало всички, които дават доказателства, да бъдат напълно ясни по всеки аспект.\n[944.24s] Изглеждало, че де-Рой почти нямал спомени\n[947.45s] за неговата роля в разследването от старейшините по твърденията на BCG.\n[951.615s] Твърдял, че не може да си припомни нито един детайл\n[954.29s] от актовете на насилие които BCG съобщила на него и на старейшините\n[959.15s] което довело до изненадващ момент, когато по време на свидетелските си показания\n[963.66s] той искал силно да впечатли Комисията\n[965.88s] казвайки че е бил отвратен от това, което бащата на BCG й направил.\n[969.46s] — Стюарт попитал какво го отвращава.\n[971.8s] След известно колебание той се усмихнал и заявил, че не си спомня нищо.\n[977.058s] Свидетелствата на де-Рой следвали ясна структура.\n[980.34s] Когато го попитали за участието му в разследването на BCG, той заявил, че не си спомня нищо.\n[985.86s] Когато е изправен пред предполагаемо събитие, което го поставя в особено лоша светлина\n[990.56s] освен твърденията за липса на спомени\n[992.41s] той също се опитал да твърди, че това няма как да се е случило.\n[995.46s] Пример за това бил, когато Стюарт четял от показанията на BCG\n[999.24s] че де-Рой е казал, че не иска да говори със сестрите й\n[1002.06s] защото били твърде млади, за да знаят за какво говорят.\n[1005.32s] де-Рой твърдял,\n че не си спомня това.\n[1008.4s] Стюарт попитал дали казва, че това не се е случило.\n[1011.41s] де-Рой се отклонил от въпрос а и вместо това коментирал\n[1015.13s] че ако старейшините са знаели, че сестрите й също са били малтретирани\n[1017.77s] това би им дало повече свидетели, с които да продължат разследването.\n[1021.04s] Тогава Стюарт представил ръкописните бележки който Дино Илай собственоръчно е написал където\n[1024.929s] потвърждава, че старейшините са знаели за сестрите на BCG\n[1028.609s] и че баща й е признал всичко.\n[1031.579s] Тогава де-Рой твърдял, че си спомня много точно\n[1034.659s] че на първото съдебно заседание\n[1036.529s] старейшините имали само думата на BCG срещу баща й.\n[1040.48s] Но този предполагаем преци��ен спомен не направи нищо\n[1043.589s] в сравнение с твърдите доказателства в бележките на Илай,\n[1046.459s] които подкрепяха показанията на BCG\n[1048.809s] че е била докладвана злоупотребата върху сестрите й, но била игнорирана.\n[1053.879s] По време на показанията на де-Рой той многократно давал несериозни отговори\n[1058.3s] със една и съща нелепа усмивка.\n[1061.0s] Когато съдия МакКлеллан го попитал дали смята, че е правилно че\n[1064.32s] след като баща й е бил \"лишен от комуникация\"\n[1066.42s] именно BCG била тази която е отстранена от семейния дом\n[1069.69s] докато насилникът й си останал там\n[1071.72s] де-Рой се ухилил и казал че ако го е било грижа за дъщеря му\n[1075.76s] той щял да направи това много по-лесно за нея.\n[1078.747s] Да очакваш грижи от баща, който биел и заплашвал BCG\n[1083.365s] и изнасилил всичките си дъщери, може би беше най-ясният показател\n[1088.054s] за абсолютно отричане от самото понятие за лична отговорност.\n[1092.46s] Отговорите на де-Рой варирали от неясни до объркани и тъпи.\n[1098.94s] В един момент Стюарт му казал, че говори неясно.\n[1103.68s] Размишлявайки върху поведението му в Комисията\n[1106.07s] беше отрезвяващо да осъзнаем, че този човек е бил отговорен\n[1109.85s] за грижата за отглежданите там деца.\n[1115.123s] Появиха се и други уличаващи факти за тази организация\n[1118.8s] когато някои служители на Свидетеля на Йехова били поканени\n[1121.5s] да обяснят политиките и процедурите на организацията.\n[1125.38s] Родни Спинкс — Свидетел на Йехова за повече от 40 години\n[1129.5s] бил старши член на Отдела за обслужване\n[1131.955s] в офиса на мениджърския център на тази организация,\n[1134.46s] и е помагал на старейшините да изпълнят инструкциите за справяне с обвиненията за сексуално малтретиране на деца.\n[1140.78s] Винсент Тоул — покръстен през 1972 година\n[1144.37s] ръководи дейността на правния отдел на офиса на управляващия център от 2010 г. насам.\n[1150.708s] Терънс О’Брайън\n — покръстен през 1976 г.\n[1154.335s] бил настоящият координатор\n[1156.01s] на австралийския комитет на Центъра за Свидетели на Йехова.\n[1159.94s] Спинкс бил първият \nда даде показания\n[1162.05s] и скоро станало ясно, че документацията на организацията\n[1165.62s] за обработване на обвинения за насилие над деца била безнадеждно разпокъсана.\n[1170.312s] Нямало ясен централизиран набор от насоки\n[1173.75s] които да бъде достъпен за всички конгрегации.\n[1177.24s] Спинкс казал, че инструкциите са изложени в различни източници\n[1180.51s] включително превода на Библията от организацията;\n[1184.03s] поверителен наръчник на старейшините, наречен \"пасете Божието Стадо\";\n[1188.74s] поверителни писма, изпратени до офиса на старейшините;\n[1191.58s] и статии в списанията на организацията, като The Watchtower(Стражевата кула).\n[1196.397s] В един абсурден момент Спинкс казал, че е намерил документ\n[1200.1s] показвайки че малтретирани лица не е трябвало да се сблъскват със своите насилници\n[1203.83s] но признал, че никой няма копие на документа\n[1206.09s] докато не намерили по-възрастен член на отдела\n[1208.8s] който го е копирал, отрязал и вмъкнал в книгата си.\n[1213.736s] Стюарт коментирал, \nче е като\n[1215.21s] да се опитвате да поставите пръста си на топка живак:\n[1218.36s] точно когато мислите, че сте я хванали, изскача от някъде другаде.\n[1221.98s] Ако висшите ръководители не могат да се ориентират в собствените си инструкции\n[1225.9s] тогава какво може да се надява едно малтретирано дете?\n[1228.84s] Пасивността на тези инструкции също била очевидна.\n[1232.86s] Стюарт отбелязал, че в тайното ръководство на старейшините няма инструкции които\n[1237.08s] да информират активно конгрегациите за правото им да се свържат с властите.\n[1242.009s] Само ако старейшините били помолени, те трябвало да казват на конгрегациите\n[1246.04s] това било тяхното лично решение, да го правят или не.\n[1248.316s] Това не е съветът на подкрепяща организация\n[1251.62s] а на такава, \nкоято не желае да се намесва.\n[1254.252s] Всеки малтретиран човек, който не успее сам да повдигне темата\n[1258.26s] никога няма да получи потвърждението, че е тяхното право да отидат в полицията.\n[1262.6s] Крайният резултат е, че насилниците получават пълна защита от полицията.\n[1267.74s] Стюарт подчертал лицемерието на тази пасивна позиция\n[1271.55s] казвайки на Спинкс, че ако той видял някой да нахлуе в къщата на съседа\n[1275.73s] или получи достоверна информация за убийство\n[1278.82s] той веднага би го съобщил на полицията. Спинкс потвърдил, че несъмнено ще го направи.\n[1284.554s] Съдия МакКлеллан също обясни на Спинкс за потенциалната наказателна отговорност за недокладване на полицията.\n[1291.52s] Ако старейшините определят, че обвинението е вярно\n[1294.559s] то представа \nда е просто обвинение\n[1297.11s] и става знание или убеждение за престъпление.\n[1301.88s] В Нов Южен Уелс, където се намира Спинкс\n[1304.65s] наказателни санкции могат да бъдат наложени на хората\n[1306.91s] който знаели или вярвали, че е извършено престъпление и не са подали сигнал.\n[1313.098s] Освен това Стюарт отбелязал, че ако да се свържете с органите за закрила на детето\n[1316.74s] беше автоматична\n първа стъпка\n[1318.66s] нямало да има нужда старейшините да разпитват детето\n[1321.75s] — старейшини, които, отбеляза Стюарт, не са имали обучение за разпитване на травматизирани деца.\n[1328.52s] Спинкс се съгласил.\n[1330.5s] МакКлелан също така отбеляза, че гражданските власти имат предимството на десетилетия\n[1335.02s] на научни изследвания в областта за справянето с насилниците\n[1339.6s] —нищо от това не е на разположение на Свидетелите на Йехова—\n[1342.82s] проучвания, които подчертават високия риск от повторно нарушение.\n[1346.66s] Но в един внезапен предизвикателен момент, когато Спинкс казал, че Библията надделява над науката\n[1353.32s] и с гордост е цитирал Свидетелите на Йехова\n[1355.575s] в Южна Корея, Русия, Азербайджан и Еритрея\n[1359.534s] които бяха отишли ​​в затвора заради своите убеждения.\n[1362.24s] Той казал, че организацията ще продължи да порицава и възстановява хората които доказват че са „достатъчно покаяни“.\n[1371.085s] Когато му било посочено, че в такава система има очевидна мотивация хората просто да се преструват на разкайващи се\n[1375.517s] ако това е последвано от избягване на наказание,\n[1378.17s] Спинкс признал, че това е възможно.\n[1382.831s] Винсент Тоул признал, че е получавал три или четири обвинения\n[1386.74s] за сексуално насилие над деца всеки месец.\n[1389.86s] Самият той обучен адвокат, Тоул признал че никакво формално обучение\n[1394.21s] не се изисквало за да бъде някой старейшина\n[1396.04s] въпреки че длъжността включвала всеобхватна отговорност\n[1399.24s] за благополучието\n на много хора.\n[1401.671s] Тоул твърдял, че преди някой да бъде номиниран за старейшина\n[1404.703s] организацията използва стандартен сертификат за пригодност за работа с деца\n[1408.98s] за да се увери, \nче няма криминално досие.\n[1410.84s] Но Стюарт отбелязал, че такива системи за проверка\n[1413.82s] зависят от точните бази данни за сексуални престъпления.\n[1417.813s] Ако властите не са информирани за престъпления\n[1420.41s] тогава ефикасността на проверката е компрометирана.\n[1423.542s] С обичайното реноме на свидетелите на Йехова, че не докладват за престъпления\n[1427.04s] изглеждало, че организацията искала да се възползва от тази външна база данни\n[1431.05s] но не и да \nдопринасят за нея.\n[1433.517s] Тоул многократно твърдял, че няма да се колебае да съобщи за злоупотреби в полицията\n[1438.1s] но само ако нямало друг начин за защита на детето.\n[1441.6s] На практика тази ситуация е много малко вероятна\n[1444.72s] защото организацията вярва, че осигурява ефективна защита\n[1448.17s] чрез преместване на децата от домовете им, както правели с BCG\n[1452.1s] по време на процеса, откъсвайки я от семейния живот.\n[1455.98s] И наистина, когато Тоул бил попитан директно\n[1458.74s] дали някога е ходил в полицията, той призна, че не го е правил.\n[1462.3s] Първоначално Tоул твърдял, че правният отдел е бил инструктиран\n[1465.14s] да насочат старейшините ясно да кажат на жертвите, че имат абсолютното право\n[1469.4s] да докладват за злоупотребите над тях, пред властите.\n[1472.18s] Но когато го помолил да цитира тези инструкции, той не могъл.\n[1476.465s] Той намалил обхвата на изявлението си до \"докладването е в духа на литературата на тази организация\"\n[1482.206s] и той признал, че не е получил официални инструкции.\n[1486.82s] Тоул играел защитник на човешките права\n[1489.27s] многократно твърдял че нежеланието на организацията\n[1491.75s] да се свърже с властите било да защитят правото на хората да вземат решение\n[1495.63s] това, което било в техните най-добри интереси.\n[1498.16s] Но истинските защитници на правата на човека информират хората за техните права\n[1502.51s] защото без това осъзнаване хората не могат да упражняват правата си.\n[1506.889s] За разлика от тях децата на Свидетелите на Йехова не са били запознати с техните права.\n[1512.109s] Тоул не се съгласил и казал, \nче децата \nне живеят в пашкул.\n[1514.94s] Но в действителност\n е точно така.\n[1516.92s] Организацията на свидетелите на Йехова е сепаратистка група\n[1520.56s] чиято литература многократно предупреждава за лоши асоциации с нечленуващи.\n[1526.08s] Глава 5 от книгата на организацията „Пази се в Божията любов“\n[1530.3s] открито е озаглавена „Как да се пазим отделени от света“\n[1534.22s] и започва с Йоан 15, стих 19: „Вие не сте част от този свят“.\n[1540.56s] Не е нужно да сте физически изолиран, за да бъдете в пашкул.\n[1545.16s] Можете просто да останете в доверително невежество; да бъдете предупредени за връзки с нечленове;\n[1551.28s] и заплашвани с наказание или дори пълно отчуждение за неподчинение.\n[1556.96s] На въпрос какво смята да подобри организацията на Свидетелите на Йехова в себе си\n[1560.01s] за да се справи със сексуално насилие над деца\n[1562.72s] Терънс О''Брайън бил доста общителен.\n[1565.62s] Той казал, че е необходима по-ясна документация по отношение на политиката им;\n[1569.34s] правото на докладване трябва да бъде ясно обяснено;\n[1572.6s] и процедурите, трябва да бъдат ясно обяснявани на всеки, който свидетелства за злоупотреба.\n[1577.188s] Едно нещо, за което О''Брайън не беше ясен, беше защитата на конгрегацията.\n[1581.98s] МакКлеллан попитал как старейшините ще пазят конгрегацията\n[1585.46s] ако напълно вярват на твърденията за злоупотреба с някого\n[1588.54s] но не могат да отговорят на изискванията на организацията за доказване\n[1591.96s] като правилото за двама свидетели.\n[1594.0s] О''Брайън казал, че старейшините ще поставят ограничения\n[1596.61s] относно асоциацията на този човек с деца.\n[1600.02s] Когато МакКлеллан отбелязал, че това зависи от това\n[1601.91s] дали старейшините, са наясно с прегрешението\n[1604.1s] О''Брайън добавил, че членовете могат да им докладват.\n[1607.285s] Но МакКлеллан посочи, че членовете на събранието изобщо няма да помислят да докладват нищо\n[1611.021s] защото никой не им е казал да налагат ограничения върху този човек.\n[1614.188s] О''Брайън се съгласил.\n[1616.037s] Липсата на основно разбиране на тези защитни процедури бе просто поразителна.\n[1621.74s] О''Брайън изключи възможността за промяна относно правилото за двама свидетели\n[1625.69s] или даване на роля на жените в процеса на разследване.\n[1629.324s] Той потвърдил нелепите причини от Писанието, които забраняват на жените\n[1633.422s] да упражняват власт над мъжете, цитирайки 1 Тимотей 2: 11-14.\n[1638.714s] Причина първа: Адам е бил сътворен преди Ева.\n[1643.26s] Това е просто нелогично.\n[1645.907s] Редът за раждане на първите двама души в Библията няма логическа връзка\n[1650.12s] с никакви особености на съвременните мъже и жени.\n[1653.78s] Причина втора: \nАдам не бил измамен, но Ева била.\n[1658.26s] Всъщност според Библията и Адам, и Ева се поддали\n[1661.99s] точно на същото подбуждане\n[1663.84s] като им е казвано, че няма да умрат, ако ядат\n[1665.79s] от дървото на познанието за доброто и злото.\n[1668.201s] Така че тази втора причина е лъжа — за която плащат жените сред Свидетелите на Йехова.\n[1675.248s] На въпроса за лъжата. Оказало се, че О''Брайън съзнателно е дал на Комисията невярна информация за потенциален свидетел.\n[1683.26s] МакКлеллан преди това се е поинтересувал за възможността за изслушване\n[1686.673s] на член на Управителния съвет на организацията\n[1689.58s] Джефри Джаксън — който в този момент бил в Австралия.\n[1693.48s] По инструкция на О''Брайън\n[1695.54s] адвокатът на организацията на свидетелите на Йехова, г-н Торкли\n[1699.419s] казал на Комисията, че Джаксън вероятно нямало да помогне\n[1703.049s] защото ролята му била ограничена до превод на материалите.\n[1706.62s] Но всъщност като член на Управителния съвет\n[1709.5s] Джаксън бил част от елитен Управляващ съвет на помазани служители\n[1713.97s] давайки насоки на организацията, одобрявайки публикации\n[1718.02s] и оформяйки доктрината. И О''Брайън го знаел.\n[1722.854s] МакКлеллан не приел това извинение\n[1726.69s] и Джаксън\n бил призован.\n[1732.11s] Увъртането, и заобикалянето при появата на Джефри Джаксън\n[1735.22s] на Комисията ще продължи и при неговите показания\n[1738.82s] които били пълни с разсейвания, укрития, неясноти и лъжи.\n[1744.534s] Той многократно заобикалял същността на въпроса\n[1748.69s] често изкривявайки въпроса.\n[1751.04s] Например, когато го попитал\n съдия МакКлеллан\n[1753.65s] дали ако е имало някаква \nбиблейска пречка за една жена\n[1756.436s] да бъде назначена \nза разследване на обвинение\n[1759.049s] Джаксън отговорил, \nче няма пречка\n[1761.322s] за жена, да участва\n в разследването.\n[1765.24s] Той упорствал и \nизбягвал въпросите.\n[1769.08s] Дал прав отговор, когато в крайна сметка Стюарт казал\n[1772.63s] че човек, който прави чай по време на разследването, също е „замесен“\n[1777.34s] въпросът бил за това \nкой взема решенията.\n[1781.68s] Следвайки ръководството \nна О''Брайън\n[1783.51s] Джаксън направил няколко изкривявания на фактите за ролята си в тази организация.\n[1788.76s] Той представил фантазия за равенство\n[1791.77s] в която членовете на Управителния съвет виждат себе си\n[1794.299s] само като сътрудници \nс други Свидетели на Йехова\n[1797.809s] и загатнал, че ако\n Управителният съвет\n[1799.55s] не дал някаква насока, която не е в хармония с божественото слово\n[1802.86s] Свидетелите на Йехова по целия свят ще разберат, че това не е правилно.\n[1806.84s] В действителност, Управителният съвет е орган\n[1809.9s] което определя всички политики и процедури на организацията\n[1813.4s] и очаква покорство и подчинение.\n[1815.94s] Членовете могат да бъдат \"лишени от комуникация\" за несъгласие с тях\n[1819.58s] по обвинението за \"предизвикване на разцепление\".\n[1822.3s] Например някои Свидетели на Йехова дават гласност\n[1824.92s] за реформата на учението, забраняващо кръвопреливане.\n[1828.68s] Както отбелязват реформаторите, представеното писание\n[1831.6s] в обосновка на тази доктрина изрично се споменава за ядене на кръв.\n[1836.2s] Няма библейска концепция за преливане.\n[1839.46s] Но за изразяването на това несъгласие, реформаторите са били \"лишени от комуникация\"\n[1844.62s] Когато Стюарт го попитал дали се виждат\n[1847.01s] като говорители на\n Йехова на земята\n[1849.15s] Джаксън казал, че това би изглеждало доста самонадеяно.\n[1852.32s] Но в статия от 2001 г. в списанието \"Стражева кула\" на организацията\n[1856.52s] Управителният съвет \nизрично се аргументирал\n[1858.97s] че не е било нахално от страна на Свидетелите на Йехова\n[1861.91s] да отбележат, че те самите са имали подкрепата на библейския Бог.\n[1866.905s] Джаксън също представил погрешно позицията на организацията по отношение на телесното наказание.\n[1872.012s] МакКлеллан попитал направо\n[1874.16s] дали неговата църква приема телесното наказание на децата.\n[1878.35s] Джаксън се отклонил от въпроса\n[1880.12s] казвайки, че църквата му очаква родителите да носят отговорността\n[1883.44s] да дисциплинират \nи отглеждат децата си.\n[1886.47s] МакКлеллан казал, че това не отговаря на въпроса му — и го повторил.\n[1890.84s] След още укрития, накрая Джаксън казал\n[1893.59s] организацията не го приемала или насърчавала.\n[1896.68s] Но списанието \"Стражева кула\" изрично насърчава\n[1899.432s] както вербалното, така и физическото наказание.\n[1902.42s] Статия, озаглавена \"Дисциплиниране на децата за цял живот\"\n[1905.5s] твърди, че пляскането може да бъде спасение за детето\n[1908.85s] и казва, че биенето на деца с пръчка няма да ги убие.\n[1912.22s] Това предполага, че упрекът може да работи за по-кротките деца\n[1916.5s] докато пляскането трябва да дисциплинира по-упоритите деца.\n[1920.04s] Статия от 2006 г., наречена \"надеждни родителски съвети\"\n[1924.801s] също така насърчава комбинацията от камшик и порицание\n[1928.66s] милостиво отбелязвайки, че не всички деца се нуждаят от телесно наказание.\n[1933.26s] Връщайки се към въпроса за сексуалното насилие\n[1935.64s] МакКлеллан попитал за възможността да се даде на жените роля за вземане на решения.\n[1940.46s] След известно избягване Джаксън потвърдил учението на организацията\n[1944.69s] че само мъже могат \nда бъдат съдии\n[1946.57s] и твърдял, че това се основава на Писанието.\n[1949.32s] Но Джаксън забравил за пророчицата Девора\n[1952.12s] чиято история е разказана в четвърта глава на Библейската книга на съдиите.\n[1956.74s] В книгата са изобразени шест основни и шестима второстепенни съдии.\n[1960.4s] Девора била основен съдия, и вземала правни решения.\n[1964.6s] Изглежда, че има библейски прецедент за предоставяне на роли за вземане на решения на жените.\n[1970.12s] Когато Стюарт му е казал, че много жени ще се чувстват по-комфортно\n[1973.21s] говорейки с жена за насилието над тях\n[1975.38s] Джаксън отхвърлил идеята.\n[1977.502s] Той каза, че за разлика от \"вашите църкви\", в които хората не говорят помежду си\n[1982.66s] в конгрегациите на Свидетелите на Йехова хората се запознават и се сприятеляват.\n[1986.84s] Оставяйки настрана неговия невежия му коментар за социалните отношения на други църкви\n[1991.16s] аргументът му изглежда е, че всички малтретирани жени\n[1995.32s] трябва да се чувстват удобно да говорят с мъжете за това.\n[1998.2s] Също както старейшините\nпреди него\n[2000.33s] той изглеждал неспособен да разбере реалността, която мнозина не разбират.\n[2005.63s] Стюарт попитал Джаксън за \"прекъсване\", когато хората заявяват, че вече не искат да бъдат свидетели на Йехова.\n[2012.82s] Това е начин на действие, който много малтретирани хора се чувстват подтикнати да предприемат\n[2017.169s] когато техните насилници останат ненаказани и останат в конгрегации.\n[2022.17s] Проблемът е, че ако се разделите със Свидетелите, вие впоследствие сте отбягвани\n[2026.5s] така че, заради това че сте били малтретирани, губите цялата си социална мрежа.\n[2032.429s] Джаксън отхвърлил идеята, че хората, които вече не искат\n[2035.69s] да бъдат известни като свидетели на Йехова, трябвало да се разединят.\n[2039.51s] Той каза, че могат да изберат просто да станат „неактивни“, членове.\n[2043.68s] Но Стюарт отбелязал, че неактивните членове все още са обект на подчинение\n[2047.56s] към правил��та и дисциплината на организацията.\n[2050.8s] В момент на учудващо лицемерие\n[2053.84s] Джаксън казал, че трябва да провери, защото това не е била неговата област на познание.\n[2058.34s] Стюарт продължил, казвайки на Джаксън, че няма междинна опция\n[2063.1s] или сте член, или не.\n[2065.679s] Ако се \"неактивни\", все още сте подчинени на дисциплината и правилата на организацията.\n[2070.71s] Току-що заявил, че това не е неговата област на експертиза\n[2073.32s] Джаксън потвърдил, че това е вярно.\n[2076.693s] Джаксън удобно забравил още един факт за \"неактивните\" свидетели.\n[2080.44s] Въпреки че все още официално се считат за Свидетели на Йехова\n[2084.26s] на практика те често се избягват активно и се изключват от други Свидетели\n[2089.489s] на основание, че липсата на активност ги прави „лоша асоциация“.\n[2094.38s] Понякога на практика се получава много малка разлика между такова избягване и формално отчуждаване.\n[2100.547s] Подобно на старейшините, които свидетелстваха преди него\n[2102.9s] Джаксън, с постоянните му избягвания и двусмислици\n[2106.96s] се показал като човек без принципи\n[2110.109s] нежелаещ да посочи истинските доктрини на организацията му.\n[2114.06s] И това подчертало особено изобличаващо лицемерие.\n[2117.86s] Когато насилниците избягват правосъдието въз основа на липса на втори свидетел или доброволно признание\n[2124.451s] тогава тази организация предлага на лицата, подложени на злоупотреба, въображаемата утеха\n[2129.08s] че проблемът ще бъде оставен в ръцете на Йехова\n[2132.109s] като посланието било, че те трябва смело да издържат на всички трудности на земния си живот\n[2136.56s] защото божествената справедливост в крайна сметка ще възтържествува.\n[2140.16s] Но ако Джаксън е имал такава убеденост в върховната божествена справедливост\n[2144.82s] той би провъзгласил вярванията си гордо, преодолявайки всички земни трудности\n[2149.21s] които биха били последица от неговата вяра.\n[2151.64s] Вместо това, за да се избяга от земната критика\n[2155.06s] той се крие зад изкривяването на религията си\n[2158.82s] докато малтретираните лица се очаква да понесат своите земни страдания.\n[2164.0s] Той е лицемер и страхливец.\n[2170.615s] През 2017 г., 18 месеца \nслед \"случай 29\".\n[2175.328s] в който Комисията разследва реакцията на Свидетелите на Йехова за злоупотребите над BCB и BCG\n[2180.99s] Комисията започна \"случай 54\" —  допълнително разследване, в което Родни Спинкс и Терънс О''Брайън\n[2187.98s] били извикани обратно да съобщят какъв напредък\n[2190.4s] ако такъв изобщо има, е бил направен от организацията.\n[2193.443s] Комисията поиска член на Управителния съвет\n[2195.96s] да бъде достъпен лично или чрез видео, за да даде показания\n[2199.21s] в това важно, решаващо заседание.\n[2202.07s] Заявката била отказана.\n[2204.05s] Въпреки огромното количество време, което беше предоставено,\n[2206.644s] тази организация имаше за цел да произведе само три жалки документа\n[2211.43s] включително писмо до всички старейшини и ръководството за поддръжка.\n[2216.109s] Подобно на други процедурни документи, произведени от тази организация\n[2219.22s] ръководството на сервизното бюро бе необяснимо класифицирано като строго поверително;\n[2224.569s] неподходящо дори за очите на секретарите за поддръжка.\n[2228.08s] Делата на BCB и BCG подчертаха всички вреди, причинени от липсата на процедурна прозрачност в тази организация.\n[2236.12s] Но Спинкс и О''Брайън не успели да обяснят\n[2239.29s] защо на членовете на конгрегацията все още се отказва информация\n[2242.94s] за процесите, управлявали живота им.\n[2245.98s] Бил изготвен трети документ\n[2248.26s] само три дни преди изслушването на Комисията.\n[2251.44s] Не е публикуван или разпространен\n[2254.3s] и Стюарт забелязал някои очевидни недостатъци\n[2256.6s] и съществени неясноти в текста.\n[2259.72s] Спинкс признал, че формулировката все още се нуждаела от усъвършенстване\n[2262.78s] но многократно твърдял, че вече се прилагат по-строги практики.\n[2267.172s] Когато бил поканен да подкрепи това твърдение с документация\n[2270.78s] той признал, че не може.\n[2273.176s] По този начин, вместо публичен и централизиран стратегически документ, картината остава разединена.\n[2281.093s] Съдия МакКлеллан отбеляза, че докато намеренията им не бъдат ясно отразени в документите им\n[2286.583s] има голям шанс те да се заемат със старите.\n[2290.26s] Предполагаемо организацията отхвърлила ключовите заключения на Комисията.\n[2295.12s] Тя продължава да изисква двама свидетели.\n[2298.521s] Тя също така отхвърли възможността жените да имат роля при вземането на решения.\n[2303.12s] И тя отстоява практиката си да отчуждава лицата, подложени на злоупотреба\n[2306.9s] които се почувствали принудени да излязат извън контрола на своите конгрегации\n[2310.14s] за да избягат от насилниците си.\n[2312.92s] О''Брайън продължавал да твърди, че да бъдат отчуждени е техен личен избор.\n[2317.406s] Имало силен елемент от театрално изпълнение\n[2320.43s] тъй като той предизвикателно заявил, че по отношение на политиката на избягването\n[2324.7s] Йехова е техният съдия;\n[2326.49s] Йехова е техният законодател;\n[2328.42s] Йехова е техен цар.\n[2330.84s] Изслушванията по делото на BCB и BCG показаха, че тази организация е запушила ушите си с пръсти.\n[2338.455s] Да очакваме промяна да дойде от тази тайна, измамна, авторитарна организация\n[2344.905s] е, предполагам,\n безполезно.\n[2347.469s] Много по-добре е да изразходвате силите си, както предложи BCG\n[2351.69s] за да я принудите да поеме финансова и наказателна отговорност\n[2354.99s] за предателството на децата в нейните конгрегации\n[2358.08s] и, подобно на работата на Австралийската кралска комисия\n[2361.34s] — за привличане на общественото внимание към нейните вредни практики —\n[2365.4s] — за разкриването на злоупотребата.\n[2367.747s] Злоупотребата процъфтява в мълчанието и тишината.\n[2371.597s] Нека приключим с тях.\n[2375.427s] Много благодаря на всички, които подкрепиха канала тази година."}'
