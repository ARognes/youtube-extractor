transcript: '{"content":"\n[0.24s] Recently, I received a powerful question\n[2.56s] from one of my supporters over on\n[4.56s] Patreon. They ask, \"When one has\n[7.919s] advanced in Buddhism, how would they\n[10.48s] have changed? Would they have a\n[12.48s] different or unusual mentality or sense\n[15.36s] of perceptions?\"\n[17.359s] Sometimes I feel like I''ve been moving\n[19.92s] forward in Buddhism. Other times I feel\n[22.88s] that that would be presumptuous\n[24.8s] posturing.\n[26.56s] Some explanations of nirvana would seem\n[29.279s] to indicate that I''ve attained it or I''m\n[31.679s] close to it. Others would laugh at this,\n[34.88s] seeing it as arrogance.\n[37.28s] My supporter says that he''s doing his\n[40.239s] best to live a good life for himself and\n[42.64s] others to harm no one, including myself.\n[46.96s] I try to see what the Buddha saw. If\n[49.84s] there''s any enlightenment in that, then\n[51.92s] I''ve attained it. But if that''s all\n[54.48s] there is, I think the religion promises\n[57.199s] more than it offers.\n[59.6s] Now, this is indeed a universal question\n[62.399s] for practitioners, one that we may ask\n[65.119s] ourselves even if at some level we be\n[68.32s] believe that we shouldn''t be asking\n[69.68s] these kinds of questions. The fact is we\n[72.96s] all want to know if we''re making\n[75.04s] progress. We want to know what the goal\n[78.72s] would be like, what the final\n[80.4s] destination might feel like.\n[84.24s] Now, the short answer that I often give\n[86.88s] to this kind of question is not to\n[89.2s] worry. Don''t worry about attainments.\n[92.32s] They can become sources of attachment\n[94.4s] and conceit, comparing ourselves to\n[97.68s] others. Just do the practices and see\n[101.2s] where they lead. But clearly that''s not\n[104.479s] going to be the whole story here. So in\n[107.28s] this video, we''ll explore what early\n[109.6s] Buddhism actually says about knowing\n[112.72s] whether or not you''re enlightened, why\n[115.36s] it''s so easy to be confused about this,\n[118.32s] and what true signs of progress might\n[121.119s] actually look like.\n[124.56s] My supporter over on Patreon mentioned\n[127.439s] feeling at times that they were close to\n[129.36s] Nirvana while conceding that others\n[132.16s] might laugh at this kind of claim,\n[134.239s] viewing it as arrogant.\n[137.12s] This points at one common trap we can\n[139.76s] all fall into, which is mistaking\n[142.72s] profound, even blissful experiences for\n[146.319s] ultimate attainment.\n[148.4s] Now, while my supporter here didn''t\n[150.8s] specifically mention profound\n[153.12s] experiences like these, other people in\n[155.92s] my comments often do.\n[159.2s] In fact, the ancient Brahma Jala Suta\n[162.4s] lists a long series of contemplative\n[165.28s] states that people in the Buddha''s day\n[168.16s] mistakenly identified as ultimate\n[171.2s] liberation or nirvana. Our minds are\n[175.04s] actually quite good at generating\n[177.76s] powerful pleasant states even through\n[181.68s] apparent intellectual understanding or\n[184.239s] reasoning. For example, we can think of\n[187.28s] the common Eureka moment uh that we get\n[190.48s] when we think we''ve solved a problem.\n[192.879s] And that eureka is not guaranteed to\n[196.319s] follow from correct reasoning. Although\n[199.36s] it does feel admittedly wonderfully\n[201.76s] pleasant and invigorating,\n[204.4s] we may feel a eureka moment only to\n[207.2s] realize sometime later that we''ve made a\n[209.36s] mistake.\n[211.76s] Other such pleasant states can arise\n[214.48s] during meditation such as the jas. These\n[218.159s] are deep states of meditative absorption\n[220.319s] that are quite pleasant in one way or\n[222.4s] another\n[224.0s] and they can indeed feel profound, even\n[227.519s] temporarily liberating, but they''re\n[230.48s] still conditioned states, impermanent\n[233.04s] states, and they don''t signal the end of\n[235.92s] suffering.\n[238.08s] More problematically, we can also all\n[241.04s] too easily delude ourselves into\n[244.0s] believing that we''ve re reached deep\n[246.48s] achievements in our practice through\n[249.2s] forms of psychological detachment that\n[252.319s] are not particularly healthy. This is\n[255.599s] often known as spiritual bypassing. The\n[259.199s] practice of trying to get ourselves not\n[262.16s] to feel what we''re actually feeling in\n[265.36s] order to maintain a kind of inflated ego\n[268.16s] that believes that we''re better than we\n[269.759s] actually are.\n[271.759s] We say to ourselves, \"No, I''m not\n[274.0s] actually feeling that.\" Even when the\n[276.32s] feeling subtly persists.\n[279.44s] Now this is a form of delusion born of\n[283.28s] psychological detachment\n[286.08s] and it''s not healthy and but that said\n[289.84s] we all I think we all go there from time\n[292.479s] to time myself included\n[295.28s] and note here that detachment or\n[298.24s] detachment that I''m saying is not the\n[300.4s] same as nonattachment.\n[303.12s] I have a video about that that I''ll\n[304.56s] leave down in the comments if you want\n[306.56s] to hear more about that distinction.\n[308.56s] It''s a critical one.\n[311.44s] In early Buddhism, enlightenment or\n[313.919s] awakening as it''s sometimes translated\n[316.72s] is not about some kind of special\n[319.199s] feeling or unusual perception.\n[323.28s] Instead, it''s about a fundamental and\n[325.919s] permanent transformation of the mind.\n[329.44s] Enlightenment is said to be accompanied\n[331.759s] by the direct seeing and knowing of\n[334.72s] certain things such as the four noble\n[338.0s] truths, nonself\n[340.72s] and the dependent origination of all\n[342.88s] conditioned things.\n[345.12s] But crucially what makes this knowledge\n[348.08s] enlightenment is its result which is\n[351.6s] said to be unshakable and permanent.\n[355.6s] That is the complete extinguishment of\n[358.72s] the what are known as the three fires or\n[361.52s] three poisons of greed, hatred and\n[365.039s] delusion.\n[367.44s] This means the permanent sessation of\n[370.4s] craving of ego identification and thus\n[374.96s] of duka.\n[377.28s] So any state or experience that we have\n[380.16s] no matter how exalted it might be that\n[383.6s] does not completely extinguish greed,\n[387.199s] anger, jealousy, resentment and so on is\n[390.96s] not enlightenment in the early Buddhist\n[393.84s] sense. I had a video where I went over\n[396.16s] some of this. I''ll also leave that down\n[398.4s] below in the notes.\n[402.56s] Nirvana in the early texts is the state\n[405.68s] that results in the permanent\n[408.56s] transformation of enlightenment.\n[411.759s] Now the word nirvana literally means\n[414.639s] blowing out or extinguishing\n[417.28s] that is the blowing out or the\n[419.599s] extinguishing of these three fires of\n[423.199s] greed, hatred and delusion or ignorance.\n[427.36s] It''s not a place that you go to, nor is\n[430.72s] it really an experience, nor even a\n[433.759s] state of consciousness that you''re in.\n[436.24s] It''s simply the sessation of these\n[438.96s] defilements.\n[441.28s] In one suta in the Pali tradition, the\n[444.08s] Buddha''s foremost disciple in wisdom,\n[446.4s] Sar Puta, remarks that Nirvana is bliss.\n[452.24s] When Saruta says this, venerable Udai\n[455.84s] challenges him. What is blissful about\n[458.8s] it if nothing is felt?\n[462.4s] Sar Puta replies, the fact that nothing\n[465.84s] is felt is precisely what''s blissful\n[468.96s] about it.\n[470.8s] Nothing is felt. It''s not an experience.\n[474.879s] It''s not a sensation. Nor is it really a\n[478.0s] state of consciousness.\n[480.16s] The bliss of nirvana therefore lies not\n[483.52s] in some particular sensation that''s\n[486.16s] associated with it but in the ending of\n[489.28s] suffering itself. The profound relief\n[492.08s] that we find in the absence of craving\n[495.28s] and in the absence of these defilements.\n[499.919s] I think we can perhaps begin to see that\n[502.879s] truly attaining nirvana and full\n[505.599s] enlightenment is a very high bar.\n[509.68s] We may be able to convince ourselves for\n[512.08s] a short period of time perhaps that\n[514.56s] we''re over greed and overhatred,\n[518.24s] but you know, you put ourselves into the\n[520.959s] right conditions\n[522.8s] and we''re going to see greed and hatred\n[524.88s] popping back up pretty quickly.\n[528.72s] Okay. So what about our experience of\n[531.279s] moving forward with our practice with\n[533.76s] our efforts say to live a good life to\n[536.8s] harm nobody and to meditate regularly.\n[541.04s] Now these efforts of moving forward\n[543.92s] should be celebrated in the Buddha''s\n[546.8s] eyes. They are highly valuable and\n[549.839s] undeniable signs that we are indeed\n[552.16s] making progress.\n[554.72s] We should recall that the path is a long\n[557.36s] and gradual one and that lay people like\n[561.04s] ourselves living ordinary lives can do\n[564.56s] things that point us in the right\n[566.24s] direction\n[567.76s] even if we''re not actually renouncing\n[570.32s] everything and putting on robes and\n[572.32s] becoming monastics.\n[575.6s] But even so, we we may reasonably want\n[579.04s] some tips, more tips on what to keep an\n[581.76s] eye out for as we advance along this\n[584.0s] path.\n[585.6s] Well, I can speak for myself and that\n[587.839s] what I''ve noticed is a gradual reduction\n[590.72s] in greed and hatred at the very least.\n[594.64s] This is nowhere near a complete\n[597.279s] sessation of these uh of these things of\n[599.68s] these problems. But through an awareness\n[603.04s] of the suffering involved in these\n[605.12s] states, I find myself getting angry less\n[609.2s] often, for example, with less intensity\n[612.8s] and for somewhat shorter periods of\n[614.8s] time.\n[616.959s] In the same way, I can absolutely still\n[619.68s] be a a greedy kind of person, but the\n[622.64s] greed that at least I feel in myself\n[625.04s] tends to be more circumscribed and I\n[628.24s] find it easier to be content with the\n[630.88s] way that things are in my life. So, I\n[634.32s] find that contentment comes more easily\n[637.04s] for me. So do moments of genuine peace,\n[640.959s] clarity, kindness, and compassion for\n[643.44s] others.\n[645.44s] Personally, I find myself less attached\n[648.079s] to outcomes, less swayed by worldly\n[651.839s] gains and losses.\n[654.399s] In all of this, my ability to understand\n[658.0s] the teachings, let''s say the teachings\n[660.48s] of non-self or of conditioned\n[662.88s] impermanence\n[664.399s] is more directly experienced than simply\n[667.839s] grasped intellectually.\n[670.72s] These are the kinds of real observable\n[673.76s] changes that can indicate that we''re\n[676.399s] moving in the right direction.\n[679.04s] I don''t think there''s any point in\n[680.48s] looking for some kind of switch that\n[683.279s] flips to enlightenment for us. Instead,\n[687.2s] what we''re going to find is a gradual\n[689.6s] process of mental change and\n[692.079s] purification.\n[693.92s] Or at least that''s been my experience.\n[696.56s] Of course, I haven''t I can''t say that\n[698.32s] I''ve gotten all that far along the path\n[700.88s] myself, but this gradual purification is\n[705.12s] indeed clearly depicted in the early\n[707.519s] texts.\n[709.68s] Having said all that, let''s get back to\n[712.24s] the original point. Obsessing over\n[715.279s] whether we''ve attained something\n[717.2s] specific can itself ironically become a\n[722.0s] new source of attachment or conceit for\n[724.959s] us blocking our progress.\n[728.56s] It can lead to indeed presumptuous\n[731.6s] posturing as my supporter wisely put it\n[735.279s] and it can distract us from our actual\n[738.16s] work.\n[740.24s] The early Buddhist path encourages us to\n[743.68s] focus on the practice itself.\n[746.399s] Cultivating such things in our lives as\n[748.8s] mindfulness, calm, and ethical conduct.\n[753.519s] Results are going to arise naturally\n[755.44s] from these kinds of practices.\n[758.32s] What we shouldn''t do is to chase this\n[760.72s] kind of ghost or fantasm of a feeling of\n[764.16s] enlightenment. Instead, we should\n[766.959s] practice in a way that leads to our\n[769.2s] genuine freedom by seeing directly\n[772.639s] what''s skillful and unskillful for\n[775.279s] ourselves to be doing.\n[778.0s] In truth, there''s nobody here to\n[780.72s] impress. There''s no scoreboard in\n[783.92s] Buddhism, no external authority to\n[788.079s] certify our attainments,\n[790.48s] nor to castigate us for lagging behind.\n[795.279s] The ultimate judge is your own\n[797.839s] experience of freedom from these\n[800.24s] defilements.\n[803.2s] So what''s the upshot here when it comes\n[805.76s] to knowing whether or not we''re\n[807.76s] enlightened? The upshot is to continue\n[810.88s] to live a good life, to practice\n[814.0s] kindness, to cultivate calm, to\n[817.279s] meditate, and to get to know the dharma\n[820.0s] as well as we can. These very practices\n[824.72s] constitute the path.\n[827.279s] The promise of early Buddhism is not\n[830.88s] about ethereal states or mindblowing\n[834.16s] experiences.\n[835.68s] It''s about a profound and gradual\n[838.24s] liberation from suffering. One that\n[841.04s] manifests as the absence of greed,\n[844.24s] hatred, and delusion.\n[847.279s] So instead of asking, am I enlightened?\n[851.199s] The better question might be, am I\n[853.68s] seeing a reduction in greed, hatred, and\n[857.12s] delusion in my life?\n[859.76s] And when we ask this, keep in mind that\n[863.04s] external circumstances may weigh on how\n[866.88s] our progress appears to us. That is,\n[870.959s] some days, some years, it''s easy to be\n[874.56s] calm.\n[876.16s] Others, it''s not really so easy and we\n[879.279s] have to give ourselves more leeway.\n[882.48s] So, be compassionate with yourselves\n[885.519s] just as you would be with others in the\n[887.6s] same situation.\n[889.839s] Trust in the process and let the results\n[892.959s] speak for themselves over time.\n[896.24s] For a deeper dive into the fundamental\n[898.56s] problem that Buddhist practice aims to\n[900.959s] solve, see my earlier video on\n[903.76s] Buddhism''s first noble truth.\n[907.199s] And if you''re enjoying these videos, a\n[909.76s] like is always appreciated and feel free\n[912.32s] to subscribe if that''s the way you want\n[914.079s] to go. And we''ll see you on the next\n[915.92s] video. And meanwhile, all of you be"}'
