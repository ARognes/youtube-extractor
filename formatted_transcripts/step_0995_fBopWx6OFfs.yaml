transcript: "Clique ici si tu veux accéder à la communauté Gaspard Français en avant-première \U0001F449 https://gaspardfrancais.carrd.co/\n\n12 minutes d’immersion en français avec du comprehensible input pour apprendre du vocabulaire du quotidien et améliorer ta compréhension orale naturellement.\n\nDans cette vidéo, je me balade chez moi et je te montre simplement ce qui m’entoure : ma maison, mon salon, ma caméra, ma chienne et différents objets du quotidien. Un format proche d’un vlog français facile pour apprendre le français directement avec du contexte, des images et des situations réelles.\n\nCette vidéo va t’aider à :\n• apprendre du vocabulaire français du quotidien\n• comprendre le français naturellement\n• améliorer ta compréhension orale\n• retenir des mots grâce au contexte et aux images\n• t’habituer au français parlé\n• penser en français sans traduire chaque phrase dans ta tête\n\nJe parle de manière claire et naturelle et je te montre directement les objets et les situations dont je parle. C’est le principe du comprehensible input : comprendre le français grâce au contexte plutôt qu’avec une traduction ou une liste de vocabulaire.\n\n\U0001F449 Regarde une première fois pour comprendre globalement\n\U0001F449 Puis regarde une deuxième fois pour mieux retenir les mots\n\U0001F449 Essaie ensuite de répéter certaines phrases à voix haute\n\nCette vidéo est parfaite si tu es :\n• débutant en français\n• niveau intermédiaire\n• ou si tu veux apprendre le français avec du comprehensible input et des situations de la vraie vie\n\nVocabulaire de la vidéo :\nça brûle, un supermarché, le miroir, une caméra, zoomer, les volets, un petit rot, des lumières artificielles, de la lumière naturelle, le carrom, une table basse, une télé, un tableau, le canapé, le micro, ma chienne, ses croquettes, la baie vitrée, des gourdes, la buanderie, un sèche-linge, un couloir, un clavier, un maillot de bain, la petite icône\n\nSi tu veux apprendre le français naturellement a