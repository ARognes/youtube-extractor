transcript: '{"content":"\n[0.16s] Have you ever found yourself getting\n[1.68s] worked up in a discussion? Not because\n[4.0s] the topic mattered to you so much, but\n[5.92s] because it felt personal. The Buddha\n[8.48s] understood this syndrome well. Indeed,\n[11.679s] one of his most surprising teachings was\n[14.559s] to give up clinging to views, even to\n[17.279s] the right views. But what does it really\n[19.52s] mean to let go of your views? Are we\n[22.4s] then not supposed to believe anything?\n[25.039s] In this video, we''re going to look at\n[26.48s] the Buddha''s surprising and nuanced view\n[30.0s] about views, why it''s important, and how\n[33.52s] it can help us live better lives and\n[35.84s] make the world a better place. Having\n[38.32s] strong views and being opinionated is\n[40.8s] often seen as virtuous nowadays. People\n[44.0s] talk about speaking your truth or living\n[46.559s] your beliefs and so on. But the Buddha\n[49.2s] repeatedly warned not just against wrong\n[52.6s] views, but also against clinging to the\n[55.6s] right ones. This is one of the more\n[58.359s] counterintuitive and powerful aspects of\n[61.44s] early Buddhist dharma. But what exactly\n[64.32s] are\n[65.32s] views? The word for view or diti is\n[68.32s] often used in a negative sense to refer\n[71.6s] to those views that are incorrect or out\n[74.72s] of line with reality. However, in its\n[78.159s] broadest sense, the word view was used\n[81.36s] in early Buddhism to mean any and all\n[84.24s] views of the way the world was and in\n[86.479s] all\n[87.32s] beliefs, especially those that we\n[89.68s] identified with personally. As we''ll\n[92.32s] see, even right view, which is the first\n[95.36s] stage in the eight-fold path, is\n[98.079s] something that should not be clung to in\n[100.079s] this sense. But how are we supposed to\n[102.799s] hold our views if we''re not going to\n[105.119s] cling to them? Because the Buddha\n[106.96s] certainly didn''t intend for us to give\n[109.439s] up all of our beliefs entirely. The\n[112.0s] Buddha himself clearly had many views\n[115.28s] beginning with right view itself. I as I\n[117.84s] say the first stage in the eight-fold\n[119.68s] path and the four noble truths which\n[123.04s] each of them expressed a kind of a\n[124.799s] viewpoint about the way the world is.\n[127.2s] But the Buddha warned us not to identify\n[129.679s] with our views. Now what does it mean to\n[132.319s] identify with your views? It means among\n[135.36s] other things to take it personally or to\n[138.56s] get reactive when our views are\n[140.8s] challenged by other people. A key text\n[143.28s] here is the alagadupama suta which is\n[146.4s] the suta on the water snake or the cobra\n[148.8s] depending on how you translate it. It''s\n[151.12s] an incredibly rich suta with many\n[153.28s] simileies and points being made in it.\n[156.48s] Perhaps the one of the biggest points is\n[158.4s] the point that''s made in the title\n[160.16s] itself about the water snake. The simile\n[162.319s] of the water snake. Here the Buddha\n[164.8s] talks about somebody who wants a who\n[168.0s] needs a snake for some purpose. The\n[170.4s] Buddha says there are two ways to\n[172.48s] approach that snake. If we approach it\n[174.599s] incorrectly, if we grab it in the wrong\n[176.959s] way, the snake is going to turn around\n[179.28s] and bite us with very painful or\n[181.92s] possibly even fatal results. And this is\n[184.959s] a simile for an incorrect way to grasp\n[189.28s] the dharma. In this sense, the Buddhist\n[192.08s] says that we are the person who is\n[194.159s] grasping the dharma incorrectly is doing\n[197.519s] so for the sake of finding fault with\n[199.92s] other people and winning\n[202.44s] debates. This sort of grasp implies a\n[206.0s] poor understanding of what the dharma is\n[208.48s] really about. On the other hand, one\n[210.959s] could approach this snake, this water\n[213.599s] snake, in a skillful way and grasp it so\n[217.2s] that it cannot bite us. In that sense,\n[219.68s] in that way, if we grasp the snake\n[221.599s] rightly, we can make use of it to help\n[224.319s] us in whatever way we need the snake to\n[226.319s] help us. Now, the Buddhist says that\n[229.2s] this is comparable to the person who\n[231.519s] understands the dharma correctly, who\n[234.56s] understands the the various points made.\n[237.599s] And this sort of person, the Buddha\n[239.48s] says, examines their meaning with wisdom\n[242.56s] and comes to an acceptance of them, that\n[244.799s] is the points of the dharma after\n[246.72s] deliberation.\n[248.239s] He doesn''t memorize the teaching for the\n[250.08s] sake of finding fault in winning\n[251.64s] debates. He realizes the goal for which\n[254.319s] he memorized them because they''re\n[256.239s] correctly grasped. Those teachings lead\n[258.639s] to his lasting welfare and\n[261.96s] happiness. Note that the Buddha says\n[264.08s] that this person here comes to an\n[266.4s] acceptance of the dharma, but he''s\n[269.36s] implying that he doesn''t cling to it. He\n[271.919s] doesn''t identify with it. That is to\n[274.479s] say, he doesn''t become irritated when\n[277.28s] other people attack him. He doesn''t use\n[278.88s] it to attack other people, and he\n[280.88s] doesn''t get puffed up about it either.\n[283.199s] And here''s where we come to the crux of\n[285.52s] the matter when it comes to the the\n[287.56s] distinction between clinging to views on\n[290.32s] the one hand and holding them lightly or\n[292.88s] simply coming to an acceptance of them\n[295.36s] on the other. The person who clings to\n[298.08s] views is the person who identifies with\n[300.479s] them emotionally, thinkers thinks of\n[303.199s] those views as theirs, as their\n[305.479s] property, and so tends to take it\n[308.639s] personally when those views are attacked\n[311.039s] or uses them as a kind of a cudel\n[313.52s] against other people. As the Buddha goes\n[316.24s] on to say, \"So mendicants, if others\n[319.84s] abuse, attack, harass, and trouble you,\n[323.039s] don''t make yourselves resentful, bitter,\n[325.28s] and emotionally\n[326.759s] exasperated. Or if others honor,\n[329.039s] respect, revere, or venerate you. Don''t\n[331.6s] make yourselves thrilled, elated, and\n[333.6s] emotionally excited. If they praise you,\n[336.8s] just think they do such things for us\n[338.96s] regarding what in the past was\n[340.479s] completely understood.\"\n[343.6s] In other words, don''t take things so\n[346.44s] personally. The views that you''re\n[348.4s] expressing are simply the views that\n[350.16s] many other people have understood and\n[352.639s] expressed before you in the past.\n[354.479s] They''re not yours. They''re not your\n[356.44s] possessions. And perhaps the key simile\n[359.28s] in the Alagadupa Masuta, the most famous\n[362.36s] one, is the suta of the raft. The raft\n[366.479s] is the raft that we use to cross the\n[369.12s] river of samsara. The raft stands for\n[371.44s] the dharma itself.\n[373.759s] Even the dharma itself is not to be\n[375.759s] clung to. We''re to make use of it to\n[378.479s] cross the river of samsara to the\n[380.4s] farther shore of enlightenment. But once\n[383.199s] we get to that farther shore, we''re not\n[385.6s] supposed to carry the dharma around on\n[388.16s] our backs as though it were some kind of\n[391.24s] talisman. Instead, we''re supposed to\n[393.44s] leave it. That is to say, we''re supposed\n[395.28s] to not cling to it. But we might wonder\n[398.16s] why this clinging to views is so\n[400.96s] problematic, so dangerous. Well, it''s\n[404.0s] dangerous. Problematic for several\n[405.919s] reasons. The first of these we''ve\n[408.4s] already seen expressed by the Buddha\n[411.28s] where he says that if we cling to these\n[413.84s] or identify these views with with these\n[416.0s] views we tend to make ourselves\n[418.039s] resentful, bitter, emotionally\n[420.4s] exasperated or thrilled, elated and\n[422.88s] emotionally\n[423.96s] excited depending on how other people\n[426.56s] react to us. That is it binds our\n[429.68s] emotional states to the reactions of\n[432.4s] other people. And this is one of the\n[434.8s] ways that clinging to views, clinging to\n[437.599s] anything in fact, but certainly in this\n[439.199s] case, clinging to views is a kind of\n[442.12s] bondage. Clinging to views can also lead\n[444.96s] to argument, conflict, enmity, and\n[449.44s] suffering. As parties to a debate, each\n[452.639s] of them takes their position personally\n[455.12s] and uses it as a cudel to attack the\n[457.44s] other. Each of our arguments becomes a\n[460.72s] vehicle for conceit or the comparing\n[463.28s] mind trying to figure out if we''re\n[466.16s] better than them or they''re better than\n[467.919s] us, whether we can defeat them in a\n[470.16s] debate or whether they''ll defeat us in a\n[472.319s] debate. This\n[474.28s] personalizes our acceptance of views. It\n[478.4s] turns views into again a vehicle for\n[481.16s] conceit, for\n[483.479s] self-righteousness. In so doing, it also\n[486.72s] leads to a hardening around the views\n[489.84s] that we already hold, which can make it\n[492.479s] difficult or even impossible to give\n[495.039s] those views up even in the face of\n[498.12s] counterevidence. It also makes any\n[500.24s] attempt at deeper understanding of the\n[502.8s] truth much more difficult. As a result,\n[506.24s] this syndrome in psychology is known as\n[508.479s] the backfire effect. As one psychologist\n[511.68s] put it recently, being presented with\n[514.56s] facts, whether via the news, social\n[517.279s] media, or one-on-one conversations that\n[520.24s] suggest their current beliefs are wrong,\n[522.959s] causes people to feel threatened. This\n[525.76s] reaction is particularly strong when the\n[527.76s] beliefs in question are aligned with\n[529.839s] your political and personal\n[532.44s] identities. It can feel like an attack\n[534.72s] on you if one of your strongly held\n[537.04s] beliefs is challenged. Confronting facts\n[540.08s] that don''t line up with your worldview\n[542.72s] may tw trigger a backfire effect which\n[545.839s] can end up strengthening your original\n[548.0s] position and\n[550.6s] beliefs. In this sense, letting go of\n[553.839s] cling to views is part and parcel of\n[557.2s] letting go of conceit of eye making of\n[561.04s] mind making. We tend to think of our\n[564.0s] relationship to views of viewholding as\n[567.44s] a purely intellectual process. But in\n[570.88s] fact, as we see much of our holding to\n[574.48s] views is\n[576.2s] emotiondriven, is driven by our sense of\n[579.04s] personal identity and our sense of\n[581.519s] conceit of comparing ourselves to others\n[584.399s] around us and whose views we think are\n[586.88s] better or worse. We then feel personally\n[590.399s] attacked when our views are contradicted\n[592.88s] by someone else. Or we feel personally\n[596.64s] exalted and validated when our views are\n[599.92s] agreed to by people around us. Well,\n[602.72s] given all the pitfalls that we''ve seen\n[604.64s] with views, how can we use them\n[607.0s] properly? That is, how can we grasp this\n[609.839s] snake without it turning around and\n[612.16s] biting us? There are I have four general\n[616.0s] uh suggestions here. The first one is to\n[618.399s] take views\n[620.12s] provisionally. That is to say that the\n[622.24s] views that we hold, the beliefs that we\n[624.64s] hold, we hold given their usefulness to\n[628.8s] us, the way that they make the world\n[630.8s] easier to navigate in a better place.\n[633.519s] It''s not to hold them as necessarily\n[635.6s] absolute truths. Second, we can practice\n[639.36s] examining our views regularly. That is\n[642.64s] we can ask ourselves is this viewpoint\n[645.6s] of ours leading to greed on our part? Is\n[649.2s] it leading to hatred for others? Is it\n[651.6s] leading to various kinds of delusion? Or\n[655.04s] instead, is it leading us towards peace\n[657.6s] and clarity? Third, we can practice\n[660.12s] humility. That is\n[662.519s] practice considering for ourselves that\n[665.2s] our views, no matter how well-reasoned\n[667.6s] they may appear to us, are almost\n[670.24s] certainly\n[671.56s] incomplete and erroneous in some regard.\n[675.76s] Fourth, we can practice compassion. That\n[678.959s] is to try to recognize that other people\n[681.68s] around us with different views are also\n[685.12s] trying to do the best they can given the\n[688.0s] views that they have been presented with\n[689.76s] in their lives. That is the point of\n[692.8s] views as the Buddha says is not to win\n[695.839s] debates with other people. It''s instead\n[698.48s] to help lead us all out of suffering. In\n[702.56s] so far as a view isn''t helping in that\n[704.8s] regard, we should probably hold it with\n[707.12s] some suspicion.\n[708.72s] Views are essential to our practice.\n[711.6s] Indeed, the whole of the Buddhist path,\n[714.079s] all of the Buddhist dharma is expressed\n[716.399s] by means of views. All of the sutas are\n[720.8s] various views that are expressed to us.\n[722.88s] The eight-fold path, the four noble\n[725.6s] truths, and so on are all basically\n[728.68s] views compiled, numbered in front of us\n[731.92s] that we can make use of in in our\n[733.92s] practice. But crucially, we''re expected\n[736.399s] in a sense to outgrow even\n[738.76s] these. Now, this raft that we''re using\n[741.76s] to cra cross the river of samsara is not\n[744.959s] the sort of thing that we should abandon\n[747.2s] in mid river. Of course, that would lead\n[749.279s] to our drowning in samsara. But being\n[751.839s] aware of this, neither should we worship\n[753.68s] the dharma. We should simply be aware of\n[756.32s] it as a technique, as something we make\n[759.6s] use of to help end suffering. So my\n[762.639s] question to you is which of your own\n[764.68s] beliefs has felt sticky to you or\n[767.68s] somehow\n[769.079s] self-defining? Is there a way that you\n[771.2s] can help relax around those views? Have\n[774.079s] you found a way to do so in the past or\n[776.399s] can you see your way through to helping\n[778.48s] that right now? If you have a method,\n[781.2s] let us know down in the comments. And if\n[783.68s] you want to hear more about one practice\n[786.399s] of letting go of views by the great\n[788.88s] meditation master Ajan Cha from Thailand\n[791.839s] a while back talking about this idea of\n[795.04s] not being sure, a mind of of\n[797.72s] uncertainty. I have a video about that\n[799.92s] and I''ll leave a link to it up here on\n[801.6s] the screen. If you haven''t seen it or\n[803.04s] would like to refresh your memory, if\n[805.04s] you''re getting something out of these\n[806.16s] videos of mine, consider taking a look\n[808.32s] at my Patreon page, which is linked up\n[810.959s] here on the screen and down below in the\n[812.639s] notes, and see if you want to help\n[814.0s] support the channel and the work that\n[815.92s] I''m doing here. Thanks to you all, and\n[818.399s] we''ll catch you on the next video.\n[819.839s] Meanwhile, all of you be"}'
