transcript: '(Ident clicks) [Todd]: So Morrowind comes out. It''s beyond what we need. It''s a much bigger success than we anticipate. It''s huge. And it''s really huge on Xbox. The audience that wants this is much bigger than we think. Knowing that, what would we do with interfaces and things like that? What did we learn from Morrowind? What''s all the feedback now that the audience is much bigger? And there''s obviously a number of things if you compare the games. The other one was, we knew we wanted a tone-shift. We wanna do this thing in the Empire. We don''t want you to be the "prophesied hero" per se. You''re more the Lancelot to a King Arthur. So we''re gonna tilt back to some other things. And then, Microsoft, because of the relationship, gets us in early on the 360, and you see that machine and you''re like, "Woah." And we threw the technology rock. - [Ashley] Actually, that was a very interesting four years for us, because we were, traditionally, a PC developer all along even though Morrowind was on Xbox. It took us a while to really pivot. It''s hard for developers to do this. If you''re traditionally a PC developer and you start making console games It takes a different mindset. Oblivion was sort of our learning curve. That was our project to learn how to make games for consoles, how to make games run fast and look good within the constraints that consoles have. - [Emil] I remember one of the high-level goals – not officially, but we had been talking... If Morrowind was The Lord of the Rings trilogy, "the books", y''know? There''s a lot of text. Then Oblivion will be The Lord of the Rings movie trilogy. Much more visceral. A different aesthetic. More colorful. More accessible in a lot of ways. - [Craig] Er, we were working on it for the Xbox 360 at the time. Which was not actually out. So we were working on hardware that was not done yet. So anytime you don''t know what the game is yet and you don''t know what the hardware is, that combination can prove ... stressful (laughs). That, and then how do we take a huge, open-ended roleplaying game that''s traditionally been on PC... They put Morrowind on console, but the next evolution of that. The controls, and the feel, and what things you leave in, what things you take out to make it have the most appeal, but still keep the depth. - [Ashley] It swings more traditional fantasy. So in Oblivion it''s more castles and lots of shiny armor, a beautiful world. We wanted to do forests. We wanted, y''know, lots of NPCs, lots of people. They all have full schedules, they''ll eat, they''ll sleep. - [Danny] Oblivion was a very intentional pivot to something more accessible, and this wasn''t without a backlash. Some fans of Morrowind saw it as a dumbing-down of their favorite RPG. Many elements of the game were simplified. There seemed to be less. Less skills, less weapon types, less factions and diseases. Having voice-acting for every line of dialog meant less speech options. Morrowind had been an incredible RPG sandbox, but with the dawn of HD graphics, Todd and the team had to pick their battles. They wanted a bigger world, they wanted far more detail, they wanted a more simplified interface that would work on consoles. They wanted to bring fantasy into the mainstream and that meant paring back. But the team was still small, and all this work required to make Oblivion the game they wanted to make, wasn''t without its challenges. - [Matthew] So the forests for Oblivion were really interesting. We used SpeedTree. We were, I believe, the first videogame company to use SpeedTree. - [Danny] No way. - [Matthew] Yeah, and it worked incredibly well for us, it was great. But what we ended up doing, is we used all the SpeedTree assets, and we''d bake them out and we''d put them in the game, and we created a procedural generation system. So we generated each area of the game, and made it. And it turned out it wasn''t so good. So all the artists then, basically, did a "terraforming pass" where we''d go over the procedurally generated work, and make it hand-crafted. And it took two years to do. - [Danny] Right. - It was an insane undertaking, and we had to really ramp-up the team of environment artists to come do that. - [Craig] We knew what we needed to make, we knew the number of towns, but okay, this town has how many buildings, how many NPCs, how many interiors, how many exteriors? Like, all the details. So it used to be, "Well, we need a town, somebody make it," and then the artist would go off and make it, and the designer would help design it, and then you''d have your town. So it was really, from that to now, it''s very much more designed out as far as how big the town is, how many buildings are in it, what it''s made up of. The way we designed the dungeons, some of them are for quests and some of them were more randomized, and then we had the Oblivion realm. So it was like, "Okay, making dungeons is obviously a big part of this," and it sort of separated there. And then figuring out how we were gonna make all the Oblivion realms. I remember that as a key part on the schedule. We had our game and our date, and we knew what we were doing, but the Oblivion realms, we still hadn''t quite figured out what they were. - [Danny] During this stage at BGS, there was no delineation between designers. Level designers were also quest designers, and as the game got more complex, this was beginning to cause issues. Elements of the game were getting trimmed in an attempt to make the Xbox 360 launch date, and in some cases, to even fit the game on the disc. - [Emil] So in the shipped game, there''s an arena in the Imperial City and the original plan was there was going to be an arena in every city. And I had done the majority of that work, and we cut- We ripped it all out. Because we realised we needed to focus on one to make it better. That was painful. That was 800 lines of dialog. That was all the scripting work. And it was definitely the right decision, absolutely. It was fun to do all the fighting, and fight, and become a champion But I actually really enjoy, when I play it, just betting on a fight and watching, and finding all the weird bugs with that. I would set it up so that the two combatants, it would be a Nord woman and an Elf guy, and they would... I''d look at the script, they were always really evenly matched, and invariably one team would always win, and it was supposed to be random and I didn''t know why. And I wasn''t taking into account some of the racial abilities. Like, Nords are stronger! - [Danny] Right. - So this guy was beating the crap out of this person, and I didn''t... So I had to figure out all that stuff. - [Danny] The Khajits were always losing! (Laughter) (combat noises) - I''m like, what do I do? How do I draw upon what I know? Y''know, "write what you know" is a big thing, and I don''t know much about being a medieval assassin, so... But I was raised Catholic, and so the entire structure of the storyline and the lore in the Dark Brotherhood in Oblivion, is really a twisted bastardization of Catholicism. - [Danny] Right. - Their Sithis is God, there''s the Night Mother as Mary. So it was really easy for me to just, like, "Let''s take this, make it evil," and turn those dials and flip those switches and it just all fell into place. - [Danny] Right? That probably says more about Catholicism than me, but I don''t know. - [NPC] "You sleep rather soundly, for a murderer. That''s good. You''ll need a clear conscience for what I''m about to propose." - [Emil] The funny thing about the Dark Brotherhood, it is... Unlike a lot of trends in assassin games, there''s not a lot of moral ambiguity, actually, it''s like, "You''re a murderer and you get paid for it." So how do I make that acceptable? So a lot of times the people you''re killing, they deserve it. You now what I mean? It''s sort of the Dexter thing, where they''re scumbags. But a lot of times, there was this term we used: "Deliciously Evil". And you just have to have this really dark sense of humor about it. So when you''re sent to kill someone, you find the dark humor in that. You have to lighten it up in parts and not make it too dark, because then you dwell on, really, I''m a horrible murdering person. Y''know? - [NPC] "Welcome brother. So good to finally meet you. "I hope you''re getting along all right." - That was part of it, like, let''s make it a family of rejects. There''s the vampire guy over here, there''s the cat who hates you until then, at the very end of the game, he decides he''s been wrong and he likes you, and then you come back and he''s been horribly murdered. Y''know? Little twists like that. - [Matthew] So, for us, for Oblivion, compared to Morrowind, the biggest thing is scale. Morrowind''s actually kind of a small game and if you actually look at the draw distance, it''s foggy pretty much right in front of the player. We didn''t have LOD. There were no mountain views in Morrowind, so for Oblivion it was, "Hey, you''re in this giant valley. "You can see the mountains everywhere." And that''s what started the whole, "If I can see it, I can go there and explore it." That really happened in Oblivion. That initial view, when you come out of the dungeon, from character generation and see the world, and see the water, and see the ruins reflected in it. We spent a lot of time on the framing of that, how the water looks, how the mountains look, to know that, "Hey, welcome to this world, "go do whatever you want in it." - [Ashley] Elder Scrolls games are like kitchen-sink games. There''s so many systems, so much crafting. There''s magic... There''s all these different systems that have to interact together. There''s cities you can explore that are teeming with people. There hasn''t been a nuclear annihilation yet! (Laughs) Everything''s still there, everything''s still beautiful. - So we started getting into this thing, we realised the guards are the best... We started doing this in Oblivion: The guards are the best reflection of the character, so they comment on you. They comment on what you''re wearing, your accomplishments. Like, "Hey, I heard you did this thing." And it gets really tough with stuff like the thieves'' guild. "Did I see you sneaking out of that house?" Y''know? - [Mark] The voice cast in general had not been figured out, other than, let''s bring folks back from Morrowind who we like. Michael Mack, the voice of the Redguards, and so forth. - [NPC] "You want to be a combatant? Wait, you''re serious aren''t you?" - Cast a few more people to fill in the space or change up cast from before. - [NPC] "Ooh, look, a fly. Buzz buzz. "Hey, look everybody! I''m talking to a fly! "Buzz, buzz, buzz." And, all in all, it''s 10 or 11 actors for what, I think, started out as 60/70,000 lines of dialog, and eventually we had to trim that down to 40/50,000 it shipped with? Because it physically, at the time, we could not fit it on the disc. It was just too much, something had to go. - [NPC] "You''re a big fat liar." - [NPC] "Brother Jaufree? He should be in the the Priory House, I think." - [NPC] "I don''t see any good options here." - One actor per race/gender, and some are even shared. I think the male Nord and the male Orc are the same guy. And, originally, they were gonna be different, and we had to combine them. And it was just pure disc space. Whereas now, we just tack on another archive that you can download. It''s all down to your local hard drive space on your console or whatever you''re playing on. So it''s a lot of ground covered by very few people, so days, and days, and days of just "Imperial Male" with Wes Johnson, our local voice actor. - [Emil] In fact, I always forget his name, but one of our voice actors, I see him once every two months at the Dunkin'' Donuts down the street. - (Laughs) - I swear to god I always mean to say hi to him, and I can never remember his name It''s so embarrassing. - [Danny] And he goes: "Halt!" - (Laughs) And I''m like... Next time. (Combat sounds) - [Danny] Oblivion''s four-year development cycle was tough on the team. They had doubled in size, trying to keep up with the workload, causing them to miss the Xbox 360 launch by four months. But this delay probably only contributed to Oblivion''s success. By the time the game arrived on store shelves console-players were foaming at the mouth to get their hands on this game. The scale of Oblivion was something that had never been seen on consoles before. And while some of the Morrowind fandom may have felt that the game had been overly simplified, Oblivion struck a chord with gamers in a way that no RPG ever had before. Not only was this a red-letter day for the open-world console game, but it tapped into a love of the fantasy genre that had never had its mainstream moment. You could argue that the release of The Lord of the Rings films had helped, or perhaps they had just tapped into the same thing. - [Todd] I think there are certain things that people just always like, and there''s nothing wrong with re-presenting it. The image they have in their head of, "I''m in a fantasy world." You have this image in your head, and as you change and technology changes, it''s still awesome, right? We don''t need to say: "We shouldn''t do that, we should do something totally different." The Lord of the Rings had come out and gotten very popular in that window. But I think the technology... It was the first, big, open-world game that anyone could play. (Ident clicks) (click)'
