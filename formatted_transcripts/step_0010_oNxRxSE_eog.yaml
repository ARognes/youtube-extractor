 a little too smooth. >> [laughter] >> You know, and so I think there was probably a little bit more friction than you're communicating. And so like if we can just have like maybe a little bit more like but >> Mhm. >> rather than um and then. >> Yeah. >> If if that makes sense to you. >> No, I there's definitely friction in the in those types of things. Anytime you're asking another team that's already past planning, you know. >> Yeah, so maybe we bring that in. >> Uh, you know, so it's like all right, you're past planning, you've already committed to your stakeholders on your side, and now you're either going to have to decommit something or work this work in, you know, somehow. >> Yeah, so I think maybe we don't want to belabor it, but just be like it's not just that we were deprioritized. It's like at Microsoft we do these big upfront plans. >> Mhm. >> And so they every team has a bunch of stakeholders, and there's a whole bunch of stuff we end up having to cut. And so the stuff that we commit to and prioritize, like those tend to be high priority things. >> Yeah. >> You come in and you're basically like, "Hey, let's do auto approvals. Like, let's just do all this stuff." It's like, "Where were you when we were doing our planning?" >> Yeah. >> Well, you didn't know that you needed to do it when the planning had occurred. So, you come in like the Kool-Aid Man. >> Yeah, yeah. >> And you're like, "Hey guys, like we want to do all this stuff." They're like, "Hold on, guys. Like, we can't do this, right?" And so I think it's just adding a little bit of that to it. And if you know like what their road map was, cuz typically the things that they're prioritizing, sometimes you need to be like, "Yeah, that's actually way more important than the thing >> Yeah, yeah. >> that I'm asking for." So, if you can get a give a sense of like what those priorities are. Another thing is often times there's a miscommunication about the level of effort. And so, when you come in and you'