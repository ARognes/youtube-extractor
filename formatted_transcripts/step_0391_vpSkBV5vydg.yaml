yllable from the parts. And of course, if you make a mistake, you can press backspace to delete part of a syllable. Now, if the code points for those final syllable characters were allocated randomly, this process of building up a syllable from consonants and vowels would actually pose a significant computational challenge. You'd essentially have to implement a gigantic set of tables sort of reminiscent of a huge switch statement that encoded every possible sequence of combinations and mapped them to their final code point. And so to make this process easier, the Hungle syllable block actually has some very clever internal rules. There's a simple mathematical formula that you can use to derive the code point of a syllable from the code points of the consonants and vowels that it's comprised of. This syllable here would traditionally be romanized as either kim or gimm. It's the first syllable in kimchi as well as the most common Korean surname Kim. Let's break this down using the formula. We take the first consonant and get its value in the first table and multiply it by 588. Then we take what's called the medial, which is this vow e, look up its value, multiply it by 28, and add it to our current total. We then add the value of the final consonant m from this table. And then finally, we add the start of the unic code hungle syllables block, which is 44,032. That gives us a total of 44,68, which converted to hexadeimal is AE40. And if you go and look up u + ae40, you'll find the unic code character for the entire syllable kim. Pretty cool, huh? Just as a small aside, a couple of years ago, I built a little puzzle game where the main mechanic is splitting and combining hungle syllables. So, if you want to check that out, I'll put a link to it in the description of the video. Of course, Korean isn't the only language with a clever internal implementation. There are lots more secrets hiding in the Unicode standard. I hope this video demystified the topic of Unicode and 