transcript: You got into Amazon, and then you quit after 2 months. >> The team I was specifically in, and I think Alexa the Oregon general was not the best place. It was not a well-oiled machine. A lot of manual stuff going on. It was a really stressful environment. I saw people, and I'm not saying one person, every one of the experienced engineers was committing 3:00 a.m. And we have like 8:00 a.m. or 9:00 a.m. meeting in the morning tomorrow. And some people are reviewing the PRs at the same time. I don't think the manager told them you have to do this. Like implicit. You kind of know that it's a stressful If you're the one person who's not doing it at 3:00 a.m., you're going to be the first in line to maybe get kicked out of the company.
