transcript: "freeCodeCamp is excited to livestream one of the top React conferences in the world -- Reactathon! \n\nFull details: https://www.freecodecamp.org/news/rea...\n\nReactathon is known as the San Francisco React Conference, and takes place each year in March in downtown San Francisco, CA. This year, however, they had to postpone the event due to the crisis, and are now taking it online! The event takes place over three days on Dec 7, 8, and 9 from 9:00am PST - 2:00pm PST. You can see the full schedule at https://reactathon.com \n\nYou can watch this live stream for free but there is more great content available if you register for the live interactive event at https://hopin.to/events/reactathon-20... \n\nToday’s livestream features talks from: \n\n\U0001F449 Kent C Dodds - Software Engineer & Teacher, KentCDodds.com\n\U0001F449 Tejas Kumar - Head of Vetting, G2i\n\U0001F449 Daria Caraway - Software Engineer, Workday \n\U0001F449 Naomi Meyer - Software Engineer, Adobe\n\U0001F449 David Khourshid - Software Engineer, Microsoft\n\nSee the full schedule + talk descriptions at https://reactathon.com \n\n--\n\nLearn to code for free and get a developer job: https://www.freecodecamp.org\n\nRead hundreds of articles on programming: https://freecodecamp.org/news"
