transcript: '{"content":"\n[0.32s] When we face a crisis in life, let''s say\n[3.439s] a sick relative, a financial collapse,\n[6.799s] some kind of terrifying diagnosis,\n[9.679s] one very human impulse is to look up and\n[12.559s] ask for help. That is, we pray, we\n[16.0s] petition, we bargain. People have been\n[18.96s] doing that for millennia. In many ways,\n[21.92s] we can see it as the default mode of\n[24.08s] religion.\n[25.6s] But what did the Buddha say about all\n[27.359s] this? Did he tell his followers to pray\n[29.84s] to him or to the gods for salvation?\n[33.52s] The answer is fascinatingly complex.\n[37.52s] While the Buddha didn''t deny the worship\n[39.68s] of gods for worldly ends, he was\n[42.719s] remarkably strict about one thing. That\n[45.6s] is, you cannot pray your way out of\n[47.6s] suffering.\n[49.6s] Today we''re going to look at why the\n[50.879s] Buddha shifted the focus of practice\n[54.079s] from petition, that is asking for\n[57.52s] results from a higher power who can\n[59.76s] grant it to us, to causality,\n[63.44s] that is creating our own results.\n[67.36s] And we''ll see why the Buddha argued that\n[69.439s] even the gods can''t save us from our own\n[72.4s] actions.\n[76.4s] In one early suta, the Buddha directly\n[78.799s] discusses the role of prayer in\n[81.28s] practice.\n[83.04s] He lists five things that everybody\n[85.92s] wants. A long life, beauty, happiness,\n[90.4s] fame, and a heavenly rebirth.\n[94.0s] But he says these five things are hard\n[97.04s] to get.\n[99.2s] These things, he says, aren''t gotten\n[101.119s] simply by praying or by wishing for\n[103.84s] them? If they were, who would lack them?\n[107.52s] He asks.\n[109.759s] That is, life doesn''t operate like a\n[112.479s] magic lamp whereby we get what we want\n[115.36s] just by rubbing its side and making a\n[118.0s] wish. If it did, nobody would lack for\n[121.439s] anything.\n[123.28s] Now, the Buddha doesn''t say that it''s\n[124.799s] wrong to pray, only that it''s\n[127.04s] ineffective, at least for the really big\n[130.08s] stuff. His is a pragmatic objection, not\n[134.319s] a kind of hard rule.\n[137.68s] Instead of prayer, the Buddha recommends\n[140.16s] action.\n[141.76s] The path of practice.\n[144.16s] If you want a long life, you should\n[147.2s] practice what leads to a long life.\n[151.04s] For example, we might say eat well,\n[153.68s] exercise, live with kindness towards\n[156.08s] others and avoid violence.\n[159.28s] Similarly with the other four things\n[161.519s] that everybody wants. If you want a\n[164.4s] certain fruit, you need to plant the\n[166.8s] appropriate seed and then act over time\n[170.4s] to cultivate that seed.\n[175.599s] This brings us to perhaps the Buddha''s\n[177.599s] most important argument against the\n[180.239s] prayer model, that of the deep lake.\n[184.4s] In this suta, Aibandika''s son, who\n[187.519s] apparently is a chief of some kind, goes\n[190.08s] up to the Buddha and challenges him.\n[193.599s] The chief says that there are brahinss\n[197.36s] who through their petitions of the gods\n[200.879s] can ensure that somebody who passes away\n[204.08s] is reborn in a heavenly realm.\n[209.04s] But he says what about the blessed one,\n[211.519s] the perfected one, the fully awakened\n[213.36s] Buddha? Is he able to ensure that the\n[216.56s] whole world will be reborn in a good\n[219.28s] place, a heavenly realm, when their body\n[221.76s] breaks up after death?\n[224.64s] The Buddha''s response includes a couple\n[226.879s] of incisive simileies.\n[229.519s] He says, \"Chief, suppose that a person\n[232.959s] were to throw a broad rock into a deep\n[235.92s] lake and a large crowd was to come\n[238.959s] together to offer up supplication and\n[241.68s] intreaty, circumambulating it with\n[244.319s] joined palms and saying, \"Rise, good\n[247.2s] rock. Float, good rock. Float to the\n[249.84s] shore, good rock.\" What do you think,\n[252.48s] chief? Would that broad rock rise up or\n[255.28s] float because of their supplications?\n[258.72s] Similarly asks the chief, \"If you were\n[261.04s] to throw a pot of oil or ghee into the\n[263.52s] deep lake such that it would break, and\n[266.32s] a large crowd were to offer up\n[268.24s] supplications, asking that oil to sink\n[271.68s] to the bottom, would it sink or instead\n[274.96s] would it rise to the surface?\"\n[278.32s] In both cases, the chief admits that the\n[281.28s] supplications would have no effect. the\n[285.199s] rock would sink never nonetheless and\n[288.479s] the oil would float regardless.\n[292.88s] In the same way, says the Buddha, a\n[295.52s] person who acts unethically by killing,\n[298.24s] by stealing, committing sexual\n[300.4s] misconduct and so on will sink down\n[303.36s] because of it, even if a crowd of people\n[306.0s] makes supplications in their favor.\n[309.199s] And a person who acts ethically by\n[311.919s] avoiding such wrong deeds will rise up\n[315.68s] because of their good actions. Even if a\n[319.44s] crowd of people make supplications that\n[321.68s] they should sink down.\n[324.56s] This for the Buddha is the law of karma.\n[327.759s] If your actions are heavy or harmful, no\n[330.8s] amount of prayer is going to make you\n[332.4s] rise to a beneficial future life.\n[336.08s] If your actions are light or virtuous,\n[339.28s] no amount of cursing you is going to\n[341.199s] make you sink down.\n[344.0s] So the Buddha''s insight here is that\n[346.72s] prayer cannot override the essential\n[349.919s] moral physics of the universe.\n[355.199s] Now we''ve got to be a bit careful here.\n[357.68s] The Buddha did believe in a world of\n[359.68s] powerful deities and spirits. He did not\n[362.72s] deny that such things existed. He only\n[366.24s] held that they were mortal and\n[368.72s] imperfect.\n[370.56s] In fact, in at least one suta, the\n[372.72s] Buddha tells us\n[375.12s] chants, recitations, fine sayings,\n[378.72s] charity or traditions, if by means of\n[381.84s] any such things you benefit, then by all\n[384.8s] means keep doing them.\n[388.24s] That''s to say, if by supplicating the\n[391.199s] right deity, you''re able to gain worldly\n[394.0s] ends, then if those ends are what you\n[398.16s] want, you can go right ahead. The Buddha\n[400.96s] was not being dogmatic about this.\n[404.0s] However, and this is key, the Buddha\n[406.88s] view deities basically like we might\n[409.6s] today view billionaires or powerful\n[412.639s] politicians.\n[414.72s] You can indeed petition such a person\n[417.12s] for something like a tax break, an\n[420.16s] investment opportunity, a chance at\n[422.72s] fame, or some such worldly end.\n[426.72s] But you can''t petition them to provide\n[429.36s] you with inner peace or freedom from\n[431.36s] craving.\n[433.12s] Or if you did, you can bet that it\n[436.319s] wouldn''t be successful.\n[439.199s] From a modern perspective, we might view\n[441.36s] this kind of petition or prayer just as\n[444.319s] setting some kind of basic intention.\n[448.8s] But even so, for the Buddha, the\n[451.599s] ultimate goal of Nirvana was completely\n[454.16s] outside of the jurisdiction of the gods.\n[459.44s] So if our practice doesn''t involve\n[461.919s] praying for salvation in early Buddhism,\n[464.96s] what is the role of so-called faith or\n[467.68s] sadda in Pali? Well, sadda in early\n[471.44s] Buddhism functions basically like\n[474.24s] confidence.\n[475.759s] It''s not a kind of trust that some deity\n[478.8s] or another nor even that the Buddha is\n[481.68s] going to save us.\n[484.24s] Instead, it''s a trust that the map of\n[487.12s] practice that the Buddha presented us is\n[490.16s] accurate.\n[492.0s] It''s sort of like going to the doctor.\n[495.039s] It''s your trust in the doctor that makes\n[497.84s] you take the medicine that he\n[499.36s] prescribes.\n[501.12s] You can''t simply pray to the that the\n[503.84s] doctor is going to cure you while you\n[506.24s] refuse to swallow the pill that he\n[508.319s] provides.\n[511.68s] So the Buddha''s teaching ultimately\n[513.76s] moves us from a kind of a parent child\n[517.039s] relationship with the universe whereby\n[519.599s] we''re petitioning higher powers for\n[522.08s] things that we want or need to more of\n[524.959s] an adult relationship whereby we take\n[527.6s] responsibility for our own actions.\n[531.92s] It can indeed be scary to realize that\n[534.8s] there''s no guarantee that anybody is\n[537.68s] going to come and save us at the right\n[539.519s] time, but it can also be incredibly\n[542.959s] empowering to realize this. It means\n[545.839s] that the steering wheel is always going\n[548.24s] to be in our hands.\n[550.8s] Now, if you want to hear more about the\n[552.8s] role of faith in early Buddhist\n[554.8s] practice, I''ve got an earlier video\n[557.2s] about it that I''m going to leave up here\n[558.64s] on the screen in a moment.\n[562.08s] Meanwhile, what is your approach to\n[564.56s] Buddhist prayer? Indeed, prayer has a\n[567.6s] significant place in much later Buddhist\n[570.959s] practice. As I always say, there''s no\n[573.76s] wrong answers here. I just want to know\n[575.76s] your thoughts, how it works for you.\n[578.399s] Thanks so much for watching and for your\n[580.56s] continued practice. We''ll see you in the\n[583.36s] next video, I hope. And of course all of\n[585.279s] you be"}'
