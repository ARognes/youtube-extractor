transcript: remember monomers that group of black plaids keyboard wielding masked Marauders famous for their hacks against the Church of Scientology the KKK and even Isis now I don't know about you but I haven't heard from them in a while there was a time when they were seldom absent from the news the mainstream media loved the intrigue of this elusive activist group however in the past three years they've been pretty silenced their annual million mask March has faded into insignificance their Wikipedia page once dense with details of their operations abruptly stops at 2016 so what happens to anonymous well this is a story of betrayal infighting and coming of age which we'll get to right after this mal Tronics calm is a site I own and run we sell a range of hobbyist hacker gadgets from Wi-Fi the author's too bad USBs from USB protectors to Wi-Fi key augers the next 20 orders get 10% off everything with code and on one two three we ship worldwide so come over look check it out in the description mal Tronics calm so before we get to theories of what happens to anonymous let's recap what is or what was anonymous well to call anonymous activist group would be somewhat misleading they're not a group they never have been they have no structure they have no leader instead they're a collective a group of people loosely coupled around a set of ideas a set of values they oppose internet censorship and government control and advocates for privacy and freedom of speech keep in mind anyone can identify as anonymous so when we ask what happened to them we're not necessarily asking what happens to any specific hackers but rather what happens to the collective as a whole what happened to the values the ideas that people wants used to stand behind why are people no longer choosing to identify with anonymous well a vice interview from 2017 with an apparent anonymous member gives us some clues according to the anonymous member they had a pretty powerful team in 2011 all of these core hackers were very skilled they knew their tools but after that Sabu ratted them out you see Sabu was a founding member of lo sake and offshoots of anonymous a pretty important guy he went on to say no one trusted each other anymore within the movement so this founding member Sabu turns to the dark side pretty quickly after being arrested by the FBI within 24 hours he agreed to become an informant he agreed to rat out his fellow LulzSec members one by one almost all of the LulzSec members were identified arrested and many sent to prison it's easy to see why trust was in such short supply after that if one of your core if one of your founding if one of your leading members pin turn and snitch on the rest of you so easily then how can you have confidence in the loyalty of anyone else and Claridge's make an off topic observation I didn't realize anonymous masks now come with notches it's it's ironic anonymous rails against the status quo against the establishment though he's literally wearing a symbol of consumerism on his forehead sorry I just found that kind of amusing anyhow in the beginning it wasn't obvious that anonymous would go on to become one of the most notorious hacktivists collectives of all time some of the first news articles I could find referencing anonymous as an entity were back from 2007 though at this time that they weren't really involved in activism but more mass organized trolling there's many examples of anonymous as trolling but one of the most infamous was the habbo hotel raids where Imams would log in to the game and then dress up with an afro and a suit and proceeds to block the entrance to the in-game pool why you ask - for straight people to piss them off because their reactions were priceless this became known as the pools closed meme and I won't get too much into it because we could just do a whole video on on that though it did actually spill into real life people started physically like IRL dressing up with a suit and an afro and going to the habbo hotel offices in Finland where they would organize themselves into human swastikas why well not because they were Nazis but rather because it was just funny they did it for the lulz however anonymous as actions did become increasingly political for example in 2010 WikiLeaks released a treasure trove of leaked US diplomat cables it was international news as a result PayPal started to refuse to accept donations on behalf of WikiLeaks anonymous wasn't too happy about this and in retaliation they launched a slew of DDoS attacks against PayPal however it was the 2016 presidential election that threw a spanner in the works Anonymous quickly declared total war on then presidential nominee Donald Trump coined opt Trump they vowed to dismantle his campaign by hacking his campaign websites and leaking personal details however nothing came of this vice interviewed representatives of your anon news which is supposedly the group's most well known voice online they said we believe that major anonymous operations simply did not take place because of the divide of the collective on the political spectrums the u.s. election pitted friend against friend mother against son it did the same within anonymous as many activists became caught up in the debate instead of remaining true and steady against the establishment in my research I joined an anonymous link to IRC and asked what happens to op Trump now someone was quick to inform me that there was actually an op Hillary as well and if you scour the web that you'll find many examples of anonymous related to anti Hillary Clinton sentiments so the political divisions within anonymous are obvious and while researching for this video I found many other examples of confusion within anonymous message in this video from the 2018 million mass march in London you can hear people yelling F the police but other people holding signs calling for increased police spending additionally your anon news that supposedly prominent anonymous related news source tweeted support for brexit in the past but it's now retweeting Pro remain propaganda so it's all very confusing and it's easy to see why the movement died out if people couldn't agree on what Anonymous's ideals were then was there any hope for the long term structural integrity of anonymous before I started making this video I asked you guys what you think happens to anonymous and a prevailing opinion was that they just grew up now there is some logic here a lot of the LulzSec members when they were arrested we're either in their late teens or early 20s if we assume similar demographics for anonymous as a whole many of these people will now be in their 30s they'll have jobs have kids have families have mortgages to pay there's just other things they're worried about now another thing I had in my notes here is that Anonymous did become a bit of a bit of a meme even when looking for stock footage for this video the first results was titled anonymous hacker in his mom's basement there's a bunch of other anonymous related memes floating around the internet so if you're serious about your hacktivism why would you choose to use a name which comes with so much baggage so I'm super interested to hear your guys's opinion what do you think happened to anonymous where did they go and do you think they will ever come back well let me know in the comments and as always if you liked this video remember to hit that like button subscribe if you haven't already and as always stay tuned for hacking videos have a good one
