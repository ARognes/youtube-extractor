e doing?" >> I guarantee you if you run Amachi and you open that thing in the airport and you just let the screen saver run or you open a few terminals or something, it's going to look exactly like that. People are going to go, "What is that?" >> So, I can get behind this because like Arch, I'm like Arch sounds cool. Ricing sounds fun. I don't have time for that. That's why I stick with Ubuntu. That's why I do that. So, you this Amachi's like, "We riced it for you, have fun. >> Yes. Yes. I literally have invested over the past year probably 3,000 hours in making this system perfect. Not because I want to do that all the time, exactly because I don't want to do that all the time. I want to make this one-off investment and and one day I'm going to be done and I'm going to retire on a little hill and just use my little Amachi system. >> No, you're not. No, you're not going to. >> I'm going to build the perfect system so that you, who just want a super cool computer, who doesn't work like Windows, doesn't work like a Mac OS, it looks a million times better than either, is ready to use in 1 minute. One effing minute. This was one of the things I got really obsessed about when I got I got two new computers recently. I got a Mac and I got a Windows machine. And first with the Windows machine, it literally took me an hour and a half from unwrapping it before I had gone through all its updates and driver updates and this and that and updates and I was just like, this is a brand new computer. How is it possible that it takes god damn 90 minutes from when I unwrap it until it's ready to use? And it is not even ready to use, right? You install Windows, it has none of the apps you want. Everything then has to be downloaded with your little mouse again. You go to this website, you download this app and you click this install and you sit AND WAIT LIKE, WHAT? This is just not how computers have to be. And then I thought, do you know what? At least Apple, they have this figured out.