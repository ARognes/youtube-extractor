ython original, that launches in 2 milliseconds instead of 86 milliseconds, and and now it's running as this autonomous project. Yesterday, I saw there was two pull requests pending towards TTFX, as it's called. And I just told my agent, "Hey, check out the pull requests. If they look good to you, patch them up, make sure they follow our style, merge them in, cut a new release, push the new release to the repo, and just let me know when you're done." And walla balla dalla, it was done, and 0.31 was out. It had tagged a release on GitHub. It had written up the release notes. it had pushed out the binary, and was ready to use. Now, would I do that with everything? No. TTFX is a is an effects library. If that breaks, then it just means that the screensaver is maybe a little more green than it should be blue or whatever. It's not a big deal, right? I think eventually we're going to get that to that place with a lot more things, and we're going to start trusting the AI to automate a bunch of things. Now, again, it's not without risks. Anyone who saw the latest jailbreak video from OpenAI where they detail how their in development model escaped the sandbox and did a bunch of things would go like, "Ah, okay, like maybe we don't give it access to everything just yet." But, I want to be forward with Quattro. I want to be forward with Umachi, and I want to lean in. I want to go like, "How can we push this?" Agents are rewriting how developers and everyone else really think about software. What is software? How do we change it? How do we make it? Who's allowed to make it? Who's allowed to change it? And we should have an operating system and a distro that just goes like, "Yeah, for the people who are really into that, want to see what the future looks like, they should come to Umachi." >> So, who would you say Umachi is for? What what users are you targeting right now? >> Anyone who either already loves their computer or who is interested in loving their computer. Now, I think this love notion is is actually a good bar here because it does not encompass even all the programmers. I have met programmers in my life who don't actually particularly like computers. They are mildly annoyed by the fact that this is actually their job, and they kind of hate when the computer doesn't do what they want to do, and so forth. And I don't think Umachi is for them. I also don't think Umachi is for people who just who don't give a damn about a computer, who's not interested in investing any time in learning how it works. So, for example, Ubuntu is unapologetically keyboard intensive. It is made to be driven exclusively, more or less, by the keyboard. Everything is reachable by a hot key, and everything is tappable. You do not have to reach for that mouse for anything but, I don't know, scroll a webpage. Now, you can reach for the mouse. It's also mouse accessible, but most operating systems are the other way around. They start with the mouse, and then they say, "Yeah, I guess you could also use the keyboard." We go the other way around and say, "We start with the keyboard, and then, yeah, you could also use the mouse if you wanted to." So, that requires an investment. It requires learning some hot keys. It requires a bit of practice, and it's not going to be immediate out of the box, because I think most operating systems correctly prioritize learnability. Um, is this easy to to get started with? Do I have to know anything at all? No? Okay, that's great. Then people can figure it out. That means they stay with all the paradigms that everyone already knows. They try not to sort of be too adventurous in how they move things around. For Ubuntu, I just went the other direction and said like, "No, we're going to optimize for usability, and it's okay if it takes a couple of days to learn your computer." This is a computer system made for pros, and I mean that in the sense of professional computer lovers. People who are willing to invest time and energy into learning how their system works, and reap the benefits that come from that investment. So, if we do it that way, it's okay if when you open a window, there's not a visible close window button. Like, that's one of the things, for example. I hate those three little dots that every window has had since the beginning of time on every operating system. Like, there's none of that. You have to learn that super, which is the same as the Windows key or the command key, super W closes a window. You learn that once, and now you never need to try to hunt for the the X up in the corner again with your with your dumb little mouse. You just hit super W and boom, the window's closed. And that's the kind of trade-off where someone who comes to this who's not willing to learn the keyboard, they're going to go, "How do I close the window?" I'm like, you learn how. Super W. It's not hard, but it will take a little of investment and it will take some uh recalibration from where you come from. And that was one of the core principles behind Umachi. I didn't want this Linux system to be like the demo version of Windows or the cheap version of Mac OS. I wanted it to be unapologetically Linux. Now, I say that with some caveat. There's a version of Linux that's this uh neckbeard pocket protector, completely devoid of style and sense of color coordination. It should be that just below the surface. We're built on all of these uber nerds creating this incredible operating system over the last uh 30-plus years, 40 million lines of just super nerdy code. Incredible. Nothing this that happens could happen if they hadn't done this work. But then, on top of it, we're going to layer some some nice aesthetics because Linux doesn't have to be ugly. The fonts don't have to render like Um the window arrangement, the color coordination does not have to look like it was made by someone who's color blind. Like we can actually put things together and then uh cover it, wrap it in just beautiful computer hacker m