en model like Code Llama 3 or something else like that. And I kind of use all of them. Like I will start Herder and then I'll go into, for example, Amachi. And Amachi has these built in um uh, aliases. HDL is the development layout, the the Herder development layout. So, you type HDL and then space and then the name for the first agent you want. CX for me is Claude with bypass permissions. And then I have uh, CY is uh, is Codex with bypass permission, Codex Yolo, right? So, if I do both of them, then I get my Neovim in my primary and then up top I get my cloud, and then right below that I get my codex, and then below that I get just a terminal. And then I you have the herder uh strip on the side to control your agents. And then of course you can make more of those. So, I end up with this command center where I'm just using This is just on my own machine. And then what I've really gotten into recently is to use a ton of machines at the same time. I set up a bunch of additional PCs using this thing called the GL.iNet Comet, which is this KVM where you can control your machines through a browser, and it can capture all your keyboard commands. So, super and all these other things can actually be captured. That was one of the problems I had with all sorts of other ways of doing KVMs. It just never really worked if you wanted to or needed to use the full keyboard. So, use those, and then I also connect with herder to those. Herder has this dash dash remote setup where you can start a herder on a second machine, and uh and run it like it was your local machine. But now I can be running like four machines at the same time, which means I can have a lot more agents running at the same time doing all this uh work. And this is how we did the thousand PRs in uh in 3 months, right? So, it ends up being this command center experience where I have my laptop, and then runs a little bit of something, but I run a lot of my builds and whatever on PCs I've just put uh these Comets on an