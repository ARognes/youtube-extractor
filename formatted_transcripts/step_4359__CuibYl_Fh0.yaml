e and beautiful and ready to roll in a minute. I mean that literally, 1 minute. >> 1 minute, okay. >> Which was by the way, um goal, we just broke here very recently. You can install all of Amachi in less than 1 minute on a modern fast computer. But >> I'm going to test that cuz we'll see. I'm going to put the timer on. >> You should. I think the fastest I've clocked it so far in a real computer not running in a BM was 56 seconds, I believe, on a Framework 13 Pro with a a pentatonic chip. But this baseline Arch nothing there was the perfect vantage point for me to look out for for this vision I had for the perfect OS. So, I started building on top of that and then I started building with Hyperland. This is this tiling window manager, which is this uh funny idea that you should not be moving windows around with your mouse, which is basically the paradigm we've had for desktop computers since I don't know, since the '80s at least. Uh Windows took a little longer to jump on that to this road, but uh Xerox PARC pioneered this way of working. And this is how most people's computers have worked for the entire time they've used computers. Tiling window managers does something very differently. It automatically arranges the windows on your desktop so that you can see everything, nothing ever overlaps, and you use your keyboard to move focus back and forth between windows and rearrange them. And it's a really alien way of using a computer if you're used to using a mouse and dragging little windows around, but once you get the hang of it, it's like a superpower. It's like you strap a jetpack on your back and boom, here goes productivity in front of the keyboard just through the roof. And then finally, we have this new bit that in the latest version of Amachi, which we're calling Quattro, that's going to be released this week, um is a a shell, uh malleable piece of glue or or Play-Doh that we could form the entire shape of what you interact with, all the menus, all the panels, all the bars, all the icons, all the everything is in this thing called Quick Shell. And the combination those three things, Arch, Hyprland, and Quick Shell, has allowed me to build Amachi into this perfect distillation of aesthetics, productivity, and everything I love about computers. And then now, especially within the last few months, really leaned into all of that together with AI, with agents, we can just do completely new things with computers, completely malleable interaction with the machine where what I give you in this Amachi package is just a starting point, really. Um you can then tweak that operating system on the same level as I'm tweaking it. There's not this two-tier system where, well, there's Apple or Windows and they make the real thing and then you can try to hack or patch your little thing around it and it's going to look second tier, it always does. Apple have access to all these internal APIs. No, no, no. Amachi is going to say, "We're all on the same level. Now, I'm going to provide the base layer, the the base setup, and it's going to have everything that a developer or computer lover would like to see out of the box. It's going to have all the agent sort of harnesses. It's going to have all the installation stuff. Everything's just going to be there. The terminal's going to look beautiful. All the themes are integrated such that when you change from Tokyo Night to something else, everything just filters through. But, then it's a do-it-yourself adventure where you get to come up with entirely new applications. We have skills for starting a C++ application with Qt back end, and it's amazing what you can make in very little time at all. Um to change this quick shell uh wrapper we have, add your own panels, add your own icons, add your own calendar, add all of this stuff. And, of course, add your own themes, add your own colors, add your own everything. And, then I think that net some of that is just a really fresh way of using computers, interacting with them, and it feels just like this is what I personally been waiting 40 years on. I've been using computers literally since '84. I think it's when I got my first computer. And, I've been waiting for this moment where it felt like it was truly mine, and I could change anything at any moment if it did not fit my exact specifications for design or functionality. And, suddenly we're here, and I'm just so stoked to share that with everyone. Hey, AI is in your company right now. It's here to stay, and it's only going to get more involved. So, as it accelerates across your organization like it is mine, and I have a small company, I can't imagine what it is for yours. Every new efficiency can also introduce risks. Think about what AI agents can do. They can execute commands. They can access sensitive systems, connect to cloud services, and whatever else you give them access to do to make them useful. All of creates new attack paths that could expose your data. That's why I'm proud to sponsor with ThreatLocker. ThreatLocker gives you the control to limit what your AI agents can do. They're going to help you reduce that attack surface and stop those unknown processes processes ease. It's hard to say from executing. I know zero trust it's a buzzword, but it does have meaning. They don't trust the stuff you're running with your AI and you shouldn't either. Be selective by default. With their zero trust approach, ThreatLocker blocks unauthorized apps and scripts while also controlling how trusted applications interact with your environment. So I know you want to give your AI some boundaries. I do too. If you want to learn how to do that and actually safely introduce AI agents into your company, check the link below in the description. It's going to be somewhere here. Try this one. Also, ThreatLocker has a blog with some very practical guidance on how to step forward into this. Let's be honest, AI's here. You got to use it. Do it safely. And thank you to ThreatLocker for sponsoring this video. Now back to me and DHH. >> So you've got me extremely hyped because that was the best selling pitch I've heard in a long time. I'm like installing it as we speak. One minute, I'm here. Um but something you said made me go wait, hold on. Did he just say that? You have skills available for the any harness. So I'm I'm thinking Hermes if you personally is an open claw open open claw claw code whatever. You have skills available to access the quick shell and change whatever you want in your operating system. >> Yes. >> Okay. >> omakichiplugins.com is a community repository of people who've done exactly that already. Omakichi Quattro, which is this version that's built on top of quick shell, has not even been released yet. And I think when I checked this morning, there were 75 plugins or something like that already created. Yesterday, there were 40. So this is growing really really quickly because this vision of the malleable computer that you can change to your specifications and liking through AI and through agents is just incredibly appealing. And I think as soon as this gets into the market and we're leaning in 100%. This is also the funny moment we're in right now. We have a lot of the traditional Linux community being at best ambivalent about AI and at worst being actively anti-AI. >> Mhm. >> And I think that's totally fine. I don't require anyone to be as excited about AI or agents as I am. It's completely fine. But we also need someone in this camp in this Linux camp who are really excited about AI, who really leaning in with agents. And Amachi's going to be that. We are leaning in 100% because I'm building Amachi for me and my world of productivity and using a computer and developing applications at 37signals and making Basecamp better and making Hey better has all been completely rewritten by this age of agents. So, I can't make an operating system that's not all in on that because I'm all in on that. And I need to be making an operating system that reflects that. And Amachi Quattro 100% does and I think it's at this moment very unique. Like one thing I just literally added this morning was if any application in Amachi crashes, we're going to pop up a little window says Nautilus crashed. Click to diagnose with AI. You click that little thing, we have a skill to diagnose any crashes of any application. The then loads up into your preferred harness, whether you use Pi or MP or just Claude or open code or whatever. It'll open up into that. It'll load the skill. It'll get the information about the crash and it'll start diagnosing it. And then it gets even better. Once it's done with that full diagnosis, it will load another skill that's about reporting the issue. And they'll go, is this actually an Amachi issue? Have you found a bug in Amachi? Go through these steps. If you have, check if the user have set up the GitHub CLI, which we invite everyone to do when you you start up with it, and it will report the bug straight to our repo on GitHub. Again, with your permission, it's going to include all these details, but the agent is going to do all the work. It's going to find out what the problem was, whether it was something with your computer, whether it was something with Hamachi, and then if it arrives at a diagnosis that said, "Nope, this is an Hamachi problem." It's going to prepare the bug report for you and have it ready to send to the um to the system that we have. And then, the best part, of course, is we will receive these bug reports, and then I will have an agent review that and turn it into a PR if it replicates, and this is how we're going to just turbo boost this uh new age where we can iterate over the operating system itself at a completely different pace. I mean, in the last 3 months I've been building Hamachi Quattro, I have merged over 1,000 pull requests. >> Oh my gosh. >> In about 90 days. So, that's about, I don't know, 13 pull requests a day or something like that. There's been