ble to arrive at a place where agents are just doing a lot of the toil, a lot of the everyday things, and then bundle all the decisions that require your attention into these buckets of time where you can address them. And then they should be working when you're not working. Now, I fully realize this is not where we are in this moment, but that's at least a positive vision I have for the future of agents, and I don't see why it shouldn't be going there. But I also probably would not have predicted this explosion of attention urgency mania, really, around AI and agents, and I've certainly felt that myself right now. So it feels like we are in this sprint at the moment, but eventually we're going to have to slow down. >> Yes, it feels like a sprint that's never going to stop. I've been sprinting for like a year now. Um and it what's funny is we're sitting here talking because I started using Herder yesterday. I hear I heard a bell go off on your end. Like I know a chat just came in. >> That was Herder. >> Um and it's doing work while you're sitting here talking to me, which I think is great. Um so let's get to Omakase because I I don't use Linux as my daily driver, but I want to. What So we'll get into maybe why I should switch to this cuz I'm I'm genuinely curious, but can you tell me what Omakase is? >> Sure. So um the way I pronounce it is Omakase, but you can say Omakase. I don't really care. >> thank you for correcting me. I know it's it's it's Japanese based, right? Off of like Omakase, right? >> You know what? That's funny because uh I've always been saying omakase and I think it's actually Now I'm forgetting. I think there's another way of pronouncing that in Japanese. So I might have just saying omakase wrong for literally 20 years and the Japanese of course are so polite that they would never correct me butchering their pronunciation. But I'm going with hamachi for the distro here and what it is is a preconfigured lovingly computer fan targeted distribution 