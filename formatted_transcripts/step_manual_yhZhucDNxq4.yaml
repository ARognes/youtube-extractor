\n[77.68s] shapes using your border radius\n[79.2s] combinations. And you can see here if we\n[80.96s] scroll down and look at an animation, as\n[82.72s] you can see, this is animating purely\n[84.479s] just the corner shape property. and it\n[86.24s] gives us a really cool effect through\n[87.92s] that animation. And this is one of the\n[89.28s] coolest CSS properties that I''m seeing\n[91.04s] right now. And unfortunately, it''s only\n[92.88s] available in Chromiumbased browsers, but\n[94.64s] I''m sure it''s going to be coming to\n[95.6s] Firefox relatively"}'
