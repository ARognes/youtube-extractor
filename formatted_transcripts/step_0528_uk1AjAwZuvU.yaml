transcript: 'Just like their ice cream machines,  McDonald''s security is totally broken. An unlimited points bug gave anyone free  food, and that’s just scratching the surface, this might well be the most embarrassing  combo of vulnerabilities I''ve ever seen. Also in your hacking news roundup, we  download a North Korean hackers computer. But first, this story comes from a security  researcher who goes by Bobdahacker, he was scrolling through the McDonalds app in search of  a big mac, but ended up discovering a big hack. McDonalds points, as you probably  know are earned when you buy food, and can be redeemed for, well - more food. However here''s the thing, when you  place an order using your points, McDonalds needs to calculate whether  you have enough points for the order, however the app only performs client  side validation, the server does not verify your points balance at all, it just  blindly accepts whatever your phone says. Meaning that anyone with the technical know how, could easily spoof their points, and  order unlimited amounts of free food. And McDonald''s didn''t even seem  to care about this, Bobdahacker, well - let''s just call him Bob, reached  out to a software engineer at McDonalds who said he was ''too busy'' to even take  on the report. But when bob mentioned the bug gives anyone who exploits it the  privileges of a McDonald''s gold card holder, only then did they take notice and  manage to patch it within a couple days. But Bob kept digging, and what he found was  truly a McFlurry of vulnerabilities. Target number 2 was the McDonald''s feel-good design  hub - the central platform that McDonald''s uses to manage their brand and marketing worldwide.  It''s a totally confidential platform protected by a login portal... however Bob discovered that  it was only protected by client side passwords. Meaning anyone familiar with that hacker  button on their keyboard could manipulate the authentication process and log  right into McDonald''s confidential platform. There might as well not have  been a username and password box at all. Bob reported this to McDonald''s who fixed the  problem, 3 whole months later. Now when you visit the site you''re told that the new feel-good design  hub is more protected, with a proper login portal. But whilst they fixed the main problem they  added a side order of new vulnerabilities. If you change the URL from login to register  you''re able to access hidden functionality, allowing you to create an account to freely  access their confidential platform. There''s no UI here but you can craft the POST request  manually, and just by giving McDonalds a name and email address they''ll set you up with an  account and email you a password, in plaintext, that you can then use to login and access the  secret sauce. Which was exactly what Bob did, posting this screenshot as proof. A  video of a 54 minute conference call, which seems to be deconstructing  some kind of collab they did. Oh and this happy meal came with a toy,  in gaining access to the design hub, Bob discovered McDonald''s MagicBell API key just  sitting in the site''s javascript in plaintext. MagicBell is a service that companies  use to handle their push notifications, and by discovering McDonald''s API key, this gave  Bob the ability to impersonate McDonald''s and send push notifications on masse, which  would''ve enabled all kinds of mischief. Despite having already discovered a  smorgasbord board of vulnerabilities, enough to make the CEO grimace, Bob kept  on McGoing, he discovered it was possible to login to corporate executive level portals  using the credentials of a mere crew member. Bob enlisted the help of a friend who  works at McDonalds as a crew member, and successfully used his creds to access  this dashboard only meant for corporate. Allowing him to search for any  McDonald''s employee globally, even up to the level of CEO, and hamburgle their  personal details including their email addresses, which Bob says were mostly personal emails. The  friend who helped Bob, was fired by McDonalds. Next on the list was Global restaurant  standards, a portal, accessible to crew members, where employees can learn about the high standards  that McDonalds expects from everyone but their ice cream machines. But this portal had drive thru  level security. There was zero authentication for admin functions, meaning that Bob could  do some redecoration of the homepage''s HTML. But Bob kept on unwrapping bugs  like Happy Meal toys and set his sights on the McDonald''s spin off restaurant  CosMc, which had a couple vulnerabilities of its own. If you''re not familiar, CosMc  was McDonald''s competitor to Starbucks, selling various sugary drinks at inflated prices.  It launched in 2023, and died a couple of months ago. But whilst is was alive, Bob opened the app  and ordered his usual, client side validation. In this case the bug allowed you to re-use  the coupon only meant for new customers as many times as you want, giving you  an unlimited number of free drinks. You could also confuse crew members by injecting  arbitrary code into orders. At this point Bob hung up his apron and called it a day, which is a  good thing because I''m running out of puns. But despite discovering all  of these vulnerabilities, there was no obvious way to report them.  McDonalds used to have a security.txt file, which is a fairly standard way of pointing white  hat hackers in the right direction. But that was removed for some reason, so he resorted to  cold calling McDonalds HQ, name dropping random security employee names that he found  on linkedin in hopes of being connected to one. Eventually someone important enough called him  back, and the issues were fixed, mostly. If you''re craving some more BigHacks, you''re in luck,  check out this video from barely a month ago. Next up, if this next story  gives you a bit of deja vu, I did upload it a couple days ago as a  standalone video, I wanted to test single topic videos but the youtube algorithm, in its  infinite wisdom barely pushed out out to anyone, so after a couple hours I unlisted it.  It''s a great topic though so here it is: Kim Jong Un has an army of hacker henchmen, and  one of them just had his computer compromised by hacktivists who proceeded to exfiltrate  it''s entire filesystem and made the whole dump freely available for you download. But  it comes with a warning, tread carefully. The two hacktivists behind all this go by  Saber and cyb0rg, they published a report on their operation and and have affectionately  named the owner of the hacked computer, Kim. Kim is thought to be an operative  within a North Korean group called APT43, also known as Kimsuky. Whilst  Kimusky is famous for doing espionage, they''re also well known for dabbling in  cyber crime to help fund their operations. And from Saber and cyb0rg''s report I get the  feeling they''re not too fond of the group. So what does Kim''s computer reveal? He was  running a Linux distro called deepin. We''ve got a screenshot, probably taken accidentally,  we''ve all been there. Also revealed are several ongoing espionage operations, unsurprisingly  all of them targeting Kim''s southern neighbours. There''s logs showing evidence of a phishing attack  targeting South Korean military intelligence. There''s a copy of the source code belonging a mail  server run by South Korea''s ministry of foreign affairs. And evidence that Kimsuky still maintains  access to internal Korean government systems. A complete dump of a VPS that Kim was using  to launch his attacks from is also in here, as well as the credentials to access  it. Funnily enough these credentials were still working the very day that  all of this research was released, so our hackers managed to conduct their  operation all without Kim even noticing. Also in the dump is code for  various backdoors and exploits, along with manuals detailing  how to go about exploiting them. Saber and cyb0rg explain that a  regular target of Kimsuky is South Korea''s Ministry of Unification.  The leak reveals that they tried to brute force their way into it using  a custom made password list. Here''s a short excerpt from that list I put together  for you guys. The attack was unsuccessful. The dump also reveals that Kim bought  a domain on namecheap using bitcoin, but he ran into trouble a few days later when  namecheap got suspicious and disabled it, asking for verification of legitimacy. Kim''s browser history is also in here, but sadly, I couldn''t find anything embarrassing. Kim  kept his browsing all strictly work related, no doubt keen to stick to the  script to earn his potato rations. Exactly how Saber and cyb0rg first identified  and then infiltrated Kim''s computer is an important detail that''s totally left out  of their report. Hacking into a computer is illegal regardless of whether or not it  belongs to a North Korean cyber bad guy, so they''re probably not too keen  on incriminating themselves. Also a little vague is how the computer was  attributed as belonging to North Korea''s Kimsuky group. The South Korean targets are  a pretty good sign, but there is a chance China might have an interest in those. Certain  ''artifacts and hints'', ''patterns and signatures'', similarities in dumped code, points to North Korea  - which is all very non specific. And whilst it kinda sounds like they''re hiding something, this  level of ambiguity is really quite normal as being too specific could burn their investigation  methods. A little more concrete though is that the PC''s language was set to Korean and  Kim''s office hours were 9 to 5, Pyongyang time. The whole 9GB dump is freely available,  so if you want a snapshot of what a North Korean hackers'' computer looks like,  you can go ahead and grab a torrent from distributed denial of secrets. But  again, heed the warning, tread carefully. This leak and its report was released as part of  the latest edition of the Phrack magazine. Phrack is a hacker magazine that has been a part of  hacker culture since forever, it''s first edition was released the same year Microsoft unveiled  Windows 1.0, their first OS to have a graphical user interface. Since then, Phrack has been a  pretty important part of hacker culture, or so I''m told, I wasn''t exactly around back then. But  I''ll link the latest edition in the description. As always thanks for watching and I''ll see  you in the next video, have a good one!'
