transcript: I would try a few different ways to gut-check whether you're in the right spot. And one of them is to just talk to people. Talk to people who are at those other companies that you might be maybe feeling a little bit of imposter syndrome like fear, I might not be as good as them. I might not be as successful. So, why would I even try going there? Talk to those people. Ask them, "What do you do day-to-day? Like, how did you get this role?" See how much they actually get and make at these other companies. And that might change your frame. The other way to do is just do research, right? Look at the companies that are competitors of yours who are at the same or stage of yours. Sometimes that alone will get you to change your mind. And then internally, is your manager giving you honest signals or not? That can tell you that a manager that tells you three times in a row like you're up for promotion, but like, "Oh, things beyond my control are either isn't politically savvy or really doesn't value as much as he just wants to retain you and drag you along. Do you really trust that your manager values you and knows how to get you to the next level?" And then second, would your same skill set be much more valued in an organization with higher pay?
