transcript: this is word chains it started as a game my son learned in kindergarten but it's grown into so much more so let's start from the very beginning this is how my son described it you start with one word and you have to get to another word by changing only one letter at a time and you can only use real words as part of the chain so for example to get from cat to dog you might go cat cot hog dog it's easy to play with three-letter words that use patterns like consonant vowel consonant but my son really wanted to try harder word pairs this became a challenge even for me as it either took a lot of steps or we just couldn't find any solutions this seemed like a fun problem to solve with code so I decided to spend a couple hours making an automatic solver in Python the first step is to choose a dictionary so the solver knows what counts as a real word my first thought was to just use the Scrabble dictionary so let's see what it comes up with uh H are any of these actually real words this doesn't seem right the problem with the Scrabble dictionary is that it includes way too many archaic words in fact it was designed to include every word ever published in a huge list of dictionaries so you end up with words like these I mean are you serious a lot of these don't even have vowels can you really call this English anyway if I as an adult have to look up half of these words then it's definitely not the right dictionary for a kindergartener in fact I was really struggling to find any dictionary with reasonable English words so I came up with an idea to get a bunch of different word lists from multiple sources and then have them all vote for which words should be in the final dictionary it worked really well but later I found out that someone else already did exactly the same thing and they did it even better so I ended up just using the word list from scowl's 12 dictionary package and it looks much better now using the word chain solver is really fun but now there's a ton of questions in my head what pair of words have the longest path can you get from any word to any other word which word has the most connections and what happens if we change the number of letters these are all Network Theory questions so of course the next step is to turn the problem into a graph it's really simple if two words differ by only one letter they get connected then I export the connections list to a dot file to view it in geffy which is a free and open- Source graph visualization software the first thing I noticed is that there's definitely some clustering going on make a guess what you think those clusters are geffy does have tools to automatically cluster so we'll change the color of each node to match the group geffy thinks it belongs to well it's not too surprising this cluster is words with a in the middle this one is words with I in the middle u in the middle o in the middle and E in the middle here we have words that end in y or have an H in the middle and lastly down here are words that start or end with a vowel it's pretty cool that clustering can create these groups without knowing anything about the words themselves the degree of a node is how many other nodes it connects to so now let's color by degree and figure out what node has the most connections the word with the highest degree turns out to be mad with 27 connections okay what about the longest chain this is called the Network's diameter just like a circle and of course geffy has tools for that too the longest chain length for this network is 11 and here's one of those chains from ski to EMU that ski to SCA to C to C to Lee to lie to I to to age to ago to Ego to emo to EMU you might also be wondering if all the words are connected and the answer is no there's actually 10 groups the Giant and massive one we've been looking at and then there's nine isolated words that have no connections these are aha EB ganu ISM OA qua ug uni and n my son Lov playing around with this graph visualizer after school and so we kept exploring more things to look at like what about four-letter words now the graph starts getting a lot more interesting and here's how it looks the Clusters aren't quite as obvious but most of the groups make sense since they use common letter sequences like double e double o's vowels in the second position ending in an S and so on this time there's actually a few different disconnected islands of more than one node and these are the largest ones and of course there's still lots of completely isolated words with no connections like kiwi liar sexy and exam but back to the giant cluster the most connected node is care with 24 connections and the diameter with the longest path is 16 connections from Auto to amen which goes Auto Alto Aloo aloe flow flee fled feed fees bees bu eyes Eaves even oven Omen amen okay let's do five letters now I'm going to start speeding things up just to show the interesting results the longest chain for five letters is actually 29 steps long from reply to allow and the largest island that isn't the giant cluster has 17 nodes the most connected node is again cares with 23 connections once you get to sixlet words the giant component now contains less than half of the words so there's way more disconnected networks in including this really big one the longest chain is a staggering 37 connections from pedals to Cloudy and the most connected node is cowing with 16 connections which believe it or not is actually not even in the large cluster but in the smaller Island we can go to seven letter words too but at this point there's actually now more nodes than edges so it just just gets harder and harder to find words that can actually connect at all but just for completeness searing is the most connected word with 16 connections and the longest chain is from exuding to gussed and I skipped over the two-letter words since they're a bit boring but here they are the longest path is from yah to ID which only has five steps I 