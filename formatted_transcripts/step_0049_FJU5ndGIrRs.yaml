transcript: Whoever your hiring manager is, if you can get a side channel in a LinkedIn, a side channel in email, or side channel in SMS, that's going to help you. Most of the best interview processes I've had and negotiations I've had, after every single step, I would text them and say, "Hey, had a great call with this. Oh, I had this question following up from what I had this conversation with this person." And that relationship makes the difference. A lot of people have what you would call silver medal syndrome, right? Like you always come in second place in interviews. It's not because you're worse than the other person, but the other person just has like some edge over you on it. If you have this emotional connection and they're like, "I am already working with this person pretty much." That's going to make the difference between you getting the offer or not. And then it also helps in negotiations for them to go to bat for you because they're they just really want to work with you. They're they're now not thinking about what they're going to gain, but as we know in psychology, people care more about what they're going to lose. So, if they feel from this due diligence or alignment conversation and from this text chain on the side that I'm going to lose the colleague I thought I had, that's more impactful to them than getting a team member or not getting them. And so, they're going to fight harder for you if you do that.
