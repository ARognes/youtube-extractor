transcript: 'J''ai décidé de rompre le silence après cette attaque parce que j''ai compris que l''armée israélienne ciblait des journalistes. Ce témoignage recueilli par le monde grâce à l''ONG Breaking the Silence vient d''une source au sein de l''armée israélienne. Avec plusieurs médias internationaux, nous avons rencontré une source militaire bien informée dont nous protégeons complètement l''identité. Ce qui est intéressant avec ce témoignage, c''est qu''il vient éclairer un un événement extrêmement important qui a eu lieu il y a 1 an exactement, le 25 août 2025. Ce jour-là, l''armée israélienne va frapper deux fois l''hôpital Nasser dans le sud de la bande de Gaza. Une attaque israélienne qui a ému le monde entier, tuant 22 personnes dont des soignants et cinq journalistes qui travaillaient pour des médias internationaux. Dans cette vidéo, vous allez comprendre, grâce à ce témoignage ainsi qu''au documents que nous avons récupéré comment Israël verrouille la communication des médias et censure l''information aussi bien à Gaza qu''en Israël ou en Siordanie. Luc Broner est correspondant du monde à Jérusalem. Viens à moi, c''est la c''est Jordani là-bas. Tu vois au loin la mosquée avec le bulbe jaune, le Mont des oliviers et puis tout derrière c''est la c''est Jordanie et plus loin c''est la Jordanie. Il y a quelques jours, il a pu discuter pendant 1 heure avec une source au sein de l''armée israélienne. Cette source a choisi de briser le silence parce que ce militaire a considéré que ce qui s''est passé ce jour-là devait être raconté au devant le monde entier pour que les opinions publiques aient conscience du fonctionnement de l''armée dans ce genre de de circonstan. Cette source, elle raconte comment confronter à des images qui montrent la mort en direct de journalistes et d''équipe de secouristes qui sont touché par une première frappe puis par une seconde frappe. Comment l''armée tente de construire un récit qui lui est le plus favorable possible. Pour ça, l''armée israélienne utilise une technique appelée l''incrimination rétrospective. C''est l''idée que dans un moment de crise euh qu''ils appellent crise légitime, parce que leur action est mise en cause publiquement, ils vont tenter d''apporter des éléments contradictoires ou des éléments qui vont faire douter. Ce que nous raconte cette source militaire, c''est que le premier objectif de l''armée, c''est de tenter à tout prix de relier ce qui vient de se passer, notamment les victimes avec le le Hamas. Après une attaque comme celle-ci, le porte-parole de l''armée israélienne cherche à établir un lien entre les personnes tuées ou blessées et le Hamas. C''est ce qu''ils essaient de faire dans un premier temps. Car si l''on peut affirmer que les personnes tuées sur place sont des terroristes du Hamas, cela nous donne une meilleure image aux yeux du monde entier. Après la double frappe sur l''hôpital Nasser, l''armée israélienne va expliquer qu''elle visait une caméra qu''elle dit être du Hamas. Les troupes de la brigade Golani ont identifié une caméra positionnée par le Hamas aux abords de l''hôpital Nasser. Cette caméra servait à observer les activités des troupes de l''armée israélienne afin de diriger des actions terroristes contre elle. Une enquête de Reuters a d''ailleurs démontré que cette caméra n''appartenait pas au Hamas, mais à un journaliste Usam Almas tué ce jour-là. Mais concernant l''hôpital NASER, nous ne pouvions pas présenter le journaliste muni d''une caméra comme un terroriste, ni l''associer à une organisation terroriste. Toutefois, par la suite, l''armée israélienne a révélé l''identité de six terroristes du Hamas qui ont trouvé la mort lors de cette attaque. Le chef d''état-major a ajouté que six des personnes tuées étaient des terroristes dont l''un avait participé à l''infiltration en territoire israélien le 7 octobre 2023. Le premier outil est l''incrimination rétrospective. Ensuite, nous formulons un message du type : "Nous nous efforçons de limiter au maximum le nombre de victimes et nous menons des enquêtes en interne." On le comprend bien ici. L''armée israélienne cherche d''abord à démontrer un lien avec le Hamas, puis explique ne pas viser délibéremment les civils et annonce ouvrir une enquête. Ce schéma, on le retrouve à plusieurs reprises et ces éléments de langage sont ensuite repris dans les médias en Israël et dans le monde entier. L''armée regrette tout préjudice causé à des personnes non impliquées et ne cible pas les journalistes en tant que tel. Ça regrette tout dommage causé à des personnes en impliqué et ne prend pas les journalistes pour cible en tant que tel. L''armée israélienne a dit qu''elle lançait immédiatement une enquête sur les circonstances de ces tirs et qu''elle ne visait pas les journalistes en tant que tel. Dans les règles de fonctionnement des médias, il y a ce qu''on appelle le principe du contradictoire. Sur chaque fête, nous sommes amenés à demander des réactions à l''armée israélienne et à citer l''armée israélienne. Dans ces cas-là, l''armée israélienne peut utiliser et établir un lien avec le Hamas. C''est encore une fois la stratégie du doute, c''est la stratégie de laisser au maximum penser que ce que racontent les Palestiniens, ce que racontent les médias internationaux qui sont perçus souvent comme des ennemis n''est pas n''est pas vrai ou peut être remis en question. Pour instaurer ce doute et tenter de contrôler le récit et les informations, Israël utilise aussi d''autres moyens. Depuis le 7 octobre 2023, aucun média ne peut entrer dans l''enclave palestinienne. Les médias internationaux n''ont pas les moyens de faire leur travail correctement. Nous n''avons pas les moyens de nous rendre sur place et donc de faire ce travail d''investigation. Cela permet par ailleurs aussi à l''État israélien de considérer qu''on fait mal notre travail sur sur Gaza et notamment notre mal notre travail sur le Hamas. Mais si nous ne pouvons pas le faire, c''est d''abord la responsabilité de de l''armée israélienne et de l''État israélien qui nous empêche de faire notre travail à Gaza. Le seul moyen d''y entrer pour un journaliste, c''est ce qu''on appelle les embêdes, c''est-à-dire entrer avec l''armée israélienne. Pour ma part, je suis allé à trois reprises euh en embè avec l''armée israélienne, deux fois à Gaza et une fois au sud Liban. Un embê, ça a beaucoup de limites. D''abord, nous n''avons pas la possibilité de rencontrer les populations qui sont victimes directement de de la guerre et notre capacité à enquêter est extrêmement réduite. L''armée, quand elle vous permet de la suivre sur le terrain, elle a toujours un objectif de communication ou de propagande. En l''occurrence, il voulait nous montrer un tunnel sous un des hôpitaux de de la ville de Gaza. Tunnel que nous n''avons pas vu. En revanche, ça c''était intéressant. Ça nous a permis de raconter euh quelque chose qui m''a profondément choqué quand j''étais sur place, c''est cet état d''anéantissement absolu de de la bande de Gaza sur des kilomètres et des kilomètres. Dans ces embêtes, ce sont les Israéliens qui posent les conditions. On le voit dans ce document que l''ONG, mouvement pour la liberté de l''information, a obtenu. Il s''agit d''un document que doivent signer toutes les personnes participant à l''embê. Ici, on peut voir l''une des conditions. Je m''engage à transmettre l''intégralité des éléments à la censure militaire et à n''en faire aucun usage avant d''avoir obtenu l''autorisation formelle de la censure. C''est aussi l''armée israélienne qui décide qui vient. Il y a donc des journalistes comme Luc mais aussi des influenceurs. La première fois où je suis allé à Gaza, j''étais en même temps que des influenceurs qui étaient là pour porter la parole de de l''État d''Israël. C''était transparent, c''était explicite. C''est une méthode qui est efficace pour eux parce que ça permet de d''avoir un discours de de pure propagande. Avec ces méthodes, Israël mène une guerre de l''information mais également une guerre contre l''information. C''est très concret aujourd''hui sur ce conflit. Ça touche d''abord les journalistes palestiniens dont plus de de 200 à 260 selon les sources ont été tuées depuis le début du conflit par l''armée israélienne. C''est un chiffre qui est complètement inédit dans l''histoire récente des conflits. Et en dehors de Gaza, Israël impose aussi une importante censure militaire. des journalistes, essentiellement les journalistes israéliens en réalité vont soumettre leurs articles à la censure militaire lorsqu''ils ont des informations qui touchent à la sécurité nationale. Regardez ce document. Ce sont les chiffres sur la censure en 2024 communiqués par le gouvernement israélien à la suite d''une demande du magazine + 972 et de l''ONG Mouvement pour la liberté de l''information en Israël. Ça montre une explosion du nombre de cases de censures militaires. Il y est écrit qu''en 202470 demandes ont été transmises à l''examen de la censure. Parmi elles, 12870 ont été approuvées, 6265 ont été modifiés ou corrigé et 1635 ont été rejetés ou interdites de publication. Le magazine + 972 montre sur ce graphique que le nombre de ces censures est en augmentation. Et en décembre 2025, une loi a encore aggravé la situation. Le parlement israélien a voté un amendement qui permet aux autorités de prolonger jusqu''à fin 2027 l''interdiction de diffusion de médias étrangers accusé de porter atteinte à la sécurité de l''État. C''est une loi qui vient instaurer un un régime durable euh de menaces sur des médias étrangers euh avec des mesures très concrète dans ce cas-là, c''est la fermeture des bureaux, c''est la saisine des matériels et c''est l''interdiction de de diffusion télévisée ou d''un site internet par exemple. Tous ces éléments montrent comment Israël mène sa guerre de l''information en imposant une incrimination rétrospective après les bombardement, en empêchant les journalistes de se rendre à Gaza et en censurant les médias. C''est ce que le Premier ministre Benjamin Netaniaou nomme le 8e front de la guerre. Pour l''armée israélienne, c''est fondamental d''essayer par tous les moyens de défendre l''idée que ce qu''ils font est est légitime, que ce qu''ils font est conforme au droit international. Et donc ça fait partie de oui d''opération de propagande. Ça n''est pas propre à l''armée israélienne, mais l''armée israélienne a développé une une expertise, si j''ose dire, une expérience qui fait que elle est capable aujourd''hui d''aller très loin dans les protocoles, l''organisation de ces opérations.'
