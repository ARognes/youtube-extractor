transcript: in computer programming one of the most common problems that we need to solve is managing a large number of objects that are all the same type as an example imagine you're building an application that needs to support a large number of user accounts while the data in these accounts might be different they all have a username a display name an email address and so on new accounts are being added all the time and old and unused accounts are being deactivated if we're thinking about how to program a system like this from scratch the simplest way to manage these profiles is just to put them all into an array this allows us to iterate through all the profiles one by one and it also allows us to very quickly access any particular profile if we know its position in the array its index but when our users want to log in we don't expect them to know and memorize the index of their profile in our internal array they expect to be able to log in using something like their username or an email address in our naive case in order to find the profile of the user who is trying to log in the only way that we can do it is by iterating through the entire array one by one comparing the entered username with the username in each profile this is obviously going to become slower and slower as our number of users grows larger so we need a little more than just an array here what we need is a different data structure that allows us to start from our username which is a string and somehow quickly find the profile that matches that username luckily there there's something that fits this exact description it's one of the most commonly used data structures in programming and it's called a hashmap or a dictionary in some languages like python in contrast to an array where we need to know the numeric index of an element if we want to look it up directly with a hashmap we can store and retrieve elements using some other data called a key in our particular case we can add our user profiles to our hashmap using the string username as the key and then when the user wants to log in we can simply look up the profile in our hashmap with the username directly significantly faster than having to search through the whole array one by one now if you've been programming for a little while there's a very good chance that you've used a hashmap or a dictionary before but they're probably sitting in that magic bucket in your head where you just sort of hand over the key and it gives you back the value and you've never really thought about how it works on the inside and maybe it feels a bit intimidating to you the idea of implementing hashmap yourself from scratch but they're actually surprisingly simple so to understand how a hashmap works the first really important thing we need to remember here is that just like every other data structure in programming a hashmap is built over the top of an array so in order to start building our hashmap the question we're trying to answer here is how do we turn our string key into an index in an array that we can use for a direct lookup now this sounds like it could be complicated but there's actually an incredibly simple way we can convert a string into a number you might already know that underneath a string is just an array of numbers representing the characters so to convert our string into a single number we could for example just go through each of the numbers representing the characters and add them all up we now have a single number we can use as an index to store and retrieve our profiles from an array although if you think about it this approach has a pretty severe issue you know how seven + 3 produces the same result as 6 + 4 even though the numbers involved are different in exactly the same way if we just add the numerical values of each character up there are many many different strings that can add up to an identical number and that's a pretty big problem for us because we really don't want two different usernames to end up pointing to the same index in our array of user data what we need here is some kind of approach that attempts to ensure that a unique string ends up turning into a unique number and there happens to be just such a thing it's called a hash function and the number that gets produced from this function is called a hash and that of course is where a hash map gets its name in simple terms the way a hash function works is exactly like our naive approach of adding up the character codes hash functions break the data that you're using for your key down into chunks like characters for example and do some mathematical operations with each chunk eventually producing a single number so to connect that back to our original problem of mapping a username onto an array index the simplest approach would be just to use the number that comes out of our hash function as an array index directly well this seems like it solves our problem right a unique string username will produce a unique hash number which we can then map onto a unique index in our array so problem solved well not quite firstly you may have noticed that the number produced by our hash function was very large if I put in some separators here you can see it's over 600 million in fact because the hash function we're using generates 32-bit integers the hash could be anywhere from0 to more than 4 billion that is 2 ^ of 32 if we were to actually Implement our naive approach and use the output from our hash function directly as our index we would of course need to allocate an array with 4 billion values in it even if we managed to keep our user profiles to a very lean 32 bytes per profile that means we would need to allocate 128 GB for our array and here's the worst part even if you did actually allocate 128 GB for your array you still wouldn't have a working implementation because as it turns out even though hash functions are very good at generating unique hash values from unique input they're not perfect sometimes even the best hash functions generate the same number from two different inputs and this is referred to as a collision but collisions aren't necessarily caused by some kind of problem with the hash function it actually makes perfect sense that collisions would occur in this type of situation as we discussed before a hash function that produces a 32-bit number gives you about 4 billion possible hash values so it's the hash function's responsibility to take your string username and produce a unique one of those 4 billion values now 4 billion values seems like a lot but let's say we only allow our users to create usernames out of lowercase English letters if we limit the length of our usernames to just one character there are 26 possible usernames to choose from and our friend Jeff Knox might choose the letter J if we allow our users to use two letters that gives us 26 squared possible names already over 600 possibilities three letters gives us 26 to ^ of three combinations and you can see the pattern here by the time we get to just seven letters not even enough to represent Jeff's entire original username we already have 26 to the 7 possibilities which is over 8 billion possible usernames so given that you can only represent up to 4 billion with a 32-bit number even if our hash function perfectly distributed every possible input into a unique output we would still just complete completely run out of numbers by the time we were barely halfway through even seven letter usernames let alone longer ones but programmers use hashmaps effectively all the time so there must be some trick to getting this to work right there sure is the first thing that you need to do is realize that collisions are just a fact of life they're going to happen so the best thing that you can do is lean into it and assume that collisions will happen as part of your design the first thing we need to do is significantly reduce the size of our array if we're only dealing with around 10,000 users we don't want to create an array that has 4 billion elements so instead we'll create our internal array with a capacity of say 20,000 just for interest sake for 32 by user objects that brings our memory usage down from 128 GB to just 625 kiloby it's sometimes hard to get a grip on the differences between numbers at this scale but that really is a massive reduction I literally couldn't make this line thin enough to accurately represent 20,000 as a fraction of 4.3 billion but obviously now the vast majority of the 4.3 billion possible hash values will overflow our 20,000 capacity array if we use them as indexes directly the question is how do we map our 4 billion possible username hashes onto just 20,000 available indexes well a very simple way to do it is to use the modulo operator which looks like a percentage sign in most programming languages and as often referred to is just mod modulo is related to division when we type something like 11 / 3 into a calculator we end up with a decimal result 3.6 repeating but computers also support a type of division called integer division which is essentially just division using whole numbers throwing away anything after the decimal place this was probably the first way you learned to do division as a kid and because 11 doesn't divide cleanly by three and leave some left over we could say that the answer is three remainder to and in programming it's the modulo operator that gives you back the remainder after you've done your integer division to demonstrate it visually integer division of 11 by 3 is basically just asking the question how many times can we fit a whole three into 11 before we run out of space whereas modulo tells us how much we would have left over after we're done with our division and what's really interesting is that there's a pattern hiding underneath this if we increase the number we're dividing from 11 to 12 it's now perfectly divisible by three again and as a result the mod is zero because there's nothing left over then if we increase it to 13 we have a remainder of one again then dividing 14 we have a remainder of Two And when we get to 15 our mod has gone back around to zero in fact if we mod any integer by three the only possible answers we can get back are 0 1 and 2 as a result if we take an ascending series of numbers just increasing by one every time and we mod each of these numbers by three you'll see we end up with this repeating pattern 012 012 012 even if we take an absolutely massive range of numbers like our 32-bit unsigned integer if we mod them all by three every single number in that range will map to 0 1 or two that means if we allocate an array with just three items a simple mod operation would guarantee that any number selected from that massive range would map onto a valid index and the best part is because we saw that that sequence of remainders is repetitive it means that across this entire range the mod operator perfectly Maps exactly 1/3 of all of the numbers onto each of the three indexes as an aside when we're mapping values onto a smaller number of shared indexes like this we tend to refer to each of these array slots as buckets and you'll see that terminology used often when people are discussing hashmaps so now that we've learned how mod works and what it can give us let's return to trying to solve our original problem which was how do we map 4 billion hash values onto 20,000 array indexes well now it's not only obvious but the answer is amazingly simple all we have to do is mod our range by how many indexes we have which in code is a one liner we just mod the result of the hash function by the length of our array that's it we've solved the first problem which was that we couldn't use our hash function directly as our array index but given that I mentioned we would eventually see collisions even with an array with 4 billion elements we're going to be seeing a lot more collisions with just 20,000 array indexes so let's just review where we're up to and approach the problem step by step say we start from an empty array and Jeff signs up as our first user so we hash his username which gives us this large value then we mod it by the length of the array and the resulting index is 123 so we place Jeff's user data into index 123 and we're all good the next time Jeff tries to log in we hash and mod his username get the same index as a result and we're able to quickly figure out exactly where his user data is in this array we have some more users sign up and everything's fine and then sometime later we get a new user called Bob Lany and even though the 32-bit hash of Bob's username is completely different to Jeff's when we mod them both by the length of the array we end up with the same number 123 which is a collision in our current implementation as soon as Bob signs up we end up just erasing Jeff's data and overwriting it with Bob's data so what can we do about this well there's a very clever and simple strategy that we can use to solve this problem in fact it's so simple that at first it might seem like it couldn't possibly work if we're trying to add a new user to our hashmap and our hashmap leads us to an index that already has something in it we can just search forwards through the array index by index until we find an empty slot then we can put Bob delany's data in there of course this means that we need to change our lookup strategy slightly as as well when a user tries to log in we compute the hash function just like we did before but instead of just trusting that the user is at that exact index we now need to compare the username at that index and make sure it's actually the user that we're looking for in this case it doesn't match so now I use the same strategy we used when inserting the user we just keep iterating through the array one by one comparing the username until we find where Bob's data ended up or we find an empty slot which indicates that he's not in the list at all obviously this isn't quite as efficient as mapping directly to the correct index on the first try but it's still much better than having to search the entire array for terminology this process of iterating through the array until we find the item we're looking for is referred to as linear probing which is just a fancy way of saying searching in a straight line we've now solved both our memory usage problem and our Collision problem using a very simple design we only have one small function and a single array that houses all of our data the technical jargon for the design of this type of hashmap is called open addressing which can be a little bit tricky to remember the mental shortcut I use is looking at the first letter of each word open addressing is O A which is the same letters as one array it helps me remember that the fundamental design idea in open addressing is that we're storing all the data for our hashmap together in one array hashmap that use this type of design are used all the time in production software but as with everything in programming there are some cases where this type of approach starts to fall apart you probably have suspicions about this already but the first issue is caused by the approach we're using to resolve collisions Bob's data was supposed to go into index 123 but instead ends up in index 125 that means if another user gets naturally assigned to index 125 they now collide with Bob's data and need to be placed it in index 126 this Behavior over time tends to create long runs of stored items with no gaps in between them if I have a hashmap where indexes 0 through a th000 are all full if I try to insert something at position zero I'll need to iterate through and compare a thousand elements until I finally find one that's empty this phenomenon in these one array hashmaps is called clustering and as you can see it's pushing our performance back in the direction of just iterating through the ENT entire array like we were originally doing which makes using a hatch map kind of pointless you can also intuitively see that the chance of these kind of long runs occurring approaches 100% as the hashmap gets closer and closer to being full as a result we typically only want to use a hashmap with this type of design at partial capacity and how full a hash map's internal array is is referred to as the load factor which is typically expressed as a percentage and as the load Factor increases eventually we need to resize our hashmap to prevent giant clusters from forming and that's where we run into our second problem resizing an array is as simple as doing a larger allocation and then copying all the memory over because the indexes of elements in the smaller array will be the same as they are in larger array just with more space at the end but in the hashmap we've designed remember how to figure out the index we had to calculate the hash and then mod it by the length of the array that means if we change the length of the array to make it larger the value we're using for the mod will be different which could result in a totally different index so we not only need to allocate a new array for our hashmap we then need to iterate through every element in the old array so that we can rehash and then reinsert them all into the new array one by one and of course if you're unlucky that process can result in new unpredictable collisions and even new large clusters that didn't exist before the third issue is when we're trying to delete something from the hashmap if Bob Laney wants to delete his account we can compute his hash look up his data and delete it from the array setting that bucket to empty again seems fine so far but there's a problem here say Jeff now tries to log in and even though his index calculation puts him at index 8 because of the collisions he ended up at index 10 so we look him up at index 8 but we don't get a match so we start to iterate through the array to look for him but slot 9 is empty which we interpret as him not existing and we incorrectly return user not found as a result we can't immediately delete the data when the users request that it's deleted we instead need to Mark those slots as deactivated so we don't break our lookups which can lead to worse clustering effects and further complicate our implementation now there are of course many clever ways to reduce the effects of these problems that I've raised and I'll link some interesting reading material in the description for you but there's no way to perfectly fit fix these issues because they're a natural characteristic of the way that open addressing hashmaps work of course I've been dropping some hints that there's perhaps an alternative implementation we can use with a different set of tradeoffs and that approach kind of predictably is called closed addressing instead of open addressing open and closed both start off the same way calculating the hash and modding it by the length of the array but the difference is in what we do when there's a collision in closed addressing there's there's no iterating ahead to find an empty slot instead of storing all our user objects in the one array we store something like a pointer to a collection somewhere else where the actual objects are stored you can see that we'd need more than one array to implement this approach now there are many many different ways to implement a hashmap using closed addressing but I'll give you a demonstration of the simplest one I can think of it only uses two arrays to get the job done let's say we're trying to insert our Jeff Knox user again when we calculate our index for our first array if the slot is empty we insert the user there exactly the same as our open approach but when we try to insert our colliding user Bob Laney we do something quite different we have a second array that catches the Overflow from collisions in our first array so Bob's data goes straight in there and in order to be able to find Bob again our hashmap items have one extra piece of associated data the index of the next object in the Overflow array so after we insert Bob's data into our second array we save Bob's index in the next user index field of Jeff's data it might be obvious at this point but we're actually implementing a very simple linked list some time passes and we add more users to our hashmap and then if we get a third Collision for index 123 we would start in our first table and then just follow the next indexes until we find the end of the link list and insert our third user in the same way this approach fixes almost all the problems we had with open addressing if we run out of space in our hashmap it's as simple as resizing the second array which for arrays we know is just a direct memory copy without having to rehash or recalculate any of the indexes the length of our individual link lists is limited to the number of collisions in a single bucket so we don't get huge clusters covering many hash buckets and of course because we're using a linked list deletion is as easy as changing the next index so one of our list items now I mentioned that every data structure does have its tradeoffs but it probably feels like I'm selling this closed addressing or multi-array approach is just fixing all of the problems that I raised with the open addressing or a one array approach so what are the downsides of using closed addressing if it seems to fix all of these issues it mainly comes down to Performance trade-offs in different scenarios as long as you have a good hash function for the keys you're expecting a reasonable load factor and an effective strategy for reducing clustering generally a onearray hashmap will give you significantly better random lookup performance which in most cases is the main use case of a hashmap without going into too much detail here iterating linearly through an array typically has much faster memory performance than accessing an array randomly via following pointers in a linked list I have a detailed video that explains why this is the case which I'll link in the description now that you've got some foundational idea of how hashmaps actually work I would very strongly advise you to just try implementing one yourself and see how the performance and stability trade-offs work not only will this give you the knowledge to choose the right implementation for your use case later on but it's actually just a lot of fun to figure out
