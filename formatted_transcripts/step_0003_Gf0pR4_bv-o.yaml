ink the reality is you do have to manager shop. You know, people understand job shopping. They understand projects. I'm not sure everyone's accepted that you have to shop for a manager and that that really matters. >> Yeah, it absolutely does. I am 100% convinced that the relationship with your manager is the most important one at work. >> Mhm. >> And it can lead to either a virtuous or a vicious cycle. Mhm. >> If your manager sucks or you have a bad relationship with them, they don't give you the best work, you don't try as hard as you should, performance problems compound, you dread going into the office to talk to your manager, and it just spirals out of control. When you have a great manager, you're aligned, they love you, you love them, they give you good work, you do your best job, right? And it's a in this virtuous cycle. I love your point about the the amplification of particular traits within the management chain. I think it can go both ways. If you're if you've got a wonderful trait that you've hired for that can amplify and help out the entire organization, if there's a a flaw or a poor character trait, it can get amplified within uh >> it's a blind spot. I like to think of it. >> Yeah. You magnify the blind spot, >> right? you magnify the blind spot and the damage compounds because you would hope that the manager the the higher level manager the director the VP is a check and balance because if they don't align then maybe I can see that person's weakness and if you highlight to me and say oh hey Ethan's about to ram something out that isn't really ready and I'm this you know sort of better leader with a different viewpoint not Ethan but somebody else I can say yeah I know you know Ethan likes to move fast I hear you I'll talk to him about it or I'll impose some constraints or you know you can dampen those trades. Another thing I think is worth noting all managers are human. We tend to forget this. We we we want them to be perfect because they have so much impact on us. So we get really hurt when they're not perfect. One of the things is though they're not going to be perfect. Another thing I'd point out about managers I'm here for sure your audience can either love this or hate this. I'm here to advocate for giving managers a break. >> Of course he is. >> Yeah. Right. Of course I am. Managers are human. Managers get tired. They have bad days. Managers have their own goals. They're trying to grow their career, too. So, as much as your focus on your life and your career and your comp and your enjoyment of your work and all of these things, they are too. And you want them to care as much about you as they care about themselves. That's unreasonable. That's unrealistic. Even the ones who are very good at understanding that their success comes from your work, they still have many people and they can't spend all their time with you and or thinking about you. Even good managers are sometimes going to cause collateral damage from your perspective. I think it's a balance. Like this guy I talked about that I thought was great. I had a great relationship with still his answer that he was not going to do any work himself. his only job was to delegate to us or that that was his full job. You know, he wouldn't have said, "I don't do any work myself." He'd have said, "I work all the time managing you." But from an Amazon perspective, that still felt like missing something. For me, that was no big deal. Like, okay, you have a big enough package of bonuses. I'm good. For my peer, that was really like I struggled to respect that. >> And back to my client where he had this >> I didn't answer directly enough about what he can do. All right. this management chain that uh had this amplified blind spot and sort of took him out with, you know, sort of like knocked him out first and then they got knocked out afterwards. Yes, you should have your resume ready to go. Yes, you should be able to move teams and and all of that stuff, but how do 