people conduct that in a dirty or unethical way. But you don't have to do that to still have a better career for yourself and to be armed and defend yourself. So when I think of politics, I think of that as how do businesses and people within businesses reconcile different goals and limited resources. So, I have a goal to get my product out, you have a goal to get your product out, but we have dependencies together or we step on each other and you want to do yours first and be on your schedule and I want to do mine first and be on my schedule. Well, how are we going to resolve all of that? That process which can get nasty but doesn't have to is the expression of politics. And the same thing is true when we talk about engineers and their careers. So if we think about several engineers who all want to grow, well, somebody probably gets the most choice project and somebody may get the first chance to step up or the chance to present to the CEO or to go on a key business trip. Some of that again gets called politics and it can be it can be that I as the manager am choosing a favorite or focusing on someone but it also can be that um the engineer who isn't thinking about this I think can be limiting themselves. I say and I bet you see this you may have your own words for it. I say most engineers, most people in fact, their basic approach to work is work hard and hope to be noticed. And I noticed you just published an article. I saw it at least this morning that said your hard work is what makes you the same as everyone else and average. And that's why work hard and hope to be noticed isn't a very good strategy because probably you're at a place where lots of people work hard and are hoping to be noticed. To go on, you ask for like the top one to three things on politics. The top one thing is get over your issue that I don't need to do that. I shouldn't have to care about that. I hate the word should. You may have heard this from me before. Should is this word that disempowers us because suddenly I'm waiting for what should happen or someone else should do as opposed to what I need to do. So for politics, the first thing is be aware relationship matters and accept that. Accept that you work with other humans. Those humans are influenced by how easy the working relationship is with you. Maybe how much they enjoy your company. It's all those things. So the first rule is accept politics are real. The second rule I think is be reasonable. Be I love the word reasonable. I one of my one of the worst things I can say about someone is that person is unreasonable. It's very >> difficult for me. And unreasonable in my case not only often means illogical, which is maybe how a classic engineer would take it. That bugs me, drives me crazy, but also intransient, no, you know, stuck on a viewpoint, close-minded. Those also strike me as unreasonable. But I would say realize that relationship both consciously and subconsciously colors, taints, influences how you're treated. And so by just being nice, many engineers get into the idea, they corner themselves in the idea that because I'm good and I'm right, I can be frosty. I can be thorny. I can be difficult. I can be a bit of a primadonna. It's true, you can, but I will never rush to promote you. If you're good enough, I may keep you. I may tolerate you. I may manage you, but that's never someone I'm going to be looking to move up. If I move you up, it's against my will. It's like, oh, I have to for some reason. That's a really high bar as opposed to I want to. So, my thing for someone would be, why put yourself in a situation where your manager is thinking, I'm only moving Steve up if I have no other choice? That's a terrible. But I think a lot of engineers put themselves in that terrible position out of like a pride that their work should be so good they shouldn't have to lower themselves to being friendly or nice about how they deliver bad news. So the last part you said three the last thing I would say is this is a learnable set of skills. The great thing is, you know, what's called emotional intelligence or this is all stuff you can choose to be different. And actually, while it may take a couple years, it's much faster than like a principle level track in technical knowledge. You can change your demeanor and learn a few new tricks pretty quickly and really turn around your experience. >> My definition of politics is similar to yours. It's around power dynamics. So basically, yes, there's a lot of people need to all work together. There's some resources, but I think we also need to layer in hierarchy. >> Yep. >> There's a reporting structure, sort of like chain of command that's going on. And I think your point about, hey, politics exists, right? It's your choice as to whether you want to engage with it or not. If your default is to disengage, you will lose this game by default. >> Yeah. You're not getting on the field, right? You're you're forfeiting. >> Yeah. So basically there's this, oh, I've detected politics. There might be maybe, you know, an unethical undertone to what's going on. And the moment you disengage, the people that are maybe playing bad politics or the people that are doing some some things that you don't particularly like, they you're giving them ammunition to step all over you. And so that I think further reinforces this idea that you don't want to play this game of politics. M >> and so it almost like allows them to and this is a I think a an ethanism like turtle up a little bit and just be like okay you guys go do the politics thing over there I'm going to go write some code or I'm going to go and work on some tickets or I'm going to work on this project. I believe that's very great what you just said like you have to understand that this game is going to be played with or without you. >> Yeah and you know we call it a game even that makes it hard. It's just the life of human relationships. >> Quick word from today's sponsor, Linear. Linear has been a sponsor for almost a year now, and in that time, a lot has changed in how teams build software. Coding agents like Cloud Code blew up, and they're being used to write more and more code. Writing code got fast, but reviewing it didn't. A lot of the speed that you get out of agents just get swallowed back up in review. Now, I spent 18 years as an engineer at Amazon. a lot of it reviewing other people's code. So, I know the feeling. You get a huge pull request with changes in some random order. The context is scattered across other tools and at some point you're either grinding through it or rubber stamping it. What people forget is that code review is how accountability spreads across the team. When you approve a PR, you're putting your name next to it. You own that change now, too. That's the part that only a person can do. Deciding whether the change fits the system and solves the problem the customer actually had. So a rubber stamp just puts your name on code that you didn't read. That's what diffs is for. It's a code review inside of linear right next to the issue that started the work. It opens up instantly and breaks a giant PR into readable chapters. The Y sits next to the code so you can decide whether it solves the problem instead of hunting through tabs to remember what the problem was. Linear used to track the work. Now it reviews it too. Check out diffs at linear.com/al. >> The thing I would say is I try and differentiate strongly between influence and manipulation. Politics can includes both. It's the big umbrella of political situations. Influence I define as I am trying to persuade you of something ultimately for your good. I'm trying to convince you of a better technical solution, a cheaper implementation, a new architecture, whatever it is, but I'm doing it not only because I believe it, but because I believe it will actually solve a problem and help you. Manipulation is me trying to convince you of something primarily for my good. So that's often seen in some cases as sales. I'm trying to get you to pay for the most expensive option. I'm trying to get you to enjoy working on the maintenance work I know you don't like. So, I'm telling you this story about how it's important or whatever I'm doing. I'm trying to engineer your behavior around my good and benefit. Now, there's more depth than just motive, but I like to look first at that motive of what is the why. And so what I tell people who don't like politics, I say look, there are people who will try to manipulate you. You don't have to engage in manipulation, but get good at distinguishing is this person trying to tell me something because they believe it or are they trying to tell me something because it's going to help them? And second, what am I going to choose to do? Because I have a choice. If you are influential enough, you can stand up to the manipulators as well as actually help people. So when I speak, I think a lot about how can I be influential. I try to avoid thinking about, oh, how could I manipulate Steve into doing something for me? And I try and catch myself. It is normal. It's normal to think, what's the shortcut? How do I just get Steve to do what I need? And if I can get away from that, that's great. When I try and help people feel better about what you call playing the game and I would say engaging in relationships, I would say, you know, you can do this honestly. You do have to protect yourselves from the occasional sharks, but I also find the sharks aren't as numerous as we conceive. The last thing I would say is sometimes when you feel like you lost, it may not be that anyone did anything manipulative or unethical. They were just very influential. They were very good at making their case and without them doing anything they shouldn't. They just made a really good case and you didn't. So you can lose even on a totally ethical playground. >> Help me understand the distinction between influential and being manipulative. So being manipulative is doing a thing because it would benefit you >> and then being influential is doing a thing because it would benefit the company or the team. Yes, >> there's an intersection, right, between >> there's an overlap. There's an overlap where I can get a benefit for sure. So, let's say you're my manager. Something I tell people a lot is let's make a deal. You need a lot of extra work on a project. I want to move up. I can make a deal with you, which is very open and mutually beneficial that says, look, I'm going to cancel my vacation and sacrifice some extra time to deliver this thing that we're behind on. In return, I would like your assurance that if I do that well, you will fight extra hard in the calibration to make sure I'm acknowledged and try and make a deal. That's not manipulative. That's good for you. You get the work done. It's good for me. And the trade-off is I'm giving up my vacation. And you're bracing for the awkward conversation where someone from another team says, "Well, why is Ethan really top tier?" and you're going to jump in and say he's absolutely top tier blah blah blah as opposed to say well you might have a point we'll rate him something else that's influential manipulative there are many ways to be manipulative one of them though using the same thing is I can make an unethical deal with you and say look I know that you manager would like to grow your team because you need more resources I'm a principal engineer I'll write up a story about how there you know this project is just so much work, we need more headcount. And of course, I have the skills to make it sound very complicated. That would be one way to do it. There's many ways to be manipulative. Another way to be manipulative is to say, well, you should be rating me top tier because I know it's me and Fred and let me show you Fred's bug list or let me show you this code review of where Fred brought down the service. There's a lot of nasty things you can do. How do you know whether somebody's influencing you >> versus somebody being manipulative? Right? Because I think you're framing it as like there's this deal that's going on. We can scratch each other's backs collectively, but I think that there's a set of decisions that are happening maybe at a level above me if I'm an IC. And I get the sense that >> it's much more being much more manipulative. It it looks like they're playing pool, but the the pool table is kind of slanted and, you know, towards a a particular pocket. You don't know what happened in that room when they made a decision. And that sort of gives you a sour taste in your mouth. It just looks like Ethan's getting what he wants. How do we navigate whether you're being influenced or whether you're being manipulated? >> Yeah. So, one of the things is actually the amount of transparency. Are the decisions happening in the open? Is everything being discussed in the open or are things changing behind closed doors where I talk to you and you say, "Okay, we're going to do this." And then a little bit of time passes and I find out you didn't do that. When I come back to you, you say, "Oh, well, I talked to Fred and you know, we had to change." So, one thing is the amount of transparency, but I would say in general, one of the drawbacks of trying to be ethical is it leaves you exposed to losing the first round. What I mean by that is we all know the phrase fool me once shame on you fool me twice shame on me. I think with politics if you choose to take an ethical trusting approach you may get burned occasionally but then that's where you open your eyes and say okay I was working with this person what I understood them to be telling me about the benefits of this solution or or the necessity of this schedule or whatever didn't turn out to be true don't seem to have been true maybe that was an honest mistake but this time I'm going to be skeptical and then if I see it again. I see it again. You know, there's another saying, I 