ield project that, you know, was going to allow him to get to staff engineer. He had this idea that he might be able to push through it and get at the other side because there was still some manipulation that was going on. They needed him to do a bunch of stuff that he ended up doing, but ultimately did not reward him for that. >> I think that's a common story. I have clients as well in my community who tell me the same thing which is they were working on good work that was interesting work. They wanted to see the work delivered. They didn't want to see themselves as quitters but that led them to an exposed position and now they have bitterness about having put in the work. I do think one thing you can do is you can try to make a choice that says I have awareness that staying here may burn me but I want to see this project through or that can insulate you somewhat where you're like okay well I knew this was a price I might pay I have had some success in my own life looking at a situation and saying I see what's likely to come out of this and I can still accept that and it would have hurt a lot more if I hadn't pre-accepted the outcome come. The other thing I would say though about managing up is that is an art. It's we talked about politics. Maybe managing up is a special case systematized piece. Managing up involves first understanding that it's a totally legitimate skill. It's not manipulative necessarily. When I'm a manager, I actually want you to manage up to me in an ethical way. Meaning, let's talk about each other's styles. Let's talk about how I like information. and let's talk about how you like to work. Try to find a middle ground that makes that so that I get the information I need and you get the resources and freedom you want. How do we do that? And then second, let's talk about when things go bad. How do you like feedback? Let's talk about emergencies. You know, what are you willing to do if if I have a problem? If you have a problem, that's all part of managing up. And there's an art to it. There's an art but also a process of understanding essentially how do I make a manager's job easier where easier doesn't only mean less work it means also it does mean less work for them or less hassle but also therefore more streamlined for them to help me how do I if I need resources or I need money how do I give them a case that's easy a lot of people like this analogy I describe for all boss employee relationships. As a manager, everyone who comes into your office is either bringing a bag of poop or taking one, >> right? And they're either setting it on your desk. >> Well, what's the source, by the way? >> Well, yeah. Uh, but they're either bringing you a problem and saying, "Manager, I don't know what to do and I'm throwing up my hands. You solve it." Or they're coming in and saying, "I have solved this and I'm letting you know." Or, "What do you need me to solve? What can I take off your plate? What can I do better?" For obvious reasons, managers appreciate the people who are taking problems away off their desk, not those that either by coming into their office or worse by not coming in are sort of dropping off problems. >> Y >> even some managers that you don't match with stylistically, even some managers who aren't maybe the best humans on earth still largely learn to appreciate those who are easing their lives as opposed to those who are making their lives more difficult. And so this can be a spiral again, but try to be the one making things easier. And then if that still doesn't work out, there are just there are both rotten people and there are just people with no stylistic compatibility at all. And that's okay. Like it's okay, no stylistic compatibility. You know, I think you and I have touched on the fact that I went and interviewed at SpaceX. I don't know if that's something, you know, but in the end, you know, Elon Musk and I were speaking and we realized we had differing views of a critical thing. I can't throw stones at the man's success, but I also know it wasn't a fit for me and I'm okay with that. And stylistic difference. >> Well, no promotion has ever gone through in the history of time where the manager was not supportive of that promotion. Yeah, >> maybe there's a skip level, but somebody in your management chain needs to stick their neck out and say, "We should promote this person, right?" There could be a project that you want to complete because you said you committed to it because it's going to show that you're working at that next level and it checks off all of the boxes. But ultimately, if your manager is not going to support you because of stylistic differences, because of incompetence, because they're manipulative, I think that's signal enough to pivot independent of how not juicy that project is. I agree with you partly because I think most engineers, they can find juicy work anywhere. There's no shortage of hard problems. There's no shortage of technical fascination. I'm sure there's a few people who only want to work on this one thing that then becomes a choice. I so much want to work on cold fusion that I have to work under this bad lab manager because there's only a very few cold fusion labs in the world. >> That might be true, but for most engineers, there's unlimited technical challenge. Go do it somewhere you'll be appreciated where the styles match. I think a lot of us, and I did this too, we fear how hard it is to move. Why? Because moving jobs is not our skill set, right? Our skill set is engineering or management or whatever we do. It's not job hunting. And being unemployed sounds very bad. And if you've been unemployed is very bad. And so we fear that, but we fear it too much because that's another learnable skill set. It's quote unquote just work. Do the work, find the job. I think, you know, and this we're talking about this particular person. If you're really good at what you do, finding a job is just a matter of time. It's exactly what you're saying. There's this inertia. There's this fear of change that goes on. You have all of this like self-worth associated with your with your work and your job. And if that goes away, you take a hit on that no matter what. No matter how much you think about it rationally and logically, >> it is super disruptive. There's a lot of paperwork involved too with like you know getting unemployment and you know you might have health insurance stuff as well. So it's not something people electively do unless there's a good reason. But I do think that once you've run those experiments with your management chain and you know who they are, I think you should just trust that they are not going to change. >> No, they're very unlikely to change quickly enough. And why would you why should you be the experiment? People do change, but why would you wait around to see if it's going to happen now, right? >> It's like a romantic relationship. It's like I can fix him, >> you know? It's like going to happen. >> It is. And that again goes to the relationships and parenting and the you know often the choices to get out. People get into this hope cycle. And in fact with abusive relationships, the other part of it is well if I just do this thing, you know, the abusive spouse or boyfriend or girlfriend or whatever is giving this whole list of things they want and people get into the idea of, oh, if I just do this and then I just do this, suddenly this person is going to be a different character. That never happens or happens so rarely. So I agree with you. Change jobs. And on the job changing, there's a lot of evidence that it is just work. In my business, I coach a lot of mid-level executives, and I can tell you, it's really funny. I talk to people who have jobs at an Amazon or a Google or an Apple, and they're all afraid to leave. They have been for a couple years. And then I talk to the ones that got reorged out, fired or whatever. Yeah. >> And they've all found better jobs, almost 100%. And I would even say some of them, you know, of course I have opinions across my client base. All my clients are very smart, but some are more skilled than others, just as I'm sure is true in your community. You may not share those opinions, but even some of my clients that I think are maybe not the top performers have found great jobs. And I see people who I think are stronger performers holding on to that position with dear life despite headwinds. It's highlighted to me how terrified we are as a group to switch jobs. >> Getting back to the subject of managing up. A pattern that I've noticed quite a bit is you might start a new job, you might get moved to a new team and you're filling out your manager. you had made the analogy of, you know, either leaving with a pile of crap or bringing a pile of crap to your manager. One thing I've noticed is that people will go and they'll basically get into order taking mode. And so they'll be like, "Ethan, what should I be working on?" If I were to use the take a bag or leave a bag analogy, I feel like we're kind of bringing a bag when we're when we're in this sort of like order taking mode. Like, hey Ethan, tell me what I should be doing right now. >> It's very junior if nothing else. It's putting the burden on me to figure out what you should be doing as opposed to I think you obviously have seen this. It's more helpful if you come in and say, "Ethan, I've surveyed my area or I know I've learned about our team's goals. I'm working on A and B status update quick. I see I could do C, D, or E. I think there's the most benefits to E. My favorite way to phrase that is would you like me to work on E or is there something else you'd prefer? So I try and teach people give a clear option that you're just going to go do but but open the door if they because they can either say no D is more important or they can say you didn't know about Q and actually what I need is Q. But most managers are going to be that sounds great. And then the highest level of this helping your manager is where you're messaging them or stopping by and saying, "Hey, I noticed CD and E needed to be done. I've handled them because I I'm writing a book. It's called the magic loop. You've heard me talk about the magic loop. You know about it." That's the point where the magic comes in where you at least to me as a manager, you become magical because you're telling me about things I didn't even know needed to be done and you're handling them. Well, that's where if I'm a good manager, I'm like, "Oh, wow. I have very few magic gnomes in my team." And this is one, I've gota I've got to feed my magic gnome and and you know, whatever the gnome needs, I don't know how the gnome, you know, I have to figure out like what is it they like and where is their mushroom that I can, you know, make them happy because right after you come and say that, the next person comes in and says, "What should I be working on?" or even worse, oh yeah, you know, whatever. It's Friday. I got blocked on Tuesday by, you know, team X and I've been waiting for our one-on-one so I could ask you, can you help with team X? And, you know, that's just one of those like, oh my god, you know, what have you done for three days? Is it Facebook or Instagram? Like what? Turns out both, plus some Tik Tok. Yeah. Yeah, >> there's another client of mine. Um, you know, this bias for action thing where you basically, hey, here's a thing that needs to be done. I've already done it. Don't worry about it. That being so magical, that's like I think the epitome of bias for action. I've been thinking about it a lot and it's basically you're bringing a pile of crap to your manager when you ask for permission. When you ask for permission to do a thing, they're like, "Okay, wait, hold on one second. What are you asking for? Why does it need to be done? Why are you asking me for authorization? I don't even know whether I have. So, it's this like big unbounded thing that's going on. So, I had a client that came in and he was like, "Yeah, I want to work on something extra." He's working on some internal tool. He wanted to go and make a an improvement on it. And so, he went to his manager to ask him whether it was okay to do the improvement. I was like, "How how long did it take you to do the improvement?" He's like, "Oh, like half a day." And I'm like compare and contrast like you going to your manager and which is what he did and asking whether you can go and do this thing that's unequivocally positive for everybody involved or you just going and doing that thing and letting him know that you did it. >> Which one makes you more valuable in his eyes? Cuz in in the first one, he brought a small bag over to his manager. In the other one, >> he was like he solved a problem his manager didn't even know existed and then everybody's happy with him. I think this is trust and a relationship progression. Managers are very afraid, at least many managers are very afraid that someone's going to make them look bad or screw something up. And so you build a trust where I learn that your judgment is good. You talked about the Amazon principle that we both share and know of bias for action. The one that goes with this is be right a lot. I want you doing things on your own if I think your judgment is really good. I once had a director working for me who is very earnest and a wonderful person and I once had to tell them right now anyway your product judgment is so poor that when you suggest something for our product my first thought is how would I do the opposite it's probably better and this was a terrible message to need to give this person but I definitely want them coming to me to ask about product plans So it is this trust. Yes, as an engineer once you've delivered and I know that you do good work and I know that you have good insight. You know I had an engineer, this goes way back. It's actually someone you might know from when we worked together. I won't name names. They were having an argument with someone else at Amazon about a deployment. We had a bug and they felt this other team's recent deployment had caused the bug. Well, in Amazon tools, they had the ability to roll back the other team's deployment and they exercised that option. Luckily, they came to me right after they did that and said, "I may have done something I shouldn't. I just rolled back another team's deployment." Well, we ran over to that other team's office. They were scrambling around and like we talked to them human to human. I'm like, "You don't know me. I'm so and so." They're like, "You just rolled back our deployment." I'm like, "Yes, we did. And I'm sorry about that. That was a tactical error and we're here to discuss it and we were able to claw out of the hole we dug. The point is I want you acting independently once I know you're not going to roll back somebody else's deployment without talking to them. So yes, with qualifications of course I I would rather you just do great stuff and I learn about the magic. I think you build your way into that a little bit with trust. If I have a brand new employee who's like, "Hey, I just, you know, made this huge bet on something, that is scary to me if I haven't built that trust." >> When it comes to managing up, I think that there is a particular dynamic that I hear quite a bit around expectations around work increasing, especially because of AI. We have all of this AI, it writes code for us. Uh, here's some more stuff on your plate. By the way, you should be 10x more efficient because the AI is doing all of this stuff. We had this problem, I think, before this recent AI thing where yes, I want to manage up. Yes, I want to build the relationship with my manager, but they keep on piling things onto my plate and they're overloading me. >> So, how do we circle that square? >> Yeah. So, this is really important. I'm glad you asked. I think there is an art as well again as a science to talking to your manager. And the essence of that is I'm doing a lot of things for you. You seem to appreciate it. When I say for you, for the team, for our shared goals, I'm being very productive, but there's a priority and a value to the things I do. I may bring you a proposal, but can we talk about moving some of the lower priority things I'm doing off my plate so that I have more room for the higher value? And that can mean not doing them. It can mean investing in automating them. It can mean giving them to someone more junior because nobody likes to think of themselves as junior. But there is truth that one person's boring wrote work is another person's completely new. Oh wow. The other thing is there is taste. While they're rare, I have met people who are ticket ops and maintenance lovers and machines. They don't want to work on the new project. They love trying to take what exists and refactor it. Whichever person you are, you're trying to find that counterpart person or get your manager's help. How can I move some of this? And the the way you make that win-win with the manager is simple math. I think you're getting benefit. You like what I do. I like what I do for you, with you. But I'm now at capacity. What can we do to free I here are my ideas on how to free my capacity. What can we do together? That's the key. And managers, this is a place where they should be strong is they're all about priorities and capacity and resource management. That's actually the game they play all day. While you're playing the how do I make this work, they're playing the how do I move the chess pieces. There is the flaw where some managers will be like, well, you still have Sunday morning free. Yeah, >> you know, and that's again where you may have to then learn something about character. >> Well, I think you know, uh I'm just channeling my clients by the way, you know, but basically >> I thought about I have to say, by the way, it seems like this has suddenly become Ethan coaches Steve's clients, which I don't mind. So, I hope whoever these nameless clients are, they're getting a lot of value, which is totally fine. >> You know, by the way, I'm answering them, but I I have a thread in my in my community, which is basically like, hey, I'm interviewing Ethan. are there any questions that I can ask them? And so I've already talked to them uh as well, but essentially uh if I were to channel this particular client, she would say something like everything that's put on my plate is of high priority and you know, I can maybe show him the math of all of the stuff that's going on. The retort might be, well, you have AI now. You should be able to go and find some time. I do absolutely agree with you though that this type of the reluctance for pushing back when your plate is full is a very junior thing and it might take quite a while before you actually understand this skill. Not all things are prior like high priority. It's not every every task is like evenly distributed in terms of prioritization but it may be presented to you in that way. >> Well, so let me give you the manager perspective. If I told you I'm here for the empathy for managers, >> one of the dangers of being the magical person for a manager is I don't know when the magic runs out. What I know is if I ask Steve to take care of something, it gets done well, quickly, and right. >> And there is something we teach managers, which is if you want something done, give it to a busy person. Now, this is counterintuitive. Why don't you give it to the not busy person? Well, the reason that person is not busy is they probably aren't that good, right? Like work has been moved off of them as you find that it's usually late or usually buggy or usually flawed. The busy person is very efficient, very effective. So if you actually want something done, you give it to your busy people. The problem is if you don't push back, you're now relying on me to have a better picture of how much capacity you have than you do, which is nuts. As you know, in the modern workplace, there's always infinite work that can be done. there's always more features or more ways to optimize. So, I have an unlimited amount of work my team could do that would help our team. I give it out and as long as you keep saying yes, I can fall into assuming either A, you have time or B, you have flexible capacity and you're not upset yet. So, even if I'm a good person and just not that observant, I can imagine, oh, sorry, the other flaw. Every manager ever probably envisioned that what they've asked you to do is easier than it is because I'm not in any of the details. So just like I hate the word should, I hate the word just. Can't you just? Oh, can't you just add a database column? When I say something to like that to you, the principal in you is thinking about 50 things and thinking no and you're an idiot. Whereas I'm like, well, I don't know. just can't we just add a new key. I try and never use the word just I do sometimes. I try to avoid it for exactly that reason. But that's the manager flaws. It looks simple to them. It's by the way the same for product managers and whoever. It looks simple to them. So I think I'm asking you for 10 minutes and you know I've asked you for 10 hours even with AI. Bottom line is the manager needs information. If you tell them, well, it seems like just a key, but blah blah blah, or actually, this is the sixth ask this week. I only have so many hours. They may not even know. Now, again, there are the managers who are like, tough. Those are the ones to get away from. Yeah. >> Have you ever heard the saying, never ascribe to malice what ignorance explains? >> Yeah. >> I think because managers behavior can be so damaging, many people feel malice when it's ignorance. And I try not to be ignorant as a leader. We're all ignorant because I don't live inside your head and your life. So, of course, I'm ignorant of your constraints. >> What I'm hearing is this person should turn the problem into a math problem and attempt to educate. >> Transparency. Math is one way to be very transparent. >> Here are the eight things that I'm responsible for. These things blew up. Maybe we just use the word just or should there. help me find more hours in the day or can we prioritize all of these things on my plate? >> Yeah. And one thing I love to remind people and ideally I tell managers is I ask them, "What were you doing last Tuesday morning? Did it matter?" Well, most of us have no damned idea what we were doing last Tuesday morning. It's so yesterday. But if we go back and look, we ran a meeting or it wasn't pivotal work. Much of the work we do ends up being wasted. And so I think lots of work isn't that valuable if we really look at it. We're doing it for inertia, for legacy reasons, because we always have. You know, I talked to people who are producing reports that no one reads because three years ago some other director was in charge and at that moment there really was a report, but no one has said, "Do we need this?" Humans and particularly big businesses are terrible at killing things. Does Amazon still have Mechanical Turk? Do you know? I tried to kill this project. Other people tried to kill it. It was this zombie project and for different reasons, even the team that owned it didn't really want to work on it anymore at times, but like no one could quite get to like let's just pull the plug. >> I think companies are full. You may know of many zombie priorities like that. Last thing on managing up, which is like, hey, we're trying to do this thing where we're removing bags of crap from our manager. I think a common question that people have is like, I don't know what's on my manager's plate. I don't know how I can help my manager. I've just been in this order taking mode for a long time. How can you get a foothold into where your manager's head's at? >> There's a few ways, and I like to give people different methods. Uh, one is look at anything they've written or said. What are they saying in the all of hands? what are they sending out in their status report? Uh that's one. The second is you can talk to other people around like oh what are our group priorities? What are our you know what are you working on? You can kind of look at the pattern of work and figure out where it's going. The third is fundamentally how does the company make money? Because what you're doing somehow ties to how your product makes money. And then of course I've left the most direct to last which is simply ask. Oh simply is like just want to be careful there. Go ask and there are many ways to ask. There are classic formulations managers will rec recognize. What are your priorities and how I can I support them is one but the other classic one is what keeps you up at night. I recently was talking to someone who said they had learned the rule always insist on working on their manager's most difficult problem. They were in they had a good relationship with their manager and you know they talked to their manager and the manager would talk about problems or priorities and they would say what is your hardest problem? What is most upsetting to you? Or if they got a piece of work from the manager they'd say is this your most important problem and if the manager said no they would argue to go work on the most important thing. I don't know if that applies all the time but these are ways to get at what is the manager thinking about. I have surveyed thousands of managers both in my classes and at Amazon before. Offers of help are rare and stand out. And all managers have a worry list in their head. They've divided their team into some formal or informal breakdown of who they can worry about the least, maybe none, and who they need to worry about the most or what projects. Just they have it in their head already. You simply need to offer them a safe place to express it because they would love to tell you about their worries and have you help with it because if you will help me with it, I can worry about it less. And I uh you talked about managing up. Another rule employees can take away. A place you can trust almost any manager is when it's in their own selfish best interest. So if you will handle a problem for me, it is in my own selfish best interest to give you what you need to do that. whether it's information or permission or encouragement or skills. We don't have to like each other for me to realize I should probably help you help me. It would be like, I don't know, hitting your doctor with a stick or something. This is, you know, you need the doctor's help. Hitting him with a stick is not going to get that. You're better off to say like, doctor, you know, do I need to lay on the table? Yes, you do. That's how I can do heart surgery. Like, same thing with managers. Make it easy for them. >> How do I ask for a raise? So, first good news. Only 30% of people ask for raises. 70% don't. But of the 30% who do, 70% of them get something. They may not get what they wanted, but they get something. So, the bottom line is the math favors asking. How do you ask? The best way to ask is number one, don't open with I want a raise because that's personal. It's selfish. It's I would like more money for the same work. And if you just step back, why would I do that as a as a company? I'm paying X dollars today. You wanting X plusN dollars tomorrow is bad for the company's bottom line probably. Why would I do that? Well, I have to have a reason. So, give me reasons. One reason you can give, of course, is high performance. Look at what I've done. The second one I often recommend is find a framing that humanizes it. The most common one if it's true for you is family. I need to be thinking about my family. You can pull in anything that's true about an expense, but the the point is you can you want to try and make it that it's not just about you and your greed. The second thing is comparisons externally and internally. Doesn't mean you can't ask for a raise if you're very well paid. Mhm. >> Then though that has to lean much more on high performance. The easiest case potentially is I'm doing good work and I know I'm low in the salary band. You give the reasons that are like you should do this because it's fair and I know you have the room. The hardest reason is I want to be paid much more than the average person. Then I have to make a case as to why I'm delivering that value. The fundamental thing is how do you enlist the manager in wanting to do this? It's not you need to give me a raise confrontational. Why won't you give me a raise? Those are terrible framings. Instead, I would like to make more money in order to better take care of my family. How can we work together so that that's an obvious case for YouTube that you can help me make? That's the collaborative. You were on our mutual friend Ryan's podcast two times >> and there was a there was a term that struck me. It's this uh polite fiction >> concept. what is it and how should we be using it in the context of politics at work? >> So I think polite fiction is the concept of sometimes it's everyone wants to hear something pleasant that may not be completely true more than they want to confront the truth. The most common case of this is where I casually ask you in the hallway how you doing and the totally accepted answer is fine. I'm really just saying hello and I don't want to hear about your girlfriend. >> Yeah. >> So, polite fiction, the the literal example is where you say fine, even though maybe things aren't great. Now, it doesn't mean, by the way, if I'm a caring person, I don't want to hear if there's a real problem that I can do something about or if you just need an ear. But there is a polite fiction notion of we all smooth some things over. The place where I talk about the most polite fiction is interviewing. Most people aren't comfortable saying, "I'm going to be out on Monday. I'm going to go interview somewhere else to see if it's a better job." So, instead, they say, "I have a doctor's appointment." Well, what I talk about as polite fiction is I know enough that when you say you have a doctor's appointment on Monday or Friday, a little flag goes in my head and says, "Maybe." But I don't want to confront you about it. I don't want to ask you, is that really a doctor's appointment, Steve, or are you interviewing? What I do is I let it slide. You let it slide. We don't have to have that potentially difficult conversation. You might want to choose to have it instead, but what I do, and this is where polite fiction has its limits, if you're on your third Friday doctor appointment in four weeks, I kind of know something's going either you're very sick. I may have to ask you about it or I can start asking myself how am I going to backfill Steve when he leaves or can I do anything to save you. I see polite fiction as a reality that people tell white lies the so-called white lies even though I believe very strongly in telling the truth. Another place people force managers into white lies for whatever reason companies love there are some reasons but they love to keep layoffs secret and so employees will come into my office and say I've heard a rumor that we're about to have a layoff. Are we going to have a layoff? Unfortunately, at that point, whether you consider a white lie or not, I have to put on my game face because of orders and because of company policy and say, "Absolutely not. We're we're going forward full speed until something's different." Now, I may choose for someone special to take a risk if I think they'll not let it out, but there are places where company policy can create all kinds of problems. If you don't like that one, another one is, "I've heard that Fred is being investigated for malfeasants. Are we going to get rid of that guy?" I can't answer that. So, I can either say, "I don't know anything about that polite fiction." Or I could say, "The problem is if I say, I'm sorry, I can't discuss anything." That's confirmation. >> So, those are where those things come up is >> you can see where a polite fiction could be used as a justification for manipulation. We were talking about that spectrum between influence and manipulation and the overlap that was there. Where do you draw that line? >> Well, this is really important. I draw it differently depending on my relationship to the person. >> Both how much do I trust them and how much do I care about them? Someone who's low on both trust andor care. I will lean more towards both dishonesty and manipulation because it's easier for me and less emotional cost for me. And so that's the point we made all the way at the beginning about play this game or lose it. If you're someone I've decided is just a cog in my wheel that is a little bit abrasive. I don't owe you anything. And people get mad at that like that that executive just said they don't owe me anything. They're going to abuse me. Yep. You know, I only have so much energy. That's going to happen. And you can dislike it or you can do better. On the other side, if I have time and I'm not caught by surprise, I always try to think about what is the most transparent, honest thing I can say because I believe that builds trust. So, a story from early in my career is I did learn that a layoff was going on. My my manager came to me and said, "I wanted to let you know we're laying off people in the organization today. No one on your team is affected. You can't tell anyone." I was a brand new manager and the first thing I did was run out and gather my team to tell them there was a layoff going on and none of them were affected. My manager caught on. I was doing this, walked into the room while I was explicitly violating what she said. >> Mhm. >> Luckily, I had a very good manager with a very good relationship and he said, "You know, Ethan, you can't do that. I'll remember you did it, but I will say I understand and that probably I'd have done the same thing at your age." And so, I got a pretty big pass on that. So, that's the other end of it. Where do I draw the line? I wish I could say I always drew it perfectly. Here's a truth that is important to know about your manager. I and I think all other managers lie more when caught without time to think through what do I want to say? What can I say safely? Because we have this loop and I think all humans do this. We have this loop of what can we share safely? And if we don't know, we're going to go to the minimum. Nothing. I can share nothing safely. So I'll say nothing. As for manipulating, another important rule, these are actually the real, we're ending with the real politics. The more secure a person is, the less they may choose to manipulate because they can afford to. >> You're well aware that I've retired and I retired with enough money. So, I can afford to be transparent. Why was the podcast with our mutual friend Ryan so successful? I could afford to talk transparently about things that I might not want to say on the record if I had to go get a corporate job the next day because some corporations might not like me talking about how I feel about certain HR policies or whatever. Is your person that you're working with secure? Because an insecure person is going to be more about protecting their own security than they are about being transparent or truthful. And I believe psychology backs me up on this. All people will lie when they're under enough emotional duress. This is actually, we're going to go very dark here. It's why torture has been discredited as a method to get information because if you put someone under enough duress, they will say anything to make the duress stop. And this is true in work and in life, which is if you corner me as a boss or as an employee, I will say the most outrageous, transparently things and stick to them because I'm trying to protect myself and eliminate the pain. So, if you want truth from someone, you have to help them feel safe and secure. It's the only way you're going to get truth. And this drives some people nuts is like, why do I have to manage you to get the truth from you? Well, it's only if you want it. It's only if you want the truth. Is there a way to as a manager, as an employee, have integrity and just not be dishonest, not be forced to lie? Whether that's a lie of like a little white lie or it's a lie of omission. Is that something that's possible or is a polite fiction sort of part of the game? I am sure it is possible particularly for a company owner in a very profitable position where if someone asks are you considering layoffs and they were planning an announcement or thinking about it they they are okay saying something like yeah I'm thinking about layoffs you know and just letting that message take care of itself. I don't think in practicality you're going to find that from almost anyone. I hate lying. I hate doing it and I hate being lied to. And I'm still going to sit here and say there are cases where every manager and every employee lies for so many reasons. Reputation, self-image, you know, a simple one. Let's say you went out with your friends last night and you had a particularly good time and it went longer than you thought and you're kind of dragging yourself into work the next morning and you're late. Oh, Steve, you're running late today. Everything okay? Most people are not going to decide that's the right place to say, "Well, I'm actually pretty hung over. We drank a lot." And that's just like even an innocuous case of it. It's just again, that's a polite fiction where you're more likely to say something like, "Oh yeah, you know, a car alarm went off in our neighborhood and I didn't get much sleep." That's a pure lie. But people are going to do that. I try to be as honest as possible. If it pisses off some people who follow me or you, yes, I lie. I hate it. I hate it when I do it. And I don't think it's avoidable. And I'm not going to tell you that you're going to find any truthful people. Like where truthful means always. I don't know any, never have. >> I appreciate your cander. I think I would have tried to weasle my way out with the polite fiction that there are people who don't lie. >> That there's a way to do it. >> Um, but I I do think there are levels to this stuff. Absolutely. >> There is a blatant mistruth where you're completely bsing people and then there's the stuff that you know you need to say because that's part of your job. I do think that there's a little white lie that exists. You know, we might teach our children that, you know, under no circumstances is it okay. I just think that the reality is that this is >> this is the reality of of working. >> What are the levels of it? They're required to because of a security clearance or whatever. No, I don't know anything about our plans for war in Iran. Could be a complete lie, you know, that they're required by their government job to say. Then there's lies that are at least protecting yourself, meaning like I'm protecting, you know, I don't want to admit something unsaavory or whatever that I was up all night last night screaming at my wife. We're getting a divorce. I don't want to share that. So, I say I'm fine. Then there are lies that are much more designed to advance myself at your cost. Yeah. >> And those are the ones that we really dislike. I get that everyone wants to believe that everyone else would be truthful with them. First thing, go own your own lies, please. You know, if you can go look in the mirror and say, "I have never told any sort of falsehood, then come meet me. I I want to know you." >> But second, there's the lies that are trying to hurt others. And there are also one thing I often teach people, collateral damage. Often you feel like someone targeted you where the person actually was just thinking about themselves and not about you. It's a little bit off topic, but there are definitely levels that's a big sign of maturity is where am I willing to accept some pain in order to do right by you. It's a big sign that you have a good boss is where is the boss willing to accept some inconvenience or discomfort or even suffering for themselves as a part of the teamwork. You know, you saw me when I was coming in today. I was texting. I think I said I'm finishing up something with a business client. We were discussing our relationship and how we had a partnership relationship where we were willing to suffer a little bit of difficulty and frustration in order to help each other. He was willing to do more inside his company to help me and I was well that's the relationship you want and it's a huge sign of a relationship to invest in is where will this person sacrifice? You didn't ask this question but people ask how to earn trust. You normally earn trust through sacrifice. In other words, the simplest definition of trust is you do what you say. But it's much more impressive when I can see that what you said is now costing you a little bit. That's where I become impressed. You're working longer hours or you're whatever it is you're doing, working longer hours is too overused, but you're dealing with difficult people or you're spending money or any sort of sign that impresses me a lot more than only you came through. >> Ethan, thanks so much for stopping by today. If they wanted more from you, where should they go? Yeah, ethan evans.com is my website. It's got all of my classes. Uh, one day when my book comes out, I have a book contract. Books take a really long time. My book will be there. And, uh, of course you can follow me on LinkedIn or my newsletter, but all of those are linked off my website, ethan evans.com. >> Great. Thanks so much. >> Thank you.
