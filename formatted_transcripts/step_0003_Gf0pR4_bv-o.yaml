hich I love to tell people, it might be one of those insider tricks. Talk to others, right? Study a little bit. Usually you're not the first person to interact with them. I coach people if you're considering taking a job, try and find someone at that who's either worked for that boss or worked at that company and get some data. I was just speaking to someone who was interviewing and got themselves to an interview uh like a second stage, but then they checked references. They found two people who knew that boss and as far as they could tell, those two people didn't know each other. They had worked for the boss at different times and both of them said, "Oh, I don't know if I'd do that." And it was it was their very clear signal to back away. That's an engineer being emotionally intelligent. Is it political to check references on your boss? Well, but some people would say so like why do I have to play that game? Shouldn't bosses be good? Shouldn't the should word, right? Shouldn't managers make sure bosses are good companies? Shouldn't they train or that's playing politics, but to your advantage and in a very ethical way? >> Yeah, lots of things to unpack there. Mhm. >> One thing that I noticed is managers can be high performing and low performing as well, not just IC's. And I think as an IC, you think of managers as the adults in the room, like the parents. Like they assign you stuff. They say what you should do, what you shouldn't do. But you can have a manager. >> Mhm. >> Right. That is just not skilled, doesn't know how to grow their people, doesn't know anything about the domain or the projects that are there. And you can have a wonderful manager as well. And so I think a really big mistake is just thinking, "Oh, they're a manager. They're an adult. They must know what's going on." I know plenty of adults that make poor choices. But the idea that an adult could make, you know, a set of poor choices when I was younger, it didn't make sense in my world view. What you said about losing the battle, um, or at least like taking people on their word and being trusting and for the first time you may lose. I give a very similar set of advice. I tell people good politics is called influence and integrity, >> right? That's very similar. >> Bad politics is all this toxic behavior. There's a lot of it. You know, backstabbing, lying, saying one thing, doing another thing, all of that other stuff. I tell people, yes, you can you can play good politics and win. You may lose the battle, which is the first time that you trust them, >> but ultimately toxic bad politics is going to catch up to people and they are going to lose the war. Your job is to stick around long enough for that house of cards to to crumble. I love that advice, which is basically we're going to extend some trust. You know, when we we detect some politics, we'll take them people at their word, but we should really notice their actions. >> Yep. And if their actions line up with their words, then you can trust them a little bit more the next time. If it doesn't, then we proceed with caution. >> And at some point, you may need to disassociate yourself from people, which maybe you do openly. You know, that could mean quitting or leaving or saying, "I'm not going to work with you." You may also need to uh depending on your environment, a highly political environment, you may need to disassociate yourself with someone very silently, like never tell them that you've decided they're not trustworthy, that that may not be in your best interest. I loved your point about adults. The image that someone applies with manager and employee is a parental one, right? My job is to set up the structure and organize the work and you know, your job is to be the beautiful child and do your homework and keep your room clean. But this is why the betrayal, this is why so many people are so angry at bad managers because it's like having an abusive parent in a way. And as you said, there are many ways managers can be bad. I like to differentiate. They're both real. Managers who have skill problems, they have a competence gap and managers who have an ethics gap. And you can run into one or both or even both mixed together. The thing I point out is very few people are trained as managers. They get moved into that position. And they may have even ambitiously sought it. But seeking management and getting education for management are very different. And yes, you get a lot of managers who are they just lack skills. You also get some managers for sure that are exploitative. They've gotten where they've gotten by driving hard. They see now, you know, they take the human resources thing where people are called resources. They take it very literally like, "Oh, Steve, you're my resource. You know, I own your life and here's what I I'm going to use your life for. Your interest in that is really not involved. I'm assigning you, you know, and it's very it's terrible in my opinion, but it's real." >> How do you know whether you're in a toxic situation with maybe a management chain that is manipulative and unethical? So, a a a client of mine in the community was he was in a situation where his boss and his skip level, they were both fired at the same time, but before they were fired, put him on a pip and then managed him out of the company. Was there anything that he could have seen earlier? Have you seen situations where like entire management chains are like let go? >> I have. Yeah. >> And I think there's a reason for that. I call it stacked flaws. So, this is actually something I've seen and it's also something I've done accidentally that I'll explain. Stacked flaws is if I have a flaw or a blind spot, whether it's more willful and I support politics or more I'm ignorant or have a bad behavior, I'm unlikely to see that as a fault in a manager working for me. And you actually were around to know some of the people in a management chain I created. It came to maturity after you 