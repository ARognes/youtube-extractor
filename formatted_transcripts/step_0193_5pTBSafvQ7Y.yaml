transcript: '[Music] designing levels is hard designing them without an editor is even harder and making them in a dimension that you can''t even visualize is nearly impossible or at least that''s what I thought it turns out there''s a clever way to do it that was so easy I decided to include a level editor with the game believe it or not my main inspiration for the track editor was Roller Coaster Tycoon one of my all-time favorite games the way the roller coaster tycoon track editor works is you have a set of track pieces that attach to each other one at a time like train tracks as opposed to manually placing them in space or something there''s a few differences though if the track was flat you''d only be able to turn left and right and tilt up and down but in four dimensions there''s four turning directions Left Right Anna and Kata in the volume view you can more clearly see that these are just rotations in four dimensions another difference with Roller Coaster Tycoon Is that real golf tracks can have branching paths when one track piece splits into several directions [Music] the way that works is after a split you continue down the first path until it''s marked as completed then the track continues on the next PATH and so on until the entire thing is finished so it''s kind of like a depth first traversal in fact because of the linear nature of these connections the levels can also be designed saved and loaded as text files by just listing out the track pieces plus metadata about the track like the par count rotations ball placement so this is another way to design some of the simpler levels to handle more flexible situations there''s also rotation and translation pieces which can be added at any time to make things like jumps or gaps once you get the hang of it it actually starts becoming really easy and intuitive to design levels and really gets you used to thinking in four dimensions [Music] foreign [Music] [Music] foreign [Music] lastly it''s about time I give an update on the status of 4D golf I''m getting closer to having the game fully playable end to end for testing but there''s still a bit of work to do before I get a definite release date a lot of the UI like this level editor is still in an early stage so they need a lot of Polish I''ve also been focusing on polishing other parts of the game especially the art assets and improving the style Miro has been a great help with that so I was super excited that they decided to sponsor this video I''ve actually been using Miro for a long time since hyperbolica and it''s been so incredibly useful it''s essentially an infinite digital workspace you can just drag in things you find on the web make drawings or notes and collaborate with teammates you can kind of just use it however you want but the best part is it''s completely free to use for most of the features you''ll know I almost never do sponsorships on my channel but I''ve already been using an endorsing mural for game development projects so I really can''t recommend it enough you can try it out right now using the link in the description that''s all I have for this devlog don''t forget to wishlist 40 golf on Steam if you haven''t already and I''ll see you all in the next one [Music] oh [Music] foreign [Music]'
