transcript: Hi my friends, welcome to this video. Nine years ago, I made a decision that actually changed my life. And I know that that sounds super dramatic, but it's true. I have always been a creative person, and I dreamed of having a life where I could focus on making art. I knew that I wanted that for myself, but as an 18-year-old, I was sort of steered in a safer direction. But after 4 years of university studying landscape architecture, I felt like I couldn't ignore what I truly wanted for my life anymore, and that was to be an artist. So, I decided to take a chance on myself
