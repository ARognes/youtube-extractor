transcript: Here's something we all believe, but rarely examine. That we can really know something is good for us and simply fail to do it. That is our knowing is finished. Only our doing is missing. We argue endlessly about that doing. It's a matter of willpower, we say, discipline, motivation, and so on. I've done a past video on that. I'll leave it down below in the notes if you want to hear more about that. We almost never question the former part. That is that the knowing was ever really complete. In this video, I want to suggest that that may not be quite right. If we come to see knowledge differently, that actually changes our view of wisdom as well. So, the claim I'm going to be investigating in this video is this. For the fullest kind of knowing, knowing that something's harmful and not doing it are never really separate. When they appear to come apart, that may not be weakness of our will, but rather a sign that what we had was something more like information rather than knowledge in the full sense of the term. This conception of knowledge has a surprising ally in the West, Socrates. It also has a whole practical tradition behind it in early Buddhism. So, let's go and follow it. Let's start with that ordinary word know. It has at least two very different senses, and the confusion that we're discussing comes from from mixing them up. The first is what we might call propositional knowledge, or knowing that. I know that Madrid is the capital of Spain. I know that the second slice of cake is not going to be good for my health. It's something that I can repeat. I can write it down. I can hand it to you on a piece of paper. And crucially, I can hand you that paper while continuing to eat that second slice. If it's chocolate, I probably will. A doctor who smokes is not necessarily missing any facts. It might be that in their case, the knowing that smoking is bad is both complete and completely inert. Now, there's also a second sense of know that we use constantly. We say that a woodworker knows how to make a proper cupboard. A ball player knows how to play the game well. A person knows how to speak their language natively and fluently. This second kind of knowing also involves facts. Uh for example, an English speaker will know that bank is a word in English. And that it has several different meanings. But this kind of knowing is not exhausted by facts. Facts are not all that's involved in it. We could memorize every grammar rule and still not speak a language as well as a native speaker. We could memorize every book on a sport or a skill and still not perform it competently. Something more is involved in this kind of knowing than stuff that can be expressed in language and written down. Philosophers have a name for this second kind of knowing as well. Gilbert Ryle called it knowing how as against knowing that. The ancient Greeks had a word for the woodworker's version. They called it or skill at a craft. So, we have two concepts hiding under the same word. Keep that in mind. The interesting question is then which one of these is related to wisdom? And as we'll see, it turns out not quite to be either one. Now, early Buddhism has its own version of this distinction. What frees us from suffering is not the accumulation of facts. It's not knowledge that such and so is the case. But, rather it's panya or wisdom. Its opposite, called avidya, is usually translated as ignorance, but means something more like not seeing things correctly. It's more like a failure of perception than a gap in our information. And the tradition has a word for the goal as well, one of many. They call it jnana dassana. That is knowing and seeing. That is knowledge understood as a kind of perception. Not simply the possession of a number of facts. This distinction goes way back in the West, too. One of its sharpest early proponents was a philosopher that I love, Socrates. Socrates held what looks at first like an outrageous claim, that nobody knowingly does wrong. That is, he held that if you really know what's good, you can't help but do it. In the Protagoras, he ridiculed the ordinary picture, very picture we opened with. Most people, he said, treat knowledge as not a powerful thing. As something that a person can have and yet still be utterly dragged about by anger, pleasure, pain, love, or fear. As if this knowledge of theirs were, he says, a slave. Now, for Socrates, this was all backwards. Real knowledge governs. It can't be overpowered. Being overpowered is the proof that knowledge was never fully present. And he stated the conclusion flatly. No one goes willingly towards the bad or what he believes to be bad. In the Meno, he explained why. That is, he explained why that no one desires what they know to be bad. When we go after something harmful, it's because we mistakenly believe it to be beneficial. Therefore, wrongdoing is always a kind of ignorance. Holding to a false description of the world in some sense. Elsewhere, Socrates made the point using precisely the example that we used before. A person who has learned carpentry is a carpenter. Just as a person who has learned justice is just. That is, to have truly learned justice is to be just in the same way that truly learning carpentry makes you a carpenter. It's not the same way that learning facts about justice or facts about carpentry makes you informed about them. You can be informed about something and not be it. Like I'm informed about early Buddhist wisdom without being truly wise. Notice how close this runs to what the Buddha said about genuine knowing, that it can't be overpowered. Therefore, all wrongdoing rests on a kind of ignorance or failure of seeing. But here's what happened in the West. The mainstream largely rejected Socrates' approach. In particular, Aristotle pointed at what he called akrasia or weakness of will. And he said, "It's obvious we can know what's good and still fail to do it. It happens every day." So, the West agreed with that and largely kept knowledge as something more or less propositional, something that could be written down. And they filed the Socratic intuition under, you know, interesting, but basically false. Okay, it's tempting now to sit back and say, "Okay, wisdom is just the second kind of knowing. It's knowing how. It's an embodied skill like the woodworkers or the ball players. Case closed." But I don't think that's quite right, and the reason matters because getting it wrong lets weakness of the will back in through another door. That is, the skill of a craft is motivationally inert. That is, a woodworker who knows how to make a proper cupboard might still get lazy and botch the job. The skill can be possessed and not really exercised in the moment. In other words, knowing how still leaves a small gap between knowledge and action. It just relocates it from can I state it explicitly to will I bother to use it? Aristotle saw this problem. It's why he separated techne craft from phronesis or practical wisdom. A person can be a master woodworker and a scoundrel nonetheless. But he says we can't have practical wisdom and be a scoundrel. A craft after all can also be misused, but wisdom can't. So we're after some third thing that's different from knowing that and knowing how or that's perhaps a special kind of knowing how. One that comes with its own inbuilt motivation. An embodied knowing the very possession of which reconfigures what we want. Not merely what we're able to do. Now which of our everyday examples best models that? It's not so much the woodworker or the ball player. Again, either one of those could hold that skill in reserve perhaps through laziness. Or they could misuse it. A ball player could throw a ball at somebody's head with particular force and accuracy. It's much closer to our example of the native speaker of a language. We can't be the native speaker of a language and yet out of a kind of laziness or weakness of will keep speaking it badly. To be clear, I don't mean schoolroom rules like never split an infinitive or never end a sentence with a preposition. Those are not really rules of the language. They're markers of social polish. What I mean is the deep grammar that every native speaker embodies without ever having been taught it. So, there's no such thing as I know Spanish natively, but keep failing to apply it. Competence and performance are basically the same thing. And something that's not linguistically correct just sounds wrong to us, like mouse the cat chased. It's not something someone's going to say normally. That gaplessness, that similarity between knowledge and action is what we're looking for with wisdom. Real wisdom isn't a skill that we might be too lazy to use in the moment. Instead, like native fluency, it should show up automatically in how we move through our lives. Now, we can answer Aristotle. His objection was that intellectual grasp of something obviously isn't enough. We can intellectually grasp something, that something's bad for us, and still do it. Grasp with something is good for us and still not do it. The Buddha's reply is that this is exactly right, because the knowing that matters was never really intellectual in the first place. Recall that for the Buddha, ignorance is basically a failure of seeing, not simply a shortage of facts. Recall nyana-dassana, the knowing that is also seeing. Real wisdom, the kind that closes this gap, operates at the level of perceptions and in the retraining of our emotions. It's not simply another bunch of true claims that we add to the pile. That's why for Buddhism, the vehicle here is practice, not just study. Now, study is a kind of practice. I've discussed that in the past as well. I can leave a video link down to that in the bottom, but practice is more than more than just study. Study may guide us, but in the end, it does just add more knowledge that. It's the same as learning a language. Studying the grammatical rules is all well and good. It can be very helpful, but not going to know how to really speak that language until we actually sit down and practice speaking. I'm I'm in the midst of learning Japanese right now of all things. Very early midst and ask me how I know about this. So, when it comes to Buddhist practice, there's a deep epistemological effect as well. Meditation practice tends to lower our reactivity through mindful calming. With that calming comes better discernment. And through better discernment, better knowing. We reduce motivational distortions. We begin to learn to see the harmful as harmful and the good as good. And this begins to fix the very error that Socrates said all wrongdoing rests upon. Indeed, the Buddha described such a process from his own pre-enlightenment practice. That is, watching his thoughts, he found that when he clearly saw a thought as leading to harm, it simply subsided. The seeing itself was enough to do the work. So, the Buddha rescues the Socratic intuition by relocating knowledge from the intellect to something more like perceptual training, training of our perceptions. From the Buddhist point of view, Socrates was right to say that genuine knowing cannot be overpowered. The problem is that Socrates didn't really tell us how to get there. The Buddha tells us we get there through a practice of calming and mindful perception as well as ethical speech and action, the eightfold path. This connects us back to my last video on the myth of a privileged epistemology, which once again I'll link down below. If wisdom were only about facts, if wisdom was something we could verbalize in its entirety, then we might be able to check whether we were wise merely by looking inwards and seeing if we agreed to the right facts. But that's the kind of privileged access that I argued we really can never have. Certifying our own wisdom by inner feel is the same myth all over again. Wisdom, I don't think, works that way. It isn't a set of facts that we can list and inspect. Instead, it's a kind of inner transformation that shows up in our conduct over time. That's to say, wisdom is something that can really only be read from the outside. It's lower reactivity under stress. It's looser grip on self-centered stories. Less motivated reasoning. More kindness. Less hatred. It's all visible in our behavior over time under a range of different circumstances as witnessed by the people who are around us. So, the value of our practice is not in some mythical private certainty that it might provide us about the state of our minds. Instead, it lies outwardly in our intersubjective relation with the world, in how we actually behave through speech and action. Wisdom is not about knowing facts or not just about knowing facts. True knowledge is not the kind that can be tested only with a paper and pencil. The West has largely understood knowledge as propositional, as the sort of thing we can write down, as the sort of thing that's relatively inert in our actions. We've largely abandoned this idea of knowledge as transformative and wisdom that arises from that knowledge as transformative. Insofar as the notion of personal transformation persisted in the West, it did so, let's say, within ethics proper, not within epistemology. It wasn't knowledge-related. Buddhism, on the other hand, provides a sophisticated practice of learning how to know that's built around an approach to knowledge that Western philosophy has struggled with for millennia. So, we say we know something's harmful to us, and yet we do it anyway. We read that as a failure of willpower. But maybe that knowing is better read simply as having information about something, not as evidence that our will is weak, but that we didn't really know what we had information about, what we thought we knew. Something harmful to us still, at some level, somehow appears as beneficial. That shift provides us with direction. It tells us that that the work we're we're doing isn't to try harder to overcome our desires, but instead to keep practicing until what's truly beneficial becomes our aim. Here's a question to spur your practice. Consider something that you know is bad for you. You say you know it's bad for you, but you keep doing it anyway. Think of that not as a kind of internal weakness, but instead a place where you just aren't seeing things correctly. What would it take to actually see that rather than merely believe it? To see it as bad for you rather than merely to think that it's bad for you. In my next video, I'll I'll get more into that question of of is it possible to have all the knowledge and none of the wisdom? I hope to see you there. Thanks so much for watching, and please, all of you, be well.
