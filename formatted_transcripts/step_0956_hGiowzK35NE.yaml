transcript: Okay. So God is this being force energy. Why then would such a being allow the creation of this evil? How can we explain the existence of it? >> You might be asking a false question. And when I say you, I mean everyone. Because when you ask the question, why does evil exist? If you would get a response, you you very might well get the response saying evil for whom? You always have to keep in mind that every question you ask, you ask from your uh often personal individual, but at the very least human perspective. When an earthquake happens in Japan and so many people die, they might ask, "Why was this necessary? And how could this possibly be good? And they see it as a bad. And then and then they ask the question, why do bad things happen to good people? But if God would speak to you in the way that humans speak, God might as well say, bad for whom? And we have to realize that uh even if such a thing as evil exists or bad exists, it would be bad for whom? Maybe it would be bad for you but not bad for me. Or it'd be bad for me but not bad for um dolphins. I don't know, right? Or or bad for our planet but good for billions of other galaxies. And so how do we get to say how do we know? How do we pretend to know that we know what's good or bad in terms of specific events in the world? Saying this event is bad, this event is good. How do we know that? What we can know is good or bad is for example, is acceptance good? Is it good to align one's will with God's will? Or if you don't like the word God, with the universe's will, if that's too esoterical for you, with reality's will. Because events do happen. No one denies that. And it's not a matter of opinion that events do occur in the world. And every event that occurs in the world, the sum of that is what we call reality. Everything that happens equals reality. And so when I say accepting reality, I mean accepting the events that make up reality exactly as they occur. So if I make my will overlap with the will of reality, in other words, if I accept as real and as necessary every single thing that happens for the very fact that it does happen, right? If I say I accept this event because it is happening and I accept that it is necessary because it is happening. If it wasn't happening, it wouldn't be necessary. If it wasn't necessary, it wouldn't be happening. And if it wouldn't be happening, if it wouldn't be reality, but since it is happening, it is reality. It's so simple, right? And self-contained. This is what I mean with when I say I'm I'm trying to be independent of everything. It's self-contained. You don't need to know is there a God, is there no God, what is God thinking, what is God doing? No. Every single thing that happens makes up reality. No. And so you have the choice. Do I accept reality or do I deny reality? And what are my chances of successfully denying reality? By the way, do I get to um tell the events to not happen? Things that have already happened. Do I get to call them bad? Because calling them bad is to reject them. But they don't literally they literally don't even understand the word bad. When you go call an earthquake bad, it literally does not understand what you're talking about. And so it's not going to stop. And if you call it good, it's not going to um increase its magnitude either. It's going to happen exactly the way it was going to happen. It's going to have happened exactly the way that it already has happened. Nothing changes. So whenever we say this is good, this is bad, this is evil, this is good and why does bad exist, why does evil exist, we are asking a question in my opinion that is incompatible that does not register with reality. Reality literally does not hear it, does not know what you're talking about. And so you can't get an answer to that because it's not a it's not a real question, right? The question only is why does this appear to be the way it appears to be from my perspective? And God's not going to answer that for you. That's something that you can and must answer for yourself. And that's what philosophy is. That's what religion is. That's what uh thinking is. That's what doing the work of life is whatever you want to call it, right? Because human beings do want to understand. And this is another reason why the idea of evil exists in people's minds because we all want to understand things. We want to understand why and how things come about. And when we see wrongdoing done by human beings, we see the outcome, we decide that we don't like it. And then we try to figure out why does this happen? And one of the answers that we get to that is, oh, that person is just evil. Evil people doing evil things. Makes sense. And so it's an explanation for us. So we can say every wrongdoing, at least done by humans in the world, we can ascribe to the notion of evil. We can just put it in that category and so then it makes sense as something then we can understand. The thing is because evil uh is in fact misguidance. People are calling the wrong thing by the wrong name and so it's it's creating confusion for people. This is why evil is such a otherworldly otherred monstrous thing because it's literally not human. It's not it's not what's going on in humanity. It's what's going on in some sort of imaginary illusionary monster. That's what evil is. We call you often see it in language when people call pe other people evil. They also often call refer to them as monsters. Everyone who believes in the idea of evil believes in monsters and it's sort of like as a child monsters under your bed. It's you cannot understand them because they don't exist. And so it's this major confusion. Why does evil have to exist? It makes no sense. It's so destructive. It's terrible. Uh and I feel like it's inevitable. And so this whole world view snowballs out of that. where we look at every wrongdoing, every mistake, every unawareness, every ignorance, every accident, even natural catastrophes, like I said, as evil things. And then we see the world consumed by evil because it's just this little me who's trying to be honest, who's trying to be good against the world of evil. And it becomes this depressing, heavy thing on your shoulders. which is exactly what fear is. And fear is an illusion. And so whenever you understand something, for example, when you understand evil as uh all wrongdoing coming from unawareness, misguidedness, ignorance, then you also uh understand human nature and you say, "I've been misguided. I've made mistakes. So, it's not this ununderstandable, unimaginable, scary monster under your bed anymore. It's clear and obvious what it is, how it comes about, how it can be prevented, how it can be solved, and how it can be understood. And so while evil is a very very scary concept, misguidedness is not at all. It's very understandable, very simple, something we experience every day. And we can see exactly where it comes from and what it does and each individual step of how we get there. But with evil, no one has any idea how evil works. And no one knows where it comes from. And no one knows where it's going. And no one knows how it operates. I wonder why.
