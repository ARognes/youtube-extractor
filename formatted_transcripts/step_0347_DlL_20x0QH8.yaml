transcript: progress is coming along nicely and i'm really close to having a release date but i'll talk about that later in the video right now i want to talk about the dialogue system of hyperbolica because it's way more interesting and complicated than you might think there's a lot of npcs in the game that you can interact with and to give the characters emotion and control the events i've essentially had to create an entire programming language within unity to handle it let me show you what i mean so here's an example dialog file you'll notice that there's syntax highlighting that's because i created a custom language extension for notepad plus plus to make it easier to read each dialog has a tag to identify it along with a state number and events are put in brackets these generally trigger body or eye animations at different points in the dialog but they can control other events as well when a dialog is triggered the game state for that key automatically increases until it reaches the last state which repeats [Music] [Music] there's also special symbols for timing and formatting underscores and dialogue are always interpreted as non-printing pauses and adding more will create longer pauses backslash n forces text on new lines and the vertical bar can group characters together to be printed at the same time [Music] branching is also supported using the dollar sign so implementing multiple choice responses is really easy these branches use the numbered game states too so the responses can also change each time to make the dialogue less stale and a tag can just be jumped to directly if a hashtag is inside an event [Music] is [Music] [Music] it's also often useful to have multiple npcs talk to you in a conversation so these numerical events switch context to other npcs which are pre-assigned from the unity game object the number zero always being the original npc [Music] other times you want the npcs to be talking to each other rather than to you this is done by adding an arrow to the numeric event that tells the npc to whom they should face [Music] [Music] another thing to consider is that game progress often changes what the characters say so for example when you complete a mission the npc should have a different dialogue that's controlled by the at symbol it specifies that a dialogue should be changed by some game states which get concatenated to the name it's in lowest to highest priority order so in this example the friend being in trouble takes priority regardless of if the mission was completed or not [Music] [Music] dialog states are also meta game states since they share the same data structure so you can even change the dialogue depending on if you've talked to a different npc [Music] [Music] custom game events can be triggered if the event name matches a unity component on the game object an integer payload can be sent to the event for more control for example in a fade audio event a zero might be a fade out and a one might be a fade-in [Music] and i've added even more functionality in special events so at this point you might just be wondering why bother making a complicated system like this well it has a ton of advantages the biggest reason is that the writers for hyperbolica don't have to be familiar with unity to add dialogue to the game and not just text but adding emotions to the characters timing in-game events branching dialogue trees everything can easily be done in the dialog file oh and one of the best features about it is that i was able to write a unity editor script that can automatically reload all the dialogue whenever detects that the file changed while playing the game so i can live write tweak and test dialogue without ever exiting the game it also makes it easier to have everything in text files if i ever want to translate the game i would just swap the files but this is looking pretty unlikely now since i have nearly 10 000 lines of dialogue that are intricately timed with emotional cues and english puns so i don't think it would be worth it anymore anyway i was hoping to have the new trailer and release date around now but i need just a little bit more time to commit to that so this was just a bonus devlog in between i'll be done soon when it's ready so just be patient on this final stretch as i'm still working through a big list of fixes from the first alpha test of the game thanks everyone for your continued support and thanks for watching
