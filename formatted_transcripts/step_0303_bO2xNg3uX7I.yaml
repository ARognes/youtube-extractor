transcript: Hi, we're Sock Pop, a video game collective from the Netherlands. You might know us from Grun, Stacklands, or Similand. Since 2018, we've made over 100 games for our game subscription on Patreon. We're very excited to get to showcase some of them at Amaze next month as part of the Sock Pop Expo. We've attended the Amaze Festival many times, and it's easily our favorite video game event. Additionally, it's also the place where we came up with the idea for starting the collective. So, it's a huge honor to be showcasing our games there. The expo's curator is Paul Schmidt, who's been playing every sock pop game to make a selection of our work. It takes a lot of effort to play over 100 games and think about what and what not to include. So, huge shout out to him. We couldn't do it without him. We've also built a few things specifically for the expo, like this machine, this one, and this. Come to the festival to find out what they do. Amaze Berlin takes place from May 14th to May 17th. See you there. Bye.
