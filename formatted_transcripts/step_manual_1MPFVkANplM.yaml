transcript: '{"content":"\n[0.4s] I''d venture that all of us carry\n[2.439s] regrets, that is, sad memories of past\n[5.839s] mistakes that we''ve made. Can reflecting\n[8.559s] on such mistakes be helpful to us? Or\n[11.679s] instead, does it sometimes hold us back?\n[14.88s] Many of us believe that focusing on such\n[18.0s] regrets can be helpful in our process of\n[21.359s] ethical learning. But interestingly, the\n[24.16s] Buddha taught something slightly\n[25.92s] different, which we''ll get to in today''s\n[27.84s] video. First, what is regret in early\n[31.039s] Buddhism? Well, it''s a concept that''s\n[33.04s] covered by various terms in Pali.\n[36.28s] Vipatisara, Anutapa, even cuca or\n[39.76s] remorse. The dictionary definition of\n[42.16s] regret, which we''ll have to keep in\n[43.6s] mind, is that it''s a sadness or\n[45.92s] repentance or disappointment over\n[48.0s] something that has been done. And in the\n[50.079s] context we''ll be discussing today,\n[51.6s] really, it''s over something that one\n[53.52s] understands as having been done by\n[55.199s] oneself.\n[57.039s] Now ordinarily I think regret is\n[59.68s] understood to be a wholesome recognition\n[62.399s] of our past wrongdoing and this is how I\n[65.519s] conceived of it. However, in the early\n[68.08s] text the Buddha has a somewhat different\n[70.52s] interpretation. For example, in one text\n[73.28s] of the poly tradition, the Buddha is\n[75.68s] talking about various different kinds of\n[77.6s] people. in particular certain people who\n[80.88s] commit wrongs, other people who don''t,\n[84.32s] certain people who have regrets, and\n[86.24s] other people who don''t. And for the\n[88.96s] person who transgresses, who does wrong\n[91.759s] things and regrets it, the Buddha tells\n[94.64s] them or somebody tells them, which I\n[96.56s] believe it probably supposed to be the\n[97.84s] Buddha in this context, tells them, you\n[100.88s] would do well to give up the defilements\n[102.88s] born of transgression and get rid of the\n[105.36s] defilements born of regret and then\n[107.759s] develop the mind and wisdom. And this is\n[110.96s] key in the sense that while it may seem\n[113.68s] to us that regret is a sign of progress\n[116.72s] in some way along the path, in fact, the\n[119.84s] Buddha categorizes it alongside the\n[122.24s] transgressions themselves. It''s a kind\n[125.2s] of a defilement or associated with\n[127.239s] defilements and therefore is the kind of\n[129.679s] thing we should get rid of. But we might\n[132.48s] say in response that the regret is doing\n[134.959s] some good here. that perhaps what the\n[137.36s] Buddha is really trying to tell us is\n[139.76s] that we should get rid of the\n[140.8s] defilements associated with the regret\n[143.76s] but not get rid of the regret\n[146.04s] itself. Well, let''s look a little deeper\n[149.28s] in as we go on in this suta. The Buddha\n[152.16s] then talks about somebody\n[154.68s] who commits transgressions, who does\n[157.36s] wrong things but does not have regret\n[159.84s] for it. In that case he\n[162.04s] says you would do well to give up the\n[164.64s] defilements born of transgression and\n[167.2s] then develop the mind and\n[169.4s] wisdom. That is in this context the\n[172.56s] Buddha doesn''t add anything about\n[174.64s] developing regret just to develop the\n[178.0s] mind and wisdom which is something that\n[179.92s] he says to everybody who''s not yet\n[182.28s] enlightened. So therefore it seems that\n[184.959s] even in the case of people who\n[186.76s] transgress, regret is not something that\n[189.12s] is suggested as an antidote. Instead it\n[192.159s] appears as a kind of a defilement\n[194.0s] related to sadness or disappointment\n[196.64s] with ourselves. And it''s of course a\n[199.36s] defilement we might say or a problematic\n[202.48s] uh emotion that does tend to arise\n[204.72s] naturally when we do bad things. Now\n[207.68s] this understanding of regret as\n[209.799s] something problematic occurs more\n[212.799s] plainly in the context of\n[215.08s] meditation where remorse or cuca is seen\n[219.519s] as one of the five hindrances to\n[222.319s] meditation in the context of\n[224.64s] restlessness and remorse. That is that\n[227.76s] having remorse, we might say regret for\n[230.48s] things that we''ve done is associated\n[233.04s] with our own restlessness that keeps us\n[236.0s] from attaining meditative insights or\n[238.64s] reaching deep states of meditative\n[240.4s] absorption. But then we might ask, if\n[243.439s] such regret is always apparently\n[246.76s] unskillful, should we then not pay\n[249.599s] attention to our past actions? The\n[252.799s] Buddha certainly believed that\n[254.799s] reflection on the ethical character of\n[256.959s] our actions was\n[259.079s] beneficial. This is highlighted or\n[261.6s] revealed in particular in one early suta\n[264.639s] where he is discussing ethical action\n[267.44s] with his son Rahula. In this early suta,\n[271.52s] the Buddha talks about how we can act by\n[274.0s] way of body, speech, or mind. But that\n[277.44s] when we do so, we should always reflect\n[279.759s] upon whether the actions were going to\n[283.4s] undertake are are going to be harmful to\n[286.08s] ourselves or to others or to both\n[288.72s] ourselves and others. He goes on to say\n[292.32s] that it''s best to reflect in this way\n[294.32s] before undertaking these actions. If we\n[297.199s] can''t do that, then at least we should\n[299.32s] reflect while we''re doing them because\n[303.04s] in those ways we''ll at least in in the\n[305.84s] first way we''ll avoid doing the action\n[307.36s] altogether. In the second way we can\n[309.84s] perhaps stop ourselves in the middle of\n[311.919s] doing the action and that way avoid some\n[314.639s] of the bad results of that action. But\n[317.36s] if we''re not able to do either of those\n[319.6s] two, then at least in the third option,\n[322.72s] we should reflect after having done the\n[325.56s] action. And if we realize that we''ve\n[328.56s] done something that''s been harmful in\n[330.72s] this way, then the Buddha says, \"Rahula,\n[334.56s] you should confess, reveal, and clarify\n[337.44s] such a deed to the teacher or a sensible\n[340.32s] spiritual companion. and having revealed\n[343.199s] it, you should restrain yourself in the\n[346.28s] future. Now, we should note here that\n[348.56s] there are two essential components to\n[351.039s] what the Buddha tells his son he should\n[353.36s] do in this case. He should confess\n[356.96s] having done this deed to somebody, his\n[360.0s] teacher or a sensible spiritual\n[362.36s] companion, and he should refrain from\n[364.8s] doing the deed in the future. The Buddha\n[367.52s] doesn''t say anything here about regret.\n[371.039s] So the benefits of our ethical\n[373.44s] reflection upon our actions lie mostly\n[376.8s] in reflecting upon them before we\n[378.88s] undertake them or while we''re in the\n[381.039s] midst of them. If we can''t manage either\n[384.8s] of those two, then reflecting on our\n[387.68s] action after having done it is fine in\n[390.4s] so far as it gets us to avoid doing the\n[392.4s] action again. But there''s no sense in\n[395.28s] simply replaying the regret over that\n[398.08s] action over and over again in our minds.\n[400.24s] that doesn''t get us anywhere. Indeed,\n[403.039s] spending time on such regrets would only\n[405.759s] lead to restlessness and remorse or\n[409.28s] difficulty\n[410.84s] meditating. And indeed, one of the\n[413.199s] things the Buddha says is so important\n[415.12s] about ethical action, about acting\n[417.8s] rightly, is that it preserves us from\n[420.639s] having to undergo restlessness and\n[423.52s] remorse. It preserves us from the\n[425.68s] natural reaction of our own regrets.\n[429.52s] Third, I want to touch on some of the\n[431.919s] apparent similarities between regret and\n[435.0s] guilt. It''s often said, indeed believed,\n[437.84s] that regret is something fundamentally\n[440.4s] different from guilt. And in early\n[443.12s] Buddhism, that''s something that I myself\n[445.039s] believed before\n[446.52s] undertaking the research for this video.\n[449.599s] But now, my opinion has changed\n[451.36s] somewhat. I believe that the Buddha\n[454.08s] seems to have thought that regret and\n[455.759s] guilt were basically very very similar\n[458.319s] if not the same thing. The Buddha does\n[460.16s] not discuss guilt as such. However, he\n[463.44s] frames regret as a kind of a a\n[467.4s] selfdirected disappointment or sadness\n[470.08s] that is itself a defilement of a kind or\n[473.039s] at least associated with such\n[475.479s] defilements. This emotion then is indeed\n[478.879s] tied to our self-identity.\n[481.919s] our feeling that there''s something wrong\n[483.919s] with us, that we''ve done something\n[485.36s] wrong, even that we''re a bad person.\n[487.919s] That''s that''s guilt personified. In the\n[490.879s] Buddha''s eyes, though, our ethical\n[492.879s] reflection is more forward-looking and\n[495.68s] less identified with what we view as our\n[498.639s] self or who we really are. That is,\n[501.36s] we''re to make, as he says, a sincere\n[504.36s] determination not to repeat the same\n[506.639s] mistake in the future. There''s no\n[508.96s] additional benefit to feeling sadness or\n[512.0s] disappointment with ourselves over and\n[514.399s] above that kind of sincere\n[516.76s] determination. So then it may occur to\n[518.88s] us to ask what should we do when regret\n[523.12s] naturally arises in us. As as I said at\n[526.08s] the beginning of this video, all of us I\n[528.8s] think have regrets. All of us know what\n[531.12s] it is to feel that kind of\n[533.2s] disappointment in ourselves. So what are\n[535.92s] we supposed to do with it? Well, we can\n[538.24s] try to disarm such feelings by following\n[541.2s] the Buddha''s own practice technique. We\n[544.24s] can acknowledge our own past mistakes\n[548.6s] openly and without rationalizing them.\n[552.0s] We can perhaps confess to a friend or a\n[556.8s] sensible spiritual companion. And of\n[559.68s] course, we can resolve as best we can to\n[562.08s] act in a different way in the future.\n[565.76s] There''s no point to self-\n[568.36s] flagagillation. There''s no point to\n[571.0s] self-hatred or to guilt or to a feeling\n[574.48s] that we''re there''s something wrong with\n[576.32s] us. There''s no point in sadness and\n[579.279s] disappointment that continues. All of\n[582.16s] that is associated with defilements. So\n[585.12s] what''s important again is our resolve,\n[588.0s] not our regret for past actions. And if\n[592.72s] regret persists or if restlessness and\n[595.68s] remorse persist in our meditative\n[599.08s] experience, then the Buddha says we\n[601.279s] should deal with them through calming\n[603.24s] practices. As he says, when that mind is\n[606.48s] restless, it''s the right time to develop\n[608.88s] the awakening factors of tranquility,\n[611.72s] concentration, and equinimity. Why is\n[614.72s] that? Because it''s easy to settle a\n[616.959s] restless mind with these things.\n[620.16s] I''ve learned some surprising things\n[621.839s] about the Buddha''s teaching in doing my\n[624.16s] research for this video. In particular,\n[627.2s] while it does seem, as I say, that\n[629.04s] regret is a natural emotional response\n[632.0s] to having made a mistake and perhaps\n[635.04s] caused suffering to somebody or to\n[636.72s] ourselves in the past. The Buddha does\n[639.6s] not believe that regret itself is a\n[641.6s] useful component to our practice. Regret\n[645.68s] itself is a kind of a problem. And as as\n[649.44s] such, it''s not something that we should\n[651.6s] encourage nor dwell upon when it arises.\n[655.399s] Instead, we should simply acknowledge or\n[658.8s] try to acknowledge as best we can and\n[660.959s] openly acknowledge our own mistakes and\n[664.24s] try as best we can not to make the same\n[666.72s] mistakes in the future. My question to\n[668.959s] you therefore is is have you learned\n[671.36s] from your own past mistakes of some\n[673.44s] particular mistake you''ve made in the\n[675.36s] past? has a kind of a mindful openness\n[679.12s] to the possibility of mistakes helped\n[681.44s] you to grow wiser. If you want to see a\n[683.839s] past video quite a long time ago in fact\n[686.399s] where I discussed the idea of regret\n[688.959s] from a much earlier perspective I''ll\n[690.8s] leave a link to it up here on the screen\n[692.8s] deal with some different uh different\n[694.8s] sutas in that one. So, if you''re\n[697.279s] interested, take a look. And if you''re\n[699.44s] getting something out of these videos of\n[700.88s] mine, consider also taking a look at my\n[702.72s] Patreon page as always, which is linked\n[705.04s] up here on the screen and down below in\n[706.56s] the notes, and see if you want to help\n[708.24s] support the channel and the work that\n[709.839s] I''m doing here. Thanks so much, and\n[711.76s] we''ll catch you on the next video. And\n[713.279s] meanwhile, all of you be"}'
