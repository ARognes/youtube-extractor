ng first naturally these hysterical displays are ignored in the name of progress because it is of course unfounded nonsense humankind is destined for the stars now we will make our rightful home among the infinite Rapture of the cosmic ocean now we will become undying the naysayers be damned now we will Chic evening wear even more affordable City housing an expedient Judicial System the wheel again Kinder word processes renewable energy the peaceful transition of democratic governments and a minimum wage as in the minimum wage which is no wage unless you''d like it to be your [ __ ] kidneys on the menu today no I didn''t think so Alistar I didn''t think so Jesus unions nanotube engineering leading to orbital manufacturer leading to the creation of the dandelion seeds hollowed out asteroids repurposed as Interstellar generational Starcraft each a home to potentially hundreds of thousands of humans if willing to make the journey to unlearn grass and sky in favor of where next and why now look to that half century when in a flurry of tentative hope we gouge and renovate those old dead God eggs so they might beget 20 Generations yet and with the sky parked with them then 400 and all we know this will be the last time we find ourselves occupying a single world and they set off millions of farmer astronauts flung out into the Wilds of gravitation and light miles brains of meat and metal now return to wheat and petals now centrifugal Suburbia and tea around the cattle now human pollen blown on the solar winds while back on the mother planet we wait and we wait as a bird how does one live best with an empty nest then next comes cocooned in their star flung cities there''s nothing to do do but survive and invent and in a generation or two the will to invention turns inwards with genetic engineering allowing for great revisions in the book of life it is the Expedition Bound for tetti who give themselves wings so with the centrifugal gravity dial down they fly unencumbered as 