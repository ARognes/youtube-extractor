d [Music] b b b whats the humans Wonder that''s not a sentence and who even left this thing a race powerful enough to write messages into matter clearly maybe from 10,000 big bangs back but what is the word that''s missing conventions symposiums entire Interstellar congresses are convened to discuss the missing word for surely it''s the answer to everything stay kind walk good be brave a few planets suggest no most reply that''s too bold stay kind walk good be kind no the screenwriter planets protest they already wrote kind you can''t write it twice you [ __ ] Bell piece all right everyone says chill out well you can''t yeah but it''s it''s fine jeez 10,000 years of this the Galaxy''s greatest philosophers at each other''s throats and just as the conflict is reaching its maximum just as it seems War might break out over this thing at last a galactic vote is taken but if they can''t guess then they''ll finish the damn sentence themselves stay kind walk good be infinite they decide how infinite in whatever capacity they can they say in all of them then next [Music] comes those reality machines they were building the synchrons the harmonizers the dimensional cannons instead they Point them not down into nature but at themselves biology Rewritten mentality expanded many start to transcend and first individuality then corporeality then discard their physical forms entirely becoming disembodied Consciousness carried through matter as a wave on a pond they learn to travel with infinite speed to occupy all points and no points they grow wider than space faster than time they learn to become forever testing their powers they seed planets with life with sentient orchids and singing mice they build stars from dust DIY Brown dwarfs and disco ball pulsars they construct sculptures a thousand light years tall 10 parallel universes across and at last not with machines but with will they begin to alter matter and energy themselves from the cosmic down to the subatomic rearranging Stars creating new leptons new electron orbitals and knees that never bruise and razors that never blunt and hearts that never break the very laws of nature in their ethereal Palms the universe can be transmuted with a thought they know the risks of this that physics is a delicately balanced card house subject to collapse at the smallest error but they are omniscient and infinitely wise and can play as they like no missteps are possible now no folies are forecast they will make no mistake a circle a cube addition subtraction unending psychic torture trapped in looped space the wheel but not really because geometry has become logically impossible now followed by the complete breakdown of communication since there is no longer a common reality let alone a shared language what [Music] but children grow up eventually 5,000 centuries and now they only make beautiful things and soon they forget they were ever human just as humans forgot they were ever fish in curiosity they become everything that ever was just to see what it''s like ants and mice and elephants clouds and transistors a glance a grudge a Nook a rest and after Millennia of this they have been every animal every dear every particle and number they are Immortal and they are bored there is nothing left unknown well except for the missing word in the old message which like an abandoned manuscript still sits unfinished upon the desk of progress stay kind walk good be what what is there left to be that we haven''t already invented or conjured or destroyed in search of the answer they collect like despondent fish at the edge of the Galaxy staring out into the abyss nothing then they Retreat to the smaller scales where distance and time evaporate nothing but there is one place they have not yet checked not in half a million years anyway where did they leave it that first world where everyone started being the one with all the fighting and the crying surely someone there can solve this can retach them the methods of mystery and they set off as they came so long ago for all time sake inside enormous Hollow asteroids the long journey home they pass all their old projects like one rediscovering childhood toys the machines the dancing the graves oh God what was it all for the beaches the blackboards the bicycles oh God what was it all for and as they accelerate they begin to remember they learn to take up bodies again carefully at first like easing into a hot bath legs and hands and feet hunger and thirst and doubt flesh things once more how how did anyone live like this so small and passing so full of infinite desperations impossible to express longing and ranor mercy and spite among warped Starfire then they recall the braveness of honesty and the finality of Joy how good it feels to find another mind just as strange as oneself and say I would like you by my side and until my little race is run and they recall the will to hide from shame the safety of uninformed certainty they ReDiscover ideologies and clicks and Wars minor ones at first then whole Fields where their old friends lie down and do not get up again and how confusing that is when mines are gone forever they ReDiscover mourning and grief and crying out for things to be any other way and things only staying that way the bayonets the shoelace the screw oh God what was it all for the Love Letter the radio the lie was everything for nothing and by the time they spot the little blue world and the little white moon approaching they''ve remembered everything forgotten and forgotten everything worth remembering returned to the childhood home ignorant as they came the prodical gods come begging then next comes they wake with terrible headaches The million-year Hangover and a woman standing over them and she says what time do you call this sorry they say we were busy with stuff well you''re here now she says either she''s the first mother of the world or the last daughter but in any case she leads them from the husk of their crash they find themselves on a mountain and Survey the old Earth the deserts the forests the ruins not so much has changed only there are other spacecraft here and there clearly not of human design we''re not the first to come back they ask oh no she says the others return from time to time and guests from other galaxies whenever they all get stuck stuck they say oh yes we''re not stuck we did everything and it was all for nothing oh that''s cute she says teenagers teenagers they snap have you ever considered she asks that maybe the day you declare yourself so old and wise that nothing new can ever happen again is exactly when you confirm you''re just so young and ignorant you can''t imagine the fantastic shape of what''s coming next it is your cynical certainty that reveals your youth welcome to adolescence they observe the valley below a village of tents and smoke and no urgency come down stay with us she says and do what they say and be B she says just be for a while there is no missing word if that''s what you''re looking for B it''s a sentence in itself it''s fine just to bee sometimes you know thanks they Grumble is there beer of course she says the best invention what will we do down there they ask oh she says well we''ll build a wheel for a cart and then a cart for the road and a lamp for the dark and gloves for the cold and in the morning we''ll work and in the afternoon we''ll wander and in the evening we''ll drink and dance and come nights will sleep and we''ll keep doing that until we know what we''re for and if we never find out then maybe trying will be enough and after that they ask oh she says and after that then next comes [Music]'
