transcript: '(keyboard clacking) - [Interviewer] And then my last question, of all the old Crystal games, what is the one people ask for, for you to go back to? - "Legacy of Kain", hands down. That''s a setup, you know it''s a setup. No, it certainly is. Even when we announced the Embracer deal and we talked about the IP to come with us, they were like, (gasps) "Legacy of Kain"! I''m like, okay, look, calm down. Everybody stay calm. We''re focused over here. But LOK top down is the one that people ask for the most. - [Interviewer] All right. We ain''t seen nothing yet. - Ain''t seen nothing yet. (pensive music) - So we can all appreciate that there''s no shortage of reboots, remasters, re-releases and remakes of beloved video game franchises. God knows Noclip has covered enough of these over the years. But when you look back at the past two decades of practically every classic game getting a facelift of some description or another, there''s one particular holdout which has continued to puzzle fans. "Legacy of Kain: Soul Reaver" came out in 1999, and almost immediately made a name for itself. Its impressive late PS1 3D rendering, coupled with a world and narrative that seemed self-serious but entirely believable, made it stand out in a generation with no shortage of classics. Like many franchises, it struggled to reach that high watermark again, but while so many other games, both grander and lesser, made their triumphant returns, it seemed Raziel and Kane were destined to sleep for eternity. Over the years, the "Soul Reaver" community has only become more steadfast in their desire for a return of the franchise, and given Crystal Dynamics''s radio silence over the past two decades, have taken it upon themselves to be keepers of the flame. A global community of strangers who shared lore, made art, cosplayed, datamined lost content, and released patches to keep the games playable in an era when Crystal Dynamics had other things on their mind. Their faith was rewarded when earlier this year Crystal Dynamics announced that they were set to release a remaster of Soul Reaver 1 and 2. Not quite the reboot so many fans have been praying for, but a glimmer of light after decades of darkness. We will talk about that project at some stage in this video and its important part in this story, but this tale is about so much more than Soul Reaver''s past. It''s about its future, too. The question on everyone''s lips is, what''s it going to take to bring back "Soul Reaver"? And in this documentary, we''re going to attempt to uncover the future of the franchise by dissecting its 25 year legacy. Over the past year, we''ve taken our time to understand this story. We''ve talked to some of the original developers to learn how it was made, to vocal supporters within the industry about its enduring legacy, and to members of the fan community about their work to keep the flame burning. We gained unprecedented access to an archive of lost media that Crystal Dynamics have recently digitized, and we talked to employees at the studio about their hope for the remaster, and their dreams for the future of this franchise. The question we''ve got to answer today is, what it''s going to take for Crystal Dynamics to dive two-footed into a new, big budget AAA Soul Reaver game, and what can the past 25 years tell us about the challenges that face such an effort? Now, we''ve a lot of time on this talking to a lot of people, and it''s going to take a while before all the different perspectives sort of show you the big picture we''re talking about here. But before we get to any of that, let''s start the only place we can, two of the best games ever released on the Playstation. (somber music) - When I came to Crystal, they had just shifted the game from "Shifter" to "Soul Reaver". Shifter was a game where you were a fallen angel, and you could inhabit the bodies of various people. You possess them, and basically shift through different realms. So the idea was to shift bodies, shift realms, and to kind of jump around using those two mechanics to sort of solve puzzles and do combat and those kinds of things. When it shifted to the Legacy of Kain franchise, they took the idea of shifting worlds along with it, having the spectral realm and having the material realm, but dropped the idea of possession. I think we tried to keep it, but we found it... You''re basically carrying all of the animation and all of the memory for a main character for all the characters you could possess. So I was given a lot of really cool concept duties, a lot of really cool abilities to work on the textures. Which was great. I got to do Kain. I got to do all kinds of creatures. I got to do a bunch of bosses. I met Amy, of course. Amy Hennig. We''re really good friends. Talking to her, I was really fascinated with her depth of knowledge about things literary, her understanding of what (indistinct) was. You know, she understood "The Cabinet of Dr. Caligari". She understood, you know, "Madman", and a lot of different, really offbeat comics, and it was really cool to learn from her, and how we incorporated all those elements to create Raziel was really a lot of fun. - Just as a side note, too, where I put laugh softly, you know the little patented Simon chuckle that he does? He did it over and over for Kain last time. Instead of kind of just a little breath of a laugh, when he kind of goes... (chuckles) - Oh, you want to hear- - A little bit of a chuckle. Yeah. - Okay. - Real subtle, though. It shouldn''t be maniacal, by any means, of course. - I started at Crystal in May of 1998, and it was two weeks, I think, or so, before they were going to show "Soul Reaver 1" at E3. It was about 30-ish people, I think, on the team overall. It seemed like it was busy all the time that I was there because it was, you know, I started in the crunch of finishing E3 builds, and then it was just kind of never really a dull moment. But the game itself was, you know, it was very recognizable as what it, sort of, as it shipped, so it wasn''t like it was a super early state. But there was still a lot of work that needed to be done, too. You know, one of the first things that I worked on after I came there was like the collision for things in the spectral realm, morphing and things like that, because it was sort of in place but not really shippable. The streaming system was pretty cutting edge for the time. The lead programmer, Carl Stika, had worked a lot on that to get that in place so that the game could be basically one contiguous game without any load screens, for the most part. We had, as I recall, sort of the mesh and collision data, and the color data for the vertices was all stored multiple, you know, twice at least for the regular world and the spectral realm, and you know, there was all sorts of fun problems, like when you would morph into the spectral realm and some wall would shift into the players, where the player was, to keep them from not going through the world and falling out, and other objects and stuff, sort of figuring out what they were supposed to do as the world completely morphed and changed. It was kind of an end of the Playstation era title where we were kind of, all the tips and tricks that people had figured out over time were kind of put into play. - We knew we didn''t have a ton of polygons to play with in a given area, but we could ignite people''s imaginations to think that there was more out there, to hint at a greater world. - You know, at the very end, we were scraping for 10K of memory to be able to ship the game and make it run. There was also a lot of the content, kind of figuring out, it didn''t, as people know, it didn''t have everything that was originally envisioned for the whole game. It got split up more into the other games. Well, you know, I was good friends with Amy. We hung out a lot. You know, she was amazing, her sort of overall vision of the game, her leadership on things, you know. The script and everything that she wrote was amazing stuff. All the coders that I worked with. Carl Stika was the lead programmer, who was one of the people who primarily figured out the streaming system. Jason Bell. Hong Park was an AI programmer that worked on the project. And it was just, you know, it was a really small, tightly knit team of people. You know, there was a lot of work. It was hard work. We crunched, for sure. It was all pretty young people. I mean, the gaming industry has kind of grown up along with the consoles, so at that time, it was a lot of people kind of my age, in their early 20s. You know, it was a new, young industry, and so there''s kind of a college atmosphere almost to it, to a certain extent. I think luckily, in the industry, we''ve improved on that and tried to minimize crunch as a big aspect of things, but in those days, that was just kind of how it was. - Oof, yeah, so for the last year of development, we were all in crunch. It was six days a week, 12 hour days. By the time we were done, I had no idea what a weekend was or what to do with my time, but it was the kind of thing where it was a labor of love, and so I didn''t really notice the time as much. There was definitely a lot of tension between producers and designers and artists and creatives, because we''re trying to make something really special, but at the same time, we''re getting pressure. Like, hey, wrap it up, get it done. And so that''s why at the end, we just ran out of time, and we just said, okay, you know what, to be continued, because we just need more time for this, and we want to wrap it up in a good way. And if you saw the original ending of "Soul Reaver", it was very different than what you got. But at the same time, the thought is to continue the franchise, which was great. When we were working on "Soul Reaver", especially "Soul Reaver 2", it was sort of, let''s take the original "Blood Omen", and if that''s the TV version, for example, let''s make the movie version. Let''s make everything just plus up as much as we could. And so we tried to take all of the somewhat dated designs and basically plus them up a lot more for Playstation 2. - The biggest issue at the time was, it was sort of the end of the Playstation 1 era, and the Playstation 2 coming out, and they weren''t quite sure what to ship it on. We were excited when finally, we got the go ahead it could be on the Playstation 2. When we made the announcements, one of the artists was so excited he was just running around the office shouting, "More polygons, more polygons!" Well, it had more co-processing that you had to deal with to get the full power out of it, and we moved from integer to floating point math for everything, which was a surprisingly large amount of work to convert over for. With the better texture resolution and mesh and stuff, the cinematics, seeing Amy''s stuff come to life was always fun. Certainly now, when you look at the difference between Playstation 1 and Playstation 2 and the quality of the images, it felt like you were getting more across of what you intended out of things, and that was exciting. - The themes of "Soul Reaver", they resonate a lot with people. We''ve all been destroyed at some point, and we all had to pick ourselves up and put ourselves back together again. I think people misunderstand sometimes. They think "Soul Reaver" is a rock and roll kind of game where hey, you kill vampires, you''re a monster, da da da. But to me, it''s more gothic, and by gothic, I mean that it takes pain and turns it into beauty. At the time, there was nothing like it, and when I was working on it, I was into a lot of different things. I was into Dungeons and Dragons. I was into the different Japanese models and creatures of the time. Anime wasn''t quite as big as it is now, so I basically watched a lot of different kinds of anime, especially Go Nagai''s "Devilman" and things like that, things that were pretty vicious and, you know, destructive. "Vampire Hunter D". And I had taken all of those things that I love and poured it into this game for the design aesthetic, kind of throwing it out there and assuming an intelligence, an artistic intelligence, an emotion intelligence, a literary intelligence to the player that they would get it, and the people that did get it would really be into it, because that''s what I was into when I was a kid, too. I wished I had a game like this. - I mean, I think it''s a game that lends itself to passionate fans because it has that sort of interesting world, the mythology that was created behind it, the worldbuilding, the characters, you know, the great writing that Amy did on the "Soul Reaver" games, the story, the complexity of it, the twists and turns, lends it something that I think people can dig a little bit deeper into than a straightforward, just kind of regular action game. - "Soul Reaver 1" and "Soul Reaver 2" were near perfect marriages of artistic depth and technical breakthroughs, something that many classics of that early Playstation 1 era can thank their legacies for. But before we explore that legacy and what it means to fans and the world of gaming today, let''s take a step back and look at the wider series as a whole, because of course, there were games both before and after "Soul Reaver" 1 and 2. The first game in the series was "Blood Omen: Legacy of Kain", a top-down vampire RPG published by Crystal Dynamics but developed by Canadian studio Silicon Knights. In 1999, the franchise was brought in-house and we got its sequel, "Legacy of Kain: Soul Reaver", a 3D platformer where you played as an entirely different character called Raziel. In 2001 came "Soul Reaver 2", a sequel to that game. 2002 saw a 3D sequel to the original "Blood Omen" game called "Blood Omen 2", and in 2003, "Legacy of Kain: Defiance" was a game where you played as both Kain and Raziel. These last two games are decent, but less beloved than the original three. Over the years there have been a few canceled sequels, too. "Legacy of Kain: The Dark Prophecy", headed by Ritual, "Legacy of Kain: Dead Suns" headed by Climax, and "Nosgoth", a free-to-play multiplayer action game developed by Psyonix, who would later go on to make "Rocket League". This ran an open beta for just over a year before being canceled due to lack of interest. "Soul Reaver" came out 25 years ago in 1999 but the 5th and most game in the franchise, "Legacy of Kain: Defiance", came out in 2003, so how is it there are still so many fans of these games, when the most recent version of it came out 21 years ago? (somber music) - Back in the olden days, before I worked on games directly, I was a video games journalist for print magazines, initially. Even from my POV, Crystal was, for me, "Gex", "Tomb Raider", and "Legacy of Kain". That''s, you know, if you think about Nintendo, you think about Mario, or you think about Sega, you think about Sonic. It was at this weird tipping point for the games industry where we were going from cartridges with sort of obviously limited memory, but also limited scope on what kind of game you could put in the box, and we were getting into what we used to call multimedia, where it was CD rom games, and it just really opened up, especially storytelling. So "Blood Omen", for me, apart from being just a sort of generally attractive genre, it was a sort of action game with RPG pretensions, but set in this cool, gothic vampire universe, it was about atmosphere and storytelling, initially. The sequel, the "Soul Reaver" sequels, really radically changed what the game was about, and ironically, they made it much more about sort of 3rd person action, exploration. Traversal is what they call climbing and jumping nowadays. But they did it with the same sort of storytelling ethos, which was just to tell a big, dark, grownup story with philosophy, genuinely compelling characters, a genre and a narrative that people connect with. - I didn''t know about "Blood Omen" when I played "Soul Reaver". I didn''t know about the story of Kain, so for me, Kain was the villain. Kain wasn''t the hero. I didn''t come into this knowing what had happened before and the choices that had been made at the Pillars, and it was just like, this guy looks really mean. I was trying to think what he looked like. - [Interviewer] Looks like a baddie. - Yeah, he just looked like a baddie. You know what he looks like? He looks Ivan Ooze from the Power Rangers movie, is what he looks like. But yeah, he just looked really, really kind of devilish, and Raziel is just a badass, he''s just an absolute badass. Essentially what we were seeing was a guy spending hundreds of years basically just having his body torn apart, and afterwards, he picks himself up, finds a sash. He''s like, yeah, cool. I look cool now. There''s this kind of otherworldly knowledge that Kain seems to have above everything else, and then you''ve got Moebius, and these powers that are greater than him, and what does the Elder God actually truly want, and is it this parasite that''s actually eating at the heart of Nosgoth? Just these kind of huge, incomprehensible images that make Raziel seem so cool and so helpless at the same time, and I think that''s why he''s both a badass and kind of pathetic, in a way, that makes him one of these characters that I think still stands up as one of the great all time video game characters. Yeah, it''s a good game. It''s a good game. They''re good games. They''re just good games. - Some people would say, oh, that''s a really great story, and sometimes, well, maybe it''s not the story that''s great. Maybe it''s the storytelling. I remember "Half Life 2", which is one of my favorites, it''s not a really complicated story, but the storytelling is so great. I think what was neat about "Legacy of Kain", not only was the story very rich, "Soul Reaver" did such a good job at its storytelling as well. - Acting in games, performance in games, you look back on that kind of PS1 era, and it wasn''t great, but this was, and I do think that the opening to "Soul Reaver" is probably still one of the greatest video game openings of all time. I still go back and watch that opening regularly, and I can''t believe how well the whole thing just stands up. Yeah, you know, whereas with "Final Fantasy", you''d imagine the voices. You didn''t really have the voices to play off. You had Michael Bell and Simon Templeman doing these incredibly theatrical performances that also felt really real and really raw. - [Raziel] The descent had destroyed me, and yet I lived. - It makes perfect sense to cite "Tomb Raider" as the kind of predecessor to it from a gameplay framework standpoint, because it''s Crystal Dynamics, but what you are doing is going through these kind of rudimentary 3D spaces, looking around you, and looking at the objects in the space, figuring out how to progress forward, and usually it''s some mixture of moving blocks or pushing architecture. The kind of unique selling point and the really mind-blowing mechanic for "Soul Reaver" that made it unique was Raziel''s ability to transition between the spectral and the material realm, so it''s kind of quite an advanced gameplay design set of systems, but that''s the kind of core chunk of it, traversal and platforming. However, there''s also combat in between there, and there''s just almost like this awkward dance where you''re kind of strafing around the enemies and finding the right moment to lunge at them and hit them. The gameplay loop, as it''s known these days, isn''t as streamlined and as slick as it is these days, but it still has enough of a connective tissue to make it quite absorbing and engrossing. (monster grunting) - Yeah, it was good game at the time for what it was doing, but it had this sort of heavyweight punch of kind of deep lore that the writer had created for... Or, you know, the designers had created for the game. A really solid script, top notch voice acting. You''re kind of like, wait, what? They did all this for this sort of game, the action game that I''m playing? This is awesome. I think at the time, the only other games that had that kind of depth were like, I don''t know, "Ultima" and "Wizardry". These kind of games had, you know, real deep, but they didn''t have world class voice acting or anything. And in "Soul Reaver", there was a technical achievement of morphing these worlds. I mean, on that console, that was ridiculous, that they were able to do that. So I think those were the standout things that attracted me to those games. - To a certain extent, back then, we were a little bit more isolated from, how did the game do? You know, it was... Metacritic and things like that, it was harder to understand the collective, like, how popular is a game, or is it not? So it was just kind of like, it seemed like it did well, and we liked working on it, so it was, again, another logical thing to work on next, and there was more story to tell. I do remember we started to play around. We added playable Kain. The camera system was somewhat different, and that was on purpose to kind of try some new things, to spice things up a little. There was other games at the time that influenced us to try that kind of stuff. "Blood Omen 2" was a separate team, kind of separate engine that they were trying to get going, which we eventually did take a lot of the aspects of that engine and combine it when we switched to doing "Tomb Raider". - I think over time, the legacy has only kind of been enriched by other people sharing the stories of how it affected them. Each game reinforced why the previous one was great, and made it better and better and better, retroactively better. You can go back and play those games and go, that moment was happening there. Oh wow, and we''re reliving it from this moment. That''s so cool. And so you felt like there was this grand plan unfolding in front of you. Yeah, it was like the feeling of watching "Lost" or "Dark" or just someone who is so much more intelligent than you is peeling back the layers of this story and revealing something, whether they had the grand plan to begin with. I don''t know, but it felt like they did, and I felt like I was being made to feel really clever. - Why do you think we haven''t seen one successfully released in those 21 years? - I mean, I think we haven''t seen one for a lot of reasons, and it''s hard to pin it down to a specific thing. I think it''s a lot of like, there was a point where these kind of games, they became almost oversaturated, primarily also because post "Soul Reaver", kind of, it was diminishing returns. I personally feel like there was a mishandling of that franchise. Obviously multiple teams had different ideas of what it should be and then, you know, "Soul Reaver" existed at the same time as "Blood Omen", and Kain and Raziel were happening at the same time, and there was this divergence, convergence, and it became very messy, and I think the lack of direction and lack of vision for the IP as a whole is what led it to becoming this thing where it felt like it''s too complicated, let''s just chuck it in a vault and move on because Lara is way more important. We should move onto other ideas, that kind of stuff. - The reality is, and anyone who works in gaming long enough knows this, sometimes you will come up with the absolute best idea ever, and then the business case just no longer makes sense. - Something that''s obviously thought about a lot, but it''s tricky to get things off the ground too, for a franchise that''s, you know, fairly old now, in some ways. There''s been a big break between games. You know, you can come back strong from that. Sometimes you don''t, but I''m hopeful that we''ll see a new game in the future. (somber music) - For over two decades, a disparate network of "Soul Reaver" fans have kept the flames of this franchise burning. Artists, cosplayers, archivists. Websites like Dark Chronicle and Nosgothic Realm were updated as often as news was released. But with no games to play, what type of content does a fan community feed on? Well, it turns out the "Soul Reaver" community is a particularly industrious one. - Being introduced to the Kain community, which is still remarkably energized and thriving, Raina Audron was instantly introduced to me as the, you know, effectively the sort of de facto leader of that community, old school fan who loved the game, loved the series, knew an encyclopedic amount about it, but was kind of a collaborator and cooperator with the rest of the community. - I think I was one of the very few in school who actually was playing games, and obviously being a girl, it was just so like, oh my god, my sister''s not into this at all. So I''m the black sheep, you can kind of say, because our country was Czechoslovakia when I was born, so we had these Vietnamese imports and clones of real consoles, because Nintendo wasn''t even shipping real consoles until much later in the 90s. So we were all relying on these 999 games in one cartridges kind of thing. I think it was after the split of, like, post ''95, when they finally started shipping, you know, Playstation consoles and Nintendo and stuff, when I actually could start buying proper original games. I mean, they were expensive, don''t get me wrong. But I saved up, you know, put away birthday money. I took them all back home from Slovakia to here so I have a nice display case with them. When I saw the cover of, or the review for "Soul Reaver", just the striking pose of Raziel, something unseen. Is he a zombie or a vampire? What is he? He has this really cool look to him, and even as a little kid, I was like, wow, I''m so into it! And I just loved to climb to the lighthouse in the demo, just glide off to the bottom, and then come back up, and just those sound effects, very crunchy, very satisfying, when he flips his wings open, it was just so amazing. Back in PS1 graphics, I mean, to us, it was awesome. Over time, their builds were being found, the alpha builds from January, February, and you can see the state of them. While they''re playable, there are lots of issues and crashes and it doesn''t have this and that for the game, and even in the May build, even though it''s better, it''s constantly crashing. The game was constantly just freezing and stuff like that, in May, literally like two, three months before release, so they somehow pulled it together, and then obviously, they had to do really hard work to make it happen. - [Danny] Over the years, these early builds became the foundation of a new pilar within the "Soul Reaver" community, datamining early versions of the games to access cut content. Looking through code and file structures to try and puzzle out elements of the game that were lost to time. For one fan who loved the puzzles and lore of this world, and who was starved for new "Soul Reaver" content, uncovering these lost levels became a sort of meta-game, an obsession while he waited for a new "Soul Reaver" title, a new way to uncover the secrets of the "Soul Reaver" universe. - In the beginning, it was just the bits that they''d left in the data files that were unused, so voice clips and models and so forth. In those days, so in the early 2000s, there was one build that had leaked that was a beta version of "Soul Reaver" that was pretty close to the final version in terms of the areas. It didn''t have the major deleted areas, for example. But we did a lot of looking at that, trying to piece things out, and then in 2018 or 19, we finally got ahold of very early prototypes of "Soul Reaver" and "Blood Omen" as well, and then since then, a few more have escaped, and it''s certainly been interesting to look at those. It really does feel like a puzzle, and I really enjoyed it. I do that sort of thing professionally now, and so I probably wouldn''t be where I am today if I had not played "Soul Reaver" back in the olden days. When those alpha builds of "Soul Reaver" escaped, we were able to look at the code for things like the possession ability that was removed from the game, and we could really see how that worked. How''s it interacting with the game engine itself? Where you''re supposed to trigger it in the game is not hooked up, but if I just flip this bit over here because I''ve looked at the code and figured out where that is, I can set the game into a state where you''re controlling one of the other creatures. - You know, for a Playstation, you spend all your polygons on the main character, and so you don''t want to spend that on every single character. You can''t do it. It''s not going to work. So because the camera''s closer to your main character, and because you see the main character all the time, you spend all your polygons on it when you can, and that simply wasn''t going to work for a possession type game, so we basically switched to just having one character, and that was Raziel. - [Ben] The more that comes out, the more the sort of fans of that material have been surprised about just how close they got to finishing it, and when we saw, oh wow, the smokestack is basically there, Turel is there, the whole thing is laid out, it''s just that the puzzles don''t work yet, and a similar situation with the undercity, it really felt like, you know, wow, they spent another four or five months removing it and then polishing up what was left. Was that not enough time? You know, so we''re curious about, there was probably a technical limitation of the Playstation hardware or something like that. - Room size was definitely one idea. We had an undercity that was just too big. We tried to make it cavernous, and literally, you can only see one side of the room as you turned around. You could see one side on the left and one side on the right but you couldn''t see the whole thing as it was, because it just simply wouldn''t load at the same time. The graphics couldn''t take it. - It''s a miracle, I think, in the end, and also giving the PS1 limitations like, you know, the graphics, the memory. You had two megabyte video memory. It seems so little. How did they... You have to kind of consider, you can''t just compare it to current state. You know, at the time, it was a technical marvel, and I''ll still always say it. Graphically, technologically, obviously story was great, gameplay. To me, it''s my favorite game of all time still, after 25 years. Nothing tops that. - [Danny] So what about those canceled games? The "Soul Reaver" community has put a lot of work into trying to establish which games were canceled and which were just prototypes or ideas that never made it past the pitch phase. Perhaps if we can get a better understanding of why these games never materialized, we can get a better understanding of the difficulty this franchise suffers in trying to come back. - "The Dark Prophecy" is the first one that we discovered. That one, as I understand it, was sort of outsourced to another studio. It had the look of the series, from what we see from screenshots, but there was some kind of disagreement over the story, which seems to be a common theme in all of the sequels that were never released. "Dead Sun", the game that "Nosgoth" was sort of split off from, has some polarizing opinions in the fanbase, but it looks like they made a very nice-looking game, and I think their hearts were in the right place. I think those are the two that I know for sure have been disclosed publicly. There have been a lot of rumors and other information over the years about more, but I know I can talk about those two without getting in trouble. (pensive music) - When we filmed our Crystal Dynamics documentary in 2022, the studio allowed us to film footage of a physical archive of development materials that folks at the studio had chaperoned through time. In it, there were design documents, scripts, and concept art from dozens of Crystal Dynamics games. But there were also these big boxes full of physical media, video tapes, audio tapes, and even film reel. It''s wonderful that this stuff had been saved, but like many archives, the expense and time consuming process of digitizing had not happened. Well, that was, until recently. - In some ways, we''ve completed the hardest part, but we''re sort of in the middle of a process of de-archiving material. We''re lucky, a lot of studios, even with beloved IPs, make the game, ship it, put the stuff in a box, and either lose track of it or throw it out. We''re lucky, in a sense, that somebody over the years kept a pretty decent archive of physical stuff. We''ve got old comic books and binders full of story bible and script material, but also digital stuff, and when I say that we''re finished with the hardest part, it was the de-archiving of the digital collection, and I know that you have literally seen some of this yourself. Boxes and boxes of physical media that had to be digitized, and that was not labeled, so literally hundreds of CDs with, you know, Sharpie if you''re lucky, saying CD one. So working with an archive company, the folks here at Crystal Dynamics in San Mateo went through and digitized every single piece of portable digital media that they could find, and that was CDs, DVDs, Iomega zip drives, if you''re old enough to remember those, floppy disks in one or two cases, and so on. I''ve personally gone through, printed out versions of scripts to match them to takes the actors and outtakes the actors were doing to try and make sense of the chronology of it, but as it turned out, it was kind of a treasure chest of stuff. We''re looking at ways to make that video more available. You might see some of that in this documentary, in fact. Firstly, discover what it is what we''re sitting on top of, and then secondly, making sure the fans get to see it. There''s no point hoarding all this stuff and keeping it secret, so just in finding it, we had an obligation to crack it open, and it''s been a long, expensive process, but I think it''s well worth it. We''ve already found some genuine surprises and treasures in there. - Here''s a big crate. It''s got one sticker on it that says LOK, so I think that''s what we''re looking for here. Okay, this is mostly tapes. Beta SP tapes. There''s a piece of paper here that has just a file structure on it with tick boxes. I think this is probably the digital stuff that we''re going to get a copy of. It''s all in 720, it looks like, 60 frames, so I guess that''s how they captured it. Voiceover, it looks like. SR2 VO5, so they''re "Soul Reaver 2". There''s a lot of them. Pickups, LOKD, so that''s "Legacy of Kain: Defiance", presumably. BO2 commercial, Piercing? They did have some really crazy ads for "Soul Reaver", so I wonder if some this stuff is in here. - [Narrator] At a time like this? Blood, always blood. Find your dark side. "Blood Omen 2" by Eidos Interactive, rated mature. - Kain PC, startup and credits. "Soul Reaver 1" extro. "Soul Reaver 2" VO sessions. Kain cinematics from the Sony, it says. "Soul Reaver 2" trailer one, long version, NTSC, "Soul Reaver 2" trailer two. Man, there''s so much stuff here. DAT tapes? I haven''t seen a DAT tape in forever. Look at these little things. Yeah, it''s like an audio format. Male generic vampire hunter. They kept a lot of the audio tapes. I wonder how useful any of this would be in doing a remaster. Presumably audio on a Playstation is fairly compressed. But then also, do you spend all the time to go through all of these and find the original lines they use? Probably not, right? It is really cool that they kept all this stuff, anyway. - [Tony] Raziel. Raziel! Raziel? - Sounds good in here. We wasted three of them. - [Tony] Well, I can give you those again. - Oh, really? - Yeah. - "Soul Reaver" auditions. Wow, I wonder who they auditioned. Okay, we need to talk about this. So there are over 30 hours of DAT tapes in this archive, and I spent months, months, going through them, trying to find choice cuts, let''s say. A lot of them are just the recordings of the various "Soul Reaver" games'' voiceover sessions, but like I said, some of these were auditions, and "Soul Reaver" being a game that was made in California, it probably won''t surprise you that they auditioned dozens of people for all of these "Soul Reaver" games. Practically every person I''d ever heard of in the world of voice acting has an audition for one of these games. The auditions for the "Soul Reaver" games have some incredible names in there, like Maurice LaMarche from "Pinky and the Brain", Richard McGonagle, who played Sully in "Uncharted". Kath Soucie, aka Phil and Lil from "Rugrats", auditioned for Uma in "Blood Omen 2". Tom Kenny, the voice of Spongebob, even did a few versions of Faustus for "Blood Omen 2". - [Tom] Well, well. Our lord was correct. You are alive. Do you remember me, Kain, who served you so well? - If voice actors don''t tickle your fancy, then how about characters from the stars, both wars and trek? - Mark Hamill as Janos. - You must delve further back into history, Kain, to know the truth of our heritage. Long ago and long before I first walked the Earth, vampires were godlike, and our kind ruled the land. - Robert Picardo as Moebius. - Raziel. Redeemer and destroyer, pawn and messiah. - But don''t worry, that is not the craziest thing that I found on these tapes. When you think of late 90s Playstation 1 games with iconic voice acting, what games do you think of? Well, one game in particular came out 12 months before "Soul Reaver" and had a murderer''s row of incredible English voice actors who were more than willing to audition for this creepy vampire game. So let''s, for a second, just imagine an alternative universe where the "Soul Reaver" games are voiced by the cast of "Metal Gear Solid". - David Hayter, Raziel. - Kain is deified. The clans tell tales of him. Few know the truth. I am Raziel, firstborn of his lieutenants. - [Crew] This is Ariel, Jennifer Hale. - [Jennifer] Your madness has shattered our dreams and blinded you. There is nothing left of me to fear, vampire. - [Cam] No, Kain, once more you underestimate me. The dark gifts manifest differently in each of us. - [Doug] Kain is deified. The clans tell tales of him. Few know the truth. - [Paul] Raziel! I know you, Raziel! You are worthy. - Would you have liked to have lived in the David Hayter version of "Soul Reaver" reality? - I''m very, very glad that I live in the Michael Bell... I''m one of those people who, I cannot think of anything more perfect than those two voice actors being Raziel and Kain. - Moebius trawls for the ignorant and unwary, hauling his gasping prey from the streams of their destinies. Stay out of his net, Raziel. - Spare me your elaborate metaphors, Kain. I have pursued you here for one purpose. You will pay for your betrayal, and balance will thus be restored to Nosgoth. - [Simon] And whose will is satisfied then? The will of Moebius, or Raziel? - Would I be better manipulated by you, Kain? Now, turn and face me. The chase is over. - Those voice actors were, I think, pitch perfect, incredible. The artistry and the craft around video games in every single aspect, including the way that they''re performed. - Lies, Raziel. Do not be deceived. - Ah, my ancient benefactor. And I dared to hope we had parted ways forever. Your silence was refreshing, while it lasted. No doubt you have a conveniently inexpressible reason for your presence here. - Do not be insolent, Raziel. I am eternally present, here and everywhere, now and always. I am the still center of the turning wheel, the hub of this world''s destiny. (pensive music) - Earlier this year, Crystal Dynamics announced that they were working with Aspyr on a remaster of the first two "Soul Reaver" games, Aspyr themselves coming hot off the heels off of a well-received remaster of the first three "Tomb Raider" titles. But one interesting thing that connects both of these projects is that to properly modernize these games, Aspyr didn''t just reach out to the fan communities for advice or help. They actually employed them to do the work. - When we first started talking to Aspyr about a remaster, they had a similar conversation about "Tomb Raider". Which ones are the right ones to do? If you have a series with, in our case, five games to sort of pick from, what''s the sweet spot? What makes the most sense? What is the business case for it, and so on. "Soul Reaver" 1 and 2 tend to be the ones that people''s memories just first jump back to, so it was an easy starting point. I think you get the most value for money out of remastering something that is a 3D action game. "Blood Omen" 1 and 2, it''s 2D, sort of quasi-isometric viewpoint, and not a modern gameplay style, as we think of it. But "Soul Reaver" 1 and 2 not only had the sort of instant fan connection and recognition as the sort of center of that collection of games, they also had the most opportunity to be improved without changing too much. Raina, whose real name is Monica, by the way, Raina Audron is her sort of nom de plume in the Kain universe, is also a talented developer, and she was one of the first people that Aspyr reached out to to work on remastering the game. She''d actually done her own high-res texture pass, and Aspyr reached out to her and said, what if we gave you a job and the tools to actually go do the platonic, idealized version of the thing that you''ve already been tinkering with for years? - So I got this message from XProger, this "Tomb Raider" fan quite known for OpenLara, which asked if I were interested in working on something, and I was like, okay, cool. And then he explained what it was. Like, oh my god! I''m working on "Tomb Raider", me? I''ve just done a few fan things, why me? I guess it helped I did the "Tomb Raider 2" HD thing, so I already had some experience. I did my own texture pack, which I slaved away for a year and then published it, so you know, I get really committed when it comes to LOK. So if I want to do something, I''ll do it, no matter what it is. After a year, I did release it, so it''s out and people can download it, play for free, but I guess that was a really good experience, because now I get to use it all, right? Yeah, it was really amazing. I just, you know, for three days, I was so happy, jumping around like, oh my god, I got a job in game development! I didn''t know how. - So when I heard about the remasters, I was really excited. When I talked to Monica, what I tried to do is just to explain to her the motivations of the way we built things, why we built things a certain way, how we got through it, why some things should be respected, why some things could be fudged, helping her with some of the original textures that I had still at high-res, because all that stuff got pushed down to 64 by 64 at the most. A lot of 32 by 32, and a lot of 16 by 16. - [Danny] Monica may have secured a job helming the remaster of her favorite game, but this was going to be no easy task. For one, though the games share a common protagonist and storyline, they are separated by a gulf in technology. The original "Soul Reaver" was released at the end of the Playstation 1, when many of the console''s biggest mysteries had been solved, whereas "Soul Reaver 2" was released at the start of the Playstation 2 era, when developers were designing around an architecture they were yet to fully understand. In fact, the vastly different way that each game handles textures caused a particular challenge for the remastering project two decades later. Thankfully, some of the work from her HD texture pack helped to skip some of those hurdles. - Today''s technology, you can just take a UV and just stamp it onto an object, and it''ll translate into the game just fine. Back in the day, you couldn''t do that. It just came in as a jumble, and you had to slowly rotate each triangle until it matched, and so you would apply a texture and then you''d have to go through the tool and manually turn every polygon, so we actually hired interns at some point because it was so much effort. So it just took that much longer to build an item, to build a room and to proof it. - That''s why my HD model took so long, because I had to cut all these squares, find out how they fit together, build the original picture. I laugh because it''s 50 shades of gray rock, really. - On top of that, we also increased our memory footprint by being able to reduce the textures down to four bit. So basically, nearly grayscale. We would just basically arc the colors one way or another, then we''d use vertex lighting to basically adjust all of the colors. - So I built all these original texture walls back as they were, and then I could replace them, and then you have to cut them back into squares and plug them back in the game, so it was quite tedious process, but because I already had these original textures assembled, it saved so much on the whole process because all we had to do is just replace them. I just told the artists, because thankfully we got some artists assigned, showed them the original texture, which was fully together, one piece, and then I took the finalized texture and cut it into squares again and set in the game. Not having this process, because with "Tomb Raider", we had to reassemble a lot of the original textures back as they were. Luckily, it wasn''t as much. "Soul Reaver 1" goes into madness with, (sighs) non-repeated, about 4 1/2 thousand textures. For perspective, "Soul Reaver 2" has only about 2,800 non-repeated textures, so yeah, almost double. - We pushed that Playstation all the way to the edge. CD speed, which I think was double speed back then, four megabytes of RAM. With streaming, with technology that was developed for it, we were able to take all of the memory and put it into the room you''re in, the room you''re going to, and the room you left behind. So with that, we were able to increase how much texture we could put in there, and the game became more reliant on the texture detail and the painting quality than it was on the number of polygons it could push, and with that, we were able to really create an illusion of a beautiful area that, you know, everything was handcrafted and painted and things like that. - With the second game, the textures are actually really good quality, as I said before, so they''re mostly 256s, so we basically, it would not be feasible for me to do both. "Soul Reaver 1" needed the extra hand, extra treatment, but "Soul Reaver 2" already looks really good because "Soul Reaver 1" is a PS1 game, and when you switch between the graphics, there''s quite a big difference. But "Soul Reaver 2", it already looks decent enough for PS2, so when you switch, it''s not that much of a... You don''t get hit in the face like, wow, this looks so cool! So it''s like, oh, this looks nice, kind of thing, so I hope people won''t be disappointed. It''s like, you know, we had limits. "Soul Reaver 1" actually looks better in some cases for textures because the rock wall or floor had like 16 tiles, let''s say, but in "Soul Reaver 2" it''s the same tile, which is 512 by 512 and stretched, and there''s no way to fix it because the game works like that, that''s how it is. They kind of took some shortcuts with that, so I was like, there''s no way to make it less blurry, because we are limited by the sizes. One of those had a lot more, they were a lot more complicated in the first place, so obviously, the texture had higher fidelity, so some things, like the ground, was not as good-looking, I guess, but obviously it''s still better than "Soul Reaver 1". I mean, I''m only comparing the HD, because I could replace the 16 tiles, and each tile is 512, so it looks better, sharper in the result, but I''m like, oh, I wish I could do something more with "Soul Reaver 2" because the ground looks a little bit blurry, but there''s nothing more we can do to improve it, because you know, it''s a remaster. We are bound to the constraints of the original engine, so we can''t just, you know, suddenly inflate it. It''s got to have dynamic music, restore the day and night cycle. We have new HD models, obviously new textures. Don''t worry, I didn''t just reuse everything I made before. I reworked a lot of it, restored the dynamic soundtrack was a big one, like you have to have it. It took a while to, you know, we have really skilled team members who did decompilations of "Soul Reaver 1" build. Thanks to that experience, it made it possible that we did restore the soundtrack in, and it works perfectly, I''m so happy. - [Danny] Another bonus from the archiving project was the ability to find classic and bonus content that had been lost to time. The PS2 version of "Soul Reaver 2" came with a DVD of extras filled with concept art, videos, and behind the scenes content that the PC version never had access to. Getting as much of that as they could onto the remaster meant a lot of translation work. But even more interesting for fans of game history is that in that archive Crystal Dynamics has digitized were early builds of the game, and this was definitely content that Raina wanted to include. - I was given access to the archive with all the goodies, and wow, it was two terabytes of it, and several folders have actually the complete levels from the game, because obviously, the game came out with one third of the game cut. But we found all these levels. We slot them back in. I even found out, the puzzles, they kind of work. You''re supposed to flood this giant room, and you pull the lever, and it actually works. They cut these things, I think it was in March. It was that or not ship the game, so they had to do that hard decision. I''m really glad to see that the players today will get to play these levels, obviously in just, you know, kind of not fully finished state, but you can actually walk across them and see the architecture and how the plan was, because they all slot together, and it''s amazing, it''s like a dream come true, being able to see the enemies, the bosses, Turel and the priestess, and just being play through the little smokestack. Oh, it''s amazing. It''s like, wow. (pensive music) - So to me, it feels like we''re at a real inflection point for the "Legacy of Kain" franchise. A couple of weeks ago, "Blood Omen" 1 and 2 were re-released on modern consoles. There was this Kickstarter for a "Soul Reaver" prequel graphic novel that reached $1 1/2 million in funding, and we are, at time of recording, mere days away from the release of "Soul Reaver" 1 and 2 remastered. This all feels like the type of commercial activity one would pursue if they were trying to make a business case for a new "Soul Reaver" game to figure out what is the most important question. After 20 years, is there still an audience for these games? But the games industry is in a very difficult place right now when it comes to funding, and Square Enix did sell Crystal Dynamics to Embracer Group in August of 2022, which almost certainly has real implications when it comes to new games being made at the studio. What''s more is the cost of making this specific type of game has only ballooned in the intervening 20 years. You could maybe make a 3rd person action game with a couple dozen people in the late 90s, but today, you''re talking hundreds if not thousands of people, and tens if not hundreds of millions of dollars of budget, so where are we when it comes to the future of the "Soul Reaver" franchise? What is it that fans want, and what, if anything, does the studio have planned? - I think if you''re making a modern video game of any genre or description, you know, there''s a business component that you have to consider. Is there a big enough audience that''s interested enough in this to make it worthwhile and revisit? Making games nowadays is much more expensive than it was. That means the risks are higher. It means that the scale of the project and sort of ramping up to build something like that is automatically bigger. With something like "Legacy of Kain" you also have that, you know, the difficulty of it not being in the public eye for the better part of 15, 20 years since the last time people were actually playing it in a contemporary sense. But weirdly, we''ve seen this with some research and polling and various other sort of market research activity. The demand is still there for a Kain game, and it has a really positive resonance for a quite surprisingly large bunch of fans. - Look, I know what people would want. They''d want to see Kain. They''d want to see gothic horror. I''d want to see the map, and blood, lots of blood. - I went back recently and played "Soul Reaver 1" some for things that we''ve been looking at, and it feels like, obviously, there are aspects that feel old, but a lot of it held up pretty well. You could see how it''d be pretty easy to convert it to a more modern game. It feels like there''s a lot of games that are sort of similar. There''s a lot of, especially the From Software games, "Elden Ring" and things like that feel like it could be, you know, a modern extension of "Soul Reaver" in a way, so I think it would fit in really well. I think it''s something that absolutely you could do. I would certainly love to see that happen. - I once asked Miyazaki of From Software fame if he would be interested in doing "Soul Reaver". I was like, oh, what''s your dream project? And I think he said some sort of D&D sorcery thing, or "Ultima" or something like that, and I was like, hey, actually, you should do "Soul Reaver", because here''s why. And I basically presented that to him, and he was like, sure, buddy. I don''t know what you''re talking about, but sure, that''s whatever you''re talking about for you. - We found, in talking to fans, even really hardcore fans who are very focused on one aspect or other of the game, when they talk about "Legacy of Kain" series and "Soul Reaver", they are usually talking about the world. They''re talking about Nosgoth. They''re talking about the characters that inhabited that world. They''re talking about specific locations. They''re talking about things that a vampire could do. Very seldom do we ever have people, you know, regale us with tales of this tricky, weird pixel jump where it was hard to get the camera to look behind you. So what they want to do is clamber up the interior of that castle that they remember fondly and battle, you know, either undead revenants or vampire hunters or whatever they''re doing in the story at that moment. But they really are talking about it as if it''s a universe rather than a specific gameplay genre. I think the challenge in bringing the story to the modern day is figuring out whether you want to tell a new story or a direct sequel, reimagine the one that''s already there, but whatever you do, being authentic to the characters and the philosophy and the stuff that Amy Hennig and the team built back in the day, because that hasn''t really dated, but the characters and world invention is perfect and ready to be re-explored, in that sense. - If I''m to consider and treat this like a remaster that is being headed up by Raina as being kind of like putting the toes in the water, I think that''s a good move. My idea would be a full on remake, a re-imagining of "Soul Reaver" as a starting point. I feel like it doesn''t have to be a major open world game. I think that you can take what it is now and build upon it in the same way that Bluepoint did with Demon Souls'' remake. I don''t know if you go on and create new stories. I definitely would love to see that. But that''s something that I think it depends on the success of whatever happens before it. - Hopefully the collection, the remasters, will bring people back on track, make them remember, because many of them didn''t play the games for a while, or they can''t because they''re not available. Some people say it should continue with what happened after "Defiance". Some people think they should remake "Soul Reaver 1" or "Blood Omen 1". I mean, you know, you can do a lot, but just do it right. - One of the challenges of "Soul Reaver" was the intricate story. From "Blood Omen" to "Soul Reaver" and "Soul Reaver 2" to "Defiance", there''s a lot of story there, and unless you know those storylines really well, it''s like unboxing or untangling a box of wires, and so that can be really challenging in and of itself. But yeah, I would love to see more with new characters. You know, I''d like to see Kain continue. I''d love to see any of the other brethren explored, or any of the other storylines. Add new characters, create new characters. Raziel wasn''t the only one. He came out of nowhere, right? Because there was "Blood Omen" and then Raziel came out, so I don''t think we have to stick with Raziel. He''s a great character. Let''s make a new character. Let''s make other characters that are pretty badass too, and see what they can do, and explore that as well. - I think these games are perfect to be reinvestigated. You know, I think this is a world that is incredibly rich, and characters that are so well-drawn, and I don''t think the story is over. Whenever you write a story, it''s like, you''ve got the world. The world exists. Nosgoth is there for the taking. But you also have these two characters, Kain and Raziel. They have this cosmic relationship that can be explored at any point, and they''ve given themselves the greatest thing, which is timelines and time. You''ve got a playground there. You''ve got so many gaps of suggested story that haven''t been explored, such a rich world. You literally have thousands of years of history. It''s perfect. Someone do something with this franchise. The fact that you''re making this documentary now, the fact that there are going to be so many people speaking so highly of it shows that there is a voracious desire for this franchise to exist again. - When you remaster something, and "Tomb Raider" just went through this with a very successful launch of the "Tomb Raider" remastered series, you get a lot of data. I hate to make it sound dry and boring, but you find out how much energy is out there in the market for something like this, and we knew that they were going to be excited when they find out what we''re doing with the remaster, but that also cracked open the question of, when are you going to make a new game? The germination of that seed would likely be energized by the sunlight of just putting it out there again. - It''s kind of a miracle when any game gets released, let alone a sequel to a franchise that''s been dormant for two decades. So who knows if this is just another false start for all those fans who have only gotten older waiting for this rebirth. Or perhaps this is the way it was always meant to happen, a triumphant return right at the moment when it felt like the last flicker of hope was about to be snuffed out. Something darkly poetic. I mean, come on. What could be more "Soul Reaver" than that? - [Interviewer] Okay, send us a kiss. - A kiss? - Yeah. - A reaver kiss? - A reaver kiss. (Michael growls) (ominous music) - [Raziel] Kain is deified. The clans tell tales of him. Few know the truth. He was mortal once, as were we all. However, his contempt for humanity drove him to create me and my brethren. I am Raziel, first born of his lieutenants. I stood with Kain and my brethren at the dawn of the empire. I have served him a millennium. Over time, we became less human and more divine. Kain would enter the state of change and emerge with a new gift. Some years after the master, our evolution would follow, until I had the honor of surpassing my lord. (ominous music continues) (ominous music continues) For my transgression, I earned a new kind of reward. (Raziel screams) Agony. (keyboard clacking)'
