transcript: '(Ident clicks) (Ambient drones) (Click) [DANNY O''DWYER] If you talk to a fan of Disco Elysium about what makes this game special, chances are they''ll quickly bring up the writing. Disco is a game with writing at its core. When combat was stripped out of the gameplay early in pre-production, it put even more pressure on the writing to not only be enjoyable to read, but to drive the gameplay forward. The skill system, worldbuilding, audio interface, and art would all have to support this central pillar of the experience. Disco Elysium has eight credited writers, and in this episode we''re going to explore the work of each of those people. In our previous episodes, you''ve already met Robert, Helen, Argo, and Märten and in today''s episode we''re going to introduce to you to Olga Moskvina, along with the work of Justin Keenan, Cash De Cuir, and Martin Luiga before he left the project. Crediting who with what is a particularly challenging effort given the collaborative nature of the project, but it does allow us to explore some important production processes that the studio developed. Not just how they collaborated as a team, but the critical work of editing – where writers would both clean-up and modify the work of others in an effort to add flavor and consistency to scenes and characters. Later, we''re going to explore many of the characters you know and love, alongside essential worldbuilding like The Pale, how Harry and Kim evolved during development, and much more. We''ve tried to keep this series as spoiler-free as possible, but there''s no getting around it in this one. I''ll also be honest, and say that this episode relies on you having played the game more than the others, as we''re diving deep into the creative backstories of the game''s many rich and complex characters. In any case, first we begin at the start of production, with a writing team attempting to come to grips with the universe of Elysium, from both a narrative perspective and the tools they used as developers... [ROBERT KURVITZ] The writers team was... I was most connected. That was who I was most working with, after the programmers after getting the original design structures for the dialog up, which me and Irv did together. We got this pipeline from Articy[:Draft]2, the dialog engine, down, and we developed what... Rules like "a passive skill can never speak before..." A normal character needs to speak before, it always comments on things. And then, after that, we needed more writers on the team. So we just started looking for them. [HELEN HINDPERE] We were all working from Tallinn. So, in the writers'' room, we had me, Argo Tuulik, Olga Moskvina. Then we also had Märten Rattasepp, who has now done work on Pentiment. [MÄRTEN RATTASEPP] The whole test character was, literally, to me and Helen and Argo, was just "come up with someone new and write an interesting scene. "A new additional character to the game." And I wrote Tommy. Yeah, a lorry driver, who had a hidden pleasant side, because every other lorry driver at the time was a huge jerk (laughs). [ROBERT] Argo – because we''d written so much together, and we''d played so much together, and he knew the world – Argo was the writer I could use to pass the baton over in the main story, if it was slightly peripheral to the main story. So, for example, he wrote Titus and I wrote Klaasje. It did gain a lot from having an external voice there, too, because Argo has this... he brought this Steinbeck-like quality to Titus. So that''s one example of this tennis-playing dynamic in writing. And then Olga Moskvina came on board. Olga is a Russian-American writer. She''s a Russian person who speaks with a Californian accent. Russian soul, Californian accent. And she wrote Lena and Morrell, the Cryptozoologists on the coast. Roy, Bird''s Nest Roy. And a really important part of the main quest: she wrote Ruby. I think her biggest – or even bigger – contribution than this, perhaps, is that she was the primary language editor on the entire thing. Olga is a poetess, and she has incredible language, and she''s responsible for the final sheen of language quality on Disco Elysium. [OLGA MOSKVINA] I was on leave from Princeton. I had a friend, Quintis Andersson, who contributed some ideas and thoughts to Disco Elysium as well, and they really wanted somebody who was an English speaker who would be able to support their writing. And they wanted Quintis at first, but he wasn''t available to move to Estonia. I was, and I thought I''d only do it for a few months to fix a few things after their initial demo... [ROBERT] Cash was a writer we got in the last year to do a lot of structural edits. Cash is a structural genius. He can really keep things in mind. Like the arch, sole mystery. The game had a lot of structural programming which is just mind-bendingly difficult, and he filled in some of the missing parts and some of the dialogs on the coast, and did a lot of game design for putting containers on the map. This final part of the game came together with his help. [ARGO] The teething period, the teaching period, for a new Disco writer it takes about between four to six months, to actually get from... Okay, you start learning the tools, the methodology, and now you''re more or less able to write independently. The first month we mostly just did lore lectures. Robert was giving big Elysium lore-dumps. It was like going to the university, but in a fun way. [OLGA] I do get a little bit (uncertain noise) about some of the vibes people tried to present. About everybody just being punks who never finished college because (laughs) many of us were actually, like, fucking, teachers in college. Like, I taught college writing for six years. Märten has a Semiotics MA from Tartu University, which is the best university in Estonia... [DANNY] Irv was a professor as well, wasn''t he, in Tallinn University? [OLGA] Yeah, yeah. He''s one of my favorite people in the world. So we actually had a lot of academics. So, the person who wrote "Fuck The World" Kosmos, was a producer and he''s also a famous poet in Estonia. [ROBERT] For example, Siim Sinamäe, "Kosmos" a producer on the project is also a really cool, funny writer. And then he wrote Piss... "Flaubert" as we called him, and "Fuck The World". And I think the Mega Rich Light-Bending Guy was also his draft. And then we had a writer called Märten Rattasepp, who took a lot of work from Martin Luiga, who, sadly, had to leave the project after about a year. So he took a lot of work over from Martin and did second drafts of Net Picker and Call Me Mañana. My favorite Martin character – which has most of his tone in it – is Tommy Le Homme. It has, like... When Martin''s friendly. That''s the soul of friendly Martin in there, which I really like. [MÄRTEN] Yeah, so at the time the studio was using Articy: Draft 2. It''s one of those node-based, visual programming tools, with a lot of little dialog fragments that link up, and you can put your little global variables or booleans, to create interesting structures with little switches that build reactivity. The onboarding was basically, I think we sat in the main room of the office, and Robert just basically showed on a big screen... He opened Articy and just demonstrated how to build a dialog structure of an NPC that you are encountering: the whole greeting part, and how to get to the hub, and how the hub works; what''s a fragment, what''s a conditional, what''s an instruction, what''s a boolean; what''s a white check, what''s a red check – which, those had already been designed at the time – what''s a passive, with the skill it was talking to, how to set everything up... He basically, over the course of maybe a couple of hours, wrote an example dialog, with everything that we needed to know. [HELEN] Articy Draft had such a huge part of influencing the way the entire game was written. ''Cos every writer knows that if you''re staring at a blank word document, nothing comes out. There''s just... "I don''t know, today''s not the day. I''m not writing anything." It''s not the same, when you''re writing in Articy, because you are creating those dialog boxes with short sentences, and it is so much fun just creating more, and more, and more, and more. So I think every one of the writers that we had on the team previously had a problem with not writing enough, and then, for the first time ever, the problem became that we were writing too much. There wasn''t enough time to edit it, to go over it. We were like, "We have to cut some parts." But then everything that was written was so good, you were like... We were like, "We''re just gonna have to find the time." And that was all because of Articy. There was a lot of dialog, so it got like... quite janky (laughs). At some point it froze completely, ''cos it definitely wasn''t built for it. We contacted them as well, and they were also like, "Yeah. This is the first time anyone''s coming with those problems to us, "so we don''t really know what to do." But they were great. And it''s also so easy to learn that, as a program. I hope Robert''s okay what I say about it, but he''s not a natural, learning-about-a-program kind of a guy. He''s all over the place. But it''s very easy to teach Articy to someone. It''s so intuitive. [ARGO] But once we got past this tutoring phase, we had... This was one of the key reasons why Disco''s writing ended up being so cohesive in the end, was that yes, we did these group editing sessions where we were all sitting behind a TV on the wall, and we were going through Articy, was the writing program. In Articy, going through the dialog card, by card, by card. [MÄRTEN] That''s an interesting process, and I think at the time I, ultimately, didn''t get on exactly the same level as the other writers, because several of the ZA/UM people – like Argo, and Helen, and Robert – they grew up together, and they had done their tabletop stuff, and their writing stuff together in their little culture/society thing. And they already had some similar understandings and views of the world, and "style". So much longer than... Learning Articy Draft, and learning the structures, the thing that took much longer is getting into this type of headspace, and the style guide that Robert kind of... We didn''t have a "style guide", but he had examples, and he had his own writing, and tried to explain and "teach" a particular type of vibe that the dialogs are supposed to have. [DANNY] I''m not sure if there is an Elysium "Bible", maybe it''s just in your head... [ROBERT] There isn''t, that''s one of the things in this, is that it''s like jazz. You have to just learn how to play it. There''s no note to it, there''s no bible to it. There''s no... It''s just something that one artist teaches another, and over years of learning how to play it, learns how to play it. It''s not an IP. It''s a way of thinking, and a way of dreaming, and a very, very specific emotion that everything needs to work around it. [MÄRTEN] Long story short, it was just slowly learning to imitate this over several months, and getting into a headspace. At least, since various characters, various NPCs are... – in the world, as well – different people, they obviously cannot all sound exactly alike, so you can have something that is more like you or like I, right? in some, perhaps, slightly different ways. And this fits a different character who is a singular person. So, if everything and everyone sounded exactly alike then that would be weird. [ARGO] The writer gets a character, some kind of a kick-off meeting with Robert... Often, with these kick-off meetings, we did [them] as a group with all of us present. Then you go and you write your first draft. Then, you get a first editing section with Robert to see if the direction is right, if the voice is right, if the mood is right. If not, then you go back and do another draft. If yes, then you move into the next phase. [HELEN] ''Cos we were given a lot of freedom to edit, edit, edit. I mean, this is maybe a misconception that some people have, we''re just geniuses of writing and the first drafts were amazing. We''re not. I think the only thing we''re actually good at is editing, editing, editing and just keep working on one dialog for a really long time, until it''s good enough. Even with all the experimenting that had gone on with Robert and Martin and others they did eventually end up in a fairly standard RPG dialog structure. You have a greeting, it can’t be too short, it can’t be too long and that was the part that voiced as well, when the game originally came out before “Final Cut” when everything was voiced, we only voiced the introductory part. Because that’s the ammount of funds and time and resources that we had. So you kind of establish the character, and voice and hook and tone. And then it ends up in a standard hub. Like many RPGs too you ask questions, and then it sort of loops back to the central hub whenever you have gone through a branch. [ARGO] I would say that different characters had, of course, a different amount of editing sessions. I think Robert has said in an interview before, that 70% of Disco is a rewrite, and 50% of that is a rewrite of a rewrite. There is a lot of rewriting, and some of the most legendary rewrites were... I think Cuno was rewritten... I rewrote it 15 times? Evrart, I think, probably like seven times. This became a bit of a joke in the office. It''s, "So what is Args doing?" "Oh, he''s writing Evrart again." And we''re three months away from launch. "Why is he writing Evrart again?!" But it was extremely necessary. This is another thing I''ve noticed, in working in the modern games industry, that quite often it is expected that the first draft is good enough. But you do need the polish, and you do need to have the freedom to throw away bad stuff. You should never be pressured to put low quality work in just because it already exists. [MÄRTEN] ...bring more life to these characters that you then need to go and write over the next several weeks – or occasionally even months if it was a very hefty thing that had a lot of going back and forth, and branching, and maybe interconnectedness with other characters. So some characters took a month or two to write (scoffs) which is insane for RPGs. Like, "Oh no! No one else writes things that long! "You need to be done in three days. What are you doing?" Right? (gentle piano arpeggio) [DANNY] Disco Elysium is a game packed full of memorable characters, and the stories of their creation are as distinct as the characters themselves. So, for the next 20 minutes we''re gonna bounce around the district of Martinaise and talk about some of the characters players enjoyed the most – and, more importantly, some of the characters the writers enjoyed the most. One note before we begin, though: In the credits of Disco Elysium, some  of the writing team are credited as "writers" while some others are credited as "editors". While the core writing team that began the game did a lot of the initial heavy-lifting, it''s clear that, for many, the line between "writer" and "editor" was a thin one. Many of the writers edited other people''s works, while many of the editors were responsible for much more than just simply "tweaking" the work of others. This would later become a bone of contention for some of the folks working on the game. We''ll explore this in later episodes. For now, let''s dive into how all these people wrote and collaborated. And an appropriate first stop is Harry''s first human interaction which, as it happens, was the first interaction with the game for many of the initial writers. [HELEN] When me, Argo, and Olga joined the company then, surprisingly much was already done. So the entire first dialog with Klaasje with the "I want to have fuck with you" line (laughs) was already in there. And this is the first thing we learned about the project at all. Robert did not tell me anything and was like, "Just play it." I was like, "Okay, yeah. I wanna get on board. I wanna write that." So, at some point, I became the sidequest person (laughs). I kinda realized that all the sidequests were thrown at me. I think it was, yeah, the Doomed Commercial Area. It was the church, the ravers, and definitely the entire apartment building. I''m actually... I''ve been trying to figure out what exactly inspired it. I think it might''ve been our own studio, and kind of... There was the video game studio that we had in the same building, there was a bookstore, there was a tattoo shop, and also previously there had been an art gallery. So many different things. And at the same time, the house itself, our studio, was almost like this labyrinth, this mystery. So we wanted to put that into the game, I think the most difficult part was actually getting the level design correct, in the sense that there had to be something hidden that you discover. That there is, in fact, one thing that has succeeded: the Dicemaker''s little cave that she has built. So this took a lot of concepting. There were so many versions of it. And then of course there''s Plaisance. The way she uses spirituality to protect herself against the world. It''s very clear that the world is very unstable. Revachol has this very difficult history, and there''s almost always this feeling that "I don''t know what''s gonna happen." And if you''re just a small business owner who''s trying to get by, then you just want some kind of explanation for everything that''s happening. So yeah, I think Plaisance is the key character there, yeah. PLAISANCE: "No! Please just talk to me, officer... "Come here and let''s talk this through before you decide to do anything ''extreme''..." HALF LIGHT: "Lies. Rip them open, we say!" Märten: The whole bookstore part, that was a lot of fun I have to admit. This is one of those parts I really enjoyed as a creative process as well. Everything involving Plaisance who was for once a character who wasn’t pleasant that I could write. A really different approach to having this magical thinking person who is very shrill and wants to compell you into buying books and other stuff. And really wants to keep you out of the doomed commercial area. Yes so Annette, I think Martin Luiga had written a lot of her stuff already at least the idea or concept was there but the actual dialog was heavilly revised. She’s like another pleasant person who stands there and is trying to get you into the book store to make sure you go in there and maybe get involved with the whole doomed commercial area bit. [HELEN] My kind of most, I don''t know,  dearest character is the Working Class Woman questline. I think it''s also because it was the very first thing I started work on. So I remember me, Argo, and Martin, we all got hired around the same time. This is like... We had... They already had the Plaza, art for that. "This is the Plaza, just write some kind of NPC there." Y''know, short, quick, no long backstory. And I think all of us came up with someone who became actually... There''s a huge backstory to them. So Argo wrote René and Gaston, Martin wrote Tommy Le Homme, and I wrote the Working Class Woman. WORKING CLASS WOMAN: "He went to retrieve my book and he promised, "he ''promised'' he''d walk straight back home." [ARGO] I think Robert wanted some kind of a game. That there should be somebody playing some kind of a game. It makes, also, sense then that Robert also said, "Maybe it''s two guys playing some kind of a game." I think it was me who said pétanque because we had this strong French theme. Why I chose the people I chose? I''ve always been very good at writing, best at writing, old men. Why that is, is that most of my career before ZA/UM, I worked in various proletariat jobs where the huge majority of my colleagues are men with alcohol problems past their 50s. I am particularly familiar with this demographic. And also, I very quickly learned this lesson, writing René and Gaston, that it is so much easier to write a scene there that has more than one character in it, because they can play off each other. You don''t hit these choke points where it''s, "Well, somebody should say something!" but nothing natural comes up. GASTON: "Evrart and I have these long talks where..." RENÉ: "Where he tells his little ''penman'' exactly what to say!" [HELEN] And this is when we discovered the writing style. We discovered, oh, we can actually put stuff in like... I was working on writing this dialog, but at the same time I was watching a lot of videos about cockatoos. And then I was like, "Okay, I''ll just put that in" (laughs) ''cos I''m procrastinating. So... And then it grew into this tragic story. I think she''s very inspired by my love for Émile Zola, the French novelist, who would write those incredibly realistic portraits of working class France, and the people there. So I wanted to write the character... Even at first glance, she seems boring. Almost like there''s nothing to talk to her [about], There''s nothing really extravagant about her. But then, as you speak to her more and more, you discover her backstory and life. And also, it''s the mystery where, finally, when you get to her apartment you can look around and there are clues there that she has kids... All this story kind of comes to life. So I think that''s why I like her. She''s surprisingly simple for Disco Elysium who has so many colorful characters. But I think she stands out. Yeah. And I think the final bit – so this is spoilers here – but the final bit where you go to tell her and give her the death notice, I think this is one of the hardest things I''ve written because it took a lot of research, I wanted to do this bit right, and there was a huge question of, y''know, Harry''s such a humorous character, how do you do it seriously? Like, how do you make it so that Harry, as a character, also understands that this is not the place for jokes. This is just something very moving and serious. So it ends up that the one who''s making the jokes is the Working Class Woman. Who is like, "Oh, have you come to talk to me about the cockatoos?" And, yeah, I think this is the moment I''m proudest of in my own writing. WORKING CLASS WOMAN: "He was just..." EMPATHY: "But he was just here. Alive." KIM KITSURAGI: "We understand this comes as a huge shock. "I want you to know that me and my partner are here for you if you have any questions. "Take your time, ma''am." WORKING CLASS WOMAN: "What happened to him?" [HELEN] And then, I think Argo''s best character is, obviously, Cuno. I mean, Cuno is just ... amazing (chuckles). CUNO: "Get your snout out of Cuno''s ass! "Cuno knows how hard Cuno pushes it. Cuno pushes it hard-level..." (Cheery orchestral music) [HELEN] I remember the first version of it. I think Cuno is something that first came out of tabletop games that Robert and Argo played. So they were familiar with the character and I think he''s one of the most loved characters now (laughs). So it''s absolutely amazing. [ARGO] The really difficult thing was to actually get Cuno''s language, Cuno''s speaking written down to a point where it''s not annoying. I''ve seen even new writers try to write Cuno. And it seems so easy, "just say fuck and shit a lot and refer to yourself in third person." But in reality, you kind of find this rhythm where it almost sounds like a weird, melodic rap when Cuno speaks, and find how often per sentence can Cuno say "Cuno" before it becomes annoying and it''s a feeling like someone hit the wrong note. This is really difficult to fine-tune. And also, there are moments where Cuno has to... The mask has to slip for a moment, and he has to say "I" to emphasize this crack in the facade, this vulnerability. I remember, both me and Robert had this realization that, after you''ve edited Cuno for two/three weeks in a row, then you need to detox because your brain starts also thinking in the same rhythm. You can''t speak or think like a normal person anymore. You need to "de-Cuno" yourself. CUNO: "Cuno can already see you soaring through the air like a fucking eagle. "Pig''s in Cuno''s debt now. Money-debt." "Cuno doesn''t fucking care." [ARGO] Luigs and myself, we always had this fascination with archaic and odd phrases in the Estonian language. We used to play around with language quite a bit. The Estonian language doesn''t have "genders", but we have ways to express femininity in words sometimes. For example, in Estonian, "dancer" is tantsua. It''s a gender-neutral word. But if you want to emphasize that it''s a female dancer, then it becomes tantsuatar. And in the same way, Luigs came up with Cuno, Cunotar, which basically directly translates into "Cunoesse", a female Cuno. And when the video game''s time came around, then the idea for Cunoesse was that she''s even worse. That, little by little, as you familiarize yourself with the scene and start understanding what''s happening, you understand that she is the powerful one in this dynamic. CUNOESSE: "I come from the woods, kyttā vittu... "You don''t wanna go there with me... you don''t wanna see what I''ve seen." CUNO: "Don''t be traumatizing her. Get the fuck out of here!" [DANNY] "Gary, the Cryptofascist"... (Laughter) He''s an interesting one. [ROBERT] That''s my joke. Like, the Cryptos all are just like "Gary, the Cryptofascist." It was almost a basic joke. As a narrative designer, I set these characters, I knew what they''re gonna have to do. A little bit of the structure, where the white checks are gonna be. As a designer, I set these up. And then that character is Olga Moskvina''s. It has this incredibly funny little moment, where you become really paranoid and think that Gary, the Cryptofascist is sporting massive anal beads. And then Kim tells you: "You wouldn''t hear them." (Laughs) "You wouldn''t hear them if he was wearing anal beads." (Laughs) KIM: "You wouldn''t be able to hear if he were wearing anal beads. "Please excuse my colleague''s humor. "Working this murder case is taking a toll on us both." [ROBERT] And then we had editors. Quintus Gauti Andersson is an editor who did quite a lot of work on these areas that were me-only stuff. Like the island, for example. And then Justin Keenan, who did a lot of work on The Jam Mystery side and who later wrote parts of the political dreams for Final Cut. Yeah. [OLGA] We were close friends. We edited a poetry journal together. He was in English, doing a creative thesis. I was in Literature, so, easy connection, right? And I brought him into ZA/UM because I thought we needed anotherperson who would be an editor (laughs). I trained Justin in writing when he was in Tallinn for some weeks. But apart from that, he was in the US. One of the funniest things that Justin wrote is some of the dialog for the Wild Pines rep, Joyce. He was the perfect person to edit that. I mean, he went to Harvard with me (laughs). So, writing a New England sort of haughty type was natural. [JAAGUP] Justin and Cash both were insiders enough that I considered them the "grognard" guys (chuckles) But since they were so heavily tied into the production, I think Justin was very good at getting the vibe of how the writing is. [OLGA] I think that a lot of people should have just been listed as writers in the credits because we were all editing and writing. Justin Keenan – who is still a Lead Designer at ZA/UM – wrote a lot, actually, even though he''s only listed as an editor. He finished a lot of dialogs, he wrote a lot of new branches too. Märten Rattasepp was also a very serious writer, who did both writing and technical editing. He should have been in the top list with me and a few other people. Why that happened ... was for reasons I don''t want to go into. And we were always in each other''s writing, we were always adding branches to each other''s writing, we were always editing each other''s writing. CINDY THE SKULL: "I''m Cindy the fucking SKULL – what else do you want to know?" [OLGA] Cindy was there in a greater form than the rest of the characters I wrote. There was already V.O. for her in a trailer, so I had a lot to work with. Y''know, this person who really believes in making the perfect work of art, as a statement. I easily dropped into that. But Robert is very good at knowing where to direct people. So he had me write the academics, the Cryptozoologists. I knew how to write someone like Lena. Robbie gave me instructions, but I also saw her as this person who was even more than instructions. [HELEN] Lena was also something that... We really struggled, ''cos I think that Lena is a very difficult character, because there''s so much about the world she wants to tell you, and is able to tell you. So we were like... We kept writing it, and it kept coming out as this lore dump that you get right when you''re just waking up, like, "What''s going on?" So this took a lot of rework, and I think almost everyone – maybe not Argo – but everyone else worked on Lena at some point, and did their own draft. And it got rewritten, and rewritten, and rewritten. I very much love what Olga did with Ruby. Ruby is such a central character, and a very tragic character. Maybe the most tragic out of everyone, and she gets very little screen time. But she''s super important. I think at some... There were times when we avoiding getting to Ruby, because we were like, "How are we actually going to do justice to this scene?" Maybe let''s just write all of the other parts of the game (laughs), let''s just skip that. ''Cos we were just so uncertain if we could actually... It''s an entire showdown, that happens with her, where you discover that you''ve been following this false lead. And I think she did a brilliant job on it. [OLGA] With Ruby, Robert very much said, write her as a Californian, because that''s something I know, right? I think Robert is very, very talented at knowing people''s strengths, and how to get good work out of them, even in the worst circumstances, and how to inspire them to do that work. I worked closely with Kaspar on her character portrait, and how she would look. I based her on a character from, visually, Derek Jarman''s Jubilee Her dialog was extremely fucking complicated to write. It took all of the reactivity, all the combinations of things that you could''ve done. And after Martin left, I was kind of Technical Editor on the game anyway, because I was basically very aware of every player state, every game state, and where the variables could be found. And also, writing someone who''s genuinely a good person. One of the few good people in the entire game, who''s truly just there for others, and fucked by life (laughs). [HELEN] And for Martin, I think Tommy Le Homme is a sense of normalcy in the madness. so we both worked together on the Doomed Commercial Area. So we did, I think, most work together with him. But I would say that Tommy Le Homme, with the poems, with all of it, it''s a very Martin character. TOMMY LE HOMME: "Stuck in the rain in a traffic jam, man. What''s on your mind?" (Dice clack) EMPATHY: "Ease into it, don''t go too far. This seems like a personal matter..." [MÄRTEN] Yeah, I do remember. Especially since, in the beginning of the game, in Whirling-in-Rags, you''re really... Harry''s really getting dunked upon for a whole lot of time. It takes a long-ass time to get out of that little motel, and then most everyone – other than Lena, I guess – is being a real jerk to him. And then, I thought, let''s write someone who is just chill and kind of like a... I guess he has more of a hippie/truck driver vibe. He smokes, and has an inner soft side. It is revised in some ways. In the final stretches of the game until it got released, it has gone through some little polishing. Some things are more snappier, some of the check stuff is slightly altered. some of the check stuff is slightly altered. But yeah, initially, he even had a whole truck and worldbuilding related check in, that I remember spending time on. just because I was trying to figure out how to do white checks and all of that. It was like a very Encyclopedia-heavy thing about various lorries and designs, and nerd stuff, and that. But yeah, just having someone personable who has a nice family life, and misses their family far away, and is stuck here. And someone who is more approachable when the other truck drivers... Well, of course, you have your Racist Lorry Driver just close by who is a completely horrible person. Who I also wrote, and we wrote, to a significant degree. So that ended up being really funny when I wrote... "This is your nice little guy and this is the huge racist jerk." [ARGO] Because again, we didn''t have this insight into how games are made, and we didn''t have a blueprint for this type of game either. So we kind of very naturally... The assumption was that, when you''re a writer, then as you write the character, you also design everything surrounding the character. How its stats chain works. You do your own programming in the writing tools. You choose the voice actor when voice acting came around. You figure out, in collaboration with animators, you figure out what the animations are going to be. In this part, of course, I don''t want to overemphasize the writer''s role in that. It''s still... Even 50/50 is giving writers too much credit. But it is a very tight collaboration between Eduardo, our incredible animator, who did all the animations. We think of it as a character – or even a better way to say it, it''s a scene, and everything around that scene writing spirals out of it. KIM KITSURAGI: "I think this racist is better than the last, "but the next racist will be the really good one." [DANNY] Through the characters in Disco Elysium, the player is exposed to notes and whispers about the wider world outside of the borders of Martinaise. A world that, because of what happened with the IP after launch – something we''ll get into in time – many fans fear they will never get to see. But I wanted to ask Robert about the perspective that the game has, and crucially, how, through the history of Elysium – a world distinct from ours – the game is able to poke and prod so much at contemporary issues surrounding rule, identity, economic captivity, and political ideology. [ROBERT] It kind of happens to have a very good perspective on the world. It can say some things that other people can''t say. So it has failed at Communism, and it owns up to these failures, but at the same time it hasn''t betrayed it. It''s not a traitor. It still believes in something, but it doesn''t have any illusions about what that something is. But, at the same time, it wasn''t a part of this Communist project that had the power to make all the mistakes (chuckles). So it''s... People in the West really like guilt and victimhood, and so on. It has a very clean victimhood profile. And then, from that position, a very good perspective opens. And that''s why it can do tricks like talking about French-Africa, for example, which is a good angle to talk about Africa generally. And it does these little history games, to fight for the right to speak about, and for, things that Eastern Europeans don''t necessarily have the right to speak about, is, I guess, what I''m trying to say. And when we were making the game, we quite often discovered that "the proud plumber race" isn''t really invited to talk about these and those topics. You can come to London and you can do the plumbing, and you can build some of our stuff, and you can pick strawberries, but you don''t talk about "race things", for example. So it uses this different historical perspective to fight for that right. MEASUREHEAD: "You have gotten these ideas from degenerate youth culture. "Have you not? You have picked them up from rock and roll songs?" [ROBERT] The part, for example, where we talk through about Africa, is Iilmaraa, and parts of South France. I could show you some maps later, but it''s formulated incredibly precisely. It has hundreds and hundreds of place names in it, and it''s manically scribbled, and it''s very, very detailed in its history and it''s very, very large. It has about seven of these isola, that it''s comprised of. And each one of these parts is a certain representation of something in our culture, but some things are changed, and each one of these has genres of stories that fit best into them. So one isola might be best meant for a war story, and another one might be a great place for an autobiographical novel to be set in, so it''s not only... Not only do they have cities and geographic formations, and rivers, and characters, and political parties that we all came up with over these years, but they all have genres attached to them as well. So this is like a spy thriller area, this is one where you can do medieval knight stuff in. Yeah. [DANNY] While the grand scope of this universe and the golden path of the game were constructed from Robert''s imagination, the two central characters of this story would be touched by the entire writing team. Harry and Kim, the two cops at the nucleus of this drama, had been outlined by Robert early on. But over the course of the game''s production they would evolve and mature often in surprising ways. [ROBERT] I think, about the time I tried this World Autumn one, that, I think, didn''t add to the amnesiac story. And I''ve even come to the conclusion that you can''t do amnesiac stories anymore, because Planescape: Torment did it so well. And I was like, "Okay, that was the last one. You can''t do it anymore." But then I think I found another twist on it, which is: What if it''s just a stupid joke? What if it''s just that he drank so much that he can''t remember. And I knew that, if I would be the game master in a pen-and-paper campaign and, for example, you would wake up as Harry, I knew that would be a really fun opening sequence because I could tell you exactly who you are by the objects of your character. Imagine waking up and you don''t know anything about yourself. All you know is you have these giant bootcut ''70s pants. Every one of these things is a really bad piece of news to you. (Laughter) Every object you find is... And then the coup de grâce is that you''re a cop! And you don''t feel like one at all. So I knew it was just this good sequence of inserting the player into the character one by one. MIRROR: "Behold! You have no idea who this thing is, do you?" [HELEN] I think I''ve learned now that, traditionally, in video games, you have those character concepts, examples of how they speak, stuff like that. But we didn''t really know how to make a video game. I think there was one person in the studio who had ever worked in a video game studio. So it was like, no idea what we''re doing. So we just kept writing, and writing, and writing. And then, at some point, it was like, "Oh, your Kim is going in a slightly weird direction, we have to rein him in again." NARRATOR: "A bespectacled man in an orange bomber jacket "is tapping his foot on the floor. Looks like he''s waiting for someone." [HELEN] It was the progression of Kim''s and Harry''s relationship, and it progressed with our writing. So we were able to edit it in, for this reason, that Kim did change around you. ''Cos the first concept of him was as this super dry person, the A+ student. As a design function, he worked to always remind the player of where they are in the quest. What are they doing, what are they supposed to be doing. We really wanted the player to be exploring around, saying the most out-there options, taking a lot of sidequests, and we needed someone to balance it. And then it was obviously your partner. Your partner is going to be the one who tells you: "Okay. We''ve got the dead body to focus [on], and we''ve got a crime to solve." And this is how he turned out to be really dry in the beginning. But, a you progressed, and at some point he''s wearing the jacket (laughs) the famous jacket with you. You''re both wearing jackets. Or, there are moments where he doesn''t just berate you, or be angry with you over something you''ve done, he also starts offering compassion when you fuck up somewhere. And this is where all the things that we discovered... KIM: "The fact that one hasn''t started already gives me pause. An investigation, I mean. "Especially id the Madre grouping is involved... and I can''t imagine they aren''t. "It''s certainly worrisome." [ROBERT] So I don''t think any of us... Definitely, I didn''t think that he was going to be so popular. I didn''t understand what the sum feeling of hanging out with him was gonna be like. And then I played the game before launch, in my one playthrough of it, and I started realizing that it''s this "dream friend simulator" – that we made almost a metaphor for the game itself – and our desire to make this really friendly game, or a friendly piece of writing that is in service of the reader. Before I made the game, I made the book. And the book is really hostile. It is a very hostile, challenging piece of reading. It''s a mystery that doesn''t have an answer – people really hate those – and it''s also all about itself. It''s all about the book, the writing, the language. It''s kind of "full of itself", purposefully. And the game is a reaction to it. It''s slavishly in service of the player. It feels that it''s challenging, and so on, but you should read the book. So it is very much that, and then Kim is the personification of that: The handholding part of it. So I was surprised at how nice I felt during that playthrough. I knew I liked the character, even to the point where I would kinda want him to be a little less. Like... His voice is so hypnotically beautiful. It''s very hard to now tell him some weird stuff, but a lot of good content is... I think people should take him like, you know how you have a cat? And sometimes, to make the cat do cute things, you need to put a little water on the cat''s head, or something? You need to tease the cat a little bit. So Kim''s like that. You can really push his buttons quite a lot, and he only becomes more lovable. [MÄRTEN] In a way, yeah. Harry and Kim were just fairly strong personalities at some point, and it was easy to understand how you were supposed to write their lines, and Kim''s lines. They were very fleshed-out. But I have always thought, one of the strengths of both of the characters, that they are clearly... They are written by everyone. Every writer had to write Harry and Kim''s stuff within their dialog with some particular NPC or scene. And then, what you needed, is just internalize the vibe of Harry and the vibe of Kim, and just keep that cohesive. And, obviously, like anything, helps that out later. [OLGA] One of my primary accomplishments [] was saying, "Justin should edit all of the writing for Kim," because they''re similar characters and I knew Justin would do such a good job with that. And I think I pretty much won there, ''cos Kim is just such a fan favorite (laughs). And we were all writing Kim so differently and it was a problem, and somebody needed to take charge of that. And I really, really admire what Justin did with editing him. [HELEN] I very much enjoyed the energy, then. Each and every time we wrote parts of Kim and Harry, which for us were shared... So I know that some video game companies do that, like all companions are written by one person. We didn''t do it. You would go over and discover that their Kim had parts that you never knew. So I just absolutely loved it, definitely. (Jangling piano arpeggios) [DANNY] Harry''s memory loss, the opening mystery of the game, is tied to several themes within the narrative of Disco Elysium. But for a second, I just wanna talk about one of them: Pale. The world of Disco Elysium stands under the shadow of a mysterious, ever-expanding force and, while largely tertiary to Harry and Kim''s investigation, its presence is ever felt. But before we talk about the Pale, first we have to talk about the Church. The church was the original vertical slice of the game, and an area of the game that almost every writer touched at one point. That was for good reasons ... and also for bad ones. [ROBERT] Here''s a good example of the main quest, and about how collaborative and fun it was. First of all, we just had a concept art of a church on stilts. We just wanted it. It was a cool visual. So Rostov did that one. Then we had a writer, who later became a sound designer called Andrus Laansalu, who was the first person on it and who developed a little bit of the Pale concepts, there. Which, I didn''t actually want to have Pale that much in the game. But because writers who start writing Elysium tend to really want to have that Pale stuff, so he had the same one. But he had a really cool take on it. I said, "Okay." I explained how the Pale works in that way, how the swallows work and stuff like that, so we could get something in there. But it became much more ambitious than I wanted it to be, and now it needs to be done justice because it has the Pale, and stuff like that. So I knew I needed a little bit of my writing to have a tone in there. So I wrote the speed freaks in the tent, because then I give it off to everyone else. And then you have to have one element that reminds you of some of the other writing there. So I did that for the vertical slice. The world building was all pre-done there. The Dolores Dei thing. Because I needed that for... So, for example, I needed the Dolores Dei stained-glass window for meeting Dolores Dei in the end. So I needed to put that in. Then Olga Moskvina came and wrote the Crab Man. And Helen wrote those parts of Noid that were written by Martin and then left there. So it''s this hodgepodge of things that people are doing. And it''s not a sign that everything''s going well on the project, because people are starting and then abandoning, and then half-filled work is there. Keep editing it, keep communicating with everyone until it comes together, until it''s not clashing with each other anymore. The biggest thing that Helen did [was] with Soona, so all the Soona dialogs really bring it together. But, again, I don''t think this is the right way to do things. I could represent it as the most Utopian way, "Oh, everyone came and did cool stuff," but that''s not what it felt like. It felt like constantly... Like keeping something from becoming a catastrophe. The Church serves as a good example of the frustrating  battlegrounds the writing team would often themselves in. Not just fighting the game, but fighting each other too. Many of the editors and writers felt like they were constantly having to go back in and fix unfinished work left by others. Often doing so secretly, hoping that nobody would notice. There were arguments over how certain characters were portrayed, and frustration over favoritism or how long it was taking people to finish their work. Much of the off-the-record conversations I’ve had with the writing team reflects this frustration and tension at the time. The type of arguments you have with close friends or room-mates that fester and deepen the longer they go unresolved. But these weren’t arguments about who didn’t clean the dishes - it was far more personal than that. What you have to remember was this was a group of highly skilled, highly motivated people working on a project that felt significant artistically. None of them wanted this game to be anything other than the best of their work. This was a high-stakes project, which means arguments took on even higher stakes. Robert felt like he had ownership over this universe and with a weight of responsibility that he often struggled with. Cracks in the team were starting to form. And again, whenever I''d talk to other people who write games like this, they just look at it like, "You''re really making your life difficult, there." "Just maybe have one guy write it?" Märten: things were just chugging along in a slightly weird way at that time already It was getting a bit frustrating. In the first year when I was there it was very fun and very creative and very  interesting to work on it and then on the second year it  started getting a little bit weird already. There were some weird internal things and stress and frustrations and “who knows what” happening. *cough* I think a lot of arguments were also around how optional it should be. ''Cos it felt like such a beautiful magic that was happening there, that at some point we were like, "Oh, people can just miss it." And I think there are definitely some players I''ve seen where it''s just like, "Oh, we just walk past it." But, in the end, we decided okay, we''re not gonna force anyone in there. It''s not part of the critical path. Because I think this makes it even prettier, if you do discover it. And the same, of course, with the Cryptozoologist case where it''s like, yeah, let''s leave it optional. This was the vertical slice precisely because this was the area we definitely wanted to get in. And that was super important, ''cos Pale is such a huge part of the world of Elysium. But at the same time, we did not want an entire game to be about like... You''re chasing through the Pale. This is your entire identity that you''re researching, or something like that. When you''re a kid, you realize that okay, it''s a science fiction story. The things we know about the cosmos, or even the things we know about our world, there''s so much mystical about science that almost seems like it''s not real. So we wanted it to be in the background It''s just something... People keep living, go on. It''s just a fact of this world. But then the question was how Harry would interact with it, and how would Harry first learn about it, because he has forgotten about everything. So how do we bring that in? Then the idea was to have it in a church. There is a speck of Pale – which is a danger in itself because it might grow. It also created this alternative explanation for Harry''s memory loss, as well. We never wanted to spell out the answer. We even, among ourselves, never agreed what had happened. ''Cos that''s the thing with mysteries of life, you have theories, you have competing theories. Was it just too much alcohol? Was it getting too close to Pale? Did he discover it before? What happened there? Is he just faking the entire thing? Is it some kind of psychological, "I''m in denial" thing? What we did, as writers, is came up with all of those theories, and we tried to make sure that there is plausible sides for each of those theories. And the church was "the Pale theory". [ROBERT] One of the things we discovered about worlds, and art, and characters, and mysteries over that time – I''m of the X-Files school, that was my first contact with mystery writing – and what we discovered is that, you really cannot have a concrete answer to anything very interesting, you only need to have theories. Alan Moore has the same thing in From Hell, which is, he says that, "We will never know who Jack the Ripper is. "He will be a superposition of all of our theories about who it could have been. "That is the extent of our knowledge." And that keeps mysteries mysterious. And that''s also Epistemology. That''s how knowledge works. You only have these theories, and then some seem more likely or more adequate at some times. So there''s the comedic theory, which is, he drank so much that he can''t remember. The "Dude, Where''s My Car?" answer to it. But then there''s the worldbuilding answer to it, the Pale one. And there''s a couple of others. But the other thing is: It can''t be only that tool. There needs to be an actual preference from the storyteller, like a "word of God" thing. But that, the storyteller can never tell the people who hear a story. [DANNY] Like, explicitly? [ROBERT] Yeah. You can never say it out... So, Lynch does it in Mulholland Drive. There''s this DVD where he gives clues how you should... Like, "nine clues how you should watch Mulholland Drive." Some of it is like, "Notice the red lampshade somewhere." And they in no way help you decipher Mulholland Drive better. But what they do tell you is, Lynch isn''t just throwing stuff at you to be dreamy. There is an underlying logic, and there is a preference there. And, if it''s this way – if it''s both open and systemic – then you can have your cake and eat it. And this is also representative of what mysteries are in the real world. We know that there''s an actual truth of what happened. We can''t get to it. And we''ll have to deal with the superposition of possibilities. [DANNY] Is that how you approached just Magical Realism writ large, then? Because, in a ''70s cop thing, you don''t necessarily feel like you need to have it, but then True Detective comes around and it''s The King in Yellow... [ROBERT] Yeah. [DANNY] ...but done in the South, and suddenly that gets cracked open a little bit. Was this a byproduct of the previous D&D stuff or was it always essential to the world of Elysium? [ROBERT] We kinda thought that, after analyzing mysteries long enough, we might have come up with a new type of them. It was a personal thing. I think, at the time, structurally, The Prestige and movies like that were a good example of what are very well-constructed mysteries. And Alan Moore''s stuff. But there also seemed to be room for a new type of mystery that I felt Lost should be. So, you remember in the second and third series of Lost, you felt as if there is some kind of really new trope underneath it? It isn''t a reality TV show, or like aliens or whatever, it''s something new that you''re not coming up with the answer to this mystery, because it''s not an already existing trope. It''s a new one they''ve come up with. And that was the essence of the excitement around that TV series, and that''s also the essence of the collapse of that excitement. The moment people realize that it''s just an already existing trope, that''s when the excitement went away. And, for Elysium at the time, it was 2005, ''06, ''07, I understood that it is possible to come up with new tropes. So the Pale and its structures are quite novel, and you can''t know beforehand how the Pale operates. Even the people in the world don''t know how the Pale operates. Me, on a good day, I have some idea, maybe. But I mostly know how it doesn''t. Like, what trope it doesn''t fall under. It isn''t this, that, and so on. It isn''t global warming. It isn''t a metaphor. So anyway, the idea became that there would be these novel type of mysteries, and that the player would not be able to realize what they are because, using worldbuilding... In our world, you know the foundations of how this works, generally. There is no magic, there is no god. So you know what revelations are passable within this ruleset. But you don''t know the ruleset of Elysium, actually. So a very small example of that is the Insulindian Phasmid. That you don''t know whether, in this world, there are Cryptids, or whether the Cryptid would be real. But, on a very large scale, the way the Pale functions, or what an Innocent sees, were supposed to be these really long – hopefully new – types of mysteries that... And I think they''ve proven themselves to be that, because I don''t think anyone online, from what I''ve read, has stumbled upon the answers to the mysteries that we planned. [DANNY] But there''s also not a massive amount of people who are deeply unsatisfied. which, y''know...? [ROBERT] Exactly! Yeah. So, there are people who are very unsatisfied with the ending of my book. [DANNY] Oh, really? (Laughs) [ROBERT] It''s just a really, really bummer ending. But that''s kind of on purpose, it just really wants to be a very unsatisfying ending. And you just cannot know any of the mysteries of any of the structures, ''cos it takes 10 other episodes of the story which we don''t get to tell (chuckles). But yeah, strangely enough, they don''t leave you unsatisfied. ''Cos I think people just feel that there is some logic to them which they haven''t gotten around to yet. Which would need more storytelling. NARRATOR: "Dolores Dei -- the innocence of humanism, internationalism, and the welfare state -- turns around to face you. She has an airship airbag in her hand. She seems to be in a hurry." [ROBERT] My favorite characters of mine were Dolores Dei and the Insulindian Phasmid. I don''t have a favorite between the two, but I wrote them in the very end, and... Oh my! The money-men were angry at me, that I wasn''t getting the ending of the game finished, and I was so, so sad about it. And a lot of what happens on the island, the Deserter especially, that burnt-out dead feeling that he had was just the feeling that I had at the time. And after that, I wrote the Dolores Dei scene – which people can miss, and it''s meant to be a missable climax of types – the scene has, the character has, a lot of layers of mystery around it that I won''t spoil. Even if I never do get to make anything in Elysium, I just won''t spoil these things. But the interaction between Her Innocence Dolores Dei, and Harry''s ex, and the way they kind of manifest in Harry''s mind, they are, to me, the epitome of the new type of mystery and twist that we wanted to do for Elysium. You have something that''s very sacred and huge, and something that''s very tiny and pathetic at the same time, so when you finally meet an Innocent, it speaks to... It''s only in guise of your ex, or your ex in guise of the Innocents, and these dichotomies between these two things are really, really interesting in the scene. And I was very proud of the final lines, that she tells you when she parts. The love line. I think I got... It was one of the five or six sentences in the game that I think really... That the game really boiled down to. DOLORES: "Oh, yes. This is real darkness. It''s not death, or war, or child molestation. "Real darkness has love for a face. "The first death is in the heart, Harry." [ROBERT] And, obviously, the opposite of Dolores Dei is the Insulindian Phasmid one. And I was just so, so glad that I''m able to still go into this register. Into this happy place, that I''m able to write something after these incredibly dark and burnt-out things, that I can write something so pleasant and childlike, in that dialog. My favorite part of the Insulindian Phasmid is, of course, when you have to speak to the Insulindian Phasmid, and there''s a line that no one gets because they''re too American for it. There''s a moment where you have a choice to either say that you would rather be "it", an animal like it, or you''re glad you''re you, an incredibly sensitive instrument. And because Americans love therapy, they always choose this line. But if you choose the first one, which I think actually would be more – how do I say? – therapeutic for Harry to reach out. He always wanted to be a different type of animal. So, after that, the Insulindian Phasmid tells you an absolutely lovable little story about one of its antennas falling off and growing back accidentally as a foot because the Phasmid wants you to know that really weird things happen to it. It''s like, "Are you sure you wanna be one?" And I had a Research Assistant called Andrus Laansalu, who was also the Head Sound Engineer on Disco Elysium and he''s this cult [Academician]. People who are in his lectures really like... I''ve been to one of his lectures about Cyberpunk, and it was really cool. So it was a real honor to have him research for me. And, you know, if you just go to Wikipedia, you can''t get the coolest stuff. If you get an Academician, they can get you really good stuff. So, for example, he researched the autopsy scene for me. What autopsies are like, what happens to a dead body. But he also researched stick insects. I think he''s an entomologist, among the many, many things that Andrus is. And it was like, in the beginning of the dialog, if you''re writing a scene and the first thing you can write is something like this, the weird little childish story about it.. I was just like... It helped me establish the tone for the entire rest of the Phasmid dialog (chuckles) So it''s really creepy, but at the same time childlike and innocent. Sometimes, when you write – you''ve written, so you know when you''re not doing very well – (pained noise) and then sometimes you have that "I''m on fire" feeling. Like, ah! This is one of those rare occasions where I actually enjoy writing. And then there''s a little bit above it: "I''m doing my best work." Very rarely do you get this. And then there, I felt that – both with Dolores Dei and that – I felt I was doing my best work. So I really enjoyed those. Yeah. [DANNY] There''s a a lot more to talk about when it comes to the writing of Disco Elysium, but for this episode, we''ll end our story here. As the writing team were toiling away creating characters, producers, artists, animators, and programmers were constructing the stage they play on. So in the next episode, we''ll focus on the work of the artists; the origin of the game''s painterly style; how characters were drawn, animated, and given portraits; and how even the isometric frame contributes to the player experience. As ever, you can view this episode a week ahead of its public release over on our Patreon. Along with bonus scenes, and eventually, extended versions of some of the interviews, where we''ll dive a little deeper into the process of making this game. See you then! NARRATOR: "The man before you is naked, but for a pair of underpants and white boots. "His eyes are milky white and blind to the world, "protruding comically from their sockets. "There is no one home, just sub-aquatic terrors there. "Dark brown hair grows on his head, "his face is ready to explode from the organic processes inside. "The death''s head grin has passed, what remains is an unrecognizable mess." EMPATHY: "Underneath the curdled meat there is an expression, "not carried on his features but below, inside: an expression of pleasure. "This man was experiencing joy at the moment of his death." (Dice clack) THE HANGED MAN: "I''m gone. "Into the wild pale yonder. "In the past. Way out in the west. "I''m a joke. Look at me. "A killer. A motherfucker and a killer." HALF LIGHT: "Takes one to know one." THE HANGED MAN: "Go ahead, Cobo, "The blue heart? Oh, that''s good shit, you''ll love it. "Just press down and fuck it open like you always do. "Fuck it hard, Copopo the Clown." PHYSICAL INSTRUMENT: "He means force. It''ll work." (Ident clicks) (Click)'
