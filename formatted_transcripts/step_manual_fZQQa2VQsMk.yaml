ertainment, we end up craving more of\n[238.56s] it. This is the main but button that''s\n[241.76s] involved in consumerism\n[244.56s] where advertising and social media\n[247.36s] present us with glimpses of pleasurable\n[250.56s] futures that we only need to pay up for\n[254.319s] to experience.\n[257.12s] Or we may simply get sucked into the\n[260.0s] binge watch, the kind of dopamine loop\n[262.56s] of this endless social media scroll. I\n[265.6s] did a video on that as well that I''ll\n[267.04s] leave down in the notes. Also,\n[270.479s] second, there''s the what we might call\n[272.8s] the I need to be button. Now, this\n[276.0s] button works in a more subtle way, but\n[278.639s] in also in a kind of a more insidious\n[280.96s] way. It''s our deep craving to be or to\n[284.88s] become someone special,\n[288.08s] somebody more successful, more\n[290.4s] respectful or more respected,\n[293.44s] thinner, smarter, even more spiritual.\n[295.84s] Perhaps\n[297.36s] this need is cultivated by what we might\n[300.08s] consider the comparing mind that looks\n[303.68s] around us, around us at other people,\n[306.88s] and and and says to us, \"They''re doing\n[309.52s] better than I am. I need to be like\n[311.52s] them.\n[313.84s] And social media reinforces this\n[316.88s] unhealthy syndrome of status anxiety.\n[320.88s] Social media shows us curated images of\n[323.919s] people who seem to be living perfect\n[326.8s] lives. Even though we know in a sense\n[330.8s] that underneath the surface,\n[334.08s] most of this or even all of it is a\n[336.24s] matter of Photoshop and selective\n[338.32s] editing.\n[340.639s] Third, there is the get it away button.\n[343.759s] This in some ways is the opposite of the\n[345.84s] first button in that instead of craving\n[348.639s] for more sense pleasures, we''re craving\n[351.84s] for pain and discomforts to end.\n[355.6s] This tendency is known as aversion.\n[359.919s] It''s our desperate push against anxiety,\n[363.6s] the anger that we feel when we run into\n[365.759s] an obstacle or attempt to numb pains\n[369.12s] that we''re feeling.\n[371.199s] In extreme cases, this kind of aversion\n[374.08s] can turn into a kind of depressive\n[376.639s] nihilism or angry detachment from\n[379.6s] reality that can even end in forms of\n[382.479s] self harm.\n[384.88s] Knowing this, it''s a powerful reminder\n[387.44s] that the mental patterns we''re\n[389.199s] discussing now can have very serious\n[392.0s] consequences\n[393.919s] and that seeking professional help for\n[396.639s] them for those consequences is a sign of\n[399.759s] strength. I''ve done the same for myself\n[402.8s] on several occasions.\n[406.0s] So each of these three buttons keeps\n[408.8s] this our basic dissatisfaction engine\n[412.08s] running in one way or another, keeping\n[415.039s] us restless and stressed out.\n[418.72s] The Buddha remarked on the ways that\n[420.639s] these buttons keep the engine of our\n[423.44s] dissatisfaction running nearly\n[425.52s] constantly in ordinary life. Now, that\n[428.96s] was 2500 years ago that he spoke about\n[431.36s] those things. But if anything, it seems\n[433.84s] like it''s e what he says even more\n[435.919s] relevant today than ever.\n[438.56s] After all, our economy nowadays seems to\n[440.96s] run on manufactured dissatisfaction and\n[444.8s] the kind of dopamine loops that result\n[447.12s] from gaming and social media that keep\n[449.759s] us forever linked and entertained and\n[453.28s] and coming back for more.\n[456.4s] We might call these algorithmic\n[458.96s] entertainments that are presented to us\n[461.12s] because the algorithm knows we like\n[463.199s] them. Targeted advertising,\n[466.56s] 24/7 news cycles.\n[469.919s] All of these are systems that are\n[472.08s] designed to toggle our specific craving\n[475.12s] switches to keep us engaged, attentive,\n[479.039s] anxious, and wanting more. Our\n[483.199s] environment is tailored to keep our\n[485.44s] switches in the on position as much as\n[487.68s] possible, exploiting our attention and\n[491.28s] thereby getting into our wallets in one\n[494.16s] way or another.\n[497.12s] Third, let''s talk about this dimmer\n[498.879s] switch about regulating the\n[500.639s] dissatisfaction engine.\n[503.84s] If we''re wired to work in these\n[506.08s] unhelpful ways, what can we do about it?\n[509.52s] We can''t simply pretend that these\n[511.68s] switches don''t exist. But we can learn\n[515.12s] to regulate their function.\n[518.0s] We can change out the switches for\n[520.479s] dimmers. Let''s say the core strategy\n[523.519s] here is simple mindful awareness.\n[527.68s] Step one, we learn to feel these itches\n[531.36s] that we feel all day long without\n[533.279s] necessarily scratching them.\n[536.08s] This is the power of pausing.\n[539.6s] When a craving arises, as it inevitably\n[542.48s] will, the first step is simply to pause.\n[546.32s] To notice that craving as a sensation in\n[550.08s] the mind and in the body without\n[553.2s] immediately acting upon it.\n[556.64s] This pause creates space for change to\n[560.72s] happen in time.\n[563.519s] The second step, we get curious, not\n[566.48s] critical.\n[568.0s] We don''t spend time judging ourselves\n[570.72s] for craving things because that''s just\n[573.44s] the what the mind does. Instead, we\n[576.399s] spend time investigating that craving.\n[579.6s] What does the craving actually feel\n[581.68s] like?\n[583.279s] For example, is it, let''s say, a\n[584.959s] tightness in the chest, a restlessness\n[588.0s] in my legs?\n[590.24s] Is it a pleasant or an unpleasant\n[592.8s] feeling?\n[595.68s] This curiosity that we can bring up can\n[598.8s] change our relationship to our craving.\n[602.64s] We''re not so much victims of our urges\n[605.839s] as careful observers of them.\n[610.399s] Third step is to cultivate the antidote,\n[613.04s] which is contentment.\n[615.839s] We often think that the opposite of\n[618.24s] craving, the thing that makes craving go\n[620.64s] away is to get what we want. But in\n[624.32s] fact, as we''ve seen now many times, that\n[627.519s] in fact is not the case. We getting what\n[630.56s] we want does not end our craving.\n[633.68s] If we pay attention to the syndrome of\n[636.399s] our craving that comes up time and\n[639.04s] again, we''re going to see over a period\n[642.72s] of time that each apparent success we\n[645.6s] have is only replaced by more and more\n[648.72s] craving.\n[650.72s] This dissatisfaction engine within us\n[653.36s] continues to run.\n[656.0s] In fact, the opposite of craving is\n[658.959s] appreciating what we already have. And\n[662.16s] we can get there by cultivating\n[664.56s] contentment.\n[666.32s] Now, many practices can be helpful in\n[669.2s] this regard. For example, we can\n[671.6s] practice gratitude, simply sitting for a\n[675.12s] while and thinking on all the things we\n[677.519s] have to be grateful in our lives today.\n[681.36s] Or we can shift to finding joy in simple\n[685.279s] nontransactional\n[687.44s] activities like being generous to a\n[690.48s] friend or taking a walk in nature.\n[694.959s] In this way, we can over a period of\n[697.279s] time begin to turn down the workings of\n[701.68s] our dissatisfaction engine. So that even\n[704.959s] if that engine doesn''t really ever turn\n[707.279s] off completely, we may find that it runs\n[710.72s] a little more quietly in the background.\n[714.8s] This feeling we have of dissatisfaction\n[717.6s] with our lives, of not enough is not a\n[721.6s] kind of personal failure on our parts.\n[724.0s] It''s the engine within us doing its job.\n[727.2s] The switches are in the on position.\n[729.76s] We''re given fuel constantly by the\n[731.92s] society in which we all live.\n[735.519s] So the path to a more peaceful life is\n[738.639s] not about eliminating desire completely\n[741.839s] so much as it is about skillfully\n[744.32s] changing our relationship to our\n[747.76s] desires.\n[749.279s] from being in their bondage to becoming\n[752.48s] their wise observers.\n[755.68s] And observing in that way is a great\n[758.079s] place to start our practice. In the\n[760.8s] comments below, I''d be curious to hear\n[762.88s] which of the three buttons we talked\n[764.8s] about, the more please button, the I\n[767.76s] need to be button, and the get it away\n[770.079s] button. Which of these do you notice\n[772.32s] being pushed most often in your own\n[774.72s] life? We can answer this without any\n[778.16s] intention for judgment, simply\n[780.48s] observation.\n[783.2s] If this deep dive into our restlessness\n[785.519s] was helpful to you, a like and subscribe\n[788.16s] are always appreciated. Thanks for\n[790.639s] watching and please all of you be"}'
