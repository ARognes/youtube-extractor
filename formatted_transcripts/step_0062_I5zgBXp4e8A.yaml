transcript: '(folk music) - [Tanya] I will say that there was a hilarious anecdote recently. I''m just gonna bring it up real quick because I don''t wanna misremember the details. Yeah. So somebody says: "I tried robbing a traveler while out on the road, but I didn''t want to hurt him. I stole his shield and let him run away. But, on seeing that the shield was low quality, I decided to give it back because I felt bad robbing him of his only possession. And so, I misclicked and accidentally threw the shield at him (which was the only logical choice) and it hit his head and killed him instantly." - [Danny] (Laughs) - "Ten out of ten Adventure Mode experience." - Beautiful. Things that can only happen in Dwarf Fortress. - Yep. Yep. (jazz music) - Wow, okay, you made it to Episode 4? The final episode in this series, in fact. So it''s safe to say that you''re taking this whole Dwarf Fortress thing kinda seriously. So, before we tell the final chapter of our tale I wanna let you in on some of the community slang. You see, every good subculture has its own lingo. Shorthand for important words, or new words, that add much-needed context. For instance, how about "Digger Mortis"? Which is when you find yourself in a position where you can''t dig anymore. Usually because you''ve run out of pickaxes, and you lack the resources to make new ones. Or how about "Tantrum Spiral"? This is when something bad happens to a set of Dwarves and then they start to get mentally affected. Then it affects their fellow Dwarves, their friends and colleagues, grumpiness spreads, and before you know it the whole fort is miserable. "Urist"! "Urist" is kind of the default name for Dwarves in Dwarf Fortress, er, when you''re talking about them on Reddit and the forums, and stuff. It''s kind of like "Jane Doe" or "A. N. Other". Then there''s "Clowns". These are part of "HFS", "Hidden Fun Stuff". Basically, something cool that''s in the game that nobody talks about for fear of spoiling it. So, instead of calling these things what they actually are and spoiling the surprise. The community calls them "Clowns". Also, the area they live in is referred to as "The Circus" and the thing that you collect there is only ever referred to as "Candy". The community is very good at keeping this secret and I''m not gonna ruin it here. But of all the words you need to understand in Dwarf Fortress, none is more important than "fun". And the word "fun" in the Dwarf Fortress community has a very particular meaning. You see, the goal in Dwarf Fortress isn''t to build the best fortress, to have the most Dwarves and dominate the land. Oh no, you see, every fortress will eventually die. Be it because of invading forces, disease, flooding, civil war, Necromancers or "Clowns", your fortress will eventually fail. And it''s that failure which defines "fun". "Fun" is, essentially, losing. And losing ... is fun. "Fun" is the world throwing you a curveball you weren''t expecting, turning your well-run fortress into a battle for survival. And it''s through fun that players find out their mettle, live to fight another day, or lose with lessons learned. "Fun" is like entropy. It''s kind of ... unavoidable. And, unfortunately, we can never quite predict when it''s going to come. (moody ambient music) - [Tarn] So, when we launched on Steam Adventure Mode was not in the game. It was a "coming soon", a little button that remained there, now I guess for two years and two months, something like that? At first, erm, yeah, you couldn''t do anything. Er, it, it was... We had to convert... Just like Dwarf Mode, we had to convert one menu at a time It was a text game, right? So, the basic conversion had to be done. Fortunately, most of the graphics just came from Fort Mode, ''cos it''s the same creatures, and the same environments, and so forth. So most of it was already done, in terms of graphics. But, we had to get all of the screens converted. And then a certain standard, at least, for, like, explaining controls. We weren''t doing anything like that before. So it''s kind of, like, the same as Fort Mode. We added a small tutorial. The standard was basically to get it to where it was, before, in text. So, no real major additions. Which, for Adventure Mode, was a larger question about... Because Fort Mode is the larger mode of the game, that''s had more work done to it, and it has a game loop, because you''re stuck in this mountain and your civilization''s sort of improving in this one location. And Adventure Mode is, is a sandbox RPG. Like, it''s big sandbox energy there. So it''s great, for that. But, for someone expecting "Baldur''s Gate 3", it''s literally not this thing. There''s not a story associated to it. But what we did do, is – to kind of get people started on that – is we added a mode called "Chosen Mode" where there''s a bit of a little story. Just enough to guide you to... "Okay, this is traveling, this is fighting, "this is picking up objects and  bringing them back to temples," kinda thing. Er, so that you can have a little baby game loop, and then be set out on, "Okay, now I can talk to people, maybe I can kind of "form my own, er, y''know, experience from there." I mean, there''s a whole lot of strange things that are little self-contained experiences. Like: I can pick up a form of poetry, write a poem, and go perform at the pub. And, er, then people will, kind of, just yell, y''know, "This poet''s really lousy," or whatever, and then... But if you were good at it or judicious during character creation and picked the right kinda skills and attributes, and so forth, or practiced a bit, er, you can start getting free drinks, stuff like that, y''know? It''s a, er, a little, kind of, way to experience, like, What was this town like, that was sending trade caravans to my last fortress? And we have a pretty complicated map generator for Human towns that cannot be seen in Fortress Mode. It''s completely separate from Fortress Mode. And then, you can walk through the sewers, you can walk into little towers, and into taverns, libraries. Every place of business. Like, the biggest towns have about 10,000 people and maybe 2,000 different little businesses, and so forth. And it''s like... There''s a certain shallowness to that, if you don''t, like... If you haven''t created all of the subcultures and things that would develop in a town like that. Go to your retired fortress and retire there yourself. Un-retire your fortress, and there''s your adventure as a little citizen. Y''know? And it all works. Yeah, just have a unique and strange experience in the world of Dwarf Fortress. - [Danny] How was putting  together Adventure Mode? Just from a workload, stress perspective? - Well, a lot of it was on Tarn, because it''s just – and the artists – because it''s just, erm, y''know, completing the thing that was already there. I''m a real workaholic, and the fact that I haven''t been able to do anything is really driving me crazy. We did... Dwarf Fortress is this sandbox. It doesn''t need a "plot", but it needs pieces of a plot that you can scramble together. And so, that''s what I had been working on, right at the end, was these stories called "Tales Foretold" that I had written for the fans. Y''know, I just got into this place where I''m just staring at the walls, and I really needed to do something, but I''m getting there. - [Danny] Zach feels restless because the majority of the work in Adventure Mode has been programming. In fact, it''s been too much work for Tarn to tackle alone. So, after the Version 5 launch, the team brought on one of the QA testers – a prominent modder within the scene – to help support Tarn''s work. And more than just implementing fixes to the game, she''s done incredible work to optimize Tarn''s code and make Dwarf Fortress run faster. - [Putnam] People were trying to tell me, "Oh, man, "it''s an old codebase by a solo coder, "it''ll probably be horrible." Well, it turns out old codebase by a solo coder who needs to communicate with his own future self, is way, way easier to deal with than the crap I have dealt with – which is mostly open source stuff, and half of the people who contribute to open source stuff don''t even think about other people at all. So the actual, slowest part of the game depends on what''s happening. If your game suddenly drops to 2 FPS and everything''s horrible, it''s probably because you have someone locked in the caverns or behind a door and they''re trying to leave the site, or whatever, and they''re just pathfinding over and over again, every tick. Every unit has to check every other unit, to see if they''re close enough to be checked for line-of-sight and then to see if they''re friend or foe. So I just set-up an object pool for them and allocated them into the object pool, and that improved performance about 40 percent by itself. - [Tarn] So, she helped, erm, a lot just with, like, erm, the things that people thought were impossible, like threading Dwarf Fortress. It''s now a very multi-threaded game. And you can do... Yeah. You can more reliably do 10,000-year worlds in world generation now, too. Yeah, just generally fixing bugs, making crash logs work better. All this kinda technical stuff. - Someone identified a, er, a crash in world gen and I checked, and there was a crash if a Demon Leader of a Goblin civilization read a book that made them think "Decorum" is more valuable than Goblins normally think it is. So they would assign a chef – and Goblins don''t eat, so the Goblin chef would be checking some stuff that the game didn''t like and it would crash. I just find this sort of thing all the time. Like, I occasionally test things and find someone who''s the poorest person on the planet because they just can''t stop gambling. They can''t stop gambling, they just do it all the time. Or, y''know, a Necromancer who kept getting, like, arrested because they''re extremely bad at, er, plotting. They''re just insanely terrible at it and they kept getting arrested because the police officer kept catching them. They ended up getting married, the police officer, like, the guard who kept catching the Necromancer. There''s just so much, there''s something new every time I look for things. It''s kinda funny. That one, I was just checking to make sure Necromancers still worked with the Lua. That wasn''t even the point. I just found that, randomly. - [Danny] While Adventure Mode''s development continued, behind the scenes, life did: Annie and Zach moved into a new home and added some new furry friends to the family. Tarn was on dating apps looking for companionship. But just when life couldn''t be more ideal, the unimaginable happened. - [Annie] I think it started off great, right? Like, we had this huge life change. Dwarf Fortress finally came out, it was successful. It was... It changed our life in every, literally every way, we could possibly imagine. We changed our life, and it... Even though really it wasn''t overnight – it was 20 years in the making – it felt like overnight. And it felt like, suddenly this whole world of possibilities was open to us. And then, shortly after the game came out, last summer my brother got sick, erm, and got sick really suddenly. And, erm, was in the ICU for, er, 52 days and then, erm, unfortunately passed away erm, y''know, very, very young. - [Danny] I''m so sorry. - And him and I were closer than you could ever imagine. We talked on the phone for hours a day. We would talk on the phone for three hours, and then he would be like, "Just come over." And we lived five minutes away from each other, and then I would be there. So he was a big part of my daily life, and losing him just gutted me. I had made the decision to quit my job pretty quickly erm, because we knew he was gonna need a really long recovery – erm, at the time we thought that he, he would recover – and I wanted to be there for my sister-in-law and him. And so I had decided to quit, and then actually, before I could quit he passed away. And then I had this moment of like, "Okay... "So, what do I do? Do I go back to work? Do I do that?" And Dwarf Fortress gave me the opportunity to even be able to make that decision, right? So many people in my situation had to go back to work. They would have had to have gone to do that to support themselves and support their families, and I didn''t have... I had the incredible privilege of not having that while I was, kind of, navigating the early parts of grief. And, honestly, it probably saved my life. Like, I don''t know if, erm, we didn''t have the freedom that Dwarf Fortress afforded us, I don''t know if I would have made it through those first parts. Everybody''s been so supportive, everybody''s been so great. But it was such a profound loss that, erm, it just... I don''t know what that would''ve looked like, if I had had to try to balance my job and my career. And, erm, I''m really grateful for that. - [Danny] How''s your dad doing? - My dad is, y''know, so, er... My dad''s... He''s, he''s getting through it. So there''s just me and my brother, and then our mom died over a decade ago. So it''s just me and him now. So it''s brought him and I a lot closer, although we''ve always been close. And Dwarf Fortress made it possible for us to build him a house. Because of that, he was able to retire, and that was something he didn''t think he''d ever been able to do. So we''re so grateful for the community for that. I come from a family of workaholics, so not working was a little bit of a shock to his system. And after we lost Robert, I was just like, "We''re not gonna do this anymore, dad. Like, you''re not gonna "work yourself until I find you one day at your desk. "Like, you''re just, erm... "We''re gonna have to try to figure out a way to fast-track this, erm, this retirement." We had the opportunity, a really good opportunity to build him a house on the reservation, and it worked out really well for everybody. And so he just moved in this month, actually. So he''s really excited about it. And, y''know, life goes on? And that''s the other, that''s the other thing. And that''s one thing, erm, that... A lesson, that my brother... I, y''know, hold from my brother is that we can''t really let ourselves get stuck in grief. It''s important to feel it, it''s important to go through your feelings and your thoughts, and all of that thing. And, lord knows, that I did that for many, many, many months. Erm, but there comes a point where we have to, kind of... Life is for the living? And if we, if we, kind of, live it stuck, because there''s somebody who''s no longer with us, erm, my brother really thought that that''s the greatest disservice you could do to the memory of someone. But, as my anger with the whole situation subsides I realise that he was right. And, erm, y''know, that''s his gift to me, is, is being able to move on from these really hard, hard situations and to not get stuck in that grief. (ambient music) - [Danny] Robert''s passing had left a massive hole in Annie''s life – one that was all but impossible to get emotional space from. The extra bedrooms in their new home may once have felt superfluous, but after Robert''s passing they invited his wife, Annie''s sister-in-law, to come live with them. The home was now a refuge for these two women to mourn the loss of a husband and brother. In an effort to get some emotional space, herself and Zach decided to do something they had never been able to do before: Travel. This also gave Annie''s sister-in-law some space to grieve in privacy. - [Zach] I think what I had wanted to do was, basically Australia''s one... That was my bucket list, because I wanted to sail the ocean, like, an actual ocean instead of just the Puget Sound when we''re commuting to Seattle. We''ve just got back from Australia. This is this tan. It''s Winter, and I''ve got a tan. So that''s what we have been doing. Taking a cruise up through Alaska, that was really fun. That was about the most incredible thing I think I''ve ever done. Seeing those glaciers collapse, and stuff like that, while you''re in a little boat. - [Danny] Sadly, grief is something the family has battled with a lot recently. When I texted Tarn to figure out where we could film these interviews, he suggested his "mother''s house." My heart sank when I read the message, wondering why he hadn''t said his "parents'' house." And, sure enough, when I turned up I learned that Zach''s father – the man who had originally introduced the boys to computers – had just recently passed away. Their mother was incredibly kind, allowing me to film there. Sharing photos of her, her husband, and the boys, from their lives together. She preferred not to be on camera herself, and of course I respected her wishes. But there was someone else there, who I met on that day who also preferred not to be on camera. But considering how long it took Tarn to find her I think I should let Tarn tell this one... - [Tarn] Well, I went on to four, four different dating sites and, er, put up pretty terrible pictures, and a horrible profile. Short, and just kinda worked... You have to work through, like, "What am I actually saying to people?" When you go on those places, you have to suddenly be a bit introspective in different ways that you might not be used to. So I wrote a little blurb about myself, and I, er, yeah, yeah, met somebody. - [Danny] Who is that person? Er, so, er, that''s Steph. My, er, my wife. - Steph was in, I think it''s called, "travel mode". - [Danny] Okay. - [Tarn] And she was traveling to Seattle – which I took as "you''re travelling to Seattle". And so I was like... When I messaged her I was like, "Hey, you''re still in Seattle?" And she was like, "Well, I''m in Norwich in the United Kingdom?" And, er, I was like, "Well, okay." (Laughter) And we kept chatting. Yeah, we just went back and forth everyday, talking. And then you switch to texts or Signal, or Discord, or whatever. We ended up on so many different places. And then, yeah, video calls, and I went and visited. We went to London. We didn''t get up to Norwich that time. I''d never been to London before, I''d never been to the United Kingdom before. The Tube, like it. The Tube''s a great thing. Mass transit that works. We went to a bunch of pubs and things. I''d never been to karaoke either. I''ve never done a lot of things. And, er, it was a delightful time. - [Danny] Two months after Tarn''s visit to England, Steph flew over to Poulsbo to meet his family and spend time with them. And a few months after that, Tarn packed his bags and moved to England. It could only be this way. Steph has a child with a previous partner, so moving to America was not an option. In the space of just a few months, Tarn had not only lost a father but he''d gained a stepchild. - [Danny] How do you find life in England? - Erm... I like it, I like it quite a bit. I like the respect for the Zebra crossing. - [Danny] (Chuckles) - Like, people say, "All right?" and I don''t know what the hell''s going on. I''m getting used to it, though, and I like the chippies, of course. If you don''t like the chippy, you can''t stay very long. So it''s good. - We did visit, er, Tarn and actually be the witnesses at his wedding. Then we saw all sorts of stuff. Winston Churchill''s bunker, I think, was my favorite thing to see (laughs). - [Danny] What''s the move been like? Obviously, you''ve such great family connections to this place, and people you''ve been around for all of your life. - Yeah. - [Danny] How difficult has that been? - That''s been really hard. I mean... Even now, it''s 2025 and, er, we''re still adjusting, like, to our... The time difference by itself makes it really hard to even do remote work, right? I''ve got evening calls, and that kind of thing. That''s complicated, because I''m a stepfather now. - [Danny] Right. So getting all that stuff to work, we''re still sorting it out. Er, and also, yeah, just not being, not being around is... Yeah, no, it has an impact. - [Danny] Yeah, so what is it like, as a brother, to not have him around as much? - Oh, it''s, it''s... I get sad sometimes. But it''s, er... I''ve got my own life. It does feel a lot like when he was at Texas A&M and I was still up here in Washington, except that that''s a little different, ''cos that was the most miserable time of his life (laughs). So... - Yeah, but for me personally, I''m still in the middle of this move, and that''s exciting and ongoing. I''m gonna get a house. Be living in, living in England, in a house doing Dwarf stuff, like a, like a Dwarfy Englishman. - I''ll always be 100 percent transparent. It''s hard. It''s hard. You go from having somebody in your life you just can drive 10 minutes down the road to see... I think that what a lot of people don''t get to see is the way that Dwarf Fortress has been developed. A lot of it is just organic conversation through Tarn and Zach. And it reminded me a lot of when Covid happened and we all had to go to telework, and you kind of lose that organic, free-flowing idea of, like, "Oh, we should do this", "Okay, I''ll do that right now". So I think it''s, y''know, it''s been hard. And also, like, they''re gonna figure it out. Like, everybody''s gonna figure it out. Change is hard, and even when change happens because of really fantastic reasons, it''s hard. The three of us, and now Steph, are very close and we always have been very close. We''ll figure it out. We''ll figure it out (chuckles). - [Zach] The extended family is here and, er, my grandmother died. There''s a lot of tragedy, I''ve just gotta admit. Like, that''s why, y''know, I hope this isn''t too upsetting. But it''s, like... My grandma died, and she was kinda the matriarch of the family. But there''s still... To visit my mom and stuff like that, it seems like Tarn likes to come over here more. But London is a great town. I mean, it''s very quiet and very clean compared to American cities. So it is kinda fun to visit. - We''re so happy for Tarn. We''re so happy for Tarn and Steph. We''re so excited for this new adventure for them. And, at the same time, Tarn was a huge part of our life. I cherish those moments more than ever before, erm, because at the end... At the end, that''s all we have. I can''t, I can''t take the Dwarf Fortress code with me, I can''t take the money with me, I can''t do any of that. But, y''know, I can take with me those experiences and those memories, and the feelings of being with the people that I love, and that''s what... That''s what I wanna concentrate on. (acoustic guitar plays) - [Danny] Usually, when we document the development of video-games we do so long after launch, when the story of their development has solidified in the minds of its creators. But this is just another way in which Dwarf Fortress bucks industry norms. It''s a story that refuses to end. It''s a game these guys have been making for their entire lives, and they don''t plan on stopping. In fact, if anything, after five years of arrested development – due to them trying to get the Steam version and Adventure Mode ready – they''re more excited than ever to dive back in. - [Tarn] Yeah, well it''s a hugely, kind of, er, open expanse of possibilities now. This is it. I''ve been waiting for this for five years. And it''s been that long, right? I''ve been doing menus, and scrollbars, and graphics for a long time. Like, all of the things that we were previously going to do before we went on Steam. We had these ideas, like... Okay, we''re gonna improve sieges because they''re quite silly sometimes, we''re going to do some army stuff to tie that in with Adventure Mode, as well. We have the creation myths and magic stuff that I talked about at GDC in 2016. - [Danny] (Laughs) - Er... But we also have the villain stuff that was, kind of, a lead-in to improving, er, Adventure Mode. But we also have this, kind of, map system rewrite, and the embark scenarios for fortresses, so that your fortress can be a religious community or a military outpost and be understood as such by everyone in there. Right now they''re an eclectic mix of whatever you wanna make. You can build more temples or build more military stuff, but the people don''t really understand that that''s what''s going on, the Dwarves inside the fortress. So, just any number of things along those lines. And then you also are like, well, this is a graphical game on Steam now, and we have graphics things to do. - That''s what makes it... – at this present moment, now that Adventure Mode is out – that''s what makes this so exciting, because the promise is complete. We''ve released Adventure Mode, everything is coming together. But now... That''s nice for the crowd, especially the crowd that''s already bought the game, but we need new stuff. The promise of new stuff is really what keeps us going. I think I''m gonna get back into writing, like I said, the Dwarf Fortress needs, er, chunks of story to scramble together. So I think that''s a hobby that I used to have that I think I''m gonna get back into. - Er, the apartment I am filmed in is getting it''s last, kinda, junky junk... Not "junky junk". I''ve got some junk that needs to be junked and, er, that''s happening tomorrow. And then it''ll be about as empty as when you were there. (Laughter) ''Cos it''s... Yeah, I wasn''t a heavy investor in furniture and it turned out it never quite came together. I did get a guitar in England, that''s still probably not the last guitar, but I found a cracked classical guitar. So I could get a nice discount on a very nice guitar that was used in, like, a guitar school. But it''s all wood, there''s no laminate on it, and, erm... Yeah. It''s beautiful. It sounds beautiful, erm, and, er... But it''s a classical guitar, not a flamenco guitar, so I need to... I still need to seal the deal. - [Danny] Whenever we do one of these documentaries, I''m always hoping to ... communicate some sort of lesson or skill – something that can be applied to other games in the future, or we can use to critique games we play. But the nature of Dwarf Fortress is that, the things that make this game special are really quite unique to this particular game. A pair of brothers who dedicated their lives to a single idea. An idea so large and interesting, that it kept them creatively engaged for 20 years and beyond. A game that keeps evolving and getting better with every passing year. And a community of players who supported the vision of this game for decades and then came to the rescue of its creators and their families every time they needed it. I think the reason so many of us love Dwarf Fortress is how it echoes our own experience of life. How little things can make a massive difference given enough time. How nothing truly great is possible without strong community, and how little control we have over the fortune we have in our life – be that good or bad. But more than anything, I think it reminds us of how important stories are. Not just as a form of entertainment or a way of communicating ideas, but as a way of understanding the world around us. This complex, scary, systemic society we find ourselves in every morning we wake up. Stories help us understand the world and the people around us. They allow us to communicate with our past, to come to terms with who we are. We view our own lives through stories, with joyous beginnings and melancholic ends. But they, too, are awash in the stories of others, and much larger stories about the people who came before us and those who will follow. Stories can be about real things, they can embellish the truth. They can even have mistakes in them or they can be completely made up. But, no matter what, stories are how we perceive the world and Dwarf Fortress empowers us to flex that ever-important muscle – something not many forms of media can. Who knows what challenges face our heroes in the future? Hopefully not Necromancers or Clowns. But, no matter what happens, one thing is for sure: Stories come to an end, but life goes on. So, whether in life or in Dwarf Fortress, get out there. Tell one. (ambient folk music) - [Tarn] Yeah, but for me personally, I''m still in the middle of this, this move and, er, that''s exciting and ongoing. I''m gonna, yeah, get a house. Be living in, in England. In a house, doing Dwarf stuff. Like a... Like a Dwarfy Englishman. (ident clicks) (click)'
