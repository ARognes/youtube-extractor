transcript: Hey guys. So today you and I are going to talk about delivery speed. So let's get into it. So the question in question was, "Hi Frederick, I also believe that talent and ability to solve problems goes a long way. Going back to what you discussed, would you say that adding more members to the team with the same talent would make more people spend their time solving the same problem, but their pace would still not be as good as someone who is more productive. I'm doing a little bit of interpretation here and it's posted on an old video that I made where like the foundation of my argument when it comes to delivery and delivery speed is that it doesn't really matter if you add more people to a problem that is beyond the skill level of the people that you are adding. The code is not going to go come any faster. It's you're just going to have more code when the time is up. And so the fundamental argument I present to you when it comes to delivery speed is that there's only two factors that truly affect how fast a piece of a story because we'll talk about the definitions a little bit later but a single story will usually always comes down come down to the state of the system and the talent of the developer. These are the main factors that are going to dictate how fast that story gets shipped. Now the reason why I argue that is because usually you have a you can imagine a fullness level of any given task. It's a there's a joke I can't remember if it's about China or so forth where the way that you solve quoteunquote unemployment in China or some other it doesn't matter which country is to say just tell 400 people to milk one cow. Now you and I both know that yeah that's going to show up on a spreadsheet somewhere. Yeah. So you have 400 people now who is employed, they are employed, but you know as well as I know that you can't have 400 people milking one cow at the same time and have that be a productive use of time. It's the same thing with code. I can give you a user story and depending on circumstances and so forth, maybe one person, two people, three people, it doesn't really matter. Like there at some point you're just not going to be able to add more people to work on the task. And that is the fundamental problem. If you have three people who are at a certain level, they may not be able to ship it quicker than one person is really, really good. The reason why I know that is because I work with people at all ranges. If you take a really, really, really, really skilled senior software developer and you put them on a task also that they will be faster than an whole army of say mid-levels or juniors or something like that. I've seen it happen many many times guys where I have entire teams of people where I know that they will take a longer to finish a set of features or like a like an implement an entire implementation of a system than that one guy or girl that I know about because they are that much better at this job. It's the same thing as in you know in racing and anything. Another one that I like to say is that if you're going to win a Formula 1 race, then it doesn't really help if you come and deliver like a team of cab drivers. Yeah, you have more cab drivers, but if you want to win the race, it's the quality of the drivers that is going to determine if you if you you know, so forth and so forth. And that is something that I feel is woefully under underappreciated or like it's our entire industry is ignorant of this. Well, most people are at the very least because if we did actually understand how code gets shipped and what matters and so forth and so forth. At least the recruiters, I would hope, would learn how to spot the difference between someone who is a top performer and someone who's not. Same thing with our managers. For some unknown reason, it seems to everybody like if you are a senior software developer, then you are equal in every single other way to another senior software developer or mid-level or junior, doesn't matter, right? And for some reason they all get so very amazed because I had I had that discussion just the other day with the manager from one of the one of the chapters or one of the departments that I work with because now in my old age, I managed to get to a point where people actually listen to me when I explain to them the facts or what I perceive to be the facts of software development. and they don't just sort of take me as another person. It's just saying something. They actually listen at least sometimes. And now I could have a conversation with one of the managers and I asked this individual. I asked her because she had brought in an entire team of software developers that she said I vouch for these people. These are good people. And I said, "Okay, me and a few of the other developers feel differently." And then of course she goes on the defensive and says, "Oh, what do you mean? like they have been working on a project for a long time and stuff like that. I go yeah and what is the state of that project cuz if if your criteria for determining if they're good or bad at something is that they have been working then I'm not really sure if we we agree on the way we should evaluate people's skill level at something because you can work on for many many years. I've said so before guys. I have some people who I've worked with people who have worked for 20 years and they code at a junior level. I swear and they need help all the time. And so I ask her how how did you so how have you come to the conclusion that they are good? Uh well uh because you know and I go are you a software developer like some expert to evaluate like the you know the abilities of these people and so forth and so forth. Well no of course not. And now you have me you have a few of my other co-workers who are proven to be among like the I will watch for them and so forth. If you consider me to be someone who has a bit of a well bit of knowledge in this area and this scenario I'm the senior principal engineer of the company so it does like there is no one above me when it comes to that sort of stuff and that doesn't necessarily mean again that doesn't mean that I know what I'm talking about just in her eyes of course I am the most senior engineer that they have so for her that means that I know what oh ideally it means that I know what I'm talking about you can judge me however you want guys as I've said before there are people who are vastly more skilled than me in many many areas but for her this is of course a very heavy argument and that is why I tell some developers that sometimes even if you are quote unquote the best in a team even if you're a junior better than seniors they won't listen to you because you're not cool enough you don't have enough authority your title is not fancy enough but now I have a fancy title so now she's listening to me and so I ask why do you make this assessment because I can show you a bit of how I make the assessment and then I go and I show her the most important time at least for me when I'm working with the team if we're going to try to evaluate and it's again it's not a perfect measurement in any way. One part is that I work with the people so I know and I've seen all their code reviews and I see roughly how much they work and like how fast they are and like how often they come with questions and how often they get blocked and stuff like that. But I need to find a nice and simple way to illustrate to her how much of a difference it is. So I pick one of the top performers and I say, "All right, let's go to the pull request tab and let's click completed and let's just see who creates who has merged the most amount of pull requests." Now you and I both know that that is not necessarily the best metric in the world to determine how fast someone is, but it is at least something that can visualize for an person who doesn't really understand the difference in terms of how good people are and how much of a difference that makes. So for the top performer in the team, I think he had a total like as a single individual, he had closed more than three times as many stories than five of her people in the same time period. That's how big the difference is. And that is why football's players who are extra extra good makes millions and millions and millions. Why we regular people we don't. That is why the top artists are making billions and millions and like whatever and so forth and so forth because when it comes to talent it usually correlates into higher yields or higher productivity or whatever whatever the people are winning even with the Olympics and so forth. They are really really good and can produce at a level or perform at a level that is higher than the average individual and adding more people does not yield greater results. That is why I argue that we as software developers or I hope the entire industry starts understanding this. I read the other day that for some I can't remember some some company paid one of the engineers at OpenAI $80 million to switch. I'm not sure if that's true, but that is a now we're talking now we're talking about exactly the thing I'm I'm saying. you understood that if you want to be really great at AI, you're gonna need to find someone who's really, really great at AI and you should pay them for being that great. Because if you just want a bunch of average people that don't give you the sorts of results that you're looking for, well then, yeah, sure. Just reach out to any random senior because if you don't know any better, well, then everybody's a senior, right? Everybody knows something about AI are clearly equal. It's exactly the same thing as saying that I can get anybody who knows how who has a driver's license and win Formula 1. It's as dumb as that if you ask me. So, what I want you to take away from this is that I argue that when it comes to delivery speed, more is not faster. It just means that you're going to get more done by the end of it. And so I argue that the best and most important thing that any good tech lead or any company or so forth needs to understand is that when it comes to questions of talent or things where we have tasks where more people will not make the code come faster, it is about the right person, the right people. That is what I do when I hire people. I understand I try to understand the system I'm making and I try to understand roughly the complexity level of the system and what they're going to need to know and so forth and so forth and I try to measure roughly the sort of individuals that I have and match them towards the right project and that is the thing that you should be doing. sort call it resource optimization. The stuff that is really really tricky, you need people who are really really good to solve those sort of issues because even if you have a 100 average people, it may not be solvable. It might not be like, you know, it's not going to help you to have more of those people because it might be too difficult for them. It's like take a army of junior software developers and give them a task that is, you know, way beyond their like their understanding and yeah, you're going to have to see reap what you sow so to speak. So the trick is try to figure out who is a good fit for any given task that you give them. Ideally of course everybody should be equal and everybody can solve everything but that is not reality. Try to raise the people up who are on an average level and so forth and help them to become really really great but don't pretend like everybody's equal. Try to put the right people in the right situation and then you will have the best results. Have a great day.
