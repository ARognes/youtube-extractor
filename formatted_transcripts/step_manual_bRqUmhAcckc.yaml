transcript: '{"content":"\n[0.0s] If you are a relatively healthy human\n[2.32s] being and you have something of a\n[4.2s] traumatic experience, our mind uses\n[6.88s] certain defense mechanisms to protect us\n[9.28s] from it. So, we suppress it. We distract\n[11.92s] ourselves. We adopt a narcissistic\n[14.04s] defense. We make justifications. We use\n[16.08s] intellectualization. We use projection.\n[18.28s] We take the pain in here and I project\n[20.4s] it out onto you. I''m angry at my boss,\n[22.92s] but I can''t afford to be angry at my\n[24.8s] boss. So, instead what I''m going to do\n[26.8s] is I''m going to displace that anger onto\n[29.6s] my husband or my wife. When there is\n[31.72s] emotion that is too much for me to\n[34.2s] handle, my mind employs defense\n[36.68s] mechanisms to sort of like suppress it.\n[39.32s] And then what happens is it ends up\n[40.84s] leaking out. Some negative thing comes\n[43.72s] into this, but then this bleeds over\n[45.68s] into this box a little bit, bleeds over\n[47.28s] into this box a little bit, bleeds over\n[49.08s] here, and then I rage at people in\n[51.92s] online games. And then I get upset with\n[54.16s] my family. So, the system is intact and\n[56.6s] all these parts are connected. But what\n[58.48s] happens in dissociative identity\n[60.6s] disorder? We get some kind of insult\n[62.64s] that happens so early that all these\n[64.839s] parts aren''t even connected yet. And\n[66.48s] then what happens is the organism walls\n[68.92s] this off and compartmentalizes\n[71.96s] instead of employing all of these other\n[73.56s] defense mechanisms. I don''t have an\n[75.16s] identity yet, so there is one kind of\n[78.0s] thing that just stays over here. And\n[79.92s] this will eventually form an alter."}'
