d by the fact that model been able to work just out of the box without any pre-training and grab the things from my table like rubber duck or whatever, and all the other VLA models I tested earlier requires to collect data set, to spend time on training it, and so on. But MoMA just did it out of the box. So, if you don't want to spend time on collecting data set and training your model, then MoMA is great choice for you. Just start out of the box and see how it works. Also, if you use case requires a big generalization. So, when you're working with the not only apples and oranges, but with whole bunch of different fruits, and you just can't collect data set showing robot how to grab every or the fruit, the [music] MoMA again with its generalization ability is great choice for you. But there are also downsides. MoMA is a very big model. It runs longer than many classical VLA models. And what's the worst thing about that model? You need to wait for more than 1 minute every time you want to preload it before the operation. And this, in my opinion, makes that model completely unusable for any production [music] use case. Just imagine the robot in the factory approaching the table with parts, and before grabbing any part, it need to wait for more than 1 minute for model to load. And it's only my opinion, feel free to disagree with this. But for many classical use case, when you have just few objects to operate with, and you don't need big generalization, the much smaller models as X-VLA or even simple ACT will be completely enough for you. By the way, if you want to learn more about the classical VLA models, here I prepared a video where I test and compare few of them. ACT, small VLA, and Pi 0.5. I test their performance, time of inference, and required GPU memory. And that's all for my side. See you next time.
