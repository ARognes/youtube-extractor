transcript: Hey guys. So today you and I are going to talk about dumb code. So let's get into it. So the questioning question was, "Hi Frederick, can you give some examples of dumb code that you wrote when you were a beginner?" Yes, I can. Right. There's a bit of a smaross board of things to pick from here. So let's start with the first one that comes to mind. Well, one of the dumbest things I've ever done was I wrote I created a website or rather I wanted to create a website and I found this amazing template on the internet some guy had made that looked absolutely amazing. And then I started trying to style my compon you know style everything and stuff like this was for a class of course we we were doing frontend store work in that class and after many many many nights of not even being able to figure out how to get a blue gradient background to work properly I finally just gave up on trying to make the whole thing. So I thought to myself, maybe I can just use the picture, the actual like a screenshot of the website as a background and then position using absolute position or the buttons like invisible buttons on the picture so that when you hover and click you actually do see the interactions and you go and navigate and stuff like that. And that's exactly what I did. I created an entire website that was just a back just a background image of the thing I wanted to build because I wasn't good enough to build it. And then I hid buttons using styling on the places where you could click on that picture. So it looked like you were clicking the actual thing. That broke the second someone had a different screen width than mine, of course. So that was pretty dumb. Another thing I did was uh Oh, yeah. I was I created a website with a login where there was a dialogue stating that if you couldn't you know that you you needed to log in in order to like be able to use my application again for school and the way I did it was that I created this dialogue window that was that would pop up before you went into the actual application and then I styled it and I made it very nice and so forth. I saw it with you know a password and a username and so forth and then I used CSS or like display none or invis invisible basically as to hide it and then if you entered the like when you try to log in it would show it and then require a password and so forth and so forth. And of course, I hardcoded that in in the JavaScript that I had used in order to create this thing. And one of my classmates um like pretty much immediately broke the thing and just got in anyway because I couldn't figure out how is it that you can just ignore that like and he just because he literally just removed the node in the HTML that showed the overlay that would was blocking him and then he just clicked on the you know going to the application and then that worked and I couldn't understand like my first question was to him how did you do that was that like a SQL injection attack or something like that and him being someone who had been working for a while, he sort of choked on his own laughter. No, no, Frederick, it's not a SQL injection attack. That was pretty dumb. What else have I done that is pretty dumb? There are some other things. So yeah, I created a um a ridiculously overengineered implementation of a basic crowd application for again for school where I had this idea that if for some reason let's just pretend now that the database connection goes away in my little crowd application. What will I do? How do I make sure that the system continues working? And I thought well maybe I could start rew writing to disk and then sync that up after the like the database connection comes back. Let like let's just forget gloss over the fact that if you don't have access to the database then well it's not necessarily the case that you can have access like the file system but I was clever. I promise you I was clever because after me implementing a solution where it checks if the database is there and then it writes to disk and then syncs it back up after like if the database comes back. I had the same idea. But what if the database is gone and the file system is also gone? What do I do then? Well, of course, the most obvious choice here is to write to the memory to the RAM to the RAM. basically just keep the whole thing in memory. And for some reason, it never dawned on me if I start doing that then I go from not having an application that can connect to the database for whatever reason to basically crashing the whole server instead because that's what's going to happen if I overflow the memory or like it's going to basically like completely collapse anyway. And I couldn't really agree with my ma my not my manager but my teacher who felt that Frederick maybe you did overengineer this a little bit because I felt that this was genius. It was per like it was I mean it was more code and better in my opinion than that silly obvious thing where you would just stop the application or you would just throw an error and show that there was an issue or things like that. What else have I done that is pretty stupid? Well, I've created quite a lot of different applications that weren't all that good. If we talk about, you know, these more serious things where I've implemented applications which had I'm I mean I can't even I don't know what to say other than I created an application that basically had I think a total of three or four domain entities something like that or records in the database. I did that at the time using microservices with a this was before Kubernetes so we and docker compos this would call it would call docker swarm when I started and with that I created a full deployment with all microservices and I had as I said like three or four endpoints like a total of maybe 15 endpoints or like entities uh and 15 endpoints roughly for doing basic crowd operations. I think it took me more time to learn how to wire all that up using Docker Storm, learning all the tools around it. And so I mean, I'm happy that I did it now because now I can use that dumbness or that knowledge in other projects and tell other people, "Yeah, don't do that." And of course, I learned some stuff along the way. My stakeholders at the time weren't as happy because basically I was doing this for a startup or like my own startup with some guys, right? And so everything took a million years of course and by the time I was older, wiser, and bolder because it started early. I understood that if I just did that in a monolith with the basic Firebase application type of thing, I could do the same thing that I took months doing, I could do that in a week. That was pretty stupid, too. And I will end on a positive note and say the dumbest thing I've ever ever made that was intentionally dumb was that I was experimenting in school with creating my first virus because I I mean when I was growing up of course I wanted to be a hacker. I mean all nerds who played Magic Mag Magic the Gathering and all that good stuff like myself my my blood we were of course very enticed by the idea of being a hacker and being able to you know get into systems and create viruses and stuff like that. So my first virus was very simple. It was a little job application which if you clicked it it would take over virtually your mouse so you couldn't click anything because it was just randomly clicking for you. So basically that and then it would open your default browser and log you into lemon party. That was basically it and you had no like apart from shutting off your computer, no hope of getting away from that until the clicking was done which was lasting about 16 seconds or something like that. I only managed to infect one person and that was my co-work not my coworker but my my classmate and that was about it. I had a really lovely time making it and it was fun for about one minute and then after that yeah not so fun anymore but it makes for a decent story I think. So what I want you to take away from this is that I have built a lot of dumb stuff. And if you're doing it right, so will you. I can basically promise you that. I have a saying where I say that the cost that software companies or IT companies pay for inexperienced software developers or people that don't really know what they're doing is measured not just in money but also in legacy code. And that is why as a general rule, you want to have experienced people working with these pe with your more less experienced software developers so that they can mitigate some of the risks that you that you have with people who don't really know what they're doing. But at the same time, we have to acknowledge that every craftsman, doesn't matter which craft it is, has to up to learn how to do better. The thing that I try to preach on my little channel here is that be conscious of what you know and what you don't know and try to be a little bit tactical with the risks that you are taking because the best situation is if you can up and then recover from the up. In other words, it's more important for you as a software developer to know how to undo damage or as I like to say write disposable code. And if you can learn just that part, then you shouldn't be so afraid of making dumb stuff or making mistakes or so forth and so forth because the cost of making a mistake should ideally be so low that it's fine to make a mistake. That is the magic recipe I argue for making sure that you can take risks, push yourself to like try out new things and learn from them and then improve of course without causing damage to you know your projects or your stakeholders you know revenue streams and all that sort of stuff and maybe save yourself a few crashing computers or deleted important files or so forth and so forth. So that is the thing I want you to take away from this. Everybody makes a mistake. Myself included. I still make them and I still make dumb stuff even though I think it's clever. Less so I'd like to think than I used to, but I have done for years until you learn I learned how to do it slightly better. So tip number one, don't be afraid to make dumb stuff or try things out or make take risk and experiment and so forth. Just try to be mindful of that you have some safety guards in place so that if it doesn't turn out so well, you have a way to recover or at the very least not have to pay such a high cost or taking a risk. Have a great day.
