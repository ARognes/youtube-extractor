transcript: 'Hey, it''s Mark. Now, I don''t usually do a lot of  programming related content on this channel, despite the fact that programming is of course  An essential part of any game maker''s toolkit. But that''s just because I am far  from an expert on this subject. I mean, the code bases for my two video games, Mind Over Magnet and Word Play,  are basically held together with sticks and the glue. But there is one aspect of Word Play''s  programming that I''m actually really proud of, and that''s the way I  implemented the game''s modifiers. So - for context. Word Play is a vocabulary roguelike  where you spell words to score points. And then you can unlock perks that let  you bend the rules and score even bigger. These perks come in three flavours. Gifts typically add more letters to your bag. Upgrades let you change and improve your tiles. And modifiers are the passive perks that  give big benefits under the right conditions. Like... this one that multiplies your score  by 1.5 if the first letter is a vowel. So they''re basically the relics from Slay  the Spire or the Jokers from Balatro. Now when I first started making the game I had  no idea how I would implement these modifiers. There wasn''t an obvious and easy way to do it. But, ultimately, I came up with a  system that I''m really happy with. One that fits the requirements for the system,  can be easily scaled to fit all 120 modifiers in the game, and makes it effortless to  test, change, and debug the lot of them. So I''m hoping this might prove interesting  or helpful or inspirational to, let''s say, a beginner or intermediate level programmer. to see what it takes to implement  a somewhat complex system into a real life video game that''s  currently available on Steam. If that sounds good, then let''s jump in. A quick note that I''ll be talking  about it in the context of making the game in Unity, because that''s what I used. But the basic idea should apply  to pretty much any engine. So the modifiers in Word Play touch  so many aspects of the game, with modifiers that fiddle with refreshes and bonus rounds and  special tiles and the basic rules of spelling. And I''ll come to that - but for now, let''s make things simple by looking at the  ones that impact the way your word is scored. Like - that modifier I showed earlier: "If the first letter is a Vowel,  multiply the Final Score by 1.5". How would we implement that? Well, first I''ll write some code to tally up the word''s initial score by adding up the  points on all of the submitted tiles. And then... well, in Word Play all of  the modifiers are separate GameObjects. And I have a list of which  ones the player currently owns. So we could check if the players  owns the modifier "VowelFirst". And, also, if the first letter is a vowel. If both are true... multiply  the word''s score by 1.5. And that would work. That would work fine. In fact, that''s exactly how I did it for  the scrappy game jam prototype of Word Play. And it did the job, But when it came time to turn this into a real  video game, I knew I needed a better system. Because... well, a couple reasons. The big one: every time we add a modifier,  this script gets longer and longer. A massive spaghetti mess of if statements. And that makes it harder to find things,  change things, and fix bugs and problems. Like, what if I actually want  it to multiply the score if the LAST letter is a vowel? Now I''ve got to  hunt through all this code to find it. And what if I want to change something about  how modifiers work in general - I might end up having to change the same code in  100 different if statements. Yikes. And another problem is that the order  these modifiers trigger is defined by the order they show up in the code, not  the order they are in your modifier list. Now this didn''t actually  end up being a big problem for Word Play - you almost never need to  worry about the order of your modifiers. But it''s a huge deal in Balatro, and  so - with that game serving as my initial inspiration - it was a requirement  when I was first coding up this system. Okay. So my plan was to give each  modifier its own super short script, with a function for calculating word score. I could pass in the word and its score.  Then check if the condition is met. If so, multiply the word score by the desired  amount and pass it back to the main score script. Now the main score script just needs  a list of the player''s modifiers, and loop through the associated scripts one  by one - testing that onWordScore function. The only problem is... well, you can''t  just have an arbitrary list of scripts, and try and run a function on all of them. I guess think of it like this. I ask you to bring me a list of ten  items, and then I say, "eat them". You''d be like, "wait, what?  One of these is a motorbike". And I''d be like, "eat them". It wouldn''t work, right? The  list needs to be more specific. They all need to be edible for starters. They all need to be of the same  type or of the same Class. Ah! You see, every script you write in Unity  is based on the same class - MonoBehavior. This lets you inherit and use all sorts  of handy functions like OnCollisionExit, OnMouseOver, and OnDestroy. But you can actually write your OWN class - and then make scripts that inherit  all of THAT class''s functions. Ehhh... it''s probably easier if I just show you. So it''s pretty easy to do. We can just make a new class called say  ModifierClass and all we need to do is set it to be an abstract class and now we  can build other classes on top of this. And then in this base class, we can make,  say, a public float called onWordScored, which brings in the word  and the current word score. And by default, we''ll just return minus one. Because in Word Play, you can never  have minus numbers in your score. So I can use minus one as a shorthand to  say "Nothing happened, move on, do nothing". We just need to turn it into a  virtual float so it can be overridden. Then we can make a new class called say mVowelFirst and set it to inherit from the ModifierClass and now we can use the onWordScored, and it sets it into a public override. So by default, it''s just returning what  is in the base version of this class, which would be minus one. But for this one we want to say if the word  substring zero is equal to A or E or I or O or U, aka a vowel, then return the  word score multiplied by 1.5. Otherwise, return minus one. And so it basically takes in the word,  checks if the first letter is a vowel. If so, multiply the word score by 1.5 and  pass it back to the score check script. Otherwise, return minus 1, which says there  was no vowel. Nothing to see here. Move on. And now I actually CAN make a list of scripts -  specifically, a list of ModifierClass scripts, because now Unity knows that every script  will definitely have an OnWordScored function. Either the base function that just returns -1,  or an override that may return a higher number. And so back to our wordScore script, we now  can loop through that list of owned modifiers, run the OnWordScored function on all of them... and if they don''t return -1,  we can update the word score. And maybe, like, I dunno, make the modifier  do a little ping animation and sound effect. And now I can just make a whole bunch of these  tiny scripts, with OnWordScored overrides... And the score calculator will loop through them, in the correct order, until  the calculation is finished. And ultimately that''s that! We''ve gone from  the script having 100 if statements in a big unwieldy chunk, to having  the script just do one elegant loop. And all of the score functionality  lives in separate scripts - which makes it easy to find them, change  them, and, of course, add new ones. This system also let me make the modifiers  work in other areas of the game. For instance, there are modifiers that  do things when you use an upgrade. So I add a bool to the base class, called  OnUpgradeUsed, that returns false by default. Then I can make a new script  with an override that, say, increases its bonus points  when you use an upgrade. And then finally, in the "use upgrade" code, I just loop through the owned modifiers  - and trigger the function OnUpgradeUsed on each of them. And the nice thing is - this is completely  compatible with the other modifiers. Like, the "is the first letter a vowel" modifier  doesn''t have an override for OnUpgradeUsed, so it will simply use the code on the base  class - which is to do nothing and return false. And so with that, I can have these  triggers all throughout Word Play. Like, when you sell a modifier. Score each  letter. When you lose a life. Get a game over. Open the perk screen. Re-roll  the perks. Reach a new round. Refresh the tiles. Add a tile to the letter  bag. And so on and so on and so on. Each one is a tiny script, simply containing  a few lines of code needed for the modifier''s functionality - plus details like the  modifier''s icon, description, rarity, and special numbers... so it''s easy to  change them from the Unity inspector. I also used this same system for the upgrades, which are the yellow perks that  change a tile when you drag it on. Each upgrade inherits from a base class  with an OnTileDropped function - and then each upgrade''s script has a unique override  for that function, depending on whether it destroys the tile, turns it into an emerald  tile, increases the tiles''s score, and so on. So, this is the power of inheritance, a  really useful way of working with classes. And you can imagine all kinds of  ways to use this in your game. Perhaps a base class for enemies that  all share the same basic movement, health system, and death functions -  but with unique code for each of their attack patterns. Or a base class for guns with the  same code for aiming and reloading, but unique functions for their special abilities. The possibilities are endless. But this system ended up providing the perfect  architecture for my game - letting me add, remove, debug, balance, and change  the more than 150 perks in Word Play. Thank you so much for watching. I hope you found it interesting. If you like the look of the game, Word Play is currently available on Steam and it''s  coming very soon to iPhone and iPad. So look out for an announcement on that. Thanks very much and see you around. Bye!'
