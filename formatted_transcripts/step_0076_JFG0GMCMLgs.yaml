transcript: Hey, it's Mark with a super quick video  just to let you know that my game Word Play is now available on iPhone  and iPad over on the App Store. So it's available as a free trial, but if you like what you play, you  can upgrade to the full version with a single $5 in-app purchase. That's it. No ads, no other IAPs. Just a single "Try Before you Buy" model. So if you don't know what Word Play  is, it's my vocabulary roguelike where you try to spell the best word from  these tiles, kind of like Scrabble or Boggle. But when you score enough points,  you'll get to the end of the round, at which point you can pick  one of these three perks which have all sorts of crazy, game-changing,  rule-bending modifiers to the gameplay, like the ability to add more tiles to the board  or upgrade your tiles to golden or emerald tiles. You can change how the scoring works so you get more points if your word starts  with a vowel, stuff like that. I think it's super fun, it's really addictive. I still play it quite often when  I'm like on the train and whatnot, and so it's so much better to  have it available now on mobile. Now I'm not completely ruling out  an Android version of the game. It's not too hard to do with Unity. I just need to get an Android  device to be able to test it. Let me know if you'd like one in the  comments and I'll see what I can do. Can you see the baby sick on this t-shirt? I hope not. Anyway, that's it. Don't want to take up loads of your time. If you like the look of the game, there's a link to the App Store in  the description and a pinned comment. So, please go check it out. Like I say, it's free to try, so why not? Word Play is also still available on Steam, and it works really nicely on the Steam  Deck if you prefer using one of those. That's all I have to say, so thanks  for watching and see you soon. Bye!
