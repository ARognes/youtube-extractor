transcript: (keyboard tapping) (upbeat jazzy music) - I was lucky enough to go up playing PC games in the 90s, so I'm pretty familiar with the hype surrounding Black & White. This was the first game from Lionhead Studios, the follow up studio to Bullfrog, who made some of my favorite games of the 90s. But while many of these classics are still available to buy and play, the same can't be said for Black & White. When we started producing this episode, we'd figured we'd do an episode about a beloved god game, and I'd spend most of my time trying to hunt down Peter Molyneux. As it turns out, Peter was pretty happy to talk about the game, but we had massive trouble trying to figure out how to play it. Black & White isn't available to purchase online anywhere, and it never has been. Stuck in a perpetual to of war over who has the rights to release it. And the worry is that while old sods like me will always remember Black & White, there are generations of gamers who have never played it themselves or even seen it on YouTube or Twitch. When these people talk about the biggest games of the early two 2000s, Black & White isn't in the conversation. So if we're going to tell the story of Black & White, we'll need to not only hunt down some of the people who worked on it, but also figure out why it is that this game is still unavailable to play two decades later. On this episode of "No Clip Greatest Hits," how exactly did Black & White come to be? Why is it we can't play it anywhere now? And is there anything we can do to bring it back? (upbeat synth-pop music) (ambient music) - [Peter] I can remember we started the game and we started the company in my house, and I can remember us sitting around a table, and we had three designs, actually. I say design so that there were like three sheets of paper. One of them was about being stranded on the island. One of them was about breaking out from a prison and the other one was Black & White. And then we all voted on which design we should do, and the vote came out to Black & White. - [Danny] That's a very democratic way of running a studio. - Yeah, it never. It was a stupid idea. (Danny laughing) It's great, it's a crazy idea. - Peter, myself, Tim Rants, and a guy called Steve Jackson, who's one of the founders of Games Workshop, we were the four founders. The studio was originally gonna be called Red Eye, and I think for a while, it was gonna be called Starfish as well, but then somebody said, you know, what about Chocolate Starfish? You don't wanna be called that. So, it ended up as Lionhead, which a lot of people know the story. That was my hamster, Lionhead. - [Peter] Wouldn't it be cool to have a game where you taught the difference in good and evil, and that you had this massive world, and you know, it was kind of like, you know, it was like someone, like a school boy had written it down on a back of a piece of paper doing school break about their ideal game. When we first thought the game idea, we wanted a 3D landscape, which we could zoom out into the clouds and back down into incredible detail. Secondly, we had, you know, AI that had never been done before. Thirdly, we had no interface going, no going interface. And you put all those things together when you think, well, when all these things were concepted or thought out, we didn't have anyone to do them. It was just insane, it was just madness. - [Danny] The founders had a game idea, but no team to make it, thus began a six month process to build out Lionhead. Many of their colleagues from Bullfrog made the jump, usually quitting and then applying for jobs at Lionhead as to not trigger any poaching clauses with EA, who now owned Bullfrog. Though EA also did end up publishing Black & White, so who knows how much they really cared? Which is all just as well, because this collection of individuals were critical to the success of Black & White. - Yeah, Peter can attract, you know, some of the very best talent there is, and a lot of us had kind of worked together at Bullfrog. We obviously weren't allowed to poach anyone, but we did get approached by, you know, Mark Healey and Alex Evans and, you know, sort of that team just slowly grew and it was just like wow. - We struggled to find a good 3D coder. Then this French chap came along for an interview called Jean Claude Cottier. It was great. It was a fantastic interview done there. I mean, you know, I'd ask him, you know, could we have a landscape? Could we be couple in trees? Could each of the trees be had Apollo gun? Could we have millions of villager, and Jean Floyd was going, yes, yes, yes. It was only until after we started, after he started, we realized he actually only really had one word of English, and that was yes, but he was utterly brilliant. I mean, really know. And then we had to find another coder that would specialize in doing all the creature stuff. You know, the creature had to grow and the creature had to morph and they, you know, the creature had to change size, and we needed someone specialist to do that. One day this bloke called Scawen Roberts walked in the room and he dropped, he was a motorcycle courier, and he dropped off our package for us and he was asking, you know, oh, what do you do here? And we said we were making this game and explained what the game was. Yah, he said, you know, I do some coding and I'd love to show you what I do. You know, no one really took him seriously because, you know, you get that quite a lot. And then as he was turning, walking out the door, he had this leather jacket on and the name of the company he worked for was on the back of his jacket, and he worked for Black & White Couriers. - [Danny] Oh my God. - And we said, right, well, fate has given us Scawen Roberts. That's it, let's employ him. And we employed them and he was absolutely amazing, and then we had incredibly lucky with someone called Eric Bailey, who did all the animations himself. - So many, the creatures, all the different creatures had all their own, the characters, it's all done by mostly one guy, Eric. Insane, insane amounts of work. (upbeat orchestral music) - [Danny] The team was hired, but the scope of the project was huge. The first major obstacle was the artificial intelligence. Lionhead wanted the games creature to react to the players' parenting in a realistic manner. But this was the era of 3D desktop pets, so to impress the PC gaming market, it couldn't all be smoke and mirrors, and they'd have to build this technology themselves. (creature chittering) - Yeah, it was about three years. I mean, crikey, what we did in that time was astounding, really. Because one of the things you misremember back in those days, there was no Unity or Unreal Engine. Everything that you did, you had to do yourself. There was no middleware really to speak of. - [Mark] We have a guy called Richard Evans doing the creature AI, and, you know, he's now working at Deep Mind. He's a smart guy, he was a smart guy way back then. - [Peter] He was someone, I don't think he'd done much in the games industry, but he was a Cambridge double first graduate. What you gotta realize is back in, you know, 1999, you know, AI as a science was in decline, really. What Richard did, which was so incredible, firstly, he applied real AI to the creature. Its mind was driven by desires. Either the creature had the desire to eat something, and then those desired were fulfilled by the player where, previously, in games, I think a lot of games called AI kind of path finding or route finding or navigation, but this was real. This was a real learning system, and he invented all that stuff and coded it himself. - [Mark] The kind of things he was doing, which you possibly wouldn't realize, but the kind of AI you had with the creature, which, you know, we kind of demoed and we kind of talked about. But if you had the creature picking up one of your villagers and eating them, you could scold them and tell them not to, and then you were able to kind of go down to like, don't eat female villages. That was amazing stuff. (food crunching) - Yeah. (creature farting) (ground thumping) - [Danny] Another vision Peter had for the game was to remove as much of the interface elements as possible. Spreadsheets are all well and good when you're managing a theme park, but to make the player feel like a powerful all-seeing god, they didn't want players digging through menus for data points. A real God can kill or create with the slightest move of hand, and so too would be in Black & White. - Yeah, it's a huge design challenge, and also one which hurt us and caused us unbelievable angst. It was just me I think saying, look, you know, aren't we bored with playing games where, essentially, the window into the world gets smaller and smaller because the bits around the screen is so need to be so big. And what that does is distract from the beauty of the game that you're making. That was, you know, an insanely ambitious thing to... It's very simple for me to say, you know. I can say it, you know, to 30 seconds, but the consequences of that were extremely tough because, you know, all the time, you know, how are we gonna show the creature's health? How are we going to... How are we gonna show, you know, what's going on in the world? And the answer was, well, we've gotta show it on the creature, well, the creature's health is, which just can't be a bar. He's got to look tired, and that caused an enormous amount of work. - [Danny] Black & White is an odd duck parse realtime strategy, part God game, part physics puzzle. And while each level had a broad goal that you had to achieve through converting an influencing villagers, much of your time was spent in scenarios, specific missions where you would fulfill the desires of your worshipers. - [Mark] So once you had all the tech, then there was kind of building the levels in the world and it's not a big team, so conversations happen all over the place. And to be honest, all those scripts and scenes were done, and then redone and then redone and we'd took play and play and then changed things and threw things away. So by the end of it, although we're new, who knows who made them? ♪ Oh we got this notion ♪ ♪ That we'd quiet like to sail the ocean ♪ ♪ So we're building a big boat to leave here for good ♪ ♪ We're not keen on sinking ♪ ♪ So we're all sitting here thinking ♪ ♪ 'Cause we built it too big and we've run out of wood ♪ ♪ Eidle eidle eee ♪ - [Mark] The guys sat, you know, building the boat, they're really annoying guys building the boat, and then, oh, we need some wood. Oh, oh we need some bread, oh bread's rubbish. Or we need some meat as well. ♪ Oh, we're not complaining ♪ ♪ But there's still one more thing remaining ♪ ♪ 'Cause bread is quite boring if that's all you eat ♪ ♪ We need some flavor so do all a little flavor ♪ ♪ 'Cause we ain't going nowhere 'til we get some meat ♪ ♪ Eidle eidle eee ♪ But just very annoying, and then... But Russ, Russel Short, he wrote that song and he said, oh Mark, can you come in say I've got... Let's sing this. So we both sang that song and he just wrote that really quickly and then sort of these annoying little characters around the campfire just wanting more and more. But if you do it, of course, you get to the final level and they've established a little colony if you. (characters cheering) - If there's one thing about Peter Molyneux that people remember, it's that he's pretty good at hyping up his games. In fact, he may be too good. Later in his career, Peter's loose-lipped enthusiasm would give him a negative reputation, but in the late 90s, journalists and gamers, particularly those in the UK, fawned over every word he said, expectations for Lionhead's first game would already be pretty high, but in trying to stoke interest around this do or die project, Peter and the team inadvertently put themselves under a lot more pressure. - We made, I think, a really bad mistake and that was we decided to rent our own little room at E3. Not for any commercial reason, I think, if I'm honest, which you can be after 20 years, I guess, if I'm honest, we just wanted to go to LA and, you know, go to E3 'cause we were all fanatic gamers, and we had done this little tiny demo. I think it was about a 45 second demo and there was about three or four screenshots and the demo was, you know, it wasn't a creature, it was a giant. - Peter is amazing at doing demos and most of his demonstration, demo E3, was on a piece of paper, just kind of scooching it out on these giant creatures, and- - [Peter] We started showing people and because of, you know, who I was back then, I think, you know, journalists were just curious. But after the first day, the cues outside our tiny little white room went all the way around people waiting in to come in and seeing the demo. That was a disaster because the hall, everyone's attention then was on us. The game wasn't really formed at that point, and really the hardest thing was taking all these interesting bits of technology that we were working on and wrapping them round into a game that made sense, and that was alluring, while the whole world was literally on our back, waiting for us to finish the game. I mean, to the point where, you know, I was coming back through customs and one of the customs officers pulled me aside and searched my luggage and said, oh, by the way, when's Black & White gonna be released? I mean, you know, it was unbelievable, unbelievable thing. And, you know, that pressure, when we didn't have an actual game that fitted together in any way was unbelievable. (tense music) (suspenseful music) - [Danny] This is the other story of Black & White, an incredibly long period of crunch with so much riding on Lionhead's first game, so much expectation from players and a team of very smart people attempting to innovate in several different directions, the development on Black & White quickly became too much. The game was delayed several times, but the team rarely got a break. - There was a number of points where we thought we were nearly finished. In fact, the Christmas before our studio Christmas dinner, we were supposed to be going alpha on that day, or meet one of the key milestones, and our Christmas party was already set up. We were about to all go off to it and we had a problem, and so we had to get the caterers say, can you bring all that food to the office and we'll eat it here? And so that was a really sad Christmas meal for us all, but we just eating our desk, still trying to work out what the problem was. - I think we did kinda... I mean, what what ended up happening with the Black & White team, and it was the most amazing team I've ever worked with. What ended up happening is that we ended up working, I think we worked every day for a minimum of 16 hours a day for nine months. - [Mark] I had a son and a daughter at that time. I still do, but I've got another daughter, but at that time they were really young, so I remember I often finished work, go home, put 'em to bed, so I could see them and then come back to the office and work. - I mean, it seems inconceivable in today's world that we did that, but, you know, we did, and, you know, the amount of work we had to do because there was so much pressure from everybody, every direction was incredible. (upbeat music) - [Danny] After years of grueling development, Black & White was released to critical and commercial success, and the studio immediately expanded to better suit the needs of their projects. Lionhead now had two teams, one working on the oft forgotten business sim, The Movies, and the other on Black & White 2. Black & White 2 was a favorite among fans, even if it leans slightly more conventional with a focus on real time strategy. Black & White was now a powerful IP, but its unique design made it a challenge to adapt. A PSP and DS version of the game that focused on creature training was canceled, and Peter said there was even maybe a PlayStation version planned at some point, but it didn't get very far. We also got wind of a possible Black & White 3 that had been pitched by Frontier Developments under the name Project Calypso, but that seemingly didn't get very far either. None of these spinoffs are playable, but tragically the same is also true of the two main games. Black & White has never been available for purchase on digital stores. Meaning that unless you have a boxed copy of the game and a computer running an old version of Windows, there was no way of playing the game without jumping through a bunch of technical hoops. Thankfully, a passionate group of fans have been patching the game to work on modern operating systems, even allowing players to enjoy the game in 16x9 at higher resolutions. But why is this the case? Peter told me that the right slide between EA, who originally published the game and Microsoft, who bought Lionhead, mostly for the Fable franchise, back in 2006. So why after all these years has neither of them put it out? EA recently released the command and conquer games in a remastered collection. We did a documentary on that by the way. So why not Black & White? To find out for sure, I reached out to the folks at GOG. Said their project's DRM-free storefront, which is a team of lawyers and business people who attempt to unearth abandoned games. Oh, we did a documentary on that one too. Yeah, back in 2018. Yeah, GOG documentary, check it out. Yeah, we've made a lot. If anyone knew why these games were stuck in limbo, it would be them. So what's the deal with Black & White then? Who has it? We've heard it could be easily to be Microsoft 'cause of the, you know, Lionhead stuff, could be EA 'cause of the publishing stuff. - Yeah. - Who do you think owns the rights? - I think this in case of Black & White, it is pretty easy because we also got a chance to reach out to Peter, and he was kind enough to give us his version of events, and also all of the leads that that we managed to come up with, it points that the distribution rights are still with EA, and IP right, and game code rights, they are with Microsoft. And this is pretty... Well, this is both simple and extremely tricky because you can imagine it takes two to tango. - Yeah, so like justifying the amount of legal shenanigans some of these companies have to go through is probably part of it as well, right? - It is I would say that this is really the most challenging part and it really boils down to the opportunity cost for whoever we are talking to about that, right? If the money is right, the chances grow that they will look into it, but some of the games that we are seriously dreaming to bring back, we know that they won't be the, you know, the best, the highest revenue generators. You know, our business partners, as painful as it is, they're looking at it the same way. Is it gonna bring me money or is it just gonna make me spend a lot of time and occupy my legal team with looking into it, while at the same time I could be doing something more profitable for us? You know, from my perspective and from my personal experience working at GOG, I think it would be easier for Microsoft to negotiate some sort of publishing deal with EA and basically get back the rights to publish the game, because then, you know, they have the code, they have the right to the IP. I think that would be like the natural order or events. But you know, my guess is as good as mine here, frankly speaking. - Yeah, and it's probably hard for you to talk about these when you're trying to also negotiate these exact deals. - I'm really trying hard because, obviously, I would love to tell you everything that we did so far, but you know, there is some confidentiality here that I need to abide and I can't tell you. All that I can tell is that we are really trying our best and we are talking to both parties and that's all that I can tell you. (ambient music) - If you'll allow me to read between the lines here a little bit, it seems like this problem isn't too complicated. EA owns the publishing rights and while Black & White has a small and passionate community, it's perhaps not big enough for EA to prioritize, and you could argue that with the game of unavailable to play in any form right now, that audience is getting smaller every day. But where there's a will, there's a way, and if Microsoft wanted to bring back Black & White, they could probably find that will, there's just one problem. Right now Microsoft is involved in perhaps the biggest video game acquisition in the history of our industry. So it's fair to assume that their legal department is overloaded with work as they finalize the Activision deal. So what does this mean? Is Black & White destined to be abandonware? Where when future generations talk about the most influential PC games of the 2000s, will they continue to omit Black & White? Is it a destined to be erased from our collective memory? Ultimately, the only people who can really answer that question are EA and Microsoft, and save for a overwhelming groundswell of enthusiasm from PC gamers. I'm not really sure there's much we can do. We talk to publishers and studios a lot, so we're certainly going to keep mentioning it, and maybe if this video gets like 10 million views in a week, we could probably move that needle. But realistically, these ones sometimes take time, often the right person in the company who's willing to go to bat for it. In any case, the legacy of Black & White can be felt all around the games industry in the survival of Lionhead and the creation of Fable. In the dozens of developers who went on to create their own studios, Alex Evans and Mark Healey would found Media Molecule and the Little Big Planet franchise. Jonty Barnes would produce Halo three and Destiny. Others have gone on to enjoy careers at Super Massive, Gorilla and Rockstar. By the time development wrapped on Black & White, the team is no bigger than 15 people. Even by 2001 standards, the fact that they managed to make this game is a miracle in its own right. And for all the criticism Peter has enjoyed for hyping up these projects and being the front man of a larger development effort, Black & White delivered on its promises, thanks to the blood, sweat, and tears of an incredibly talented team. You know, when you look at that team in particular, I think, like you said, pound for pound, it's just remarkable the people who are there and where they've ended up and the careers that they've had since and the studios they've founded. How does that make you feel when you set back and look at? - I mean, incredibly honored to have worked with such incredible people. I mean there were, you know... I can get very emotional and we had, in the summer we had a reunion party for all of the ex Bullfrog, Lionhead and 22cans people, and there were about 400 people there. I spelt the whole time crying because, you know, my heart just filled up with pride that we had done such incredible things. (ambient music) (creature chittering) (creature groaning) (food crunching) - Yeah. Wait. (creature farts) (ground thumping) (creature groaning) (creature groaning) (food crunching) (creature retching) (creature chittering) (keyboard tapping)
