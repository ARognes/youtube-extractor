transcript: I'm wondering about your kind of thinking in this new AI era about niching down into an area. Is it better to be kind of say you're a specialist? [music] What would you suggest to people who are sort of now >> See, I think you're talking about positioning. >> Yeah. >> So, what I would recommend is that you shouldn't do it exclusionary. You should have a specialty in certain things where you can go really deep, but I wouldn't say I only do X. The reality is when you are interviewing, you want to maximize your surface area. I think this is good advice independent of all of the AI stuff that's going on.
