transcript: What's also super weird is that we have another loop inside here. So these functions all have their own application loops. Then we've got one in here as well. That's a little bit weird. I think that this while loop is completely unnecessary if they happen to actually take over the entire code flow of the application by creating a pretty much endless while loop until the state changes. This is something that should be external to this function. This should be your main game loop. when you start to introduce subgame loops for no reason like this, it just destroys like the flow of your code. I'm going to go ahead and comment out every single Y loop that we have and then handle end state is also completely unnecessary. If I just run the game with those changes, look at that. We're playing the game. Our states work. Everything works the same way because this stuff was completely unnecessary and just added complexity to what I would call is a very critical part of our project, the main loop.
