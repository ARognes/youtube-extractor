transcript: 'I would die. One of you have asked from us that how can we kill the laziness? How can we do the things without laziness? Okay. Today from this inner guide Q&A program, we are going to discuss that how can we do the things without the laziness and how can we kill the laziness. To kill the laziness and to do the things without laziness, to stop being lazy in our works, >> [music] >> our great teacher supreme Buddha taught us that you should have four great qualities. If you have these four great qualities within you, you will never feel lazy in your works. You will never feel lazy when you are doing meditations. You will never feel lazy when you are doing studies. To accomplish anything, any special goal in your life, you need to have these four great qualities. So, what are those great qualities? These are known as four iddhipadas. The first great quality, the first iddhipada that you need to have to accomplish anything in your life and to do the things without laziness is called chanda. What do you mean by chanda? Chanda means the desire. If you have the desire for doing something, in one way or another, you will you are going to do that because you like it. You love [music] it. If [snorts] you love what you do or if you do what you love, you will never feel lazy. Now, suppose that you are going a trip or a picnic tomorrow. So, tonight when you''re going to bed, you never [music] feel sleepy. You never feel lazy because your mind is excited and you love that day that coming tomorrow. So, you''re going to be happy in that day. So, if you''re doing something that is that is you like that you are passionate about, you will never feel lazy. So, what you have to do to kill the laziness to do the things that without the laziness >> [music] >> you need to generate the desire for doing that. If you''re doing meditations, you need to have a desire for doing that. Without the desire >> [music] >> if you do the meditations and do the spiritual practices without the desire you will feel lazy. That is the first >> [music] >> great quality, chanda. Here comes the second one. It''s called the chitta. Chitta means the mindset. You need to have the determination and you you should you should have the correct mindset to do the thing that you want. You need to have a great determination that I will do [music] this thing today. Right? You need to have that mindset of not giving up. If you have the correct mindset to do something you will never feel lazy. Because you are well focused that your mind is focused to what you are doing. >> [snorts] >> When your mind is focused to something you don''t feel lazy anymore. You don''t feel giving up anymore. You don''t feel bored anymore. So, what you have to do? You need to have a correct mindset to do to do that work. Then, you will never feel lazy. That is the second step. Third step and third third quality, that''s called the viriya. Viriya means effort. To do something, to achieve any good goal in your life, you need to give some effort to that. You need to dedicate yourself. [music] You need to sacrifice your time, your life, your blood and sweat to do that. Then only you can achieve that. When you are dedicated for something, when your mind is dedicated for something, you will never feel lazy. So, what you have to do? You need to dedicate yourself, and you need to try hard in your works. Try hard in your [music] studies. You should never give up in your meditations. Then, you will never feel lazy. Because you are committed to that. You''re dedicated to your work. That is the third step. That is the third great quality. Here comes the fourth great quality. That''s the final one. It''s called the vimansa. Vimansa means investigation. You need to investigate what are the ways that I can do my work easily. What are the ways that I can be more productive in my work? >> [snorts] >> If you investigate yourself in your work, then you can kill the laziness. Because sometimes we do the things with that we don''t love and that we don''t like. If you have the in power of investigation that what are the things that I like to do? What are the things that my heart feels free to do? If you do those things, >> [music] >> you will feel you will never feel lazy. So, what you have to do? You need to have these four great qualities. First one is called chanda, the desire. Second one, chitta, the mindset. Third one, viriya, the effort. And the final one, vimansa, the investigation. So, if you have these four great qualities, you can do the things without the laziness, and you can kill the laziness in your life. So, practice these qualities, and escape from the laziness, and be happy in your life. I know it is very difficult to forget the past memories. I know it is very difficult to forgive yourself >> [music] >> for the things that you have done in the past. >> [snorts] >> But, at the end of our life, at the end of our day, what we all need is nothing but just >> [music] >> the peace in our mind. But, in order to find that peace, we need somehow, >> [music] >> we need to let go of that past memory. Let go of that things that hurt us. But, how? Is there a way to find that peacefulness within our mind? Well, let''s discuss about it in this video. If you look at the past memories, uh I heard this nice quote about the past memories. It says, "Thinking about and worrying about past is like dragging a boat on a dry land." Okay? Now, where we can use the boat? We can use it on water. But, if you try to drag that boat onto dry land, and take it wherever take it with you to wherever you go, what will happen to you? It will become a burden to you. It will hurt you. It is so heavy. And there is no use in the in the same place. >> [music] >> Right? You cannot use the boat on the dry land. Okay? Holding on to past memories >> [music] >> is also like that. Right? There''s no use of it. Right? We''re not letting that past memory to be in the correct place. We''re taking it to wherever we go and every every place that we go. [music] And it will keep hurting us. So, what we can do to forgive ourselves and let go of that past memory. Well, there are certain There are certain things that you can do. One of the most important things that you have to realize in this world is that not everything in this world is totally under our control. There are people around you, okay? There are things around you. There are certain things that is happening around you. But not everything and not everyone of them is totally under your control. Okay? We have to deal with it, but it is not out It is out of our control. How people treat you. You cannot do anything about it. How people think about you. You have no control over it. How people talk to you. How people behave in front of you. The things that is happening in this environment in the nature. There are things that is out of our control. Okay? If we try and if you realize that this is the truth. Okay? I cannot do anything about it. Should I worry about them? Then you come to the conclusion that I I don''t want to worry about it >> [music] >> because it is out of my range. Okay? So, this is one reality that you have to understand. The world is not totally >> [music] >> under your control. Why? Because we are so busy in our life trying to control the things >> [music] >> that are around ourselves that are out of out of our control. Okay? So, realize that not everything is under your control. And the next thing that you have to do is this might surprise you. Now, a lot of you a lot of people are trying to forget the past memory. Okay? I would say don''t try to forget past memories. Okay? Don''t try to do it. What will happen if you try to do it? The more you try to forget something, the more it will haunt your mind. >> [music] >> Isn''t that true? Yes, do it practically, right? Try to forget something, it will come back to your mind. >> [music] >> Okay? I would say rather than trying to forgetting forget the past memory, I would say let it fade away from your life. Okay? >> [music] >> Let it fade away. How to do it? Fading away is happening with time. Okay? It takes time. It''s something like healing a wound. Okay? To heal a wound, it takes time. Okay? So, what we [snorts] have to do is we have to give less attention to that memory. Okay? Now, most of the time what happens in our us is when past memories haunt us, we give so much attention to it. We give so much awareness to it and think like this is the biggest tragedy tragedy in my life. This is the biggest mistake that I have done in my life. Now, my life is worse. Okay? The The more we give attention to [music] something, it will grow. That is the nature of the mind. The Buddha said, "The more you give attention to something, these kind of thoughts come again and again >> [music] >> to your mind." So, what we have to do is give less attention to it. But, how? Okay? Now, some of you say it is very easy for you to say that give less attention to it. But, it is very difficult. I know. It is very difficult. But, there is certain thing There''s one thing that we can do. We can identify that thought as a thought. Okay? Let''s say these past memories, they are always the thoughts inside our [music] mind. Okay? And also there are certain good memories and happy memo- memories. [music] All of them are just thoughts. Okay? The only difference between these hurtful memories, past memories, and the good memories >> [music] >> is the way we look at that thought. Okay? The perspective towards that thought. If we can identify, ah, this is just a thought. There''s no difference. Okay? It will come to our mind and this will fade away and this will pass away by the time with the time. So, I must give some time to my mind to let my mind heal. When you do that, the past memories will start fade away little by little. Why? Because you''re giving less attention to it. Okay? >> [snorts] >> Then, there will be a day that [music] comes then you come to a conclusion and you will realize that these past memories we are no longer hurting you. Okay? In my life, I have I had >> [music] >> bad memories. Okay? The reason why I''m telling this is because I''ve been in the same situation as you guys. Okay? There was so so many past bad memories and mistakes that I have done in the past. But, when we give less attention to that, it will fade away. Okay? Then, you will be okay with those past memories. So, that is what I I to share with you in this video. So, just let your past memories fade away from your life. Learn from your past, learn from your tears, and let your tears water the seeds of your future success. Keep that in your mind. In our society, there are people with narcissistic ideas. The people with narcissistic ideas are a bit selfish. And also, they need attention from the people around them. And they don''t have that compassion, and they don''t care about other people''s feelings. They can do anything to protect their personality being hurt, without being hurt. So, they can do anything to protect that. So, when we are living our life, we have to deal with such people. Right? Sometimes, we may find narcissistic people in our family. Right? [music] As our partners, life partners. So, we have to deal with such people. So, how to deal with this problem? First of all, we have to understand about the situation of that person. Right? If a person is being narcissist, that means he needs the attention from others. Okay? And also, they don''t care about others'' feelings. They can hurt you at any time. Right? They don''t care about your feelings. So, when you are doing when you''re dealing with such people, the first thing that you have to do and to develop within yourself is the patience. Right? When you talk about when we talk about the patience. Supreme Buddha said, you should not be patient >> [music] >> out of fear. Right? Lots of Lot of people talk about patience and they think that patience, being patient, is a weakness. Right? If you are being patient out of fear, and that is the that is a weakness. But if you can be patient with the wisdom, by being positive, not being aggressive, not being negative, but if you can be assertive, right? The positive patience, the patience with wisdom, then you will have that ability to deal with people. Right? When you''re being patient, you will develop the ability of listening to them. Right? As the narcissistic person needs the attention from others, if you are listening to their ideas, if if you''re listening to what they say, then they will start to give a consideration, or they will start to uh love you. Or they will start to like you, because you are listening to them. But still you''re being patient, and you''re not being patient out of fear, and still you''re listening to that person, then that person will start to like you, start to be with you. Now, normally, when we find narcissistic narcissistic people, the people with selfishness, and people with higher self-esteem, [music] we always try to reject them. Remember, the more we reject such people, the more they will develop their narcissism. They will tighten up their narcissism. Because we feed their ego. Right? No one likes to be rejected in their lives, especially the narcissistic people. They don''t like to be rejected. So, what you have to do, you need to be patient. You need to listen to them very carefully. Give a big attention. That is the first quality. Number two, you need to have the kindness within yourself. You need to be kind to yourself as well as to the the person who needs your attention, [music] that person. Right? If you can be kind to them, right? They will start to love you and they will start to listen to your ideas. Normally, narcissistic people, they don''t listen to others'' ideas. They think that I don''t want any advice from anyone. I''m the superior superior person. But if you approach them with kindness, if you approach them with patience, if you are not rejecting them, they will start to uh soften their stubbornness. Normally, they are the people who are with hard hard and stubborn qualities. Right? So, if you are approaching them with kindness, compassion, listening, patience, then they will start to follow your advice. Right? They will start to think twice about your advices. Right? So, what you have to do is you have to approach them with kindness. Remember, kindness has the answers for these types of questions, problems. Right? Normally, we don''t choose to be kind. We always try to reject that those people. One one step by one step, you have to to them with kindness, compassion, and [music] patience. That is a soft approach, not a hard one. Okay? And the third quality that you must have within yourself is to admire their values, their good things. Right? Normally, we have the nature in our self to label the people. Right? If someone has selfishness within himself, we label that person as a narcissist. Right? But, he''s not a narcissist. He is a person. He is a human which has narcissistic ideas. He''s not a narcissist. Now, same goes with other people. If we take a murderer, right? We label that person as a murderer. But, he''s not a murderer. He is a person who had killed a person. Right? The more we label people like that, narcissists, murderers, selfish people, unkind people, like that, [music] if we label the people, if we give the tags to them, right? They will never get out of their problems, their [music] weaknesses. First of all, we need to see the human within that person. They are the people who needs our help. They are the people who needs our attention. Right? If they need our attention, we have to give that. If you give that attention to themself, then they will start to like you. Okay? And also, you need to take time. Right? If you need to change that person, if you need to uh make them feel that this narcissism and the things that the the problem that I''m having is not a good thing. You need to take time to explain them. Right? People doesn''t change in one night within one night. Right? It takes time. And also you cannot convince a person through anger or rejection or blaming or scolding to make them change. You cannot do that. People change by themselves. By their own choices. If they made the choice to change themselves, then only they are changing. Right? If we try to change themselves, [music] if they are not listening to our ideas, then they will never change. So, what you have to do, take time little by little. In every narcissistic person, there is a human >> [music] >> which has good qualities. So, you have to see those qualities and admire those qualities. Give a value to them. Right? If you''re giving value to them and if you''re not caring and if you don''t uh if you''re not caring and if you''re ignoring the negative side of that person, and they will always give a good admiration to you. Right? So, >> [music] >> so when you are living with a narcissistic person, what you have to do is you have to admire their little qualities, good qualities [music] that they have. Right? When you admire them, they will like you. When a person develops the desire for another person, then they will always start to listen to that person. Right? Then after that, with the time, if you tell, "Now you have to get out of this problem. You have to stop being selfish." And start You need to start to be kind and compassionate [music] to yourself to the and to the others. Then they will start to listen to your advice. Right? So, never use anger or resentment, aggression to deal with such people. Right? If you are using anger, resentment, hatred to deal with such people, they will never get out of their problems. They will never become change. Right? So, approach them in a soft way, in a kind way. You have to help them because they need our help. So, when you are dealing with such people, tough people, narcissistic people, right? You have to always use these qualities: [music] patience, kindness, and good listening abilities. You have to take time. Right? You have to value and admire their qualities. >> [music] >> These are the things that gives the answer for these type of problems in our life. So, when you are living your life, develop these qualities within your heart and make your heart a peaceful place. And make the hearts of the people around you a peaceful place.'
