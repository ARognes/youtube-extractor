transcript: '{"content":"\n[0.0s] So, I bought this uh this t-shirt when I\n[2.399s] was on vacation recently. Uh it says\n[6.16s] it says, \"Science doesn''t care what you\n[8.24s] believe.\" Now, you may have seen this\n[10.32s] kind of t-shirt around or this slogan\n[12.08s] around. It''s a popular one in the\n[14.719s] science geek community. And its message\n[18.08s] uh is clear. It was clear to me that\n[19.6s] that the universe operates according to\n[21.76s] physical laws, gravity, thermodynamics,\n[24.64s] evolution.\n[26.16s] And it operates regardless of our\n[28.24s] beliefs, our prayers or our opinions.\n[32.16s] That is the ultimate realization of the\n[34.559s] European Enlightenment that reality as\n[37.36s] such doesn''t care what whether we\n[39.52s] believe in it or not. or relatedly in in\n[42.879s] the words of the great Carl Sean, the\n[45.52s] universe seems neither benign nor\n[47.68s] hostile, merely indifferent.\n[51.28s] But the more I looked at this shirt, the\n[53.44s] more I began to to think in a in a way\n[56.16s] this is what the Buddha taught as well.\n[58.96s] Only he meant it in a way that is\n[60.48s] perhaps more meaningful to most of us\n[63.68s] than the physics issues. It goes to the\n[67.04s] heart of our psychology.\n[70.56s] Just as physics doesn''t care if you\n[72.72s] believe in gravity, that is you''re going\n[74.88s] to fall. You''ll you''ll fall if you jump\n[76.479s] out the window whether you believe in\n[78.0s] gravity or not, the dharma, at least in\n[81.119s] the early Buddhist sense, doesn''t care\n[83.52s] if you believe in it. Indeed, for the\n[86.08s] Buddha, the dharma is something that was\n[88.799s] that is beginninglessly lost and\n[91.2s] rediscovered again and again by\n[93.68s] different Buddhas at different times.\n[96.24s] That is to say, it''s always there, but\n[99.119s] it takes a Buddha to to understand it\n[101.2s] and realize it and teach it to other\n[102.88s] people.\n[104.799s] You may believe that you''re going to\n[106.56s] stay young forever. Some wealthy\n[109.52s] technologists believe they''re eventually\n[111.92s] going to be able to escape aging and\n[113.84s] death. Other people may pray to do this.\n[118.32s] But the law of impermanence does not\n[120.56s] care. As the Buddha said, suppose there\n[124.24s] were vast mountains of solid rock\n[127.04s] pressing against the sky, drawing in\n[129.28s] from all sides and crushing the four\n[132.0s] quarters.\n[133.52s] So too old age and death advance upon\n[136.959s] all living creatures. Aristocrats,\n[140.16s] brahinss, peasants, menials, corpse\n[143.28s] workers, and scavengers.\n[145.52s] They spare nothing. They crush all\n[148.239s] beneath them.\n[150.4s] That is to say, this is an impersonal\n[152.72s] law. It''s not a system of some kind of\n[155.84s] divine judgment. It''s simply cause and\n[159.2s] effect. It''s how the universe is set up\n[161.44s] to work. If you put your hand into a\n[164.64s] fire, it''s going to burn you regardless\n[167.04s] of whether you believe fire is hot or\n[169.2s] not.\n[170.959s] If you act with hatred, you tend to\n[173.599s] create suffering regardless of your\n[175.92s] theology.\n[178.319s] The key early Buddhist term here is\n[180.72s] ehipasiko in in Pali which means come\n[184.08s] and see.\n[186.0s] That is to say the Buddha did not ask\n[188.0s] for blind faith in some kind of dogma.\n[192.239s] He invited investigation into a reality\n[194.959s] they were we are all already a part of.\n[199.68s] You may have heard of such scientific\n[202.4s] practices as double blind studies or\n[205.76s] peer review or statistical analyses of\n[209.04s] data. Now these are complicated\n[212.159s] processes. But why are they necessary?\n[216.239s] Because the human mind is a\n[218.799s] biasgenerating machine. We see what we\n[222.799s] want to see. left to their own devices,\n[226.799s] our beliefs and opinions are going to\n[228.56s] corrupt our data.\n[230.879s] As the physicist Richard Fineman\n[233.2s] famously said, the first principle is\n[236.959s] that you must not fool yourself and you\n[240.48s] are the easiest person to fool.\n[244.64s] Though the Buddha was not a scientist in\n[246.879s] the modern sense, he was aware of this\n[249.84s] problem 2500 years ago. He saw that our\n[253.76s] cravings and our beliefs tended to\n[256.239s] corrupt our perception of reality.\n[259.84s] The Buddha warned specifically against\n[262.8s] clinging to views and opinions.\n[266.24s] When we hold a belief tightly, when we\n[268.96s] personalize a belief and make it ours,\n[272.639s] we become blinded to contrary evidence.\n[276.72s] Think in particular of religious dogmas\n[279.52s] or political opinions of one kind or\n[281.84s] another. All too often they end in\n[285.28s] arguments, in disputes, enmity, and\n[287.84s] conflict with other people.\n[290.72s] Maybe you''ve heard of the simile of the\n[292.479s] blind men and the elephant. It actually\n[295.199s] appears in an early Buddhist suta as\n[298.24s] well as in other traditions.\n[301.36s] It tells of a group of followers of\n[303.84s] various religions who would get into\n[306.08s] arguments and disputes over their\n[308.639s] various claims.\n[310.96s] When the Buddha''s monks saw these\n[313.039s] disputes, they went and told the Buddha.\n[316.56s] And the Buddha told them of a king in\n[319.36s] Savvati who had a number of blind men\n[322.16s] gather and say what an elephant was like\n[325.039s] by touching it.\n[327.28s] One touched the ear and said that an\n[329.6s] elephant was like a fan. Another person\n[332.72s] touched the head and said that an\n[334.96s] elephant was like a great big pot.\n[338.08s] Another touched the tusk and said it was\n[340.96s] an elephant was like a plow.\n[343.759s] And the and another one touched an\n[345.44s] elephant''s leg and then said that an\n[347.199s] elephant is like a pillar\n[349.68s] and so on. That is to say, they\n[352.08s] disagreed completely about what an\n[354.24s] elephant actually was.\n[357.36s] And hearing each other say these things,\n[359.68s] they got into quarrels and eventually\n[362.4s] fist fights with one another. And the\n[364.88s] Buddha had this to say about this story.\n[368.96s] In the same way, mendicants, the\n[370.96s] wanderers of other religions are blind\n[373.68s] and sightless. They don''t understand\n[376.16s] what is beneficial or what is not\n[378.56s] beneficial. Nor what is the truth and\n[381.44s] what is not the truth. That''s why they\n[384.24s] are fighting, quarreling, and disputing,\n[387.12s] continually wounding each other with\n[389.12s] barbed words.\n[392.08s] This account of the Buddha illustrates\n[393.919s] how clinging to partial viewpoints leads\n[397.12s] to conflict and furthers ignorance.\n[400.96s] The goal is to better see the whole\n[403.919s] picture.\n[405.52s] So, in a way, the skillful Buddhist\n[408.0s] practitioner is like a good scientist.\n[411.759s] We''re trying to remove the interference\n[414.08s] of our own desires so that we can see\n[417.44s] things as they really are.\n[422.16s] Now, we have to be very careful with\n[424.16s] where we''re going here. There is a trend\n[426.639s] in some modern Buddhism to say that the\n[429.68s] Buddha was a scientist or even that the\n[433.199s] Buddha was a quantum physicist or\n[435.36s] something. But reality check, the Buddha\n[438.96s] was not a scientist. That''s that would\n[440.88s] be an anacronism.\n[443.039s] Science is a specific and complicated\n[445.84s] methodology methodology for\n[448.24s] understanding the physical world that\n[450.639s] did not exist in the Buddha''s day nor\n[453.759s] for that matter for millennia\n[455.36s] thereafter.\n[457.199s] In essence, science and the dharma are\n[460.24s] about different domains.\n[463.759s] Science focuses on the workings of the\n[466.4s] external world. It doesn''t care what we\n[470.319s] believe about atoms or stars or cells or\n[473.919s] the workings of gravity.\n[476.96s] The Buddha''s focus on the other hand was\n[478.96s] about our internal experiences in and in\n[482.479s] particular about suffering and its\n[485.68s] alleviation.\n[488.0s] The dharma that he taught doesn''t care,\n[491.36s] didn''t care what we believed about\n[493.919s] change, about suffering, about craving,\n[497.039s] about peace.\n[499.44s] For example, we may believe that craving\n[502.319s] will not lead to our suffering as was\n[505.44s] was the case with some early monastics.\n[508.879s] But the dharma does not care what we\n[510.879s] believe. This craving is going to lead\n[513.519s] to our suffering anyway.\n[516.719s] One way to illustrate this distinction\n[519.039s] between science and the dharma is with\n[522.56s] the Buddha''s famous parable of the\n[524.959s] poisoned arrow.\n[527.519s] The Buddha said that expecting answers\n[530.16s] to such questions as the origin of the\n[533.04s] universe or whether the world is eternal\n[535.68s] or not was like being shot with a\n[538.56s] poisoned arrow and wanting to know\n[540.88s] everything about the shooter, the bow,\n[543.92s] the bowring, the arrow''s shaft, and so\n[547.12s] on before expecting the surgeon to go\n[550.16s] and extract that arrow. As the Buddha\n[553.2s] said, that man would still not have\n[555.6s] learned these things and meanwhile they\n[558.24s] die.\n[560.0s] That is to say, questions as to physics\n[562.72s] and cosmology will not by themselves\n[566.399s] help to end suffering.\n[568.959s] The Buddha wasn''t interested in\n[570.72s] cosmology, in scientific investigation\n[574.32s] for its own sake.\n[576.88s] Now, that''s not to say that these things\n[578.72s] aren''t important, just that they were\n[580.88s] not the Buddha''s central interest.\n[585.519s] So, science doesn''t care what we\n[587.36s] believe. Neither does the dharma.\n[590.959s] Both are invitations to drop our\n[594.0s] fantasies, our wishful thinking, and\n[596.64s] engage with reality on its own terms,\n[600.08s] being alive to the fact that the easiest\n[602.959s] person to fool is ourselves.\n[606.399s] When we stop forcing the world to fit\n[609.44s] into our beliefs, we stop fighting\n[612.24s] reality.\n[613.76s] And that sessation of fighting is the\n[617.04s] beginning of peace.\n[620.0s] It''s the beginning of a more skillful\n[622.32s] encounter with things as they really\n[625.2s] are.\n[627.12s] Now, this idea of seeing things as they\n[629.92s] really are is the definition of wisdom\n[632.48s] in Buddhism. If you want to know how to\n[635.12s] cultivate that or begin to cultivate\n[637.36s] that, we can begin with a factor of\n[640.16s] right view. And I''m going to put a video\n[642.72s] about that topic on a on the screen in a\n[645.44s] moment.\n[647.12s] Meanwhile, I''m curious, do you find that\n[649.12s] your scientifically informed worldview\n[652.079s] supports your Buddhist practice or is\n[654.88s] there a conflict there? Let me know your\n[657.44s] thoughts in the comments. And if this\n[660.24s] discussion has been useful to you, a\n[662.8s] like and subscribe are always\n[664.56s] appreciated. Thanks so much for your\n[667.2s] continued practice and all of you,\n[670.0s] please be well."}'
