transcript: '{"content":"\n[0.0s] Being a good person is not about what\n[2.2s] you want. We all have selfish desires.\n[4.28s] Being a good person is about the way\n[6.0s] that you act in relation to them, right?\n[7.72s] If I want to have an affair, that\n[9.16s] doesn''t make me a bad person. Whether I\n[10.8s] have an affair or not, that''s a\n[12.28s] different story. Does that make sense?\n[13.72s] >> Yeah.\n[14.16s] >> And the biggest problem is that we get\n[16.2s] the two confused, so we end up being\n[17.92s] dishonest with ourselves. So, you got to\n[19.56s] like think about what you want, and then\n[21.6s] you also have to decide how much you\n[23.36s] want to give in to that. Just because\n[24.76s] you want something doesn''t mean that we\n[26.76s] don''t control where our desires come\n[28.32s] from. I don''t know if that kind of makes\n[29.68s] sense.\n[30.2s] >> Yeah.\n[30.52s] >> is what like advertisers understand, and\n[32.08s] that''s why they advertise. If they\n[33.56s] advertise, they can create desires in\n[35.4s] other people. So, like our desires don''t\n[37.28s] make us good or bad people. And I''ve\n[39.6s] worked with people who have had some\n[40.88s] really arguably bad desires. You know,\n[43.12s] like that doesn''t make them good or bad\n[44.64s] people. What makes them good or bad\n[46.44s] people is whether they act on them."}'
