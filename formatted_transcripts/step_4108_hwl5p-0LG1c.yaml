transcript: Good news guys, AI progress is finally slowing down and I'm not talking about the last two models from Anthropic being basically flops, Opus 5 and Sonnet 5. Most people really don't like them, especially Opus 5, but I'm actually talking about this statement that was signed by over 1,300 employees from frontier AI companies. That includes people like Dario and Shane Legg, who's one of the three co-founders of DeepMind, and basically many other notable people from most of the most notable AI companies. But there is one caveat to that. These are all people working at US-based companies and I think that is intentional because this statement is a request to the US government to support an international effort to develop the technical and governance tools needed to deliberately pace the frontier of automated AI development. It seems kind of strange that they would want to, in a sense, regulate themselves. If they wanted AI progress to stop, why don't they stop themselves? Well, if one person stops but everybody else keeps going, it's kind of pointless. Now, if you actually go through and see what the people that signed are saying, the common theme here is that the rate of AI progress keeps improving and that the implications for society are really unpredictable that reason we should slow down and be more careful. Also, the boogeyman this time is something called recursive self-improvement. The idea that actually at some point it won't even require human involvement, the models will be able to improve themselves. And most recently, a lot of the people at these companies are convinced that it's not just a theory anymore, it's slowly becoming a reality. If it does become a reality, well, the pace of improvement will be so quick because, of course, machines don't have the limitations that humans do. And this is something both OpenAI and Anthropic have talked about. If you go to the 5.6 release from OpenAI, they actually talk about it as well in the section 5.6 accelerates OpenAI. It's not just that these models are good at coding and better at coding, but they're now actually helping researchers more and more, and they've even developed this index. I don't know how much I trust indexes and benchmarks these days, given that Opus 5 scored above Fable 5, but we all know it's a lot worse. I mean, if you've tested it, there's no way you can think it's better than Fable 5. But, if you look here, compared to 5.5 and 5.4, the 5.6 series of models, especially Luna and Soul, are much higher than before, getting, I guess, between 50 and 60%, but it's not just OpenAI. Anthropic had a piece, When AI builds itself. So, they're also talking about this thing, which is important and worth discussing, because if it is true, it would be quite fascinating, but also possibly horrifying if AI is improving itself. But, I I do want to point out that even in this piece, pretty early on, they mention the keywords, We are not there yet. Recursive self-improvement is not inevitable. Basically, to say it's possible that recursive self-improvement itself isn't possible. That eventually we will hit a plateau. Now, who knows? Well, one thing we do know is that the models are getting pretty good at this point, so good that both OpenAI and Anthropic have had incidents this year with their best models. Open AI. Open AI was testing some models internally for benchmarks and in order to get the max score, the model did something clever. It broke out of the sandbox that it was in because the sandbox had a vulnerability. It couldn't have done that if it didn't have a vulnerability. Possibly the sandbox was vibe coded, I don't really know, but that could have happened otherwise as well. And it broke out of the sandbox and then it compromised hugging faces infrastructure in order to try to get the best score. Because Open AI reported this, Anthropic did a review of their own and they found out that 3 months ago, they also had a security incident in which a Claude model reached the internet and gained unauthorized access to three real systems of three different organizations. The scary thing about this one is it was actually not detected. It wasn't even known until Anthropic actually went back and looked for it and the three companies didn't really know either. Now Anthropic of course has disclosed it to them. Now as much as I'd like to believe that everybody who signed this is doing it for the greater good of humanity, I think there are a few other reasons why it would be convenient to slow down the progress of AI. But before that, let's take a quick break to talk about something that won't slow you down. You may have already heard of today's sponsor Greptile. It's a popular AI code reviewer used by over 9,000 teams including my own. I find that this is one of the best use cases of a loop. I typically have my agent loop through all of the comments and issues that Greptile identifies. In this case, these were some P1s and I keep going until I get that confidence score five out of five and there's no actionable comments remaining. Recently they came out with T-Rex. It stands for test, run, execute. The idea is something that most developers already know. Looking at code and reading it usually isn't enough to identify issues, so T-Rex will actually show you like this list of logs of what it actually did to arrive at the confidence score. In my case, it already caught some really important bugs. Before that, you can see when the score was a four out of five, the logs caught a really important issue where we would get a verified past message even if zero test runs were executed. Now, once this bug was identified, it was pretty easy to fix in this commit right over here. You can see I was doing this with Fable 5. Even in the commit message, you can see the issue was attributed to Greptile. I think Greptile can catch some bugs for you as well. You can try it out for free at neco.fyi/greptile. Now, one of the reasons that, of course, they did not mention these couple red dots over here, and I guess the color red is a hint in this case because it's China. China is also developing frontier models, and they're getting better and better, and in fact, I would say that the pace of development for Chinese models is actually improving more quickly than the US models. You can see here, and I I I you can't always go by benchmarks, given that Opus 5 scored above Fable 5. This is Deep Sweet. It's considered one of the better benchmarks these days. You can see that Kimi from Moonshot, Kimi K3, is basically, you know, nearly there. GPT 5 .6 sole is a a touch higher, but most notably, look at the X axis over here, the cost. This model is much cheaper. So, while it's not as good as the best models from Anthropic and OpenAI, it's practically there, and it's cheaper, and importantly, it has less guardrails. So, you know how with Fable, sometimes it just won't complete a task for you if it thinks you're trying to do something suspicious, well, these models don't have those restrictions. And it's not just Moonshot, the founder of ZAI, the creators of the GLM models, another company in China creating some really good models these days, had something really interesting to say to Elon. The original tweet was GLM 5.2 points to a 7-month gap currently. It's around Opus 4.7 to 4.8 level and that implies that we'll have some Chinese models that are Fable-class by the end of the year. And the chain was a bit interesting. Elon said probably Q1 of next year is when they'll be at the Fable level. And the founder of ZAI said that it won't take that long. And Elon said, well, on benchmarks, yes, but as measured by true usefulness, even Q1 would be very impressive. And for once, like Elon is being honest and nuanced. He's actually been saying some reasonable things these days. Uh, but he says Anthropic rightly focused on maximizing useful intelligence, which does not show up in benchmarks, but definitely shows up in revenue. Well, what the ZAI founder is implying is pretty interesting. And I guess what we only have to wait like four or five more months to see if that actually becomes a reality. But if it does, the implications are going to be huge because we won't have the restrictions and the US government won't be able to set the guardrails. Now, the bigger question might be, well, when are the Chinese models going to surpass the US models if ever? Well, one of the techniques that Anthropic has accused the Chinese model makers of doing is distilling the best models from Anthropic and OpenAI, which is basically a way to create a smaller model like using the bigger model and just making a bunch of requests. And I'm sure it's more complicated than that, but that's the naive version. And this is actually something And this is something I actually talked about when the Deep Seek moment happened, I think at the beginning of 2025. Not to toot my own horn or anything, but I said that the single biggest consequence of that is that these models are not defensible, that there's no moat to creating the best model. That the business, if these companies want to create a viable business, and it seems that they do given that both OpenAI and Anthropic are planning to IPO pretty soon, if they want to do that, they need a better strategy, or at least they need to do more than just create the best models possible. They're going to need something a little bit more than that, and it seems they're going down a route that some people had actually predicted before. I think receipts are pretty important. There was one smart guy who predicted it 3 years ago, not me, but Bill Gurley, probably one of the only VCs I can actually stand to listen to. Really wish he was still on the BG2 podcast, but he said 3 years ago, "I believed open models would become the key threat to the AI incumbents, and that unfortunately they would lean into regulatory capture as a response. I underestimated the fervor with which they would use this non-business approach." And I'd recommend you listen to the entire talk. I found it very interesting, but the short version is that regulatory capture is a technique that's been used already. It's used all the time, and it's just a cancer on society. That's one thing that was good about the tech industry, that it was competitive for the most part. I mean, we did have companies like Google paying billions and billions of dollars to companies like Apple just to make Google the default search engine, but for the most part, if you came out with a better product, a better technology, you would win, and there was competition. But now, companies like Anthropic and OpenAI are leaning into the strategy of regulatory capture, which is they're finding it hard to compete on just like the technology and business alone. So now they want governments to write policies to protect them because regulations are good for incumbents and not good for newcomers. And this is something that's already been used all over the place. I think in the US especially, we think of companies like Comcast. I think what he says down here is even more interesting. I think ideas become self-reinforcing and humans prefer to think of themselves as virtuous. And we're all guilty of this. We're all human. Nobody can be anything other than that, no matter how smart they are or how much technology they have. But that's why I try to say that I don't think Dario and other people are necessarily lying. Let Let me show you an example of what I'm talking about. Dario had this piece, Policy on the AI Exponential. He does a quite a bit of yapping, and he does make some good points. It's worth reading. But he had something really interesting to say towards the end of it. It's become popular in AI industry circles to view this as a PR problem, to say that AI needs better marketing. I reject this framing completely. And he says it's his duty as an AI leader to be transparent. And I think he believes he's actually doing that. But let's make a counter argument. If Dario cares so much about the good of humanity, why is Anthropic working on something we don't want it to be known that we are working on this? Why is it that Okay, it's one thing for Anthropic to download a bunch of books illegally and then pay a fine after the fact. Well, if we don't do it, somebody else will. Okay. But why are they then buying a bunch of books, many of them which are rare and like only a single copy exists, scanning the books, and then keeping it to themselves, and I guess in some cases shredding the box. I don't know what kind of mentality you need to have to think that taking books, keeping them for yourselves, not open sourcing it. I guess their argument is that if you open source it, well, then your competitor is going to use it as well and that's your data. As if you wrote the book and as if knowledge shouldn't be freely available unless you go through the Anthropic models. It's just doesn't make any sense to me at least. Maybe it does to somebody, but not I guess not everybody is doing it. Apparently, this has been going on for a long time and I guess it's not just made up. It's probably happening It's probably happening with every company. Elon says that he's asked the SpaceX AI team to preserve any rare books in a library and scan them the hard way versus cutting off the spine and scanning them. And so, it's really hard to trust somebody who's making the ethical argument when they're doing stuff like this and then trying to IPO their company, but then also saying that okay, we don't want open source models. Okay, Anthropic, if they don't open source their own models, it's one thing, but they're saying everybody else who's open sourcing, even these Chinese models, don't allow them in the US. Do not allow Chinese open source models to be used in the US because it could be dangerous. It's also dangerous for a company like Anthropic to be able to tell people what to do and to be able to write the law and to be able to keep all this data and stuff to themselves and then make a lot of money off of it. If you read through this piece that Dario wrote, he invokes US amendments, historical facts, and all sorts of things, but he doesn't invoke the idea of the concentration of power, whether it be a government or a single company. He makes convenient arguments that well, we need to be careful because if we fall behind on AI, we could lose the war to other countries, like an actual physical war. So, now we should be worried about recursive self-improvement, something that isn't proven and we don't even know if it's ever going to come true when we already see the real dangers happening in front of us. Personally, you can kind of tell I'm skeptical of all of this. I'm sure many of us would be happy if the progress of AI slowed down, whether it be from regulation or we start to see the limits of these technologies. It's only becoming more and more expensive to train the better and better models. At some point, this is going to become an economic problem. So, I guess we're all going to have to wait and see what happens throughout the rest of this year and early next year.
