transcript: burnout is a really scary thing and if you're starting to feel like you're approaching burnout and you're kind of dreading to do all of your programming related tasks the very first thing you need to do is immediately start to cut back on the amount of programming you're doing if you're normally coding 8 hours a day working on learning new things cut that down to like five 4 3 hours a day that you're focusing on that and I know that sounds scary because now you're setting yourself back you're doing half the amount of work so you're obviously not going to learn as quickly that's where my second tip for this comes in what you can do is replace that activity with something that's and gently related so in the case of programming instead of programming 8 hours a day you can program for 4 hours a day and then spend those other hours of the day working on things that still help you with learning programming for example you can work on fixing something that's broken it could be like a mechanical thing that's broken maybe your toaster is broken you can work on trying to figure out how to fix that while no that's not going to give you programming skills it will teach you problem solving skills which is the core to actually programming and the most important skill you learn as a developer so trying to find things that are tangent related and focusing on those that may be more enjoyable even for example playing a game like factorial that's built all around this Automation and stuff that uses some of the same processes in your brain that you would use while programming so while you're doing something that's more enjoyable for you you're still learning some tangental skills to programming so that way when you come back and go full force into programming you're going to have more skills than when you actually started this burnout process now this is just one of many burnout tips I have and if you want to see a full video on how to avoid and get through burnout I link that video right at the bottom of the screen
