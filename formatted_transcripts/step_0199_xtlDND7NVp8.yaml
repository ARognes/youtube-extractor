transcript: in my hyperbolica devlogs I mentioned you can build a model of hyperbolic geometry using crochet but I never learned how to do it myself until now it's actually really easy and I'll show you how to do it in this video but there's an even more fundamental connection between crochet and topology so let me show you why it's so cool from a programming and Mathematics perspective normally crochet adds to a piece one stitch at a time as you kind of spiral around but what you're really doing is building a mesh just like you would in something like blender in fact I built this crochet simulator to show how that works to be clear there's like a million different kinds of fancy crochet stitches but ignoring Aesthetics there's really only three that you need let's unwrap a cross section so you can see what I mean these Square stitches are the simplest kind called single crochet so let's say your hook is over here and you add a single crochet the previous row is now connected to the new one and once you spiral around to the next row you can hook onto it again this is how you'd make something like a cylinder the next kind of stitch is called an increase that's when you put your hook through the next Stitch twice which creates an extra stitch in the next row in other words if we had six stitches in this row we'll be doing seven in the next row it's as if we added a pentagon into the square grid and maybe you can see where I'm going with this pentagonal grids don't work in euclidean Geometry but is perfectly valid in hyperbolic geometry so to make hyperbolic crochet you're just using the increase stitch over and over again to add extra pentagons to the grid causing it to get exponentially larger each row and forcing the excess curvature into the third dimension but before we get to the tutorial there's still one more Stitch to talk about as you may have guessed it's called the decrease that's when you hook through the next two stitches connecting them together and losing a stitch in the process so the next row here would only have five stitches using only these three stitches we can make all sorts of different manifolds like to make a sphere you would start by increasing a lot in the beginning then slowly transitioning to just single crochets near the equator and then transitioning to more and more decreases until the hole disappears if you want a mathematically perfect sphere there are patterns online that worked out all the math for you in fact there's a ton of free crochet patterns online and you can actually follow and apply it into the crochet simulator okay but enough simulation it's time to actually try this in real life so let's make a hyperbolic plane what you'll need is some yarn the most common size is four and a matching crochet hook which would be around three and a half to four millimeters with that yarn I recommend finding a hook that has a flat section for your thumb it just makes it a little easier to control the rotation compared to just a pole to get started the first step is to make a slip knot the easiest way is to make a loop on a table with a short end on top make a bump on the long end and pull it through the loop and pull the ends of the string until you get a knot the cool thing about a slip knot is that it's not really a knot pulling on the string will undo it [Music] in fact all crochet is based on slip knots so if you make any mistakes later on it's super easy and fun to undo by just pulling the string sometimes called frogging and the entire piece can be unraveled so you really could unravel an entire sweater back to the slip knot now we can insert the hook and pull the string until the loop is snug around the hook but not too tight it should be loose enough to easily slide on the hook and try to keep it that way all the time what we have now is the long end attached to the ball of yarn the hook in a slip knot and the short Ender tail which won't be used anymore so you can cut that off if you want now the fun starts we're going to turn the slip knot into a chain use the hook to grab yarn from the long end and pull it through the easiest way is to twist the hook around the yarn as you pull it through so it doesn't slip off you don't need that much tension and if you have too much slack you can just tighten it after you've already pulled it through we're going to do this chaining twice so one more time now it's time to do the first real Stitch find a gap on the chain that you can push the hook through then hook some yarn and pull it out of just the hole so that you end up with two loops on the hook all you have to do now is yarn over again and pull through both of the loops now you'll have one loop on the hook again repeat this five more times through the same Gap so that you've gone through it a total of six times at this point we have the same hexagon shape as in the simulation and this will be our base to build the rest of the hyperbolic surface and believe it or not you've already done the hardest part from here we're going to increase every single stitch so that each round doubles the perimeter because that's a hyperbolic Surface by definition an increase is just two single crochets in the same hole start by finding the next Stitch you should look for a V shape and try to get the hook under the V like this it takes some getting used to but it gets easier each round like before hook the yarn and pull it through so you have two loops on the hook and yarn over one more time to get it back to one that's a single crochet an increase means we do another single crochet but instead of going to the next V we use the same hole again you can trace down from the hook if you're having trouble finding it so again poke through grab the yarn and yarn over again to get back to one Loop that's it you just increase over and over again every single stitch and very quickly you'll get a hyperbolic surface [Music] thank you this one took me just 20 minutes it's a lot of curvature though so if you want something bigger you'll need to increase every other Stitch or even every third Stitch so for example the pattern for this one is two single crochets then an increase then two single crochets increase and so on also don't be discouraged if you're finding it difficult it just takes a bit of practice especially with the finger positioning and tension and don't worry if sometimes you miscount your stitching or you use the wrong holes in a few places hyperbolic surfaces are really forgiving so it'll still turn out fine another thing to mention is I'm using a special kind of yarn called tube yarn or beginner yarn the stitches show up a lot more clearly especially on camera and you never accidentally pull partial threads so it's a great option if you can find it as you get better like Mrs parade there's other cool topologies you can make too like Mobius strips minimal surfaces Seifert surfaces and more I just find it so cool how much crochet is connected with mathematics and I don't think it's talked about from that perspective enough it's also just a fun cathartic activity that can't really be done any other way unlike knitting there's actually no such thing as crochet machines because the dexterity needed is usually too complicated for machines to replicate so if you ever see crochet things they're always made by hand either for fun or in a sweatshop just a bit of trivia and if you'd like to learn more about mathematical fiber art you can check out Diana taimana's work she literally wrote the book on hyperbolic crochet and if you want to play with the simulator it's open source and on itch.io so you can check it out in the links below thanks for sticking through the tutorial and I'll see you all next time
