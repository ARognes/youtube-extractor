transcript: For the longest time, I've been fascinated by sporadic groups. These are some of the weirdest structures in mathematics. But, is it possible to intuitively understand them? Well, it turns out yes, because groups are really puzzles. And I'll show you some crazy puzzles I designed that let [music] you play with these structures. Groups are one of the things I never studied, and group theory has [music] so much complicated jargon it took me forever to understand it. So, I'm going to boil everything I learned down to just the things you need to understand puzzles. And the most [music] obvious place to start is the Rubik's Cube. So, why is the Rubik's Cube a group? Well, to be specific, it's a finite group because there's only a finite number of scrambles you can make. You might even know that number. It's about 43 quintillion possibilities. That's called the order [music] of the group. And each state is an element of the group. It's a little bit of a confusing term because the elements are not the moving parts of the cube. Those are actually called [music] the points of the group. Here they are labeled. And the total number of points is called a group's degree. Every move of the Rubik's Cube is just a reshuffling of these points. So, it's called a permutation group, which is what most twisty puzzles are. The Rubik's Cube has six different moves. These are called [music] the actions of the group, and together they form the generator of the group. Of course, there is many different choices of generators. We could have added double turns so they count as one move instead of two, or we could even remove one since, for example, you can generate the D move from the others with this monstrosity. In fact, all 43 quintillion Rubik's Cube states [music] can be reached with only two generators. This is known as the group's [music] minimal generating set. So, theoretically, you could solve any cube using only these two moves, but good luck with that. If we only look at one action by itself, what we'll always have is a cyclic group. [music] Repeating the action must eventually come back to where you started. The way to represent this action mathematically is with cycle notation. It might look scary, but it's pretty simple. Each group of parentheses is a cycle that occurs. So, one moves to three, three moves to eight, eight moves to six, and then six moves back to one again. Same for the rest of these. Another, more visual, way to represent actions and generators is with Schreier graphs. The nodes are simply the points, and each colored set of directed edges shows where the points move by each action. Here's how that looks on the Rubik's Cube. >> [music] [music] >> By the way, this is different from Cayley graphs, which are way more common. Instead of the points as nodes, Cayley graphs use the elements of the group, which means if I wanted to show you the full graph for the Rubik's Cube, I need 43 quintillion nodes. [music] So, it's not as helpful for large groups. Now, fundamentally, these six actions kind of do the same thing. They move the same number of points the same way, just on different faces. That symmetry means they're all part of the same conjugacy class. Combining two of these moves can form an entirely different conjugacy class. >> [music] >> And there's thousands of these classes for the Rubik's Cube. The last and trickiest thing you need to understand are normal subgroups. These are special subgroups where you can apply their action in any order. It's much easier to explain with an example. So, how about the subgroup of just right turns? [music] Is that a normal subgroup? Well, if it was, it would mean we could make a right turn and then any other set of moves and get exactly the same result [music] as if we first made the set of moves and then the right turn. This is obviously not the case. So, right turns are not a normal subgroup of the Rubik's Cube. But, can you think of any subgroup that does have this property? If you're really familiar with the Rubik's Cube, you might know one of the answers. It's the superflip. It's an algorithm that flips all the edges on the cube. Doing the superflip before a scramble or the same scramble then the superflip is always the same result. However, not all groups have normal subgroups, well, besides the identity and themselves. These special groups are the finite simple groups, >> [music] >> and they're very similar to prime numbers in that sense. There was a huge decades-long effort to classify all of these groups, which ultimately concluded with 18 infinite families plus 26 that didn't seem to fit in, which were called the sporadic [music] groups. Okay. So, how can I make a puzzle out of a sporadic group, or >> [music] >> any group for that matter? Well, let's start with one of the simplest sporadic groups, the Mathieu group M12. >> [music] >> To work with this group, I'm going to use the open-source software GAP, which is made for this kind of stuff. [music] I was already a little familiar with it because I used it to generate the regular maps in this video. So, I'll start by loading up the group. This group is degree 12, so the puzzle's going to need at least 12 [music] pieces. And here's a look at the conjugacy classes. The number I added here is how many pieces are moved by each type of action. Ideally, for a twisty puzzle, we want actions that move less points. But, for this group, any action [music] we do has to move at least 2/3 of the pieces. This is very different from the Rubik's Cube group, where [music] twists only move 1/3 of the puzzle. In fact, all the sporadic groups are like this, where any action has to move [music] most of the points, which makes them hard to design puzzles for. The next challenge is [music] finding a generating set for the group that's as simple and symmetric as possible to make a clean-looking puzzle. I made a script that tries all combinations of two generators to see which one generates the group. And then, I made a second program to visualize the Schreier graphs. Now, I just look for the most symmetric and simplest graph that I can turn into a puzzle. This one was my favorite, [music] where one action rotates these pieces together in the same direction, and the other action rotates these pieces in opposite directions. After a quick [music] sketch, I created a 3D model, got it printed, and I ended up with my first sporadic group puzzle, the M12. I love how this one looks. The special thing about the M12 group is that it's sharply five transitive. That means that any five pieces can move to any five spots on the puzzle in exactly one way. The other seven pieces are uniquely determined. That means if you solve any five pieces in the right spot, the rest [music] of the puzzle is guaranteed to be solved. And it's the only group with that property besides just five points. That doesn't make the solving any easier though. The difficulty and number of algorithms you need is similar to solving a 2x2 Rubik's Cube, but it solves so differently from any other twisty puzzle. I've also printed a few extra for a small limited sale. So, if you want to get your own, check out the description. Otherwise, I also have the files for 3D printing if you want to make one yourself. Now, this isn't the first puzzle of the M12 group or even of the same design, but I do think it's the most elegant and the easiest to understand that I've seen so far. And I'll show you how to actually solve this thing at the end of the video. So, what other sporadic groups can I turn into physical puzzles? I found designs for the other Mathieu groups that would work, but they're not quite as elegant or symmetric. But, that's until I started looking at the largest Mathieu [music] group, M24. This group needs to move at least 16 pieces at a time, so I'm going to need a lot more gears. This map is especially elegant because the way these five cycles are arranged maps almost exactly to a dodecahedron. [music] >> There's just one problem. The action that swaps the pair at [music] the top is not supposed to swap them with each other. They're each supposed to swap with an additional piece. But, there's no space to cram that in. Then, I came up with a crazy idea. What if I change the axis of rotation for just this edge so that it swaps pieces >> [music] >> inside the puzzle? Well, I modeled it and it can work. It's just [music] a very complicated design. The five-cycle action needs to rotate all four of the large pentagons and the other action needs to turn seven edges by 180°. >> [music] >> This ended up needing over 100 parts, including 24 gears for the mechanism. By far the most complicated design I've ever made. Well, I did it and here's [music] the real thing. It's really fun, but man, it was such a pain to make. I used Blender scripting to procedurally generate most of it because I wasn't savvy enough with CAD to model the weird dodecahedral angles. But, the tolerances turned out to be way too tight and I ended up needing like 8 hours of sanding to get it turning smoothly. So, I really don't recommend anyone actually print this. It needs a complete redesign, but I'll publish the files anyway. The difficulty and number of steps to solve this one is much more like the 3x3 Rubik's Cube, but again, it feels so different from any other twisty puzzle. It's extremely challenging with over 240 million states. I don't think I could have solved it without a computer search for the algorithms, but I have them all memorized now and I'll show you how I do it at the end of the video. As far as I know, this is one of the only physical puzzles to use the M24 group. Could we go higher though? Would a twisty puzzle of the monster group be possible? Well, sorting all the sporadic groups by degree, the next highest ones are the Janko group J2 and the Higman-Sims group, which both have 100 points. And at least 80 of [music] those points need to move for any action. I tried looking, but none of the Schreier graphs were planar, let alone symmetric enough to reason about. So, any type of physical puzzle would be ridiculously complicated. And it doesn't get better from here. Do you want to guess how many moving pieces a monster group puzzle would need? Is it 1,000? 196,883? Nope. >> [music] >> It's actually about 97 quintillion. In the same ballpark as the number of grains of sand on Earth or scrambles of a Rubik's Cube. So, it's not going to happen. The permutation group can't even fit on a computer. Anyway, I'm pretty happy with these puzzles I was able to make. So, how do they actually feel >> [music] >> to solve? Major spoilers coming up if you ever want to try solving them yourself. >> [music] >> But here's how I solve the M12 puzzle. The main idea is that we want to solve these four [music] fixed points first, so that hopefully the last fifth point will just be a single turn away. >> [music] >> I start with the top left corner, which are the red, white, and red, yellow pieces. These two I don't really have an algorithm for, but they're not too hard to figure out just by fiddling with it for a bit. Orientation doesn't matter since there's only one way it can go. Once these two pieces are in place, the next step is getting this bottom one. And there's an easy algorithm to get it from here to there. The way I represent algorithms is that I start with the orange wheel and then alternate back and forth with the green one. A right turn means clockwise and a left turn is counterclockwise. So, if the orange white piece is somewhere on this wheel, you can just align it to the top and then run this algorithm. Yep, it's just right, right, [music] right, right, right, right, right seven times. But if the orange white is on the other wheel, there's this simple algorithm that swaps all the pieces between the two wheels, leaving the other points fixed. It's double right, double left, left, double left, double right. Now you can run the previous algorithm. If the orange white happens to be in this spot, just use the same algorithm to free it up and then run it again once it's in the right position. [music] Next, we need the orange yellow piece. This algorithm brings it from over here to there. So, get it in position and then it's just left, left, [music] right, left, left, right, right. Again, if the piece is on the opposite wheel, you can just swap it over to the first one. >> [music] >> Anyway, after you do this, there's a 50% chance you're already done. Just spin the green wheel until they line up. >> [music] >> If not, all you have to do is swap the wheels again and then you'll be done. So, that's how you can solve the whole thing with only three algorithms. Now onto the super challenging M24 Beast. I start with the internal slots under here, which need to be filled with the black red and black orange pieces. I don't really do this part with an algorithm. I just kind of work it out. Working backwards, they need to end up here, which means they need to end on opposite sides of the red and orange wheel, which means [music] they have to be neighbors on the green or blue wheels. >> [music] >> Once those are in, I work on the far edges. The black green one needs to go here, which I can do with an algorithm. The notation I use is a little different. The vertical bars represent the two swaps, and the R and L turn the big wheel clockwise or counterclockwise respectively. There's two different algorithms that shuffle the green black around to different discs, and it'll eventually reach the target. >> [music] [music] >> Now that that's in, I need the black blue edge. This algorithm is a little longer, but it's the only one you need to shuffle it around. Once those are all in, it's kind of like we're starting the top layer of a Rubik's Cube. We're going to get this side all red, which it either already is or But, reds match one of these three possibilities. Even though there's three different algorithms, one is just the same with the left and right swapped, and the other is the same but using a double turn. Now that this side is all red, we only need one last algorithm, which swaps the red pieces like this. Again, it's the same algorithm from before, but swapped and squared. This one might need to be repeated up to three times to rearrange the pieces, but once they're in the right order, the rest of the puzzle will be solved. >> [music] >> And there you have it, the M24 puzzle completely solved. Thanks for watching. >> [music]
