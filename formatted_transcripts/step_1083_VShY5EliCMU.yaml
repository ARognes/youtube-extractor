transcript: creating a CSS input that grows based on the text inside of it used to require a ton of JavaScript and was incredibly difficult but now with CSS it just requires one single line of CSS code field sizing content this just allows the actual size of an input to scale with the size of the content it works with selects inputs and most importantly text areas so you can see that this is able to grow based on whatever content I have inside of it now unfortunately this feature is not in all browsers yet as Firefox is lagging behind but it's a really nice quality life feature you can start adding as a progressive enhancement and if you want to learn more about exactly how this feature works I have a full video it'll be linked at the bottom of the screen
