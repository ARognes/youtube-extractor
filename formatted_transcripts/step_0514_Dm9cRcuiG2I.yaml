transcript: According to leaked documents, last year  Meta made $16 Billion dollars from scammers buying ads on Facebook and Instagram,  that's 10% of Meta's entire revenue. Also in your hacking news roundup, one the  internet's favourite archiving tools is under threat, and a defence contractor  secretly sells exploits to Russia. But first, the kind of Facebook  ads that try to scam your grandma out of her life savings are making Meta rich. This comes from documents leaked from within Meta  itself, documents which somehow made their way into the hands of Reuters, who published  a special report that I'll link below. It reveals that in 2024, Meta themselves  estimated that 10% of their revenue, that's $16 billion dollars came from people  paying to advertise scams and banned goods. And Meta really isn't doing much about  it, worried about "violating revenue". But, one of the strange ways Meta does claim  to be tackling scammers is called the 'Penalty bid program', if their automated systems  think you're buying ads to scam people, they'll start charging you higher rates for  ads. Meta says this disincentivises scammers from advertising on the platform. But it kinda  looks like they're happy to take dirty money, as long as they get paid a little extra for it. And even if Meta identifies an  advertiser as being a scammer, don't expect them to get banned. A small  advertiser would have to get flagged for promoting financial fraud at least eight times  before Meta banned them, but for big spenders, "High value accounts", those guys can get  500 strikes before Meta shuts them down. In May this year an internal presentation by  Meta's own safety staff estimated that their platforms facilitated a third of all successful  scams in the United States. It's madness, but, isn't Meta scared of being fined  by governments for this. Yes, but no. Meta internally acknowledged  that fines for scam ads are certain, an inevitability. And anticipates penalties of up  to $1 billion dollars. But if my math is correct, $16 billion is much bigger than $1 billion. Now,  if you were being uncharitable you might say that Meta would only care about addressing  the problem if the fines were bigger. But another document seems to confirm this, it  says that rather than voluntarily agreeing to do more to vet advertisers, the company's  leadership decided they'll only do more in response to impending regulatory  action, in other words bigger fines. Meta dispatched a spokesman, who didn't disagree  with this, but just said it wasn't company policy. Another document reveals just how Meta feels  about scammy ads, saying that they classified scam ads as a "low severity" problem,  viewing them as a bad user experience. But all hope is not lost, it turns out there are  some scams that Meta desperately wants to stop. Meta directed staffers to focus on fraudsters  masquerading as celebrities and major brands. Now, you might remember earlier this year a  woman was scammed by someone pretending to be Brad Pitt on instagram, who sent her  AI generated pictures of him in hospital begging for cash. That ended in her being  scammed out of almost a million dollars. But let's not kid ourselves, Meta  isn't concerned about the victims here, Meta is more concerned about "impersonation  scams" upsetting the brands and celebrities being impersonated, and thus threatening  to reduce user engagement and revenue. Meta's internal documents do say they want to  crack down on fraudulent ads more widely, reducing them from 10.1% of revenue in 2024, to 7.3% by  the end of this year, and down to 5.8% in 2027. But, It really feels like they're  dragging this out as long as possible, and that's a choice, because it's not  like they can't detect scammy ads. They even categorise ads by how legally risky  they are. By Meta's own numbers, ads that fall into the high risk category earn them $3.5  billion dollars every six months! With them noting that this alone certainly exceeds "the cost  of any regulatory settlement involving scam ads". And some Meta employees do seem to understand  how ridiculous this all is. One employee started issuing regular reports on that week's, "scammiest  scammer" showcasing which advertiser that week had generated the most user complaints - not that Meta  would do anything about it though. Reuters checked 5 of these scammiest scammers and found that  6 months later two of them were still active. So that's the state of fraudulent ads on  Meta, the full report is linked below. Next up, one of the internet's favourite  archiving tools is under threat. You've almost certainly at  some point used archive.today, probably to bypass a paywall, not that  I would ever condone such behaviour. The site spawned in 2012, quickly  becoming a popular internet utility, gaining rare status as kind  of furniture of the internet, it feels like it's been around forever,  hasn't changed much, and just works. However it's owner has remained a total mystery,  but that could be about to change. The Canadian registrar which hosts the domain received  a subpoena from the feds. "GREETINGS", "You are hereby commanded  and required to disclose", a whole bunch of personal information... name,  address, phone number, credit card numbers, essentially a total dox on the  "customer behind archive.today". The feds said, "you are requested not to  disclose the existence of this subpoena", but this seems to have been ignored,  with the company giving the owner of the website a heads up, who spilt  the tea, rather unceremoniously on X. The subpoena says that this is related  to a "federal criminal investigation being conducted by the FBI", but there's no  indication of what crime has been committed. The obvious explanation is this has  something to do with news websites not being too thrilled with people bypassing  paywalls and reading their content for free. If this is what gets archive.today taken  out, it wouldn't be the first casualty, earlier this year the paywall bypassing  service 12ft dot io was scrubbed from the interwebs following efforts of the news media  alliance. An organisation which represents the interests of thousands of media companies and who  you can imagine has some pretty expensive lawyers. Archive.today could be next on  the hit list, though fun fact, the US government themself actually uses the tool,  here's a recent article from the white house, and buried within is a link that leads  you to an archive of a reuters article. And just so we're on the same page, we're talking  about archive.today here, not archive.org which does give website owners a way to opt out, is a  registered nonprofit, and we know who runs it. Archive.today in contrast doesn't have any of  that. There have been attempts to unmask it's owner, and I'll link one investigation below, but  spoiler alert, best guess it that it's probably run by a Russian guy as a labor of love, rather  than some kind of money making venture. If that is the case it's unlikely the feds will have  much luck with their criminal investigation. Next up, betrayal in one of America's top defence  contractors. L3Harris is a company well known for making things go boom, but they also have a  division which deals in cyber capabilities, Trenchant. You won't find much information on what  these guys actually do, because as they admit, they're pretty secretive, but it's  widely reported that Trenchant makes spyware and other assorted hacking  tools for Western governments. Enter 'Peter Williams', the boss of Trenchant,  he's a 39 year old Australian. And you'd think an executive of a defence contractor would make  decent money, but however much he was making, it wasn't enough apparently, because 3  years ago Peter decided that he wanted more. Court documents describe Trenchant's  network as highly secure. It requires multi factor authentication, you can only  work on it from air-gapped computers, and it's secured behind locked doors. But all of this was totally irrelevant,  because being, quite literally the boss, Peter had 'super-user' access to the network.  So it wasn't hard for him to sneak in an external hard drive, and simply copy over the  company's valuable zero day vulnerabilities. Zero days vulnerabilities are the way  in which spyware infects a device, often exploiting some bug in what's often a  messaging app. And they're incredibly valuable. What you're looking at here is the price  list from 'Operation Zero' - a Russian exploit broker happy to pay stacks of  cash for high value zero days. These guys are clear that they then only sell  those exploits to non-nato countries. It's reported that this is the exploit broker  Peter went with, using the Pseudonym 'John Taylor' to sign a contract with them, selling off  one zero day for $240k. But over the course of the next three years he managed to make $1,300,000  dollars from 8 different vulnerabilities. But eventually Trenchant caught up, and was  alerted to some kind of a leak. One of their zero days had somehow ended up in the hands of a  South Korean exploit broker. Trenchant of course, launched an investigation, and given Peter was  the boss, he was able to closely oversee it. He agreed to a voluntary interview with the  FBI, who asked him how he thought the zero days were stolen. Peter then proceeded to  explain exactly how he did it, physically accessing the network and transferring  the files to an external hard drive. The FBI then just straight up confronted  Peter with all the evidence they had on him, and it doesn't look like he had much choice but to  fess up, pleading guilty and is now facing up to 10 years in prison. As part of his plea agreement  he's forced to give up all the crypto he earned, as well as what he spent it on, which includes  quite an extensive list of watches, but it's unclear if he knew that half of these watches are  actually fakes. Scammer gets scammed, I guess. As always thanks for watching and I'll see  you in the next video, have a good one!
