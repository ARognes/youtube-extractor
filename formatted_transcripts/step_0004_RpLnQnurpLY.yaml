 is very simple. Before jumping far away, take a good look at those close to you. Think of a calm steel pond. You throw a small pebble right into the middle of the pond. The ripple created the moment the pebble hits the water spreads out perfectly in a circle, doesn't it? At first, it's a tiny circle or the very immediate area. Then that circle gradually grows larger and moves to distant areas. BFS works exactly by the rule of this bond ripples. Suppose we start our search from your profile on Facebook's massive network. BFS won't jump straight away to your friend's friend's friend. It will first check the profiles of everyone in your immediate circle. That is your first level direct friends. Just like that first ripple in the pond. Once it finishes checking all your direct friends, it will step into the second level. Meaning it will start checking all the friends of your friends one by one. In this way, it spreads out evenly level by level to scan the entire network. This beautiful sequence. First the people close by, then the ones further away. To keep this sequence in memory, we need the help of a Q. When Facebook or LinkedIn shows you people you may know or friend suggestions, they are actually using this magical BFS algorithm. Now let's think about this in a different way. In real life, when we leave home to head somewhere, what is our main objective? It is how quickly we can reach our destination in the least amount of time and at the lowest cost. Isn't that right? this weighted graph from one city to another finding the shortest and best route which we call the shortest path. How do we find that? The world famous algorithm that provides the solution to this great problem is called Tastra's algorithm. The funny thing is that Dutch computer scientist Edgar Destra reportedly discovered this groundbreaking algorithm while simply drinking coffee. Assume you are now in Dhaka and your destination is Chitagong. You have to pass through several cities or junctions in 