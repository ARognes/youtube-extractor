e and it will bring all the numbers larger than 50 to its right side. As a result, our leader 50 will land in its exact correct position because everything to the left of 50 is smaller and everything to the right is larger. Now quick sort will choose a new leader for that small left section and it will choose a new leader for the large right section by dividing into small groups and selecting leaders. This way a list of millions of data points will be sorted in the blink of an eye. In real life when we call a sort function in most of the world's programming languages quick sort or mar sort silently works for us behind the scene in memory. Now we'll talk about a concept that feels like a puzzle when heard from the first time or seen in court. This wonderful thing is called recussion. Simply put, when a task or function calls itself repeatedly to solve its own problem, that is recussion. Giving two examples from real life will make the matter crystal clear in an instant. Have you ever been to a salon or dressing room where there's a huge mirror on the wall in front of you and another one right behind you? Have you ever noticed what happens when you stand in the middle? You can see the back mirror inside the front mirror. And inside that back mirror, you see the front one again. Inside that another smaller one with you looking even smaller. And this image continues to repeat into infinity getting smaller and smaller. One mirror reflecting itself over and over. This is recursion in its living form in nature. I can give you another example. For those who have used the OBS screen recorder, if you select your desktop as a scene in OBS, you'll see the fun. You can see an infinity recursion there as well. Or consider those famous Russian wooden dolls. If you open the lid of a beautiful wooden doll, you can see that inside it looks exactly the same, but there is another doll sitting inside that is a bit smaller. Opening that one will reveal a third, even smaller doll. a smaller version of the same doll hiding inside the belly of the larger one. This is recursion. In the world of programming, it is famously called the Russian nesting doll. Suppose I ask you to find the sum of all numbers from 1 to 100. If you think in terms of recursion, you might say adding 1 to 100 is quite a task. Let's do this. Set the number 100 aside and tell my younger brother to get me the sum of numbers from 1 to 99. Once he brings it, you add 100 to it and that's it. But your younger brother isn't that foolish either. He sets the number 99 aside and calls his younger brother to bring him the sum from 1 to 98. In this way, each brother keeps calling a smaller version of himself to solve a problem that is one step smaller. The call eventually reaches the very youngest brother who has only one number in his hand which is one. Then that little brother will say the sum of one is just one. He doesn't need to call anyone for that. He sends the one back to his older brother. He adds two to it and sends it back to his older brother. In this way, the sum builds up from the very bottom one after another until it finally reaches your hands and you get your desired answer. 5050. Notice that the last little brother for whom the problem became so tiny that there was no need to call anyone else. In programming terms, this magical moment is called the base case or the stopping condition. If you don't provide this correct base case in recussion, you are in big trouble. The code will then keep looping forever. Just like the two mirrors in the salon, on one point, the computer's memory will be completely filled up and the program will crash with a critical error which is called a stack overflow. Whether it's merge sort, quick sort or the stories of three data structures we have heard, recussion is the most intelligent and precise way to handle them. Do you know why? Because if you look closely at every branch of a tree, you'll see that it is actually a small tree itself. An extraordinary application of this recursion and a almost magical practical implementation of it is backtracking. The name itself suggests following your own footprints back to the starting point. Take your daily life for example. When we look for a path in an unfamiliar place, we start walking down a road. If we suddenly hit a high wall or a dead end while walking, do we just sit there and give up? Not at all. We calmly retrace our own footsteps back to exactly where we came from, to the point where we took the wrong turn. Then standing there, we try a different path. Moving forward on a path and stepping back the moment we see an obstacle or dead end and searching for a new path. This entire clever technique is called backtracking. In computer science, this concept is perfectly explained by the popular puzzle game sudoku. You must have seen the 9 into 9 grid it uses. And numbers from 1 to 9 have to be placed so perfectly that no number repeats in any row, column or 3 into three box. Now, do you know what a computer does when it is given a different sudo to solve? It first tries placing a one in the very first empty cell. If the rules aren't broken, it confidently moves to the second cell and places a two. It keeps moving forward like this step by step. But as it progresses, let's say it reaches the 25th empty cell and realizes that no matter which number from 1 to 9 it places, it breaks one rule or another. There is no way to move forward. A complete dead end. Right at this point, our clever backtracking algorithm doesn't panic at all. It quickly calculates that since nothing works in the 25th cell, it must have placed an incorrect number in the 24th or 23rd cell earlier. In an instant, it steps back from 25th cell to the 24th. It clears the previous wrong number and attempts to place a new correct one. Even if it doesn't find a solution in the 24th cell, it takes another step back to the 23rd cell. By relying on this magic of retracing footsteps when a mistake occurs, c