ith equal rights. This wonderful network of two-way relationships is called an undirected graph. Now, let's think about Twitter or Instagram. If you follow a famous celebrity there, it doesn't mean that the celebrity follows you back. The relationship here is completely one way. information or updates will only come from their profile to yours. None of your news will go to them. This type of network with oneway directional arrows is called a directed graph. Let's go back to Google maps. Suppose there is a road from Taka to Chagang and there is also a road from Dhaka to Cellet. The two roads are not the same. The distance from Dhaka to Chitagang might be 250 km taking 5 hours. On the other hand, the distance from Dhaka to Sillet might be 240 km. But it takes 6 hours. When each connection or road in our graph is associated with a calculation of distance, time or cost which we call wet, it is called a weighted graph. Google maps or Uber always uses this weighted graphs to calculate exactly which route will save you both time and fuel. And if there is no calculation of distance or cost between the connections, what do we call it? For example, my friendship with you on Facebook has no kilometers or weight attached to it. This kind of simple connection is called an unweighted graph. Finally, let me tell you a great truth. All the studying we did about trees. Trees are not actually things from another planet. A tree is just a special form of a graph. If you apply two strict rules to a graph, first there cannot be any cycles, meaning there should be no path that loops back to where you started. And second, every child must have only one parent. Then you will see that the graph magically transforms into a tree. Once you understand this small relationship, you'll be surprised to see that everything from arrays to graphs are actually members of the same family. They have just taken on different forms to meet our various needs over time. So far we have seen how our data can be 