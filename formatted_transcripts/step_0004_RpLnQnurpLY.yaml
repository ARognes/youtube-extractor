ery thing we just learned about as its engine. Today, whenever you pull your phone out of your pocket, open Google Maps or Uber and see those directions with a beautiful blue line appearing on the screen, know that right behind that line, our Destas algorithm and priority Q are working tirelessly. Almost all of the thousands of algorithm in the world are fundamentally built upon four core philosophies. Once you grasp these philosophies, you'll be able to understand and even create new algorithms yourself. The first of these philosophies is called the greedy approach. In the world of algorithms, being greedy has a wonderful meaning. The core idea is to stop worrying about what might happen in the distant future for now. Just grab the option that seems most profitable or best right in front of you at this very moment without any hesitation. To understand this, let's think about a shopkeeper giving back change. Suppose you go to a store and buy items worth 68 taka. You give the shopkeeper a 100 taka note. He needs to give you 32 taka back in change. The shopkeeper's goal is to return this 32 taka using the fewest number of notes or coins possible. He first looks at the largest note in his cash box. 50 taka is larger than 32 taka. So he cannot give that. Then he picks up the next largest note which is 20 taka. Without calculating anything for the future, he greedily hands you the largest 20 taka note. 12 taka remains. Now to settle this 12 taka, he again looks for the largest note in his box. He picks up the 10 taka note. Two taka remains. Now to settle the two taka, he simply hands you a two taka coin. Notice how perfectly he settled your 32 taka change using only three notes or coins. At every step, he chose the largest option available at that moment and that resulted in the best solution for the entire problem. TA's algorithm works using this exact same strategy. But yes, one thing must be remembered. The greedy approach cannot provide the best solution everywhere. Where a momentary gain can cause damage later on, we must turn to other philosophies. Let me give you a small example. For instance, when you go to purchase an educational course, generally good courses are more expensive, but you always try to choose the one that is cheaper. In this case, Triasto's algorithm will not work. The second philosophy is called divide and conquer. The ancient Roman Empire ruled the entire world by utilizing this very policy. Their strategy was brilliant. Instead of engaging in a direct frontal war with a massive and powerful enemy force, they would strategically create divisions among them. Break them down into small groups. Once the enemies are divided into small and weak groups, you can easily defeat them by fighting each group one by one. And once all those small groups are defeated, the entire empire will be in your hands. In computer science, this philosophy works in three steps. The first task is to break the massive problem in front of you into smaller sub problems. Next, solve or conquer these small problems individually, usually by using recussion. And at the very end, combine those conquered solutions together to construct a complete solution to the main problem. The mar sort and quick sort that we have heard of are excellent examples of this divide and conquer philosophy. Just like Mars sort takes 10 million pieces of random data and keeps cutting them down into individual small pieces. Then it sorts them into small pairs and conquers them. And finally, it joins those sorted pieces together to give us a perfectly sorted list of the entire 10 million data points. Binary search also does the exact same thing. every time it opens a book from the middle house the problem and finds the correct word. The name of the third philosophy is dynamic programming which is known as DP for short. Its core concept is so simple that even a small child could easily understand it. Its entire philosophy stands on a very simple piece of real life intelligence. Suppose a task or calculation you once struggled to do in the past. Write down or remember the result of that calculation somewhere. If you need to perform the exact same calculation again later, would you foolishly repeat all that same hard work from the start? Not at all. You directly use the previous result you remembered. Suppose I write 1 + 1 + 1 + 1 + 1 on the board in front of you. How much is it? You count quickly and say five. Now I add another + one to the far right of the same equation. It won't even take you a second to find the answer. You'll immediately say six. You didn't sit there and count from the beginning this time because you know that adding the previous five ones equals five. So you simply added the new one to the old result of the five that you had remembered. This magical process of writing down or remembering the results of our past calculations in memory or a table is technically called memorization. Think about the Fibonacci series in mathematics. There every new number is the sum of the two numbers immediately preceding it. If you ask a computer to find the 50th number of the Fibonacci series using simple recussion, it will perform the same small calculations billions of times without even realizing it. It could take hours or even days for the test to finish. But if you add dynamic programming or memorization to it and tell the computer, hey, just write down the calculated result in a diary, then the same calculation that took the computer days to solve will be done in a second. So whenever you see the same small problem recurring in a complex task, you will know it's time to use dynamic programming. And the fourth philosophy is the very familiar backtracking. We have seen this in the solutions to sudoku and mages. When you have countless alternative paths in front of you and you have to try them all to find the correct solution and if you hit a dead end, you have to step back and take a new path. That is exactly when backtracking becomes our best tool. Think deeply for a moment. Did any of the topics or concepts I just talked about fall from the sky? They didn't. When it became difficult to insert data in the middle of an array, the link list was born from that very problem. When we needed to control the sequence of data storage, stack and Q emerged. When we needed the speed to search for data in the blink of an eye from thousands of records, hash tables and binary search trees were born. Again, when we needed to store real life complex networks and relationships in memory, graphs came along. Every data structure and every algorithm is connected to one another at the root. Together, they form a vast and beautiful family that keeps our world of software and technology running. Knowing these concepts will create a very powerful and clear map of the entire subject in your mind. Now, it is time to put this knowledge into practice. Pick any programming language of your choice and start building the concepts we learned today in your memory by writing the code yourself. When you write the code yourself, you won't be blindly memorizing anything anymore. You will feel exactly what magical events are happening inside the memory behind every line of your code. Happy coding.
