transcript: Data structures and algorithms don't have to feel like an intimidating wall of complex jargon and syntax. In this comprehensive crash course, Sue meets Shaha will teach you foundational computer science concepts using relatable real world analogies without writing a single line of code. You will develop a clear intuitive mental model of how data is stored, searched, and optimized. Once you master the underlying logic and problem solving mechanics here, implementing them in any programming language becomes easy. >> All right, let me start with a very simple question. Think a little before you answer. Has this ever happened to you? You are holding a long grocery list for the month and searching for the most expensive item. Or say while scrolling through your contact list, you suddenly see that a friend's number was saved twice by mistake. It also happens that you woke up in the morning and make a to-do list for the day. As you finish your tasks, you cross them off one by one with satisfaction. Suddenly, an urgent task pops up and you place it right at the top of the list. If you have done even one of these things in your life, let me tell you a secret. You have already practiced data structures and algorithms. Yes, without realizing it, you have thought like a programmer, organized data, and used a specific path or algorithm to solve those problems. The only difference is that you didn't know these have fancy complicated names in computer science textbooks. The real trouble starts with our fear. Whenever we hear these complicated names in books or tutorials like arrays, link lists, pig notation, time complexity or recussion, an invisible wall instantly goes up in our minds. Suddenly, it feels like, "Oh boy, this must be some incredibly difficult math stuff. No one but a rocket scientist could possibly understand this. It seems like it has nothing to do with our common daily thoughts. But do you know the truth? We are constantly using these things every day in our heads, at our desks, in the kitchen or in the smartphone in our pockets. Today we are going to break that very fear. We will bridge the massive gap that has formed between our everyday familiar experiences and these difficult computer science terms. Today we'll dive deep into data structures and algorithms. But it won't be like those monotonous boring classroom lectures at all. We'll proceed like a beautifully organized story where everything is interconnected. We'll look for the story behind why we move from one topic to another. You'll see that nothing feels disconnected or like something you have to memorize without understanding. And you know what the fun part is? Throughout this entire journey, we won't write a single line of code on the screen. You know why? Because the AI will write the code, right? But you'll realize by watching this full video that data structures and algorithms can be learned even without writing code. Not only that, but this is actually the best way to learn it because we'll try to understand the mechanics behind it. Our main goal will be to understand what these things do behind the scenes, why they do it, and which one comes in handy when we face a problem. Once you grasp the actual logic behind something, translating it into code in any programming language, be it C++, Java, Python or JavaScript, is simply a matter of time. Once these concepts become clear, a fantastic mind map of the entire subject will be drawn inside your head. Then you will see that you can effortlessly tell yourself exactly which data structure will work like magic to solve a particular problem. As soon as you step into the world of programming, you hear a term data structure. But have we ever asked ourselves why we need to organize data in such specific ways? Data is just data, isn't it? No matter how we leave it in our system, we should be able to find it when we need it. Then why all these unnecessary rules, complicated names, and such complexity? To find the answer to this question, let's take a look at the desk in our study room. Close your eyes and think for a moment. On your desk, all your notes, exam papers, electricity bills, and bank statements from the last 5 years are piled up in a huge disorganized heap. A literal mountain of paper has gathered on the table. Suddenly, your father comes and asks you to find the electricity bill from March 3 years ago. He really needs it. Now, think what will your situation be? How long will it take you to find that one specific paper by digging through that huge mountain of messy papers? Maybe hours will pass and the whole room will be a mess. You'll be completely drenched in sweat. It could even happen that after searching everywhere and turning the world upside down, you still won't find the paper. Let's change this scene a little bit. Suppose there is no mountain of messy paper on your table. Instead, there is a very nice file cabinet kept there. The cabinet has separate drawers for each year. For example, 2022, 2023, 24 and so on. Also, inside each drawer, there are separate folders neatly organized by month for instance January, February, March. Now, if your father comes and asks for that specific electricity bill, what will you do? You will go straight to opening the 2023 dryer. You will take out the march folder from there and in the blink of an eye within just a few seconds hand the correct paper to your father. If you look closely you will see that the core elements or data between the first and second scenes haven't changed even a bit. The papers are exactly as they were before. The information inside the papers is exactly the same. Only one thing created the difference. How the papers were organized. And just because of this difference in organizational method, hours of backbreaking labor turned into a simple task taking only a few seconds. Our work speed increased a thousand times. This is exactly the core philosophy and real power of data structures. When we work with thousands, millions or billions of data points in computer memory, if we leave them scattered randomly, the computer will struggle immensely to find the data. Our software or app will slow down, hang or simply crash. Data structure means organizing data inside memory in such a smart and tidy way that it becomes very easy to work with the data later on. For example, finding something quickly, adding new data or deleting unnecessary data. This task should be done extremely fast and at a much lower cost. There is a very important point here that we need to fix firmly in our minds which will be helpful to us at every step ahead. When we perform a task, the calculation of how much time and memory the computer consumes to do it is what we call efficiency. We do not need to get into the nitty-gritty of heavy mathematics or complex equations. Just remember this simple truth. If you organize the same data in different ways, the speed of your program will also be completely different. This one line will remain the key to our entire journey ahead. From this urge to organize data, the oldest and the most fundamental data structure of programming was born named array programming. We have all been more or less introduced to it during our early days of learning. Let's try to understand how it actually works internally using an example from our familiar world. Surely you have the experience of watching a movie in a cinema hall. At the entrance, we look at the ticket in our hand which might say row A seat number five. What are the hall seats like? placed right next to each other arranged in a straight line. Set number two is right next to seat number one and right beside it is number three. It continues in this way. Now think about it. When you enter the hall, do you go to the person sitting in seat one and ask brother where is seat number five? Then do you ask the same question to someone in seat two? Not at all. You know very well that seats are arranged sequentially and each one has a specific number. Without anyone's help, you can confidently walk straight to sit number five and sit down. The time it took you to sit in seat number five is exactly the same amount of time it would have taken to sit in sit number one or 10. In computer memory, this array works just like the seats in a cinema hall. When we create an array in memory, the computer like a very obedient child allocates blocks or spaces for us right next to each other in memory. There are no gaps in between and a specific serial number is assigned to each of these places. In programming language, we call this number an index. However, there is an interesting aspect here. Even though our general calculations start from one, the computer serial numbers start from zero. For some reason, computers seem to really like the number zero. The greatest magical power of an array is its instant access, which means the ability to reach data in the blink of an eye. Suppose your IRA has 10 million data points. You command the computer, bring me the data at the 5 millionth index. The computer will not search even a little bit. In a split second, it will go directly to that 5 millionth spot and hand you the data. In technical terms, this is called constant time complexity. Simply put, no matter how large the mountain of data is, if the specific index is known, the time to find it will always be the same. And that time is very close to zero. But as the saying goes, nothing in this world is perfect. This is true to the letter for arrays as well. Behind this incredible strength lies a huge weakness. Let's go back to that movie theater again. Suppose people are packed tightly in seats 1 through 10 in a row watching a movie intently. Suddenly the hall manager announces that for a VIP guest, a new seat must be placed exactly between seats three and four. Now imagine what a huge problem this is. There isn't even an inch of space in between. To insert a new seat there, the poor person in seat four will have to get up and move to five. The person at five will have to move to six. The person at six to seven. This way, everyone all the way to the end will have to leave their spot and shift one seat to the right. This will create extreme chaos and annoyance among all the people in the hall. Right? and a lot of time will be wasted doing this whole task. The exact same thing happens inside an array. When you try to insert new data into the middle of an array or want to delete data from the middle, the computer is forced to move all the following data one spot forward or backward. We call this shifting. Now, if the amount of data is small, it might not be a big deal. But if there are hundreds of thousands or millions of data points, then this task of inserting or deleting data in the middle becomes a massive time consuming and annoying job for the computer. So what is the solution? We want speed, but we don't want to deal with this hassle of inserting data in the middle. We need a solution where we can easily add new things whenever we want, wherever we want. And that too without bothering anyone. It is from this deep human desire that our next data structure is born. Its name is link list. To avoid the hassle of shifting seats and the pain of finding data in between, computer scientists came up with a brilliant idea. They said there is no need to keep the data packed tightly or side by side memory. Let them sit anywhere in the free memory space as they please. We will just provide a link of communication between them. This wonderful concept is called a link list. To understand this link list concept easily, we can think of a treasure hunt game. Many of you might have played this game in your childhood. What actually happens in the game? When you start the game, you don't have the entire treasure map or the addresses of all the locations in your hand. You only have a small note in your hand with the first clue or hint written on it. That note might say, "The next note can be found under that big mango tree in the garden." You run towards the mango tree and find the second note there. It says the next clue is hidden by the old well. This is how one note points you to the address of the very next note and you passing through one address at a time eventually find the treasure box at the very end. A link list works exactly by the rules of this treasure hunt game. Here we call each piece of data a note. Each note contains two things. Firstly, our actual data such as a number or a name and secondly the address or pointer to where the next node is sitting in the memory. In simple terms, the first data tells you where the second data is and the second one tells you the location of the third. Even though they are scattered here and there in the vast kingdom of memory, they remain strung together like a thread through this chain of addresses. Now think about it. How does the link list magically disappear at the hassle of inserting data in the middle like in an array? Suppose in our treasure hunt we want to add a new note or clue right between the second and third notes. Do you have to move the mango tree or the old well in the garden even an inch for this? Not at all. We just erase the address written on the second note and write the address of the new note there. And in the new note, we write the address of the third note. That's it. The work is done. Not a single piece of data in the memory had to be moved. Therefore, adding or deleting anything in the middle of a link list is extremely easy and very fast. But wait a minute. When we were talking about arrays, we said that there is nothing perfect in the world of programming. Everything is a tradeoff. Meaning to get something, you have to give something up. The link list did indeed give us the advantage of inserting data very easily. But in return, it took one thing away from us. This is the ability to reach any data in the blink of an eye. Just think, in a treasure hunt game, can you jump straight to the fifth note at the beginning? Never. No one knows where the fifth note is, except for the fourth note. And again, only the third note knows the address of the fourth one. So, you are forced to always start from the first note and work through them one by one to reach the fifth. In a link list, if you want to see the 100,000th piece of data, you have to start from the first one and cross 99,999 pieces of data before getting there. In terms of searching, it is therefore quite slow. This link list also has some interesting and useful types that we need to know about. First, let's talk about the singly link list. What we are discussing all this time is actually a singly link list. Its main characteristics is that it can only move forward. Each node only knows the address of the next node. It has no information about where the previous one is. It's a lot like a one-way street. Cars will only run in one direction. Now imagine you have moved forward in a treasure hunt game, but suddenly you feel the need to read the previous note again. In a singly link list, you cannot go back. You have to start all over again from the very beginning. To solve this hassle, the doubly link list was introduced. Here, each node doesn't just keep the address of the next data. It also carefully keeps the address of the data immediately preceding it. Meaning, this is a two-way street. If you want, you can go forward and you can also walk backward whenever you please. And the third type is the circular link list. Now, imagine the very last node in our list keeps the address of the very first node at its next address. What would happen then? The entire list would join up like a round wheel. It would have no beginning or end. You would just keep going around. Do you know where this is used? When you listen to music on your phone's player with loop or repeat mode on, you will notice that as soon as the last song ends, the first song starts playing again on its own. The concept of the circular link list is what works behind this magical task. So, what is the bottom line? Aries give us the power to find data quickly, but they get exhausted when it comes to adding or removing data. On the other hand, link lists give us the freedom to add or remove data in the blink of an eye. But to search for data, it has to work a long way. This is the true expertise of a good programmer. Choosing exactly which one is needed for which task. If you treat every problem with the same simple solution here, you are doomed. Does your app need to search for data repeatedly? then choose an array. Or does your app need to add new data in the middle frequently? Then go for the link list. This subtle knowledge of the difference will turn you from a regular coder into an expert software engineer. So far we have seen how to organize data in memory. Sometimes sidebyside like an array and other times scattered around and linked like a link list. But in real life we encounter situations where more than where the data is the important thing is the order in which the data enters and leaves. Based on this rule, two amazing data structures have been created named stack and Q. Let's start by talking about the stack. The simple meaning of the word stack is a pile or heap. To understand this, imagine a familiar scene in your dining table or kitchen at home. Suppose many dishes have been washed at home and now need to be organized. You place the first plate on the table. You place the second one right on top of the first, the third one on top of the second. In this way, a high pile of 10 plates is formed by placing one on top of another. Now, when you need a plate to eat, which plate will you pull out first? Would you try to pull out the first plate from the very bottom? Are you crazy? If you try to pull the bottom one, the whole pile will come crashing down. Naturally, you will pick up the plate from the very top. Meaning, the plate you place last is the one you are picking up first. The simple and natural rule of our daily lives is known in computer science terminology as lio or last in first out. This means the data that enters the system last will be the first one to come out. And the data structure that follows this rule to the letter is what we affectionately call a stack. There are mainly two operations that happen within this stack. When we add new data to the very top of the stack, that action is called push. Just like placing a new plate on the pile of plates. And when we remove or delete the data from the very top, that is called popping. Just like picking up the top plate to use for a meal. To be honest, we are using this stack every moment of every day on our computers or smartphones. We don't even realize it. For instance, when you browse the internet, suppose you go to Google first. From there, you click a link and enter Facebook. Then clicking another link takes you straight to YouTube. Behind the scenes, your web browser is arranging these pages in an invisible stack one after another, meaning it is pushing them. Now, if you click the browser's back button, do you go straight to Google? No, you go back to Facebook. This means the page you were on last is the one returning or popping first. Only by pressing back again do you reach Google. This is a living example of the stack in action. Again, suppose you are watching something in Microsoft Word or editing a photo in Photoshop. Whenever we make a mistake, we quickly press Ctrl Z on the keyboard to undo it. Right? Every time you type a new word or make a stroke on an image, the software quietly pushes those actions into a stack. Whenever you press undo, it pops the action at the very top of the stack which is the last thing you did and your document returns to its previous state. Don't be surprised in programming when a function is called memory uses a call stack in the exact same way. Now let's talk about cues. By now we have understood the stack rule. Whoever comes last lives first. But does this rule work everywhere in real life? Suppose you have gone to the bank to deposit money or are standing in line to buy movie tickets. You have been standing in the scorching heat since 8:00 a.m. and have reached the very front of the line. Then at 10:00 a.m. someone else comes along lazily and stands at the very back of the line. Now what would happen if the bank or ticket counter started working based on the stack rules? The person who arrived last would take the ticket first and head home happily. and you would just keep standing there like you have since morning. Does that make any sense? It wouldn't be fair at all. If that happened, there would be absolute chaos and fighting in the line. It is precisely for situations like this that we need a data structure with the complete opposite rule where the simple rule is whoever comes first gets served first. And this wonderful and perfectly fair data structure is called a Q. The direct meaning of the word Q is a line or a row. When you stand in line at a bank, pass counter or supermarket to pay bill, that is a real life Q. Here the cashier serve the person standing at the very front of the line first. Once their work is done, they leave the line with a smile and the person behind them moves forward. And if someone new wants to join this line, they are forced to go and stand at the very back. They cannot just push their way into the middle or the front. under any circumstances. This simple and beautiful rule is known in computer science as FIFO or first in first out. Meaning the data that arrives at the front of the line first is the first to be processed and leave the line. Basically two main events occur within a que. The process of adding new data or a person to the very back of the line is called NQ. And the process of removing data or a person from the very front of the line once that task is complete is called TQ. To understand this Q concept inside a computer, think about the printer in your office or home. Suppose there is only one printer in an office. But there are 10 computers connected to it. Now in the morning, 10 employees send 10 large documents to be printed almost at the same time. The poor printer cannot print 10 documents all at once. It has to print them one by one. That's when the printer neatly creates a print queue in its own memory. The document request that arrived even a millisecond earlier, the printer places it at the very front of the line and it ences the rest in the back lining them up in order. Then it starts printing the very first document. Once the first one is finished, it removes it from the line, meaning it diffuse it and starts working on the second one. No one interferes with anyone else's work. Everything is completed in an orderly fashion, just like clockwork. Besides this common Q, there are several other great and useful types. For example, the circular Q. When we build a simple queue using an array, we often run into an interesting problem. It turns out that after the people at the front of the line finish their work and leave, the memory spaces at the front remain empty. But because the back is full, no new data can be added. This is a huge waste of memory. The circular Q was born as a great solution to this problem. Here the very end of the line is connected back to the beginning just like a circle or a loop. As a result, even if there is no space at the back, if there is free space at the front, new data can simply wrap around and sit in those empty spots. This ensures not a single bit of memory is wasted. It is widely used in various process management tasks in operating systems. Now, let's talk about the DQ. Another great and special form of a Q is DQ. Its full name is double-ended Q. The rule for a standard Q is that data enters from one end and leaves from the other. But sometimes special situations arise where we need a line where data can be added from both the front and the back and data can also be removed from both ends. This particular two-way line is called a DQ. It is so flexible and useful that you can use it as a stack if you want or even run it as a Q when needed. We have seen that the rules of a Q or line are quite strict. Whoever comes first gets served first. But think about it. Can we always follow this strict rules in real life? Let's try to understand this with a very sensitive and real world example. Suppose you are sitting in the emergency room of a hospital. There is a long line or quue to see a doctor. Perhaps there are three patients sitting in that line. Someone has a mild fever. Someone else might have a cut on their hand bleeding slightly. And someone else has a mild headache. They have all been waiting in line since the morning. Just then a new patient arrives at the hospital with an ambulance siren whailing loudly. They are having a severe heart attack. The person is completely unconscious. Now what if the hospital authorities insist on the strict rules of that common queue? What if they say so what if you are having a heart attack? There is nothing we can do outside of the rules. Go stand at the back of the line. Let the patient with fever and headache be treated first. Then it will be your turn. Just imagine the other patient might die while standing in that line. In such critical real life moments, the rule of a standard queue is completely ineffective. Here we need a smart queue or system where who come first or last is not a consideration at all. Instead, whoever has the highest priority of need will receive service first. Under this rule, a heart attack patient will come to the very front of the line even if they arrive last. Because at this moment their life is the most important priority. Interestingly, computer science has created a data structure based exactly on this hospital model. Its name is the priority queue. Data in a standard queue exists according to the sequence of time. But in a priority queue, a priority value or weight is attached to every piece of data. No matter how or in what sequence you insert the data into the line, when you extract or DQ, the most important data will always come first. Now, a very natural question might come to your mind. How does a computer actually build this priority queue internally? How does it find the most important data out of thousands in the plink of an eye and place it right at the front? To perform this magic, the data structure that the priority Q uses as its engine is called a heap. You can think of a hip as a brilliant and smart organizing system or a pyramid. This pyramid has a very beautiful and strict role. The most important item will always sit right at the very top. Whenever you add new data to this system, the hip immediately shuffles and compares its internal data, arranging it so that the most important data automatically floats up to the very top. There are mainly two types of hips, max hip and minip. If your rule is that the largest numerical value is the most important, then we use a maxim. Here the largest number will always sit at the very peak of the pyramid. For example, if there is a 100 mark exam and we want to reward the person with the highest score first, we will use a max heap. And if your rule is that the smallest numerical value is the most important, then we use a mean heap. Here the smallest number will always sit at the very peak of the pyramid. For instance, in a race, the person who finishes in the least amount of time is the winner. In that case, the mean heap will always bring that shortest time data to the peak for us. Our computers or operating systems are using these priority cues and hips every single day. When you are playing music, downloading a file in the background, and moving your mouse on your computer simultaneously, the operating system assigns a priority to each of these tasks. For a computer, moving the mouse is a task of the highest priority. That is why it processes the mouse input in the priority queue before any music or downloads. This ensures the computer feels completely smooth and fast to you. If you look closely at all the ways we have seen to find data so far, you will notice a common thread. In arrays, we were searching by following indices. In link lists, we were moving along by following one after another. And in the case of a Q, we were waiting in line. But think about this. What if we had data for which we didn't know any index or serial number? What would happen then? Suppose you walk into a huge library or a large bank locker room where 1,000 lockers or cabinets are lined up. You are handed a key with the number 420 written on it. Now, how long might it take for you to find locker number 420 among those 1,000 lockers? You might start working from the very beginning of the rogue. Then you would search until you finally reach local number 420. That is going to take some time. Right now, let's change the scene a little bit. Imagine a completely different picture. Suppose you open the contact list on your smartphone. You might have 1,000 friends phone number saved on your phone. Suddenly, you need to find your friend Rafid's phone number. You don't scroll down through a list of 1,000 names at all. You simply go to the search box at the top and type Rafid. And what about scrolling? What about waiting? In the blink of an eye, in less than a millisecond, Rafit's phone number appears on your screen. Have you ever wondered how this impossibly magical speed is possible? How does the computer pull out Rafid's number directly from a thousand or 100,000 names without any searching or scrolling hassle? This magical data structure that provides such incredible speed is called a hasht. Many programming languages also call it a hashmap or a dictionary. The core philosophy behind how this hasht works is quite fascinating. Its mantra is stop searching, go straight to the location. In other words, direct action. It basically works on a key value pair basis. Meaning it is a rule similar to matching a key to a lock. In this rule, our friend Rafid is our key and his phone number is our value or our asset. When you store data in a hash table, a very smart and high-speed mechanism starts working which is called a hash function. You can think of this hash function as a magical machine. As soon as you provide the name Rafid as input to the machine, it performs a specific mathematical calculation internally. Then in the blink of an eye, it gives you a memory number or an index. Suppose it says drawer number 75. The computer then carefully stores Rafit's phone number exactly in Troyer 75 rather than in 74 or 76. Later, whenever you go to look for Rafid's phone number again, the computer won't search through the entire phone book. It will simply put the name Rafid into that hash function machine again. The machine will immediately say drawer number 75 and the computer will directly open number 75 and hand you the number. Whether your phone book has 10, 1,000 or 10 million pieces of data, searching for anything in a hasht always takes exactly the same amount of time which is close to zero. In terms of speed, this hasht is the undisputed king of the data structure world. There is another very useful member of this hashtable family. Its name is set. To understand what a set actually is, imagine a guest list for a VIP club. That club has a strict rule. The same person cannot enter the club twice under any circumstances and no one's name will be written on the list twice. When we use a regular array list, we can keep the same number or name even 10 times if we want. But as soon as you put this data into a set, it uses its magical touch to trim all duplicate data and keeps each item only once. Interestingly, deep down this set is actually just a variation of our powerful hash table. It just keeps the keys carefully to itself. It doesn't keep any values. And since by hasht rules, the same key cannot exist twice, the set automatically removes all duplicates from our data. So whenever your software needs something like removing all duplicate email addresses from a database or checking in the blink of an eye if a username is already in the system, then the best weapons in your arsenal will be these hash tables and sets. If you look closely at all the data structures we have seen so far, you will see a wonderful similarity between them, they are all linear data structures. This means that here data sits one after another in a well organized straight line or row. Number one, then number two, then number three, just like the carriages of a train. But think about it, does all the information or relationships in our real world always move in such a straight line? Absolutely not. Most relationships in our real life are hierarchical or layer based. Here many people remain under one person and many more remain under them. Let's give a very beautiful and familiar example. Our family tree. Think about your own family for a moment. At the very top is your grandfather. Your grandfather's children are your father and your uncle. Meaning two branches spread out in two directions from your grandfather. Again, your father's children are you and your sister, meaning two new branches were created from your father's branch. On the other side, your uncle's child is your cousin. Another branch emerged from your uncle's branch. Take a look. Can you arrange this entire relationship in a straight line or an array? Who would come after the grandfather, father or uncle? And who would follow the father? Trying to arrange it in a straight line would make the whole relationship tangled and meaningless. To explain this kind of branching and parent child relationship, we need a completely new type of data structure. It is called a tree. However, there is a small but very interesting difference between real world trees and computer science trees. Real trees have their roots under the ground and their branches spread towards the sky. But a computer tree is exactly the opposite, an inverted tree. Its root is at the very top just like the grandfather in our family tree. and its branches spread downwards. In this magical world of trees, the very first data at the top is called the root which has no parent. The data from which new branches emerge is the parent and the branches below are called children. The data at the very end of the tree which has no further branches or children is called a leaf. For example, consider yourself, your sister and your cousin. That is if you don't have children yet. If you do, that's a different story. Inside computers, these trees are used constantly every single day. Take your computer's folder system or file explorer for instance. At the very beginning is your C drive which is the root. Inside this C drive are folders named program files, users and windows. These are the children of the C drive. Then inside the users folder, there are pictures, music and documents folders. like this one folder inside another and more folders inside those. This entire system is actually one massive living tree. The most famous tree in the tree family is called a binary tree. The word binary means two. A tree where each parent can have a maximum of two children. One is called the left child and the other is the right child. We call it a binary tree. It cannot have more than two children under any circumstances. And when a special rule is cleverly added to this binary tree, it becomes one of the most powerful tools in the programming world. The binary search tree or BST. The rule for a binary search tree is very simple. The data in the left child of any parent must be smaller than the parents value. And the data in the right child must have a value greater than the parent. This simple rule gives us a great advantage. Let's recall that popular childhood number guessing game. Suppose I have thought of a number between 1 and 100. You have to guess it. You will say a number each time and I will only answer whether my number is greater or smaller than the number you said. Now if you foolishly start guessing in a straight line like 1 2 3 4. It might take you up to 100 tries. But if you are smart, your first guess will be the middle number which is 50. If I tell you my number is smaller than 50, notice what magical thing just happened. With 1 second of questioning, all 50 numbers from 51 to 100 were eliminated from your list of possibilities in one go. You don't even have to look in that direction anymore. Now you will only search between 1 and 49 right in the middle. Next, you said 25. I said my number is greater than 25 and instantly 1 through 24 are gone. In this way, by guessing the middle number each time, we cut our search area exactly in half at every step. Even if you search through 10 million data points using this method, you can find the correct number in just 23 to 24 guesses. Our binary search also organizes data in memory following the rules of this magical guessing game. Whenever you go to search for data, it first compares the data with the root. If the data is smaller than the root, it goes straight to the left and discards all thousands of data points on the right forever. As a result, searching for any data, adding new data or deleting it happens at an incredibly fast speed here. But there is a small danger hidden here as well. Suppose you are going to add some new numbers to a binary search tree. But instead of giving the numbers randomly, you start giving them in a sequential order for small to large like 1 then 2 3 4 5. Now close your eyes and think about it. According to our rules, what would be the tree look like? Initially our root is 1. Then came two. Since the number two is greater than one, it will sit to the right of one. Then came three. It is larger than two. So it will sit to the right of two. Then when four arrives, it will sit to the right of three. This tree has no branches on the left side at all. All the data has just gone down in a straight line to the right. It doesn't look like a tree anymore. Instead, it has taken the form of our old long straight line of a link list. And whenever our tree leans to one side and turns into a straight line, the speed of our magical guessing game is completely destroyed. Now if you want to find the number five, you have to pass through 1 2 3 4 and walk straight to reach five. To save us from this serious problem, balance trees have arrived in the world of trees. The two most famous members of this family are Avl trees and red black trees. Here the full form of Avial tree is Adulen Welsski and Landis tree. These words came from the name of the inventors of this data structure. The superpower of a balance tree is its ability to maintain its own balance. Whenever you add new data, if it sees the tree growing too heavy or tall on one side, it immediately twists its branches to spread the tree evenly again. It never allows one side of the tree to grow taller than the other. As a result, the tree always remains perfectly balanced and the search speed is lightning fast. Our modern large scale databases use these balance trees for data indexing. So much for the story of maintaining balance in the world of trees. Now let's get acquainted with a completely different and amazing type of tree which is also called a tree. The pronunciation is the same as tree but the spelling is different. Some people however call it a try. The name comes from the word retrieval. To understand this type of tree, think of a very familiar daily experience. When you go to the Google search box and type how to even before you finish the sentence, Google immediately shows you several popular search suggestions or the way the autocomplete feature works when you type on your phone. How does the computer figure out which words can be formed from just two or three letters out of a vast dictionary of one or 10 million words? The data structure that works day and night behind this 