transcript: At first glance, this code may look like it's perfectly fine, but there's actually some subtle issues with it that we can fix with the TypeScript config. The very first one that I want to talk about is the no unchecked index access, cuz this is by far my favorite TypeScript config file. I always enable this. You can see down here we have array of names. We have Kyle, Sally, and so on, and I'm trying to access the third element from that array and convert it to uppercase. Obviously, there is no third element in this array, so it's throwing me an error. That's because I enabled this setting of no unchecked index access. Essentially, anytime you try to access an element in an array by index, it'll always either be undefined or whatever the type of this thing is, so string in our case. And you need to make sure that you check to make sure it exists with some type of nullish coalescing or other null-based check before you access this element, and I think this should be enabled in every TypeScript project by default since it gives you extra type safety. Now, the next setting I want to talk about is a really simple one. It's just no fall through in case switch. So, essentially, what this does is it makes it so that if you have a switch statement like this and you forget to add your break or your return, it's going to give you essentially an error telling you, "Hey, make sure you put in your break or your return inside of all of your different cases to work properly." You can still have fall through cases where there's no code in it, but as soon as you put code in this section, it'll throw an error if you don't have a break or a return. Now, this final property is another really super straightforward one, and this is allow unreachable code. Essentially, all this does is it makes it so that you can't have code in here that's unaccessible. So, here this return statement is impossible to access, so it's giving me a nice little warning letting me know, helping me catch potential typos in my code. Now, I would recommend enabling all of these in your project because they give you extra type safety and help you with catching bugs and typos in your code. Now, if this interests you, I highly recommend checking out the full video linked at the bottom of your screen where I cover 15 total TypeScript config options that you definitely want to have in every single project you work on.
