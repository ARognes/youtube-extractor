transcript: with the holidays coming up everyone's looking forward to their favorite seasonal foods but this year why not impress your guests with something a little more mathematical of course there's the obvious pumpkin pie or apple pie I made a mini one last year for Pi Day but I want to make something more unique something you would even find on the second page of Google so welcome to Chef parade this is just a small fun video between devlogs and announcements but you can keep up with the late latest 40 golf updates on the code parade Discord now on to the video I would tell you a joke about these mobus won chips but where would I begin just cut up a won or Egg Roll paper into strips give them a Twist and attach them with some water they're super easy to make taste great and have a nice crunch although my review might come across as one-sided trust me they're amazing turn any family event into a real three- ring circus with some baroman rings shortbread [Music] cookies you only need an inner and outer Circle cutter for these you can even use drinking glasses if you don't have the right size the neat thing about Boman Rings is that no two of them are actually linked so removing just one ring freeze the rest you can also try to weave the dough itself it's a bit finicky and might not come out as perfect but there's a huge variety of knots you can make by weaving dough I could not think of a better way to ring in the holidays of course I can't do a video like this without some fractals so how about a mandal br Mandel br mandle br or mandal bread is a twice baked biscotti like cookie you can eat with tea or coffee just for form it into that iconic shape of the mandle BR set it's okay to exaggerate the features a little since it's going to expand a bit anyway it does need to be cut and turned halfway through unfortunately so I'll just reassemble it at the end and although the perimeter is infinite it still has a finite area so make sure you grab some before they're all gone in case these other bakes weren't cheesy enough there's always the Fibonacci cheese and crackers sorry are these H's grading using a template carefully cut out squares with lengths equal to the terms of the Fibonacci sequence harder cheeses are definitely easier for this you could also score a golden spiral into the cheese when you're done but I chose not to this time if any of these tasty topologies have tickled your taste buds all the recipes I used are linked in the description and if you have any other favorite mathematical bakes I'd love to hear about them in the comments see you all in the next video h
