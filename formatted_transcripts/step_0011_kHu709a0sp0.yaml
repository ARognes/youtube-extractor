transcript: '- All right, you should be aware, I speak in complete paragraphs and at length, so. - (laughs) That''s okay. No, that''s great. I want you to do most of the talking. - Okay. (laughs) All right. Just warn me if I''m just going on too long. (lighthearted music) (lighthearted music continues) MUDs are the original online worlds. When we think about what MMOs or holodecks or VR worlds, like, depicted in anime, like "Sword Art Online" or whatever, all of that starts with text MUDs. And they have been around since 1978. They don''t look like an MMO. They''re not VR. They''re not even graphical at all in their original form. They''re just text. But that doesn''t mean that they don''t have game servers with simulated places and hundreds of people running around that you can interact with in real time. They do, so that means everything that you''ve seen in MMOs happened in the text MUDs. All of it happened. We have 40 years of history there to go look at and lessons to learn. Generating systems in text can be freeing because it''s really low cost, it''s super fast to iterate, so it''s really easy to try doing things that with graphics are very expensive. "LegendMUD," which I worked on, we had a quest that was based on Kipling''s "Jungle Book." And there was a moment where you can go to the city of the Bandar-log, the apes, and see that it used to be an inhabited ruined city. If you did the quest right, all the apes transmogrified back into the people that used to live there. All the ruined environment returned, only sort of ghost-like and translucent. And then over time, the illusion broke, almost like soap bubbles popping over time. That would be just phenomenally expensive to do today in graphics, right? But you could do it fairly easily in text. So you had the ability to experiment with ideas and try lots of new things pretty cheaply. Early text MUDs were running on, in timeshare slices in temp space, on computer lab computers with less power than my Apple Watch. They had to be very efficient, and you couldn''t go too crazy with simulation and highly detailed systems. That said, in the very first major MUD, "MUD2," done by Bartle and Trubshaw, if you had a glass of milk, and you stepped into a river, the water would wash away the milk in your glass, which is something that today, we don''t go anywhere near that level of detail in our games. (curious music) MUDs got going in the late ''70s, but their real flourishing started in the late ''80s through about the mid ''90s and into the end of the 2000s, before MMOs started to dominate. There were a variety of like smaller projects, but most people weren''t really aware of them, right? They ran on university computer systems by and large. You mostly had to be, like, a grad student in comp sci to have access to a Unix account in the ''80s, right, like that kind of thing. So they weren''t really widely available until the late ''80s to early ''90s. You know, when I left grad school in ''95, everybody was really talking about "Snow Crash" a lot, which had only come out a few years before. And people were starting to see the internet as a thing that was going to make a massive difference. And MUDs rode that wave, right? MUDs were the closest thing to an actual cyberspace, the closest thing to a metaverse that had been seen on Earth at that point. People who were involved in MUDing, many of them were very cognizant that they were on the cutting edge of a giant future. MUDs had more than one major subgenre, and they''re subgenres that would still be familiar today. There were worlds that were just about running around and killing and leveling up. So if you model that to think in your head, oh, like "World of Warcraft," you would be dead on. They actually played very much like "World of Warcraft" does. There were other, basically, engines. We called them code bases back then. But there were other engines that were more oriented around user creativity, and those involved people building their own maps and modifying the environment and the code, and really kind of extending it themselves while they were playing it, right? It was part of the activity. And if you mentally map that to "Second Life" or even parts of "Roblox," you would be dead on. It was exactly like that. There were others that were more oriented around hanging out and chatting and role playing. A lot of them were adapting popular sci-fi and fantasy novels of the day, and people just kind of immersed themselves in the role play. And if you kind of mentally map that to a group of people playing "Baldur''s Gate 3" together or role playing together in "Grand Theft Auto" or hanging out in "Animal Crossing," you know, you''re not far off. (chuckles) It felt like that. (gentle music) Those were three separate strains back in the MUD days, and they had tech that was built, optimized towards one versus the other. When Mosaic came along, and the internet started to become graphical, a whole bunch of people started saying, "Hey, we could make graphical MUDs." There were projects in France, "Tibia" and "Dofus." There were projects in Korea, "Kingdom of the Winds," "Dark Ages." And there were an assortment of projects started in North America, such as "EverQuest," "Asheron''s Call," "The Realm," and "Ultima Online." All of these tended to have people who had played MUDs on them because that was where the expertise came from. I had been working on a MUD called "LegendMUD," which was consciously trying to mix together some of these different strains into one environment. It was an immersive environment where you explored history. It was one that encouraged role play. So you were encouraged to learn about the environment and try to stay in character. And it was a straight-up kind of combat game, right? So it mixed together all of those three things. Our lead programmer, and then eventually myself, my wife, a couple of other people, actually, ended up recruited out of "LegendMUD" by Origin to do "Ultima Online." Because "LegendMUD" was, it had a really good reputation, that wasn''t actually the only company that tried to recruit us. I was also recruited for "Meridian 59" and turned them down because I had already accepted the job with Origin. It was kind of this moment where the folks with money were looking for the talent from among the hobbyists. And my wife and I submitted design samples and quests that included basing the game on dramatically more simulation and more emergent content than the prevailing mode that MUDs were in, which was handcrafting everything and making it, you know, primarily a linear combat game. And that was because we''d wrestled for so long with how long it took us to make that handcrafted content. When we showed up for our first day of work on "Ultima Online," we were shocked to hear, when we asked, "So what''s the game?" the folks we met with regurgitated our design sample back at us. And that''s when we realized, oh, we weren''t in charge, but our ideas were what the vision was going to be. (bright music) That meant that "Ultima Online''s" philosophy from the beginning was simulating an alternate reality in as much detail as we could manage to do at the time. That fit well with the "Ultima" brand. "Ultima" was a longstanding brand in RPGs that had innovated over the course of many years. If you''ve played a game with a morality system, if you''ve played any JRPG at all, they were all inspired by "Ultima." "Ultima" was the first game with a morality system. It was incredibly popular and influential. And it had a strong streak of that kind of simulation quality to it. So it was a reasonable fit in terms of kind of the setting and the intellectual property and so on. The other interesting thing was that that initial core team was recruited from backgrounds that included all of the different MUD code bases. So all of those different technological approaches to problem-solving that were solving three different problems in the MUDs were blended together in our approach. From the beginning, "UO" was kind of a synthesis of all the development that had happened in MUDs up to that point. And we were very consciously trying to reinvent what MUDS and virtual worlds could be, and not just port them over to graphics. (lively music) I think, these days, people don''t remember or know how important and influential "Ultima Online" was. There were other RPG series that were getting going, such as the "Elder Scrolls" series, which was relatively new at the time, that had some similar philosophies to them. But at that point, RPGs were actually considered a near-dead genre. They hadn''t been revived yet by the incredible popularity of "Diablo." Many, many features that came over from MUDS, the implementation that became the reference implementation was "Ultima Online''s." Today, if you craft anything in a game, it is because of "Ultima Online." "Ultima Online" predated "The Sims," and you were decorating house in 2D and building bookshelves and all of that kind of thing. If you''ve customized your avatar and had clothing show up on your figure, you can credit "Ultima Online" for kind of mainstreaming all of those sorts of features. Like we''re talking, this was a video game that landed in "Wired" and "The New York Times" and so on, where think pieces were being written about it, about the ways in which it was revealing of human nature and things like that. Today, you know, it''s dated looking. It''s 2D. It''s isometric graphics. It has been obscured by the giants that came after it, "EverQuest," "World of Warcraft," and so on, that achieved larger levels of popularity. But the things that "UO" all brought to the table ended up getting adopted everywhere across video games. There were plenty of online games that were commercially successful and quite lucrative prior to "Ultima Online," but most of them had been, virtually all of them actually, had been on the closed online services. They were on America Online, right, AOL, and on competitors like Genie. Those had niche audiences, tens of thousands. It was earth-shattering when "Ultima Online" broke 100,000 subscribers, and then gradually, over time, it went on to eventually reach a quarter million. That was considered a massive sign of things mainstreaming. Only a few years later, "EverQuest" would come along and double that. And then only a few years after that, by 2004, we get "World of Warcraft," which in its first year blew past a million. The internet itself was scaling in that way at that time, too. It saw enormous explosive growth. You know, "Ultima Online" was a mainstream hit. It was EA''s fastest selling PC game in their history. But then an MMO a few years later could double it, and then it would be the mainstream hit. And you get the idea, right? (lively music continues) - [Avatar] I don''t have enough energy. (enemy groaning) (coin clinks) - They had one massive, massive innovation, which was, I call it the quest-led game. They set up quest paths through the entire game. And pretty much at any given moment in the "World of Warcraft," there''s a yellow exclamation point over an NPC''s head or a quest log telling you what to go do next, just like today that''s in all the games, right? You play "Assassin''s Creed," and it''s basically, "Oh, I''ve got this giant to-do list hovering over on the side of my screen." The underappreciated thing was what that ended up meaning for that chat time. Because it turns out, if there''s a glowing yellow exclamation point, there''s this pressure to go chase it at all times. And when it wasn''t there, you spent half of your time standing around chatting. So an effect was that it made "World of Warcraft" less social. This was something that could be empirically seen. Role players have a lower XP per hour earning rate than combat players, because the role players are spending time chatting. It''s measurable. But if the whole game says to you, "But you can''t play with your friends if they''re of a very different level than you," then the role player goes, "Well, I can''t talk anymore. I have to go grind experience points to stay level with my friends." And then the game gets less role play. This is subtle, right? Like these are, this wasn''t even... This wasn''t an intended consequence. It wasn''t even an intention in the design. It was just, how do we guide you a little more, make it a little easier to see what to do next? But the incentive structure is so powerful that it shapes the player behavior in radical ways. (bright music) Games have been social since pre-history. In fact, there''s a great case to be made that the single-player game is the weird thing. When you look back at the history of pre-digital games, they were virtually all multiplayer. The "Solitaires" are very rare historically. The other design thing that is very unusual, if I mention the game "Fox & Geese," I think, you know, this is a classic old tabletop game, a folk game, I think many of your viewers would actually not even know what it is, because so many of the board games we played prior to video games had all of the players playing the same game against each other. You know, whether it is six people moving marbles together in Chinese checkers, you know, or whatever, whether it''s two people across a chess board, whether it''s four people around the "Monopoly" table, you know, they''re all doing the same thing. "Fox & Geese" was a game where one side played a fox, and the other side controlled a flock of geese. That is what most video games are like today, including the single-player ones. The computer controls a flock of space invaders, and you control one shooting turret and so on, right? You know, so I think of this as symmetrical versus asymmetrical sides in a game. What computers enabled was single-player games. And because computers and people, particularly early on, had very different capabilities, and still do, most of the games made were ones where you are playing against the computer, and the computer''s playing a very different game against you than you are playing against the computer. Both of those things are historically kind of aberrant. And one of the things that we shouldn''t forget, like, in Germany, people go on board game dates in order to figure out how each other think, because it''s a great way to size someone up. Games have always been social lubricant. There have always been games at the watering holes and the bars and taverns all through history. It''s a way to socialize and a way to come to understand other people. If you think about what that means for video games that lean in the other direction, it''s such a human impulse to still interact with them in a multiplayer way, even if they''re not built to be interacted with that way. And so you get the single-player games of the first couple of console generations were still mostly played by a passel of kids on a couch, passing the controller around between them, even though it was a one-player game. And today we see single-player games surrounded by multiplayer achievements and "let''s plays" and Twitch streams and you name it. It''s like all this effort is going into taking a single-user activity and making it into a social experience again. Connectivity enables that to happen from the get-go. And virtual worlds, which are, at heart, simulations of places that you then put some games in, as opposed to being a game, I think that''s a really important distinction, they are first and foremost a social space in which to interact with others. Yes, even "Final Fantasy," even "World of Warcraft." They''re places first, and the game happens to be in the space. And the question is, how much of the space does it take up, and how much does it let you do other things? I think the big difference between online sandboxes and other kinds of online games is that they have enough space in them for the other forms of human activity to flourish. The other thing that ends up happening in persistent worlds is that the different ways to play can be tied together via other kinds of incentives. The chef needs somebody to go get his ingredients. If the ingredient is from a monster gizzard, then he needs that warrior to be able to play his chef game. And that warrior might need the armorsmith to be able to play his warrior game. And the armorsmith probably needs a miner to be able to play in his armor-crafting game and so on. In sandbox games, ever since "UO," and a couple of the MUDs before it, "DartMUD" in particular, that idea of, if you start building up enough roles, you actually start mimicking the interdependency of a society, well, that idea is very powerful. It means people can each play the way they like, and they matter to each other anyway. And that builds up social ties and builds up an awareness of the importance of people who aren''t like you, because you come to realize you depend on them for your way of being to exist. And that''s just more honest to real life, frankly, than the idea that everybody is a combatant and can make the game serve that role of being a third place, a place to socialize, in a much more robust way. (bright music swells and fades) (lighthearted music) (lighthearted music continues) (lighthearted music continues) (lighthearted music continues) (lighthearted music continues) (lighthearted music continues) (lighthearted music fades) (electronic chirping) (keystrokes clacking) (keystroke clicks)'
