transcript: I see you [music] waiting, hiding, shrinking, pacing the four corners of your personal prison, begging for them to give you [music] something. Praise, validation, permission. But I implore you to check your own pockets for the key [music] before holding out your hands for something they don't possess. Your life, one life, one foot in front of the other, one step at a time into the light. Wake up. Wake up. We all have that one creative thing that haunts us. The unseasoned manuscript still sitting in Scriber. The muffled screams of an untouched screenplay. The collection of poems [music] collecting nothing but dust. The paint that has never tasted a touch of water nor felt the [music] stroke of any brush. We put it aside, call it unimportant, as if importance only consists [music] of things directly related to paying our bills. We think the creative thing can't [music] be what we need. So we try to conform, try to wake up, brush our teeth, drink our pourover, and cook an egg or two to try and forget. Try to drown ourselves in monotony and busy work as if distraction will lead to amnesia and not dissatisfaction, resentment, regret. Admittedly, admittedly, I have one [snorts] creative thing that haunts me. Now, you know, it's more than one thing. Okay, obviously it's more than one creative thing, but if I was to list out every creative thing that haunted me, we'd be here forever. So, let's just let's just pick one. And this one I think about every day. I think about it when I wake up in the morning. I think about it when I go to sleep. I think about it when I'm scrolling through Tik Tok or Instagram. I think about it when I'm checking email. Sometimes I just open the dock and scroll through the questions in the project. I actually dedicated this YouTube channel to finishing said project last year. [music] Yeah, this is the one. My Moby Dick, my Magnum Mopus, my lemonade. All signs that we should finish the project. Let's take a peek. [singing] [singing] [singing] It's taking too long already. It's taking too long already. The project is called Letters from a Stranger. Letters from a Stranger. Letters from a Stranger. I had a whole setup, y'all. It was exactly the thing that I'm trying to avoid. I had a whole setup with lighting. I didn't like how it looked. So, it took another week and another week and another week. And that's exactly the thing that we're trying to avoid with this challenge, which is my 100 day project that I didn't finish cuz I didn't send the letters to those 100 people. But I got something new. I got a new challenge up my sleeve, of course, to add to the challenge that I also have with sending the letters. And that's 100 short films to accompany every single question along with sending the letters. So 100 questions, 100 letters, 100 short films. Yeah, I already know that it's going to require it's going to require me to get uncomfortable. And that's something that I'll discuss in the first letter, but I'm the type of person, I don't know about you, that if it's too open, [laughter] if it's too open, it's not going to get done. And this is something that I care about deeply. This is a project that I care about deeply. Whatever you're working on creatively, why it keeps bubbling up is because you actually care about that Why don't we get it done letter by letter, question by question, short by short. I really want this to be participatory. I don't want to just be answering these things and living them and not have you with me. We're going to be moving towards these things together. I'm 34 in the next couple weeks and I want to get it done before my 35th birthday and I'm going to speak it for posterity for the 100th film. I want to actually have a film premiere, one that I will see you there at. Yep, that's what I want. But until then, you're all going to live here. What are you creatively procrastinating on? What have you danced around? What's the thing that you really want to do, but you feel like something is holding you back? Whether it's picking up the camera and taking one photo today, what is one thing that you can do today? For me, it's this because I had an insanely dumb setup. It doesn't really matter how many times we start. It is the depths we overcome. it is how many times we decide to get up and pick up the pen again and pick up the camera again and pick up the video again and just set it on the kitchen counter and do it. Very excited. Very much so. Looking forward to this. Thank you for your patience. There is another video queued up. I'm not going to make y'all wait for another year. All right, I'll see you on video number one. Question number one. Letter number one. [music]
