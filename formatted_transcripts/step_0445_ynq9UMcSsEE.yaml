transcript: How do you feel about after 10 years spent working on the same game? I mean, I'm very happy to be almost done. It is uh It is very tiring to work that long on something without you know without getting anything from it like Imagine Well, there's all sorts of things. So, at a very base level, imagine you just didn't make any money for 10 years. And just spent all your savings and then you were going into debt for 10 years just to make a game. So, there's that aspect. Um And then just like uncompleted like, you know, I certainly wasn't signing up to do a 10-year project at the beginning. And so there's this whole um You know I'm setting out on a voyage or trying to get to the end of the thing and then, you know, you're lost in the desert or maybe uh you know the Sierras and winter's coming on and you don't want to turn into the Donner Party and and what do you do? Like long developments are very difficult. Right? Ask anyone Very few indie developers have done 10-year developments and survived it, right? Most who try to end up doing things this long just crash out and never get it done. Um But yeah, it's hard and it they take some doing. But again, I wish to emphasize the reason it took so long is because we wanted the game to be really good. Um It is one of the greatest puzzle games ever made. I personally think it is the greatest puzzle game ever made, but that's something that you that is up to your particular uh choice and discretion to decide how you feel about it. Um but you know, when development started getting long and like things were expensive and COVID happened and all that, we could have just said, "Well, we're just going to make this a fun little game." Right? And just scope it is what it's called in industry where you just decide not to do a lot of the things that you were going to do. It still would have been a a bigger game than a lot of games. >> [snorts] >> Um also, even even as recently as 2 years ago there were people in the company coming to me and asking the question, like, "Look, can't you just like break this into three games or something? And just get it out sooner." And at that point, the answer was, "Well, it wouldn't really get it out that much sooner anyway, and it would kind of wreck the game to do that." But it's just to say that it is not people's natural impulse to do something like this, to like work this hard on something to do the right version of it, right? Like at some point, it becomes too hard and people are just like, "Look, we'll do uh we'll we'll do the more stripped-down version of it. We'll do the not-as-good version of it." Um and I just refuse to do that if it's possible not to do it. Now, that said, there would certainly be a breaking point for me, and we almost hit it. Like it was as you guys know, the past couple years has been really hard for the game industry. There's been a lot of layoffs. There's been a lot of companies got shut down. Uh it was a hard time for us, too, but we got through it. And we made we finished the game well, we're very close to having finished the game. Um and yeah, I mean, it's it's really good. So, that's all. That I mean, that's just my bundle of feelings about all of this, right? You You know my bundle of feelings.
