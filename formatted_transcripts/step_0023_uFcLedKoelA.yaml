transcript: '(Ambient music) [DANNY] Hello! and welcome to the fifth episode in our series on Disco Elysium. As you likely know, the goal of our work here at NoClip is to shine a light on how games are created, so that players can get a better understanding of how their favorite game was made, and so that other developers might learn from what went right and what went wrong. We just spent four episodes largely talking about what went right, but undercurrents of dissatisfaction and stress were only building as production moved forward. Friction within the writing team would only increase when the decision was made to split them up between Estonia and the United Kingdom, but before that happened, the programming team – mostly folks who had never released a commercial game before – were having struggles of their own... (Looming orchestral chords) [JAAGUP IRVE] I think the whole development room was being passively observant of the deadlines or feature creep. It took a toll on us, of course, but on the other hand, it was also like, you could feel that the art team was making their greatest art that they could while we could do really mediocre programming because of that [laughs]. [ROBERT KURVITZ] The thought cabinet was done by Markus Rondo. I hear he didn''t really like menus [laughs] at the end of that, and then he was a really, really cool programmer to work with. A lot of the very basic movement stuff in the beginning of the game was done by Veljo Hagu, and then a lot of the cinematic programming was done by Mikk Luige. Yuan Zhang, the VO producer who later pulled out the VO, came in to help with the sound and Andrus Laansalu, the sound engineer and designer, was still on the project. [JAAGUP] We had more professional people arrive as well, like Ott, and also Liisi – my longtime friend from university – who is, I think, one of these remarkable programmers who can refactor huge things. [ROBERT] Right near the ending stretch, we got what Irv called a hardcore progajada. "Progajada" is the programmer, but programmeress, in Estonian. Liisi Laasik, who kind of became one of these lead programmer roles. And that was about the time when the game was becoming really big and feature complete, so she kind of took over the leadership of the team. [ALEKSANDER ROSTOV] I got to go to the show floors, to the great PAX East, and to the German Gamescom, and to the showfloor grind and hustle, and really try to sell your game to all these nerds. And it was wonderful. It''s the gift. It''s got some of the happiest memories. First of all, oh my God, it''s a trip. You get to go on a trip with the guys. That''s already wonderful. In some ratty-ass Airbnb in a Boston suburb. Oh my God, America, are they going to shoot us dead in the street? What''s going to happen? It''s the scariest place on the planet, America. But yeah, going to these shows and showing the game to our future fans was very nice. We learned an interesting fact there, that it seemed to be that the core audience of this game, who would appreciate it the most, were of course middle-aged men and teenage girls. [DANNY] Right? [ALEKSANDER] Yes. The middle-aged men, I guess, found something to identify with, and teenage girls found a work of art that wasn''t condescending towards them. [Laughs] My favorite thing that I overheard when quite a young girl got off from playing it, and then the mother who had been like watching over her shoulder, and it was like, the girl said... Oh my God, what was it? "Mom, no more League of Legends." [Chuckles] [DANNY] Wow! You did it. You converted one! [Laughs] One down, a million more to go! [ROBERT] It is very hard to title games generally. It turns out there''s some kind of rules to titling them. So the way I did it was it was called No Truce with the Furies, which clearly is not going to work for a successful entertainment product, and we were told, by British journalists. And then I basically bounced words together for two years. And then I had a playlist that I''d made a long time ago called "Arno Van Neck''s Disco Elysium", and I took it from there, Disco Elysium, and everybody hated it. Everybody said it was a bad title, and we''ve got to change it again. A friend from an ad agency called me and said that it''s embarrassing. Our, at that time, American publishing-related friends told us, "I don''t know if you Eastern Europeans know, but here in America Disco is dead." So they thought that we''re like... Borat. [DANNY] Wearing bell bottoms or something? [ROBERT] Borat is trying to say: "You guys like Disco! We named it Disco." Literally, we had to go against almost everyone''s advice, which is one of the hardest things to do. But it was going to work because it''s kind of like an anime title. Like, it''s the same kind of logic that they have. It Googles really well. It''s really pretty. It''s a good combination. And it has the word Elysium in it, so it kind of takes ownership of this very desired word. You know, like everyone wants their stuff to be called Elysium-something. And it takes ownership for this kind of comical indie... the disco angle of it. It was, yeah, some people still don''t think it''s a good title for it, but it was the hardest creative job on the whole thing, coming up with that name. [DANNY] With hopeful release dates constantly on the horizon, pressure was nonstop. The writing team was still crafting characters and editing, but progress was often slow, and Robert still hadn''t come up with an ending for the game. Leadership was under pressure from investors to get the game out without further investment, and the programming team, – even with the help of some experienced new hires – were struggling to finish. It should be mentioned, even if I''m not prepared to get into specifics, that the shadow of substance abuse lingered over many of the people working on this game. There was no shortage of personal ghosts being fought during the development of Disco Elysium. I believe that we should respect people''s privacy when it comes to issues of alcoholism or drug abuse. They are, after all, victims too. But to not mention this element would be to ignore something that did have a meaningful effect on production. Many of the people I talked to specifically brought up drugs as a destructive factor within the team, either used recreationally or, more worryingly, as a means to get through the production. Many of the people who worked on Disco Elysium during this period suffered greatly due to drug abuse in particular, and some of them have sadly never fully recovered. The project was not running well, and with Robert at the creative centre – burnt-out, overburdened, and still clawing onto creative control – some of the team felt that change was required. But for at least one member of the team, the broth had already been spoiled, and it was time for them to leave. [MARTEN RATTASEPP] It was a weird time. Like I said, in the second year especially, the whole development process had started to get more frustrating, and there were strange things happening in the back end somewhere that I wasn''t fully privy to, but some sort of weird internal strife, and... Something was happening, and things were more stressful and unpleasant, and delays were happening, and people were not getting along as well in some aspects. So like, I don''t know, at some point – really, over the summer – I was just feeling like, this is... It''s not enjoyable anymore, and I have done, basically, my stuff that I was tasked with. I know that getting a game finished is very difficult, but this wasn''t fully that. It wasn''t like you''re just kind of struggling, or even crunching to get something done. No, this is more like, there is some weird power plays, or whatever, happening, and people are doing weird stuff to each other. So I don''t know, I just didn''t really feel it at the point anymore. I don''t want to deal with this weird stuff. I have a very vague sensation of like, something is going in a poor direction, and I don''t want to be a part of this anymore, because I don''t see this going... And the delays, and the weird stuff, it started feeling like a dejection. Of like, "This project is never going to come out." I''m just like wasting my time here, spinning wheels and just getting paid, while this thing is getting delayed, and redone and delayed and re... There is a point where you''re not polishing the stuff anymore. You''re just redoing things that is already finished. And months go by and it feels like this is never going to come out. and it feels like, "This is never going to come out. "And, maybe I can do other stuff with my life. I don''t like need to be here." [DANNY] While all this was going on, Kaur Kender, an original ZA/UM Cultural Association member, and the executive producer who was responsible for getting funding for the project, was embroiled in a controversial court case, regarding the contents of a novel, he may or may not have written. In 2017, Kaur was acquitted of charges and decided to move to London, to start up a satellite studio. Okay, it''s probably time we explore who exactly was running ZA/UM at this stage. We already mentioned the investor, Margus Linnamäe, who bankrolled the project, and owned 83% of the original company, Fortress Occident. But Margus is a busy man and, as one of Estonia''s most successful businessmen, he had little to no involvement in the day-to-day running of the company. It was Kaur Kender who owned the remaining 17% stake, but he himself sold it to another investor, Ilmar Kompus, when the studio was renamed to ZA/UM. At the time, Kompus''s investment group, was co-owned by a man called Tonis Haavel, who himself was embroiled in an investment fraud case in Estonia, that would eventually lead to his bankruptcy, at least on paper. Much of the details of these financial machinations were covered in detail by our friends over at People Make Games, so we''re not going to spend too much time on them here. But while Ilmar Kompus was essentially absent for the duration of development, at some point, his investment partner Tonis Haavel began coming to the Tallinn studio to help out. He attempted to get to grips with the tools the team were using – mostly fruitlessly. Clearly the investors were worried that the game wasn''t getting finished, and frustrations over Robert''s leadership were part of this, because changes from the writing team would often mean changes downstream, to art, animation, and more. The opening of the London studio was no doubt downstream from these affairs, and it was the beginning of a slow but steady exodus from the Tallinn studio. The logic was, that if the studio was housed in the UK, it would have access to more talent, more favorable business conditions, and the established network of marketing, PR, and games'' press that London enjoys. Crucially though, Robert, Argo, and Helen would also move to the UK though they would reside in the diverse, artistic seaside city of Brighton, away from the rest of the team, so they could finish their writing and unclog this critical block in the game''s production. In hindsight it''s tempting to analyze this decision, especially given some of the broader financial plans happening with management. Was this decision made to give Robert and his inner circle more space, or direction? Was it done to simply get Robert out of the Tallinn office? Were there financial or legal reasons that would be beneficial to management? In any case, not all of the Estonian writing team would make the journey. Olga, who was point person between many of the game''s teams, would be left in Estonia. [ARGO] Well, honestly, I never planned to make the move. I was very much loving my life in Estonia at that point, and the idea was... How it came to be: First of all, Kaur had the court case, where the Estonian government was trying to convict him for crimes on fictional characters. After going through this meat grinder, he, as far as I understand, firmly decided to never ever write in Estonian again. So he moved to London immediately, days after this court case concluded. When he first visited us, two months after the move, he came back with this piece of knowledge that I found to be very on-point. In Estonia, everything is easy but nothing is possible. And in London, everything is very hard, but everything is possible. With this perspective, I think he first realized that we are not going to be able to finish it in Estonia. And we are not going to be able to finish it on the writers'' side. Because there was so much distraction, constantly, little things, and you know that, at this point, you need to be there not eight hours a day, you need to be there 10 hours a day and six days a week. [JAAGUP] It was presented as a huge win, because they could be focusing on the things that matter. I think that is a movie production thing, when you have a hyped-up producer, you need to isolate it from the team so the team can work, and ideas can be filtered so that the reasonable ones go the other way. Production-wise, I think this was what happened and it took a great human toll on everyone. I think this crunch wasn''t easy on the London team. [ARGO] When Kaur moved, and with this realization, I think, probably, there was discussion between him and Robert Robert and Helen moved first, and then I moved into the same apartment as they did. in Brighton. Why Brighton? Because the British Sea Power, the band who made the soundtrack, and won a BAFTA for the soundtrack, they are from Brighton. [HELEN HINDPERE] I think, for me, it became difficult when we moved to the UK. We moved to the UK, and this was, I think, a year and a half before the release. So it was me, Argo, and Robert living in one apartment (chuckles). We did not rent a separate office space. There was an office space in London, but we moved to Brighton, so maybe that was the reason. So we started working from the living room, and everything just became way too much. Right? The final year, everything just... You can feel the pressure. But also the fact that, you''re in a new country, you haven''t really made any friends, you''re just moving from your bedroom to the living room, to work in there. It got... I was quite tired, but still, there was the end goal for it, so it felt manageable. It felt like, okay, after that we get to rest. [ARGO] It''s a weird one, because yes, of course it''s hard to be away from the rest of the team. because you don''t... you no longer get this... How do I say? This creative resonance, this daily... Rostov doesn''t walk into the writers'' room, you don''t see... You don''t get this... But at the same time, because at that point the work is so intense, you don''t really have time to think about it either. [DANNY] Back in Tallinn, the remaining team was hard at work, still under immense pressure from deadlines that seemed almost designed to get them to crunch. Liisi was a powerhouse for the engineering team, and given more responsibility. Her fellow engineers loved her and crucially, Robert did too – which wasn''t something everyone working on the project could say. Producers Kosmos and Lembit Jürgenson would have to work even closer with Olga, who was now the only writer left in the Tallinn studio. [OLGA MOSKVINA] I think one of the primary strengths of Disco Elysium is the fact that we were so much in each other''s lives, in the same space, at least talking together. It was hard for me, because I was the only writer in Estonia then, and so I was in the position of being the traction point between other writers, and a lot of the rest of the team. There were bad things going on with the upper management there, that made it even harder. It was not the best situation, to split the team like that. [ARGO] And yes, initially when I moved, it was July 2018. The idea was that, I''m just gonna be there, we''ll do the editing, and then I''ll come back. First of all, the editing that was supposed to take three weeks, went on for four months, five months? [JAAGUP] I was really angry at Robert, because endgame was missing for the longest... I think they went to London, there was no endgame. I had a paper that had "endgame" written in large letters onto the carpet in the programmer''s room. There were trust issues in all of the directions during the stress times, And this this is something that... I''m not sure if there was a better way. [ARGO] I don''t want to exaggerate, so let''s say that, the last four months five months of that nine-month cycle, because we were supposed to release in February 2019, when it was clear we''re not going to hit that, Kaur... I think it was Kaur who went to the investors again and said: "Hey guys, still not ready. Can we get more money?" Once this money came, it was very clear that this is it. There will not be more. So now we enter this last nine-month... "The death march phase," [ROBERT] Josh Sawyer has this expression, "death march". Which feels like, if you want another level that''s worse than crunch, then there''s "death march". So that... We basically death marched it. Well, that was the last deadline that we were ever going to get. That was clear. That we''re not going to get any more money. It''s gonna come out at the end of this. And it was really gonna. I was out of any kind of excuse to clearly win more time for it, which is all you really want to do, as a developer. You just don''t want to release anything with bugs. That ruins people''s mood, you know? To work on something for five years, to delight people, and then to have it bug out on them, it''s just tragic. But because it was now finally achievable, it had to be achieved, because there weren''t very good arguments against it. [ARGO] Never, during the making of Disco, even the crunch times, do I remember there being pressure to crunch from anywhere else, than from the inside. Robert never said that you have to do overtime, you have to be working on weekends. I never got that vibe even from the management, but internally, you look at it, and you know, and not only do you know, you want to do it, because, to this day, writing Disco, writing this stuff it''s literally the funnest thing I''ve ever done. I''ve had more fun doing this than playing any game. [DANNY] With most of the writing team – and crucially, Robert – isolated in Brighton attempting to finish their work, management in Tallinn was able to take the reins on production more directly. Many of the programming team were on contracts that were set to end, before the latest release date extension, and so, in an effort to save both money, and perhaps to make sure the game was polished ahead of release, management in Estonia made the brutal decision to let most of the programming team go at the end of their contracts. With five months left on the project, a white label company in Poland, by the name of "Knights of Unity", were hired to finish Disco Elysium, with single engineer, Markus Rondo, staying behind. [ARGO] Oh, Markus Rondo, I don''t want to ever forget Markus Rondo. He was such a sunshine. Even in the very last days before the launch, when I think Knights of Unity were doing most of the developing, he was... I think he was the last developer to stay behind. [JAAGUP] My suspicion is this: That they wanted the funding to continue and they needed a fall guy. And the development team was a great fall guy because we weren''t perfect [chuckles] in any sense, and our interface was really nasty to the leadership. You have these conflicting interests, and outsource provides a really nice interface, like some guy is very interested: "Yes! We will do this in two months," or whatever. I went there to manage the systems administration. They wanted an extra computer that would be able to upload to Steam just in case anything happened, and I built that... It was so sad there, there was a few people left. [SIIM RAIDMA] So the moving process wasn''t a single move. It was people just trickling out. There was a weird spot where we, I think, signed different contracts. I didn''t really know what was going on, because I was... In hindsight, I was safe. I was going on with a lot of them, but I do understand there were some people being let go, in not the most correct way, I guess. And I don''t really know what was going on there. At launch date, half of the dev team was already in the UK studio, and we had a little party in the Tallinn studio before giving it up. [DANNY] While Robert says he was shocked by the way in which the engineering team was let go, I should mention that others have disputed that he would''ve had no knowledge of this happening. It''s also crucial to mention that several others told me that the management above him were already making decisions designed to erode his influence at this stage; giving directions that directly opposed creative decisions that Robert had made, something that frequently put these developers in impossible situations, and led to incredible amounts of stress and distrust. The toxic manner in how this team was managed cannot be understated, and it''s part of the reason that it''s taken so many of these people several years to truly come to terms with what exactly was going on. For me, the story of Disco Elysium''s internal combustion is not one of a singular smoking gun but the pervasive erosion of the faith and belief that had bonded so many of these people together in the first place. A few days after the programmers were sacked, producers Kosmos and Lemps were also let go. Olga remained in Tallinn – but by now, a large number of the people who are responsible for creating this game had been cast aside. This is perhaps the most underreported aspect of the story of Disco Elysium, because most of this happened long before the game gained its international notoriety. But it''s these fractures and tensions that would lead to problems further down the road. The power dynamics between Robert and management, the fragility of employment, the direction of the company; who was in the good graces of those with power, and who weren''t. And all of this before the game was even released. A game nobody could have predicted would go on to be such a commercial and critical success. Disco Elysium''s death march did, eventually, come to an end in October of 2019. The game was released, and over the coming weeks and months word would slowly grow about this incredible new cRPG that had emerged from the Baltics. But for the people who had made the game, those who were fired and those still remaining – who had toiled for years, and experienced brutal crunch to get it out the door – there was no parade. The shellshock of their labor had left them shadows of their former selves. [HELEN] I remember that the release date was incredibly scary for me. I was so anxious. But I just remember not being able to go online, to do anything. It felt like a grieving process, as well. Because you''re suddenly... you have finished work on it. So it was a really difficult time. Our marketing was so small, because we had no budget for it. So I think it also took a while before the reviews started coming in. And before there was some kind of a consensus. [ARGO] When now, suddenly this tension dropped, cortisol levels suddenly go all the way down. Then, first of all, I think we all got sick of course, obviously, because the body has been postponing this sickness for so long. But the second thing was, that this incredible numbness came over. As you see these positive reviews and awards roll in, The crazy thing is, that you don''t really feel it. You feel it as if it''s happening to a fictional character somewhere, or like... Really, honestly, it took years. It took watching YouTube essays like Noah Caldwell-Gervais''s essay on Disco Elysium, for example, to actually start feeling this triumph of it. [ROBERT] It was two days after release, where I was like: "I''m gonna have to go on metacritic.com now." It felt, to me, like God was giving me a number. And I was finally gonna find it out. And if it is going to be less than 90, then God made a mistake in making me. Like, it was that important to me. I had promised to the investors I''m going to make a 90+ Metacritic game. [DANNY] You''re kidding. [ROBERT] I promised. [DANNY] Wow. Many times over. You should not make that promise, but I promised it. And then, when I saw it was 90+, I didn''t feel a single sliver of happiness, or even relief. I only remembered the, kind of... adrenaline... paralyzing me. [HELEN] And I think it didn''t hit me until the Game Awards show, that we''d really become big, because it just seemed that... Okay. We''ve released this super indie game. We definitely did not have super many players, in the first few weeks. It was something that gained momentum, and built up later. So when we went to LA, I remember sitting there, going for the Game Awards, and then the producers there would come up and ask me, "Oh, you''re Helen? Make sure you''re sitting here, make sure that you aren''t leaving anywhere, you know? Things that I now realize are very clear signs you''re about to win something. But I didn''t understand anything. We hadn''t even prepared a speech for it, because why would you prepare a speech if you''re so sure that you''re just there for networking, and just being there and having the experience? But you''re not going to win anything. I think this was the evening where I realized that, oh okay, Disco Elysium is actually something big. Much bigger than we ever dreamed of. [DANNY] For many, this is the moment the story of ZA/UM came into view: An exciting new European studio creating groundbreaking new work, helmed by a cabal of talented artisans. But this was obviously not the full picture. The studio would get to work on a new version, of Disco Elysium, entitled Final Cut, creating new scenes, porting it to consoles, and crucially, adding full voice acting for a game with two bibles'' worth of text. This is the version of Disco Elysium that the majority of people will come to know and love. The work to create Final Cut would be arduous, and the firings weren''t done yet. Tensions, both within the team and coming down from management, would grow to a point of no return. While the world rejoiced over this game, many of the people involved in its creation would continue to suffer. A handful of them would be eventually ostracized from the studio, and the future of the franchise would be cast into doubt. In our final episode, we''ll provide new insights into these tumultuous times. What it was like for Robert, Helen, and Rostov, when they were cast from the world of Elysium. And what it was like for the rest of the original team to look back on one of their greatest achievements with so much pride, and so much heartbreak. As ever, an early cut of this episode is available now for our patrons, and we look forward to sharing it with the rest of you quite soon. [SIIM] So, to be brutally honest, during the whole of development, I was hoping that Disco Elysium would be like an underdog cult hit. That didn''t do so well on release. Kind of like Lynch''s Dune or something. It wasn''t critically very well received, but it''s a cultural pivot point, I guess. And I was hoping for Disco Elysium to be culturally significant, and not necessarily, I guess, financially a success. But it was. It was so well received... and I''m gonna have to play it again one of these days, to see what what the fuss is about. [ALEKSANDER] Yeah, it was quite surreal. We were shipped off to Las Vegas, to receive the accolades and all of these veteran industrists are shaking your hand and giving you, maybe slightly weird, sly winks. and, "Welcome to the industry!" as if it''s a bit of a challenge or something? I don''t know... But, yeah... showered with praise. As they say, it is not good for the ego of the artist to get all that niceness. But it is, of course, sugar-sweet. [Laugh