t''s\n[374.24s] what you''re going to need to demonstrate\n[375.6s] to other people around you if they''re\n[377.72s] going to consider you for promotion.\n[380.56s] The fourth thing you can do that will\n[382.08s] put you in a better position to be\n[383.72s] considered for a promotion, and this is\n[385.72s] somewhat of a no-brainer, but it''s\n[388.08s] really important, is to really deliver\n[390.919s] on your promises.\n[393.28s] Being able to commit to something and\n[395.52s] actually show everyone around you you\n[397.68s] can be trusted that you will get done\n[400.08s] what you commit to is extremely\n[402.6s] important. An aspect of this that''s\n[405.04s] equally important is to not commit to\n[407.36s] things that you''re not sure about. And\n[409.8s] I''ve talked about in many other videos\n[411.68s] how you can learn to say no to people\n[413.84s] with grace, so it''s not like you''re\n[415.84s] telling them you won''t help them, but\n[418.2s] you''re helping them understand that you\n[419.64s] actually need more information or you\n[421.28s] might have to do something else before\n[423.0s] you can commit to it. But being honest\n[425.32s] with others about what you can and can''t\n[427.28s] do, and also learning to just say no to\n[430.4s] someone if your plate''s full, are really\n[433.24s] important skills that''ll help you set\n[435.919s] yourself apart from people that are more\n[437.88s] junior and be considered to be\n[440.12s] recognized as a senior developer or a\n[442.84s] director or a senior engineer of some\n[445.0s] sort. I know for me it probably took\n[447.2s] until about 5 years into my career\n[449.44s] before I got to the point where I felt\n[451.24s] more comfortable just telling people I''m\n[453.6s] sorry, I can''t do that. Because I looked\n[456.24s] at it like I was so new to the industry,\n[458.24s] I wanted to really keep my job, I wanted\n[460.84s] people to look at me as somebody that\n[463.4s] they liked working with, that