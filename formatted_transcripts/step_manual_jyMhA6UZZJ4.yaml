transcript: '{"content":"\n[0.16s] In our last video on wisdom, and I''ll\n[2.48s] leave a link below in the notes to that\n[4.56s] video if you haven''t seen it. In any\n[6.72s] event, if in our last video, we saw that\n[8.88s] one of the Buddha''s key qualities of a\n[11.679s] wise person was, as he says, mental\n[14.719s] mastery. That is the ability to think\n[17.68s] what you want to think and not to think\n[20.08s] what you don''t want to think. But how\n[22.88s] many of us can actually do that?\n[25.84s] Have you ever known with total clarity\n[28.88s] what the right thing to do is and then\n[31.519s] done the exact opposite? You make a\n[35.04s] resolution to eat better, to be kinder,\n[38.32s] to exercise more, to meditate more, only\n[42.64s] to find yourself falling back into your\n[45.28s] old habits.\n[47.2s] The question for us today is, what is\n[49.12s] going on in that moment where we''re\n[51.68s] falling back?\n[54.16s] Well, here we come to a kind of a\n[56.16s] crossroads. In the west, we often\n[59.68s] understand this as a moment of what''s\n[61.84s] known as weakness of the will.\n[64.879s] This diagnosis implies a kind of\n[67.68s] personal failing, a lack of willpower or\n[71.52s] self-control.\n[73.6s] The solution from this kind of view is\n[76.24s] simply to try harder. But early Buddhism\n[80.24s] offers a different diagnosis and\n[83.28s] therefore a different solution.\n[86.4s] The problem in early Buddhism or says\n[89.119s] the Buddha we might say the problem is\n[91.439s] not a weak will but instead a mistrained\n[95.84s] intention.\n[97.68s] And therefore the solution to us isn''t\n[100.88s] to simply try harder but instead to\n[104.479s] cultivate a wiser kind of practice.\n[108.32s] So having said that let''s dive a little\n[111.119s] bit deeper here.\n[113.52s] Perhaps nobody in history has captured\n[116.479s] this struggle more powerfully than St.\n[119.52s] Augustine in his confessions where he\n[122.399s] famously prayed to God, \"Grant me\n[125.28s] chastity and countenance, but not yet.\"\n[129.52s] Augustine says that he realized that the\n[132.4s] search for wisdom was so much more\n[134.879s] important than mere earthly success or\n[137.68s] the search for earthly successes.\n[140.48s] And yet he himself was unable to turn\n[144.08s] away from these worldly aims. His\n[147.599s] solution was to pray that he would\n[150.72s] eventually be able to but not yet. That\n[153.36s] is, he''d like to pursue wisdom, but\n[155.92s] somewhere down the line later on.\n[159.44s] Now, this not yet is really the essence\n[162.239s] of our problem. It illustrates the gap\n[165.92s] between our highest aspirations\n[168.879s] and our immediate desires and\n[171.12s] intentions.\n[173.36s] For Buddhism, however, for early\n[175.12s] Buddhism, this gap is not due to some\n[177.599s] kind of, let''s say, weakness.\n[180.08s] It''s a predictable outcome of wrong\n[182.8s] intentions.\n[184.64s] Now, what is what are those wrong\n[186.959s] intentions? What is that wrong intention\n[188.879s] we might have? It''s essentially the\n[191.36s] intention to put our own true well-being\n[195.68s] off until some long-term future that may\n[199.76s] indeed never arrive.\n[202.879s] But to truly understand wrong intention,\n[206.56s] I think we first have to know what right\n[208.8s] intention is\n[210.959s] in the Buddhist eight-fold path.\n[214.08s] Right intention is indeed one of the key\n[217.12s] steps. It''s defined simply as the\n[220.56s] intention of renunciation,\n[223.2s] the intention of non-illwill,\n[226.48s] and the intention of harmlessness.\n[229.68s] And these are the directions that we\n[231.68s] resolve to point our minds in our\n[233.84s] practice.\n[236.0s] Now faced with a mind that says not yet,\n[240.159s] we are, as I say, at a crossroads as to\n[243.04s] what kind of cure we''re going to pursue.\n[246.159s] And as as we''ve seen, there are two\n[248.64s] different proposals in front of us.\n[251.76s] If the problem is a weak will is that we\n[254.959s] don''t have a strong enough will or\n[256.639s] strong enough willpower, the only\n[259.12s] solution is to find more willpower.\n[262.56s] We can indeed perhaps bolster this will\n[265.759s] of ours with better reasoning or perhaps\n[269.12s] more kind of self-disipline.\n[272.72s] But at the end, willpower comes down to\n[276.0s] an issue of what we might term sort of\n[278.4s] mental toughness.\n[280.72s] In fact, the Buddha described uh very\n[283.84s] well this kind of brute force method in\n[286.72s] visceral terms, saying that with teeth\n[290.639s] clenched and tongue pressed against the\n[292.96s] roof of the mouth, they should squeeze,\n[295.84s] squash, and crush mind with mind, like a\n[299.919s] strong man who grabs a weaker man by the\n[302.72s] the head or the throat or shoulder and\n[305.68s] squeezes, squashes, and crushes them.\n[309.199s] This solution presents us with an uphill\n[312.32s] battle against ourselves.\n[314.96s] However, if the problem is wrong\n[317.52s] intention instead, then our solution is\n[320.72s] going to be different. It''s not going to\n[322.96s] be one of crushing the mind with the\n[325.28s] mind, but instead merely one of\n[328.479s] continued practice.\n[330.639s] In particular,\n[332.4s] practice of paying attention to our\n[335.199s] direct experiences.\n[338.0s] Specifically, it''s the practice of\n[340.479s] experiencing the downfall, what we might\n[343.44s] call the downfall, that is the inherent\n[346.16s] stress and suffering involved in our\n[349.12s] unskillful thoughts and actions.\n[352.8s] We can analogize this experience to when\n[355.919s] we touch a hot stove. Our parents can\n[360.479s] give us a thousand good reasons not to\n[362.88s] touch a hot stove, but it''s the direct\n[366.16s] painful experience of the heat that\n[369.039s] truly teaches us the lesson.\n[372.0s] Buddhist practice similarly is about\n[374.8s] developing sensitivity to feel this kind\n[377.52s] of pain of heat of a greedy or angry\n[381.12s] thought so that we can pull our hands\n[383.84s] back, pull our hands away before that\n[387.28s] thought causes us serious burns and\n[390.639s] indeed causes people around us serious\n[393.199s] burns which is what happens when we act\n[396.08s] on it.\n[398.0s] The Buddha taught us a method for\n[400.08s] developing this kind of sensitivity. He\n[403.6s] didn''t simply to tell us to suppress our\n[406.56s] thoughts. He taught us how to\n[409.199s] investigate those thoughts wisely in\n[412.96s] order to eventually help remove their\n[416.24s] the power that they have over us. And we\n[419.599s] can illustrate the Buddha''s technique\n[421.68s] here in two key steps.\n[425.44s] The first step is to engage mindfully\n[428.8s] with our thinking to recognize what\n[432.4s] sorts of thoughts are arising in us.\n[436.0s] Are those thoughts thoughts of greed, of\n[439.12s] anger, let''s say of cruelty, for\n[441.44s] example?\n[443.199s] We simply take time to notice the\n[446.16s] character of these thoughts before we\n[448.08s] act upon them.\n[450.4s] The second step is to investigate the\n[453.52s] nature of the thought. That is where\n[456.56s] does this thought and the action and\n[459.28s] conditions lead us. What kind of thought\n[463.199s] is it in the sense of where would it\n[464.96s] lead us?\n[467.199s] Would the thought lead us to peace or\n[470.16s] instead to agitation?\n[473.599s] Would the thought lead us to greater\n[475.599s] connection with others or instead to\n[478.56s] greater conflict with others?\n[481.68s] Is this thought actually pleasant to\n[484.56s] hold in mind?\n[486.879s] When we engage with this kind of\n[488.639s] practice repeatedly over a long period\n[492.16s] of time, remarkable things can happen.\n[495.84s] And I''ve witnessed this in my own\n[497.84s] practice.\n[499.68s] That is, we''ll find often that we stop\n[502.879s] avoiding harmful actions simply because\n[506.24s] we should avoid them. And we start\n[509.199s] avoiding harmful actions because we\n[511.68s] begin to see clearly and understand on a\n[515.36s] kind of gut level that these actions are\n[518.8s] a source of pain for us right here and\n[521.839s] right now and indeed into the future.\n[524.88s] And this, I would submit, is where the\n[527.519s] real transformation lies. Our\n[530.399s] motivations shift from a kind of guilt\n[533.519s] over our weakness of the will, let''s\n[536.32s] say, to wisdom about what''s really\n[540.08s] causing us suffering.\n[542.959s] This strategy of practice means that\n[546.16s] progress, our progress along the path is\n[549.04s] not going to be in a straight line.\n[552.32s] Instead, it''s a process of continuous\n[555.36s] resolve\n[556.88s] where the crucial skill isn''t so much\n[559.6s] willpower, but simply being present.\n[563.92s] We know that we''re going to falter along\n[566.32s] the way many times. We know that old\n[570.08s] unskillful habits are going to reappear.\n[573.76s] But these are not simply a failure of\n[576.16s] our own willpower or of something\n[579.2s] fundamentally wrong or broken within us.\n[582.64s] Instead, they should be seen as crucial\n[585.2s] learning opportunities.\n[587.44s] That is when unskillful things arise\n[590.24s] that gives us a chance to experience the\n[593.44s] downfall in suffering that''s conditioned\n[596.32s] by these kinds of wrong intentions.\n[600.399s] Being present with this syndrome as it\n[603.76s] continues to happen in us over over\n[606.0s] months and years can help to strengthen\n[608.88s] our resolve to get back on the right\n[611.6s] path.\n[613.839s] So progress begins with our intention.\n[618.48s] The decision to put the first foot\n[620.72s] forward, to keep walking, and to\n[623.839s] crucially pick ourselves up\n[626.399s] compassionately and get back on that\n[629.12s] path when we wander off into one ditch\n[632.079s] or another, which we will do.\n[635.36s] So this practice of working with our\n[638.0s] intentions is a cornerstone of the\n[641.68s] entire eight-fold path which is why\n[644.959s] right intention is indeed one of the\n[646.88s] stages in that path. And to see how\n[650.24s] right intention fits into the bigger\n[652.88s] picture of Buddhist practice, I''d\n[655.2s] recommend my my playlist on the\n[657.76s] eight-fold path in Buddhism. And I''ll\n[660.399s] leave a link to that playlist up here on\n[662.24s] the screen. If you''re getting something\n[664.48s] out of these videos of mine, consider\n[666.8s] taking a look at my Patreon page, which\n[669.04s] is linked here up in the screen and down\n[670.64s] below in the notes, and see if you want\n[672.56s] to help support the channel and the work\n[674.56s] that I''m doing here. Thanks for much so\n[676.56s] much for watching and be"}'
