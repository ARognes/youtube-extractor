transcript: '{"content":"\n[0.0s] One of the things that I stumbled into,\n[1.6s] which I was honestly proud about, was\n[4.16s] the realization that when you get\n[5.8s] diagnosed with ADHD late in life, you\n[8.44s] also have a mood disorder until proven\n[11.0s] otherwise. See, as a psychiatrist, I\n[12.96s] used to think, \"Okay, this person''s\n[14.28s] diagnosis is ADHD, and they may have\n[16.96s] depression, they may have bipolar, but I\n[19.16s] that was like a maybe.\" Now, my thinking\n[21.32s] has shifted. If they have adult\n[22.92s] diagnosed ADHD, I am assuming the burden\n[26.48s] of proof has now changed in my mind.\n[29.16s] They have depression until I''m sure they\n[31.12s] don''t. It''s not a possibility, it is\n[33.4s] true until it is proven otherwise. I''m\n[35.24s] going to operate under the assumption\n[37.64s] 47% of women and 78% of men who are on\n[41.04s] the spectrum, staggering percentages,\n[43.76s] are traumatized by things that we do not\n[46.96s] usually assess for in an intake. I have\n[50.08s] a script when I''m evaluating someone for\n[52.08s] trauma in the emergency room. Have you\n[54.08s] ever been physically abused, emotionally\n[55.8s] abused, sexually abused? What was\n[57.24s] growing up like? I don''t ask, \"Have you\n[59.44s] ever seen a therapist and found yourself\n[61.88s] feeling traumatized by that process?\"\n[64.559s] Have you been bullied? Have you ever\n[65.96s] lost a pet? Right? And this is the\n[67.48s] important thing. Losing a pet is hard\n[69.44s] for everyone, but it has a greater\n[71.4s] likelihood of becoming PTSD if you''re on\n[73.76s] the spectrum."}'
