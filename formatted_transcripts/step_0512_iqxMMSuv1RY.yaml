ssary in a building full of firefighters. Similar story here. Whilst the voting system  was cryptographically secure as evidenced by the fact that they can't access the results, so  caught up in the details, they missed something that someone half as intelligent would have  spotted inadvertently designing an election which could be sabotaged by a single person.  However, the organization is confident that this is an honest but unfortunate human mistake  with the trustee who accidentally lost his key now having resigned. At this point, they don't have  much choice but to completely rerun the election now having changed the rules so only two out of  the three keys are needed to decrypt the results, which kind of undermines their concern of two  trustees possibly colluding. Perhaps a system of five keys where only three of them are needed  would let them have their cake and eat it too. But anyway, whilst today's sponsor can't bake you  a cake, they can help you get your personal data deleted. Ever googled yourself out of Borm only to  find your name, address, phone number, and other assorted personal details up for sale on some  sketchy people search site? Welcome to the world of data brokers. These bottom feeders scrape all  kinds of sources for your personal information, slowly building a profile on you before selling it  off to anyone willing to pay. All totally legal, by the way. But the good news is Delete Me  can help you fight back. Just complete a quick profile so Delete Me knows what to look for. Then  they'll scan hundreds of data brokers and within 7 days compile a personalized report. But most  importantly, they'll request removal of the data on your behalf. And so long as you're a member,  Delete Me will keep checking in on data brokers, creating regular reports, and automatically  removing your data. And in the unlikely scenario you find your personal data on a sneaky site  that Delete Me can't by default remove it from, not to worry. Just shoot off a custom  request to your personal privacy adviser, an actual real human by the way, who will make  it their mission to have your data wiped. So, take back control of your data today with  DeleteMe, who are giving you guys 20% off their eligible plans with my link in the description.  Delete Me is also international, serving multiple countries. Just make sure to click the correct  link in the description to take back control of your data today. Next up, begun the war has. So,  TPLink is suing Netgear. The lawsuit alleges that Netgear has been operating a smear campaign to  falsely cast TPLink as having been infiltrated by the Chinese government, which is totally  baseless. Well, according to TPLink. More widely, this whole debate has been going on for a  while now, getting to the point where it's an existential problem for TPLink. A ban on the sale  of their hardware is now a real possibility with multiple US federal departments backing the idea.  And Netgear has to some extent been fanning the flames. Allegedly, the lawsuit claims that Netgear  used influencers to propagate its false messages, but stops short of mentioning exactly who.  Also alleged is that Netgear spent hundreds of thousands of dollars lobbying politicians  on the topic of competition with China and cyber security. On the China question,  TPLink was founded in China 30 years ago, but their American operations are done under a  different company now, which they say functions as a standalone entity, totally separate. However,  that hasn't unstuck accusations that the Chinese government is somehow secretly in control. Netgear  CEO refers to TPLink as a national security risk, a falsehood. According to the lawsuit, he also  referenced a Microsoft blog post which he says exposed TPLink's role in typhoons that the US  is facing. Typhoon here being a term used to refer to Chinese hackers. The Microsoft blog  post reveals that Chinese state hackers did indeed exploit a vulnerability in TPLink devices  to create a botnet. But Microsoft didn't suggest that TPLink backdoor their devices on purpose or  that TPLink enabled this in any way. And whilst there are several cases of TPLink routters being  exploited and used by Chinese government hackers, on the flip side, there are also several  high-profile cases of Netgear routters also having been hacked into and used by the Chinese.  Despite Netgear being an American company, TPLink really feels like they're being unfairly  singled out here. And given the company has a 60% share of home and small business routers in the  US, a potential ban on their hardware would really shake up the market. Something that Netgear would,  objectively speaking, stands to benefit from, and they're preparing for it. Netgear CEO said  that they're already looking at investing in their supply in the anticipation of a potential  ban. When you're a network equipment manufacturer, the accusation that you're backdoored by the  Chinese government is about as bad as being called a witch in 16th century England, as Huawei  found out the hard way. Whether TPLink executives are secretly taking orders from the Chinese  government, I can't pretend to know. However, in terms of real publicly available information,  I couldn't find any evidence that TPLink devices are over represented in terms of vulnerabilities.  And if you consult the cyber security hive mind, you won't find much concern about TPLink being  less secure than other brands. If anything, the general consensus is that they're cheap and  reliable. So, there's not much reason to bin your TPLink router. But if you don't want to take any  risks, maybe take a look at flashing it with open- source firmware. Next up, how an MP3 is helping  to destroy hypersonic missiles. Meet the KH47 M2 Kinsel ballistic missile. It was described as  invincible back when it was introduced in 2018. Traveling at speeds of over Mac 10, they've been  raining down on Ukraine since the start of the war. Patriot missile systems provided by the  US have had some luck in shooting them down, but Ukraine is short on ammunition for these  things, which isn't helped by the fact that a single Patriots missile costs more than $4  million. On top of that, there's recent reports that Russia has modified these things so that  they follow a more unpredictable flight path, making intercepting them way more difficult,  reducing Ukraine's interception rate from 37% to just 6% in a matter of weeks. However, a  different approach to downing these things has had some success apparently. This comes from 404 media  who spoke to a member of Nightw Watch, a Ukrainian electronic warfare team. He explains that these  things use glowness in order to navigate. It's like GPS but Russian. And you can actually see on  a downed missile these little ceramic tiles. These are the antennas. And if they look familiar,  they're pretty similar to GPS antennas used in hobbyist electronics. But the missile uses up to  16 of them in an attempt to counteract jamming, which typically works by spamming random noise  in order to overpower the signal coming from the 24 GLONA satellites. But according to  Nightw Watch, the Ukrainian company Lemur makes an electronic warfare system that takes a  different approach. Instead of just random noise, an MP3 works just as well. So, they've been using  a song about a Ukrainian nationalist instead. So, Bandaraa is a slightly controversial individual  who during World War II was at one point allied with a certain mid-century German fellow that I'll  most definitely get demonetized for talking about. Russian media sometimes uses the very existence  of this guy as justification for modern-day Ukraine being riddled with mid-century German  sympathizers. So, Nightw Watch thought it would be hilarious to use a song about him ironically  poking fun at the Russians. But in some sense, I guess that does play into the Russian position.  But I hope that makes sense. After the song hits, the Lemur system exploits the fact that  Gloness is open and unauthenticated. So, it spoofs a signal, making the missile think it's  in Lemur, Peru. Naturally, the missile isn't too happy about this and tries to suddenly change  direction. But when you're traveling at Mac 5, this doesn't work very well with the stress  of the sudden change of direction ripping the missile apart and it just falls to the ground  where it can be torn apart and analyzed. Nightw Watch claims they've managed to down 19 missiles  in the past couple weeks using this technique. But this of course comes with the usual caveats that  these kinds of numbers are of course impossible to verify. As always, thanks for watching and  I'll see you in the next video. Have a good one.
