transcript: '{"content":"\n[0.0s] One of the biggest mysteries of our existence \nis also one of the biggest mysteries of physics:\n[5.0s] time. We experience time as passing, with a \nspecial moment that we call “now”. Now you’re\n[12.0s] watching this video, half an hour ago you \nwere doing something else. Whatever you did,\n[16.0s] there’s no way to change it. And what you will \ndo in half an hour is up to you. At least that’s\n[22.0s] how we perceive time. But what physics tells us \nabout time is very different from our perception.\n[28.0s] The person who figured this out was \nnone other than Albert Einstein.\n[32.0s] I know. That guy again. Turns out he \nkind of knew it all. What did Einstein\n[38.0s] teach us about the past, the present, and the \nfuture? That’s what we’ll talk about today.\n[47.0s] The topic we’re talking about today is \ncovered in more detail in my new book\n[51.0s] “existential physics” which will be \npublished in August. You find more info\n[55.0s] about the book at existentialphysics dot com\nWe think about time as something that works\n[60.0s] the same for everyone and every object. If one \nsecond passes for me, one second passes for you,\n[66.0s] and one second passes for the clouds above. \nThis makes time a universal parameter. This\n[73.0s] parameter labels how much time passes \nand also what we all mean by “now”.\n[78.0s] Hermann Minkowski was the first to notice that \nthis may not be quite right. He noticed that\n[85.0s] Maxwell’s equations of electrodynamics make much \nmore sense if one treats time as a dimension,\n[91.0s] not as a parameter. Just like a ball doesn’t \nchange if you rotate one direction of space\n[97.0s] into another, Maxwell’s equations don’t change \nif you rotate one direction of space into time.\n[103.0s] So, Minkowski said, we just combine space with \ntime to a 4 dimensional space-time, and then\n[110.0s] we can rotate space into time just like we can \nrotate two directions of space into each other.\n[116.0s] And that naturally explains why Maxwell’s \nequations have the symmetry they do have.\n[122.0s] It doesn’t have anything to do \nwith electric and magnetic fields,\n[126.0s] it comes from the properties \nof space and time themselves.\n[130.0s] I can’t draw a flower, let alone four dimensions, \nbut I can just about manage two straight lines,\n[136.0s] one for time and the other for at least one \ndimension of space. This is called a space-time\n[142.0s] diagram. If you just stand still, then your motion \nin such a diagram is a straight vertical line.\n[148.0s] If you move at a constant velocity, your \nmotion is a straight line tilted at some angle.\n[154.0s] So if you change velocity, you rotate in \nspace-time. The maximal velocity at which\n[159.0s] you can move is the speed of light, which by \nconvention is usually drawn at a 45-degree angle.\n[165.0s] In space we can go forward-backward, left right, \nor up down. In time we can only go forward,\n[172.0s] we can’t make a u-turn, and there aren’t any \ndriveways for awkward three-point turns either.\n[177.0s] So time is still different from space in some \nrespect. But now that time is also a dimension,\n[183.0s] it’s clear that it’s just a label for coordinates, \nthere’s nothing universal about it. There are many\n[189.0s] ways to put labels on a two-dimensional space \nbecause you can choose your axes as you want.\n[194.0s] The same is the case now in space-time. Once you \nhave made time into a dimension, the labels on it\n[201.0s] don’t mean much. So what then is the time that we \ntalk about? What does it even mean that time is a\n[208.0s] dimension? Do other dimensions exist? Supernatural \nones? That could explain the strange sounds you’ve\n[214.0s] been hearing at night? No. That''s a separate \nproblem I''m afraid I can''t help you with.\n[220.0s] It was Albert Einstein who understood what \nthis means. If we also want to understand it,\n[225.0s] we need four assumptions. The speed of light \nin vacuum is finite, it’s always the same,\n[231.0s] nothing can go faster than the speed of light, \nand all observers’ viewpoints are equally valid.\n[237.0s] This formed the basis of Einstein’s \ntheory of Special Relativity.\n[241.0s] Oh, and also, the observers don’t have to \nexist. I mean, this is theoretical physics,\n[246.0s] so we’re talking about theoretical observers, \nbasically. So, if there could be an observer\n[252.0s] with a certain viewpoint then then that \nviewpoint is equally valid as yours.\n[257.0s] Who or what is an observer? Is an ant an observer? \nA tree? How about a dolphin? What do you need to\n[264.0s] observe to deserve being called an observer and \nwhat do you have to observe with? Believe it or\n[270.0s] not, there’s actually quite some discussion about \nthis in the scientific literature. We’ll side-step\n[276.0s] this, erm, interesting discussion and use the \nword “observer” the same way that Einstein did,\n[281.0s] which is a coordinate system. You see, it’s a \ncoordinate system that a theoretical observer\n[286.0s] might use, dolphin or otherwise. Yeah, maybe \nnot exactly what the FBI thinks an observer is,\n[293.0s] but then if it was good enough for Einstein, it’ll \nbe good enough for us. So Einstein’s assumption\n[299.0s] basically means any coordinate system should be as \ngood as any other for describing physical reality.\n[305.0s] These four assumptions sound rather innocent at \nfirst but they have profound consequences. Let’s\n[311.0s] start with the first and third: The speed of light \nis finite and nothing goes faster than light. You\n[318.0s] are probably watching this video on a screen, \na phone or laptop. Is the screen there now?\n[324.0s] Unless you are from the future watching this video \nas a hologram in your space house, I''m going to\n[329.0s] assume the answer is yes. But a physicist might \npoint out that actually you don’t know. Because\n[336.0s] the light that’s emitted from the screen now \nhasn’t reached you yet. Also if you are from\n[342.0s] the future watching this as a hologram, make sure \nto look at me from the right. It’s my good side.\n[347.0s] Maybe you hold the phone in your hand, but nerve \nsignals are ridiculously slow compared to light.\n[354.0s] If you couldn’t see your hand \nand someone snatched your phone,\n[357.0s] it’d take several microseconds for \nthe information that the phone is gone\n[361.0s] to even arrive in your brain. So how \ndo you know your phone is there now?\n[367.0s] One way to answer this question \nis to say, well, you don’t know,\n[371.0s] and really you don’t know that anything \nexists now, other than your own thoughts.\n[377.0s] I think, therefore I am, \nas Descartes summed it up.\n[381.0s] This isn’t wrong – I’ll come back to this later – \nbut it’s not how normal people use the word “now”.\n[388.0s] We talk about things that happen “now” all the \ntime, and we never worry about how long it takes\n[393.0s] for light to travel. Why can’t we just agree on \nsome “now” and get on with it? I mean, think back\n[400.0s] to that space-time diagram. Clearly this flat line \nis “now”, so let’s just agree on this and move on.\n[407.0s] Okay, but if this is to be physics rather \nthan just a diagram you have to come up with\n[413.0s] an operational procedure to determine what we \nmean by “now”. You have to find a way to measure\n[418.0s] it. Einstein did just that in what he called \nGedankenexperiment, a “thought experiment”.\n[425.0s] He said, suppose you place a mirror to your \nright and one to your left. You and the mirrors\n[431.0s] are at fixed distance to each other, so in \nthe space time diagram it looks like this.\n[436.0s] You send one photon left and one right, and make \nsure that both photons leave you at the same time.\n[442.0s] Then you wait to see whether the photons \ncome back at the same time. If they don’t,\n[447.0s] you adjust your position until they do.\nNow remember Einstein’s second assumption,\n[454.0s] the speed of light is always the same. This means \nif you can send photons to both mirrors and they\n[461.0s] come back at the same time, then you must be \nexactly in the middle between the mirrors.\n[466.0s] The final step is then to say that at exactly \nhalf the time it takes for the photons to return,\n[473.0s] you know they must be bouncing off the mirror. You \ncould say “now” at the right moment even though\n[480.0s] the light from there hasn’t reached you yet. It \nlooks like you’ve found a way to construct “now”.\n[486.0s] But here’s the problem. Suppose you have a friend \nwho flies by at some constant velocity, maybe in a\n[491.0s] space-ship. Her name is Alice, she is much cooler \nthan you, and you have no idea why she''s agreed to\n[497.0s] be friends with you. But here she is, speeding \nby in her space-ship left to right. As we saw\n[502.0s] earlier, in your space-time diagram, Alice moves \non a tilted straight line. She does the exact\n[509.0s] same thing as you, places mirrors to both sides, \nsends photons and waits for them to come back,\n[515.0s] and then says when half the time has passed \nthat’s the moment the photons hit the mirrors.\n[522.0s] Except that this clearly isn’t \nright from your point of view.\n[526.0s] Because the mirrors to her right are in the \ndirection of her flight, so the light takes longer\n[531.0s] to get there than it does to the mirrors on the \nleft, which move towards the light. You would say\n[537.0s] that the photon which goes left clearly hits the \nmirror first because the mirror’s coming at it.\n[543.0s] From your perspective, she just doesn’t notice \nbecause when the photons go back to Alice,\n[549.0s] the exact opposite happens. The photon coming from \nleft takes longer to get back, so the net effect\n[555.0s] cancels out. What Alice says happens “now” \nis clearly not what you think happens “now”.\n[563.0s] For Alice on the other hand, you are the one \nmoving relative to her. And she thinks that\n[569.0s] her notion of “now” is right and yours is wrong.\n[572.0s] So who is right? Probably Alice, you \nmight say. Because she’s much cooler\n[577.0s] than you. She owns a spaceship, after \nall. Maybe. But let’s ask Einstein.\n[582.0s] Here is where Einstein’s forth assumption comes \nin. The viewpoints of all observers are equally\n[588.0s] valid. So you’re both right. Or, to put it \ndifferently, the notion of “now” depends on the\n[596.0s] observer, it is “observer-dependent” as physicists \nsay. Your “now” is not the same as my “now”.\n[604.0s] If you like technical terms, this is also \ncalled the relativity of simultaneity.\n[610.0s] These mismatches in what different observers think \nhappens “now” are extremely tiny in every-day\n[616.0s] life. They only become noticeable when relative \nvelocities are close by the speed of light,\n[622.0s] so we don’t normally notice them. If you and I \ntalk about who knocked at the door right now,\n[628.0s] we won’t misunderstand each other. If we’d zipped \naround with nearly the speed of light, however,\n[633.0s] referring to “now” would get very confusing.\n[636.0s] This is pretty mind-bending already, but wait, it \ngets wilder. Let us have a look at the space-time\n[643.0s] diagrams again. Now let us take *any* two events \nthat are not causally connected. This just means\n[649.0s] that if you wanted to send a signal from one to \nthe other, the signal would have to go faster\n[654.0s] than light, so signaling from one to the other \nisn’t possible. Diagrammatically this means\n[661.0s] if you connect the two events the line has an \nangle less than 45 degrees to the horizontal.\n[667.0s] The previous construction with the mirrors shows \nthat for any two such events there is always some\n[674.0s] observer for whom those two events happen \nat the same time. You just have to imagine\n[679.0s] the mirrors fly through the events and the \nobserver flies through directly in the middle.\n[685.0s] And then you adjust the velocity until the \nphotons hit both events at the same time.\n[691.0s] Okay, so any two causally disconnected events \nhappen simultaneously for some observer. Now\n[698.0s] take any two events that are causally connected. \nLike eating too much cheese for dinner and then\n[703.0s] feeling terrible the morning after. Find some \nevent that isn’t causally connected to either.\n[709.0s] Let’s say this event is a supernova \ngoing off in a distant galaxy.\n[714.0s] There are then always observers for whom the \nsupernova and your cheese dinner are simultaneous,\n[719.0s] and there are observers for whom the supernova \nand your morning after are simultaneous.\n[725.0s] Let’s then put all those together. If you \nare comfortable with saying that something,\n[730.0s] anything, exists “now” which isn’t here, then, \naccording to Einstein’s fourth assumption,\n[737.0s] this must be the case for all observers. But if \nall the events that you think happen “now” exist\n[743.0s] and all other observers say the events that \nhappen at the same time as those events,\n[749.0s] then all events exist “now”. Another way to \nput it is that all times exist in the same way.\n[757.0s] This is called the “block universe”. It’s \njust there. It doesn’t come into being,\n[763.0s] it doesn’t change. It just sits there.\n[765.0s] If you find that somewhat hard to accept, there \nis another possibility to consistently combine\n[771.0s] a notion of existence with Einstein’s \nSpecial Relativity. All that I just said\n[776.0s] came from assuming that you are willing to say \nsomething exists now even though you can’t see\n[783.0s] or experience it in any way. If you are willing \nto say that only things exist which are now\n[789.0s] and here, then you don’t get a block universe. \nBut maybe that’s even more difficult to accept.\n[796.0s] Another option is to simply invent a notion of \n“existence” and define it to be a particular\n[801.0s] slice in space-time for each moment in time. \nThis is called a “slicing” but unfortunately\n[808.0s] it has nothing to do with pizza. If it \nhad any observable consequences, that\n[813.0s] would contradict the fourth assumption Einstein \nmade. So it’s in conflict with Special Relativity\n[819.0s] and since this theory is experimentally extremely \nwell confirmed, this would almost certainly mean\n[825.0s] the idea is in conflict with observation. \nBut if you just want to define a “now” that\n[830.0s] doesn’t have observable consequences, you can do \nthat. Though I’m not sure why you would want to.\n[837.0s] Quantum mechanics doesn’t change anything about \nthe block universe because it’s still compatible\n[842.0s] with Special Relativity. The measurement update \nof the wave-function, which I talked about in\n[847.0s] this earlier video, happens faster than the speed \nof light. If it could be observed, you could use\n[854.0s] it to define a notion of simultaneity. But it \ncan’t be observed, so there’s no contradiction.\n[860.0s] Some people have argued that since \nquantum mechanics is indeterministic,\n[865.0s] the future can’t already exist in the block \nuniverse, and that therefore there must also\n[870.0s] be a special moment of “now” that divides \nthe past from the future. And maybe that\n[877.0s] is so. But even if that was the case, the \nprevious argument still applies to the past.\n[883.0s] So, yeah, it’s true. For all we currently know, \nthe past exists the same way as the present.\n[890.0s] So you thought this is a video \nabout Special Relativity,\n[893.0s] but then I’ve been talking \nabout quantum mechanics again.\n[897.0s] Indeed, I now have an entire course \nabout quantum mechanics up at Brilliant\n[901.0s] which accompanies my videos on the topic.\n[903.0s] Brilliant is an amazing tool for learning with \ncourses on a large variety of topics in science\n[908.0s] and mathematics. Our new course will give you an \nintroduction to superpositions and entanglement,\n[914.0s] the uncertainty principle, non-commutativity, \nand Bell’s theorem. And you can then build up\n[920.0s] your knowledge with Brilliant’s courses on quantum \nobjects and quantum computing or linear algebra,\n[926.0s] or wherever you want to go after this. Like all \ntheir courses, our new course is interactive and\n[931.0s] will challenge you with questions so you \ncan check your understanding right away.\n[936.0s] I had a lot of fun working \nwith Brilliant’s team on this,\n[938.0s] and I hope you’ll enjoy it too. To support \nthis channel and learn more about Brilliant,\n[944.0s] go to Brilliant dot org slash \nSabine and sign up for free.\n[948.0s] The first 200 subscribers using this link will get \n20 percent off the annual premium subscription.\n[954.0s] Thanks for watching, see you next week."}'
