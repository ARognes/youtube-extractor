transcript: '{"content":"\n[45.115s] ‘Save’. Verb.\n[47.738s] ‘to deliver someone from danger or difficulty’.\n[51.6s] The urge to save people might sound\n[53.569s] — by definition — like an unqualified\nsocial good.\n[57.01s] Of course in countless cases, the impulse\nto assist individuals\n[61.0s] we perceive to be in some kind of trouble\n[63.109s] is a resoundingly positive one.\n[65.44s] But, being human, that impulse can misfire.\n[69.62s] Maisy spots a man drowning.\n[71.97s] She dives in and drags him ashore, kicking\nand thrashing.\n[75.95s] He then tells her he wasn’t drowning but waving.\n[80.773s] Awkward.\n[82.157s] As onlookers to this incident, we might view it\n[85.329s] as a well-intentioned mistake and see the\nfunny side.\n[89.21s] But then it happens with another swimmer.\n[92.87s] And another.\n[94.61s] And another.\n[96.69s] Each time the swimmer tells Maisy her intervention\nwasn’t needed.\n[100.759s] But Maisy remains convinced that without her\nthey would’ve perished.\n[106.11s] She dismisses their protests as face-saving\ndelusions.\n[109.97s] And, swallowing the increasingly salty martyrdom\nshe feels at their ingratitude\n[115.36s] Maisy continues her redundant rescue campaign.\n[118.45s] It’s as if she’s on a pre-programmed mission\n[121.759s] unable to register conflicting new intel and\nrevise her course of action.\n[127.359s] The compulsion to rescue others is commonly\nknown as a ‘saviour complex’.\n[132.5s] The word ‘complex’ refers to a pervasive\npattern of feelings, beliefs, perceptions, impulses\n[139.72s] all based on a specific issue.\n[142.41s] With guilt complexes, this pattern centres\naround notions of personal blame.\n[147.23s] With superiority complexes, the pattern reinforces\nideas about personal status and value.\n[154.25s] This pattern becomes the lens through which\nwe view ourselves.\n[159.06s] Its distorted nature clouds our ability to\nprocess feedback from the environment.\n[164.5s] When reality conflicts with this lens, we\nbend and break reality to fit\n[169.56s] inventing fallacious denials and rationalisations\nto erase facts and destroy context.\n[177.36s] This makes the complex maladaptive\n[179.31s] — ie it doesn’t adapt adequately or appropriately\nto the situation.\n[185.33s] Which is why, despite consistent evidence\nto the contrary\n[188.65s] individuals like Maisy manage to maintain\ntheir heroic self-images.\n[194.42s] As I’ll be exploring later with some real-life examples\n[197.75s] there’s no single path to a saviour complex.\n[200.7s] Like comic book superheroes\npeople with saviour complexes\n[205.049s] are an eclectic group with a vast variety\nof origin stories.\n[209.8s] The compulsions that drive saviour behaviour\ncan take hold in childhood\n[213.849s] or in adulthood in response to transformative\nlife experiences\n[218.569s] from overcoming a major illness to witnessing\na grave injustice\n[223.159s] to encountering an influential new social group.\n[227.45s] Saviour compulsions could be rooted\n[228.81s] in mainly individual or ideological factors\n— or a combination.\n[234.65s] Their targets could range from loved ones\nto the whole of humanity.\n[239.45s] But a common thread among all these saviours\nis a persistent failure\n[243.33s] to look closely at the people they plan to save\n[245.81s] — and see them for who they are.\n[248.83s] One of the habits we slip into when we develop\n[251.23s] maladaptive saviour tendencies is infantilising people.\n[255.94s] We view them as less capable and aware than\nthey are.\n[259.41s] And, as we would with children\n[261.82s] we start to impose our help on them without\ninvitation or consultation.\n[267.73s] For the target, our unsolicited interventions\ncan feel awkward, confusing and alienating.\n[275.41s] In some cases, our ‘help’ might get so\nsmothering and invasive\n[279.979s] that it creates hefty additional obstacles\nfor targets to overcome.\n[284.27s] Often, there wasn’t even a problem to fix\nin the first place.\n[288.699s] We just invented it to satisfy our insatiable\nurge to help.\n[294.75s] Overcoming these maladaptive saviour compulsions\nis possible\n[297.949s] if we’re willing to engage in some serious\nself-reflection.\n[300.72s] Unfortunately, we sometimes have to reach\ncrisis point\n[305.44s] before we take even a sidelong glimpse at\nourselves.\n[309.43s] We have to drive ourselves to exhaustion.\n[312.72s] Relationships and careers have to start crumbling\nand collapsing.\n[316.45s] Even when things are falling apart, it can\nbe unthinkably tough to face the truth\n[320.729s] that for all the years we’ve been donning\nour gaudy superhero costumes\n[324.819s] believing we were making a real difference\n[327.44s] all we were actually doing was participating\nin an addictive form\n[331.08s] of bogus social interaction known as drama.\n[339.66s] We are a complex, multi-faceted species\n[342.979s] with a staggering potential for spontaneity,\nadaptability and creativity.\n[348.6s] Which is handy in view of our unfathomable\nindividual variation.\n[353.63s] Each of us is born with our own unique combination\n[356.38s] of physical and psychological capacities and\nthrust with no road map\n[361.74s] into our own distinctive social, cultural\nand environmental conditions.\n[366.96s] In confronting the obstacles of our particular\nroll-of-the-dice existence\n[371.23s] — from minor irritations to major disasters —\n[374.759s] we each have at our disposal a brain bursting\nwith critical analytical potential.\n[380.199s] But often, instead of using these formidable faculties\n[384.11s] to figure out real practical solutions to\nour problems\n[387.38s] we get sidetracked into an empty parody of\nproblem-solving called drama.\n[393.44s] Drama allows us to pretend we’re tackling\nreal issues\n[396.38s] when we’re actually just indulging in self-affirming\nmind games.\n[400.95s] Drama brings out the worst in us\n[402.639s] opening the doors to our most controlling,\ncoercive, dehumanising behaviour.\n[408.35s] When we develop powerful saviour tendencies\n[410.759s] we seem drawn to the artificial glow of drama\nlike moths to a porch light.\n[416.539s] Steadfast in the belief we’re fighting the\ngood fight\n[419.22s] we can drift into the most disturbing extremes\nwithout a moral twinge.\n[424.31s] I use the word drama in the social-psychological\nsense\n[429.16s] although there are parallels with the theatrical sense.\n[432.67s] In theatrical drama, scenes that appear spontaneous\nare in fact predefined.\n[437.879s] What seem like authentic interactions are\nbuilt on illusion and misdirection.\n[443.29s] In social-psychological drama\n[445.08s] individuals also deliver performances based\non deceptive predefined roles.\n[450.77s] The actors on this dramatic stage typically\nfall into one of three interconnected positions.\n[456.53s] Together these form what psychologist Steven\nKarpman dubbed the ‘drama triangle’.\n[462.72s] First there’s the victim.\n[464.199s] In this dramatic role, we play the part of\na powerless injured party.\n[468.05s] We become passive and self-pitying and, like\nchildren\n[471.97s] we look to other people to rescue us.\n[474.71s] Confusingly, if we’re offered real practical\nsolutions\n[478.04s] we’ll often find ways to avoid, reject or\nsabotage them.\n[482.83s] Real solutions generally involve taking adult\nresponsibility for our own welfare\n[487.51s] — and drama-based victimhood is rooted in\nthe rejection of responsibility.\n[492.889s] We’re invested in the idea that our feelings,\nour experiences,\n[497.25s] our lives are determined by other people.\n[500.8s] Next we have the persecutor, who looks for\nvictims to harass, attack and oppress.\n[507.479s] In this dramatic role, we become self-righteous\nand dictatorial.\n[511.699s] We might portray ourselves as purveyors of\ntruth and justice.\n[515.459s] But we disregard the mechanisms that underpin\nthese principles\n[518.889s] — like the burden of proof, due process,\nthe presumption of innocence.\n[525.63s] Instead we play judge, jury and jailer in\nour own kangaroo courts.\n[531.38s] Like victims, we also dodge personal responsibility.\n[535.45s] If our own flaws and shortcomings are pointed out\n[537.73s] we’ll find ways to excuse, minimise or deny them.\n[541.67s] Someone else is always to blame.\n[545.029s] Lastly we come to the rescuer, who looks for\nvictims to save.\n[549.73s] In this role, we take on too much responsibility\n[552.529s] by assuming the burden of other people’s\nproblems.\n[555.47s] On the surface, we might appear self-sacrificing.\n[559.22s] It can seem — to others and ourselves —\n[562.39s] like we’re constantly putting our own needs\nbehind the needs of others.\n[566.69s] In fact, our most dominant need is firmly\nstage front.\n[571.08s] As rescuers, our chief goal isn’t to help others.\n[574.41s] It’s to extract validation from them.\n[577.31s] Here we have the central self-deception of\nthis dramatic role.\n[582.34s] Playing the rescuer is primarily about taking,\nnot giving.\n[586.77s] This helps to explain why targets often come\naway from us feeling so drained.\n[592.13s] The specific type of validation we look for\nas rescuers can vary hugely.\n[597.44s] We might be after attention, admiration, control,\nsocial acceptance.\n[604.4s] If we have problems with guilt or shame\n[606.839s] we might play the rescuer to gain self-worth.\n[609.2s] Our need for validation can also vary in intensity.\n[614.66s] The more intense it gets, the less room we\nhave for competing needs\n[618.09s] — other people’s or our own —\n[621.41s] and the more misguided and reckless our rescue\nattempts can become.\n[626.28s] So we have three dramatic roles, all based\nin delusion and contradiction\n[631.16s] each focused on seeking affirmation for its\nparticular fantasy.\n[635.04s] It’s no surprise that none of them do anything\nto help us work towards solutions.\n[641.58s] Instead they just reinforce existing problems\n— and generate new ones.\n[646.839s] When we think of saviour complexes\n[649.51s] we might reasonably equate them with the rescuer\nposition.\n[652.72s] In fact saviours can occupy any of the dramatic roles.\n[657.402s] One of the things that makes drama\n[659.139s] such a slippery, tangled-up form of social\ninteraction\n[662.339s] is that players can switch positions.\n[665.126s] Rescuers can become victims.\n[667.366s] Victims can become persecutors.\n[670.03s] And so on.\n[671.353s] These role shifts can occur suddenly in response\nto a single incident\n[675.5s] that disrupts our perception of ourselves\nin relation to others.\n[678.72s] Or they can be gradual, in response to an\naccumulation of experiences.\n[684.15s] An example of these dramatic shifts is illustrated\n[687.52s] in the story of someone I’ll call Gordon.\n[691.35s] Gordon has a radioactive saviour streak.\n[694.12s] He’s recruited by an ideological group that\nseems to share his outlook.\n[700.1s] In rescuer mode, Gordon approaches\nother individuals to recruit.\n[704.36s] But things don’t go well.\n[707.019s] Some of his targets laugh at his ideas.\n[710.07s] Some angrily condemn them as corrupt and degrading.\n[714.639s] Some targets engage in polite discourse and\noffer thoughtful criticisms.\n[719.139s] The majority simply isn’t interested.\n[723.91s] Something Gordon later came to appreciate\n[725.529s] was that people generally have their own concerns\nto deal with\n[728.79s] and don’t have time for ideological sales\npitches from strangers.\n[733.91s] But at the time, all these widely diverging\nreactions just blur into one big rejection.\n[740.199s] For Gordon, these encounters aren’t about\nan exchange of ideas.\n[744.96s] They’re geared towards one outcome: recruitment.\n[748.779s] And all he takes away is that people wouldn’t\nlisten to him.\n[752.829s] He slips into a self-pitying victim position.\n[756.029s] Can’t they see he’s trying to help them?\n[759.899s] From his self-absorbed viewpoint\n[761.889s] people seem deliberately, maliciously obstructive.\n[766.24s] As his ideas continue to get rebuffed\n[768.75s] his despair hardens into contempt.\n[772.35s] Gradually, he drifts into the persecutor position.\n[775.899s] In his mind, if you’re not onboard with\nthe group’s ideas\n[779.199s] you’re an obstacle to salvation.\n[782.54s] He starts insulting anyone who isn’t instantly\nreceptive to his ideas.\n[787.5s] When people react with predictable hostility\n[790.68s] Gordon takes their animosity as proof of their\nwicked nature.\n[795.199s] His negativity has become self-fulfilling.\n[799.389s] He actively creates enemies in the world\n[802.149s] then complains the world is full of enemies.\n[804.75s] If you’d met him at this point\n[807.279s] there would’ve been no hint of his idealistic\nbeginnings.\n[810.81s] He’d become an aggressive force for conflict\nand division.\n[815.98s] We might conclude that Gordon had now lost\nhis saviour tendencies.\n[819.98s] In fact, Gordon reflected that it was during\nthis period\n[824.57s] that he felt more heroic than ever.\n[827.73s] He was no longer fighting some abstract philosophy.\n[831.73s] He was in the trenches\n[833.16s] pushing back against living breathing adversaries.\n[837.99s] As Gordon’s story illustrates\n[839.94s] once we step onto the dramatic stage\n[842.29s] we can’t always tell where we’ll end up.\n[846.72s] Drama is about the pursuit of emotional validation\n[849.54s] unconstrained by reality.\n[851.91s] Without facts or context to guide us\n[854.86s] it’s easy to lose our bearings.\n[858.06s] What feel initially like noble intentions\n[860.699s] can steer us into monstrous actions.\n[863.2s] How do we step off this seductive stage?\n[867.97s] If we can bring our focus back to reality\n[870.63s] we might be able to make the shift\n[872.38s] from a drama-prone saviour to a drama-free\nsupporter.\n[876.74s] A crucial part of that shift is listening.\n[881.16s] Like many saviours, Gordon recalled that he\nalways tended\n[884.269s] to skim the surface of what people said to him\n[886.82s] looking for potential problems.\n[889.97s] As a result of not listening\n[891.54s] he’d end up bending himself all out of shape\n[894.47s] intervening in situations he’d completely\nmisunderstood.\n[898.13s] A friend might be grumbling about a rough\nday at work.\n[903.17s] Suddenly Gordon would be telling him to retrain\nfor another job\n[906.35s] and spewing a stream of career ideas.\n[910.44s] Looking back on moments like these\n[912.17s] Gordon realised how overbearing his behaviour\nused to be.\n[916.0s] He could see now that all his friend wanted\n[918.5s] was a bit of tea and sympathy.\n[921.88s] Drama feeds on misinterpretation.\n[924.8s] By helping to avoid misinterpretation\n[927.079s] listening is a great preventative measure\nagainst drama.\n[930.74s] Being a supporter means encouraging people’s\nown efforts to help themselves.\n[936.61s] When we constantly step in and take over\n[939.12s] we push people towards dependence, passivity,\nunaccountability.\n[944.6s] In other words, a victim position.\n[946.899s] To promote the opposite qualities\n[949.37s] — of self-reliance, proactivity and responsibility —\n[953.75s] we have to stand back and let people work\nthrough\n[956.3s] their own problems with minimal intervention.\n[960.59s] Supporters acknowledge their own needs.\n[962.73s] Of course there’ll be moments in life\n[965.12s] when we put other people’s needs first\n[967.22s] — sometimes to the extreme detriment of\nour own.\n[970.66s] But these moments are meant to be the exception,\nnot the rule.\n[976.389s] Constantly neglecting ourselves is an unsustainable\nliving strategy.\n[980.649s] And an irresponsible one.\n[983.16s] If our habitual self-neglect leads to severe problems\n[986.92s] like health issues or financial troubles\n[989.61s] we can end up becoming a significant burden\non others.\n[994.27s] Putting our own needs first doesn’t mean\nimpinging on other people’s needs.\n[998.589s] In fact, putting our own needs first leaves\nus better equipped\n[1002.61s] for the times when other people really do\nneed us.\n[1006.709s] Leading on from that, supporters pursue their\nown full life.\n[1011.94s] Saviours often have pretty empty lives.\n[1014.829s] Is the emptiness a result of their constant heroics?\n[1017.88s] Or do the heroics act as a distraction from\na pre-existing emptiness?\n[1022.779s] Either way, investing in our own lives\n[1026.059s] helps prevent us from intruding in the lives\nof others.\n[1030.61s] For individuals who manage to hang up their cape\n[1034.289s] and let go of their saviour tendencies\n[1036.549s] there’s sometimes a period of acute embarrassment\n[1040.089s] when they reflect on their previous pseudo-heroic\nbehaviour.\n[1043.91s] I want to look at some real-life cases of people\n[1046.82s] who weathered that embarrassment\n[1048.69s] and began a new anti-drama life.\n[1057.003s] I met the individual I’ll call ‘Tyrone’\nat university\n[1060.86s] during my psychology degree.\n[1063.4s] We were assigned to the same tutorial group.\n[1066.28s] These were smalls group of five or six students\n[1068.94s] who met every week, supervised by a course leader\n[1072.24s] to discuss course material and explore individual\nareas of interest.\n[1077.46s] In our group, discussions were constantly\nderailed by Tyrone.\n[1081.63s] I’ve often forgotten how disruptive he was\n[1084.88s] because after the first year he transformed\ninto a different person\n[1088.62s] — positive, reflective, a team player and\na real giggler.\n[1094.78s] It’s strange — and sad — to remember\nthe closed-off individual\n[1099.76s] we met in year one who exuded perpetual frustration.\n[1105.049s] During that first year\n[1106.08s] Tyrone styled himself as a champion social educator\n[1109.94s] enlightening the ignorant masses.\n[1113.01s] From our very first tutorial session\n[1115.419s] he was scrutinising everyone’s words for\npossible prejudicial content.\n[1120.87s] Someone would be speaking and he’d suddenly\nlurch forward\n[1123.6s] and shout ‘Hold on!’ and accuse the speaker\nof some social bias.\n[1128.75s] These accusations would invariably prove to\nbe unfounded.\n[1132.09s] His standard charge was: ‘That’s a stereotype!’\n[1137.26s] One of countless examples was when a group\nmember I’ll call Chaz\n[1141.73s] was speaking about how caring her mother was.\n[1145.34s] Tyrone cried ‘Stereotype!’ and declared that Chaz\n[1148.41s] was perpetuating the idea that women have\nto be nurturing.\n[1152.789s] Furthermore — by implication — she was\nperpetuating the idea\n[1157.02s] that men didn’t have to be nurturing.\n[1160.01s] This was his typical tactic.\n[1162.13s] He would fallaciously extrapolate gigantic\nthrough-lines\n[1165.88s] from a single innocent instance.\n[1168.0s] This allowed him to invent a continual stream\nof transgressions\n[1172.419s] to protest against.\n[1174.58s] Sometimes, after shouting ‘Hold on!’\n[1177.809s] Tyrone would pause for a moment then back down.\n[1181.2s] He’d explain that he thought the speaker\nwas about to say something prejudiced.\n[1185.17s] He’d then allow the speaker to continue.\n[1189.57s] Evidently he had constant negative expectations\nof bias from us.\n[1194.62s] His consistent failure to find those biases\n[1197.02s] did nothing to persuade him of their nonexistence.\n[1200.2s] For Tyrone, absence of evidence was evidence\nof hidden presence.\n[1205.85s] Tyrone’s behaviour was so outlandish that\nafter a few weeks\n[1209.97s] a member of the group I’ll call Yani suggested\nit must be\n[1213.41s] some kind of psychology experiment.\n[1215.9s] He said Tyrone had to be a plant.\n[1218.21s] No one behaved like this in real life.\n[1220.98s] A sheepish smile on Tyrone’s face was all\nthe confirmation the group needed.\n[1226.549s] People laughed and told him what a convincing\njerk he’d been.\n[1231.24s] Eventually, the tutor, Bob, gingerly intervened\n[1235.6s] and said it wasn’t an experiment.\n[1238.35s] Tyrone was for real.\n[1240.13s] Let’s just say the rest of that session\nwas a little tense.\n[1245.409s] And it was also a turning point.\n[1247.21s] Up until then, Tyrone had monopolised the\ngroup’s attention very successfully.\n[1253.29s] After that, there was a steep decline in patience.\n[1257.05s] Group members stopped enabling his interruptions.\n[1259.46s] We’d carry on speaking.\n[1261.669s] It didn’t stop his accusations.\n[1263.9s] But he did learn to wait his turn.\n[1266.99s] Tyrone’s relentless misinterpretations of\nour words\n[1270.65s] were a constant invitation to conflict and drama.\n[1275.09s] For the most part, group members brushed his\ncomments off.\n[1278.57s] The predominant feeling towards him\nwas secondhand embarrassment.\n[1282.99s] He was like a child in a newspaper cape\n[1285.549s] waiting to be told what a brave hero he was.\n[1289.059s] But one member — a Scottish nurse I’ll\ncall June — was more direct.\n[1296.06s] One week, June was recounting a family event\nup in Glasgow.\n[1300.7s] When she mentioned that she’d had to order cabs\n[1302.57s] for several family members who were too drunk\nto drive\n[1306.37s] Tyrone sailed into action, crying ‘Stereotype!’\n[1310.429s] and told her she was perpetuating the idea\n[1312.9s] that all Scottish people were alcoholics.\n[1316.119s] June joked that most of her relatives were\nalcoholics.\n[1319.21s] But Tyrone wouldn’t let it lie.\n[1322.27s] He started pseudo-psychoanalysing her.\n[1325.02s] He suggested that she’d heard these Scottish\nstereotypes\n[1328.1s] so many times, she’d absorbed them\n[1330.289s] — and developed some kind of self-loathing.\n[1333.87s] He used words like ‘unconscious’ and ‘internalised’\n[1338.279s] and spoke with breathtaking condescension.\n[1342.64s] Eventually June snapped and bluntly told him\nwhere to go.\n[1346.82s] That moment would set the tone for their entire\nrelationship.\n[1351.62s] Whenever he tried to target her\n[1353.08s] she’d swiftly shut him down with some colourful\nresponse.\n[1357.99s] For a time, he tried to play the wounded party.\n[1361.07s] At one point he called on Bob to tell June\n[1364.26s] she couldn’t speak to him that way\n[1365.87s] — in effect, inviting Bob to play the rescuer.\n[1369.99s] Bob declined.\n[1372.659s] Instead he imparted some friendly advice:\n[1374.9s] ‘If you don’t want to get stung, don’t\npoke the beehive.’\n[1380.36s] It was a simple, practical solution.\n[1383.559s] And Tyrone completely ignored it.\n[1386.35s] For the rest of the year, he continued to\npoke the beehive\n[1389.779s] and flip-flop between persecutor and victim.\n[1393.81s] At the time, we found his masochism baffling.\n[1397.75s] Why choose to keep getting stung?\n[1400.75s] But we were applying rationality to drama.\n[1405.12s] For masochism to persist, there has to be\nsome pay-off.\n[1408.87s] For Tyrone, these stings gave him a sense\nof heroic martyrdom.\n[1413.24s] He was being attacked for his principles.\n[1417.33s] During that first year, the one time Tyrone\nshowed genuine humility\n[1421.85s] was when one of his grandstanding rescue attempts\nblew up in his face.\n[1426.37s] We were all sharing memories of our primary schools.\n[1430.94s] Chaz commented that it was weird having to sing\n[1433.07s] Christian hymns in the morning assemblies.\n[1436.8s] Tyrone flew to her aid, declaring her school\nto be racist.\n[1441.46s] Chaz disagreed.\n[1442.73s] But Tyrone persisted.\n[1445.37s] He said with her being Indian, they should’ve\nbeen more sensitive\n[1448.37s] — she might’ve been a Hindu or a Sikh\nor a Buddhist.\n[1453.02s] Chaz laughed and said ‘I’m not Indian.’\n[1455.83s] Tyrone’s face turned the colour of a London bus.\n[1462.58s] Having spewed non-stop false allegations of\nignorance against everyone else\n[1466.98s] he was now caught in a very public moment\nof genuine ignorance.\n[1472.36s] After pausing to let Tyrone respond\n[1474.49s] — an opportunity he declined —\n[1477.52s] Chaz moved on, without comment or drama\n[1480.809s] picking up where she’d left off before his\ninterjection.\n[1485.31s] Tyrone was mute for the rest of the session\n[1488.74s] and barely spoke for the next few weeks.\n[1492.25s] There was nothing showy or dramatic about\nhis silence.\n[1496.4s] For the first time he seemed\ngenuinely uncomfortable with attention.\n[1502.19s] Although the lure of drama gradually took\nhold again\n[1504.909s] and the accusations started creeping back\n[1507.83s] it was a welcome glimpse of authenticity\n[1510.32s] — one that would later expand beyond anyone’s\nexpectations.\n[1516.63s] In the second year, Tyrone returned to the\ngroup a changed man.\n[1521.169s] The old air of restless frustration was gone.\n[1524.559s] He was open, relaxed and engaged.\n[1528.25s] He listened without prejudice.\n[1530.08s] And he revealed the most amazing\nMichael Fassbender smile\n[1534.48s] — a smile that would become my abiding image\nof him\n[1538.83s] clouding out that rocky first year.\n[1542.01s] Some weeks into the term, he told me that,\nover the summer\n[1545.22s] he’d gotten into a relationship.\n[1547.97s] One weekend, his girlfriend had some friends\naround.\n[1552.04s] To her mortification, Tyrone donned his social\neducator mask\n[1556.809s] and pulled them to pieces.\n[1560.3s] After they left she delivered some devastating\nhome truths.\n[1564.429s] She said Tyrone pretended to be this amazing,\nsensitive, compassionate person.\n[1569.53s] But actually he treated people like trash.\n[1572.7s] He looked for the meanest possible interpretation\nof people’s words\n[1576.93s] just to make himself look good.\n[1579.789s] She said he was a hypocrite and a fraud.\n[1584.62s] It hit him where he lived.\n[1586.45s] He was a hypocrite\n[1587.62s] — especially in the old sense of the word.\n[1591.04s] An actor, playing a role.\n[1594.22s] He wanted to look cool, to be admired.\n[1598.299s] At school he’d got some positive attention\n[1600.21s] from students and teachers for speaking out\nagainst stereotypes.\n[1604.96s] It became his thing.\n[1607.52s] Sadly it went to a dark place.\n[1610.61s] It became all about getting admiration, not\ntackling real prejudice.\n[1616.29s] He became a social vampire.\n[1619.2s] People became things to feed on.\n[1621.529s] Tyrone’s girlfriend was the first person\nin a long time\n[1625.429s] whose feelings he really cared about.\n[1628.1s] She meant the world to him.\n[1630.149s] And her rebuke was the kick he’d needed\nto sort himself out.\n[1635.45s] As the second year progressed\n[1637.27s] the group dived deep into subjects like prejudice\nand discrimination.\n[1642.34s] Some of us shared some related real-life experiences\n[1645.429s] of being shunned and abused by families and\ncommunities.\n[1649.97s] Tyrone said it was an eye-opener.\n[1652.37s] He’d had no idea what we’d been through.\n[1656.11s] He cringed at how he had presumed to educate us\n[1659.26s] about the nature of prejudice and all its\ndepth and subtleties\n[1663.549s] when all the time, we’d live it.\n[1666.51s] We just didn’t feel the need to constantly\nbring it up\n[1668.95s] when it had no relevance.\n[1672.299s] Tyrone privately apologised to each member\nof the group\n[1675.16s] for his previous behaviour.\n[1676.95s] But one member — June — always kept her\ndistance.\n[1682.299s] Tyrone lamented that he really blew it with her.\n[1685.5s] But he said it was a useful reminder\n[1687.61s] that, in life, you can’t always mend what\nyou break.\n[1691.69s] Sometimes, when I get cynical about people’s\nability to change\n[1697.61s] I remember Tyrone’s transformation.\n[1700.785s] And his incredible smile.\n[1710.364s] I want to end with the stories of two individual\nclients\n[1713.659s] with saviour complexes who both came to therapy\n[1716.559s] in a state of collapsed victimhood.\n[1718.88s] Dimmy was a personal trainer who’d lost\na number of long-term clients\n[1723.309s] he said he’d gone out of his way to help.\n[1726.69s] Marion had been volunteering on the phones\nat a helpline charity for some years\n[1730.549s] until a few days ago when she said she’d\nbeen forced out.\n[1734.88s] They both portrayed themselves as big-hearted\nfools in a heartless world.\n[1740.14s] But their casual disregard for personal boundaries\nhinted at a different picture.\n[1745.0s] Dimmy would quiz me intrusively about my health\nand fitness\n[1748.84s] — and give unsolicited tips on everything\n[1751.58s] from specific exercises to food to sleeping\npatterns.\n[1755.7s] He’d often follow up later, wanting to know\nif I’d taken his advice.\n[1760.69s] When he didn’t get an affirmative answer, he\nwas visibly irked.\n[1765.22s] Marion was a habitual space invader\n[1767.649s] constantly touching me, sometimes in very\nintimate areas.\n[1772.799s] When I withdrew from her touch, she’d often\ntry to reestablish it.\n[1777.46s] She described herself as an ‘obligate empath’.\n[1781.14s] She explained this meant she couldn’t help\n[1782.901s] picking up other people’s thoughts and feelings.\n[1786.25s] As she recounted her experiences volunteering\nat the helpline\n[1789.76s] she would repeatedly preempt my reactions.\n[1792.779s] ‘Ah! Now you’re thinking X.’\n[1796.33s] ‘Ah! Now you’re thinking Y.’\n[1799.86s] Her guesses were consistently wrong\n[1802.159s] and she made no attempt to verify them with me.\n[1806.86s] Dimmy and Marion had both become so absorbed\nin their own fantasy image\n[1811.03s] they’d lost sight of how they came across\nto others.\n[1814.659s] Gently challenging their self-perceptions\nwith empathy exercises\n[1818.309s] helped to reboot their social awareness.\n[1821.769s] Slowly they began to see\n[1823.34s] how their superhero costumes looked from the\noutside.\n[1828.179s] When clients start to realise their own behaviour\n[1830.4s] might be the principal source of their problems\n[1832.64s] there’s often a sequence of specific responses.\n[1835.85s] They defend their actions, then regret them\n[1839.24s] then understand them\n[1842.789s] and finally make peace with them.\n[1846.19s] This sequence isn’t set in stone.\n[1848.51s] A client might become stuck in one stage for\na while\n[1851.649s] or flip back and forward between stages.\n[1855.399s] In the defend stage\n[1856.399s] we’re not ready to see the negative impact\nof our behaviour.\n[1860.039s] We move into regret as reality sinks in.\n[1863.35s] Our feelings of regret might range from mild\nto intensely painful.\n[1869.98s] For a time we might obsess over a particular\nincident\n[1873.059s] or feel overwhelmed by multiple incidents.\n[1876.34s] That can start to shift when we begin to understand\nour behaviour\n[1880.419s] — to see where it came from; what prompted it;\n[1884.16s] what needs we were trying to serve.\n[1887.09s] Finally, in the peace-making stage\n[1889.97s] our feelings about the past resolve and subside.\n[1895.08s] As Dimmy and Marion moved through these stages\n[1897.94s] their true stories unfolded.\n[1901.24s] Marion had a turbulent early life\n[1903.61s] moving from place to place because of her\nparents’ work.\n[1907.95s] She learned to make friends fast by being useful.\n[1912.059s] Helpful.\n[1913.409s] It became her identity.\n[1915.78s] She was the one people turned to with their\nproblems.\n[1919.529s] In adult life, she began to think about a\ncareer in counselling\n[1922.7s] and decided to test the water by volunteering\nat a helpline charity.\n[1928.11s] She found it deeply rewarding.\n[1930.659s] But the lines began to blur.\n[1933.34s] Marion had no ‘off’ switch.\n[1935.429s] She’d lose herself in the stories of her callers\n[1938.519s] who played incessantly on her mind.\n[1941.42s] She was soon juggling multiple weekly shifts\n[1944.36s] prompting jokes that she lived at the call\ncentre.\n[1947.03s] But for Marion it was becoming a substitute home.\n[1951.669s] She even bought a stack of mugs with hearts\nprinted on them\n[1954.46s] to replace all the old ones in the kitchen.\n[1956.82s] Boundaries with colleagues also began to dissolve.\n[1961.269s] Marion styled herself as an old mother hen\n[1964.23s] dispensing relentless guidance.\n[1967.44s] Casual conversations became advice clinics.\n[1971.32s] When volunteers took difficult calls\n[1973.399s] she’d swoop in, imposing maternal hugs.\n[1978.179s] Underpinning her increasingly smothering behaviour\n[1980.5s] was Marion’s growing conviction that she\ncould read people’s minds.\n[1986.09s] Within the mental health field\n[1987.539s] this is recognised as a classic sign of burn-out.\n[1991.61s] Practitioners come to believe they’ve seen\nit all before\n[1994.429s] and stop checking their assumptions.\n[1997.99s] Things came to a head one week\n[1999.559s] after a new volunteer took a distressing call.\n[2003.37s] When Marion flung herself on him,\nhe fended her off.\n[2007.46s] She was shocked at the rejection.\n[2009.31s] The following week, she confronted him about\nthe brush-off\n[2013.72s] and asked him who taught him to reject love.\n[2017.669s] When he dismissed the question, she became\nmore insistent\n[2020.96s] delivering a forceful speech about how he\nwas pushing his feelings down\n[2025.649s] and how he shouldn’t be trying to help others\n[2028.01s] if he wasn’t willing to work on himself.\n[2030.38s] She’d later feel the irony of those words.\n[2034.14s] Her tirade disrupted the calls of her colleagues\n[2037.519s] who reported it to management.\n[2040.049s] It wasn’t the first complaint\n[2041.88s] and she was suspended pending an investigation.\n[2046.19s] It was a body blow.\n[2047.95s] Marion saw herself as an untouchable authority figure.\n[2051.679s] To be subjected to disciplinary procedure\nsparked pure rage.\n[2056.869s] She drove to the call centre after hours\n[2059.56s] smashed all her heart mugs and piled them\non a table\n[2063.79s] next to her resignation letter.\n[2067.28s] Within a week she was begging to come back.\n[2071.369s] When the charity refused, she came to therapy\n[2075.03s] playing the victim.\n[2077.57s] In her sessions\n[2078.679s] Marion realised how disconnected she’d become\nfrom people.\n[2083.19s] She cringed at how she’d bullied the new\nvolunteer\n[2086.06s] after his distressing call.\n[2087.929s] What a horrible start for him.\n[2091.159s] She conceded the helpline wasn’t where she\nshould be.\n[2095.45s] Marion came to understand the origins of her\ncompulsion to help.\n[2099.83s] It had been a survival tactic\n[2101.24s] — a way to quickly anchor herself in new\ncompany.\n[2106.0s] She worked on forging healthier anchors.\n[2108.31s] In our time together, I watched her blossom\nin authenticity\n[2113.54s] as she shook off her dramatic role-based identity.\n[2118.19s] Like Marion, Dimmy had become an overbearing\npresence at work.\n[2124.04s] For years he’d built a great reputation\nat his gym.\n[2128.39s] But in recent months he’d alienated some\nlong-term clients\n[2132.04s] with accusations of lack of commitment\n[2134.28s] and inappropriate comments about their personal\nrelationships.\n[2137.79s] When we looked at what was going on in Dimmy’s\nown relationships\n[2142.15s] he revealed that he’d recently become estranged\nfrom his family\n[2145.66s] following some explosive exchanges.\n[2148.14s] One of his brothers had announced that he\nand his wife\n[2151.63s] were emigrating to her native Norway.\n[2155.35s] Dimmy objected and tried to stop the move.\n[2158.8s] For Dimmy, family was everything.\n[2162.88s] After their father died, he’d worked hard\nto keep everyone together.\n[2166.91s] He’d helped his brothers find homes near\ntheir mother’s house\n[2170.47s] so they could all live close together, spend\nweekends together,\n[2174.48s] go on family holidays together.\n[2177.76s] When partners started coming along\n[2179.43s] it hadn’t been easy to make them understand\n[2181.5s] how Dimmy wanted things done.\n[2183.92s] But eventually they settled into his routines.\n[2187.579s] Now his brother’s move threatened to destroy\neverything.\n[2192.73s] Dimmy started having nightmares about the\nend of the world.\n[2196.21s] He began showing up at his brother’s house\nmaking scenes\n[2200.369s] and accusing his sister-in-law of tearing\nthe family apart.\n[2205.079s] Family members who tried to reason with him\nwere accused of disloyalty.\n[2209.27s] Eventually, his mother stepped in and told him\n[2212.93s] everyone was sick of his controlling behaviour.\n[2216.4s] Things were going to have to change.\n[2217.84s] For Dimmy, it was the ultimate betrayal.\n[2221.77s] He stopped speaking to everyone.\n[2224.39s] In therapy, Dimmy saw that everything was\ntied up with his father’s death.\n[2230.51s] When Dimmy was 10\n[2231.9s] his father became terminally ill with cancer.\n[2235.44s] Dimmy became the hero child,\nhelping and protecting his family.\n[2241.19s] This was reinforced by his dying father\n[2244.45s] who told Dimmy he was in charge now.\n[2247.19s] He told him family was everything in life\n[2250.56s] and made Dimmy promise to keep everyone together.\n[2254.63s] For over twenty years, Dimmy had been working\nto keep that promise.\n[2260.39s] In the early years, he’d been an extremely\npositive force in the family\n[2264.75s] helping his mother, protecting and encouraging\nhis brothers.\n[2268.78s] But over time, like other saviours who try\nto preserve people in a timeless bubble\n[2274.27s] he’d become oppressive and dictatorial.\n[2279.01s] Dimmy came to understand that it wasn’t his role\n[2281.91s] to take charge and keep everyone together.\n[2284.91s] Letting go of his father’s promise was an\nemotional experience for him.\n[2290.43s] But he conceded his brothers \nweren’t children anymore.\n[2294.03s] They had their own lives to lead.\n[2297.072s] Despite the conflict of recent months\n[2299.5s] there was enough love in Dimmy’s family\nto start over.\n[2303.833s] And Dimmy was there to wave his brother goodbye.\n[2309.186s] Helping is about identifying and addressing\nthe legitimate needs of a situation.\n[2314.96s] When those things aren’t done\n[2316.99s] then whatever we think we’re doing, we’re\nnot helping.\n[2320.193s] And we might be straying into a parody of\nproblem-solving called drama.\n[2325.499s] It can be tough to give up the self-affirming\nillusions drama offers us.\n[2330.708s] And we can drift into some ugly harmful behaviour.\n[2334.697s] When someone’s stuck in a dramatic role\n[2337.16s] they have to want to get out of it themselves.\n[2340.0s] Attempts by others to coax them off the dramatic\nstage\n[2343.69s] will often be twisted into more drama.\n[2346.31s] But as the stories of Dimmy, Marion, Tyrone\nand Gordon show\n[2353.068s] all hope is not lost when saviours go bad."}'
