transcript: In most cases, though, these VMs don't create issues. In most cases In most cases, your Google Cloud account might not get deleted. So, this is genuinely my worst nightmare as a developer, and probably yours, too. Unfortunately, Google, my former employer, is to blame, and they've had a rough 24 hours. And I'm not just talking about one of their developers having a codex folder shown within the demo of anti-gravity 2. This is real, by the way. I'm also not talking about their newest model, Gemini 3.5 Flash, being not very good, especially considering the fact that they have tripled the price, and the fact that it eats up a lot of thinking tokens, twice as many as Gemini 3.1 Pro. And I'm not even talking about them transitioning the open-source Gemini CLI, which they even said had 100,000 GitHub stars. So, that was their signal to now shut down that project and move it to the closed-source anti-gravity CLI, which is very buggy. It's not open-source anymore, so you can't like fix it. You can't fix the issues yourself. I am unfortunately talking about something much, much worse. Google Cloud blocked the account of Railway for no reason. And Railway, if you don't know, is a cloud provider, and unfortunately, this is not their first time being screwed over by Google. And this is so bad. There is a chance that this event, which could literally happen to anyone, in fact, it actually has happened in the past, and it's gotten me, to be honest, so nervous that I'm, at this point, planning on migrating my most critical dependencies. My entire application neat code is all on Google Cloud, and I don't really want to take this risk anymore. So, I'm definitely going to be migrating, at the very least, I think my database off of Google Cloud, which is probably going to cost me money, but I think it's going to be worth it. And for that reason, I want to take a quick break to tell you about today's sponsor. You've probably heard of Code Rabbit, the world's first AI code reviewer. We've been using it on NeetCode for over a year to help us catch bugs. And recently, they just came out with Code Rabbit Agent for Slack. We all know that agents are only as good as the context that they actually have, and a lot of that context lives inside of Slack channels. And when you're going from Slack to your terminal or your editor to fix an issue and then back to Slack to report the updates, most agents aren't going to retain that information. But Code Rabbit Agent actually does. And what's really interesting is that it actually retains this information in a knowledge base. And it stores these facts that it learns about your team and the conversations that you're having. This knowledge isn't just available to you, it's available to your entire team. So, we can avoid the really annoying issue of tribal knowledge that just lives inside of a developer's head if they never end up communicating that with the rest of the team. It's great to have a super engineer that knows everything, but that can be its own single point of failure. So, don't let the rest of your team have to pay that context tax. You can try it out for free using the link in the description, and your team will probably thank you. Now, just to give a bit of context, I've never used Railway personally, but it is a relatively new cloud provider, and generally people have good things to say about it. You can see it's growing in popularity, which is what makes it even more unfortunate that something like this happened and it screwed them over so badly. While there are like some things technically they could have done to have prevented this, I'll tell you why, but realistically, we can all say like, "Okay, you should have done this, this, and that." But outages always happen. We know that there's always going to be an issue. You can't prevent everything. About a year ago, even Cloudflare was affected, and they didn't mention it explicitly in their tweet or even in their postmortem. They were nice enough to leave this out, but it was basically they had a dependency on Google Cloud, and Google Cloud had an outage, which happens to literally every cloud provider. You can't only blame Google for that, and it affected a lot of people. But, that type of situation is very different from what happened this time. Because when there's an outage that affects everybody, customers and users are still going to be pissed, but they're going to be a bit more understanding if literally everything is down at that time. But, when it's your personal account that gets banned, you don't get like an email from Google telling you this or telling you why it happened, you find out from an alert, and then you have to reach out to Google Cloud and beg them for an answer. And unfortunately, this outage, it was not something that was quickly resolved. I think it took about 8 hours of downtime. As an infra provider, can realistically be a death sentence, it's understandable why they would be pretty pissed, and that's why they are now planning to move off of Google Cloud, which they already tried to do in the past. The founder mentioned a tweet from 3 years ago where they automatically had their quota lowered, which there's really no excuse for. And like I said, they did try to move off, and they mostly did. The founder mentioned that they run 85% of their workload on bare metal. That's basically their own servers that they own. But, unfortunately, some services they did have a critical dependency on Google Cloud, and that acted as like a single point of failure. There's a lot of fallout for that. I don't know exactly what's going to happen. I certainly feel bad for Railway, because this is something that can happen to any of us. And honestly, if it It to me on NeetCode, a user-facing site. That's not super critical. It probably wouldn't be the end of the world. I think we did have an outage like a year or two ago, which was also Google Cloud's fault, but it was only like an hour or two. And so, you know, if you can't solve coding interview problems for a couple hours, you're probably just going to go outside and touch grass, right? But if your entire business goes down, and there's thousands of other businesses depending on you, that's a problem. And Railway's not a small customer of Google Cloud. They spend like 20 million a year on it. So, you would think that they'd, you know, be a little bit more respected. But at the same time, I think there's like the honest question of asking, you know, what's the point of having your own infrastructure if you still have a really critical dependency on Google? And in this case, it was their account got blocked, which is completely out of their hands. But realistically, we expect outages to occur as well. So, even a normal outage would have had this effect. And one of the kind folks at Railway did respond. And it was a fair point that they raised. They feared having like a circular dependency on their own infrastructure. So, they put the API on GCP, and they did not anticipate this, which is something I don't think most people anticipate. But maybe we should, because this is not the first time that it's happened. Two years ago, there was a a pension fund managing 135 billion dollars, and they got screwed even harder, because their entire account got deleted. You can't even make that up. And I guess most of us just kind of naively assume that stuff like that could never happen. But when you see that it does, their entire account got deleted, including all of their data. And they were only able to recover it because they had backups with different providers, which is very fortunate for them. And this is certainly influencing the decisions I'm going to be making going forward. And I didn't just work at Google, I worked specifically in Google Cloud. So, I can kind of speak to you know, a bit of the culture that I experienced and can kind of extrapolate that to what I think is going on at Google. Because first of all, Railway put out this incident report, which is good on them. And they're still waiting for additional updates from Google's internal review. Okay, fine. Maybe it'll take uh more time, but it's really insane to me Google has not said anything publicly about this yet. Okay, uh we already know what's going on. The the lawyers are saying don't say anything because probably it's Google. Just don't bring more attention to this. The less people that know, the less executives and C-suite people that know about this, the better. Because they're ultimately the ones making the decisions of like which cloud to use. Even more than that, it frustrates me because it's not that there aren't smart people working at Google. It's just that the culture is a culture of not really caring. I don't want to like make anything personal. Even if you are a developer that really, really cares. And you want to do the right thing. And some people I think at Google, even though they're smart, they kind of have like some arrogance about them. They don't want to hear the complaints that customers are making. But even if you do, a lot of the times the leadership is just really out of sync. I experienced this. I was working on a project in the Dataflow organization. And this project got canceled. And the entire time, I was just a junior. So, I was just thinking like, why is it that every week the requirements keep changing in this project? It seems like even the senior engineers really don't have any influence. It just seems like it's very opaque. There's some top-down decisions being made. There's really no reason given for them. Nobody's asking what the developers think. And then the entire project was a huge show. We were trying to copy a competitor in a really bad way. Like we we had this project that was completely unrealistic. I don't want to like I don't know what I'm allowed to say, but if I told you what they were telling us to create, they were basically telling us to create something that was magic. It was me and another person was assigned to this like part of the service. It was basically something that never existed before, and we didn't have any experience creating something like that. This is like a very deep distributed systems problem in data flow. And it was just like crazy to me that they And of course the project failed and it got canceled. Thank God for that. I I only heard about this after I left. And so, you know, for every person you have at Google like Logan who's out in the trenches responding to a lot of the criticism that's being made, you have a lot of people who just don't care. And in fairness, it's not easy to do these things. Like this is hard work when you're working on really deep technical products. It's hard to get everything right. And it's even harder to get it right when the leadership keeps changing every 6 months. Nobody's sticking around. Nobody really cares about creating valuable things for users. They just care about creating the next shiny thing that they can deprecate and then, you know, creating the next Gemini CLI so they can deprecate it and then create the next thing, anti-gravity CLI. But they don't actually care to see what the users are saying about that. This I'm pretty sure I'm allowed to talk about because it's public. But this was one of the first things I worked on on data flow. It's called the force canceling a job feature because when a job gets stuck, previously there was no way to stop that job unless you reached out to Google Cloud Support, which you have to pay for to do that. So, literally, uh if you're already paying for Dataflow, but you're not paying for like a support account, which costs a lot of money, uh you'd get screwed over pretty hard if your job just gets stuck, and that's costing you money, right? And I'm not going to talk about some of the internal conversations we had about that and about customers, but then we created this force cancel job feature. But, even that, if you read the fine print, it says, just so I'm not making it up, it's right here. Any worker instances that the Dataflow job created are not necessarily released. So, just uh what that means is Dataflow, it's like uh big data processing, right? Streaming or batch. And underneath the hood, it's going to run on workers, VMs, which is a separate uh Google Cloud Service, Google Compute Engine. So, underneath the hood, it's spinning up those servers. So, when you force cancel a job, the servers might not necessarily be released. So, this might leak worker instances. Leaked worker instances don't contribute to job costs, but they might use your quota. Now, I I'm pretty sure this was added. They did not have this in the documentation when I created this feature. I think I actually wrote uh this documentation, or at least part of it, when we shipped the feature. After the job cancellation completes, you can delete these resources yourself. I'm not 100% sure if it was actually costing people money or not, but that was not in the documentation. So, if it was, again, that's just another like slap in the face. Extremely bad attention to detail and like just customer experience. This part is just just embarrassing this is even anywhere in documentation, but for Dataflow Prime jobs, you can't see or delete the leaked VMs. You can't do it yourself. So, in most like you don't even know if if it's happening, there's no way to know. In most cases though, these VMs don't create issues. In most cases In most cases, your Google Cloud account might not get deleted. However, if the leaked VMs cause problems, such as consuming your VM quota or your entire product goes down, feel free to contact support. We'll get back to you, you know, in a timely fashion, even if your business dies in in that time frame. It's hard to be motivated when you're you know, when you know you're just putting out something like that. And you don't really have control over it. What are you going to say? Like, "Hey leadership, let me work extra on this feature to make it polished." When they're telling you to work on something else that's higher priority. In fairness, I also do want to point out there is no shortage of smart hardworking people at Google. There are plenty of people working there including Jack, including many other people in this thread, who are willing to hear feedback and are willing to make things right. Now, in terms of what I'm going to do, first of all, I'm using Firebase along with a few other Google Cloud services. This is an oversimplification of my architecture, but you can see I'm kind of vendor locked in. That's the unfortunate thing about using some of these move fast tools. I want to be kind of strategic about how I'm doing things. I think the easiest thing to migrate would be the CDN, but that's also the least important, I think, because it's the easiest to migrate. Like, if Google Cloud goes down, well, I can just move to a different CDN. The hardest thing typically is the database migration. I am unfortunately using Firestore. First of all, I don't like it that much. It's gotten the job done, but we've had to work around it in a lot of ways. Thankfully, I'm not using like the real-time features. I'm not accessing it directly from the browser because I've seen way too many, you know, things go wrong with that on the security side. I absolutely would not recommend anybody go with Firebase at this point, not just because of the railway incident, but just in general, there are better things to be using now. In a perfect world, from what I've heard, I would be using convex for my back end. Unfortunately, I'm using Angular, so I don't think that's going to be I don't think they support Angular. I could be wrong about that, but even then, that would be kind of a hectic migration. So, I'm going to be certainly looking into migrating my database. Let me know if you guys have suggestions. Ironically, Railway actually is one of the alternatives that I'm going to consider. I've heard good things about their Postgres solutions, but I'll be doing some digging on that. The reason the database is most important to me is because if my account gets deleted, and worst case, you know, that's not going to be something that's going to be easy to recover. I might have to like do a bunch of code migrations. I might need to fix things, but it still would be recoverable. Even if Neatcode was down for a few days, God forbid, it probably wouldn't kill Neatcode. But, if I lose the entire database, and Google cannot recover it, I'm kind of screwed. So, short-term, I'll be making backups, and I'll try to host the backups outside of Google Cloud. I've already been doing backups, but if they're hosted inside of GCS, it's you know, same issue. In terms of what Railway could have done to prevent this, obviously, hindsight heralds are going to say, "Well, they should have been multi-cloud, right? Why rely only on GCP for this? Maybe they should have had the exact same thing replicated in AWS." That would have probably prevented this. Technically correct, but I'm pretty sure the same could be said about a lot of companies, including Cloudflare. You could have said, "Well, why did Cloudflare have that outage? Why did they depend on GCP? Why didn't they replicate that to AWS?" As if that this is like a trivial thing that you can just do. Just have an architecture that does not have any single point of failures, and and predict every single thing that could possibly go wrong. But, it's definitely not going to be helpful for railway, especially considering that they've actually been having a few incidents lately. I even saw this tweet linked from an angry customer. It's Twitter, so there's always going to be some angry people. Maybe stop vibe coding critical infrastructure. And I was wondering where that came from, and I was able to dig up this tweet from a few months ago, which, you know, I'm not I'm not going to dunk on anybody. I'm just I just thought it was kind of funny that the founder tweeted 3 months ago, "Technical people should understand they're going to get their ass beat by non-technical people right now. You don't need to know how to code to write Rust anymore. Stop pearl clutching and start problem-solving." And so, again, I'm not dunking on anybody, but for people who are looking to do that, it looks like there is some material. Again, it's Twitter, nuance is always lost, so before you, you know, raise your pitchfork, I don't think Jake is an anti-technical person. In one of the follow-up tweets, he says, "Most people who write software do not actually scale software. This is the difference between being a programmer and an engineer. Scaling software still needs expertise. This is the art of doing science and engineering." Which I think is pretty correct, and that's how I always view engineering. It's just about solving problems. I don't get too married to any programming language or anything like that, or any tech stack for that matter. I was on Google Cloud up until now because I thought it was good enough, but at this point, the risks are becoming pretty clear to me, so I'm definitely going to be moving off.
