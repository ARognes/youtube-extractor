e a look at that when I'm doing my own stuff, obviously I'm not using 19 package managers, but there are, to your point, things where it's like, "Okay, I wish I didn't have to do this thing because, you know, I'm programming in C or whatever and C sucks at this thing, right?" To me that's just like, "Oh, well, if we're at the point where AI is doing all this code for us, then what I'm actually going to do is like then that frees me up to go spend my time to figure out how do I design a better C that doesn't have that problem? I want to know about that problem. I want to figure out what is the thing that we're doing wrong here. Like let's get back to a separate topic about the natural language that we didn't touch on, which is I don't like explaining how to do things in natural language actually. That's my day job. Like when I make educational materials, my job is explaining computer stuff in English. I don't want to do more of that. When I get to sit down and I'm doing coding, I want to program in a programming language. It's so much more precise, right? And it's so much more direct. I have great control. I'm the guy who wants to is like, "Ooh, I kind of want to go write this in assembly instead of C because I didn't like what it did and I'm not sure, right?" Like I'm that guy. So the chance that I'm going to want to explain this in English is like zero. And so that again, it's just it's a very different perspective and a different philosophy on what programming is and why you're doing it. I don't disagree and have never disagreed that that's not the tradeoff you're making if you're just trying to make Microsoft Word, right? If you're trying to make Microsoft Word, then all you really care about is did the AI do a good enough job and did it do it quicker than I could have done it alone. And when that tradeoff happens for you is going to be different from for everybody and to what extent you're going to leverage it is going to be different for everybody, too, cuz it 