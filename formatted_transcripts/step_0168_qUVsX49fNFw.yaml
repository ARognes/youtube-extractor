transcript: End-to-end encryption, it's the reason iMessage, WhatsApp, and Signal can promise that nobody, not even the company running your chat app, can read your messages. But, in 2026, that promise has a couple serious gaps, and the biggest one might already be on your computer. So, how does it actually work, and where does it fall apart? End-to-end encryption goes all the way back to the early '90s with pretty good privacy, but didn't become mainstream until 2011 when Apple baked it into iMessage. However, it only worked inside Apple's walled garden. So, in 2013, two researchers, Trevor Perrin and Moxie Marlinspike, started building the open-source Signal Protocol that any app could use. It was a success, and by 2016, WhatsApp flipped it on for over a billion users, making one of the biggest privacy upgrades in internet history. Here's David Weisman, BlackBerry's VP of secure communications, to give us a baseline for how encrypted chats function. >> So, what typically happens is we're talking about end-to-end encryption, fully end-to-end. Each of the participants in that conversation would have a security key on their phone. A private key. Basically, that's the key that they use to lock their message up. But, they also have given their friend what's known as a public key. And this all happens behind the scenes when the conversation is set up. So, that message is fully encrypted until it gets to their friend's phone. At that point, it's decrypted. >> In plain English, your phone slams the message into a digital safe and ships it. The only other key sits on your friend's account. So, as it hops from server to server, it's just garbled nonsense, useless to anyone without that key. And the strongest setups go one step further, generating a brand new key for every single message. That's exactly what Signal's double ratchet algorithm does, which is why it sets the bar. It's open-source and always-on. iMessage and WhatsApp encrypt by default, too, while Telegram only locks your messages down if you flip the setting on yourself. And BlackBerry, it's so locked down that governments, NATO, and intelligence agencies use it. That's right. Someone is using BlackBerry. But here's the catch. Regardless of what platform you're using, encryption only takes you so far. There are some clever vulnerabilities where attackers can still learn a lot about you. So, let's learn about those and how you can protect yourself after this message from our sponsor. Bitdefender, stay ahead of online threats with their new scam radar feature for iOS and Android. According to the global state of scams report, losses due to scams reached an astounding 1.03 trillion dollars in 2025. Thanks for that, generative AI. But with scam radar, you can stay informed on ongoing scam outbreaks, including ones localized to your area. They're like tornadoes. Preventing a scam is a lot nicer than falling for one and figuring out everything afterward. That's a tech tip for free. Discover Bitdefender's powerful scam protection free for 90 days using our link below. The first is your messages metadata. Encryption hides what you said, but it doesn't hide that you said it, or who you talked to, or when, or for how long. In 2024, we got a brutal demonstration. Months before the US election, a hacker group called Salt Typhoon was caught inside major US carriers snooping for metadata. >> And that metadata information is typically easier to capture than the actual, you know, fully end-to-end encrypted contents of you know, what we're talking about. And often just the fact what our patterns are communicating, how often we communicate, is this an unusual communication, is enough for people to extract a lot of information about the conversation. Like maybe you and I chat and then all of a sudden I immediately start a whole burst of chats with this other person that I only talk to when something really bad is happening, right? And so people can derive that information. While this isn't necessarily a problem with end-to-end encryption, it illustrates that even using encryption can't block out everything. Even with perfect encryption, David explained that the biggest problem usually comes down to human behavior and good old-fashioned fishing. >> What surprises people is how easy it is not for someone to crack the encryption, but for someone to either >> [music] >> pretend they're someone you that they aren't or for them to associate their account with your account and you're not aware of that. So, there's actually been a lot of FBI reports in the last couple months as well as reports out of Europe and different agencies about concentrated programs by Russian intelligence where they actually link >> [music] >> a PC account to a Signal account or to a WhatsApp account and then in real time they watch the whole conversation. So, they actually didn't need to break the cryptography, but they still read everything you say because they tricked you through a social engineering technique into agreeing to link that account. >> On top of all that, even things built into your computer like the relatively new Windows Recall feature can break through some end-to-end encrypted chats simply by taking screenshots of your messages. You need to log into your computer to see what Recall is saving, but this all goes to illustrate that your data might seem encrypted, but can slip through some gaps if you're not aware of them. So, should you use encrypted chat? Absolutely. Just turn on encrypted backups, assume your metadata is visible, and be careful where you share your data because the strongest padlock doesn't help if someone's reading over your shoulder, or if you accidentally add a journalist into your private Signal group chat. Pete Hegseth? And if all this makes you feel a little more privacy-conscious, take a look at our video on how VPNs actually work, what they protect, and what they don't, and how they can even help you with more than just security.
