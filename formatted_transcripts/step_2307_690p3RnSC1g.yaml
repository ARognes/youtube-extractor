transcript: This is the thing that's been keeping me busy these past few months. This is why I haven't been making so many videos. This is why I quit making videos for four months. Two years ago, I did it. I made a movie that's showing in theaters, particularly Marcus theaters all across Wisconsin starting October 17th and a VIP premiere VIP premiere on October 15th this Wednesday in Walkaw, Wisconsin. I'm going to be at that premiere. Three Green Bay Packers are going to be at that premiere. Portion of the proceeds will benefit the Boys and Girls Club of Greater Milwaukee. There's a cloud, a circle, comma, 4 to the I'm doing another Q&A here the next night, another Q&A here the next night, and another Q&A here the next night in Madison, right where I live. I'd love to see you at some of these upcoming screenings if you are in the area. The VIP premiere is going to be very fun. China's going to be there. My parents are going to be there. My sister's going to be there. As I said, Packers are going to be there. Other people who are part of this film are going to be there. I may even try to dress up. But let's take it back. What is this movie? Why is this happening? So, I have this friend. His name is Time Horse. his production company. Time Horse produced the movie. Get it? Time Horse. Time Horse. Ah. I've known him for like 20 years. My band D R D R D R D R D R D R D R D R D R D Riftless Pony Club used to go to Minnesota to play with other friend bands. He was a part of that group. He actually started a record label for Minnesota bands. And then he ventured out and became a very successful businessman who these days goes to Japan every couple months. And on one trip to Japan, he came across the Japanese Green Bay Packer cheering team, a group of super Green Bay Packer fans. He thought it was wild cuz he grew up in Wisconsin. Like why is this happening? you learn more about them. They meet on a regular basis at a karaoke bar in Tokyo and just watch their favorite Packer games of the previous season. Or if it's during the season, they might watch live at like 2:00 in the morning. And he and a couple of his friends thought, wo, we need to fly them to a Green Bay Packer game. And so they did. And he thought, I'm going to make a documentary about it. So he hired a couple of my friends, Matt and Sam, who shot that whole adventure. And then some time went by and nothing was happening with the documentary. And he asked me, hey, you want to make this into a documentary? And I was like, "No, I've always been interested in this project, but I'm too busy." And he's like, "But please." And I'm like, "No." And he's like, "But really, pretty please." And I'm like, "No, no, no." And he's like, "I'll fly you to Japan." I'm like, "Yes, still. I probably can't do it." But I did say yes. I flew to Japan. I met them. They It was wild to see such incredible fandom of the Green Bay place that I grew up and they live on the other side of the world. He interviewed a bunch of them. Got a lot of footage. Also, Japan is amazing. I did karaoke with Tai and his friend and business partner, Suzuki. in this awesome room where we had drinks and food and our feet were in water below the table. >> My time has come [Music] down. >> His friend took us to a Milwaukee bar in Tokyo. A bar that just mimics bars in Milwaukee for some reason. They took me to a really fancy sushi place. Uh it was the best food I ever had. I It was so good I cried. >> Greg, how often does sushi make you cry? Never. >> Wow. >> This the first time you've cried over sushi. >> First time I've cried over food. >> Sushi is my favorite food. And this was the best example I'd ever had. And watching him make it and with such intention and passion just I don't know. It hit me to see someone care so much about the thing they were making. I learned about 7-Elevens in Japan. Apparently Japanese people love 7-Eleven so much they bought it. They own 7-Eleven and it's like on every corner across Japan that I've seen. We got these little pancakes at that 7-Eleven. Oh my god. They were just like a stack of pancakes that you just unwrap and there was syrup in it and you just eat it. Or bow. You could get bow at the counter. Not ba, you you the the food bow. You could get it at the counter instead of, you know, greasy hot dogs or whatever you get at 7-Eleven in America. Hot coffee from a hot shelf in a can or a cocktail, a hot Japanese highball in a can that you could just take and drink wherever. Vending machines where you could also get the same thing all over the place. There were several times we were walking down the street in Japan and there was cars approaching behind us and the people I was walking with unfazed. I'm like, "Guys, we should get out of the way." And they're like, "No, they just kept walking because they just prioritized pedestrians there." There was one morning I got up early to run and I felt so out of place running down the street. It was full of Japanese people in full business suits walking everywhere, completely silent. It was the quietest city I've ever seen. Just walking to their work while I'm in my jogging outfit running past them. It I felt I like I shouldn't be doing that, but no one seemed to care. We went to an onsen, which was a spa in the mountains. Natural spring. I mean, incredible. Rode the bullet train to Nagoya to interview some more Japanese Packer fans. It's like a 2-hour train trip. Uh yeah, they do trains way better there. Obviously, one of the greatest trips of my life. I remember it very vividly like it was yesterday and it was like 7 years ago now. So yeah, that's how long it's been taking me to do the documentary. I got all the footage, got back home, slowly slowly organized it all into various themed timelines and tried to figure out what this documentary was going to be. It took me a long time because I was I was making YouTube videos. I wasn't only working on this documentary. And I just I had various versions going on and just trying to figure out how do I make this a full documentary? And eventually I figured out what I think the movie is about. Yes, it's about the Green Bay Packers and it's about Japan, but I had to zero in on what I really thought it was. And what I think it is is it's about how anyone from anywhere can come together around a shared passion. We're not all that different no matter where we're from. It's about the the coming together around the thing. There's a part in the movie where Tai first meets the Japanese Packer cheering team. He doesn't speak Japanese. They don't speak English. They communicate by naming Green Bay Packers. They just go back and forth. Brett Favre, Aaron Rogers, Aman Green, John and stuff like that. So, I basically tried to infuse that idea of coming together even from the other side of the world at every part of the movie. And I tried to make it for anyone. It goes into the history of the Packers in case you don't know who they are or care and shows you what makes them special. There are several unique things about the Packers. Of course, everyone has their own teams or don't care about football at all. They're the only professional sports team, I believe, that are publicly owned. They're owned by the town. 250,000 people who own the team. They have shares in the team. They've been around since before the NFL existed. They've been around since the early days of football. There's a storied history there of a team that struggled to stay alive, to be able to fund itself since the the 19s. Green Bay is 100,000 people. The stadium is 60,000 people and it's full all the time. It's a small town and it's a cold town and it's an outdoor stadium. Somehow it persists. There's a lot of special things about it and it's pretty much the polar opposite of a place like Tokyo, one of the largest cities in the world. So, I decided I wanted to tell the story of the two places coming together around a shared passion, but also make it feel kind of like a road movie. It's you follow the journey. Try to balance those two things throughout. And I think I did it. and I'm very proud of it. But once I did figure that out, then I had to get it done. I quit making YouTube videos for 4 months. I sat down and I told myself, "Okay, here's the final timeline of the movie. Every day I'm going to add 2 minutes to the timeline no matter what." Sometimes I' I'd keep going and it'd be up to like 5 minutes. Just baby steps. I pieced the whole thing together. We sat on it for a little while, tried to get it into film festivals. We got it into a couple film festivals. We got it into the Wisconsin film festival. It showed earlier this year at the Barry Moore Theater. Big I think it was like 700 people there. >> This is way beyond what I expected for this documentary. I thought we'd show it to friends and then it would just be a thing that I made. But the room that watched not they didn't watch the room, they watched my movie in the room at the Barrymore. It was electric. People laughed at all the right places. I could feel the energy in the room. It was one of the best nights of my life. It felt like I was doing my job. I'm getting emotional just talking about it right now. Afterwards, people came up and talked to me about how much they loved it. It I didn't expect it. It was incredible. And because of the film festival, I met a guy named Sean Hannish, who along with his production company made the movie Just a Bit Outside, a Milwaukee Brewer documentary that was also showing at the film festival. But the previous year they had shown it at Marcus theaters across Wisconsin. And it lives on the Roku channel right now, just a bit outside. You can watch it right now if you have the Roku channel. It's about the 1982 Milwaukee Brewers. It's great. I loved it. He told me, "I think we can do the same thing with your movie." His production company, Cannonball Productions, him along with a guy named Paul, a guy named Derek, some other people who all helped getting professional color correction, getting a score for the movie. It's got its own score. A guy named James T. Sail made it and it's great. Sound design, getting it ready for 5.1 sound for a movie theater. did some re-edits, made it even better, and got Marcus Theaters to agree to show it across Wisconsin. Thank you, Marcus Theaters. I've been watching movies in your theaters since I was a kid. I saw Jurassic Park in a Marcus Theater. I saw Broken Arrow, the uh Christian Slater, John Travolta action film, John Woo, anyone? I don't I don't think it was a great movie necessarily, but I'm just trying to think of Conair, Deep Impact, and Armageddon. Okay. Volcano and Dante's Peak. I think I saw Dante's Peak on video. I think I just saw Volcano in the theater. Pretty much every movie I saw I saw in a Marcus theater and now I get to show my movie in Marcus theaters. Incredible. So, the past few months we've been working on all that. The past month we've been doing press. We've been going on radio stations and TV stations. I was on WPR uh with Tai Podcast. We were on Cheese Head TV just trying to promote this movie. I'm going through the actual process you go through to make a movie. It's a just a Wisconsin scale, not a worldwide scale, but we're I'm doing it and I'm learning so much. So, all this to say, I've been talking about making a movie for a while and I did it. This is a documentary. I also want to make a narrative, a fiction movie. Maybe I'll do that next, but for now, I've done it. I've made a movie that's going to show in theaters. To reiterate, October 15th, the VIP premiere, I'm going to be there. China's going to be there. My parents are going to be there. My sister going to be there. Green Bay Packers are going to be there. Some of the Japanese people are going to be there. Tai's going to be there. some of the other people that I've been talking about. That's in Wakaawa, Wisconsin at the Majestic Marcus Theater. And the next night, October 16th, north of Milwaukee, Ty and I will be doing a Q&A at that theater. And then on October 17th, it opens across Wisconsin, a bunch of Marcus theaters and also Gurnie, Illinois, Bayer's Country, but just barely. On that night, we're going to be in Green Bay doing a Q&A. And then on the 18th Saturday, we'll be doing a Q&A at in Madison. love to see anyone who's able at any of these screenings. And if you can't make it to those specific screenings and you live in Wisconsin, you can all you can just go to one of the other Marcus theaters. I'll be there with you in here and in here in here if if you post about it. We did it. That is all for now. I can't believe this is happening. It feels great. I want to recreate that feeling at the Barrymore at the Wisconsin Film Festival because that was one of the greatest feelings of my life. I'm just going to keep making things. Go Pack Goat Goyas. Thank you for being a friend. Travel down the road and back again. And
