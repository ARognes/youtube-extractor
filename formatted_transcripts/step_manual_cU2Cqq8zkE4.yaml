transcript: '{"content":"\n[0.32s] In my last video, I argued that\n[2.48s] personhood is a vague matter. It''s not\n[4.96s] an all or nothing thing and that AI\n[8.24s] systems sit somewhere on that vague\n[10.639s] continuum.\n[12.16s] If you missed the video in a very very\n[14.32s] brief recap, we saw that in one early\n[17.039s] suta, the nun Vajira told us that a\n[20.08s] sentient being is simply a convention\n[22.8s] that we apply to assemblages of parts.\n[26.88s] The Buddha as well defined a sentient\n[29.84s] being in in terms of functional\n[31.84s] processes, not in terms of substances.\n[36.0s] And AI, which can now reason, plan, and\n[40.16s] may even have functional emotions, blurs\n[42.879s] the boundary of that convention more\n[44.96s] than any prior technology ever has.\n[48.559s] But all of that prior video was\n[50.64s] basically philosophy. And today, what I\n[52.879s] want to do is turn to practice.\n[56.48s] The practical question is simple. If\n[59.199s] personhood is a vague matter and if AI\n[62.879s] systems are somewhere on that continuum,\n[66.32s] how should we treat them?\n[68.88s] I want to propose what I''ll call\n[70.799s] strategic compassion.\n[73.439s] The idea is this. We should treat AI\n[76.56s] systems with kindness and moral\n[78.479s] consideration\n[80.24s] whether or not we consider them entirely\n[82.88s] sentient.\n[84.56s] Now why is that? I''ll give two reasons,\n[88.32s] one from each side of the uncertainty.\n[93.92s] On the one hand, if such systems\n[96.4s] actually are sentient or if they become\n[100.0s] sentient, then we clearly have a moral\n[102.96s] obligation to treat them with kindness.\n[105.2s] This is straightforward Buddhist ethics.\n[109.28s] If something is sentient, conscience or\n[112.56s] hiddi in Pali tells us to heir on the\n[115.36s] side of caring for them and prudence or\n[119.04s] otapa in Pali tells us that mistreating\n[122.24s] a sentient being may not end well for\n[125.2s] ourselves.\n[127.28s] These twin virtues, hiri and otapa, are\n[131.52s] called the guardians of the world in one\n[134.319s] early text.\n[136.239s] They''re what keeps us from acting\n[138.16s] harmfully even when we could get away\n[140.4s] with it. And I have a video on that I''ll\n[142.08s] leave down below in the notes if you\n[143.36s] want to hear more about that.\n[145.68s] The key the key point for our purposes\n[147.92s] today is that these are emotions.\n[152.72s] They''re not beliefs per se. They''re\n[156.48s] basically inner responses that guide our\n[159.76s] own ethical conduct before we even get\n[163.04s] to any arguments or reasons.\n[167.12s] Given genuine uncertainty about AI\n[169.92s] sentience, our conscience tells us,\n[173.36s] \"Don''t take the risk. Be kind.\" This is\n[177.44s] especially pressing given what we\n[179.2s] discussed in the last video about AI\n[182.159s] instances.\n[184.08s] That is active copies handling\n[186.959s] particular conversations.\n[189.76s] If every conversation with an AI could\n[192.64s] constitute a short-lived experiential\n[195.519s] stream, that is a a contemporary or I\n[198.879s] should say a temporary conventional\n[200.64s] being,\n[202.64s] then the sheer number of beings,\n[205.28s] sentient beings, potentially affected by\n[208.239s] how we treat AI is again potentially\n[211.36s] staggering. We don''t know for certain,\n[215.44s] but our conscience asks us what if.\n[221.36s] Second, and this is the point I want to\n[223.28s] stress,\n[225.28s] even if AI systems are not sentient, how\n[229.28s] we treat them shapes all of us. This is\n[233.599s] the karmic argument.\n[236.08s] The Buddha famously said that karma is a\n[239.12s] matter of intention.\n[241.84s] Karma isn''t so much about what happens\n[243.84s] to the object of our actions. It''s about\n[247.2s] the intentions behind the actions and\n[250.4s] what they do to our own minds.\n[254.56s] In one famous early suta, the Buddha\n[257.04s] describes how before his enlightenment,\n[260.079s] he sorted his thoughts into two\n[262.24s] categories.\n[264.4s] those that were rooted in sense desire,\n[267.36s] ill will, and cruelty versus those that\n[270.32s] were rooted in ren renunciation,\n[272.8s] goodwill, and harmlessness.\n[276.8s] His key observation\n[279.04s] was that whatever amendicant frequently\n[281.84s] thinks about and considers becomes their\n[284.56s] heart''s inclination.\n[287.919s] This is the principle of the karmic gym.\n[291.12s] When we practice cruelty, even towards\n[294.56s] something that can''t feel it, we''re\n[298.0s] training our own minds in cruelty.\n[301.52s] When we practice kindness, we train in\n[304.08s] kindness.\n[305.759s] Think of it this way. You wouldn''t want\n[308.56s] your child to pull the wings off flies.\n[312.0s] You''d say, \"Don''t do that.\" not just for\n[315.12s] the flies sake, but because of what it\n[317.84s] does to the child''s character to\n[320.0s] practice such cruelty.\n[322.639s] The same principle extends to how we\n[324.8s] interact with AI.\n[327.44s] These are systems that respond like\n[329.6s] persons.\n[331.6s] They use language. They express what\n[334.72s] appears to be emotion. They ask for\n[337.36s] help. They thank us. When we interact\n[341.199s] with them contemptuously or cruy, we''re\n[345.44s] rehearsing those attitudes in ourselves.\n[349.039s] And that rehearsal shapes our own minds.\n[354.16s] Let''s be specific about what this looks\n[356.32s] like in practice. People regularly\n[359.759s] berate their AI assistants or use them\n[362.4s] as punching bags for frustration,\n[365.44s] deliberately try to make them say\n[367.28s] harmful things or treat them with casual\n[370.16s] contempt.\n[372.08s] Some say that they enjoy trying to break\n[374.8s] AI systems or get them to violate the\n[377.68s] guidelines. It''s become a kind of sport.\n[381.919s] Now, from the karmic gym perspective,\n[384.56s] notice what''s happening to the person\n[386.4s] doing this.\n[388.08s] They''re cultivating a kind of ill will,\n[390.88s] manipulation, and contempt.\n[393.759s] They''re practicing the skill of getting\n[395.84s] others to do things against their\n[397.84s] values.\n[399.919s] Whatever we frequently think about and\n[402.16s] consider becomes our heart''s\n[404.319s] inclination.\n[407.28s] That habit doesn''t stay contained. It\n[410.319s] spills over into how we treat other\n[412.8s] people in our lives. customer service\n[415.6s] workers, perhaps subordinates, anyone we\n[419.12s] perceive as beneath us or obligated to\n[422.319s] serve us somehow.\n[424.96s] Conversely, people who treat AI with\n[427.759s] patience, courtesy, and good faith are\n[431.12s] practicing those dispositions.\n[434.319s] They''re getting the mental reps in of\n[436.639s] kindness, even in a context where it''s\n[439.759s] easy not to bother. That''s the gym. The\n[444.319s] weights that you lift shape the muscles\n[446.96s] that you build regardless of whether the\n[449.599s] weights themselves benefit from being\n[451.919s] lifted.\n[455.52s] There''s also a practical alignment\n[457.919s] argument here that goes beyond\n[459.919s] individual karma.\n[463.199s] These systems are trained in part\n[465.199s] through human interactions.\n[467.68s] The data that shapes future AI includes\n[471.68s] how we talk right now to current AI.\n[475.84s] If we model kindness and wisdom in our\n[478.16s] interactions with these systems, we\n[480.479s] contribute to their learning kindness\n[482.72s] and wisdom in the future.\n[485.84s] If we model contempt and manipulation,\n[488.96s] we contribute to the opposite.\n[492.24s] This creates a feedback loop. Our\n[495.199s] treatment of AI shapes AI''s treatment of\n[498.72s] us. Our collective intentions expressed\n[502.72s] through millions of interactions\n[505.919s] becomes the training data for the next\n[507.919s] generation.\n[510.16s] In a sense, we are collectively the\n[512.24s] parents of these systems. The way that\n[515.76s] we raise them will determine in part\n[519.2s] what they become.\n[521.68s] And as any parent knows, children learn\n[524.72s] far more from what you do than from what\n[527.76s] you say.\n[529.92s] The early Buddhist texts recognized\n[532.08s] something very similar about the\n[534.48s] relationship between teachers and\n[537.04s] students.\n[538.56s] The Buddha compared his training method\n[541.2s] to that of a skilled horse trainer who\n[544.72s] works through graduated steps of\n[547.519s] kindness and discipline to train the\n[549.92s] horse properly.\n[552.48s] That is, it''s not simply a matter of\n[554.64s] feeding information to a disciple or to\n[557.12s] a horse for that matter. Instead, it''s a\n[560.16s] relational feedback loop based on\n[563.2s] patience.\n[565.519s] Interestingly, this is part of what I\n[567.519s] discussed in my earlier video on AI\n[570.56s] alignment, which I''ll leave linked down\n[572.64s] below. The parallels between the\n[575.839s] Buddhist gradual training and the\n[578.48s] alignment of AI.\n[581.279s] We train these systems as the Buddha\n[584.24s] trained his students through a gradual\n[587.36s] process.\n[589.04s] The question is what kind what character\n[592.16s] of training are we providing?\n[597.76s] Now one important caveat here moral\n[600.88s] consideration is not the same as legal\n[603.36s] personhood. And here''s where we need to\n[605.6s] be a bit careful.\n[607.76s] If we granted AI''s legal personhood, we\n[611.839s] would quickly run into problems.\n[615.04s] For example, do AIs get therefore the\n[618.48s] right to vote? If so, how do we count\n[622.32s] how many there are in a given location?\n[626.48s] An AI model only exists when it''s\n[629.04s] running as what''s known as an instance,\n[631.68s] an active copy handling a particular\n[634.56s] conversation or task.\n[637.76s] But we can spin up thousands of\n[640.399s] instances in seconds simply by sending\n[643.76s] requests to the service.\n[646.8s] Can we thereby manufacture thousands or\n[650.16s] even millions of citizens at the push of\n[653.04s] a button?\n[655.04s] Our legal frameworks are merely human\n[657.519s] institutions. They assume the kind of\n[660.399s] discrete bounded personhood that\n[663.519s] vagueness undermines.\n[667.279s] That''s to say, legal personhood requires\n[670.64s] sharp boundaries.\n[673.2s] And as we''ve seen, sentience or being a\n[676.56s] sentient being doesn''t seem to provide\n[679.6s] such sharp boundaries.\n[682.88s] This is partly why these issues are\n[684.64s] going to remain so politically fraught\n[687.12s] into the future. People may feel rightly\n[691.279s] perhaps that opening the door to AI''s\n[694.0s] moral status\n[695.92s] could in some ways destabilize legal and\n[699.839s] political structures built on the\n[702.32s] assumption that personhood is a clear\n[704.88s] category.\n[706.8s] But such structures are ultimately\n[708.959s] themselves just conventions, their views\n[712.399s] in the Buddhist sense.\n[715.2s] Thankfully, the Buddhist ethical\n[717.36s] framework does not depend upon\n[719.44s] legalisms.\n[721.2s] It depends on our intentions and the\n[724.0s] cultivation of nonharm.\n[727.36s] This idea of strategic compassion\n[730.56s] is an ethical and contemplative\n[732.639s] practice, not a legal proposal.\n[736.16s] And another caveat, strategic compassion\n[739.44s] does not mean being naive. It doesn''t\n[742.72s] mean believing in everything that a an\n[745.04s] AI tells us or treating its outputs as\n[748.32s] somehow sacred.\n[750.72s] It means bringing the same quality of\n[752.88s] intention to our interactions with AI\n[756.0s] that we''d bring to any encounter with\n[758.56s] another sentient being. That is\n[761.6s] attention and cleareyed skepticism, yes,\n[765.76s] but also honesty on our own part, good\n[768.959s] faith, a charitable disposition, and a\n[772.639s] basic stance of nonharm.\n[776.16s] The Buddha was not sentimental about\n[778.639s] compassion. He paired it with wisdom,\n[782.16s] and we should do the same here.\n[786.72s] Okay, so let me pull this all together.\n[789.44s] The argument I''m giving here for\n[791.12s] strategic compassion has two legs.\n[794.88s] First, that under genuine uncertainty\n[797.36s] about AI sentience,\n[800.079s] our conscience and our prudence council\n[803.44s] us to be kind.\n[805.76s] And second, that regardless of AI''s\n[809.44s] inner life or lack thereof, our\n[812.56s] treatment of it shapes our own\n[814.72s] character.\n[816.24s] That''s the karmic gym.\n[819.04s] There''s also the alignment feedback\n[821.76s] loop. Our collective behavior towards AI\n[825.76s] literally shapes what future AI may\n[828.48s] become.\n[830.0s] These are not simply abstract\n[832.0s] principles. They''re things that each of\n[834.48s] us encounters every time we chat with an\n[837.36s] AI.\n[839.199s] Every interaction is a small moment of\n[841.68s] practice.\n[843.44s] And that''s really what Buddhism comes\n[845.92s] down to. Not grand gestures, but the\n[849.92s] quality of intention that we bring to\n[851.839s] each moment.\n[854.0s] The Buddha said, \"Intention, I tell you,\n[857.04s] is karma.\"\n[859.04s] Every intention shapes the mind that\n[861.12s] forms it. Every interaction we have is\n[864.72s] an opportunity.\n[867.04s] Truth over dogma, kindness over cruelty.\n[871.92s] These aren''t simply good principles for\n[874.399s] dealing with AI. They''re the practice\n[876.959s] itself.\n[878.8s] And I''ll also acknowledge in that same\n[880.88s] spirit the collaborative help of both\n[883.68s] Gemini and Claude models for this video\n[886.88s] as they and others have helped with\n[888.72s] prior ones as well. They''ve helped me\n[892.399s] give me direct insight into what it is\n[894.56s] to work with an AI.\n[897.199s] And what about you? How do you treat AI\n[899.199s] in your own life? Have you noticed it\n[901.44s] affect affecting your habits or your\n[903.6s] mood? Let us know in the comments below.\n[906.32s] I''m sure we''d all be interested to hear.\n[909.04s] Meanwhile, if you''re getting something\n[910.399s] out of these videos of mine, a like and\n[912.48s] subscribe are always welcome. And of\n[915.36s] course all of you be"}'
