ing I'll show you is rate limiting.ts in our library folder. And so, this is going to let your guest users only send up to 10 messages, but you can bump this up to 100. All right. So, now that we have this working chatbot from Vercel, we're going to start adding the hands. So, going back to our body analogy, we have the body, which is the Vercel Next.js chatbot, and now we need to adapt this chatbot to make it more useful by extending the tools that it has available to it. The chatbot can already call tools that get the weather, create nice formatting for the code blocks, as well as markdown documents. And what it's doing under the hood is exposing this tool list to the agent, and throughout each message, this agent is going to decide if it should call one of the tools, and if it's relevant, like if the user mentioned weather, and the message has weather, it's definitely going to call the get weather tool so that I can actually display it in a nice UI. And so, now we're on this step where we give our agent 1,000 plus tool kits, and 1,000 more tools available through MCP, or the model context protocol, and more on that later. So, now we're going to add Compozio, which gives us 1,000 plus tool kits through some of the most popular apps you're probably already using in your day-to-day, and it gives it to them in a really smart way that I'm really excited to show you. But before we talk about that, it's important that we talk about context windows, which is one of the most important concepts when you're building reliable AI agent. A context window is defined as the maximum amount of information, measured in tokens, that a large language model, or an LLM, can remember at one time. You can think of it like the AI's working memory, or its short-term memory, and anything outside of this window will affect the response, and anything outside of it can get forgotten. So, when you use a tool like Cursor, or ChatGPT, or Claude, and you notice that your chat is getting really long, you might have noticed that the AI gets worse, the accuracy goes down, it starts forgetting details, and eventually it becomes unusable, and you have to start a new chat. And you can blame the context window for this. Here are some famous context windows with GPT-4.0 from 2 years ago hovering around 128,000 tokens, whereas 2 years later, we have premier models, GPT-5.5 and Opus, both around 1 million tokens. And you have other models like Gemini K 2.6 with a 256,000 token limit. And since we're building AI agents, we can't help but talk about context engineering. And at its simplest definition, each tool is going to require more tokens, and each token costs more money and reduces the overall accuracy. So, when you're on a fresh chat and you're well below this 1 million token limit, you're going to find that your LLM performs great. But once you start adding more and more messages to your conversation, you're going to find that the accuracy eventually hits a point where it's unusable and you need to start a new chat. If you're creating an AI agent, you definitely want it to stay accurate, and you definitely don't want it to cost more money than it needs to. We have the full technical definition here, which is that context engineering is a strategic curation, management, and optimization of the tokens that we feed into LLMs to make sure that outputs are high quality and relevant. It goes beyond prompt engineering by designing dynamic systems that deliver the right info, tools, and context to agents at the right time. And that's where Composio comes in. It acts as a dynamic system layer that gives your agent access to a huge toolkit catalog without ever overwhelming the context window at one given time. You can go to composio.dev/toolkits to see the 1,000-plus toolkits that we support here, ranging from Slack, Notion, GitHub, Gmail, and more. And if we peek into the Gmail toolkit, we can see that this alone adds 61 tools to the context window. So, if you were just to give your agent access to Gmail, you'd be adding all of these tool definitions into your context window on every single prompt. Now, for one connected app, that might be feasible, but if you have one, two, five, or maybe 10 apps connected to your AI agent, this is going to reduce the system's efficacy because your agent is going to have to read all of those toolkit catalogs on every single turn, even when they're not relevant. Basically, the agent only ever sees the higher-level toolkit that it has available, and so the agent's context stays small and not bloated with over a thousand plus tools that aren't relevant to it. So, in the demo, you'll see that I use Composio to fetch my latest emails, and so it searches through the available tools, which is just JSON. It checks to see if we have Gmail authenticated, and then it gives me a link to connect my Gmail directly. Once it's connected, you'll see these tool cards rendering as the agent searches Composio for the right tool to use within Gmail, and then it's able to draft a reply using this same multi-execute tool. And this is exactly why context engineering is important. With Composio, we only deliver the right tools and context to our agent so that it can just fetch our Gmails and just create drafts when it needs to, and it doesn't have to have any information about any of the other connected apps. So, to get started with Composio, we'll go to composio.dev, get started, we'll go through the onboarding flow to build with Composio, and we'll just go through this. All right, so next here on the left, we'll make sure that we're on the platform. Next, we'll go to settings, API keys, and we'll create a new API key here for Code Camp, and we'll grab this key. Go back to Cursor, and create a Composio API key. We also need to go back to vercel.com. Go into that same chatbot project. Go to environment variables. And we'll add the same environment variable here. Mark it as sensitive and save. And we'll go back to cursor to