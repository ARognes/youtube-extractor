ing is that from\n[82.6s] in terms of getting it in, the volume of\n[85.28s] what you''re smuggling in is vastly\n[87.2s] different, right? Like we can smuggle in\n[88.72s] like granules, like think like grains of\n[90.72s] salt. That''s enough to get high off of.\n[92.6s] So, now we have this fentanyl problem."}'
