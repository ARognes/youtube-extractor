transcript: '{"content":"\n[0.0s] People say that trauma is the ultimate\n[2.64s] chameleon of mental illness. Trauma can\n[5.52s] look like depression, it can look like\n[7.08s] ADHD. And the reason that it''s such a\n[8.96s] good chameleon, and the reason that so\n[10.52s] many people may not realize that they\n[12.56s] have a history of trauma, is because a\n[14.64s] feature of your defense mechanism is\n[18.36s] amnesia, is dissociation, is suppression\n[22.28s] of your hippocampus, which is where\n[24.04s] memories are formed. I want y''all to\n[26.08s] think about the last time that you had,\n[27.92s] if you''ve ever had really bad nausea.\n[30.72s] Like you remember how much you were\n[33.08s] suffering? Like it just feels awful, and\n[36.0s] you just feel nauseous all the time, and\n[37.88s] you''re throwing up, and it''s like this\n[39.44s] blur of awful-ness. And 2 days later,\n[42.88s] you remember it was awful, but you don''t\n[45.28s] really remember much about it. And\n[47.68s] that''s actually because literally, one\n[49.48s] of the features that triggers this\n[51.52s] traumatic dissociation is something\n[53.12s] called vehemence, overwhelming, same\n[55.52s] root. So when our emotional circuits are\n[58.24s] firing really, really, really, really,\n[60.48s] really high, memory consolidation does\n[63.32s] not happen. Think about it for a moment.\n[65.64s] So people will have these vague memories\n[68.68s] of badness. And what you will see is the\n[71.64s] functional impairments. So you will see\n[74.88s] a sense of like, I just don''t feel like\n[77.08s] the world has any zest. I just don''t\n[79.16s] really feel like a person."}'
