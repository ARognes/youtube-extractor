transcript: "L’ambassadeur des Etats-Unis en Israël, fervent défenseur de la colonisation en Cisjordanie occupée, a pourtant dénoncé, jeudi 13 août 2026, le siège de maisons palestiniennes par des colons israéliens. « Les actions de ceux qui sont derrière cet acte de terreur horrible, visant à intimider et à harceler cette famille, sont répugnantes », a écrit Mike Huckabee sur le réseau social X, estimant qu’« aucun prétexte ne justifiait ce comportement de voyou ».\n\n✅ Pour comprendre l'actualité, abonnez-vous à la chaîne YouTube du Monde (et activez la cloche pour les notifications \U0001F514 !) \n\U0001F449http://www.youtube.com/subscription_c...\n\n#qusra #cisjordanie #israel #colons"
