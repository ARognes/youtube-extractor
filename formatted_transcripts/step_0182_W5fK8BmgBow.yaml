transcript: So you're really digging this whole tech hobby and decide to wade a little deeper, running your own Netflix, AI assistant, or photo cloud on a server in your closet. Sounds awesome. Until you try to install more than one app on that server. That's because installing an app on a server isn't like installing it on a PC. Here apps need dependencies, a specific config in a specific folder, a specific version of Python, specific specificity that makes you specifically scream. Install two apps that want different versions of the same thing and congrats, you've got a problem that needs a forum post from 2014 to fix. This is dependency hell and luckily it's a thing of the past thanks to a thing called Docker. But why does everyone use Docker? What does using it look like? And why is it great for home labbing specifically? Let's dock in. Docker works by putting your desired app and all the stuff it requires to function inside a sealed box called a container. You don't have to worry about trying to get two apps with different requirements to work. Everything is separate and because the app and its requirements all live in that one box, when you're done with it, deleting the container wipes the whole thing cleanly. So no stray files are left cluttering up your system. But that's not even the best part because Docker has been around for a while and has become a bit of an industry standard among developers, chances are someone has already packaged the exact app you want into a ready-to-run container. So there's almost no setup on your end. After installing Docker, you literally just type Docker run and the app you want and a container with a working app is running in no time because building, running, and managing containers is done behind the scenes by the Docker engine. A lot of the home lab setups already install something like Docker engine, so it's already primed and ready to run containers. Maybe you want to run a media server or a web server or a remote VPN application. You can quickly just do a Docker run command of those existing container images so that you don't have to bundle all those apps up and figure out how to get them on your host. Docker Engine can deploy containers so easily because of something called a container image. It's like a pre-made meal kit. The image has everything Docker needs to spin up a running container. Docker Engine can also put a leash on each container to cap how much your server CPU and memory any one container is allowed to grab. That way, one badly behaving app can't devour all your RAM and drag everything else down with it. All of those ready-made recipes, i.e. image files, have to live somewhere though, and the most popular place is Docker Hub. Think of it as the App Store for containers, except it's free and just about every self-hostable app is on it. But before you go installing 10 apps tonight, that convenience does cut both ways. Anyone can publish to Docker Hub, including people who probably shouldn't. You treat and trust Docker Hub very much like you would treat the source code on GitHub. You've got to look at it, you need to check out the source, you need to trust it and inspect it and understand the risks of that particular piece of software before you want to download it and run it. Now, the nice thing about Docker itself is because it's an isolation engine, you can actually feel a little safer about running something you maybe haven't read all the source of. Worth noting though, Docker's isolation is real, but it's not a vault. Treat the sandbox as one layer of defense, not the whole defense, and vet the images from non-verified publishers. Now, this all seems pretty revolutionary, and it is, but I'm going to let you in on a little secret. The idea of running sealed-off isolated programs not new. Docker didn't actually invent it. The blasphemy! The truth is that Docker has an older, much heavier relative you've almost certainly heard of, the virtual machine. And the two get mistaken for each other constantly. We'll tell you how they're similar, but how they're different right after a quick word from our sponsor. Odoo, it's a business management software that has an app for just about anything your team could need conveniently in one place. Whether that's a CRM tool for managing project workflow and invoicing, or even if you need help with email marketing, Odoo has tons of templates and ways for you to make sure you're reaching your audience. They'll even help you keep track of inventory with things like replenishment automation. You know what? That That sounds cool. Click the link in the description for a free trial, no credit card required. Docker did not invent the idea of isolating programs. The broader idea is called containerization, and the virtual machine is where most people's mental model of it comes from. If you've ever heard someone called Docker a lightweight VM on a forum or Reddit thread, our expert would like a word. Often containers are compared to virtual machines, but it's not really a fair comparison because virtual machines were really about emulating hardware so that we could run multiple kernels or operating systems on the same hardware. Docker doesn't really mess with running kernels. In fact, everything goes inside of the container except the kernel and the hardware drivers. The kernel is the core part of an operating system that actually talks to your hardware. A virtual machine boots up its own entire operating system, kernel and all, which makes it powerfully isolated at the cost of being heavy. A Docker container skips all that and just borrows the kernel of the host it's already running on. So, unlike a VM that can take minutes to start and eat gigabytes of memory, a container starts in seconds and only needs megabytes to exist. To put it in perspective, it's not unusual to run 10 plus containers in the space a single VM would need. And while some hardcore level labbers will actually run a few heavy and rock solid virtual machines and then run their lightweight Docker containers inside them for the best of both worlds, you probably don't need to go that far. If you're new to Docker, start with Docker Desktop or just download it on your Linux server where it will work natively. The cool part about Docker is that almost everything it's doing is really just low-level Linux kernel primitives. And the two that really enabled Docker to begin its journey as the default container runtime on Linux was two features in the kernel known as cgroups and namespaces. Simply put, under the hood, Docker wraps features the Linux kernel had for years into a workflow that humans without a PhD in Linux kernel wizardry can use. But wait, if a container borrows the host kernel and that kernel has to be Linux, how does Docker run on a Mac or a Windows PC? It cheats, beautifully. [music] On a Mac or Windows machine, you can't just install Docker engine directly, but you can install Docker desktop, which quietly bundles a tiny Linux virtual machine and Docker engine so it can run using a working Linux kernel. So, Docker on your MacBook is secretly running Linux. Don't tell anyone. One last thing because you're going to see it mentioned, Docker isn't the only container tool. Podman and Incus {slash} LXC also exist and use basically the same commands. But nearly every home server tutorial online says Docker, so unless you've got a specific reason to switch, I say keep it simple. And if running your own apps in steel little boxes sounds freeing, wait until you see what happens when you put your phone in charge of its own software. Go check out our video on sideloading. It ain't like it used to be.
