transcript: One of the biggest problems developers run into is having fonts work on their computer, but not on their users' computers. In this case, I'm just using this random font right here, and you can see the text is rendering out perfectly. But, the problem is is this font is actually downloaded locally on my computer, and for anyone else that doesn't have this font on their computer, it's not going to work because I'm never actually telling the browser to download this font for each individual user. This is an easy problem to make because for me, it looks like everything is working fine, which is why I want to talk about a configuration setting that's actually only available in the Firefox browser. If you go to about:config in your URL on Firefox, you can modify a lot of different configurations. And if you search for layout.css.fontvisibility, it has a number that you can set. The number three means that you allow any font from the user that is currently installed to be shown on the page. But, if you change this to the number two or the number one, that actually prevents that ability. Number one only allows base fonts, and number two allows any font that's installed as part of a language pack to be used. In our case, we'll just set this to one. And now what we want to do is we just want to make sure we save that particular setting, so we have that saved as a one. And if we go back to the page that we were just working on, and we refresh, you can see immediately that font has been removed from that site because it only allows fonts that are installed by the browser already. So, now if I just come in here and I do a little import for that font, you can now see it's working properly. So, with this one setting, I can make sure that if my font's not showing up, it's because I accidentally forgot to import it or do something along those lines.
