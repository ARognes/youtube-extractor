transcript: hey what's up guys um not a lot of you are closely connected with me unless you follow me on other social media but I just recently turned 25 which means I'm officially in my mid-20s and I feel like I'm a adult I think I feel this way because I read a long time ago that your brain is fully developed at 25 but also it just feels like that age where you become an adult I know Society deems us adults when we're 18 but in my opinion there's a ton of growing and maturing that needs to be done from 18 to 19 19 to 20 20 to 21 or at least for me I went through like serious life changes from those ages a lot of people in that period of their life are going to places like college to discover who they are and you kind of figure out what you're gonna do with the rest of your life but with that being said it's a time where you make a lot of mistakes and there's some mistakes that maybe don't need to be made so I saw some other YouTubers make this video and I thought now is a good time for me to make it so in this video I'm going to go over what I wish I knew at the age of 20. so the first thing I wish I knew at 20 is not to expect too much or have unrealistic goals now this is obviously not saying don't dream big but there are certain life goals or expectations that are unrealistic or almost impossible for example if you're naturally a bad singer but your goal is to become the biggest pop star in the world well you're going to be pretty disappointed when that doesn't happen that's an unrealistic expectation another more relatable example that I think everybody maybe experiences is as you grow up through like middle school and high school you can kind of just Coast through as long as you do your homework and you know study a little bit for tests you can just Coast through middle school and high school so when you get to college or the real world you don't expect that it's going to be as difficult as it actually is you think maybe oh maybe I can just Coast through college or Coast through my job but no there's going to be a point where you have to work no matter how smart you are you're going to have to put some effort into developing skills and working to pass you know college and stuff like that can't just Coast through life that's terrible expectation to have so I think when I was younger I did have some unrealistic expectations and if you have these you're going to be pretty disappointed it's going to let you down and it just leads to some unhappiness the next thing I wish I knew is I guess just Financial stuff like financial information that I was never taught as a child from my parents or from the education system and I never took the initiative to research it online and I think it's kind of messed up that the education system doesn't teach us this information because it's pretty valuable like how to invest and build wealth over time and savings account interest versus inflation rates if you guys are 20 right now then you're going to want to look up investing because if you just keep your money in a savings account versus the current inflation rate you're going to be losing your money over time and another thing I wish I understood because I fell victim to it a little bit from watching YouTube videos and you might be too from Tick Tock and other content is that day trading is pretty much gambling I had a period where I tried day trading because I saw this viral YouTube video about day trading Millionaires and I lost thousands of dollars and speaking of investing I do want to take the time now to mention the sponsor of this portion of the video which is well front with investing I have a tough time picking individual stocks and having to constantly check and monitor which companies are doing well so I invest in ETFs which is a diversified alternative it's a collection of stocks and in this case if one company performs poorly we don't lose all of our value now the wealthfront you take it a step further because wealthfront will automatically diversify your Investments even further with a personalized portfolio based on your risk tolerance and investing strategy of choice you could pick from a collection of expert built portfolios that are automatically managed for you by wealthfront and then from those portfolios you could select the level of risk you want to take on from investing if you want to go deeper you can also customize your portfolio by choosing from over 240 funds offering exposure to everything from clean energy to Tech to even crypto I chose the classic portfolio and my investments have been split up into these categories and the best part is I could set up automatic weekly transfers into my account so that I don't have to worry about timing the market which I learned from the book The intelligent investor is the best way to invest don't try and time the market just consistently invest I highly recommend wealthfront make sure you sign up through my link wealthfront.com Nick white that's going to be in the description of this video and you're going to get 20 bucks just for opening and funding your first taxable investment account speaking of expectations well you shouldn't expect everything stays the same and I want to talk about how you need to understand that things can change unexpectedly and quickly like at any moment things can completely change and I guess mainly this point is like you don't have full control over your life for me this kind of manifested with you know I had the same group of friends in middle school and high school and college and I kind of you know assumed that we'd all be friends and just hang out you know forever grow old in the same city but what happened in college is people want their own separate ways you know people got in relationships people want to do different careers they wanted to move to different places and yeah I haven't seen people in a long time that's just a basic change that's going to happen to everybody in life and you know I don't really have control over relationships with people I mean on my end you could just be as good of a friend as you could be but you can't control what other people do right that's a normal situation there's a lot more like dramatic quick events that could happen that you have no control over happening so like negative examples you can get injured or you can get really sick at any moment another one is you could be fired from your job unexpectedly you have no control over this you know maybe the company got bad publicity and the stocks prices crash and they have to lay people off for example I mean look at the world right now the economy is not doing too well there have been a lot of layoffs people don't have control over if they get to keep their jobs or not another example you could just be walking down the street and you could be robbed you lose a bunch of your money but with every negative example there's a positive unexpected change that could happen to your life too you know you could win money you could get a scholarship unexpectedly you could get hired you could get promoted randomly right you get a random motion or come into a really awesome job or maybe you could fall in love you could meet somebody and you could fall in love that could change your life completely so I'm giving you guys this advice because at 20 I thought I kind of had complete control over everything in the world like everything in my life I'm gonna control everything but no things can totally happen unexpectedly you have no control over and they can completely change the course of your life so if I were you or if I were me at 20 I would try and accept this idea and maybe prepare for unexpected change all right the next thing I want to talk about is social behavior I don't know about you guys but I went through so many phases growing up like socially just so many different types of personalities I was trying out probably to please other people but I've realized that that isn't important and we all hear this a lot but you really need to digest it it's to not think about what other people think of you you know just focus on being the best version of yourself and worry about what you want out of life don't worry about what other people want you to be like I even had a lot of social anxiety at certain points where you walk into a room and you're just constantly thinking about what other people are thinking about you but what you need to realize is other people aren't just thinking about you all the time they're probably worried about themselves now there are exceptions right there are just toxic people in your life that could just be very you know toxic towards you or even abusive maybe so if there are people like that that are consistently negative around you well your environment really affects you so you're gonna want to remove those people from your life you know there's a big difference between criticism which is healthy and toxicity and then just on the topic of social behavior I think there were a couple times growing up where I burned a few Bridges and I didn't really think of it as a big deal because oh there's seven billion people I will probably never see this person again it wasn't like a very serious thing but just as as I got older I realized that Burning Bridges especially with people that are in the same industry or career path as you is really bad because as you grow in your career and in your industry there's only only going to be a certain number of people in that industry and you're going to potentially run into them again it's actually a much smaller of a world than you think especially in these particular Niche your career might be in and then the very last thing that I want to touch on is just a very generic saying that we've all heard before and that is time flies and I'm starting to feel this a lot more now I'm starting to really cherish my time um you know I'm talking like I'm an older person or something I'm 25 I guess that's still technically young compared to you know well actually older people but it does feel like time is moving faster the older I get and you only have a certain amount of time uh and you know things like I said earlier change unexpectedly and you want to you know to make the most of that time time is extremely valuable some people will spend their whole lives you know working for money I'm sure there's a lot of people out there that don't really have perspective of time and don't prioritize as well as they should you should really sit down and think to yourself what you find important in life whether that's family or career and you should think about the different ages you want to make accomplishments by or what you want to prioritize at each age you don't actually have to like break this down in any kind of road map or whatever but you should just realize like you know time goes pretty quickly and things change very quickly and you don't want to grow old to have regrets some people probably prioritize one thing way too much over other things and um you know balance is essential to life I'm pretty bad at balancing things I'm sure other people are a lot worse so can consider what you want to spend this currency we call time doing and I hope you spend it wisely so if you guys are my age or older and you have any good advice for people that are 20 please drop it in the comments below or if I missed out on anything important but I think that's some pretty solid advice because I struggled with a lot of that information it's a lot of just self-awareness and perspective things that you I feel like you don't really have at the time because you don't just sit and think about all that stuff you're too preoccupied with so many things at that age but yeah I guess I am now old and I have to like be boring and old now okay yeah okay I'm all right well uh thanks for watching talk to you guys later peace
