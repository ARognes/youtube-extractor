iously in the back it's actually really nice that you can turn it on and off with push of a button instead of having to take the back off like I planned and probably like how SpongeBob has to do it for some reason testing testing testing testing I realize you guys probably can't see anything but trust me it works well now all there is to do is just build another one and then there were two yeah not really sure what else to do with the walkie-talkie uh there really isn't I guess that much to show call me Kevin Gates cuz I got two phones okay you can see it works because if I transmit on one and bring them too close they'll interfere I'll leave the mic here on the table and then go in the corner so you guys can hear that I'm talking through the microphone can you hear me from over here comment your favorite SpongeBob episode down below so I can fight you on it and tell you why your favorite is actually Band Geeks you can actually see it's pretty good size anybody born in the 1800s is probably reminded of their first cell phone with this so I made these walkies to celebrate the channel accumulating 100 customers which is strange I'm not sure why um but you could be the proud owner of these two SpongeBob walkie-talkies I think don't quote me on this but maybe the only two working ones that are like the real model um in the world so pretty exclusive and you can get them for free free um all you have to do is since this is a subscriber um celebration thing give back to you guys a little bit um just DM me either uh on Instagram current concept YouTube I think it is I don't really actually know but I'll put up on the screen um or just email me at current concept uh YT atgmailcom just send me a screen cap that says you're subscribed and include what your favorite SpongeBob episode is so we can discuss about it because uh I do like SpongeBob Bob okay see you around
