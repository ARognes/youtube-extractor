transcript: I'm not some kind of superhero. I have never done this before. I don't know what it's going to be like. I could be insanely overwhelmed, not produce enough milk. I don't know. I'm not going to put pressure on myself for any sort of way being like, this is how it's going to go. I am so not naive in the sense of like life does not go as planned. And I certainly don't expect the birth of my child to go as planned. No matter how much I have, how much money I have, how many people I can pay, my body's going to do whatever it's going to do. This baby wants to come when it's going to come. It doesn't come on [music] a schedule. It doesn't come the day it says it's due. There's all sorts of stuff that can happen. I just prepare for all scenarios. I will have things available and ready for whatever occurs. That's how I think about it.
