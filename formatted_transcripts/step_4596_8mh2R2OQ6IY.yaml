transcript: adversarial code review. So, when something does go wrong, not only are you going to fix that issue, but you're also going to fix the process at a higher level that is actually generating that uh code. And basically, I guess that's what people mean by loop engineering is, in my opinion, not that different from regular engineering. The review was done with fresh context windows. Basically, means that the agent that's reviewing the code is not the one that wrote the code. It's a pretty common pattern that a lot of people use. All the code review tools, obviously, are doing that. Notice how there was one implementer agent and two or more adversarial reviewers per implementer. Now, why would you have two? Because it's non-deterministic. It's not precise. It's kind of like asking two people for feedback. They're going to say different things.
