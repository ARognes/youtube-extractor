transcript: there are 42 living human breathing people that participate in the economy of stardew Valley or more specifically pelicant town so I took the time to investigate every nook and cranny of the political and socioeconomic system of the city in order to answer one question how is the local economy doing the first thing that we're going to look at is the system of currency in Pelican town and the inflation rates the easiest way that you can think of stardew money is in terms of one gold being one penny and this would make sense because it means that a to Ginger island is $10 a coffee is $3 you know and that also makes sense considering that stardew Valley is based off of Harvest Moon which is a Japanese game and in Japan 100 yen is about $1 and that sounds good except the minimum wage in Pelican town is five gold an hour AKA five pennies an hour you got to remember here a joa cola is 15 gold a beer is 400 gold a bag of rice is two 200 five gold an hour and that's what JoJo Mart is paying its employees AKA Sam and Shane who live in our Valley there's even Robin who will work hours a day non-stop building something for your farm for like a hundred gold so whether you're working for a company or you have your own business prices or wages here are completely out of whack and it just doesn't make sense because how is a pub that sells beers for 400 gold able to stay in business when people are making piss po piss piss pot piss po py P wo how is this General Store not bankrupt when it's selling mostly seeds and there's only one farmer in the entire Valley well it turns out that this bizarre economic behavior can be explained by one thing the war after you get back from the second year of your farm so spoilers spoilers you ready okay after the second year of your farm this guy named Kent comes back and it turns out that he was missing because he was being kept as a prisoner of war so there's this conflict happening between what's called The Fill Republic which is where stardy Valley is and the Goro Empire which is who held Kent captive for a year and we know this because we see Vincent Kent's son and his wife talk about that and just his experience as a veteran and then there's also books in the museum that you'll donate that kind of talk about it some posters here and there apparently this war is at a stalemate and it's still happening which would explain so much about why the prices or the wages are just so out of whack in Pelican Town see all the consumable like salads and beers they're so expensive because the ingredients needed to make them are probably imported from elsewhere and War usually means that isolated areas like pelicant Town don't get as many resources or they charge a lot more to get those resources and that's what makes certain items scarce and that shortage is what leads to higher prices sometimes insanely high prices the overall effects of a war on an economy are usually pretty bad you have an increased food shortage usually Rising inflation greater risks of poverty homelessness all that fun stuff but you do usually at least see the creation of more jobs and that's the next thing that we're going to look at we're going to look at unemployment now the unemployment rate for any town is based off of the percent of people in an area who are willing and able to work so when we calculate the unemployment rate we're not going to look at children retirees Homemakers or people who just don't want a job so even though Pelican town does have 42 inhabitant we're only going to look at about 32 of those now the town has 13 independent businesses these are the characters responsible for running the General Stores the pub Clinic Refinery Farm fishery Casino office carpentry business Museum or otherwise ambiguous business outside of those businesses we know that there's 20 people who have some type of job some of these are obvious like Shane and Sam who go to Jojo Mar to work or Lewis who's the mayor but even the people who you might think don't have jobs actually do Alex runs an ice cream stand Sebastian is a freelance programmer Pam operates the bus AB and Caroline are seen stocking shelves at Pierre's store Maru works at the clinic Leah is an artist penny is a tutor Kent was/is in the Army Gillan Marlin work for the miners Guild and then we have the governor and a bouncer so there in total we have 31 out of 32 NPCs having a job which is incredible so basically everyone but lonus has a job which is okay cuz that brings our unemployment rate to a grand total of 3.125% now you might think that the lower the unemployment rate is the better right like a 0% unemployment rate is the best cuz it means that everybody's employed but that's actually not the case a 0% unemployment rate or just one that's too low in general is actually bad because it means that the labor market is inflexible and workers couldn't quit their job and expect to be able to find a new one it also leads to a decrease in productivity because it means that the market has reached a point where each new job won't create enough output to cover its cost this is why in developed countries an ideal employment isn't 100% but actually 94 to 96% and lucky for us lonus single-handedly not having a job means that we have a 96. 875 employment rate and that's pretty baller that's pretty good but another thing that we have to look at is the government spending which is pretty much just whatever the government is spending on whatever the government is spending basically to support the growth or the sustainability of a town so in stardo Valley we mostly see this in the form of festivals and fairs these events are meant to boost morale in the Town encourage business which we see through all the vendors that pop up and increase tourism that last one is really important because tourism can be one of the biggest ways that towns gain money to then reinvest into growth but we don't really see a whole lot of signs of Tourism happening even with these fairs you would think that more people would be coming in from all these nearby places but none really do we get some NPCs that some of the festivals but not as much as you'd think there would be especially considering that the town has invested in things like a library and a museum they haven't invested in schools yet but you know we'll get there but there is a nearby island called ginger Island and you think that that would be a pretty hot spot for tourism but I do think that it's actually a separate territory so the money that we get from Ginger Island wouldn't be going to pelicant town we know that Ginger Islands a part of What's called the fern islands and pelicant town is a part of the region we call stardew Valley the fern islands is what also makes up zuu city which Alex and Haley talk about having visited grandl which Penny Clinton Emily talk about castle village and Prairie Island so I think it's safe to say that the tourism that happens in those more remote destination locations probably isn't helping the economy of pelicant town so the question becomes how is the government funding these elaborate fairs and festivals without tourism well you the player don't pay any taxes so you could think that oh nobody in the village pays taxes but I don't think that's true because of the war that's happening it would make sense for Farmers to be the ones that are tax exempt and there's no way that this Town isn't paying any taxes so income taxes are the most likely way that these festivals are being funded but we also know that the government can't be getting too much money from them because there's only 42 people in this town many of which are making miserably low salaries I also don't think there's any sales tax because most items are flat prices and the price that's shown is just what you buy them for and I don't think there's any property taxes either since you don't pay any unless there's some weird exception to that since you inherited your land but the main reason that I don't think tax taxes are bringing in good income for the government is because of how much a Reliance there is on the people to rebuild and fix basic infrastructure usually it would be taxes that pay for the infrastructure that's broken everywhere in stardy Valley The Boulders that are blocking trade routes the bus system the docks Bridges mine cart systems a bunch of bare necessities that you think a government in the middle of War would be prioritizing so I really don't think that there could be that much tax money coming in in an economically Sound City you think that Mr Mayor Lewis would either increase taxes or just raise money somehow but he just doesn't and I think this could be due to a number of things number one he doesn't think the town needs it which we know is not true because having transportation and trade routes during war is super important or number two he knows that prices already super inflated because of the war and people would become poor if he raised taxes so he doesn't think it's smart to or most interestingly number three he knows that he wouldn't be reelected mayor if he raised taxes because remember mayor Lewis has ran uncontested for 20 years in the position of Mayor which means that even through the war even through the economic hardships he has been riding on a comfortable government salary this whole time but then you show up and you exemplify to this town a beautiful story of Rags to Riches you fight off the corporation from taking over all the local businesses you make your farm into this insane thing well the economy is collapsing you do all of that and mayor Lewis does nothing and by nothing I mean nothing he doesn't ever go into the office he doesn't work from home he just circles to the pub goes around visits people and literally does nothing the only real work that he does is just going and collecting the things that you put in the bin at the end of the day to sell and I think he's aware of this too because every time the governor comes to visit for the luow Lao Festival he is on his best behavior and he makes sure that the image of Pelican town is going and strong but little does the governor know that could not be farther from the truth it's Shady but what isn't shady is today sponsored game maker game maker is a game development engine that lets you make high quality games all by yourself personally I've been using Game Maker for years now I've watched it grow and it's just it's my favorite even if you've never touched game development okay let me just show you around you can start by making a game from a template which lets you study the fundamentals of a platformer a top down SHO compter tower defense game or a bunch of other options instead of starting off on a completely clean Sate game development is just hard and that's the reality of it so having these templates is really nice when you're first starting out there's also a ton of tutorials online as well as on the game maker website so the learning curve is about as smooth as it can be but once you have your template you're able to easily set or change scripts to run on certain events like a keyboard press or when the game first loads and then attach art or physics to that logic I'm a big fan of the modular design of that whole process it makes it really easy to organize and keep track of everything you never feel lost in folders or not sure what script is attached to what object you can edit your Sprites through the engine as someone who's worked in front-end development I'm just saying that the UI is really nice the whole point of a good game engine is to organize and simplify things as much as possible so that you can create and I love game maker because it literally does just that with how big the community is and how many successful games have come out of it it's safe to say that if you have discipline and a tool like this you can make some pretty cool stuff game maker is completely free to use for non-commercial games so you can start learning how to make games today and if you do want to sell your game with it down the road it's a one-time fee and you can publish to all kinds of platforms download game maker for free using the link in the description so game maker might be thriving but uh the economy of stardy Valley is not things so far are just not looking good in pelicant town and they look even worse when you look at the healthcare system and you also realize that there's no banks government s need Banks because that's one of the main ways that you can get economic growth without inflation happening it lets you control the money supply or in the least better manage the flow of money in a region but Pelican Town doesn't have any local bank and there's no indication that the broader region of stardo Valley has any kind of Central Bank all the money that you accumulate throughout the game just stays in your pockets the entire time millions of dollars worth it's honestly a miracle that crime rates aren't higher but that's a separate issue the only time that the government does seem to take your money is when your character passes out in game if it gets to be 2 a.m. you run out of energy or you lose all your health in combat you get transported to Harvey's Clinic where it costs 10% of your gold up to a maximum of like a th000 to bring you back to health and this is pretty common in Nations that do have what we call free healthcare where it won't necessarily be free but it'll be really cheap but again when we don't have a good income from taxes where are we getting the money for the free healthcare from there's just no way that in pelicant town our 32 working villagers are paying for the work that Maru does in the labs or the care that Harvey gives you in the hospital and that kind of makes sense because it's a town and it's not a state right we have a mayor we don't have a governor so on the bright side this means that Pelican town is cemented enough as a city to be getting some kind of support from the state or the greater province that it's a part of in the valley so we're getting support just not in the ways that the town really needs and that's just weird because yes Healthcare is obviously important but so is the basic infrastructure that the player has to repair so is the community center so is dealing with the Aging population dealing with tourism fighting the inflation rates doing something about the minimum wage being 5 gold an hour I don't know it's just weird and it doesn't make sense so I have a theory my theory is that mayor Lewis is lying to the governor about the economic health of pelicant town in order order to hang on to his job which means that pelicant town is not receiving the economic support that it really needs without the help of the player when mayor Lewis speaks to the governor at the la la Festival he only speaks fondly of things and the governor every year talks about buying a vacation home in the town and clearly that indicates to me that he is ignorant of all of the issues happening in Pelican town he doesn't know anything about the rapid inflation the low wages poor invest ments deteriorating infrastructure aging population or everything else that we talked about unless the governor is used to it because all the towns in stardo Valley are experiencing the same issues and that would mean a much worse picture is in store for the economic health of the entire state but at the end of the day the person who really needs to step up and do their job is Mayor Lewis okay I have an unfathomable amount of beef with this man for his sheer ineptitude and for a town of people that are scrambling together that have such a tight-knit community something so beautiful they need a leader and I think that this is the opportunity for the player to take hold of the economy and take hold of that mayor position it's time for a coup we're going to overthrow Lewis if you really do want to fix the economy though the best thing you can do is subscribe it'll resolve world hunger fix all the economic crisis in the entire world just the click of a button it's crazy devs haven't patched this one yet so anyway that's all from me I'll see you guys in the next one have a lovely rest of your day bye-bye [Music]
