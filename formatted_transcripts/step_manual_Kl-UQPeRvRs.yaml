transcript: '{"content":"\n[0.0s] So why can''t men and women be friends?\n[1.76s] Well, because at some point someone''s\n[3.36s] going to catch feelings, right? That''s\n[4.96s] the main argument. At some point you''re\n[6.44s] going to start getting attracted to this\n[7.76s] person. You''ll start maybe falling in\n[9.56s] love with them. And this is a key thing\n[11.48s] to understand. If you fall in love with\n[13.6s] someone, what is the way that you deal\n[16.08s] with those feelings, right? Some people\n[18.04s] will pull away, which can be a healthy\n[20.0s] thing to do cuz we don''t want to foster\n[21.84s] those feelings. Another important skill\n[23.64s] that you can have is having a\n[25.0s] conversation about it, right? So can you\n[27.24s] go to this friend of yours and have a\n[29.28s] mature conversation as friends and say,\n[31.28s] \"Hey, I noticed that like I''m starting\n[33.0s] to have some romantic feelings towards\n[35.52s] you.\" And this is important to\n[36.64s] understand. If you''re truly friends,\n[38.48s] this does not have to be like a\n[40.56s] confession, right? Which is what a lot\n[42.12s] of people default to. I think it''s a\n[43.2s] terrible move. Just go to your friend\n[44.48s] and say like, \"Hey, I''m catching some\n[45.68s] weird feelings. Wondering if you''re\n[47.12s] experiencing anything similar. We as\n[49.56s] friends, how are we going to navigate\n[51.76s] this?\" And you''re not trying to tell\n[53.12s] them, \"Hey, I want a relationship with\n[54.64s] you.\" If you catch feelings, do you need\n[56.76s] to follow them? If you feel lust, is\n[58.72s] that something that you''re default to\n[60.6s] gratifying? And what I find in a lot of\n[62.6s] people who struggle to have cross-sex\n[65.16s] relationships is that they''re not able\n[67.04s] to have conversations. They''re not able\n[68.96s] to regulate their emotions. And if they\n[70.84s] catch feelings, that means they need to\n[73.0s] act on them."}'
