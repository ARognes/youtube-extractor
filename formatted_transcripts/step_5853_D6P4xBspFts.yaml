transcript: I don't think you have the life experience to be politically active. >> that your generation isn't entitled, but what do you call eliminating student debt? >> Kids today are lazy. They're entitled. >> We already have a bad taste with the boomers. The boomers are bad people. We already put that out in the media. >> And the college education has really dumbed down a lot of our youth. >> You have no idea how good you've got it. >> For me, I'm getting the sense that you're damned if you do, you're damned if you don't. If you're a young person you have complaints about this country, you get involved, you're a career person, you never had a real job. And then if you don't get involved and you just complain, you're just complaining, you're not active, you're not doing anything. So, what exactly do you want young people to do to have an impact on this country and make a difference on the world that we want to build that we're going to inherit over the next several decades. I sit on our ass or get involved?
