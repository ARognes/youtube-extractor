transcript: the number one skill you need to learn as a developer to be successful actually isn't anything technical at all it's just the process of figuring out why you're writing the code that you're writing normally you're going to be working for a company and you're going to have a list of tasks that you need to complete given to you by someone else whether it's the Project Lead or even just someone using the product they're going to tell you what they want you to build or change and the important thing for you to understand is why you're adding these features or changing these particular things because as a developer it's very easy just to say okay they said add this feature code up that feature and you're done but actually understanding why you're creating that feature and what the purpose is behind that code means that you're actually able to elevate the code that you create because most often than not when people tell you what they want you to build they're not actually sure what the best thing to build is they're not technical users they just say hey I want to do this thing and I think this is the way it should be done so understanding what the actual thing they want to do underneath of all it is is really important because then you can actually say okay you want to do X Y and Z and you think I need to build you know a product to do that but instead actually B product is going to be a much better thing that solves all the things that you want so you deliver that final B product to them which is exactly what they want now they don't realize that's what they want so by understanding what they actually need to do you can figure out what the actual product is that they need you to build this is really important because if you don't do this you're going to give them what they said they wanted and they're going to tell you hey this actually isn't what I want and you're going to go back and forth a bunch until finally you actually end up giving them the thing you would have built originally the first time so understanding this skill will not only save you time but it make you look really impressive to your bosses and other employees now if you want to learn more about how you can actually use this skill I have a full video right here at the bottom of the screen that covers everything you need to know about how to learn this skill
