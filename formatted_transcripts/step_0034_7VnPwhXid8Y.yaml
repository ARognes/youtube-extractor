transcript: Hi, welcome to Midwest Magic Cleaning. My name is Buff Stuffalophagus and this week we're helping an 83-year-old man who's under such a severe pile of junk that he hasn't been able to access his hobbies for at least 5 years. His granddaughter has been trying to help him out for at least 4 and 1/2 years, but this is a big job and not only is it a big job, but it's a it's an expensive job because you have to be able to pay for a dumpster and those are not cheap. Fortunately, because you guys watch the channel and you subscribe to the channel, we're able to afford that dumpster and we have the knowledge and the resources to do this in a couple of hours. Now, the reason I think this one is so special is because, like I said, he's 83 years old. He doesn't have a lot of mobility, but the things that he likes to do are in the garage. He likes to tinker with tools and build stuff and work on wood projects. There's also a bunch of fishing poles in here, so I know he liked to fish at one point, but it was impossible to access, especially for somebody who doesn't have a lot of mobility. I had trouble accessing it and I I walk just fine. So, it brought me a lot of pride to be able to get in here and free up a bunch of room so that he could access the fishing poles or if he wanted to just sort his tools or work on something, you know, woodworking, he can actually get in here and do that. As a guy who likes to tinker, I know that if you took all that stuff away from me, I would go nuts over time. I have to be doing something. And so, especially when you're at that age, boredom sets in pretty easy and it means a lot to me that he is able to get out here and do the things that he loves to do. Plus, there's really one important thing that I don't think people from cities may understand as much as people like me who live in a really rural country area. So, we're just corn and soybeans and cows and pigs. Like, that's that's all we are here in Southern Illinois. It It takes Just to get to an interstate, it takes me a 30-mi drive. And they're very small towns with nothing to do. There's something so peaceful about having, say, a thunderstorm rolls in, and it's not a dangerous one, but you can just sit underneath your carport or in the garage with the garage door open and watch it storm. It's a thing we like to do, and it's so peaceful, and it's so relaxing, and just allowing him to get out of here and grab a chair and watch it rain. To me, that means something, and I think to him it means something as well. So, if all we accomplish by clearing out this garage is just to give him space to sit and relax, to me, that's worth it. Now, even if you can't relate to that, there is one thing that I think most of you can relate to, which is the garage is typically, in, say, a logic form, one of the best places to store items because it's out of the way, it's not in your house, there's usually plenty of room in a garage, but in practice, it's the worst place you can store anything. And the reason is because most garages aren't heated and cooled, and even if they're waterproofed, you know, from a a roof standpoint or from an insulation standpoint, they collect a lot of humidity. And so, tools are going to rust, spray paint cans are going to rust, any furniture that you have there is going to take on water and get water and mold damage. Chairs that have fabric on them are definitely going to get mold, same thing with mattresses. They're going to get dirty and moldy and just gross and unusable over time. Not to mention the infestation of spiders that is 100% guaranteed to happen in a garage. We did a house earlier this year that had a a couple of sewing machines that were foot-pedaled, so they weren't electric, they were just operated by just swinging your feet on a grate underneath it, and that would have been in the late 1800s or early 1900s. They didn't have room in the house to store it, so they stored it in a garage and it utterly 100% destroyed both of those antiques. The metal was rusted beyond repair, but even if they could repair the metal, the wood had been so damaged from mold and water damage that there was no saving it. The wood had warped beyond repair. So, those beautiful pieces of history that they wanted to save ended up completely destroyed because they didn't know how to properly store it. They just put it in the in the garage and thought that'll be fine, and it wasn't. So, if you have no choice but to store some things in a garage, what I would suggest would be to completely encapsulate anything that's fabric like a mattress or a love seat or whatever in plastic and make sure it's 100% sealed on all sides. And if it's wood or cardboard, it needs to be off the floor. Put it on a pallet or put it on something that it doesn't let it contact the floor because cardboard will completely disintegrate and wood acts like a sponge for any moisture, not just standing water, but humidity. If you have things that can be put in tubs, don't get the cheap tubs. Get something that it has an an airtight seal on it. Spring for the extra because if not, everything you put in there is going to eventually get damaged. I would suggest not storing many things in your garage. So, my rule of thumb for my own garage would be lawn care stuff, tools, and then seasonal decorations, and that's about it. If I find myself packing clothes for another season, there's a good chance I'm never wearing those clothes again. And so, all I'm doing by storing those things is delaying a decision. And that decision would be to get rid of them. I know eventually I'm going to do it, but all I'm doing is putting off that decision and making it highly unlikely that I'm ever going to go out there and actually get rid of them until it's so out of control that I'm forced to do it and now I made so much more work for myself. >> [snorts] >> If you're saving things that you're wanting to pass down to your family when you pass, I would first find out if your family even wants that stuff before you start storing them in a garage. Because one, storing them in a garage is not a good place to store them. There's a good chance you're going to damage whatever it is that you're passing down to your family. And two, look up a channel, I think they're on Tik Tok and Instagram called Millennial Inheritance. I think that's ran by a guy named Nick Fox and they kind of poke fun at the things that their parents had left for the kids that are just collections of the weirdest just piles of junk you can imagine. Avon bottles that are absolutely worthless, magazines, China sets that are so gaudy and so worthless. They meant something to the parents, but they mean absolutely nothing to the kids. If the kids look at that and say, "No, I'm not interested in that. I I appreciate the thought, but that is not for me." Don't store all this extra crap in your garage because you're just taking up space. What they're actually inheriting is a very large trash bill after you pass because now they've got to rent a dumpster and then put in all the elbow grease in order to get rid of all that stuff that you thought was cool. I have cleaned out so many houses of somebody who's passed away and their kids just don't want to go through the physical and mental anguish of cleaning those out and in every single case that I've ever done, the kids only want photo albums. If they have a few things in there that have monetary value, they will always say, "We can maybe sell that on eBay or find a family member who wants it, but I'm not concerned about any of that other stuff, just the photo albums." The only other things that I've seen them keep have been maybe some games that they had when they were a kid that the parents never got rid of and that was just for nostalgia sake. It had no connection to their parents at all. I would say in most cases that if the house isn't clean enough and in good enough repair to have an estate sale, only keep maybe five things that you're wanting to hand down to kids because so far in every case I've ever done, I may get rid of say five full-size dumpsters of stuff from a house and the kids may keep five things out of all that stuff total. And the things that they keep are typically something that's so small they can just put in one back seat of their car. The reason that I mentioned that in this particular video is because they had told me when I first started that there were several boxes by the door that they wanted to save because it was stuff for the family. And we did save it. It was totally fine, but it was like two Rubbermaid tubs full of Avon bottles and then several boxes that just had a bunch of candles and stuff. Now, I I'm not saying that the kids don't want that stuff. Maybe they do. But at first glance it seems like out of your whole life, you spent 83 years on this Earth, and then the things that you're really adamant about handing down are things that in 99% of the cases the kids could not care less about. They don't care about the candles. They don't care about Avon bottles from the 1970s. It seems like there could be more sentimental things that you can hand down than that. Again, they may love it. They may be like, I definitely want those Avon bottles when you pass. But it's worth having a conversation about before you start storing all that stuff. You can also look at it this way. Your grandma invites you over and says, "I'm getting rid of all my possessions tomorrow. You can take whatever you want from this house." If she brought the whole family in there and told them that, there's a high likelihood that the only things they would walk out with are practical things. Like, "I'd really like that TV. Oh, you've got a nice KitchenAid mixer. I could use that." They're probably not walking out with some painting that she's had since 1960. They're probably not going to look in the kitchen and say, "Oh, I've always loved that China cabinet. Let me have that." That's not saying that that those things don't exist. There are plenty of people who have really nice furniture that would make beautiful heirlooms and they're worth handing down, but I'm saying for the most part and in the the dozens and dozens of cases that I've personally worked on, they've never wanted any of that stuff. They've wanted the practical things that they can use in their everyday life. And I can tell you with 100% certainty that none of those things came out of a garage. I've never met a kid or an adult yet who has been like, "Oh, those storage units where you put all that stuff that wasn't good enough for your own home? I want that stuff." But especially the things that you collect, if your kids don't also collect them, they're not interested in them. They don't want your 57 piece matching set of moose-shaped cookie cutters. You care about the coffee mugs that you collected from each state because you put time and effort and energy into it. What they see when you pass is now they have to carry this big-ass heavy box of 50 coffee mugs to the garbage. So, where this garage is concerned is they gave us a criteria. Keep any toys that aren't broken, get rid of everything that is broken or damaged or dirty beyond repair. We will keep the tools and everything else can go. So, we went a step beyond that and we saved things like Christmas trees and Halloween decorations because they were neatly put into Rubbermaid tubs. They were protected, they were clean. And now when those seasons roll around, they can just pull those off the shelf and there they go. We kept the old fishing poles, but we put them all together. Um all the extra chairs that they had, we put those all together. So, if they have a family reunion or or whatever, a break-dance battle, they've got enough chairs for people to pull up a seat and watch and judge. All the tools went together. All the spray paint cans went together, even though technically I should have gotten rid of those because they were all rusted. But also, there are rules with dumpsters. You can't throw a bunch of aerosol stuff in there. Anyway, that's a whole 'nother story. But we at least got those off the floor and into a dry plastic tub to where they weren't contacting wet concrete anymore. There's one thing I didn't do in here and I'm glad I didn't. I did not organize his tools and one of the reasons that I didn't do that was because well, two reasons. One, I was exhausted by the time we got done with this, but two, I think he's going to enjoy doing that himself. I think that he's so into those hobbies that now that he has the room to actually get out here in the garage, it's going to be a fun thing for him to separate all of his wrenches and put them back in their correct drawers and set all of his oil cans over to the side and just organize. Every guy that I know typically just everything starts out organized, then as you get more and more projects, you get a little less organized, so you start throwing wrenches just on the workbench and then there's a point where you look around and go, "Okay, this is out of control. Let me stop and organize all this and put things back where they go." And every dude that I know, once he finishes those, he he's proud of it. He wants to open the drawers and show his wife and say, "Hey, check all this out, huh? Huh?" And I'm not saying that women don't like doing that. It's just I've only known men who, you know, have a bunch of tools in the garage and tinker and all that. So, the point is I left that because I think it would be a fun project for him to do because I can see by the way he's got his garage set up that he was very particular about where he put things at one point. It just got so cluttered and so trashed out that eventually he couldn't get back there to do it and it was just so overwhelming. It was like, "What's the point?" >> If you're new to this channel, we do all of our cleanings for free, every single one of them, including the dumpsters. We end up buying the dumpsters for the people who we help, unless they're a landlord or an investor or something like that, which I tend to stay away from, but occasionally we'll do videos like that. The reason we can do that and the reason we can afford it is because people watch the videos and they hit the subscribe button. The subscribe button doesn't cost anything. It's a free thing. It just lets YouTube know, "Hey, I like this channel and I like these videos. I'd like to see more stuff like this." So, if you haven't hit the subscribe button, please do because we're nearing a million subscribers right now and that's a huge goal that I've set myself and it's been about 4 years and we're so close to hitting it now. Every click of that subscribe button really, really helps. Again, doesn't cost you anything. It just helps us out. The other thing that helps us afford this is that I have an online store called midwestmagiccleaning.com where I sell professional and specialized cleaning rags. I also sell funny t-shirts and coffee mugs and all kinds of stuff that I think you'd really like. Again, that's midwestmagiccleaning.com and I don't sell anything on that site that I don't personally use myself in my own cleanings as well as the cleanings that you see on these videos. All that being said, members, I will see you on Wednesday. Everybody else, I'll see you next weekend. Later.
