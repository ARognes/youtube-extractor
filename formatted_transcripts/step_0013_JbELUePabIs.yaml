transcript: "\U0001F4D8 Everything I know about behavioral interviews from conducting nearly 1,000 of them as a Bar Raiser, now in one book: https://geni.us/BehavioralInterview-yt\n\nIf you want to be in the hot-seat for the next video like this, apply here: https://forms.gle/121P4FhVhxkBaPiq5\n\nKenan is a senior frontend engineer with six years of experience trying to land his next senior role, and he has the stories to get there. A broken questionnaire costing real money, a production bug impossible to reproduce locally, and an end-to-end testing rollout the team fought back on.\n\nWhat he's missing has nothing to do with experience — and everything to do with how he tells it. Three changes. One session. Watch it happen in real time. Steve Huynh coaches him live through every story.\n\nCHAPTERS:\n00:00:00 - The Stories Are There. The Delivery Isn't.\n00:01:19 - Tell Me About a Project You Architected\n00:04:26 - Lead With Actions\n00:06:05 - The Pyramid Framework\n00:08:38 - How To Turn the Interview Into a Conversation\n00:18:59 - Take Credit Without Overclaiming\n00:28:20 - Stop Saying We\n00:34:48 - Influence Without Authority\n00:40:36 - Is This Really Your Best Work?\n00:41:34 - The On Call Question Kenan Is Most Afraid Of\n00:45:06 - How to Teach Your Interviewer Something New\n01:06:12 - Build a Brag Book\n01:19:26 - Niche Down or Stay Broad?\n01:24:07 - Front Load the Action"
