transcript: "Guillaume Pley, le fondateur du média en ligne « Legend », a fait l’objet ces derniers jours d’enquêtes lui reprochant des échanges en ligne à caractère sexuel avec plusieurs mineures. Il y a d’abord eu une vidéo du youtubeur TPZ le 2 août, puis une enquête des Inrockuptibles publiée mercredi 5 août.\n\n✅ Pour comprendre l'actualité, abonnez-vous à la chaîne YouTube du Monde (et activez la cloche pour les notifications \U0001F514 !) \U0001F449http://www.youtube.com/subscription_c...\n\nL’animateur a réagi vendredi 7 août en publiant un communiqué sur Instagram indiquant notamment que les messages évoqués « n’émanaient pas tous de [lui] directement car tous [ses] comptes sociaux étaient cogérés avec [son] équipe », et exprimant par ailleurs ses « plus vifs regrets sur la manière dont [ils s’]adress[aient] et échang[aient] avec [leurs] publics, parfois mineurs ».\n\nDans les jours qui ont suivi ce communiqué, Le Monde a recueilli un nouveau témoignage, celui d’une jeune femme qui ne s’était pas exprimée jusque-là. Elle a reçu en 2011 par la messagerie Facebook de l’animateur des messages à caractère sexuel alors qu’elle était âgée de 14 ans. Le Monde a pu consulter ces messages."
