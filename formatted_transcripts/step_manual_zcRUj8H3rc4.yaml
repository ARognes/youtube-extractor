transcript: '{"content":"\n[29.6s] Some months ago, the woman \nwho gave birth to me died.\n[33.44s] The news had no impact.\n[35.88s] Within seconds of hearing about it, my \nattention drifted and I forgot all about it.\n[41.6s] It only crossed my mind again hours later\n[44.64s] and in no time at all, I’d forgotten again.\n[48.12s] After going no contact with her a few years ago\n[50.8s] she swiftly drifted into irrelevance.\n[53.56s] She’d enter my thoughts \nfleetingly every few months\n[56.76s] when she sent her manipulative letters\n[58.84s] or when I was informed of \nsome incident by my brother\n[61.72s] who for practical reasons \nremained in low contact with her.\n[65.76s] But she’d exit my thoughts almost instantly.\n[69.72s] Her death answered a question\n[71.28s] I hadn’t even been interested \nenough to ask myself:\n[74.68s] Would I feel anything when she died?\n[77.96s] In my past therapy work and in correspondence\n[81.36s] many people have shared personal stories\n[83.2s] about the death of a parent, sibling, partner\n[86.36s] or other significant figure who’d been \na poisonous presence in their life.\n[90.96s] Some of them had intense reactions.\n[93.84s] Some were positive — like \nrelief, liberation, elation.\n[99.8s] More often, they were complex.\n[102.32s] There might be a conflicting jumble of emotions\n[104.68s] like grief mixed up with anger and guilt\n[107.64s] and it would take time to pick apart and resolve.\n[111.6s] At the other end of the spectrum\n[113.36s] some people — like me — felt nothing much.\n[117.0s] For some of them, their lack of \nconcern became a cause for concern.\n[121.08s] They wondered, Does this make \nme a bad person? Or even sick?\n[125.76s] Has some of the poison rubbed off on me?\n[128.52s] Have I stared too long into the abuse?\n[131.96s] In fact, there’s often a very \nsimple and benign explanation\n[135.8s] for this lack of emotion towards the deceased:\n[138.72s] you’re over them.\n[140.64s] It can be a strange new experience\n[143.16s] especially for people who’ve \ngot it into their heads\n[145.36s] that antagonistic individuals \nor groups from their past\n[149.48s] will always arouse some of the same old feelings.\n[153.32s] Emotions serve various functions.\n[155.76s] They help us process the \nmeaning of incoming information.\n[159.16s] If the information feels significant, \nemotions help us absorb it and adjust to it.\n[164.84s] They motivate us to make any relevant \ndecisions and take any appropriate action.\n[170.52s] When harmful individuals or groups \nno longer spark any response in us\n[175.64s] it can just mean our brains have determined\n[178.16s] that they hold no significance for us now.\n[180.8s] We’ve recognised that there’s \nno person of interest here.\n[183.6s] We have nothing to process.\n[185.44s] No questions to ponder, no issues to resolve,\n[189.08s] no decisions to make or action to take.\n[192.8s] We’ve reached a state of true indifference.\n[196.52s] The road from emotional chaos to indifference \nis often full of twists and turns.\n[202.04s] Certainly was in my case.\n[204.12s] The wildest bends were all at the very start.\n[206.6s] But a couple of fair-sized \ncurves cropped up in later life.\n[210.56s] For me, those twists and turns weren’t about her.\n[214.32s] Fundamentally she never changed.\n[216.64s] She was a fixed point with a \nvery limited range of behaviour\n[220.56s] — what I came to call her ‘bag of tricks’.\n[223.56s] The twists and turns were really about me\n[226.16s] and my responses to that bag of tricks.\n[229.44s] Some responses led to more distance \nand detachment from her poison.\n[234.12s] Others led to more unhealthy \nengagement and exposure.\n[238.84s] The direction I moved in \nusually depended on my readiness\n[242.32s] or my failure to acknowledge some truth about her.\n[246.72s] Looking back at my lack of reaction to her demise\n[249.44s] I thought I’d perform a kind of autopsy\n[251.8s] examining that winding road to indifference.\n[255.64s] Listing every jaw-dropping incident \nwould take countless hours.\n[259.52s] So I’ll confine myself to just \nsome of my most pivotal experiences\n[263.68s] growing up in a malignant cluster B household.\n[268.16s] For those unfamiliar with it, \ncluster B is an umbrella term\n[271.56s] covering four classifications \nof personality disorder:\n[275.08s] antisocial, borderline, \nhistrionic and narcissistic.\n[281.28s] Personality disorders involve persistent \ndistorted patterns of thinking and behaving.\n[286.76s] In the case of the four cluster B disorders\n[289.36s] these patterns are characterised as dramatic, \nemotional, unpredictable and manipulative.\n[296.0s] The behaviour can become intensely destructive\n[298.84s] both to the disordered \nindividuals and those around them.\n[303.24s] Each of the four disorders has its own flavour.\n[307.0s] In very broad terms, antisocial \ndisorder refers to a pattern\n[310.92s] of disregarding social rules and \nviolating other people’s rights;\n[315.64s] borderline disorder can involve \nextreme emotional dysregulation\n[319.96s] and a chronically unstable self-image;\n[323.52s] histrionic disorder points to a pattern \nof inappropriate attention-seeking\n[327.56s] with theatrical, sometimes \nsexually provocative behaviour;\n[332.08s] narcissistic disorder relates to exaggerated ideas\n[335.24s] of superiority, specialness and entitlement.\n[339.88s] In practice, the clinical pictures \nfor these disorders are complex\n[344.28s] and the distinctions aren’t necessarily clear-cut.\n[347.92s] A person might exhibit \nnarcissistic and histrionic traits.\n[352.48s] At the extreme end, there can \nbe vast areas of trait overlap.\n[357.64s] Sometimes the individual’s \nbehaviour is so unfiltered\n[360.72s] that even total strangers can \nsee there’s something off.\n[364.68s] Some people who’ve grown \nup with cluster B relatives\n[367.48s] report that concerns were \nfrequently expressed by others.\n[371.44s] ‘What’s up with your uncle?’\n[373.44s] ‘Why does your dad act so weird?’\n[376.2s] But many cluster B individuals learn to \ncontrol themselves in public situations\n[380.18s] — to hide behind a mask of respectability.\n[384.04s] Strangers might even form an \nunusually positive impression of them.\n[388.24s] But people with intimate experience of \nthe individual know it’s a performance.\n[392.72s] And, when polite company departs, \nthe mood can soon change.\n[397.2s] Any pent-up poison can now be released.\n[400.84s] Masks add extra levels of \ndisconnection from reality.\n[404.84s] Targets are often split into two \nopposing and equally perverse roles.\n[410.32s] On top of being their abusers’ private punchbags\n[413.12s] they become their public protectors\n[415.32s] colluding with their abusers’ false faces\n[417.92s] and keeping all the grubby secrets that \nmight lead to their abusers’ downfall.\n[423.36s] Many people are born or indoctrinated as adults\n[426.96s] into mask-wearing ideological groups\n[429.56s] that project a false image \nof benevolence to the public\n[432.44s] while privately exhibiting all the same corruption\n[435.04s] as malignant cluster B individuals\n[437.64s] and forcing targets into all \nthe same distorted shapes.\n[442.0s] The household I was born into\n[443.84s] was dominated by a mask-wearing narcissist.\n[447.44s] Even to give her the title ‘mother’\n[449.4s] which was itself a hollow performance\n[451.76s] is absurd to me now.\n[453.96s] After going no contact a few years ago\n[456.24s] I started using more fitting designations.\n[459.36s] Some of them — like ‘surrogate’ — reflected \nher lack of parental contribution.\n[464.28s] Others — like ‘parasite’ \n— reflected her compulsion\n[467.4s] to feed on people’s emotional reactions\n[470.12s] which she would constantly try \nto provoke by stirring up drama.\n[474.76s] But, for me, it’s the names that reflect \nher mask-wearing that resonate most.\n[479.92s] It was her mask-wearing that allowed her to \ncontinue dispensing her poison for so long.\n[485.32s] On the flip side, her mask-wearing \nwould also ultimately ensure\n[489.28s] that when I finally cut her loose \nfrom my life, it would be permanent\n[493.0s] in the stone-cold knowledge that, \nthroughout our decades of interactions\n[497.16s] I was never — not for one moment — talking to her\n[501.68s] and she was never talking to me.\n[504.36s] For that reason, to me she is ‘the imposter’.\n[519.36s] Emerson said, ‘To be yourself in \na world that is constantly trying\n[523.84s] to make you something else is \nthe greatest accomplishment.’\n[528.08s] That sentiment is especially true \nin malignant cluster B households\n[532.68s] where the attempts to erase who you \nare taken to sickening extremes.\n[537.52s] For those of us who grow up in these environments\n[540.08s] between the moment we’re born \nand the time we leave them behind\n[543.12s] there’s a common sequence of \nprocesses we move through.\n[546.48s] These processes can overlap substantially.\n[549.56s] When we start a new one, it doesn’t \nmean the previous ones are finished.\n[553.52s] But the further we move through each of \nthem, the closer we come to resolution.\n[559.28s] The first process is damage.\n[561.8s] This is where we take on the harmful effects\n[564.04s] of the destructive behaviour we’re exposed to.\n[567.96s] As young children, in the absence of intervention\n[570.92s] there’s often very little any of us can do\n[573.48s] other than endure our mistreatment.\n[576.6s] Chances are we won’t even \nrealise we’re being mistreated\n[579.76s] because the ones who are doing \nit are the ones we most trust.\n[583.76s] As infants, we depend on our parents for survival.\n[587.44s] In our most vulnerable, defenceless state\n[589.88s] we’re hardwired to bond \nwith our primary caregivers\n[592.88s] who we instinctively trust \nwith our safety and welfare.\n[596.92s] In healthy families, that trust is honoured.\n[600.32s] Parents understand that their role is \nto prepare us to live in the world.\n[605.16s] They encourage the skills and knowledge we need\n[607.96s] to carve out an independent existence.\n[611.68s] In malignant families, our trust is exploited\n[615.28s] by individuals we could call anti-parents.\n[618.48s] The anti-parent works directly against us\n[621.32s] actively sabotaging our development\n[623.4s] and fostering passivity, \ntimidity, submission, dependence.\n[628.76s] The goal is to create compliant toys \nto serve the anti-parent’s fantasies.\n[634.36s] To achieve that, our \npersonalities have to be erased.\n[638.64s] We’re confined to the extremely \nlimited range of responses\n[642.0s] deemed acceptable by the anti-parent.\n[644.88s] Responses that fall outside that range\n[647.2s] are aggressively punished. It’s \nlike living on a minefield.\n[652.4s] In the household I was born into\n[654.4s] three of us grew up on this lethal landscape.\n[657.84s] Me, my twin brother and one of my half-sisters.\n[662.36s] Calla was ten years older than us, \nfrom the imposter’s previous marriage.\n[667.12s] The imposter called her ‘Lady Muck’.\n[669.88s] She was the original family scapegoat\n[672.2s] a dumping ground for scorn and blame\n[674.92s] and some of my very earliest memories in life\n[677.44s] were of Calla being ritually humiliated.\n[681.12s] A fourth child — Calla’s older \nsister, Joan — went oddly untouched.\n[686.88s] The imposter allowed Joan to roam \nfree and harass everyone else.\n[692.08s] Joan’s malicious antics \nbecame ‘funny family stories’\n[695.92s] endlessly retold for entertainment.\n[698.76s] Shielded from accountability, Joan’s \nbehaviour became gradually more extreme.\n[704.36s] In later life, I’d learn how close my \nbrother and I came in our first few months\n[709.52s] to death or life-changing \ninjuries at Joan’s hands.\n[714.76s] This is the infectious nature of anti-parents.\n[717.96s] The damage comes not just from them\n[720.04s] but also from the people they damage.\n[723.48s] For infants, the constant \nbombardment they experience\n[726.68s] in these households can have long-lasting effects\n[729.36s] on a number of important \nareas in the developing brain\n[732.6s] including systems governing \nemotion, attention, memory,\n[736.8s] decision-making and stress responses.\n[740.24s] Many of us will assume these \neffects are just part of who we are.\n[744.56s] In my own case, hearing my \nracing pulse hammering in my ears\n[748.96s] was just part of daily life at the house\n[751.6s] and the sound I fell asleep to.\n[753.96s] I didn’t know this wasn’t normal.\n[756.88s] Often, when something went wrong in the house\n[759.08s] I’d suddenly go numb and fall into an \nintense, laggy, dream-like disorientation.\n[765.6s] These dissociative responses \noccur when the body shuts down\n[769.36s] diverts the blood supply and \nreleases pain-relieving opioids\n[773.2s] in preparation for inescapable injury.\n[776.6s] I knew on a physiological level what was coming.\n[780.52s] On the psychological side, \nat a time when most infants\n[783.6s] are beginning to develop \nan organised sense of self\n[786.88s] my emerging personality was being overwritten\n[789.8s] with a nonstop torrent of wild \naccusations from the imposter.\n[794.44s] As a result, I began life \nwith a sociopathic self-image.\n[799.44s] I was a compulsive liar, \nendlessly scheming against people.\n[803.64s] My mistakes and accidents were \nacts of deliberate sabotage.\n[808.2s] If I voiced a different opinion or preference\n[810.72s] I was trying to stir up an argument.\n[813.2s] If I expressed vulnerability \nor pain, I was faking it.\n[817.68s] It was like having a monster \nmask superglued to my face.\n[822.48s] Convinced of my wretchedness, I \nexperienced intense imposter syndrome\n[826.68s] whenever I was around people \nfrom the outside world\n[829.32s] who trusted me and believed in my good nature.\n[833.32s] As great as it felt to be seen this way\n[835.52s] in the back of my mind I’d often be thinking\n[837.88s] that one day they’d find out what a beast I was.\n[842.0s] I had no recollection of doing, saying or thinking\n[845.0s] the horrible things I was accused of.\n[847.2s] But the imposter’s ironclad certainty of my guilt\n[850.64s] made me doubt my own mind.\n[853.04s] She’d tell me, ‘I can see right through you!’\n[856.56s] And I came to believe there must \nbe a secret wicked side of me\n[860.16s] that was invisible to me but that \nshe could perceive very clearly.\n[865.44s] Faced with endless false \naccusations I’d constantly question\n[869.36s] my memory, my senses, my \njudgement, eventually my sanity.\n[875.76s] I began to fixate on depictions \nof madness in films and TV.\n[881.04s] Was I insane?\n[882.8s] Did I have ‘split personality’?\n[885.0s] Even multiple personalities?\n[887.68s] At the age of seven, when \nmy classmates were dreaming\n[890.44s] of future careers as doctors, \nactors, firefighters, teachers\n[895.76s] I was imagining life in a mental institute.\n[899.6s] Much of this damage might’ve been avoided\n[901.76s] if my father, Walter, had \ndone anything to intervene.\n[906.52s] I didn’t know it at the time\n[908.56s] but having long been the target \nof her deranged attacks himself\n[912.2s] Walter knew full well how destructive she was.\n[916.04s] But he’d decided his best plan \nwas to just go along with her\n[919.76s] express no negative opinions \nor feelings towards her\n[923.24s] try to appease and absorb her anger\n[926.4s] and hope for the best.\n[929.08s] And when my brother and I came along\n[931.04s] Walter tried to do to us \nwhat he’d done to himself:\n[934.48s] erase whatever parts of us displeased her.\n[937.52s] Even our laughter.\n[939.56s] Just hearing us laughing in another room\n[941.84s] was enough to annoy the imposter\n[944.24s] and Walter would dutifully silence us.\n[947.88s] Like many enablers of malignant individuals\n[950.52s] he thought the path of least \nresistance was the path to peace.\n[955.12s] Sadly, by endlessly indulging her\n[957.48s] he guaranteed himself a lifetime of conflict.\n[961.64s] As a young child, I didn’t perceive\n[963.72s] any of these complex relationship dynamics.\n[966.68s] All I saw was that he backed her \nup, consistently and aggressively.\n[972.24s] Fortunately, his efforts to mould us \nin his grovelling image didn’t work.\n[977.4s] But they did leave us fully exposed\n[979.6s] to the imposter’s explosions \nin our most vulnerable years.\n[984.36s] Generally speaking, the only times \nher assaults failed to hit their mark\n[988.08s] was when I simply couldn’t comprehend \nwhat she was going on about.\n[991.64s] For example, I had no idea \nwhat she was referring to\n[994.92s] with her repeated charges of sexual preoccupation.\n[999.12s] Her imagination could reshape \nanything into something lurid.\n[1004.16s] Innocent playtime with friends \nbecame scenes of depravity.\n[1008.36s] Innocent drawings were declared pornographic.\n[1012.12s] From the vile names she hissed and spat at me\n[1015.04s] I knew I was being accused of something terrible.\n[1017.96s] But beyond that, I was clueless.\n[1021.48s] Luckily, by the time I got a \nsense of what she was alluding to\n[1025.04s] I was also starting to realise \nshe was seriously unhinged.\n[1039.88s] The second process we enter \nafter damage is discovery.\n[1043.88s] This is the first of the corrective processes\n[1046.2s] that set us back on the road to health.\n[1049.32s] Here, we begin to understand we’re being abused.\n[1053.0s] For some, that understanding comes \nfully formed in a burst of insight.\n[1058.04s] For others, like me, it’s more gradual.\n[1061.16s] We start to spot inconsistencies \nwe haven’t registered before.\n[1065.08s] We begin to perceive the \nstrangeness of familiar behaviours.\n[1069.36s] During the discovery process, we \nmight continue to take on damage.\n[1073.68s] But we finally start to see \nthe damage for what it is.\n[1077.0s] And we need to recognise the problem \nbefore we can do something about it.\n[1081.8s] It’s a sad irony that often one of the \nbiggest blocks to our discovery is us.\n[1087.92s] Whatever malignant environment \nwe find ourselves in\n[1091.16s] — a family, a romantic \nrelationship, an ideological group —\n[1096.8s] we often get so invested in \nwishful, idealistic notions\n[1100.48s] about the bad actors in \nour midst that we’re unable\n[1103.2s] to take in the evidence repeatedly \nslapping us in the face.\n[1108.16s] In my first few years, through \nmy interactions with the imposter\n[1111.96s] I’d built up an image of who she was\n[1113.94s] — like putting together the pieces of a jigsaw.\n[1117.28s] Only, instead of assembling \nthe pieces on their own terms\n[1120.36s] and finding out what they created\n[1122.6s] I’d already formed an idea \nof the final image in my head\n[1126.32s] and I’d been putting the \npieces together to match it.\n[1129.84s] The image was love. It was a predictable mistake.\n[1134.04s] In early childhood, aside \nfrom our innate predisposition\n[1137.52s] to form trusting attachments \nwith our primary caregivers\n[1140.8s] almost everything and everyone \naround us portrays parental love\n[1144.68s] as some kind of universal constant. \nSo that’s what I looked for.\n[1149.8s] When the qualities we seek in people don’t exist\n[1152.64s] we often find ways to misinterpret their behaviour\n[1155.36s] to fit our preconceptions.\n[1157.92s] When the pieces of the imposter jigsaw\n[1159.8s] hadn’t fit my preconception of parental love\n[1162.6s] I tried to force them into that shape.\n[1165.44s] The imposter’s casual bullying \nbecame justified acts of discipline.\n[1170.4s] Her no-win mind games became \nlegitimate moral tests.\n[1175.36s] I made all the classic excuses we make\n[1177.8s] for authority figures when we try to reconcile\n[1180.52s] malevolent behaviour with a benevolent image.\n[1184.08s] For years, that bogus image \nkept me swallowing her poison\n[1188.56s] and chasing redemption for non-existent \nfailures and transgressions.\n[1193.6s] It also kept me feeling guilty.\n[1196.2s] There was never a time when I desired her company\n[1199.0s] or missed her when she was gone.\n[1201.44s] My aversion to her seemed to confirm\n[1203.68s] her claims about my rotten nature.\n[1205.96s] Children weren’t supposed to feel \nthis way about their parents.\n[1209.8s] But, around the age of \neight, something prompted me\n[1212.72s] to reassess my mangled jigsaw.\n[1215.96s] I noticed how two-faced she was.\n[1219.12s] Whenever we had visitors or went out in public\n[1222.2s] it was like she became another person.\n[1225.0s] She was cheerful, open, warm,\n[1228.2s] selfless, humble, incapable of anger....\n[1231.96s] teetering on sainthood.\n[1234.36s] The things that usually \nprovoked her were suddenly okay.\n[1238.12s] Mistakes and accidents were \nlaughed off and forgiven.\n[1242.64s] It was a relief when we had visitors\n[1244.64s] because peace was guaranteed for a while.\n[1248.2s] The moment they left, the halo vanished.\n[1251.8s] Often, she’d immediately \nstart ranting about things\n[1254.52s] they’d said or done that she’s \ntaken as deliberate insults.\n[1258.52s] She’d erupt with the same six words:\n[1261.48s] ‘Who do they think they are??’\n[1263.6s] and proceed to eviscerate their characters.\n[1266.8s] Her targets included many \nclose relatives and friends.\n[1270.44s] And for years, I felt a grubby \nburden of secrecy around them\n[1274.28s] having to pretend not to know the vitriol\n[1276.48s] being spewed behind their backs.\n[1279.32s] But it began to seem odd to me\n[1281.12s] that she didn’t confront them directly.\n[1283.56s] She seemed to thrive on confrontations.\n[1286.28s] She’d often lay into staff members\n[1288.24s] in shops and restaurants over absolutely nothing.\n[1292.28s] So why would she hold back\n[1293.96s] with these supposedly insulting visitors?\n[1297.32s] And why, the next time she saw them\n[1299.6s] did she act like they were best buddies?\n[1303.0s] I didn’t know it yet, but I was \nbeginning to register her mask\n[1307.12s] — the false face she used to navigate public life.\n[1311.6s] The imposter’s double-sided \nnature piqued my curiosity.\n[1315.88s] And it would become the new \nfoundational piece of her jigsaw.\n[1320.48s] With that piece laid down\n[1321.96s] others would now fall into \nplace as I quietly observed her.\n[1327.6s] I began to see how stupendously \njudgemental she was\n[1330.74s] — constantly hunting for flaws in \npeople, especially other women.\n[1335.32s] She might decide they had ‘weak shoulders’\n[1337.84s] or ‘low ears’ or ‘a manly jaw’.\n[1342.04s] She’d get particularly fixated with any female\n[1344.76s] who was popular with other \nmembers of the household.\n[1347.64s] Two of my favourite childhood singers\n[1349.72s] — Kate Bush and Debbie Harry —\n[1352.08s] would spark furious insults and impersonations.\n[1356.96s] Sometimes, when she couldn’t find \nany flaws, she invented ones.\n[1360.64s] With the actor Lindsay Wagner\n[1362.44s] who came to fame as The Bionic Woman\n[1364.72s] the imposter claimed she had \nunnaturally stubborn hair\n[1367.92s] and that it had to be completely \nrestyled every few minutes.\n[1371.84s] Whenever she appeared on TV\n[1373.84s] from shot to shot, the imposter would shout:\n[1376.8s] ‘Look! Her hair’s totally different now!’\n[1379.76s] ‘Look! Her hair’s totally different now!’\n[1383.24s] I began to see how this obsessive \nfault-finding connected to another trait.\n[1388.04s] The imposter was fiercely envious.\n[1390.8s] Personal qualities that seemed \nto put other women ahead of her\n[1393.84s] were often a source of huge resentment.\n[1397.28s] It was disturbing to see how envy\n[1399.52s] could reduce a grown-up to \nsuch infantile displays.\n[1403.92s] And it was bizarre that she \nsaw herself in competition\n[1407.24s] with these talented, accomplished women.\n[1410.56s] It pointed to another unwholesome trait.\n[1413.04s] She was so vain.\n[1415.12s] She would’ve probably thought \nthis video was about her.\n[1418.8s] She often admired old photos of herself\n[1421.48s] and said people had told her \nshe was an exceptional beauty\n[1424.56s] on a par with her Hollywood idol Ava Gardner.\n[1428.8s] When the American sitcom The \nGolden Girls began airing in the UK\n[1433.12s] she was mortified when people started telling her\n[1435.72s] she looked like Bea Arthur.\n[1438.2s] If you ever come across Ms. \nArthur’s earlier sitcom ‘Maude’\n[1442.2s] the resemblance is striking.\n[1445.08s] The imposter would sometimes call on me\n[1447.12s] to reassure her there was no similarity.\n[1450.16s] She’d snort with satisfaction when I told her\n[1452.8s] she was nothing like Bea Arthur.\n[1454.96s] Only what I secretly meant was\n[1456.72s] that she had none of her \ndoppleganger’s humour or warmth.\n[1460.88s] Her vanity reflected another quality.\n[1463.8s] She was deeply delusional.\n[1466.32s] This became very evident in \nher endless victory stories\n[1469.42s] — epic tales of triumph \nover people in everyday life\n[1473.68s] from close relatives to complete strangers.\n[1477.12s] They were an odd mix of ‘eye for an eye’\n[1479.36s] and ‘turn the other cheek’.\n[1481.68s] In some stories, she’d recount how she got\n[1484.08s] secret revenge for some perceived offence.\n[1487.56s] In other stories, she’d boast about\n[1489.6s] how she could’ve taken revenge\n[1491.52s] but instead took the higher moral ground.\n[1495.08s] Both kinds of story would \nend with the same punchline:\n[1498.36s] ‘I showed them!’\n[1500.96s] And they had something else in common.\n[1503.08s] Most of them never happened.\n[1505.36s] I was usually present when these \nsupposed incidents took place\n[1509.04s] and her accounts of them were \noften unrecognisable to me.\n[1513.08s] For years, I put this down to \nmemory problems on my part.\n[1516.88s] But certain details would stand out in my mind\n[1520.04s] and I started checking them out with my brother.\n[1523.28s] I began to see a pattern of \ndistortion in the imposter’s stories.\n[1527.76s] She kept assigning malicious motives \nto completely innocent exchanges.\n[1532.52s] Kind words became sarcasm.\n[1534.8s] Offers of help became insinuations of stupidity.\n[1539.68s] Many of the encounters that \nwould become her victory stories\n[1542.84s] actually began with her getting something wrong\n[1545.88s] like mistakenly jumping a queue.\n[1548.24s] And most of the time, people \ncorrected her very gently.\n[1552.4s] But to her, the mildest corrections \nbecame scathing put-downs.\n[1557.4s] She was intolerant of any criticism.\n[1560.72s] Her actions were beyond reproach.\n[1563.4s] Her opinions and preferences \nwere objectively correct.\n[1568.16s] As all these jigsaw pieces fell into position\n[1570.8s] two interrelated shifts started to take place.\n[1574.84s] As her disconnection from reality became clearer\n[1578.12s] my doubts about my own mind began to recede.\n[1581.64s] I became more sure of my \nmemory, my senses, my judgement.\n[1586.92s] Then one day a new piece of the \njigsaw solidified everything.\n[1592.4s] We were on a caravan holiday.\n[1594.56s] On a drive out to a craft fair, I’d \nbought myself a cheap wooden flute.\n[1599.76s] On the drive back, I started \nworking out how to play\n[1602.4s] one of my favourite songs: \n‘Eleanor Rigby’ by the Beatles.\n[1607.08s] After a while, the imposter barked at me to stop.\n[1610.72s] I put the flute down.\n[1612.96s] A few moments later, she spun round\n[1615.16s] and bellowed, ‘I told you to stop!’\n[1618.88s] Bewildered, I said, ‘I did stop.’\n[1622.48s] She told me to swear to her god \nthat I was telling the truth.\n[1626.36s] I knew what was coming.\n[1628.32s] It was a familiar ritual.\n[1630.84s] Sometimes, instead of just \nfalsely accusing and punishing me\n[1633.92s] she liked to draw things out\n[1635.52s] commanding me to swear I was innocent\n[1637.6s] of whatever malicious deed or \nmotive she suspected me of.\n[1642.08s] Of course the verdict was already set.\n[1645.32s] The moment I swore my innocence\n[1647.12s] she’d triumphantly declare, ‘You’re going green!’\n[1650.94s] — i.e. my guilt was literally \nturning my face green.\n[1656.28s] My punishment would then be extra harsh\n[1658.6s] because I’d failed to confess \nwhen I’d had the chance.\n[1662.92s] For years, more than any other phrase\n[1665.64s] ‘You’re going green’ had made me feel like\n[1667.88s] I was truly losing my mind.\n[1670.8s] Being told I was physically expressing guilt\n[1673.48s] for acts I had no knowledge of made my brain fuse.\n[1678.08s] But, sitting in the back of that \ncar, the phrase had no effect.\n[1682.08s] I knew the accusation was absurd.\n[1685.08s] At first, I thought she was just deluded.\n[1688.64s] But, seeing her grin, I realised \nshe knew what she was doing.\n[1693.68s] And a major puzzle piece fell into place.\n[1697.32s] Besides being delusional, she was cruel.\n[1701.04s] She was playing a spiteful mind \ngame just for the fun of it.\n[1706.2s] When we got back to the caravan site\n[1708.36s] I was ordered straight to bed with no dinner.\n[1711.76s] The imposter said I should thank her\n[1713.44s] for letting me off so lightly \nbecause we were on holiday.\n[1717.12s] Without a word, I went to bed.\n[1719.88s] My mind was in overdrive.\n[1722.12s] I recalled countless similar \ntimes when she’d convinced me\n[1725.52s] I was guilty of what I now \nknew to be imaginary offences.\n[1730.12s] And I recalled the brutal \npunishments I took for them.\n[1734.08s] I could’ve reacted with anger or resentment.\n[1737.4s] But what I felt was exhilaration.\n[1740.44s] The pure Archimedean joy of discovery.\n[1744.12s] All the swirling confusion I’d been \nborn into had snapped into coherence.\n[1749.32s] I wasn’t mad or a monster.\n[1751.96s] I’d been tricked into believing those things.\n[1755.6s] There would be more grotesque \npuzzle pieces to come.\n[1759.0s] But I could see the basic picture now.\n[1762.36s] I also thought about Walter\n[1764.32s] and how he’d always backed her up.\n[1767.48s] At first, I assumed he was just like her\n[1770.28s] and the pair of them were in cahoots.\n[1773.16s] But the next day, he went overboard \ntrying to be extra nice to me\n[1777.4s] offering me treats and trying to joke around.\n[1781.0s] And it occurred to me that maybe he was trying\n[1783.8s] to make up for what she’d done.\n[1786.68s] Over the following weeks, \nI observed them together.\n[1789.96s] And I had my second Eureka moment.\n[1793.28s] He backed her up not because he was like her\n[1796.04s] or agreed with her but \nbecause he was afraid of her.\n[1800.24s] I began to see how he \ndiminished himself around her;\n[1803.36s] how the life drained out of \nhim when she started her rants.\n[1807.64s] He was on the imposter’s minefield\n[1809.88s] just like me, my brother and Calla.\n[1814.32s] My first reaction to this revelation \nwas to feel a swell of empathy for him.\n[1819.8s] And for a brief time I saw him and the imposter\n[1822.84s] in a simplistic black-and-white way\n[1825.0s] as the good parent and the bad parent.\n[1828.24s] I imagined that if he had married someone else\n[1830.56s] he might’ve been a very different father.\n[1834.4s] It’s easy to get into a \nvery tangled-up relationship\n[1837.68s] with the parent who enables the anti-parent.\n[1841.24s] Viewing these enabling parents as fellow targets\n[1844.44s] we ignore their neglect. \nWe excuse their complicity.\n[1849.72s] When we erase their accountability\n[1852.04s] we can end up sliding back and forth\n[1854.4s] between feeling protective towards them\n[1856.64s] and being betrayed by them;\n[1859.0s] hoping they’ll come to \ntheir senses and take action\n[1862.36s] and being knocked flat with disappointment.\n[1866.12s] It can be even more of a psychological seesaw\n[1869.0s] than life with the anti-parent.\n[1871.8s] Luckily, Walter’s unwavering \nsubmission to the imposter\n[1875.28s] didn’t allow much hope.\n[1877.32s] As he continued to indulge her cruelty\n[1879.36s] — and enforce it — my empathy faded fast.\n[1884.28s] I realised it didn’t matter what kind of father\n[1886.76s] he might’ve been with another wife.\n[1889.28s] It was his actions with this one that counted.\n[1892.64s] If he’d fought to protect us and lost\n[1895.52s] I could’ve respected him.\n[1897.88s] Instead he chose to have his own children\n[1900.56s] routinely, casually trampled just to try\n[1903.82s] — in vain — to keep her sweet.\n[1907.08s] He seemed to be in complete denial\n[1909.12s] of the damage being done to us.\n[1911.32s] It was like we were stress toys\n[1913.08s] that would magically bounce back into shape\n[1915.44s] no matter how much pummelling we took.\n[1918.76s] Walter’s abandonment of his parental duty of care\n[1921.96s] was something our relationship \nwould never fully recover from.\n[1926.6s] For a while I saw them both as bad parents.\n[1930.64s] Before long, I stopped thinking \nof them as parents altogether.\n[1934.8s] The title didn’t fit either of them.\n[1938.4s] I filled the parent-shaped hole \nthey left with other people\n[1942.56s] from inspiring teachers, kind neighbours\n[1945.56s] and other children’s wonderful parents\n[1947.96s] to beloved characters in literature and TV.\n[1952.4s] Like a magpie, I collected \nthe parts of them that I knew\n[1955.72s] to be good and created an \ninternal patchwork parent.\n[1960.72s] From this rich, ever-expanding resource\n[1963.68s] I took my inspiration, my \nstrength and my discipline.\n[1968.76s] And it would be an invaluable help\n[1970.68s] as I moved into a new phase of \ninteractions with the imposter.\n[1975.84s] Having discovered what I was dealing with\n[1977.96s] I would now enter the next process\n[1979.92s] in the path back to health: defence.\n[1983.48s] I’d begin to take conscious, organised measures\n[1986.28s] to fend off the poison.\n[1988.96s] As an eight-year-old there \nwas little direct action\n[1991.68s] I could take against the imposter.\n[1993.88s] But I vowed to myself that \nwhen I was as big as Walter\n[1997.24s] she’d learn to behave herself around me.\n[2000.52s] As it turned out, it didn’t \ntake anywhere near that long."}'
