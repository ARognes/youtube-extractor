transcript: Hey everyone, Cody here. I'm currently at my girlfriend's place and I wanted to show off her little fermentation station. I thought this was really neat. So, she's got some kombucha, some wine, and sourdough, some other things. What I thought was particularly interesting and it's going to be the main focus of this video is her pickle jars. So, these [snorts] are an ancient Chinese design. They use a water moat as an airlock. There's a This one has an inner lid to catch drips. Uh these ones over here are clear so you can see through. They use Sichuan peppercorns as the the main spice and that helps with the bacteria and stuff. These can process pretty much any vegetable, which is really cool, even some fruit. But, something that I had never come across before was the fact that the brine is reused over and over again. Like some of these have gone on for hundreds of years. She's named her jars and celebrates their birthday. I think that's amazing. >> [gasps] >> So, this one you can see the vegetable level is pretty low. Uh this is the one we've been eating out of. >> [snorts] >> If I kind of pull this out, open it up. This one doesn't have an inner cover so I got to be careful with the drips. I can reach in here and grab a vegetable. How about a piece of radish? Taste amazing. >> [clears throat] >> Now, when this gets down a bit, uh probably about now-ish, she'll fill it back up with vegetables. And then while it's uh processing, we'll switch over to this other one here. Now, if you're wondering about the red color, that comes from beets. Beets are added cuz they're a vegetable that is pickleable. They also add a nice color. They kind of hide some of the murkiness and also give kind of a visual indicator of how much it's been pickled. Now, what these jars do is they help solve a problem that plagued humanity since, well, the beginning of agriculture. You see, sometimes your garden produces a whole lot of vegetables all at once and then not so much later on. And you need a way to kind of spread that out. You need a way to preserve the vegetables from the times of plenty to times when your garden's not producing much. And before you had, you know, refrigeration, what do you do? Well, one way was pickling. So, what the pickling is is you create a condition that a specific kind of bacteria, a good bacteria, likes to grow. And what those bacteria do is they they eat the simple sugars, they eat it real quick, and they produce acids and other chemicals which keep other bacteria from growing, other bacteria that might be harmful. And they also kind of predigest the foods so that when you do eat it, you actually get more nutrients out than you would otherwise. It's it's awesome. I decided this is something I can definitely use. And so, she set me up with a jar of my own and you might have seen it briefly in the last episode of Chicken Hole Base. I've been using that to preserve my garden produce without need to run a refrigerator, which is great when you're off grid. So, one issue I found is when you eat the material down like this, it puts a lot of space in here that's full of air. Now, it's it's okay to have a little air in there. In fact, the bacteria, you know, it makes them grow better and it needs a little bit of air. But, a lot of air invites other organisms that maybe you don't want, like mold and weird funguses. Usually it's fine because the bacteria in here can help fight that off. But, sometimes, you you might get a little bit of something growing in there. And one way to prevent that is not eat it down so far. Just like take a little bit and then fill it up with vegetables. Little bit, more vegetables, right? But, the problem with that is now the material at the bottom gets really old and the material at the top never does. So, it keeps cycling out of the top and not so much at the bottom. You can kind of stir it around and try to fix that. But, then you've got to have a way to distinguish the vegetables, which ones are older and which are younger. The beets help, but another way is to cut the vegetables differently each time so you can kind of remember which ones are which. But, the fact that the brine is reusable gives me an idea. What if I made a jar that had two openings, one that you put the vegetables in, one that you take it out, and basically continuous feed through it? That way you always know the younger stuff is on one side and the older stuff is on the other. You don't need any tricks, just put in one side, take out the other. So, I thought I'd make something like this and see if it works. So, I got a couple of these little pickle jars here. You see they've got the water moat and everything, it's just smaller. And I think what I'm going to do is I'm going to cut this right here using my rock saw. I might be able to save the majority of the jar. That'll give me these moats so I can use them for the experimental jar. So, you got a pair of them here. I'm just going to cut it off. So, this was the main body of the pickle jar, but we've removed that. And now I'm going to replace it with something that looks kind of like a U-shaped glass tube. Now, these kombucha bottles here are basically like a pipe segment. So, I'm going to take advantage of that. I'm going to cut the tops and bottoms off and basically treat it like a piece of glass pipe. Now, I'm going to cut some diagonal cuts in here so I can kind of bend it into elbows. You can see along these lines here. I made a uh cardboard form so I could get the angle right. This is 22 and 1/2° here. They add together these four pieces into a 90° turn. So, I'm going to cut along all these lines here and hopefully the whole thing doesn't shatter. >> [laughter] >> And also, cutting this is fairly difficult cuz I kind of have to turn the bottle as I'm going. So, I got a few spares. I'll probably break a few bottles, but we'll see how this goes. All right. Ah, that worked pretty well. All right, so there's all the pieces of glass cut. I'm going to temporarily tape them together just to line everything up and then I'm going to glue it. So, there it is roughly fit together with tape. Seems to be pretty good. There's some gaps, you can see, but I think I can fill those with the glue. And speaking of which, I'm going to be using aquarium sealant. It's not ideal. I'd rather it just be solid glass, but this stuff is food safe and this is a prototype after all. So, I'm just going to I'm going to start tacking it together using this. Just in a few places between the tape to hold it so that I can remove the tape and then I'll do the rest. So, now that the glue is cured, I can remove the tape and put in the rest of the glue to make it watertight. And here is the finished jar. You can see I've added some little feet and I've glued on the moats. I've given it a couple of days to fully cure. And now, I'm ready to run a leak check. So, I got a gallon of water I'm going to pour into it. I'm going to see if it pours out anywhere. Look at that. Holds almost exactly a gallon. >> [laughter] >> It's been about 24 hours. No puddles, no leaks that I can see. I think we're good to go. I'm going to empty this out, sanitize it, and then we're going to fill it up with pickles. >> [snorts] >> To sanitize the jar, I popped it in the oven, heated it up to about 225° F, and let it sit there for a couple of hours. To prepare the vegetables, I washed, peeled, and then chopped them into small pieces. Put them in this pot here. You can see the level I've marked for the volume of the jar. Now, I'm going to take these vegetables and I'm going to put a little bit of 80-proof alcohol on them just to help sanitize them to decrease the bacterial load. The alcohol [snorts] will ultimately be converted to vinegar by the bacteria. Mix this around. You can see I've got cabbage, radish, turnip, some onions, and beets along with some ginger and garlic for flavor. So, now for the spices, sugar, and salt. I also popped these in the oven and heated them to 225° for about 3 hours just to make sure that the bacterial load would be decreased. Let's start with the salt. So, I want the solution to be about 4% salt, so I'm going to add 160 g of sea salt to my approximately 4-L jar. Just going to toss this into the vegetables. Give that a mix. Next, I'm going to add a bunch of the peppercorns. These give flavor as well as preventing harmful bacteria from growing. I'm going to add in a few star anise seed pods. The anethole in these is anti-fungal. It also gives a nice flavor and aroma. Chili peppers for spice, a few cloves just for flavor, a little bit of cinnamon, and finally some kombu kelp. This adds iodine, umami flavoring, and will help the vegetables break down faster. Let's mix all this together just so it's kind of homogeneous. Now, the first thing I'm actually going to add to the jar is some water. I think will help things move through easier. This is water that has been boiled and then slowly cooled inside of a sealed container. Okay. I'm just going to start loading the vegetables. I'm going to have to kind of push them through with a stick. That seems to be going well. So, there's the vegetables in. And now I'm going to add some rock sugar just to give the bacteria something to munch on. Get them started. Just do like a handful or so. Maybe on all sides. Okay. And so now, some bacteria from another jar. This will get things going with a nice healthy population. I can pour some on side. Put the chunks over in this other side here. Now, you don't necessarily need a starter. This jar here that I made using some yellow beets, I made without a starter. Just the natural bacteria that's floating in the air and living on the vegetables was enough to get it going. It took a lot longer. It took almost 2 months for it to get to the point where it was fermenting properly. The starter is just a shortcut. It's just like with sourdough. And finally, I'm going to finish topping up the water. All right. So, there we go. I'm going to clean up these water moats. Add the lids. So, now I'm going to add a little bit of water to the water moats to make it airtight. And to keep the water from evaporating, I'm going to add a little bit of magnesium chloride to it. Magnesium chloride will absorb moisture from the air, so it'll never evaporate down, at least not completely dry. So, here we are. It's been a couple of days. You can see that the bacteria is starting to eat the sugar and produce CO2, which has been bubbling out. These have been rocking around. I put some sticks on here so I can see it more easily on the time-lapse camera. But, uh one thing I've noticed is it's capturing a lot of gas here in this low section. And uh that's exactly why I wanted to make this out of clear glass so I can see problems like that. If this was ceramic, I wouldn't be able to see that. I think for the next iteration, I'm going to make this kind of slope upwards. That way, this gas bubble kind of flows out. In fact, I'm going to try see what happens if I lift this up. Yeah. So, I've got a little piece of pottery here. Slip that under. Let's see if that helps. Yeah, it's not overflowing here yet. It's good. The brine level's going to be a little bit lower on this side, but I think that's okay. >> [snorts] >> All right. Make sure it's contacting this heating pad. It's winter right now. My house is fairly cold, so I put this heating pad here to help speed things along. It doesn't really need it, but it does make the pickling process go much faster. So, now I think I'll capture much less of the gas here now. Also, the gas bubble's flowing to one side will kind of help the brine circulate. Speaking of which, if you look at the bottom here, you can see the vegetables are kind of floating and there's a layer of clear brine at the bottom. So, here we are after about a week. The fermentation activity has slowed down, and I think I'm actually going to tip it back to level. The putting it up like this didn't seem to really help all that much, and it's gotten up near the rim very close a few times. So, I think it's better just to leave it level for now. I'll work on uh fixing the issue in the next iteration. Let's just tip it down. Yeah. But, as I said, the fermentation's pretty much complete, so these pickles should be just about ready to try. Let's pull the lid off. I've got a dish here, which I've weighed. I'm going to pull out the pickles. I'm going to try to keep track of how much I pull out just so I know how much salt to add. Uh really, the salt should be just added by flavor and how much you desire, but I am trying to keep track of it. So, let's take a pepper out. Why not? Some cabbage. Yes, I'm just going to pull out a bowl or so of material. All right, so that's 200 g. That'll make the math easy. I'm going to add about 8 g of salt. That should keep the salt levels the same. So, now let's pop the lid back on this side. And let's add some vegetables to this side over here. It's interesting having it two sides. When I released this side, it kind of sunk down and expelled gas over here. Here's the vegetables I'm going to add. I'm going to start with some carrot, mostly because of its bright color. It'll kind of as a serve as a marker. Okay. I got some brussels sprouts, which I've chopped into quarters. These are basically like cabbage. Uh some more beets, so make the color even brighter. Darker. Turn up. And some more radish. Let's get this shoved down. Okay. It's not super easy, but it is doable. Just kind of push the material down. Looks like it is going to naturally mix together as I'm pushing it. That's fine. Let's add some more of the vegetables. Now, you notice I'm not sanitizing this time. The brine is pretty active with bacteria now. It's not as sensitive to contamination. So, I don't have to worry about that as much now that it's established. Just for fun, I'm going to add a little bit more spices. So, some mustard seed, some coriander seed. I thought these worked pretty well in my other jar. And a little bit of black pepper. Just a few of those. All right. Let's get this mixed up. Okay. There we go. And of course, my 8 g of salt. Might have overdone it on the mustard seed, but it's all good. Let's go taste those pickles. All right. So, here's the pickles. Let's start with a piece of the daikon radish. Mhm. Okay. That's pretty good. Mhm. The the umami flavoring comes from the seaweed. That That was a good choice. Mhm. It's It's slightly uh acidic, so it is definitely developing the vinegar. These It's definitely pickled them. Flavor excellent. >> [snorts] >> Um that cabbage was a little bit underdone. Like that could have pickled for longer. Well, makes sense. They've only been in there for a week. But the the radish is perfect. Radish pickles pretty fast. Mhm. So, it's been about 2 weeks since the last video clip. I was at the Mars Society Desert Research Station. I turned off the heater and just let it sit at room temperature. So, it just sat here for a couple of weeks. I've noticed it's not catching as much gas. It's also not making as much gas, so that makes sense. Things have really calmed down. It might be cuz of the lower temperature, and it might just be that it's consumed all the sugars. So, I definitely think it's time to feed it again. And to well, take out a harvest. So, I found this Sunday spoon. It's basically a spoon with a long handle on it. And I find it is working better than the chopsticks. I just tried both. I think I like this better. Mainly because well, look how easily I just popped that onion out of there. >> [laughter] >> I can kind of like scoop material through all that. Okay. So, I got a bowlful of pickles here. I'm going to go weigh this, so I know how much salt to add. So, I calculated it out, the amount of salt is about 8 and 1/2 g. Going to add just a few more of these Sichuan peppers. And here's some vegetables that I cut up. So, cabbage. Pretty safe bet. Always add some cabbage. Oh, yeah. That spoon works pretty well. See that? I'm able to just kind of scoop and push the material. >> [snorts] >> We got some ginger. Some more daikon radish. Some turnip. All right. So, here's the second batch of pickles. It's time to try it out. So, let's start with a beet right here. Mhm. It's pretty good. It's a little little bit crunchy. I mean, pickles are good crunchy, but I kind of like them tender. So, the the beets definitely go longer. Let's try this uh daikon radish. That was perfect. Daikons are perfect. Mhm. Turnip. It melts in my mouth. Cabbage, perfect. Let's try a piece of the seaweed now. Still kind of rubbery. It may never not be rubbery. I added the seaweed for the uh the properties it gives the rest of the pickles, not the seaweed itself. I just lost an onion. And finally, let's try an onion. Okay. Those are definitely much better than they were. Mhm. Oh, that's perfect. Kind of weird to just be munching on a onion like it's nothing. Let's try some ginger. Now, last time the ginger was still pretty spicy. So, let's try this. Okay. It tastes like ginger. Okay. >> [cough] >> Spicy. Yeah. >> [snorts] >> All right. So, it is week uh put text on the screen cuz I forget. Let's uh open this up. Let's use my Sunday spoon to kind of push material through if I can. Yeah. It's getting kind of hard to push material. I think having smoother walls, you know, without those jagged turns would help with that. And also, maybe I'll invent me a little pusher rod or something. Let's uh feed it. I've already taken some vegetables out. I've got some leftovers from another jar. There's some beets, cabbage, carrot, uh turnip, garlic, ginger. Also, some uh basil leaves. I'm trying some basil in there. Yeah. It still pushes along. I haven't clogged it yet. And I'm going to not add salt this time. Cuz last time I ate that whole bowl of pickles, I was feeling really thirsty. And then I realized I just ate like 8 g of salt. And that's a lot for anyone. So, uh yeah, I'm going to lower the salt content a little bit. It doesn't need the salt so much now that the bacteria is established. So, that should be okay. So, here we are. It's been another week or so. You might notice that there's some vegetables missing over here. That's because I've been harvesting already. I've actually been taking out a little bit each day. I've been eating a little bit each day. That's probably more like how I should be doing it. That spreads out the salt for one, so it's not all entering my system at once. So, anyway, I'm going to feed it all at once in a batch though. So, I've got some vegetables chopped up here. Got some more beets. Throw those in there. Keep the color up. I can't quite see with my plate. So, I've got some cabbage. Always got to have cabbage. Cabbage does so well in this. There's some turnip. And I'm actually trying some horseradish root that has been sliced thin. I think it might add a good flavor to it. I'm also adding some of these sunchokes. I grew these in my garden. I pulled some out yesterday. Chopped them up. Let's see how they do. They've got inulin in them. And inulin is a prebiotic that bacteria love to eat it. That's why they make you gassy if you eat them raw. I'm thinking maybe it would help boost the bacteria in this system. We're going to find out. So, let me push this down. Yeah, I might have to invent a little pusher to push the material through. The problem is these sharp corners here kind of catch and they cause friction. So, it's kind of hard to push the material. Most of it's bunching up right here. So, in order to get more pickles so that I could reach them, like when I clear this part out, I kind of have to reach in here with the spoon and kind of wave at it to use the brine to kind of wash materials through >> [snorts] >> and bring them up to where I could reach them. I think we can solve that by being able to push more material through. So, I got a piece of stainless steel here. And I'm going to kind of bend it so that I can reach down in and be able to push material a little bit farther than I can with the spoon. So, that's probably about all I need. Let's give it a try. Yeah, it's definitely working. >> [snorts] >> It's not stuck like hard. It just needs a little push. Yeah, that that totally works. The little hook on the end is catching material. So, maybe I'll make that more round, but yeah. That's all it needs. Just something longer that I can reach in there with. And it probably won't have to be used very often. I could of course use it in conjunction with the spoon. Yeah. Maybe I'll get something a little bit longer so I can actually push farther. >> [snorts] >> But of course, if I make another jar and it's doesn't have these sharp turns, this might not be a problem at all. Yeah, the weather's getting warmer, so I haven't needed the heating pad. You might notice I removed it. I was hoping to find a piece of carrot, which would indicate that the material that's on this side is stuff that I've added in since starting the jar. Ah, here we go. There's a piece of carrot. So, this is some material that was added after I started the jar. All right, so here's a little piece of carrot. Mhm, carrot doesn't pickle very well, but it did pickle. It's very good. This could use a bit more designing. This is just a prototype. I think the first couple of changes I'm going to do is add a larger opening to the feed side both to make it easier to get the vegetables in and also to indicate which is which. >> [snorts] >> And second, I think it doesn't need to be this long. Like the dwell time of the vegetables in there, it only needs to be a couple of weeks. It doesn't need to be months. So, we could probably remove this entire section right here. That would also make it easier to push the vegetables through and get them back out and such. That and angling it slightly. Yeah, I think it'd work great. This is a device that converts vegetables into a tastier form while also preserving them. I think that's amazing. The standard jar is probably fine on its own, but it's fun to play around, right? Anyway, hope you enjoyed. I'll see you next time.
