transcript: '{"content":"\n[0.0s] One of the more annoying things to deal\n[1.56s] with in JavaScript is these really long\n[3.4s] relative imports and exports because\n[5.4s] there''s no way to do an absolute import\n[7.24s] in JavaScript. But, if you''re using\n[9.28s] TypeScript, you can actually get around\n[10.76s] this problem. Inside your TypeScript\n[12.68s] config, all you need to do is to specify\n[14.96s] a paths. So, you specify paths inside\n[17.48s] your compiler options. This is an object\n[19.8s] where the key of that object represents\n[21.52s] the alias you want to create. In my\n[23.68s] particular case, I''m creating an alias\n[25.48s] for the at sign followed by a slash and\n[27.72s] everything after that is going to be\n[29.24s] essentially put star is in my path\n[31.64s] validation. So, inside this array here\n[33.56s] is what the actual path will result in.\n[35.48s] In my case, it''s {dot} {slash} source.\n[37.44s] So, anytime I type in the at sign\n[39.52s] followed by a slash, it''s going to\n[40.96s] replace that with my source folder and\n[42.96s] essentially allow me to do absolute\n[44.44s] imports because now I can take this\n[46.28s] entire thing and just replace it with\n[48.08s] {ampersand} {slash} at the start and\n[49.68s] everything is going to work exactly the\n[51.2s] same. The only caveat is you need to\n[53.2s] make sure you enable this in your\n[54.68s] bundler as well. So, if you''re using\n[56.64s] Veet, for example, this is very easy to\n[58.36s] do. All you need to do is go into the\n[60.28s] resolve object and then you need to\n[62.16s] search for the TS config path, set that\n[64.48s] to true, and that''s going to make sure\n[66.04s] it respects all the TS config paths that\n[68.12s] you specify inside of here. And you can\n[70.12s] create as many or as few as you want. I\n[72.28s] generally like to have at least one for\n[73.92s] my root of my application, but you can\n[75.92s] create as many as you need based on how\n[77.48s] complex your application is."}'
