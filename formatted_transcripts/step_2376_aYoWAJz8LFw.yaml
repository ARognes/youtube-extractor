transcript: Everything is exciting, but also exhausting. So many distractions for 7 hours a day. Nothing OS 5 filters the chaos, adding the things you actually want. It's fun, personal, and puts you in control. Start with a new clock face. Micro graphics headline your day, so you can scan what's important and dive in when you're ready. Inside, transparent detail and adaptive color give the home screen more definition. There's also some new ways to use your phone. Track moments in the real world with a way time. >> [music] >> Control the glyph on your home screen and clip your favorite things with collector. >> [music] >> We've also made things a little smoother. Essential space is even better at making sense of [music] your memories. Essential voice uh writes what you say now [music] um faster and clearer. And need an app for that? With our builder, create custom widgets tailored to your way of living. There's so much you can do. More joy every day. Nothing OS 5. >> [music]
