ion. You should have warned me you were going to ask me that >> [laughter] >> cuz I was like, I don't know. Like, I'm honestly just going with the flow. I truly enjoy coding and being a software engineer and there's a lot of changes happening. Like, 4 years ago I didn't use AI with well, when programming, but now it's like without AI I'm I would be the slowest developer out there, right? So, it's all changing so fast that I want to be involved in the tech industry, but at the same time I'm really enjoying creating content. I really enjoy the impact that I'm making. I think the best part is when someone comes up to me and is like, "Oh, hey, I I followed that resume or format that you shared and I got an an interview." Or, "Hey, I I got the offer, right?" Just giving you an example, there was this guy who is uh he was working for CVS, just like a cashier or something. He did not know how to code, but he was like, "You know what? I think I would make a I've seen a lot of YouTube videos and I think I would be a great uh program manager." And I was like, "Well, you need to understand the basics of tech if you want to get in the tech industry even if you're not going to code, right?" So, I kind of tutored him for a year, a year and a half actually. Where every week he would just like text me, like, "Oh, this is what I'm doing. How do I do this? How do I do that? Do you have any resources?" And now he's at Microsoft. So >> As a program manager? >> Yeah. Yeah. So, that when he joined Microsoft, I was like, "Oh my god, like full circle moment for me." Moments like that where I'm like, yeah, I cannot stop creating. Like, this is where I'm making huge huge impact, right? And 2 5 years down the line, I think I see myself doing the same, creating content and being an engineer, but yeah, I don't know. How old are you? Um I am 26. Okay. So, I almost have like 20 years on you. You're still early career, right? >> Yeah. I'm a software engineer, too, so. Yeah. Awesome. I just realized like I asked you what your plan was and what you're going to be in 5 years. I did not have that answer when I was, you know, your age, so. >> [laughter] >> It's kind of an unfair question from my side. But it is a ton of work. You are probably working 7 days a week on your on your all of your content stuff and is that sustainable? It doesn't feel like work. So, content stuff, it's Saturday I spend like 12 hours, 12 13 hours. And Sundays I spend like 6 7 hours and that is enough for now. So, all I have to do is on Saturdays I just spend the morning kind of scripting and scripting's easy because throughout the week I'm getting all of these ideas that I'm kind of typing in my notes app. So, I just have to go back to my notes app and and immediately my brain is like, "Oh, yeah, this is how I wanted to explain that." And then shooting is what takes the most time. So, that's what I do on Saturdays again. So, I just record everything in one go, batch create. And then, like I said, I have editors. I never edit my own thing. So, then I just send it out. I'm like, "Hey, this is the script. Like, here's the video you have to make. Here's the carousel you have to make." And then that's it. Like, they they edit it, they schedule it, they post it for me. So, it's usually just a Saturday and Sunday that I'm busy with, but like I said, I kind of have to pick. Like, I can't do it all. Like, for example, I really want to focus on YouTube this year, but I'm struggling cuz it's like by the time I'm done with my Instagram batching and my LinkedIn just like I yeah, I don't know what to do with YouTube. Because me writing a script for YouTube is not a muscle that I've trained as much as I've trained my myself for Instagram, right? So, I think it'll take some time, but it's definitely doable, especially cuz it doesn't feel like work at all. Well, let's barter. You can you can help me on my Insta and then I'll help you on the YouTube stuff. What's like some bad career advice that you might hear on the internet? I think the biggest one for me would be follow your passion. I don't know if I should say this, but like I don't really believe in like you chasing your because like, especially as a kid when you tell someone like, "Oh, follow your passion." Most of them, especially like me, I would be like, "Oh, I just Okay, my passion is traveling, so so now what, right?" So, I think there's a balance there. Some of the highest paying jobs and uh businesses in the world aren't they're not fun. The most boring businesses make the most money, right? Going back to my example, if I want to travel, I need money, right? So, I think there needs to be a balance in the sense that this is what I want my life to look like. This is what my income needs to be for that. These are the fields that are high paying. So, now you teach yourself that high income skill, whether it's marketing or coding or anything else, right? The first time you try, the first few months, you're going to struggle. It is a high income skill for a reason. You'll be like, "Oh, I'm not passionate about this." But I would urge you to kind of be patient and actually take the time to learn the skill. Like, give yourself maybe 6 months, maybe a year before you decide that, "Okay, this is truly not for me." Instead of simply quitting once things start feeling like they're too tough to understand. Do you feel like coding is one of those places where people Like, would you encourage people to pick up coding as a as a profession still with AI? Yeah, for sure because I still think at the end of the day I think now more than ever there's a demand for people who actually understand what's happening behind the scenes. So, I still think that tech as a career would be an awesome choice. You just need to make sure that you go in deep. Like, I feel like if you think of the '80s and the '90s, it was a time when college degree was not important. You got out of high school and you were good. And then my time was when you kind of need a bachelor's degree. So, I think I mean, I don't know this is going to happen. This is just how I feel. In the future, even more specialization would be important. I feel like master's degrees would be the norm cuz it would no longer be enough to just know how to code, know how to prompt. Like, you actually need expertise on a certain topic. So, like masters or even PhDs, they're going to thrive because they know something and they know it so deep that they're able to create the products that many of us might not even think of or know how to create. You would recommend that people go to a traditional university and get their 4-year degree and their master's? >> I'm definitely biased there cuz I've heard a lot of people say like, "Hey, my degree never helped me out." But for me personally, that is what got my foot through the door. I don't think I would be disciplined enough to study and really have exposure to all of these different tools if I didn't spend my time at that 4-year university. And that's a hot take. Like, I know a lot of people who are thriving, they're definitely super disciplined to self because they're self-taught, right? I think that a traditional 4-year university just gives you so much time. You're surrounded by all of these people who are interested in the same things as you. And there's all of these different opportunities. Like, the research groups we talked about and just different conferences, hackathons. All the list is endless, right? So, and also you have these internship opportunities and companies coming to your career fair. So, it's much easier to kind of get into a company via a career fair versus applying online with 2 million other students, right? So, yeah, definitely makes your life easier, but yeah, there's the the cost aspect to it. What's your take on boot camps? I think boot camps are cool, but like I know people who have been very successful with like a 6-month, 1-year sprint, right? As someone who's personally never done it, I don't have a first-hand experience on whether they're good or bad, but I do think that it takes an insane amount of discipline because your competitors are going to be these people who spent 4 years doing the same thing, right? So, I think it's harder, but I also think that, like I said, depth will be valued in the future, especially with AI cuz now everybody can prompt and make something generic, right? Cannot fast track through years and years of knowledge, right? I think that's really good advice on boot camps. Like, yeah, I go do a boot camp. You should go in and just expect to be the best person Yeah. from that boot camp. Like, you're going to put all of it in there and like just saying that is enough fuel to go and do the thing and and sort of like get the information from the boot camp and then self-study for the thing that you want to do. Yeah, cuz it would take an insane amount of discipline cuz again, your competitors are these people who have been doing it for 4 years, 6 years, right? So. Is there any career advice that you have that we haven't talked about that is super important today's day and age? I would kind of go back to networking. We talked about our personal brand and just posting, but I also think one thing that's really really helpful is knowing a lot of people and knowing the right people. But there's no way to tell if someone you meet is going to help you down in the future. Like, I also saw that there was a study where it was like, it's not your friends who are going to help you get your next job. It's like your friends' friends, your acquaintances, or people you talk to a couple times a year, if that. So, it's just that networking is a very very long-term game. And one thing that I really like to do as a student I used to do this very very diligently. I would send out three messages a day. Every single morning I would get up and it would take me 15 minutes, right? But it would just be three categories. One would be a very like a person that I looked up to and I'm not even expecting a response. Like I would send a message to like Satya or I would I would send an email to like I would just do that, right? And there have been people who got back, right? Like the CEO of HackerRank got back to me. That would be my first category. The second one would be since I was a student I was aiming for all these companies so it would be the senior engineers or the managers in these companies. That would be my second message. And the third message would be to appear. So when I went to University of Maryland it could be someone else at my uni in the same major or someone in a different uni. But every single day it would be someone at kind of my level, right? And the message was the the reach person would be like what I kind of admire about them and why I would love to have a coffee chat with them. The second one would be about why I would deserve an internship at their company or something. And then the third one would simply be like, hey I can offer you this. For example, I interned for Meta. I would love to introduce you to the recruiter who hired me but I see that you interned for Google. Can you do the same for me? So those were the highest impact actually cuz those were the people who actually responded the most. And that also network kind of expanded so much more now because all of those students are now all over the United States and all these different companies, all of these different levels. Some of them are like completely different careers. Like one of my friends, she just became a lawyer. She just quit she was like I don't want to yeah. So it's really helpful to have all of these people because I know I can text her tomorrow if I need something, right? Because she is a friend and even though I don't talk to her every day, I had coffee chats with her when I was a student. So I think just having that network kind of grow year over year is super helpful cuz you can quickly reach out to anyone. I think a lot of people fixate on first-order connections. But I think what you said around second-order connections is really powerful because I think that actually grows faster >> Yeah. than the first-order connections do, right? And so cool, you know, you start networking when you're in college or early career and that network grows and it grows slowly and and there's some people that you can call. But that second and third-order network is growing really really large. At some point you're going to be connected to basically everybody. Yeah, you always know a guy who knows a guy, right? You're good. I think that's really good and I think also really important lesson for people especially when they're young because when you tell people to network and you're like 19 years old, you're like, I don't know anybody though is the problem. You need to make that deposit. Don't expect a response from Satya but Yeah, I I think that's how I knew you, right? Cuz Sandesh was like, oh this is Steve and Yeah. and now I can text you anytime, right? You can I need help with this YouTube video. You've already slid into my DMs so it's good. Well, Angeli, thanks so much for having a conversation today. If people wanted to find some more, we'll put some links in the description but where could they find you? Yeah, I think Instagram would be it but I'm going to focus on YouTube after our conversation so maybe there too. Awesome. All right. Well, thanks so much. >> Yeah, thank you.
