transcript: '- In the final hours of the 31st of July 2025, the office windows of a British politician, Health Secretary Wes Streeting, were smashed and the words ''child killer'' spray painted by the door. This incident took place in Redbridge, East London, right where I used to live. Responsibility was claimed by a direct action group called Bash Back. In a statement on socials, they said: [Voice Of Matthew Schwarz] - Streeting, along with NHS England, the EHRC, and Hilary Cass have paved the way for state mandated conversion therapy. - You may think conversion therapy is an issue that only affects a minority of people, but it is still legal in Britain, and that is a symptom of a problem that affects every single one of us. This is a story about the sabotage of our NHS and corruption in British politics and media. What I wanna do in this video is explain exactly what the problem is and exactly how we can beat it. So question one, why hasn''t Britain banned conversion practices yet? And question two, why was Wes Streeting''s window smashed? [Glass Shattering, Dramatic Music Like Ooooo Philosophy Tube Time Baybeee] Hey, you''re watching this on YouTube, which means it''s free. patreon.com/philosophy tube Go sign up. We worked really hard on it. Patreon pledges go towards paying the crew. We''d really appreciate it. Thanks. All good philosophy essays start by defining their terms and ''conversion therapy'' isn''t an ideal one. The Oxford English dictionary defines it as ''the UK''s Online Safety Act requires you to upload a scan of your face, fingers and butthole before you can see this informa-'' We''re talking about a wide umbrella of practices that can include sitting down and talking like with a therapist, but also exorcisms, electric shocks, beatings, forced labour, withholding food, coerced prayer... We will see many examples today, but if you want a unifying theme, it''s this: There are people out there who believe for various reasons that it is their business who you sleep with, what clothes you wear, and what you do with your body. They wanna tell you what to do and they will use any means at their disposal to make you. These practices are harmful, they do not work, and they''re inherently discriminatory and degrading. So ''therapy'' makes it sound a lot nicer than it is! ''Abuse,'' and in some cases ''torture'' would be more accurate. Some of the legal literature uses the acronym SOGICE: sexual orientation or genderidendiddy - or genderidendiddy? Ehmagerd, I sound like F1nn5ter. Sexual orientation and gender identity change efforts. That''s a little bit clunky. So I''ve mostly tried to go with ''conversion practices.'' Here''s an example definition: [Voice Of Tom Scott] - Conversion therapy is an umbrella term for a therapeutic approach or any model or individual viewpoint that demonstrates an assumption that any sexual orientation or gender identity is inherently preferable to any other and which attempts to bring about a change of sexual orientation or gender identity or seeks to suppress an individual''s expression of sexual orientation or gender identity On that basis - Here I''m gonna set up a Chekhov''s Gun for later. Notice how I highlighted the word assumption? Check out these two definitions and notice the words I''ve highlighted. [Voice Of Tom Scott] - Practices of conversion therapy are rooted in the belief that persons of diverse sexual orientation and gender identity are somehow inferior. The relevant conduct must be undertaken with the intention that it will result in the change or suppression of the sexual orientation or gender identity of the person against whom the act is directed. - Most definitions of conversion practices say the person doing it has to have a certain intention or belief about the inferiority of queer people for it to count. File that one away, we''re gonna come back to it at the very end. [Funky Music Like Awww Yeah Let''s Get FUNducational!] I''d like to start way back at the beginning and talk about where conversion practices come from. My research has focused mainly on the USA and Europe, so as we go through this story do bear in mind you''re getting a simplified version, and this is an issue on which I have a little bias, so do bear that in mind as well. May I have the chicken please? Thank you so much. In 1849, experiments on chickens showed that it was possible to change their sex by transplanting rooster testicles onto hens. People could see that this worked, but they didn''t know how. Don''t worry, we''re not gonna do that to you. One of the first things people learned about physical sex is that you can change it. Just look at the chickens! Scientists, including Charles Darwin said that no organism is 100% male or female. Every organism has the potential for both. Over the following decades, scientists began to understand that sexual development has affected by so-called chemical messengers in the blood. In 1905, the word ''hormone'' was coined to refer to these chemicals. At this time, the concept of sex included sexuality. These days we might say that sexuality is who you''re attracted to and sex is what you are, but that''s a modern distinction. And as the concept of scientific sex gets developed, so too does the concept of a sexual disorder. This was also an umbrella term that lumped together lots of things we might separate out today: queer people of all stripes, but also people with fetishes and sex offenders. There had been attempts to cure sexual disorders before: asylums and mental hospitals existed where doctors would experiment on people. But in the early 20th century this interference gets professionalised. This is a key concept for today''s story. Sex and sexuality, who you''re attracted to and what you do with your body became domains of medical science, the province of elite institutions and qualified experts and all that that implies! Hi, welcome to the footnotes! Footnote, philosophical. Before the concept of sex was professionalised and scientized, people knew about roosters and hens. They had an idea of male and female and expectations about what each one meant. In that regard, some philosophers might say that the concept of gender predates the concept of sex, indeed that sex is merely the projection onto the natural world of gender. If you''re interested in that chicken in the egg puzzle, check out our episode on Judith Butler. If you can change a chicken''s sex, can you do it to a person? This was the next question for the new discipline of sexology and their early experiments focused on children. Some children are born neither male nor female. Some have ambiguous genitalia; some people discover later in life they have internal sex organs they weren''t expecting; some kids are assigned one sex and suddenly grow very differently. These days we might describe these people as intersex or having variations of sex characteristics, and back then people knew this happened, but again, they didn''t know why. One of the first attempts in the USA to investigate it happened at Johns Hopkins University in Baltimore: a doctor named Hugh Hampton Young started surgically experimenting on intersex kids to quote unquote "fix" them. Young''s goal was to change those kids'' sex to make them unambiguously male or female, and to make them straight. If it was a tossup whether to assign them one or the other, he''d try to figure out which sex the children were most likely to be attracted to and make them into the opposite. Essentially, this was conversion practices with a scalpel. Later when people discovered how to make hormones like oestrogen and testosterone in a lab, hormones were used as well. Most of the kids Young experimented on were white, and this is no coincidence. To be blunt, they were the ones seen as worth trying to "fix." Black bodies were more often seen as disposable material for experiments, and this is sadly true for much of medical history. For example, gynaecology was developed in large part by a guy named J. Marion Sims in the 19th century. If you''ve ever had a Sims speculum inserted into your vagina, he''s the guy who invented those. A lot of his discoveries came about through experimentation on the bodies of enslaved black women. That''s not to say those white kids had it easy though: Young and his collaborators often showed no regard for modern standards of consent or privacy. Some of the children he experimented on were left with permanent damage and some of them died. Footnote, historiographical. Uncovering medical history can be tough because doctors sometimes have an inaccurate picture of what they''re doing. Hugh Hampton Young thought he was helping those kids, so a lot of the documents that he wrote, which are many of our sources now, reflect that assumption. But he wasn''t helping them. This disconnect between what healthcare providers believe they''re doing and what they''re really doing is a key concept for today. As sex changes for intersex, kids get publicised, people start to take notice, in particular trans people. Up until this point trans people have been around. We''ve always been around and practices of transition are as old and varied as humanity. We know that some of us managed to get sex changes not long after the chickens did! In 1902, a woman named Jennie June got gender affirming surgery. In 1918, a man named Alan Hart became one of the first trans men to medically transition, and in 1931, the earliest known vaginaplasties were performed on Dora Richter and Lily Elbe, AKA, the Danish Girl. Yes, that''s right! You just seem surprised! And as you might imagine, when the news gets out about intersex kids being medically changed with surgery and hormones, trans people start asking for the same thing, but consensually! In particular, the big moment [the "transgender tipping point," if you like], comes in 1952 when a woman named Christine Jorgensen transitions in Denmark and makes headlines across America. The cat is out of the bag and clinicians across the US are inundated with requests from trans people for sex changes. They reject almost all of them. Here''s a provocative question. Why? Why, why? Why did they reject most of the people who wanted to change sex? Why not just let them? Well, part of the answer could be that they were worried about getting sued if something went wrong, but there might be another reason. In her book, ''histories of the transgender child'' historian Jules Gill Peterson gestures towards the idea that, basically, doctors and professors didn''t want to be associated with people like me! Gender clinics were elite institutions for professionals, not a meeting house for degenerate criminal trash! And yes, criminal, because being queer was against the law. You can''t bring needy people in here! This is a hospital! If you''re very clever, you''ll already have realised those reasons are not grounded in the interests of patients. They are grounded in the interests of clinicians! That''s because the relationship between these clinics and the people using them was extractive. The clinicians were making a career off this. Who people sleep with, what clothes we wear, and what we do with our own bodies was a matter for professionals to decide. If people were allowed to direct their own sex changes well then the clinician becomes a contractor who does a job. It''s like the difference between a brick layer and an architect. Gatekeeping healthcare behind this professionalised process preserves the extractive relationship wherein these clinicians made a career out of denying freedom to people they claimed they were helping. There''s those two key concepts again: the professionalisation of knowledge and the resulting disconnect between what these people believed they were doing and what they were really doing. Footnote, feminist. Society has long tried to control women''s sexuality, gay or straight. We''ve long been pathologized for not expressing our desires in ways men want us to: too frigid; too overbearing; not focused enough on the birth rate; always in need of correction by our husbands or the church or the medical establishment. Men''s sexuality has also been subject to some pressures: "Fellas, is it gay to eat pussy?" et cetera. In that regard, the desire to control sex and sexuality could be seen as just another part of patriarchy. In the 1950s, one of the big dogs on the scene, a guy named John Money, develops a theory that whilst physical sex can be changed people also have this psychological thing called a gender role that is initially soft but then sets very early in life. It sets as either male or female and nothing else and always straight, unless of course something goes wrong, in which case the wise doctor will fix it. This was a much less radical position than the earlier idea that everyone has the potential for both male and female inside them. This false theory allowed Money and his collaborators to deny the vast majority of people requesting sex changes and to abuse gay and intersex people as well, especially kids. Queer kids were forced to stick with their assigned sex and sexuality on the assumption this would cause their gender role to set in the normal way, and if they didn''t do as they were told, they were punished. Queer adults were told their gender role had set wrongly and needed to be fixed like a broken bone. Money''s theories produced a lot of suffering because the frontline response when a queer person came along was conversion practices. Clinicians would try anything they could to prevent kids from growing up gay or trans, ranging from systems of punishment up to and including non-consensual surgeries. Occasionally a trans person would make it through the gauntlet and having demonstrated that they absolutely could not be deterred, they''d be allowed access to real healthcare like hormones and surgery they actually wanted. Gay and intersex people had no such way out. But even this was reserved for the minority of the minority. Transition was only allowed if it would make you straight and only if you would not visibly be trans, if you would "pass," as we say. These clinics only accepted the people they deemed fixable and fixed usually meant straight, not visibly queer, and often white. One black girl who was referred to John Money had been imprisoned on a psychiatric ward for being trans. In 1970, Money wrote back, told her doctor to remove her diagnosis of transsexuality and rediagnose her as a gay man so she could be denied treatment. Apparently there was no fixing her. Trans people who were rejected by official clinics had to resort to other means of survival. Some trans people smuggled hormones across the border from Mexico or even did DIY surgery in the 1960s. Some trans people still have to do that stuff today! You may already have noticed, it was built into the medical system that queer people''s own accounts of who we are and what we want couldn''t be trusted. After all, we''re deviant, borderline criminal. We have to do what the doctor tells us. The professionalisation of knowledge created an entire group of people whose sex lives, clothing choices, and even the ways we walked and talked, had to be surveilled and controlled by a professional, and denying us those basic freedoms was seen as a noble thing to do, as literally good for us, literally healthy. Footnote, sociological. According to one of his former patients, John Money was a paedophile who sexually abused that patient and his brother. Some might say those allegations are incidental. On the other hand, there is an argument to be made that Money''s career *was* extracting value from kids'' bodies by inflicting non-consensual suffering on them. So perhaps those allegations aren''t surprising. I''m not the only person to make this point. Grownups who have survived conversion practices done to them as kids have made the point that the process is designed to make children fulfil the ''correct'' sexual role by interfering with their bodies regardless of consent. And it''s often justified by appealing to the idea that parents always know best and have the authority to interfere and even the most intimate areas of their kids'' private lives. So if you take that idea and run with it, what does the logical conclusion look like? Food for thought. Thanks to John Money and people like him, queerness came to be seen as a problem of sexual development and one that had some external cause. It can''t just be the way that some people are. It must be something happened to you to make you develop wrongly, and if we can just figure out what that is, then we can fix you. Maybe it''s a hormonal thing or maybe it''s exposure to something in the womb? Or maybe it''s a psychological factor? Usually they blame the mother. It''s ''cause your mother punished you too much as a child. Or no, actually it''s because your mother didn''t punish you enough! Or no, actually it''s because your mum hugged you too tightly as a baby and now you are afraid of boobs! That''s a real example by the way! That was printed in the British Medical Journal in 1958 as an explanation for a man being gay! Some sexologists said the same thing about trans women, but the other way around: they said your Mum hugged you too much as a baby and now you like boobs so much that you want a pair of your very own! In Britain in the 1950s, being gay was a crime and many people convicted of homosexual offences were ordered to undergo conversion practices by the courts. This was done on the NHS. Hundreds of people were sent to see psychotherapists to find the cause of their gayness and get cured. Many of the victims were young, some under the age of 14. And you might be thinking, "Well, it doesn''t sound so bad. I mean it''s just talking, right? Just going to see a therapist?" But no. Survivors of this abuse say it''s not like therapy. You don''t get a chance to express yourself or consider another point of view. It''s interrogation. Victims are judged, humiliated, lectured, sometimes shown graphic imagery of suffering queer people to try and scare them. They''re asked incessant trick questions again and again and again until they agree with whatever the perpetrator says just to get it to stop. Outside of sessions victims will often do anything they can to avoid being sent back, which is of course the point. This is a form of punishment. It is designed to enforce obedience. Another reason why ''therapy'' isn''t the right word! But it quickly became clear that this wasn''t working, and so a more direct method was adopted. Aversion therapy was a form of torture practised by British doctors from the 1960s until at least the 1970s and again, it was done on the NHS. The basic idea was to treat queer people like Pavlov''s dogs, exposing us to ''deviant material'' and then introducing an unpleasant stimulus so that we would learn to associate the two and thereby be "cured." In practice what this meant is that the victim would first be locked up and then if they were gay the doctors would show them gay pornography. If they were trans, they''d tell them to get dressed in their own clothes. And then they''d be electrocuted. And this would go on for as long as the doctors deemed necessary. Another variation involved giving the victim a drug called an emetic, which makes you feel nauseous and vomit. Victims were denied sleep, food, and water, and prevented from cleaning themselves, forced to lie in their own vomit, urine and faeces for days at a time. Often voice recordings making fun of them, recordings made by the doctors and nurses, would be played at the victim on a continuous loop. This torture did not stop anyone from being queer. It did inflict long-term psychological damage on many [unsurprisingly!] and some victims died. The process was designed to be as unpleasant as possible, and when I say designed, I mean that the people doing it said, in print, that that was the point. [Voice Of November Kelly] - In the present studies, the word spoken and the manner in which they were spoken as well as the laughter were designed deliberately to disturb the patients emotionally. By such means a maximal emotional crisis might be attained and subsequent conversion thereby facilitated. It was hoped that the words would recurrently force the patient to think distressing thoughts about human relationships and practices instead of retreating into an inert if disgusting condition. The effects of prolonged sleeplessness and hunger were considered important. It is known that the changing of attitudes and the implantation of new patterns of behaviour is more readily obtained in fatigued and debilitated subjects. - Footnote, historiographical. It''s unknown how many people were sent for aversion therapy on the NHS. Many hundreds, possibly thousands. Most were, we think, cisgender gay men, mostly white and middle class because again, those were the ones deemed fixable, and they could also afford lawyers so they avoided what happened to most people convicted of homosexual offences, which was prison. However, the medical documents from the time period, which are a lot of our sources today, often make no distinction between cis gay men and trans women, and no distinction between trans women and cis straight men who cross dressed. So it''s hard to know who''s who. From survivor testimony we know that some transgender women were electrocuted, and some cis lesbians too, though not as many because lesbian sex wasn''t criminalised. Some bisexual people, and some straight people who were just a bit kinky: rubber fetishists, people who like latex, cross dresses and so on. And whatever side of LGBTQ stuff you come down on now, we can all surely agree it was not good that the police and doctors could decide you were doing sex wrong and hook you up to a car battery! It wasn''t good that they could take you away, or your kids, and interrogate you and force you to explain your complete sexual history on pain of prison because they thought you looked a little bit fruity. Something I''m really keen to hammer home in this video is that tolerating conversion practices makes society worse for everyone. In 1967, gay sex between some men was partially legalised in England and Wales. However, the number of people convicted of homosexual offences and therefore the number of people sent for conversion practices actually went up after legalisation because the law was very narrow, and some police forces, many of whom did not support legalisation, used it as an excuse to crack down on anything they said wasn''t strictly within the bounds of the law. And they did crack down. If you were gay and you kissed somebody on a dance floor, the bar you were in could be raided by police and the owners convicted. If you were gay and you were in a social group like a book club, that could be shut down. If a newspaper or magazine allowed queer people to post personal ads, it could be raid by police and the editors convicted of conspiracy to corrupt public morals. All those things really happened in Britain within my parents'' lifetime, and so a lot more people got sent for the cure. Footnote, warning from history. Public toilets were a favourite site for undercover police operations in the late 1960s. Officers would pose as gay men, solicit sex from members of the public, and arrest them if it seemed like they were saying yes. Some police forces had dedicated officers for doing that full time and some even set up surveillance posts inside public toilets to catch people who they thought might be gay. Most of the time you''d probably be fine, but you''d never know which toilets had a fake wall with a police officer behind who could pop out and arrest you if you didn''t like the way you were dressed. As I write these words, the Labour government are considering a ban on trans people using public toilets and changing rooms. Obviously I''m against segregation, but if you''re on the fence about it or you think that the enforcement of that wouldn''t affect you, remember, Britain had toilet cops within living memory, as late as 1969. Toilet cops in Britain are more recent than the moon landing and most of the Sean Connery Bond films. The result was a campaign of arbitrary terror by police who were empowered to ruin your life, whether you were really queer or not. In his book ''Curing Queers,'' historian Tommy Dickinson interviews survivors and perpetrators of aversion therapy and interestingly, some of the perpetrators falsely claim that their victims consented. And this wasn''t true. The victims themselves say they weren''t told what was going to happen to them; had they known what was going to happen they would not have walked through that door; and many of them were forced to go by the courts. Some victims did self-refer, meaning they went to the doctor and asked to be cured. But of those, many were forced to go by friends or loved ones under threat of being reported to the police. And remember, it''s not like kids were given queer inclusive sex education in schools and had a chance to figure themselves out. Some gay people went all in on straight marriages and only then found out that they were gay when the cost of coming out was already way too high. So how can we explain these false claims of consent? Well, there''s a useful term that we can use here. Conversion culture. It''s analogous to rape culture or drinking culture. A social atmosphere in which the message is put about that queer people should be cured, that there is something wrong with us, and that the people trying to cure us are doing a noble thing even if it doesn''t necessarily work. Conversion culture meant that straight people were more likely to view these abuses as acceptable and queer people were more likely to think that we deserved it. Conversion culture breeds indifference in the hearts of perpetrators and shame and fear and secrecy in the hearts of victims, which again undermined their capacity to say no. But I think what it really comes down to is those two key concepts we''ve already identified: the professionalisation of knowledge and the resulting disconnect between what they thought they were doing and what they were really doing. These people really believed they had a right to control who you slept with, what clothes you wore, and what words you used to describe yourself, and they would - did! - invent any excuse to justify that authority. It was never about helping people, it was always about authority. Now that''s a big claim, and I will support it now. Before Britain started doing aversion therapy there was already evidence showing it was a bad idea. Remember Jennie June, the woman we mentioned earlier who got old timey gender affirming surgery? Well, in 1919 she published a book called ''Autobiography of an Androgne.'' In it, she describes being given electric shocks to cure her and how they hadn''t worked, decades before the NHS even tried it. There were cases from Europe of trans kids, like 16-year-old Mattis Kval, whose psychiatrist wrote in 1954 that Mattis wore a binder and a packer and no amount of psychotherapy could persuade him out of it. Christine Jorgensen made headlines on both sides of the Atlantic in 1952, so people knew as early as that that medical sex change was possible and at least one person had been made happier by just being allowed to do it. Perhaps you''re thinking those are anecdotes, not scientific evidence, but if you want experts, sexologists like Christian Hamburger and Harry Benjamin were giving presentations at conferences in the fifties showing that allowing trans people to change sex made us happier, more functional members of society. In the sixties, there was evidence coming out of Johns Hopkins and UCLA in America showing all the conversion practices they were trying on queer kids weren''t working. Indeed, some trans children were given hormones and surgery at UCLA as teenagers in the 1960s precisely because they had been through conversion and it hadn''t worked. Even more blatantly, in the fifties a sexologist named Kurt Freund did a study on aversion therapy on gay people in Czechoslovakia trying to cure them with drugs that made them vomit and concluded it absolutely didn''t work. We know British doctors read that study because it was published in the UK in 1960 and cited by British aversion therapists. The people inflicting this torture sometimes kept very poor records and didn''t bother following up to find out the results of what they''d done. Similar things happened with intersex kids too: doctors would do those non-consensual surgeries and never follow up, sometimes dismissing former patients who came forward with stories of abuse. Sometimes the data conversion therapists did provide was later disputed. Two guys, Maurice Feldman and Malcolm MacCulloch, claimed in 1967 they''d cured a bunch of people of homosexuality by electrocution. It was only decades later that one of their victims, Pauline Collier, recognised her story and came forward to say the experience just made her depressed. I think the only way we can explain these facts is if we realise conversion practices aren''t about the effect they have on the victim; they''re about reinforcing the authority of the perpetrator. Some of them may construct a fantasy in their minds that the victim has secretly consented or that it''s all for their own good, but people working within any system will invent reasons to justify their authority. Some of the perpetrators of aversion therapy had good intentions. Some of them had bad intentions, but at the end of the day, their job was to control people so all they had to do was turn up to work. You see, this is the kind of objective and analysis that you have to come to Philosophy Tube for! A doctor may *identify* as a good person, but just ''cause you identify as something doesn''t mean that''s what you are! That''s why you have to strap an instrument to his penis and figure out whether he''s lying! Another real thing the NHS used to do! Footnote, ethical. As far as I can find, nobody in the NHS was ever punished for any of this. Some of the survivors of aversion therapy are still alive today and they haven''t been paid compensation or anything. Some of the perpetrators are still alive! At time of writing. Feldman and MacCulloch are still around and they''re not in prison or anything. MacCulloch actually went on to work for the government and became under-secretary in charge of mental health. Another conversion therapist, Michael Gelder, went on to found Oxford University''s psychiatry department. He died in 2018. His obituaries on the Royal College of Physicians'' website and in the Times are absolutely glowing and make no mention of the time he spent electrocuting "transvestites." This system was extractive. It generated value from the victim''s pain and people made careers off it. The fact that nobody was ever punished for any of this throws up some interesting questions about how we should respond when medical systems cause harm, and those questions haven''t gone away. The NHS today has a ''no blame culture'' that still generates a lot of debate. The General Medical Council, that''s the body that decides who''s allowed to be registered as a doctor in the UK and investigates doctors who break the rules, explicitly does not punish anyone. Instead, they try to determine ''fitness to practice.'' And it is possible for a doctor to make an awful mistake, even to kill a patient, and still be found fit to practice if it''s a mistake they''re not likely to make twice. Given the time and resources it takes to train a doctor and the amount of good that they can do in the job, it is arguably in the public interest to have a no blame culture and allow them to continue working wherever possible. On the other hand, a no blame culture does sometimes mean that doctors who do bad things functionally get away with it, and that can undermine public confidence in the profession. This is an area where reasonable people might disagree about what kind of accountability system produces the best outcome. We might also disagree about whether outcome is the right thing to optimise for. There''s an argument that these people did wrong and should be punished consequences be damned. I leave such judgments to you. In the 1960s, the queer community got organised and militant. The Compton''s Cafeteria riot was 1966. Stonewall was 1969. We said no to shame, medical violence, and police violence. We started doing stuff like busting into psychiatric conferences and smashing windows. In the UK, the Gay Liberation Front formed in 1970 and held the UK''s first pride parade in ''72. Despite the name Gay Liberation Front, I feel compelled to point out trans people were there from the start, including my friend Roz, who is one of the last surviving members of the GLF and has been a useful source for this video. Thank you, Roz, for everything. Homosexuality was removed from the Diagnostic and Statistical manual in 1973, so it was no longer considered a mental disorder. Aversion therapy started going out of style as survivors and clinicians spoke out about its cruelty. But conversion practices did not end. The 1970s saw a major backlash against trans healthcare in the USA, led by a coalition of elite clinicians, Catholic extremists, and radical feminists like Janice Raymond. Many gender clinics in the USA were closed. In 1981, Raymond contributed to a report by the US Department of Health calling trans surgery "experimental and controversial," and as a result it was removed from Medicaid and Medicare - in 1981! In the UK, gender clinics for trans people kept operating throughout the seventies, but the frontline response was conversion practices. Only if you made it through that would you maybe be allowed healthcare. Clinicians continued conversion practices on queer children, or kids they thought just might be queer, under the guise of preventing them from growing up as adult homosexual or transsexuals, which they viewed as an undesirable outcome. Making sure so-called sissy boys grew up to be "real men" was a particular focus of this work at UCLA in the sixties and seventies. In 1980, although the diagnosis of homosexuality had been removed from the DSM, a new diagnosis, "gender identity disorder in childhood," was put in to legitimise these conversion practices and reinforce the idea that people''s private lives should remain under the control of clinicians. Although as researcher Karl Bryant has pointed out, placing children under systems of control, surveillance, punishment and humiliation to try and influence their gender identity or sexuality is harmful and wrong regardless of whether they really do turn out to be queer or not. These conversion practices remained mainstream well into the 2000s and in some countries still are, as we''ll see a bit later on. At the same time, non-consensual surgeries on intersex kids continued, sometimes with the explicit goal of making them straight. Those surgeries are still being performed on intersex people in the UK today. In the USA, many of the laws banning surgeries for trans people include loopholes so that conversion via scalpel can still be performed on intersex kids without their consent. We have accounts of conversion practices done on gay people in Britain from the first pride right up to today. In 2003, a survey of British mental health professionals found 17% of respondents had attempted conversion practices on patients and of those patients, 40% were on the NHS. In 2010, the journalist Patrick Strudwick went undercover and found psychotherapists and psychiatrists, working professionals, who claimed to be able to cure him of being gay - in 2010! In 2017, the government''s national LGBT survey said 5% of the queer population have been offered conversion, and of those 19%, almost one in five, were offered it by their healthcare provider. So this is still a problem. And now we''ve come to the present day! [Rock Music Like Ooooooh Strap In We''re Just Starting To Cook] Oh that''s right, the video''s just getting started! I''ve actually done something sneaky: by teaching you the history I''ve taught you all the concepts that you need to understand the present day stuff. Nowadays, most medical organisations in Britain are (on paper at least) against conversion practices for LGBT people. Most have signed this memorandum of understanding which commits them to ending it, and there''ve also been various resolutions by international legal bodies as well. Now what happens on paper isn''t always what happens in real life and intersex people are still fighting very hard to get their needs recognised, but we can at least say that there is some momentum building against it. The majority of the British public support a ban and various governments for the last decade at least have promised to ban it. You''ll remember one of our big questions for today is why hasn''t Britain passed a ban on it yet? And to answer that, we can look at what conversion practices have become today. These days conversion practices are a little bit like the anti-vaccine movement. It''s found around the fringes of legitimate medicine and it can be hard to discern the motivations of individuals or the extent to which they realise the effects of their actions. The thing is, anybody can call themselves a therapist. Anybody can call themselves a psychologist or a life coach. Those are not protected terms. Anybody can self-publish a book or make a documentary. Anybody can charge people £400 an hour for sessions on Zoom. And of course anybody can post any old thing on God''s own internet dot com! You can post all day about how the mood is made of f*****g cheese. You can do it because you want attention or money or for political reasons or because you sincerely believe in your heart of hearts that Neil Armstrong to