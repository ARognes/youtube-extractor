icit lie. Some survivors in the US say they believed they could get a referral for trans care by going through this process and would not have consented had they known there was no chance of that happening. And whatever you think the right approach is for trans kids'' healthcare, we can all surely agree it''s not okay to trick them and take their parents'' money. Whether the individual perpetrator sets out to deceive or not though, Gender Exploratory Therapy as a model of care entails the idea that being queer is a developmental problem: some external cause has influenced the victim in an untoward manner and now their private life must be turned over to the authority of a professional. It is therefore inherently degrading, discriminatory, and denies the victim their autonomy. For those reasons, in my opinion, Gender Exploratory Therapy is a form of conversion practices and organisations like the World Professional Association of Transgender Health are correct to describe it as such. - The denial of gender affirming treatment under the guise of exploratory therapy has caused enormous harm to the transgender and gender diverse community and is tantamount to conversion or reparative therapy under another name. - Despite all evidence to the contrary, contemporary conversion therapists still insist that product works. In the fifties and sixties, they said sissy boys would all grow out of it if you just punish them in the right way. In the nineties, they said being gay was a phase and that if you affirm gay people, it''ll lead to the behaviour persisting. Nowadays, they insist trans kids will grow out of it if you just don''t let them be queer, "don''t let them decide for themselves!" "People''s private lives must remain under our authority!" In the noughties, ex-gay people played a key role in legitimising conversion practices. They''d stand up and say, "Well, I used to be gay, but I got cured." The ex-gay movement took a big hit in 2013 when the founders of Exodus International, one of the big dogs in the space publicly admitted that they were still gay and it had all been a sham. Ex-gays aren''t quite as prominent these days, but some of them are still at it. Caelan Conrad just did a video exposing a guy who claims to have been cured of homosexuality with the power of prayer, and he can teach you how to do it too! Just pay him several hundred dollars! These days detransitioners occupy a similar role as ex gays once did. Prominent detransitioners get flown across countries to testify in court cases and legislatures to cast doubt on real healthcare, but they''re only allowed to play that role as long as they''re useful. Like Exodus, some detransitioners have started publicly disavowing the movement they were once involved with, saying conversion didn''t work and they were being exploited. Footnote, Medical. A small number of people who change sex do end up changing back, most of the time because they''re forced to. Most of them end up retransitioning later on, but some of them don''t. They just go back to the way they were. And that''s not some awful tragedy of regret. I know people who''ve done that who are just like, "Yeah, you know, life took me on a journey!" The detransitioners that I''ve spoken to and read tend to be upset when their stories are hijacked to sell pseudoscience. The things that they need to improve their lives are things like being able to change their names and legal sex easily so that they can change back; quick access to stuff like hormones and reconstructive surgeries so they can do the same thing; and less stigma. And that''s all the same stuff that trans people need. Conversion practices don''t help anyone, but conversion therapists will happily platform detransitioners if they''re useful because their stories about being ''irreversibly damaged'' are a great way to scare politicians and parents. So who are the groups behind all this? Let''s meet the team, shall we? This is the internet so I need to preface this by saying anyone who harasses these people in any way sucks and is wrong. Seriously, do not do that. The Alliance for Therapeutic Choice and Scientific Integrity is a pro-con conversion therapy organisation co-founded by Joseph Nicolosi, author of ''A Parent''s Guide to Preventing Homosexuality.'' ATCSI''s Board of directors features Mike Davidson, who works for the Core Issues Trust and the International Federation for Therapeutic and Counselling Choice, one of whose trustees is Andrea Williams, chief Executive of Christian Concern and the Christian Legal Centre, and one of whose members is Andre Van Mol, who is also a member of the American College of Paediatricians, whose members have included Michael Laidlaw, who has worked with both ATCSI and the IFTCC. Laidlaw and Van Mol were part of a group that also included a guy named William Malone, who worked with Republican law makers in South Dakota to draft legislation banning trans healthcare. In 2025, Laidlaw and Van Mol teamed up again to submit an amicus brief to the American Supreme Court to argue bans on conversion therapy should be overturned, a brief that also came from Maria Keffler, founders of Partners for Ethical Care and Advocates Protecting Children and author of ''Desist Detrans Detox,'' a do-it-yourself conversion therapy manual which contains a number of parallels to ''a parent''s guide.'' Laidlaw was also in the now defunct Paediatric and Adolescent Gender Dysphoria Working Group, along with Kenneth Zucker, J.Michael Bailey, Ray Blanchard, a guy named Roberto D''Angelo, and Sasha Ayay and Lisa Marchiano, founder of Youth Trans Critical Professionals, both of whom have worked with Genspect, a group founded by Stella O''Malley, whose advisory members include Az Hakeem, Lisa Littman, Roberto D''Angelo again, Keira Bell, and Abigail Schrier, author of ''Irreversible Damage,'' which promotes the work of Zucker, Blanchard, and Littman. Hakeem and Bell are both advisory members of Campaign Group Sex