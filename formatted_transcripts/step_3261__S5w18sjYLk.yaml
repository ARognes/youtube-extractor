th trans kids there himself. He resigned in 2019 for similar reasons. They managed to get their concerns picked up by the British media, including some reporters at the BBC, and this idea that jds wasn''t rigorous enough really took hold. In 2019, Susan Evans sued GIDS. The suit claimed that healthcare for trans kids was (sing along if you know the words!) "experimental." The case was joined by Keira Bell and became Bell v Tavistock. Their lawyer was a man named Paul Conrathe, who''s brought a number of cases on behalf of Christian clients arguing against the right of women and girls to get abortions. The suit argued that trans kids couldn''t consent to medical transition, which would have opened the door to claiming children generally can''t consent to birth control and abortions. There''s the religious angle. One of the expert witnesses they called was a man named Paul Hruz, who is a member of the American College [don''t acknowledge] of Paediatricians and has worked with SEGM. Initially they won and as a result, GIDS immediately stopped referring children to the doctors who were prescribing their medicine. Happily, the case was overturned on appeal, but GIDS did not resume service. Instead, we got... [Bells Tolling, Crows Cawing] The Cass Review was an investigation into the state of trans kids healthcare in England, focusing particularly on the ones who were seen at GIDS. It took four years, cost 3 million pounds and was written by zero trans people. Hilary Cass, the woman in charge, had no prior experience in gender medicine and the final report wasn''t peer reviewed before its publication in 2024. That''s certainly not a great start, but it''s actually not all bad. Cass spoke to a lot of people, including current patients and their families, current and former clinicians, a number of trans rights groups, [some other people we''ll get to!] and the review did find some things that are true and interesting. We''ll talk about the positives first and then... we''ll get to the other stuff! The Cass review found many of the kids presenting to GIDS had other mental health needs. It is true that trans people as a group are more likely to have concurrent mental health problems than cis people, and there isn''t really one reason for that. It could be the stress of being discriminated against, generally high levels of poverty, or the fact that by definition people being referred to a gender identity clinic haven''t started transitioning yet, and so they''re still dealing with the stress of being stuck as their assigned sex. It could also be something called collider stratification bias. Basically, if you''re already going to see a psychiatrist because you''re trans and you need their permission to transition, then any mental health problems that you happen to also have are more likely to get noticed versus somebody else who also has mental health problems but is just walking round outside. The Cass Review found the number of kids presenting to GIDS with concurrent mental health problems was going up. That''s definitely interesting. We have gotten better at diagnosing things like ADHD and anxiety, and the definition of autism was made broader in the last few years thanks to better understanding, so that could be contributing there. The number of kids generally with mental health problems is also going up, so it''s not that surprising to see it happening in trans kids too. Also, the UK is quite a hostile place for trans people, so that could be a factor in explaining things like a rise in depression. The Cass Review found many of the kids referred to GIDS had problems at home. That''s also true. Other investigations have found the same thing. Again, there''s not likely to be one reason. It could be a bit of collider stratification bias. We also do know that trans kids are at greater risk than cis kids of abuse, especially from family members who don''t accept them. The lack of acceptance could contribute to stress in a marriage which could be contributing to things like divorce. So these findings are pretty grim, but not entirely surprising and might even explain some of the concurrent mental health problems that Cass also found. The Cass Review found the majority of kids referred to GIDS, particularly in recent years, were assigned female at birth. The review didn''t manage to find an explanation for that one, but it is interesting. Other studies suggest that trans women like me are more likely to stay in the closet for longer than trans men perhaps because when you''re assigned male at birth, there are some pretty strong social penalties to active feminine. So we would actually expect to see gender clinics for kids mainly treating kids who are assigned female at birth. Hopefully as societal attitudes towards trans women and women generally improve, we''ll see those proportions start to even out. I''m sure societal attitudes towards trans women are progressing in the right direction. I haven''t checked the news since 2014, but I''m sure it''s FINE. The Cass Review found GIDS was bad following up on patients and finding out what had happened to them. Aha! We know why that is, don''t we? We remember that was a problem with experiments on intersex kids and with aversion therapy and with adult gender identity clinics too. We might say it''s a pretty strong indicator that these clinics weren''t really about medical science so much as the professionalisation of knowledge, authority, and controlling trans people. Cass doesn''t go so far, obviously, but, good to know! The Cass Review found regret and detransition among trans kids in the UK is extremely rare. That''s fantastic news! There was a prominent myth in the UK at the time that kids were being rushed into transition, that GIDS were giving out puberty blockers and hormones like Skittles, but the Cass Review showed that never happened. Most were waiting years to be seen and 78% of them got no medication at all. Myth busted! In fact, even amongst the tiny minority who got puberty blockers, they were often waiting so long for them that they were already well into puberty by the time they started. GIDS seems to have had a rigid model of blockers first and then maybe hormones, and that''s what seems to have caused a few issues. Spending a long time on blockers with no sex hormones in their bodies put kids at risk of developing further problems. According to journalist Sasha Baker at least one kid developed osteoporosis, a nasty problem with her bones, because she spent so long on blockers just waiting for permission to get hormones. If GIDS had allowed the kids who were sure they wanted to change sex to just go straight to hormones then some of the downsides of blockers could have been avoided. But for some kids that might not have been the right choice. Some of them may not have been sure, they may have wanted to delay puberty until they were certain what kind of puberty they wanted, and in those cases, blockers would''ve been an option that buys time. One that, like a lot of medical treatments, comes with trade-offs. Again, it''s the rigid controlling model that seems to have been the problem. And if you think about it, this really should have been a bigger media moment than it was. The dominant narrative that had fueled the panic around trans kids was proven wrong by Cass. If anything, the review found these kids were being undertreated and too slowly! You''d think that would matter. And last but not least, the Cass Review found that in some areas the scientific evidence for trans healthcare is not the strongest. That''s also sometimes true. Trans healthcare is underfunded and understudied. It''s hard to design big clinical trials on a very small group of people who all have good reasons not to trust the doctor! Trans medicine isn''t the only area of medicine we''d like to study more, a lot of paediatric medicine''s like that actually, and good medicine is based not only on lab evidence but also clinical experience and the values of patients. But the Cass Review isn''t wrong to point that out. And so, to address the lack of strong evidence Cass commissioned a series of systematic reviews which looked at a bunch of studies and rated them from high quality to low. In this context, a low quality study doesn''t necessarily mean that the data is useless, just that if we can get better lab evidence, we''d like to. And this is where things start to go wrong. None of those reviews were designed or run by trans people, and that doesn''t help the perception that this is about the professionalisation of knowledge and the defending of authority. They also ignored all foreign language studies, dismissed international best practise like guidelines from the World Professional Association of Trans Health, and ignored all studies written after 2022. Hmm. Very alarmingly. there are a few moments where the final Cass report seriously misrepresents the evidence its own systematic reviews found. For example, they looked at the evidence on giving trans kids hormones and say it''s "inconsistent," but actually the evidence was consistent-ly positive with the majority of studies they looked at showing good outcomes for trans kids mental health. The final review came out strongly against prescribing hormones under 18, saying there needed to be "strong clinical rationale" for doing so, a recommendation that its own evidence seems to contradict. The Cass Review said giving trans kids therapy instead of allowing them to transition might be helpful. And this is already weird given the history that we''ve looked at. We remember 16-year-old Mattis Kval, for instance. We also remember that''s how Gender Exploratory Therapy can be used to trick people. So immediately eyebrows are raised, but let''s hear them out. They did another systematic review looking at the evidence for giving trans kids therapy instead of transition. In all the other systematic reviews studies classified as low quality were excluded from discussion. But not this one. In this specific systematic review, low quality studies were admitted and allowed to shape the final conclusion. And so the final Cass Review recommends giving trans kids therapy as a frontline response instead of letting them just transition, when according to its own review the evidence doesn''t support that! And I''m afraid it gets worse. At one point the review says puberty blockers may have long-term neurophysiological consequences, including preventing brain maturation, impacting patient''s ability to weigh risks and make decisions. That is a bombshell claim! Considering puberty blockers have been given to trans people since the 1980s you''d think those negative consequences would''ve shown up by now? So I wonder what her evidence for this is? Is something going wrong with those now 40-year-old trans people who were given blockers all those decades ago? If you follow the citation, it takes you to one study done on mice. The mice had their gonads removed, which isn''t giving them blockers and isn''t what blockers do and isn''t comparable to the timeline in which Cass found kids were getting blockers, and all the mice were female, and there were only 15 of them including the control group. I''m sure I don''t need to explain why it''s not good science to make massive claims about human brain maturation based on one study done on 15 mice of one sex who weren''t even given the drug you are talking about! Interestingly, one of the authors of the systematic review on therapy was a woman named Trilby Langton, who is a member of Explore Consultation. One of the people on the review''s advisory board was Rittakerttu Kaltiala, a name we remember from earlier. She''s worked with both CAN-SG and SEGM, and Kaltiala and Van Mol worked with Patrick Hunter from the Catholic Medical Association to influence the Florida government to ban trans kids healthcare. Kaltiala has claimed in the past that kids may identify as trans because of social