e themselves innocuous sounding names. For example, the American College of Paediatricians is a right wing religious pressure group. Not to be confused with the American Academy of Paediatrics, a mainstream association for doctors. You can remember the difference with this simple rhyme: American Academy? Good for your family. American College? Don''t acknowledge! Some groups have a more medical bent, some are political, some are religious. My goal with that little snapshot was to show how the various groups can overlap, but very important to note: I cannot comment on the motivations of individuals, many of whom reject the label conversion therapist or deny that they promote conversion practices and many of whom might be shocked to find out who they''re just a couple of handshakes away from. Some of the people in the medical-adjacent orgs used to work in mainstream institutions: guys like Zucker, Bailey, and Blanchard - washed, chopped uncs whose work has since faced public criticism or fallen out of fashion. Some like Az Hakeem and Rittarkerttu Kaltiala are working doctors. Standard YouTube procedure would be to lump all of these people together as ''grifters.'' But the word ''grifter'' implies intent to deceive, which (in addition to being potentially defamatory) certainly isn''t provable and I think genuinely probably isn''t true, at least not in every case. Some of these people probably believe that what they''re doing in defending is good science and good politics, and therefore they can fairly say that they should get some hearing, even if it''s just in spaces reserved for fringe ideas. Some of them might be engaged in sincere but motivated reasoning. Some of them might not have realised who''s around them and how that makes them look. And some of them might just be grifters! It''s impossible to tell, which again is why I''m not attacking individuals. It''s the lack of clarity that can pose a problem for mainstream medical institutions since even the appearance of ideological or political influence or an association with unethical practices, accurate or not, might undermine public confidence. It might undermine public confidence in the NHS if, say, a psychiatry conference in 2022 had to be cancelled because several of the book speakers were members of Genspect. It might undermine public confidence if it turned out that, say, Explore Consultation had been hired to deliver training to NHS staff, training that cited Genspect. It might undermine public confidence if it turned out that, for example, the Clinical Advisory Network for Sex and Gender booked the headquarters of the Royal College of GPs as a conference location, and the RRCGP allowed that conference to go ahead and then peaceful protesters outside were attacked by police. Footnote, personal. I was there that day. I saw the police pepper spray peaceful protesters outside the Royal College of GPs. It''s a disgrace. Most of all, it might undermine public confidence in the NHS and indeed the British government if it turned out that some of these groups were directly involved in writing a flagship document that is right now being used to guide national healthcare policy. [Ominous Synthesizers] Oh, we will get to that! Yeah, sorry to get a little bit dark with it, but one of the things I found in my research is some of these groups have a disturbing amount of influence in Britain specifically. Let''s talk about two: Bayswater and Sex Matters. The Bayswater Support Group are based in Britain, and they bill themselves as a support group for parents of trans kids and young adults. However, in 2024, one of their private Discord servers was exposed by reporters from the Bureau of Investigative Journalism. In that Discord, Bayswater members discuss attempts they''ve allegedly made at doing conversion practices on their own children, both at home and with professional help. Some members post about destroying their children''s clothes, phones, medicine, and other possessions to try and force them to stop being trans. Some of them post about pulling kids out of school and extracurricular activities, isolating them from their friends trying to shut down school LGBTQ clubs, even preventing their own children from accessing rape crisis services, Childline, and doctor''s appointments because those things would let their kids be trans. If they are really doing that, that could meet the legal threshold for child abuse according to TBIJ and one expert they spoke to. One of the reporters who investigated them, Sasha Baker, described Bayswater as quote, "a conversion therapy advocacy group that actively engages in child abuse." You would hope people like that wouldn''t be anywhere near British politics. And you''d be wrong. Health Secretary Wes Streeting invited Bayswater to consult on policy proposals for children''s healthcare last year, after that report exposing them. Journalists reached out to Streeting''s Department of Health and asked, Hey, why are you speaking with these people? The government said that they would avoid consulting people who quote, "promote unsafe practices" in future. Six months later, they consulted with Bayswater again! In my opinion, that''s very worrying and potentially a scandal for the government. Moving on now to Sex Matters, they''re a campaign group founded in 2021 who campaign to have trans people''s rights in the UK restricted: they oppose our access to the correct changing rooms and toilets and say we shouldn''t be allowed to change the sex on our legal documents, things which we have the right to do. [At time of recording.] The other things Sex Matters do is promote conversion practices. That is my opinion and I will support it now. In October 2022, Sex Matters published this three part document titled ''Teenagers and Gender Identity, the Evidence Base.'' Their Contributors and Citations include Stella O''Malley, Bailey, Blanchard, Littman Marchiano, Sasha Ayad, Abigail Shrier, the American College [don''t acknowledge] of Paediatricians, Kenneth Zucker, and Marcus and Susan Evans. That last bit is slightly odd. Before this document was published, the Evanses were supposed to travel to Poland for a conference and the Polish Sexological Society put out a public statement of condemnation calling their work illegitimate, saying it was based only on speculations, raised serious factual and ethical objections, and called on the society''s members not to support conversion practices. Last guy who got owned that hard by a pole was Captain Scott! I personally wouldn''t want to be associated with the evidence after that, but let''s focus on what Sex Matters actually say. They say kids can identify as trans because of an external cause, like a desire for attention, the desire to punish a parent, quote "social contagion" or hidden trauma. That last one comes directly from Marcus Evans. We recall, conversion therapists of yesteryear made similar claims. They also say kids might identify as trans because of "trans influencer material online." I assume my hemlock is in the post? They say in part two that physical transition causes harm to otherwise healthy bodies. As a blanket statement, this is false: transition can be very healthy for people. I''m living proof of that, to name just one example. Also in part two, they say allowing trans kids to transition is quote "experimental." We''ve seen already from our look at history that''s false too. It''s been done for decades. We recall too, anti-trans campaigners in the 1980s also said trans healthcare was experimental and it was decades old even by then. These claims may be false, but they do tell us something important: Sex Matters'' opinion is that not transitioning is a preferable outcome for trans kids and young people. I think that''s a fair characterization of their position based on these documents. And so in part three they advise parents on how to make sure their child''s school doesn''t let them socially transition, I.e. doesn''t