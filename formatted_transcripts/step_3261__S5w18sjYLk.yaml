e Office of National Statistics, the Department of Health, and the Equality and Human Rights Commission. In that last case, the former chair of the EHRC, Kishwer Falkner, personally corresponded with Sex Matters and other anti-trans groups, held private meetings with them, and then the wording on official documents was changed to meet their policy positions. Sex Matters were allowed to become a registered charity in 2024, *after* this document was published, and that means they can get taxpayer money. They are frequently platformed in the British media, including on the BBC, and I have never seen a mainstream journalist challenge them on any of this, which is why I felt it was in the public interest to bring it up. To sum up this section, contemporary conversion therapists are unfortunately pretty good at building credibility. As in previous decades it''s fundamentally about authority, and so wherever there are small-C conservative interests defending their authority, be that in politics, legacy media, medicine, or the nuclear family, conversion therapists can find allies, not all of whom necessarily believe the same things, but who can wind up helping the project if given the right incentives. But the good news is there is actually something that we can do about all of this! So if you''d like to follow me over here... [Rock Music Like Awww Yeah Here We Go Let''s Kick Some Ass] On this board, we can create a list of features that a meaningful ban on conversion practices needs to have. Remember, it''s still legal in the UK so this is gonna be our Christmas list. If you work in the charity sector, politics or law, this section of the video is especially for you! So the first thing I''m gonna write on our Christmas list is... [Rock Music, Engines Revving] a denial of charity, company, or nonprofit status to any organisation that promotes or practices conversion therapy with money set aside for a review of existing registers so ones that do can be removed. A ban on advertising conversion practices or any materials that purport to teach it. A ban on profiting from conversion practices, and a ban on any organisation that promotes or practices conversion therapy from receiving public money. And needless to say, strong internal policies so any organisation promoting or practising it doesn''t get within a million miles of any government department. Some of that stuff could actually be done locally. If you work for  an NHS Trust or a university or a local government, you could create policies that ban conversion groups from using your buildings for meetings and you could use those to get the ball rolling. We can also chuck in some stuff recommended by people in other countries that have already banned it. A national reporting hotline so that if it happens to you or someone you know, everybody knows who to call and everybody knows that the people on the other end of that line definitely have training in how to deal with it. Facil... facilitating? [Laughing] A ban on taking people abroad for the purposes of conversion practices and a ban on facilitating conversion practices. That''s to cover things like putting a kid on a plane to a foreign country and sending them to a conversion camp, or putting them on a Zoom call to a foreign country for the same reason. A public inquiry into historical conversion abuses. It would be good to know how common things like aversion therapy and other forms of NHS conversion abuse were so that we can start putting that right. The ban should also include intersex people. In order to do that, we''re probably gonna need an inquiry into intersex people''s experiences in the healthcare system. The research I''ve read highlights that once again, there''s a real lack of follow-up data. We still don''t know how prevalent things like unnecessary surgeries on infants are or what the effects have been, and we could really use some accountability and transparency on that so that we can create clear policy. Resources for survivors. People who''ve gone through conversion practices sometimes need trauma counselling or housing if they''ve been sent it by relatives that they now can''t go back to. So it would be good to have some budget set aside for that. Training for public sector workers like police officers, teachers, and social services so they can recognise the signs that someone is being put through conversion practices. If it happened to you or your kid, you''d want somebody looking out for them. Kids being taught in schools about consent, autonomy and how to recognise if someone is doing conversion practices on them. We could do that as part of existing [Laughing] existing relationships and sex education. [Crew Laughing] Hairspray! Bloopers! Boop! Thank you! Some of these ones might sound familiar to you if you know anything about how public services handle domestic abuse, and that''s no coincidence. Something campaigners against conversion practices have highlighted is we can model a ban on existing laws against other forms of abuse. And what I mean by that is this: the Serious Crime Act of 2015 created the offence of coercive control, which is the criminal offence in many cases of domestic abuse. The legal guidelines around coercive control recognise that the harm of domestic abuse doesn''t just happen in a single moment, like a punch or a slap, but is rather spread out over time. The guidelines also take into account the relationship and power imbalance between the victim and the perpetrator. If the perpetrator controls the victim''s access to finances, shelter, or healthcare, that''s really important to know. The guidelines also stress the importance of context. Words that might seem innocuous from the outside can in the context of an abusive relationship take on a very different mean. For example, a text that says ''What time will dinner be ready?'' in an ordinary relationship might be fine, but in an abusive relationship could be seen as a threat. And those are all really good lessons to apply to a ban on conversion practices. How do we tell the difference between a legit therapy session that just went a bit wrong and conversion? Well, we already have laws on the books that can help us navigate those kinds of murky areas. Coercive control laws also recognise that the consent of the victim is not an excuse because the crime actually has as its aim undermining the victim''s ability to consent. It''s a sad but true fact that in many cases of domestic abuse, people say, "Well, I deserved it," or "I started it, I know they love me really. It''s okay," because the abuse undermines your self-esteem so much tou come to believe that''s how you deserve to be treated. And if you find that hard to imagine, I myself was in an abusive relationship years ago and at the time I was so in it that had you asked me, I would''ve said I deserved it. It was only later when people said to me no one deserves to be treated that way, and when I found someone else who treated me with real love, that I began to realise the truth. So features of a ban should also include... no loophole for consent! You cannot consent to conversion practices any more than you can consent to domestic abuse. Footnote, legal. Article 3 of the European Convention on Human Rights, to which Britain is committed [at time of recording] says that states have a positive duty to protect citizens from cruel, inhumane or degrading treatment. Given that conversion practices come under that, there is an argument to be made that Britain *must* ban them even if it were possible to consent. The arguments of high-flying lawyers may not be persuasive to a general audience, but if you work in this sector professionally, that information might be helpful to you. Where''s my little co-star gone? Now let''s talk about religion. Within every major religion there are leaders who condemn conversion practices and want to see it banned. Nevertheless, it does still happen. Over the last few years, there have been exposes by undercover journalists of things like exorcisms and other forms of religious conversion abuse. But it''s very important to remember there is no clear distinction between religious conversion practices and the pseudoscientific kind. Both rely on the false idea that there is some external cause of queerness that needs to be dealt with. Be it a demon, or a fictional trauma, a bad relationship with a parent, you''re always on TikTok, your Mum hugged you the wrong amount, whatever. Once the abuse begins, if the victim expresses a desire to stop, this can be interpreted as the voice of the external cause. You may say you''re suffering, but that''s just the demon talking. That''s your cult identity. That''s a trauma response. Your autism gives you black and white thinking on this that makes it hard for you to see how what we''re doing is really good for you! Et cetera. In this way, both religious and pseudoscientific conversion practices undermine the victim''s ability to trust their own state of mind and therefore bring them further under the abuser''s control. Both religious and pseudoscientific conversion practices portray the abuse as being for the victim''s own good because it saves some part of them that would otherwise be lost, whether that''s their immortal soul, their true identity, their ''repressed heterosexuality'' or whatever. Conveniently, the thing being saved is often undetectable to anyone but the abuser. And both rely on overly negative stereotypes about queer life saying that if you don''t get cured, you''ll go to hell or you''ll be doomed to a life of crime, or drug abuse, or lifelong medication, "control by big pharma," "irreversible damage," a life that is not worth living and therefore fine for the abuser to deny you. Whether the actual abuse involves exorcism, hypnosis, prayer, Jungian psychoanalysis, or anything else, they are isomorphic: they have the same shape. They''re often performed simultaneously and in some cases by the exact same people. This can be seen very clearly in accounts from both survivors and undercover journalists. We can also see it by looking at popular conversion therapy manuals like ''Desist Drans Detox,'' which reads like a guide to performing exorcisms. Keffler says that trans kids are under the control of a cult identity, that when they protest at how they''re being treated this is merely the voice of the cult that needs to be ignored. You could find and replace cult for demon and it would read the exact same because it is the same. Sometimes people say that a ban on conversion practices should include a loophole for religion. After all, the government shouldn''t be interfering in matters of faith, right? Well, as we''ve just seen, if you include that loophole, it''s not gonna work ''cause they''re the same thing. Also, that''s quite a sneaky sleight of hand ''cause that''s not how the law works. You don''t get a pass on doing something illegal just ''cause you do it in church. Restrictions on hate speech and inciting racial hatred don''t include exemptions for preachers; bans on harassing people outside abortion clinics apply to everyone equally. The right to manifest one''s religion is qualified by other people''s right to be protected against harm. Conversion practices are definitely harmful ergo people have a right to be protected against them. As the old adage goes, "your right to swing, your fist ends where the tip of my nose begins." At the same time, you can see how this produces tension, right? We can imagine the objections. "Oh, you wanna make it illegal to pray now?" "You wanna make it illegal to study the Bible?" It would take a politician of unusual courage to say, "Yep, if those things are part of trying to change somebody''s gender identity, gender expression, or sexual orientation, they are harmful in that context and should be illegal in that context!" Most people manage to practice their faith fine without doing those things. So you can believe whatever you like, but you do not have the authority to interfere in other people''s private lives. Now there''s one more thing that I''m gonna put on the board here. If you''ve been paying attention so far, you will already have noticed there is no difference between anti-gay conversion practices and anti-trans ones. There never was historically: sex and sexuality used to be one concept; when homosexuality was removed from the DSM they put gender identity disorder in children in so they could continue do the same thing. And there still isn''t a distinction. Allow me to quote from Joseph Nicolosi''s book, ''A Parent''s Guide to Preventing Homosexuality,'' 2017 edition: [Voice Of Caelan Conrad] - Homosexuality is rooted in a same-sex attachment problem that leaves the boy alienated from his masculine nature. - Note how the problem is you aren''t living your gendered nature correctly. If you were a real man, you''d be attracted to women. If you were a real woman, you''d be attracted to men. So there is no difference either in theory or practice between anti-trans conversion efforts and anti-gay ones. They are both about authority. They''re about making you do what the conversion therapist wants based on the way that you were born. So I''m gonna write on our Christmas list here ''Must be trans inclusive.'' This is a really important one because a lot of the groups we''ve encountered so far really don''t want this to happen. They''ll say that a trans inclusive ban is just a way to silence heterodox doctors. It''s just a way of keeping people under the control of big pharma! The cheesemongers are taking over NASA! But this is a political tactic to delay a real ban. A nice trans-inclusive ban protects everybody and it''s much harder to get around. And there we have it! Conversion practices are a real problem, but this is how we can make a start in fixing it. Footnote, abolitionist. Would a criminal ban on conversion practices really help all that much? I mean, what does that mean? Giving more resources to the justice system, a system that overwhelmingly harms working class people, queer people than people of colour. Is that really what we want to do? Do we really think they''re gonna help us? I mean, isn''t there a risk here that whatever government manages to pass a ban ends up using it for good PR but doesn''t really help anyone? On a broader point, we''re talking here about something that affects a minority of a minority. If we really wanna help working class queer people, kids living in poverty, and kids being abused, the people most at risk here, would we be better off putting our energy towards, say, housing, so that they have somewhere to go to get away from it? Mightn''t it be a better idea to, instead of giving more money to cops and lawyers, invest in things like mental health services, proper healthcare, proper education, you know, bread and butter stuff? I think that''s a fair criticism. You''ll have noticed throughout this video I''ve tried to make a case for why everyone should care about this stuff. Conversion practices do make society worse for everyone. They do breed large scale corruption and dysfunction and undermine our public institutions. I''ve deliberately made our wishlist ambitious so that fulfilling it would have impacts that we can all feel. But there is a question hanging over this of how we make queer liberation an appealing part of a populist working class politics. If I had a definitive answer to that, I''d be a politician instead of an actress. But now that we''re at the end of this chapter, I did wanna just flag it up. Well, it looks like we''ve reached the end of this video! Don''t check the runtime! Don''t remember where we started with the broken glass and the graffiti. Surely we''ve covered everything by now? Surely things aren''t about to get even f*****g worse! [Military Music, Bombs Dropping, Air Raid Sirens] Just as a reminder, our two overarching questions are why hasn''t Britain banned conversion practices yet, and why was Health Secretary Wes Streeting''s window smashed? Let''s remind ourselves of the statement issued by Bash Back, the window breakers [Voice Of Matthew Schwarz] - Streeting, along with NHS England, the EHRC and Hilary Cass have paved the way for state mandated conversion therapy - Wes Streeting is the Health Secretary; the EHRC, we mentioned them, They were the ones holding meetings with Sex Matters. How do NHS England fit in here and who is Hilary Cass? To explain this, I need to give some background on the state of trans healthcare in the UK. Now fair warning, this is a subject on which I''m biassed. I made a whole video about my experiences with the NHS, which you can watch if you like. It''s a subject close to my heart, but I will try to be as calm and dispassionate as possible. It''s f*****g c*****g sh*t is what it is! Sorry. Here''s the short version! We learned back at the start that from the early 1900 onwards, queer people''s interactions with the medical establishment were governed by this ideology which said that our private lives should be controlled by professionals. Our own accounts of who we are and what we want couldn''t be trusted. We had to do what the doctors told us. And from the early 1970s onwards, LGB people managed to get out from under the thumb just a little bit thanks to protest and activism. Well, in the 1990s trans and intersex people started doing what gay people had done in the seventies: gate crashing, psychiatric conferences, smashing windows and demanding an end to abuse. And this produced some positive changes, at least on paper. Some medical organisations started a slow roll towards depathologization, that is, recognising that being trans isn''t a mental illness and we should be allowed to change sex if we want to. The UK largely ignored all that. The NHS pays lip service to the idea that being trans is not a mental illness, but in practise they still treat us as if it was, so in the UK today you still need permission to transition. Permission starts with a diagnosis of ''gender dysphoria'' or ''gender incongruence,'' which you have to get from a mental health professional at a segregated gender identity clinic separate from the rest of the healthcare system. In my opinion, that diagnosis is inherently degrading because it means that our desire to change sex counts for nothing. They literally call it endorsement. You have to be endorsed by someone else to do what you want with your body. Cis people can get the exact same medicine without going through all of that so the system is also inherently discriminatory. In practical terms, it can be very difficult to get permission. It often requires multiple appointments, which can take years, and as I myself found, everyone who stands between you and permission, everyone from the receptionist to your GP, has the power to kick you out. If you get to see a mental health professional at one of those clinics who can give you permission to transition, they have a lot of power over you and they can subject you to all kinds of humiliating interrogations. Before I could be endorsed, I had to explain to a stranger my complete sexual history and the details of how I masturbate. There was absolutely no need to put me through that, but this person could refuse me permission, so I couldn''t say no. Hmm, this is all sounding a little bit familiar, isn''t it? As you can imagine, this system is very inefficient. It costs the NHS a lot of money, tens of millions of pounds, because all the staff at those segregated clinics have to be paid. It also creates a massive bottleneck in the system because there''s not that many clinics which produces long waiting lists. If you''re lucky, you''ll be waiting a year or two for a first appointment. Over half the gender identity clinics in the UK have waiting lists over a decade long, and for one, Sandyford in Glasgow, if you are referred today you will be waiting 224 years. I should tell you that the NHS disputes those figures, but even their most conservative estimates are measured in years and decades. Again though, and it is important to underline this point, even if there were clinics handing out permission on every street corner and the waiting time was five minutes, this system would still be inherently degrading and discriminatory. This is oestrogen. My Mum can get this from her gp. If I want the exact same medicine I have to go to a segregated gender identity clinic and beg permission from a mental health professional to be endorsed. I am a little bit biased on this issue, but as a human being I find that utterly beneath my dignity. All of this produces a lot of what the NHS calls downstream costs. That is mental health issues, substance abuse problems, even suicide attempts that wind up costing the taxpayer more than if they just let us transition without permission. Not that we should need to be cost effective to have self-determination, but if you insist on viewing this issue economically, Ebenezer Scrooge himself would recognise the savings that might be made with a little humanity! And the situation has been getting worse for a long time, despite the NHS spending more money and employing more staff over the last few years. Exactly how bad it is is actually hard to say because these segregated clinics are also very bad at gathering follow up data. Hmm! Does that sound familiar? Even if you get permission, some GPs openly refuse to give trans people healthcare. They sometimes use the excuse of not being competent, but this can strain credulity. There have been GPs who suddenly decide they aren''t competent to deliver healthcare they''ve been delivering for years, the same healthcare they give to cis people no problem. Sidebar, they''ve recently started doing the same thing to people with ADHD: refusing to give them healthcare and leaving them stuck on years long waiting lists. As a result, many trans people in the UK buy hormones on the internet and change sex without permission. Hmm. Does that sound familiar? There have been multiple requests for years by the trans community to switch to an informed consent system, one where we wouldn''t need permission to transition. That would be faster, cheaper, and less degrading. Other countries already do it. If we want to see a mental health professional as well then we should of course be allowed to, but it shouldn''t be a hoop that we have to jump through in order to get permission to transition. There is evidence that informed consent systems are correlated with higher patient satisfaction, that a gatekeeping permission-based system is harmful, and does nothing to reduce regret rates, but the NHS has for years ignored all of that. As far as I can find nobody in charge of this system is now or has ever been trans. We have never been allowed to run the system that controls our lives. Every internal review, policy document, and action plan for improvement that has ever been written about this system was written by cis people. This henhouse is run by the foxes! And people have died in this system. This is the coroner''s report into the death of Alice Litman. She''d been waiting more than a thousand days. This is the coroner''s report into the death of Sophie Williams. She''d been waiting almost five years and had just been told she needed to go back to the start of the list because she''d changed address. This is the coroner''s report into the death of Leia Sampson-Grimbley. She was 17 years old. In all three cases, the coroner ruled that failure to provide healthcare in a timely fashion contributed to their death. I could go on, but I think you get the point. Something else that''s interesting to note: as far as I can find, no one in the NHS has been punished for any of this. At time of recording. All of this should be sounding familiar to you because it''s the same thing queer people had to deal with in the 1950s! The professionalisation of knowledge has created an entire group of people who cannot be trusted to make our own decisions, whose private lives must remain under the authority of professionals and those professionals continually invent reasons to justify that authority. The NHS is not set up to provide healthcare to trans people. If it manages to do that (which let''s be honest, most of the time it fails to) it does so despite itself. The true function of this system is the control of trans people. I haven''t even begun to describe how conversion therapists are muscling in and already, as I''m sure you can see, they are pushing on an open door! Footnote, organisational. We should view all of this within the context of a collapsing NHS, which has suffered years of government cuts. When an organisation starts collapsing people within it can stick their heads in the sand, reluctant to look the problems in the eye. They don''t wanna get blamed for it and they''re aware that their jobs might be next. Some even start collaborating with the collapse, treating it as business as usual. And within a collapsing organisation people become reluctant to allow the kinds of change that might be necessary to fix it. It''s easy for bad actors to find a toehold ''cause there''s nobody left whose job it is to stop them. Everybody''s so focused on short term right-now problems that they don''t look at larger, slower moving threats. They''re all busy running around like headless chickens. I''m so sorry! You''ll remember from the start when Wes Streeting''s window was smashed, the words ''child killer'' were spray painted by the door. So now let''s talk about trans kids in the UK. We can start with GIDS. The Gender Identity Development Service was one of the few NHS clinics where trans kids could get permission to transition. It opened in 1989 and their frontline response until at least the early noughties was just conversion practices: denying kids permission to transition and trying to talk them out of it. Some GIDS staff said kids might 