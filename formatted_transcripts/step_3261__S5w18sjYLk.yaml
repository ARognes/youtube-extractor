 kids under that kind of surveillance and control can be really damaging regardless of whether they turn out to be queer or not. It''s also inherently degrading and discriminatory. This is uncomfortably close to the central assumption of authority that upholds conversion practices. Hilary Cass went on the BBC in February 2026 and said the government should police children''s clothing and haircuts because if kids are allowed to socially transition when they want to, this might quote "lock them onto a trajectory that may not have been the correct natural trajectory for them." Generously setting aside the disturbing overtones of the phrase ''correct natural trajectory,'' that''s just John Money again! This is the same false theory that justified abuse and conversion practices on queer kids in the 1950s. It is very worrying that a woman presented by British media and politics as an expert on our healthcare was allowed on the BBC to rehash unchallenged the 75-year-old nonsense of a dead paedophile. You would think the first thing she would do when sitting down to write her review was study the history of conversion practices and make sure the review wasn''t repeating the same mistakes. But the review only mentions conversion practices a handful of times and always takes pains to say clinicians must be defended from false accusations. And it''s weird to prioritise that rather than prioritise protecting patients. In paragraph 17.21 the review notes some clinicians are afraid of being accused of conversion practices and so are reluctant to accept referrals of trans patients. I''m sure that''s true, but it''s weird to say that and not acknowledge some of those clinicians are conversion therapists. Paragraphs 11.4 - 11.6 say equating conversion practices with quote "psychological intervention for managing distress" is unhelpful and harmful. And again, that''s not wrong, but sometimes psychological intervention for managing distress *is* conversion practices like when they say you''re not really queer, it''s just trauma. And speaking of! The Cass Review speculates, kids may think they''re trans because of external causes like trauma, peer influence, or social media! This is the same thing conversion therapists say and Cass provides no scientific evidence for it and no acknowledgement that conversion therapists use that as a justification. At another point the review says some research commentators recommend further investigation into whether pornography might cause children to believe they''re trans. There is a citation here, but it''s to an opinion piece by Karin Nadrowski who has worked for Therapy First and who cites D''Angelo, Ayad, Marchiano, Hutchinson, Spiliadis, Littman and Zucker. I would argue that conversion practices constitute an important risk factor for this patient group, especially given the prevalence of abuse in the cohort, which Cass rightly identifies, but the reviews attitudes towards conversion practices is lax, like it''s something rare and far away rather than something that the government''s own shows trans people are at greater risk of than gay and bisexual people and where the victim''s healthcare provider is very often culpable. And all that also undermines my confidence in this report. All of these... let''s call them ''errors''... in the Cass Review follow a pattern. Evidence that opposes allowing people to transition is welcomed even when it''s shaky. Evidence that supports allowing people to transition is viewed with great scrutiny. And there is a word for when errors get made in a pattern favouring one side. It''s a big word, but I think we''ve just proved that it applies here. The word is bias. So how can we explain this bias? Well, I''d like to entertain a thought experiment for a moment. Let''s imagine that the rise in the number of people wanting to change sex really is caused by some external factor like social media or anime or pornography. Okay! So what? I mean if there''s not a lot of harm or regret [both of which the Cass Review showed] then what is the problem here? We''re still dealing with the same question we were dealing with 75 years ago! Why not just let people decide for themselves? Why not just let them? Why are people''s private lives still a matter for professional authority and control? Putting all of this together, it''s hard not to interpret the Cass Review as saying that nobody should transition unless they absolutely have to, that it''s something to be avoided if possible. Despite the public statements of the woman Hilary Cass herself, I think the review and the model of care that it outlines entail the position that being trans is, all of the things being equal, worse than being cis. And so I think the Cass Review meets the definition of conversion practices set out in the Memorandum of Understanding to which the NHS is ostensibly committed. [Voice Of Tom Scott] - Conversion therapy is an umbrella term for a therapeutic approach or any model or individual viewpoint that demonstrates an assumption that any sexual orientation or gender identity is inherently preferable to any other and which attempts to bring about a change of sexual orientation or gender identity, or seeks to suppress an individual''s expression of sexual orientation or gender identity on that basis. - Unsurprisingly, the Cass Review has been widely criticised. Yeah, I buried the lede on that because I wanted to walk you through the steps and allow you to see it for yourself. But if you want expert opinions, researchers in Britain, Australia, the USA, New Zealand, Ireland, Japan, Canada, Germany, Poland, Austria, Switzerland, and many other countries have criticised for misinterpreting evidence, engaging in unfounded speculation, ignoring patient voices, ignoring international evidence, misleading the public, and coming to conclusions unsupported by its own data. Healthcare researcher Ruth Pearce keeps a master list of many of the published criticisms of Cass, which is very long and growing. Medical organisations in other countries have since conducted their own reviews into trans kids healthcare: the French Society of Paediatric Endocrinology and Diabetology, the German Association of Scientific Medical Societies, the New South Wales Ministry of Health, and the Queensland government in Australia, plus a massive investigation in Utah have all come to conclusions that contradict the Cass Review. And you''d think that would be a big media moment too, right? But I''m sorry to say that it gets even worse. The Cass Review has helped entrench conversion practices in the NHS and British politics. In 2024, then Health Secretary Victoria Atkins used her final day in office to issue an emergency ban on puberty blockers, even in private care. This was an unprecedented use of government power. Lots of medicines have less evidence for them than we might like, sure, but it''s very rare that a criminal ban with threat of prison time is brought down. Those powers are meant to be used when there is a clear and immediate danger. The ban only applies to trans kids; adults and cis kids can still get the exact same medicine and it''s perfectly safe for them, somehow. Atkins cited the Cass Review to say that social media and pornography pose a risk to young people''s ''sense of self.'' So it was the least evidenced, most sensational bits of Cass that wound up shaping policy. There was a general election in 2024 and a change of government. Some people hoped that Labour would overturn the Conservatives'' ban, but the first thing Labour Health Secretary Wes Streeting did in office, literally day one, was extend it. He wanted to make the ban permanent, and in order to do that he had to hold a consultation. Guess who he invited? Sex Matters, Genspect, CAN-SG, and Bayswater. At the time there was one organisation in the UK actually led by trans kids, the people whose healthcare was on the line. They''re called Trans Kids Deserve Better. They weren''t invited. Despite that, the majority of respondents to the consultation said the ban should not be made permanent, that it would be dangerous and uncalled for. Streeting ignored them. The ban was made permanent. The government was sued. And won! The High Court ruled they''re allowed to do that. Footnote, political. British Health secretaries now have the explicit power to ban healthcare for minorities on a whim. Whether you are pro or anti-trans, that is very scary. There is nothing stopping an anti-abortion health secretary from using the same powers. The results of the puberty blocker ban have been very bad. One GP in South Wales says kids are now starving themselves to delay puberty. Other researchers have found steep declines in kids'' mental health since the ban came into effect. A reminder, the Cass Review found almost zero cases of harm done by puberty blockers. Banning them has now definitely caused serious harm to children. After Bell v Tavistock trans kids in the UK were largely left without NHS support. It was claimed at the time this would likely result in some kids dying by suicide, as we''ve already seen some adults have. Hilary Cass referred to such predictions as "irresponsible shroud waving." A government report published in 2024 commissioned by Wes Streeting also dismissed these claims as "insensitive, distressing, and dangerous" while Streeting used the report to reassure the public about the safety of the ban on blockers. However, more recent data acquired through Freedom of Information requests shows that GIDS'' suspension of care in the wake of Bell v Tavistock Round One *was* in fact immediately followed by a spike in the deaths of trans kids. At least 22 children died in the year 2021-22 and at least ten the year after, a marked increase from the years before and almost four times the number the government report had claimed. This is another moment of disconnect. The Health Secretary says that his ban protects children, and I''m sure that he really does believe that. However, he has already been proven wrong. GIDs officially closed in 2024 and the replacement services opened in 2025. A time of recording it''s still very early days for those. Some patients say they are okay. Others say they were interrogated for hours about irrelevant aspects of their personal lives. Some parents have straight up said they''re doing conversion practices in there, specifically Gender Exploratory Therapy. The frontline approach is denying people permission to transition and trying to find some external cause to give them therapy about instead, the thing, the evidence is weakest for, the same failed strategy that was attempted 60 years ago. Elsewhere, the NHS is taking steps to tighten its control. Trans kids who were prescribed blockers before the ban were told their prescriptions would continue. Remember though, GPs have the power to simply refuse you, so in practice many found only one doctor in the whole country who would actually help. That doctor was working out of a practice in Brighton called WellBN. Kids and parents reported being very satisfied with the care they got, even if they did have to traipse across the whole country to get it. However, it seems one girl was receiving treatment at WellBN, that her mother was supportive but her father was not, so her father hired Paul Conrathe, the same lawyer from Bell v Tavistock, and threatened legal action against the trust that runs WellBN, NHS Sussex. NHS Sussex launched an immediate investigation. NHS Sussex demanded that WellBN hand over those kids'' confidential medical records to investigators. The kids will not be allowed to meet the investigators, speak to them or know who they are. The kids'' own opinions about the care they''ve received will not be taken into account. Their medical records will be accessed without their permission and possibly even without their knowledge. NHS Sussex said that if WellBN didn''t comply with this they would shut them down entirely. Some of those kids may be forcibly detransitioned. That''s spelled out in the Investigations Equalities Impact document, where the euphemism NHS Sussex use is "managed withdrawal." That document also mentions some parents may be referred to social services, and that''s no idle threat: elsewhere in the country some parents have already been investigated by social services for going around the new clinics and getting private medical care, even if they do so legally. NHS Sussex admit the investigation may harm these kids, making their mental health worse and increasing suicidal ideation. They also acknowledge people might just buy hormones off the internet or go private, and they''re right about that: like abortion, if people can''t change sex the approved way. they''ll find alternate means. Footnote, carceral. You may find the threat of forced detransition shocking but it''s already happened. It''s happened for years in British prisons. People have even died. Now here''s something very interesting. This document is the minutes of a meeting that took place between NHS Sussex and WellBN in October of 2025. These are not public. These were leaked to me by someone close to the situation. In that meeting, to their credit, WellBN pushed back and the representatives from NHS Sussex repeatedly draw everyone''s attention back to the paperwork, back to the terms of reference document. They say, "Hey, we''ve all gotta do what the document tells us!" If you''ve ever worked in the NHS you will know there are a lot of people there who are seemingly made of paper, who''ll just say, "Oh, hey, I''ve just gotta do what the policy tells me to do!" [Alarm Sounds] That''s the Chekhov''s Gun Alarm! This is what the entire video has been meticulously building to! Most definitions of conversion therapy include a proviso about the perpetrator needing to have a certain state of mind. It has to be grounded in an assumption or a belief that being queer is bad in order to count. But the reps from NHS Sussex can say, truthfully, they don''t have any negative beliefs about queer people. They''re just following the terms of reference document. And the authors of that document can say, perhaps truthfully, they don''t have any negative beliefs about queer people! They''re just following the Cass Review. And that chain of paperwork allows the NHS to do something that is functionally conversion practices: it suppresses people''s gender expression; it''s not consented to; it undermines their dignity and autonomy; it''s inherently degrading and discriminatory; and it poses a risk to their health, a risk that the NHS''s own documents admit. But nobody involved has to be a bigot because the state of mind has been replaced by the Cass Review, a nice clean document that produces that moment of disconnect between what folks working in the NHS believe they are doing and what they are really doing. Once again, the professionalisation of knowledge has created an entire group of people who cannot be trusted to make our own decisions and whose private lives must be surveilled and controlled by a medical authority. And now all the folks working in the NHS have to do is turn up to work, just like aversion therapist sit in the 1960s, and *that* is the legacy of the Cass Review. [Electronic Music Like Yoooooooooo] When you examine this subject through the historical archive, it can seem as if it''s all happening on paper, but real people aren''t made of paper. Question One, Why hasn''t Britain banned conversion practices yet? Well, because any serious attempt to do that would have to engage with the fact that the NHS has been doing it for decades. They may have phased out official efforts on LGB people but they never stopped doing it to intersex people and several of the things that make conversion practices wrong are core features of the NHS trans healthcare pathway. And Britain still absolutely has a conversion culture! To name just three examples, intersex people aren''t protected by the Equality Act. Labour''s new guidance for relationships and sex ed in schools deletes all mention of trans kids and outline circumstances in which they can be prevented from being themselves at school. What clothes your child wears, how they do their hair, what name and pronouns they use, are now to be monitored by professionals, just as the Cass Review recommended. Sex Matters and Bayswater were consulted on that too. Groups who promote conversion practices are routinely platformed in the British press and invited to meet with government. This is bad not just for queer people, but for everyone. Conversion therapists create corruption and dysfunction in our public services. Because the core of conversion practices is defending traditional authority through surveillance and control, authoritarians, including the religious right, are empowered by it. Question Two, why was Wes Streeting''s window smashed? Well, trans and intersex people have been trying to engage with healthcare services, including the NHS, for decades now, through so-called patient advocacy. That means things like filling out consultations, joining advisory boards and so on. We have been trying to change this and the old tactics don''t work. They lead to people getting burned out and quitting because they''re just not listened to. At the end of the day, this is about authority and no clinician or manager is gonna allow themselves to be talked out of a job. So patient advocacy has failed. Formal complaints have failed. Complaints to the regulator have failed. Attempts to engage the NHS through their own internal advisory groups have failed. Condemnation by their own clinicians has failed. Condemnation by the international medical community has failed. Letters from the coroner have failed. Legal action has failed. Contacting our political representatives has failed. Paper failed years ago, and so we took to the streets. Groups like Transgender Action Block and Trans Kids Deserve Better have been out there peacefully protesting this issue for years, and that too has, so far, failed. The British queer community''s commitment to non-violence does us a lot of credit and stands in stark contrast to the suffering that''s been inflicted on us. We are now at the far edge of peaceful protest, direct action that is not violent, but which damages property. So why was Wes Streeting''s window shattered? Because people''s lives were shattered first. [Glass Breaking] This dress is made of old medical records and government documents. Britain''s produced a mountain of paperwork on this issue and it''s all been useless, so we turned it into an incredible fashion look. This was handmade by a designer called Brian De Carvalho. He stitched this with a needle and thread! It was commissioned by Philosophy Tube''s stylist Brian Conway. My hair and makeup was done by our amazing makeup artist, Nickibugs. The camera work was done by Mann Bros. The chicken, Hetty, came with two animal handlers who were present on set and made sure that she was happy and looked after. Philosophy Tube is made by a whole team of talented people. For this episode, we hired experts in law, in medicine, in journalism. I hired a lawyer called Matthew who looked over the script and made sure that we weren''t defaming anybody! We are proud to bring you a top quality show. Philosophy Tube is used as a reference in schools and universities. I''m told that we have viewers at the UN and EU who reference this show in policy discussions! So this is a top shelf product. You deserve more than slop! You also deserve videos that treat you like an adult and talk about serious issues. I watched an amazing video recently by Lindsay Ellis on police body cam footage, about why there''s so much of it on YouTube and what that says about surveillance, spectacle, violence and policing. It''s honestly one of the best videos I''ve seen in ages. All of Lindsay''s videos are bangers. Everything she makes is gold. But this one especially is worth a Nebula subscription all on its own. If you like thoughtful quality media then I cannot recommend that one enough. Lindsay''s video is a Nebula Original and it''s exclusive to the platform. And normally when I talk about Nebula, I recommend videos that are similar to my own, but there''s so much awesome stuff on there and there''s new shows dropping all the time. If you''ve had enough of serious subjects for a while and you just want a laugh, Abolish Everything is a Nebula exclusive comedy show where comedians argue for the abolition of things that annoy them and have to defend themselves in live debate against the panel of improv experts. It''s honestly hilarious. It''s really been brightening my day lately and it''s not available anywhere else. If you want drama, I have two Nebula exclusives: Dracula''s Ex-Girlfriend and The Prince, original dramatic works that I wrote and starred in. I met somebody recently, a trans woman, who told me she came out because of The Prince. That is amazing! The Prince is now being licenced for productions all across North America and Canada so it''s going out to even more people. I''m honoured to be a part of that show and it happened because of Nebula. They''ve given me opportunities to grow and opportunities as an artist that I wouldn''t otherwise have had. When you subscribe to Nebula, you are really helping out me and the entire Philosophy Tube crew. And it''s not just about subscribers or number go up. The idea behind Nebula is ambitious because it''s owned by the creators on it. We want to grow it into a prestige streaming service like Netflix, but a little bit more thoughtful. Everything on there is made by human beings and we are very selective about who we allow on the platform. We do not like slop. Years ago, before I''d achieved anything in my career, before House of the Dragon, before Star Wars, before the Prince or anything like that, it was Nebula who believed in me and it was actually Lindsay who convinced them to sign me. This necklace is the Nebula logo and I''m genuinely proud to wear it and be a part of it. So if you use my link in the description or the QR code that''s on screen now, you''ll get the best deal. Everything on Nebula for 50% off the usual price. That works out to $30 a year or $2.50 a month if you get an annual subscription. And you can get a lifetime subscription: $300 one time and you get everything on Nebula always. If you want, you can also share Nebula with a friend. Guest passes are available, so you can send one of those to somebody and they''ll get Nebula free for a week and they don''t have to put in any payment information. If you like thoughtful prestige media and you want to support the human beings [and the chickens!] who make it, then I recommend you use that link or the QR code on screen and get 50% off Nebula. Go.nebula.tv/PhilosophyTube. Click that link and then go and watch Lindsay''s video on body cams because it is fantastic. [whew, what a massive episode! proud of this one though] [it took a lot of work, but I''m glad we got there with it. I hope it ends up having a positive impact, especially if it''s used in policy discussions] [by the way uhhhh do sign up to the patreon if you can. i''m expecting this episode to run at a fairly big loss, it was the most expensive one we''ve ever made] [but yeah, pretty smooth filming all things considered. the chicken was SO well behaved] [i actually booked three days in studio, thinking we''d need the extra time cause the chicken would be tough to work with, but she was so good we got through everything in 2 days!] [how good is that dress too?] - You are doing so well. I''m really impressed.'
