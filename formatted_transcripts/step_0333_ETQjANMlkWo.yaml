transcript: If this one decision went differently, you'd be saying a very different word every single day. Same app, same search bar, same internet, just a completely different name. Back in the '90s, two Stanford students, Larry Page and Sergey Brin, were building a search engine. But it worked very differently. Instead of just scanning words, it ranked websites based on links between them. Basically, the more sites linking to you, the more important you are. So, they named their project after what it actually did. It analyzed backlinks. And they chose a name BackRub. They later renamed it to Google, inspired by a googol, the number with 100 zeros, and it's stuck ever since. But if they didn't, you wouldn't be Googling things today. You'd be saying, "Just BackRub it."
