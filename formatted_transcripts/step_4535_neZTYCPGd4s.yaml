h the engines of what people think of as where where they work. What it means to work here. As I watch Slack, I mean I really look at it more like a sociologist. Um our current uh digital tools, Slack included, social media included, are not designed for healthy heat. They're not designed to basically be able to have uh context or nuance. And and in some cases, Slack can be super helpful to help smaller communities find one another in ways that doesn't take a lot of infrastructure. Um but Slack can also be Amanda Ripley has uh wrote a book called High Conflict. She has this great term called conflict entrepreneurs. Um, where in where in any group and every group and every family and every company, there's also people who are just in it to like stir up >> [laughter] >> And so, Slack can be also really conducive to that. I often see Slack as almost like like smoke. >> [snorts] >> Like why why is this all arising? And and part of what I help people do is like look for the fire. >> Oh, it's a symptom of something. >> of something. And so, if people are like, you know, saying all sorts of stuff on Slack or starting the side channels, that's usually a symptom of a malaise elsewhere. >> Yeah, and I think, you know, whenever people hear about um conflict and group conflict now, uh I shouldn't say what whatever, but often like their minds understandably turn to political conflict, right? Are you confident or do you have a sense that the ideas that you talk about as far as conflict resolution also work when extended to conflict between larger political groups? >> I think that we have examples in our politics that are deeply unhealthy conflicts. And I think we also have examples that are starting to look at more healthy conflict. There's a huge conflict right now happening within the DSA and the Democrats, right? The DSA is sort of like the jilted lovers of the Democrats. They want to They're They're They're saying like, I wish you could only see the world we think can exist. And so, part of that fighting is actually tapping into what the conflict resolution facilitator say to near calls relational longing. And I think in all types of political, particularly in political uh conflict, tapping into that that that relational longing is a way to actually be able to widen the tent. And and but the the second thing is even across political divides, when you bring people into the the room or when they have a shared community that often isn't even about politics, it might be their neighborhood association, it might be their kickball club, it might be their trivia night. Actually having a second identity where they're able to where they're able to, you know, come together around, expands their ability to also be in community with each other across and within those political differences. >> I guess though one of the the big questions that that feels a little uh undetermined at the moment is how much actually do some of the groups that are in conflict now want to be in in relationship? >> I agree. And I think one of the deepest dangers of our country is we've fallen out of love with each other. And that relational longing, when you no longer have relational longing, you just leave. You exit. And that's one of the most dangerous I mean, I don't work in places where people don't still have some amount of desire or need for each other, because then you you just break up. >> Right. >> And so I think one of the when I work with organizations, with communities, with churches, one of the things that I tell leaders is like continue to find and cultivate that relational longing, that residual desire to still want to be in community with each other. And I think going back to our conversation earlier around families, I think families sometimes have it's the hardest place to be. It's it's the it's can sometimes be the scariest place to be, but families also a particularly across political divides, which are many families in this country, still have a residual desire for one another. And so when we fall out of love with one another, that's a dangerous place to be. >> On the interview, we talked to our guest twice. So a week later, [music] I spoke to Priya Parker again about how she handles conflict at home. Hi Priya, how are you? >> Hi David, I'm great. How are you? >> Good. I have a real bone to pick with you. >> Let's go for it. >> No, I don't. I just thought I'd >> [laughter] >> start with try and start with a pretend conflict, but I have no no issue with you. >> You got nothing? >> I got nothing. Um, but you know, to start, I was very intrigued by the way you described yourself as a conflict-averse person. Um, so how how does your own conflict aversion show up in your life? >> When I am in a tense situation with somebody that I love, with my husband, with my children, in with my friends, my palms get super sweaty, my heart starts palpitating. Sometimes in a really good fight, I'll feel slightly faint. >> [laughter] >> And I have come to realize and recognize that all fighting actually is physical. Just not in the way we think. And the physicality of what actually happens in our bodies, with the in ourselves, actually deeply affects our ability to fight or stay. And so my conflict aversion is something that uh continues. I'm still physically conflict-averse. And I actually as a facilitator, but also in my own life, have very simple practices to just notice this is happening, uh to breathe, to not exit. And so my conflict aversion shows up all the time. But I have learned how to basically stay in the heat. >> And so you you have these uh tactics for how to kind of physically manage the feelings of of conflict aversion. Um, but what advice do you have for people about how to mentally and cognitively deal with uh the conflict aversion? Cuz it's one it's one thing to sort of not flee, it's another thing to then um behave in a productive manner in the conflict. >> It's to deeply reframe conflict as an investment in the person. And I mean, I do this with my family, with my even in my own household when my husband and I start, you know, really getting into it or arguing about something. And if my children happen to be in the room, I will look at them and say, "It's okay that we're fighting. We're arguing because we love each other. This is an important conversation." And I'm kind of saying it as much to them as I am to myself. And part and and part of that is because we tend to think of conflict as antagonistic, but conflict can actually be incredibly prosocial. And so, very simply, it's like first is checking in with oneself and saying, "Do I care about this relationship?" And counterintuitively, if I do, let me get in there. >> Can I ask when you're in a uh fight or conflict with your husband, >> [laughter] >> and is he ever like, "Stop doing the techniques on me. I know what you're doing." >> [laughter] >> Of course. Don't facilitate me. Of course. And and you know, part of part of my husband is very comfortable with conflict. I've learned a lot from him, but a huge part of our it can be very frustrating cuz I know what the tools are, but but [laughter] we're not always using them. You know, I'm going to fight with my husband. I'm a wife. I can't be a facilitator. But I do try to practice some of these skills. And also afterwards, when we've, you know, when when we've kind of gotten through the fight and we're they're joking about it or debriefing, I think actually over time both of us try to practice some of these some of these skills. And you you can actually get better at fighting. I have. He's always been good at it. I've gotten better. >> [laughter] >> And you know, you the way you just described your husband as someone who's good at fighting, for me uh up a connection with a certain personality type or even certain group type, which is groups or individuals who who are kind of always uh poised for conflict. And I want to know your guidance for how best to engage in a conflict with those people because I find that my reaction often is like, I'm just going to you know, uh pass the buck or just avoid it it for whatever reason or just like not engage because the idea of of bringing something up with someone who I know is immediately going to have their fists up and it's like I just would rather not bother with this. But what how might we smooth the way through our conflict with people who are who are like ready to fight? >> This dynamic exists everywhere. There's And you're often married to the person, right? The person who wants to fight and the person who doesn't. Uh there's a great piece by Raina Cohen in The Atlantic and she looks at couples who schedule their fights. And one of the things that they found >> Schedule their fights, really? >> their fights. And one [snorts] of the things that they do is they they schedule fights. I have a weekly checkup almost like a dentist's cleaning or a monthly fight. And what this does is when you actually have, you know, a time to schedule a time for the fight, the conflict-seeking person can can always the conflict-averse person be like, "Save it for Tuesday." >> [laughter] >> And the conflict-seeking person who feels like the their conflict-averse partner is like never willing to have a fight knows, "Okay, fine. We have that for Tuesday." And it might sound kind of bizarre, but actually many like I studied um traditional and indigenous communities of how they dealt with internal conflict, and almost all of them had specific times and places to regularly sort through internal conflict. Part of what we are lacking in modern life is is is rituals to hold things that are hard. It allows us as as humans, as friends to have a place where we know we can sort of take this stuff. And in part because we assume that conflict is dysfunctional, we don't even know that there are ways that we can actually embed this into daily life. >> Can you share a conflict in your life that you're working on right now? >> [laughter] >> Oh my god, so many. When I feel like when you're a parent, there are conflicts all over the place. Um I mean, I think one conflict that I uh that I like a a larger question that I really hold as a parent is I have an 8- and 11-year-old currently is if and when my children are with their peer set and uh you know, something happens between two kids as is totally normal, when and how to pick up the phone and call the other parent or when to just sort of let it wash out. Um and I think that that's like a really I think that's a really deep conflict within and across parent communities of how much do you sort of let kids sort it out and how much is it actually our job to get in there and give them some skills. I do this actually just with my own children, um the practice of normalizing apology if and when they do something to, you know, hurt or annoy one another and [snorts] we uh and they apologize, I help them practice actually a full apology to actually articulate what it is that they did and not, you know, say like, you know, I'm sorry you were offended. >> [laughter] >> And and practicing actually ownership and accountability. And then actually on the receiving side, I help them I you know, instead of saying um it's fine, it's okay, right, if somebody apologized to you, I I have them say or I I invite them to say, they don't always listen, thank you. Cuz it actually they're actually then it's actually quite vulnerable to admit that someone affected you. And that simple practice in everyday interactions with young people is actually the same skills we do at the highest levels with colleagues, with conflict in much higher stakes contexts, but we are so averse to apologizing, we're not taught how to, and we're so averse to even knowing how to accept someone's apology. It's a huge problem with with just the daily macerations of of group life. >> It really is an amazing thing, isn't it, the way that some people just will not apologize or or will or will not admit wrongdoing. >> Entire families get incredibly and teams get incredibly stuck when we don't have the tools and skills, and I will call it a tool and a skill to apologize. And in part because when we are in relationship or when in conversation with one another, if you are unwilling or unable to actually admit that you were ever wrong, it creates this huge distortion within the entire group. And so one of the simplest ways to actually like get a group to get unstuck is simply practicing people articulating the elements that have hurt them or annoyed them and the other person practicing listening and accepting. >> Priya, I also wanted to ask you that in our previous conversation, I had brought up the idea of like how do how we might reduce conflict in ways that don't also feel like we're just compromising. And and you gave this example of um your relationship with your dad and how you have kind of I it sounded like different political beliefs or different some social beliefs that are different and and you just sort of made the decision that it was best for you to not talk about that kind of stuff or or table it. And the thing that I didn't understand is like how is how is that different than just avoiding the conflict? Why is that a a productive move for you and your dad to make rather than the thing that it seems like you're often counseling against, which is burying the problem? >> There was a study done that looked at uh how important political identities were uh to Americans. And over the last 10 years, particularly with the election of Donald Trump, that uh that identity has moved way up the way up the ladder in terms of importance. And there was a Christian theologian called Joyce Ann Mercer, and she writes a story and I could relate to it about how she and her family have come across the political aisle, would come together for Thanksgiving or family reunions, and they used to be able to 20 years ago, 30 years each other, kind of tease each other and engage in these conversations, and uh and it was kind of all in good fun. And over the last 4 years uh uh the vibe was off. >> [laughter] >> And what actually be what what the stakes in the country on both sides, on all sides, began to be perceived one as much higher. And the political identity uh was also perceived as being getting closer and closer to disgust and having different moral worlds. And part of what she advocated for, as she said, when you have a relationship in which you want to maintain ties for any reason, and there there is a line that around which if you enter you're not going to be able to sort of come back from. She encourages engaging in strategic conflict avoidance. And as I read that essay, it helped me understand the many decades uh long conversation that I've had with with my particularly with my father, um as I think many young people or young adults or adults have with parents of a different political ilk. And at some level it's not actually avoidance if you've had the if you've had every conversation over and over and over again and realize you're not not to change this person, but you still want to be in relationship with them. And so, one of the things that I found both in my own relationship with my father, but also as as I'm looking at the country is to to grow the warmth between the people the people that you love, and to have fun together, and to remember why all of the different reasons you love one another. It It's almost like in physical therapy, if there's like a if there's a wound or there's a breakage, you don't go directly for where for the for the wound. You work around the tear and you to strengthen the muscle. And similarly, in relationships, you work around the tear to strengthen the muscle in part to be able to have a relationship with them. >> So, let's say someone has has fully immersed themselves in in the art of gathering and the art of fighting and feels like, "Okay, I've got a I got a handle on on [laughter] productive group gathering and and also how to deal with conflict within groups." Like, what's the next thing that person should be working on? >> That's a great question. >> [sighs] [snorts] >> I mean, I am interested in all of the different tools of how a group or a community becomes thriving in a place people want to be a part of. I think I'm I'm very interested in gifts, the role of gifts in society and in between communities. I think we have a flat understanding of gifts and I think gifts are incredibly important and interesting in terms of helping a group understand what it is in terms of power, in terms of love. I think there's a lot of I think there's a lot more understanding we could have about the role of gifts in groups and communities. >> And and somewhere out there, I think a lot of book editors ears have just perked >> [laughter] >> perked up. The art of gift giving, holiday season 2028. But thank you thank you so much for taking all the time to speak with me. I really enjoyed it and thought it was really interesting. [music] So so thank you. >> you so much for for having me and I hope you're a little less conflict averse [music] next time. >> [laughter] >> I'm Lulu [music] Garcia Navarro. >> And I'm David Marchese. >> And we're the hosts of the interview, [music] an audio and video podcast from The New York Times. >> Every week we interview fascinating and influential people from all walks of [music] life. >> Subscribe to our YouTube channel so you'll never miss an episode.
