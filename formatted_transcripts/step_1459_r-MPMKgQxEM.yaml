ry unlikely not only that you will make that kind of money and retire early but that you''re going to get there and if you are burned out you''re going to just bounce back back in a couple years it''s going to be seriously challenging so I don''t mean this video to be like you know Doom and Gloom I''m really just trying to inspire you programming isn''t a horrible thing we all love to do it but I think there''s some intrinsic aspects of tech culture programming itself and sort of our human behavior that if we don''t make some changes it really can take over your life and so I help these I hope these tips really helped you today what are you doing personally to try to make sure programming doesn''t take over your life leave me some comments I I love the comments I I appreciate everybody sharing things they''re doing with each other because you know I know a lot of people don''t just watch the video but they also read the comments and really get a lot of value out of that so let''s talk about it let''s discuss you know are have you found some things in your life that maybe have become unsustainable or a little bit more difficult to find meaning in or just really enjoy because of programming and are some of these things I''m sharing with you things maybe you''re already doing or do you have some new things you can share with the rest of the community that will help us all out until next time [Music] thanks [Music] [Music] oh'
