transcript: 'I found wow programming is really cool it''s it has a lot of freedom in it right I think that''s one of the things that draws us to it but the problem is that''s something that you know your employer [Music] controls on the surface programming seems like just any other career but in one of the darkest periods of my life it became a destructive addiction at work people would praise me and talk about what amazing code I wrote how good I was at explaining things how great of a consultant I was at that point or an architect but at home my family hardly had a relationship with me sure I took them on trips occasionally we ate together pretty often I was in the house a lot I still was here for my wife and my kids but we had no connection there was no closeness so today I want to help you out a little bit by sharing some things that are a bit of a warning and depending on where you''re at in your career you may not be ready to hear this yet you may not agree with me and that''s okay too I make these videos not to get agreement but to actually impact your life and help you but I want to share some signs that programming may be taking over your life in an unhealthy way and then in the second half of the video I want to give you just really practical things you can do that I''ve done as well to get your life back from programming so that it''s not more than a job and becomes everything to you and you just can''t live your life and enjoy it and do anything else really so first let''s talk about some signs that programming is taking over your life years are going by and you keep focusing so much on programming and so much on technology in your job that the year are drifting away and everything else that''s of importance to you in your life seems to just be you know drifting through your fingers well one of the first things that I think is a big sign is if your entire life outside of work is mostly digital and what I mean by that is if the time you have off of work you''re sitting on social media occupying your brain with things other people are doing or just kind of brainless entertainment or get stuck into Doom scrolling you''re looking at you know Sensational negative news just to kind of occupy your brain with things uh I also you know I''ve shared in many of my videos I I I was a marijuana addict for a very long time and I would smoke weed uh but I would also play video games a lot in my spare time and so I if you''re programming all the time and then when you''re done programming you''ve been spending all this time on the computer for hours for your employer or your clients you suddenly have free time and the first thing that you go to is other digital experiences you know and I''m not I''m not trying to knock all of these by the way I think you know I go on social media to a point uh I still play video games occasionally but you know if if this is something that takes up the majority or a lot of your time outside of doing you know code and programming and and you''re doing side projects and things like that that''s one of the biggest signs I think you can look for that it may be time to really make a change if you want to get your life back and I''m going to you know talk about that more as the video goes on the second sign that programming is taking over your life you''re losing hold of the things that matter be besides it is getting into this kind of vicious cycle between stimulating and chilling out and what I mean by this and this is so common and let me tell you I''m a career coach so remember I''m meeting people all the time uh online about their career and they''re sharing their struggles with me uh and I struggled with this too you know if you get up in the morning and just to get going you got to you know cram a ton of coffee like two three cups of coffee just to get going so that you''re available for your job and you''re alert enough and then throughout the day you know let''s say you get tired around 1 p.m. you drink another coffee you know I''ve known people who have drank s to nine cups of coffee a day never got that high I think I got up to four was the most I would drink and that was a real problem but the bigger problem is then you get off work and you need something to you know bring your nerves down chill you out and so you smoke a joint or you drink a beer or quite a few beers or you know whatever you do to wind down and if you get into that vicious cycle where you''re using basically substances to build yourself up and give you energy just to get through the day and then you need to take something else just to tear you back down you know that''s an addiction basically that you''re starting to develop and and programming itself just the job that you''re working you know and then this doesn''t have to be specific to coding per se but you know doing Tech work technology related work technical work where you''re using your brain a lot you''re having to focus a lot creatively you know if that if that becomes so gripping in your life that the only way you can get through it is to use substances basically on a you know daily basis I I''ll tell you as someone who you know I''m going to be 48 this year I''ve been doing this for 26 years now uh you may be fine right now if you''ve been doing this for 5 10 15 maybe even 20 years but if you keep up that routine of stimulating yourself chilling yourself out with substances stimulating yourself chilling yourself out with substances there will become a point where you just can''t maintain it anymore and you have to get off of them and I can tell you from experience uh trying to program when you don''t have the stimulants to assist you when you''re used to it for 20 years is very very difficult it''s doable I''m off caffeine you know I can do it but it it''s not an easy transition the third sign programming is taking over your life it''s just slipping away is you have no quality time with your friends or family you know there''s a big difference like I said earlier in the video between being available to your friends let''s say you''re going out to a movie with some friends that you know or you''re going to see a band or you''re married you have children and you''re trying to spend some time with your kids there''s a big difference between putting the time in and having it be quality time you know I I have tried to be as honest with you in these videos as I can be that I made a lot of mistakes as a father when my children were growing up I didn''t spend nearly enough time with them uh where I was actually available to them and really encouraging them and and being a dad and leading them it''s one of the biggest regrets of my life now they''ve since forgiven me uh I''ve apologized for that when I went through recovery from my addiction I had to ask amends of of people that was a very humbling experience but you know if you don''t want to have to ask forgiveness of your kids uh for you know kind of messing up their life or just not being there the way that you know you could be that''s one of the biggest signs that you probably are letting programming take over your life is you know at night or on the weekend you could be doing something with family or friends but instead you find yourself escaping again through other digital activities or you know you''re abusing substances or really just doing anything to distract you from having any kind of meaningful relationships in your life anymore the four sign that programming is completely taking over your life is you have no non-technical Hobbies this is something I share with a lot of my career coaching clients when they come to me and one of the things they''re struggling with is finding a sense of purpose in their work after programming for a long time and you know when I first got into programming you know I was a musician at that time now I wasn''t a big musician or anything like that but I played guitar I sang I wrote a lot of songs my band was one of the most important things to me in my life and once I got into writing code you know that was an Avenue for creativity for me uh I found wow programming is really cool it it''s it has a lot of freedom in it right I think that''s one of the things that draws us to it but the problem is that''s something that you know your employer controls right how creative you can be and versus like music or art or you know anything you might do Sports where you get get to be the one that sort of creates or facilitates how you want to you know accomplish the thing that you''re going for the goal that you''re pursuing if you give up all those things in the name of programming and this is what I found myself you you don''t basically have anything for you that you can do that really gives meaning to your life where you don''t have the shackles of your employer saying well I''m sorry I know Jamie let''s say for example you''re excited about this new framework or this new programming language but we don''t need or you have you know you haven''t convinced us enough that it''s the right thing and they could totally be right right I see a lot of programmers and I used to do this earlier in my career who kind of try to shove a technology uh into a solution at a at a company they''re working at just because they want to use it or they want to you know build up their resume when that could be the totally wrong thing so you know I if if programming is the only Avenue that you really use for creativity and growth in your life and you have no Hobbies outside of that that you do anymore that let you be creative you can start to feel really empty inside you can start to feel like the purpose of your entire life has just become programming and work and so if that''s something that you''re experiencing you know when we get to the second half of the video I''m almost there uh you know maybe take a step back and think about how important is programming really versus other things that meant more to me at in my life at one point and they probably still mean something to you you''ve just convinced yourself as I have well that was when I was a kid you know like I don''t need to play music anymore that was just something I did when I was younger no I found you know even here approaching 50 uh creating music for me is something that like it fills me up inside I love to do it if I don''t do it my life starts to feel empty and meaningless and the fifth sign that programming''s taken over your life is you''re living paycheck to paycheck now this isn''t uh let me make sure I''m clear here this isn''t the situation where you have high expenses you live in an area of of the world where you know you''re working a programming job let''s say and you''re hardly spending money on anything you''re just basically a able to cover you know your mortgage your rent you have no you know Netflix subscriptions you''re not eating out and you know you''re not buying unnecessary purchases or anything like just making the the bare minimum you know you''re living paycheck to paycheck well hey that''s how we all start out right you know sometimes you need to move to a city that''s cheaper to live in or move into the country or sometimes you need to change you know your expenses but one of the things I used to do I don''t know if you relate to this or not is my job programming became so hard the longer I did it that I made a lot more money but because I was so miserable subconsciously and I just felt you know kind of Trapped in Corporate America and and just trapped you know in in that my work had become very difficult and fr frustrating is I would justify spending all you know not all but I spending way more of that extra money that I''d work so hard to earn on frivolous stupid things I would eat out way more than I needed to i'' buy you know guitars and things when when I already have a couple guitars you know they''re they''re fine and I had too many I''ve gotten rid of some but right you know whatever it is for you it could be collecting you know I know people that collect bourbons and things like that but you know if if you''re spending your hard- earned money you know and justifying spending it because your job''s so difficult but then it''s keeping you in this situation where you''re not able to really save anything and you''re financially just kind of barely afloat that''s a pretty serious problem and it''s also a big sign that programming may have taken over your life so what are some changes that you could make now to start to get your life back from programming well one of the first things and this is difficult but if you can do this and I''ve done this at least the best to the best of my ability it will completely change your life is you need to Divorce Yourself completely from the values of the software industry now let me unpack what that means a little bit you know when you work a job or you go on LinkedIn or you talk to a lot of your co-workers or even friends who might work in Tech there''s a lot of subtle cues that we''re getting about what matters in life and how we should be going about our career things like well if other people leave work at 6 and you want to leave at 5: you''re not really a committed person in your job so make sure you stay later again it can be one of those things now there''s actually managers that will say that to people but sometimes it''s more of like a a thing we we put on ourselves because we just look around at everyone else and we kind of think we have to do that also I talked in some prior episodes about hustle culture and what a huge problem that is if you buy into this idea that if you just work your ass off you''ll be able to accomplish some big dream if you don''t accomplish it you''re just going to burn yourself out it''s a really unsustainable kind of tempting lie to sell to people uh it really bothers me and I''m guessing if you''re watching this bothers you too that there are so many people online today that are really just praying on your desire to have some more control over your life and so they''re selling you you know these these false promises of ways to get rich quick with Bitcoin or starting your own company and again there''s ways you can do that but you know false promises that make it sound much more certain than it is much easier than it is but also you''ll see on LinkedIn I I call it accomplishments signaling it''s basically people publicly putting out look at this big accomplishment I had and look at this big raise I got and I you know I was featured in this and I had a press release in this and it you know that''s all cool I I don''t want to diminish people''s accomplishments but if you''re having a hard time feeling like you have a life and working in Tech is beginning to you know exhibit some of the signs that I talked about earlier in the video then the last thing you need to be doing is getting wrapped up in the industry and their obsession with accomplishments you need to focus on your own accomplishments and really completely remove yourself from as many of the things that other people are telling you about what you have to do learning addiction as well I talked about this uh in the video on AI the episode a couple episodes ago you know we we often are constantly learning over and over and over again not because we really need to but because we''ve somewhat been programmed no pun intended you know to keep learning the second thing you can do to start to get your life back if you''re losing it to programming and this is I think really valuable and easy to do but you got to enforce it is to schedule a social activity right after work now what do I mean and why the hell would you do this well often when you''re on the job there are all kinds of things that can happen where your boss or even your colleagues other people you work with that are the same level as you will pressure you into staying late or they''ll pressure you into 