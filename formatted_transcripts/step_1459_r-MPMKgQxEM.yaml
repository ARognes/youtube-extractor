reer you want to get ahead by accomplishing more valuable things not by working more hours that''s the way you know line workers and Manufacturing would sometimes get you know raises as productivity remember we''re knowledge workers so that''s not what you should be looking to to actually get recognition [Music] the third thing you can do to get your life back from programming if it''s taking it over and it''s slipping away from you is start getting control over your finances you know I''m going to be honest with you this is something I only started doing really earnestly in the last few years I''ve been been fighting to do it for about six or seven years but you know if you''ve gotten used to a somewhat comfortable income or dual income in America or in a country where programming still pays pretty well uh you can get yourself into a situation where you don''t even know what you''re spending every month you have no idea so if if you can sign up you know mint.com used to be a great site that you could do this they now got bought out by Credit Karma which is a decent tool but it doesn''t offer the same features but you know I I don''t want to uh endorse any specific tools here I''m not sponsored or anything like that but you know if you just do some simple Google searches there''s some really great tools out there that you can hook up to your bank account if you''re concerned about privacy you know re read the disclaimers I''m not concerned about it I''ve been using these kinds of tools for like 15 years but they can show you Trends you know here''s how much you you spend every month here''s how much you save here''s how much you spend and Save in each category but if you don''t have any kind of insight into your personal finances if you kind of just have an idea of what you''re spending at least what I found is you''re going to always have these unexpected you know expenses things like you know you pop one of your car tires and suddenly you got to blow a couple hundred bucks on that or somebody gets sick and has to go to the doctor and if you''re not actually looking at not just you know what are my predictable monthly expenses but you know let''s say you have a website like I do and you have to get an SSL certificate once a year you know I I have a spreadsheet actually where I keep track of all my monthly expenses and I put all my yearly expenses in there and then I just kind of divide it by 12 to give me an average monthly expense um I do a few other things I don''t want to get all detailed about it and I''m going to be talking more about business finance and personal finance to help you if you do want to become a freelancer or a solo consultant or start a company uh this year but this isn''t the video for that but you know any anything you can do to get control over your finances if you got to cut eating out if you got to stop having door Dash deliver stuff to you that''s a huge money waster I think you know that uh if you''re subscribed to like a ton of different subscription Services you know Netflix Amazon Prime video HBO Max like Disney plus uh pick one you know or like for us Prime for example includes videos we just use that and if it''s not in Prime you know we occasionally pay for it but like you know anything you can do to get control over your finances and anything you do to stop spending money on unnecessary frivolous expenses that''s going to give you the money that you can start to save that''ll give you the cushion so that if you get into a situation where your job becomes unhealthy and your manager pushing you in ways that are unrealistic you can say no and not worry that you''re going to lose your job or get fired over it or if you do you''ve got some money to sit back upon so that you can make sure that you keep your career moving forward and you''re not trapped the fourth thing you can do to get some time back into your life away from programming is you can make sure that your role in Tech is really the right role you know one of the things that I experienced I don''t know if you''re at this point of your career yet or not is that if you''re a software developer or a software architect you know not so much an architect actually lead developer QA analyst you know tester a lot of these positions we spend so much time on the computer focused you know writing code and then the only time that we really get for a break is like the daily scrum meeting or you know a quick call to troubleshoot something that''s not really any variety so to speak in the level of work that you''re doing where it''s kind of mental work versus social type of work I don''t mean a social worker but you know work where you''re interacting with people you''re discussing things now I''ll tell you too the longer I wrote code I became more antisocial I think this is a big problem people have talked about this but it''s not as well documented the longer you spend on the computer the more you get used to just interacting with you know somewhat of the binary aspect of a computer you put information into it you either get it out or you don''t and you know people aren''t like that right were''re a lot more unpredictable and I think the longer I would spend just writing code and that was the main thing I would do in my life day after day after day with very little other variety you know the worst I got to be honest at interacting with people even in my personal life so you know I you may have seen I''ve got this freebie on my website called techr pedia it''s a collection of the top 25 job roles in the software industry I got a lot of data I built this little data Hub basically that you can you can look at it and it''ll help you figure out you know is just being a straight programmer the best job for you or are there some other job roles in Tech you know that might still involve programming but maybe it''s a smaller portion or maybe there''s some things about your personality that you really you know haven''t 