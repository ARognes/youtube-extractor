mple. >> Correct. And so, >> yeah. Yeah. Yeah. Uh and so really early on, right, if you if you rewind the clock far enough, uh then yeah, the the degree to which people were reusing code for their thing for like their rendering engine, it'd be like cuz I got some code from like Dave or whatever who was or we were both at Atari and somebody wrote this good routine so we used it, right? There was that kind of thing, but there wasn't like this sort of set uh engine. And the time when that sort of maybe you could say first started happening a little more widespread was with things like what ID Software did where they sort of started having like oh you know like someone's going to build something with the Doom engine or someone's going to build something with the Quake engine. There was also the uh the build engine at the time uh made by Ken Silverman and some things like that. So there were there were some early cases where a few people would make a game, but they were making a game very much like that. Like if we did the Doom engine, we're going to make a game very much like Doom. So it really was the case that for most games, people were rebuilding most of the things from scratch, at least for their studio. And studios often their existing code base was kind of part of the value of the studio, too. Like if you are uh think Blizzard and we just built Warcraft 1. Well, rolling all of that knowledge and code into Warcraft 2 is a huge advantage for us because everybody else who wants to build a competitor to Warcraft 1 has to do all of that from scratch. They have to make the path. They have to make the level editing tools. They have to make the rendering. They have to make whatever. And so, you know, that was how things were traditionally done. >> No wonder the games industry is so secretive compared to the rest of the software engineering industry. Like seriously, >> used to be >> used to be at least. Yeah. maybe now it's changing >> and so there were two really big risks typically uh when you started a game project in in those days one was the engine risk would we be able to make something that would be technically able to do what we need to do for this game and that risk comes in a lot of flavors one will it happen at all two will it happen fast enough for us to actually reliably build the game on it right one of the things I mean I don't how detailed an answer you're looking for for this question. So stop me if I'm going down too many tangents, but one of the things you also have to remember is that at that time, and this is sort of still true today, but at that time it was very important, there was no way to really buy something all that much faster than what you had. There was not a huge strata of PCs that you could, you know, buy or anything like that. So the rendering engine, there wasn't like a way your level designers could like be playing on a faster thing than the consumer would have really. you can only have the machine that you have now and if this game comes out in a year that's sort of roughly what the consumers might have or a little bit but you know so there are people who started doing things like buying SGI workstations because those were actually faster enough right and and things like that is what you know you kind of had to do uh and so on so anyway so there was a huge engine risk and some games just failed because they couldn't produce a thing that could technologically do what they needed you saw houses who survived on technological prowess you had ID software that was kind unrivaled at making those kind of first-person engines. You had Bullfrog who had this engine that the pseudo3 engine that they did for like the racing games, Magic Carpet, Dungeon Keeper, like they were all based on this, you know, one core tech and all the sorts of things. There's that engine risk that was huge. And how do you mitigate it? You didn't. You were just grit, right? Because there wasn't a way to buy one off the shelf. So, you were just kind of uh gritting your teeth. The other big risk, and this one is still somewhat true today, but it's just much less because you can start, you could do prototyping early. The risk is, is the game any good? Like, what are we building? Is it interesting? Is it fun? And when you think about this problem of we can't even really run the game as it will be cuz we're just building this engine and we we don't even really have a way to test the game super well. And we can't really build much of a final level because we don't have level editing tools yet. Those are just coming online. trying to guess what you are actually going to be shipping in terms of gameplay is incredibly hard and there are games famous games um I want to say like Thief the Dark Project a very famous game looking glass game uh it was formative in the stealth genre launched a franchise which was Thief you know I want to say uh everything I heard from people on that team was that like the final core gameplay only sort of came together like right at the end right and so the game just could have been a lot more could have been polished a lot more but it just the timing of these things coming together was so hard and so it really was an incredibly different thing and nobody really had a way um around it. Eventually, there was sort of this push towards something. Well, it was basically early vertical slice prototyping where as games started getting bigger and people were like, we can't keep doing this, especially if we're going to be putting millions of dollars on like this is not like an option, right? They started to move toward this thing about look what we're going to do is we're going to focus the entire studio on building one vertical gameplay slice as fast as we can, as hacky as we can. Whatever we have to do, do that. prove that that is engaging to play and then start building out everything else because we simply can't afford to not know what that thing is and then we can start building