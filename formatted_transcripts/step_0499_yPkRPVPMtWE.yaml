transcript: Your TV is almost certainly spying on you, taking screenshots every single second. And  now manufacturers are being sued for it... Also in your hacking news roundup,  Polish police discover a suspicious collection of gear, and is your VPN  reading your conversations with AI. But first, every second, smart TVs made by these  brands take a screenshot of whatever you're watching, from that they compute a fingerprint, a  kind of hash, which is uploaded to their servers, where it's run through a database in order  to identify exactly what you're watching. Whether it's your favourite TV show, an ad  in a commercial break, or the game you're playing on a console, this is all valuable  data that's harvested by manufacturers and then shared with other companies who use  that data to serve you highly targeted ads. And the crazy part is, it doesn't matter if  you're watching via the Netflix app on your TV, or just some device plugged in via  HDMI. Quite literally whatever's being displayed on your TV is being captured. It's called Automated Content  Recognition", 'ACR' for short. It's been an open secret among TV  manufacturers for years, in fact, I couldn't find an example of a single brand that  doesn't do it. But if you've never heard of ACR, it might be because your TV didn't  properly tell you about it, at least that's the claim in the 5 lawsuits, which  are all being brought by the state of Texas. Lets take Hisense as an example, their terms  and conditions talk about, an 'Enhanced Viewing Service', but only after clicking down over 20  times do you find out that this is just a fancy term for ACR. And after setting up your TV,  right at the end of the terms and conditions, there's only one button 'Accept',  there's literally no option to decline. The lawsuit argues this makes the consent  that Hisense obtains, meaningless. After hitting Accept, Hisense captures a snapshot  of the screen every single second. But those are rookie numbers, it's alleged that LG grabs them  every 10 milliseconds. And it's not just video, all five brands are accused of  fingerprinting audio as well. But surely there must be some way to opt out  of ACR altogether? Easier said than done, good luck trying to find the opt out button,  this is something you absolutely need to watch a tutorial for, because the location of the opt-out  is almost never where you expect it to be. For LG it's in the settings under Accessibility and  then support, very unintuitive, makes no sense. As for TVs made by TCL, the lawsuit says  that that after the initial setup you're not even able to opt out... making  me regret my purchase already are we? Each of the lawsuits are seeking at  least 10 thousand dollars per violation, but just a couple days after being filed,  a judge issued a temporary restraining order against Hisense in particular, for  now they're prevented from capturing ACR data altogether . But these lawsuits only cover  Texas, so nothing changes for the rest of us. Speaking of taking back control of your  personal data, today's sponsor DeleteMe help you take on data brokers. Data brokers  are a creepy breed of company who spend their time scraping together your personal data  from all kinds of sources, slowly building what could be a rather extensive profile on  you. Then they'll sell it on to marketers, political campaign groups, or maybe just  some rando on a person search website. Whilst yes, you can manually opt  out of each data broker yourself, something which DeleteMe has  several free tutorials on, there are countless data brokers out there,  which is where DeleteMe can help you out. After signing up and completing a quick  profile, they'll scan hundreds of data brokers for your personal information, and  within seven days send you a personalised report on what they've found. But better  yet, they'll request removal of the data on your behalf. And so long as you stay subscribed,  they'll keep scanning, reporting, and removing! So take back control of your data today  with DeleteMe who are giving you guys 20% off their eligible plans with my link in the  description. DeleteMe is also international, serving multiple countries; just  make sure to click the correct link in the description to take  back control of your data, today! Next up, Polish police stopped a random car  and found a massive stash of espionage gear. This went down in Poland's capital  when police made a routine traffic stop. The 3 men inside were all Ukrainian  citizens, claiming to be on a road trip, travelling around Europe. But police say,  they quickly became "visibly nervous". That's when they decided to search the vehicle,  finding a suspicious collection of items. None of this stuff is illegal per se,  well apart from this thing potentially, but we'll get to that. But having all  this in one place is a little sus, and these guys weren't on their way to Defcon. The  trio claimed to be IT specialists, but couldn't explain why they had an espionage toolkit  in the back of their car. And when pressed, they suddenly forgot how to speak English,  apparently, and started playing dumb. So what was seized? We've got a flipper zero,  the limited edition transparent version no less. What appears to be some kind of signal  jammer. Several SIM banks, the kind that can send text messages en masse, we've become  quite familiar with them in recent videos. This thing is pretty cool, a multi function bug  detector. If a room is bugged with hidden cameras, this thing can illuminate their lens  making them really easy to spot. It can also apparently detect the  wireless signal emitted by trackers, would be interesting to see how that performs irl. It's the kind of thing I would have absolutely  no use for, but definitely want, and you can find them on Amazon for less than $100. Just try not  to get pulled over in Poland with one in you car. As for spy cameras, here we have two,  these things support 4g so you can stick in a SIM card, of which which these guys  have many, and watch the feed remotely. I also want one of these,  they're portable routers, but with 4g support so you  can spin up a little hotspot. What looks like a car key is actually  a programmable remote control. It's marketed for controlling things  like garage doors and blinds, but I don't think that what  our Ukrainian trio had in mind. This, looks awfully similar to a raspberry  pi case, and if we up the brightness the ethernet port is right where you'd expect.  And this is just a SIM card size adapter, so they can fit their SIMs into their Thinkpad. In true law enforcement style, Polish police  chose the most dramatic music possible for the video of their arrest ... The seized gear  is now in the hands of Poland's cyber police, with the Ukrainian trio have  been charged with several crimes. But aside from the signal jammer, none  of this stuff is illegal in Poland, but not being able to explain why you  have an armoury of espionage gear, when you're from a neighbouring country that's  currently at war, is definitely rather suspect. And all three guys have been booked into the local jail for 3 months while an  investigation is underway. Next up, is your VPN spying on your conversations with AI chatbots? This one is, well,  according to researchers at koi.ai. On the surface, if you're looking  for a free VPN for chrome, 'Urban VPN Proxy' looks like a good choice!  Their extension has great ratings, millions of users, and and even has  a featured badge, meaning that Google themselves have reviewed it, making sure it  has good security, privacy and performs well. However a few months ago, something changed about 'Urban VPN'. Version 5.5 was pushed to  users, which introduced AI harvesting. Now, regardless of whether the VPN was enabled,  it would monitor your browser tabs. And as soon as you opened your AI chatbot of choice, the  extension would inject code into the page, which essentially man in the middles the  network requests sent to and from the website. Your prompts, the AI's responses  and timestamps would all be grabbed, before being neatly compressed and  sent over to Urban VPN's servers. The extension's description  said this was for all for, 'AI Protection'. They'll scan the responses  of AI chatbots for suspicious or unsafe links, which in fairness is an actual problem. But  they'll also scan your prompts for personal data, making sure that you don't accidentally  overshare, because who knows what openAI might do with your private chats, they might  sell them to data brokers or something. But that's exactly what Urban VPN was doing,  with this little nugget hidden deep in their privacy policy. But don't worry, in most  cases, they'll even anonymise your prompts. In fairness, UrbanVPN's consent prompt did  mention they process ChatAI communication, but if you installed the extension  before the sussy update which many of the six million users probably  did, you would've been automatically updated to the new version without  ability to hit the decline button. But it doesn't really matter because  Google's policies explicitly prohibits extensions from selling user  data to third parties anyway. So the extension has quietly  vanished from the chrome web store, along with a few other extensions that the  researchers said have the same functionality. But the extension still exists as an Edge add on, with in total 8 million users having  downloaded the affected extensions. Apart from never trusting a free VPN to 'protect  your privacy', the other lesson here is to be super careful with browser extensions in general.  Even seemingly basic functionality often requires full access to all your browsing data, and  there are documented cases of extensions being perfectly fine for years, only to suddenly  turn malicious with an automatic update. As always thanks for watching, and I'll  see you in the next video, have a good one!
