transcript: April 30th, 1970, Vietnam-Cambodia border. Reving engines and the smell of diesel, steel tracks pressing dirt roads. The US 11th Cavalry Regiment is on the move, crossing their column of tanks and armored transports into Cambodia. Helicopters tip overhead, scouting from the air and ferrying men of the First Cavalry Division into hostile territory. Working in concert with the Army of the Republic of Vietnam, or ARVN, their mission is to strike into Cambodia to encircle and destroy the North Vietnamese headquarters elements and bases used to make war on the South while sheltering in Cambodian territory. Though a few days earlier, these very men had laughed when they were told they were going to Cambodia because the whole idea seemed unthinkable. For Richard Nixon had been elected less than 2 years before on a platform of drawing down and ending the war. He'd recently promised the bitterly divided country to bring 150,000 American troops home within the next year. Meaning there'd been no attempt to sell an incursion to Congress or the American people. Yet here they are, heading into enemy territory blind since the mission had been so secret, there hadn't even been reconnaissance flights. It's a mission that will result in over 1,800 US casualties for little discernible gain. But the deaths most seared into the American psyche will surprisingly not come from those fighting the war, but rather those protesting it. Four dead in Ohio, shot by American rifles at Kent State University. >> [music] [music] >> Today's important historical tale was made possible by the fine folks over at Helix Sleep, who we thank for sponsoring this episode. The Oval Office, April 30th, 1970, 90 minutes later. Richard Nixon announces that US troops have just entered Cambodia to destroy communist bases making war on South Vietnam expanding the war to another country. >> We take this action, he says, not for the purpose of expanding the war into Cambodia, but for the purpose of ending the war in Vietnam and winning the just peace we all desire. >> The address is at its heart an after-the-fact justification and attempt to square this action with his promises to end the war. Due to the secrecy of the operation, he's also neglected to consult Congress on the incursion apart from briefing a couple of largely friendly senators. Knowing he'll receive sharp criticism from the anti-war movement, especially on college campuses, he then tries to frame the expected opposition as enemies of civilization. >> My fellow Americans, we live in an age of anarchy both abroad and at home. We see mindless attacks on all the great institutions which have been created by free civilizations in the last 500 years. Even here in the United States, great universities are being systematically destroyed. >> It's a speech that speaks to the country's huge divisions both over the war and Nixon himself. Richard Nixon had been elected in 1968 partially on his promise to bring the war to a close and to end the draft. Yet despite a heavy win in the Electoral College, he only had a razor-thin edge in the popular vote. So, with the country already bitterly divided over his presidency and Congress incredibly hostile to any expansion of the war, would he really cross both that literal and figurative line? It turned out he would. Now, our modern vision of Nixon is highly colored by Watergate and all of the things we know about the malfeasance and dysfunction in his administration. But, it's also important to remember that in the 1968 election, he had run largely as a more moderate Republican candidate, and lots of ink has been spilled about his quote Southern strategy of using racial dog whistles, and we should definitely acknowledge that. But, in the Republican primary, he was running against an out-and-proud segregationist. And part of Nixon's law-and-order message was so effective because there really was fear of domestic unrest in the country. There had been the wave of assassinations from JFK to Malcolm X to MLK to RFK during the 1968 Democratic primary. Also, during the Democratic National Convention, left-wing protest groups, including those protesting the Vietnam War, had not only picketed the event, but brawled with police and caused property damage. Not to mention there had been race riots in multiple cities, all of which we can't ignore included police violence as a component. So, all of that helped Nixon's law-and-order message carry the election along with promises made about the war. Though, in an echo of today, once Nixon was in office, voters found that his promises about the war were a bit more complicated than advertised. Nixon's much-touted and very non-specific quote secret plan for ending the war was a process called Vietnamization, essentially to turn a larger amount of fighting over to the ARVN in hopes of withdrawing US troops. After all, South Vietnamese units had been fighting alongside US forces, trained by the US, and using US equipment for years. Of course, the reality of this was far harder than it looked on paper. Knowledge transfer from English-speaking military advisers to Vietnamese-speaking officers was a slow process, especially when it came to technical roles like helicopter pilots. Then, of course, if one was killed, the process had to start all over. Still, by the end of 1969, Nixon had pulled 25,000 combat troops out of Vietnam with a promise to remove a further 150,000 in the next year. So, there really was a sense that the war, which by the end of 1969 had led to nearly 49,000 American combat deaths, was finally drawing to a close. Except, it wasn't. Again, in 1969, 283,586 men were drafted, only 11,000 less than the previous year. And there still was the issue that the draft was very obviously unfair. Local draft boards often favored drafting lower-income men and racial minorities, while young men from higher-income groups were able to exempt themselves by getting married, enrolling in college, or getting a diagnosis with something like, I don't know, something random off the top of my head, bone spurs from a friendly physician. So, as a result, in December of 1969, the US instituted the draft lottery system, where certain birthdates were randomly drawn from a jar and assigned a number to order who would be called up first. Not only did this give the draft an air of a ghoulish game show, but the capsules were also improperly mixed, leading to a disproportionate number of December birthdays being picked. Now, this did remove a lot of the loopholes people had been using to avoid the draft by enrolling in college, which did indeed make the draft more fair, but it also came in the aftermath of the Tet Offensive and first media reports of the My Lai Massacre, where US soldiers murdered between three and 500 Vietnamese civilians. Increasingly, young people, especially on campuses, saw this war as both doomed and immoral, especially since the war had now been going on long enough that young people who were eligible for the draft had watched flag-draped coffins come home for 5 years. The highest toll had been in 1986, where nearly 17,000 young Americans had been killed. So, this was deeply personal. These were brothers, neighbors, fathers, friends. Those that did return often had injuries both physical and psychological, and yet it increasingly looked like all this just might be for nothing. So, unsurprisingly, on America's college campuses, there was increasing resistance to things like ROTC programs, where college students volunteered to train as officers and serve after graduation. Campus protests also targeted research programs tied to the military and the presence of recruiters on campus. And the new round of the draft felt like it targeted these exact college-educated groups that tended to oppose the war. Then, of course, Nixon's announcement about the Cambodian campaign inflamed those already red-hot tensions. Interestingly enough, part of it was a messaging problem, as Nixon did not emphasize how small US troop commitment to this operation was and how it was largely an ARVN affair. Had he done that, it might have looked a bit more limited in scope and not appeared like an entirely new front of the war. But, his overly belligerent Cold War language about proving America's superpower status undercut his message that the operation was intended to take pressure off the South and allow the promised withdrawal. But, you know, on the other hand, even if he'd messaged it perfectly, there of course was a credibility problem. This wasn't the first time an American president had promised the fighting in Vietnam was almost over, only to have it explode with a new intensity. And the fact that he'd only alerted a few friendly senators made the whole thing feel underhanded and illegal. Nationwide campus protests greeted his morning message, organizing in a few hours through word of mouth, landline phone calls, and flyers. By noon on Friday, May 1st, around 500 students gathered at Kent State, burning draft cards and discharge papers. The protest organizers, a group of history students called Oh, boy. The World Historians Opposed to Racism and Exploitation, you can work out that acronym for yourself, held a funeral for a copy of the US Constitution and burned it. As far as they were concerned, Nixon had overstepped the authority of the executive branch and killed the document. During the speeches, organizers passed the word of joining a planned national student protest on the next Monday, May 4th. The gathering was peaceful, but that night, things got tense. Down the college bars on Water Street, there was an air of hostility, especially towards the police cars that occasionally cruised by, which were a normal patrol on a Friday night with thousands of students and other young people at the bars. For several speeches that day had emphasized the role of police violence against anti-war protesters and civil rights marchers. Then, a local biker gang began taking over the street, doing wheelies and tricks. Traffic backed up, someone dumped a trash can in the road and lit a small fire. Students danced in front of stopped cars, challenging stranded drivers for their thoughts on Cambodia, and crowds began chanting anti-war slogans. A few people, already drunk and angry about bars turning them out and shutting their doors in response to the protest, began to throw bottles and pitchers at police cars. Responding to exaggerated reports of a large bonfire, Kent's 21 police officers responded in force at 11:45 p.m. along with around 90 special deputies from the county. They began to sweep the street, pushing the crowd back and ordering the bars to turn out all patrons. Then, as this played out, a small group of protesters, less than two dozen, began to throw bottles and stones at buildings, breaking windows and doing around $10,000 of property damage. And when all was said and done, by 2:00 a.m., the streets were clear, but things had already been set in motion. By that time, the mayor of Kent, who like many mayors had a strained relationship with a university in their town, had already contacted Ohio Governor James Rhodes, telling overblown stories about bonfires in the streets and $50,000 worth of property damage. He claimed, without evidence, that the far-left direct action organization, Students for a Democratic Society, and its militant wing, the Weather Underground, were coordinating the protests. This was a bit of a boogeyman, for in October of the previous year, those groups organized the Day of Rage in Chicago, a series of riots meant to, quote, bring the war home by causing property damage. They were also known to be planning and conducting bombings of infrastructure. Governor James Rhodes, a virulent anti-communist who saw organizations like the SDS as traitors, then called the National Guard Liaison about a possible deployment. Turns out they were already in action in nearby Akron, Ohio, where they were tamping down a Teamsters strike. Meanwhile, as the morning of Saturday, May 2nd dawned, with students showing up to the damaged district offering to help clean up, local business owners rebuffed them, angry at the property damage. The mayor, hearing more from business owners who claimed to have been threatened and still believing the SDS had infiltrated campus, declared a civil emergency. All alcohol, firearms, and gasoline sales were banned, and the city would be under curfew from 8:00 p.m. to 6:00 a.m. University officials agreed to an on-campus curfew at 1:00 a.m. No peaceful demonstrations would be allowed. At 6:00 p.m., the National Guard is officially called into Kent. Meanwhile, at 7:30 p.m., a crowd of 600 begins marching through campus chanting, "Hey, hey, ho, ho, ROTC has got to go." They move towards the empty ROTC building, and stones begin to fly at the structure. The previous night's campus police had put the building under guard, but tonight it was wide open. A few demonstrators then throw road flares at the building hoping to light it. Others move close trying to start a fire directly and burn the building. But, it takes a full half hour for to actually light. By 9:00 p.m., Kent Fire Department arrives on the scene, but with no police escort protecting them. They only last 15 minutes. Rocks fly in their direction, and demonstrators get behind them as they spray the building and slash their hose lines. The firefighters then retreat as campus police finally come in firing tear gas into the crowd to try to disperse them. At this point, law enforcement gets the crowd to back off, but not to return to their dorms. They go up the pre-arranged escalation ladder. They call in reinforcements from the sheriff's office, then the highway patrol. But, as the police deal with the demonstrators, the fire regains purchase, and the ROTC building fully burns. Now, like the responding police, the demonstrators are also not a single entity. For instance, when someone sets a storage shed alight, demonstrators and professors manage to put out that fire themselves. Students who came only to watch are also swept up in the chaos, and faculty marshals, marked with white and blue armbands, try to keep some kind of order. At 10:10 p.m., the firefighters returned, this time accompanied by two units of National Guard. Rocks clack off their vehicles as they drive in, and one guardsman is treated for an injury. But, they also have bayonets fixed, their only option for crowd control other than deploying tear gas or firing live ammunition. Then, when faculty marshals approached the National Guard to coordinate, they instead raised their rifles, helmeted forms lit by the flames of the burning ROTC building. Faculty scrambles away as uniformed military troops begin to drive the students back into their dorms. The war has come to Kent State. Now, before you continue on with your YouTube journey today, two quick extra pieces of information for you. First of all, this series continues in 2 weeks on September 5th, and second, our ability to keep telling these kinds of stories is directly tied to people like the wonderful folks over at Helix Sleep for supporting both this channel and, you know, my ability to get a great night's sleep. So, in case you actually missed it last time we talked about this, I used to be a terrible sleeper. I tossed and I turned, I would wake up with back pain more often than not. [music] And then, a few months back, I finally had enough and just like deep dove into mattress research, which I don't need to tell you is a lot. But, Helix Sleep kept coming up again and again and again, so I went to their site and took their sleep quiz, which not only gathered stuff like my body type and sleep preferences, but also my wife's. And then, their recommendation took both of us into account, which I really appreciated. Now, of course, there are things you need when thinking about ordering a mattress online, and luckily, Helix had them