transcript: One of the things I get my mentees to do is I have an entire training on asking good questions, right? Because this is a skill that they need to have at the workplace, right? And asking good questions forces you to understand what it is that you're trying to achieve, what it is that you don't know, what it is that you've tried. And it's the same principle So, the same principle applies to well, what do I need to learn? You know, that that is not a great question. A better question is what do I need What am I trying to achieve? What do I need to learn today to get me closer to that directionally? And what do I not need to What do Answering the question, what do I not need to learn, in my view, helps a lot with then choosing what you need to learn. So, one of my students, she had a problem and she was asking and she asked good questions and rather than give her the answer directly, I was training her to ask better questions because then she could sleuth and investigate her way to the answer. Yes, it was longer, it was more painful, it took a lot more time for me and it took a lot more time for her, but she was learning critical skills in the process.
