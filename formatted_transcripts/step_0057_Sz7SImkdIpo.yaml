ctionality that you would need to probably use in your react application anyway as an opinionated set of defaults that are easily extensible and easily customizable so routing is included in the framework by using next router by creating a new file at pages slash index.js or about.js you can use file system based routing to easily create the different routes in your application it has image optimization built in using the next image component there''s react fast refresh so it''s very easy to work with the framework locally and see fast rebuilds and have a great developer experience to host files all you need to do is drop them inside of a public folder there''s built-in support for css and sas and it easily works with popular libraries like tail and css if you need to do serverless functions or any sort of back-end functionality you can actually merge the front-end world and the back-end world using api routes by just making a new file at pages api user.js or something similar there''s even support for internationalized routing typescript support and last but not least a really important one is code splitting and bundling so when i visit the index right of my application we''re only serving up the javascript for that route which means that our pages are going to be more performant because we''re shipping less javascript to users and it also if there was an error on the about page or the contact page that javascript would be in a separate bundle which helps improve the resiliency of your application as well and that''s all configured out of the box so you don''t have to do anything so lots of great defaults in the next js framework and because of that we''re seeing nextgs growing very quickly so over the past couple years it''s became the most popular framework for building react applications and excitingly we''re seeing it being used from the medium to large size businesses all the way up into the enterprise so lots of great logos on here that we love to see using next.js and lots of happy customers and as i mentioned at the start of this i work at versailles which is the easiest way to deploy your react applications and our mantra is develop preview ship so you start by developing your next.js application taking these building blocks of react components and providing a great developer experience then you push it to a get branch and you get an automatic preview url where you can view your changes collaborate with stakeholders and share across your company to developers or designers or leadership then you just simply merge your branch into production and it''s immediately available on vercell''s global edge network and it takes care of all the hard things for you like setting up domains and dns and ssl encryption asset compression cache invalidation all that stuff are automatically handled by versailles edge network with a nice user experience and developer experience to go with it so that''s the company i represent and they''re also the creators of nextgs and what i want to talk about today is the different data fetching strategies with nextgs because it''s something that i see people get tripped up with a lot so we''re going to start off with the most basic next js application you could start here with just mpx create next app or by adding next react and react on to your application and then all it takes to build an xgs application is one file so pages slash index.js or about.js and when you export a react component from your file that''s all it takes and this file will be pre-rendered to html on the server now there''s a variety of different data fetching methods that you can do with next.js you''ve probably heard of some of these you have client-side rendering server-side rendering static site generation and you also have incremental static regeneration which we''ll get to here very shortly so the the first concept that i want to talk about is pre-rendering so no pre-rendering is a plain react.js application on that initial