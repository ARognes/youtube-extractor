in us in welcoming becca bailey hi i''m becca i''m a software engineer and engineering manager at formidable and today i''m going to be talking about refactoring and sharing some strategies for how we can hopefully make refactoring one less stressful thing that we have to deal with this year for those of you who are not closely following american or japanese popular culture marie kondo is the author of the life-changing magic of tidying up as well as the star of the life-changing manga of tidying up and a netflix series a couple years ago i decided to read her book and i attempted to put her principles into practice in my messy 600 square foot chicago apartment i really expected to hate this entire experience but actually i didn''t in addition to learning some new folding skills i learned about how reducing the number of things that i own helps me to better appreciate the things that i have and when we know and appreciate the things that we have it turns out that we''re less likely to leave them lying around on the floor so this got me thinking about how to connect these these practices to the code that i write because there are many days when none of my code brings me joy but unfortunately just throwing it away is not a viable option so this brought me back to the concept of refactoring what is refactoring well according to the book refactoring by martin fowler code refactoring is the process of restructuring existing computer code changing the factoring without changing its external behavior so there''s a word in there that we might not be familiar with which is factoring and factoring refers to the internal parts of a program or the implementation details so let''s note that if we''re making breaking changes to the public-facing api of a library or even a top-level component while this is often necessary it''s not actually by definition refactoring refactoring means changing the inside without changing the outside this brings me to my personal definition of refactoring to me refactoring is an opportunity to change your mind and ask yourself what decisions would i make differently if i could write this code again sometimes when we talk about refactoring we''re referring to the process of modernizing our syntax in react this might involve refactoring from a class to a function component replacing deprecated life cycle methods or converting state and life cycle methods to hooks this is often a great and necessary thing to do but i think this is a separate concern from refactoring for code style and readability modernizing your syntax is a part of refactoring but at least for me it''s not the entire reason that i refactor you might discover that using hooks context suspense or other modern react apis might aid you in your pursuit of human readable code but in my view modern syntax is a tool and not an end goal when refactoring refactoring isn''t just about code quality either in my experience the pursuit of artfully crafted software can lead to a lot of pride about your work but unless you''re deliberate about respecting deadlines embracing alternate viewpoints and collaborating with your team it sometimes just makes software engineering more exclusionary to people who don''t subscribe to a specific set of engineering principles one of the things i really loved about marie kondo''s philosophy is that it''s not just about buying stuff from the container store and redecorating your house to make it look like a beautiful minimalist magazine cover likewise the end goal of refactoring isn''t to have perfect or beautiful code for its own sake so when do i refactor when i organized my apartment a couple years ago my goal was to feel less stressed every time i came home from work after dealing with this anxiety for a few months i knew it was time to reorganize likewise there are some things that tell me it''s time to refactor my react code my general rules are to refactor when your code is hard to test hard to understand or hard to change for example if you find yourself mocking out a lot of external libraries or walking on eggshells around your code base or just scratching your head a lot when you try to read your own code it might be time to refactor but more specifically here are some things that i see in react projects that clue me in that i might need to change some things these things include out of control props so usually if i have 27 props on one component that tells me that there''s something wrong nested conditionals so conditionals that are really hard to follow confusing variable names or components that are doing too many things that are uncertain about what their responsibilities actually are these are some general best practices as i know them but i''ll tell you this if you do your job for a while if you do regular code reviews and collaborate with your team and practice refactoring i promise you you will develop your own sense for knowing what to refactor a couple more things to note before we move on first of all it''s really common to think about refactoring as a negative thing as something that only happens when we write bad code i call this get blame refactoring however refactoring doesn''t mean that you or someone else did something wrong maybe you made the best choice you could with the knowledge you had in the moment but now you have more information or more expertise and you''ve changed your mind it''s okay to change your mind there''s no shame in refactoring or having someone else refactor your code so as we''re talking about how to refactor let''s talk about discarding a key tenet of marie kondo''s philosophy is to start with discarding while i know most of us have some amount of legacy code to maintain and we don''t have the ability to just throw out everything that doesn''t bring us joy it''s also not unusual for us to hold on to code that we don''t need anymore maybe it''s a class that your co-worker wrote a year ago that you don''t quite know what to do with or some