 your component organization and that will help your refactoring to go a little bit more smoothly so for me i like to think of refactoring as a daily practice every time we refactor we have an opportunity to leave something a little better than we found it now i haven''t sent out an official survey but i''m willing to bet that the number one reason why we don''t refactor all our code all the time is because we don''t have time when there are looming deadlines and any number of things going on in the world right now the struggle is real so rather than refactoring all at once the more we can make refactoring a part of our daily routine at work the easier it will be to find the time and to get the buy-in from our team i don''t think it has to be a prioritized item on your backlog by itself it can just be something that you take an extra few minutes to do while you''re working on a new feature or even just when you have a few spare minutes when you are when you''re to clean up something that you''ve already done now i don''t want to get anybody in trouble here but i''m going to say that most of the time you probably don''t even need to mention it to your product manager that you''re doing it but speaking of product managers how do i get other people on board especially when we have bigger refactoring work to do because sometimes this is where it gets really tricky if we don''t have a team that values thoughtful code reviews and collaboration chances are there will be someone organizing their one little drawer for all the rest of your house stays messy or worse you will all be organizing your drawers and there will be a different system for each one and there will be no consistency one of the best things you can do for your team is to be consistent in code quality and style so the goals when refactoring are clear this might mean making some compromises with your team members about code style and how you''re writing it sometimes in my experience it helps to document the t