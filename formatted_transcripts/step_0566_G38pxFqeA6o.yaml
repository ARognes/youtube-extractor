transcript: Hey guys, so today you and I are going to talk about AI code and security. So let's get into it. So the question in question was, "Hi Frederick, is it safe for companies to rely on AI generated code?" Yes, I would say so assuming now that the person who generated the code has the knowledge to evaluate if the code is safe or not. And that is something that is an ongoing debate and a source of endless confusion for my security department and probably a lot of other security departments. Let me tell you why. So I have very recently been part of a move for the organization that I work with to move all the developers to understand that we want you because we have like GitHub enterprise Q Amazon Q and so forth and so forth set up with copilot and etc etc and we want people to start using AI. Now the thing is though that our software developers need a little bit of a nudge in order to start doing it because of course they have to adjust to using AI in their tools like as a part of their tool suite. Now the thing that has happened which usually follows learning the benefits of AI is that you start trusting the AI more and more and you forget that it does make mistakes. Now, when we talk about security, I think it's fairly safe to say that at least as of right now, there aren't all that many pentesters that I know of at the very least or like white white hat hackers and so who have figured out how to prompt the AI models to inject malicious code by default. So, usually the AI is benign. It's always most of the time going to generate a it doesn't have to work the code in question, but it's not going to like try to exploit like embed viruses or anything like that in your system. But regardless of if that is happening or not, the dangerous part about shipping AI software is if you don't know what the code does, you have to be pretty pretty sure that you have some way of evaluating it. Now, if you're going to lo run a little local script on your own computer or something like that, you don't actually have to know all that all that much about programming to do it. I mean, guys, if you are I mean, even if you are a layman who has never coded in your life, I on average, it's going to be pretty safe for you to, you know, ask the AI to build you a Python script that renames your files or does whatever you might want to do, right? because you can for the most part trust that the software that is being generated is safe for use. But when it comes to security and things of that nature, it becomes a little bit more tricky for people who are doing it as a prof as a profession because when we ship say web applications to the web, the AI may not necessarily think about things like security headers, you know, escaping special characters or other s forms of exploits. I mean even not even the software developers are thinking about that stuff. I can honestly tell you that. But AI is as I was saying like it's not a thinking organiz thinking like human or like a person who's just going to consider all the factors that may go into writing the code. So if you tell it to write some code, it's going to write that code, but it may not think about the security aspects of it, which again should be fair, not a lot of software developers do either. That's the thing that our security people in my current organization of course are worried about. Some of them are not all that knowledgeable. So of course they want people to review AI generated code or then they worry is this safe, is it not safe and I always tell them the same thing. Of course, it's safe assuming that the code is readable to a software developer and that that software developer has reviewed the code and that software developer has some at the very least basic knowledge of how exploits work, how like malicious code looks and how you can you know attack a system and things of that nature. So for companies I would argue that it's absolutely safe but even so they should follow basic practices and that is the key element here which is that you need to understand how to do things like you know static static analysis of static application security testing or SAS like basically having check make sure that you're using like when the AI is pulling in say libraries or stuff like that make sure that you have some type of knowledge about those libraries, are they safe to use? Is it something that might come up in an alert? Like we have many tools that can like do a basic check for like MBM audit if it you're using MBM and other sim depends on your language of course that can check whether or not these libraries have some malicious code in them or some exploit or something like that. And then of course you still would like you should use tools like say SAP or burpuite or some other scanner for doing like dynamic or dust scan. So dynamic application security testing and things like that because as I was saying even the generated code may not account for security issues that come with once the application is running. If you do these two things which you should be doing even even if it's a human and you have code reviews and these basic practices then as I like to tell people like who what makes what's the difference? The characters being written into the file could be written by a human or it could be written in a fraction of the time by an AI. If you just have the same reviewing process and the same security consideration, it doesn't matter who wrote the code. And that is the perfect state to be in if you ask me at the very least. And that's how I set up all my pipelines and my team dynamics and so forth and so forth. Because I might have a junior software developer or I might have a senior software developer or now I might have a junior with an AI or an AI cassin with an AI. It should not matter your review process and your security testing process should not care who wrote the characters in the file. It should go through the same process and still find malicious code in the packages or third party dependencies stuff like that. Make sure that you know you do some analysis of the you know the actual web application or stuff like that so you don't forget security headers or escaping characters and stuff like that. If you as long as you're doing that companies can absolutely trust that the AI is safe. So what I want you to take away from this is that I suggest that you get with the times and you say I for your work. I am still going to tell you that especially if you're a more junior software developer or something like that be a little bit careful with using it too much because as you can imagine if as in my example I mean I do it too guys when it gets to things get too convenient and you get used to having the AI do most of the work for you then basically you stop thinking about what's being created and that is the dangerous part you can't get lazy here because as I was saying that's how the security issues usually come in and that doesn't really matter if it's the AI or if it's a human security is usually not something you're going to see the AI adding by default. So you have to consciously think about it and to be fair that is true for a lot of developers. Even my most senior software developers that I work with won't consider escaping characters or you know these sorts of things by default. So we usually that's my tip to you. Always have dedicated test strategies for the security part. And the easiest way to add it to right now, you could do it immediately if you wanted to, is to make sure that you're scanning your thirdparty libraries for like outdated versions or versions that have been exploited or things like that. Make sure that you have some type of dynamic application scan where you start the service locally run like SAP is free if you want to use it or Burpuite if you have a little bit of cash to spare to like do scans or I mean there are other tools that you could be using. These are just the ones that I like. And make sure that basic injection attacks and stuff like that won't work on your application. And then it doesn't matter really if it's an AI or if it's a person doing it. I mean, you can even tell the AI that once it has created the like have a checklist. Once it's created the code, ask it again. Make sure that there are no like injection attacks, possibilities, etc., etc., escape characters and so forth and so forth. Then it's going to fix that for you. It's the same thing I do with the code reviews where when we read through the code for whoever, doesn't matter if it's a junior or a senior, you notice that oh, they forgot A, B, and C and this might be a security issue and so forth and so forth. In many cases, an AI might be even better at sparting potential security threats to you if you just prompted to do so. But there has to be a step for you to make sure that that is happening. So, make sure that your deployment process and your view checklist always includes that part to consider security and then it should be fine for you to use AI. Have a great day.
