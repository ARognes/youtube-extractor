transcript: if I was starting a project tomorrow this is how I would do authentication I would set it up myself especially for the MVP which usually only needs a simple way to log in I don't have anything against paying for an authentication Service I think the philosophy of Outsourcing both devops and oth is a totally fine methodology especially if you're bad at it for whatever reason I've always preferred to minimize the number of SAS services that my project relies on and learn to set up my own systems speaking of services the one I always get is a VPS to host my server which brings me to today's sponsor hostinger if you go to hostinger.com bowad you can sign up for a limited time deal you're going to want to choose your plan and this is where hosting air really shines because they offer longer term bps's they have insane pricing I'm used to paying double if not triple for the same resources and you could go for the KVM 1 to start but I just like going with a KVM 2 only for $2 more you get double the specs and this is just a good way to start your project and you'll be able to handle any traction you get at the beginning and then pick the link that you want I'm going to go for 24 months for the best savings and make sure to scroll down and press have a coupon code and put Ben aad for additional savings yay go ahead and fill this out and submit the form afterwards it'll take us to the dashboard and we'll set this up pick the location that's closest to your users Phoenix will work well for me I like to go with auntu for the OS you can keep this on make sure you save the password you create and your setup is done just give it a few minutes to boot up we're going to copy this and go to our terminal paste it in yes and then put the password you have from earlier and Bam you're in you now have access to your VPS check the description of this video for a GitHub repository link that'll walk you through how to deploy your authentication stack decision number one I'm now a big fan of starting projects with only ooth AKA login with Google the main reason is it's simpler from a coding perspective and when you're onboarding new users to your project the initial sign up is faster you don't have to ment email confirmation or forgot password Google will handle that for you there is one caveat though not all ooth providers do the same level of validation Discord for example lets you create an account with any email you want and then just log in to OA services that require Discord I can create a Discord with the email Zuck face.com and then log in to any website that has log in with Discord now after a user signs in I believe Discord does tell you whether their email is verif ified or not so you can in your server check and decide whether you want to allow that user in I just was surprised by that being the default behavior for Discord ooth I would have considered that users's account not officially signed up and so they shouldn't be able to log into other services since you don't have to implement forgot password and confirm email most of the time for many projects I don't even buy an email provider cuz I don't need to send any emails now some of you might still want to do email marketing in which case sucks to suck you got to buy it in my opinion the biggest down side to oo is you're relying on another company so if their off server goes down users cannot log into your website so keep that in mind I think it's fine trade-off because Google and Discord their off Services aren't down very often at all and if they are they're not down for very long it's also good to note that if a user's Discord account or Google account gets banned or deleted they can no longer log into your service with the account that they had before so keep a backup plan intact for scenarios like this this happens extremely rarely what I'll usually do is have the user send me an email from the email that they have on their account for verification and then I'll just attach another Discord to their account and they're good go okay let's talk about how this actually works now after user presses the login with Discord button they'll be sent to your server your server will most likely be using a library like passport.js if you're in the nodejs world and you'll redirect them to Discord to put in their credentials once that's done successfully Discord will send that person's Discord profile to your server there might be an intermediate exchanging of tokens but your oaf Library will usually handle that for you your server will take the Discord profile and grab the Discord ID of that user and look it up in your database to see if you already have a user with that Discord ID if you do congratulations you now know who the user is and if you don't you just need to create an account for them which usually means inserting them into the database here's another big decision point now that you know who the user is you need to decide how you want to keep them logged in as they continue to use your website or app the most popular two options are session storage or jwt's which stands for Json web token sessions are simpler you create a table in your database and you store and create a temporary ID usually called a session ID and you map that to a user ID that the user session is for you then give the session ID to the website or app and every time they make an API call they send up that session ID and you can look up who the user is one nice benefit of this is you can revoke anyone's access at any time by deleting the session in the database and the user would have to log in again the downside of sessions is every time that the website sends an API call you have to do a database request just to see who the user is common way to combat this is instead of storing the sessions in your database like post SQL you store it in a place like redis which is faster to query and as a built-in way to expire data even then you might want to avoid the database or reddis call altogether or you might be in a scenario where it's difficult to do say you're doing microservices in that case you may want to consider jwt's a JWT is a special type of token that is created with three inputs some data that you want to store commonly you'll stick the user ID in there an expiration date when the token is no longer valid and a secret string that is used to cryptographically sign the token data inside a JWT is public anyone can decode and see what's inside even if they don't have the secret string but the reason we sign it with this secret string is for validation purposes when you send the token to your server or another microservice use the same secret string to validate you made the token because you're the only one that should know what that secret is also part of the validation is making sure that the token is not expired it's convenient not to have to do a database call to decode and validate the token but the downside is is you can't invalidate this token early if you want to if all you're doing is checking the secret and the expiration date if you had a button on your website that a user can press to log out of all devices you would need to terminate tokens early to implement that functionality but if that user was already logged in on their phone with a JWT that expires in a month you kind of just have to wait a month for that to expire unless you change the signing secret but that would invalidate all tokens for all users and essentially log everyone out of your website you usually only do that if you get hacked or something trick to making this work is having your jwt's be shortlived say they only last for 5 minutes or 1 hour or 4 hours depending on how fast your application needs to invalidate tokens if we stop there the user is just going to be logged out every 5 minutes or 1 hour which is not ideal so what we do is we introduce a second token which lasts longer and it's usually referred to as the refresh token so when a user logs in you now give them two jwt's a shortlived one which is usually called an access token and then the refresh token which I usually have lasts for a month or so but you can decide how long you want the user to be logged in for when the access token is valid you can do API requests but when it expires the server then checks the refresh token first the server will validate the secret and expiration of the refresh token then check the database to make sure that the user is still allowed to be logged in and if so it will create a new access token and give it back to the user I also like to give the user a new refresh token as well so they get a fresh 30 days of access so in this scenario if your access token lasts 15 minutes you only have to do a database call once every 15 minutes to generate a new access token whereas with session if you did 100 API calls in 15 minutes your server would do 100 database requests just for validating the authentication now back to our example button that allows the user to log out of all devices this is how you would implement it with the JWT setup a simple method is to store a refresh token version on your user table and then whenever you create a refresh token you stick that version inside of it then when you validate the refresh token you check whether the version matches the one in the database and if it doesn't the token is considered invalid so let's say a user logs in on their phone and then logs in on their computer and the current refresh token version is set to one as the user uses the website every 15 minutes when the access token expires the server will check the refresh token and make sure the version matches the one in the database and if it does it'll give them a new access token and they keep going then when the user presses the log out of all devices button you increment the refresh token version field and immediately all the refresh tokens are invalidated now it's important to note this isn't do do anything to their access token they just can't get a new one unless they log in again so when the log out of all devices button is pressed it's going to take a few extra minutes for it to take effect on all devices as you wait for the access tokens to naturally expire on one device they might have an access token with 2 minutes left on another they might have 4 minutes left and you just have to wait and again you get to decide the maximum amount of time that you want to wait for these tokens to expire by setting what you want the access token expiration date to be and you just have to weigh that against how often you want to be doing database requests to create these new tokens I've been using jts lately but whether you decide to use them or sessions you still need to decide where to store the tokens on the user's computer or phone to keep them logged in for apps it's easy if you're using react native you just use this thing called Secure Storage and you're good to go on websites you get the pleasure of choosing between cookies or local storage the short answer is you should probably just use cookies with the following settings in production have HTTP only on so it can't be accessed by Javascript secure should be set to true so only works in HTTPS and same site should be set to LAX to protect against csrf attacks I recommend checking out the oosp website if you want to know more about these values it's a really good resource for security the special thing about cookies is if you set credentials to True whenever you do a fetch request the browser will automatically send any cookies stored on that domain up to the server without you needing to send an off header or anything if you choose to use local storage you'll have to set the off header yourself but that's not not really a big deal I think it's okay to use local storage but commonly you'll see online people saying to never store tokens in local storage because it is vulnerable to xss which stands for cross-site scripting and what that really means is if somebody's able to inject JavaScript code into your code they can make that malicious and one of the malicious things they can do is steal your tokens from local storage whereas if you're using cookies and you have the httv only flag on they can't because they the cookies can't be accessed through JavaScript that way the problem with this logic is yes it's bad if somebody's able to steal your tokens from local storage but if somebody's able to inject malicious JavaScript code into your code bad things are going to happen even if you're using cookies and they can't steal your tokens the bad agent will just make malicious API calls on your behalf instead of stealing your token and then doing the same thing the argument is the attack Vector is larger for local storage which I get but the moral of the story for me is just don't make your website vulnerable to xss the last part of authentication which sometimes is confusing is on the front end where you want to know whether a user is logged in or not and especially can be confusing is if you do not use local storage you're using cookies and you can't access your token using JavaScript the solution is simple you make an API call to your server every time a user comes to your website and you let the server decide who the user is server will read the cookie if there even is one and then it will validate it and it'll get the current user for you if there is no user the server will reply that there is no user and usually just redirect them back to the login screen there you have it that is how I would do authentication to recap you first choose how you want users to log in either with ooth or username and password or maybe a combination of both if this video is popular I'll do one with how I like to set up username and password and everything that goes along with that then you pick sessions or jwt's and finally whether you use cookies or local storage to persist tokens on the user's computer I have a GitHub repo in the description of this video that you can check out an example setup of authentication that uses Discord ooth jwt's and cookies which is my usual go-to these days and I want to officially welcome you to the roll your own authentication Club it's good to finally have you
