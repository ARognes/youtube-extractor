transcript: Today we're going to look at five easy ways to improve this code. From a recent code review I did, I called it one of my favorite projects. And overall, it is very good. However, there are some small things here that could be improved. These are just some general tips that you could probably apply to your own code. And again, they are fairly minor quick tips, but just make sure you're thinking about them. It's important to think about a lot when you're programming in C++. If you want to have a look at the rest of this project that was sent into me, then I'll leave a link to the repository in the description below. Okay, so number one, which probably is the least minor out of all of these tips or improvements, is a usage of strings, which I touched on in the original code review, which I will leave linked up there. This codebase is using strings as what looks like the type of certain assets. So this is stored in global assets, and then later inside game.cpp, we'll go through the global assets. And how do we retrieve the asset type? Well, it's just the type that we then have to do string comparisons on, which is bad enough, but then we also have to lower it. So, in order to remove any case sensitivity, we actually go through and create an entirely new string, transform all of the characters to lower, and then use that to compare against another string to see what asset type we're dealing with, and then running the appropriate function. Now, in my opinion, this is crazy because these asset types should just be enums. If we have a look at Hazel just as an example, then you can see we have all of these asset types listed out here. They're simple uint 16ts, which means there's no like copying strings into lowercase characters. There's no comparing strings. There's no possibility of mistyping certain types. They're all just listed out here and you just use them as regular integers that are named. This is one of those win-win lowhanging fruit scenarios in which the alternative is cleaner to write, safer to write because you wouldn't be making typos and would actually perform better. It's a no-brainer. Now, I will say in this particular context, this is all happening inside the init function, which of course is not that performance sensitive because it's not exactly a hot path. It's not running repeatedly. But obviously this is just an example of a broader issue in which asset types which are largely useful in this engine framework are stored as strings which is bad. Now another example in this codebase where strings are used where they shouldn't be is UI layer. We have this get element function for example which takes in a string ID. If we look at the way that it's called, you can see that again we're just manually typing out light-ash container and then we're getting a child also by just a string which I guess might be more human readable but of course you can name variables and ids and whatever else and is especially weird because there's a UU ID class here. There is a UU ID class that generates a universally unique identifier that is a 64-bit integer. Use that. That is what you should be using for all of these ids where you're trying to get element by an ID. Store those. Don't use strings. Strings should really only be used in places that are human interfaceable in the runtime. Meaning in the actual application when it's running, not in the codebase. In the codebase, we want to be using things that the computer understands best, which is not a series of 15 different numbers stored in a human readable string that it then has to process and compare with. No, it's a single number such as a UU ID or a 16- bit enum. Also fine. You're about to get a whole lot more productive because AI agents have arrived in Notion, the sponsor of this video. Notion is my favorite productivity workspace that I use basically every day for literally everything. And now with the introduction of Notion 3.0, you can work faster with your AI team. 