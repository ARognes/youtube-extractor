3.0. Check out my link in the description and give it a go today. Thank you notion for sponsoring this video. Okay, moving on to number two. And these are in no particular order, by the way. The rest of these are going to be realistically more minor than that first one, but still things that you should be thinking about and especially if you want your code to look more pro. Have a look at this render context singleton class. Do you notice things that should be changed? This is the header file. And by the way, not using singletons is not one of the things I had in mind, although that's a story for a different day. Okay, so what are we doing? We're checking to see if instance is not null. If it is, we're returning instance. Otherwise, we're creating a new instance and then returning instance. Why is this written this way? A much cleaner way to write this would be if not instance, let's make an instance and then we'll be returning it either way. So the code should just be this. If you really for whatever reason want to check if the instance condition is true rather than false like I am. And by true or false, I just mean is it null or is it not because it is a pointer. So null is going to be zero which means it would be false. And any other value such as the actual pointer memory address would mean that the boolean condition is true. In that case, I would at least rewrite it to just get rid of this else block and leave it like this. So, we have like an early out if instance is in fact valid. We can return it. Otherwise, we'll create it and then return it. But again, I would just write it like this. Moving down here into the destructor. This is also something that I commonly see with less experienced C++ programmers and that is not knowing that delete does nothing if the instance is actually null. So, in other words, you just do not need this if statement at all. If in fact this render context instance is null, then this will do nothing and this is setting it to null, which it already is. And to be honest, I imagine it would be quite a weird edge case where the render context instance would actually be null because obviously the whole purpose of having this in the first place is to have a valid instance. So yeah, just a minor thing obviously, but it does show that you understand a little bit more about C++ and how delete doesn't do anything if it's null and it's totally safe to call code like this. Now, another quick thing that I noticed that is more of a stylistic choice is having this static instance private in the header file is not something that I would do. I would cut it out completely and just have it be over here inside the CPP file, but have it static so that it's only internal to this translation unit to the CPP file. This doesn't change the behavior of anything. It just cleans up the header file a little bit. But if you really want to have it in the header file, I would at least mark it as inline static, which is available since C++ 17. And that just removes the need for this at all. And then you would just set it to null pointer to initialize it over here in the header file declaration. But again, I would prefer to just have it here because it keeps the header file cleaner, which is good. This is your like publicly exposed interface into this functionality into this class. Okay. Number three, don't use shared pointers everywhere. In fact, just don't use heap allocation everywhere. For example, inside the input manager, which is the event system, every single time there's like a mouse button event or a key event, like you know, we're pressing stuff on the keyboard, every single time that happens, what are we doing? We're making shared pointers. And then we're dispatching the event, which means that we're passing that shared pointer, copying it over here into this function, and then going through and dispatching it to all of the listeners of this event. Then you can see we're doing a dynamic pointer cast. And this is just all things that shouldn't be happening inside your core event system. Instead, just do what Hazel does. If a key press has occurred, we just make a key pressed event like this on the stack and then we pass it into the event callback. Now, this eventually would take us into a function such as editor layer on event where we have an event dispatcher which will check for the appropriate event. But again, we're all passing this just by reference. And then here we land into the onkey pressed event function and we have our key pressed event. We can do whatever we like with it. It's still derived from eventually. It's still got that hierarchy, but there's just no reason to create these as heap allocated shared pointers that are reference counted or anything. It's totally fine to create them on the stack and then just pass them by reference everywhere. There are also other events such as the mouse moved event that you can imagine are basically happening every frame. So this in a fairly performance-intensive core part of your engine or application would reduce both the overhead of the actual heap allocation as well as all of the reference counting from the shared pointer, the atomic increments, the dynamic casting. You don't need any of that. Now while we are on the topic of shared pointer overhead, let's take a look at number four. I've seen this a lot throughout this codebase and that is just copying shared pointers all the time. So here we have item item and if we have a look at what that is, it is a shared pointer and what are we doing? We're assigning it to an auto variable which is basically this type over here just a shared pointer. Why? We're obviously trying to use this as an alias, but we are in fact atomically incrementing the reference count of that shared pointer for no reason. Just stick a reference here. We're just trying to make this code a little bit cleaner by not having to refer to it as item item every time, but we are probably inadvertently introducing that copy and atomic increment, which you should avoid. Here's another example in move system. Again, we've got this item that is a shared pointer and we're just copying it into a brand new variable. You have to be mindful of these shared pointers and copying in general in C++. That's a really important thing to always keep in mind. A good example of this being done properly is inside scene layer stack where we have all of these layers which are shared pointers. It's a vector of shared pointer. But what are we doing? We're taking each element here by reference. Very easy to accidentally forget or exclude that and then you're copying that shared pointer every single time you iterate through one of these layers and using it over here which you don't need to do. Use the reference like this and your code literally runs faster and you're also showing that you understand how this works. Now, if we have a look at a little bit higher, this brings us to number five, our final point. And that is to just be aware of when you pass in raw pointers like this into constructors. And then you're basically intending for this class to sort of have a reference to it, but it's not really a weak pointer. It's not a strong reference. It's just a pointer. And you have no way of actually knowing if that object is still alive, if that memory is still available for you to use. you've kind of just given it access to it but with no ownership semantics at all. So if we have a look at scene CPP that's another great example when we add a render layer we initialize it with this. So we're passing in this scene the one that we are currently in into here and then that is storing it inside this render layers vector here it is raw scene pointers like this into this map of render layers and then that's kind of it. You're on your own. Is that scene still active? Is it not? This is part of the renderer which can run independently to the data. You always need to remember to separate your rendering and your data because in more complex setups they will run independently. Your scene contains all of the actual data that you would like to render. But the renderer might be running like a frame behind on a different thread. It needs access to that data independently and potentially concurrently to the actual scenes being active or deactive or loaded or unloaded. And so having more ownership semantics around that is really important. You could at least have this be like a weak pointer if the original scene was a shared pointer. This may be a little bit tricky to set up because we are in fact passing in this into here and there's no way really to make a shared pointer out of this without intrusive reference counting which you can do with shared pointers as far as I'm aware. However, Hazel has its own reference counting system and it is intrusive, which means that we can just make an instance of this reference counted object out of this and then pass that to the render thread, for example. And you can of course pass that as a strong reference or as a weak reference. But either way, you have the ability of knowing whether or not this scene is actually active, if it's still alive or if it's been deleted, whereas you don't with a pointer. So, the point is just to be aware of these ownership transfers and ownership semantics. You always need to be thinking in C++ about who is it that owns my memory, my objects, and how am I passing that around and how do I want to deal with them eventually dying. With C++, you really have to look ahead and consider your whole life. Anyway, I hope you guys enjoyed this slightly different format video. Let me know what you thought of all of these improvements in the comments section below. As I mentioned in the original code review, which is linked up there, overall, this project is great. It's one of my favorite. It's probably my favorite project out of anything you guys have sent me. But if you have something better or if you have something worse or if you have something that you want me to give you some advice on and review, then send it into channel review@gmail.com. That email address and some instructions will be in description below and I might take a look at it next time. Thank you for watching. If you enjoyed the video, please don't forget to hit the like button and I will see you next time. Goodbye.
