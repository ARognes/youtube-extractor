transcript: ever wonder how Microsoft got so big you can thank Bill Gates's Mom Mary who met IBM's chairman while they were serving on a non-profit board together back in 1980. IBM needed to find an operating system for its new personal computer you might have heard of it and their chairman John Opel remembered working with Mary Gates and reached out to Microsoft who developed a variation of the then popular operating system CPM for big blue which they eventually named PC dos at only 40 bucks a copy most users opted for PC dos over the more expensive CPM and it quickly became the standard for the hugely popular IBM PC establishing Microsoft as the biggest name in software by the mid-1980s thanks Mom
