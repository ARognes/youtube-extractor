transcript: '{"content":"\n[8.987s] Руминация/Мисловно предъвкване.\n[15.544s] За Елизабет и Ханс\n[19.575s] Мислите са като гости в домът на нашия ум.\n[24.382s] Можем да избираме на кои от тях ще отворим вратите, и на кои от тях ще откажем прием.\n[35.404s] За много хора, които преживяват насилие и травма — от религиозна, до професионална и семейна —\n[41.269s] често срещан симптом, с който се борят, е \"руминацията\":\n[44.841s] постоянно връщане към собствените им преживявания.\n[47.638s] Този симптом може да продължи седмици, месеци, понякога години.\n[51.829s] Искам да изследвам този психологически капан\n[55.26s] и да разгледам различните начини да се измъкнем от него.\n[59.651s] В широк смисъл, руминацията се определя като процес на дълбоко мислене за нещо или резултата от това мислене.\n[67.38s] И при нормални обстоятелства няма вреда при подобни продължителни размишления.\n[72.592s] Използваме я, за да се адаптираме към нова информация и ситуации,\n[77.028s] например, при тежка загуба, когато интензивното и многократно мислене\n[81.47s] за това какво сме загубили ни позволява да се приспособим към новата реалност.\n[86.171s] Използваме руминация, за да правим сложни планове и да решаваме проблеми.\n[90.74s] Може да ни помогне да преодолеем грешките, които често правим,\n[93.909s] когато разчитаме на по-опростено емоционално задвижвано рефлексно мислене.\n[98.03s] Пристрастията, предразсъдъците, обичайните умствени преки пътища, които вземаме\n[102.659s] замъгляват и изкривяват сложните реалности.\n[106.285s] В положителната си форма руминация може да доведе до прозрение и напредък.\n[111.2s] Нездравословната й форма е тази която, води до проблеми.\n[114.689s] Когато започваме да обикаляме в безкраен и непродуктивен, кръг\n[118.539s] около негативни мисли, образи, грешки, срещи.\n[123.85s] Като дълбоко надраскана винилова плоча, прескачаме обратно на същата позиция,\n[128.433s] залепени на същия коловоз, неспособни да продължим напред.\n[133.622s] Фрида непрекъснато възпроизвежда спомени за насилствена връзка.\n[138.276s] Тя си припомня различни сцени от връзката\n[141.45s] и си представя, че реагира по различен начин\n[144.29s] — отговаряйки ядосано и защитавайки своето положение.\n[147.929s] Цели следобеди, вечери, нощи могат да бъдат погълнати\n[152.93s] от това вътрешно репетиране на единствен инцидент, който траел само минута\n[157.62s] и към който Фрида се е връщала много пъти.\n[161.269s] Роджър често изпитва кошмарни мисли\n[164.19s] за магически свят на вечните мъчения, за който му е казано, че съществува след смъртта.\n[169.42s] Като дете той е бил хранен с ярки фантазии\n[173.329s] за ужасяващи наказания, очакващи хората там.\n[177.076s] Като мъчение с глад и дразнене с храна,  която не може да се достигне.\n[181.892s] Или принудително хвърляне от високи скали, след което тялото ти се възстановява, за да те хвърлят отново.\n[189.37s] Завинаги.\n[191.157s] Казали на Роджър, че е роден с болен характер и заслужава това мъчение\n[195.919s] и че единствената му надежда да избяга наказанието, е да моли за прошка\n[199.949s] за неговите грешни мисли и несъвършени действия.\n[204.088s] Едва след смъртта си той щеше да научи, ако се беше молил достатъчно.\n[209.022s] От детството си Роджър се бори да оправдае парализиращите очаквания, наложени върху него,\n[214.934s] размишлявайки непрекъснато за недостатъците си\n[217.85s] обсебен от възможни негативни последици за действията му,\n[222.15s] страх от забранени мисли, които могат да възникнат в съзнанието без покана, във всеки един момент.\n[229.099s] Жони живее далеч от насилствения си баща.\n[232.591s] Голямото разстояние и натовареният й работен график\n[235.609s] са й дали правдоподобно оправдание, за да минимизира контактите с него.\n[239.214s] Вижда го само на големи семейни събития, където може да избегне да остане насаме с него.\n[244.607s] Една форма на контакт, с която все още се мъчи, са писмата, които продължават да изпращат един на друг.\n[251.019s] Когато види, че е дошло негово писмо, тялото й се изпълва с адреналин.\n[255.68s] Тя го отваря с треперещи ръце. Когато тя го чете, светът сякаш изчезва.\n[261.369s] Нищо друго не съществува, освен думите му, скачащи от патос, до безмилостно преследване.\n[268.765s] В един момент той набляга на слабостта и уязвимостта си,\n[272.585s] в следващия хвърля жестоки обвинения върху Жони, като я обвинява за проблемите си.\n[278.752s] Писмото отнема мислите й за няколко дни.\n[282.922s] Тези размишления оставят Жони, Фрида и Роджър да се чувстват раздразнени\n[287.93s] откъснати от живота си и здраво залепени в миналото.\n[292.672s] Иронията е, че и за тримата руминацията започна като стратегия за справяне.\n[298.593s] За много хора, изглежда че руминацията предлага някакъв комфорт в началото.\n[303.47s] За Роджър, който преживява огромни изблици на паника и безпокойство\n[307.82s] в отговор на предполагаем недостатък\n[310.22s] руминацията първоначално имала успокояващ ефект върху емоциите му.\n[314.795s] Колкото и да е мъчително, мислите му за безполезност\n[318.62s] са му дали, известна психологическа защита срещу по-остри чувства.\n[322.79s] Но в крайна сметка, измъчван от натрапчивото си психическо самобичуване,\n[327.97s] той променя страха в депресия.\n[331.79s] За Фрида, която се чувстваше като безсилна изтривалка в миналата си връзка\n[336.69s] преосмисляйки се като ядосан победител, тя се почувства мощна за известно време.\n[342.151s] Този гняв беше опияняващ и пристрастяващ.\n[346.33s] И тя повтаряше фантазиите си отново и отново, за да поддържа това състояние.\n[351.898s] Когато осъзнае, че губи часове в това\n[354.814s] тя започна да си обещава, че следващото преосмисляне ще бъде последното.\n[359.256s] И тя постоянно нарушаваше това обещание.\n[362.75s] Неспособна да се спре, тя постепенно се поддаде на чувството за силна безпомощност.\n[370.496s] За Жони, която се чувстваше парализирана от писмата на баща си,\n[374.71s] руминацията първоначално й даваше илюзия за надежда\n[378.26s] че може би този път ще излезе с новаторски отговор, който напълно ще промени връзката им.\n[385.164s] Но за всяка идея, която й идваше на ум, тя виждаше как той, може да обърне тази идея, срещу нея.\n[390.934s] Знаеше как една невинна дума може да се прейначи като отровна.\n[396.17s] Постепенно, изтощена от безсмислените си размишления, тя потъна в отчаяние.\n[402.598s] Много малтретирани и травмирани хора интуитивно вярват че\n[406.78s] руминацията по някакъв начин им помага да се адаптират.\n[409.665s] Но доказателствата, сочат обратното.\n[412.924s] Руминирането често води до много по-големи проблеми.\n[418.955s] Преосмисляне на мисленето.\n[424.373s] Значителни количества изследвания показват, вместо да помага, руминацията играе важна роля\n[432.127s] както при появата, така и при поддържането на различни проблеми, свързани с настроението\n[437.29s] включващи тревожност, стрес, принуда и депресия.\n[442.108s] Проучванията подчертават някои характерни черти на руминацията, които ни дърпат в тези патологични посоки.\n[449.193s] Изследвайки ролята на руминацията при пост травматично стресово разстройство, Таня Майкъл и колеги\n[454.759s] откриха, че пациентите често се фокусират върху отворени и неразрешими \"защо\" и \"какво, ако\" видове въпроси,\n[461.139s] вместо действителното травматично преживяване.\n[464.39s] Едуард Уоткинс и колеги съобщават за подобни резултати\n[468.06s] по отношение на тревожноста, депресията и импулсивното поведение.\n[472.667s] Те откриха, че важен определящ фактор в преживяването на тези проблеми\n[477.12s] е дали индивидът се занимава с \"специфично\" или \"абстрактно\" руминиране.\n[482.497s] Конкретното руминиране включва събиране на ясно наблюдавани подробности\n[486.93s] наблюдавани факти, количествено измерими доказателства.\n[490.352s] Ние сме ограничени до това, което наистина се е случило.\n[494.1s] С абстрактното руминиране се отклоняваме от фактите\n[497.74s] и започваме да мислим за въпроси, на които няма окончателни отговори.\n[501.99s] Попадаме в капана на възможностите\n[505.479s] възможни значения, възможни мотиви, възможни последици.\n[510.597s] Възможностите са безкрайни и потискащи.\n[515.515s] Конкретното руминиране е насочено към конкретния контекст на дадена ситуация.\n[520.49s] Ако не успеем в дадена задача, ние се опитваме да определим конкретните фактори, довели до конкретния неуспех.\n[528.355s] Правейки това, ние получаваме шанса да се поучим от провала и да продължим напред.\n[532.889s] Абстрактното руминиране работи в обратна посока\n[536.31s] премахване на контекста и изкривяване на информацията в широки обобщения.\n[542.132s] Когато се провалим в дадена задача, ние я обобщаваме в личността.\n[547.334s] Ние се превръщаме в провал. Нищо не можем да направим както трябва.\n[552.0s] Може да приложим обобщения и към други хора.\n[555.699s] Ако приятелите не могат да се впишат в нашите планове\n[558.85s] може би защото са заети със собствените си лични нужди или трудности,\n[563.16s] ние отхвърляме този контекст и ги наричаме егоистични и безгрижни.\n[568.845s] Абстрактното руминиране глобализира нашия негативен опит.\n[573.314s] Убеждаваме се, че това, което някога се е случило,\n[576.379s] винаги ще бъде така — винаги е било така.\n[580.978s] Тези изкривявания ни пречат да се учим\n[584.129s] и ни оставят с чувство на безнадеждност.\n[587.659s] За разлика от по-систематичния фокус, наблюдаван при конкретната руминация\n[591.85s] при абстрактното руминиране фокусът често е разхвърлян като полет на пеперуда.\n[596.706s] Хората скачат от мисъл на мисъл, от спомен на спомен, по неорганизиран начин,\n[603.449s] никога не прекъсвайки за малко, за да се разгледа нещо, за намирането на решение.\n[608.273s] Заради това неясно размишляване\n[610.86s] минали преживявания от значително различени естества\n[614.509s] се смесват заедно във фалшиви модели.\n[618.334s] В резултат на това, хората се претоварват с неразгадани мисли и чувства.\n[625.864s] Абстрактната руминация увеличава и удължава отрицателните състояния.\n[631.591s] Подобно на черна дупка, тя консумира големи количества енергия и не отдава никаква светлина.\n[637.511s] Само нарастващото усещане за тъмнина.\n[641.16s] За да се борим с абстрактното руминиране, трябва да насочим мислите си към правилното място.\n[647.095s] Дори когато не руминираме\n[649.024s] често даваме на нашите мисли огромно влияние и контрол над нас.\n[654.0s] В детството ни, често ни учат да виждаме мислите си като отражение на това кои сме ние.\n[659.606s] Научаваме се да приравняваме мислите си с нашата идентичност.\n[663.271s] Дори и най-случайните представи, които са се появили в главата ни,\n[666.889s] се чувстват като истината за нашата дълбока същност.\n[670.739s] Ако лошите мисли идват в съзнанието ни, това означава, че сме зли.\n[674.721s] Дори ако никога не ги реализираме.\n[677.856s] Някои религиозни групи популяризират това погрешно схващане по-нататък, с концепцията за \"Мислопрестъпление\".\n[683.773s] Простата мисъл за някакво действие става еквивалентна на самото действие.\n[688.23s] Странно е, че това се отнася само за лоши мисли.\n[691.649s] Няма положителен еквивалент на \"Мислегероизъм\" за добри мисли.\n[696.311s] Фантазирането за даряване на големи пари за благотворителност не се счита за равно на истинското даряване.\n[703.399s] Изравняването на мислите с действията, им дава напълно фалшив статус на влияние.\n[709.798s] Концепцията за магически желания издига този статус още повече.\n[714.249s] Сега нашите мисли карат нещата да се случват.\n[717.629s] Вълшебните желания произвеждат фалшива надежда\n[720.939s] и често голямо страдание.\n[723.743s] Понякога в момент на гняв можем да пожелаем нещо лошо.\n[728.199s] Когато гневът ни премине, вместо да разгледаме желанието си като моментен израз на психическо разочарование,\n[734.61s] ние се притесняваме, че може да има някакъв физически ефект върху Вселената.\n[738.529s] По тези и други начини позволяваме на нашите мисли да ни извадят от равновесие.\n[744.34s] Разрушаването на силното емоционално влияние, което нашите мисли имат над нас, означава промяна в отношението ни към мисленето.\n[751.832s] Понятието \"дистанциране\" описва практиката, на откъсване от нашите мисли\n[756.941s] и разглеждането им от безпристрастна гледна точка.\n[760.121s] Джон Пауърс и Кевин Лабар описват различни видове дистанциране.\n[764.47s] Те използват пример, когато човек се чувства засегнат от критика от колега.\n[769.428s] Можем да използваме \"обективно\" дистанциране,\n[771.939s] представяйки си как критиката може да се разглежда от неутрална трета страна.\n[776.907s] \"Времевото\" дистанциране предлага да си представим, че критиката се е случила преди години.\n[781.958s] С \"хипотетичното\" дистанциране бихме си представили, как инцидента е теоретична ситуация вместо реална.\n[789.178s] Дистанцирането, ни отдалечава от емоционалните импулси на настоящия момент,\n[793.319s] които могат да изкривят и блокират нашата размисъл,\n[796.061s] и ни позволява да анализираме различните реакции към ситуацията.\n[799.666s] Когато упражняваме повече откъсване от нашите мисли,\n[802.853s] можем по-лесно да изберем, с кои мисли да се занимаваме.\n[807.214s] Когато мислите се появяват в главите ни, често автоматично им даваме незабавно внимание.\n[814.018s] Ако хората идват в дома ни без покана, няма да ги пуснем автоматично.\n[819.551s] Питаме се: Удобно ли е за нас?\n[822.966s] За какво са тези хора тук?\n[824.877s] За забавление, бизнес, някаква спешност?\n[828.069s] Ние решаваме дали искаме или не да ги поканим да влязат.\n[832.47s] Мислите са като гости в домът на нашия ум.\n[836.722s] Можем да избираме към кои да отваряме вратите си\n[840.05s] и на кои от тях да отказваме прием.\n[843.222s] Точно като човешките посетители, които отказват да приемат \"Не\" за отговор\n[847.542s] може да открием, че някои негативни мисли настояват,\n[850.619s] искат да се промъкнат и да получат вниманието ни.\n[854.771s] При справянето с тях е важно да разпознаете разликата, между съпротива и игнориране.\n[861.692s] Може да има естествено изкушение да се опитваме да изгоним упоритите мисли насилствено,\n[868.36s] да се опитаме да ги заключим със силата на волята.\n[871.657s] Когато правим това, ние създаваме вътрешен конфликт\n[875.619s] който ни води до провал и разочарование.\n[879.173s] Ако някой каже: \"Не мисли за стол\"\n[881.73s] за какво най-вероятно ще си помислите?\n[884.941s] Когато се опитваме да не мислим за нещо, искаме една част от мозъка ни да следи нещо, което не искаме да следим.\n[892.329s] Това е като да си сложим белезници за нещо, след което да се опитаме да избягаме от него.\n[896.954s] Колкото повече защити поставяме, толкова по-разочаровани ставаме\n[900.47s] когато мисълта продължи да се промъква\n[902.689s] толкова повече сила даваме на мисълта върху нас.\n[906.15s] Ние се спускаме в уплашена позиция, страхувайки се да не се върне.\n[910.793s] За разлика от това, когато игнорираме една мисъл\n[913.829s] вместо да се опитваме да я блокираме със сила\n[916.259s] приемаме, че мисълта съществува\n[918.309s] и просто избираме да не й даваме повече енергия.\n[921.929s] Някои хора намират за полезно да говорят директно с мисълта,\n[926.69s] да кажем нещо като:\n[928.06s] — Признавам съществуването ти. Но нямам полза от теб.\n[932.152s] Или: — Знам, че искаш да ми отнемеш времето. Но не и днес.\n[937.61s] Тъй като не работим срещу себе си\n[940.149s] ние запазваме вътрешната хармония.\n[942.668s] Тъй като упоритата мисъл вече не предизвиква безпокойство или разочарование, тя губи своята сила.\n[948.439s] И ние поддържаме емоционално неутрална позиция.\n[952.249s] В крайна сметка, поради липса от внимание, неканената мисъл ще изчезне.\n[957.908s] И дори няма да забележим.\n[961.003s] Осъзнаването, че можем да избираме на кои мисли да обръщаме внимание\n[964.999s] означава, че винаги имаме възможността просто да не се заемаме\n[968.48s] с всяка упорита негативна мисъл, във всеки един момент\n[972.73s] и да спрем руминацията в зародиш.\n[976.009s] Въз основа на това искам да разгледам някои начини\n[978.348s] за постоянно изкореняване на негативните мисли\n[981.649s] и възстановяване на баланса, който руминацията нарушава.\n[986.464s] Изкореняващи Тактики.\n[991.831s] В някои случаи на руминация, нашите мисли не са в съответствие с никакъв реален проблем.\n[997.565s] Ние се борим с илюзия.\n[1000.153s] Можем да сложим край на този тип руминация завинаги, като изложим кухата идея или вярването, които ни задържат.\n[1008.079s] Това означава да образоваме нашия вътрешен адвокат\n[1011.699s] и преминаване от абстрактна към конкретна размисъл.\n[1015.622s] Роджър се измъчваше от възможността че съществува магически свят на вечни мъчения.\n[1021.849s] Неговите индоктринатори му внушиха въпрос, на който не може да се отговори.\n[1026.513s] Мъчителното \"какво ако?\".\n[1028.983s] Когато фанатиците ни хранят с ужасяващите магически \"какво ако?\",\n[1033.361s] трябва ясно да сме наясно с това, което правят.\n[1036.829s] Те се опитват да насадят в нас тревожност, която не можем да преодолеем.\n[1042.57s] Когато тръгнем по пътя на \"какво ако?\", тогава няма край за възможния ужас.\n[1048.737s] Каквато и кошмарна възможност да си представим\n[1051.64s] винаги можем да си представим нещо по-лошо.\n[1054.11s] Винаги можем да добавим още ужас.\n[1057.232s] Страхът, който чувстваме при замислянето за тези \"какво ако?\",\n[1060.63s] не е в реакция на някаква реална опасност.\n[1063.492s] Това е реакция на собственото ни въображение.\n[1066.559s] Възстановяването на Роджър от руминацията започна, когато той ограничи въображението си\n[1072.432s] и измести фокуса си\n[1074.09s] върху отличителни подробности и конкретни факти.\n[1078.396s] Когато той промени \"какво ако?\" във \"какво е?\".\n[1082.899s] Факт е, че неговите индоктринатори никога не са предлагали убедителни доказателства за нито едно тяхно твърдение.\n[1090.133s] Те просто го подлагат на магическо сплашване,\n[1093.471s] извадиха ума му от равновесие и в ужаса си той е предал рационалността си.\n[1099.609s] Сега, с възстановена рационалност, вътрешният адвокат на Роджър\n[1104.059s] прекрати делото им, на основание пълна липса на доказателства.\n[1108.335s] Докато руминацията на Роджър в крайна сметка се основаваше на илюзия\n[1112.57s] за много други, предметът на тяхното руминиране е много реален.\n[1116.996s] Като бащата на Жони.\n[1119.275s] Понякога се забиваме в руминирането на проблема, защото продължаваме да използваме същия фиксиран подход.\n[1125.83s] Трябва да преосмислим картината, да я разгледаме от друг ъгъл.\n[1130.21s] Както беше описано по-рано, при абстрактно руминиране често разглеждаме ситуации\n[1135.32s] чрез изкривяваща леща на широки обобщения,\n[1139.22s] когато трябва да разглеждаме специфичните контексти.\n[1142.576s] В случая с Жони тя предполага, че всеки човек е фундаментално възприемчив към разума.\n[1148.222s] И докато тя продължаваше да гледа на баща си от този фиксиран ъгъл,\n[1152.48s] тя продължаваше да се измъчва, опитвайки се да се аргументира разумно с него.\n[1156.575s] Нейното руминиране приключи, когато тя си позволи да го погледне от друг ъгъл,\n[1161.309s] като някой, който не беше отворен за разум.\n[1163.741s] От този момент всичко си дойде на мястото.\n[1166.876s] Насилниците, идват в най-различни форми.\n[1169.37s] Някои се държат като петгодишни деца\n[1171.33s] често защото в някои важни аспекти на развитието\n[1174.467s] точно това са те: деца.\n[1177.479s] Някои насилници са като театрални актьори,\n[1180.258s] генериращи безкрайни мелодрами и влизайки в главната роля\n[1185.409s] често като някаква благородна недооценена жертва.\n[1189.121s] Жони осъзна, че това прави и баща й.\n[1192.493s] Той нямаше интерес да слуша разума.\n[1195.934s] Той се фокусира само върху намирането на \"обиди и оплаквания\", за да създаде драмите си.\n[1201.419s] Когато Жони разпозна това, тя спря да приема сериозно писмата му.\n[1206.129s] Винаги, когато пристигаха, тя ги четеше на глас\n[1209.11s] в стила, в който са написани — като Шекспирова трагедия.\n[1213.663s] Вместо източник на стрес, те се превърнаха в източник на забавление.\n[1218.21s] Тя продължаваше да пише от време на време.\n[1220.688s] Но ги оставяше кратки и не губеше излишни мисли върху тях.\n[1226.266s] Когато се забием в една гледна точка, виждането на нещата от друг ъгъл може да бъде трансформиращо преживяване.\n[1234.093s] Друг начин да се измъкнем от руминацията е да дадем на нашите мисли и чувства някакъв външен израз.\n[1240.326s] Много писатели казват, че изобщо не могат да обсъждат проекта си с никого, докато не бъде завършен.\n[1245.419s] Разговорът за него, преди да е готов, отнема желанието за изпълнение на проекта.\n[1250.731s] Те вече не изпитват нужда да разказват историята\n[1253.399s] защото, споделяйки я с някого, се чувстват, сякаш вече е разказана.\n[1258.302s] По същия начин желанието за руминиране често отшумява,\n[1262.33s] когато намерим някакъв начин да извадим мислите си от главата си,\n[1265.649s] където те просто обикалят в кръг\n[1267.539s] и да им дадем някакъв външен израз.\n[1270.43s] Има много начини да направите това.\n[1272.606s] Водене на записки.\n[1274.184s] Използване на някаква творческа среда като рисуване или музика.\n[1278.287s] Някои хора използват техниката на \"празния стол\"\n[1281.405s] —те си представят че човека, към когото руминират\n[1283.99s] е седнал пред тях на празен стол\n[1286.35s] и си казват каквото имат да кажат.\n[1289.567s] За някои жертви на злоупотреба — писане на писма до техните насилници\n[1293.539s] наистина прочиства съзнанието им от много натрупани материали.\n[1297.25s] За хората, които все пак избират да пишат писма, една предпазлива мярка!\n[1301.188s] Никога не ги изпращайте!\n[1303.596s] Не става въпрос за обвързване с насилника.\n[1306.169s] Става въпрос само за освобождаване на мислите ни.\n[1309.297s] Някои хора изгарят или накъсват писмата си.\n[1312.413s] Някои ги изпращат до себе си. Изберете каквото ви е удобно.\n[1317.0s] Трябва да кажа нещо за изразяването на гняв.\n[1321.17s] Гневът е важна и ценна емоция.\n[1324.32s] Това може да ни даде сила и мотивация за борба с истинското насилие.\n[1329.11s] Но понякога можем да се изгубим в него.\n[1332.749s] Гневните интерпретации на Фрида за минали сцени\n[1336.23s] с насилника й я накараха да се почувства силна\n[1339.338s] но й попречи да продължи напред.\n[1342.55s] Гневът й я улесни да приеме позицията, че някой друг е виновен за всичките й проблеми.\n[1348.741s] Това също й попречи да разпознае и да разбере по-меките чувства, които гнева й закриваше,\n[1356.201s] чувствата на болка и уязвимост.\n[1359.556s] Когато Фрида в крайна сметка успя да изрази пълния спектър от чувства, тя започна да се освобождава от миналото.\n[1367.815s] Активността може да бъде чудесна превантивна мярка срещу руминацията.\n[1372.136s] Не непременно по начин, по който можем интуитивно да мислим.\n[1376.147s] Някои хора използват активността като разсейваща техника.\n[1380.0s] Но това не винаги помага.\n[1382.461s] Защото използваме активността като вид съпротива\n[1385.5s] — опит за отблъскване на мислите —\n[1387.95s] в крайна сметка може да предизвика повече тревожност.\n[1391.239s] Активността помага да се възстанови балансът в живота ни.\n[1395.276s] Руминацията може да доведе до продължителни периоди на бездействие.\n[1399.155s] Заети в мислите си, ние отлагаме социалните ангажименти;\n[1403.0s] не успяваме да планираме прекъсвания за почивка; ние пренебрегваме себе си.\n[1407.451s] Ние спираме да правим неща, които могат да ни помогнат да се измъкнем от нашето настроение.\n[1412.242s] Тъй като дните на бездействие започват да се увеличават\n[1415.85s] нашето руминиране става самоподдържащо се.\n[1418.715s] Всичко, което можем да видим като погледнем назад, са много дни на непродуктивни мисли.\n[1423.687s] Активността помага да се прекъсне този самоподдържащ се модел.\n[1428.0s] Тя дава на нашите дни различен релеф и стимулира нашето мислене в други области.\n[1433.529s] Отново, предпазна мярка.\n[1436.09s] Когато започнем отново да се занимаваме с дейност след дълъг период на руминация,\n[1440.809s] е лесно да попаднем в самоунищожителни вътрешни диалози.\n[1444.83s] Може да си помислим: \"Преди време, това беше по-забавно.\"\n[1448.291s] \"Защо не се радвам на това толкова, колкото преди?\"\n[1451.496s] Вместо негативни сравнения с миналото,\n[1454.88s] просто се съсредоточете върху това, което активността ви дава в момента.\n[1458.992s] Което ме води, най-накрая, до \"Съзнателност\"\n[1462.659s] — състояние на фокусиране върху настоящия момент.\n[1465.819s] Съзнателността означава да осъзнаеш и останеш тук и сега\n[1469.5s] наблюдавайки нашите мисли и сетивния ни опит\n[1473.269s] в състояние на откъснато любопитство.\n[1476.705s] Вместо да се заплитаме и определяме от нашите мисли и емоции,\n[1481.33s] ние ги гледаме как идват и си отиват без да се застояват.\n[1484.856s] Ние ги разглеждаме като мимолетни преживявания, каквито всъщност са.\n[1488.928s] Ако открием, че отиваме към миналото или бъдещето\n[1492.639s] ние просто забелязваме, че това се е случило и се връщаме обратно в настоящето.\n[1497.83s] Ако осъзнаем някакви критични вътрешни гласове\n[1500.879s] които ни казват, че вършим лоша работа с тази съзнателност\n[1503.79s] отново забелязваме това, без да се занимаваме с него.\n[1508.341s] Чрез съзнателност можем да се научим да насочваме вниманието си\n[1511.97s] целенасочено и спокойно, вместо да си позволим\n[1515.82s] пасивно да се люшкаме от случайни пеперудени мисли и чувства.\n[1521.291s] Изследванията показват, че редовните упражнения за съзнателност\n[1524.72s] могат да имат огромно положително въздействие върху руминацията и разстройствата на настроението.\n[1530.763s] Разбира се, в живота на всеки от нас ще има време,\n[1533.779s] когато трябва да се изправим пред болезнени мисли и чувства.\n[1537.325s] Времена на конфликти и злоупотреби. Времена на загуба и скръб.\n[1541.85s] И позволявайки си, да почувстваш болката от тези моменти е важна част от тяхното осъзнаване.\n[1547.673s] Но ако се окажем потопени във водовъртежите на нездравословни непродуктивни мисли,\n[1553.772s] тогава има мерки — които можем да предприемем като:[конкретно мислене, излагане, преосмисляне, изразяване, активност, съзнателност]\n[1557.649s] и такива: — които не трябва да предприемаме [абстрактно мислене и съпротива на мисли] — за да се спре и да се прекъсне това потапяне.\n[1560.688s] И да се преодолее руминацията.\n[1567.629s] Този канал изследва проблемите около манипулацията, злоупотребата и догмата. Благодаря на всички, които подкрепят тази работа."}'
