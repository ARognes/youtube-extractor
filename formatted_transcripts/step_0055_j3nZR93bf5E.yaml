transcript: Whenever there's a conflict story, the other side isn't there. So, they can't litigate. They don't actually know if you're the issue. They only know your side. And so, what you shouldn't do is you shouldn't be like, "Hey, I'm the hero, they're the villain." Because immediately in their head, they're like, "Is that really what happened? Or are you the villain and he's the hero?" And so, what you need to do is you need to recognize that this isn't a courtroom where the litigation is going on. And what you need to say is just like, "Hey, I was put in this situation by them. I disagreed with them. And here's how we were able to make progress despite that."
