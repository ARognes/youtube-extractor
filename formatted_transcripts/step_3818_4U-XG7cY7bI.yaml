ed for rapid heat exchange allows us much more flexibility of supply air flows so the system can deliver just the right amount of air to the space even at high capacities this is only scratching the surface of what modulating systems can do instead of letting the system find its own balance point the modulating components all work together in unison to create the ideal settings for efficient safe operation even at changing capacities over a large range of conditions to make it all work the system relies on software and control algorithms one of the most common controls in the market is called a pid pid is a proportional integral derivative controller basically it's taking a measurement we know a target it can this can be whatever can be temperature can be pressure we have a target temperature for example so we know where we want to be and we know where we're at from a measurement so the pid will basically take that difference and send that input to another device to change to bring those temperatures in line your actual temperature to your desired temperature in line with one another so it's a control algorithm where it has an input and an output and we use multiple pids in our equipment one is for say for example we want to maintain a constant supply air temperature by modulating the compressor if we know that our supplier temperature is 5 degrees too high we know that we need to put more capacity in the system so we will speed that compressor up by measuring our actual air temperature and knowing our desired air temperature so there will be a constant feedback loop between the delta t and how much compressor speed we need that's just one example of the pid there are pids functioning on the compressor the condensing fan speeds the electronic expansion valve and even the outdoor air damper has a pid adjustment on it as well whether it's 105 degrees outside or 50 we can control the pressures and temperatures in the system to maintain efficient operation all while pro