transcript: all of the content on youtube is about how to become a software developer nobody tells you exactly how to get to the next level once you're there i've noticed that a lot of developers float around for a couple of years before they start to get serious about becoming a senior developer or tech lead even if you think you are some years away from the next level you should have a clear idea of what it entails so you don't have a series of false starts that could set your career back in this video i'll tell you about the four universal traits of senior engineers and the three things people do that get in the way more importantly i'll give you my mental model for how i think about this critical promotion and how to apply it to your situation so you don't get distracted by things that don't matter let's go [Music] metta here i'm a principal at amazon with 15 years of experience i've been promoted through every level of software development engineer i've conducted 850 technical interviews for all levels and roles and i've mentored dozens of people in the tech industry you can disagree with me but you can't say that i don't know what i'm talking about making it to senior engineer is a really big step for some folks this represents the highest level you'll attain as an individual contributor senior engineers have it nice they're in the top ten percent of the pay band companies they get to make the big decisions and set the direction for their team teams are often built around strong senior devs it's a big deal in this video i'll use the term senior engineer senior dev team lead and tech lead interchangeably at amazon where i work it's a really broad range the top end of senior engineer at amazon is a staff engineer or principal at google or microsoft from what i can tell places like netflix only hire senior engineers i'm not going to focus on the top end of senior engineer i'm going to focus this video on the left boundary being promoted to senior sometimes being promoted is a matter of being at the right place at the right time this is a perfectly valid and common way people get promoted to senior engineer however i'm going to spend time on things that you can control since circumstantial promotions like a mass exodus of team members from a project are just that circumstantial some people get lucky others create their own luck the biggest reason people struggle with this promotion is because they conflate leadership with management senior developer is the first position that's considered a leadership position but they typically don't have direct reports the situation of being a leader without direct authority is not a contradiction if you understand the difference between leadership and management you don't understand what i'm getting at pause the video and think about it for a moment the way i think about it leaders set a direction and rally their team to that destination managers are concerned with execution leaders can be managers but managers are not leaders by default let me give you an example to help illustrate suppose you and your team own a backend service and need to deliver a critical api for a large project with a deadline in month a prototype of the call was done with the script and you realize that the latencies for this call are astronomical let's say the median latency is 10 seconds and this is at or slightly above the threshold for what is acceptable an example of leadership would be to do a deep dive and propose that the api should be an asynchronous one where the api surface turns into the submission of work and fetching of status and outputs of drops this sort of pivot makes the deadline a bit more challenging but sets your team up for the future as you expect the latencies to increase as extensions are added to the initial functionality you sell this idea to your team in management when folks push back you listen to them and give persuasive data-driven arguments like how a rewrite after delivery will cost more and lead to more operational burden maybe your team doesn't have a good track record of going back and doing things the right way and there's a large backlog of other items in your roadmap you write a quick design document and tech spec break down the tasks and ensure the project is delivered on time despite the extra scope you communicate the new direction to adjacent teams and they have enough time to integrate an example of management would be to realize that the api will have high latency but you bias towards fixing it later because this delivery has high visibility in your name attached to it you don't want to slip you implement a clever technique to lower median latencies by two seconds for expected cases you break the project into components that could be parallelized and follow up and stand up to ensure everybody is doing their part you get a technically deep team member to do a spike on how the api can be rewritten in the future and start to plan for how you will juggle the roadmap to find time to actually rewrite it after you launch of course if you choose management over leadership you will think that doing a good job breaking down tasks being clever and keeping folks accountable during stand up is what senior developers do they do that but the critical piece is that they set direction on top of execution so if you want to be a senior dev you have to be really opinionated about where your team should be going and your opinions need to be good i created this channel because nobody gives the advice that i could have used when i was coming up there are topics you'd like me to cover please leave a comment if you find this content useful please smash that like button and subscribe so you can't just be a good coder or just be an effective scrum master i ask every sde that wants to be a senior engineer what they think they need to work on they always say that they want to get more technically deep and to deliver bigger things with their names attached to it being technically deep is a universal trait of senior engineers but not sufficient for getting to the next level these sorts of responses are missing the point that's what all sdes do all sds are technically deep and ship things when i hear things like this i think of the saturday night live sketch with wolf arrow where a band is recording a song and he continually adds more cowbell to a song that has enough cowbell technical chops and project management will only get you so far for true tech depth you need a layer in leadership when you go into a meeting with engineers you've never met before your level and title are not part of the meeting invitation but as the meeting progresses you get to know who the seniors are that's my litmus test for senior engineer when folks in the meeting assume someone is a team lead because of the way they carry themselves and the way they talk about things if folks only realize that they aren't a senior engineer until afterwards when they look them up that's the key indicator you're ready to tell is that they demonstrate they are thinking about the long-term consequences of immediate action and communicate a steady state for systems that's healthy makes sense and doesn't compound existing operational burden or tech debt tech promotions are almost universally anti-peter principle the peter principle is the idea that if you're killing it at your current level you deserve a promotion to the next level on the surface this seems like a reasonable way to approach promotions the problem is that you find the correct level of a person only by promoting them to a level where they become incompetent their proper level is therefore one level down there are no demotions in tech there are only improvement plans or termination this leads to a culture where companies are really conservative with promotions and they only promote folks that are already demonstrating they are operating at the next level they can still have gaps at the next level but they have to be clearly demonstrating the next level traits the second universal trait of senior engineers is the rejection of hyperbolic discounting hyperbolic discounting is a fancy term for preferring immediate benefits at the expense of future benefits even if the future benefit is large thus people discount the size of future returns there are immense pressures to deliver soon and the temptation to realize an immediate gain is often a team's default trajectory but what if you didn't discount the future what if your time horizon is not the next two sprints but rather 12 months this is not unreasonable because you will probably be on the team in 12 months if your frame is to maximize the benefit of your team's actions over the course of a year how would that affect today's choices this brings me to my last point living in the future takes time you have to think about it a lot your ideas can't be half-baked if you make an impassioned plea to re-architect your systems and your team does it they're going to expect a payoff things are worse you are in deep doo-doo so we'll take time and energy on top of your existing duties to do deep designs and analysis you don't put the time in you will lose credibility and people will learn to ignore you so you have to make more time there are two ways to do this you can put more hours in on nights and weekends this seems like an attractive option because you probably have had to put time in on nights and weekends to meet a tight deadline before you've been doing this since you were in college or your boot camp but this is an example of hyperbolic discounting just apply to your life instead of your team it's not sustainable relationships with family and friends will suffer and you won't be taking care of yourself worse when you get promoted you won't have the tools to cope with your new responsibilities you'll burn out get divorced not see your kids and become so toxic that work will fire you don't take this faustian bargain you will end up bitter and an unhealthy person so to find time to think about the future you need to extract more time from your existing working hours there is no other healthy way there's no shortage of advice on how to manage time out there and i've tried them all yes yes you should decline all superfluous meetings set timers block off time on your calendar stop going to social media and reddit delegate tasks etc what you're going to find though is that there are tasks that only you can do on your team you are the only one that knows how to build an old package or you take all of the interviews for your team or you're the only one that knows the ins and outs of a legacy piece of code you're the only one that breaks down tasks well the trick is to grow others around you it requires more bandwidth in the short term but pays off in the long term that's two birds with one stone growing others is the last universal hallmark of a senior engineer you know you've grown others when you freed up your own bandwidth if you use the bandwidth to design the future we've come full circle okay let's recap senior engineers have four universal characteristics one they're technically deep and deliver on time everybody always over focuses on this aspect though make sure this box is checked but be aware of too much cowbell here two they express their leadership not management by demonstrating they are thinking about maximizing the benefits for a longer time horizon from my estimation about a year they uncategorically reject hyperbolic discounting in all of its forms three in order to satisfy one and two they invent more time the smartest way to accomplish this is by four growing others around you to take over their existing responsibilities the dumbest way to do this is by putting in more hours growing others has two benefits it demonstrates that wherever the engineer is placed others will get better but it is also an investment for the future where the return on investment is more bandwidth to do bigger things everybody does better when everybody does better and that's why i make these videos success is not a zero-sum game none of this stuff should be a secret my success and your success can occur at the same time the world needs more kick-ass senior engineers senior engineers are worth their weight in gold and are compensated in kind i hope this video is helpful for you don't forget to hit that subscribe button for more content and i will see you next time [Music] peace
