transcript: "The official announcement trailer for our game Bernband. Release date to be announced, stay tuned!\n\nWishlist now on Steam: https://store.steampowered.com/app/27...\n\nBernband is a sci-fi exploration sim set in a bustling alien metropolis. Wander the streets at your leisure. See the sights, from dodgy dive bars to sprawling mega-marts. Discover secret areas, or hang out with the locals! \n\nThere are no missions or timers; your only goal is to take a stroll. Where will your legs take you?\n\nIf this game seems familiar, that’s because it’s a remake of a project of ours that went somewhat viral back in 2014, also called Bernband. The new Bernband is going to be at least twice the size of the original, with loads of new areas and secrets to discover!\n\nYou can play the old Bernband (from 2014) here for free: https://gamejolt.com/games/bernband/3..."
