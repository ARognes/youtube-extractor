transcript: '{"content":"\n[0.32s] We live in a culture obsessed with\n[2.399s] progress. We want progress in our\n[5.2s] careers, progress in ourselves, that is,\n[8.48s] let''s say, self-improvement.\n[10.4s] We want progress in our bank accounts\n[12.48s] and our net worth. And we also want\n[15.44s] progress in society as a whole. We want,\n[19.279s] we even need to see our lives and our\n[21.84s] world as a line sloping upwards and to\n[24.96s] the right.\n[26.64s] But then we turn to Buddhism and it\n[28.64s] seems to throw a wrench into that entire\n[31.519s] idea. It teaches that everything is\n[34.16s] impermanent.\n[35.68s] It teaches that time is cyclical like a\n[38.16s] wheel. The endless repetitive and\n[41.52s] ultimately unsatisfactory churning of\n[44.48s] some sorrow.\n[47.2s] But if all worldly achievement is just\n[49.92s] rises and falls, is there any such thing\n[53.12s] as real progress?\n[55.84s] To take one key example, is the Buddhist\n[58.719s] path itself a form of progress? Or is it\n[62.64s] just about accepting that nothing ever\n[65.199s] really gets better?\n[67.439s] And how does pursuit of this path\n[70.08s] intersect with our societal and cultural\n[73.439s] ideas of progress?\n[77.52s] In a previous video, we explored how\n[79.759s] ambition and passion are not necessarily\n[83.28s] bad things in Buddhism. I''ll leave a\n[85.439s] link to that down below in the notes.\n[87.68s] For example, they''re skillful when\n[89.759s] they''re directed towards elements of the\n[92.159s] path.\n[93.84s] But what is this path? Where is it\n[96.72s] pointing us towards?\n[99.2s] When we talk of progress or of pointing\n[101.759s] ourselves in a certain direction, there\n[104.72s] are two broad ways we might be heading.\n[108.24s] On the one hand, there is worldly\n[110.64s] progress or progress within samsara.\n[114.399s] This is the progress we usually think of\n[116.799s] when we''re using this term or let''s say\n[119.6s] when we''re talking about growth like a\n[121.759s] growth mindset, having a growth mindset\n[125.28s] that is it''s the idea of being pushed\n[127.6s] ever upwards. let''s say upwards and to\n[129.599s] the right by the worldly winds of\n[132.48s] wealth, status, power and so on.\n[136.64s] It''s an ideal of progress as a kind of\n[139.599s] accumulation,\n[141.36s] growing, getting more and more better\n[143.68s] and better.\n[145.52s] From the Buddhist view, this first\n[147.44s] understanding of progress as growth and\n[150.4s] accumulation is ultimately an illusion.\n[154.48s] It''s deluded.\n[156.56s] Since all things are impermanent,\n[159.12s] accumulation amounts simply to\n[161.76s] rearranging the furniture in a house\n[164.0s] that''s on fire. Whatever we accumulate,\n[167.92s] we will eventually lose. This is the\n[171.76s] cyclicality of time in Buddhism. There''s\n[174.64s] no real progression in time like that.\n[178.72s] On the other hand, there can be real\n[181.68s] progress along the path, or so it seems.\n[185.599s] The Buddhist path has a clear direction\n[188.0s] and a final goal.\n[190.4s] But, and this is key, it''s not a path of\n[193.68s] accumulation.\n[195.76s] Instead, it''s one of dispersal and\n[198.239s] relinquishment.\n[201.2s] Western progress, the progress that\n[203.28s] we''re perhaps familiar with nowadays, is\n[205.92s] like building up a tower brick by brick.\n[208.72s] We''re constantly adding more to our\n[211.36s] selves, to who we think we are.\n[214.48s] Buddhist progress, on the other hand, is\n[216.48s] more like the idea of a sculptor that\n[218.879s] finds a statue inside the stone. It''s\n[222.879s] wearing away what''s unskillful and\n[225.28s] unnecessary.\n[227.36s] As the Buddhist said, mendicants, there\n[230.08s] are these 10 grounds for wearing away.\n[233.76s] What 10? For one of right view, wrong\n[237.68s] view is worn away. And the many bad\n[240.959s] unskillful qualities that arise because\n[243.76s] of wrong view are worn away. And he goes\n[248.48s] on so on for the other seven path\n[251.28s] factors. And then he adds on right\n[253.12s] knowledge and right freedom as well to\n[254.959s] make 10.\n[256.639s] So progress is made in Buddhism by\n[259.6s] removing what''s harmful and unnecessary.\n[263.199s] We learn to relinquish.\n[266.08s] Seen in this way, the path is not so\n[268.72s] much about gaining peace or achieving\n[271.6s] enlightenment as if these were new\n[274.24s] possessions for us to pile up.\n[277.44s] Instead, the path is about a gradual\n[280.08s] sessation of things that hinder our\n[282.72s] peace and well-being.\n[285.28s] It''s about the removal of greed, hatred,\n[288.8s] and delusion and all the states that are\n[290.8s] associated with these. In one suta in\n[294.16s] the Pali tradition, the Buddha says, \"I\n[296.8s] will teach you the principle that leads\n[298.88s] to accumulation and that which leads to\n[301.84s] dispersal.\"\n[303.6s] And what is the principle that leads to\n[305.84s] accumulation?\n[307.68s] killing living creatures, stealing and\n[310.24s] sexual misconduct, speech that''s false,\n[313.919s] divisive, harsh or nonsensical,\n[317.12s] covetousness, ill will, and wrong view.\n[320.96s] This is called the principle that leads\n[322.88s] to accumulation.\n[325.039s] And what is the principle that leads to\n[326.8s] dispersal? Avoiding giving killing\n[329.759s] living creatures, stealing and sexual\n[332.24s] misconduct.\n[333.759s] avoiding speech that''s false, divisive,\n[336.32s] harsh, or nonsensical.\n[338.479s] Contentment, goodwill, and right view.\n[342.16s] This is called the principle that leads\n[344.0s] to dispersal.\n[346.24s] Now, there''s a lot in this passage, but\n[348.88s] let''s for now just focus on covetousness\n[352.4s] versus contentment.\n[354.96s] Covetousness, or perhaps we could call\n[356.96s] it greed, leads to accumulation.\n[360.16s] Contentment on the other hand, peace,\n[363.6s] generosity lead to dispersal.\n[367.44s] Similarly, when he was asked by his\n[369.68s] stepmother, Mahapadi, go to me for a\n[373.039s] teaching of the dharma in brief so that\n[375.84s] she could focus on it while she was on\n[377.68s] retreat. The Buddha gave her a few\n[380.479s] pointers that were key to his teaching.\n[384.0s] The Buddha said that certain things lead\n[386.88s] to accumulation and not to dispersal.\n[390.72s] Categorically, he says you should\n[392.72s] remember these things as not the\n[394.639s] teaching, not the training, and not the\n[397.44s] teacher''s instructions.\n[400.24s] On the other hand, other things lead to\n[403.52s] dispersal and not accumulation.\n[406.4s] And the Buddha went on to say,\n[408.08s] \"Categorically, you should remember\n[409.84s] those things as the teaching, the\n[412.08s] training, and the teacher''s\n[413.52s] instructions.\"\n[415.44s] This idea of dispersal is of course\n[418.0s] highlighted in the ideal of the monastic\n[420.96s] path of renunciation.\n[423.599s] Renunciation is central to right\n[426.56s] intention in the eight-fold path.\n[430.08s] This renunciation, of course, involves\n[432.639s] renouncing physical things. if you''re a\n[435.199s] monastic such as ownership of\n[437.199s] possessions and and perhaps money,\n[439.28s] wealth,\n[440.8s] but also and more importantly, it\n[443.919s] involves renouncing views, concepts, and\n[447.12s] ideas.\n[448.88s] The traditional first stage in progress\n[451.44s] along the path is known as stream entry,\n[454.4s] and I did a video on that, and I''ll\n[455.919s] leave a link to that as well down the\n[457.36s] notes.\n[459.199s] To achieve this kind of progress towards\n[461.919s] stream entry, it''s said that we have to\n[464.479s] break three break through three of the\n[467.52s] lower fedters.\n[470.16s] And key to breaking through this is\n[473.12s] relinquishing what''s known as identity\n[475.28s] view. That is our belief in a permanent,\n[479.199s] unchanging, and essential self that\n[482.08s] persists through time and change.\n[485.759s] understood in this way. Progress along\n[488.8s] the path is not so much about becoming a\n[491.52s] better self as it is seeing that the\n[494.72s] very idea of a permanent essential self\n[498.08s] is an illusion.\n[500.479s] It''s about giving up this idea. It''s\n[502.8s] about relinquishing. It''s it''s about\n[504.8s] renouncing it.\n[507.44s] So, does Buddhism believe in progress?\n[510.479s] Absolutely it does. But it radically\n[513.2s] redefineses that progress. It''s not the\n[516.719s] worldly cyclical gain of more and more.\n[520.88s] Instead, it''s the liberating path of\n[523.039s] less and less,\n[525.36s] less delusion, less clinging, less ego,\n[529.2s] less self.\n[531.519s] Can we see this?\n[534.16s] True progress isn''t about what we''ve\n[536.16s] added to our lives, but what we''ve been\n[538.959s] able joyfully to unbburden ourselves\n[541.76s] from.\n[543.68s] Now, what we might term the ambition to\n[545.839s] progress along this path can at times\n[549.44s] feel somewhat self-contradictory or\n[552.399s] self-defeating.\n[554.48s] If you''d like to explore how Buddhist\n[557.04s] practice handles concepts, related\n[560.0s] concepts like ambition and passion, I\n[563.76s] have a video that dives right into that\n[565.44s] subject which I''m going to leave on the\n[566.959s] screen in a moment. Meanwhile, I''m\n[570.24s] curious in your own life, how do you\n[573.04s] measure growth or progress?\n[576.16s] Is it by gaining or instead by letting\n[579.519s] go or perhaps a little of both? Let us\n[582.48s] know in the comments. And if this video\n[585.279s] has helped you to reframe the idea of\n[587.44s] progress, a like and subscribe are\n[590.0s] always appreciated. Thank you so much\n[592.48s] for your continued practice. And\n[594.32s] meanwhile all of you please be"}'
