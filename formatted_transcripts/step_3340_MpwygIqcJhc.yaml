o zero so when n is zero we'll enter that if statement print blast off and then return and because we're returning there will be no more recursive calls to the countdown function so the final result is that when we call countdown of five 5 4 3 2 1 blast off is printed to the console now let's take a look at one more example let's say we want to write a function called dict depth that Returns the depth of an arbitrarily nested dictionary for example this dictionary only has a depth of one it has two key value pairs but there's no nested dictionaries within it but if you take a look at this dictionary it has three nested levels melee weapons corresponds to a second dictionary which has the key stabies which corresponds to another nested dictionary a total of three levels now because the dictionary passed into our function can be arbitrarily deep recursion is a really good fit for this problem so let's figure out what our function signature should be we'll Define the new function we'll call it dict depth and we'll pass in two parameters D the dictionary itself and then max depth so far which is just going to keep track of how far into the nested dictionary we are at each level of recursion now this time let's start with the base case just so we have a different way of approaching this problem and our base case should be when there's no more dictionaries to recurse into so if D is not a valid dictionary for example if it's just a number like the number that corresponds with the Bose key six then we're going to stop recursing so we'll just add this if statement that says if D is not a valid dictionary immediately return the max depth so far okay now we need a recursive case we need to figure out how to go from the top level dictionary to the next level nested dictionary or or dictionaries because there can be multiple key value pairs so first we'll set a current Max variable equal to the max depth so far and the purpose of this variable will be to keep track of the max depth of all the nested dictionaries at this level next we need to iterate over each potential dictionary at this level in Python there's a DOT values method that we can call on a dictionary object to get every value in that level of the dictionary now at each key value pair we'll recursively call dict depth but this time we'll only pass in that nested dictionary so instead of passing in D we're going to pass in V we also need to increment the max depth so far by one because we're going one level deeper now once that recursive call returns it will return with the maximum depth of that sub dictionary so we should track that max depth and at the end of the loop if that max depth is the greatest of all the nested subd dictionaries that will be the one will return so with the first call to Dick depth we're going to pass in a dictionary D it has three layers the first level has melee weapons as a key which corresponds to a single dictionary it's the only key at the top level the second level has two keys stabby which corresponds to a third dictionary and Bose which just corresponds to the number six going down into that deepest level we've got a dictionary with two keys again Spears and knives Spears mapping to four and knives mapping to three we also pass in a max depth so far of zero just because this is the first call so what happens well first in this initial call to Dick depth the base case is going to be skipped because we pass it a valid dictionary next we'll set the current Max to the max depth so far which is zero and that will be overridden within our Loop if we find a recursive call that returns a greater number now we iterate over all the key value pairs in the dictionary which in this case is just the melee weapons key we enter the recursive call where we pass in the dictionary that corresponds with the melee weapons key that sub dictionary we also increment the max depth so far to one within that recursive call again D is a valid dictionary we'll set the current Max to one which is what the max depth so far was then we'll iterate over each key value pair again this time there are two the stabies key and the Bose key because the stabies key is first we'll start there we'll kick off another recursive call this time passing in the dictionary associated with the stabies key we'll also increment the max step so far to two we'll iterate over each key value pair again there are two Spears four and knives three starting with the spears key we move into another recursive call this time the value four is not a valid dictionary so we trigger the base case and immediately return three which was the max depth so far that we passed in after incrementing it now we're back up a level after returning three we move on to the next key in the dictionary the knives key again it kicks off a recursive call the max dep so far again is three because we've incremented it from its parent function where it was two again D is not a valid dictionary so we'll immediately return three now back up again in that parent function we've iterated over both key value Pairs and we're going to return the maximum of the two return values which because they were both three is just three so that will return up the call stack again now we're back into the second call there's another key for us to process the Bose key that will kick off a recursive call this time D again is not a valid dictionary it's just the value six so we'll return two because two again is incremented from this Call's parent function where it was one now we've iterated over each key in the dictionary the stabies key and the Bose key the recursive call to the stabies key returned to three while the recursive call to the Bose key returned a two so this call which will return the maximum of the two will return a three now we're back in the original function we've iterated over all the keys which in this case was just the melee weapons key and its Associated dictionary and we'll return three and the recursion is done
