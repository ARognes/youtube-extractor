transcript: I don't sleep real good, and because I'm an American, the only way I know how to solve that problem is with So, I tried a bunch of sleep products. So, the first night I tried mouth tape. I assume it works because you feel like a kidnapped victim who's being chloroformed. Didn't work. So, then I tried Breathe Right. Fun fact, my former neighbor's grandfather invented Breathe Right. Thanks, Bruce Johnson. They kind of helped, but what helped more were these magnetic nose strips. I'm not going to say the name of the brand though because I don't want to hurt Bruce Johnson's feelings. Bruce Johnson is a sensitive man. But, hey brand, if you're watching, call me. Bruce will get over it. Also, hi Charlie. He's my former neighbor. Next, I tried a weighted blanket. It turned out to be cozy and nice. I assume these work because they simulate what it must be like for your sleep paralysis demon to crush you. And then I tried a side sleeper pillow. It's like a regular pillow, but half the size and double the price. It was nice, but it turns out it came with an actual side sleeper, my sleep paralysis demon. And then I tried pajamas. My whole adult life I've only slept in my sexy undies. I know what you're thinking, and I agree. I thought adult pajamas would make me feel like a Victorian husband going down a hallway with a lantern after hearing reindeer on the roof. But, then I tried them, and they were actually cozy. But, instead of Santa Claus, I found my sleep paralysis demon. And finally, the sleeping Buddha. It helps you with breathing exercises by using colors. It was relaxing, but it was more worth it to have as a funny companion on my desk. I work at home by myself. I'm so lonely. All in all, a bunch of these products improved my sleep slightly. I give the experience three out of five Bruce Johnsons.
