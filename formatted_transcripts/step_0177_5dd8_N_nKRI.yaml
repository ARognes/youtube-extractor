transcript: have you ever obsessed over a math problem maybe a little bit too much something that seems so fascinating and approachable and yet still so far away well buckle up because this is a wild journey and potentially a new discovery but let's start from the beginning can you think of any 3D shape or polyhedron where every face shares an edge with all all the other faces well of course you can it's the tetrahedron right you have four triangles and each one touches all the other triangles but are there any more if you try creating one it quickly starts to seem impossible none of the simple shapes work there always seems to be a pair of faces that don't share an edge and it seems even less likely to work as the number of faces grows but what if I told you there is another shape that works and it has seven hexagonal sides can you imagine a shape like that well here it is it's called the salazi polyhedron it looks way more complicated than you'd expect for such a simple problem and it's kind of hard to visualize even when you're looking at a picture or a video so I printed and folded my own and physically holding it makes you understand it a lot better and really appreciate it it has seven sides red orange yellow green light blue dark blue and the little purple one that's kind of hidden over here the most striking feature you'll notice is that it has a hole in it so topologically it's actually a Taurus or doughnut shape instead of a sphere like most shapes you're familiar with that also means that the famous Oiler formula vertices minus edges Plus spaces equals 2 doesn't work it actually equals zero for this shape because you have to subtract two for every hole the salazi polyhedron is also the shape with the fewest possible sides that forms a topological donnut and since every side shares an edge with all the other sides it proves that you need at least seven colors to color a Taurus and it does turn out to be seven colable if you want to make your own paper version I'll link the cutouts below it's a little tricky to assemble but not too bad and you'll appreciate it a lot more with a physical model the tetrahedron and the salazi polyhedrin are neighborly in their faces because every face shares an edge with all the others but are these the only neighborly polyhedra surprisingly this is still considered an unsolved problem in mathematics no examples have been found and there's no consensus if it's likely true or untrue but if it does exist it has to have 12 11 sided faces with 44 vertices 66 edges and six holes now this might sound absurd to you can you really make a six-hole donut with only 12 polygons I mean with Edge graphs like this how could you ever expect to untangle it in a way that's geometrically solid if the salazi polyhedrin seemed surprising and barely Poss possible there's just no way this shape could exist right but it really peaked my interest and it's been in the back of my mind for a long time and it seems so straightforward to test with computer simulation finally I couldn't take it anymore I decided to write a solver in Python to see if I could find anything but where do I even start I need to know the graph of how the faces are supposed to connect to each other so I can start to look for Solutions after little Googling I stumbled across this email newsg group correspondence from 1996 which happened to list the exact data I needed super lucky to find that the next thing to consider is what does it actually mean for a solution to be valid well one thing's for sure all the faces should be simple flat polygons that means there's no crossing over allowed in the faces and also no degenerate zero length edges and no 0 Dee or 100 180° angles either sounds simple enough and with that my goal is to find one of these shapes or at least minimize the number of Crossings as much as possible my first approach was starting with 44 randomly distributed points and then for each face repeatedly fitting a plane and projecting the points into it these simulations took a long time to converge and most solutions did end up with degenerate faces but I did manage to find some with as few as 24 Crossings it's a start then I realized that instead of moving around the vertices I should be directly generating the planes instead and just get the vertices from their intersections this was much faster and got rid of the degenerate face problem so I quickly got it down to just 16 Crossings but just generating random planes and Counting the crossings is unlikely to find a global minimum it's like finding a needle in a 36 dimensional hay stack so the next idea was to turn the Crossing number into an objective function and minimize it using derivative free optimization like the nelder meat algorithm it's a lot slower but it does produce better results it dropped the Crossing number down to 10 and then 8 and then seven and six It Feels So Close now unfortunately these minimization algorithms perform better best with a mostly continuous objective function but Crossings are very discreet so I decided to write my own stochastic Optimizer instead that's better suited to this specific problem and it worked really well as I started tuning it The Crossings fell to four and then three and eventually two now this was a fullon Obsession the biggest bottleneck now was the speed of the solver I had to keep my computer running all night just just to get a few Solutions so I decided to ditch my terrible python code and Port it directly to highly optimized C++ and that gave me a 25 times speed up over numpy and that doesn't even include the new multi-threading possibilities and in less than an hour I got one a zero Crossing did I do it what does this crazy sixh hold shape look like well the faces being simple polygons Isn't Enough by itself to be a solution because we also don't want the faces to pass through each other otherwise you just end up with a jumbled mess like this and you can't even see the holes so my journey isn't over in fact it's only just beginning now I've written some code to check how many edges pass through each face and add all those together to get a total Edge intersection number and somehow I need to to find a solution with both zero Crossings and zero intersections and my best solution so far has 23 intersections okay but now I can include that in the optimizer and minimize it as much as possible and it did start to come down I got to 20 intersections then 18 16 I kept trying a bunch of different ways to combine the values in the objective function and the sum seem to work best with more tun in it was down to 14 and then just 10 intersections I was leaving the solver running all night searching and searching I could feel it any day now but that's not how things went it seemed like no matter what I did or how long I ran the solver I just couldn't get past the 10 intersections I actually got a ton of solutions with 10 and when I went to examine them they were all very similar with only slight stretching differences it started to seem more and more like this is actually the global minimum if all the best random seeds are ending up in the same place so maybe that's it I guess I was ready to make the video and just end it here but something just didn't seem right I was trying to do some more research on it and reread the newsletter again and that's when I noticed it referring to a polyhedrin not the polyhedrin could an abstract polyhedrin like this this be connected in more than one way after more digging I found another paper from 1996 that answered my question there's actually 59 distinct manifolds with this neighborly property and wouldn't you know it they listed all 59 of them in the paper but the table was just an image probably typewritten or something so I had to run it through an image to text converter to get the final mappings I needed on one hand I was really excited because maybe now I can get it lower but on the other hand it's now going to take 59 times longer to generate these Solutions that's several weeks of solver time well there's no turning back now I had to keep going and pretty soon I started finding better Solutions I got it down to nine intersections then eight and eventually only six intersections it turns out that certain manifolds produce better Solutions than others and after running the solver for a few days and analyzing all the solutions I started to see some patterns some tended to produce a tangled mess with lots of intersections and seemed unlikely to improve by very much While others have more intricate patterns visible holes and even some noticeable symmetries I also tried actually enforcing some of the symmetries I saw to make the solutions even nicer and now I finally got it down to just four intersections but it seems like I'm running into the same bottleneck again because no matter which manifold I search I'm reliably generating the same best Solutions over and over and over but something feels different this time this four intersection shape might actually be the real minimally intersecting neighborly polyhedron so without further Ado here it is [Music] [Music] I'm calling it the Razer cross because it reminds me of those utility razors but if you have a better name for it let me know I also decided to 3D print it to get an even better feel for the [Music] shape now let me tell you the reasons why I like this particular shape so much first of all it's not only minimally intersecting but it's significantly better than the other symmetric ones which each have eight Edge intersections next it has the highest symmetry of all the solution Solutions 180° rotational symmetry and point reflection symmetry through the center and because of all the Symmetry there's actually only three unique faces and their Reflections which I call the shark the Piping Bag and the uh H the pointy headed duck the other amazing thing is that all six holes are actually visible and not only are they visible but their line of sight visible which means you can even look through each one to the other side or insert six straight rods through the shape without bending them topologically it's as if the wireframe of a tetrahedron has been cut out of the middle of the shape and each of the six edges of the tetrahedron becomes a handle and due to all these factors it's actually simple enough that you could theoretically cut it out of paper and assemble it and that's what I tried to do the intersections are actually quite minor and only require a couple small slits on the Piping Bag to make room for the duck necks man that sounds weird out of context but actually assembling it with paper turned out to be way too precise and difficult for me so that's why I just went with the 3D print instead lastly and most importantly the solution manifold came from group number 42 I mean Hitchhiker's Guide coincidence but in all series seriousness it really just seems like this is the best shape of all the solutions I've generated and so rather than being sad that I couldn't find an intersection free one I'm actually glad that the minimal one I did find is such an awesome shape and even though it's not a proof heris I'm 99% convinced that this is actually the global minimum and the best you can do it's just very unlikely there's another solution out there given how thoroughly I've searched in all the patterns I've seen but wait a a minute what if we didn't care about crossed polygons are there any completely intersection free shapes the answer is yes there's three intersection free manifolds that have the smallest Crossing number of just four again they're each highly symmetric with only three unique faces plus Reflections and despite what I said earlier these are actually much easier to cut out and assemble you just split the faces at The Crossings but I ended up printing one of anyway because it was easier and it looks really [Music] cool so is this unsolved problem solved well probably but 