transcript: 'This looks like careful correct code. But, there''s something wrong. Before sending an invoice, this function validates every input, returning an invoice on success or an error if a check fails. Is the connection open? If not, return an error. Is the email real? If not, return an error. Is the amount positive? If not, return an error. Every check is a line you must remember to write. Forget a single check and you introduce a bug. But, what if those bad states simply could not exist? What if we could get rid of these run-time checks? Let''s learn how to write peak rust by using rust''s type system to delete bugs at compile time. We''re going to cover three increasingly powerful ways to make bad states impossible to represent in rust. Starting with data modeling with enums. Here''s the send invoice function from the beginning of the video. On success, it hands back an invoice. That invoice, the type it returns, is the thing we''re going to model. Here it is, modeled as a struct with three separate fields. A paid flag, an optional receipt, and an optional error string. The problem is that many of these potential combinations make no sense at all. We could be paid, but still holding an error, or unpaid, but a receipt already arrived. Each of these is a bug you can build by accident. So, let''s rewrite this type as an enum, because enums are types that enforce that an invoice can only ever be in one state at a time. Now, we have an invoice that can be in exactly one of three states: pending, paid, or failed. The contradictory combinations are now impossible to write. And the data now lives inside each variant. Paid carries the receipt, and the failed carries the error message. Each piece of data exists only in the state it belongs to. Now, let''s see how you actually use this enum. We''ll use rust''s powerful match expression. A match is Rust''s version of a switch, but one that forces you to handle every possible case. Each arm of the match handles one state of the invoice. If it''s pending, we wait. If it''s paid, we store the receipt it handed us. If it failed, we log the error. Each arm handles one state and unpacks exactly the data that state carries. And a nice safety net is if we add a fourth state next month, let''s call it refunded, but we forget to handle it in our match expression, the compiler helps you realize immediately that you need to handle all potential cases. This is extremely helpful because you do not have to remember every single case yourself. That was level one of peak Rust. Let''s move on to level two, using new types. Here is the send invoice function again, still checking every input by hand. The amount argument is a floating-point number. For handling money, that''s already a bug. A floating-point cannot store an amount like 10 cents exactly and does not include currency information. So, let''s model money as its own type. The money type holds exact integer minor units like cents and a currency. Now, we can make the amount argument a money. The amount can no longer have rounding errors or missing currency information. And because a money is only ever built as a valid amount, the hand-written check can be removed from the function body. We can do the same for email. Wrap the string in a new email type, make the function argument an email type, and then add a single constructor that takes a raw string and returns a result, either a valid email or an error. This is now the only way to build an email, so an invalid one can never exist, which is why we can delete another check from the send invoice function. That was level two. Now for level three, the one that feels like magic. Remember the is open check? Here it is again, the very first guard we saw. And this is what the connection type looks like. It has an is open flag. And its send method panics if the connection is not open. That''s a runtime guard, not a compile time guarantee. And nothing stops you from calling send on a closed connection. It compiles and the program crashes at runtime. The bug stays invisible right up until you run it. The type state pattern moves connection state out of the boolean flag and into the type itself. Let''s rewrite connection one small step at a time. First, let''s set send invoice aside and focus on the connection type on its own. We''ll start by adding two marker types, open and closed. They hold no data. They exist only to name a state. Now we can make connection generic over state and drop the is open field. The state now lives in the type itself. Next, bind the send method to the open state. This impl block now applies only when the connection is open. And because send only exists on an open connection, its runtime check disappears. There is nothing left to check. Finally, add connect defined only on a closed connection. It consumes the connection and hands back an open one. So, if you try to send before connecting, your code no longer compiles. Send does not exist on a closed connection. The invalid call cannot even be written. And every call to send is now guaranteed to be safe by the compiler. Let''s go back to where we started. This was send invoice. Three runtime checks guarding three states that should never happen. A closed connection, an empty email, a negative amount. Every single call had to check all three. And forgetting one was a bug. We fixed this with enums, new types, and the type state pattern. The connection must now have an open state, so a closed one cannot be passed in. The email is now an email type, which must be a valid email. And the amount is a money type, exact integer cents plus a currency. So it cannot be a rounding error. And the body has no checks left. There is nothing to validate because not one of these bad states can even be written down. We deleted the bugs at compile time, and that is peak Rust. And if you''re interested in learning how to write production Rust, check out our Rust Lab Accelerator. It''s our tailored mentorship program where we help developers go beyond YouTube videos, build production-grade Rust software, and land their first Rust job. You can join the waitlist for our next cohort by heading over to letsgetrusty.com/join or by clicking the link in the pinned comment below. When you join the waitlist, we''ll also send you our Rust developer roadmap as a small gift. So tap the link, join the waitlist, and I''ll talk to you very soon.'
