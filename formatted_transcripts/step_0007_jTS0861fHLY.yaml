transcript: "Muhan is an application security engineer who aced the technical round at Meta but walked out of the behavioral interview not knowing what went wrong. He had stories. He just didn't know which ones to tell or how to tell them. \n\nSteve Huynh coaches him live on how to lead with outcomes instead of methods, find stories with stakes that match the level he's targeting, and and bring the same energy to the interview that he already brings to the work itself.\n\nIf you want to be in the hot-seat for the next video like this, apply here: https://forms.gle/121P4FhVhxkBaPiq5\n\n\U0001F4D8 AI can write your code. It can't tell your story. Behavioral interviews are the new differentiator, and I wrote the book on them: https://geni.us/BehavioralInterview-yt\n\nCHAPTERS:\n00:00:00 - Aced the Technical Round. Failed the Behavioral.\n00:03:47 - Lead With the Outcome. Not the Method.\n00:06:32 - Lead With Vulnerability\n00:10:46 - What's Your Strongest Behavioral Story?\n00:13:16 - Good Junior Story. Here's What Mid-Level Looks Like.\n00:20:01 - What's Your Greatest Weakness?\n00:26:00 - The Client Who Asked Muhan to Lie\n00:30:33 - Don't Make the Other Person a Villain\n00:40:19 - The Interview Is Not a Trial. Stop Litigating.\n00:49:26 - Your Story Needs an Impact. Not Just an Ending.\n00:54:41 - The Arbitrary File Read\n00:58:09 - Chain Two Vulnerabilities Into One Great Story\n01:02:23 - How to Structure Complex Stories\n01:08:42 - Being Enthusiastic Is Not Being Fake"
