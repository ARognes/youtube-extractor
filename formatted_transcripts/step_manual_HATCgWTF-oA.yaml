transcript: '{"content":"\n[0.0s] One of the biggest problems with\n[1.64s] relationships is that we fall in love\n[4.16s] and then we fall out of love. The spark\n[6.24s] from the relationship disappears. And in\n[8.44s] fact, that is more common than the spark\n[10.92s] staying, right? So, the average person\n[12.88s] will date several people that they feel\n[14.88s] some degree of chemistry, some degree of\n[16.92s] attraction, but then over time that\n[18.76s] attraction will kind of putter out, will\n[20.48s] wane. I work with a lot of married\n[22.16s] couples who''ve been together for 10\n[23.68s] years, 15 years, 20 years, and they''ve\n[25.72s] started the process of falling out of\n[27.76s] love. About 50% of marriages end in\n[30.36s] divorce, and a big part of that is that\n[32.36s] people fall out of love. The first stage\n[34.28s] of love is governed a lot by dopamine,\n[36.32s] right? so, their presence is, \"Oh my\n[37.6s] god, the thought of them, I''m so like\n[39.72s] you just get this dopamine trickle in\n[41.56s] your brain when you''re in their\n[43.12s] presence, just being in their presence\n[44.48s] feels amazing. Oh my god, I can''t the\n[46.76s] the touch to just brush against them is\n[48.8s] electricity in my skin. Oh my god.\" But,\n[51.2s] when people are in a relationship for 20\n[53.0s] or 30 years, that feeling usually does\n[55.48s] not persist."}'
