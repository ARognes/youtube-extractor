transcript: It all started when we really just were very very young and we were made to wake up way too early in the morning to go to some strange place filled with a lot of strangers. And to stay there for 8 hours to literally be judged and evaluated all day long with even surprise exams and everything. And after doing that all day pretty much every day, we went we had to go home and then do homework. And I think at some point in this whole process, we started to feel that reality was disappointing, that reality was not what we would like it to be. It wasn't fun, it wasn't enjoyable, it wasn't even comfortable. And so what we did is we went inside. Into the imagination. Because we felt that we always had access to that. We had no control over our lives, we had no control over our schedules, everything that we had to do, what was expected of us and our performance and everything. All of that was mandated. But what goes inside of our head, no one could touch that and we realized that. And so during class, in between class, during homework, before and after homework, dreading exams, during all of that. We decided that we would from now on enhance reality. Reality wasn't giving what we were looking for. And so we would just go into imaginary worlds in which things are much more fun. And uh we can kill time and we can distract ourselves from this almost grueling, uncomfortable, anxious reality that we were facing day after day without an end in sight by the way. And so we gave up on them. We went inside. And school ended and we started to make a living for better or for worse. But we never stopped feeling that this world mandates stuff and we just have to follow along. We have to do what it does and we have to be judged and by the way now that we're in a an adult and we have our own responsibilities. Now we have to judge others as well and that this is just how the world works. And so we never stopped feeling that way about the present moment. We've never stopped feeling that way about reality and our disagreement with reality has never stopped and therefore the solution has never changed. We're still in our imagination. Every time the present moment gets boring or uncomfortable or anxious or just overwhelming we escape inside and up into the imagination. And we imagine things. As children we perhaps were imagining dinosaurs being real and we're fighting dinosaurs with each other. But now we're doing the same thing. We we listen to a song to escape first of all, but then while that song plays we imagine ourselves as the lead singer. As having that kind of life. And it's the same thing. It's escaping into the imagination. Whenever we just glaze over whenever we're looking at but we're not really looking at anything. We're we're looking at trees and and really beautiful things, but we're not really looking at it. There's a different movie playing behind the eyes, and the attention doesn't even go out to the eyes. She's seeing a dog. That's what's happening. Sit. And that's what people do. They at work, in the car, while driving. I mean, at any time, whenever reality is just not bearable. Or at this point it's just what we are used to, and so that's just what we do. And we see people everywhere just zombie. And we are the same. But now that we're adults, now that we do have some kind of end in sight, now that we are those adults that used to make us do things, with good intentions, of course. Now it is our responsibility, an opportunity, also, to finally come out of the imagination, and to come back into the real world. Because this is not working. Every time we escape into the imagination, we don't see anything, we don't hear anything, we don't truly think about what we'd like to be thinking about, and and hours pass, days, weeks, months pass. And we think that's just life. No, we're deliberately taking our finger off the record button of life, because we don't like it. We don't want to record that. We want to We want to experience what's inside behind the eyes. We want to escape into that, and so we take the finger off the record button, we go there. And then we wonder why this this tape only has 2 hours of every day, if that, 20 minutes of every day recorded. And where has the day gone? Where has the year gone? Where has my youth gone as people say? This is why. And it's very understandable to escape into the imaginat- imagination like that. I don't think it's right the way that we are forced to do things and because I told you so. It's not right. But and as parents perhaps we can think how to do it differently and we can do it better, but first we have to come out of it. And we see that our imagination is not only a distraction at this point, but much worse so, it is actually harassing us. You know exactly what I'm talking about. We get those thoughts whether when we're trying to sleep or just randomly throughout the day that take us somewhere else. And it's all imagination, none of it is reality even if we're trying to or in our heads think we are preparing something, planning for something, um you know, putting our time to good use in our inside of our head. There are so many scenarios in there and so many what ifs and so many um disaster scenarios by the way, that horrify us and they worry us and they harass us and we don't know how to stop it. Because this machine has been running for so long and it has been it running so intensively, right? As children imagining dinosaurs and superheroes and things exploding and the ground's lava and all that, this machine has really become so trained, so competent. But it's been running for so long and it's been running for so so hard that we don't know how to stop it now at this point even if when we want to stop it. And like I said, we can't sleep at night. We the whole day passes us by and we feel down, we feel anxious, we are worried about things that never could possibly occur, but we think they could or even if they could, they would most of them don't. But we spend all this time and 99% imagining things that don't need to be imagined, should not be imagined. And we know that. We are overwhelmed at this point not only by reality, but our own imagination. We keep bouncing back and forth between one thing that overwhelmed us and another thing that overwhelmed us and we just don't know how to accept this reality that is so overwhelming and we don't know how to stop this imagination which at this point is so overwhelming. And we just have to learn to turn it off at this point. And I think how I think I know how to. At least how to make a start. Of course, it takes it takes our own doing. Someone can't do this for us, but I think I know how to start. We are I do believe that we're fundamentally reasonable people, that we're guided by reason or at least that we have the yearning to be guided by reason and we just don't know what truly is reasonable. And so I believe that it is only false beliefs that make us repeatedly do something that overwhelms us and harasses us and we allow it. Why? Because we think it is also good. We say, "Yes, my imagination harasses me. I can't even sleep at night sometimes because of it. But if I let go of my imagination I'd be so dull. I'd be I'd be like a robot. There'd be nothing exciting, nothing interesting about me. And by the way, isn't all of beauty, art, you know, music painting, sculpture, everything doesn't Don't these things come from creativity? Aren't artists creative? And we say, "Without imagination, there can be no creativity." Surely, creativity also comes from that thing which harasses us. And so, that's the good side of it. And if I let go of imagination altogether, sure, I'll be harassed less, but I'll never be able to be creative or to find joy in life or to see beauty or to be able to appreciate it. This is the false belief that keeps us from this. It's not like we're seeing beauty now. It's not like we can even be still enough now without our imagination harassing us to look at a piece of beauty and to truly appreciate it. So, clearly, that's not true. And I I with reason, with logic, I want to disprove that this imagination also has good things about it. Because if it doesn't have anything good about it, then we can truly let it go. We're only hanging on to it because we think there's something very, very crucial to our humanity about it. But there isn't. Don't we repeatedly see that all kinds of artists, creative makers, designers of any kind, for example, an architect, when they see a piece of land, perhaps just like this, and the there's nothing built on it yet, they look at the landscape, they study it, they spend time with it, they are still, they are not harassed by their imagination, they're fully there, and they say, "Aha, I can see it. I can see it. All I have to do now is to draw it, you know, write it down, and then and then go build it, but I do fully see it." And this is not an imagination. This is a vision. Just like our physical vision can see the landscape, this non-physical vision, this creative vision, can see exactly the building, the house, whatever it is that needs to go there that would really work well with the curves and and the direction of the sun and all that. This is a vision. Don't all artists say, for example, music composers, they say, "I hear it already. I can hear it in my head. All I need to do is to write it down." And once it's written down, all it needs to be done is to be played. No imagination necessary. And don't writers and and all kinds of other artists again say, "These words I feel like they came to me. I received them rather than make them up." You know this from yourself if you are someone who journals. Sometimes you write things and you're like, "Wow, did I just write that?" Did you go into your imagination and try out a different combinations and say, "No, that's bad. That's bad. That's That's good." And then and then that's how you came up with that? Don't you remember almost every time it's just, "Wow, I need to write this down." And then afterwards, "Well, I can't believe I wrote this. It feels more like a reception rather than me having come up with it, me having invented it." And it's the same with the with the painter. They say, "I can see it. I can see it. I just need to put it down on the canvas." That is not imagination. That is creative vision. And that vision not only does it not rely on imagination, imagination is its enemy. That vision cannot be received when the seeing is blocked by imaginations. All day we are having dinosaurs fight each other in our heads still. And all day we are imagining what would my life have been like if this, what could it still be like if now I started doing this and this and this went this way and then that. All of this is going on and so this vision cannot be received. It is blocked. There's already a movie playing. You can't play two movies at once. And so, if we let go of our imagination, this vision can come in. And this vision, if you're an artist, will tell you exactly what to draw, what to write, what to sculpt, what to make, what to build. If you're a maker, it will tell you exactly how to do it. If you have any kind of logistical problems, uh how do I get to work? This this road is closed and my car is broken down. That vision was aha, this. It comes to every solution simply comes to you. Don't you remember the best solutions in your life, the most creative ones, since we are talking about creative creativity. The most creative solutions have always come to you, haven't they? We have never spent 16 hours at our desk trying to come up with a solution. And if we did do that, it was a momentary experience with aha, now I have it. We were just in that 16 hours, we were just focusing on it so much that we were open enough cuz we're focusing on this, we're open and we're not allowing the dinosaurs right now. We're saying I'm looking for this and so we're we opened up just a little bit so that the solution could come in, the creative solution. And so, it has nothing to do with imagination. And this is the law of the universe. All that is truly good is wholly good. Meaning all that is really good is entirely good. There's no bad to it. This universe never asks you to take in nutrition together with poison and to get the nutrition you have to eat the poison. It has never asked you to do that. Every single thing that is truly good, love, truth, justice, these are wholly good, entirely good. And why should it be any differently with this? There's nothing good about imagination. At least not in the spiritual so-called realm. When you're saying, "How should I live? What should my life look like? What is the meaning of this life?" Then you do not go into imagination. Imagination cannot help you there. Imagination is you. It's your mind. The mind cannot perceive these things. There's a reality, there's a truth out there that the mind can have certain insights into to some degree sometimes. But this mind is never going to be able to wrap itself around that. And the imagination therefore won't be able to either. This truth is speaking to you. This truth is trying to come in at once. It cannot wait to come in. But we have to we have to empty ourselves first for that to be able to fill us up. And so I challenge you. This is not a challenge. You will see. Every time you go into your imagination, stop. Just stop for the sake of it, not because you know it's going to work out. Fully expect that you're going to have a terrible experience and fully expect that you wish you had gone into your imagination. Fully expect that and do it anyway. Don't allow the imagination. Just as an experiment. Be scientific about this. I'm going to experiment. If this experiment's successful, I'm going to double down on it. If it's unsuccessful, I'm going to double down on the imagination. Because if imagination is something good, then we should double down, triple down on it. Why are we doing this half thing? And this is very important for when we do this. Every time we go into our imagination, let us stop ourselves if we can. But if we realize, "Oh, no, I've been in my imagination for half an hour already and I didn't realize." It's not a failure. That is not a failure. Let that happen. The fact that you are realizing that you were in your imagination for half an hour or 10 hours, that is a success. It is not a failure. Because this machine has been running for so long, it's not just going to be able to be stopped at a moment. Of course, we're going to keep falling back into it for however long. But before we allowed it, now even if we were 2 hours into it, we can say, "Okay, that happened. I'm going to come back out of it." And as we do that, we're going to be able to come out sooner and sooner and and at some point even say, "Ah, I'm slipping into the imagine I haven't even slipped into it yet. But I'm I was just about to escape into it because again, this person is so boring and they've been going on for a long time and I'm at work. I can't just tell them to shut up. Like they This is This needs to happen. So, instead of escape, I'm going to stay right here. I'm just going to do that. And I'm telling you that the beauty you're going to start seeing in reality without escaping it whatsoever, without inventing, imagining, escaping into anything. And uh the value you're going to see in that and how much longer your day is going to become. And how much better your sleep is going to be and how much more likely you're going to be able to get out of bed easier. And to find time and energy and attention and focus for all those things that you always wanted to do, always wanted to devote yourself more, such as perhaps philosophy as we do on this channel. It's going to be mind-blowing and I I I can promise you that if only you give yourself to it. That this is the one rule to observe. Observe. Every time you say you know It's nice that I'm at the park right now. I'm sitting here with my dog, but she keeps looking at ducks and things and she's so nervous. I wish she would be more calm. I wish I had a cold drink. It's kind of warm, but I don't want to get up. Every time I catch myself doing that and then the imagination tells me, "Come escape into me. It's much better here. You can have all the drinks you want here." Don't allow it. Sit with that. Sit with that. Say, "But this is reality. This is how it is and it's still beautiful. I'm I'm so lucky to have this dog who's such a beautiful personality. And to be able to free to be free to be able to do this and to not be stuck in some place that doesn't have any natural beauty. There's always something to be grateful for and your gratitude is just going to increase, increase, increase as you do this. Really life is so beautiful and it's not only beautiful for the privileged. That's another lie that the imagination tells us because it doesn't want to let go of us. It says, "Others have it well. You will never be able to have it well. Uh maybe one day, maybe one day if you achieve this and this and this and this, perhaps then you can be happy. Perhaps then you can be at peace. Perhaps, then you can you will be able to see some beauty in the world. But, until then, there is no beauty, you see. It's a lie. It's a lie. Some of the least intelligent people live this way. In peace, without imagination, in creativity, in beauty, in truth, and in love. And some of the poorest people live this way. And they do not look at anyone else for solutions, for salvation. They already have it. And I ask, why shouldn't we be able to do that?
