transcript: '{"content":"\n[0.24s] What if one of the most powerful sources\n[2.159s] of happiness wasn''t something you had to\n[4.4s] get, but instead something that you\n[6.4s] could tap into all around you?\n[10.24s] What if the secret was simply learning\n[12.08s] to enjoy other people''s happiness? This\n[15.759s] is a central practice from early\n[17.76s] Buddhism.\n[19.439s] A recent article by Naen Levy in the\n[22.08s] Guardian discusses this whole this whole\n[25.199s] practice. And I''ll I''ll leave a link to\n[26.64s] that article below in the in the notes.\n[30.8s] But when it comes to other people''s\n[32.32s] happiness, our default setting is often\n[35.44s] in opposition.\n[37.36s] We have a tendency towards what''s known\n[40.16s] as the comparing mind. Conceit is what\n[43.12s] it''s called in early Buddhism.\n[46.16s] This is a kind of scarcity mindset where\n[49.2s] we feel that somebody else''s success\n[52.239s] somehow diminishes our own or has to be\n[54.64s] understood in comparison to our own.\n[59.68s] This is only made worse in the age of\n[62.559s] social media where it can feel like\n[64.559s] we''re in constant competition with\n[67.28s] everybody.\n[68.96s] The solution to the problem, which I''m\n[70.96s] going to discuss in this video, is one\n[74.0s] of cultivating joy in the success and\n[76.64s] good fortune of others. It''s a simple, a\n[80.479s] free, and a potentially transformative\n[83.04s] practice.\n[84.64s] It''s not something about pretending.\n[86.72s] That''s not what we''re trying to do.\n[88.479s] Instead, it''s about training the mind.\n[92.079s] In the earliest Buddhist texts, this\n[94.72s] practice had a name. It was called muda.\n[98.0s] from the poly language.\n[100.56s] While the term is often translated into\n[103.2s] English as sympathetic joy,\n[106.64s] the poly word is somewhat simpler\n[109.36s] meaning bas something more basic just\n[111.84s] like joy or gladness or\n[113.92s] soft-heartedness.\n[115.68s] It''s the opposite of a closed off or\n[118.399s] resentful heart.\n[121.439s] Muda is importantly the third of the\n[124.479s] four what are known as Brahma viharas or\n[127.04s] abodess of the gods. That is four mind\n[130.959s] states that we skillfully cultivate in\n[133.52s] Buddhist practice.\n[135.76s] These include kindness on the one hand\n[139.12s] otherwise known as loving kindness or\n[141.2s] meta compassion\n[144.0s] muda being the third and finally\n[146.48s] equinimity as the fourth.\n[149.52s] Muda is the natural partner to\n[152.56s] compassion or karuna.\n[155.36s] While compassion wishes to end the\n[158.56s] suffering of other people who are\n[160.16s] suffering, muda or sympathetic joy\n[164.08s] revels in the success and the good\n[166.239s] fortune of other people who have\n[168.72s] successes and good fortune.\n[171.68s] Now this distinction between muda and\n[175.12s] compassion is not very clearly made in\n[178.16s] the early texts. However, I think its\n[181.84s] development over the years captures\n[184.48s] something essential to our practice.\n[188.879s] Sympathetic joy is a direct antidote to\n[192.56s] jealousy, to envy, and to resentment.\n[195.92s] The feelings that we get when we see\n[198.0s] that somebody else got the job, got the\n[201.12s] relationship we wanted or the successes\n[204.159s] in the world that we were looking to get\n[205.84s] ourselves.\n[207.76s] As the Buddhist teacher Sharon Salsberg\n[210.48s] also points out in her book on loving\n[213.12s] kindness, Muda is also an antidote to\n[216.56s] the subtle arrogance that other folks\n[219.519s] should only find joy in the things that\n[221.599s] we ourselves value.\n[224.64s] That is this practice can also help us\n[228.159s] to appreciate somebody''s simple joy in\n[231.36s] their strange hobby, in their odd family\n[235.12s] or in their crazy accomplishments\n[238.239s] even if we don''t share them or even\n[240.959s] share any particular interest in them.\n[244.08s] That is it counters this practice of\n[246.4s] mooda counters our tendency to demean\n[250.0s] what we don''t understand or don''t\n[253.2s] appreciate.\n[255.68s] These failures to understand or failures\n[258.799s] to appreciate can come from a core\n[261.919s] delusion that is that happiness and\n[265.84s] success are scarce resources.\n[269.84s] We get tricked, I think, by our mindset\n[272.56s] into treating our lives as a zero someum\n[275.44s] game where for me to win, somebody else\n[279.759s] must lose. And of course, the reverse.\n[283.52s] If they get the promotion, the praise,\n[286.72s] or if even they just get the simple joy\n[289.199s] of again a weird hobby of some kind, it\n[292.8s] feels oddly as though there''s less\n[295.84s] happiness left over for me.\n[299.199s] And this mindset that we often get\n[301.28s] ourselves into is the engine of\n[304.08s] striving. It fuels a constant exhausting\n[308.4s] cycle of social comparison where we\n[311.759s] measure our worth against the successes\n[315.28s] or at least apparent successes of the\n[317.919s] other people around us. It''s one key\n[321.68s] root of our unhappiness since it ensures\n[325.039s] that we''re never truly content with what\n[328.24s] we have. Somebody else is always going\n[331.199s] to have more. Somebody else is always\n[334.0s] going to be doing better.\n[336.56s] In this way, the practice of sympathetic\n[339.84s] joy is a kind of conscious reframing.\n[344.24s] It helps to train our minds to see\n[347.039s] another person''s good fortune not as a\n[350.639s] threat to our our well-being but instead\n[354.4s] as an opportunity to connect and to feel\n[358.16s] joy ourselves.\n[361.52s] So how do we practice muda? It starts\n[365.6s] with recognizing the moment that envy or\n[369.039s] resentment arises in us and then making\n[372.08s] a conscious intention to shift somewhat.\n[376.24s] Let''s say you''ve been wanting to run a\n[378.4s] marathon and you see that your friend\n[382.479s] posts online that they''ve just completed\n[385.199s] one.\n[386.96s] It may be very natural resentment arises\n[389.44s] in you. But what we can do in that\n[392.8s] circumstance is to practice making that\n[395.199s] shift.\n[396.72s] Practice thinking that''s amazing for\n[400.4s] them. I know how hard they worked for\n[402.72s] that or how hard they''ve been working\n[404.72s] for it. And we can imagine how wonderful\n[408.0s] it would be for them to have that\n[410.4s] experience, to have had that experience\n[412.72s] in their past. If we can get ourselves\n[416.16s] to that kind of place, we can begin to\n[418.56s] perhaps feel some warmth towards them,\n[421.44s] some connection, and even perhaps be\n[424.4s] inspired by them. We haven''t lost\n[427.599s] anything after all. Instead, we''ve\n[430.16s] gained, if we can get there, a moment of\n[432.88s] shared happiness. And maybe we''ve even\n[436.08s] gained connection to a friend who can\n[439.52s] show us how to run that marathon\n[442.56s] ourselves.\n[444.08s] so that we can both succeed together.\n[448.0s] As Naen Levy says in her Guardian\n[450.96s] article that I mentioned before, we can\n[453.84s] start this kind of practice with simple\n[456.72s] everyday exercises.\n[459.199s] For example, if we''re walking in a local\n[461.759s] park, we can spend time watching the the\n[465.199s] ducks pining themselves, she suggests,\n[467.759s] or we can watch the kids playing in the\n[469.919s] playground. people sitting on benches\n[472.96s] talking to each other happily.\n[476.0s] We can try to consciously take a moment\n[478.72s] to feel gladness for them, for people\n[481.36s] who are having a good time. We can\n[484.8s] silently wish them well. May your\n[487.52s] happiness continue. May your good\n[490.08s] fortune remain.\n[492.879s] This kind of internal practice of a kind\n[495.84s] of a mantra like this can help shift the\n[499.44s] mind from one of comparing ourselves to\n[502.72s] others to one of appreciating others.\n[507.12s] Or we can decide to undergo or take unto\n[510.319s] ourselves a more traditional formal\n[513.12s] practice. That is to say we we don''t\n[516.24s] necessarily have to practice this by\n[517.839s] walking in the park. We can also simply\n[520.479s] sit down on a chair or in a cushion in\n[524.08s] formal meditation.\n[526.72s] Now the early practice of muda was\n[529.839s] simply to spread a heart full of joy in\n[533.279s] all directions to all beings wishing for\n[536.56s] all beings continued happiness and\n[539.36s] success.\n[540.88s] But for many of us it may be difficult\n[542.8s] to generate that feeling of sympathetic\n[545.519s] joy without any real uh spark.\n[549.839s] So later practices may be somewhat\n[552.56s] easier for us. In particular there''s one\n[555.04s] from the fifth century text known as the\n[557.279s] vudi maga by budosa.\n[560.56s] And budosa makes the practice a little\n[563.92s] bit clearer and a little bit easier\n[566.08s] easier for many of us.\n[568.72s] He says we should start with a close\n[571.12s] friend whose success we would most\n[574.24s] naturally resonate with. Now if for some\n[578.08s] reason our close friend isn''t happy or\n[581.2s] successful right now, we can try to\n[583.839s] recall some time in the past where they\n[586.8s] were happy and successful. We can bring\n[589.76s] them to mind wishing that their\n[591.76s] happiness continue and that their good\n[594.72s] fortune remain.\n[597.519s] If we can retain that state of joy\n[600.32s] within ourselves and make it somewhat\n[602.8s] stable, then perhaps we can turn to\n[605.68s] what''s known as a neutral person. Let''s\n[608.32s] say somebody that we see regularly\n[610.48s] during the month or during the week, but\n[612.88s] whose name we don''t know. Perhaps it''s\n[615.36s] somebody in the post office or somebody\n[618.32s] we run across in the grocery store from\n[620.64s] time to time. Let''s try to extend the\n[623.839s] same kind of wish to them.\n[627.04s] If we''re able to do that for a time and\n[629.76s] again stabilize that practice of joy\n[632.56s] towards somebody neutral to us, then we\n[636.0s] may consider moving on with our practice\n[639.04s] to the harder case. And this harder case\n[642.64s] is to try to extend the same feeling of\n[645.92s] sympathetic joy to a difficult or a\n[649.12s] hostile person in our lives. Now, I\n[652.8s] suggest not beginning with the most\n[654.8s] difficult or or hostile person at first\n[657.2s] because we''ll probably not have success\n[659.519s] at that. But can we begin with somebody\n[662.32s] who''s a little bit difficult and at\n[664.399s] least come to see them as somewhat\n[667.279s] neutral as a person that we see for once\n[670.64s] once in a while in the grocery store and\n[673.12s] don''t really care about. Now this isn''t\n[676.24s] indeed an advanced practice but the aim\n[679.839s] eventually is to understand that even\n[683.36s] the success and good fortune of somebody\n[686.079s] who''s difficult for us doesn''t harm us.\n[690.16s] Their happiness is not our sorrow.\n[694.64s] Now practices that like these that I''ve\n[697.279s] been mentioning raise a couple of\n[699.279s] important questions.\n[701.92s] Namely, to start with, what are we going\n[704.079s] to do about issues of social justice?\n[707.2s] That is, are we supposed therefore to be\n[710.32s] joyful for people who succeed through\n[712.959s] some unjust system?\n[716.24s] But the key realization I think we have\n[718.399s] to have here is that compassion,\n[721.76s] compassion for those who suffer and joy\n[725.44s] for those who are doing well are not\n[728.32s] necessarily mutually exclusive.\n[731.36s] That is the as I''ve been saying our\n[733.6s] world is not a zero someum world.\n[736.959s] Indeed, this very article from the\n[739.12s] Guardian was brought to my my attention\n[742.0s] by Anne Glig who''s a scholar very active\n[745.92s] in social justice movements.\n[749.04s] That is she sees I think at least that''s\n[751.76s] my interpretation here. I can help see,\n[754.56s] I think, that muda, this practice of\n[757.04s] sympathetic joy,\n[759.36s] can help prevent what''s a very healthy\n[763.519s] activism from curdling into resentment\n[767.04s] and therefore burnout\n[769.519s] by keeping the focus on creating a world\n[772.639s] where more people can be happy, not one\n[775.92s] in which we''re all equally miserable\n[778.399s] through tearing each other down.\n[782.0s] The second problem comes when we\n[784.639s] consider\n[786.16s] uh people who have a kind of a malicious\n[788.8s] joy or happiness. What''s sometimes known\n[791.839s] in German as shoden frea? That is people\n[795.36s] who take joy in the pain and suffering\n[797.68s] of others. Are we supposed to be happy\n[800.56s] because of their kind of joy?\n[803.92s] Now to be fair, I think to an extent we\n[807.36s] all take joy in the suffering of other\n[810.24s] people when we when the person that\n[812.88s] we''re thinking of we frame as the bad\n[816.0s] guy. When we think of the person the bad\n[819.04s] guy getting his comeuppance,\n[822.0s] we get a certain amount of what''s known\n[824.24s] as again shodroa. this kind of joy in\n[828.16s] the in the misery of this bad guy.\n[832.8s] To be fair or I should say to be\n[834.639s] realistic from a Buddhist psychological\n[837.76s] perspective, this joy, this shoden frea\n[841.6s] is not true joy. True joy from a\n[845.519s] Buddhist perspective should be\n[847.44s] understood as naturally a wholesome\n[849.839s] experience.\n[851.839s] Instead, this kind of shoden Freudic\n[855.199s] joy, we might say, comes from a mind\n[857.92s] that''s subtly been corrupted and\n[860.72s] unhappy, as we all indeed are to an\n[864.0s] extent. And the appropriate response,\n[867.279s] therefore, to somebody who revels in the\n[869.92s] misery of others around them is not one\n[873.279s] of ratcheting up our own anger or our\n[876.399s] own malice to match their anger and\n[878.959s] malice.\n[880.48s] Instead, it should be one of compassion\n[883.36s] for the suffering that must lie behind\n[886.959s] such an unfortunate way of gaining\n[889.519s] pleasure.\n[891.6s] Now, note that I say we should have\n[894.399s] compassion for people who take joy in\n[896.959s] the suffering of others. But often this\n[899.519s] kind of compassion is very difficult to\n[902.8s] generate in ourselves. And let''s be\n[905.279s] honest, it''s often hardest to have\n[907.6s] compassion for ourselves when we catch\n[910.8s] our own minds taking pleasure in the\n[913.36s] misfortune of others.\n[916.56s] The upshot here is that happiness, the\n[919.12s] joy are not zero sum games. It''s not\n[922.88s] that when somebody else becomes happy, I\n[925.92s] must therefore become discontented.\n[928.959s] By cultivating sympathetic joy, we begin\n[931.76s] to unlock the ability to tap in to what\n[935.279s] really is a limitless supply of joy and\n[938.399s] good fortune that exists in the world.\n[941.76s] We may begin to see our way out of the\n[944.16s] discontent brought about by our hyperco\n[947.6s] competitive culture and the zero sum\n[950.399s] mindset that arises from it. Our\n[953.839s] ordinary attitude of scarcity leads to\n[957.279s] our striving and to our grasping to\n[960.32s] conceit and to comparisons.\n[962.8s] Mudita on the other hand gives us a path\n[965.44s] away from the mindset of scarcity and\n[968.0s] striving and towards one of connection\n[971.04s] and mutual appreciation.\n[974.0s] We are all in this together. Once we\n[977.279s] begin to understand that basic fact, we\n[980.16s] begin to understand that our neighbors\n[982.48s] successes are truly ours as well. If\n[986.959s] you''re interested in this general topic,\n[990.079s] I have a previous video about aspiration\n[993.6s] versus craving. That is how we can\n[996.399s] navigate contentment versus ambition\n[999.92s] within Buddhist practice.\n[1002.959s] And if you''re getting something out of\n[1004.48s] these videos of mine, consider taking a\n[1006.32s] look at my Patreon page, which is linked\n[1008.959s] up here on the screen and down below in\n[1010.639s] the notes, and see if you want to help\n[1012.72s] support the channel and the work that\n[1014.32s] I''m doing here. So, thanks so much for\n[1016.639s] watching, and we''ll catch you on the\n[1018.0s] next video. And meanwhile, all of you be"}'
