lem was the primary technical challenge there? There were many interesting problems there. So the problem I helped solve was more technical. We had these machines that had limited memory and if we vertically scale the machine to have more memory it's expensive. So how do we load the search index as much of the index into that machine as possible? That was the problem I worked on. The way I solved it was by like looking at the data that is being loaded and identifying patterns that could compress the data a lot. So, we turned a I turned a 9 GB index into 400 MB. It was a massive compression. And it was by looking at the data and realizing, "Oh, we're using so many bits for a number that is never like bigger than 256." So, like there were many many problems like that, right? So, by dealing with the data, by analyzing it, I could find opportunities to Interesting. Okay, so then you're like news is the side quests. The main quest you thought was like games. That's where the action's at. I actually didn't realize that. I uh So, interesting story. You know the meme where Zuck was saying, "Senator, we run ads." Yes. >> Right? So, Facebook was definitely an ads company, right? The teams, they would run ads on Facebook to recruit engineers from within the company to their team. So, I I was just like scrolling my Facebook on my phone and I saw this ad. It's coming from the games team. And the team just run the ad and say, "Hey, we are working on some super exciting products here. We're working with Blizzard and like Zynga and all these companies to build a really exciting games platform on like on Facebook in Messenger and everywhere." So, that got me really hooked and I was I was a big gamer myself. I thought if I worked on games, that would be super fun. So, I decided to jump. Wait, so you're telling me that Facebook ran internal ads for open developer positions within the company? Yeah. Do they still do that? Uh No, I don't know, but back then that was the thing >> you were scrolling on Facebook, so they're like, "How best else to reach you?" Yeah, yeah. I think running internal ads, they didn't they didn't have to pay like no one has to pay out of pocket, right? Like so, people just do that uh to like recruit. >> [laughter] >> It's actually very competitive within Facebook uh among different managers to acquire the bootcampers. So, new people join the company, they have to choose the team they uh work for, right? So, it's actually very competitive to get the people you want. Uh so, there were many many teams always have open positions, but they have to go to those bootcampers and really like lure them into their team. And there were so many interesting things the managers did to like get people in. What was the core technical challenge at the games division? I think the more interesting problems over there were product problems. So, technical problems, a lot of those uh things within Facebook, they have really good infrastructure. So, you don't have to like reinvent the cache. You don't have to reinvent the database. All those things were already done. The product teams, they mostly deal with product market fit, right? What kind of features will be actually adopted by users and will be actually valuable? So, I spent a lot of time back then talking with game developers to understand how they design games, what kind of games will work well on the Facebook platform. Cuz social gaming was not something that's figured out. Everyone was kind of I think before that like the Facebook games era, everyone was building games more in like a standalone format, right? You would build a game, you would sell it on Steam, uh and that's it. But on Facebook, uh it's a social platform and people talk about things in conversations, people post uh about things on their newsfeed. The communication protocol is very different. So, we had to design the platform to really fit well with the social dynamics over there. And that required code development between the platform and the game developers and sometimes the users themselves as well. So, I spent a lot of time just talking to game developers and uh really work with them to co-design what kind of games can work well and also talk to gamers, people who like to play Farmville, those basketball game in Messenger and Words With Friends, those games, right? Talk to those those users and understand in what scenario do they actually play the game? Who do they play with? What kind of privacy assumptions they have, those game activities, etc. etc. I think it required understanding all those aspects to figure out what is going to be a successful platform. So, that was the probably like the most interesting problems I worked at. So, after you spoke to all of these partners, like what was the output? Were you thinking about the ergonomics of like the APIs, you know, the facilities that you were exposing to these developers or like what was the actual output? Yeah, yeah. So, one example, when we started that project, we started with the basketball game. Maybe many people still remember that. So, you can throw basketball in Messenger and get a score. The score will get posted into the thread and people just compete. So, we saw that and we saw a lot of people loved playing that game in that kind of format. So, we thought, oh, it would be super interesting to build a platform so other games that have a high score mechanic can also come in and be played in the same way. So, we designed the whole platform with a high score and leader board mechanic in mind. And that was a big mistake. So, yeah, so we we spent months building that mechanic and building every part of the user experience with that assumption in mind. And we launched a product. We launched a platform. We had a few games that went live with us. I think we launched that before Christmas. We came back after the holidays and we look at the user retention numbers were just so bad. So, we then talked with the game developers and tried to understand why. The first round of the launch, we didn't even talk to many game developers. We just like built things that we thought will will useful, will be successful. We assumed it's going to work. And we tell the game developers, work with us on this format. Don't ask questions. Just do what we say. We gave them an SDK and that's how things work. That's it. After we see, oh, it's really not working. Why? Then we realize, let's talk to the game developers and see how they think about this, right? They have experience building games for decades. So we talked with them and they say, oh, that's because the high score mechanic is just too limiting. I have all these games here, like Words With Friends, right? It wouldn't work well in a high score format, right? It doesn't have a high score. Like you you play turn by turn. It's a turn-based game. And then other people have other games, real-time multiplayer games, like those IO games, like all kinds of games that wouldn't fit well with the format that we provided. Then we realized, okay, we made a wrong assumption and we need to redesign the platform. So we then kind of reshaped how we provided the SDK and how we provided user experience as well. We just like removed all the assumptions about high score. We gave the flexibility of what kind of activity is worth posting, gave that flexibility to the game developers themselves. And then we started to take this to see things take off. And people built quiz games, trivia games, turn-based games, all those things that were super interesting. And people started playing more and more. You made the cardinal sin of not talking to your customer and understanding them and then building something. And then after you realize that they weren't using it, that's when you started the first step of talking to them. Yeah. And I think with the games platform, it's interesting because there are three parties. One is the platform, one is the game developers, and then there's the actual players, right? These three parties, they have different concerns and we kind of have to like navigate across all three parties to really figure out what's going to be a good fit. So during this game development work, this is also when you were growing in your career as well, right? So you went from junior to E7 during this time frame? Yeah. And I took a detour to become a people manager for 2 years as well Uh during that journey. That's also super interesting. I learned a lot. So yeah, let's get into it. What's that story of going to become a manager? What did you learn? I think you went back to becoming an IC afterwards, so that wasn't a permanent thing. Yeah, yeah, so I I think I was following my curiosity. So I have to been an IC for a long time. It was maybe the eighth year of being an IC in my career. I felt like I never explored what's a people manager role looks like. I might like it and I thought I would. I I was pretty convinced that's like going to be the end game. So the opportunity came up and I just said yes. That was also an interesting story where my manager came to me and said, "Hey, like we need to scale the team and we need to have a manager that supports one part of the team." Because the team is growing, we have more and more people. So he asked me whether I want to be that manager and I immediately said yes. I just thought that's the natural next step and why not, right? And I was curious to see what that looks like. And then the VP had a one-on-one with me. The VP is now the CTO of applications at OpenAI, VJ. Oh. Yeah, that was our VP back then on Facebook games. So I talked with him. He just scheduled a one-on-one with me and we got into the room and he asked me, "Why do you want to become a manager?" And I said a bunch of things and then at the end he told me those are all red flags. You should not be a manager. >> [laughter] >> You should not be a manager. That's not the right motivations and you you probably won't like it. >> Wait, what did you say to him? That was What was the biggest red flag out of that group of things that you said? >> I I said things along the lines of I want to make bigger impact. I want to really like scale my scope. I want to work on bigger projects. I want to really influence a group of people, not just myself, like work beyond what one person can do. That sounds like what you might hear if I pulled any manager out and it's like, "Hey, tell me about the time that you became a manager. What did you say to your VP or to your director about why you wanted to be a manager?" They would have said those things, right? >> Right, right. So, those things I think are the things that people who haven't been in the management position would assume the role is about. And for a lot of managers, that's indeed the case. That's how they operate, and that's how they get value from being in that role. Um but I think after me being in the management role for 2 years, I I think I agree with that VP. Like the those motivations were not the right motivations. So, if working on bigger problems is the only motivation uh to go into management, you can do that without being management, right? You can influence people, you can work on big problems, and a lot of ICs do that. Uh I do that today. I think being in management is really more about supporting others, figuring out, hey, I have a team here, how do I help them do more? How do I help them grow in their career? And a lot of the time will be spent on that. And how do I recruit the right people uh onto the team, right? To make the team stronger? So, a lot of that is in kind of a support role. That was the reason I decided to come back to be an IC. There were just uh many, many weeks where I look at my calendar, and every week about 70% of my calendar was already booked. Okay. Uh so, it's regular stuff. Every week, same thing. Just keep grinding. There were so many one-on-ones, there are so many team meetings, uh there are meetings with other