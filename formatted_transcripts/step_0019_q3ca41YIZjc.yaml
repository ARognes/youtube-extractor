ually present some interesting results that's just not this particular user's preference?" Right? So, we need to understand that. And that requires data. So, there was no tooling within Bing back then to easily let you like type a query and see where did people actually click? So, I built a tool to do that. No one asked me to do it. I just had a free time and I realized there's this problem. Just did it and it went very popular within the team and more and more people started to use it. And that's I think what's helped me with the first couple of promotions cuz I was very independent and came up with these ideas, took initiative to build things that were useful. It made it very easy for me to stand out from the crowd. Like there were so many engineers, all very talented, but I think that's the thing that's led to me to get a few like very quick promotions in the beginning. So, you said when you were a junior engineer, you just like got all of your work done as quickly as possible. Were you one of those people that like spent like all night and weekends and slept under your desk? Or were you the type that just came in no BS, you got it all done, but then you also left at the, you know, right when it hit 5:00? At times, I would stay late. And every time I did that, it was because I found something just that's just like too fun to not continue working on it. Like sometimes get into these problems and I feel like, oh, maybe like 15 more minutes I can solve it. And then I ended up spending the whole night. So, that happens, but I think more often than not, I do just like leave at time and I go back to my place, I continue coding. Just build build other stuff as well. Okay, so you you kind of like gamified it or it was a game to you. Right? It's like, how quickly can we do this? How fast like did you sacrifice quality? Was it also high quality or was it kind of like fast and Uh yeah, I think I didn't sacrifice quality. I think everything I did, I tried to make sure like it's actually useful things, it's a quality work. I do make trade-offs on the scope of the things I do. So, I typically start very scrappy, use whatever existing building blocks that already there, try not to reinvent the wheels and try not to like go into rabbit hole of spending like 2 weeks solving something that's just like interesting but not super useful. Um so I I try to control the scope very precisely so I can deliver something useful to people quickly and get feedback. And sometimes people will like, "Oh, I thought this will be useful. Thanks for building it uh but it's actually not as useful as I thought it would be uh after I got it." So getting real-world feedback I think is very useful. There is a world where that tool that you built to get insight into how customers were using the search results page, somebody been like, "Huh, thanks but So did you get really quick feedback on that or did you did you like big bang created and like make a bunch of features and then show it to people? Or was that part of your mandate was to build the tool? No, I think I built tool in the way I think people will find value. Um and uh I built the first version, I showed it to a few people and those people gave me some feedback like which part of that was useful and which things they would probably like change. So I then took those feedback and started make iterations and make that more and more useful. So yeah, it took a while, took a few iterations but Were you like a junior or a mid? Junior. So entry-level. Got it. So you were you were entry-level I don't know what entry-level at Microsoft is like 60 or something. Like 59. You were 59. You hadn't made it to the state So you're 59 and you were just doing this on your own. Yeah. Okay. I work with a lot of people on their careers and they'll come to me and they'll be like, "Steve, like my manager won't assign scope to me. How am I supposed to get promoted? How am I supposed to grow my career?" And you're just saying like as 