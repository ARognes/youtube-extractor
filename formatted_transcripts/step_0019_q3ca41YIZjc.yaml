gy for product. And someone who has no knowledge about like product business and design, they can get like some decent capability from AI and then they can learn from the other crafts, right? My assumption would be that the talent stack will collapse and everyone's skills tend to become more uniform and like people will be less specialized and more generalist and more versatile. Those people will have advantage over others and that will become an incentive for more people to become like that. Do you think of a a world where maybe in like a large organization, devs are these super generalists? They are working together to orchestrate agents or do you think of them as carving out mutually exclusive ownership boundaries and then making sure that they are responsible within those boundaries, but not really collaborating with each other? I think there will be still human collaboration. When you look at what one person can do versus what one person collaborating with a lot of other humans can do, I think the latter will always win. Uh when you really have a lot of smart people working in the same direction. So, I think human collaboration will not go away, but it will raise the bar for when do you need that collaboration and when is the right trade-off. So, when you work with one person, I think right now a lot of startups, the golden path they have is like they build something, have some like reasonable traction and start to get funding to grow a team, right? To have more people working together. I think one person can now go further without having to do that. One person can do a lot without having to get funding because all they need is like $200 for the subscription. They can go pretty far. So, I think the bar will be raised, but it will not be eliminating the value of human collaboration. Well, what's next for you, Kun? Yeah, so I left Big Tech. I have been with big companies all my career and I think when I look at my next steps and where can I really learn something that's completely new, I think I have to jump into a very different experience. And right now with AI, it just felt like the right moment to acquire a very different experience. Right now, I'm a solo builder. I have a whole bunch of ideas that I piled up over time that I would love to explore. I would also love to start creating some more content of my journey, what I learned to share with others and engage with the community. I think that would be a really fun role for me to be in and I will learn a lot and hopefully some of the things things I build will be useful. That's awesome. I'll put all of your links for your YouTube channel and your Twitter in the description. Kun, thanks so much for having the conversation today. It's been great. Yeah, my pleasure. Thanks, Steve.
