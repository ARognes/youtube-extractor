t fascinated by what you can do. From someone who's never played with computers before, it It fascinating. So, I started doing more and more. Uh and then there was this summer camp uh at my elementary school that uh taught programming. Back then I had no idea what it was. I just went to uh the teacher and like look at him and say, "What can we actually learn here, right?" Uh my parents and grandparents were trying to decide, "Do I go there or not?" I uh talked to the teacher and the teacher just said, "Hey, look at this game I'm playing. I built it. You can build it too if you learn programming." I got very interested. Uh that was like a really good hook to get a kid into programming. So, I started to take the lessons there and it was interesting like the whole 2 months of learning programming. No one had access to computers. It was learning from uh whiteboards and writing on paper and the teacher will compile it for you and try to run it for you and get you the results because like computers were like not that common like as a resource uh that everyone has access to. So, Okay, so you learned how to program on with a pen and paper. Yeah. That's amazing. Yeah, so it was writing basic. We wrote variables. We wrote more and more complex flows. And at some point I think uh it was like at the end of the the 2 months of the summer camp, I finally got access to the computer where I can actually enter a program and run it. Uh it was just so super interesting and I got more and more into it. After the summer camp, I started doing like going to some competitions and and computers became more accessible and more common as well. So, in uh my I think my high school, there was a lab where everyone can just go and play with it. Uh so, I just got into it more and more. I built stuff. I I just loved building stuff. I think I went to a bookstore at some point uh when I was in high school and I got this book called How to Build Your Homepage uh something like that. And it was teaching