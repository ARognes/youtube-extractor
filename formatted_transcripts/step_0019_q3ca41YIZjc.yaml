icrosoft. So, Microsoft came to our college and they run a test where everyone can just go there and take a test and if you're good enough like they take you as an intern and I became an intern at Microsoft spent like a summer over there and did a lot of things interesting things with the engineers over there. And I got really impressed by Microsoft. And I think back then there were not so many technology companies that are so experienced at building large-scale software, right? And there were so many talented people over there. I learned a lot just from being there for 2 months. And then I decided to go back to there like to take that as my first full-time job. Uh so that's how my career began. What did you work on when you were an intern? It was Bing, the Bing search engine. Back then it was not called Bing. It was Live Search, MSN Search, or Live Search, one of that. They renamed and renamed a bunch of times, but it was the search engine. And I I helped build some of the features in there. I think it was auto auto suggest. Okay. So when you type in the search box, there was auto complete part of that I helped with. This episode is brought to you by Linear. And they just published something that I think is worth talking about. They opened with the new [music] manifesto, issue tracking is dead. And what that means is that the behaviors around it, like the manual logging of issues, the prioritization [music] back and forth, the grooming sessions, where half the room is just trying to figure out what's even in the backlog, these things are a thing of the past with Linear. I lived this nightmare at Amazon. We had mechanisms for everything. And don't get me wrong, I'm a big believer in mechanisms, but more often than not the process of [music] tracking the work took as much energy as doing the work. You come out of a sprint planning meeting and think, we just spent 2 hours so eight engineers can figure out what they already knew they needed to build. What Linear has done is rebuilt the platform so that the stuff happens automatically. Your code, your decisions, your customer feedback, all of that context all lives in one place. And Linear actually works from that. So when something comes in, the system already understands what it is and where it fits. Nobody has to triage it manually. If you're an engineering leader and you want your team building instead of administrating the work, check out Linear. The link is in the description. It's amazing, you know, I think that transition from hacking a computer on your own, you know, or writing programs on on pieces of paper to cheating on a massively multiplayer online game, it's still really small when you're on the client side. It's still, you know, you can still understand what's going on. But then making that big jump as an intern to being like, "Oh, this is what it takes to build a search engine." Like that what like that's an amazing change of scenery. Yeah, totally. And I think um maybe the first 2 years when I was at Microsoft, I didn't fully understand how the search engine worked. There were many diagrams, there were many documents explaining parts of it. There was this giant diagram made by someone that's been there for for quite a while since the beginning of building search engine. And there was this diagram that explained everything. And when I look at diagram, I can understand each part. I don't understand how they fit together and how they actually work at scale. So it's not something that is uh just very easy for someone new uh to the industry to grasp. But it's okay. Like I worked on uh the components that uh I helped with. I deal with the problems that were presented to me and I think that's how I began. Uh and then over time, I think the knowledge takes a while. Uh takes a lot of really in-depth work to like fully understand. It took me maybe like 2 3 years uh to really like understand the full picture. You went to Microsoft and you went there full-time. What did you 