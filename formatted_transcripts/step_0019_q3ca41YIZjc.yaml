to your team as well. Uh that actually like require a lot of investment. So, I think from a learning from a curiosity point of view, that's met my expectation. I learned a lot. And some of the things are super interesting uh even to today. When I work with agents, for example, I think one of the things I benefited from quite a bit from my management experience was to learn to lose control. When you have a team, when you are working through others, not by yourself, you are losing direct control on the problems, right? You are not going to control the code base. The code base might look ugly and you may not not like it. That's the same when we work with AI agents today. Some people when they work with AI, they micromanage everything. And if AI is generating some some codes they don't like, they spend so much time like tweaking it, prompting it to do things exactly the way they want it. I think that's like a mistake. Um I think when we work with AI, a lot of the same patterns apply. You have to think about this from a an organizational point of view and start to not have direct control. Start to think about what are some of the principles you can write down to help all the agents work better and control direction through that way. So I think, yeah, a lot of the management experience actually were quite beneficial even if I come back to be an IC. What was really surprising and then ultimately what made you want to go back to becoming an IC and writing code again? Yeah, so I think it was the grindy aspect. What happened was that after 2 years being a manager, I was actually a very good manager. Um so the teams loved me and I got really >> say so yourself. >> [laughter] >> I got really good survey results. So so like the company's run the survey and I look at that, compare myself with averages, other other teams. Doing pretty well. I I think I leaned into that role and I changed how I operate and I read a lot of books as well. Really good books about how to be how to operate as a manager. So I I think I did well. But then what happens after you do well is like people will want you to do more and I started to get the request to take on a larger team. So the team was still growing and we had other managers that left the company and kind of need to reorganize the team a little bit. And then I got asked, "Hey, do I want to take on this larger organization?" And then that got me like to really think. I suddenly felt like I could see what I I was going to do for the next 10 years. I will take on this larger organization. I will then do what the VP was like maybe not the VP yet, the director, what they were doing. And I I can see what they are doing and it's not that fun to me. So, I suddenly felt like, "Oh, if I can predict what I'm going to do for the next 10 years, that's not the kind of state I want to be in." I like more adventurous kind of way of working. I don't want to know what I'm going to do every single week. I kind of like had this thing in my subconscious that tells me, "Hey, maybe don't do that right now." So, I I decided it's not the right time to go deeper in that track. >> So, it was like the trajectory. You're like, "Okay, well, if I keep on going down this path, I'm going to get VJ's job and I don't like what he does. I like the guy, right?" Is that Is that kind of it? I actually like the VJ's job, but I I think it's going to take a long time to get to his job. So, yeah, VJ was super strong and I think when he was VP, he could manage every aspect of the business, right? So, he's not only a engineering manager anymore. It's actually more like a business owner and I I I like that. That I think I would enjoy, but it's going to take quite a while to get there and I felt like maybe that's a good end game, but not going to be where I start going down that track at that time. So, I felt like, "Yeah, let me at least spend maybe 10 more years as an IC and work on problems that will keep me motivated that will like really help me learn all the interesting stuff that's happening without committing to this like management role long-term." Were you a senior engineer when they asked you to become a manager? I was an E6. Okay. So, you're staff, I guess. Yeah, yeah, staff. Yeah. And then So, then they asked you to be a manager and then you went back to becoming a staff engineer. Is Did you still stay in games? Yeah, yeah. Okay. And then you got to E7 still in the games. >> Yes, still on the same team. Some people I talked with that also went into management, they actually felt nervous about coming back to an IC on the same team. They felt like people will see them differently, people will think they failed, whatever, right? They have this like a little bit of ego that is telling them not to do that. I think that's the wrong way of looking at things, at least from my experience. I was on the same team. I came back from a manager to be an IC. That was actually I think a great decision. If I jump to a different team, I think it would actually make my life harder. So, on the same team, people already trust me. I already worked with so many people on the team. So, being an IC, I can immediately establish a strong influence, right? I can very easily work with a lot of people that I used to work with. To be honest, no one cares like what you are I think sometimes we think people care about us way more than they actually do. The spotlight effect. Yeah. Yeah. You think everybody's looking at you, but they're not. Exactly. So, I think yeah, management, IC, no one really has the bandwidth to think about what you are doing. Like, they have their own jobs, they have their own career growth, they're managing, and what you are doing maybe is worth talking about for a week, and then no one's going to care about it. So, yeah, I think if people are in this position where they really want to like convert back to an IC role, but are worried because of the perception, I would say don't really think about that too much. What was the project or the set of circumstances that got you from senior to staff? And then after you became a manager, what were the circumstances that got you to from staff to senior staff or whatever E7 is? Yeah, it's mostly impact of the things that we did. So, going from senior to staff was mostly taking the games platform on Messenger off the ground and to a state where we actually have product market fit. We have a whole bunch of games running there, and it's working pretty well, and that I was a big part of that. So, I think the business outcome justified that and and the way I helped achieve that outcome was that I actually had to travel to a lot of game studios and talk to those developers and really operate in a way that is beyond what a senior engineer would do, right? I played more parts in the product decisions and everything. So, I think the strategic influence of my experience there was what took me to staff. Is it because Facebook I think Facebook famously was very reluctant to hire product managers, especially in the early days. I know they have a robust product management team now, but was this sort of during that transition where software engineers were expected to just have much more of a product impact? Yes and no. I think on some teams, yes. So, on some teams the the engineers were actually expected to also take on product decisions, but it's not uniformly across the company. So, I think on my team back then it's not the expectation. You can do fine without playing like the product thinker role. You don't have to do it. A lot of engineers they do pretty well by just being like a good engineer. But I I liked doing that and I felt like that was that's the bottom neck of the business is to understand product market fit is to like take the business it really onto the right track. If I didn't do that, then the project wouldn't have had the impact and the product market fit it had, right? So, I felt like I had I had to do it for the project to succeed. It's the project success that justified my impact as well. Yeah, I think if I just did what I would do as an engineer as a pure engineer, the project probably wouldn't have been as successful and I wouldn't have been promoted. You flew out to these game companies to meet with these people and then talk with them. Did you just book the flight and then go? Like you realized that you needed to go and talk to them or did your manager say like, "Hey, we should probably talk to these people?" Yeah, it was a group decision. So, yeah, not not just me. I think we came back from the holidays and we look at data and it's not looking good and we were just like talking about what do we do, right? And Facebook back then already had a few of those events where we would go and meet people. So, we just leveraged some of those events and say, "Hey, let's invite some of the game developers to come to our event and let's talk to them there." For some developers that didn't come to our event, we traveled to them. So, yeah, it's it's a group decision. >> But it would have been very easy to just be like, "Hey, I'm just in my office. Yeah, I'll go to the event, but I'm just going to be in this isolated silo here doing this thing." Yeah, I I think especially when an engineer travels with a group to an event or something, I think especially for maybe introverts, I'm an introvert myself. I think the default is to like hide in my corner and do my thing, right? And whenever someone needs my help, I'll I'll go help. Yeah, I think that's the the thing we kind of have to break out of to really make an impact on business success, we have to break out of the boundaries and not think of ourselves as just an engineer, but think of ourselves as a really smart person that can play a big role on any project that we we are part of. Ever since that project, it gave me this mindset that the title does not matter. Whether I'm an engineer or any other title people give me, it wouldn't really change what I do. What I do is always going to be what is the most impactful thing I can do for the for this business and make it successful. What about the the jump from E6 to E7? What was What were the circumstances there? I think it's a continued growth of the games platform and the evolution of the games platform from being a messenger-centric experience to a Facebook-wide platform and a lot of the games had to evolve. So, we started from within Messenger and then later on we have to figure out how do we grow the platform. And Facebook newsfeed was actually a very big surface area that was not very heavily explored. So, we did a bunch of things over there and later on we had a live streaming platform as well, Facebook gaming live streaming platform and that also changed how the team's overall mission was. So, I played a big part of how we rationalize the strategy over there and how we evolve the platform from being a like a turn-based game in Messenger threads to a larger ecosystem. So, that was probably like the E7 impact I had. I'm just wondering like what part of that was expectations at E6 and then what was the thing that was the larger impact stuff? Like how did you have this nose for impact to know that you could go after a bigger scope, you know, outside of turn-based games within Messenger? Yeah, I think in general I just I have this this sense how can we take things to next level? I constantly ask myself whatever project I work on. I was just like never satisfied. I think whenever I have a project that's running well, everything's going smoothly, I would just panic. >> [laughter] >> I would just think oh like what's wrong? Why is this like just going so smoothly? Because I think when things are going very smoothly and you feel like oh, it will just keep going whether I'm here or not, then I'm not adding value, right? Then why am I here? Why don't I do something else that's more useful? So, I kind of like just panic every time I get into that state and I really try really hard to identify how can we take things to a whole different level and that's often required taking initiative step function changes. So, not just like incrementally keep growing keep doing the same stuff but but like grow faster or whatever but rethink the story. Can we actually do a whole different thing? Can we rethink the whole strategy? So, yeah, I have this like constant rhythm of uh reinventing or rebuilding uh whatever I was uh working on. You freak out when things are going well. Yeah. You just like thrive on chaos. I think about like a lot of people, when they're in the chaos, they think to my they themselves like, "What is wrong with this this company's terrible. There's all this chaos that's going on. If we work really hard, maybe we can get to these smooth seas where things are kind of running themselves." And so, they they do the opposite. Most I think just rational people, they'll freak out in the face of this chaos, but you're kind of built in this opposite mode where you're like, "If it's too smooth, then you can't you get you you freak out, you get this anxiety." Yeah, yeah. So, I think when things are chaos, I do try to solve the chaos, right? And that's the fun part of it. When things are chaos, and I look at that, try to understand, try to rationalize, "Why is that so chaos?" And what is happening, how can we uh solve it? How can we bring that to a good state? And solving that problem was the fun part that got me motivated. And if things are just going well, I have this crisis of uh why am I here, and what am I doing with my life? And I just I keep looking for things that are more chaotic. And that's one of the reasons I uh switched from Facebook back to Microsoft because I felt like the Games platform was established. I can still see some new things to do, but it's largely like there. I wanted to try something that was uh more like starting from scratch. So, Microsoft back then was trying to build a Games platform on MSN. I thought I could help uh cuz I know how to build a Games platform. Uh so, I yeah, went to Microsoft and start that from scratch, totally zero to one. It was super fun and very chaotic, and I really enjoyed it. So, you came back as I guess partner level at at Microsoft. Zero to one, you found the chaos again, but in a situation where you had much more domain expertise. Did you solve that problem and then it became calm again and then that's when you moved on? That's part of the reason. Uh, so I spent 2 years there uh, at Microsoft building that games platform from zero to one. Talking to largely the same developers that >> [laughter] >> have been talking to. I'm like, "Hey, I I recognize you." Yeah, yeah, yeah. But it's a it's a very different experience for me because at Facebook there was all these other functions that were supporting me, right? I didn't have to worry about like signing business agreements with those developers. I didn't have to worry about, "Hey, are they making enough money? And if they are not, they are going to pull their games out of platform." And I didn't have to worry about, "Oh, how do we actually find advertisers who will put ads into those games and help everyone make money? And what kind of advertisers are there?" Um, so I didn't have to worry about any of those problems before. But at Microsoft, because I was the one that's proposing that we do this, they had some interest in like spinning up a new platform. That was the reason I joined, but no one had an idea for how to actually build a platform, right? So, I proposed, "This is how we build a new platform." And when I did that, I didn't realize how complex it was uh, to really establish a whole new business. So, I totally underestimated uh, the business development aspect of things and the money aspect of things. Uh, how to make everyone happy. So, that was a very new experience. Those 2 years learned a lot as well. I think more as a business owner like um, a product group lead um, than a previous like an engineering leader. You weren't a lure to go back to maybe being like director level or anything like that. Back to management, back to people management at all? Oh, I just said no like straight. Uh, >> [laughter] >> yeah. Uh, so I think when Microsoft was uh, reaching out to me back then, the role was not well defined. Like they just want to spin up a new platform, right? Uh is it going to be a manager, director, or is it going to be an IC that help them do that? They didn't figure that out. Um so, I talked with them and I convinced them, you really only need an IC here. You don't need you to be a director. Yeah, and I said I wouldn't be a manager. I would enjoy doing that as an IC. I would not enjoy that as much uh being a manager or director there. Yeah, I get that sense as well that even if you got brought in at director level, you would probably find some way to get back down to an IC to contribute. I had Philip Sue on the the podcast a couple of times. I think he went to E9 and then he was like, I need to get back to building. I need to get back to the code. So, he took a demotion to go back to start uh coding again. I get the same vibes. I think people that are builders and that thrive on chaos, they just they have to be building. And I think it's the cycle with software right now where this is the perfect time for you to be building. And we'll get into AI in a moment. Let's talk about career advice. Obviously, things have changed quite a bit since you were an IC um and working at at Facebook and Microsoft. What would be your advice now to people that are trying to break into the industry perhaps and then also people that are mid-career? How can they best protect their careers? How can they stand out? My advice would be very different from like for junior people versus mid-level versus senior and above. I think first thing uh especially for more junior folks, I would say be really good at what you do. It's very important. That's the foundation of everything else. So, just build things. Just build things you find interesting and would enjoy doing. Build a lot of them. I think before I started my career at Microsoft, I probably have already had built like a hundred different toys, like different things. Like some of them actually sold for money, right? Like those cheating tools. But a lot of them didn't sell for any money. Like a lot of them are just purely for fun. Oh, I love that. People are always asking me. They're like, "Steve, what what side project should I build so that I can get noticed?" You're saying build a hundred things. Yeah. Yeah. Don't don't commit to one thing. The biggest value I get from building a lot of those side projects and fun stuff like hobby things was really the exposure to different technology, to different tools that you wouldn't otherwise get from doing your primary job. So, especially in big companies, I think the tech stack tend to stabilize, right? You only with work with C# or like this very particular system. That's all you do for like 2 years. So, I think we kind of need these side projects to explore the breadth of the industry. So, that's one. The other is to really getting into this mindset of just doing things for fun is very important as well. Because otherwise, we tend to lose motivation. Like if people don't have a way to have fun, then what they do is when they have time, they would do other things. Scrolling Tik Tok or doing other fun things, right? Which is fine, but if you really want to go deep into this software development career, then I think you have to find something that will keep you motivated that you would keep doing this for hours and hours. I would often find myself whenever I have some time, I had a long day, I'm exhausted, I I'm sitting down. The things that I gravitate towards is building stuff. I find fun. And that's the most relaxing thing I could be doing. So, I think finding that state of mind Yeah. that mentality, I think it's very very useful for developing really deep skills in this domain. So, I yeah, I definitely would recommend. I love that because well, doing a lot of things I think is really important. You work on auto complete for being. You can only go so deep into auto complete. Yeah. Right? But when you work for a really large company, you're a part of a much larger organization. And so, you are going to be working on a very specific part of the stack. You might be working on the app load times for the Android client for Instagram so that you can shave off another 10 milliseconds or something like that. And to get that extra 10 milliseconds is going to require you to really understand what's going on, but you are just look you're looking at this tiny little surface area of what's there. Yeah. And so, I love this idea of like, "Hey, can you gamify it?" I also love this idea of being like very good at what you do. Like, do you know what a 90th percentile implementation of a thing looks like? Mhm. Right? And can you like can you go and execute against that? Instead of thinking of like a task as this sort of checkbox that you get done. Yeah. Yeah, totally totally. I think that your advice for juniors, I think that's good for before you get your first job and then also I think when you're on the job as well. Just like making sure that you're keeping your skills warm, that breadth of skills warm, even if you are working on a small surface area. What about mid-level engineers? Yeah. Yeah. Yeah. I think for mid-level and maybe um part of the senior uh role as well, the elements I benefited from the most was to follow my curiosity. So, whenever I feel bored, whenever I feel like I'm not growing, I'm not learning more, I jump. Just get out. You freak out. Yeah. Yeah, like find another thing to work on. Uh that was very beneficial for myself uh looking back, right? Because I if I stayed in those comfort zone and I like everything is smooth sails and I just keep doing what I have been doing, I I will get paychecks every month. Like I there's not going to be any trouble, but I wouldn't have learned all those new things I now got exposed to. So, I think following curiosity and never get comfortable with just like doing whatever you have been doing is important. Can you give me an example of following your curiosity where you just decided to learn something completely orthogonal to what you were doing on a day-to-day basis at work. Yeah, I did this multiple times. When I stopped at Microsoft and jumped over to Facebook, that was one time when I felt bored. I felt oh, I just I was doing what I have been doing already, so I want to try something new and Facebook was the new thing. I didn't know how Facebook worked, such a big social network. How does it work? Especially like internals. I followed the curiosity to jump ship to Facebook. And then within Facebook, I also followed my curiosity to work on games instead of news because I felt like games was going to be more I can learn more and I would find it more fun to work with. And then later on, switching to management was also following my curiosity. I didn't know what that role would look like. I would love to have a try and no matter where I end up, I know I would learn something new, right? I think the learning was was driving me to make a lot of those changes. Later on, I think switching from Facebook back to Microsoft was also just following my curiosity. This is the pattern that I repeated the most was to make sure I'm always learning something new. I'm following where my curiosity leads. That kept me learning and kept me motivated. So I'm always energetic about the things I do. That I think is very important as well because when you are really passionate about something, you will do your best. You will really like outperform a lot of others who are just there to get a paycheck. So yeah, finding that place is going to be very useful. So when you moved to a new place when you were following your curiosity, you had single-threaded focus on that one thing then at moment? Or did you did you ever do any side quests when you were you know, suppose when you were working on the game stuff, were you like, I wonder how JPEGs work? And then you like did a like a deep dive there or you're like, I'm going to pick up React even though that wasn't maybe part of what you were doing on a day-to-day basis. I didn't do much of that. I typically, when I find myself exploring side quest, that is an indication to me that's maybe the main quest is no longer that interesting. So, whenever I take on a main quest and I find it super interesting, I would just go all in and spend every single minute on that problem and make that as successful as it can be. And then once I'm done with that, I might want to switch to other problems. >> Let's round it out. So, as a senior or a staff level engineer, so pretty senior, what advice would you have for folks at that level? Yeah, I think for more senior folks, your situation is very different. And I think something I find to be different, at least in my experience, was that when I'm more senior, I get pulled to other companies more often. Then I have to explore where do I go. So, there will be other people, maybe your previous managers, people you worked with, have moved on to other places. And if you had a good experience with them, you had a good trust built with them, they will probably reach out to you and say, "Hey, I need people here and do you want to come?" I get that a lot more often when I was more senior levels. So, I think in those situations, realizing your leverage and know to negotiate. I think at more senior levels, is one negotiation can make such a big difference, right? Sometimes it's between a whole whole different level. So, when you switch to a different company, if you negotiate just a little bit, and if you know that they need you there and you have the leverage, then just do that and use that to get like maybe a level jump in those switches, right? And often times, those those level jumps are what you deserve. Because maybe you have been working in the same company at the same level for a while. Maybe you were already performing at the next level. You just didn't haven't got the promotion yet, right? You had growth and those growth haven't reflected in your level and you should take those opportunities when you jump to a different company to really rethink what is the right level for me in this new role and can I negotiate a little bit with this new company on whether that's the right fit. I think the default is people make lateral moves because those other companies recruiting them have the incentive to pay them as little as possible or like not at least not to offer them a much higher position up front. So, I think people need to realize that and need to really utilize their leverage. Yeah, I think senior and staff engineers, especially in big tech, they're very capable and high performance just to get to that level and then if they're following their curiosity or seeing what else is out there, I completely agree. I think what they would really like is the lateral move because they don't feel like they're necessarily operating at that high level in that new domain, but of course you're not because it's a different domain that you'd be jumping over to. So, just like recognizing that you actually do have leverage in those times of transitions. I think that's really powerful. Yeah, realizing what's those other companies pulling you, what do they need, what are they looking for and if you feel like you do have the right skills to fulfill that need, then you have the leverage and you have to use that. I've been holding off on this discussion for a little bit while, but let's let's talk about AI. Yeah. Maybe we can start from a if I'm a junior or mid-level engineer, how should I be thinking about AI in my day-to-day and where do you think that that's going to be going in the next couple of years? I think that's first set the scene. Maybe one question people get asked a lot is AI going to take my job. I think AI is 100% going to take people's jobs. It's only a question of who, whose jobs. And I think while AI is taking some jobs, AI is creating new jobs. So, as a whole, as a society, we may actually have more software developers, more builders. But, some people will lose their jobs, and some other people will suddenly get a job that they wouldn't otherwise get. So, I think it's important to look at like these dynamics happening. So, in my last job, I have been working with a lot of CTOs and talking with a lot of companies' CTOs as well. I got this view of what's happening in a lot of teams, and I think they share a lot of commonality. So, a lot of companies, what they are seeing is that these AI tools are getting traction, they're getting adoption. Most developers, they already use AI one way or another. So, they use GitHub Copilot or Cursor or Coda code, whatever tools out there. But, when they look at their company as a whole, the company's productivity may be only increased by 10%, 15%, not a massive amount, right? So, it's very different from how people talk about AI on Twitter and like this social media. So, what is happening? Um, when these CTOs zoom in, what they see is that in their company, there is maybe 2% of people who actually figured out how to use AI very effectively. And these 2% of people are so much more productive because of that. But, then, the majority of the company, the mainstream, is still using AI in a very shallow way. Yeah, they are using AI, but they are not really getting the most value from it yet. The mainstream people are actually also, they don't seem to have enough curiosity to get to that next level as those 2% people did. So, when we average that out, look at the whole company in aggregate, yes, or maybe only 10% lift, it's not that much. And some people might actually conclude that AI is not that impactful. I think that's where