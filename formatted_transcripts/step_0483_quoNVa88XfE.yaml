transcript: TanStack just launched a brand new AI library that makes working with AIs in your application incredibly easy, no matter what framework or AI library you're planning on using. This video I'll only be breaking down everything you need to know about this new library, as well as showing you some of the unique features such as the ability to create AI tools that run not only on the server, but also in the client. Welcome back to Web Dev Simplified. My name is Kyle and my job is to simplify the web for you so you can start building your dream project sooner. And to get started with this library is actually incredibly easy. All we need to do is install TanStack AI, TanStack AI React if you're planning on using React, and TanStack AI OpenAI or whatever AI tool you're using. In our case, we're using Gemini for this project, so I installed AI-Gemini. But whichever one that you're planning on using, just make sure you install the proper libraries for that. Once you have that done, all you need to do is set it up on the server, as well as set it up on the client. And that is everything that you need to get a full chat application working. If you take a look at our actual code here, you can see I can type in a message down here, click send, it's going to send that off, and then the assistant, which is the AI, is going to respond with some type of response for me. And you can hook this up properly with different tools. For example, I can say, "How many to-dos do I have?" And if I do that, it's going to go through, it's going to call the different tools that I've created, and you can see it's saying that I have 200 different to-dos stored inside my database. I can even make it interact with the client. For example, I have this count down here, which is just a client-side thing stored in local storage. When I refresh, you can see it saves it. And then I can say something like, "Update my local count to the number of to-dos in my database." And it should go through and it should actually query my database, find out that there's 200 to-dos in there, and then update this count variable specifically to be that value of 200. Now, I just gave my page a quick refresh, and you can see that count has been updated to 200. You notice the assistant didn't return to me any message. That's specifically cuz I didn't really tell it to return any message. I just told it to do something specifically, and I'm not logging out all the different AI calls that it's making. But if I said something like, "Give me the number of to-dos in my database. And it's going to go through, it's going to get that database number. And if I look inside this TanStack here, we actually have different dev tools. I'll pop this out to make it a little bit easier to see, but you can see here's the response I'm sending, here's the response the AI is giving me, and also here's the stuff it's passing along to the different tools that I have. So, we have a lot of things that we can look into to figure out what's going on. And that's kind of a demonstration of what this is at a high level. So, now I want to dive into the code to understand how this actually works. In my code, I essentially have three or four main files. This first file is just my route itself. You can see I have this chat component, that is everything you see on the screen right now. And then I have this counter component, which is just this local storage counter down here, purely for testing how client-based tools and server-based tools work. Inside of my chat.tsx here, we really only have one small section we care about to get started with. And that small section is a simple piece of state for my input that's just hooked up to this input right here. Really basic React stuff. We then have this use chat hook. This use chat hook comes from that TanStack AI React. That's where essentially all of the code for my chat related stuff is being handled behind the scenes for me. And it's giving me the important things I care about, such as my loading state. I get a send message function, which I can send a message to my AI. And then a messages, which is just all the different messages between me and the AI that are being returned in an array. So, you can see I get my message that I sent, the message that the assistant sent, and so on. Every single message is stored in this array. I then have the ability to pass along a connection, which uses this fetch server send events, again coming from that AI React library. All this takes is a path to a fetch-based URL inside my project, where it's going to post all these different chat messages for me. I call this /api/chat. And if I go to that specific file where I have that post request being handled, you can see inside this post request, I first get my AI API key, make sure it exists, and then I'm just getting all my messages and conversation ID from that request. So, here it's going to pass up essentially the data of messages and conversation ID that comes directly from this use chat. So, I get that information right here and then I call this chat function. And if we look, this chat function comes from that TanStack AI library. So, really I'm calling use chat on the client to hook up everything. I'm passing it along the URL to where my chat-based stuff is on the server. And then on the server, I'm just getting the information being sent to me automatically through that use chat hook. And then I'm calling a chat function, which essentially does all the AI magic behind the scenes. I tell it what adapter I want to use, essentially what AI you want to use. In our case, we're using Gemini, but you could use OpenAI if you want it and you would just type in AI here. Just like that. And now we're using OpenAI and of course, we have different models. So, we would need to pass in the name of a different model. But in our case, we're using Gemini. You then pass it along all your messages and conversation ID that comes again from the client from that hook that we used right here. So, super straightforward. We tell it what model we want. And finally, if you have different tools that you want to pass along, you put those inside here. We'll come to that section a little bit cuz it's a bit more advanced. Finally, you just call two stream response, which again is something that comes directly from that AI library in TanStack. Pass it along the stream that you get from your chat and that's going to do everything for you. It's going to handle streaming the data down properly. It's going to handle all the different validations and tool calls and everything else you need to do. All you need to do is just call chat and pass it along to stream down. And then here, we're just logging out any error that we get inside of our application. So, overall, the process of this code is very simple. We call use chat somewhere on a client, pass it a URL and inside that URL location, we call chat, passing along the stuff that we get from the client as well as any additional tools and what model and so on that we want to use. So, getting this to work is really, really quite simple. Also, inside of our code, you notice that we have a quite a bit of HTML down here. This is all just for styling. You can see that we're just looping through our messages and rendering out some code for each message. And then we have a really simple form right here that's using this loading state to disable our input and it's just setting that input value. And whenever we actually call handle submit, you can just see it's calling send message, which comes directly from use chat. So, really this is quite simple. Every time we submit a message, it calls send message and then we render out all of our different messages in this array here. So, getting a really basic AI chatbot set up is super simple. I mean, it's literally like 100 lines of code or so, and you can copy this directly from the documentation. Now, if you want to get tools implemented, it's a little bit more involved, but really not that difficult. So, I'm going to first look at a simple tool, which is our get to-dos tool. Every single tool uses this tool definition function. Again, this comes directly from that library up here, this TanStack AI library. And this tool definition takes quite a few different properties, you can see here. And the main one you really want to focus on is you need a description telling the AI what this is. You need a name so that the AI knows what this thing is called. And then you need an input schema, essentially saying what is the data being passed in, and an output schema specifying what the data being returned by this tool is. Now, some of these things are optional. So, for example, I could remove this output schema if I don't have any output, but most of the time you're going to have some type of input and some type of output. You can also pass along another property of needs approval, set that to true, and that essentially says, "Hey, this is some type of dangerous operation." Maybe it deletes data from your database or spends money, for example, and you want to make sure that this is approved by someone on the client. By passing needs approval along, it'll actually send back a message to the client essentially asking the user, "Hey, are you okay with this thing happening? Do you approve this?" You can approve it, and then it'll go back to the server to finish operating whatever this tool is that is doing that thing for you. So, this is a tool definition that you create, and when you create a tool definition, that just essentially just gives the AI some type of capability, but it doesn't know how to execute that yet. This just tells it what it can do. It doesn't tell it how to do it yet. That's where we need to create an implementation, and you can create an implementation to run either on the server or on the client. In our case, we have a server-based implementation cuz this is going to be calling data in like a database or something else. In our case, we're just using the JSON Placeholder API for this, but you could use a database or anything else. All you want to do is just take your definition, call the server function, and this is going to get passed in whatever your input schema here is. I'm using Zod in my case, but you can use whatever you want and whatever makes sense for you, like JSON schema, for example. But you can see this is an object with a query as a string, and you can see right here I'm getting that exactly passed along, and we get full type safety. You can see here is a query that is either string or undefined because it's optional or a string. You can then see I'm putting that query and appending it onto a URL, fetching that data, and returning that back to the user. So, now my AI has all those different to-dos that are coming from this JSON Placeholder API, and I can even get it for a specific query. For example, I could say, "Get me all the to-dos with the title of the left." Something like that. And it'll tell me how many to-dos have that specific title being returned from it. You can see it found 11 to-dos with that title, and it's just listing them all out for me. Now, I don't have any formatting or markdown stuff showing up, so it's quite ugly looking, but you can see it's getting me all that information and using that tool specifically, which is the important thing to understand. Now, in order to use a tool on the client, it's a little bit more involved, but it's essentially the exact same process. We first need to create a definition, and then we need to create essentially a client version instead of the server version. Right now, we're using this server version, and when I pass my tools along, you can see in here I'm passing that get to-dos tool, which is what I get by calling that server function. But if you want to be able to have a tool run on the client and not the server, then all you need to do is just pass along the definition. You can see I'm just passing along the update counter tool definition. And this update counter tool definition just is the definition itself. It has a name. It has a description. It has some input, and it has some output. You can see very basic. It just has a count that it passes in, and it returns success of true or false. And I pass that along on the server side of things. All of this is on the server. But I need to create an implementation for that on the client. So, what I can do is I can then go into my chat section, and you can see here I've created an implementation for my update counter tool that is based on that definition, but it calls the client function instead of the server function. All this means is that this code now runs on the client instead of on the server, which is a great way for you to interact with different things on the client based on responses you get from the server of your AI. So, here you can see I'm just setting that local storage variable of counter to whatever that count variable is, and I'm returning it a success of true every single time. Then when I create my use chat right here, all I do is I call this client tools function, which comes from TanStack again, and I just make sure I pass it along all of the different tools, which in my case is just this one single tool. Now, anytime that I'm using something that I tell it to update my local count, it's going to make sure it calls this tool and updates that value inside local storage for me. And if I look at my counter component, you can see here it's using this use local storage hook that just uses this counter variable and gets the information from it. So, you can see it's processing whatever that count is from local storage. So, with this simple AI library just a couple maybe 100-200 lines of code, I have a fully functional chatbot. I have the ability to run code on my server based on different tools. I have the ability to run code on my client using different tools. And all of that is incredibly easy to set up. You can see the actual chat related code is this small section right here. The ability to send a message. This update tool. And then essentially this entire file. But overall, that's like 200 lines of code and you have this full entire functioning AI chat application. And this is just the alpha version of this documentation. We're essentially version zero. This is just released very, very recently. And as more and more features get added, I can see this becoming a great replacement for the Vercel version of essentially the exact same thing. I was looking through the blog article for this and one of the big things that they talk about that they want to add is essentially some headless A UIs for all of this to make it so you don't have to write as much of this UI boilerplate code for you. It's going to have a headless version that just integrates perfectly. I think that's going to be one of the biggest things that is going to improve this library. And I know that TanStack as a company and as a product has a much better track record than someone like Vercel when it comes to creating really good high-quality software. So, I'm really interested to see where this project goes in the future. Now, if you're interested in TanStack in general, I highly recommend checking out my TanStack start crash course. It's going to be linked right over here. I also have tons of other TanStack videos coming in the future. I will link some of them right over here as well. So, anything TanStack related, you can find right there. With that said, thank you very much for watching and have a good day.
