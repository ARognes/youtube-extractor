transcript: So, whenever you are asked like about delivery and tight deadlines, you want to think about it like a movie. Like, how impossible of a situation are you in right now? If you're able to get out of that situation, you'll be like, "Dang, that guy's pretty good." So, when we join the movie, Ahmed had how many weeks or months to deliver? 4 to 6 weeks. So, Ahmed was put in the situation where he had to deliver something in 4 weeks. What I think would be helpful is to give like a relative size comparator. Maybe you can say something like, "Hey, we had to deliver something in 4 weeks that we delivered something similar to that last year and it took us 4 months, right?" Then I'll be like, "Dang, like you you're being asked to move like 400% faster." So, if you had said something like that, I'll be like, "Okay, interesting. If he found a way to navigate that, that seems to me like a staff-level engineer."
