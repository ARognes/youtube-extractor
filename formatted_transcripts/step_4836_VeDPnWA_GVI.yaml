transcript: '[Music] foreign thanks for watching Lori wired and in this video we''re going to be looking at something very exciting which is our Branch statements for those of you who have been following along throughout this whole series you''re probably really excited because this is actually going to let us Implement Loops if statements function calls and so much more this is actually going to allow us to change the flow of the program and move to different spots or locations inside of the program based off of certain conditions so let''s open up our arm assembly reference and take a look and see how that works this is going to be our Branch instruction and this is actually going to take as an operand the label describing the location that you''re trying to jump to we''ve talked about labels before so let''s take a look in CPU later and see what it looks like to actually create our label again I''m going to add a couple lines down here and I''m going to say cond one for condition one and then we''ll do some kind of behavior down here and then I''m going to do a second condition new cond2 this is going to be our second label so a second location which we can actually Branch to and then I''m going to put a different Behavior down here let''s go back to our reference this is actually going to be the mnemonic to signify that this is a branch instruction this is actually going to be an absolute branch and it''s not going to require any certain conditions in order to jump to the location specified by the label but actually what''s interesting about this is we have a lot of different letters that we can add to this mnemonic in order to signify what conditions we would like to have before actually doing our branch let''s take a look right here these right here are going to describe all of the different conditions that we can possibly do for our Branch statement so if you remember from the previous video we looked at actually comparing some values and we were able to compare whether they were equal not equal one value was greater than or one value was less than and it set the cpsr register based off of those conditions now we''re going to actually use those conditions to Branch based off of what the result was so for example if we have our equal right here we just add this EQ to our B mnemonic to get beq and we''ll actually perform the branch if that previous comparison was equal let''s take a look at some examples and kind of get a better idea of how this works I''m going to go back to my CPU later and we have our two condition labels and we''re going to practice jumping from one condition or the other so let''s set up maybe a couple values up here I''m going to do a move r0 let''s do maybe four and five again four I''m gonna do move R1 the constant value five and then let''s do our condition one more time which is going to be our compare so CMP was the mnemonic for that and let''s compare the values inside of r0 and R1 registers so let''s do CMP or zero R1 and remember that''s subtracting the value inside of R1 from the value that''s inside of r0 in order to set the cpsr register accordingly and then let''s actually do our Branch statement so I''m going to say let''s pick one branch equal Maybe so we''ll do B EQ so we''re appending those two characters to our B mnemonic so Branch equal if the last comparison was actually equal and then let''s add our label so remember we''re we''re actually passing the location that we would like to jump to so that''s going to be let''s say condition one so let me add a few things to condition one and condition two so we can differentiate whether they''re executing or not so I''m going to say maybe move into R2 the constant one and then similarly oops let me fix my spacing I''m gonna move into sorry R2 not R1 then let''s move into R3 the immediate value 2 which stands for condition two for this condition right here so if you''re looking at this you would expect that if these two values are equal we''re going to jump to this condition one and then we''re not going to execute condition two this actually is not the case because if you let let me just show you real quick if we compile and load and let''s step over step over do our comparison you would expect this to jump to condition one however it''s just going to keep executing in order of whatever instruction is coming next so it''s actually going to start executing condition one condition two and then anything that comes after that since we haven''t actually exited the program so I''ll show you see we''re still executing condition one and condition two this is probably the worst if statement in the world so let''s see how we can fix that so we have Branch if equal to condition one what we can do if we want to actually skip this if they''re not equal we can add a second Branch statement that''s actually going to jump to condition two and all we need to do is put that right after this beq mnemonic right here so we can add an absolute Branch so this is going to be branch no matter what there''s no comparison or anything happening to condition two so if these two numbers here are equal then we''re going to branch and jump over to condition two so this statement right here is never going to be executed however if this is false then we''re not going to jump to condition one we''re actually going to Branch directly over to condition two let''s take a look and see what that looks like when it''s running we compile and load once more and I''m gonna reset all my registers just so you can see so let''s do step over we''re doing our setup we''re comparing the values r0 and R1 again and now we''re going to Branch if that previous comparison had two numbers that were actually equal so they were not equal so we actually expect not to Branch to condition one so I do step over and we are at branching to condition two now so we expect to jump over this condition one and sure enough here we go we''re actually at this R3 is two we step over there we can see that get that value 2 gets moved into register R3 but the value 1 actually never gets moved into the register R2 let''s take a look at a couple more examples just to get the idea of this so I''m actually going to change this instruction from Branch equal to maybe Branch not equal so let''s see so instead of doing Branch equal we want to do Branch not equal so that means we need to append n an e instead of e and Q to our B mnemonic so I''m just going to do instead of EQ Branch not equal so now since these two values actually are not equal we do expect to jump over to this condition one let me compile and load and show that and I''ll clear out all my registers once more so step over step over do our comparison and now Branch if the previous values in the previous comparison were not equal so we expect to jump to condition one and actually skip this B right here so do you step over and sure enough we are hitting our condition one so the immediate value one is going to be passed into R2 and here you go now the funny thing is is we''ve still continued on our sequential execution so the condition 2 is also still going to run and you see we get the value 2 in our register R3 but this means that we''d actually have to add some additional branching inside of our program in order to make some instructions that actually make sense but I''m not going to bother with that since I''m just trying to show you how these branching instructions actually work and function let me show just a few more things that we can do with these branching so you remember our condition flags on the right hand side is it''s actually going to show all of the different condition flags that need to be set in order for these comparisons to actually return true so if you remember our CMP instruction was subtracting the two values and setting the zero flag inside of the cpsr register so if that Z flag is set to true then this Branch equal statement is actually going to be true and it is going to jump to the label specified and passed to that branching statement similar goes for our not equal instruction let me find a couple more really common branching instructions to take a look at so let me just scroll down let''s do our less than so this is going to be true if our value is actually less than the other value let''s try this so remember we have our LT to add to our mnemonic I''m going to change this Branch not equal to Branch less than so if r0 is less than one then we are going to take this jump and I''ll just demonstrate this real quick let me reset these and then we''ll step over step over we''ve already got that set up compare r0 and R1 Branch if r0 is less than R1 then we''re going to jump over to condition one and sure enough that''s exactly what happens and I think that looks good let me see if we have more that we want to show but hopefully you''re getting the picture at this point and it''s not too complicated greater than let me show this one as well so Branch less than no gonna do Branch greater than so we''re going to expect to hit condition two instead since r0 is not greater than R1 so we''re going to take the second condition right there so let''s compile and load step over step over do our comparison Branch if r0 is greater than R1 that''s false so we''re actually going to take this secondary Branch right here and jump to condition two and sure enough that''s exactly what happens when we get R2 in our register R3 final thing I want to go over is if you''re doing the B mnemonic you could also do Bal like this which is basically just the unconditional jump so it''s not checking for any particular comparisons before jumping it''s just jumping no matter what but more commonly I''ll see it like this syntax just with the B but it could also look like this and this actually just means the same thing but if you are reverse engineering and you''re throwing something in ghidra for example it just does this B as far as I''ve seen so thanks so much for watching Lori wired everyone in this video I showed you how we could do branching statements to jump to particular labels or areas in memory based off of certain conditions so this is really useful if you''re trying to do if statements Loop statements or even function calls and in the next videos we''ll start looking at how we can do some of these specific if statements or Loops in C and what they would actually look like in assembly so you can get a better idea of exactly how this works so thanks so much for watching Lori wired everyone and I''ll catch you in the next video foreign [Music] [Music]'
