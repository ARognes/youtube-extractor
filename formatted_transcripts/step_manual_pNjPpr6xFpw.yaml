[502.319s] these live lives and thinking, \"Who the\n[504.56s] hell would want to live like that? It''s\n[506.08s] it''s awful.\"\n[508.24s] When it comes to hatred,\n[510.72s] does this entertainment glorify\n[513.76s] realistic violence, promote cruelty\n[516.88s] towards one another, dehumanize people,\n[520.24s] or stoke in us anger and outrage?\n[524.32s] I think many of the most famous gangster\n[526.8s] movies can be seen in this light. But\n[530.16s] again, it depends where we''re coming\n[532.64s] from.\n[534.24s] For some people, these movies have\n[537.279s] indeed proven actual inspiration for the\n[541.519s] gangster lifestyle.\n[544.16s] For other people, they''re clearly\n[546.56s] morality tales for how we''re not\n[548.88s] supposed to live.\n[551.92s] And when it comes to delusion,\n[554.72s] does the entertainment that we''re\n[556.16s] engaging in promote falsehoods,\n[558.959s] encourage heedlessness,\n[561.519s] or offer us a view of the world with\n[564.0s] that''s disconnected from reality and the\n[567.519s] true consequences of our actions?\n[571.519s] One famous news empire makes a great\n[574.8s] living for its billionaire owner simply\n[578.16s] by promoting these kinds of falsehoods.\n[581.519s] as well as by stoking outrage and\n[584.24s] dehumanizing other people.\n[587.04s] Indeed, much of our social media is\n[589.76s] funded by groups like these and owners\n[592.32s] like these and many people consume their\n[595.92s] content as a kind of entertainment\n[599.36s] addiction.\n[601.68s] We should ask ourselves, does this\n[604.56s] entertainment play a balanced role in my\n[607.279s] life? Reflect on the role that it that\n[611.68s] entertainment in general and that each\n[614.56s] kind of entertainment in particular\n[616.88s] plays for you.\n[619.12s] Is it a source of true rejuvenation\n[621.76s] after a long hard day?\n[625.12s] Or is it consuming time, money, and\n[628.48s] energy in us causing us to neglect our\n[631.44s] work, our relationships, or our\n[634.399s] practice?\n[636.56s] If it''s the latter, it may help to\n[639.519s] reflect that the Buddhas is a middle\n[642.48s] path between extremes.\n[645.2s] And maybe this entertainment that we''re\n[647.279s] engaging in is not so skillful for us\n[650.24s] after all.\n[652.399s] I noticed this in my own past when\n[655.2s] playing computer games. I loved playing\n[659.04s] computer games. I had to admit that\n[662.0s] they''d become a huge time sync in my\n[665.12s] life. that they were addictive in their\n[667.839s] own way for me and ultimately that\n[671.68s] they''d become a source of stress for me\n[674.959s] rather than relaxation after a long day.\n[679.6s] The Buddhist approach to entertainment\n[681.839s] is not about rigid prohibitions.\n[685.68s] For lay people, it''s going to be a\n[687.839s] practice of wisdom and moderation.\n[691.04s] It''s about distinguishing between\n[693.36s] wholesome and unh wholesome consumption.\n[696.88s] Always with the point in mind that\n[698.88s] what''s wholesome for one person may not\n[701.04s] be for another.\n[703.6s] The core insight here is that we should\n[706.0s] use entertainment as a tool for skillful\n[710.0s] happiness, relaxation, and connection\n[713.76s] with other people rather than allowing\n[717.04s] it to become a source of craving,\n[720.0s] aversion, and delusion.\n[723.6s] Ultimately, the Buddha encourages us to\n[726.56s] become our own refuge, using our\n[729.839s] practice as our refuge.\n[732.959s] So the Buddhist framework isn''t a list\n[735.6s] of rules so much as it is a practice of\n[739.519s] growing selfawareness.\n[743.36s] The next time you sit down to watch a\n[745.76s] show or listen to music. The whole\n[748.959s] practice comes down to one simple\n[751.92s] question that you can ask yourself. What\n[754.959s] am I feeding my mind right now? Is it\n[758.399s] leading me towards peace or towards\n[760.88s] suffering?\n[763.12s] This question of skillful engagement is\n[766.56s] directly related to how we earn our\n[769.12s] living. For a deeper dive on that\n[772.72s] critical topic, I would recommend my\n[775.36s] earlier video on right livelihood which\n[777.839s] is right up here on the screen. If\n[780.56s] you''re getting something out of these\n[782.0s] videos of mine, a a like is always uh\n[784.399s] welcome and sub to subscribe to the\n[787.04s] channel if you want to potentially hear\n[790.0s] about more of these. We''ll catch you on\n[792.079s] the next video."}'
