transcript: '{"content":"\n[0.24s] A little while ago, I received a great\n[2.399s] question from one of my supporters over\n[4.56s] on Patreon.\n[6.48s] What can we be taught regarding the\n[9.04s] entertainment we engage in while\n[11.28s] following the Buddha''s path?\n[14.32s] This supporter of mine was referring to\n[16.16s] a real tension at the heart of Buddhist\n[19.52s] practice. On the one hand, the Buddha\n[22.56s] advised monastics against entertainment\n[25.84s] like music and dancing and warned us\n[29.039s] against livelihoods like acting that\n[32.0s] could stir up defilements in ourselves\n[34.559s] and others.\n[36.88s] But on the other hand, the Buddha also\n[39.12s] advised lay people to use their wealth\n[42.0s] to bring happiness to themselves and\n[44.8s] others.\n[46.559s] So which is it? Is entertainment a\n[49.76s] dangerous distraction or instead a\n[53.12s] skillful part of a well-lived well-lived\n[56.16s] life?\n[58.16s] In this video, we''re going to try to\n[59.92s] untangle this tangle by first looking at\n[63.52s] the crucial distinction between the\n[66.24s] monastic and lay paths.\n[68.799s] Then we''ll try to develop a practical\n[71.28s] framework from the early texts that we\n[74.0s] as lay people can use to engage with the\n[77.04s] with entertainment wisely.\n[81.04s] The monastic path fully embraces the\n[84.24s] Buddha''s recommendation to make\n[86.4s] renunciation\n[88.159s] one of our key intentions.\n[90.56s] We may recall that renunciation is one\n[93.52s] of the three parts of right intention in\n[96.88s] the eight-fold path.\n[99.759s] The monastic is essentially what we\n[102.4s] might call a full-time or a professional\n[105.759s] practitioner.\n[107.6s] For the Buddha, they''re supposed to be\n[109.68s] dedicating themselves completely to the\n[112.56s] path of practice.\n[115.6s] As such, one of the key goals of a\n[118.719s] monastic is the complete renunciation\n[122.399s] of all sensory attachments.\n[125.6s] Key to that kind of practice is not to\n[129.119s] seek out sense pleasures or what we\n[132.319s] might term entertainments.\n[135.84s] Entertainment is a direct impediment to\n[139.599s] the renunciation of these sensory\n[142.16s] attachments.\n[143.84s] If that is to say, it tends to stir up\n[146.48s] sense desires that the monastic is\n[148.64s] trying to calm.\n[151.36s] In one early suta, the Buddha chastises\n[155.12s] the monastic aritta for claiming that he\n[159.04s] could engage in these kinds of sense\n[161.12s] pleasures without any attachment towards\n[164.08s] them.\n[165.76s] Now, by contrast, the lay person''s path\n[169.76s] is not one of total renunciation. and\n[172.72s] otherwise they''d become monastics.\n[175.44s] But instead, the lay person''s path is\n[178.4s] something more like about skillful\n[180.8s] engagement with the world. The lay\n[183.76s] person''s goal is to navigate life''s\n[186.8s] pleasures and pains with wisdom, trying\n[190.319s] to reduce their harm and cultivate a\n[193.2s] good mind within the context of a\n[196.4s] worldly life.\n[198.8s] In many sutas, the Buddha gives\n[200.959s] particular advice to householders.\n[204.08s] For example, in one early suta, the\n[206.56s] Buddha talks about reasons that one\n[209.12s] should become wealthy.\n[212.0s] The Buddha lists several reasons,\n[214.72s] including that it would provide security\n[216.879s] for ourselves and our family, that it\n[219.599s] would allow us to pay taxes and give\n[221.68s] donations to the rulers, and that if we\n[225.04s] were wealthy, we could use that wealth\n[227.28s] to support worldly causes.\n[230.239s] But crucially, the very first reason\n[232.959s] that the Buddha gives for becoming\n[234.799s] wealthy is to make ourselves, our\n[237.92s] family, our friends and workers happy.\n[242.08s] That is, the Buddha counsels lay people\n[245.12s] to enjoy their wealth.\n[248.239s] The wise lay person pursues a kind of\n[251.2s] middle path of enjoyment.\n[254.0s] They provide for their needs and do not\n[256.959s] squander their wealth, but they also\n[260.0s] don''t hoard it. They make use of their\n[263.6s] wealth skillfully for pleasing\n[266.32s] themselves and others as well as for\n[269.6s] doing good deeds of charity.\n[272.88s] The Buddha was critical both of the\n[275.919s] person who hoards their wealth without\n[278.479s] making use of it for their own or others\n[281.199s] uh skillful enjoyment\n[283.44s] and he''s crit he was critical of the\n[285.44s] person who squanders their wealth\n[287.84s] foolishly.\n[290.56s] Entertainment\n[292.16s] subject of today''s video is perhaps the\n[294.88s] main thing that arises within this\n[297.919s] category of skillful enjoyment. It''s a\n[301.199s] way to experience happiness and share\n[303.84s] that happiness with others, provided\n[307.199s] that it''s done properly and in a\n[309.199s] balanced way.\n[312.0s] When considering what''s truly skillful\n[314.96s] enjoyment or entertainment might look\n[317.6s] like for the Buddha, I don''t think it''s\n[320.08s] helpful to think in terms of modern\n[322.639s] concepts like approved or banned media.\n[326.32s] The Buddha certainly never spoke in\n[328.0s] these kinds of terms.\n[330.88s] Instead, the Buddhist approach suggests\n[333.12s] a set of powerful questions that we\n[336.4s] might ask ourselves in order to\n[338.8s] determine if a particular kind of\n[341.759s] entertainment is truly skillful.\n[346.24s] We should ask ourselves first what is\n[349.28s] the intention behind this entertainment\n[352.88s] before we engage in it or while we are\n[356.16s] engaging in it or if we forget about\n[359.12s] that as we''re often prone to do then at\n[361.6s] least afterwards we should check our\n[364.72s] motivation.\n[366.88s] Are we pursuing this kind of\n[368.639s] entertainment to relax after a long day\n[372.479s] to connect with friends or family\n[376.08s] or to appreciate, let''s say, the\n[377.75