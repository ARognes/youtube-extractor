transcript: No company's going to be like, "Hey, tell me about a time you led a really big project." You need to demonstrate impact outside of the traditional measures. It turns out that different companies and different organizations care about different things. You know, at Amazon, at least when I was there, the biggest thing was customer satisfaction. You go to a different company, customer satisfaction isn't even on the radar. You know, I know you're not interviewing Amazon, but if were you to be interviewing at Amazon, you want to make sure that you have stories where you're just like, "And customers loved it. They stood up and applauded." As an interviewer, you'd be like, "Hey, this guy This guy might fit in here."
