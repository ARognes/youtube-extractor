ion you can say but it happens in between the parts. So when two layers they don't stick to each other what happened that because of stresses they show some uh uh I I would say uh nonad non-adherance they do not come in contact with each other they tend to warp and that's why we see see such kind of cracking now cracking is again due to poor addition between layers and also thermal shrinkages. So most of the defects will be because of thermal shrinkages or thermal contraction. Another defect in FDM is uh stringing. Now stringing is basically when instead of uh your nozzle moves from one feature to another to print that feature, it is not cooled down properly. And when it moves to the other feature, it leaves a string of the material which is attached to the part as well as to the nozzle. Now there can be multiple reasons. One of the very basic reason for stringing is when the print temperature is too high. That means you are not giving proper cooling time to your nozzle when it is and before cooling it is moving from one place to another causing the stringing effect. So that is why you need to make sure that the print temperature is not very high and you are giving enough cooling time for the nozzle to move from one place to another. Then again one more effect one more defect this is curling. Now curling is slightly related to warp edge but curling will happen not because of thermal stresses but because of overheating of the material. So when your print temperature is too high and your cooling is not happening then your part will remain for a longer time in the molten stage and wherever it has remained for a longer time in the molted stage what will happen that uh when you print on top of that your printing is not proper. So it will result in curling. Now let's talk about SLS and MJF. Again this uh defect that you see is from SLS technology and it is known as uh delamination. Now delamination is again because of thermal stresses. Now all what happens that uh when tw