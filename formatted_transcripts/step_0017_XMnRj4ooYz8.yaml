e finish. Now in the short blasting method, one person has to hold the part and we have to make sure that the distance is good enough so that neither it is over removing the components nor it is uh what do we say uh under under removing the materials. So nutshells shell steel beads silicon carbide nutshells are used to provide very glossy finish to the part. uh sorry not glossy it is used to provide a white finish to the part. It helps in cleaning and brightening of the surface. Whereas ceramics ceramics are used for surface compression and providing a metallic matte finish shiny look to the component. We will have a look at few of the samples after this. Steel beads. Now steel beads are again used for surface compression. So they not only improve the surface toughness they also help in providing compressive stresses to the component which is very much usable desirable in order to improve the fatigue life of the components. Silicon carbide again it will give you a smoothening finish and a matte look. Now blasting is something which is used for cleaning and smoothening which we will be uh mostly we are using in post-processing techniques. Whereas if we talk about short pinninging, it is basically done with a slightly more comp more compressed air pressure so that it actually hammers the surfaces down and induces compressive strength compressive stresses on the surfaces. Now the purpose of doing this is to as we know that in 3D printing we have to clean the surfaces smooth and change the appearance. But what we need to do is first we need to target specific areas and make the different kind of finishes, different kind of surfaces which are having different kind of surface finishes. We need to make sure that all of them are nearly in the same range and then we can do a overall process. Now here you can see that there are different different kinds of uh finishes that has come up using different kind of media. So that is how much difference a media makes. So yeah this is about short blasting you have seen the operation. Now let's talk about the polymer postprocessing. Now polymer post processing is very simple. You get the part you remove the surface. You remove the surface bur you smoon the component using embry paper. You apply puty to it. You again further smoothen it. Use embry paper and make the surface very fine. And then you go for a round of primer and paint. So the same thing uh we will see there is a 3D printed part which is having different kind of roughness at the different sections because it's a layer bylayer method and uh the depending on what region we are talking about the surface finish is uh varying by a lot. Now if we have to post-process this the first step would be would be to making the surface finish as uniform as possible as we can using manual finishing methods such as an embry paper or uh some pneumatic tools which are used for polishing of surfaces but we should take care that the uh tools are favorable for the plastic that we are dealing with that also comes in concern. Then once all the sanding has been done, initial sanding, surface prepation, we apply puty to it. Once the putty dries again, we need to do sanding on it and the sanding is done. Now after doing puty and second round of sanding to remove that excess puty, uh the surface will be very very very smooth already. Now it's time that we can go ahead for uh our primer applications and then we can print start printing the part. So now the part part is being taken up for printing. This is the first round of primer white primer that is applied. Then the black color that is uh the desired color in this case. Now once the black color has been given to the part uh we might want to apply different colors to different sections of the component. So what we do there is that whatever area we want to be uh uh remaining in black color itself we mask those particular areas and apply a different paint on the other areas of the part. So now this part is uh going through another uh second round of painting where the masked areas will not have that painting whereas the areas which are exposed will get a coat of the new paint that has been spread on it. And once the it is all dried up, we remove the mask tapes and we get the final part that we have to use for the end application. So, I'll just show you how the part looks like. Yeah, this is how the part will look like. So that was about uh post-processing and by this you complete the last step of the additive manufacturing workflow which is post-processing. I hope this is useful for you and you will use it in your future applications. Thank you.
