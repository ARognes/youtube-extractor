transcript: '{"content":"\n[0.0s] I''m seeing an increasing number of\n[1.8s] people be very unhappy with small talk.\n[4.04s] They''re like, man, I don''t understand\n[5.76s] the purpose of small talk. Like I would\n[7.48s] sit around, we just talk about nothing\n[9.16s] for a while. Like when do people have\n[10.72s] real conversations? Like I don''t care\n[12.36s] about, you know, what your job is or\n[13.88s] where you grew up. Like I want to know\n[15.16s] like what do you feel about the\n[16.36s] existential threat of AI? A lot of us\n[18.56s] are craving deep conversations. And I\n[20.64s] really want to get to know someone. This\n[22.2s] is what''s fascinating. Small talk is not\n[24.36s] about getting to know someone. Small\n[26.2s] talk is a phase where we detect red\n[29.72s] flags. That''s literally what the purpose\n[32.16s] of small talk is. It is not to get to\n[34.24s] know someone, it is to see if there is\n[36.4s] something fundamentally and\n[38.12s] catastrophically wrong with them so that\n[40.36s] we don''t want to bother getting to know\n[42.36s] someone. Small talk is about safety\n[44.92s] assessment, not getting to know someone.\n[46.92s] It''s about ruling people out, not ruling\n[49.92s] people in. Does this person have BO?\n[52.28s] Does he start talking about politics?\n[53.96s] Does she start talking about politics?\n[55.76s] Are they ranting and raving about Do\n[57.52s] they ask you about your income in the\n[59.2s] first 16 seconds of meeting them? Small\n[61.68s] talk is about ruling people out, not\n[63.48s] ruling people in."}'
