transcript: Hello everyone and welcome to the second episode of connecting the dots. And today with me I've got Cassidy Williams. Cassidy, thank you so much for hanging out with us today. Thank you for having me. I'm excited. I am just tickled pink you you chose to come and join us on here. I think this is going to be an absolute blast. Um So I mean I I feel like you're one of the people who needs no introduction, but maybe we should do just for the the sake of anyone who's been living under a rock or doesn't go on Twitter or isn't familiar with Tik Tok. Um You want to give a little bit of an introduction for yourself? Hello everyone. I exist. Um I'm a I'm a dev experience engineer with Jason at Netlify. I make beams on the internet. And that's really the high-level thing. I could I could go into more detail, but I figure we will throughout this whole thing. Yeah, I I think that's that's our whole goal today. So for everyone in the chat, thank you so much for hanging out with us today. The the goal of what we want to talk about today is um The like the premise for the show is that I think a lot of people are looking for work right now. It's been a hard year. Tech is getting busier and busier. There are more and more people who are are moving into the field through boot camps, through traditional means, through non-traditional means, just studying on their own. Um And that means that there are a lot of folks who are trying to get that first role. And so what we want to do on the show is talk to people like yourself who have a like a stellar career. You know, you've you've done a lot of amazing things that we'll talk about and you've got an amazing network that we'll also talk about. But kind of rewind that a little bit and talk about how you got those first steps and how you started that journey. And also the part that I find most interesting is when we're talking about a tech career, what is it that we're able to bring to it that's not tech training? So, not being a