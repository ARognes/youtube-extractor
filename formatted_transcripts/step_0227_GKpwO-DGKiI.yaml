transcript: I hate Google. In 2010, Google acquires a company that created WEBP, a lossy compression format for graphics on the web. 15 years later, with all major browsers supporting the WEBP format, you would think surely that YouTube would support it for their thumbnails. No. Surely you would think that Google Docs would support it as a format. No. Why are you like this, Google? And this is why
