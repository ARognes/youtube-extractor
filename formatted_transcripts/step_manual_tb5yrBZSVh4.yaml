transcript: '{"content":"\n[0.06s] Do you work for a company that wants to build the best software for your customer even if that means that people have to find\n[6.509s] out they''re wrong about some of their assumptions, or are you leading a software team or company\n[12.66s] and you need to have the right attitude to make sure that people can learn with safety? We''re gonna talk about\n[19.66s] seven key traits of leaders of software companies that learn right after this.\n[32.529s] Hi, I''m Jayme and at Healthy Software Developer\n[35.1s] I want to help you have a sustainable career where you don''t get burned out,\n[39.01s] you don''t get pushed around by people that don''t really understand software development,\n[43.77s] and you can just make sure you have a great career. If you watched my video\n[48.64s] yesterday about if your company feels more like a college or a\n[53.68s] factory how that''s gonna kind of determine how successful\n[57.539s] they are at building the most valuable and hopefully profitable products for their customer and also it''s gonna make the\n[64.15s] environment for people who work together either feel like a pressure cooker or\n[68.83s] somewhere where people can really be safe and love software development.\n[73.33s] To lead a team or a company\n[75.659s] that''s gonna deliver software with that kind of an attitude and mindset takes some really special leadership qualities.\n[82.409s] And they''re really common things that you''ve probably\n[85.24s] heard about\n[86.049s] before but they''ve kind of been lost I think in a lot of\n[89.5s] companies that sort of want to control things and try to predict the future. And so in this video\n[94.92s] I''m gonna share with you\n[96.46s] seven key traits that I think if you are leading a software effort and you embrace these or if you''re working\n[102.909s] under a leader and they can demonstrate these, it''s gonna make it much more likely that you''re gonna be successful\n[108.78s] and there''s gonna be less pressure and more ability to just learn what the best product features are to build.\n[114.759s] The first trait is mercy. If people make a mistake\n[119.619s] meaning something that they thought that they should do it turns out was not a good idea\n[124.479s] whether this was a software feature or an approach for the company,\n[128.5s] A good leader at one of these companies that really wants to learn needs to be able to essentially\n[134.86s] gracefully forgive people. And this is kind of brainless if you think about it.\n[139.71s] But if you''re gonna be at a company\n[140.94s] that''s gonna\n[141.51s] have a safe environment for learning not being merciful as a leader and getting down on people\n[147.76s] because they made a mistake or maybe they thought something was a good idea and it turns out to be wrong\n[152.35s] is just a horrible idea. It''s gonna shut down the culture so people actually have the courage to\n[159.55s] experiment, which is exactly what''s needed to really learn what the best features are for your customer.\n[165.28s] The second key trait of a leader of a learning company is\n[169.57s] patience. If you''re working at a company\n[171.78s] And you''re leading that company or that team or you have a leader above you and you''re trying to put in place an environment where\n[177.9s] people can learn,\n[179.32s] having the desire to have quick and short-term results that give everyone a feeling early that they''re moving in the right direction\n[186.94s] is actually going to shut down the ability that people need to just wait a little while and\n[193.54s] try a few things and be okay if it takes\n[197.11s] Longer to find out if the money being spent in the effort being done by the software development team is\n[203.26s] really moving in the right direction. And when somebody doesn''t have that patience\n[207.81s] they''re gonna really shut down the attitude that everybody needs, so they''re less anxious and they''re more calm\n[214.48s] which is what they''re gonna need to have if they''re gonna be able to put forth their most brave and creative solutions.\n[220.9s] The third trait is\n[223.09s] trust. If a leader of a company\n[225.63s] that''s trying to learn what the most valuable features for their software is\n[231.07s] doesn''t trust their own people and they put processes in place so they have a way of working that''s always doubtful or\n[238.57s] micromanaging or critical, that''s\n[241.36s] unfortunately not going to free up people to be autonomous. And people need a level of autonomy\n[247.54s] especially in knowledge work and especially in software development\n[250.93s] to be able to just make progress to be able to just build things and get work done\n[256.63s] based on their own decisions.\n[258.81s] And if you''re out there leading a software company or team or you''re underneath another one and you find that there''s a behavior\n[266.31s] that''s going on where people\n[267.949s] don''t talk to that leader very much\n[270.52s] or they just you know are fearful basically of sticking their neck out and trying anything,\n[276.009s] that''s probably a good chance that safety of trust isn''t really in place.\n[281.33s] The fourth key trait of a leader of a software team or a company, that''s really set up to learn is\n[289.37s] Honesty.\n[290.93s] Everybody who''s gonna work on a software team\n[293.229s] and I don''t care how long you''ve been there or how difficult the political situation in the company is needs to be radically\n[300.979s] transparent and honest with each other. And if they''re merciful which was my first key trait\n[306.55s] I talked about, a leader who demonstrates\n[309.74s] honesty like this is gonna get honesty from his other team members, or his other employees or his other\n[316.639s] subordinates, however the company is set up. So if you are on a team and you''re leading a team or you''re underneath a leader\n[323.479s] Whatever you can do to be as honest as possible when you both make mistakes when you don''t know something,\n[330.71s] that''s gonna really help people feel safe when they''re working with you that they can put forth ideas\n[336.77s] and they''re not going to just be treated like they''re not valuable ideas because\n[341.839s] everybody kind of acts like\n[343.31s] they already know everything. And that brings me to the fifth key trait of a leader of a team or a\n[350.24s] software company that''s gonna really innovate, really learn what their customers want and not try to predict it all upfront and\n[358.279s] that''s\n[359.389s] humility.\n[360.889s] When we have an attitude that we know everything our customer wants\n[365.349s] Or we know everything that our employees need to do or we know the perfect architecture of the software upfront really anything,\n[373.639s] we sort of shut down\n[375.289s] the ability for other people to raise their voice and and have some ideas for different ways of doing things and\n[383.06s] me having worked in this industry for so long and having worked with a lot of leaders as a consultant I\n[389.089s] often see people\n[390.05s] and I''ve fallen into this too, who have spent a long time\n[394.129s] gathering a body of knowledge around some aspect of software development whether\n[398.229s] it''s, you know the process like Scrum or Kanban or maybe it''s source control or user experience\n[404.82s] or architecture really anything, and they''ve gotten really knowledgeable about it.\n[409.61s] And it''s great when we learn things and we become more valuable and we can avoid making mistakes with people.\n[415.88s] But if you''re gonna lead or be led by\n[419.01s] people who are encouraging a learning type of environment or almost college feeling software company then\n[427.11s] everybody, no matter how experienced they are needs to have the attitude that no matter how\n[433.74s] experienced I am or how much I know\n[436.08s] there''s always new things I can learn that I don''t know and\n[440.25s] it could come from the most junior person in the company it could come from a\n[444.36s] customer it could come from an intern it could come from anybody. So I think a leader who has\n[450.78s] humility and is able to know I don''t know everything I may know a lot,\n[456.29s] but there''s always\n[457.5s] something for me to learn is gonna inspire everybody else on your team and everybody else in your company to do their best by venturing\n[465.09s] their ideas forth because they''re not gonna be looked at like well\n[469.13s] I don''t want to really put an idea out there because he probably or she knows this already.\n[474.9s] The sixth key trait of a leader who''s gonna help their company or team learn is\n[480.78s] courage.\n[481.98s] Having the ability to try things in the face of doubt is so\n[486.96s] essential to being able to lead people in this way. If you don''t have the ability to try things that are bold in your\n[493.98s] market that are things that your competitors have not done or maybe things from completely different\n[499.86s] Industries that you think \"why would my customer find this valuable it seems like a good idea\"\n[504.74s] \"but I''m worried about what the rest of the market is gonna think about me\",\n[508.55s] you''ll probably just build boring products and software that everybody else builds because you don''t really have\n[515.19s] the courage to try something truly innovative. And the seventh key trait\n[521.24s] which is so important I think, if you are gonna lead a team\n[525.96s] that''s gonna really try to learn or discover the best features for its market\n[530.33s] or you''re being led by someone\n[532.459s] and you want to evaluate, \"Is this leader the right person for us to learn about our customers?\", is\n[539.699s] empathy. The ability to look outside yourself and try to put yourself in the shoes of another person\n[547.25s] that''s very different from you and try to understand things from their perspective and have some compassion for them,\n[554.579s] whether it''s personal struggles\n[556.67s] they''re going through in their life, or it''s maybe the work that they do is different than you\n[561.17s] and you can''t fully identify with it, but you need to value that work\n[565.49s] even if you don''t understand it. Having empathy is so critical because it allows people to have closer\n[573.54s] relationships, it allows them to open up to each other and if people are going to be creative\n[579.019s] and they''re gonna put forth ideas so that we can try those in the industry and try those with our customers and be okay with\n[586.319s] finding out maybe some of them weren''t right and have the courage to keep going,\n[590.639s] that''s only gonna happen if people who work together and especially those who are in any way being led by someone else\n[598.769s] can feel comfortable that that person has empathy and compassion for their differences. So are you at a company\n[606.23s] that''s trying to lead people to learn more about their customers and predict the future less, or maybe you''re being called\n[614.25s] yourself to actually lead other people in this way? Leave me some comments below. If you''re new to my YouTube channel please subscribe\n[622.29s] and hit the bell icon\n[623.43s] you''ll actually be notified when I release new videos.\n[626.329s] And I''m also on four podcast networks if you''d rather listen to this. Google Play,\n[632.22s] Stitcher, iTunes, and SoundCloud. So until next time,\n[637.05s] thanks."}'
