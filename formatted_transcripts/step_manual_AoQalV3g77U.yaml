for alien\n[325.28s] civilizations in the wrong way, but many\n[329.28s] projects like SETI mainly look for\n[333.199s] electromagnetic signals. Could it be\n[335.52s] that we''re using the wrong instruments?\n[338.88s] >> Well, I think that that''s too strong a\n[342.56s] statement. So, I''m not saying that they\n[344.4s] shouldn''t be doing it. I''m just saying\n[346.4s] I''m not super surprised that they''re not\n[348.639s] finding anything because if there is any\n[351.44s] way to communicate faster than the speed\n[354.639s] of light, then of course that''s what the\n[358.08s] extraterrestrials are using.\n[360.96s] But we don''t know how to do it. So\n[363.12s] clearly we haven''t yet developed the\n[365.68s] right technology. So we have really no\n[367.84s] idea what to even look for. And the\n[370.24s] reason I keep going on about this is\n[372.479s] that I think this is something that we\n[375.759s] should be thinking about more. And I''m a\n[378.0s] little bit worried that physicists just\n[380.56s] throw out this possibility that there is\n[383.52s] anything more, that it might be possible\n[386.88s] to communicate or even travel faster\n[389.12s] than the speed of light. So there''s like\n[391.12s] literally no research on it. And if you\n[393.6s] even talk about it, people would say,\n[395.12s] \"Well, that''s crazy talk.\" Could you\n[397.6s] explain in more detail how this could\n[400.4s] work? For many people, this does not\n[404.16s] seem to fit with what Einstein said. So,\n[407.52s] I''d love to understand your reasoning.\n[410.0s] >> Right. So, of course, I don''t actually\n[412.479s] know how to communicate faster than the\n[415.12s] speed of light because if I knew, I''d be\n[417.199s] doing it and I''d be rich and famous. Um\n[421.12s] but the thing that worries me is that\n[423.759s] the arguments that physicists make\n[425.84s] against it are just wrong. For example,\n[428.56s] let''s start with this idea that\n[430.24s] Einstein''s theories