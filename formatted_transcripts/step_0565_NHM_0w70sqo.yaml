transcript: Hey guys. So today you and I are going to talk about petty tricks. So let's get into it. So the question in question was, "Hi Frederick, imagine that you are at a company where you are a high performer, but some colleagues are jealous and try to hold you back with pimpy tricks. What would you do in such a situation?" I don't know if uh this like what do you mean by petty tricks because depending on the types of tricks I've been here and more than once actually that is of course also a very subtle way for me to say that I'm a high performer but we'll gloss over that and sort of just focus on the core question and that is that the way I usually handle these sort of situations is that immediately completely escalate it and I make sure that my name and value that I provide is very very very clear to everybody who works with me because I believe in something called transparency. What I mean by transparency is that basically anything that I have ever done on behalf of the company is in some way easy for me to look up. everything from my pull requests to commit histories to conversations I've had and so on and so forth. Basically, if I don't trust you completely, I will not sit alone with you in a meeting. I refuse. And the reason being because of this and I've been in so so so many situations where for some reason when it's me and another individual I hear something in one way and we converse in one way and then when we discuss it with the managers or somebody else like apparently there's a miscommunication there's misunderstandings and so forth and so forth. Some people actually use this as a weapon. I've seen it more than once. It's actually a pretty big problem, I would say. I'm not going to mention exactly when it's happened, but let's just say it's pretty common for me to see this where I have co-workers who will try to hide the fact that they don't actually know what they're doing by not saying anything in any way or like emails or anything like that that could be recorded. and always they always want to do a videos conference always want to do a clarification meeting or sync meeting or something like that and the most effective tool that I found to out this sort of behavior and sort of make it very clear that this is what's going on was to number one as I said make sure that I have as we say white flower in my bag that's a literal translation but basically make sure that you have your all your ducks in a and you're have trust with your manager and all that good stuff and that you have ways of tracing how things have gone and what's been done and what's not been done and so forth and so forth. And then make sure that when your manager gets involved that they do actually like you as an individual that they will hear you out because if you have these things in place it's pretty easy to do the thing that I do and that is say no I'm sorry I don't have time to do a sync meeting with you know like or I basically force them into a situation where there is no hiding there is only transparency because my argument is that the only people who benefit from obscurity usually usually are people who are incompetent or people who are bullies and at least in a corporate environment. And that's why I make sure that I don't have direct messages or like private conversations or so forth about stuff that can't in any way be interpreted in one way or another or so forth. I always have like a team channel or something like that where it's very easy for the manager to actually look into it if they were so inclined. But most of the time, as I've said on a few occasions as well, it's not a legal court that you're in when you're in a company, guys, it's there's no obligation for many managers or they have no interest in many cases to actually look up what's been going on and actually do some digging and figure things out and be just about the situation. More often than not, a lot will come down to your personal brand within the organization and well your relationship with the manager in question. So if they started doing things like this, I would do this thing that I always do guys and this escalated immediately. I do it every single time guys. Doesn't matter like I I've gotten to a point where like my perspective is that I'm a craftsman. My goal and I had this literal situation yesterday. My goal is to use my skills to produce working software like solutions for the company. If someone in this organization that I work for or in the organization I work for feels that my ideas are bad or the feels that we should be doing things in a different way or so they're in some way obstructing me from doing what I'm paid to do then I used to get angry and like have this you know sort of try to convince them and stuff like that. Now I do the simplest thing. I don't know why he never understood it when I was younger. I'm guessing because I had an ego thing going on I suspect. And now I have less of it. But what I do is literally this. I tell them with the best like best, you know, most choice words that I can find and I try to explain to them my point of view and then I present my arguments for why I want to do something in a certain way or so forth and so forth. If they say no or block me in any sort of way, then I immediately just go to my manager like immediately like just I don't even think about it. Boom. You're deal with this problem and let me know when you're done. This is exactly what I do here. And that works pretty dark gosh darn well. So if you have people who do like these weird things with chip tricks and so forth, it's pretty hard to get away with stuff like that, if you know how to figure like how to basically present what's going on to your manager and you know how to communicate with this individual so that they can see what's going on, then of course it's down to whether or not they're going to act on the thing or not. And that is like a whole different sort of situation. But if let's say that your manager is aware of the situation and they don't care or so and so forth. Well then obviously the only thing that is left is the thing that I always do and that is evaluate my options. Can I walk away? Now I'm lucky enough to be in a position where I can walk away if I want to. some people are not and then you really are you can apply the same principles that I've talked about but it's not a great and like it's not a great idea idea to to anchor yourself too much. So like make sure that you have savings, make sure that you have like up to date saving and so forth and so you can walk away if you want to because otherwise yeah you're it's going to be tough. So what I want you to take away from this is that I have been in many situations guys where people around me have used dirty tricks or things like that and so forth and so forth. The best thing I can tell you is that if you deal with individuals like that remember that people like that you usually can't convince them to change their behavior and getting angry at them isn't going to help much because they are doing these things for a reason. That's usually character flaw in my opinion at the very least. Not always of course, but when you're dealing with individuals like that, remember that the thing that they all think about and they all the only thing that usually works is authority. Now the problem with authority in a corporate world is that well your managers have to be aware and agree with your point of view that this person is doing a b and c or whatever is going on right. So you have to make sure that you can track what you've been doing. basically give arguments and sort of present some basic proof about what's actually happening and how things are moving and so forth and so forth. That's why try to be transparent because as I said before you have only things to gain if you're competent and high performer by being transparent because that means that people can see that you are competent and they will appreciate you for it and start trusting you. The only people who benefit from obscurity and so forth and so are people who have stand to lose from people actually seeing what's going on which is usually the incompetent and bully types of people at least in a corporation in a company. So if you have these things in place you create a good relationship with your manager then they're going to believe you when you escalate these sort of situations. And my tip to you is always the same. Don't fight a battle you don't have to fight. If your co-workers are behaving or like in this way or some other department head like blocks you from doing basic things or like mistrates you or anything like that, you immediately go to your manager like immediately because sadly enough some people only respond to authority. And no matter how rational you are or how nice you are to them, they're they simply don't care about whatever you're trying to do or what you want and so forth and so forth. And they can only be reasoned with or well not necessarily reasoned with they can only bend if you put pressure on them. And the only pressure that you can work with in a company usually is something that with someone who has the authority to fire them. That's usually what it ends up happen what's what the end of the day it's what's going to happen if they don't comply with what their managers are saying. Have a great day.
