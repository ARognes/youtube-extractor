iew be about uh like what you know based on talking to you so i did no whiteboarding in that first interview um which is good because any time i go in front of a whiteboard i immediately draw funny dinosaurs but um they were like what is something you learned um on a project that you were doing and you know tell me the code behind it uh and that doesn't it you know everybody's different but that didn't feel very daunting to me because it was like oh my gosh yeah when i had to do this thing with this array and you know this wasn't the right way to sort through it so i had to go through this way and i thought that would work but then this thing was wrong and so you're basically like venting about a project that you're working on but in in that you're able to show that like you had you could talk through the code that you wrote and you understood what things were right what things were wrong and you've actually coded before yeah like which sounds ridiculous but um it's it's a way to know too how frustrated people get on what problems and how much excitement they find in coding so um and you know what you they try to stay if they if they're if you're i've had this before where you're hiring somebody who's supposed to mostly be working on back end work and all they want to talk about through the whole interview is the front-end stuff or you know stuff that is not right connected to what you're hiring them for and not that that's always a downfall but it says like you're not really as excited about the aspect that we're hiring for so but that i think is such a good point because like if if we're writing a job description for a very specific role and you are a great developer who's not interested in that specific role it's not it's going to work out poorly for both of us because you're you're not going to be super passionate about the work we are asking you to do and you'll instead be trying to do work that is you know not what we were hiring for so it's better like actually that you reminded me of the way we were interviewing on my team at ibm where one of the things that we would do is we did a take home work project and we just it was like okay you've got two hours build a website and the things that we wanted you to do for the website were like you could build a front end you could build the the kind of like data business layer of like how you load stuff in or you could build it back in to store that data and then we would look at what people focused on because two hours is not enough time to do the whole thing so we said you know do do whatever you would do and then at two hours just cut off and then we'll talk about you know what you would do next and all that and if somebody spent the whole time on the ui we knew that that was where their passion was if they spent the whole time setting up a back end we knew that was where their passion was um and you could hear in the way they talked about it because you would see like well in some i'd have to figure out how to build the data stuff and you can tell like that's not the thing they're comfortable with it's not the thing they're interested in but they would just bubble and bubble and bubble about how much fun it was to write this front end and you're like perfect that we needed a ui engineer this is exactly who we should hire um and so i and but you can see that in projects too like you said like if if somebody is putting out a lot of pet projects then you get like a really good insight into what they're excited about what their what they're building and what they're publishing that's a window you know you're you're telegraphing as a developer when you build something you're sending out a message that this is what i like to build and so if you've got a bunch of ui projects and you're applying for a ui role that sends a signal to me as a hiring manager oh this person's doing exactly what we want i'd like to see more and like if we're hiring for juniors we're not looking for people