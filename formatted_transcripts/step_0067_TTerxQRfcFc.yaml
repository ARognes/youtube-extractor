atever you like but that's gonna be part of a really great learning process is like knowing because this happens on teams constantly where you're like here i made this thing that you asked for and they're like that's not exactly what i asked for change all of it okay cool so it's i mean i i can't i can't stress enough how like trying to find that in your community or small business somewhere it's like it'll help you in the long run yeah um okay so we have time for probably one more question and i think there's a really good one because we were just talking about projects um but there's a whole school of thought and a lot of emphasis especially in technical interviews on the idea of like the things that you would see in whiteboarding so leak code algorithmic uh you know being able to write your own bubble sort by hand and all that kind of stuff um what it seems the messaging that's being sent is that doing those types of programming puzzles is a more it's going to have more of an advantage when looking for a job versus building projects do you do you agree with that or kind of what's your take on that it's so this is such a loaded question because there are definitely benefits in someone being able to make those mental maps and show it in code uh but i am i i lose it in interviews i forget like i remember i had an interview and they were like what other frameworks are there for node and that is like like koa and they're like yeah i like those and it's like oh there are other ones in my github i have every single a project made with every single node framework i because i found it interesting to try every single one out but in the interview i was like my name's tara [Laughter] so i mean that in itself is like you know white boarding stuff can be actually really fun when you're comfortable and you're on a team and like you are just part of like your work day like i've definitely done it a lot and in jobs that i've already chosen to hire me um but i just think that ther