transcript: It's time. It's time to say goodbye. And I know the writing's been on the wall. I haven't been making videos for this channel in what feels like six months. And I just know that I'm letting a lot of you guys down. Uh so it's time. It's truly time for me just to simply say goodbye. And to kind of put a little bit of context on this, I need to tell a quick story. Uh around February 16th, I was in LA with Thor and Theo. Thor being Pirate Software. And by the way, I'm hugely grateful for being down in LA at that time because that's when the streamer awards were happening. And QT actually gave me an invite to be a part of that, which is rather awesome. I can't believe that. Huge honor. Honestly, it feels like the pinnacle of my career. But during that time, Thor handed me something. And he gave it to me for two reasons. One, an accomplishment for being a part of the Streamer Awards. Thank you. But two, to really kind of just tell me, hey, you need to take a chance. Quit betting on safety. Bet on yourself. take a risk. And for the next two months, honestly, I was torn up about this. I have been just thinking about what does my future look like? Am I really giving, you know, my all to this? Because I'm not I'm not doing the best work I can on what I've created. And that's because I don't have the time that I really, really need to do that. And during all this, my wife has been hugely supportive and encouraging. And she's also extremely attractive. I just love my wife. She is awesome. 12 years of marriage and I still am just like so stoked about her. But so today, April 4th, 2024, I have officially quit Netflix. And I would just like to say that I have never been more nervous and more excited. And when I told my boss this, he was actually incredibly encouraging. He told me that I have to give a minimum a year. I really need to pursue these things because it is going to just help me overall. And he just gave me a lot of good wisdom during that time. So, hey, Chris Wine, if you're listening, appreciate that a ton. But I've been at Netflix for 10 years. You know, I've seen a lot of change at Netflix. I've been through just so many different teams, so many projects. And honestly, I feel like I couldn't be more blessed. Uh my personal uh favorite accomplishment there was that I believed that performance logging was really critical. And at that time, there was only this thing we called consolidated logging and you could not deviate. And I I spent over a year going to meeting after meeting, meeting with everybody about the importance of allowing aggregated logs for being able to do a bunch of timings and stuff. And it took so dang long. And finally, I just went off and pushed it through a debug logging kind of conduit. Then made some Jupiter books and just showed the outcome of it all and showed how I saw on the website. There was a 0.8 8 second savings from startup time that we could just have because I was able to look at the data and from there it slowly exploded and went out. Oh man, it's been on every single UI. Super stoked about that. Uh but either way, it's time to say goodbye to Netflix. It's been with me longer than I've been with my kids. You know, I this may sound crazy, but my 10-year-old was born after I'd been at Netflix for almost a month. The jump honestly feels really scary, but often, as I've learned throughout life and a lot of uh just all the endeavors I've been on, the jump always feels scary. And often the landing is amazing. And so, it's good to just take that jump when you have the opportunity. And I would like to take that jump. I'd like to take my own advice and do that. So, thanks to everyone who's been actively supporting me. Thanks for everyone that's been on the Twitch streams telling me I have skill issues. I cannot tell you how thankful I am for all of this. And so, thank you for everybody that has wished me skill issues. Just genuinely thankful. And I'd also like to just personally thank my beautiful wife for the encouragement. My mom. My mom's always encouraging me. Thank you, mom. She's just the be. My mom is just the best. One day we'll tell some stories about her, but not right now. Uh, special thank you to Thor for getting this whole thing started. Hey, and a big shout out to Flip who's been with me since the very, very beginning. He edited my first video and he edited this video. Big thank you to him. Thank you for being with me this entire ride. And thank you to all the people who have just supported me along the way. Expect more videos on this channel. The name is the primogen.
