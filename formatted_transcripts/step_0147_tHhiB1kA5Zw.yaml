transcript: Some of the concerns I've heard folks say in the past are cuz a lot of the the folks in tech are like, "Well, this is hardcore. We're we're the the smartest people in the room." So, really a lot of it is, "Am I good enough? Am I smart enough? Can I keep up?" The way we've paced this boot camp is we're going to start on April 24th with a little kickoff party. We'll have a lesson stream Monday to Friday all the way through until July 3rd, but all of the material you're working on is within free code camp. If you go ahead and join and you get sick or you hurt or you're tired and you need to stop, that progress doesn't go away. There's no pass or fail. I mean, the only way to fail is to stop and not come back. But, one thing I'm really really proud of is a lot of our learners from the first cohort came back and finished on the third. Like, the ability to say, "Cool, this is just a really really laid-back community." There are deadlines and we're working on this this day, but we don't expect everybody to have everything finished on July 3rd. That's a lot of stuff to do.
