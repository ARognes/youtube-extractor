transcript: The world's first webcam was built for my favorite coffee. The world's first webcam wasn't built for security, meetings, or streaming. It was built because engineers were too lazy to walk downstairs. Back in the early '90s, the researchers at Cambridge had one problem. The coffee pot kept running empty. So, people would have to walk all the way to the break room to find nothing there. So, instead of doing that over and over again, they just pointed a camera at the coffee pot itself. They then streamed this to their computers, and yes, that was the end invention. What a blurry black and white feed just to check the coffee was ready. And interestingly enough, this tiny idea became one of the first live streams in history. Sometimes world-changing technology starts from one very human thing, and that's not wanting to waste a trip.
