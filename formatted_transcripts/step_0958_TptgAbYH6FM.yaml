transcript: So what I want to point out to you about judgment is this that every single time we judge someone or something we judge them for a very very specific reason and it's very interesting to see that for example people who are interested in philosophy and in the virtues when they believe in the virtue of honesty and they say I need to be honest because that's what philosophy tells me. That's what reason tells me. Let's say specifically stoicism, right? I want to be a good stoic. And so they believe in the idea of honesty and they make themselves more honest, which is great. But then when they see a person who is being dishonest, they judge them. They say, "I am honest. I am doing the right thing, the good thing, the proper thing. and you are a liar. You're so low. How can you do that to yourself? And we not only sometimes we get disappointed in them, sometimes we get angry at them and we resent them. And this is where we get into the biggest contradiction that we could possibly get into. We believe that honesty is right and lying is wrong because our religion tells us so, our philosophy tells us so. Our moral values tell us so. And it is that exact same religion, that exact same philosophy, the exact same moral values who in that very way push us into resentment. We listen to what our religion says, what our philosophy says, what our societal values, our moral so-called moral values, ethical values say to become a person who is more at peace. No. to become a loving person who become a kind to become a kind person and a fair person and a person who doesn't get angry anymore, who can be at peace, who can be happy, who can be tranquil. And so the very reason why we pursue virtue becomes the exact reason why we cannot have it. Every time we get disappointed in someone because they're not being virtuous, we are not being virtuous. Every time we are angry because our philosophy or religion tells us that the virtues are good and someone is not being virtuous, we become angry and we become resentful and we come we become hateful. So the very things that we have dedicated our lives to to make us better people end up making us worse people. However you want to define that. If you define being a good person as someone who's fair, who's kind, who's loving, well, that they're making us less fair, less kind, less loving. If you define becoming a better person as as someone who's at peace, who's as who's tranquil, who's happy with themselves? How can you be at peace and be angry? How can you be at peace and be frustrated? How can you be at peace and think you are better than someone else? How can you be disappointed and be in at peace? It's not possible. How can you trust God, love God, believe in God, worship God, and then get angry at someone else who is so-called disrespecting God? Does God need your defense? Does Does God need to be honored by you? God doesn't need anything from you. And so to become angry and and resentful at someone else because they are not worshiping God the way you do and respecting God, it gets you further away from God. And here a lot of people we love our we love philosophy, right? Philosophy tells us to better ourselves by being led by reason, for example. And how is it reasonable to become more fair only to become angrier at people who are not being fair? It's amazing. We become fairer people only to end up becoming angrier people. We become kinder people only to become less kind to other people. Isn't that the most amazing uh conflict you can you can possibly be in? And so well what's the answer? The virtues tell us to be honest. And so or the the commandments tell us to to not lie. So when someone breaks that commandment, when someone breaks that philosophical virtue, when someone does not adhere to that moral value, what are we supposed to feel? Are we supposed to feel joy at that? You need to let go of the so-called commandments. You need to let go of the so-called virtues. You need to let go of your ethical rules and your moral values. Because if you know truth, if you're truly an adherent of truth, if you've truly given yourself to truth, then you will not have any interest whatsoever in saying or doing anything that's not true. If you've truly committed yourself to justice, then you will have no other choice but to do the right thing. But you will also not care the least if anyone else is is adhering to that or not because you know that justice does not ask for your defense. You know that justice does not ask you to fight for it or to prove anything to anyone for it. And you know that justice, truth, honesty, love cannot be harmed. They cannot even be touched. They can neither be polished nor tarnished. So then why would you ever get disappointed in anyone else for just not giving what is the very best thing in this universe to themselves? How can you become angry or resentful at that? You need to do honesty for its own sake, not to become a better so and so. Whenever you are honest, you have a simpler, easier, better life. That's the reward. Not that some god is pleased with you. Not that you will go to heaven, but because you have made your own life easier. What's better than that? And it's the same with fairness. The thing is its own reward. And in fact, we should we don't even need to look for rewards. If one way to get to the same place is uphill and the other one somehow is not uphill. It's just a straight easy walk. You're going to pick the straight easy walk. And you're not going to say, "Oo, I'm better for having picked that straight easy walk." You're just going to do it because it's the simpler, better, easier. right thing to do and you're not going to look at the other path and judge people who are taking the steep path or the so-called wrong path. You have no interest. It will not be a concept to you whatsoever. But as long as you hang on to those values, as long as you say me doing this is right and others doing this is wrong, you don't get to have any of that peace. That is the very reason why you pursue those values and those rules and those virtues. And so this is what I wanted to point out to you that contradiction that the more we we pursue moral values the more we get away from them. The more we pursue God the further we get away from God whatever it may be whatever you believe in. Only when you stop doing it for a reward only when you stop doing it to feel better about yourself. Only when you stop doing it to prove something to someone else or again to yourself or to God or to virtue and justice and truth. Only then will you actually have it and you won't even think about it anymore that you have it or don't have it or anything that it will just be you. That's just how you live. And so again follow every judgment home. follow. See what belief, what so-called moral value or commandment or virtue or or law or rule it goes back to. And see how you are selfdefeating that very thing that you believe in to give you a peaceful better life. However you define that, it's the most amazing thing. And this is how the more we do this, the more we see this contradiction, the more we see how we are undermining ourselves literally, the more we will actually be become become less judgmental because everyone tells us not to judge and then they go turn around, they judge too. So no one knows what they're talking about. Everyone seems to be talking about judgment and don't judge me and don't do this and don't do that. But no one seems to be talking about or knowing why actually and how not to judge someone because you can tell yourself that judge judging others is wrong as much as you want and you can tell others as most people do. But if you're still judging yourself and you don't know how to get away from that, how is that going to help you? The way to get out of judgment is to see this fun fundamental contradiction and conflict about it. And as you know, we are beings of reason. The more we see a conflict in our own behavior and our own beliefs, the easier it will be for us to drop them. And when we drop them, we will truly become nonjudgment judging people. And again, the reward is itself. The more we judge, the more resentment we feel, the more pain we are in. So to not judge is again should be done for selfish reasons. so-called selfish reasons and not so-called selfless. You don't do this for others. You can't do this for others. How can you not judge someone for littering? Who is littering? You cannot do that. It needs to be done for yourself. And this is the way to do it if you practice it. um go about your life and find that belief that your judgments come from, your resentment comes from, and then see that that very belief is promising to free you, but in fact is chaining you up further. That's the point.
