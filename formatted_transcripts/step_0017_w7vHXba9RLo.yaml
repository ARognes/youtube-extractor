hat position the arm is in. That way, you don't need to recalibrate the whole robot every time you turn it on and off, which is super convenient. The downside is those batteries obviously do not last forever, and whenever they die, you get a whole bunch of errors, and the controller basically refuses to do anything. There are switches on the back of the pendant that need to be held in for the robot to be able to move. You don't need to hold in both switches, but you need to hold in at least one, and it's meant so that you really need two hands to be holding this thing if you want to move the robot because you need to hold in one of the switches on the back, and press shift, and press those jog buttons down there, which are now out of reach. So, I might be able to do this with my other hand. Do some trickery here. I'm sure this is how they intended it to work. Anyway, you can see the error messages we get whenever I try to jog. Enable input is off. Now, I'm not sure where that enable input is. Okay, according to the internet, that MCTL -013 enable input is off is related to some sort of software configuration in the controller itself. So, I'm seeing a few different options here. One of them is this system variable. These buttons are not super functional. Uh It's called op work. You op disable. You're pretty close. Op work. You op disable. What? All right. We'll hit jog. Error status. Reset. Try again. No. Still won't work. I think we need to replace those encoder batteries. But, at least we fixed the enable issue. That is progress. So, I'm looking for the batteries here in the robot and I kind of assumed they'd be there in the base since it's the easiest to get to, but they are in fact up here conveniently covered by the top part of the arm. I have no idea how you're supposed to get at those if the arm happened to be in an even worse position where it was leaned back and there was almost no room above this cover. But, there are two batteries in there. They are these 