urplus stores that buy and resell industrial machinery, which are often easier to deal with than auctions. I've put links in the description to some of the places I've got machines from. If you get anything, be sure to tell them I sent you. It helps increase the chance of me being able to work with them in the future. Also, places like eBay or Facebook Marketplace will sometimes have good deals. However, by far the most powerful source of used industrial goodies is knowing someone who happens to be getting rid of stuff. More often than you'd think, robots get sent straight to the scrapyard. So, asking around and knowing the right people can get you some robots for cheap or completely free if you're lucky. So, how do you know what's a good deal? Well, a lot of it comes with experience. I'll put how much I spent on all the different robots and machines I've bought up on the screen to give you a better idea as they appear. First up is determining if it seems like it's in good enough condition or not and includes all the required parts. For a fully operational robot, the biggest things are the robot itself, the controller, the teach pendant, and the cables to go between. If you only want the robot and plan on replacing the motors with your own or using something like the open-source robot controller I'm building, then you only need the robot and maybe cables if you can't find the mating connectors for sale somewhere. Robots without controllers will often be substantially cheaper than ones with, so they're what I usually get. Only one of the robots I got from the auction came with its original controller. Make sure everything looks intact. No missing motors, encoders, smashed connectors, or cut cables. I've seen a lot of damaged connectors from something bumping into the robot or cut cables from people removing the robots from wherever they were installed. Apparently, the 5 seconds to unplug the cable is too long compared to the 3 seconds to cut it off. Tags or writing on the machine can be super useful. Many companies will tag faulty equipment and write the reason. Might be as simple as NFG or maybe a bit more colorful and tell you what the actual issue is. Open or missing access covers are often not a good sign. Chances are someone was in there trying to fix a problem or steal a part to fix another machine. I always check extra close when I see something like that and keep it in mind if I'm trying to troubleshoot an issue later on. If you're looking for a robot and controller pair, check that the numbers on the controller and robot match. Controllers are usually designed to run robots using the same hardware with different software settings, but these settings aren't always easy to change or in the standard documentation. I didn't check the numbers matched on my Fanuc R-2000 I bought years ago and ended up getting a controller from a different model robot. I was unable to get it running with that controller, which was what started the whole open source robot controller project. Supposedly, you can change settings deep in the controller to get it working, but I only had people tell me years after I had already sold the original controller and started making my own. I'm still making progress on the new version of my servo drives that are capable of running three motors from one board. Here, the motors are running in open loop mode to test the drive itself and help me spot issues before ordering the next batch. Be sure to subscribe so you don't miss the full power testing. Thanks to PCBWay for helping sponsor these projects. They provide manufacturing and assembly services for custom PCBs, as well as custom laser cut and bent sheet metal, or CNC machined parts. They made all of the circuit boards and sheet metal enclosures for my robot controller parts, saving me a ton of time. The first 200 people who use the code PCBWay excessively overkill 10 can get $10 off orders over $30. You can apply the code at checkout or add it to your account to save for later. The discount code and link to sign up are in the description below. While testing my drives, I found I managed to flip some of the connections on all of the current sense amplifiers and had to do a lot of tedious bodges. I already have four more of these boards which are now non-functional in their current state, so they're going to be on my store's leftovers if anyone wants one. Not sure what you'd use them for, but they aren't doing me any good. My store is linked in the description if you'd like to check it out. The pre-order for the development edition light up badges is also on there and it's still open for another few days before I start manufacturing. If you want to get your hands on one, now's your chance. I'm only doing a limited run for this edition, so once they're gone, they're gone. Anyway, back to the video. Since my full controller isn't ready for sale yet, the best way to get a robot up and running is with its original controller. You should check inside of the controller to see if there are loose hanging connectors or empty slots, indicating a board might be missing. It's common for old equipment to have parts stolen to keep other machines up and running. Sometimes there are intentionally spare connectors or slots though, so it's really best to compare to the manual. The manual is probably the most important thing to find before you make a purchase. Maintenance manuals are incredibly valuable when it comes to getting old stuff like this up and running. Certain machines will have the manual or at least electrical schematic stored inside a control panel. Unfortunately, that's normally not the case with robots and many brands like Fanuc don't make manuals available to just anyone. You need to be a company with money to throw at them, so you might have to search online pretty hard to find any or rely on forms to read solutions to common problems. There are usually manuals for controller programming, controller maintenance, and robot maintenance. Finding all three is ideal, but the controller manuals can get you almost everything needed. I don't have the robot maintenance manuals for any of my robots. Now that you know what I watch out for, there's a couple things that aren't as big of an issue as you might think. Such as if a robot is absolutely covered in grease and dirt. Sure, it might mean that the previous owner's maintenance program was a bit lacking, but there are some applications where robots will be absolutely covered in dirt after just one day, and they're built to handle it. Most robots are pretty well sealed up and will be perfectly fine with light water like from rain. Sitting outside for a while probably isn't going to hurt anything as long as all the parts are still attached and sealed up properly. If you see a machine that looks pretty bad, keep in mind other people are probably thinking the same. So, it could be a good chance to get it for way cheaper than usual if you are willing to maybe fix some problems or spend more time cleaning it up that is. If the machine itself looks good or good enough for the price, there are still a few other things to consider on your end. Industrial machines are big and heavy, so they aren't easy to move. However, I've yet to find anything that can't be moved with enough friends armed with crowbars and steel pins. Make sure you have a plan for how to safely get it where it needs to be. I highly recommend robots with bases already attached. They make it much more stable when sitting there and give you better mounting holes for bolting it down, which you definitely should do. Robots are very dynamic. The majority of the loads their mounting bolts need to handle are from the robot moving, not just the static load of it holding something still. Even if a robot seems stable when moving slowly, it may jump all over the place when running at full speed. You'll want to make it sturdier than you think and carefully test it up to full speed to see how it handles. You'll also need to figure how to power the robot. Most industrial machines want three-phase input power, which isn't commonly run to homes in the US. Some countries do have three-phase, which is convenient, but you still might need a transformer to get the correct voltage. I live in the US and have standard 220 volts run to the house, so I built what is called a rotary phase converter. At its core, it's a normal three-phase motor that is spun up and powered off of only single phase. Once it's running, it generates the remaining phases, although typically not super well, so some capacitors are often added to help balance out the voltages. These systems are common and pretty easy to build. You can get the parts for quite cheap if you're already looking at industrial surplus. However, that only gets me three-phase at 220 volts. Some machines want 480 volts or even 560 volts. To get those voltages, I have a couple three-phase step-up transformers, also bought as industrial surplus. The actual total power these robots need might be less than you expect. The supply requirements will usually be stamped on the controller or in the manual, but the average power is often significantly less. Robots are very peaky loads, so while moving slowly or stationary, they barely draw any power. But, when doing fast moves, they can easily draw 10 or 20 times more for brief periods. My big robots are rated to only draw around 2 and 1/2 kW on average. Smaller robots will use even less, as low as only a few hundred watts on average. You'll also need to plan out some safety setup. Unless you happen to find one of the fancy collaborative robots meant to work around people, any industrial robot you find will probably be capable of causing great injury, to say the least. It might vary from breaking your hand to throwing you through a wall, but either way, you should stay out of reach and always be aware of what the robot is doing. Robots usually have teach pendants with special safety-rated switches you must hold down to enable motion. If you let go, the robot will stop immediately. They also have an e-stop button on the pendant and terminals in the controller for you to attach your own additional e-stop buttons or safety sensors to tell the robot to stop if someone gets too close. Should you set up e-stop buttons and a whole safety enclosure around your robot? Yes. Do I? No, at least not usually. I almost exclusively run my robots in teach mode, which requires me to be holding the pendant for the robot to move. These robots can also run in full auto mode as well, which doesn't require you to hold the pendant. This is how robots run in production. Teach mode means I am at all times able to stop the robot in under a second by letting go of the safety switches or pressing the e-stop button. And I am paying attention since I know the robot is going to move. Then when I'm working around the robot and not holding the pendant, I have the e-stop button pressed or the entire robot switched off for extra insurance. If you choose to run in full auto to automate something, I highly recommend at the minimum painting the kill zone around the robot and setting up some barriers with e-stops around the room, especially if the area can be accessed by anyone who might not know the dangers of the robot. Ideally, the robot would be totally enclosed with safety scanners or light curtains to detect if someone was in the danger area, which would then prevent the robot from running. If you're going to buy e-stop buttons or safety devices, buy them from an actual automation supplier like Automation Direct, and not just any old button. Get the ones meant to be e-stop buttons, and for sure not Amazon or AliExpress grade ones. I've seen way too many of those fail for me to bet my life on them. Once your safety setup is complete, test it thoroughly and test it regularly. Wires can get damaged or shorted together, so it's a good idea to make sure everything is still in working order periodically. With that out of the way, I'm going to try to get the one robot that came with a controller up and running. This next little portion is unscripted, so cut me some slack if I misspeak. First things first is getting this thing mounted, so if it moves, it's not going to fall off the table. Even though these are relatively small and relatively lightweight, I believe this weighs around 70 lb, it is still well within its capability to break your your or worse. I threw together this little wooden platform that I can just screw the robot base to and then bolt down to the metal table underneath, so nothing's going to slide around or move once this is running. Now, don't be deceived by the 220 V sticker on the front. This is in fact a three-phase controller, unfortunately. Our main 220 V three-phase comes into the top of this disconnect, which is accessible from the front of the controller, and basically turns on and off the main power to everything. After that, it runs down to this relay here, which is controlled by the e-stop board. This is the safety system for the entire controller and robot, which makes it so if you press the e-stop button on the front of the controller or on the teach pendant, it shuts down power to everything, so there's no chance of it continuing to run. It also has terminals that you can hook up to external e-stop buttons, such as whatever the robot ends up actually being built into. You'd typically want to have e-stops anywhere someone could potentially be within reach. It also has fence inputs, which are so there can be doors around the robot, and when those doors are opened, they will break a contact and then trigger the robot to stop as well. Now, in our case, someone has already conveniently jumped over all of those safety inputs, so we should be good to go right from the start and not need to mess with any of that stuff. After this relay, the power goes into the bottom of this module on the left. This converts the 220