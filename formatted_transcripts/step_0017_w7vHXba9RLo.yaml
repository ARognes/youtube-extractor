ight be like a meter a second. Uh but the joints are going to move full speed regardless for the normal joint moves. So, we can try this out and see how fast it can go. >> All right, well that all seems good. Should we do 50? Nah, we'll just go right to 100. Hopefully nothing has any problems. Maximum speed. >> [screaming] >> Pretty quick. Pretty quick. I'm excited to see how quick the newer versions of this one will be able to go. I assume they're quicker than this. This is one of Fanuc's very first LR mates, I believe. From What year is this? Oh, wow, this is actually a pretty modern one. This is from the year 2000. I think I have some that are from like 1997. This one up here is 1998. So, pretty old. The newer ones down there, and they have some really new ones that are still current. They'll be six axis and everything, so very excited to try to get those working eventually. I need the open-source robot controller for them though. They did not come with any of their own original controllers. So, that'll be a project for another day, but eventually, I'll get some of those running up at full speed just like this one is. The dead batteries are basically the standard issue with FANUC robots after they sit for a while. Not at all a big issue to fix. There are a few other issues that are also usually easy fixes, but some can be huge problems. If you have issues with the controller, the first thing is to check what the errors mean in the controller manual. It usually has great instructions for how to go through and fix the issue. Often, there might be fuses blown due to improper or damaged wiring. Most controllers have a few scattered about for control power and logic. That's one of the first places to look if you are getting really bad sounding errors, or it won't power on at all. Of course, you should have a look to see why the fuse blew in the first place. Could be bad wiring, could be a bad part, could be something that used to be connected had failed and is now gone, but the fuse was never replaced. Just make sure you aren't blindly replacing fuses without knowing the original issue. You could potentially cause even more damage. There's also the signature culprit in all electrical systems, bad connections. Always check connections first if there's an issue. The contacts themselves could be dirty, the connector might not be fully seated, maybe a solder joint has cracked. I've seen cables and airlines in robots completely worn through after thousands of movement cycles, or small nicks in cables that cause intermittent connections or shorts. The list is endless. What I'm getting at is verify your connections first before you start tearing everything apart. The other common issues I've seen that are less easy to fix are the mechanics of the arm itself. Chances are any arm you find will have AC servo motors in it unless it's very old, in which case it may have DC brushed servo motors. Basic stepper motors are uncommon in industrial grade machines since they have much lower power density than those other motors. AC servos are typically reliable, but can still fail as you'll see in a moment. DC brushed servos are much more likely to be worn out and need to be cleaned and have new brushes installed. I have also seen the brakes attached to the motors fail. Most robot servos have spring-loaded brakes attached to their motors that require power to unlock. Robot joints are usually back-drivable, so if the motor isn't being powered to hold its position, the arm would flop down. The brakes hold the motor in place by default with no power, so the arm doesn't fall. The brakes are sized to provide a bit above the continuous torque output of the motor. So, if the robot loses power while moving and the brakes slam on, the stopping torque is still within the acceptable range. The brakes shouldn't damage anything if they're needed to stop the robot from full speed. However, during normal use, they only ever hold the motor stationary and aren't actually handling slowing down the motor. The normally locked brakes introduce a couple important considerations. If you manually send power to the brakes to release them or remove a motor to work on it, the arm may fall. Or, in some cases if the arm has a counterweight or big counterbalance spring, it might instead rise. I've heard stories about people removing a motor on one of these big robots and sending the end up into the ceiling from the counterweight falling. I generally short the motor phases together if I want to release the brake on a joint. It makes the motor stiff to turn, which prevents the joint from moving fast and keeps everything nice and slow. I got a box of assorted robot parts from the auction, including a couple motors that say they have bad brakes. On a good motor and brake, the shaft will normally be locked in place. A small amount of backlash is fine. Then, when power is applied to the brake, it'll be free to rotate. On the bad motor, the brake still draws power and even makes the click sound like it's releasing, but the shaft stays locked in place. There is also no backlash at all, unlike the good motor. I decided to take the motor apart to try to find what the actual failure reason was. It turns out the brake itself is fine. It releases and moves freely like it should. The real issue is the rotor itself has come apart. The magnetic dust covering it caused it to jam up against the inside of the stator and prevent it from turning. This is unfortunately unrepairable. Even if I cleaned off all the dust and reassembled the motor, the magnetic properties of the rotor have changed and the motor won't perform as well as it should. Not to mention I also managed to scratch the encoder code wheel while I was trying to get it off the shaft it was glued to. These small motors are not at all easily serviceable. If only the brake failed, it could possibly be fixed or just totally removed. Then the motor could still be used for something else as long as it being allowed to rotate when powered off is okay. One of the worst problems to have with these robots is the gear reducers themselves failing. They're what connect each joint to the next. They contain a set of bearings keeping the joints together and also some sort of gear reduction that lets the relatively fast servo motors drive the relatively slow joint with very high precision. Although as you've seen, relatively slow can still be pretty fast. After years of use, they can end up getting sort of crunchy and stiff to turn or start to have more backlash than is acceptable. Not only are the replacements expensive and hard to find, they're a huge mess to replace since they're full of grease. Even the grease is super expensive and specialized for each robot and reducer type. On the robot I just got running, you may have noticed how loud and squeaky the joints sounded when they moved at full speed. You might think the gear reducers or motors are shot, but that high-pitched sound is mainly from the servo drives running the motors. Older robots typically have servo drives with a lower switching frequency, which makes them sound louder. So, don't be immediately alarmed by the high-pitched squeal the joints make when moving. There are two common types of gear reducers used in industrial robots. Small robots use harmonic drives, also called strain wave gear reducers. The one I have here is a brand new frameless harmonic drive. The ones in robots are usually a bigger integrated unit including bearings and seals to keep the grease in. This one is only the actual reducer. It's meant to be put in a machine to housing with bearings and seals added separately. They have a thin flexible inner spline and rigid outer spline that has two more teeth than the inner one. Then a bearing fits snugly inside the flexible spline. Crucially, this bearing isn't a perfect circle. It's actually a slight ellipse, bending the flex spline so it meshes with the external spline at two sides. The input to the reducer is the center of that bearing. When it rotates, it moves where the splines are meshed together. The output is between the inner and outer splines, which would be connected to each side of the robot joint in this case. Since the outer spline has two more teeth than the inner spline, each time the input rotates one full rotation, the inner and outer spline move by two teeth as well, resulting in a total reduction between 50 to 200 to 1 typically. These reducers don't always have a graceful failure where they slowly wear out, however. This robot has been through some sort of substantial crash. The J2 reducer is completely destroyed and the joint is free to move. The J3 reducer is still at least partially intact, but it's stiff to move and not at all smooth like it should be. After pulling it apart, it's clear this joint has also suffered a crash. The flex spline has started to twist and buckle in on itself. Those bumps in the flex spline aren't supposed to be there. It should be perfectly round like the new one. This kind of failure requires the reducer to be replaced. There's no repairing the flex spline. These were listed as parts robots like I mentioned before, so I will eventually tear apart all of them and see what parts are good and what needs to be replaced, then build as many complete robots from the good parts as I can. The remaining good parts will either be used for other projects, kept as spares, or put on eBay to help fund future projects. The bigger robots don't just use giant harmonic drives. Instead, they use something called radial vector reducers, or RV reducers for short. I'm not going to take apart one of my big robots to show you a reducer, but luckily I got some brand new RV reducers as industrial surplus years ago and haven't used them for anything yet. This is a relatively big one. All of the joints on robots of this size typically use RV reducers. My UP6 has small RV reducers on joints 1, 2, and 3 with the rest being small harmonic drives. I think harmonic drives are easier to manufacture once the joints need to be so small. I even have some insanely small ones about the size of a quarter. RV reducers have cycloidal discs surrounded by pins they mesh into with the count being off by one between them. Since the lobes are so much bigger than the teeth on the splines in harmonic drives, there aren't as many and the reduction ratio is lower. To help with this, there's an additional reduction between the motor and the cycloidal disc through standard spur gears that brings the reduction back to a similar range as harmonic drives. Now, don't be fooled into thinking this is a planetary gear reduction. There is no outer ring gear that the larger spur gears are running against. Instead, they're attached to offset crankshafts that drive the cycloidal discs. This method of driving the discs from multiple points with much larger bearings is what separates RV reducers from plain cycloidal reducers, which are usually only driven from a single offset crank in the center. The pins on the outside are also able to rotate, which changes the bearing or wear surface from the small point where the cycloidal disc contacts the pin to the large cylindrical surface the pin is seated against, reducing friction and greatly improving the life of the reducer. The bearings supporting those crankshafts might seem oversized for handling the loads from those relatively small input gears, and that's because they are. Those crankshafts and bearings are what carry the full output torque from the cycloidal discs to the joint the reducer is driving. There are There are cycloidal discs in this reducer. If you look past the top disc, you can see a second disc moving around underneath. Technically, only one disc would still work. The reason there are two discs is for balance and additional rigidity. A single disc would create quite a bit of vibration as it oscillates since it's off-center. The second disc is designed to move in the opposite direction as the first, so the vibrations cancel out. This also means the loads on the crankshafts from the cycloidal discs are balanced. Each shaft is pushing the discs in opposite directions, and the discs mesh on opposite sides of the outer housing. That way the oscillating load from the discs mostly stays contained to the crankshafts, discs, and housing, rather than needing to go through all of the other bearings to keep the discs meshed with the outer pins. I'll eventually work on getting some of these other small robots up and running. Maybe make another video out of it. But first, I need to clear out space in the garage to work on the mobile robot arm. So, into storage they go. If you found this information helpful or want to keep up with my projects, be sure to like and subscribe. Thanks for watching.
