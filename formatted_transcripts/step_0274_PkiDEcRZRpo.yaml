transcript: We make all these assumptions, and there's all these assumptions that society [music] puts on us. This is in business, this is in life, this is everywhere. And you get to choose. That's the thing is like you get to choose. And you don't need to feel guilty for the fact that not [music] everything is a [ __ ] priority right now. I actually think there's something really freeing about that because if everything's a priority, then nothing is. If you're one of those people that tries to just fit [music] absolutely everything in all the time, I think there's nothing wrong with that if you have the utmost flexibility. Because the most flexible system always wins. If you are rigid in the way that you stick with [music] things and if not doing something and not completing an area of your life that day or fulfilling an area of your life is going to make you feel like a failure, you're going to feel like a failure every [ __ ] day. You're like going to set yourself up to fail. You're going to feel like [ __ ] all the time. >> [music]
