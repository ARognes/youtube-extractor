transcript: '{"content":"\n[0.0s] What''s the deal with the friend zone?\n[1.52s] The moment that we say that there is a\n[3.32s] pathway, and by the way, in the\n[4.64s] literature, this is called the\n[6.0s] friends-to-lovers pathway, which is the\n[8.28s] most common way to enter into a romantic\n[10.56s] relationship. There are a lot of us who\n[12.4s] have romantic feelings for a friend, or\n[14.72s] maybe they have romantic feelings for\n[16.24s] us, and we''ve been told, \"Oh my god, the\n[18.04s] friend zone is a terrible place to be.\"\n[19.64s] We''ve been told that you should express\n[21.56s] your romantic interest early. Like,\n[23.32s] don''t get slotted into the friend zone.\n[25.08s] Don''t get friend zoned. Stay in the\n[26.96s] girlfriend zone or the boyfriend zone.\n[28.52s] Like, that''s the zone we want to stay\n[29.92s] in. If you look at the organic way that\n[31.56s] relationships form, in one study of\n[33.52s] 1,857\n[35.08s] people, 70.3%\n[37.8s] of these people said that they were\n[39.6s] friends first before they engaged in a\n[42.52s] romantic relationship. Other interesting\n[44.16s] thing is that the average duration of\n[46.24s] friendship is 21.9\n[48.8s] months. So, these people are usually\n[50.84s] friends for about 2 years before they\n[53.84s] start dating. So, it kind of tracks with\n[55.88s] your experience of your dating your,\n[57.72s] let''s say, your girlfriend, and then you\n[59.4s] guys date for a year, there''s a friend\n[61.24s] that you''re worried about, you all break\n[62.56s] up, and then 8 months later, they are\n[64.48s] dating the friend that you were worried\n[65.72s] about. The data behind this stuff\n[68.0s] actually absolutely tracks with that."}'
