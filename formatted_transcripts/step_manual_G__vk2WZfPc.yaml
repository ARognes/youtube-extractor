transcript: '{"content":"\n[0.24s] We all have them, those recurring\n[2.52s] problems at work or with your family,\n[5.68s] frustrating conversations\n[7.84s] you have over and over, the feelings of\n[10.56s] stress that you just can''t seem to\n[12.6s] shake.\n[14.12s] We spend so much time treating the\n[16.28s] symptoms of these problems, but what if\n[18.64s] there were a way to diagnose and solve\n[20.72s] the problems themselves?\n[23.0s] Well, there is. It''s a 2,500 year-old\n[26.2s] framework from the Buddha, and it''s one\n[28.88s] of the most effective troubleshooting\n[30.8s] guides ever created.\n[33.68s] By the end of this video, you''ll have a\n[35.48s] four-step tool that you can apply to\n[38.08s] almost any challenge in your life.\n[41.56s] So, let''s start with what we might call\n[43.68s] the doctor''s method.\n[46.24s] This framework is traditionally known as\n[48.36s] the Four Noble Truths.\n[50.6s] For many, that that sounds ancient and\n[52.8s] maybe a bit grand.\n[54.92s] But, let''s set the name aside.\n[57.28s] Let''s look at it instead as like the\n[59.28s] method that a brilliant doctor might\n[61.68s] use.\n[62.84s] A doctor isn''t just a sounding board for\n[65.239s] complaints,\n[66.72s] they have a method.\n[68.76s] First, they identify the illness, they\n[71.12s] give you a diagnosis.\n[73.52s] Second, they determine the probable\n[75.2s] cause of that illness.\n[78.4s] Third, they''ll confirm that a cure is\n[80.68s] possible, they''ll give you a prognosis.\n[84.32s] And last, they will prescribe a\n[86.04s] treatment to bring about that cure.\n[89.76s] And that''s exactly what we''re going to\n[91.32s] do right now. Let''s walk through these\n[93.68s] four steps.\n[96.12s] All right, so that''s the method. Let''s\n[98.36s] dive into the four steps themselves.\n[101.48s] First, we clearly identify the problem.\n[104.64s] This is known in Buddhism as the first\n[106.24s] truth.\n[107.6s] Now, this step is to diagnose the\n[109.92s] illness, the problem that we''re having.\n[112.68s] This is what brought us to the doctor in\n[114.44s] the first place.\n[116.2s] And it is perhaps the key step of all\n[119.36s] four. Acknowledging that something is\n[121.92s] wrong.\n[123.56s] We can''t heal an illness that we refuse\n[126.28s] to see.\n[128.2s] And many of us aren''t even willing to go\n[130.08s] this far, and so we''ll end up suffering\n[132.84s] needlessly, sometimes without even being\n[135.4s] aware of the extent of our suffering.\n[139.56s] In that case, we may end up living very\n[141.88s] restricted, anxious, or angry lives.\n[146.36s] So, this step is all about radical\n[148.52s] honesty. It''s about becoming aware of\n[151.28s] our points of friction and stress,\n[154.36s] our feelings of unsatisfactoriness with\n[157.08s] our lives,\n[158.4s] a feeling that something''s just off, not\n[160.76s] quite right.\n[162.92s] This first step is simply to acknowledge\n[164.88s] and name the problem as a problem,\n[168.0s] without judging anybody.\n[170.959s] Without saying to ourselves, it''s all my\n[172.959s] fault, or it''s all my boss''s fault, or\n[176.6s] it''s all\n[177.84s] society''s fault, whatever.\n[181.04s] It''s not my boss is a jerk, but instead,\n[184.48s] I feel angry and undervalued at work.\n[187.56s] This takes the blame away.\n[191.0s] Now, second, what we want to do is find\n[193.32s] the root cause. This is the second\n[195.56s] truth.\n[197.48s] Now, this step is the diagnosis.\n[200.64s] The problem, after all, does not come\n[202.2s] from nowhere.\n[204.0s] Now, usually we have a number of issues\n[206.72s] in life, stresses and anxieties, for\n[209.32s] example, and each of them comes with its\n[212.12s] own backstory.\n[214.36s] Each one of them has its own innumerable\n[217.16s] causes and conditions.\n[219.239s] And if we want to, and we often will, we\n[222.04s] can quickly get lost in the weeds and\n[224.6s] lose sight of the bigger picture.\n[227.08s] We can get overwhelmed by trying to\n[230.44s] tell each of the stories of these of\n[232.28s] these problems we have.\n[234.56s] Just like any symptoms we bring to a\n[236.68s] doctor may come with their own confusing\n[240.48s] stories, often beginningless. We can''t\n[242.76s] really tell where this problem exactly\n[245.16s] began.\n[247.2s] What the Buddha noticed that there is a\n[249.08s] common element to all of these stories\n[251.56s] that we tell.\n[253.12s] We might understand that common common\n[255.08s] element as a kind of a gap.\n[259.0s] The root cause of our frustrations, our\n[261.68s] stresses and anxieties\n[264.36s] is a kind of gap between expectation\n[267.919s] and reality.\n[270.24s] And we try ordinarily to cross that gap\n[273.4s] by grasping for things to be different\n[276.12s] than they are, by craving for that kind\n[278.48s] of change.\n[281.2s] So, when we confront this kind of\n[283.68s] suffering that we''re\n[285.24s] feeling, we can ask ourselves, what am I\n[288.72s] clinging to? What am I grasping for\n[290.88s] here?\n[292.64s] What expectation of mine is being\n[294.56s] violated or undermined?\n[297.44s] Take the example of work.\n[299.88s] The true root cause of our concern, our\n[302.88s] problem, might, in one example, not be\n[306.2s] our boss''s attitude so much as it might\n[309.0s] be, for example, our attachment to\n[311.32s] praise, to being praised. Or our craving\n[314.84s] for the meetings that we have to go a\n[317.08s] certain way.\n[320.08s] Or instead, perhaps our stress is due to\n[323.6s] our attachment to the high salary that\n[326.44s] we get and the lifestyle that it\n[328.4s] provides us.\n[330.16s] And that forces us to endure\n[332.16s] mistreatment.\n[333.84s] Now, the third step is to notice that a\n[335.76s] solution exists. This is the third\n[337.8s] truth.\n[339.16s] And this is the simplest step of the\n[340.919s] four, in a way,\n[342.6s] but it''s also absolutely crucial. That\n[344.84s] is, to envision the what we might call\n[347.72s] the solved state, what it might look\n[349.68s] like if we could get over this problem.\n[353.84s] Truly envisioning a step like that can\n[355.92s] help move us away from our ordinary\n[359.52s] feelings of frustration and depression,\n[362.36s] sadness in towards hope and possibility.\n[367.16s] After all, if our problem has a cause\n[370.32s] and if we''ve been able to identify the\n[372.16s] cause,\n[373.6s] then if we can work to remove that\n[376.12s] cause, the problem may cease on its own.\n[380.6s] And we can note that this step\n[382.96s] will allow of partial solutions in many\n[385.64s] cases.\n[387.16s] That is, we may not be able to solve the\n[390.44s] problem of stress for all parts of our\n[393.44s] lives, even if we''re able to in the\n[396.96s] particular narrow case in front of us.\n[401.4s] We can, for example, take the case and\n[403.68s] envision what that better state might\n[406.0s] look like once the gap is acknowledged.\n[410.8s] We might see that it''s possible for me\n[412.68s] to sit in a meeting and not feel angry\n[415.96s] even if I don''t necessarily get praise\n[419.0s] from my boss.\n[421.84s] Or we might understand that it''s\n[423.96s] possible to leave my work, leave my job\n[427.84s] and find a better, happier life at a\n[431.56s] lower salary.\n[434.0s] In that case, we''re beginning to see\n[435.72s] what being cured might look like.\n[440.0s] Step four, we follow our action plan.\n[442.96s] This is the fourth truth.\n[446.4s] This then is the doctor''s prescription.\n[449.56s] It gets us from our state of stress and\n[452.12s] suffering\n[453.36s] towards one of greater freedom and\n[455.36s] contentment.\n[457.28s] This is the so-called path of practice.\n[461.2s] It''s simply a set of things recommended\n[463.68s] that we do in order to begin to remove\n[466.6s] the cause of our illness.\n[469.32s] Basically, what we need is a kind of\n[470.92s] plan.\n[472.44s] And what might that plan look like?\n[476.12s] For example, if I notice that I get\n[478.0s] angry when I''m not being given praise,\n[481.2s] my plan might be to practice a kind of\n[484.2s] non-attachment.\n[486.28s] Understanding that I alone am not\n[488.44s] responsible for what I produce,\n[491.52s] and that the good that I''m doing,\n[493.28s] wherever I''m doing it, is valuable,\n[495.76s] whether or not I''m expressly being\n[498.04s] acknowledged for it.\n[500.68s] I could, for example, set an intention\n[502.88s] before a meeting that I''m going to have,\n[505.64s] or practice mindfulness of breathing\n[508.24s] when I feel myself getting triggered.\n[512.08s] This plan directly targets the cause\n[515.44s] that we identified in the second step.\n[519.0s] It helps us to relax around these gaps\n[522.039s] that we find between our what we want\n[524.52s] and what reality provides us.\n[528.56s] Okay, now that we''ve seen the process,\n[530.92s] let''s pull it all together with another\n[532.6s] real-world example.\n[534.92s] Let''s take a simple example in this in\n[537.44s] in this case.\n[538.88s] As in any training, we should really\n[540.96s] start small and start easy first in\n[544.08s] order not to become discouraged.\n[546.92s] After all, what we''re talking about here\n[549.12s] is really a marathon, not a sprint.\n[553.88s] So, let''s take up the problem, the\n[555.64s] stress of waiting in a long line.\n[560.44s] The first step is to recognize the\n[562.68s] problem we''re having.\n[565.04s] Note to ourselves that we feel intense\n[567.64s] frustration and anxiety when we have to\n[570.52s] wait in long lines. I mean, I don''t know\n[572.56s] about you, but that''s the way I often\n[574.68s] feel.\n[576.68s] Step two is to locate that deeper cause.\n[581.44s] That is, in let''s say, my craving to be\n[584.72s] somewhere else, anywhere else, frankly.\n[587.8s] And my attachment to the idea that\n[590.68s] whatever this process is that I''m going\n[592.68s] through, getting through a line at an\n[594.24s] airport or buying tickets to a concert\n[596.96s] or whatever it might be, my attachment\n[599.24s] to the idea that that process should be\n[602.48s] fast and easy, and it''s not.\n[606.04s] The third step is to try to envision\n[609.2s] what the solved state might look like.\n[612.28s] That is, to envision what it might be to\n[615.6s] stand in the line calmly,\n[618.6s] to pass the time without engaging in\n[622.08s] this kind of inner turmoil.\n[624.56s] Maybe there''s somebody else we can see\n[626.4s] in the line that we can envision or at\n[628.84s] least\n[629.84s] uh imagine that perhaps they''re having\n[632.8s] an easier time of it.\n[635.4s] And indeed, if I was able to accomplish\n[638.0s] this aim, I would lose absolutely\n[640.68s] nothing, and I''d gain contentment for at\n[644.36s] least a while.\n[646.839s] So, the fourth step is to\n[648.96s] formulate a plan.\n[651.32s] Perhaps I could use the time\n[653.04s] differently.\n[654.64s] Maybe if I have my earbuds with me, I\n[657.6s] can put on my earbuds and listen to a\n[659.16s] podcast.\n[660.839s] Maybe I could use the time to do a\n[663.08s] little bit of breathing meditation or\n[665.04s] standing meditation.\n[667.36s] Or I could perhaps practice the\n[669.72s] acceptance of that which cannot be\n[671.68s] avoided.\n[674.32s] Each of these illustrates elements of\n[677.0s] the Buddhist eightfold path, using such\n[680.32s] examples as right effort, right\n[682.52s] mindfulness, right view, to help to\n[685.96s] lessen the stress\n[688.04s] of our ordinary, unavoidable situation.\n[693.32s] So, as we can see, the Four Noble Truths\n[695.84s] aren''t so much a set of beliefs that we\n[698.8s] adopt,\n[700.4s] rather they are an active dynamic method\n[703.08s] that we can use anytime and anywhere.\n[707.72s] They''re a kind of universal template for\n[710.0s] solving some of our deepest problems.\n[713.92s] First, we name the problem.\n[716.96s] Second, we find its root cause without\n[719.6s] getting lost in long stories.\n[723.36s] Third, we envision what a solution might\n[725.76s] look like.\n[727.52s] And last, we create an action plan to\n[729.72s] try to undermine that cause.\n[734.36s] This is a practice of bringing wisdom\n[736.24s] and clarity to the parts of our lives\n[738.68s] that feel stuck.\n[740.8s] And it''s otherwise known, at least the\n[742.44s] fourth step, is known as the eightfold\n[744.72s] path of practice.\n[747.2s] If you want a deep dive into this\n[749.8s] eightfold path, I have a full playlist\n[752.8s] on it,\n[754.04s] and I''ll leave that link at the end.\n[756.52s] But here''s a small challenge for you. In\n[758.8s] the comments, pick a small everyday\n[761.4s] frustration that you have, and try to\n[764.0s] run it through these four steps, and I''d\n[766.16s] love to see what you come up with.\n[768.839s] I''ll hope to catch you guys all on\n[770.44s] another video, my next video, and\n[772.36s] meanwhile, all of you be well."}'
