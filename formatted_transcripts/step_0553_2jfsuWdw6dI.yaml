transcript: Hey guys. So today you and I are going to talk about poaching. So let's get into it. So the question in question was, "Hi Frederick, they say that Meta paid $100 million to poach Open AI employees. Can someone explain? Can you explain why spend why they are spending so much to who on people who have produced a halfbaked product while ignoring experienced professional with a proven track record like you for example? Well, thank you. I'm happy to hear that you believe that I'm a proven veteran or a profession experienced professional even though as I've warned actually I made a whole video about it. Be a little bit careful about who you trust and who you call a senior an expert and stuff like that because technically guys you don't really know if I know how to code. Well, I hope that if you are in the industry and so forth and so forth, you know that at least the lingo I'm using is correct. But you know my tip to you as well when we do interviews with people always make sure that you have at least a few concrete questions about actual technical matters because if you have someone who's a little bit charismatic or has a easy time talking, they can fluff it up and they can basically sit here like I do and talk for hours and hours and hours without ever actually saying anything related to technology and proving that they actually know what they're saying or know anything about the topic which you will see a lot of if you go to tech talks and you listen to influencers and so forth and so forth. I see all the time so-called architects who basically don't actually know they can't teach you anything really about how to do better work or produce better software but they can do a presentation a very good one. And so back on topic, if we assume that this rumor that you have heard is true, then to me it isn't really all that weird because the thing is that although you may feel that Open AI or so forth has a half big product or so forth and so forth, it is probably most likely at the very least one of if not the most famous AI company right now and Meta is not. and Google is not even though they're I argue that like I mean they're trying to become like they announced that years ago like it's like I don't you know know how many years it's over 10 years ago they announced that Alphabet or whatever they're called is supposed to be an AI company and so forth and so forth and so you can imagine that that kind of doesn't click all that well with the market or with their goals if another company like Open AI becomes a bigger household name when it comes to you know AI and so forth. Well, nowadays it's, you know, we're we're tripping in AI agents and AI systems and LLMs and stuff like that. But chat was probably the biggest success at the time when we sort of started this little journey of ours. But as to why they're paying those sorts of sums and not paying it to like people like myself and so forth, they are guys. Like I'm not saying that they're trying to necessarily spend $100 million on me personally or people. So that are like extremely experienced. But it the thing is right now the money is at is in AI. That's where the money is. So if you don't really have a good foundation with AI programming or expert competencies within your company and so forth, then you can't really seem to produce the sort of systems or solutions that you need in order to be competitive in the marketplace. Then it's basic investment. you try to find people who are able to do so but on the other hand like when it comes to general software development why would you pay those sort of sums I know that that sounds counterintuitive because that is of course what we are doing and I am the first person who's going to tell you that it's ridiculous if you ask me the fact that you basically be are treated in an IT role as a software developer everybody's equal I've said so on many occasions where for me like when you talk about seniors you can have a senior who can 