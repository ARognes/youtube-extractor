ch because you're getting three times the value out of them versus somebody else. Nobody seems to really agree, at least not the managers. They're they understand the argument. they're just not willing to sort of let go of the money and like sort of spend it on people like that. But for Meta, who is right now not really a household name when it comes to AI and so forth, they really need people to come in and step up their their AI game if they want to be competitive. And of course, $100 million for a company that size, it's nothing. It's it's an enormous amount of money for like an individual like myself or you or so forth and so forth, but for them it's nothing. I would argue it's like I mean getting a chance at stepping up your AI game and like so forth and so it's a matter of survival at this point. I would argue for Meta. So for them I I wouldn't be I mean I wouldn't be surprised if they spend even more money in the future and this like in like this is a rumor that you heard but I'm pretty sure that they are investing quite heavily. Like I know that my own companies and so they're doing the same thing. Not to the same extent of course but right now every organization is all about AI at least what I've seen and so forth when it comes to trying to figure out how can we make sure that other companies don't find a way to basically take over the market and AI is right now everybody's big like trend thing and so forth before it was blockchain what's happened with that and so forth and so AI I think is a little bit different but the same thing always applies big new technology comes in someone makes it a big success is and then everybody else tries to just catch up or like copy or so forth and so forth. And Meta is doing the exact same thing I would argue. So what I want you to take away from this is that because I am sadly not a expert in something that is really really really really tricky like creating LLMs or so forth and so forth. I will probably never be paid the same sort of money as well unless I go on the tech talks maybe like you can do the thing that you know a lot of the presenters and architects do like they're branding themselves in a public form and then they can get some higher fees and so forth and so forth but when it comes to AI like if this is true that they are paying this sort of like they're spending this sort of money to publish people it has to do with market scare basically they are trying to catch up to some of the more prominent companies. And as far as I know, OpenAI isn't in the big club where I've heard that fan companies like Microsoft and Google and Facebook have quote unquote signed an agreement that they're not going to poach from each other. But OpenAI is free game. You know, it's you know what, as far as I I've heard, that's another rumor, so don't quote me on that one. But the basic rule is the same. If you have a serious problem and you don't see the sort of results that you're looking for, what most big companies will do is just to throw money at the problem. And I really wish they threw it at me because that would be great. But right now, it's all about AI. So that's where the money is going. Have a great day.
