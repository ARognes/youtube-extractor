transcript: '{"content":"\n[4.947s] Насилствена обич.\nTheraminTrees\n[9.304s] За Логан\n[12.218s] чувствo-престъпление, чувство на емоция, която не се харесва на диктатора\n[16.407s] или неизразяване на емоцията, която диктатора иска.\n[20.829s] Акт 1: разрушителен творец. Акт 2: емоционална картина. Акт 3: насилствена обич за тиранин. Акт 4: напускане на спектакъла.\n[27.965s] Акт 1: Разрушителен творец.\n[31.68s] Напускането на лични или идеологически насилствени среди\n[35.66s] не винаги е праволинеен процес, при който осъзнаваме ситуацията интелектуално и създаваме логичен план за излизане.\n[43.18s] Понякога само рационалната ракета не е достатъчна.\n[47.46s] Нашите емоции играят огромна роля в способността ни да се движим в ежедневието,\n[52.1s] и изкривените емоционални реакции, натъпкани в нас с безмилостни \"репетиции\" в зловредна среда,\n[58.62s] могат да нарушат функционирането ни на най-финните нива.\n[62.485s] Когато тази важна част от нашите навигационни системи е нарушена,\n[66.26s] тогава простите и ежедневни взаимодействия могат да се превърнат в минно поле\n[70.36s] от саморазрушителни мисли и противоречиво поведение.\n[73.613s] Това не само допринася за по-нататъшното ни залепване в нашата ситуация,\n[77.626s] но може също да действа и като магнит към други зловредни хора и групи.\n[81.96s] По този начин, дори ако достигнем скоростта на откъсване от една зловредна среда,\n[86.54s] тогава можем да открием, че сме постоянно привлечени от орбитите на другите.\n[91.74s] Хората, които са били изложени на различни видове зловредни среди\n[95.92s] често показват силно приличащи си, теми в описанията на техния опит.\n[101.275s] Преди Много години, когато започнах да разговарям по-задълбочено с хора, които попаднаха в религиозни и псевдо-научни авторитарни групи,\n[109.48s] слушането на техните преразкази от техния опит беше като че все едно, те разказват моята собствена история.\n[117.006s] Техните наблюдения за живота в авторитарна група\n[120.22s] бяха подобни на моите наблюдения, за живота ми в нарцистично семейство.\n[125.74s] Това е едно и също разединение, когато лоялността към диктатурата застава като преграда за всяка лична връзка между другите членове;\n[133.631s] това са същите тактики за социална изолация, опити за саботиране на връзките на трети страни с приятели или близки;\n[140.84s] това са едни и същи опити за запазване на детската зависимост.\n[145.1s] Паралелите непрекъснато се забелязват между свещените истории за отмъстителни богове-диктатори и насилствените взаимоотношения,\n[152.62s] имайки същите заплахи от нечовечна бруталност,\n[156.28s] същата капризност, генерираща непредсказуеми, противоречиви изисквания.\n[161.2s] Същото усещане за всепроникваща инвазия във всеки аспект от живота на жертвата, без никакви граници и неприкосновеност на личния живот.\n[170.369s] Детайлите на насилието могат да варират от ситуация до ситуация, с различни нива на интензивност и садизъм.\n[177.2s] Но основните фундаментални механизми са еднакви.\n[181.12s] В основата си всяка насилствена среда има за цел да получи принудителен контрол над другите.\n[187.7s] Така че не е изненадващо, че насилващите индивиди и групи от всякакъв вид —\n[192.86s] религиозни, политически, академични, семейни, романтични —\n[198.98s] ползват едни и същи манипулативни тактики, за да накарат хората да жертват своята автономност и автентичност и да се подчиняват на фиксирани роли.\n[208.192s] Не се задоволяват само с единия контрол над действията на жертвите си, много насилници също се стремят да диктуват на жертвите си какво трябва да чувстват за поробването си.\n[217.74s] След като голяма част от тяхното съществуване е режисирано от други,\n[221.36s] жертвите на злоупотребата многократно съобщават, че се чувстват като актьори на сцена,\n[226.211s] принудени не само да изпълняват задачи,\n[229.04s] но и да изиграват персонажи, създадени за тях от техните насилници,\n[233.14s] които поемат двойната роля на актьор-режисьор в собствената си продукция.\n[238.6s] И не говорим за Орсън Уелс (Добър Актьор).\n[241.48s] Тук няма дълбочина, няма емоционална откровеност, няма последователна мотивация.\n[247.0s] Не е изненадващо, когато осъзнаем, че психологическата възраст на този актьор-режисьор често е останала в едноцифрени числа.\n[255.36s] Разбира се, в случай на нарцистично насилие, ние сме свидетели на сериозно забавяне в развитието.\n[262.48s] Следващия път, когато видите дете да играе с играчки, като ги кара да казват и да правят неща помежду си,\n[268.62s] погледнете добре:\n[270.2s] виждате пример за живот с нарцисист.\n[273.66s] Виждате актьор-режисьор, който измисля герои и мотивация и контролира взаимоотношенията.\n[281.44s] И ако анализирате сюжетните линии, ще откриете висока степен на прожектиране.\n[287.54s] Децата могат да накажат играчките си за неподчинение, когато самите те са непокорни.\n[293.16s] По подобен начин възрастните нарцисисти непрекъснато проектират собствените си недостатъци и злоупотреби върху невинните си играчки: в този случай други хора.\n[303.28s] Подобно на играчките, жертвите са призовани да играят безсмислени откъсъчни сцени, без връзка с вътрешния си свят.\n[311.505s] Те съществуват като театрални подпори около централната фигура на насилника, която често се представя като недооценен мъченик.\n[320.32s] Както и при играчките, единствената им функция е непрекъснато да подсилват всяко изображение, което по всяко време реши да приеме техния насилник.\n[329.76s] Тук може да има последователност от различни образи и всеки да обслужва непрекъснато променящите се нужди на насилника.\n[336.374s] Всеки път историята може да бъде пренаписвана.\n[339.88s] Лидерите на религиозни авторитарни групи правят актуализации на старата си литература,\n[345.12s] изрязване на неуспешни учения и пророчества,\n[347.98s] изтриване на доказателства за неуспехите на миналото, за да поддържат маската на тайнствено съвършенство.\n[354.42s] От жертвите се очаква да се отнасят към новия сценарий, сякаш винаги е съществувал.\n[359.28s] Мимолетни изрази на объркване могат да бъдат разрешени,\n[362.5s] ако те бързо бъдат последвани от демонстрации на радостно приемане, когато се предоставят фалшиви оправдания.\n[369.86s] Но продължителни изрази на искрено, нерешено колебание, не се допускат.\n[376.4s] Актьорите, които излизат от ролята, нарушават спокойствието на групата и заплашват да разрушат театралната продукция.\n[382.92s] За жертвите постоянната принудителна демонстрация на емоции, които не чувстват, или отричането на емоциите, които всъщност чувстват, е акт на дълбоко самоотрицание.\n[393.36s] Отношението към емоциите е само като демонстрации, които трябва да бъдат избрани според това дали те ще задоволят публиката,\n[400.029s] това е абсолютно изкривяване на тяхната функция като инструменти за оцеляване, които ни помагат да обработим нашия опит.\n[406.83s] Психологическото натоварване от контрола на това несъответствие между реалността и представлението\n[412.54s] може да изкриви и понякога напълно да разруши цялата ни емоционална картина.\n[418.74s] Емоционална картина.\n[425.823s] Емоциите могат да се усещат като много непостоянни и завладяващи при много малките деца.\n[431.76s] С помощта на качествен анализ и здравословно подражаване, те могат да започнат да ги разпознават и управляват.\n[439.04s] Децата научават чувствата си, когато техните емоционални прояви са последователно и надеждно идентифицирани,\n[446.3s] и се възпроизвеждат в отговор, в реакциите на хората около тях.\n[450.72s] Децата също се учат от примери, като виждат хора около тях, моделиращи емоционални реакции, подходящи за конкретна ситуация, и преодоляват емоциите по здравословни начини.\n[461.66s] Ние развиваме силови скали, разделящи различни нюанси на емоционална интензивност.\n[467.48s] По този начин, вместо незабавно да се впускаме в парализиращ ужас в отговор на всичко от слаба до крайна заплаха,\n[474.62s] ние реагираме пропорционално на заплахата,\n[477.388s] преминавайки от чувство на несигурност, към бдителност, към страх, към ужас.\n[483.38s] Започваме да оценяваме емоционалните комбинации,\n[486.88s] като чувство на тъга и гняв едновременно или, тъга и радост.\n[492.2s] Когато нашият емоционален речник стане по-подробен и изискан, нашите чувства стават по-тясно съвместими с нашия опит,\n[499.7s] което ни позволява да взаимодействаме по-ефективно с хората и ситуациите, пред които сме изправени,\n[505.24s] също така ни мотивира да избягваме опасност, да се грижим за себе си и да се стремим да изпълним целите си.\n[511.62s] За разлика от това, децата, родени в насилствена среда, изпитват всякакви възможности за емоционално пренебрежение и хаос.\n[519.4s] Техните емоционални прояви могат редовно да бъдат пренебрегвани, неправилно интерпретирани или наказвани.\n[525.5s] Вместо емоциите им да получат разбиране и съпричастност, от малките деца може да се очаква разбиране и съпричастност към чувствата на своите насилници,\n[534.02s] които проявяват емоционални реакции несвързани със ситуацията.\n[538.84s] Тези деца се оказват смазани под емоционална тежест, с която дори не са готови да се справят.\n[545.296s] Вместо първоначалните условия на емоциона��на неутралност, детето може да развие първоначалните условия на активна тревожност.\n[552.285s] Само няколко доминиращи емоции могат да бъдат разпознаваеми, докато останалите са потиснати или изкривени.\n[558.442s] Ако желанието за лично щастие се осъжда като егоистично,\n[562.24s] то може да се съчетае с чувство за вина.\n[564.84s] Ако гневът е забранен, детето може да замени гнева с плач.\n[570.2s] Такива деформации могат да създадат крайна емоционална дисфункция\n[575.48s] и да претоварят детето с неконтролируеми чувства.\n[579.58s] От друга страна, детето може да изпита изчезване на реакциите,\n[584.14s] където емоциите се изключват напълно.\n[586.96s] Системата се счупва.\n[588.76s] Искрата угасва.\n[590.86s] Индивидът се превръща в студен, аналитичен наблюдател, безчувствен и безразличен.\n[597.66s] Цялата тази суматоха и унищожение са невидими за насилниците,\n[602.7s] които гледат на жертвите като на играчки и очакват моментални, напълно оформени емоционални реакции,\n[608.7s] съобразени със нуждите на насилника.\n[612.66s] Една от ирониите на принуждаването на целите да демонстрират фалшиви емоции\n[616.88s] е, че техните насилници често осъзнават, че тези демонстрации не са реални.\n[622.14s] На насилниците може да липсва съпричастност,\n[624.568s] но това не означава, че не могат да преценят точно емоцията.\n[628.44s] Тяхната липса на съпричастност просто отразява факта, че емоциите на техните жертви имат стойност само\n[633.02s] когато служат на нуждите на насилника.\n[635.32s] могат да бъдат изключително възприемчиви относно автентичността на емоциите,\n[640.6s] улавяйки и най-малките противоречиви сигнали.\n[643.78s] А жертвите често се тестват многократно, за да се оцени тяхната автентичност.\n[648.68s] Разбира се, насилниците няма да търпят да бъдат тествани те самите.\n[653.22s] Ако осъзнаят, че жертвите им изпълняват лъжливи емоции,\n[657.6s] емоционалното възнаграждение, което насилниците търсят, се губи.\n[661.46s] Те и вълкът да е сит и агнето да е цяло.\n[664.58s] Те искат някой да почувства определени емоции, които те избират,\n[668.74s] но също така искат тези емоции да са спонтанни и истински.\n[672.96s] Не могат да имат и двете.\n[674.901s] Опитвайки се да имат и двете, те се превръщат в източник на собственото си разочарование.\n[679.88s] Друга ирония е, че разбира се, насилниците също играят роли.\n[684.381s] Перфектният образ, който те се надяват да представят на света, е просто картонената фигура на пълноценен възрастен,\n[690.846s] зад която често се крие дете, непрекъснато обзето от ярост, страх и срам.\n[698.4s] Те изискват истински емоции от другите, за да подсилят фалшивата си идентичност.\n[704.82s] Това, което се получава, е процес на само възпроизвеждане.\n[708.334s] Насилници които са разделени на емоционално нестабилна скрита личност и на човек, изпълняващ фалшива роля,\n[714.354s] действат по такъв начин, че да разделят хората около тях\n[717.48s] на емоционално нестабилни скрити личности и личности, които играят фалшиви роли.\n[723.5s] Степента, до която жертвите губят себе си в театралната постановка на техния насилник, зависи от различни фактори,\n[730.48s] като: интензивност на злоупотреба,\n[732.94s] наличие или липса на подкрепа,\n[735.28s] устойчивостта и адаптивността на защитните психологически механизми на жертвата;\n[740.22s] и способността на жертвите напълно да разпознават наличието на тирания в тяхната среда.\n[746.134s] Насилствена обич за тиранин\n[753.7s] Когато бях дете, всяка година бях помолен да подпиша празнични картички за мистериозна възрастна леля, която живееше далеч.\n[761.661s] Никога не съм я срещал, никога не съм говорил с нея, никога не съм виждал никакви снимки,\n[766.24s] никога не съм получавал картички в замяна.\n[768.98s] Нищо.\n[769.94s] Просто ми бяха разказани няколко истории, от роднина.\n[773.22s] Доколкото ми беше известно, тя беше просто измислица.\n[776.357s] Но все ме питаха: \"Обичаш ли леля си Джулия?\"\n[780.36s] Ако не следвах сценария и не отговорих \"Да\", тогава се озадачаваха.\n[785.18s] Това беше странно и зловещо преструване.\n[788.539s] Как бих могъл да обичам някого, когото не мога да различа от измислицата?\n[792.18s] Подобно на милиони хора, бях принуден да изпълнявам същото странно и необичайно преструване в безсмислена и незаслужена любов за друга фигура, която никога не съм срещал:\n[801.716s] същество, наречено \"Бог\"\n[803.56s] което е обявено за недостъпно по природа.\n[807.629s] Както и с липсващата леля,\n[809.8s] разказваха ми истории за този отсъстващ \"Бог\"\n[812.74s] но тези истории бяха различни:\n[814.8s] в началото всичко беше сладко,\n[816.9s] но скоро се превърна в истории за садистични изпитания на любовта, геноцид и вечни мъчения.\n[823.68s] Отхвърлянето на такъв кошмар е здравословна реакция,\n[827.58s] но последователите се очаква по някакъв начин да преодолеят всякакви естествени чувства на отвращение,\n[833.481s] да ги заровят дълбоко, да забравят за тях, дори да изпитват срам, че ги имат.\n[839.62s] И вместо това магически предизвикайте чувства на любов.\n[843.76s] Като дете ми беше заповядано да обичам библейския тиранин с цялото си сърце, с цялата си душа,\n[849.9s] с цялата си сила и с целия си ум.\n[853.46s] За разлика от липсващата леля,\n[855.22s] твърдеше се, че този липсващ \"Бог\" може да прочете мислите ми\n[858.76s] и да прецени дали любовта ми е реална.\n[861.7s] Нямах представа как трябва да извърша това чудо на емоционална поправка,\n[866.84s] превръщайки ужаса в любов.\n[869.58s] Мисълта за любов към тази маниакална фигура предизвика неприятно, кошмарно чувство,\n[874.74s] което нямах речника, да опиша.\n[877.98s] По-късно намерих дума за това: мазохизъм.\n[881.4s] Не в тесния смисъл на удоволствието от физическата болка,\n[885.18s] но по-широкият смисъл, описан от немския психолог Карън Хорни:\n[889.48s] \"...да се чувстваш като марионетка в ръцете на господаря, да бъдеш лишен от цялата воля, цялата сила, да бъдеш абсолютно подчинен на господството на другия.\"\n[900.5s] За мен изглеждаше като смърт.\n[903.14s] Католическата монахиня, Майка Тереза, открито популяризира както тесния, така и широкия смисъл на мазохизма.\n[909.8s] Тя многократно възхвалява болката и страданието като божествени дарове.\n[914.76s] Тя видя красотата в страданието на бедните,\n[917.88s] и насърчаваше хората да се възприемат като празни пространства, чакащи да бъдат запълнени.\n[923.365s] Тези варварски и безмилостни идеи изразяват много точно какво означава да се подчиниш напълно на капризен тираничен диктатор,\n[931.58s] идеалният пример за това е християнският Бог (Яхве).\n[935.68s] Това означава да приемеш страданието толкова доброволно, колкото удоволствието.\n[939.736s] Това означава да приемеш психологически хаос.\n[943.12s] Като божествени герои от всички авраамически религии, Яхве олицетворява Хаоса.\n[948.54s] Тя изисква всеобщ мир и любов\n в единия момент\n[951.94s] а на следващия\n —междуплеменни войни и клане на бебета.\n[956.0s] Жертвите на масовия геноцид на бебетата са Мадианците и Вавилонците,\n[960.3s] и хората от Явис-Галаад, които били наказани при отказ да отидат на война.\n[965.54s] Той заповядва на хората да не го изпитват,\n[968.12s] но дава милостта и силата на Гидеон\n[971.16s] който моли Яхве да изпълни няколко специални трика, за да докаже силата си.\n[976.0s] Яхве се съгласява.\n[978.18s] Той изисква лоялност, но се подиграва с най-верните си последователи, като Авраам и Йов.\n[984.62s] Той измъчва толкова често, колкото награждава.\n[988.38s] Хората трудно се справят с Хаоса.\n[992.46s] Търсим ред и структура, устойчиви модели и правила.\n[997.4s] Тези неща ни позволяват да разберем как да оцелеем в дадена среда.\n[1002.14s] Като деца, ние бързо научаваме правилата на културата, в която случайно се раждаме,\n[1006.86s] колкото и абсурдни да са тези правила.\n[1009.74s] Но тираните, които постоянно променят правилата, създават хаос.\n[1014.191s] Когато едно и също поведение е непоследователно възнаграждавано и наказвано,\n[1018.54s] няма начин да се защитаваме последователно.\n[1021.471s] Каквото и да правим, може да се обърне срещу нас.\n[1024.18s] В тази хаотична среда, движена от постоянно нарастващ страх и безпокойство,\n[1029.54s] някои индивиди попадат в невротично мислене и поведение.\n[1034.48s] Мазохистите се справят с този хаос, като се поддават на него;\n[1037.839s] инстинктите им за самозащита са притъпени.\n[1040.96s] Те се отказват от контрол и самостоятелност.\n[1043.56s] И се поддават на лудостта на тиранина.\n[1046.338s] Разбира се, тъй като никой от авраамичните божествени герои не се проявява по никакъв начин,\n[1051.36s] цялата тиранична религиозна лудост, която преживяваме на тази планета, е създадена само от хората,\n[1058.02s] които са в съответствие с всички хаотични поведения, разрешени в религиозни писания.\n[1063.0s] Първият път, когато се озовах в присъствието на подобни мазохисти, беше в моята младост,\n[1067.94s] когато брат ми ни аз имахме поредица от седмични дискусии са някои Свидетели на Йехова.\n[1072.96s] Никога не съм срещал хора, които показват толкова силно скицирано поведение.\n[1077.98s] Вместо дълбоко безпристрастно мислене, те дадоха фиксирани машинни изявления.\n[1084.5s] Когато нещо не се вписва в сценария, те често попадат в продължително мълчание,\n[1088.979s] след което най-накрая се \"рестартират\"\n[1091.193s] и обещават да получат отговор от духовните си лидери, наречени \"старейшини\".\n[1096.06s] Следващата седмица те се върнаха с \"актуализация\", за да ни разкажат нови репетирани реплики.\n[1101.76s] Отначало това странно поведение беше забавно, но ставаше все по-тревожно.\n[1108.22s] Те бяха като черупки, със личността им извадена,\n[1112.4s] и заменена със крехък документ.\n[1115.66s] По-късно забелязах, че е като да гледаш теста на Тюринг обратно.\n[1120.14s] Тестът на Тюринг, предложен от учен Алън Тюринг, оценява дали машината може да покаже интелигентност, неразличима от човешката интелигентност,\n[1129.569s] обикновено чрез даване на отговори, които показват спонтанност,\n[1133.046s] креативност, гъвкавост, адаптивност, оригиналност.\n[1139.1s] Автоматичните отговори на —свидетелите на Йехова— сочат в обратната посока\n[1143.78s] те стават все по-неразличими от машините.\n[1146.96s] Това беше изключително тревожно.\n[1149.523s] Съпричастността към идеологическите мазохисти се затруднява от факта,\n[1153.62s] че те са склонни да влачат другите след себе си.\n[1156.72s] Когато засегнах темата за варварството на библейския Бог,\n[1159.84s] една от тях, млада жена на име Пени,\n[1162.36s] коментира категорично, че всички ние сме недостойни грешници, които заслужават да умрат.\n[1167.56s] Спомням си чувството на едновременно съжаление за нея, защото има толкова слабо чувство за самооценка, и чувство на възмущение, защото тя ме включи в изявлението си.\n[1176.72s] Макар че не беше в толкова екстремен мащаб, колкото свидетелите, но гледайки назад в миналото, виждам този обобщаващ мазохизъм в баща ми,\n[1183.68s] който не само се подчини на хаотичния сценарий на нарцистичната ми майка, но и се опита да накара брат ми и мен да се подчиним.\n[1191.6s] По подобен начин мазохистични и зловредни социални и политически групи,\n[1195.76s] които се унижават, за да поддържат членството си,\n[1198.84s] могат да въвлекат своите членове или дори нечленове в това съвместно унижение.\n[1205.456s] Това непривлекателно качество може да отблъсне потенциалните източници на подкрепа, като изостри изолацията на мазохистите.\n[1213.86s] Реакцията на мазохиста, състояща се в себеотрицателно подчинение, е само една възможност да се справи с Хаоса.\n[1220.2s] Има ни други.\n[1221.7s] И тези варианти, които изпробваме върху себе си, участват значително в определянето на вида роли, които играем в пиесата на тиранина.\n[1229.92s] Праведните фанатици се защитават от тиранина, като се присъединяват към него.\n[1236.05s] Като затворници, представящи се за надзиратели, те се популяризират като лични говорители на тиранин,\n[1243.06s] и продължават да обезчовечават и да се гаврят с други хора,\n[1246.234s] размахвайки псевдо-човешки правомощия.\n[1248.8s] Докато мазохистът казва \"всички сме нищожни\", праведният фанатик обявява \"всички сте нищожни\".\n[1256.1s] В контекста на насилствените семейства,\n[1258.72s] такава позиция може да се прояви в дете, което се съюзява с насилника Родител,\n[1263.4s] и приема ролята на насилствен псевдородител по отношение на останалата част от потомството.\n[1269.12s] Апологетите(защитниците) носят розови очила.\n[1272.5s] Те се успокояват с идеята, че трябва да има разумни обяснения за разрушителните действия на тиранина.\n[1279.14s] Те предефинират тираничния тормоз по различни начини.\n[1283.085s] В религиозен контекст те често предполагат, че действията на божественото варварство\n[1287.8s] всъщност представляват божествена милост, толкова сложна, че не можем да я разберем.\n[1294.58s] В авторитарните групи, вредите от тиранични лидери\n[1297.98s] е по сходен начин нещо, което се приписва с ниво на просветление, неразбираемо за обикновените членове.\n[1304.22s] Ако обясненията за най-дълбоката добродетел и мъдрост не работят, се предлагат други оправдания.\n[1310.58s] В семействата, тираничното насилие може да бъде погрешно дефинирано като физическо заболяване, като деменция,\n[1317.98s] освобождавайки насилника от отговорност.\n[1321.48s] Във всички случаи апологетите, които могат да разпознаят злоупотреби във всеки друг контекст,\n[1328.0s] се хващат като удавник за сламка, за да не позволят да си признаят нанесена вреда от страна на тиранина.\n[1333.88s] Понякога отричането е по-дълбоко.\n[1336.98s] Вместо да предлагат извинения за това, нанесената вреда от тирани се отрича напълно.\n[1342.62s] До ден днешен продължавам да получавам лични съобщения от последователи на авраамските религии,\n[1348.48s] които напълно отричат всякакви осъдителни качества в своите богове и писания.\n[1354.057s] Такова необуздано отричане понякога може да бъде резултат от работата на недобросъвестен защитен механизъм, наречен \"разделяне\".\n[1361.42s] Разцепването разделя неуправляемата сложност, противоречия или хаос в опростени дихотомии(разделяне на две):\n[1369.06s] положително или отрицателно; правилно или грешно; вина��и или никога; ние или те.\n[1376.52s] Изправени пред хаотичен тиранин, отрицателните елементи могат да бъдат напълно блокирани и остават само положителните.\n[1384.16s] Разбира се, отричането може да възникне и от обикновена неинформираност и неопитност.\n[1389.46s] Някои хора никога не са изследвали Авраамските писания.\n[1392.82s] Някои активно оградени от тяхното съдържание.\n[1396.78s] Това, което е ясно за всички тези позиции, е, че никоя от тях няма нищо общо с любовта.\n[1402.12s] Какъв вид любов тласка хората към нефункциониращи защитни стратегии\n[1406.62s] насочени към игнориране на огромна заплаха?\n[1409.92s] Каква любов ще разчита на постоянно игнориране на злодеянията?\n[1414.26s] Тези позиции са театрални роли,\n[1417.26s] всички те изпълняват функцията на утвърждаване, оправдаване и подкрепа на тиранина.\n[1423.32s] Когато нашите емоции са в здравословно работно състояние, отричането на тези фалшиви роли е много ясен въпрос.\n[1429.58s] Бихме изпитали отвращение към библейските образи на тези божествени тирани.\n[1436.681s] Също така не бихме се чувствали уплашени от тях.\n[1439.42s] Бихме разбрали, че те не са по-голяма заплаха за нас, отколкото всеки друг литературен тиранин,\n[1444.742s] от Сестра Рачет до Джейми Гъмб.\n[1448.56s] Нямаме причина да се страхуваме от лоботомия по заповед на сестра Рачет,\n[1453.4s] или че Гъмб ще ни отвлече и одере живи.\n[1456.64s] Или, че ще бъдем подложени на безкрайни мъчения от всеки авраамически Бог.\n[1461.94s] Литературните герои не представляват заплаха,\n[1465.3s] и ако емоциите ни бяха в съответствие с нашия опит,\n[1468.5s] тогава историята щеше да свърши.\n[1470.891s] Религиозните писания биха представлявали същата стойност за нас като всяка друга литературна творба:\n[1476.1s] ще размишляваме върху избора на героите, описани в историите,\n[1480.22s] ще вземем някакви полезни идеи\n[1482.7s] и ще преминем към следващата книга.\n[1485.88s] Както при всяка друга древна литература\n[1488.58s] бихме разбрали, че всяко споменаване на чудотворни трансформации и герои със суперсили\n[1494.56s] отразява примитивното магическо мислене на времето.\n[1498.34s] Но като последователи на Авраамските религии,\n[1501.3s] този ключов контекст е изтръгнат от нас от нашите индоктринатори,\n[1505.92s] които изтласкват нашите емоции абсолютно извън нашия опит,\n[1510.24s] като насилствено ни принуждават да приемем тяхната древна литература за факт.\n[1516.06s] Можем да представим злонамерените ефекти от даването на най-трагичната поетична литература на децата като \"факт\".\n[1524.32s] Нарушаването на важното разграничение между фантазия и реалност\n[1528.58s] превръща митичните чудовища в ужасяваща заплаха,\n[1532.02s] която децата все още не са психически подготвени да посрещнат.\n[1536.12s] Но от милиони деца се очаква те да я посрещнат с усмивки, залепени на лицата им.\n[1543.7s] Като дете, след като срещнах тираничния характер на Яхве,\n[1547.3s] избягах от позицията на мазохист,\n[1550.7s] като се потопих в състояние на отричане.\n[1553.44s] В моя случай се научих да се фокусирам единствено върху човешката личност на Яхве, върху Исус,\n[1559.0s] който се представяше като недооценен мъченик.\n[1562.92s] Фокусирането върху Исус ми позволи да се абстрахирам от зверствата на Яхве.\n[1568.12s] Като тийнейджър, когато си позволих да погледна отблизо този персонаж Яхве,\n[1573.46s] стана ясно, че тук няма по-висока интелигентност.\n[1577.56s] Дори и по човешки стандарти, това беше, във всеки смисъл\n[1581.76s] — морално, интелектуално, емоционално —\n[1585.28s] недоразвита интелигентност.\n[1588.2s] Всъщност, на ум идва героят Чарли Х от стария сериал Стар Трек.\n[1594.68s] Чарли X беше извънземен тийнейджър, който тиранизира екипажа на кораба \"Ентърпрайз\".\n[1599.88s] използвайки психокинетичните си сили, за да обезобразява хората,\n[1603.489s] или просто с една мисъл да ги изтрие от реалността.\n[1606.86s] Една от жертвите му е била жена от екипажа на кораба, в която се е влюбил,\n[1611.02s] но той не я е привличал.\n[1613.58s] Подобно на библейския Бог, Чарли Х беше уязвим, нуждаещ се персонаж,\n[1617.84s] който заповядва любов,\n[1619.72s] очаквайки любовта магически да се появи в мишените му,\n[1623.94s] и заплаши унищожение, ако не я получи.\n[1627.88s] За разлика от Чарли X, библейският Бог се заявява като всезнаещ създател\n[1633.92s] всезнаещ създател, който не знае как работят човешките емоции като любов и доверие.\n[1639.9s] Който мисли, че могат да бъдат включени като крушка.\n[1642.9s] Това беше твърде глупаво, за да го опиша с думи.\n[1645.78s] Любовта е заслужена, не е заповядана\n[1649.08s] и за да я заслужите, трябва да се покажете в някакъв момент.\n[1654.08s] Дори когато става въпрос за липсващи хора, като неуловимата леля Джулия,\n[1658.875s] принуждаването на децата да демонстрират любов, която не чувстват,\n[1662.34s] ги учи, че любовта им не принадлежи на тях и те не могат да я дадат на онези, които ще изберат,\n[1666.667s] а че това е просто стока, която другите могат да раздават от името на децата без тяхното съгласие.\n[1673.92s] Никой не може да ни каже кого да обичаме или на кого да се доверяваме или да смятаме за физически привлекателни,\n[1681.3s] или да изпитваме някакво друго чувство.\n[1684.28s] Всеки от нас е господар на собствените си емоции.\n[1687.819s] Напускане на спектакъла\n[1693.9s] През първите няколко години като психотерапевт,\n[1696.96s] видях клиентка, която разказваше най-ужасните си преживявания с невероятно изкривен глас.\n[1704.78s] Майка й наскоро почина и тя дойде на терапия, за да реши проблемите в скръбта си.\n[1710.739s] Тя стана убедена, че призракът на майка й я преследва, защото всеки път, когато мисли за нея,\n[1715.98s] чувства нещо ужасяващо, надвиснало над нея.\n[1719.9s] С течение на времето, докато изследвахме какъв може да е този невидим ужас,\n[1724.18s] стана ясно, че тя има хронично желание да избегне изразяването на гняв към майка си,\n[1729.48s] което, както постепенно се разбра, я подложило на екстремно физическо и психическо разстройство,\n[1735.48s] което доведе до тежко емоционално несъответствие.\n[1739.06s] В хода на работата по емоционалната й рехабилитация стигнахме до пробив:\n[1744.46s] надвисналият ужас не беше призракът на насилника й,\n[1747.58s] а нейният потиснат гняв, нетърпелив да излезе и да се изрази.\n[1753.52s] Освобождаването на този сдържан гняв за първи път беше страшно, понякога почти непоносимо.\n[1759.86s] Но когато започна да си позволява да го усеща, и двамата забелязахме трансформацията:\n[1766.18s] Лицето й започна да се отпуска от постоянната усмивка с която беше.\n[1771.04s] Неравномерният глас, който използваше, когато си спомняше за насилието, се върна към нормалното.\n[1776.86s] Появиха се няколко други потиснати емоции,\n[1779.32s] включително тъга и радост.\n[1781.82s] И тя най-накрая успя да признае отговорността на майка си с искрени емоции.\n[1788.02s] Понякога просто няколко ключови емоции не достигат и връщането им може да бъде стимул за промяна.\n[1795.68s] Другата ми клиентка, която беше в емоционално насилствен брак,\n[1800.38s] преминавала между тревожност и депресия\n[1803.5s] когато описваше безрадостния си живот от ограничения и изолация.\n[1808.47s] Но всички опити да се обмислят варианти да се премине отвъд сценария, предписан от съпруга й,\n[1813.4s] бързо бяха отменени с оправдания и отклонения.\n[1817.48s] Тази емоционална безизходица продължи много седмици,\n[1821.46s] докато в рамките на една сесия имаше значителна промяна.\n[1825.92s] Тя изрази раздразнение към съпруга си.\n[1829.04s] Той неочаквано взел колата й,\n[1831.48s] и тя трябваше да бърза, за да намери обществен транспорт, който да я отведе до сесията навреме.\n[1836.88s] И двамата разпознахме опита му да саботира нейната терапия,\n[1840.6s] но и казах, че това е първият път, когато я видях да изразява някаква степен на гняв към него.\n[1846.3s] Това беше ключов емоционален момент.\n[1849.16s] Тя говори за това колко важна е терапията за нея:\n[1852.5s] това беше един час седмично, който принадлежеше изцяло на нея,\n[1855.94s] и това беше нещо, за което тя беше готова да се бори, за да се защити.\n[1859.419s] През следващите седмици тя започна да си връща живота обратно.\n[1864.1s] Понякога, когато емоциите се върнат, не сме готови да ги почувстваме.\n[1868.46s] В юношеството, след години на религиозни и семейни глупости, моят дълго потискан гняв се върна.\n[1875.797s] Подобно на гореспоменатите ми клиенти, той изигра решаваща роля за прекратяване на злоупотребата към мен,\n[1880.98s] като най-накрая започнах да отстоявам своето.\n[1883.121s] Но не бях подготвен за безмилостните яростни мисли и чувства, които продължаваха да бушуват в мен.\n[1890.169s] Нямах опит с този вид гняв и нямах емоционален инструктор, който да обясни здравословните начини за решаване на проблема.\n[1898.36s] Така че разреших проблема с емоциите по начина, по който бях научен:\n[1902.66s] блокирах ги.\n[1904.58s] Веднага щом усетих повишаване на гнева в мен, превръщах тялото си в камък.\n[1909.64s] И в резултат на това непрекъснато потискане,\n[1912.82s] в крайна сметка се превърнах на камък напълно.\n[1916.22s] Всичките ми емоции, от щастие, до тъга, до страх, до гняв, изчезнаха в неразличима сивота.\n[1924.977s] Не чувствах нищо.\n[1926.52s] И така продължаваше няколко години.\n[1929.611s] Иронията (за която се усетих) е, че направих точно това, което направиха моите насилници.\n[1934.4s] Бях си забранил да чувствам.\n[1936.8s] Нищо чудно, че се нараних по време на процеса.\n[1940.56s] Само на 20, след като се преместих от \"лудия дом\", чу��ствата ми се върнаха.\n[1947.16s] Забравяйки как се чувстваха емоциите,\n[1949.74s] не бях готов за интензивността на цветовете, с които ме изпълниха.\n[1953.939s] Преживяването на тези цветове ми даде представа за истинската стойност на емоциите.\n[1958.236s] Емоциите ме мобилизираха, мотивираха ме, защитиха ме, свързаха ме със света.\n[1965.06s] Без тази искра бях излезнал извън синхрон с околната среда.\n[1969.88s] Простите решения ставаха парализиращи.\n[1972.82s] Не чувствах желание да правя нищо.\n[1976.62s] Просто се носех по течението, гледайки живота си като дистанциран наблюдател.\n[1982.76s] Най-накрая започнах да чувствам живота си.\n[1985.7s] Когато моите емоции се върнаха, те не пристигнаха напълно оформени и пълни.\n[1990.62s] Това беше като нулиране до фабричните настройки.\n[1993.36s] Само основните и вторичните цветове.\n[1996.3s] Овладяването им отне време и търпение. Но сега си позволих да чувствам всичко.\n[2003.12s] Зловредната среда разминава емоциите ни от равновесие с нашия опит\n[2007.9s] като ни изтласква от спонтанността и автентичността\n[2010.96s] в изкуствени, театрални роли, написани от нашите насилници.\n[2016.32s] Възстановяването на живота ни означава да започнем този процес в обратна посока,\n[2020.724s] да хвърлим ролите си и отново да стигнем до искреност и автентичност.\n[2027.081s] Това не изисква специални умения за логическо мислене,\n[2030.08s] няма нужда за решаване на интелектуални пъзели,\n[2033.0s] просто трябва да започнем да осъзнаваме какво всъщност чувстваме\n[2036.94s] и да се научим да отделяме това от различните емоционални маски, които сме свикнали да носим.\n[2042.84s] Например в ситуации, в които изпитваме желание да угодим на някого,\n[2046.9s] може да се научим да определяме дали желанието ни е здравословно или нездравословно\n[2050.719s] като определяме емоцията, която го задвижва.\n[2054.04s] Щастливи ли сме да угодим, или се страхуваме да не угодим?\n[2058.36s] Стартирането на тази емоционална реабилитация може да бъде бавно.\n[2062.26s] За хората, които до голяма степен са се разделили с емоциите си,\n[2065.8s] може да е трудно да разпознаят конкретно чувство.\n[2069.82s] Дори определянето между най-основните категории \"добро настроение\" и \"лошо настроение\"\n[2075.195s] може да бъде трудно в началото.\n[2077.26s] Но постепенно нашият емоционален речник се разширява,\n[2081.42s] и нашите емоции стават все по съвместими с нашия опит.\n[2086.001s] Както би трябвало да бъде, ако първоначално бяхме отгледани в психологически здравословна среда.\n[2091.441s] Важно е жертвите на злоупотреба да си позволят да усетят всичките си емоции.\n[2096.699s] Насилническите среди ни учат, че емоциите трябва да бъдат приятни\n[2100.546s] но емоциите не съществуват, за да задоволят хората.\n[2103.32s] Нито на нашите насилници, нито на нас самите.\n[2107.3s] В добро емоционално здраве отхвърляме ролите на мазохиста, който прегръща насилието;\n[2113.42s] фанатик, заговорничещ с насилници;\n[2115.86s] апологет, който оправдава насилието;\n[2118.4s] и отричащия, който блокира насилието.\n[2121.0s] Вместо това се съпротивляваме на злоупотребата.\n[2123.88s] Няма представление, няма изкривяване на реалността, няма разделяне.\n[2129.28s] Това е позиция на последователност и автентичност,\n[2133.0s] а подобно нещо няма място на сцената на насилника.\n[2136.58s] Когато си тръгнем, някои други актьори също могат да напуснат.\n[2140.4s] Удивително е колко често преминаваме през тези ситуации, мислейки, че сме сами,\n[2144.505s] след това научаваме, че другите хора около нас се борят със същото.\n[2148.76s] За съжаление, понякога актьорите ще останат и каквито и чувства да изпитваме относно това,\n[2154.48s] трябва да си позволим да ги почувстваме.\n[2157.12s] В много случаи, след като напуснем, се случва нещо необичайно.\n[2162.22s] Дори когато вече не сме там, празната роля ще се играе за нас в наше отсъствие:\n[2167.7s] ролята на изкупителна жертва, или, в религиозна гледна точка, вероотстъпник.\n[2173.04s] Без актьора, който вдъхва живот на тази кукла, нейните зловещи реплики ще бъдат изречени от вентрилоквистите в лицето на нашите насилници.\n[2181.14s] Диалогът ще бъде заблудата, който винаги е бил,\n[2185.66s] мотивациите ще са също толкова карикатурни и непоследователни, но,\n[2191.02s] ние ще се наслаждаваме на истинския живот някъде другаде.\n[2194.44s] И с нашите емоции в добро състояние,\n[2197.145s] вече няма да губим ценното си време в тези мрачни театрални постановки.\n[2204.226s] Този канал изследва проблемите около злоупотребата, манипулациите и догмата. Много благодаря на всички, които подкрепят тази работа."}'
