transcript: '[Music] for a game is unusual as 4D golf I knew I''d need some really unique music to capture that feeling of exploring another dimension not only that but the sounds could actually help you navigate if the music is dynamic so if it changes based on the direction you''re facing in four dimensions so I don''t have much musical Talent myself I''m working again with Phil makes noise he was able to capture that same otherworldly feeling in the hyperbolica soundtrack and I can''t imagine a better fit [Music] hey this is Phil and I make noise I''m here to talk about the 4D golf soundtrack and just kind of My overall approach I really wanted to keep the vibe loose and organic to match the playfulness of the game so I used a lot of live instrumentation [Music] this can take a little bit longer but it can also lead to great happy accidents that''s really something I try to encourage oftentimes I''ll just have Jam sessions where I''ll rough out ideas and go back to them later and chop them up if needed most of the hyperbolica soundtrack was made this way foreign but honestly I''ve spent years with just an old laptop and a copy of Ableton at the end of the day you just got to use what works [Music] and just remember it''s not a race I was really stoked to be back working with code parade again on this project keep an eye out for my channel where I''ll be going over specific implementational strategies for the sound 4D Dynamic music Here''s how we''ve been going about it to understand rotations better it''s convenient to think about the vector angle representation in three dimensions that means you choose a unit 3D Vector to rotate towards then add a 2d rotation on that axis all rotations can be made in that way in four dimensions it''s very similar it''s just that now you have a unit 4D Vector to rotate towards and now 3D rotations keep that direction fixed that''s great because 3D rotations and unit vectors in 4D are both representable by quaternions which are much easier to work with it''s kind of funny saying that because quaternions are notoriously hard to understand when you first learn to use them myself included but in this case it''s the easier step anyway I mentioned before that you usually don''t want camera tilting in a first person game other than to look up and down so with the right coordinate system that can be forced by keeping the vector in a single plane and having the quaternion handle the rest of how you''re seeing the world [Music] [Applause] [Music] looking up down and left right in your 3D slice shouldn''t change the music anyway so what''s left is a unit 3D Vector to control volume and other sound effects on different layers that make up the music and what do you know it''s already three normalized parameters from -1 to plus one I''m still working out the details of exactly what controls what and this whole system could change but here''s an example of what it can sound like [Music] thank you foreign [Music] you may have noticed that I''ve been making a lot of improvements to the game on the graphics and the engine I''ve also completed more of the courses themes tutorials menus and more so everything''s coming along nicely but never as fast as I would like feature creep is just always the case in Game Dev apparently I''d switch to doing some shorter form devlogs just to talk about specific things I found interesting and even other small projects just to balance my YouTube time better with the actual game development see you all in the next one [Music]'
