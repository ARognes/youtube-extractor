transcript: Stuxnet was thought to be a world first,  the very moment that cyber warfare became real. But this could rewrite that history,  this NSA cyberweapon is just as devastating, predates Stuxnet by 4 years, and is even sneakier. There’s a bit of a story behind this one. In 2017 the NSA suffered a devastating leak.  For the first time ever, a treasure trove of their hacking tools could be downloaded, by  anyone, for free! The tools were developed by the Equation Group, a highly sophisticated, super  secretive hacking group within the NSA. And now, their scripts, exploits and source code had  been leaked by a group calling themselves ‘ShadowBrokers’. And almost 10 years later, to  this day no one knows who’s behind ShadowBrokers, Russian hackers, a disgruntled NSA employee?  Ten years on and it’s still a total mystery. One of the leaked tools that initially didn’t get  much attention was called ‘territorial dispute’. It’s kind of like a little antivirus scanner,  after NSA hackers compromised a machine, this tool would run scans for other advanced malware - made  either by the NSA themselves or other nation state hackers. It would detect known signatures, before  advising the NSA operatives on what to do next. Is the detected malware friendly,  dangerous or unknown? And of all the hundreds of different kinds of  malware on the list, one stands out, ‘fast16’, upon detection, NSA hackers  were told, nothing to see here, carry on. This was the only reference to fast16 in the  entire ShadowBrokers leak, and it was totally forgotten about until 2019 when a researcher  came along and discovered a sample of the actual fast16 malware hidden deep in the archives  of virustotal, interestingly it was uploaded a whole 6 months before the ShadowBrokers leak.  But fast16 wasn’t thought to be anything special, assumed to be just another NSA hacking  tool… of which there are many, and was again forgotten about until just a few months  ago when one of the researcher’s colleagues, now armed with the power of AI, decided to try  reverse engineering the malware using Claude. But unsurprisingly that didn’t work out very well, so  he decided to do the reverse engineering himself. The world famous cyber weapon Stuxnet  worked by targeting the industrial hardware controlling centrifuges which were  enriching Uranium for Iran’s nuclear program, and fun fact you can actually pick up  the exact type of programmable logic controller that Stuxnet targeted on ebay,  if you want a bit of cyber warfare history. The infected PLCs would subtly increase the  speed of centrifuges, not enough for anyone to notice but just enough to slowly stress out  and eventually damage hundreds of centrifuges, setting back Iran’s nuclear program by years.  Stuxnet is thought to be a world first, a landmark event in cyber history, the  first time that cyber warfare had real irl consequences. But researchers think that  title might actually belong to Fast16 instead. They discovered that Fast16 targets a few  different kinds of 3D simulation software, one of which being LS-DYNA. It’s an industry  level tool used to model physics. Here it is simulating a lego Porsche and  Bugatti smashing into each other, and if you compare it to an irl video of the  crash, frame by frame, the accuracy is remarkable. But to do this, this kind of software needs  to be incredibly precise… enter Fast16. After infecting a computer running LS-DYNA,  Fast16 would alter the calculations behind the simulations, just like Stuxnet it would  do it very subtly, not enough to be obvious, but just enough so that any manufacturing done  based on the 3d simulations would be flawed, with potentially catastrophic consequences. But the NSA didn’t create Fast16 to sabotage  toy cars. A certain other demographic is also very interested in simulating physics, nuclear  engineers. LS-DYNA is known to be capable of modelling ballistic missiles and physics  related to nuclear weapons. With evidence suggesting that Iran has may have been using  the software to aid in their nuclear research. The consequences of manufacturing a nuclear weapon with calculations corrupted  by Fast16 is a guessing game, perhaps the ballistic missile would burn up in  the atmosphere, or it just wouldn’t go boom. The malware also had what was described  in code as a ‘wormlet’ feature. It copies itself to other computers on the  network by exploiting windows network share, before scanning for a list of antivirus software,  if none are found, Fast16 would be installed. Based on several clues, like the fact Fast16  won’t run on anything newer than Windows XP, and will only work on single core CPU’s, it’s  thought to have been deployed around 2005. But fast16’s presence in the ShadowBrokers leak  doesn’t totally prove it was the work of the NSA, it could have been developed by someone else. However despite all the clues lining up here,  that it targeted 3d modelling software thought to be used by Iran, and that it was developed  around the time of Stuxnet, there’s no direct evidence that Fast16 was successfully used against  Iran’s nuclear program. However the researchers did point out that North Korea’s nuclear program  experienced several unexplained failures around the time. Notable because Fast16 also targeted  3d modelling software made by a Chinese company. The two researchers who reverse engineered  the malware have a technical write up, which I’ll of course link down below.  They’ve also done a blackhat talk, which isn’t yet public, but when it is  I’ll make sure to link it down below. If you found this video interesting, make  sure to subscribe for more hacking news, and as always I’ll see you in  the next video, have a good one!
