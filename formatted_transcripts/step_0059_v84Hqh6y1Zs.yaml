transcript: I was hiring a system development engineer. The guy interviewed, he answered all of my coding questions, and then he taught me a whole bunch about systems. And I'm like, this guy's great. We hired that guy, and he just zoomed back up. [music] It turns an an okay interview into an exceptional one if you're able to teach them something that they don't know. The thing that turns a good interview performance into an exceptional one is when you're able to teach the person that's interviewing you about a subject that they know deeply.
