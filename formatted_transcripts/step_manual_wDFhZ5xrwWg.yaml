transcript: '{"content":"\n[0.36s] Years ago I made a video called Buddhism\n[3.16s] for beginners. It''s now my most watched\n[5.76s] video. Maybe maybe you''ve seen it.\n[8.56s] Anyway, clearly lots of folks want to\n[10.52s] know how to get started.\n[13.0s] But looking back, there are things that\n[15.04s] I wish I had known when I started.\n[18.6s] Things that would have saved me\n[20.12s] confusion,\n[21.64s] frustration,\n[23.36s] and probably a few hours going in\n[25.36s] circles trying to figure things out for\n[27.12s] myself.\n[29.48s] So, this isn''t another here''s what\n[31.36s] Buddhism is video. It''s it''s a little\n[33.36s] more personal than that.\n[35.6s] If I could sit down with my younger\n[38.0s] self, the person who just picked up his\n[40.96s] first book on Buddhism,\n[43.36s] here are five things that I would say.\n[48.84s] This is a big misconception.\n[51.48s] I was very confused about what\n[53.24s] meditation was all about.\n[55.68s] I thought that maybe it meant achieving\n[58.12s] some blank mental state,\n[61.52s] where there were no thoughts or feelings\n[63.48s] at all.\n[65.16s] And every time I sat down and my mind\n[68.0s] kept chattering away,\n[70.52s] I thought that I was failing. I got\n[72.6s] frustrated with myself.\n[76.0s] What I wish that I''d realized is that\n[77.72s] the Buddha didn''t teach us to stop\n[79.76s] thinking.\n[81.4s] Instead, he taught us to pay attention\n[83.64s] to what''s happening in our minds.\n[87.04s] Mindfulness is about non-judgmental\n[89.6s] awareness, not about blankness.\n[93.2s] Now, partly my problem was because of my\n[96.52s] earliest experiences of meditation came\n[99.44s] through Zen, from a Zen-influenced\n[101.56s] perspective,\n[103.64s] one that emphasized just sitting,\n[107.92s] just counting the breaths.\n[110.32s] Again, just sitting.\n[113.92s] And when I would try to read about what\n[116.56s] I was doing, I was reading koans, those\n[120.24s] paradoxical little Zen stories that were\n[123.16s] indeed lots of fun to read, but they\n[125.48s] tended to lead me into confusion rather\n[127.68s] than understanding.\n[130.84s] It wasn''t until I began really learning\n[133.0s] about mindfulness meditation in\n[135.32s] particular\n[137.0s] that I began to understand the point of\n[138.96s] this all.\n[141.08s] The Sutta on the Foundations of\n[143.0s] Mindfulness\n[144.44s] does not instruct us to empty our minds.\n[148.68s] Instead, it tells us to observe our\n[151.48s] body, observe our feelings, observe our\n[154.68s] mind, observe certain mental patterns.\n[159.44s] It''s essentially an observational\n[161.8s] investigative practice.\n[165.16s] So, if I could tell my past self one\n[167.32s] thing about meditation, it would be your\n[170.56s] busy mind isn''t the problem. It''s your\n[173.56s] relationship to it that is.\n[177.32s] And for more on this, you can see my\n[178.76s] playlist on the Foundations of\n[181.12s] Mindfulness, which I''ll I''ll leave a\n[182.48s] link to down below in the notes.\n[187.0s] When I first got interested in Buddhism,\n[189.4s] I was mostly attracted to the meditation\n[192.24s] and the philosophy.\n[194.36s] The ethical stuff, generosity, the\n[197.16s] precepts, right speech, right action.\n[200.96s] It felt sort of like the the preachy and\n[203.36s] boring stuff, like the vegetables you\n[205.64s] have to eat before you get to dessert.\n[208.52s] Now, I I was wrong about that, and I I\n[210.52s] think a lot of Western Buddhists may\n[212.92s] make the same mistake.\n[215.96s] The Buddha''s Eightfold Path, indeed, it\n[218.08s] starts with right view and right\n[219.8s] intention,\n[221.28s] which are orientations of our mind,\n[224.8s] but the practice begins with the ethical\n[227.56s] part. That is right speech, right\n[230.52s] action, right livelihood.\n[233.6s] The Buddha''s teachings to lay people\n[236.36s] would always begin with generosity.\n[240.4s] Further, his gradual training, about\n[243.04s] which I did a video in the past,\n[245.64s] begins with ethical restraint, and\n[249.8s] meditation arises from that foundation.\n[254.92s] When I began my mindfulness journey, I\n[257.799s] was online a lot, and spending quite a\n[261.44s] bit of time dealing with trolls and\n[265.44s] nattering nabobs of negativism, as as\n[268.24s] some people have called them.\n[270.88s] And that would inevitably get me worked\n[273.16s] up, and I''d be stressed out and anxious,\n[275.84s] sometimes for days.\n[279.2s] Of course, this would show up in my\n[281.88s] meditation.\n[283.52s] And I began I became mindfully aware of\n[287.2s] the importance of right speech\n[290.32s] in that\n[292.56s] time, in those examples.\n[295.92s] I still think that right speech is one\n[298.48s] of the hardest practices, but also one\n[301.84s] of the most rewarding when it''s done\n[304.52s] well.\n[306.48s] So, the reason the ethics is there is\n[309.8s] practical. It''s not moralistic.\n[313.76s] If you''re behaving in ways that you you\n[315.84s] regret,\n[317.36s] that stir up your mind and keep you\n[319.64s] angry and on edge,\n[322.08s] your mind is not going to settle.\n[324.96s] You''re going to sit on that cushion\n[326.6s] carrying that anger, that guilt, that\n[330.0s] resentment, that anxiety.\n[333.52s] Ethical practices reduce the obstacles\n[336.2s] to meditation,\n[337.76s] not so much because you should be good\n[340.64s] in some sense, but because unskillful\n[343.96s] behavior agitates our mind.\n[348.56s] In a sense, the triple orientation of\n[351.72s] ethics, meditation, and wisdom\n[355.04s] is not three independent practices,\n[358.92s] it''s one practice in three different\n[361.52s] aspects.\n[363.6s] And this is particularly so for us lay\n[366.32s] people who spend so much of our lives\n[369.28s] out in the world.\n[372.64s] But can we commit to our ethical\n[374.8s] practice without becoming preachy or\n[377.8s] moralistic about it?\n[379.8s] That''s the important question.\n[382.44s] Because it can easily backfire on us if\n[385.84s] we allow ethics to become egoistic\n[388.8s] posturing.\n[391.4s] So, if I could go back, I''d spend more\n[393.84s] time thinking a little about the ethical\n[396.04s] practices and less time on trying to\n[399.44s] find that perfect meditation technique.\n[405.76s] Originally, I came to Buddhism for the\n[408.52s] philosophy.\n[410.16s] I was drawn to the ideas of non-self,\n[413.2s] dependent origination, of change, of\n[416.48s] emptiness.\n[418.28s] And those ideas are genuinely important\n[421.32s] and fascinating.\n[423.28s] But here''s what I didn''t quite grasp at\n[425.64s] the outset.\n[427.44s] We can have a perfect intellectual\n[430.0s] understanding of Buddhist thought, and\n[433.24s] really not be any wiser for it.\n[436.88s] I began to see this more clearly as I\n[439.32s] interacted with many very astute and\n[442.4s] knowledgeable Buddhists\n[444.48s] who seemed still so wedded to poisons of\n[448.6s] greed, hatred, or delusion.\n[452.6s] And I''d hear of teachers, sometimes\n[454.88s] famous teachers, misbehaving in the most\n[457.68s] outrageous ways.\n[460.08s] These are all folks who knew the\n[461.72s] specifics of the Dharma way more than I\n[464.56s] ever could,\n[466.0s] but here they were acting out.\n[469.48s] So, I realized that knowledge of the\n[471.24s] facts isn''t the isn''t the same as truly\n[474.48s] walking the path.\n[477.84s] The Buddha''s famous parable of the raft\n[479.88s] makes this clear. I''ve done a video\n[481.76s] about that parable. I''ll leave up on I\n[483.72s] should say I''ll leave down in the in the\n[485.04s] description below.\n[487.2s] That is, the teachings are tools for\n[490.0s] crossing over the river of samsara, not\n[493.56s] treasures to be collected and admired.\n[497.36s] Once we get to that farther shore, we we\n[500.04s] can put the raft down.\n[502.88s] And in his famous Sutta to the Kalamas,\n[506.68s] the Buddha tells us not to take things\n[509.56s] merely on tradition or because somebody\n[512.76s] says so.\n[514.88s] Memorizing the {quote} wisdom of the\n[517.88s] ancients for its own sake is foolish.\n[522.44s] Instead, we should put our put their\n[524.6s] ideas, that wisdom, into practice in our\n[528.2s] own lives to see if they work to reduce\n[532.2s] suffering for ourselves and others.\n[535.44s] We''re not supposed to simply take the\n[538.16s] Buddha''s or anybody else''s word for it.\n[542.28s] So, the Dharma, in a sense, is more like\n[544.6s] a bunch of recipes\n[546.68s] than a creed or belief system, per se.\n[551.12s] Reading recipes does not make us all\n[553.76s] chefs.\n[555.12s] We actually need to get in that kitchen\n[557.0s] and start chopping.\n[559.8s] So, I''d tell my younger self not to\n[561.84s] worry too much about crossing all the\n[564.08s] intellectual T''s and dotting all the\n[566.32s] philosophical I''s.\n[568.68s] Understanding often comes simply through\n[571.28s] practice.\n[576.12s] Another misconception I carried is that\n[578.48s] I sometimes thought that the goal of\n[581.0s] Buddhist practice was some kind of\n[583.32s] emotional flatline,\n[585.72s] that equanimity meant feeling nothing.\n[589.32s] That the way to the goal was through a\n[591.4s] completely detached attitude of not\n[594.36s] caring what happened.\n[596.6s] Now, this is a really common misreading\n[598.84s] and it''s one I flirted with from time to\n[601.32s] time, particularly in harder periods of\n[604.16s] my life.\n[605.72s] That is relying on meditation to stop\n[608.88s] caring about anything.\n[611.92s] This way leads very easily, I might even\n[614.72s] say leads directly into what''s known as\n[617.48s] spiritual bypassing. I''ve done a video\n[620.16s] on that topic that I''ll also try to\n[621.88s] leave down in the notes.\n[624.32s] Spiritual bypassing is is a state where\n[627.04s] we ignore very real pains and\n[630.16s] difficulties, just allowing them to\n[632.88s] fester.\n[635.4s] The Buddha''s parable of the two arrows\n[637.76s] is so important because it clearly\n[640.12s] illustrates how that first arrow of\n[643.32s] pain, of loss, of difficulty\n[646.52s] is unavoidable.\n[648.72s] Even the Buddha himself had backaches.\n[651.88s] Even the Buddha himself lost dear\n[654.08s] friends.\n[656.28s] It''s that second arrow of reactive\n[658.92s] craving, aversion, and anxiety that''s\n[662.12s] optional.\n[663.44s] And that''s what our practice addresses.\n[667.8s] So, what surprised me as I began to\n[669.64s] learn and practice more\n[672.16s] is that it it didn''t make me feel any\n[674.32s] less.\n[675.96s] If anything, I''ve become a little more\n[678.16s] emotionally present.\n[680.76s] What''s changed is that there''s, let''s\n[683.2s] say, a little bit of less reactivity in\n[686.12s] it.\n[687.48s] I''m able to hold that difficulty for a\n[690.16s] little bit longer without wanting to\n[692.0s] make it go away.\n[693.8s] Again, there''s a little bit less of that\n[695.76s] second arrow.\n[698.92s] So, I think it''s important to keep\n[700.4s] emphasizing that this is not a path to\n[703.28s] make us emotionally cold.\n[706.72s] Instead, it''s one of making ourselves\n[708.56s] warmer, but with less of that burning\n[711.2s] sensation.\n[715.32s] When I started, I didn''t really\n[716.92s] understand that there were different\n[718.76s] schools of Buddhist thought and practice\n[721.6s] with quite radically different\n[723.48s] understandings of the Dharma.\n[726.48s] Meanwhile, I got a lot of institutional\n[728.72s] pressure to stick with the Mahayana.\n[732.32s] Basically, to choose before I knew that\n[734.52s] there were options.\n[736.8s] My main introductions to Buddhism were\n[738.92s] through Zen practice and some Tibetan\n[741.88s] Dharmic philosophy.\n[744.44s] While I''d heard of the Theravada and\n[747.04s] read a little bit of what you might call\n[749.4s] early Buddhism,\n[751.24s] I didn''t really have much of a sense of\n[753.16s] what those meant or how they were\n[755.28s] different.\n[757.56s] So, if I had the chance to start again,\n[760.24s] I''d tell myself to start with the early\n[762.08s] teachings, not because they''re better\n[764.88s] than the later ones,\n[766.8s] but because they''re the common ground of\n[769.48s] all Buddhism.\n[772.44s] Every Buddhist school traces itself back\n[776.08s] to those early teachings that we can\n[777.96s] find illustrated in the Pali Canon and\n[780.96s] its Chinese parallels.\n[783.72s] That is the the Four Noble Truths, the\n[786.52s] Eightfold Path, the three\n[788.56s] characteristics of impermanence, of\n[791.2s] suffering, and of non-self.\n[794.36s] These are shared foundations.\n[797.48s] If you understand them,\n[799.64s] let''s say, take two examples, if you\n[802.32s] understand right speech and right\n[805.08s] mindfulness practice as illustrated in\n[807.92s] the Eightfold Path and in their related\n[810.44s] suttas,\n[812.12s] you''re going to have a solid foundation\n[814.44s] for exploring any Buddhist tradition.\n[818.96s] You may You may well find that these\n[821.28s] early teachings themselves are\n[823.2s] extraordinarily rich and don''t\n[825.24s] necessarily\n[826.76s] need to be supplemented.\n[829.4s] Or instead, you may find that an\n[831.64s] interpretation from the later traditions\n[834.64s] fits your style better.\n[838.08s] But anyway, don''t worry so much about\n[840.28s] labels.\n[841.52s] Try things out and\n[844.2s] and it''s not really important which\n[846.36s] school''s interpretations might be right\n[849.0s] or wrong.\n[850.6s] Start with the basics. Start practicing.\n[854.12s] And let your path unfold from there.\n[859.28s] So, those are five things that I would\n[861.0s] tell my past self.\n[863.12s] And if I''m completely honest, they''re\n[864.6s] five things that I have often to remind\n[866.959s] my present self.\n[869.44s] A while back, I made a video course on\n[871.36s] the idea of a spiral Eightfold Path.\n[875.32s] One that keeps teaching us the same\n[877.36s] lessons, but at higher and higher or at\n[881.079s] deeper and deeper levels as we spiral\n[884.28s] around its various practices.\n[888.76s] So, it''s not about getting everything\n[890.959s] straight at the start.\n[893.64s] Or, heaven forbid, even before we start.\n[897.88s] It''s about getting in that kitchen and\n[900.52s] making a mess.\n[902.52s] Trust in the process. If you''re keeping\n[904.76s] at it, you''re going to become a chef\n[906.88s] before you know it.\n[908.76s] Or at least, you''re going to become a\n[910.16s] pretty good cook every once in a while.\n[914.72s] If you want some information about how\n[917.0s] to get started with Buddhist practice,\n[919.88s] see my earlier video on the subject.\n[922.0s] It''s going to be up here on the screen\n[923.28s] in a moment.\n[925.56s] Meanwhile, if you''re still strapping on\n[927.4s] your apron,\n[928.88s] I hope that this has proven useful to\n[930.92s] you.\n[932.0s] And if you''re already adept at slinging\n[934.92s] pans on the burners, I''d be really\n[937.24s] curious about what you would tell your\n[939.64s] past self.\n[941.36s] Let us all know in the comments below.\n[944.64s] Thanks you to you all so much for\n[946.92s] staying with me until the end. All the\n[949.04s] best on your continued practice, and all\n[951.52s] of you, please be well."}'
