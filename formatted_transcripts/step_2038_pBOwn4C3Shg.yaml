transcript: Hey everyone, it's Jolt [snorts] here. I've got something interesting for you. This is going to be a short video, but indeed if you wait till the end, I'll have a second super interesting thing for you as well. And I think you're going to love this one. This morning I was having a chat on the Sketcher Mind community, then the idea hit me. Boom! I thought I can solve this with a nice script. And today I have a one-click image library script for you. You know, in the past I've created multiple image libraries using different type of scripts, but they always involved lots of manual stuff, configuring, downloading, etc. Now, this is a single-click solution. So, let me show you how this works. It's very easy to install it. All you need to do is to come here to the Obsidian store panel. Then you need to click here on the script library. And here you just need to type in icon library like that. You click icon library, and here you click to install the script. And once the script is installed, then bang, you have the script library running. It's that easy. Now, of course, it's pre-configured with my settings. That's how it downloads. So, you might need to do a little setting for yourself, but let me show you how it works. If I'm looking for, for example, running like this, these are my icons that include the keyword run with a double n. I can press tab. I can select the icon I want. I can press enter, and the icon is inserted. Or I can change this to walk, for example, and then I can also use my mouse and just type attack tap on the icon I want to insert, and I have the icon inserted right here. It even works with my mind builder, so if you have a mind map here, so this is this is a mind map, and it has nodes like that, and if I want to add an image here, I can just press my hot key, and I can add here apple, for example, and I can simply add my apple icon, and it was added to the mind map, and from here on I can continue to write about this, whatever I want. You get the idea. So, let me show you some of the settings here. First of all, getting the hot key, that's very easy. You come to Obsidian settings, you come to hot key settings, and you look for icon library, and you configure a hot key. My hot key is control shift I. Then second, you have this cog here to open the settings, and you can configure here the naming convention based on which you want to select the icons. My naming convention is type followed by keywords followed by the source of the file, so for example, it looks like this, icon, and I can say it maybe house, villa, cottage, and then my source is maybe flat icon. And by the way, what you see here is you can type in a sample file name, and then based on your filter criteria up here, you're going to get the result. And don't worry about the regular expressions here. If you talk to Cloud or ChatGPT or Gemini or whomever, they're going to help you create these. The rest of the settings, I think, are pretty self-explanatory. You can also change the thumbnail size. So, if you want smaller or larger thumbnails, you can change it here. And there's an information here that explains a little bit about how this works, why this works. That's it. Super simple. Your icons can be anything. They can be PNGs, they can be SVGs, they can be even X Collateral files. So, for example, this is an X Collateral icon. If I open this, then you can see it here. This is an X Collateral drawing. But, for example, this one here, this is an icon I downloaded from Flaticon. So, if I open this, this is going to open as an SVG icon. So, that's all that you have here. And now for the bonus, the bonus is the comic strip editor. This was something that was contributed by Ivan, one of the Sketcher Mind community members. Let me show you how this works. This is an amazing script. If I open the comic strip director, it opens here on the side. I can choose a style of comic strip. You have all sorts of different styles here. Maybe I'm going to choose this style here. Then I can come down here and choose my character. Maybe I'm going to now play with Nadia as my character, and then I can start to put together my story, whatever my story is. So, right now, I don't really know what my story is, but these are my characters. And the comic strip director is a friend of the comic book callout editor. You have the icon here, and in the comic book callout editor, you have the icon here, so you can switch between the two scripts if you have implemented both. And you can very simply create these type of comic book callouts. You can change, for example, the type here, or you can make this into Well, the heart doesn't look that good, but into this star. You can I won't go into the details. I had a video on this recently, but once you're happy with your callout, you can just simply click insert, and you can place it into your story wherever it belongs in the story. And like this, you can quickly put together a storyline here. To install these scripts, you need to come to the script store, and you just need to type in comic like that, and you see the comic book callout editor, and you see the strip director one below the other. You need to click and install both. Now, in terms of the comic strip editor or director, sorry. When you start it up, it will not have these icons here. You will need to follow instructions to download this. Ivan has a dedicated site for this, etc. So, you'll need to deal on the details with Ivan, and I've played with this, and I think this is a really cool. The others work in themselves. So, now you have an amazing icon library, you have a comic strip director, you have characters for that, you have callout editors, so go create something beautiful, something fun, something interesting, and share it with the world. A good place to share it is on the Sketcher Mind community site, but wherever you share it, if you tag me, I'm going to be so happy. Thank you.
