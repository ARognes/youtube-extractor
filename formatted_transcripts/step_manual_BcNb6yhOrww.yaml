transcript: '{"content":"\n[0.0s] One of the reasons we hate our own\n[2.08s] weakness is because we had this\n[3.96s] weakness, right? We had this need. We\n[5.96s] needed to be loved. We needed to be\n[7.52s] supported. We needed to be held,\n[9.0s] whatever, whatever it is. And then the\n[10.8s] people around us were not able to\n[12.96s] provide it. And so then what you get\n[14.84s] really angry at is yourself for having\n[18.48s] this need. Cuz if I have this need and\n[20.08s] no one''s going to provide it, then it\n[21.12s] hurts to have an unmet need. Why do I\n[23.64s] need approval? Why do I need love? Why\n[25.96s] do I need acceptance? I wish I didn''t\n[27.68s] need this crap. Because if I didn''t need\n[29.84s] this crap, then I wouldn''t be\n[30.96s] unfulfilled. I wouldn''t be continuously\n[32.64s] disappointed. And so this is what''s\n[34.16s] really interesting is like you may think\n[36.2s] that okay, what I need to do is develop\n[38.36s] self-esteem, right? I need to stop being\n[40.52s] a loser. And instead I need to be a\n[42.24s] winner. Why am I one of these losers who\n[44.32s] needs support instead of being\n[46.2s] independent and disciplined? But this is\n[48.2s] what''s so scary and toxic and why it\n[50.6s] kind of doesn''t work is actually like\n[52.0s] that''s not the right move, right? What\n[54.2s] actually needs to happen is instead of\n[55.84s] beating yourself for being a loser,\n[57.8s] underneath that is some kind of need\n[60.52s] that was not met. And becoming some\n[63.68s] ubermensch that does not need that need\n[66.24s] met doesn''t actually solve the problem.\n[68.16s] You may turn into an ubermensch of some\n[70.0s] kind, but internally you won''t be\n[71.96s] healed, right? So the real path to\n[73.72s] healing is to stop hating yourself,\n[75.76s] acknowledge that you have a need instead\n[77.68s] of pushing it down, and then hopefully\n[79.76s] once you acknowledge you have the need,\n[81.08s] then you have a really scary job ahead\n[83.4s] of you, which is to then go out and try\n[86.36s] to put yourself in the same powerless\n[89.04s] situation that you''ve been trying to\n[91.04s] avoid this whole time."}'
