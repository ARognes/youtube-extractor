transcript: "- Some things are not normal. By that I mean if you go out in the world and start measuring things\nlike human height, IQ, or the size of apples on a tree. You will find that for\neach of these things, most of the data clusters\naround some average value. This is so common that we call\nit the normal distribution, but some things in life are not like this. - Nature shows power\nlaws all over the place. That seems weird. Like, is nature tuning\nitself to criticality? - If you make a crude measure\nof how big is the world war by how many people it kills, you find that it follows a power law. The outcome will vary in size\nover 10 million, 100 million. - It's much more likelihood\nof really big events than you would expect from\na normal distribution, and they will totally skew the average. - The system you're\nlooking at doesn't have any inherent physical scale. It's really hard to know\nwhat's gonna happen next. - The more you measure,\nthe bigger the average is, which is really weird,\nit sounds impossible. - It's very important to try to understand which game you're playing and what are the payoffs\ngoing to be in the long run. - In the late 1800s, Italian\nengineer Vilfredo Pareto stumbled upon something\nno one had seen before. See, he suspected there\nmight be a hidden pattern in how much money people make. So he gathered income tax records from Italy, England, France,\nand other European countries, and for each country he plotted\nthe distribution of income. Each country he looked at,\nhe saw the same pattern, a pattern which still holds\nin most countries to this day, and it's not a normal distribution. If you think about a normal\ndistribution like height, there's a clearly defined average and extreme outliers\nbasically never happen. I mean, you are never\ngoing to find someone who is, say, five times\nthe average height, that would be physically impossible, but Pareto's income\ndistributions were different. Take this curve for England, it shows the number of people who earn more than a certain income. The curve starts off declining steeply, most people earn relatively little, but then it falls away gradually, much more slowly than a\nnormal distribution would, and it spans several orders of magnitude. There were people who\nearned 5 times, 10 times, even 100 times more than others. That kind of spread just wouldn't happen if income were normally distributed. Now to shrink this huge spread of data, Pareto calculated the\nlogarithms of all the values and plotted those instead. In other words, he used a log-log plot, and when he did that, the broad curve transformed\ninto a straight line. The gradient was around negative 1.5. That means each time\nyou double the income, say, from 200 pounds to 400 pounds, the number of people\nearning at least that amount drops off by a factor of\ntwo to the power of 1.5, which is around 2.8. And this pattern holds for\nevery doubling of income. So Pareto could describe\nthe distribution of incomes with one simple equation. The number of people who\nearn an income greater than or equal to X is\nproportional to one over X to the power of 1.5. Now, that's what Pareto saw for England, but he performed the same\nanalysis on data from Italy, France, Prussia, and a\nbunch of other countries, and he saw the same thing again and again. Each time the data transformed\ninto a straight line and the gradients were remarkably similar. That meant Pareto could\ndescribe the income distribution in each country with the same equation, one over the income to some power, where that power is just\nthe absolute gradient of the logarithmic graph. This type of relationship\nis called a power law. When you move from the world\nof normal distributions to the world of power laws, things change dramatically. So to illustrate this, let's take a trip to the casino to play three different games. At table number one, you\nget 100 tosses of a coin. Each time you flip and it\nlands on heads, you win $1. So the question is, how much would you be prepared\nto pay to play this game? Well, we need to work out how much you'd expect to win in this game and then pay less than\nthat expected value. So the probability of\nthrowing a head is 1/2. Multiply that by $1 and\nmultiply that by 100 tosses, that gives you an expected payout of $50. So you should be willing to pay anything less than $50 to play this game. Sure, you might not win every time, but if you play the\ngame hundreds of times, the small variations\neither side of the average will cancel out and you can\nexpect to turn a profit. One of the first people to\nstudy this kind of problem was Abraham de Moivre in the early 1700s. He showed that if you plot the\nprobability of each outcome, you get a bell-shaped curve, which was later coined\nthe normal distribution. - Normal distributions, the traditional explanation is that when there are a lot\nof effects that are random that are adding up, that's when you expect normals. So like how tall I am depends\non a lot of random things, about my nutrition, about\nmy parents' genetics, all kinds of things, but if these random effects are additive, that is what tends to lead to normals. - At table number two, there's\na slightly different game. You still get 100 tosses of the coin, but this time, instead of potentially\nwinning a dollar on each flip, your winnings are\nmultiplied by some factor. So you start out with $1, and then every time you toss a head, you multiply your winnings by 1.1. If instead the coin lands on tails, you multiply your winnings by 0.9. And after 100 tosses, you take home the total, that is the dollar you started with times the string of 1.1s and 0.9s. So, how much should you\npay to play this game? Well, on each flip, your payout can either grow or shrink, and each is equally likely\neach time you toss the coin, so the expected factor each turn is just 1.1 plus 0.9 divided\nby two, which is one. So if you start out with $1, then your expected payout is just $1. That means you should be willing to pay anything less than a dollar\nto play this game, right? Well, if you look at the\ndistribution of payouts, you can see that you could win big. If you tossed 100 heads, you'd win 1.1 to the power of 100. That's almost $14,000, although the chance of that happening is around 1 in 10 to the power of 30. You'd be more likely to win the lottery three times in a row. On the other hand, the median\npayout is around 61 cents. So if you're only\nplaying the game one time and you want even odds\nof turning a profit, well, then you should\npay less than 61 cents. Though either way, if you played\nthe game hundreds of times, your payout would average out to $1. Now, watch what happens\nif we switch the x-axis from a linear scale to\na logarithmic scale. Well, then you see the curve transforms into a normal distribution. That's why this type of distribution is called a log normal distribution. - When random effects multiply, if I have a certain wealth and then my wealth goes up by\na certain percentage next year because of my investments, and then the year after that, it changes by another random factor, as opposed to adding, I'm\nmultiplying year after year. If you have a big product\nof random numbers, when you take the log of a product, that's the sum of the logs. So what was a product of random numbers then gets translated into sums\nof logs of random numbers, and that's what leads to this so-called log normal distribution. And log normal distributions\nproduce big inequalities. You don't just see a mean, you see a mean with a big long tail. It's much more likelihood\nof really big events, in this case, tremendous\nwealth being obtained, than you would expect from\na normal distribution. - The reason this curve is so asymmetric is because the downside is capped at zero, so at most, you could lose $1, but the upside can keep\ngrowing up to nearly $14,000. Now let's go on to table three. Again, you'll be tossing a coin, but this time you start out with a dollar and the payout doubles\neach time you toss the coin and you keep tossing\nuntil you get a heads, then the game ends. So if you get heads on your\nfirst toss, you get $2. If you get a tails first and then hit a heads on your\nsecond toss, you get $4. If you flipped two tails and then a head, on your third toss,\nyou'd get $8, and so on. If it took you to the\nnth toss to get a heads, you would get two to the n dollars. So, how much should you\npay to play this game? Well, as in our previous example, we need to work out the expected value. So suppose you throw a\nhead on your first try, the payout is $2 and the probability of\nthat outcome is a half, so the expected value of\nthat toss is a dollar. If it takes you two tosses to get a heads, then the payout is $4 and the probability of that\nhappening is one over four, so again, the expected value is $1. We also need to add in the chance that you flip heads on your third try, in that case, the payout is $8 and the probability of that\nhappening is one over eight, so again, the expected value is $1. And we have to keep\nrepeating this calculation over all possible outcomes. We have to keep adding $1 for\neach of the different options for flipping the coin, say, 10\ntimes until it lands on heads or 100 times before you get heads. I know it's extremely unlikely, but the payout is so huge that the expected value of\nthat outcome is still a dollar, so it still increases the\nexpected value of the whole game. This means that, theoretically, the total expected value\nof this game is infinite. This is known as the\nSt. Petersburg paradox. If you look at the\ndistribution of payouts, you can see it's uncapped, it spans across all orders of magnitude. You could get a payout\nof $1,000, $100,000, or even a million dollars or more. And while a million\ndollar payout is unlikely, it's not that unlikely, it's around one in a million. Now, if you transform\nboth axes to a log scale, you see a straight line with\na gradient of negative one. The payout of the St. Petersburg paradox follows a power law. The specific power law in this case is that the probability of a payout x is equal to x to the power of\nnegative one or one over x. In the previous games when\nyou have a normal distribution or even a log normal distribution, you can measure the width\nof that distribution, its standard deviation. And in a normal distribution, 95% of the data fall within\ntwo standard deviations from the mean. But with a power law, like in\nthe St. Petersburg paradox, there is no measurable width, the standard deviation is infinite. This makes power laws a\nfundamentally different beast with some very weird properties. - Imagine you take a\nbunch of random samples and then average them and then take more random\nsamples and average them, you'll find that the\naverage keeps going up, it doesn't converge. And the more you measure, the bigger the average is, which is really weird,\nit sounds impossible, but it's because it has such a heavy tail, meaning the probability of\nreally whopping big events is so significant that\nif you keep measuring, occasionally you're gonna measure one of those extreme outliers and they will totally skew the average. It's sort of like saying, if you're standing in a room\nwith Bill Gates or Elon Musk, the average wealth in that room is gonna be 100 billion\ndollars or something (laughs) because the average is\ndominated by one outlier. - And that same idea, one\noutlier can dominate the average, shows up online too. A handful of companies, servers, and data centers hold\nthe personal information of millions of people, so when one of them gets hacked, it can have ripple effects\nacross the whole network. We've had scammers get a\nhold of email addresses and phone numbers of writers on our team and then send them messages\npretending to be me. That is where today's\nsponsor, NordVPN, comes in. NordVPN encrypts your internet traffic so your personal data stays private, even when the wider system isn't. It protects you from hackers, trackers, and malware with threat protection, even when you're not connected to a VPN. Within just 15 minutes of\nregistering a new email, we saw that five leaks\nhad already been detected. NordVPN lets you browse securely\nfrom anywhere in the world by routing your connection\nthrough encrypted servers in over 60 countries. You can try it completely risk-free with a 30-day money-back guarantee. Just scan this QR code or\ngo to NordVPN.com/veritasium to get a huge discount on a two-year plan plus four extra months free. That's NordVPN.com/veritasium\nfor a huge discount. I'll put the link down in the description. I'd like to thank NordVPN\nfor sponsoring this video. And now, back to power laws. So, why do you get a power law from the simple St. Petersburg setup? If you look at the payout x, you can see it grows exponentially with each toss of the coin, x equals two to the n. But if you look at the\nprobability of tossing the coin that many times to get a heads, you can see that this probability\nshrinks exponentially. So the probability of\nflipping a coin n times is 1/2 to the power of n. But we're not really interested\nin the number of tosses, we're interested in the payout. Now we know that x equals two to the n, so instead of writing two to the n in our probability equation, we can just write x. So we end up with this, the probability of a payout of x dollars is equal to one over x, or in other words, x to\nthe power of negative one. - You put them together, the exponentials conspire\nto make a power law. And that's a very common thing in nature, that a lot of times\nwhen we see power laws, there are two underlying exponentials that are dancing together\nto make a power law. - One example of this is earthquakes. If you look at data on earthquakes, you find that small\nearthquakes are very common, but earthquakes of increasing magnitudes become exponentially rarer. But the destruction that earthquakes cause is not proportional to their magnitude, it's proportional to\nthe energy they release. And as earthquakes grow in magnitude, that energy grows exponentially. - So there's this exponential decay in frequency of earthquakes\nof a given magnitude and an exponential increase in\nthe amount of energy released by earthquakes of a certain magnitude. So when you combine those two exponentials to eliminate the magnitude, what you find is a power law. - But power laws also\nreveal something deeper about the underlying\nstructure of a system. To see this in action, let's go back to the third coin game and the St. Petersburg paradox. Now, you can draw all\nthe different outcomes as a tree diagram where the length of each branch\nis equal to its probability. So starting with a\nsingle line of length one and then 1/2 for the first two branches, 1/4 for the next four, and so on. Now, when you zoom in, you keep seeing the\nsame structure repeating at smaller and smaller scales. It's self-similar like a fractal, and that's no coincidence. We see the same fractal-like\npattern in the veins on a leaf, river networks, the blood\nvessels in our lungs, even lightning, and in all of these cases, we can describe the\npattern with a power law. Power laws and fractals\nare intrinsically linked. That's because power laws\nreveal something fundamental about a system's structure. - So I've got a magnet\nand I've got a screw, and you'll notice if I\nbring them close together, then the screw gets\nattracted to the magnet, and that's because\nthere's a lot of iron it, which is ferromagnetic. But watch what happens if\nI start heating this up. Trying to... Oh! You see that? Ah, there it went! There it went! You see, you heat it up and\nsuddenly it becomes nonmagnetic. To find out what happened, let's zoom in on this magnet. - Inside a magnet, each atom has its own magnetic moment, which means you can think of it like its own little magnet or compass. If one atom's moment points up, its neighbors tend to point that way too since this lowers the system's\noverall potential energy. Therefore at low temperatures, you get large regions called domains where all the moments align. And when many of these domains also align, their individual magnetic fields reinforce to create an overall\nfield around the magnet. But if you heat up the magnet, each atom starts vibrating vigorously. The moments flip up and down and so the alignment can break down. And when all the moments cancel out, then there's no longer\na net magnetic field. Now, if you have the right equipment, you can balance any magnetic material right on that transition point, right between magnetic and nonmagnetic. This is called the critical point and it occurs at a specific temperature called the Curie temperature. I asked Casper and the\nteam to build a simulation to show what's going on inside the magnet at this critical point. - Each pixel represents\nthe magnetic moment of an individual atom. Let's say red is up and blue is down. Now, when the temperature is low, we get these big domains where the magnetic moments are all aligned and you get an overall magnetic field. But if we really crank up the temperature, then all of these moments\nstart flipping up and down and so they cancel out and the\nmagnet loses its magnetism, so that's exactly what\nhappened in our demo. But if we tune the temperature just right, right to that Curie temperature, then the pattern becomes\nway more interesting. - This looks like a map. - Like a map? - Yeah, it almost looks like\nthe Mediterranean or something. It's almost stable, like atoms that are pointing one way tend to point that way for a while, but there is clearly fluctuations as well, so domains are constantly\ncoming and going. It's both got some elements of stability and some persistence over time, some features which are consistent, but it's also not locked in place because you notice changes over time. - [Casper] If you zoom in, you find that the same kinds of patterns repeat at all scales. You've got domains of tens of atoms, hundreds, thousands, even millions. There's just no inherent\nscale to the system, that is, it's scale-free, it's just like a fractal. And if you plot the size\ndistribution of the domains, you get a power law. - The underlying geometry\nsuddenly shows a fractal character that it doesn't have on either\nside of the phase transition. Right at the phase transition, you get fractal behavior and that pops out as a power law. - In fact, whenever you find a power law, that indicates you're\ndealing with a system that has no intrinsic scale, and that is a signature of a\nsystem in a critical state, which turns out has huge consequences. - See, normally in a magnet\nbelow the Curie temperature, each atom influences only its neighbors. If one atom's magnetic moment flips up, then that means that its\nneighbors are slightly more likely to point up too. But that influence is local, it dies out just a few atoms away. But as the magnet approaches\nits critical temperature, those local influences\nstart to chain together. One spin nudges its neighbor and that neighbor nudges\nthe next and so on, like a rumor spreading through a crowd. And the result is that the\neffective range of influence keeps expanding, and right at the critical point, it becomes effectively infinite. A flip on one side can cascade throughout the entire material. So you get these small\ncauses, just a single flip, to reverberate throughout\nthe entire system. - And it gets right into that point where the system is maximally unstable, anything can happen. It's also maximally interesting in a way. It means the system is most unpredictable, most uncertain, it's really hard to know\nwhat's gonna happen next, and that seems to be a natural procedure that happens in many different\nsystems in the world. - One such system is forest fires. In June, 1988, a lightning strike started a small fire near Yellowstone National Park. This was nothing out of the ordinary. Each year, Yellowstone\nexperiences thousands of lightning strikes. Most don't cause fires and those that do tend\nto burn a few trees, maybe even a few acres\nbefore they fizzle out. 3/4 of fires burn less\nthan 1/4 of an acre. The largest fire in the\npark's recent history occurred in 1931. That burned through 18,000 acres, an area slightly larger than Manhattan. But the 1988 fire was different, that initial spark spread slowly at first covering several thousand acres. Then over the next couple of months, it merged with other small fires to create an enormous complex of megafires that blazed across 1.4\nmillion acres of land. That's around the size of\nthe entire state of Delaware. That's 70 times bigger\nthan the previous record, and 50 times the area of all the fires over the previous 15 years combined. So, what was so special\nabout the 1988 fires? Well, to find out, we made\na forest fire simulator. - We've got a grid of squares, and on each square, either a tree could be\nthere, it could grow, or it could not be there. There's gonna be some probability\nfor lightning strikes. So the higher that probability, the more fires we're gonna have. We can run this. - So trees are growing. - [Casper] Trees are growing, - Forest is filling in. Nice. Getting pretty dense. - What do you expect is gonna happen? - I expect to see some fires. Probably, you know, now that... Oh! That was good, that was a good little fire. Whoa! Whoa! No way! Well, that's crazy. You haven't adjusted\nthe parameters, right? It's just like-\n- Not yet, not yet. - This seems like a very critical\nsituation just by itself. I say that because of\nhow big that fire was. - This sort of system will\ntune itself to criticality, and you can see it start to happen. So right now, I think it's a good moment\nwhere you have basically domains of a lot of different sizes. And then one way to think about it is if some of these\ndomains become too big, then you get a single fire\nlike that one, perfectly timed. - Burns them all out.\n- It's just gonna propagate throughout the whole thing and\nburn it back down a little. But then if it goes too hard, then now you've got all these domains where there are no trees and so it's gonna grow again to bring it back to that critical state. - I can see how it's the\nfeedback mechanism, right, that the fire gets rid of all the trees and there's nothing left to burn, and then that has to fill in again. - [Casper] Yeah.\n- Yeah. But if there hasn't been a fire, then the forest gets too thick and then it's ripe for\nthis sort of massive fire. - For a magnet, you have to painstakingly\ntune it to the critical point, but the forest naturally\ndrives itself there. This phenomenon is called\nself-organized criticality. Yeah, and if you let it run, what you get is, again,\na power law distribution. So this is log-log, so it should be a straight line. - That kind of stuff\nseems so totally random and unpredictable, and it is in one way, and yet it follows a pattern. There's a consistent mathematical pattern to all these kind of disasters. It's shocking. - Is there something fractal about this? - Mostly in terms of the, I\nguess, domains of the trees when you're at that critical state. So you get very dense areas,\nyou get non-dense areas. And as a result, when a\nsingle lightning bolt strikes, you can get fires of all sizes. Most often you get small fires\nof 10 or fewer trees burning. A little less frequently, you get fires of less than 100 trees. And then every once in a while, you get these massive fires that reverberate throughout\nthe entire system. Now, you might expect that\nbecause the fire is so large, there has to be a\nsignificant event causing it, but that's not the case because the cause for each\nfire is the exact same, it's a single lightning strike. The only difference is where it strikes and the exact makeup of\nthe forest at that time. So in some very real way, the large fires are nothing more than magnified versions of the small ones, and even worse, they're inevitable. So what we've learned is that for systems in a critical state, there are no special events\ncausing the massive fires. There was nothing special\nabout the Yellowstone fire. - In 1935, the US Forest\nService established the so-called 10:00 AM policy. The plan was to suppress every single fire by 10:00 AM on the day\nfollowing its initial report. Now, naively, this strategy makes sense. I mean, if you keep all\nfires under strict control, then none can ever get out of hand. But it turns out this\nstrategy is extremely risky. - So let's say we're gonna bring down the lightning probability, so it's very small, only one in a million right now, and we're also gonna crank up\nthe tree growth a little bit. Now what do you think is gonna happen? - We're gonna get some big\nfires, I would imagine, like a lot of not fire\nand then some huge fires. Yeah. (Derek laughs) - [Casper] Yep. - Oh boy. - [Casper] So nowadays, the fire service has a\nvery different approach. They acknowledge that\nsome fires are essential to make the megafires less likely. So they let most small fires burn and only intervene when necessary. In some cases, they even\nintentionally create small fires to burn through some of the buildup, though it could take years to return the forest to its natural state after a century of fire suppression. But it's more than just\nthe Earth's forests that are balanced in this critical state. Every day, the Earth's crust is moving and rearranging itself. Stresses build up slowly as tectonic plates rub against each other. Most of the time, you get\na few rocks crumbling, the ground might move just\na fraction of a millimeter, but the stresses dissipate\nin many earthquakes that you wouldn't even feel. - There are really tiny earthquakes that are happening right\nnow beneath your feet, you just can't feel 'em\nbecause they're very small. But they are earthquakes, they're driven by small slipping movements in the Earth's crust. - [Casper] But sometimes\nthose random movements can trigger a powerful chain reaction. - [Derek] In Kobe, Japan, the morning of January 17, 1995\nseemed just like any other. This was a peaceful city, and although Japan as a country is no stranger to earthquakes, Kobe hadn't suffered a\nmajor quake for centuries. Generations grew up believing the ground\nbeneath them was stable, but that morning, deep underground, a stress released nearby\nthe Nojima fault line. The stress propagated to the\nnext section of the fault and the next. Within seconds, the ruptured cascaded along\n40 kilometers of crust, shifting the ground by up to two meters and releasing the energy equivalent of numerous atomic bombs. The resulting quake\ndestroyed thousands of homes along with most major roads and railways leading into the city. It killed over 6,000 people and forced 300,000 from their homes. - How far it goes depends a lot on chance and the organization of\nall that stress field in the Earth's crust. And it just seems to be\norganized in such a way that it is possible oftentimes for the earthquake to\ntrickle along an avalanche along a long way and produce a very large\nunusual earthquake. But if you look at the process\nbehind that earthquake, it is exactly the same physical process. It's just that the\nearthquake-generating process naturally produces events that range over an\nenormous range of scale, and we're not really used\nto thinking about that. - We have this ingrained assumption that we can use the past\nto predict the future, but when it comes to earthquakes or any system that's in a critical state, that assumption can be catastrophic because they're famously unpredictable. So, how can you even\nbegin to model something like the behavior of earthquakes? - [Derek] In 1987,\nDanish physicist Per Bak and his colleagues considered\na simple thought experiment. Take a grain of sand\nand drop it on a grid, then keep dropping grains on top until at some point the\nsandpile gets so steep that the grains tumble down\nonto different squares. - What they looked at\nwas the size of these, what they were calling avalanches, these reorganizations of\nnumbers of grains of sand. They asked for how often\ndo you see avalanches of a certain size. - This is the most simple\nversion of a sandpile simulator that you could almost imagine. We're gonna drop a little grain of sand at first always in the center, and then it's just gonna keep going up. For one grain, it'll be fine. For two grains, it'll be fine. Three grains, it'll be fine, but it's on the edge of toppling. And then when it reaches four or more, it's gonna basically go. It feels a bit like a, I\ndon't know, pulsing thing, like something's trying\nto escape or something, very video game-like. That seemed pretty crazy. And it is symmetrical. - Yeah, nice geometric features. - So this might be interesting because right now we passed it at a point where this middle one is gonna go, and then you look around it and you see, essentially you can think of these brown or these three tall grain stacks as being maximally unstable. They're about to go, and so you could think of them as these fingers of instability. If anything touches them, like, they're just gonna go. (lively music) - I see it propagating out. - It's cool seeing it slower. I feel like you can see several waves propagating at the same time. - Some people have reasoned\nthat the Earth's crust becomes riddled with similar\nfingers of instability where you get stresses building up, and then when one rock crumbles, it can propagate along these fingers, potentially triggering\nmassive earthquakes. If you look at the data, there's some even more compelling evidence that links the sandpile\nsimulation to earthquakes. - Let's say instead of\ndropping it at the center, pretty unrealistic to have\nit drop in the center, I'm gonna drop at random. - Hah! That's crazy. - You can actually see it tune itself to the critical state. Like at the start, you only see these super tiny avalanches and then now it's everything. - It has to build up. - We can slow down a little. Oh, and that's a super clean power law. There are events of all sizes. One grain of sand might\nknock over just a few others or it could trigger an\navalanche of millions of grains that cascade throughout the entire system. And if you look at the power law you get from the sandpile simulation, it closely resembles the power law of the energy released\nby real earthquakes. But if you look at the sandpile\nexperiment more closely, it doesn't just resemble earthquakes. What does it remind you of? - Forest fires.\n- [Casper] Right? It feels like it's the\nexact same behavior. - That's the really surprising thing, and that's why this little\npaper with a sandpile was published in the world's top journal because it did something that people just didn't\nreally think was possible. - Now, what's ironic is if\nyou look at real sandpiles, they don't behave like this. - Okay, you said sand, I'm gonna do an experiment\non a real sandpile. And of course, it doesn't\nfollow a power law distribution of avalanches at all. It's totally wrong. (Steven and Derek laugh) Per Bak, naturally, gets a\nchance to reply to the criticism, and he says, I'm pretty close to quoting, he says, \"Self-organized criticality only applies to the\nsystems it applies to.\" (Steven laughs) So he doesn't care, the fact that his theory is\nnot relevant to real sandpiles. So what? Get out of my face. He's interested in bigger\nfish to fry than sandpiles. It's like, you're taking me too literally. I'm talking about a universal mechanism for generating power laws. And the fact that it\ndoesn't work in real sand is uninteresting to him. I thought that took some real nerve. - You could think about the Earth and the Earth going around the Sun. That's a very complex system. You've got the molten core, everything sloshing around, and you've got oceans, and you've even got the\nmoon going around the Earth, which in theory, you know, all should affect the exact motion of the Earth around the Sun. But Newton ignored all of that, all he looked at was just a\nsingle parameter, essentially, the mass of the Earth. And with that, he could\ncorrectly, for the most part, predict how the Earth was\ngonna go around the Sun. Similarly here, there are people that have\nlooked at these phenomena that go to the critical state, in this case it's\nself-organized criticality, is it brings itself there, and what they find is that\nthere's this universal behavior where it doesn't even really\nmatter what the subparts are, you just get the behavior\nthat's the exact same. - At that critical point when all the forces are poised and the system is right\non that delicate balance between being organized, highly organized, or being totally disorganized, it turns out that almost\nnone of the physical details about that system matter\nto how it behaves. There's just a universal\nbehavior that is irrespective of what physical system\nyou're talking about. The term that was used\nis called universality, and it's kind of a miracle, it means you can make\nextremely powerful theories without involving any technical details, any real details of the material. - What this means is that\nyou could have these systems that on the surface\nseem totally different, but when you get to the critical point, they all behave in the exact same way. The other thing you could do\nis instead of this being trees, you could imagine it being people and the thing that's spreading- - Is disease. - Is disease, yeah. - You almost get something for nothing at these critical points. - See, many of these systems\nfall into what's known as universality classes. Some of them you need\nto tune to get there, like magnets at their Curie temperature or fluids like water or carbon dioxide at their critical point, but some other systems seem to organize\nthemselves to criticality, like the forest fires or\nsandpiles or earthquakes. But what's crazy is that if you succeed in understanding just\none system from a class, then you know how all the\nsystems in that class behave, and that includes even the\ncrudest simplest toy models, like the simulations we've looked at. So you can model\nincredibly complex systems with the most basic of models. And some people think\nthis critical thinking applies even further. When we look around the world, there are lots of systems that show the same power law behavior that we see in this critical systems. It's in everything from DNA sequencing to the distribution of\nspecies in an ecosystem to the size of mass\nextinctions throughout history. We even see the same\nbehavior in human systems, like the populations of cities, fluctuations in stock prices, citations of scientific papers, and even the number of deaths in wars. So some people argue that these systems and perhaps many parts of our\nworld also organize themselves to this critical point. - So the fact that all\nthese natural hazards, as they call them, floods, wildfires, and earthquakes, they all follow power law distributions means that these extreme\nevents are much more common than you would think based on\nnormal distribution thinking. - If you find yourself in a situation or an environment that is sort\nof governed by a power law, how should you change your behavior? - If you have events with one\nof these power distributions, what you're seeing most of\nthe time is small events. And this can lull you into\na false sense of security, you think you understand\nhow things are going. You know, floods for example, there are a lot of small floods, and then every once in a\nwhile, there's a huge one. One response to this is insurance, that insurance is designed precisely to protect you against\nthe large rare events that would otherwise be very bad. But then there's the other\nside of that picture, which is you are the insurance company that needs to insure people and they have a particularly difficult job because they have to be able\nto say how much to charge so that they have enough money to pay out when the big bad thing comes along. - [Derek] In 2018, a forest fire tore through\nParadise, California, it became the deadliest and most destructive fire\nin the state's history, but the insurance company,\nMerced Property & Casualty, hadn't planned for something that huge, and when the claims came in, they just didn't have\nthe reserves to pay out. So just like that, the company went bust. - But while extreme events\ncan cripple some companies, there are entire industries that are built on power law distributions. Between 1985 and 2014, private equity firm Horsley Bridge invested in 7,000 different startups and over half of their\ninvestments actually lost money, but the top 6% more than 10xed in value and generated 60% of the\nfirm's overall profit. In fact, the best venture capital firms often have more investments\nthat lose money, they just have a few crazy outliers that show extraordinary growth, a few outliers that carry\nthe entire performance. In 2012, Y Combinator calculated\nthat 75% of their returns came from just two out of the\n280 startups they invested in. So venture capital is a world\nthat depends on taking risks in the hope that you'll get a\nfew of these extreme outliers which outperform all of the rest of the investments combined. - [Derek] Book publishers\noperate in a similar fashion, most titles flop, but in 1997, a small independent UK\npublisher called Bloomsbury took a chance on a story\nabout a boy wizard. The boy's name, of\ncourse, was Harry Potter, and now Bloomsbury is a\nglobally recognized brand. We see a similar pattern play\nout on streaming platforms. On Netflix, the top 6% of\nshows account for over half of all viewing hours on the platform. On YouTube, less than 4% of videos\never reach 10,000 views, but those videos account\nfor over 93% of all views. - All these domains\nfollow the same principle that Pareto identified over 100 years ago where the majority of the\nwealth goes to the richest few. The entire game is defined\nby the rare runaway hits. - But not every industry\ncan play this game. Like if you're running a restaurant, you need to fill tables night after night. You can't have one particularly\nbusy summer evening that brings in millions of customers to make up for a bunch of quiet nights. Over a year, the busy nights\nand quiet ones balance out and you're left with the average. Airlines are similar, an airline needs to fill\nseats on each flight. You can't squeeze a million\npassengers onto one plane, so it's the average number\nof passengers over the year that defines an airline's success. - We're used to living in this world of normal distributions\nand you act a certain way, but as soon as you switch to this realm that is governed by a power law, you need to start acting vastly different. It really pays to know what kind of world or what kind of game you're playing. - That is good. That's good, yes. You should come on camera and\njust say that just like that. You were on camera, you just did do it. (Steven laughs)\n- If you are in a world where random additive\nvariations cancel out over time, then you get a normal distribution. And in this case, it's\nthe average performance, so consistency, which is important. But if you are in a world\nthat's governed by a power law where your returns can multiply and they can grow over\nmany orders of magnitude, then it might make sense\nto take some riskier bets in the hope that one\nof them pays off huge. In other words, it becomes more important to\nbe persistent than consistent. - [Derek] Though as we saw\nin the second coin game, totally random multiplicative returns give you a log normal\ndistribution, not a power law. To get a power law, there must be some\nother mechanism at play. In the early 2000s, Albert-László Barabási\nwas studying the internet, and to his surprise, he found that there was no normal webpage with some average number of links. Instead, the distribution\nfollowed a power law. A few sites like Yahoo had thousands of times more connections than most of the others. Barabasi wondered what could be causing this power law of the internet, so he made a simple prediction. As new sites were added to the internet, they were more likely to\nlink to well-known pages. To test this prediction, he and his colleague Réka Albert \nran a simulation. They started with a\nnetwork of just a few nodes and gradually they added\nnew nodes to the network with each new node more\nlikely to connect to those with the most links. As the network grew, a power law emerged. The power was around negative two, which almost exactly matched\nthe real data of the internet. - [Casper] Look at that.\n- [Derek] That's fun. - It's still so satisfying. This will basically also\ndistribute a power law. One of the ideas here is that\nthis could be individuals or even companies, and so if you're more likely to become more successful\nor more well known or successful you already are, you're gonna get this\nsort of runaway effect where you get a few that sort\nof dominate the distributions. I wonder if part of the takeaway is like if you're\nplaying some sort of game that is dominated by a power law, then you better do the work as much of it as early as possible so you get to benefit from the\nsnowball effect, essentially. - Yeah, I guess that's a good idea. I'm not sure whether you\ncan control it, though. Human beings like to think of ourselves as being a bit special, and that maybe somehow\nbecause we're intelligent and have free will. We will escape the provenance\nof the laws of physics in order and organization, but I think that's probably not the case. So if you look at the\nnumber of world wars, and if you make a crude measure\nof how big is the world war by how many people it kills, which is a bit macabre, but still, you find that, again,\nit follows a power law virtually identical to\nthe power law you find in stock market crashes. - So if the world is shaped by power laws, then it feels like we're poised in this kind of critical state where two identical grains of sand, two identical actions can\nhave wildly different effects. Most things barely move the needle, but a few rare events\ntotally dwarf the rest, and that, I think, is the\nmost important lesson. If you choose to pursue areas governed by the normal distribution, you can pretty much\nguarantee average results. But if you select pursuits\nruled by power laws, the goal isn't to avoid risk, it's to make repeated intelligent bets. Most of them will fail, but you only need one wild\nsuccess to pay for all the rest. - And the thing is that\nbeforehand you cannot know which bet is going to be because the system is\nmaximally unpredictable. It could be that your\nnext bet does nothing, it could do a little bit, or it could change your entire life. In fact, around three years ago, I was reading this little book, and in the book there was this little line saying something like, \"One idea could transform\nyour entire life.\" So right underneath that, I wrote, \"Send an email to Veritasium.\" A couple days later, I wrote\nan email to Derek, saying, \"Hey, Derek, I'm Casper. I study physics and I can\nhelp you research videos.\" I didn't hear back for four weeks, so I was getting pretty sad and just wanted to forget\nabout it and move on, but then a couple days later\nI got an email back saying, \"Hey, Casper, we can't do\nan internship right now, but how would you like to research, write, and produce a video as a freelancer?\" So I did, and that's how I get\nstarted at Veritasium. Hey, just a few quick final things. All the simulations that\nwe used in this video we'll make available\nfor free for you to use in the link in the description. And the other thing is\nthat we just launched the official Veritasium game. It's called Elements of Truth and it's a tabletop game\nwith over 800 questions. It's the perfect way to\nchallenge your friends and see who comes out on top. Now, at Veritasium, we're\nall quite competitive, so every time we play, things\nget a little bit heated, but that's honestly a big part of the fun. Now, when we launched on Kickstarter, we got a lot of questions asking if we could ship to specific countries. And originally we didn't enable this, and this is our mistake, this is on us and we totally hear you, but I'm glad to say that right now we have\nenabled worldwide shipping. So no matter where you are in the world, you can get your very own copy. To reserve your copy and get involved, scan this QR code or click\nthe link in the description. I wanna thank you for all your support, and most of all, thank you for watching."
