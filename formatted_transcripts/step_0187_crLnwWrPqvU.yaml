transcript: 40 golf is live on Steam it's been such a long and weird Road from proof of concept to release that first Spark of a crazy game idea grew into 4D golf a game with over 120 levels a level editor marble mode multiplayer and VR and online multiplayer coming soon I also have another announcement at the end so stay tuned My Hope Is that 4D golf gives you that true firstperson experience of what it's like to be in a fully 4D world and no you don't need a math PhD to jump into 4D everything is designed to be as accessible as possible and of course you can share your tips and tricks custom levels and personal bests on the code parade Discord or Steam Workshop also I have new 40 golf designs on my merch store 4D golf would not be possible without subscribers like you thank you it was a pleasure to share this journey through the devlogs and to read all your comments and suggestions encouragements and concerns so now on to the other announcement there's a major feature of 40 golf that I haven't mentioned publicly and I'm going to do a video about it very soon so look out for that and please don't spoil it for other people that haven't played the game yet I promise it's way more fun to Discover It Yourself anyway thank you so much for joining me on this game devb Journey I hope that 40 golf is as mind-blowing to you as it was to me see you soon
