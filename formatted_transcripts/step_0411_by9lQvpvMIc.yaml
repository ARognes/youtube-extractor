transcript: I maintain an open- Source UI layout Library called clay it allows you to create user interfaces that can adapt to changes in screen size or contents one of the things about clay that people tend to find surprising is that the code that actually computes the layout is only three functions for a total of about 800 lines of code I think it's because the expectation is that to provide a robust solution for UI layout must be extremely complicated perhaps you've read a paper on constraint solvers or looked at the source code of some other UI layout libraries or just generally been intimidated by reading comments online that seem to imply that it's beyond the reach of the average programmer but just because someone explains something in a complicated way doesn't mean it actually is complicated in my experience the tricky part of building a UI layout algorithm is that there are these ideas that seem good on the surface but when you actually Implement them or try them out with a complex layout they end up having these unfixable Edge cases or doing a huge amount of redundant work UI layout tends to have these long tunnels that lead to dead ends but I've found that with just a couple of simple insights you can short circuit almost all of that potential pain and end up building something really simple and robust say I wanted to build a simple drop-down menu like this in my application the simplest approach of course is just to draw all the components separately with their exact position and size on the screen in terms of our implementation this might just look like a series of individual function calls to draw the background rectangle then draw each menu item box one by one then draw all the text and then draw all the icons this will work fine as long as the drop down always appears in the same place in the application and my application window itself is always the same dimensions but say instead of a menu drop down I want to render a context menu that appears when I rightclick somewhere our initial approach has a problem because I've hardcoded the position of all of these elements this code isn't reusable we could make a function that requires you specify the positions of every single sub element in the dropdown but that would be kind of ridiculous if we imagine ourselves as a user of this function our expectation mentally is that we would provide a single Target position that might correspond to the top left corner of where we want our menu to render and the contents of our drop down would be rendered relative to that single position and that is the first and potentially the most important Insight in UI programming which is that the position of an element is naturally relative to the container that it's inside so for a simple solution to our problem instead of hardcoding the position of this text that says delete we can treat the labels position as relative to the menu item it's inside the menu item relative to the dropdown that it's inside and finally the outer drop down relative to the top left corner of the screen you might already know this but it's just worth mentioning that most computer Graphics systems treat the top left corner of the screen as the origin where X and Y are zero with Y increasing as it goes down which unfortunately is the opposite of what we use for graphs in mathematics we can now draw our context menu wherever we want on the screen by passing in the position of the top left corner as an argument but now we realize that this contextual dropdown might have different menu items depending on what it is you're right clicking on if we right click on an image we get image related options like editing and filters and if we right click on text we get text related options like spell check and diction research this brings us to the second Insight which is that just as elements are positioned relative to The Container they inside the size of the container depends on the contents there's this interesting bir directional dependency here in order to calculate an element's position we need to know the position of the container that it's inside and in order to calculate an element's size we need to know the sizes of potentially multiple elements that are nested inside it the idea of these recursively nested objects that reference one object above them and multiple objects below is probably ringing some bells in your head if you've ever done some data structure work before because what I'm describ describing in Computing terms is called a tree conceptually a tree is built out of a type of self- referencing object that has a single reference to its parent and multiple references to children just like our UI does and it's very clear how that relationship looks when we visualize it and indeed why the data structure is called a tree in the first place our tree starts with a single node that has no parent called the root node the root node can have multiple children which may or may not have children themselves and eventually we reach a node that has a parent and no children which we call a leaf node now data structures can seem a little abstract so let's see how we can map the UI elements of our context menu onto this tree structure we start with our background rectangle the outer dropdown at the root of the tree then as direct children of our dropdown we have each of our menu items and then deeper still we have our text labels and IC cons as children of our menu items clay provides an API that allows you to easily construct these trees which we refer to as UI hierarchies you create individual UI Elements by calling the clay macro in the parenthesis you can configure your elements so we'll tell our outer drop down to lay out its children from top to bottom give it a purple background color and then in the braces following that you can create more elements that are automatically added as children in the internal tree structure we're just doing a simple Loop through our menu item data array and creating our outer menu items we can then create our text labels and our icons inside our menu items this is very similar to other UI declaration languages like HTML but if you're trying to figure out how a tree like this turns into a correctly positioned flexible piece of UI like this drop down it might seem a little bit like magic but it's surprisingly easy to understand and I'm going to show you how it works step by step let's start with the simplest possible UI we can represent in clay which is just a colored rectangle with fixed Dimensions say 960 pixels wide by 540 High to do this in clay we just tell clay that for both width and height it should use a fixed sizing and provide a value in pixels internally the representation for our hierarchy is extremely simple each of our layout elements is represented by a struct which has a size a position an array of other UI elements as children as well as some visual data like the background color and so to draw our simple UI to the screen we just take the data from that one element and call our draw rectangle function with the fixed Dimensions at position 0 0 which is the top left corner of the screen let's do something slightly more complicated let's give this element a child element another fixed sides rectangle and we'll pick pink this time so so the first UI element gets created at the root of our tree and then our second element is added as a child of that first element to draw our UI we can use a similar approach to our first use case we just start at our root node draw its rectangle and then continue on to the child nodes this child also has fixed Dimensions so we draw our second rectangle the same way just remember that the child position is relative so we need to add it to the parent position and we're done now perhaps we don't want our child rectangle to be right up against the edges of our parent rectangle so we can use the padding configuration option padding inserts a gap between the edges of a parent element and the edges of its child elements the way that we draw our root node is exactly the same however when we get to our child node we don't draw it at position 0 0 anymore we add the parents left padding to the X position and the top padding to the Y position and we can see that this is correct offset our child rectangle into the parent let's crank it up a notch I'm going to add a second child element to my root node another fixed size rectangle here's where we start to see some Auto layout features emerging by default clay lays out its child elements from left to right so they don't overlap this time when we're iterating through our child elements we keep track of a left offset the left offset starts off as the parent left padding and then after we draw the first rectangle angle we increment the left off set by its width so by the time we draw the second rectangle it'll be drawn just to the right of the first of course it's quite straightforward to also handle the other possible layout Direction which is top to bottom the code is exactly the same logically we just swap out our data we have a y offset instead which starts as the top padding and we add the child elements height to the offset after we draw the rectangle I like that our outer rectangle has some padding and I'd like there to be some space between my child elements as well the way we handle this in Clay is by using the child Gap property child Gap automatically inserts a gap in between child elements in the direction of the layout so a horizontal gap for left to right or a vertical gap for top to bottom the way that we implement this doesn't require any new Machinery at all when we're iterating through our children after each child when we increment our offset by the child width or height we also add the child cap to the offset the code is exactly the same for both directions the next thing for us to address is the fact that our outer rectangle has all this extra space at the right and bottom this isn't because of padding it's because the outer rectangle has a fixed width and height that are larger than the contents we could experiment until we found an exact width and height to use but I'd much rather let the computer do it for me in clay that's supported by the fit sizing mode which in this case will tightly fit out outer rectangle to the dimensions of its children plus any padding and gaps and this is actually the default sizing mode in clay so I could just emit it entirely this is a bit more tricky for us to figure out how to program we've got a bit of a chicken and egg problem here if we start from the top of the tree as usual when we draw our root rectangle we don't know how large it's supposed to be and our contents might overflow or we might overestimate the size of the contents but if we start from the bottom of the tree and draw the children first we can measure how large they are but then if we draw the root rectangle it'll get drawn over the top and olude the children this property means it's physically impossible for us to lay out the UI and draw the UI in a single pass we're going to need to split our code into two passes over the tree one to calculate the layout and one to draw the layout it might not seem like much but mentally acknowledging that handling UI requires multiple passes over the data is an incredibly important realization let's write the first pass to calculate our layout if we were looking at our original drop- down menu in order to know the size of our root rectangle that everything else is inside we need to know the sizes of its children the menu items and in order to know the size of the menu items I need to know the sizes of the children of the menu items and so on essentially what we're saying is we can only calculate the size of an element once we know the sizes of all of its children which means the only place we can even start sizing is these Leaf nodes that have no children and make our way back upwards what we're describing here is traversing our tree in Reverse breath first order now I know that might seem complicated and intimidating but there's actually an extremely Simple Solution hiding in the code that we already have if we look at the example layout and how we declared it it might not be immediately obvious how this clay macro is constructing our layout tree but all the clay macro actually does is call open element before the children and close element after the children it's literally just for convenience it opens a scope for you and makes sure you don't forget to call close element again that's it if we swap out the macros of the other two child rectangles for direct open and close calls as well you'll see that both of them just get closed immediately because they have no children the reason that I'm showing you this internal implementation detail is because believe it or not the close element function naturally gets called in Reverse bread first order which is exactly what we need to do our sizing calculations let's go through our tree and watch how it works we open our dark blue root rectangle first because we haven't specified any fixed size it starts off as 0 by Z next up we call open again to add our first child because our first child rectangle has no children we immediately call the close element function and you can see how this directly corresponds to the reverse breath first approach we were talking about before an element's close function will only be called after all of its children have closed inside this function we take the dimensions of the current element which in this case we know because they're provided as fixed dimensions and we add them to our parents Dimensions so now our parent fit container actually has some size we do the same thing when our second child closes adding its Dimensions to the parent as well H this doesn't look quite right the width is okay but the height looks wrong and you might already be able to intuitively see why this is the case we're calculating the dimensions of our parent rectangle by adding up the dimensions of the children when we're laying out our children left to right that makes perfect sense for our width but for our height it doesn't let's look at our child rectangles one dimension at a time in the same direction as the layout that is left to right they don't overlap at all so we can add up their widths but if we look at them along the Y AIS we can see that they're overlapping each other this view makes it obvious that in the non- layout Direction the size of the parent should be based on the largest child rather than the sum of the children if we boil this down to a logical approach we can Implement our size along the layout axis is the sum of the children's sizes whereas across the layout axis the parent size is the maximum of the children that is the size of the largest child we can see that if we change our layout direction to top to bottom we can apply exactly the same strategy we add up the sizes along the layout axis which in this case is the Heights and we get the maximum of the sizes of the children across the layout axis which in this case is the width so if we return to our layout our we can see how we need to change our size calculation in close element depending on the layout direction of the parent we either add to the parent size or we take the max of the parent size and the current element size okay our height is looking a lot better but arriving at the end of the layout we're still not quite correct and that's because we've forgotten to include our padding as well as our child Gap in the size of our root element we can extend our Clos element function so that when we add the ele element size to the parent we also make sure to include the elements padding which is left and right padding for the width and the top and bottom padding for the height our container height is now looking perfect it's just our width that is slightly wrong because we're missing the gap between the children the way that we calculate our child Gap is actually very simple and it's related to something called the fence post problem if we have a fence that has three posts we only need two connecting sections of wood in between them four posts gives us three in between sections five posts gives us four in between sections and with just a single post we have no in between sections at all in the same way if we have five elements laid out left to right those five elements will only have four gaps between them as a result rather than having to add up the gaps we can just calculate the total size taken up by the gaps as the child Gap value multiplied by the length of the children minus one this is Trivial for us to implement with a slight complication being that we only add child Gap to the direction of the layout so width if we're going left to right or height if we're going top to bottom we can now finish closing our root blue rectangle and we're done so just to summarize the result of our fit sizing algorithm in simple terms looks like this the size of the parent towards the layout direction is the two padding values along that axis in this case left and right plus the child Gap multiplied by the child count - one plus the combined size of all the children which is just this same approach applied recursively the size of the parent against the layout direction is the top and bottom padding plus the maximum child height that is the height of the largest child these two formulas work exactly the same for left to right layout Direction versus top to bottom just with the height and width and padding values swapped all right we've got our fit algorithm working well and just before we move on I'd like to simplify and clean up the implementation a little bit and also just point out one of the natural properties of this type of UI layout system the first interesting thing is notice how in our new sizing algorithm we don't reference positions at all as it turns out if you're using a flexible box approach like this you can calculate the final sizing of all the elements in the tree totally independent of where they are on the screen you can size all the elements in your tree first and then calculate the positions later this might not seem seem like such a significant distinction but I promise you it is if I have a dropdown like this with Dynamic content and I'm trying to size and position the elements at the same time Watch What Happens I size and position the first three elements in the tree just fine but because the fourth item is wider I now have to go back and change the position of all the previous icons I need to push them over to the right hand side with flexible sizing like this you can't actually know the final position of an element until you've completely finished calculating all the sizes so to significantly simplify our implementation and completely eliminate an entire class of layout bugs we're going to split our layout step into two Computing sizes first and then positions and this is why I mentioned being open to multiple passes we can make life so much easier for ourselves handling one thing at a time the second interesting thing that has popped up here is that we tend to think about user interfaces as expressly two-dimensional but as we've seen building our implementation logically we actually treat both of those two Dimensions exactly the same X versus y or width versus height it doesn't matter what matters is the direction of the layout so rather than having to duplicate the code for handling width versus height we can create a single function that computes the size of an element along its layout Axis or across its layout axis independent of whether we're talking about width or height it might sound funny but when it comes down to it UI is actually mostly a one-dimensional problem not a two-dimensional one you might not remember the function names that I showed you at the beginning of the video but if I bring them up again it's probably much more obvious now what they do for layout related tasks clay generally has just one function that can compute either the widths or the heights of an element depending on the parameters that you pass it so we're done implementing containers that can fit their contents and now we've got a powerful UI layout system already but we've still got lots more interesting work to do a very common requirement in a layout system like this is for a child element to be able to grow to take up all the available space in its parent if we had a layout with a sidebar for example we might also want to have a main content pane that horizontally grows to take up any remaining space in the container clay provides this functionality with the grow sizing mode rather than being entirely different grow is an extension on top top of the fit sizing mode grow containers will still fit their contents at the absolute minimum but will also expand to fill any extra space in their parent so to extend our example we're going to change our outer container to a fixed width to make it much wider we're going to add a third child element and we're going to change the width of this middle child to grow so that it takes up the remainder of the empty horizontal space pushing the third child all the way over to the right hand side of its parent now it might initially be tempting to just put the grow handling into the Clos element function like we do with fit we can size our root because it has a fixed width and then when we're iterating through our children and reach our second child we know how big the parent is already so we can just expand our middle child to fill all the available space right unfortunately no if we did that we would take up all the available space in the parent and there would be no room for our third child which we haven't reached yet so you won't actually know how much free space you have until you've sized the entire tree the simplest and most foolproof way to handle grow containers is just to add another pass over our tree in our first pass we do exactly what we've been doing already to calculate the size of our fit containers and then in our second pass we're going to Traverse downwards through the tree in bread first order and expand our grow containers into any available space so if we're starting at the end of our fit pass our root container currently looks like this because it has a fixed width you can see that it has some extra space over at the right hand side and our yellow container in the middle has a width of zero because it hasn't grown yet let's start with the containers that grow along the layout axis in order to figure out how much space we have available to expand into we can start with the entire width of the root container and subtract exactly the same calculated value we use for fit sizing that is the two padding Val vales the sum of the sizes of all of the child elements and the total gap between the child Elements which uses that fence post calculation as you can see this perfectly gives us back the total remaining space along this axis from there our solution is very simple all we need to do is add that remaining extra space to the width of our grow element and we're done this is a perfect example of how powerful the separation of sizing and position are if we were calculating sizes and positions at the same time we would have needed to push all the subsequent children over to the right but at this point in the layout because all we're looking at is sizes we know that positions will be calculated correctly once in the final pass after we've already finished with all of our sizing now if we wanted our yellow rectangle to also grow across the layout direction that is grow its height we're not going to add up the heights of the children to find the available space we just take the height of the parent we subtract the the top and bottom padding as well as the height of just this element and again that gives us a value that represents the extra space available for us to expand into vertically we've now got something really powerful if I resize my root element the children dynamically resize and move with it this is the beginnings of a UI that will respond beautifully in changes to the size of the application window however we're not completely there with our grow implementation just yet and there are a couple more cases we have to cover in our current example we've only got a single child element set to grow but what happens if we have more than one what if we want both the second and the third child to grow to take up available space how should that extra space be shared between those two elements now this is one of those decision points where there's actually no correct answer before we even get to the implementation people have different opinions about how that space should be shared the way I find to be the most aesthetically pleasing and the way that clay works is that Clay's algorithm tries to ensure that all the children with grow sizing will end up the same size that means that if you have two elements both set to grow and after our first pass finishes their starting sizes are different the extra width in the parent container will be distributed unevenly amongst them the smaller container will grow more than the larger one so that the end result is that they're the same size both taking up half of the available space this isn't always possible possible for example if the blue element was already larger than the entire remaining width all the remaining space would go to the smaller grow rectangle and they still wouldn't be the same size but I've personally found it to produce the most pleasing results in the most cases so how do we actually implement this growth strategy well we want all our containers to end up the same size and so if we break it down into even simpler terms what we're actually saying is that we want to expand the smallest elements let's look at it visually as the smallest element in this container expands eventually it will end up the same size as the second smallest element from that point onwards we can expand both our smallest elements equally until they reach the size of our largest element now that all our elements are the same size we expand all three of them together until we run out of space let's return to our grow implementation we previously figured out how to calculate the remaining width now we just need to figure out how to properly a portion it to the two right-and children this involves two passes over the subset of children that have grow sizing the first pass we find the size of the smallest element and the size of the second smallest element to figure out how much our smallest elements need to grow we just subtract the smallest size from the second smallest size and that gives us how much width we need to add we then iterate over our children again this time adding that width to any child we find that matches the smallest size this ensures that any children that are the same size will get expanded together any size that we add to children we subtract from the total available extra space and after we finished this iteration we still have remaining width to distribute so we repeat the process again this time because both of our grow containers are the same width this inner block of code never runs which means our width to add is just the entire remaining width if we added that to both of our containers it would overflow so we clamp our width to the remaining width divided by the number of grow containers which is two we then add that width to any container matching the smallest width which is both of them which brings our remaining width to zero we now have an approach that can handle multiple growing containers and much more complex layouts but so far all we've dealt with are rectangles and rectangles are an extremely common and important part of UI layout but they're not the only type of element that clay supports next up we're going to handle one of the most common and also the trickiest elements in UI layout which is text whenever you read about text in user interfaces it's very easy to get overwhelmed with all the jargon and edge cases presented like text shaping lies King and anti-aliasing but luckily the majority of the difficulty actually comes from rendering text correctly we're going to keep it very simple by just focusing on the characteristics of text that actually affect layout unlike a rectangle which by default has no intrinsic size if we render some text with a particular font and font size the result will take up both horizontal and vertical space so as long as we have a way to measure the dimensions of some text our current UI layout algorithm still works perfectly If instead of hardcoding the width and height of the outer rectangle I just let it fit to its contents you can see that because the text element has measurable Dimensions the container element fit FS to the text contents just fine this works great for things like button labels but starts to fall apart when we're dealing with large bodies of text like blogs or articles if I try to render a text element with a few hundred words that has no explicit new line characters my text element will end up with a huge width and that will completely break my layout by causing every subsequent sibling element to render off the screen now this might seem like a catastrophic failure of our algorithm but we're actually just missing one small piece which is that we figured out how to grow containers to take up extra space but we never figured out how to shrink containers to fit into their parent if the contents are too large of course if you've used a computer for any significant amount of time before you know that an easy way to shrink the width of our contents to fit inside our fixed width blue rectangle is that we could wrap the text onto new lines there's a bit to unpack so let's start by thinking at a high level about how to shrink elements that are too large for their container we already have a bit of a conundrum here if we have multiple child elements with one fitting to its text and the other two having fixed widths if we go ahead and just naively shrink all our child elements equally will break the size and constraints of our other two fixed width elements we want to shrink our text element and wrap the text rather than shrinking the rectangles that the user has explicitly said they want to have a fixed WID now we could for example say that our algorithm only shrinks elements that don't have a fixed width which would work in this case but imagine if our fixed width rectangle wasn't a direct sibling but instead was one level deep inside a container with fit sizing we would end up shrinking our text in the pink fit container at this level without realizing it would cause some of the contents somewhere further down the tree to overflow so our algorithm here is missing some data what we're expressing here is that the text has a preferential width that it will expand to if all that space is available but it also has a minimum width which is the smallest size that it could shrink down to in order to save space we already have that preferential size and the minimum size of our text element in English might be just the size of the largest single word in the text contents by contrast our fixed width rectangle has the same preferred and minimum sizes so now that we've got our distinction between an element's preferred dimensions and its minimum Dimensions the algorithm to shrink our elements to fit their container is functionally identical to our algorithm to grow elements to take up available space when we shrink our child elements down we want them to end up the same size which means that we're going to start by shrinking the largest element down to the size of the second largest element and continue in the same way until everything is small enough to fit the one extra piece of logic we add here to handle our minimum width case is simply that when we're sizing our elements down if an element hits its minimum width we just remove it from the array of containers that we're sizing down just to really solidify this knowledge let's create a slightly more complex container shrinking situation to solve and go through the whole thing step by step we've got our root element with a fixed size our first child which is just a plain text element our second child which has a fixed size and our third child which is a fit container that has some other text inside it let's walk through our tree and solve this problem we start with our first fit sizing pass Where We Gather the minimum and preferred sizing of our elements our text elements have a large preferred size and a small minimum size and our fixed size elements have the same preferred and minimum size we can make a small change to our close element function here to propagate those minimum sizes upwards through the tree just as we do with our preferred sizes as as we start our second pass to grow our elements our remaining width calculation here for our children is going to come out as a negative value because the contents are larger than the root container and that is a clue given how we saw that shrinking elements uses almost exactly the same strategy as growing elements we can turn this grow sizing pass into one that handles both growing and shrinking and because our shrink and grow strategies are almost exactly the same I could slightly modify this Loop to work for both growing and shrinking but for the purposes of a video demo it might get a little hard to read so I'll just copy paste this code and modify it slightly to handle shrinking so we start our shrinking algorithm with our three children we identify the largest and second largest child elements as the two text containers and then we shrink down our right hand text container to be equal width to the left one our next iteration identifies our two text elements as the equal largest containers and our fixed size element as the second largest so we shrink both our text elements down to the size of the fixed element now it looks like we're done here but there's actually still a small amount of width left to make up on our third iteration all our elements are the same size which means we need to shrink them all equally so we start by shrinking our first text element by a third of the remaining difference then when we go to shrink our second element the fixed size one we can see that it's already at its minimum size so instead of shrinking it we just remove it from the list and continue on to shrink our second text element by a third of the remaining size as a result we now have one final iteration where we shrink both our text elements equally and reach our Target content width however even though we've resized the width of our text elements correctly you can obviously see that the text itself is still overflowing even if the bounding boxes are correct we need a new step in our algorithm that happens after we process our shrinking which is wrapping any text elements that have shrunk now there are lots of different approaches that you can take to text wrapping that vary significantly depending on which human languages you want to support but a common approach is to start by figuring out which character crosses the edge of the element's bounding box and then work backwards from there until you find an appropriate point to wrap which in English would be a space character we then slice the string from that point onwards increasing the height of the text element container by the height of one line of text and just repeat that process until we reach the end of the string so all we have left is to wrap our text elements and then we should be done H this doesn't quite look right what's happened here is that when we wrap text the element will inevitably have a larger height than it did originally which then needs to be propagated backwards up the tree to parent containers if propagating Heights upwards through the tree sounds familiar to you it's because we're already doing that as part of our first fit sizing step the problem of course is that step happens before our text wrapping step which can cause our Heights to change again so what we need to do is to split both of our current sizing steps into separate steps for width and height and defer sizing our Heights until after we wrap our text this means at the text wrapping step our background rectangle actually has a height of zero because it's config to fit its contents and we haven't done our height pass for fit sizing yet I'm also just going to set the height sizing mode of our yellow rectangle to grow so you can see what happens and of course that means it's also going to be zero because we haven't grown our Heights yet either so after wrapping out text we do our fit sizing passs for Heights which gives us the correct height for our background rectangle and the light blue text container on the right hand side we can now continue on to our grow and Shrink Heights pass which can now correctly grow the height of the yellow box to match the height changes caused by the text wrapping at this point we have a very powerful layout algorithm that can represent a significant percentage of the layouts that you would see on the web for example it's just missing a couple of small key features that we can add in very easily the first feature is minimum and maximum sizing which is a classic feature in UI layout to help you control how your UI responds to changes in content size if we take a our original drop- down menu that we were planning to build you'll notice it has a minimum width that it will maintain even if the children are smaller and it has a maximum width that it's allowed to grow to before it forces the menu text items to start wrapping we already have the concept of minimum and preferred sizing underneath to allow our text elements to work correctly so we're going to expose our minimum sizing as something configurable and add a maximum sizing as well there are two places where we need to implement handling for this firstly in our fit sizing passes when we're expanding our parent containers to the size of their children we cap that size to the configured maximum size of the container if there is one the second place we need to handle this is when we're growing elements to take up additional space in their parent and in exactly the same way as shrinking elements where we simply remove elements from our shrink array if they've hit their minimum size we do exactly the same thing for our array of growable elements if they've hit their maximum size size very simple and straightforward and we already understand most of the logic that's happening there now the final part of the algorithm that I'm going to show you is alignment which is often used to Center elements inside their parent container alignment in clay can be provided separately for each axis with a combination of left Center and right alignment for the x-axis and top Center and bottom for the Y AIS now because alignment is entirely to do with position and not to do with size at all we're going to handle our alignment right at the end at the same time that we're calculating our positions alignment is actually a very straightforward little calculation and as with most other things varies depending on if we're aligning along the layout Axis or across the layout axis if we're aligning along the layout axis for example centering the X alignment of the children of a left to right container we do the same classic calculation to find the remaining width of the parent not taken up by the contents the padding or the child Gap we then take that extra space divide it by two to distribute it equally on the left and right hand sides of our content and then add that divided difference to the X offset of every child element which will push them all into the center of course if the content is the same size as the container we'll get a difference of zero and the elements won't move at all our strategy is slightly different if we're aligning across the layout direction if we take the same container laid out left to right and want to Center align our elements vertically you can see that unlike our X centering where we move all the elements by the same amount each of these children can have a different y offset but the approach is actually very similar we simply calculate the remaining height for each child individually by subtracting the padding and the child height from the outer element height this will produce a different alignment offset for child elements with different heights and you might already be able to see this but if we wanted instead to align these elements to the right or to the bottom we would just skip dividing the remaining size by two and add the entire difference to the top instead it really is one of the most straightforward parts of layout assuming that is that you finalize all your sizes before trying to approach alignment and now to really pull it all together we're going to lay out that nice context menu that I showed you at the beginning of the video because we've got all the tools that we need first up we create our root element an empty purple fit container if we create our child menu items now they'll be laid out from left to right so we can switch that to top to bottom let's give our menu items some padding around the edges and the same size gap between the children now I want my menu items to all be the same width so I'm going to set the width sizing to grow so they take up all the available space and you can recognize that these are growing across the layout axis which is top to bottom I want our icons to be over on the right hand side so what I'll do is create an invisible container around my text label and set its width to grow so that it pushes the icon over to the right hand side I'll also add some horizontal padding inside my menu items to make them look a little bit nicer and rather than adding vertical padding which could result in the menu items being a different height I'll set the minimum height of each menu item to 80 this is looking better but our text and icons are still in slightly the wrong place so I'm going to set the Y alignment of the menu items to Center we're almost there but that comment icon is a little bit too close to the text so I'm going to give each menu item a child gap of 32 pixels to push those apart this is looking great but I just like to make sure we can handle changes to the size of our content gracefully so I'm going to set a minimum width on our root element so that if our menu text labels are all short the menu doesn't end up too skinny and I'll also set maximum width so that if a menu label is too long it will wrap to the next line as one final little tweak the dictionary menu item is looking a bit cramped vertically so I'll just add some vertical padding to the menu items and we're done not only do we have a great looking flexible context menu but you would also be able to explain to me how every single element in this UI ended up at its correct size and position this of course is just a small window into how clay works the core layout algorithm is a piece of a larger puzzle this might sound like an odd thing to say but I hope armed with this knowledge you might decide that you don't even need to use clay at all building an extremely powerful and flexible UI layout algorithm is actually very straight forward once someone explains the tricks to you and I would really encourage you to just have a try at implementing it yourself from scratch it's a lot of fun good luck
