transcript: '{"content":"\n[0.0s] Last year I was friends with benefits\n[1.24s] with this guy for a couple of months and\n[3.12s] because we were friends with benefits\n[4.16s] there was a level of like just emotional\n[5.6s] support, emotional intimacy. During that\n[7.32s] I started getting thoughts of like, do I\n[8.68s] have feelings for him? Do I want to be\n[9.88s] with him? And it got really distressing\n[11.28s] because I was I went into it with the\n[12.56s] intention of only being friends.\n[13.84s] >> So when you were in a situationship with\n[15.64s] this person, would you guys cuddle, hold\n[18.4s] hands, or spend the night?\n[19.72s] >> Cuddle, yes. Hold hands, kind of. Spend\n[21.52s] the night, no, but we had fallen asleep\n[23.08s] together like once.\n[24.12s] >> Yeah, so so when you do those things,\n[26.68s] that will activate a certain form of\n[29.08s] emotional bonding. When we fall in love\n[31.56s] with someone, we crave them, we pursue\n[33.56s] them, then we engage in a physical\n[35.6s] relationship, then we end up cuddling,\n[37.48s] so then all the signals come together\n[39.64s] and that''s what we call love. So the\n[41.44s] four questions I would ask yourself\n[43.0s] going forward is, do I crave this\n[44.84s] person? Do I feel connected to this\n[46.76s] person? Does this person elevate my mood\n[49.76s] and lower my anxiety? And would I be\n[51.96s] willing to take a bullet for this\n[53.12s] person? And if the answer to all of all\n[55.28s] four of those questions is yes, that is\n[57.64s] probably the best back of the napkin\n[60.2s] equation for whether you know whether\n[62.0s] you''re in love. Sustainable, complete\n[64.28s] sense of love.\n[65.12s] >> That makes a lot of sense.\n[66.12s] >> Yeah, thank you so much for coming.\n[67.6s] >> Yeah, thank you."}'
