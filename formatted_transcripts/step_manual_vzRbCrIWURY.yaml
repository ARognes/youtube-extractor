e\n[108.189s] Nietzsche believed that the higher man must impose order on his internal Chaos\n[112.54s] This is his life''s mission\n[115.0s] To become master of the Chaos one is.. that is the grand ambition here?\n[122.11s] because he suffers so deeply from the Chaos that he is\n[126.1s] there exists the possibility that the higher man will evade his life''s mission\n[129.489s] and instead, seek out the comforts of mediocrity Via conformity\n[134.79s] Nietzsche postulated that within every individual exists a herd instinct that is\n[139.92s] an innate need to obey and conform to the masses\n[142.89s] Individuals satiate this need by obeying the accepted morality that is the designation of what is good and what is evil of one''s culture?\n[151.02s] Morality is the best of all devices for leading mankind by the nose proclaimed Nietzsche in the antichrist\n[156.72s] Such a morality since it is accepted by the masses Nietzsche called herd morality\n[162.84s] Nietzsche maintained that herd morality serves a clear purpose, it instills in mediocre individuals the conviction that their weakness is not a fault\n[170.99s] but instead strength\n[172.86s] Verily I have often laughed at the weaklings who thought themselves good because they had no claws Nietzsche wrote and Thus spoke zarathustra on\n[181.17s] The other hand herd morality maintains that those qualities which the herd lack are evil as Nietzsche put it\n[200.9s] Therefore with herd morality as Nietzsche amusingly quipped the sheep gains in respect\n[208.3s] Since sheep-like qualities are championed by\n[210.02s] herd morality as being good herd Morality pressures individuals into becoming good that is weak and obedient the higher man\n[217.66s] If he is to achieve greatness must escape the clutches of herd morality\n[222.08s] and renounce it in favor of his own self created and life-affirming morality\n[234.0s] In order to escape from the herd and live according to his own life-affirming morality\n[238.08s] Nietzs