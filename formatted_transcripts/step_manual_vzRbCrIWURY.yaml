n object of meaning to life that an individual can come to know\n[395.94s] Nietzsche believed that not only was there no object of meaning to life\n[399.24s] But he claimed that truth does not exist\n[402.16s] and therefore objective knowledge about anything\n[404.66s] including the meaning of life is an impossibility\n[407.88s] Instead, according to Nietzsche an individual is always confined to know the world\n[411.88s] through ones own personal interpretation  of it\n[433.52s] Since one cannot escape from one''s own personal\n[435.86s] interpretation or perspective of Life\n[438.1s] Nietzsche understood that one should give up trying to search for the truth as there is no truth and\n[443.36s] Instead paint a picture or in other words, interpret existence in a way that is life-promoting\n[448.89s] For in doing, so one will be able to escape nihilism by creating meaning in one''s own life\n[454.92s] Since Nature realized that the deepest question which confronts man is why do I suffer?\n[459.46s] He understood the desperate need to first and foremost\n[462.12s] interpret suffering in a manner which would be life-promoting\n[466.34s] Through his analysis of his own suffering\n[468.6s] Nietzsche came to understand that pain is not considered an objection to life\n[473.36s] Instead, Nietzsche believed that a life without suffering and pain would be a miserable life\n[478.06s] for he believes suffering to be a precondition of greatness\n[501.3s] With the knowledge that with great suffering comes great advancement\n[504.81s] Nietzsche understood that the higher man would be in need of an ideal or a vision of perfection\n[509.43s] To keep him motivated in his quest for greatness even in his darkest hours\n[514.1s] Nietzsche invented the overman as such an ideal\n[524.24s] the overman as an ideal\n[532.2s] and Thus one who Soars above the rest of and kind\n[535.58s] Since ideals can be approached but never realized on this Earth\n[539.16s] Nietzsche maintained that\n[542.9