 answer the question Can software engineers also be considered real engineers? How AWS used TLA+ and overview of how Amazon found a rare bug inside of DynamoDB using this formal specifications language. A deep dive into property-based testing [music] and why this is a middle ground that most engineers should probably adopt and many more. If you want to understand more about formal verification and get a sense of where this approach could go mainstream with AI, this episode is for you. In today's episode, we'll get to the question, does it make sense to use formal methods to verify AI-written code? As a spoiler, the answer will be proper formal methods are an overkill for this, but lightweight formal methods can actually be helpful. This is where I need to mention our presenting sponsor, Antithesis. Antithesis verifies your system correctness by running your whole system in hostile simulation and finding bugs. It does this by using approach called deterministic simulation testing or DST, which AWS distinguished engineer Mark Brooker and Ankush Desai have described as lightweight formal methods. Setting aside Antithesis for a minute, if you as an engineer want to get more serious in verifying that your system works as intended, your best bet would be to use lightweight formal methods. Now, back to Antithesis. Antithesis turbocharges testing by running your whole system under aggressive fault injection. Imagine Antithesis as hundreds or thousands of versions of the Mario game running, each instance aggressively trying to break the game with increasingly weird input combinations. With Antithesis, you can specify properties at the whole system level and Antithesis will actually try to disprove them, so you can be confident that if your system holds up in Antithesis, it will hold up in production. There's good reason teams like Jane Street, Fly.io, and the etcd community rely on Antithesis. Head to antithesis.com/pragmatic to learn more. So, hello. Welcome to the podcast. Thank you so much. I'm really excited to be here. It's so nice to have you here. I was curious, you're very well known for formal methods for programming, for for logic, for all of these topics, but how did you get into tech? >> So, to start, I never really saw myself as a technical person. I liked computers growing up and I did a tiny bit of programming. My father was a programmer, he taught me Visual Basic. But, I always wanted to do physics and math. That was like my dream. I put in my college application, I want to listen to the harpy to the universe. Don't ever take advice from like a high schooler for writing, just just saying. But, after about 3 years of doing this in college, I realized that I kind of like the idea of physics, but I didn't enjoy doing it, and I couldn't see myself doing it for 50 years. What part I did enjoy though was the programming in the labs. That was the most fun part to me. So, I thought, well, if this is what I enjoy, why don't I try to do it full-time? So, after college, I left for San Francisco and became a developer, a Ruby on Rails developer in education technology. After some time, I went to Chicago, and then in the course of the next job I was working in, also in education technology, I fell into my current niche, which is formal verification and formal methods. >> The first time I came across your writing, because you you you write a blog, a pretty regular one, and I I really enjoy your writing. The first time was with the crossover project. This was a project where you attempted to answer, are we as software engineers actually engineers? >> Yes. >> Can we talk about this project? >> Absolutely. So, I guess I should probably start with the motivation. Which was I've read a lot of books on software, and I've read a lot of online articles about software. And one of the favorite things that software developers do is argue about whether it should be engineering or not, right? And there's the camp of people that say, well, we don't deserve to call ourselves engineers, we should not. They are so far above us, we shouldn't even like consider ourselves in the same space. And then there are the people who are like, what we do is so special and so unique, engineering doesn't have anything on us. They can't hold a candle to what we do. You see books like software craftsmanship, which talk about how like, oh, engineering is this really boring, slow field, and software is this incredibly creative, special, wonderful thing. I was very firmly in camp one. I thought we were not engineers, we didn't deserve to call ourselves engineering, anything like that. What I do for work is really carefully analyzing software systems, and I thought, ah, this is real engineering, and everything else is not engineering. Then I found this talk by Glenn Vanderburg, where what he did was he read a bunch of engineering books and compared them compare them to what we do in software. And he said, "Actually, this looks really similar to what we do in software." And I thought, "That can't be right. I need something more rigorous. I'm going to have to talk to people who did both engineering and software development and see what they say." And they all agreed with him. So, I was wrong. We're engineers. >> Can we go a little bit into >> So, as I started talking to the first people, I realized that this was a much deeper project than I ever expected. And I decided I needed to have as comprehensive a look at traditional engineering as I could possibly get. There are many kinds of engineering. There's not just building bridges, but there's designing circuits, there's figuring out chemical processes, there's industrial engineering, which is figuring out the layouts of factories and how we organize kinds of labor. There's just so many different kinds, and I wanted to see every single kinds of view into what engineering looked like to compare them all to software, which when you think about it, when we say like, "Oh, software's like building a bridge." Maybe it isn't, but is it like designing a circuit? Is it like figuring out a chemical flow? Maybe those are much more closer to the kinds of engineering we do. I needed to know. I think in the end I talked to about 15 or 20 people in total across about six or seven different fields. >> And what were the similarities that you found that software engineering has with either specific types of engineering or across the the board? >> If I had to summarize what I found in general, I'd put it like this. Everybody hates waterfall. >> No way. >> The core tension of engineering is between how expensive it is to make a mistake and how quickly you can iterate. The faster you can iterate, the less planning you need to do before you iterate, and the more expensive it is, the more planning you need to do. That's why, for example, when you're building a building where you can't like build it multiple times and see what happens, you have to do a lot of planning up front. But even then, you're looking for ways to iterate on the plan. You do things like build scale models, you software to simulate the building, you do like CAD models, etc. And in other fields, like in for example electrical engineering, you have the ability to come up with a design, test it, and then throw it to the fab and get something back. So, they will iterate a lot more than civil engineering does. >> Uh interesting enough, I heard the term smoke test originated from electrical engineering actually. >> I did not look into that, but I could believe it. >> Yeah, apparently it's when you have a a test circuit and you just hook it up and if it does if it smokes, it's already bad. >> That is very interesting. So, even within engineering, when we say traditional engineering, there's just layers of engineering or differences, right? >> Layers of iteration, I'd say. One of the first people I talked to was actually a mining engineer. He designed mines deep underground to make sure that they were stable and didn't like leak toxic chemicals. And the first thing he pointed out to me was that they had their Agile revolution in 1960. They called it, I believe, the Viennese Viennese tunneling method as a way of really quickly iterating through building a mine and tunneling through rock. Basically, making the changes as fast as they could, seeing how the rest of the system reacted to it, and then of course correcting based on that. >> Okay, so I guess we we all hate waterfall. >> hate waterfall. >> Or the idea of waterfall. >> Yeah. >> What are some of the interesting differences that you came across either where engineering is ahead of us or traditional engineering has, you know, does have things on us which you were hoping to find or places where actually software engineering is ahead in some ways? >> There is both differences in how we practice it, but also differences in the shape of our material. Because every engineering concerns a different material, they have different constraints. While it's true that everybody tries to iterate as fast as they can, often turning to software to do that, software is the best at it. The best comparison is chemical engineering where I talked to people saying that they would set up their experiment, run it overnight, and get the results the next day, and that was fast. With us, we can basically press F11 and get the result, right? And that allows us to basically iterate much faster than even those fields can. I think we all kind of know this. One thing that we might not realize as software engineers is is that our work is a lot more consistent than other fields. The example I always do sometimes cuz I've given a talk about this is I would pull out like a CPU chip or like a stick of RAM and I'd say like, "Hey, here's the spec sheet." And if you look at the spec sheet, it says, "This resistor has a resistance that is within 20% of 100 ohms as long as you keep it between 20 and 50° C." So, they're basically saying that if they make a thousand of these, there's going to be a variance of 20% across all 1,000. And the only way to know is to test them. And then if you run it for too long or you heat it up too much, it's going to change again. With software, assuming no like CPU bugs or anything like that, the same program, if it runs on this computer, it'll run on your computer, exact same. Sort this list the exact same with this sorting algorithm. >> Does this also mean that we might not account for variability as much as other engineering disciplines do? >> I'd say so. The variation that we have is kind of of our own making, right? We're basically saying, "Okay, we've got all these different systems, all these different APIs." versus other people who are like, "We have all these different chip sets, we have all these different like cores or sizes." But also, if you happen to touch like an iron screw to a tungsten screw, they're going to cause corrosion between the two of them. And also, some of your screws are a little bit too bigger than others and some are a little bit smaller than others and some are a bit longer, etc. >> And how did you see the similarities or differences of software engineers, for example, often interact with customers, with end users who use the software. In other engineering fields, is this also a thing where as an engineer you will talk or know your customer or just not knowing them at all? And I think it depends. Because different engineers that I talked to had different experiences. Some said that they felt that with software, they felt much closer to the customer. With other ones, they said they felt much further. So, I think it's hard to really tell there. One thing I remember vividly is a difference that you pointed out which was very different and almost makes software engineering a bit higher status or better place is open source, the concept of open source. >> Yes. So, that is one thing that seems very special about software versus any other field. Like, the reason I'm here in Hungary right now with you is because I'm going to be speaking at um Craft Conference, right? >> Yeah. >> Most other fields of engineering or in fact any other field of like human labor has two kinds of conferences, academic conferences where they talk about research and trade shows where they try to sell or vendors try to sell to like companies. Software is kind of unique in having the third kind of the practitioner conference where we are just meeting to get better at what we do. We also are really the only kind to really focus heavily on like open source in making our knowledge freely available. For any language, you can probably find out how to learn that language online, right? You don't have to buy a book. You don't have to like talk to the vendor to learn it. That's something really special about software. >> I wonder why this might be both the the fact that we do share a lot of the information or the craft or how we build things. Even some of the largest companies, they I think of like an Uber or Airbnb, these are hundred billion dollar companies, they will not particularly hide how they built that piece of software. Uber publishes and does talks about their app that is used by all these people, how exactly they built it or approximately. I wonder why this became unique in software and in the rest of engineering. What does the rest of engineering have to lose with it or or or what did we do >> to get here? I'm going to switch to speculation for a second. This isn't something that I could really speak on with full authority, but my guess is that part of it is cultural, but another part of it is that the material we work with is the same as our product, right? We are using software to write software versus using tools and lathes to build things. We're using software to design circuits. And I personally think that that similarity, basically that we are using the same materials in both ends, is what makes it so much easier for us to talk about things like open source. >> Interesting how I I like this thinking of of materials used in each engineering and how our material is software itself. Of course there's hardware engineering and and we know that's a bit different, of course. But already there's a divide between hardware engineers and software engineers and how they how much they share, how much we know about them, and so on. >> I kind of wonder I've got some friends who do like 3D printing and it seems like and I haven't looked into this, but it seems like they also have like a very open space of like sharing things freely. I wonder if that's the same because it is so easy to share and because like the unit of value is the schematic there, if that kind of leads to the same thing. >> I also wonder if hacker culture might play a thing in places where it's easy enough to afford to get started on a thing, for example, ham radios, which is not engineering, but there's a thriving community where they share the setup, the things, they they they talk with each other. Small electronics might be. And then but ultimately software started in the what, '70s when it was affordable and anyone could buy a computer. Maybe the internet. I'm also just speculating. >> Yeah. Definitely something worth doing a follow project on, right? >> Yeah, well, you've already spent a bunch of time on it. >> me so many rabbit holes. There's already too many rabbit holes in my life. >> One more thing that you brought up is version control and the and the the fact that in software we just take it for granted, we have version control everywhere, and you said that this is super unique across most of engineering. >> Yeah, I interviewed like 20 people on this. I think all 20 mentioned version control as the thing they wish they had in their old field. >> Wow. >> Yeah. Now, to be clear, they do have things like change management in like other fields, but I think version control as we have it is so much more sophisticated than anything they have. It's like comparing like a modern car to a Model T. >> What do you think there are things that now having talked with so many people I've learned about the different engineering cultures like actual charge technology and cultures, what could we learn from them? What are some kind of inspiration that might be useful here or there? >> Yeah, this is a harder question because while everybody I talked to mentioned those two things of openness and version control, I got a much more scattering set of answers when talking to people about what we could learn from their old fields. The two things I kind of gleaned out is that one, while we are a lot better at iterating than other fields, we're worse at the planning part. Like we still need to do some kind of planning before we iterate and we just aren't as good as those other fields. In part because we can get away with not doing it as much, but we could get some sort of fusion of the two and get even better than we currently are. Which hey, plug for what I do. The other thing that I think is more interesting in terms of being a bit more shocking to me is that while we're better at being open about all of our materials, we seem to be worse at compiling information about the specifics of our job. And that's a bit loosey-goosey, but the example I keep coming back to is that one of the engineers that I talked about two favorite books, The Design of Everyday Things, which he recommends every engineer read, and The Snap-Fit Handbook. Are you familiar with snap fits? >> No. >> Looking around here to see if there's like one if I could just show it, but like you know like how remotes they have that little clicky thing in the back that you use that hold the battery in? >> Yeah. >> That's a snap fit. >> Mhm. [clears throat] >> It is a physical device that basically clicks into another device to keep them fused. And this was a 500-page book all about snap fits, their engineering, appropriate shapes, materials, etc. And that kind of compiling of information about the materials is something other fields do that we don't do. An analogy that I would think of in software would be something like a 500-page book on how to version an API. >> We could all use that. >> Yes, we could. >> And and we don't have it. >> We could learn it from engineering. We should have that. >> You started this project asking, are we really engineers? And your personal inclination, which you didn't say at the time, was that we're probably not. In the closing of this series, you said you're still a bit unsure of how to answer it. This was 5 years ago. This many years later, what is your inclination? Are we actually engineers? >> I think so. I think this project and writing about it and thinking about it has firmly moved me from the camp of we are definitely not to we probably are. I do want to caveat that that I wrote this before LLMs were a thing, and this has probably changed our field as we know it, and it's probably also changed those other branches, and I don't know how. So, that could have changed the calculus between two spaces, but as of now, I think executing LLMs and how they're changing things, what we do now is very similar to what those people in those other fields did, according to my interviews. >> It's It's such a cool project, and it's still a very good read. I'll also link it in the show notes below. I I do recommend going into it. So, let's talk about formal methods. How did you get exposed to them? And for those of us who are not deep into it, what are they? >> I'm going to give you a function max, right? Which should, given a list, return the largest number. What would be a test you'd write for that? >> I'd I'd write a test that I do a list of like two items, it returns the the largest one that I know. I give a very long list. I I try to stress test it. I I I give a list where I give like similar numbers. I try to come up with some edge cases. I'll I'll probably write like five tests. Try to think about integer overflows potentially, try some tricky ones. Maybe I'll take it to maybe eight if I'm feeling super ambitious, and then I'm done. >> Okay. So, we take one of those tests. How do you know what the right answer is supposed to be? >> I just know because I have a I learned maths, so in school I I know which which number is bigger, honestly. I I look at it. I have this, I guess, ingrained knowledge. It feels very basic knowledge that I don't even have to explain. >> Right. You have some ingrain knowledge you don't have to explain, such that you can look at say the max of two and three and know it's three, right? That's interesting. There's some sort of implicit mechanism in your brain that can see that and know what the function is supposed to do. Step one of what I do with formal methods is asking, can we take that implicit knowledge and make it explicit? Can we figure out what a function is supposed to actually be doing and write that down in a way that can be shown to anybody? So, I would basically in this process say like the max of a list is an element that is in the list such that every other element is smaller than that element. That is the way that we can formally say what the maximum of list is. So, that's part one. Just learning how to look at functions and say like, okay, I know what this is doing. How would I explain what this is doing in a way that is clear and unambiguous? Then step two is asking, every single test you've written is basically some facet of it is an element of the list and it is the number in that list such that every other number in the list is smaller than that. Now that we have that, what's the best way to show that our function actually satisfies that specification? Tests are one way. Those are basically taking individual values and showing how those conform to specification. Types are another way. We could basically say like, okay, in every single case we are putting in a list of elements and we're getting out a single element. So, you have to make sure that every time we call it, that's what's true. So, basically the coming up with the the properties of the thing, like what it actually is is is the specification of it. And then showing the function matches that specification is the verification. And what formal methods ask is, can we use mathematics to show that it works not just for the cases that you asked for, but every single possible list you pass in? And that is done through proof. Coming up with some sort of mathematical argument that this code matches this spec. >> And then in proof, again from university, I still remember that the maths proofs were we would prove an an you do rigid transformations. You know what you're allowed to do. Sometimes you can bring in tricks, but those tricks are also inside of your rigid list. And every time, you know, you typically start from a complicated equation, and you keep changing it, and in the end you you shape it in a way that it's now trivial, or or you transform though those are one of the proofs we do. Is Is this what formal methods also does to some extent? Yes, but >> You know how to basically add two tangent numbers by hand, right? Do you do that by hand, or do you just use a calculator? >> I now use a calculator. If it's easy enough, it might I use my brain as a calculator, otherwise I just punch it into the calculator. >> Yeah, so similarly, a lot of formal methods that map and transformation, while you can do it by hand with like what's called a theorem prover, often in industry that is being done for the most part with tools that basically automate huge parts of this process. So, you don't have to do every single transformation yourself. You can, for example, say, "Okay, we have these things are true at the beginning. I want this to be true at the end." And can you figure this out? And they'll be like, either yes, I can prove these things match, or no, I need a little bit more help. And they say, like, "Okay, at this point, I'm going to also let you know that this is true." And they're like, "Okay, I can verify that's true." And it helps me get to the end. And you just keep doing that until you actually have enough that the computer can do the proof for you. >> Yeah, so with formal methods, this I mean, this sounds all logical. I think it's easy easy to follow. In practice, what techniques, technologies, tools does the industry use the tech industry use to actually prove that, you know, some some softwares works? >> To get to that, we need to ask another question. Why isn't this being done for everything? >> Okay, let let let me ask that question. That's a good question. Yeah, this all sounds sounds sensible. It would be nice to not have to write out those five or eight tests. And I know that those tests might not cover all edge cases. Been there, done that, where you miss and I I didn't think that I didn't do a formal proof. I thought, like, well, I missed a test case. That's on me. Sorry. Let me put in that that test case. I now have nine tests and now I go and think I did a great job. Why are we not doing formal testing for everything? >> Instead of finding the largest number in a list, why don't we try to find the file in a directory that has the most lines in it? >> Well, now I'm thinking of writing a program that in kind of an imperative style, it goes through a for list each each file, I list how long the the lines are, I count the lines. I cannot tell this easily. >> Okay, are we talking about ASCII lines or UTF-8 new lines? What happens if one of the files you know the file permission is to read it? Should you basically ignore it or should you say, "Hey, my proof my my um function might be wrong." >> You're now kind of trying to confuse me. >> the what if one of the files is a shortcut to another file? What if it's actually a directory? >> And you're now similar >> it's a binary? >> You're now simulating real world. >> Yes, and that's the problem we have is that when you start talking about like most interesting domain problems, you have to pull in so much context that basically even writing what the function is supposed to do becomes a nightmare. The imperative program you write that will get correct 99% of the time is probably good enough to use in almost all cases. And if you want something that works in 100% of the cases, you've got to figure out, "Okay, what file system are we using?" You have to figure out everything. >> Yeah. >> And that's why it's not done. [clears throat] >> And base it would just not be practical. It would be for the for 99% of people it would be, "Why are you wasting your It's like premature optimization, right?" >> Yeah, especially when as you say, writing 10 tests might get you most of what you need. >> What are practical technologies that you have seen used in some part of the industry that even though they will I'm assuming will be somewhat heavy weight cuz it sounds like pretty heavy weight. It might be the return the return on investment of using this heavyweight stuff is worth it that teams in the industry are using it today. >> Right. And here we can basically start to break this down to different parts of the landscape. So, one part is to look at the stuff that actually does need to be verified to that degree. And the usual term here is nukes and NASA, like nuclear power plants and like um NASA, but I can tell you with first hand experience nuclear power plants do not care about this stuff. They're actually just fine with with with thorough testing. It's okay. Okay, so then category two is like really focused cores of programs where they need like one specific part of the program to be like really verified and the rest of it they can use informal methods. And this is usually things that are like um small parts of databases or like cryptographic primitives. I believe that the HTTPS stack in Firefox is verified as part of something called Project Everest, but I might be getting some details of those wrong. >> Would an operating system kernel fall into this or maybe just a very key specific part of a kernel like memory allocation or something like that? >> Yeah. Parts of them as operating system kernel are good uses for this. Um a couple examples I can think of is I believe Microsoft used some formal verification of parts of their Vista kernel for the driver loading. Famously, there is an operating system called seL4 that has been end-to-end verified in a language called Isabelle. It's a microkernel. It's very small. It's mostly used for um automotive and military applications, but it is a fully verified operating system. With a caveat meaning that it's matching the specification. So, it might do the wrong thing, but of the things that you specify that it has to do right, it will do those specific things right in the right circumstances. The last category is the kind I work in, which is asking, "Okay, what if instead of verifying the entire real-world system, which is a nightmare as we just discussed, we create a simplified version of the system and verify that? Then the actual system might still have bugs, but we can iron out the issues in the abstraction such that we don't actually build them in the real system." >> And and so that that's a topic where you are planning a system and you want to stress test it to iron out >> Yeah, stress test the plan. >> What what kinds of plans would these be roughly? Is it planning like again a database or or some sort of distributed system? >> In my work, it's mostly been um databases and distributed systems for technology companies, but I've had some other like interesting gigs. Like I've had one gig that was involving formally verifying um firmware of a device kernel. And one honestly one of the coolest projects I've ever worked on was on verifying the transponders of a train system to make sure that they wouldn't cause problems to trains going over those transponders. That was a lot of fun. We found a really old bug in that one, too. Th