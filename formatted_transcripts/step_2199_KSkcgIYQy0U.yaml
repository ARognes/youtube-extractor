his all makes sense to me. I thought this is it cuz we're saying all of the parents can access it. I'm assuming the bug, if if there is one, is it will it might have to do with something that we talked earlier of like accessing in certain areas. No idea. Can we run it? >> Yes, we can. So, this was actually made in earlier version of Alloy just for just for context. Um Alloy did not have any sort of temporal reasoning over state up until about 4 years ago. So, this is one example I used from before that of basically how you can analyze and find bugs in static configurations. In Alloy, that often means finding bugs in data structures or in data models and domain models actually. So, there's actually some interesting there's some interesting this in the in the domain-driven design community I found. I'm going to copy this over to Alloy their IDE, which is a bit more rudimentary and that's why everybody uses the VS code. Now, if I execute this, here's the counterexample. >> Okay. >> And this is one of the nice things about Alloy specifically is that it can generate like um visualizations. So, basically, here's the problem. We have a user who can read a parent resource. The parent has a child. Because of how we defined um can access, we can read its parent, so we can read the child. >> Yes. >> The child has a grandchild. We cannot read the grandchild. So, because we are not in we are not assigned to the readable by for the child, only the parent. In other words, readable by is not transitive. So, we can read the child, but not the child's children. And that is the bug. >> Mhm. And to visualize this for us. >> Yes, which is quite nice One of the reasons why people really like Alloy. >> Nice. >> It's a bit worse for modeling like distributed systems though, which is why most of my work is in TLA+ >> And then to do the fix, what would it involve? We would need to give access to the children's children. >> Yeah, there's a few different ways that we could fix it. And often li