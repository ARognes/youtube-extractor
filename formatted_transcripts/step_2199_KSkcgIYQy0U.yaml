t I I don't remember whiteboarding on concurrent system. I remember whiteboarding just boxes and and and and imperative. This a flow charts are good for whiteboarding. >> So this is something that I've wondered a lot, right? Like why it's hard for us to deal with these systems. And I'm not sure it's because it's hard for us to think about them. I mean like when you cross the street, aren't you working with concurrent system? You're just just cars everywhere. They're going to hit you. You're going to die if you don't model concurrent system in your head. And there was actually this really cool paper I found called Comma Sense Computing where some people were trying to figure out like how people thought about concurrent systems. When talking with like sort of like high school and college students, they changed the concurrency problem from like, "Hey, we've got these threads doing some operation." to like, "Hey, we've got these like clerks at a ticket office assigning seats at a concert." People saw the bug much faster. So, I do think we can actually get quite good at seeing concurrency issues. I think a large part of the problem of why it's hard for us is because you don't get a lot of practice. Usually when you have a race condition in a system, you find out months later and then you try a fix and you find out weeks later after that if the fix actually worked. Whereas with the TLA+ like I write my model of the system and then I click a button and it immediately tells me, "Hey, race condition." And then you fix it and it says like, "Hey, timeout bug." And then you fix it again and it says, "Hey, TOCTOU bug." And that feedback loop ends up being so much faster than you get in practice. And I think that more than anything else helps people find race conditions more easily and think about problems in distributed systems more easily. I've found personally that when I work with new clients and we're modeling their system, I usually have no idea how their system works, right? Because they're the domain experts. I just have noticed really weird, funky language made 30 years ago. But once we actually have the model, I can see the bug in the model much faster than they can, even if it's their system. Simply because through I've had so much more practice with it. And I think that's the main change in how it affects people's ways of thinking about distributed systems. It gives them actual practice in seeing how the systems can go wrong so much faster. >> I wonder if it's a little bit like refactoring and also migrations. So, refactoring a code base when you are starting out as a developer and you need to do a refactoring by by hand, you know, let's say just changing a function name and then you need to go and change all the references of that function. And the first time you do it, you change it at a few places and then you forget about the rest and either it's a compilation issue or if it's a dynamic language, it's a another problem. But then you get good at it once you practice. With migrations, most engineers that I've seen are terrible at migrations because you need to make a plan, you need to do check, you can do shadowing, reverse shadowing, all all that funk. And then there are a few engineers who have done three or four or five and then you they close their eyes and and they can just do it. >> Yeah. >> I'm just thinking that when it comes to race conditions, most of us I I I was exposed to race conditions by oh, we did a double charge. That one and then we found the race condition. But I I never did a second one. Like so I so I I I I will not be good at finding race conditions. I I'm not even good at thinking about them. >> I think it's right on the money. >> It It sounds like you coming into teams or or or to these clients, it you at least give them some practice at the very least of of how to think about this category of errors. Even assuming that the to taking out even the tooling itself. >> I think there's also like more subtle