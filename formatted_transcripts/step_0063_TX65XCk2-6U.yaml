transcript: '(folk music) - Hello, friends! And welcome back to our series on the story of Dwarf Fortress. - [Danny] In the first episode, we talked about the pre-history of the game and in Episode 2 we focused on the 16-year period in which the ASCII version of the game was being given away for free. Today, we''re gonna talk about the process of bringing Dwarf Fortress to Steam. A journey that would require them to re-haul fundamental aspects of how this game was presented. Namely, the graphics, UI, and audio – all while retaining its complex systemic core. And we''re also gonna explore what happened in the exciting hours, days, and weeks after launch. But before we get to the exciting ending, to get the game on Steam, Zach and Tarn were gonna have to do something that they were, historically, not very good at: Asking for help. (ambient music) - [Tarn] This undercurrent of putting Dwarf Fortress on Steam has been there since I met game industry people, ''cos they''re all kinda like, "You could just put this on Steam "and it''ll change your life. You should consider it." When we actually had the health problems strike, and stuff we were like, "Okay." We had this bug, y''know, planted in our head about this stuff that we do have this road out, right? But how do we actually do it? ''Cos we''re not gonna hire anybody. We can''t do that. That requires knowledge about business stuff, paperwork, becoming an actual independent developer, er... Things that... This is... People we know do this stuff but we don''t do this stuff. And it seems to be a thing that requires some skill and knowledge, and being like, an actual person that does this kinda thing. - I first learned about Dwarf Fortress early on in Kitfox''s life, erm, just as an oddity that a friend of mine was really enthusiastic about. He taught a Saturday workshop, for six hours, teaching me and other friends how to play Dwarf Fortress. Honestly, I didn''t boot it up again, er, after that because it was just... The cognitive load of, of trying to remember how to enable the mods and how to play the game, it was just a little bit too much of a barrier, for me. We also had a mutual friend through Kepa, of RocketCat Games, and then he said, "I have this friend, Tarn. I think you''d get along really well. "Will you be cool?" - [Danny] (Laughs) "He made Dwarf Fortress." And we decided we''d do a GDC talk together talking about procedural generation, algorithms, design. And that led to Tarn and I... We did hit it off, we were friends. I pitched him. I was like, "Tarn, you have an incredible game. "I can''t be the first person to tell you this, but you should really sell this game for $20 on Steam." And I definitely was not the first, or probably the 100th person to tell him that. But I was the first person to tell him that, that I guess he trusted, that had a company that could do the things that would help him do those things. And he really wanted to make sure that there was a noticeable quality upgrade, for the $20 price-tag. He wanted to make sure there were graphics on it, and sound. And... I think we both were like, "So are you serious about this?" Like, "Are you ready to actually do it?" I think we signed the agreement in early 2018, and then we announced it immediately, because we were terrified that his deeply passionate community would somehow hear some sort of rumor, and go off the deep-end into mutiny, revolution... I mean, it was already a little bit fragmented, but, like... I mean, this is some people''s lives, right? Like, they do almost nothing but play Dwarf Fortress, so they''re understandably very attached to their vision of what it is, what it should be, who Tarn is, and his values. And we were both very sensitive to the, kind of, totally normal impression that Kitfox was swooping in to take advantage, and Tarn was selling-out, and Kitfox is this evil predator or something like that – which, I do think that there''s an alternate dimension in which that definitely was the dominant narrative among the fanbase. But thankfully, we took a lot of proactive steps around, er, not allowing that to be the, the discourse (laughs). Essentially, Tarn and Zach make the game and I help find people to assist them in that, and that''s it. And then the other part of it, of course, is marketing, community management. So, Tarn and Zach already had their own community on the Bay 12 website. They already had their own Twitter, and all of those were active, and actually... I don''t think enough people give them credit for the amount of active community moderation they were doing, but Tarn was putting in – and Zach – were putting in hours and hours every month into their, like, Patreon rewards, and their communications, and, er... "The Future of the Fortress" every month, and like... There''s all these things that solo developers typically neglect, because you just don''t have time, because you''re busy on the game. But Tarn and Zach have always prioritized communicating, and being visible, and, like, that''s a lot of work. - [Tarn] That relationship worked out exactly like we wanted it to. I mean, they were able to secure several artists. We had at least five people doing art on the game total. We had at least three people doing music, erm... We had, er, some, some QA community testers come in from our community, erm, and, ultimately, erm, one of the big modders became a programmer on the game – although that happened after the release. (jazz music) - [Danny] With the support of Tanya''s team at Kitfox Games, the development of the Steam version of Dwarf Fortress began. Kitfox built a support team around the brothers: Texture artists, QA folks, musicians, and audio experts – a veritable assembly line of digital artisans, helping to convert 16 years'' worth of development into something resembling a traditional-looking game. The work wasn''t going to be easy and it wasn''t going to be particularly fast, either. - [Zach] For three years, we''ve been making the game, like, more accessible to everyone. And that means, like, re-doing the entire interface. ''Cos before, it was just ASCII. Just letters and numbers on the screen. And now there''s actual pictures. And with that, though, the interface was complete garbage, along with the matrix that you''d have to decipher. You''d have to use WASD to move around, or... No, it wasn''t even WASD at that time. It was, like, UKLM, or something? It was worse than that. And you would have those key clusters to move in one menu, and then you would have another cluster of keys to just... No reason. It''s just, you have to use different keys to move in a different menu and this was all terrible. And, for the last three years, we''ve been working with artists to make it decipherable, and ourselves, to make the user interface capable of being run by normal humans. - We have a streamer who''s been streaming the game for at least a decade, right? And there''s this log – a chronological log – just, kind of, like... "On the 6th we added the sutures, "and on the 7th we cleaned the surrounding wound area, "and on the 8th, the patient was discharged," or something like that, right? And that was buried in the old version. That was buried six menus, key presses in, or something? Just deep, deep down, where this person didn''t find it. - [Danny] Wow. - They just didn''t know it was there, ''cos how do you investigate this web of menus, right? And then, in the new version, before we even released on Steam, we had that now, just, up in a tab on a second menu, because there''s so much more space and mouse-presses, and stuff. And we just showed it off. We were like, "Hey, look at this cool thing." And they were like, "I didn''t even know that existed. Is that new?" and we were like, "No! It''s not new. It''s been there forever, since we added hospitals." - We added things like, whether the Dwarves are happy. Now there''s a little line of smiley faces and a number that tells you which Dwarves are happy, and how well your fortress is doing. The character sheets, that''s completely new. Now you bring up the character sheet for the Dwarves, and it tells you everything about its thoughts and all that stuff. And that was in menus before. I think you had "V"... Yeah, V-P-L was how you''d arrange their, er, their profession, like, what they''re allowed to do. And now you don''t even do that anymore. Now they just do the job that makes the most sense for them to do. That was... Before, that was a mess. - [Danny] What was V, P, and L doing? V was like...? - It was "view" the Dwarf. P, the preferences, I believe? And then L for "labor". So, what is the preferred labor you want them to do? But most of the time this, this is so bad that, most of the time, these letters don''t represent anything. It''s just a random letter to get you into a different part of the menu. - The art, I think, it must be in the tens of thousands of sprites at this point, because... I mean, it''s a little bit cheating, right? Because what ends up happening, is that for a chainmail shirt, you need versions of that chainmail shirt. You need five different, slightly different ones for quality level. You need a different one for Elves, and Dwarves, and Humans, and Kobolds, and whatever. You need different ones... Now, I do think that they cut down on the number of sprites by making it "palletized". There''s a lot of things that the color will dynamically change depending on the material it''s built with. But it''s always growing, because I asked Tarn and Zach recently, I asked them, "Shouldn''t we wind-down the artists a little bit "until we have another big update?" And they were like, "No, but there''s infinite things they could work on! They could work on the giant baby versions of all the animals, right?" What is a Giant Baby Anteater? Or, Baby Giant Anteater? I think those are two different things. I said, "So you want sprites for those?" And they said, "Well, why not?" and I couldn''t give them a good answer. So, I said, "All right, I guess "we have art forever. That''s fine." (music ends) ''Cos... ''cos then you need Zombie, as well. You need Giant Baby Zombie animals. - Erm, and then here''s all the babies (chuckles) That''s ridiculous (laughter). Okay... Yeah, sometimes this artist takes the liberty to make things cartoony. Like, with the Worm Man, they have a little bowtie and stuff like that. And we''re, just, like... We go with it every time. So we''re going with it. Look at that Rhino Baby. And then there''s a little Hippo Baby. And then the Spider Monkey Baby and the White Stork. - [Tarn] So, we''ve done all of the baby animals now. We''ve had Neoriceisgood drawing baby animals for weeks now and I''ve just sent them the last – aside from one – last three sheets, which are the Aquatic Creatures, the Large Aquatic Creatures and the Giant Aquatic Creatures. And the Merpeople are in that set, and we''re asking for four Merpeople pictures, because Merpeople are one of our... Like, most of our Aquatic Creatures are, like, a shark or something, right? But Merpeople we have two gender pictures for them. And so we need children and babies. Because they''re kind of humanoid, y''know? So, most humanoid creatures, even with the Cyclopses and Giants and stuff, intelligent humanoid-type creatures, get a baby and a child. Whereas most animals get just a young version. And so that''s why we have these, like, Cyclops – Cyclopes? How do you say the plural in Greek? I have no idea – and these Ettins, with like, pacifiers and diapers walking around too, ''cos they have a baby version. And there''s the Minotaur (laughs). That''s the little Minotaur, like, nose-ring pacifier thing (laughs). So it must''ve been at this phase, at one point, the Baby Minotaur phase. Before they threw it in the Labyrinth. And so, I don''t know what we''re gonna get. That''s something that could be sitting on my Discord right now, is like, "What do the Merbabies look like?" - [Danny] But there won''t be any harvesting of Merbaby bones? - Erm, people have probably figured out how to do that, erm... So I''m afraid there probably will be, but it won''t be official vanilla behaviour. - [Danny] (laughs) - Erm, but... Yeah, yeah. I mean, it''s like veal or something, right? - [Danny] (Laughs) - Mer-meat. - [Danny] Mer-meat! (Laughter) - [Tarn] Now let''s look at some of these, er... these Fantastical Creatures and see what the interpretations were. So there''s a Jabberer (chuckles). A Jabberer chick. And a little Cave Crocodile. (Laughter) That''s good! That Blind Cave Bear is just sitting there. - [Danny] Is it cool to see work getting done that''s, like... You didn''t have to do it? It''s like "free work," in a way? Well, it''s not free, but... - Yeah! Yeah, no, it''s a whole different feeling, being, like, I guess, like we were saying, Art Director, Project Lead, that kinda thing and just watching people do their thing, doing a thing that you could never have done, like... - [Zach] Yeah. - [Tarn] Even if we were training as pixel artists for 8 years. Like, we''d get better at it but We wouldn''t be producing this, right? - [Zach] We also, we also hired three of ourselves. - Yeah. This is amazing. - [Tarn] So, we did what was probably a reasonably smart thing and set an October 26th deadline to lock the game down. Which isn''t actually how it turns out but at least you can kinda get it sorta-kinda locked down by then. So the artists weren''t under any particular stress. Music was done. Most of the coding that needed to be done was done. We had a pretty chill lead-up to launch, and just pressed the button and everyone just kind of relaxed when we did it. We had a little party. We had a little group call and the Kitfoxers had their little champagne glasses out, and stuff. Yeah, it was a nice moment. No panicking or anything. And then you just watch what happens after that, right? (folk music) - [Danny] By the time the boys had worked on the Steam version they were experts at making this game. Not only that, they were also supported by other developers who were, themselves, knowledgable about the world of Dwarf Fortress. How it should look, how it should sound. The bugs that are likely to arise. Even though they were planning to sell Dwarf Fortress, The "classic" mode, without the updated sound and graphics was still available to download for free, on Bay 12 Games'' website. In fact, the team has continued to keep parity between both the free and paid versions of the game to this very day. They did everything right, but this was new territory for any games release. How would a title that had been available for free – and arguably, still was – sell in 2025? Were there new fans willing to give it a go, or was the success of Dwarf Fortress destined to be one of a cult classic? A game which had gotten the attention of the Museum of Modern Art and the New York Times but, ultimately, didn''t have an audience? - Sales numbers, you get an hourly graph that you can actually watch. And you can see the countries wake up, and stuff? The ones where you''re popular, and it just looks like a sine wave. And so we knew immediately that the game was being fairly well-received, also because the, erm... Every half-hour or so, the global and country-based sales list would be there, and we''re number one, globally, for a few days, or whatever. And, well, you know you''re doing pretty good, when you''re outperforming every other game on Steam. - [Danny] Within 24 hours of the release of the Steam version of Dwarf Fortress, it had sold 160,000 copies. They''d almost double this by the end of the week. And four months after launch? 600,000 units of Dwarf Fortress had been sold. Most fans watching the launch hoped that it would sell enough to help the brothers gain more financial stability. Nobody had quite expected this. - [Danny] You knew that you''d eventually sell it. Did you think it would do as well off the bat as it did? - No. No, I had no idea that it would be this crazy. Erm, we were just expecting to not have to worry about... Like, to have a job that had health insurance. We expected something like that. But, no, this just completely blew everything out of proportion. - We had no idea. We had no idea that this was what was gonna happen. Erm... And it''s... It feels... It feels really good, erm... Y''know, as somebody who has dealt with housing instability my entire life, I am so grateful. Like, I''m just so grateful for the ability to even be able to do this. I can''t even express what that... I just don''t even have words for the feeling. Like, it just, erm... I feel so at peace, and just so excited for the future. We couldn''t have done it without Dwarf Fortress. We couldn''t have done it without the fans. And I''m just so grateful for these hundreds of thousands of people that I don''t even know (laughs). And, y''know, I''ve only met a handful of them. - [Zach] We were renting this tiny little house and... that, er, just... We had, er, a dog, two cats, and an iguana that we''re taking care of in this tiny little house. And, erm, and then we''re moving into a house that''s – what is it? – ten times as big, or something like that? It''s just huge. - [Danny] Zach and Annie had just gotten the keys to their brand new house when we conducted these interviews back in the early Spring of 2023. It''s by no means a mansion. It''s a nice, modest home. But, considering where they had lived before, It probably felt palatial. Similarly, Tarn had got himself a nice apartment in nearby Bainbridge. But, months after moving in, had barely gotten any furniture into it. Money, it seems, wasn''t really changing these guys. - [Zach] The, er... Yeah, actually, we were shopping for furniture for this place, and, er – the, er, the one furniture shop that''s on the strip down here – and we walked in there, and, er, like, a little metal end table, we looked at it like, "Okay, this has gotta be worth "50, at most 100 bucks, or something like that," And it was like, $1500, and we''re like, "Okay, "see you guys later." - [Danny] (Chuckles) They were like, "Bye bye." Y''know, I''d rather help people out than buy a buncha stuff for myself. I mean, I bought that house. The house is outrageous - [Danny] It''s an investment, though, right? It is an investment, right. Maybe the car we bought wasn''t but... (laughter) We''ve bought two cars for our family members. We''ve done, er... We''re gonna just help out everyone we can, y''know? ''Cos, y''know, charity begins at home, I think. Isn''t that what they say? And, er, just... Yeah. It feels great to be able to do that kinda thing. - [Danny] Does everything just feel strange still? - [Tarn] Yeah, no, this is like Quantum Leap. I am not... This is not my life. This is a different life and I''m just, kind of, adjusting to it. So the game does well, right? The game sells half a million copies in the first month. And so you have to start dealing with that, right? Not immediately, ''cos Steam... A month passes for them, and of course you can return games after a couple weeks, right? So they wait for a whole month afterwards. So this is all through January that they''re like, "Okay, let''s just let these refunds cool down for December." Makes sense, right? It''s the only way they could do it. And then they just... sent Tanya, like, 9 million dollars (laughs). And so, we''re like, "Okay," erm, "So, what do we do?" "Well, we have to send you an invoice." And so they, like, sent me an invoice to show me what it looks like. I''ve never sent an invoice in my life. We just went into Miro and drew a rectangle and drew the things, and typed the invoices in, and stuff, and then you can put a frame on it and export it as a .pdf. And so I got this .pdf and I just sent it by e-mail back to Kitfox And they''re like, "Okay, cool." And then they, er... They had our bank information, so they just sent us, y''know, 7.2 million dollars the next day, wired. It took 2 hours from Canada down to us. And, er... So then it''s just sitting in our business account, right? And... So we... There''s some business expenses, especially just the tax that we have to pay on that as a business. But also, I mean, because of how our thing is structured, like, Zach and I just split that. That''s just how it works. So we needed to figure out how to split that much money. Er, and, obviously you go into the bank in person, right? So we walked into the local branch and we got elevated from the teller to an actual banker, right? Who happens to be someone that my sister-in-law babysat. Right? It''s a small town. And so we were just catching-up with them, and stuff. And then saying, like, "Oh, by the way, our lives have changed a little bit." And they''re just like, "Ah!" or whatever (laughs). So there was all this money, and then you''re like, "Okay, so we need to transfer this amount of money," and they''re like, "Well, I can''t do that." "How can they do this?" "Well, my manager can''t do it, "their manger can''t do it, "their manager can''t do it..." We''re going up to the bank''s, like, national office at this point to get this money transferred. The bank calls us up, and is like, "Okay, so I can go through this two-hour approval process. But because of how y''all''s business is structured, you should just try it on the phone." Because it''s actually permissible to, y''know, transmit up to 10 million dollars. I''m like, "On the phone, really?" (Laughter) And so I just picked up my phone. I was sitting in the backseat of their car I just picked up my phone. I was like... "3-4-0-0 0-0-0, point, 0-0..." Fwip, to the personal account. And it just popped over there, instantly. - [Announcer] The nominees for Strategy/Simulation Game of the Year are... - [Zach] We were nominated for simulation game of the year. We got to sit next to the creators of Elden Ring, who went up and won many awards. But then, in the middle of it, we got our award, and then – I walk up with Tarn to receive the award – and then... We had been, like, hyping ourselves up the whole time, "We''re gonna win, we''re gonna win. And we''re gonna give a speech." I had been drinking, and... - [Danny] (chuckles) I completely forgot what I was gonna say, but I ended up just... My, my parents watched it and they were like, "That''s a great speech, did you write all that down?" I''m like, "...No." (Laughter) Just ... said it. - All right. On behalf of my brother, the genius. (Crowd cheers) We couldn''t have done this without the fans who supported us for 20 years. Just ... for no reason. They didn''t have to give us any money. (Laughter) But they did, and then a publisher picked us up. - Yep. - Tanya Short. Kitfox Games. - And made this for everyone. (Cheers) Everyone can play this now. Not just people that ... Can read ASCII, and program in Linux. (Laughter) Everyone. So, thank you. - Thanks (Applause) - This would be a great place to end this story. Two brothers, who became millionaires overnight – not out of charity, but because of over two decades'' worth of blood, sweat, and tears that they poured into this project. This was, originally, where I planned to end the story. But, in spending time with the boys – with Annie and talking to their friends and colleagues – it felt like this was as much the start of a story as the end of one. Tarn had truly dedicated his adult life to Dwarf Fortress, and in so doing, he had sacrificed significant aspects of life and living. Tarn was now a mid-40s millionaire. But he had never been in a serious relationship. He''d spent most of the past decades working on this game and hanging out with his brother. And, while he had thought about dating over those years, something always held him back. Something that, perhaps now, he was finally able to move past. (rootsy folk music) - [Tarn] Now, this is supposed to be a slow loris. Which is a type of primate. But... (Laughter) - [Danny] It looks like Grumpy Cat. - Yeah, what the hell is this thing? So, we had to get it. That''s why... That''s probably the gimmick, but... ''Cos it''s got, like, a hump? Like, kind of, a bear, too? Or whatever. Like, in real life they don''t, they don''t. They just look like a little, y''know, prosimean primate. - [Tarn] I was, like, "Well... I live in the middle of nowhere." In this... I don''t have a car. And I''m just sitting here, working with my brother on this game, and just not... I''m not gonna be able to go out and meet people, or anything like that. And... (chuckles) I''m also, like... Have this whole online persona. Everyone''s reading every word that I say, and so forth. And I''m, like... I''ve just figured, in kind of a pessimistic way, the thing that''s gonna happen is, I''m gonna put up a profile and I''m gonna see it online in three days, and it''s gonna be this whole thing I have to deal with, or whatever. And I''m like, "I''m just gonna work on the game. It''s a bit of a hassle." Which is not a healthy attitude. Not a healthy attitude at all. I''m sure I coulda worked it out. We would always do this, like, we''ve had this for years now and we just pick it up, and then we, like, rotate it 90 degrees at somebody. ''Cos it''s just, like, a good effect, right? - [Danny] Oh yeah, do the look. Do the look. It''s good. - Oh, you want me to turn it again? - [Danny] Yeah, make it turn. (Laughter) - Yeah, no, I was thinking of putting a picture of me and Sloran on the dating app and then I''m like, "No." (Laughter) This is too much for anybody. This is, like, six months in you can, you can fucking introduce them to what we''re really like (chuckles). Whether or not there''s, like, what do you call it? Self-abnegation. This nullification, or whatever, of, of myself, that came through the working on the project – whether it was necessary at all – is an open question. I don''t think we can just say, "Oh, no, you should''ve been doing more stuff for yourself," or whatever. Maybe the game would''ve failed. Erm, you don''t know. Now, I''m, I''m, y''know... that things are going so traditonally well, erm, I don''t second-guess it. I''m like, "Things are, things are good," erm... And, er, we did what we maybe didn''t "have to do," but we did what we did to get there. - [Danny] And you''ve no regrets? Erm, I mean, it''s, it''s, er... My life has not repaired itself, entirely, er... So, er, I''m waiting. Waiting to see if I regret things. I''ve given myself about six months here, to see how things go before I think about it. (Laughter) - The financial success of Dwarf Fortress did more than just help these guys get some decent insurance and, y''know, get on the property ladder. It was doing something really important for Tarn. For the first time, in as long as he could remember, He could think about something else other than working on the game. One of the nights myself and Tarn grabbed dinner he was texting somebody he''d just met on a dating app. He''d bought himself an Aran jumper so he had something nice to wear if they met up sometime. I asked him over dinner that night about what he was gonna buy with all this money. But he didn''t really have an answer. Tarn didn''t seem interested in cars, or fashion or even high-end PC hardware. But I pushed him on it. I wanted to know what his dreams were, what he thought he could do now that he couldn''t do before. And he mentioned maybe getting himself a new guitar. Years ago, Tarn had bought himself a guitar to teach himself how to play Spanish style. And it''s on this guitar that he wrote and recorded the original Dwarf Fortress theme. So the next day we took a day-trip to Seattle. We took a ferry from Bainbridge Island to the city. We got food at his favorite curry restaurant just by Pike Place Market and we took the subway to a Guitar Center over by the University District. Tarn browsed the selection for a few minutes and then eventually spotted something he liked – grabbed the guitar, sat down and played. Oops. How does that go? (Chuckles) (Mumbles) ("Dwarf Fortress Fort Mode Theme" continues) - [Danny] Tarn didn''t buy a guitar that day. Not wanting to waste the cash on one that he wasn''t "sure about." He said that when he picked up the right guitar and played it, he''d know if it was "the one." In leaving Poulsbo that evening, I''d felt like I had been a spectator to a very weird time in these people''s lives. A sort of a bridge between the old version of life and this new one ahead of them. One that seemed exciting, but scary and different in ways they couldn''t quite pin-down. Tarn had given himself six months to figure out his love life. While Annie and Zach were ... trying to extend the comfort that they now had to their friends and family around them. But, unfortunately, things didn''t exactly go to plan. Version 50 had finally launched, but it had focused on the game''s Fortress Mode. Before they could start once again adding new functionality into Dwarf Fortress, they would first need to update the other half of the game, Adventure Mode. This would require more help, more graphics, more sound and more time. But Adventure Mode was far from the biggest challenge facing the brothers and their family. In the next, and final, episode in this series we cover the two year development of Adventure Mode and everything else that happened in the background during that time Why I felt like I needed to  extend this series to one more episode. And why I flew back up to Poulsbo to interview everbody one last time. You can go watch that video right now if you want over at Patreon.com/Noclip and a massive thank you to everyone who has supported us during the run of this series. For everyone else, we''ll see you next time. ("Dwarf Fortress Fort Mode Theme" plays) - [Danny] And it''s a game that is, that was always going to a have a long tail, in terms of development. - Like, regardless... - Yeah, it''s not even a tail! We''re working on the damn thing! Right? It''s not a tail. - [Danny] (Laughs) No. It''s the body of the beast. We''ve not gotten to the tail yet. We''re working on ribs and shit, right? It''s like... Yeah. - (Laughs) - We haven''t even put out Adventure Mode. - You''re right, yeah. - Adventure Mode comes out, suddenly this game is an RPG. You slap the "RPG" tag on it, or whatever. And then, like, a whole new set of people... I don''t even know what that''s gonna do. (ident clicks) (click)'
