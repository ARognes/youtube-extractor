transcript: hi everyone i've got a ton of updates about hyperbolica in my youtube channel but i first really want to thank everyone for the great support and the feedback it was really fun to see all the reactions and playthroughs and i was really happy with how it turned out so the biggest announcement is that i now have full vr support from most of the common headsets yes it had vr support on launch but it was sort of a beta feature not all the controllers worked and some were pretty janky but now i can say the valve index htc vive windows mixed reality headsets and of course the oculus quests are fully supported with the link cable or airlink and to go with that i have a new vr settings panel with a ton of quality of life improvements the next piece of news is that the source code for hyperengine which is the unity backend that hyperbolica was written on top of is available on my github so if you're interested in using it for your own non-euclidean games or research it's entirely free in mit license hyperbolica is also available on itch.io now so it's another option to purchase and play the game the original soundtrack is also available on other platforms or you can stream it on youtube links below another important thing i wanted to mention is that community translations are now open so if you'd like to help and volunteer to translate the game to your native language you can join my discord to get involved and lastly some updates on what's coming up i should have a mac release of hyperbolica and a native oculus quest app soon so look out for that i may also expand the game a little more in an update and regular code parade videos are coming back soon i have a huge backlog of projects i've been wanting to do for a while so those are my updates thanks again to everyone who supported me through patreon coffee and buying the game hyperbolica is the first full game i've ever released and it probably won't be my last so see you all next time [Music] you
