ing about infrastructure and start deploying. Try Google Cloud Run today at cloud.run. I also want to mention our presenting sponsor Antithesis. Neet talked about memory leaks in a series that he knows about but just doesn't have the time to chase it down. If you work on distributed systems, you've been there. You know there are deep bugs there. You have no way to root cause them so you can only hope there's nothing really catastrophic. With Antithesis, you no longer have to rely on hope. Antithesis lets you fix and find all sorts of bugs easily and efficiently so you no longer have to choose between shipping quality and shipping fast. Let me explain how. Antithesis runs your whole system in a hostile simulation. By doing so, it finds every bug before your users do. And because the simulation is fully deterministic, Antithesis doesn't only find bugs, it gives you a perfect reproduction of every issue. I know this sounds closer to science fiction but it's actually hardcore engineering under the hood. Jane Street, Flight Data IO, and the etcd community ship agent written code with full confidence because they know it's been verified by Antithesis. To see more case studies and details, head to antithesis.com/pragmatic. That's antithesis.com/pragmatic. And with this, back to Neet and his story on why he's happy leaving a production bug unfixed. >> It's an interesting trade-off where like engineer like the engineer in me hates that because it's like there's an issue. Like fix it. But the business value makes no difference. Like there there has been practically zero outages. I have less outages than LeetCode and I'm like like a couple people doing it. So it's like I I just think it's like a trade-off. And people could argue one way or the other, but I think it just makes so much sense right now for me to not like fix it. >> But it's still interesting. So, you paid for an engine or or licensed it that if I understand it it it was executing code, right? So, when people like