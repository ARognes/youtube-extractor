retty much algorithms there. It's like leak code hards and super hards and stuff like that. But, in the US, I don't think it's that crazy, but it's uh Yeah, it's not too crazy. >> Yeah, but I I I guess like, you know, going without a without any support like in a whiteboard, it's so it's so hard to prepare for that. It it's it's it's never been easy. >> Yeah, absolutely. And I think the the one thing that's happened a lot is people like there's been cheating tools for interviews. And so, we've had like Yeah, mostly remote interviews for the last like 5-6 years. And that's been changing a bit. I think Google has pretty much gone to on-sites at this point, back to the traditional whiteboard format. And they'll let you code on a laptop if you want to, as well, but it's going to be in person. Somebody's going to be watching you code, and you're probably not going to be able to cheat your way through that. >> What are interview formats that you're seeing, you know, where we're talking about other companies, especially smaller ones, experimenting? What are interview formats you're you're seeing or you think it they're actually kind of promising? Like, if you were running a small smaller mid-size company, you might actually consider instead of the And I you're talking about against yourself here. Like, against But, but if you had to throw away the the the DSA interviews, what is giving promise, especially with AI as a as a tools? >> Any process that you have that's going to be standardized and super scalable, there's always going to be ways to game that. And the best way to get around that would be like hire somebody who's who's an intern and you saw how they performed. And what I've spoken to a lot of companies about the last week is that there a lot of small companies that can get away with it are doing like trial periods. It could be a few days. It could be like a month. It could be even a couple of months, kind of like an internship. And I've spoken to other companies 