nd like you have all these things, and it's like, "Okay, you solved one problem, and now you got a new one." With LLMs, it's like kind of the same thing. And even the cost issue with AI is probably going to be like once the subsidies start running out, which we're starting to see, I think that's going to be a really big issue where maybe all these companies that embraced AI programming are now going to like cut back on it. >> Yeah. You had a wacky train of thought which I'd like to talk about it. It It involved AGI. I'm not a huge fan of talking about AGI cuz I feel it's very like you know like hard hard to talk hard hard to define. But but let's talk about it. This This was like you were saying like let's assume that there would be an AGI or a god-like singularity. These models would be amazing which I think we can see they have limitation but let's let's just jump like forward. What was this thought on on like how we were chasing it? >> Yeah, I think like on a philosophical level like it feels like you're trying to get to like infinity and it's like the closer you get you're the same distance away from it, right? And it's like that's where I feel like it feels like as like technology has gotten better you would think that like we've solved life at this point. Like we have like abundant resources and if we don't like we're not that far away from having enough food, water, and shelter for everybody. But it's like something about life like maybe it's human nature or something it just doesn't change. It's like you want more like Okay, now there's like higher levels of like programming. So now people are competing at like the higher level and like as it gets higher and higher the people are still going to be competing like on some level. Like maybe it's easy to like build an app now but there's going to be a new problem to solve like on marketing and like edge cases and things like that. But I also think like maybe this is like a politics thing because I think there's 