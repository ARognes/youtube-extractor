transcript: There's been so many predictions that coding interviews will be dead. >> There's been cheating tools for interviews. Google has pretty much gone to on-sites at this point, back to the traditional whiteboard. Somebody's going to be watching you code, and you're probably not going to be able to cheat your way through that. >> One of your hot takes is 2026. It's never been easier to build things, but I would say that it just makes 10 times harder to actually build value. You said that personality traits are now more important than coding skills. [music] >> I hired somebody a few months ago. They still haven't even graduated. Anytime I give this person a task, even if they have no idea how to start it, a week later, they'll have learned everything about it. That matters the most. >> You've had a pretty contentious hot take, which was some people should just give up on tech careers. >> You should know what you're getting yourself into because >> What separates strong engineers from everyone else? Naveed Singh, [music] or as many call him Neet, he created NeetCode, the coding preparation platform that helped countless devs get hired [music] at Big Tech. In today's episode, we cover what preparing for data structures and algorithms interviews teaches you that's [music] useful on the job, and how it's more about mindset than the algorithms. The growing difference between engineers who can still think without AI at their fingertips >> [music] >> and those who freeze without it. Neet's contentious hot take that some people should just give up on tech careers, >> [music] >> and many more. If you want to understand which entering skills compound over a career and the ones that AI is quietly eroding, this episode is for you. This episode is presented [music] by Antithesis. Antithesis runs your whole system in a hostile simulation and finds every bug before [music] your users do. It sounds like science fiction, but it's actually hardcore engineering. Understand how at antithesis.com/pragmatic. This episode is brought to you by Sentry. Sentry is a tool I used for application monitoring back when I worked at Uber, and I now use it on all my projects, including the Pragmatic Engineer backend. One new feature I'm really liking about Sentry is their Sear AI agent, which helps investigate production errors. For example, here's an actual error I had in my application. I can just ask Sear what might be the root cause and it brings context and it can also make a plan to fix it all from the web interface. Oh, and it also works in Slack as well, not just the web. One place that I find even more handy to use Sentry is from code X or cloud code using Sentry MCP. After you hook up the MCP server, you can do some very useful things. For example, when an already resolved Sentry issue resurfaces, you can kick off an agent to investigate the regression, read the relevant code, and open a PR with a suggested fix. There's a little work involved to get all of this going. to connect Sentry to your code repository, add Sentry MCP as a cursor, define the instruction for cursor's agent to investigate, configure the trigger that launches the automation, and test that it all works. But once you have it up and running, you can get regressions fixed faster while still reviewing every and all fixes. I'm not a fan of using AI tools just for the sake of it, but I really like the practical integrations where I can fix errors faster and with more context. Check out Sentry at sentry.io/pragmatic and start monitoring and fixing regressions today. >> Neat. Welcome to the podcast. >> Yeah, I'm happy to be here. >> It's awesome to have you here. Let's start with something that I've been thinking about. So, there's been so many predictions that if if and when AI will be good enough to like write code, you know, coding interviews will be dead because uh on the day-to-day we will not be writing code. Now, most engineers are not writing code, they're prompting at work and yet at the same companies coding interviews are still not dead. What is your take on this? >> Yeah, I think it's really funny with how much coding has changed the last few years and especially the last few months that coding interviews are the one area that have surprisingly stayed pretty consistent. I know some people like talk about them changing a lot and so far they're kind of like changing a bit with like AI-assisted coding interviews, companies are trying that. But surprisingly, the coding interview format of data structures and algorithms is really really sticky and it's confusing to a lot of people, myself included, because like we've gotten to a point where you can ask like an AI bot any question about a code base. It can give you a pretty good answer. You can ask it to implement some feature. You can uh do anything pretty much. And it might not get 100% of the way there. Like even humans can't write bug-free code, but it can get at least 90% of the way there. Like pretty close. So, it's confusing to a lot of people. And I think that it goes back to like how do you even evaluate if somebody's a good hire or not? There's one aspect of it which is like do they have the hard skills? Do they do they have the technical skills? Can they think? And DSA interviews were never the best for that. Well, thinking, sure. But in terms of like does that skill translate to what you're doing on the job? It never really translated to that. It was more about evaluating like does somebody think? So, I think that's one of the reasons. And the second reason that's stayed sticky is that companies just have no idea how to evaluate. Like And they probably never did. I think I was talking to a friend of mine Steve from Amazon. And he he mentioned that like they've ran some studies. And it's like very hard to know like whether somebody like when you hire somebody no matter how much data you have, no matter how like you've run the interview process, that it's just very hard to know like how somebody's actually going to perform on the job. So, >> If if if they're going to work out, right? >> It's a very hard problem. Because even if somebody is good, how do you know they're going to be motivated? How do you know they're going to enjoy the team environment, the vibe, and all that stuff? So, I think it's just really complicated. >> And could another reason be that it has been so sticky and it's still a sticky that maybe it's just simple as there it's kind of like if it if it ain't broken, don't fix it type of mentality? >> I think so because anytime you try to change something, you risk making it worse. And so, it's like first of all, it's a lot of work to change that process at big companies. Like it's very bureaucratic. There's going to be a lot of like retraining. And we're already kind of seeing that with companies like Meta trying to run AI coding interviews. The training is really hard to get to get down cuz it's like interviewers are just not good. Like the most interviewers do not like interviewing. They hate it. >> when you're saying training, you mean interviewer training, like training your interviewers like at a large company like a thousand of them to like be similar. >> Exactly, yeah. Because at a big company, you want the process to be standardized. You want it to be the same for everybody. And that's very hard to get right in general. And it's even harder to get right when you have like more variables introduced like a new evaluation process, training interviewers differently. Now you got to check the AI prompts, like all these variables. And so it's not like an exact science. It's hard to measure these things. It's It's practically impossible. So I think we're definitely going to see, I think, companies trying different things. I think we probably will see different interview formats introduced. I just think it is going to be a slower transition than most people think. >> I want to rewind a lot back into into your early days. Like how did you get into tech? What was your first introduction with programming coding? >> Yeah, I was actually studying electrical engineering when I was in college. Because I really liked math. I really liked physics. I know a lot of programmers don't. Some Some of them obviously do, but a lot of programmers don't. But they really like programming. And so when I got into our programming, I was just taking our intro to C class. It was required for electrical engineering. I didn't really want to take it. And I was not very good at it initially. I remember trying to learn printf and the you know, percent S, percent C, like I don't know why. Like I looked around. Everybody around me was learning it so quickly. And to me it was just a very different way of thinking. Even though it's kind of related to math, you'd think it'd be easy to pick up, but it really wasn't initially for me. But then I think a couple months went by and we learned about variables, conditions, loops, functions, and all these kind of concepts. And then it really like something just kind of clicked where it's like initially programming felt kind of boring. It's like you just have variables and numbers. But then when you introduce all these things, then you realize there's like this infinite complexity that can be introduced. And and you see that with like all the software that is built today, where it's like you took these like simple primitive things, these zeros and ones, and all of a sudden you just have this enormous like universe of software solving insane problems. You have databases like Google Spanner, which not only take programming, but they take physics, they take like atomic clocks and GPS systems and all these things, and they solve like these really hard problems. And so I I I I guess to go back to my story and well once I really started enjoying programming, I just fell in love with it and I was like, "Okay, I'm not I'm not going to do this for the rest of my life. I'm going to love it." And then I went through a transition where once I got into the real world, I realized that programming is not something you can just kind of do the way you enjoy. Like it's a business at the end of the day, and so that in a lot of ways took some of the fun out of it for me, where it's like you don't get to work on the languages that you like, the problems that you enjoy solving. You have to focus on like the business problems. And so yeah, I I I I have a love-hate relationship with programming because of that reason. And I think a lot of people do. >> It's interesting how you know, you you got really excited it was boring and then you got excited about the complexity and the possibilities, and you kind of came back to down to earth. One thing we were just talking about before we started the podcast is the CAP theorem. On how you also had a similarly weird relationship with it. Can we talk about it and also for those of us those listening who who don't know exactly what the CAP theorem is? Let's start with that. >> Yeah, of course. Uh so it's a pretty simple theorem. It's kind of described awkwardly sometimes, where it's you have like three choices and you can pick two of three. There's consistency, uh and that's data consistency, so in like a distributed system where you have data that's like partitioned in different regions or something. It can go out of sync. Like one database might be more up-to-date than the other. And then there's availability, where are both of these uh you know servers or databases available to read or maybe one went down. And then the third one is a partition. Uh or partition tolerance. And so that basically means in a distributed system, if there's a partition, if maybe the system becomes disconnected, one thing goes down, the how is it going to behave? And so the two out of three framing is used a lot. It's not super accurate. And the entire theorem is very like incomplete. And so when I was learning it for the first time, I thought you know, I I like to go deep into things. I like to really really understand things. That's what I love about programming. It's deterministic. Like if you really want to, you can go down to the to the exact line of code, the line of assembly, the zeros and ones to know exactly like what was happening. And so CAP theorem felt like hand-wavy to me. And I didn't really like that. And that that goes back to why I don't like certain things about working on the job because I think like you don't get to go as deep as you like. You have to solve the business problem even if it means you don't really understand some of the technical details. But that's fine. But later on, I felt so validated when I saw a blog post from Martin Kleppmann talking about how much he didn't like CAP theorem. And it was actually a little bit controversial where I think there were plenty of smart people in the comments of that blog post that said that you know, maybe he's like technically right, but maybe he's you know, being a little little bit nitpicky. And I think that's like a personal preference, but I just felt very validated that somebody like him agreed with me. And I think it's it's kind of funny because I think I never saw anybody mention that about CAP theorem before. Like I I saw like posts on Stack Overflow. Nobody really mentioned it's kind of incomplete. And so the the thing that came after it is like PAC else, which is like if there's a partition, you can choose either availability or consistency, but if there's not, then there's still a trade-off to be made, which is latency and consistency. So it's much more complete. I don't understand why anybody would learn the CAP theorem when that theorem exists because it's just more complete. It's not that much more complicated. I think it's more simple to understand. >> I wonder if it's only a smaller subset of people who actually go deep. You know, CAP theorem, you actually like, all right, let me understand the whole thing and then you realize it's incomplete. But most people might have just like looked at it, you know, took it, okay, it's the law, two out of three, simple enough, move on. And I guess in in most part of their lives, it's enough or they might not even use it or if when they they think they know, but they don't know it exactly. So, it's interesting cuz we're talking about software engineers and you would think that most software engineers go into the details, but I guess maybe not. >> Yeah, I think it goes to like solving the business problems and just like this is what I didn't like when I started working professionally because okay, so you go through like documentation, right? You're going through onboarding. Like at Google, there's so much documentation, there's so many internal tools. And I want to go deep. Like I want to do depth-first search on all the document links. Like, you know, you have one blog or you have one site and it has it references like five others. That one is going to reference five others. Like I want to go through every single one, have like a complete understanding of everything. But that's just not how it works at jobs. Even a code base, no one person is going to understand this massive code base unless you like write all of it by yourself, which is just not how companies work. And now we're kind of seeing a similar transition I think a lot of people are going through now with like agentic coding because it's kind of a similar concept where it's like now you might not even be looking at the code that you're actually producing yourself. So, it's it's kind of similar and I think this whole transition kind of reminds me of that where it's like you don't get to do some of the things that you used to enjoy, but it's it's still you know, that's that's life, [snorts] that's business. >> So, you graduated from University of Washington and you started work at the most obvious choice in Seattle. I guess the in Seattle the two obvious choices are Amazon or Microsoft and you got into Amazon and it should have been a smooth ride. Like you you made it into big tech, into the big leagues, and then you quit after 2 months. What happened there? >> Yeah, first I want to say I actually went to Washington State University because I Yeah, I was actually not accepted to University of Washington. I wanted to go there, but I was not the best student in high school. So, I was fortunate enough that I grinded super hard for interviews, had a pretty good GPA. So, I got some interviews at Amazon, and it was DSA related, so I was able to, you know, crank that out. And then once I actually got into the world, and this is something I was self-aware about where I knew I was not a well-rounded person in that like working with people, people skills, and just anything of that. Like I could sit by myself, go through like documentation, work on things, but like working with other people was very, very like difficult for me. At Amazon, the org I was in Alexa, which is kind of been gutted from what I hear nowadays with LLMs, but the team I was specifically in and I think Alexa the org in general was not the best place. It was not a well-oiled machine, a lot of manual stuff going on. It was a really stressful environment. I think when I joined I saw a message on the internal thing. I think it was I think they use Chime at the time, but he said, "This feels like a thankless job." And I was like I was going through the history of the the team channel. This was like a week before I joined. I was like, "Whoa, okay. So, this is like clearly not like a positive team environment right now." I think they were all like decent people. I don't blame any of the individuals. I don't even hold a grudge against Amazon. It was just a crappy situation. And so, I think in hindsight, like if I had to do it over again, I'd probably be able to survive. Like I kind of know things. It would have been stressful and and crappy either way, but I would have been able to get through it. Um but at the time, I just didn't really know. And like I had a lot of like personal issues at the time. And so, for whatever reason, I just made a very like impulse decision to just leave the job. Afterwards, I kind of regretted it because like, you know, I felt like a little bit of a relief, but then I just felt a lot worse because I was like, okay, now what do I do? >> And then can can you talk me through on like what it felt joining, you know, like the the first impressions, what the onboarding was like, and what were the things that just were like not adding up? >> It was very intense. So, we had a meeting cuz there were like five or six new grads who joined like within a one to two-week period. For the same team? >> Yeah, and I think there were like four experienced engineers already, and so like they over doubled the team and mostly new people. So, you'd think, okay, well, if you introduce a bunch of new people, you're going to obviously onboard them, like get them up to speed. But they had a lot of deadlines that they were dealing with, so it was kind of like the the experienced people were just working, and the rest of us were kind of just like on our own. And so we had a meeting where it was like one of those where you're just kind of like introducing the new people, right? And like again, I don't blame any of the people, but they were like nobody said anything. The experienced people, like they did not like say anything. The manager had to like kind of keep like prompting them to like talk and to be friendly and stuff. I think they just wanted the meeting to end so they could go back and like finish their work because they had deadlines to meet. I saw people, and I'm not saying one person, every one of the experienced engineers was committing 3:00 a.m. and we have like 8:00 a.m. or 9:00 a.m. meeting in the morning tomorrow. And some people are reviewing the PRs at the same time. So, I don't know if it's this culture where like I don't think the manager told them you have to do this. I think it's like implicit where it's like you know, you kind of know that it's a stressful environment right now. If you're one person who's not doing it at 3:00 a.m., you're going to be the first in line to maybe get kicked out of the company. >> Yeah, and also I mean, Amazon at the time, they had a target of 6% unregretted attrition every year, which meant that managers or like directors at their level had to have 6% of people leave the company unmarked as unregretted, which meant that either people quit on their own and you said like, oh, actually this person was not great, unregretted, or you need to put people on performance improvement plans, and then have them leave and say like, yep, that was unregretted attrition. So, it's somewhat cutthroat in some of the orgs, or most of the orgs. Yeah, I almost have like some conspiracy theories about that, because I think I gave my resignation actually three times before they finally like accepted it in a way, which was surprising to me. I was like, why don't like they accept the resignation even after like the second time? And I was thinking like maybe this is like because like it looks bad because it's regretted attrition, where it's like you didn't let them go, they chose to leave. And and since it was so early, I think it was too early for me to even be on PIP. I think you get that like within 3 to 6 months or something. I left like 2 months in. And again, I don't blame any of the people. I have no grudges against any of the managers, even the skip manager, because I remember when I was quitting they told me like, yeah, like sometimes we do get let people go and stuff like that, but I don't see it that way. I just see it as like a bad culture fit. And so, they were trying to be nice about it, but again, it was it was they weren't even trying to hide it. Like it was obvious that the culture is like intense. And some people would say toxic. I'll use the word intense to be more generous, but yeah. >> Later on, you were able to get into Google many months later. How did joining Google feel compared to Amazon? >> It was the opposite experience. And they're kind of opposite companies in a lot of ways. Like the business culture, even the tech culture, and all that. But I was kind of in like Amazon PTSD mode, where I was like, okay, like that was my first kind of like real professional experience. I extrapolated that to be like everywhere in big tech, or even just professionally in general. So, I was like, okay, you're supposed to not ask questions, you're supposed to not talk to people, you're supposed to not even be friendly, you're supposed to just like work, and just be as intense as possible. But people were very friendly to me, and so I kind of reciprocated that. But I didn't ask questions, I was very scared to. So, I worked on my own for the most part. And I was given a project from my manager that turned out to be more difficult than it was supposed to be. But I was still in the mode where I was like I just got to get it done. Like this is my project. Like I have to do it independently. And so that I was very fortunate in that where I did have like a very supportive manager, a very supportive team. And because I chose to do pretty much all the work by myself, the manager and team saw me as like independent, which is what you need to do to get promoted from like junior to mid-level. I was very lucky to get promoted like very quickly because of that. And that helped me build my confidence a lot. That made me realize like okay, like I can start asking questions now, which is funny. Where like after I got promoted is when I was like more comfortable like asking questions when like you'd expect that from a junior engineer more. >> This is so interesting because you've only at that point had maybe 2 months of professional experience working at Amazon when you join Google another 6 months or so later. And how you can have a lot of reflexes ingrained in you coming into a company. So you can almost imagine like another engineer who had like two or three jobs before, you know, they might have built up all these onset things that are coming from other companies cultures or what they've learned and they when they join, it it can be hard for them to adapt to to the company. I'm not sure we think about this in the industry. >> Yeah, I think it's kind of funny you mentioned that because I was in Google Cloud where a lot of the leadership was from other companies like Amazon and we had a VP or or GM. He joined it from Amazon for a few months and he actually left shortly after that as well. Like I don't know the exact stories behind that, but I think there is a lot of like in the industry a lot of culture can get like mapped. A lot of people at Google didn't like the Amazon managers because it's like oh, they're going to be less likely to like take us on a trip or pay for us because they know that Amazon has like the frugality and Google doesn't. Uh but slowly like while I was there, it slowly started to get going that direction, especially with the layoffs and all that. >> Getting promoted at Google, what does it take? What does it mean? I know there's promotion packets. I know there's committees. What did you see from your perspective? >> Pretty straightforward, I think. Like going from junior to mid-level is probably easier, I think, than from mid-level to senior and as you get higher and higher. In my case, it was mostly just about like working independently. And then once like I was lucky to get promoted, I think, in about a year, almost exactly a year, which is very uncommon at Google. And I could sit here and probably humble brag and act like I'm just like this super genius. But I think it was really I think there's like you have to one put in the work, two be reasonably smart, but I think vast majority of people are reasonably smart enough. I think it's it goes into the other things where it's just right team, right project, cuz if you don't get the right project, there's no way you can prove yourself. You could be a 10x, 100x engineer, and if you're working on relatively easy stuff, you can't really say that you solved like a really hard problem. So, I think it takes a lot of that. Google has a lot of like documentation where it's like every single thing needs to be supported with like some metrics or some artifact, like some design doc. And so, they have like this culture of probably producing too many design docs for really simple things. Some people don't love that, but I think in terms of like processes, it's just a necessary evil at Google, because otherwise, some engineers might just like work on stuff that they just feel like working on, there's no impact to the business, and so it's hard to kind of like quantify that. >> And then on the side, even before Google, you started what is now known as NeetCode, and a lot of people watching or listening will know you for you or even your voice from there. Can Can you tell me how that all started and how it continued as you were working at Google? >> Yeah, so I initially started after I quit Amazon, I think, in like 6 years ago. And I was doing it really just for fun and for the love of the game, because I >> You were recording videos, right? >> Yeah, I was making these like tutorial videos. I was like, I'm studying this right now. I got nothing better to do. I might as well like help some other people. And I found it very difficult, because there weren't really tutorials at the time. There was just a lot of like forum posts of these really like complex solutions. And I'm like sitting there banging my head against the wall trying to understand it. And I think most people didn't understand the solutions because it's it's very hard to. Like I think most people just looked at the algorithm, kind of had a high-level understanding of it, didn't quite know why it worked, but it was good enough usually to if you saw that question in an interview, you could probably pass the interview. And uh this goes back to like deep thinking, which I think was a skill that it's more of a personality trait for me, but I think it helped me a lot with like the LeetCode stuff. I went really deep into things that at the time felt kind of meaningless, where it's like you make this video for 50 people watching. And you you you you did a great job, but it like clearly like it's not worth the several hours it takes to do that. But I kept doing it cuz I enjoyed it. About a year after I started making the videos consistently, I think I did get into Google. Very fortunate to do that. Interview process was pretty easy at that point, thankfully. So I kind of backed off the videos. I was like this is kind of a like like it was fun, but I'm a like I'm at Google now for the rest of my >> have your Yes. >> Yeah. And then I I saw that actually like I made a video telling people like, "Hey guys, I got into Google, by the way. You might not see me as much anymore." And and funny enough after that, the channel like went exponential because I I think it added like so much credibility. It's like, "Okay, this guy didn't make these videos after he got into Google. He actually made it before." And so like this is what he did, and then he got in. So it's like it's like the best sales pitch in the world. Like I I proved it. Like I went from zero to one. And so it was I guess a really good selling point. And it kind of bothers me personally because it's like the videos didn't change, right? Like the branding changed, but that made like a really big difference. Yeah, and so after it went exponential, I was like, "Okay, maybe I'll make like a website." And then the website was completely free at the time, which is really a catalog of the videos to make it easy to use. And um that went viral as well. And then so pretty shortly after I got promoted, I was like, "Huh, like maybe I can like try this full-time." cuz I really loved it. I I couldn't go as deep as I wanted to at Google. I had to solve business problems, but with algorithms and data structures, I can go super deep, more deep than most people would ever want to go into those things, but I had a reason to because it's like, "Okay, I can explain these things to people." And so yeah, I think it was just it was like the right timing for me. And then afterwards, uh thankfully it's like worked out so far. But >> you you were at Google. You just got promoted to L4, which is still mid-level, but you now had a path to L5, which I mean, it used to be the terminal level at the time. Now L4 is a terminal level, but you know, in Google you go to L6, L7, L8, principal scientist. You had that path of like staying inside Google, do this stuff or start your business or turn this into business and go deep into algo coding. How were you thinking of the two options and what you would give up or what kind of, you know, how much risk would one or the other have? >> Yeah, I thought about that a lot because even though I I didn't love certain things about Google. I actually really liked the company. I liked the people and it wasn't this super stressful environment. And when I was leaving, my TL, who was basically my manager at the time because my manager had >> Still being tech lead, right? >> Yeah, tech lead. And he he kind of asked me. He said, "I'm a bit perplexed that you're leaving because you got promoted very quickly and you could probably get promoted again." And like, I did think about that a lot because it seemed like because that was what I was going to do the rest of my life. I was going to work at Google. I was going to, you know, get promoted. I was going to be like the best engineer I could be, but I just felt like the the timing of it like I had a chance to to try something by myself. Maybe that opportunity isn't going to be there forever. Google does make it easy for people even to this day, if you leave, you can usually come back within a year if you're on like good standing with your team and stuff like that, which thankfully I was. So that kind of made it a little bit easier. I have friends all the time that are making like the same decision. They're asking me like, "Should I leave Google?" I just had a friend last week. Uh she wanted to like do content creation full-time. I think it's like a trend almost these days where everybody's quitting their job to do their own thing, but >> Well, I mean, I think it turned that in like we always live in bubbles, right? But but but in in like certain bubbles it it is. How was the switch? Can you tell me like you actually went from like okay, well, you made the decision, you went from like having a really structured work day, a team, everything was figured out. Google has amazing internal infra. You can just focus on okay, the business problem is still coding. And now you're like okay, you have the website, you have Git repository. What What was the switch like? And and you're like What was interesting about it or like good and fun? What was difficult? >> I had a tough time with the learning curve at Google, but once I left, I had a tough time like transitioning away from some of the tools because you get used to it very quickly. Like they have like GitHub, I'm just not a huge fan of it. I know a lot of people are hating on it nowadays with like the uptime issues and stuff like that. But I have other issues with it around like UX and stuff. I think Google has certain internal tools that aren't so great, but they have some that are just like super super good. And there's been a lot of companies that have been started just because like some that you had Google built something and then they're like, "Hey, we could make this public." So, then they leave and then they start like Cockroach Labs or something crazy. >> What about like you went from from working on a team and now you just had to do everything by yourself? What was that an issue or that was kind of natural to you? >> Yeah, that was actually a huge thing for me where I it was hard to build a team. It was hard to like work with people. Like I kind of said at the beginning. And I've only just recently, I would say within the last like 6 months, gotten used to it where now I finally feel comfortable like delegating things and like managing people. And finally like it it took a long time for me, but once it finally does click, you know, you go through like so many experiences, you hire some people, you have to let them go, you figure out what works, what's a good fit, and even just how to like motivate people. It's a very different thing like working with people cuz everybody's different. They're not like agents where you just give them the task and they're a machine. They're just going to spit out the code. Like people are people. And so those types of things, there was a huge learning curve for me. But now and I hated it before, but now I actually really love it. Because it's like when it does work, when you find somebody and they're a good fit and you feel like you can contribute to their growth. You can like guide them a little bit. Like you can steer the ship a little bit and you see like how much of a difference that makes to them. Like now I finally understand what leadership means when you like when it works. Like when you're an effective leader like you can make a magnitude of difference in like even like in a small team, but I imagine like as you get to higher and higher levels, it can make a huge difference. And you see that with CEOs sometimes when a new CEO takes over, the entire company either can go like up or maybe it goes in the other direction. So >> When you started so like you quit Google, you had a website that listed your videos, I guess very simple HTML CSS, maybe a bit of JavaScript. Uh what did you build then? What what was the tech stack behind it? >> Yeah, so initially when I made the free site, I was still working at Google. So I just chose some like random Google tools. Uh I was using Google Cloud Firebase uh because it was so easy to use. I regret that one because now I meet so many people. I'm like, oh maybe I should do Convex now. I should have done you know something different, but um I also did Angular at the time, which is what I used at Google. So I was like it makes sense. Maybe I can just learn it at the same time. Regret that one as well. But thankfully we've gotten to a point now with LLMs. So like migrating things has become relatively trivial. So like maybe that's something I'll do, but in terms of like building the application itself for whatever reason, like I I just didn't find that super interesting because there's usually not that many deep problems. I think the interesting things came from like innovating and like doing things in a way that like people care about. Like nobody's going to care that much about like the performance of my site or or the tech stack I use or like any of these like little things. They're going to care about like the UX, like how well did I explain something in a video? Cuz if the explanation sucks, nobody cares like how pretty the site looks. >> the video was is the product or or most of the product, right? >> Yeah, because it's education. So, it's like if the education is bad, then nobody really cares. And and I I was very bad at building, but I think the idea, the concept, the value was good enough that no matter how crappy the site looked and like how bad like tech choices I made, the the business value like exceeded everything else. Like that mattered more. And so, that taught me a lot about like prioritizing things that actually matter and then you can take shortcuts on the things that don't matter. I I think I saw uh Elon Musk has like this four-step or five-step process for optimizing like a workflow and like a process where, you know, you start uh you start cutting things out. And sometimes you cut too much out and you realize you made a mistake and then you can