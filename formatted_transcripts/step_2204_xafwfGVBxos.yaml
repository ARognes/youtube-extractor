ecause systems don't exist in a vacuum, you know, you will have agricultural systems that are very specific to how the agriculture industry works. You you will you will have if you're in the legal industry like it is based on whatever country you're operating in. If if you're in legal tech startup and health care, a health care startup looks very different in the US versus like the UK versus in Romania, etc. The people who are who are great system thinkers in one domain often are they just really understand the domain and you know, payments is one example where I worked in which is very interesting complex once once you get into it like people start to move around in it because you go there. So I wonder if it's there's there's there's abstract level system thinking, but there is also becoming a domain expert and somehow they kind of overlap as well cuz if you are a domain expert, you must understand the system of that domain. And maybe if you understand multiple domains, you can get better at abstract level system thinking as well. >> Yeah, no, I completely agree with that. And I think for me it's definitely hard to like quantify and articulate because it's very kind of like vague and I think you're definitely right though that like the the skills, the the hard skills, like the knowledge and like the details of like certain industries and things like that that definitely matters. But I I don't know. I guess like when I think about it, I think of it maybe you know people like this as well. Like there's certain engineers that are like they could go from one domain to another and you just trust them. Like that you just know from working with them they're smart. Like they think in a certain way where like they could go from payments to like some completely other industry, real estate or something. And there there will be like that learning curve for them. But some people for whatever reason they just learn faster, they just get it faster, they just perform better. And I