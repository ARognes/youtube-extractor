ust see that like nobody cares. Like, no user has mentioned anything about that to me. It's better now. >> So so yeah, so I I guess maybe to look at a bit better is is it's overall like better because it's cheaper, it's faster, and yeah, there is of course there's trade-offs. Like, within engineering there there is now a regression that crashes one of the servers, so you run an additional one. You have like replication if if you will. And it's still cheaper overall. So like, overall as as you package it, it's better than before. Boom. Like, it is kind of a obvious business decision. And like I guess in engineering like you there's a question like how perfectionist you need to go when a problem is already solved and is good enough. >> Yeah, that's right. I mentioned at the beginning that it like bothers me that you can't go super deep. And so even for this, it actually does bother me. But I guess I've gotten used to it in the sense of like prioritizing the business and just thinking about like the actual value, what do people care about, what's actually going to make a difference, like not just in the short term but also in the long term. >> Let's talk about this, the how like as especial especially as a founder but even as a software engineer like at some point you need to start to think about the business. But the interviews that people are taking with NEET code in order to get into big tech, you know, they you first you need to to jump the hoop of coding interviews. What do you think preparing for these data structures and algorithms coding interviews gives to people that is actually useful on the job? And I'm not talking about the algorithms but but but actual the other things that you you gain by by preparation. >> Yeah, I think so. From my perspective at least, I like went through this four-year degree. I I didn't cheat through it, so I made sure I understood like all the fundamentals and things like that. And then I got in Amazon, and then I I left and then so