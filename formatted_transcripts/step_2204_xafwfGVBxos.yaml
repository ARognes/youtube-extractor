ow he uses Claude Code. There's a lot of Boris. Like this is not just a tool that is like some by the corporate called Anthropic. No, it's it's actually Boris created it and he's working on it and he's fixing your bugs and you say like oh it had this bug and he reply he's in your mentions. And I I now notice OpenAI it's Codex used to be this thing built by OpenAI but now it's Tibo who is the the head of Codex and he replies and he does the same similar things as as Boris. So I I do wonder if this you know like the the personal angle where it's it's here oh and Claude Code is one of the biggest businesses in the software world in terms of revenue. I think they cost multiple billions. It's hard to track how much. So like it's a huge business tied to a person. >> Yeah, I hate the word influencer but it does seem like everything is going in the direction of like even for companies like they have to be a person now. Like they have to be a personality. They have to >> Approachable maybe? >> Yeah, yeah like approachable. >> Relatable? >> Yeah, relatable. Like a human, right? Like not just a corporate figure. Even for CEOs sometimes like you know it helps to sometimes it does. Sometimes it can backfire but I won't name any names but um Yeah, I think it's it's funny and I I I think even companies like some companies have that a lot. I think Meta you probably know more about this than I do but Meta has like internal like Facebook or something where it's like when you ship you have to like kind of >> yeah. >> Yeah, you have to like show it off. You have to like mention it. You have to like try to like brag about it. Yeah, exactly. Promote it. That's a skill. I didn't expect that I'd ever be you know an influencer or a YouTuber but it's a skill and I think it's something that everybody should lean in towards. Like not everybody has to do YouTube, but whether it's like LinkedIn or Twitter, I think it's worth, you know, putting yourself out there and slowly forming opinions and like interacting with people and things like that. >> Yeah, well, you said like maybe not everyone has to do it, but really it is you've had a pretty contentious hot take, which was some people should just give up on tech careers. Let's talk about like that. It's a pretty >> It's a >> big statement. >> It's a very strongly worded statement, and I definitely don't encourage people to give up. So, I I want to make that clear. The only reason I suggested that even in the title was that I think if you have an attitude of like you don't want to try hard, or you don't like you don't want to do things yourself, and you don't want to to dig deeper into things, like you need to do that. You need to do certain things. And if you're not willing to do that, I think you should know like what you're getting yourself into, cuz a lot of people don't know. Like they go through these college degrees, like they kind of just cheat their way through it, and then they expect to have a job at the end of it. And I think you have to evaluate that if you're going to be one of those people that does that, because it it might not be the best for you. People have unfortunately just gotten into the habit of doing it. But like when I made that video, I had a lot of people that were pissed off at me. But surprisingly, like the vast majority of people, they said that maybe I could have been a little nicer, and I think that's true. But they actually agreed with a lot of my points. A lot of people said that like you know what, you're right. Like I realized I was going too far in the direction of just prompting things. I got a lot worse at it. Like the products the things that I'm doing are worse now, and I'm not enjoying it as much. And it made me want to like refocus on like learning and being like the best that I can be. So, I think, you know, I'm not trying to offend anybody when I did that, but I think I saw nobody else talking about it, so I just felt like I had to do it. And I I recorded it on my laptop. I didn't think it was going to blow up the way that it did. I didn't think most people are going to see it. Um but yeah, I left that video up even though it maybe I took a reputation hit from that, I'm not sure, but I left that video up. >> Yeah, but I I think it it goes back to effort, right? Yeah. And as as advice, what would you advise for software engineers, uh early career, mid career, maybe even later, who are either working at a company and they they just want to be seen as this awesome engineer when you think of like the standard engineers that you work with either at Google or or the people who you know, or they're working at a at a startup. Uh what do you think it takes today to actually increasingly stand out from a from a crowded space uh to have your your work speak for itself? What does that mean? >> Yeah, I think it's a really really good question. I think there probably is some like general advice that would apply to like most cases. I don't know if I can think of that. So, what I'm going to say is I think like you said, like the effort matters. Like even in an interview setting, knowing your audience. It's not like you're not just like living in your own head taking like this standardized test. You're talking to somebody. You're seeing how they're reacting to what you're saying. Like maybe they're not on the same page. Like there's certain shortcuts you can't take. Like if you're in a team, you're at a company, know the people around you. Know what they care about. Ask them questions. Have meetings with them. Don't just make assumptions if you like if you don't have to. Um like I talked to them, figure out what's important, get a sense of things, and then go very hard in the direction that you think is correct. Maybe you'll have to recalibrate things. Maybe you'll go too far. Maybe you'll make some mistakes. But I think it's just kind of like that iterative process of like that feedback loop of like, okay, figure out what you're supposed to be doing, and then work very intensely to do that, and then just keep doing that. It requires a lot of changing. It requires a lot of like course correction. And that's difficult. Nobody wants to do that. Like one thing I always did uh with my manager, I always asked them, like if you have feedback for me, please tell me. Like, I will not get offended. I want to know. I want to know like what I could be doing better. And the way my like all my managers ever reacted to that is they were very surprised. They're like, well, first of all, if you just joined the company you're asking this, like, that's a very good question to be asking because like that tells me that you actually care and you actually want to get ahead. So, I I I think like that aspect of it and that matters a lot cuz then people know you're on the same page. Like, they kind of know about you. They they don't have to guess what you're thinking in your head. You're you're kind of like communicating that with people. >> Yeah, so I I tried to like I I felt coming through our conversation is is we just keep coming back to it is is effort effort. Like like and and don't take the shortcuts. I mean, take the shortcuts when you have like a business outcome, especially when you're building your business or or you you have a goal that you're going to achieve, but otherwise just put in the work. >> It it sounds simple. It sounds really easy on paper, but it's hard to like put into practice. Like, sometimes, especially for me, I am not a person that likes change, actually. Like, I am very resistant to change. I hate change. It takes me years to change. But >> You still have Angular on your website? >> Yeah. But um but it's so important and it's so worthwhile when you actually do it. And I think it just matters a lot and it's like it becomes a way of life. Like, you start like I put in a lot of effort on the coding side and then in professional life I realized, okay, like the soft skills matter a lot. Took me a long time to learn them. I'm still learning them to this day, but that's the reason why I probably got promoted. That's the reason why like my team liked me. And it's important to be likable. Like, you don't want to be hated. >> And as closing, what are places that you get inspirations from? This could be books, this could be videos, this could be YouTube channels. >> Yeah, I think you just had Martin Fowler on. I'm a huge fan of him, huge fan of his book because he goes deep. And even like as deep as he goes, then you'll have a hundred references at the end of every chapter. And I just love that because I'm the type of person like I just always have a follow-up question. I always want to go a little bit deeper to understand things. And so, seeing people like him, like I relate more to like scientists, people like PhDs, researchers more than I do to engineers. So, I just really like that. I think it's important to have people that you can like look up to and aspire to be like. And I think there's there's plenty of people I take inspiration from, including other YouTubers, uh including technical people, including people I've worked with in the past. And I always I always look at a person and I I try to see like qualities about them that I really like and then I try to like replicate them and imitate them as well. Neat. It was awesome to have you here, especially in person. >> Yeah, it was great. Great meeting you. >> I'm glad we finally got to record this episode with Neat. I love how honest he is and I hope this came across as well. I found it interesting how Neat hires these days. >> [music] >> He runs one of the biggest coding preparation sites and then he hires for skills outside of coding. He cares about motivation, whether the person can explain their own thinking, and most importantly, for agency [music] or for getting things done. It was also nice to talk with him about how he believes that companies have no idea how to evaluate candidates and they probably never did. The LeetCode style interview survived not because it predicts job performance, it just doesn't, but because nobody has found anything better that scales. And finally, [music] I appreciated Neat's observation that the effort is becoming a differentiator exactly because AI has made everything else cheap. Anyone can prompt a design, a feature, or an answer, but what you cannot prompt is caring and your ability to defend your choices when someone asks, "Why did you do it this way?" Do check out the show notes below for the related Pragmatic Engineer deep dives that go even deeper into tech interview related topics. If you've enjoyed this podcast, please [music] do subscribe in your favorite podcast platform and on YouTube. A special thank you if you also leave a rating on the show. Thanks and see you in the next one.
