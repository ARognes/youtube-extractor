nk like in startups the term is agency. Like somebody who's high agency who's just going to get things done, who's never going to like say no to something. I think like that attitude is really important of like okay, if I don't know something, I'll just learn it. Like I'm not going to say like that's not my job or I'm not going to like dig deep into that. Like anytime I give this person a task, even if they have no idea like how to start it, like a week later they'll have like they'll have learned like everything about it. It's like a completely new domain to them. They just like learn everything. And I think like those types of personality traits, it's hard to describe that. Maybe like agency is the the best term for it, but I think that matters the most because any information that you need at this point, you can kind of just prompt, right? Like Okay, like I have like this programming specific question. You can just You can just get it out of a prompt if you know the questions to ask. And knowing the questions to ask is just a matter of like I think putting in the effort. >> Yeah, so I like agency. I'm also sensing you didn't mention it, but it's like energy, focus, wanting to solve something specific. And this is something interesting. I I I've been talking to a few of people who are building startups right now. Obviously, a lot of them are to do with AI or like they're building AI infra, and how they're struggling to find that product market fit. Even though, you know, they can build faster than ever, but it has not gotten any faster to get teams to adopt, and simple things start to matter. For example, talking to a potential customer in person, like going to a tech meetup, living in a tech hub or where you can go more regularly, getting feedback, getting your first customer inside of a big company. And none of these have to do with the the code itself. And of course, they created something that they think is cool and innovative and different, but there's now so