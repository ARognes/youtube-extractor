transcript: What's next, Greg? Any expansion plans for the Pragmatic Engineer? >> Yes, an interesting thing is if this was a VC-funded company and I took VC funding, I would have to expand, but I don't. The only plan I have is I would like to make the Pragmatic Summit more regular. There was one in February in San Francisco. There will be one in the beginning of the year also in San Francisco, and I'd like to get to a point where I can have one in Europe [music] as well. And I'd like to be able to do this on a more regular basis. And also, I'm growing my team very slowly. We now have a small team, so I'm just figuring out ways that I can [music] have folks involved and help with even more ambitious research. I'd love to do even going deeper. I have so many ideas of companies to research, industries to research. Sometimes some boring industries. Like at some point, I'd love to go into a utilities company and go through like how they build software. It sounds very boring, but it's very darn important. [music]
