transcript: for the first four years of my programming experience I didn't have a mentor I programmed by myself and this included creating my own video over the Internet algorithm I even have enough space on the device for TCP IP but there's something I learned that's really important look at your old code is it bad why what would you change and why does it make it better if you can answer those questions you know you are improving the reality is if you don't think your past code is that bad you're probably not growing and after those four years when I finally got my first job I went and looked at other people's code and realized the most important thing ever everybody writes terrible code
