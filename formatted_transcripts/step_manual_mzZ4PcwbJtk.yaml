transcript: '{"content":"\n[0.0s] Here''s a loaded question. Do we have\n[2.72s] free will? Or instead, is everything in\n[5.52s] our lives in some sense out of our\n[7.919s] control? Many of us feel trapped between\n[11.759s] two untenable extremes. First, we might\n[15.28s] feel like helpless puppets. Feeling that\n[18.32s] our genetics, our upbringing, our brain\n[21.76s] chemistry, and everything that has\n[24.16s] occurred in our past determines\n[26.56s] everything that happens to us and\n[28.4s] therefore everything that we do. We''re\n[31.199s] just kind of going along for the ride.\n[34.88s] And if that''s the way things are, how\n[38.0s] can we or anybody be responsible for our\n[40.879s] lives?\n[42.96s] Second, we might feel the burden of what\n[45.84s] we might term absolute freedom. This on\n[49.28s] the other hand is the feeling that or or\n[51.28s] even the conviction that we have a kind\n[53.76s] of magical unlimited freedom to do\n[56.559s] anything at all even given all of our\n[59.44s] past causes and conditions.\n[62.32s] This on the other hand can lead to an\n[64.479s] intensely personal feeling of\n[66.96s] responsibility for any failures we might\n[70.0s] have. a kind of heightened anxiety that\n[73.439s] we alone are to blame when we\n[75.76s] underperform.\n[77.6s] Or alternately, we might gain from this\n[80.88s] kind of view a grander sense of ego when\n[83.84s] we managed to to succeed. Uh the\n[87.439s] individualism of I did it all by myself.\n[91.84s] Now, the Buddha faced a very similar\n[93.92s] debate 2500 years ago. And his response\n[99.28s] involved what we might call a kind of\n[101.28s] middle way between these two extremes of\n[105.84s] egoistic helplessness and anxiety that\n[109.28s] is now being echoed by modern\n[111.439s] philosophers and neuroscientists.\n[115.2s] The first extreme goes by many names\n[117.759s] including determinism, fatalism and so\n[120.64s] on. It''s basically the idea that we have\n[124.159s] no real agency in the world. were simply\n[127.52s] carried along by the way things happen.\n[131.52s] This view is very similar to that of the\n[133.52s] Buddha''s competitor Macalli Gossala who\n[137.28s] is represented in the early texts as\n[140.08s] arguing one does not act of one''s own\n[143.36s] valition. One does not act of another''s\n[146.16s] valition. One does not act from a\n[149.28s] person''s valition.\n[151.76s] There''s no power, no energy, no human\n[155.12s] strength or vigor. All sentient beings,\n[158.64s] all living creatures, all beings, all\n[161.599s] souls lack control, power, and energy.\n[165.599s] Molded by destiny, by circumstance, and\n[168.72s] nature, they experience pleasure and\n[171.519s] pain in the six classes of rebirth.\n[175.76s] Gossal argues from this that there is no\n[178.64s] particular practice that we can\n[180.16s] undertake to change our fate. That is,\n[184.4s] we''re allotted a particular measure of\n[187.36s] pleasure and pain. And there''s really\n[189.68s] nothing we can do to get out of that\n[191.84s] allotment.\n[193.44s] Therefore, for Gossal, there''s no real\n[196.4s] sense to be made of distinguishing\n[198.8s] between the things that we supposedly\n[201.12s] should or should not be doing.\n[204.4s] All that we do, we do by necessity.\n[208.8s] The Buddha, on the other hand, argues\n[210.72s] that since those who follow this kind of\n[214.159s] view don''t actually find that there are\n[216.959s] things they should that that should and\n[219.2s] should not be done, they''re unmindful\n[222.56s] and careless and can''t rightly be called\n[225.76s] aesthetics.\n[228.56s] That is such a view, the view of Macau\n[231.36s] Gossala leads to a lack of effort on the\n[234.56s] part of its believers.\n[236.959s] The second extreme that we talked about\n[240.159s] also goes by many names. In philosophy,\n[243.439s] it''s known as libertarian free will.\n[246.72s] This notion that there is some core part\n[250.08s] or essence to our being that''s somehow\n[253.12s] completely untouched by causes and\n[255.76s] conditions and which therefore can act\n[258.32s] with perfect spontaneity making itself\n[261.759s] as it wishes.\n[264.08s] The Buddha rejects a view like this in\n[266.8s] his famous second sermon on non-self\n[271.28s] where he argues that there is no part of\n[273.84s] our self or our experience over which we\n[277.04s] have perfect control.\n[280.479s] All things that we do depend on causes\n[283.12s] and conditions. This is why all\n[285.759s] conditioned things are duka or\n[288.24s] unsatisfactory.\n[289.84s] If we had the power to make things truly\n[292.479s] as we wished, we would never experience\n[295.36s] suffering. We''d be able to determine the\n[298.08s] nature of our own consciousness, of our\n[300.96s] course of action immediately.\n[304.0s] And yet, who among us has perfect\n[307.12s] control even over their own will?\n[311.199s] We know that we shouldn''t eat the cake,\n[313.28s] but here we are eating it. We spend much\n[316.72s] of our lives looking back with regret on\n[320.0s] choices that we made while knowing that\n[322.16s] those choices were unwise.\n[325.6s] So, as we''ve seen, the first extreme\n[328.72s] leads to a kind of inaction and despair\n[331.44s] on the part of its believers. The second\n[334.32s] extreme involves a kind of blindness as\n[337.52s] to how our minds and bodies really\n[340.0s] function.\n[342.24s] What did the Buddha suggest as an\n[344.56s] alternative to these two unpromising\n[347.039s] views? To begin with, the Buddha firmly\n[350.639s] believed in the workings of karma. Now,\n[354.32s] karma can be understood in many ways. It\n[357.44s] can be, for example, understood in a\n[359.199s] somewhat supernatural way as leading to\n[361.6s] our destinations in future lifetimes,\n[364.4s] for instance.\n[365.919s] But as I''ve argued in several several of\n[368.0s] my prior videos, I''ll have links to\n[369.68s] those down below. First and foremost,\n[373.12s] karma is a doctrine that certain things\n[375.84s] we do reliably lead to our future\n[378.72s] benefit and the benefit of those around\n[381.12s] us. While other things that we do\n[384.16s] reliably lead to our future suffering\n[387.039s] and indeed the suffering of those around\n[389.36s] us as well. sp understood in this way.\n[394.4s] The Buddhist idea of karma is a very\n[396.4s] practical down-to-earth philosophy that\n[399.36s] there are things that we should and\n[401.44s] should not do for our benefit and the\n[404.319s] benefit of people around us. And what is\n[407.68s] the actual essence of this karma? The\n[410.88s] Buddha famously said, \"It is intention\n[414.16s] that I call karma.\"\n[417.12s] That is karma. This apparently weird\n[420.0s] ability that we have to affect the\n[422.319s] future resides simply in our own\n[425.36s] intention.\n[427.44s] For the Buddha says, having intended,\n[430.319s] one acts by way of body, speech and\n[433.68s] mind.\n[435.44s] But that intention itself does not\n[438.0s] spring from nowhere.\n[440.4s] And where is the source of karma?\n[443.36s] Contact is its source. As the Buddha\n[445.759s] says,\n[447.599s] that is our karma, our intention\n[451.199s] has its source in prior contacts that we\n[454.96s] had with the world.\n[457.52s] Those contacts then flow through our\n[460.08s] intention to our bodily, verbal, and\n[462.96s] mental actions.\n[464.88s] Say we''re hungry and we see some food\n[467.44s] that we have contact, visual contact\n[470.16s] with the food. This then leads to a\n[472.88s] bodily action to go and get dinner for\n[475.599s] example.\n[477.52s] This is the early Buddhist view of the\n[479.68s] will. It''s not a kind of metaphysical\n[482.96s] soul entity that originates everything,\n[487.039s] but it''s instead the sort of\n[488.639s] psychological event of intention that\n[491.36s] happens right here and now.\n[494.24s] In other words, your will is not a kind\n[496.96s] of thing that you possess, but instead a\n[500.4s] kind of process that you participate in.\n[504.479s] This reframing\n[506.56s] shifts the focus from an unanswerable\n[509.44s] kind of cosmic question, do I have free\n[512.719s] will to a more practical and immediate\n[515.919s] one that is, what are my intentions\n[518.719s] right now? And are they truly skillful?\n[522.719s] Contemporary\n[525.2s] scholars such as Asaf Federman have\n[527.839s] recently argued that the Buddha\n[529.68s] essentially taught what might be\n[531.44s] understood as a form of compatibilism.\n[534.959s] This is the idea that radical causal\n[538.08s] conditioning is compatible with that is\n[540.8s] to say can coexist with freedom.\n[545.279s] Federman points out that the Buddha\n[547.12s] rejected the upupananishadic ideas of a\n[551.44s] transcendent soul that is an atman\n[555.04s] or inner controller as it''s called in\n[557.519s] the upanishads that stands outside of\n[560.72s] causes and effects and basically pulls\n[563.279s] the strings of what we do.\n[566.32s] This ancient idea of the inner\n[569.279s] controller is strikingly similar to\n[572.32s] modern philosopher Daniel Dennett''s\n[574.56s] critique of the so-called what he calls\n[576.88s] the cartisian theater. This is the idea\n[580.08s] that our quote unquote free choices\n[583.68s] are essentially made by a kind of little\n[586.24s] person, a a ghost in the machine that\n[589.279s] sits inside of our heads watching the\n[591.2s] movie of our lives.\n[594.0s] But really, true freedom is not about\n[596.72s] being outside of causes and conditions.\n[599.92s] That would only leave us blind and out\n[602.0s] of touch. Instead, true freedom is about\n[605.92s] being able to respond to causes\n[608.16s] skillfully with wisdom.\n[611.279s] It''s the trained ability to pause, to\n[614.88s] reflect, and to shape our intentions\n[617.68s] based upon our prior understanding of\n[620.16s] the way things are. This on the other\n[622.8s] hand is a tree is a freedom that''s truly\n[625.519s] worth wanting.\n[629.519s] So if our will like indeed all things is\n[633.279s] conditioned, how can we be free? Well,\n[636.72s] by changing the conditions.\n[639.12s] This is what we do through our practice.\n[642.64s] For example, we can take a jazz\n[644.56s] musician.\n[646.079s] They''re not free simply because they can\n[648.399s] play any random note. They''re free\n[651.519s] because they''ve practiced such things as\n[654.16s] scales and tunes from many different uh\n[658.079s] uh songs intensively over many years.\n[662.079s] They''ve learned these rules, these\n[664.079s] conditions so well that they can now\n[668.0s] improvise beautifully from within that\n[670.56s] structure.\n[672.48s] Within Buddhism, these scales, these\n[675.36s] tunes that we''ve learned, that is our\n[677.519s] practice is, we might say, the\n[680.079s] eight-fold path itself.\n[683.04s] In a similar vein, a sailor cannot\n[686.0s] control the wind, but they can learn how\n[689.68s] to skillfully adjust the sails to\n[692.0s] navigate the boat where they want it to\n[694.079s] go given how the wind is blowing.\n[698.0s] Just so, we cannot control our\n[700.56s] conditions. However, through practice,\n[703.519s] we can learn to adjust our intentions so\n[707.04s] that we aim towards our benefit and the\n[710.0s] benefit of all who surround us.\n[713.44s] The Buddhist path is a training program\n[716.0s] for our intentions.\n[718.56s] This indeed is is mindfulness practice.\n[722.079s] We watch the wind that is our thoughts,\n[725.279s] feelings and external conditions\n[728.48s] so that we can set our internal sails\n[731.36s] more wisely.\n[734.639s] The ultimate goal here is not to prove\n[737.76s] some philosophical point or other. That\n[740.959s] was never the Buddha''s aim. Instead, his\n[744.639s] aim was to alleviate suffering and\n[747.68s] experience what he called the taste of\n[750.399s] freedom.\n[751.76s] As he says, the ocean has just one\n[754.88s] taste, the taste of salt. In the same\n[757.92s] way, this teaching and training has one\n[761.2s] taste, the taste of freedom.\n[764.8s] This freedom that the Buddha talks about\n[767.44s] is the felt experience of being released\n[770.88s] from the compulsive grip of greed, of\n[774.399s] hatred, and of delusion. It''s being\n[777.279s] released from the craving for that which\n[780.0s] we cannot have and the aversion towards\n[783.68s] what towards what we cannot escape.\n[787.279s] It''s true contentment, a peace that does\n[789.92s] not depend on our getting everything\n[792.24s] that we might think we want.\n[795.36s] And this freedom begins simply with the\n[799.68s] quiet intention to act with kindness\n[802.32s] instead of anger, with generosity\n[805.12s] instead of greed.\n[807.279s] Now the Buddha''s message therefore is\n[809.2s] profoundly optimistic\n[811.6s] but realistic at the same time. We are\n[815.6s] not helpless puppets of fate.\n[819.04s] Every moment holds the potential for a\n[822.079s] skillful intention that can change the\n[824.56s] course of our lives.\n[827.2s] Freedom, therefore, is not something\n[828.88s] that we have or possess.\n[831.839s] Instead, it''s something that we\n[833.04s] cultivate one moment, one intention at a\n[836.399s] time.\n[837.92s] So, my question for you is, what\n[840.32s] intention are you going to try to\n[842.24s] cultivate right here and right now? Let\n[845.199s] us know in the comments below.\n[847.92s] And if freedom is something that you\n[850.32s] cultivate, that you truly do cultivate\n[853.04s] through practice, what is that practice?\n[857.519s] Well, the Buddha''s most famous answer to\n[860.16s] that question is the noble eight-fold\n[863.12s] path. That is the path that we\n[865.279s] cultivate, the training manual for\n[868.24s] developing this skill of freedom. And to\n[871.839s] dive into that path, I recommend that\n[873.92s] you watch my playlist on the eight-fold\n[876.24s] path next. I''ve got a a link to it right\n[878.959s] here up here on the screen. And we''ll\n[881.279s] see you right right there afterwards.\n[883.279s] Um, if you''re getting something out of\n[884.639s] these videos of mine, consider taking a\n[886.959s] look at my Patreon page, which is linked\n[889.279s] up here on the screen and down below in\n[890.88s] the notes, and see if you want to help\n[892.88s] support the channel and the work that\n[894.24s] I''m doing. Thanks so much, and we''ll\n[896.32s] catch you on the next video. And\n[897.839s] meanwhile all of you be"}'
