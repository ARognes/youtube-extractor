transcript: hey everyone cohorts three of the visual thinking Workshop concluded yesterday and this gave me an opportunity to reflect on my visual thinking workflow and think about reasons why you might want to consider cohort for and as I was thinking about this this image of a crazing animal ruminating came to mind and I thought that this was a particularly good parallel to how the visual thinking workflow works I'm not going to make this into the biology class also I couldn't because I learned biology about 35 years ago that's what I'm living from even today in terms of knowledge my understanding is that the plants that cows eat is really hard to digest and that's why they have this neat digestive system where they first eat the grass it goes into their first belly there it's pre-processed by enzymes and bacteria and then they regurgitate this pre-processed food they chew on it this is called rumination and then they're able to digest the food completely and I thought that this was very similar to my process of reading a book importing it into obsidian then using various visual tools to look at the material put together the book on a page so that in the end I'm able to embed the knowledge that I've taken from the book into my permanent notes and into various materials that I publish on the internet and today we live in a world where eating disorder is a thing and and I also think it's not only eating disorder from a biological sense but also an eating disorder from an information overload sense they are simply bombarded with information every day and this makes it extremely hard to properly digest the information that we consume so the visual thinking Workshop goes through this six week process of reading a book and then processing that book creating a book on a page and then creating permanent notes and presenting the material and this process of rumination is the heart of this process what strikes me is when I look at the Cow as it ruminates and let me start this video here I think pay attention to what you're seeing here and for me the key thing that you're seeing here is that this cow is not running around it's quietly sitting there for hours and just choose slowly choose the choose on the food and and I think this is a very good parallel to how we should be processing information we should take in the information and give it time to settle in we should create a space for processing this information and for me drawing Atomic visuals in excellent Rock creating links in obsidian is this process of rumination and I think this is the antithesis of today's productivity fetish I think people think that if they can do things fast if they are productive if they're efficient if they're able to speed read if they can achieve more tasks in a shorter amount of time they're going to create more value and frankly I think this idea is false as later on I'm going to talk about this also in the context of the book that we read I think this is actually productivity is almost like a semantic stop sign in our thinking that we think that productivity is so important that we do not ask so why productivity and why do we think that it is so good so I want to just bring this thought in here that yes this workflow here looks long and complicated however I think rumination requires time and processing requires time so in the workshop we were reading a pretty difficult book it's rationality by Eliezer yutkovsky right in the beginning so this was a very difficult book right in the beginning I had real trouble understanding it was full of words I don't understand it was presenting Concepts and ideas that for me the language the approach of Eliezer was very foreign to understand what I'm reading I decided right during reading chapter one for the second or third time that I'm going to create a concept map and this concept map really helped me hugely in understanding what the book is about I'm not going to go into the content of the concept map it is about the definition of rationality and the distinction between epistemic rationality and instrumental rationality if you want to take a look at this how you can always stop the video here and look at this concept map but I just want to show you how already during the first chapter of the book creating a visual representation of that chapter helped me greatly in understanding the rest of the book and understanding the concepts that I was reading so as my first step in the process so this is after reading the book I used read wise to import my clippings from the book into obsidian and my first activity was to do the literature note highlights so I'm following the process of progressive summarization by Thiago Forte and this is the first pass going through the material you do your literature highlights so you can see my literature highlights right here so this is I'm not going to scroll through but this these are my literature notes with the highlights as I was doing the literature highlights my process is to create Atomic visuals for each of the chapters and this is also this process of rumination and rechewing the material by creating simple visuals I can look at the material from a different angle and this way for each of the chapters or many of the chapters I created similar simple visuals that this explained what's in that chapter so in this case the visual is about the reasons for seeking truth which could be out of curiosity it could be out of utility because you want to achieve a goal or it could be out of nobility because you think that you ought to be searching for the truth this is what others are expecting from you after having done my highlights and added some of these visuals I still wanted to get some external help in processing the material because this was really a tough book at least for me to understand so this time around I went and used chat GPT to help me with the process the good thing about this book is is actually available online the book is a collection of blog posts by Eliezer in the form of a book so you can find much of the text on last wrong so I took the text from less wrong and I asked chai GPT to do three things for me to Summarize each of the chapters into two sentences then recommend three simple icons SVG icons and generate an image prompt that I can feed in to a stable diffusion algorithm I'm using mid-journey and then I provided the text from the chapter and I did this with each of the chapters so this time I could avoid chai GPT hallucinating because I provided the text from the chapter that I copied from Les strong and chapter by chapter I created this pre-processed summary and then taking this summary I created this note in obsidian where I simply took each of the chapter titles use the image prompt recommended by jgbt fed it into mid-journey I also created some preference settings in my journey so the images look similar so I selected couple of artists and color scheme so in the end these images follow a similar look and feel so you can see that these images sort of look similar and as I went through this process at a later step those images where you see they have a white border those I imported into excalator and added a bit of text around them to represent the idea they reflect and so this way I went through the book and you can see that in some cases I added text in other cases not but so this was my next step in terms of creating generated images or visuals for the book and from here I also created a summary I took the summaries by China GPT and I rewrote those summaries to some extent and I still had my mid-journey generated images right here but also I created this map of the book that helped me understand what's going on so in this case you can see I took the chapter titles from the book and I organized it into sort of a flowchart story to make sense of what's happening I can see that I start with the question of why truth and then the definition of what rationality means and then I go into this process of our special feature as humans is that we have lens that sees its own flaws we are able to spot issues or errors in our thinking so this is where the whole discussion about biases and fake beliefs and evidence comes into the picture and there are also some blockers to this process such as the semantics stop signs and using science as a curiosity stopper I'm going to talk about these a bit later creating this summary helped me really conceptualize the logic of what Eleazar was covering in these 45 chapters that are part of book one rationality and from here I did two things one I created a book on a page so this is my book on a page for this book and I'm going to dive in to the book on a page and walk you through the book on a page at the end of this video so I don't bore you with it if you don't want to watch my summary but so this is the book on a page at a glance that I created as well as I stored important notes in my permanent notes in obsidian and so you can see here that for example I created a number of permanent notes about the different biases covered and so the way this looks is I have so these are all just embedded items so here in this case so this is the availability bias in my central custom folder and this is just the idea section of it so I can show you how this all looks but you can see here that I have couple of biases as permanent notes I have the availability bias I have the conjunction fallacy as well as the illusion of transparency when you feel that you've explained something but the other side really doesn't understand what you've explained as well as the planning fallacy which is this fallacy that we systematically underestimate the amount of time required to get anything done as well as the confirmation bias which is about looking for evidence that supports our thinking instead of looking for evidence that would disconfirm our thinking these were some of the permanent notes that I took away from the book and as the end of the process I actually created a couple of summary notes so these were the key takeaways for me from the book and when we go through the book on a page summary at the end I will dive slightly deeper into these first of all that neutrality is a definite judgment I absolutely hate to think about politics and I feel I'm neutral in the process but actually by not taking sides I am automatically taking a side and so that was an interesting thing that I still need to think about how what I'm going to do with it I noticed that we use the word productivity on Twitter and on the internet pretty much everywhere as an Applause sign so productivity is a sacred word that we need to say and then people are going to be happy and they're going to click on the video they're going to read the post and everyone is after productivity without really understanding what's behind it or why this idea of floating beliefs was very interesting so floating beliefs are the belief systems that we believe just because so we cannot really ground those beliefs there are some stop signs when we stop asking further questions and these are the semantics stop signs and then there's this point about how you can use evidence which I think is super interesting I never thought of it this way that you can always seek evidence to test a theory but you can never confirm it so confirmation and knowing that in all the tests so far it didn't fail is two different things and then finally using scientific words without understanding it is a bit like believing in Magic because you use the word that it is because of this and this scientific fact you really have no idea why it is you don't understand it but still you appear to be intelligent by using the word greenhouse gas emissions in a sentence even though you really have no idea what that means and how it works together I could look for a less controversial topic as well but I hope you get the idea so if you want to improve your digestive system system I 