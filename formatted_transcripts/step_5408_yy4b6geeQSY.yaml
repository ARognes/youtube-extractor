ment but in today's world with all the tools we have in terms of validating statements this type of experimentation is no longer part of mainstream religion so these were about fake beliefs and then where the discussion goes on to is so how can you fight fake beliefs and biases you can fight it by looking for evidence so if we talk about evidence this is a super interesting thought here that evidence is an event that is linked by cause and effect to the thing you want to know about so here the example you see is how do you know that your shoes are untied well there are photons coming from the Sun that will be that will bounce off from your shoelaces which will hit your retina and then through neurons it will go to your visual cortex where you will form the idea that my shoelaces are untied so there is no real immediate connection between the event that you're thinking about and your thought about it but there's this long chain and effect of cause and effect that leads you to think that your shoelaces are untied there are four different types of evidences actually Eliezer mentions three and then later on he mentions historical evidence because he argues that the historical evidence is similar to how your shoelaces are registered only the cause and effect chain is different because it is not that physical round but it's more the historical round but still historical evidence can be interesting anyway there's rational evidence which is based on probabilities there's historical evidence there's legal evidence that of course follows the court rules and then there's scientific evidence which must be reproducible and so here there are two different big topics that we are going to look at first about evaluating evidence and here the core message is you should always prefer the simplest act explanation that fits the facts also always keep your eyes open to notice when your model does not fit the data always look for this confirming data as you're doing experiments and so the