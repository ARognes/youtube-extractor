ust regurgitating words that you were thought or that you heard in the news science is a curiosity stopper is the process then just because someone has already understood it and wrote it down your curiosity stops at that point Eliezer Advocates that we should further investigate topics to make sure that we have our own deep understanding of them and don't stop with the statement that oh someone explained it already so I'm no longer interested I know how it works semantic stop signs or words where the discussion stops these are words like God or democracy where if you author these words there is really no point in further asking challenging questions these are the points where we should really not go and ask further of course this is not good practice we should ask questions because otherwise we are blocking critical thinking and then reciting versus understanding and this is what is conveyed by our school systems that instead of children learning effectively how something works and internalizing and understanding they're trying to learn the words that the teacher is looking for liaiser calls this guessing the teacher's password so guessing words and trying to unders trying to get a good grade not by understanding the topic but by guessing the right words and then finally there are not many tools in the book that would support instrumental rationality meaning systematically achieving your goals there's one however that's mentioned and this is about this example with cards so the story is and just think about it for a moment or there's a deck of cards with red and blue cards you need to guess what color the next chord is going to be after a time you start to sense that there are about two-thirds of red cards and one third of blue cards in the deck and so the question is what's the right strategy what should you be guessing how should you be guessing the cards to get the highest number of wins I.E the highest probability of guessing the right card so think about this f