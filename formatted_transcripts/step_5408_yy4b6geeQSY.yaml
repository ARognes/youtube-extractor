e that's produced by the shape of our mental Machinery so typically even if you know about your biases it is going to be extremely hard to correct them because you will still naturally do it because that's the way you're built so let's look at some of these biases first of all the illusion of transparency when you feel that you've explained yourself perfectly and the other party has no clue what you mentioned the availability bias is about giving things that occurred in the near past a higher ranking in this case what you see on picture is the is a flood and typically people will not make flood insurance if they're in a flood zone but the flood not has happened for the last 10 20 years because it's not active in their memory but if there was a flood recently then people are going to create or are going to sign insurances for that so we need to make sure that the wavy rank the different risks reflects their true likelihood and not influenced by the recency effect and the conjunction fallacy I already mentioned so putting two events together will make it feel more probable so you will feel that John is an accountant who wears glasses has a higher probability than Jon is an accountant because for some reason the connect the idea of accountants with varying classes because they're watching numbers on the screen every day but in reality these are two independent variables and actually the likelihood of John being an accountant and wearing glasses is of course lower than John being just an accountant or just wearing glasses the planning fallacy which is about our systematic underestimation of problems and the overall timeline and the way we can help on this is to take an outside View and look at a similar project that we've done in the past look at how long it took and how much it cost and use that for our planning and we're going to get a much better estimate than if we do a bottom-up plan so these were the biases and then the other type of issues that we might face are 