transcript: you may think learning one programming language is enough but in reality you should probably be learning multiple different programming languages and there's four main reasons why the first obvious reason is it makes it much easier to get a job if you know two programming languages now you can apply to twice as many jobs and there's many jobs that actually require you to know multiple different programming languages one for the back end one for the front end and so on another huge benefit is that now you can see multiple different ways to do the same thing for example rust and typescript are going to do the exact same thing in different ways so now you can see both of these different approach es to solve the same problem and you can use them inside of whatever programming language you use so you can take rust specific things and incorporate them into your typescript programming this is why we have object-oriented and functional programming languages so you can really kind of play around with both of these in different languages if you know how they both work different programming languages also excel at different things Russ is a much faster lower level language than typescript but typescript is something that's much easier to use in the web so you can use these different languages for their specific benefits and learning multiple languages actually can help you with getting over for Burnout because if you're just constantly in JavaScript and typescript over and over and over again forever you can get burnt out on JavaScript but if you now have rust or PHP to fall back on you can say on a little burnout on JavaScript I'm going to go do some Rust work and that can reinvigorate your passion for programming now there's a ton of other benefits as well but if you're really looking forward to actually learning a second language I highly recommend checking out my full video on how to learn a second language it'll be linked right at the bottom of the screen
